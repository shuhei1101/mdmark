# PoC（#555）: GitHub Actions の OIDC トークンを Marketplace のセッショントークンに交換できるかだけを確かめる。公開はしない
name: vscode-release

on:
  push:
    branches:
      - "poc/vscode/marketplace-oidc"
    tags:
      - "poc-oidc-exchange"

permissions:
  contents: read
  id-token: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 依存を入れる
        run: npm --prefix vscode ci --ignore-scripts
      - name: vsce のバージョンを出す
        run: node -p "require('./vscode/node_modules/@vscode/vsce/package.json').version"
      - name: OIDC トークンを Marketplace のトークンに交換する
        run: |
          node -e "
          require('./vscode/node_modules/@vscode/vsce/out/oidc.js')
            .getOIDCCredential('ShuheiNishikawa')
            .then(c => console.log('Marketplace credential issued, length=' + c.length))
            .catch(e => { console.error(e.message); process.exit(1); });
          "
