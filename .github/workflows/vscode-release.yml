# vscode-v* のタグで拡張機能の .vsix を作り、そのタグの GitHub Release に添えて、Visual Studio Marketplace へ公開する
name: vscode-release

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write
  # Marketplace の trusted publishing（vsce publish --oidc）で OIDC トークンを取る
  id-token: write

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # タグのバージョンと package.json の version が合わなければ、ここで止める
      - name: タグと version を照合する
        run: npm --prefix vscode run release:check -- "${GITHUB_REF_NAME}"
      # 拡張機能のビルドはリポジトリの直下の src/ を読み込むため、直下の依存も入れる
      - name: 依存を入れる
        run: |
          npm ci
          npm --prefix vscode ci
      - name: .vsix を作る
        run: npm --prefix vscode run package
      - name: Release に添える
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" vscode/mdmark-*.vsix --clobber
      # Marketplace に同じバージョンが公開済みのときは vsce が already exists. で止める（--skip-duplicate は付けない）
      - name: Marketplace へ公開する
        run: npm --prefix vscode exec -- vsce publish --oidc --packagePath "vscode/mdmark-${GITHUB_REF_NAME#vscode-v}.vsix"
