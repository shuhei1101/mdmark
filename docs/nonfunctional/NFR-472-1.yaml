id: NFR-472-1
visibility: internal
title: 非機能要件
requirements:
  - id: NFR-1
    name: 配布ファイル 1 つのサイズ
    english_name: dist_file_size
    category: 性能
    external_constraint: jsDelivr の GitHub エンドポイントは 1 ファイル 20MB までを配る
    source_kind: 実行基盤の制限
    source: https://github.com/jsdelivr/jsdelivr#restrictions
    value: '712'
    unit: KB 以下（729088 バイト）
    rationale: "外部の上限は 20MB。利用側のページが開くたびに読み込むため、まとめた後の実測から目標を配置する。まとめた dist/index.js は 711,423 バイト（2026-11-19）だった。超える作業は、その作業が実測を添えて上げる。\n\n検証に使用する ajv は dist/cli.js とプラグインにだけまとめ、dist/index.js には入れない。"
    overflow: ビルドの後に配布ファイルのサイズを数え、超えていればビルドを失敗させる。確認する時点はビルドの直後で、バージョンのタグを打つ前。
  - id: NFR-2
    name: 対応ブラウザ
    english_name: supported_browsers
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: Chrome 99 以降・Firefox 98 以降・Safari 16.4 以降（このバージョンをビルドの target に記載する）
    rationale: 利用側の CSS が詳細度によらず mdmark の CSS に勝つために `@layer` を使用する。`@layer` を持つ最初のバージョン（Chrome 99・Firefox 97・Safari 15.4）と、ES2022 のクラスの構文を書き換えずに出すための静的初期化ブロック（Safari 16.4）と、まとめた HTML の狭い幅の文書の一覧のパネルに使用する `<dialog>`（Chrome 37・Firefox 98・Safari 15.4）のうち、新しい方を各ブラウザの下限にする。外部ライブラリの読み込みは動的 `import()`（どの下限でも使用できる）で行い、import map は使用しない。CSS の入れ子は下限で有効にならないため、ビルドが展開する。トップレベル await は Safari 16.4 で部分対応のため使用しない
    measurement: E2E を Playwright 同梱の Chromium・Firefox で実行する。加えて `npm run build` が、利用側のブラウザが読み込む JS を minify せずにまとめ、eslint-plugin-compat（MDN の browser-compat-data）でこのバージョンと照らして、無い API を同じ API の `typeof` で確認せずに使用すると止まる（インターフェース定義『配布物をビルドする』の制約『対応ブラウザの下限の確認』）。Safari 16.4 の実機での動作は確認していない
    verification:
      device: WSL2 上の Playwright 同梱の Chromium・Firefox
      version: Playwright 1.64.0（Chromium 156.0.8078.4・Firefox 157.0）
      date: '2026-10-31'
      result: 合格
  - id: NFR-3
    name: 通信
    english_name: network
    category: 動作環境
    external_constraint: 配布物を jsDelivr から HTTPS で読み込む
    source_kind: 実行基盤の制限
    value: 利用側のページでは jsDelivr へ HTTPS で届くことを前提にする。CLI が書き出した HTML は外へ要求せず、オフラインでも開ける（『書き出した HTML の外部への要求』）
    rationale: 利用側のページへは配布物を CDN から読み込む構造で配る。CDN を読み込めない環境へは CLI で書き出した 1 枚の HTML を配る
    overflow: 読み込めないときはページの本文だけを表示し、ブラウザが読み込めなかった旨をコンソールに出す
  - id: NFR-4
    name: 書き出した HTML の外部への要求
    english_name: exported_html_requests
    category: 動作環境
    external_constraint: Microsoft の環境（OneDrive など）では CDN を読み込めない
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/mdmark/pull/16#discussion_r4258211591
    value: '0'
    unit: 件
    rationale: 開いてから描き終えるまでに、ページ自身・書き出しが隣の `_files/` へコピーした動画と音声と画像の `data:` のほかへ要求しない。配布物・利用側の CSS・外部ライブラリのモジュール・拡張・画像を HTML に埋め、起動の処理・部品・色分け・外部ライブラリ・拡張を 1 つの `<script type="module">` にまとめて、`blob:` URL と動的 `import()` を使用しない
    measurement: E2E で書き出した HTML と隣の `_files/` だけを空のフォルダへコピーして file:// で開き、描き終えるまでの要求を数える
    overflow: 読み込めない画像とモジュールは埋めずに書き出しの警告に出し、開いたときはそのマーカーの場所に通知ブロックを出す（要求はしない）
    status: planned
    verification:
      device: WSL2 上の Playwright 同梱の Chromium・Firefox
      version: Playwright 1.64.0（Chromium 156.0.8078.4・Firefox 157.0）
      date: '2026-10-31'
      result: 合格
  - id: NFR-5
    name: mermaid を埋めた書き出しの HTML のサイズ
    english_name: exported_html_mermaid_size
    category: 性能
    external_constraint: 制限なし（書き出した HTML は 1 枚のファイルとして配り、jsDelivr の 1 ファイル 20MB の上限は該当しない）
    source_kind: 制限なし
    value: mermaid の本体と全ての図の種類の chunk を埋める（mermaid 12.3.0 で約 5.3MB 増える）
    rationale: '利用側の利用者が file:// で開くたびに読み込む大きさ。[PoC: mermaid のまとめ方・CSS 変数のテーマ・プレビューの CSP](https://github.com/shuhei1101/mdmark/pull/384) で、mermaid 12.3.0 の本体と全ての chunk をまとめた script は 5,489,182 バイトだった。文書が使用する図の種類の chunk だけをまとめ、ほかを空のモジュールに差し替えると、flowchart だけで 4,342,441 バイト、flowchart と sequenceDiagram で 4,462,681 バイト、種類なし（本体と共通の chunk だけ）で 4,276,727 バイト（2026-11-08、作業ツリーの外で実測）。図の種類を絞っても本体と共通の chunk の約 4.3MB は残り、減るのは最大で約 1.2MB'
    overflow: mermaid のコードブロックを持たない文書の書き出しには埋めない（インターフェース定義『文書をHTMLに書き出す』の制約「埋める mermaid」）
    status: planned
  - id: NFR-6
    name: CLI が動く Node のバージョン
    english_name: cli_node_version
    category: 動作環境
    external_constraint: Node.js の保守の期限（Node 22 は 2027-04-30 まで、Node 24 は 2028-04-30 まで）
    source_kind: 実行基盤の制限
    source: https://github.com/nodejs/release#release-schedule
    value: Node 24 以降（`package.json` の `engines.node` に `>=24` を記載する）
    rationale: 今の Active LTS のバージョンを下限にし、標準の `fs.glob` と `fetch` を使用する。開発の `package.json` の `engines.node` も `>=24` で、開発のスクリプトを Node 24 の型の剥ぎ取りで動かしている
    measurement: 結合テストを Node 24 で実行する
    status: planned
    verification:
      device: WSL2 上の Node
      version: Node v24.14.0
      date: '2026-10-31'
      result: 合格
  - id: NFR-7
    name: 対応する VS Code のバージョン
    english_name: vscode_version
    category: 動作環境
    external_constraint: 拡張機能は `package.json` の `engines.vscode` より古い VS Code に入らない
    source_kind: 実行基盤の制限
    source: https://code.visualstudio.com/api/working-with-extensions/publishing-extension#visual-studio-code-compatibility
    value: VS Code 1.141.0 以降（`vscode/package.json` の `engines.vscode` に `^1.141.0` を記載する）
    rationale: '[PoC: VS Code の Webview で jsDelivr の mdmark を描く](https://github.com/shuhei1101/mdmark/pull/70)で Webview の CSP・動的 `import()`・`ready` を受けた再送信を確認した最も古いバージョン（Windows の 1.141.0。Linux バージョンは 1.143.1）を下限にする。それより古いバージョンは確認していない'
    measurement: 拡張機能の結合テストを VS Code 1.141.0 とその時点の stable の 2 つで実行する
    overflow: 下限より古い VS Code には Marketplace が入れさせない
    status: planned
    verification:
      device: WSL2 上の VS Code（xvfb-run）
      version: VS Code 1.141.0・1.145.1（stable）。React（Vite でビルドした `media/preview.js`）にした Webview で、CSP・動的 `import()`・`ready` を受けた再送信の結合テストが 69 件 pass した
      date: '2026-11-06'
      result: 合格
  - id: NFR-8
    name: タグ一覧を取る待ちの上限
    english_name: tag_list_timeout
    category: 耐障害
    external_constraint: GitHub の REST API は未認証で 60 回/時まで。応答の時間の保証は無い
    source_kind: 外部 API の制限
    source: API-472-1#
    value: '3'
    unit: 秒
    rationale: '取れないときは前回のバージョンで描けるため、長く待たずに描き始める。プレビューは開いてから 1 秒経っても描けないときだけ読み込み中を出し、[PoC: VS Code の Webview で jsDelivr の mdmark を描く](https://github.com/shuhei1101/mdmark/pull/70)の配布物の読み込みは 641〜1,400 ms だった。タグ一覧の待ちを追加しても、前回のバージョンで描き始めるまでを 5 秒前後に収める'
    overflow: 上限を超えたら要求を打ち切り、取れなかったときと同じく前回のバージョンを使用する。前回のバージョンも無ければ、プレビューにバージョンを決められない理由を出す（書き出しは書き出せない通知を出す）
    status: planned
  - id: NFR-9
    name: 再描画するまでの待ち
    english_name: preview_update_delay
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 300（既定。設定 `mdmark.preview.updateDelayMs` で 0〜5000 に変えられる）
    unit: ミリ秒
    rationale: '打つたびに再描画すると、図と外部ライブラリのマーカーを持つ文書でちらつく。続けて打つ間は再描画せず、手を止めてから待ちが目立たない長さにする。上限の 5000 は、保存したときだけ再描画する設定（`mdmark.preview.liveUpdate: false`）が別にあるため、それより長い待ちを許可しない'
    overflow: 範囲の外の値は VS Code の設定の画面が受け付けない（`package.json` の `minimum`・`maximum`）。`settings.json` に直に書き込んだ範囲の外の値は既定の 300 として扱う
    status: planned
  - id: NFR-10
    name: 印刷のダイアログを出すまでの待ちの上限
    english_name: print_wait_limit
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '10'
    unit: 秒
    rationale: '書き出した HTML は jsDelivr から配布物と外部ライブラリを読み込むため、描き終えるまで待ってから印刷する。[PoC: VS Code の Webview で jsDelivr の mdmark を描く](https://github.com/shuhei1101/mdmark/pull/70)の jsDelivr のキャッシュが冷えた初回の読み込みは 5,045 ms だったため、その倍に近い値を上限にする'
    overflow: 上限までに外部ライブラリのマーカーの読み込みが終わらなければ、そのまま印刷のダイアログを出す（読み込み中のマーカーの場所は読み込み中のブロックのまま印刷される）
    status: planned
  - id: NFR-11
    name: 確認した Claude Code のバージョン
    english_name: claude_code_version
    category: 動作環境
    external_constraint: プラグイン・フック・MCP の挙動は Claude Code のバージョンで変わる。バージョンは利用側の手元のものを使用し、mdmark は固定しない
    source_kind: 外部ライブラリの制限
    source: LIB-472-1#version
    value: 2.1.309（プラグイン mdmark）・2.1.328（mod のプラグイン mdmark-style）
    rationale: '[PoC: プラグインの SessionStart の索引と、npx で起動する MCP サーバー](https://github.com/shuhei1101/mdmark/pull/73)でマーケットプレイスの追加と導入・索引の注入・MCP サーバーの接続・ツールの呼び出しを確認したバージョン。これより新しいバージョンと古いバージョンは確認していない。mod のプラグイン mdmark-style は、PoC（[#701](https://github.com/shuhei1101/mdmark/pull/701)）と `claude plugin test` の結合テスト（[#699](https://github.com/shuhei1101/mdmark/pull/699)）で 2.1.328 を確認した。2.1.328 より古いバージョンは確認していない'
    measurement: Claude Code の実機で、プラグイン mdmark を入れ、セッションの開始で索引を受け取り、ツールを呼べるかを確認する。mod のプラグイン mdmark-style は、`claude plugin validate` と `claude plugin test`（結合テスト）に合格するかと、実機で返答・発言が描き換わるかを確認する
    status: planned
    verification:
      device: ユーザーの手元の Claude Code（WSL2）
      version: Claude Code 2.1.316（プラグイン mdmark）・2.1.328（mod のプラグイン mdmark-style）
      date: '2026-11-19'
      result: 合格
  - id: NFR-12
    name: MCP サーバーの接続の待ち
    english_name: mcp_connect_wait
    category: 性能
    external_constraint: MCP サーバーの接続を待つ上限は MCP_TIMEOUT の既定で 30 秒。超えるとサーバーを使用できない
    source_kind: 外部ライブラリの制限
    source: LIB-472-1#limitations[MCP サーバーの接続の待ち]
    value: '30'
    unit: 秒 以内
    rationale: 'MCP サーバーの起動で CLI を取得すると、空の npm のキャッシュから 53 秒かかった（[PoC: プラグインの SessionStart の索引と、npx で起動する MCP サーバー](https://github.com/shuhei1101/mdmark/pull/73)）。`mdmark serve` を先に常駐させ、Claude Code は起動済みのサーバーへ HTTP でつなぐだけにする'
    measurement: 起動済みの `mdmark serve` へ Streamable HTTP でつないだ MCP のクライアントが tools/list を受け取るまでの時間を測る
    overflow: Claude Code が接続を諦め、プラグインの MCP のツールが使用できない。起動で外へ要求する処理を追加しない
    status: planned
    verification:
      device: WSL2 上の Node
      version: Node v24.14.0（tools/list まで 7〜117ms）
      date: '2026-10-31'
      result: 合格
  - id: NFR-13
    name: 表の多い文書の列の幅を決定するまでの時間
    english_name: table_heavy_document_column_width_time
    category: 性能
    external_constraint: 文書を描く処理と列の幅を決める処理はメインスレッドで動き、その間は利用側のページが操作を受け付けない
    source_kind: 実行基盤の制限
    value: '1000'
    unit: ミリ秒 以内（表 16 個・本文のセル 480 個の文書で、`mount` を呼んでから全ての表の列の幅を決定するまで）
    rationale: '[Issue #725](https://github.com/shuhei1101/mdmark/issues/725) で、MindStella の画面で表 16 個・セル 459 個の資料へ切り替えると 15.0〜16.0 秒の長いタスクが出、その大半が列の幅の計測（計測用の要素の配置と幅の取得を交互に 1,158 回）だった（2026-11-20、ヘッドレスの Chromium）。利用者が求めた目安は資料の切り替えが 1 秒以内で、利用側の処理（記録の取得など）は mdmark の結合テストでは測れないため、mdmark が描き始めてから列の幅を決定するまでの区間に 1 秒を割り当てる（利用側の分は shuhei1101/mindstella#627 が扱う）。結合テストと同じ構成での実測は、今の実装が 1,600〜2,444 ms（上限を超え、結合テストが失敗する）、計測用の要素をまとめて配置してから幅をまとめて取得する試作が 517〜739 ms、列の幅を決めない場合が 138〜221 ms だった（負荷の平均 9〜12 の 8 コアの端末）。試作の最大に負荷のぶれの余裕（約 3 割）を加えても収まり、今の実装の最小を下回る値にした'
    measurement: 結合テストで、表 16 個の文書を Playwright 同梱の Chromium で `mount` し、全ての表が `data-auto-width` を持つまでの時間を測る（インターフェース定義『文書を描く』の「正常系（表の多い文書の列の幅を決める）」）
    overflow: 上限を超えても列の幅は決め終える。結合テストが失敗し、タグを打つ前に測り方を見直す
    status: planned
    verification:
      device: WSL2（8 コア、負荷の平均 5〜7）の vitest のブラウザモードで Playwright 同梱の Chromium・幅 1280px
      version: Chromium 156.0.8078.4（HeadlessChrome）
      date: '2026-11-20'
      result: 合格
      detail: 修正した後（commit 5393daaa）に 2 回× 6 回描き、mount から全ての表が data-auto-width を持つまでが 356・345・325・348・299・267 / 432・419・537・309・413・522 ms。修正する前（develop の e4aa77ce、負荷の平均 9〜12）は 1,600〜2,444 ms（3 回× 6 回）で、結合テスト test_normal_when_many_tables_column_widths は修正する前の実装で失敗する
tags:
  - name: topic:要件
    main: true
lead: 外部の制約から逆算した mdmark の決定値（動作環境・上限・所要時間など）を定め、これらの値を決める・変えるときに参照する。
