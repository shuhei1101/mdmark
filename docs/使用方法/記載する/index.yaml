summary: Markdown にマーカーと記法を記載して、表・注意書き・タブなどを付ける手順
items:
  - page: 表に機能を付ける.md
    summary: 表をマーカーで囲み、種類と機能を選ぶ手順
  - page: 本文を部品で組む.md
    summary: 注意書き・タブ・ステップ・ファイルツリー・バッジ・脚注・コードブロックの飾り・目次・セクションの開閉・行の詳細を記載する手順
  - page: 索引と用語集を記載する.md
    summary: 索引に文書と用語を記載し、表から用語集に用語を入れる手順
  - page: 色で強調する.md
    summary: 色の名前の一覧と、決め手の 1 文だけに色を付ける色の使用方法のガイド
  - page: 画像と動画を配置する.md
    summary: 画像の属性・キャプション・ライトボックス・ギャラリー・テーマごとの切り替え・動画・GIF・音声・アセットの配置場所の手順
  - page: 図と表に番号を付ける.md
    summary: "`fig` のマーカーと、番号を出すリンクの記載方法"
  - page: ビューとコメントを使用する.md
    summary: ビューのマーカーの記載方法・ボードと表形式の切り替え・列の絞り込み・コメントを付ける手順
  - page: 文書の記載方法.md
    summary: 人が読み込む資料を記載する前に読み込む、表し方と文の決まり
