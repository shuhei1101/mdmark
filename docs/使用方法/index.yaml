  - page: VSCodeで確認する/
    summary: VS Code の拡張機能で Markdown を mdmark で描いたプレビューを出し、HTML・PDF にする手順
  - page: ClaudeCodeで使用する/
    summary: Claude Code に mdmark のガイドへの動線と、書き出し・点検のツールを指定する手順
