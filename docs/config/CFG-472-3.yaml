id: CFG-472-3
visibility: internal
title: '設定: ライブラリ本体'
lead: 利用側が `mdmark.config.yaml` に書き込む設定のキー。利用側のサーバーが読み込んだオブジェクトを `mount`・`render` の `opts.config` に指定するか、mdmark の CLI が読み込んで書き出しに使用する。この一覧はライブラリ本体と CLI が読み込むキーを持ち、構造の正を JSON Schema `schemas/mdmark.config.schema.json` に配置する。
files:
  - file: mdmark.config.yaml
    manages: 機能のオン・オフの既定、外部ライブラリの対応表、索引の場所、CLI の書き出しに埋める CSS と拡張、まとめる文書と書き出す先
    notes: 利用側のリポジトリに配置する（`mdmark init` が雛形を配置する）。ブラウザの mdmark は YAML を読み込まず、利用側のサーバーか CLI が読み込んだオブジェクトを受け取る
  - file: schemas/mdmark.config.schema.json
    manages: '`mdmark.config.yaml` のこの一覧の全てのキーの JSON Schema（draft 2020-12）。CLI の設定の検めと、配布物のビルドの移行の手順の点検がこの Schema を正にする'
    notes: 他の Issue が追加するキーを拒まないよう、最上位の `additionalProperties` は許す。構造を変えるときは `migrations/next/` に移行の手順か `migrations/no-steps.yaml` の行を配置する
  - file: ${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml
    manages: 端末の設定。`mdmark.config.yaml` と同じキーと、重ね方の切り替えの `config.*` を持ち、重ねる最初の層になる
    notes: 環境変数 `MDMARK_CONFIG` があればそのパスを読み込む。無ければ空の設定として扱う。重ね方はインターフェース定義『設定を重ねて読み込む』
  - file: schemas/mdmark.settings.schema.json
    manages: 端末の設定の JSON Schema。`mdmark.config.schema.json` のキーに `config.cascade`・`config.applyToExport`・`serve.tmuxSession`・`serve.launcher`・`serve.systemdUnit` を追加したもの
    notes: 構造を変えるときは `migrations/next/` に移行の手順か `migrations/no-steps.yaml` の行を配置する
settings:
  - key: features
    title: 機能のオン・オフ
    file: mdmark.config.yaml
    type: Record<string, boolean>
    required: false
    default: '`comments` を除く全ての機能が `true`'
    description: '機能ごとのオン・オフの既定。文書の `<!-- features: {"機能": true} -->`（`false` でオフ）がその文書だけ上書きする'
    allowed: 値は真偽値。知らない機能名と真偽値でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
  - key: features.print
    title: 印刷の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 印刷の前に閉じた折り畳みと、タブ・閉じたセクション・行の詳細を開き、印刷の後に戻す
    reload: reload
    implementation: src/print.ts#attachPrint
  - key: libraries
    title: 外部ライブラリの対応表
    file: mdmark.config.yaml
    type: Record<string, string>
    required: false
    default: '`{}`'
    description: マーカーの名前から外部ライブラリのモジュールの URL を参照する。既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は追加する。モジュールの `draw(slot, options)` には、マーカーの名前の後ろの JSON のオブジェクト（引数の無いマーカーは `{}`）を渡す
    allowed: キーは英小文字で始まり英小文字・数字・`-` だけを持つマーカーの名前。値は URL（相対 URL はページの `document.baseURI` を基準に解決する）。文字列でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
    refs:
      - IF-472-35#request[opts.config.libraries]
  - key: features.table
    title: 表の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 表のマーカーと、マーカーで囲まない表に、種類ごとの並べ替え・ピン止め・絞り込みと開閉を付け、マーカーの `highlight=`・`row-color=`・`row-at=` で列と行に色を付ける。オフのときは表のマーカーを取り除いて普通の表を描く
    reload: reload
    status: planned
  - key: features.callout
    title: 注意書きの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 1 行目が `[!NOTE]` などの引用を、種類ごとのタイトル・色・アイコンを持つ枠にする。オフのときは引用のまま描く
    reload: reload
    status: planned
  - key: features.tabs
    title: タブの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- tabs -->` の範囲を見出しで区切ったタブにする。オフのときは範囲の中身をそのまま描く'
    reload: reload
    status: planned
  - key: features.steps
    title: ステップの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- steps -->` の範囲の番号付きリストを手順にする。オフのときは番号付きリストのまま描く'
    reload: reload
    status: planned
  - key: features.tree
    title: ファイルツリーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 言語 `tree` のコードブロックをフォルダとファイルのツリーにする。オフのときはコードブロックのまま描く
    reload: reload
    status: planned
  - key: features.badge
    title: バッジの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 頭に `badge:` を付けた行内のコードを札にし、`badge:` の後ろが色の名前と `:` のときは札にその色を付ける。オフのときは行内のコードのまま描く
    reload: reload
    status: planned
  - key: features.toc
    title: 目次の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- toc -->` の場所に h2〜h3 の目次を配置する。オフのときはマーカーを取り除く'
    reload: reload
    status: planned
  - key: features.anchors
    title: 見出しのアンカーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 見出しに、見出しの ID へのリンクを付ける。オフのときもリンクを付けないだけで、見出しの ID は付ける
    reload: reload
    status: planned
  - key: features.sections
    title: セクションの開閉の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: h1〜h4 のセクションを見出しから開閉できるようにする。オフのときはセクションを囲まず、`section` のマーカーを取り除く
    reload: reload
    status: planned
  - key: features.row-details
    title: 行の詳細の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- row-detail -->` の範囲を表の行の下に開閉して出す。オフのときは範囲の中身を表の後の本文として描く'
    reload: reload
    status: planned
  - key: features.figures
    title: 図表の番号の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- fig -->` の直後の図と表に番号を付け、`#fig-ID` へのリンクの文字を番号にする。オフのときはマーカーを取り除き、リンクの文字を変えない'
    reload: reload
    status: planned
  - key: features.glossary
    title: 用語の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 索引の `terms` と用語集の表の用語に下線と意味のツールチップを付け、索引の `terms[].avoid` と用語集の表のやめた言い方の列のやめた言い方に波線のマーカーと代わりの用語のツールチップを付け、`<!-- glossary -->` の表を用語集に入れる。オフのときはマーカーを取り除き、表を普通の表として描く
    reload: reload
    status: planned
    refs:
      - MOD-472-263#functions[termsRule]
  - key: features.backlinks
    title: 被参照の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 文書の末尾に関連文書（被参照）の一覧を配置し、索引の文書の `aliases` に一致した単語のツールチップに関連文書を出す。オフの文書は参照の表で参照元にも参照先にもならない
    reload: reload
    status: planned
    refs:
      - MOD-472-264#functions[backlinksRule]
  - key: features.text-color
    title: 本文の文字の色の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 角括弧で囲んだ文字の後ろの `{color=色}` で、本文の文字に色の名前の文字の色を付けて太字にする。オフのときは記載した文字のまま描く
    reload: reload
    status: planned
    refs:
      - IF-472-34#constraints[本文の文字の色]
  - key: features.images
    title: 画像の属性とキャプションの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 画像の後ろの `{…}` の属性（幅・配置・`nolightbox`・動画と音声の属性）を当て、画像だけの段落を title のキャプションを持つ図にし、`#only-dark`・`#only-light` の画像を今の配色で出し分ける。オフのときは `{…}` を記載した文字のまま描き、画像を今のとおり描く
    reload: reload
    status: planned
    refs:
      - IF-472-34#constraints[画像の属性]
  - key: features.gallery
    title: ギャラリーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- gallery: {"columns": 列の数} -->` の範囲の画像を格子に並べ、`fig` のマーカーの番号にサブ図の番号を付ける。オフのときはマーカーを取り除く'
    reload: reload
    status: planned
    refs:
      - IF-472-34#constraints[ギャラリー]
  - key: features.lightbox
    title: ライトボックスの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 図の画像を押すと全画面のダイアログで拡大し、同じ文書の画像を前後に切り替える。オフのときは画像を押しても何もしない
    reload: reload
    status: planned
    refs:
      - IF-472-35#constraints[ライトボックス]
  - key: features.media
    title: 動画と音声の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 画像の記載方法で記載した動画・音声のファイルを、拡張子で判断して再生バー付きの `video`・`audio` にする。オフのときは画像として描く
    reload: reload
    status: planned
    refs:
      - IF-472-34#constraints[動画と音声]
  - key: features.gif
    title: GIF の止める・再生するボタンの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: GIF の画像に止める・再生するボタンを付ける。オフのときはボタンを付けない
    reload: reload
    status: planned
    refs:
      - IF-472-35#constraints[GIF の止める・再生する]
  - key: features.cards
    title: リンクと添付のカードの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: リンク 1 つだけの段落を、リンクのカードか添付のカードにする。オフのときはリンクのまま描く
    reload: reload
    status: planned
    refs:
      - IF-472-34#constraints[リンクと添付のカード]
  - key: index
    title: 索引の場所
    file: mdmark.config.yaml
    type: string
    required: false
    description: 索引の YAML のパス。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読み込まず、利用側のサーバーが読み込んだ索引を `opts.index` に指定する。索引の文書の `path` はこの索引のファイルのあるフォルダからの相対パス
    missing: 索引を使用しない（利用側が `opts.index` を指定しなければ用語と関連文書を出さない）
    reload: reload
    status: planned
    refs:
      - ER-472-6#
  - key: theme
    title: 利用側の CSS
    file: mdmark.config.yaml
    type: string
    description: CLI が書き出す HTML に、配布物の CSS の後で埋める利用側の CSS のパス。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読み込まない
    missing: 利用側の CSS を埋めない
    reload: reload
    allowed: ファイルのパス。読み込めないときは書き出しを止めず警告に出す
    status: planned
    introduced:
      pr: 32
    refs:
      - IF-472-33#
  - key: extensions
    title: 拡張のモジュール
    file: mdmark.config.yaml
    type: string[]
    description: CLI が書き出す HTML にまとめて埋め、描く前に `registerExtension` で登録する拡張のモジュールのパスの並び。各モジュールは `registerExtension` に指定する拡張を既定の export にし、読み込みの時点でブラウザの API を使用しない（使用するのは `load` の中だけ。`mdmark check` が Node で読み込んで `directive` を取る）。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読み込まない
    default: '[]'
    missing: 拡張を埋めない（拡張のマーカーは知らないマーカーとして取り除かれる）
    reload: reload
    allowed: TypeScript か JavaScript のファイルのパス。読み込めない・まとめられないものは書き出しを止めず警告に出す
    refs:
      - IF-472-32#
    status: planned
    introduced:
      pr: 32
  - key: build
    title: まとめる設定
    file: mdmark.config.yaml
    type: object
    description: '`mdmark build` が 1 枚の HTML にまとめる文書と書き出す先。パスと glob は `mdmark.config.yaml` のあるフォルダからの相対。`mount`・`render`・`mdmark export` はこのキーを読み込まない'
    missing: '`mdmark build` が設定に `build` が無いことを出して終了コード 1 で終わる'
    reload: reload
    status: planned
    introduced:
      pr: 32
    refs:
      - IF-472-38#
  - key: build.include
    title: まとめる文書
    file: mdmark.config.yaml
    type: string[]
    required: true
    description: まとめる Markdown の glob の並び。該当した文書を、glob の並び・同じ glob の中はパスの順で並べる
    missing: '`build` の構造の誤りとして終了コード 1 で終わる（`mdmark check` は `schema` のずれにする）'
    reload: reload
    allowed: 1 つ以上。`**`・`*`・`?` を使用できる。該当するのは拡張子 `.md` のファイルだけ
    status: planned
    introduced:
      pr: 32
  - key: build.exclude
    title: 削除する文書
    file: mdmark.config.yaml
    type: string[]
    default: '[]'
    description: '`include` に該当した文書から除外する glob の並び'
    reload: reload
    allowed: '`include` と同じ記載方法'
    status: planned
    introduced:
      pr: 32
  - key: build.glossary
    title: 用語集の文書
    file: mdmark.config.yaml
    type: string[]
    default: '[]'
    description: 用語集の表（`<!-- glossary -->`）の用語を、まとめた全ての文書で有効にしる文書のパスの並び。索引が無いときも有効になる
    missing: 索引に載った文書の用語集の表だけをまとめた全ての文書で有効にしる（索引が無ければ、各文書の表はその文書の中だけで有効になる）
    reload: reload
    allowed: '`include` に該当する文書のパス。該当しないパスは `mdmark check` で `schema` のずれにし、`mdmark build` では警告に出す'
    status: planned
    introduced:
      pr: 32
  - key: build.entry
    title: 最初に開く文書
    file: mdmark.config.yaml
    type: string
    default: '`include` の並びで最初に該当した文書'
    description: まとめた HTML を URL の `#` 無しで開いたときと、URL が 1 枚に無い文書を指すときに出す文書のパス
    reload: reload
    allowed: まとめる文書のパス。該当しないときは `mdmark check` で `schema` のずれにし、`mdmark build` では既定を適用して警告に出す
    status: planned
    introduced:
      pr: 32
  - key: build.out
    title: 書き出す先
    file: mdmark.config.yaml
    type: string
    required: true
    description: まとめた HTML を書き込むパス。既にあれば上書きする
    missing: '`build` の構造の誤りとして終了コード 1 で終わる（`mdmark check` は `schema` のずれにする）'
    reload: reload
    allowed: 拡張子 `.html` のパス。親のフォルダが無ければ作る
    status: planned
    introduced:
      pr: 32
  - key: version
    title: 手元のバージョン
    file: mdmark.config.yaml
    type: string
    required: false
    description: この設定・索引・文書が合わせてある mdmark のバージョン。`mdmark init` が呼んだ CLI のバージョンを記載し、`mdmark upgrade` が移行の手順を適用して点検が通った後に呼んだ CLI のバージョンへ書き換える。`mount`・`render`・`export`・`build`・`check` は値で振る舞いを変えない。端末の設定（`settings.yaml`）も同じキーを持ち、`global-setup` が作るときに記載し、`mdmark upgrade --settings` が書き換える
    missing: '`mdmark upgrade` が利用者に手元のバージョンを聞く（v0.3.0 までの `init` が配置した設定）'
    reload: reload
    allowed: '`^v\d+\.\d+\.\d+$`。合わないと `mdmark check` は `schema` のずれにする'
    refs:
      - IF-472-28#
    status: planned
    introduced:
      pr: 39
  - key: features.diagrams
    title: 図の部品の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- flow -->`・`<!-- sequence -->`・`<!-- chart -->`・`<!-- param -->` の範囲の部品の定義から図と操作できる部品を描く。オフのときはマーカーを取り除き、定義を JSON のコードブロックのまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 42
  - key: features.html
    title: 埋め込んだ HTML の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- html -->` の範囲の `html` のコードブロックの中身を HTML として描き、中の図の部品の custom element を図にする。オフのときはマーカーを取り除き、コードブロックのまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 45
  - key: features.hints
    title: ヒントの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 埋め込んだ HTML の `data-hint`、図のノードの `hint`・`io`、線の `tip` のツールチップを出す。オフのときはマーカーとツールチップの中身を出さず、線のラベルとノードの名前は出す
    reload: reload
    status: planned
    introduced:
      pr: 45
  - key: check.ignore
    title: 知らないマーカーから除外する名前
    file: mdmark.config.yaml
    type: string[]
    required: false
    default: '[]'
    description: '`mdmark check` が文書の本文の知らないマーカーとして通知しない、マーカーと同じ記載方法の HTML コメントの名前の並び（`prettier-ignore`・`markdownlint-disable` など他のツールへの指示）。`mount`・`render`・`export`・`build` はこのキーを読み込まない'
    missing: マーカーに該当しない名前を全て知らないマーカーとして通知する
    reload: reload
    allowed: マーカーの名前の書式（英小文字で始まり、英小文字・数字・`-` が続く）の文字列。合わないと `mdmark check` は `schema` のずれにする
    refs:
      - IF-472-39#
    status: planned
    introduced:
      pr: 64
  - key: features.views
    title: ビューの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- view -->` の範囲の表を、ボード表示と表形式を切り替えるビューにする。オフのときはマーカーを取り除き、表のまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 55
  - key: features.comments
    title: コメントの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
