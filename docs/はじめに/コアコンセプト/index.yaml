summary: "文書を描く仕組みなど、使用する前に知っておく考え方"
docs_index: true
items:
  - page: 文書を描く仕組み.md
    summary: Markdown と設定を指定してから描かれるまでの流れと、テーマの層・機能のオン・オフの優先順
  - page: 共通の定義と固有の定義.md
    summary: 基盤の部品と CSS、利用側の固有の部品と CSS の層と、該当する範囲
  - page: 索引と被参照.md
    summary: 索引を正にし、被参照を描くときに算出し、ずれを点検で見つける仕組み
  - page: 1枚にまとめる仕組み.md
    summary: 文書を集めて参照の表を作り、配布物・CSS・外部ライブラリ・画像と一緒に 1 枚に埋める流れ
  - page: 設定を重ねて読み込む仕組み.md
    summary: 端末の設定と、文書のフォルダから上のフォルダの設定ファイルを重ねる順・切り替え・相対パスの基準・優先の順番
  - page: バージョンを上げる仕組み.md
    summary: バージョンごとの移行の手順をバージョンの順に当て、コピーから戻し、点検してからバージョンを書き換える流れ
  - page: 差分を表示する仕組み.md
    summary: 取り出し元から 2 つのリビジョンの本文を受け、行と文字を比べて描く流れと、埋め込んだ HTML の切り替え、描いた文書のブロックの色分け
  - page: ClaudeCodeに使用方法を提供する仕組み.md
    summary: ガイドを dev-docs で必要な分だけ参照させ、CLI と同じ処理をツールで呼ぶ流れ
