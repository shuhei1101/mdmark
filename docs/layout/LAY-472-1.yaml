gitignore:
  - pattern: docs/generated/
    reason: AI Monitor が YAML の設計書から生成する Markdown（生成物）
  - pattern: node_modules/
    reason: npm の依存（ロックから入れ直せる）
  - pattern: .vitest/
    reason: Vitest のキャッシュ
  - pattern: debug-storybook.log
    reason: Storybook のデバッグのログ
  - pattern: vscode/node_modules/
    reason: VS Code 拡張機能の npm の依存（ロックから入れ直せる）
  - pattern: vscode/dist/
    reason: VS Code 拡張機能の本体をまとめたファイル（生成物）
  - pattern: vscode/media/
    reason: Webview が読み込むスクリプトと CSS（生成物）
  - pattern: vscode/out/
    reason: VS Code 拡張機能の結合テストをビルドしたファイル（生成物）
  - pattern: vscode/.vscode-test/
    reason: 結合テストが取得した VS Code
  - pattern: '*.vsix'
    reason: VS Code 拡張機能のパッケージ（生成物。Release に添える）
  - pattern: plugin/node_modules/
    reason: プラグインの npm の依存
refs:
  - ARCH-472-1#
  - CMD-472-1#
notes:
  VS Code 拡張機能のテストの置き場所: |-
    VS Code 拡張機能のテストは、テストを実行する道具ごとに 2 つの置き場所に分ける。

    | 置き場所 | 実行する道具 | 分ける理由 |
    | --- | --- | --- |
    | `tests/unit/vscode/`・`tests/integration/vscode/` | 直下の Vitest | 直下の `package.json` の依存（Vitest・Playwright・Storybook）と、`tests/` が共有する補助のコードを使用する。単体と結合は、ほかの対象と同じ層の分け方にする |
    | `vscode/tests/integration/` | `vscode/` の mocha と `@vscode/test-electron` | `mocha`・`@vscode/test-electron` は `vscode/package.json` だけの依存で、Node は `vscode/` の外のファイルからは `vscode/node_modules/` を探さない。`vscode/scripts/build.ts` が `vscode/` の中の結合テストを `out/test/` にまとめる |
  src の機能のフォルダのファイル名: |-
    記法の機能のフォルダ（`table/`・`tabs/` など）と、図・map・索引・ビュー・コメント・差分・書き出した HTML の起動のフォルダは、ファイル名の後ろに中身の役割を付ける。

    | 役割 | ファイル名 | 中身 | 動く場所 |
    | --- | --- | --- | --- |
    | 記法 | `{name}.syntax.ts` | markdown-it のコアルールと、コアルールが使用するトークンの助け | ブラウザと Node |
    | 部品 | `{name}.part.ts` | 部品の HTML 文字列を返却する関数 | ブラウザと Node |
    | ストーリー | `{name}.part.stories.ts` | 部品の状態ごとの Storybook のストーリー | Storybook |
    | 操作 | `{name}.interact.ts` | `mount` が描いた文書に付ける読者の操作と、操作が使用する DOM の助け | ブラウザ（単体テストは `*.browser.test.ts`） |
    | 計算 | `{name}.logic.ts` | DOM もトークンも使用しない計算・定数 | ブラウザと Node |

    持ち主の機能が無い助け（どの機能の記法・部品・操作でもない関数・定数）は `shared/` に配置する。
    ある機能の記法・部品・操作を別の機能が組み込むときは、持ち主の機能のフォルダに置いたまま import する。
  配信しないファイル: |-
    project-index の検索の対象はリポジトリの全てのファイルで、次のファイルだけを配信しない（`project-index.yaml` の `files_top` の行の `exclude`）。

    | パス | 配信しない理由 |
    | --- | --- |
    | `dist/` | `src/` からビルドした配布物。中身は `src/` の行で参照できる |
    | `docs/pr/` | 作業 PR ごとの計画書・テスト結果・反映作業。設計書とコードを探すときの雑音になる |
    | `tmp/` | 手元の一時ファイル。管理しているのは中身を無視する `.gitignore` だけ |
    | `package-lock.json` | `package.json` から生成する依存のロック |
    | `docs/README.md`・`docs/*/README.md` | 目次の `index.yaml` から生成する |
    | `docs/index.yaml`・`docs/*/index.yaml` | フォルダの目次。文書は設計書の種類の行で配信し、dev-docs の画面の並びは `nav` が持つ |
    | `docs/_theme/_data/nav.project.yml` | `docs/guide/` の文書の分類から生成する |
    | `docs/_theme/assets/vendor/` | mermaid の配布物のコピー |

    バイナリのファイル（画像・動画）は project-index が管理用の YAML の対象にしない。
