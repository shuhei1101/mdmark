id: LAY-472-1
visibility: internal
title: mdmark
repository: shuhei1101/mdmark
lead: |-
  ライブラリ本体・CLI・Claude Code プラグインのフックのコードは `src/`、VS Code 拡張機能は `vscode/`、テストは `tests/`、文書の原本は `docs/` の種類のフォルダに分ける。
  配布物は `dist/`（ライブラリ本体・CLI）と `plugin/`（Claude Code プラグイン）にビルドして、git で管理する。
tags:
  - name: topic:フォルダ
    main: true
  - name: topic:構成
  - name: topic:リポジトリ
  - name: topic:gitignore
content_types:
  - name: code
    group: role
    summary: TypeScript のコードと、コードが読み込む CSS
  - name: story
    group: role
    summary: 部品の状態ごとの Storybook のストーリー
  - name: test
    group: role
    summary: 単体・結合のテストと、テストが使用する補助のコード
  - name: test_fixture
    group: role
    summary: テストが比べる見本のファイル
  - name: design_doc
    group: role
    summary: AI Monitor の設計書（YAML）
  - name: public_doc
    group: role
    summary: 利用者が参照する公開ドキュメント（Markdown）
  - name: mock
    group: role
    summary: 部品・画面・スタイルのモック HTML と、その外観と動き
  - name: pr_doc
    group: role
    summary: 作業 PR ごとの計画書・テスト結果・反映作業
  - name: index
    group: role
    summary: フォルダの目次の原本と、そこから生成した README.md
  - name: schema
    group: role
    summary: 設定・索引・マーカー・設計書を検査する JSON Schema
  - name: distribution
    group: role
    summary: ビルドした配布物と、まとめた依存のライセンス
  - name: icon
    group: role
    summary: 配布物のマーケットプレイスに表示するアイコンの原本と、書き出した画像
  - name: migration
    group: role
    summary: mdmark upgrade がバージョンの順に適用する移行の手順とスクリプト
  - name: init_template
    group: role
    summary: mdmark init とセットアップのスキルが配置する雛形
  - name: script
    group: role
    summary: ビルド・検査・描画の開発のスクリプト
  - name: tool_config
    group: role
    summary: lint・型検査・テスト・ビルド・Storybook・配信の道具の設定
  - name: ci
    group: role
    summary: GitHub Actions のワークフロー
  - name: plugin_manifest
    group: role
    summary: Claude Code のプラグインとマーケットプレイスの定義
  - name: hook
    group: role
    summary: Claude Code のフックの登録と本体
  - name: skill
    group: role
    summary: Claude Code のスキルの本体
  - name: guide_index
    group: role
    summary: Claude Code プラグインが案内するガイドの索引
  - name: file_list
    group: role
    summary: YAML の設計書でないファイルの概要文・タグ・関連の一覧（files.yaml・files.yml）
  - name: theme
    group: role
    summary: 公開ドキュメントの GitHub Pages のレイアウト・外観・スクリプト
  - name: library
    group: feature
    summary: ライブラリ本体（文書を描く公開関数・部品・記法）
  - name: cli
    group: feature
    summary: CLI（書き出し・まとめ・点検・雛形・バージョンの更新・MCP の常駐サーバー）
  - name: vscode
    group: feature
    summary: VS Code 拡張機能
  - name: claude_plugin
    group: feature
    summary: Claude Code プラグイン
  - name: storybook
    group: feature
    summary: 部品を Storybook で確認する仕組み
  - name: pages
    group: feature
    summary: 公開ドキュメントの GitHub Pages への配信
entries:
  - type: folder
    name: .claude-plugin
    contents: リポジトリを Claude Code のマーケットプレイスにする定義（プラグインの本体は `plugin/`）
    content_types:
      - plugin_manifest
      - claude_plugin
    children:
      - type: file
        name: marketplace.json
        contents: プラグイン mdmark を `plugin/` から配るマーケットプレイスの定義
  - type: folder
    name: .github
    contents: GitHub の設定と、その管理用の YAML
    children:
      - type: file
        name: files.yaml
        contents: '`.github/` のファイルの一覧（project-index の files の行）'
        content_types:
          - file_list
      - type: folder
        name: workflows
        contents: CI のワークフロー
        content_types:
          - ci
          - vscode
        children:
          - type: file
            name: vscode-release.yml
            contents: '`vscode-v*` のタグで .vsix を作り Release に添えるワークフロー'
  - type: folder
    name: .storybook
    contents: 部品を確認する Storybook の設定と、ストーリーに適用するデコレータ
    content_types:
      - tool_config
      - storybook
    children:
      - type: file
        name: files.yaml
        contents: '`.storybook/` のファイルの一覧（project-index の files の行）'
        content_types:
          - file_list
      - type: file
        name: main.ts
        contents: Storybook の設定（フレームワーク・アドオン・ストーリーの場所・描画のインターフェースへの中継）
      - type: file
        name: preview.tsx
        contents: 全てのストーリーに適用するデコレータと、MSW の読み込み・a11y の検査の水準
      - type: file
        name: preview-head.html
        contents: 描画のインターフェースの CSS を読み込む link
      - type: file
        name: server-html.tsx
        contents: 描画のインターフェースが返却する部品の HTML をストーリーに出すデコレータ
      - type: file
        name: vscode-theme.tsx
        contents: VS Code の色をストーリーに適用するデコレータ
      - type: folder
        name: public
        contents: Storybook が配信する静的なファイル
        content_types:
          - tool_config
          - storybook
        children:
          - type: file
            name: mockServiceWorker.js
            contents: MSW の Service Worker
            generated_from:
              source: npm:msw@3.0.4
              tracked: Storybook と Vitest のブラウザが配信する
  - type: folder
    name: dist
    contents: ライブラリ本体・CLI の配布物（`index.js`・`index.css`・部品のモジュール・`cli.js`・`viewer.js`・型定義）
    content_types:
      - distribution
      - library
    generated_from:
      path: src/
      command: CMD-472-1#categories[ビルド・生成]
      tracked: jsDelivr の `@v{バージョン}` と `npx github:shuhei1101/mdmark#v{バージョン}` が、タグの commit の `dist/` を配る
  - type: folder
    name: docs
    contents: 文書の原本。設計書の種類のフォルダ・公開ドキュメント・モック・作業 PR の計画と、公開ドキュメントの GitHub Pages の設定に分ける
    children:
      - type: file
        name: index.yaml
        contents: '`docs/` の目次の原本'
        content_types:
          - index
      - type: file
        name: README.md
        contents: '`index.yaml` から生成した `docs/` の目次'
        content_types:
          - index
        generated_from:
          path: docs/index.yaml
          command: CMD-472-1#categories[ビルド・生成]
          tracked: GitHub でフォルダを開いたときに表示する目次
      - type: file
        name: index.md
        contents: 公開ドキュメントのサイトのトップページ
        content_types:
          - public_doc
          - pages
      - type: file
        name: _config.yml
        contents: GitHub Pages の Jekyll の設定
        content_types:
          - tool_config
          - pages
      - type: file
        name: design-policy.md
        contents: mdmark が描く文書の既定の外観のデザインの方向性
        content_types:
          - design_doc
      - type: folder
        name: _theme
        contents: 公開ドキュメントの GitHub Pages のレイアウト・外観・スクリプト（AI Monitor から取り込む）
        content_types:
          - theme
          - pages
        children:
          - type: folder
            name: _data
            contents: サイトのナビゲーションのデータ
            content_types:
              - theme
              - pages
            children:
              - type: file
                name: nav.yml
                contents: AI Monitor の共通のナビゲーション
                generated_from:
                  source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/_data/nav.yml
                  tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
              - type: file
                name: nav.project.yml
                contents: mdmark の公開ドキュメントの分類のナビゲーション
          - type: folder
            name: _includes
            contents: サイドバーとタブの Jekyll の部品
            content_types:
              - theme
              - pages
            generated_from:
              source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/_includes/
              tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
          - type: folder
            name: _layouts
            contents: 全ページに共通のレイアウト
            content_types:
              - theme
              - pages
            generated_from:
              source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/_layouts/
              tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
          - type: folder
            name: assets
            contents: 全ページで読み込むスクリプト・CSS と、取り込んだ mermaid の配布物
            content_types:
              - theme
              - pages
            generated_from:
              source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/assets/
              tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
          - type: file
            name: llms.txt
            contents: LLM 向けのページの一覧を出す Jekyll のテンプレート
            generated_from:
              source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/llms.txt
              tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
          - type: file
            name: search.json
            contents: サイト内の検索の索引を出す Jekyll のテンプレート
            generated_from:
              source: shuhei1101/ai-monitor@v0.5.0:docs/_theme/search.json
              tracked: GitHub Pages が `docs/` から Jekyll でサイトを作る
      - type: folder
        name: architecture
        contents: アーキテクチャ図
        content_types:
          - design_doc
          - index
        naming:
          - ARCH-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: nonfunctional
        contents: 非機能要件
        content_types:
          - design_doc
          - index
        naming:
          - NFR-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: scenario
        contents: 複合・単一ユースケースのシナリオ
        content_types:
          - design_doc
          - index
        naming:
          - SC-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: interface
        contents: インターフェース定義
        content_types:
          - design_doc
          - index
        naming:
          - IF-{issue}-{n}.{lang}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: module
        contents: モジュール構成と、分類ごとのまとめの設計書
        content_types:
          - design_doc
          - index
        naming:
          - MOD-{issue}-{n}.yaml
          - MOD-{issue}-{n}.{lang}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: component
        contents: 部品設計
        content_types:
          - design_doc
          - index
        naming:
          - CMP-{issue}-{n}.{lang}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: screen
        contents: 画面設計
        content_types:
          - design_doc
          - index
        naming:
          - SCR-{issue}-{n}.{lang}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: config
        contents: 設定
        content_types:
          - design_doc
          - index
        naming:
          - CFG-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: er
        contents: ER 図
        content_types:
          - design_doc
          - index
        naming:
          - ER-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: data
        contents: データの設計書（ER 図のテーブルのカラムが保存するキー）
        content_types:
          - design_doc
          - index
        naming:
          - DATA-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: external-api
        contents: 外部 API
        content_types:
          - design_doc
          - index
        naming:
          - API-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: library
        contents: 外部ライブラリ・外部ツール
        content_types:
          - design_doc
          - index
        naming:
          - LIB-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: test-procedure
        contents: テスト実行方法
        content_types:
          - design_doc
          - index
        naming:
          - TP-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: dev-command
        contents: 開発コマンド
        content_types:
          - design_doc
          - index
        naming:
          - CMD-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: layout
        contents: フォルダ構成
        content_types:
          - design_doc
          - index
        naming:
          - LAY-{issue}-{n}.yaml
          - index.yaml
          - README.md
      - type: folder
        name: guide
        contents: 利用者が参照する公開ドキュメント（はじめに・使用方法・リファレンス）と、その目次と管理用の YAML
        content_types:
          - public_doc
          - pages
        naming:
          - '{page}.md'
          - '{category}-{page}.md'
          - '{page}.mark.md'
          - '{category}-{page}.mark.md'
          - index.yaml
          - README.md
          - files.yml
      - type: folder
        name: mock
        contents: モック HTML。部品・画面・スタイル・参考の種類のフォルダに分ける
        content_types:
          - mock
        children:
          - type: file
            name: index.md
            contents: モックの目次
          - type: file
            name: files.yml
            contents: '`docs/mock/` のファイルの一覧（project-index の files の行）'
            content_types:
              - file_list
          - type: folder
            name: assets
            contents: 全てのモックが読み込む採用スタイルの外観と、テーマの配色
            content_types:
              - mock
            children:
              - type: file
                name: style.css
                contents: 採用スタイルの変数の値
              - type: folder
                name: themes
                contents: テーマごとの配色の値
                content_types:
                  - mock
                naming:
                  - theme-{theme}.css
          - type: folder
            name: components
            contents: 部品ごとのモック
            content_types:
              - mock
            naming:
              - index.md
            children:
              - type: folder
                name: '{component}'
                contents: 1 つの部品のモックと、その部品のカタログだけの外観
                content_types:
                  - mock
                naming:
                  - index.html
                  - style.css
          - type: folder
            name: pages
            contents: 画面の種類ごとの、作業 PR の案のモック
            content_types:
              - mock
            naming:
              - index.md
            children:
              - type: folder
                name: '{screen}'
                contents: 1 つの画面の種類のモック（document・bundle・vscode-preview・ui-canvas）
                content_types:
                  - mock
                naming:
                  - index.md
                children:
                  - type: folder
                    name: '{pr}'
                    contents: 1 つの作業 PR で作った案の一覧
                    content_types:
                      - mock
                    naming:
                      - index.md
                    children:
                      - type: folder
                        name: '{variant}'
                        contents: 1 つの案のモック HTML と、その外観と動き
                        content_types:
                          - mock
                        naming:
                          - index.html
                          - index.md
                          - style.css
                          - print.css
                          - app.js
                          - '{name}.css'
                        children:
                          - type: folder
                            name: images
                            contents: 案のモックが表示する画像
                            content_types:
                              - mock
                            naming:
                              - '{name}.svg'
          - type: folder
            name: refs
            contents: 作業 PR ごとの、案を比べる参考のモック
            content_types:
              - mock
            naming:
              - index.md
            children:
              - type: folder
                name: '{pr}'
                contents: 1 つの作業 PR の参考のモック
                content_types:
                  - mock
                naming:
                  - index.md
                children:
                  - type: folder
                    name: assets
                    contents: 参考のモックが読み込む見本のデータ・外観・動き
                    content_types:
                      - mock
                    naming:
                      - '{name}.js'
                      - '{name}.css'
                      - '{name}.svg'
                    children:
                      - type: folder
                        name: media
                        contents: 参考のモックが表示する画像・動画・音声
                        content_types:
                          - mock
                        naming:
                          - '{name}.{ext}'
                      - type: folder
                        name: mdmark
                        contents: 参考のモックが読み込む mdmark の配布物
                        content_types:
                          - mock
                        generated_from:
                          path: dist/
                          command: CMD-472-1#categories[ビルド・生成]
                          tracked: 参考のモックが、作った時点の mdmark の配布物を読み込む
          - type: folder
            name: styles
            contents: デザインスタイルの候補とテーマの見本
            content_types:
              - mock
            naming:
              - index.md
            children:
              - type: folder
                name: '{style}'
                contents: 1 つのスタイルかテーマの見本の画面
                content_types:
                  - mock
                naming:
                  - index.html
                  - style.css
      - type: folder
        name: pr
        contents: 作業 PR ごとの計画書と記録
        content_types:
          - pr_doc
        children:
          - type: folder
            name: '{pr}'
            contents: 1 つの作業 PR の計画書と記録
            content_types:
              - pr_doc
            naming:
              - README.md
              - 要件.md
              - 要件.yaml
              - タスク一覧.yaml
              - 確認ログ.yaml
              - '{subsystem}.md'
            children:
              - type: folder
                name: テスト結果
                contents: テストと検査の実行結果のログ
                content_types:
                  - pr_doc
                naming:
                  - '{timestamp}_{commit}_{test}.log'
                  - '{timestamp}_{commit}_{test}.{ext}'
                  - '{test}.log'
              - type: folder
                name: 反映作業
                contents: マージの前後の反映作業の一覧と、作業ごとのスクリプト
                content_types:
                  - pr_doc
                children:
                  - type: file
                    name: index.yaml
                    contents: 反映作業の一覧
                  - type: folder
                    name: '{work}'
                    contents: 1 つの反映作業のスクリプトと dry-run のログ
                    content_types:
                      - pr_doc
                    naming:
                      - 疎通確認.{ext}
                      - 実行.{ext}
                      - 確認.{ext}
                      - 切り戻し.{ext}
                      - dry-run.log
                      - '{module}.py'
              - type: folder
                name: 作業
                contents: 作業 PR の中で使用したスクリプトとログ
                content_types:
                  - pr_doc
                naming:
                  - '{name}.{ext}'
              - type: folder
                name: 実測
                contents: 作業 PR の中で測った値のログ
                content_types:
                  - pr_doc
                naming:
                  - '{timestamp}_{name}.log'
  - type: folder
    name: migrations
    contents: mdmark upgrade が適用する、バージョンごとの移行の手順
    content_types:
      - migration
      - cli
    children:
      - type: file
        name: no-steps.yaml
        contents: 移行の手順が要らない設定・索引のスキーマの変更の一覧
      - type: file
        name: files.yaml
        contents: '`migrations/` のファイルの一覧（project-index の files の行）'
        content_types:
          - file_list
      - type: folder
        name: '{version}'
        contents: 1 つのバージョンの移行の手順と移行のスクリプト（出していないバージョンは `next`）
        content_types:
          - migration
          - cli
        naming:
          - steps.yaml
          - '{step}.mjs'
          - '{step}.d.mts'
        children:
          - type: file
            name: '{step}.js'
            contents: 移行のスクリプトが読み込む、`src/` の処理と依存をまとめたファイル
            generated_from:
              path: src/
              command: CMD-472-1#categories[ビルド・生成]
              tracked: mdmark upgrade が、入れたパッケージの移行の手順のフォルダから読み込む
          - type: file
            name: THIRD_PARTY_LICENSES.txt
            contents: '`{step}.js` にまとめた依存のライセンス'
            generated_from:
              path: src/
              command: CMD-472-1#categories[ビルド・生成]
              tracked: まとめた依存のライセンスを `{step}.js` と一緒に配る
  - type: folder
    name: plugin
    contents: Claude Code プラグインの本体。手で記載する定義・スキルと、ビルドが書き込むフックの本体を配置する
    content_types:
      - claude_plugin
    children:
      - type: folder
        name: .claude-plugin
        contents: プラグインの定義
        content_types:
          - plugin_manifest
          - claude_plugin
        children:
          - type: file
            name: plugin.json
            contents: 名前・説明・バージョン（バージョンはビルドが書き込む）
      - type: file
        name: guide-index.yaml
        contents: ガイドの名前・案内する場面・指す `docs/guide/` のページの索引（ビルドが検査し、プラグインは参照しない）
        content_types:
          - guide_index
          - claude_plugin
      - type: file
        name: .mcp.json
        contents: MCP の常駐サーバーへのつなぎ方
        content_types:
