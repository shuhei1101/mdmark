id: SC-472-67
visibility: internal
title: "画像・動画・音声を配置する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 属性とキャプションを持つ画像の Markdown
        description: 画像だけの段落 `![グラフ](chart.png "売上の推移"){width=300 align=center}` と、本文の段落の前に配置した `![写真](photo.png){width=40% align=left}` を持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。画像は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 画像の後ろの属性を読み込む
        M-->>P: 幅と配置を適用した図と画像を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 1 つ目の画像が `figure` に入り、キャプションが `売上の推移`、画像の幅が 300px で、図が本文の列の中央にある
      - 2 つ目の画像の幅が本文の列の 40% で左に配置され、後ろの段落の文字が画像の右に回り込んでいる
      - 本文に `{width=300 align=center}` などの属性の文字が出ていない
      - 記載の警告が出ていない
    test: test_normal
  - name: 正常シナリオ（ギャラリー）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ。画面の幅は 1280px
      - name: ギャラリーの Markdown
        description: '`<!-- fig: {"id": "shots"} -->` の後ろに、`<!-- gallery: {"columns": 3} -->` 〜 `<!-- /gallery -->` で 6 つの画像を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 3 列の格子に並べ、サブ図の番号を付けた画像を描く
        P-->>U: 文書を表示
        U->>P: 画面の幅を 390px にする
        P-->>U: 列を減らした格子
      ```

      <!-- /map -->
    expected:
      - 6 つの画像が 3 列 2 行の格子に並んでいる
      - 画像に `図 1a`〜`図 1f` のサブ図の番号が付いている
      - 画面の幅が 390px のとき、格子の列が 3 より少なく、横スクロールが出ない
    test: test_normal_when_gallery
  - name: 正常シナリオ（テーマごとの画像）
    setup:
      - name: mdmark を読み込むページ
        description: '正常シナリオと同じ。OS の配色はライト（`prefers-color-scheme: light`）'
      - name: テーマごとの画像の Markdown
        description: '`![構成](arch-dark.png#only-dark)` と `![構成](arch-light.png#only-light)` を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: テーマごとの class を付けた画像を描く
        P-->>U: ライトに合う画像だけを表示
        U->>P: OS の配色をダークにする
        P-->>U: ダークに合う画像だけを表示
      ```

      <!-- /map -->
    expected:
      - ライトのとき、`arch-light.png` が表示され、`arch-dark.png` が表示されていない
      - ダークにした後、`arch-dark.png` が表示され、`arch-light.png` が表示されていない
    test: test_normal_when_theme_images
  - name: 正常シナリオ（動画と音声）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 動画と音声の Markdown
        description: '`![操作の様子](demo.mp4 "保存までの操作"){autoplay loop poster=demo.png}` と `![読み上げ](voice.mp3)` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ。動画・音声・ポスターの画像は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 拡張子で動画と音声を判断する
        M-->>P: 再生バー付きの video と audio を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 1 つ目が `controls`・`autoplay`・`muted`・`loop` と `poster` に `demo.png` を持つ `video` で、キャプションが `保存までの操作`
      - 2 つ目が `controls` を持つ `audio` で、キャプションは付いていない
      - '`autoplay` に `muted` を記載していないが、`video` が `muted` を持つ'
    test: test_normal_when_video_and_audio
  - name: 正常シナリオ（GIF を止める・再生する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: GIF の Markdown
        description: 無限ループで、フレームの間隔が 100ms の `anim.gif` の画像を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 止めるボタンを付けた GIF を描く
        U->>P: 止めるボタンを押す
        P-->>U: 止まった GIF
        U->>P: 再生するボタンを押す
        P-->>U: 動く GIF
      ```

      <!-- /map -->
    expected:
      - ボタンを押す前、500ms 空けて撮った 2 枚の GIF の範囲の画素が変わる
      - 止めるボタンを押した後、500ms 空けて撮った 2 枚の画素が一致し、ボタンの `aria-pressed` が `true` で、文言が再生するに変わる
      - もう一度押した後、2 枚の画素が変わり、`aria-pressed` が `false`
      - ボタンは Tab でフォーカスでき、`aria-label` を持つ
      - 止める・再生するで外への要求が増えない
    test: test_normal_when_gif_toggled
  - name: 正常シナリオ（動きを減らす設定の GIF）
    setup:
      - name: mdmark を読み込むページ
        description: '正常シナリオと同じ。`prefers-reduced-motion: reduce`'
      - name: GIF の Markdown
        description: 正常シナリオ（GIF を止める・再生する）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 止めた状態の GIF を描く
        P-->>U: 止まった GIF
      ```

      <!-- /map -->
    expected:
      - 描いた直後、500ms 空けて撮った 2 枚の GIF の範囲の画素が一致する
      - ボタンの `aria-pressed` が `true` で、文言が再生する
    test: test_normal_when_reduced_motion
  - name: 異常シナリオ（読み込めない属性）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 読み込めない属性の Markdown
        description: '`![グラフ](chart.png){width=big align=center foo}` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: width の値と foo を読み込めない
        M-->>P: 記載の警告と、読み込めた属性だけを適用した画像を描く
        P-->>U: 記載の警告と画像を表示
      ```

      <!-- /map -->
    expected:
      - 画像の上に、`width=big` の値と `foo` を読み込めないことと、記載できる属性を記載した記載の警告がある
      - 画像は中央に配置され、幅は指定していないときと同じ
    test: test_error_when_attribute_invalid
  - name: 正常シナリオ（表のセルの中の動画と音声）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 表のセルの中の動画と音声の Markdown
        description: 3 行の表の列に、`![素材 1](m1.mp4)`・`![素材 2](m2.mp4 "操作の画面")`・`![読み上げ](voice.mp3)` を 1 つずつ記載した文書
        notes: 属性は記載しない
      - name: Mock
        description: 正常シナリオと同じ。動画・音声は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 表のセルの中の動画と音声を、モーダルで再生するものにする
        M-->>P: セルに再生のボタンを描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 3 つのセルのそれぞれに押せるボタンがあり、スクリーンリーダー向けの名前に `素材 1`・`素材 2`・`読み上げ` を持つ
      - セルの中に、再生バーを持つ動画・音声と、読み込めない画像が無い
      - ボタンを押すまで、動画・音声の本体を要求しない
      - 記載の警告が出ていない
    test: test_normal_when_media_in_table_cell
  - name: 正常シナリオ（モーダルで再生する属性）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: modal の属性を持つ動画の Markdown
        description: 動画だけの段落 `![操作の様子](demo.mp4 "保存までの操作"){modal}`、文の途中の `手順は ![手順](steps.mp4){modal} で確認する。` の段落、属性の無い動画だけの段落 `![操作](demo2.mp4)` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ。動画は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: modal の属性を読み込む
        M-->>P: modal の動画は再生のボタン、属性の無い動画は再生バー付きの図で描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 1 つ目の段落の場所に、スクリーンリーダー向けの名前に `操作の様子` を持つボタンがあり、再生バーを持つ動画が無い
      - 2 つ目の段落の文の `手順は` と `で確認する。` の間に、スクリーンリーダー向けの名前に `手順` を持つボタンがあり、段落の後ろに動画の図が無い
      - 3 つ目は今までどおり、`controls` を持つ `video` の図
      - 本文に `{modal}` の文字が出ておらず、記載の警告が出ていない
    test: test_normal_when_modal_attribute
  - name: 異常シナリオ（画像に記載した modal）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 画像に modal を記載した Markdown
        description: '`![グラフ](chart.png){modal width=300}` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 画像の modal を読み込めない
        M-->>P: 記載の警告と、modal を除いた属性を適用した画像を描く
        P-->>U: 記載の警告と画像を表示
      ```

      <!-- /map -->
    expected:
      - 画像の上に、`modal` を読み込めないことと、記載できる属性を記載した記載の警告がある
      - 画像の幅は 300px で、ライトボックスで拡大できる画像の図のまま
    test: test_error_when_modal_on_image
  - name: 正常シナリオ（サムネイルの属性）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: thumbnail の属性を持つ動画の Markdown
        description: 表のセルに `![素材 1](m1.mp4){thumbnail poster=m1.png}`・`![素材 2](m2.mp4)` を記載し、動画だけの段落 `![操作の様子](demo.mp4){modal thumbnail poster=demo.png}` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ。動画・ポスターの画像は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: thumbnail の属性を読み込む
        M-->>P: thumbnail の動画は poster のサムネイル、そのほかのモーダルの動画はラベルのボタンで描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 素材 1 のセルと段落の場所に、`m1.png`・`demo.png` の画像を持ち、スクリーンリーダー向けの名前に `素材 1`・`操作の様子` を持つボタンがある
      - 素材 2 のセルは、画像を持たず、スクリーンリーダー向けの名前に `素材 2` を持つボタン（既定のボタン）
      - ボタンを押すまで、動画の本体を要求しない
      - 本文に `{thumbnail` の文字が出ておらず、記載の警告が出ていない
    test: test_normal_when_thumbnail_attribute
  - name: 正常シナリオ（設定の既定の幅で動画を描く）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ。設定に、動画の描画時の幅の既定を本文の幅の 50% と記載する
        notes: キーの名前はインターフェース定義で決める。画面の幅は 1280px
      - name: 動画の Markdown
        description: 属性の無い動画だけの段落 `![素材 1](clip.mp4)` と、`![素材 2](clip.mp4){width=320}` の動画だけの段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ。動画は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 動画の既定の幅を持つ設定と Markdown を指定して描かせる
        M-->>P: 属性の無い動画を既定の幅で、width の動画をその幅で描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 1 つ目の動画の幅が本文の幅の 50%
      - 2 つ目の動画の幅は 320px（動画ごとの `{width=…}` を設定より優先する）
      - 設定に既定の幅を記載しなければ、属性の無い動画は今までどおり本文の幅いっぱいで描かれる
      - 記載の警告が出ていない
    test: test_normal_when_default_video_width
  - name: 正常シナリオ（音声の再生バーの全体を出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: Chromium・Firefox・WebKit で開く。画面の幅は 1280px と 390px
      - name: 音声の Markdown
        description: 音声だけの段落 `![読み上げ](voice.mp3 "セリフの音声")` と、キャプションの無い `![読み上げ](voice.mp3)`、動画 `![操作](demo.mp4)` と画像 `![グラフ](chart.png)` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ。動画・音声は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 再生バーの高さの全体を入れた図で audio を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - どのブラウザ・画面の幅でも、`audio` の再生バーの上端から下端までが図の中に入り、図とその祖先の要素の `overflow` で切られていない
      - '`audio` の描いた高さが、ブラウザが再生バーに取る高さより小さくない'
      - キャプションのある音声は、キャプションが再生バーの下にあり、再生バーと重ならない
      - 同じ文書の動画の図・動画のリサイズハンドル・画像の図の位置と大きさが、修正する前と同じ
    test: test_normal_when_audio_controls_fully_visible
lead: 文書の作成者が、画像の後ろの属性でサイズと配置を指定し、title をキャプションにし、ギャラリーのマーカーで画像を格子に並べ、テーマごとに出す画像を分け、動画・音声・GIF を画像と同じ記載方法で配置すると、mdmark がそれぞれ図・格子・再生バー・止める・再生するボタンで描く。
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 画像・動画・音声を本文の中で確認して、聞ける。動く GIF を止められる
trigger: 利用側のページが、画像・動画・音声を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 画像の属性・ギャラリー・動画・音声・GIF の機能がオン（既定）
success_guarantee: 属性のとおりの幅と配置で画像が描かれ、title がキャプションになる。ギャラリーは指定した列の格子に並ぶ。動画と音声は再生バー付きで描かれ、GIF は止める・再生するボタンを持つ。GitHub では画像とリンクとして読み込める。
minimal_guarantee: 読み込めない属性は記載の警告で通知し、読み込めた属性だけを適用して描く。
test_file: tests/e2e/単一ユースケース/画像・動画・音声を配置する.spec.ts
tags:
  - name: topic:画像
    main: true
  - name: topic:動画
  - name: topic:音声
