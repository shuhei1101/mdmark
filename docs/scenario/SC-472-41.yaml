id: SC-472-41
visibility: internal
title: 図を巡回する
lead: 読者が、map の構成図の補足に記載された案内の手順を、前へ・次へで進め、手順ごとの入るグループ・強調するノードと説明の文を読む。
test_file: tests/e2e/単一ユースケース/図を巡回する.spec.ts
primary_actor: 読者
trigger: 読者が、文書の作成者が用意した順番で構成図を読みたくなる
preconditions:
  - 文書に、補足の `walkthroughs` に手順 3 つの案内を持つ map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 手順ごとに、指定の段で図が表示され、強調するノードが表示する枠に収まり、説明の文が出る。手順のバーで全体の中の今の手順が分かり、離れた手順へ 1 回の操作で移れる。巡回を終えると、始めた段へ戻る。
minimal_guarantee: 手順が指すノード・グループが図に無いときは、その指定を飛ばして説明の文を出し、書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 手順 3 つの案内を持つ map の構成図を描いたページ
        notes: 手順 1 は全体の図でノード 1 つを強調し、手順 2 は全体の図でデータのノード 3 つを強調し、手順 3 はグループの中へ入ってノード 2 つを強調する
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 図の枠の下の案内の帯の次へを押す
        D-->>U: 手順 1 の説明と強調を出す
        U->>D: 次へを押す
        D-->>U: 手順 2 の 3 つのノードを強調し、説明を出す
        U->>D: 手順のバーの 3 つ目の区切りを押す
        D-->>U: 手順 3 のグループに入り、2 つのノードが収まる位置と倍率へ図をなめらかに移して強調する
        U->>D: 前へを押す
        D-->>U: 手順 2 に戻す
        U->>D: この手順を再生を押す
        D-->>U: 手順 2 の 3 つのノードを強調し、区切りを再生の間隔をかけて塗り、手順 2 で止まる
        U->>D: 速度を 2 倍にして全て再生を押す
        D-->>U: 印の引数 interval の半分の間隔ごとに手順 3・手順 1 の順に進める
        U->>D: 停止を押す
        D-->>U: 強調を外し、始めた段と倍率の図に戻す
      ```

      <!-- /map -->
    expected:
      - 図を開いたときから図の枠の下に案内の帯があり、手順の数（– / 3）・手順のバー・前へ・停止・この手順を再生・全て再生・次への 5 つのアイコンのボタンと速度の切り替えが出る（始める前は停止が押せない）。始めると番号（1 / 3）と説明の文が出て、ボタンと速度の切り替えは同じ位置のまま。ボタンと速度の切り替えはスクリーンリーダー向けの名前を持つ
      - 手順のバーは手順の数（3）に区切られ、済んだ手順の区切りは塗られ、今の手順の区切りは他と描き分けられ、残りの手順の区切りは塗られない。始める前はどの区切りも塗られない
      - 手順のバーの区切りを押すと、前へ・次へを繰り返さずに 1 回でその手順へ移る。区切りはキーボードで選べ、スクリーンリーダー向けに手順の番号とタイトルを持つ
      - 手順 1 で、指定のノードが強調され、ほかのノードが薄くなる
      - 手順 2 で、3 つのノードが強調され、ほかのノードが薄くなる
      - 手順 3 で、指定のグループの中に入り、2 つのノードが強調され、その 2 つのノードの間の線の上を、データの印が元から先へ流れ続ける。両向きの線（`<-->`）では両方へ流れる
      - 手順を移すたび（前へ・次へ・区切り・再生）に、その手順で強調するノードを囲む範囲が表示する枠に収まる位置と倍率へ、図の枠の中がなめらかに移る。倍率は図の枠に合わせた倍率より小さくせず、読者の拡大・縮小の上限より大きくせず、囲む範囲の周りに余白を残す。文書のスクロールは変わらない
      - 読者が図の枠を触る（スクロール・ドラッグ・拡大と縮小）と、次に帯を操作するまで図を移さない
      - '動きを減らす設定（`prefers-reduced-motion: reduce`）では、図の位置と倍率を時間をかけずに移す'
      - 帯の 1 行目に、番号とボタンの間に手順のタイトルが出る。狭い幅では番号とボタンの下の行に出る
      - 前へ・次へは常に押せ、最初の手順の前へで最後の手順へ、最後の手順の次へで最初の手順へ回る。始める前の前へは最後の手順、次へは最初の手順を出す
      - この手順を再生を押すと、今の手順（始める前は手順 1）の強調と、データの印を持つ手順ではデータの印を出し、今の手順の区切りを再生の間隔をかけて塗り、塗り終えたらその手順のまま止まる
      - 全て再生を押すと、印の引数 `interval` の間隔（省くと 2 秒）を速度で割った間隔ごとに次の手順へ進み、今の手順の区切りが間隔に合わせて塗られ、最後の次は最初の手順へ戻る。全て再生のボタンは再生中に一時停止のアイコンになる
      - 速度は 0.5 倍・1 倍・2 倍から選べ、既定は 1 倍。再生中に変えると、今の手順の残りから変えた速度で進む
      - 手順を進めても、表示する枠の高さが変わらない
      - 停止を押すと、強調が外れ、案内を始めた全体の図と倍率・スクロールの位置に戻り、案内の帯は手順の数だけの状態に戻る
      - 案内の帯にフォーカスがあるときは、左右の矢印キーでも前へ・次へ進められる。図にフォーカスがあるときの矢印キーは、今の図と同じく図を動かす
      - 説明の文が読み上げの対象になる
    test: test_normal
  - name: 正常シナリオ（状態遷移図の遷移を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（状態遷移図）の状態遷移図を描いたページ。補足の `walkthroughs` を持たない
        notes: 補足の `notes` で 1 本の遷移に説明を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 状態遷移図
        U->>D: 図の枠の下の再生の帯の次へを押す
        D-->>U: 開始からの最初の遷移と、遷移先の状態を強調する
        U->>D: 次へを 2 回押す
        D-->>U: 記載の順の 3 本目の遷移と遷移先を強調し、説明を出す
        U->>D: 停止を押す
        D-->>U: 強調を外す
      ```

      <!-- /map -->
    expected:
      - 図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、遷移の数（– / 13）・手順のバー・ボタンと速度の切り替えが出る
      - 手順ごとに、Mermaid に記載した順の遷移 1 本と遷移元・遷移先の状態が強調され、ほかが薄くなり、その遷移の上をデータの印が遷移元から遷移先へ流れる
      - 帯の 1 行目に「遷移元 → 遷移先」とラベルが出て、説明を持つ遷移は帯に説明の文が出る
      - 遷移先が閉じた入れ子の状態の中にあるときは、その入れ子の状態を強調する。中へ入っているときに外の遷移の手順になると、中へ入ったまま遷移を薄い外の状態との線で強調する
      - 前へ・次へ・手順のバー・この手順を再生・全て再生・速度・停止・矢印キー・なめらかな移動の動きは、構成図の案内と同じ
    test: test_normal_when_state_played
  - name: 正常シナリオ（ER 図と状態遷移図を案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つ ER 図と、手順 2 つの案内を持つ状態遷移図を描いたページ
        notes: ER 図の手順 2 は分類の箱の中へ入ってテーブル 2 つを強調する。状態遷移図の手順 2 は入れ子の状態の中へ入って状態 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ER 図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の分類の箱の中へ入り、2 つのテーブルを強調する
        U->>D: 状態遷移図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の入れ子の状態の中へ入り、状態を強調する
      ```

      <!-- /map -->
    expected:
      - ER 図と状態遷移図の案内の帯・手順の強調・中へ入る・停止で戻る動きが、構成図の案内と同じになる
      - 案内を持つ状態遷移図では、帯が案内の手順を進め、遷移の再生は出さない
    test: test_normal_when_er_and_state_walked
  - name: 正常シナリオ（追加した種類を案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つクラス図と、手順 2 つの案内を持つアーキテクチャ図を描いたページ
        notes: クラス図の手順 2 は namespace の中へ入ってクラス 2 つを強調する。アーキテクチャ図の手順 2 は group の中へ入って service 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: クラス図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の namespace の中へ入り、2 つのクラスを強調する
        U->>D: アーキテクチャ図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の group の中へ入り、service を強調する
      ```

      <!-- /map -->
    expected:
      - クラス図とアーキテクチャ図の案内の帯・手順の強調・中へ入る・停止で戻る動きが、構成図の案内と同じになる
    test: test_normal_when_added_kinds_walked
  - name: 正常シナリオ（マインドマップを案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つマインドマップを描いたページ
        notes: 手順 1 は 1 レイヤー目の枝 2 つを強調する。手順 2 は枝の中へ入って項目 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as マインドマップ
        U->>D: 案内の帯の次へを押す
        D-->>U: 手順 1 の 2 つの枝を強調し、説明を出す
        U->>D: 次へを押す
        D-->>U: 手順 2 の枝の中へ入り、項目を強調する
        U->>D: 停止を押す
        D-->>U: 強調を外し、全体の図に戻す
      ```

      <!-- /map -->
    expected:
      - マインドマップの案内の帯・手順の強調・枝の中へ入る・停止で戻る動きが、構成図の案内と同じになる
      - 手順で強調する項目は、補足の `notes` と同じキー（ID か表示する文字）で指せる
    test: test_normal_when_mindmap_walked
  - name: 正常シナリオ（時系列の図を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（ガントチャート）・正常シナリオ（タイムライン）・正常シナリオ（Git グラフ）・正常シナリオ（ジャーニー）の図を描いたページ。どれも補足の `walkthroughs` を持たない
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ガントチャートの再生の帯の次へを 2 回押す
        D-->>U: 開始日の順の 2 つ目のタスクを強調する
        U->>D: Git グラフの再生の帯の全て再生を押す
        D-->>U: commit を記載の順に 1 つずつ強調する
        U->>D: 停止を押す
        D-->>U: 強調を外す
      ```

      <!-- /map -->
    expected:
      - 手順は、ガントチャートが開始日の順（同じ日は記載の順）のタスク、タイムラインが記載の順の期間、Git グラフが記載の順の commit、ジャーニーが記載の順のタスクで、手順ごとにその 1 つだけが強調され、ほかが薄くなる
      - 帯の 1 行目に、ガントチャートはタスク名と開始日・終了日、タイムラインは期間と出来事、Git グラフはブランチ名と commit の ID（`id:` を持たない commit は `msg:` の文字か記載順の番号）、ジャーニーはタスク名と点数が出て、補足の説明を持つ項目は帯に説明の文が出る
      - 強調する項目が閉じた section の中にあるときは、その section を強調する
      - 補足の `walkthroughs` を持つ図では、帯が案内の手順を進め、再生は出さない。案内の手順で強調する項目は、補足の `notes` と同じキーで指せる
      - 4 つの図とも、図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、手順の数・手順のバー・ボタンと速度の切り替えが出る
      - 前へ・次へ・手順のバー・この手順を再生・全て再生・速度・停止・矢印キー・なめらかな移動の動きは、構成図の案内と同じ
    test: test_normal_when_time_series_played
tags:
  - name: topic:map
    main: true
  - name: topic:案内
