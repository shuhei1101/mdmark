id: SC-472-41
visibility: internal
title: 図を巡回する
lead: 読者が、map の構成図の補足に記載された案内の手順を、手順のバーと左右の矢印で選んで繰り返し再生し、手順ごとの入るグループ・強調するノードと説明の文を読む。
test_file: tests/e2e/単一ユースケース/図を巡回する.spec.ts
primary_actor: 読者
trigger: 読者が、文書の作成者が用意した順番で構成図を読みたくなる
preconditions:
  - 文書に、補足の `walkthroughs` に手順 3 つの案内を持つ map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 手順ごとに、指定の段で図が表示され、強調するノードが表示する枠に収まり、説明の文が出る。手順のバーで全体の中の今の手順が分かり、離れた手順へ 1 回の操作で移ってその手順を繰り返し再生できる。停止すると、始めた段へ戻る。
minimal_guarantee: 手順が指すノード・グループが図に無いときは、その指定を飛ばして説明の文を出し、書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 手順 3 つの案内を持つ map の構成図を描いたページ
        notes: 手順 1 は全体の図でノード 1 つを強調し、手順 2 は全体の図でデータのノード 3 つを強調し、手順 3 はグループの中へ入ってノード 2 つを強調する
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 図の枠の下の手順のバーの 1 つ目の区切りを押す
        D-->>U: 手順 1 の説明と強調を出し、停止するまで手順 1 を繰り返し再生する
        U->>D: 右の矢印を押す
        D-->>U: 手順 2 の 3 つのノードを強調し、説明を出して繰り返し再生する
        U->>D: 3 つ目の区切りを押す
        D-->>U: 手順 3 のグループに入り、2 つのノードが収まる位置と倍率へ図をなめらかに移して繰り返し再生する
        U->>D: 3 つ目の区切りをもう一度押す
        D-->>U: 手順 3 を最初から再生し直す
        U->>D: 帯のバーと矢印以外の場所を押す
        D-->>U: 停止し、強調を外して始めた段と倍率の図に戻す
      ```

      <!-- /map -->
    expected:
      - 図を開いたときから図の枠の下に、手順の数（3）に区切った手順のバーと、その左右の前・次の手順へ移る矢印のボタンだけがあり、帯の枠線と面・番号・停止と再生のボタン・速度の切り替えは出ない。始めると帯の枠線と面が出て、バーの下に手順のタイトルと説明の文が出る。矢印のボタンはスクリーンリーダー向けの名前を持つ
      - 手順のバーは 1 行で、済んだ手順・今の手順・残りの手順の区切りが描き分けられる。始める前はどの区切りも今の手順として描かれない
      - 区切りを押すと、1 回でその手順へ移り、停止するまでその手順を繰り返し再生する。再生の間、今の手順の区切りが 1 周の時間に合わせて塗られ、塗り終えると最初から塗り直す。次の手順へは自動で進まない
      - 同じ区切りをもう一度押すと、その手順の最初から再生し直す
      - 左右の矢印を押すと、前・次の手順へ移ってその手順を繰り返し再生する。最初の手順の左の矢印で最後の手順へ、最後の手順の右の矢印で最初の手順へ回る。始める前の左の矢印は最後の手順、右の矢印は最初の手順を再生する
      - 手順 1 で、指定のノードが強調され、ほかのノードが薄くなる
      - 手順 2 で、3 つのノードが強調され、ほかのノードが薄くなる
      - 手順 3 で、指定のグループの中に入り、2 つのノードが強調され、その 2 つのノードの間の線の上を、データの印が元から先へ流れ続ける。両向きの線（`<-->`）では両方へ流れる
      - 手順を移すたび（区切り・矢印のボタン・矢印キー）に、その手順で強調するノードを囲む範囲が表示する枠に収まる位置と倍率へ、図の枠の中がなめらかに移る。倍率は図の枠に合わせた倍率より小さくせず、読者の拡大・縮小の上限より大きくせず、囲む範囲の周りに余白を残す。文書のスクロールは変わらない
      - 読者が図の枠を触る（スクロール・ドラッグ・拡大と縮小）と、次にバーか矢印のボタンを押すまで図を移さない
      - '動きを減らす設定（`prefers-reduced-motion: reduce`）では、図の位置と倍率を時間をかけずに移す'
      - 帯の中のバーと矢印のボタン以外の場所と、図の枠の中のノード・線・ボタン以外の空いた場所を押すと停止し、強調が外れ、案内を始めた全体の図と倍率・スクロールの位置に戻り、帯はバーと矢印だけの状態に戻る。図の枠の空いた場所で 4px 以上動かした操作はドラッグとして扱い、停止しない
      - 手順を進めても、表示する枠の高さが変わらない
      - 手順のバーはスライダーとしてフォーカスでき、読み上げの値に今の手順の番号とタイトルを持つ。バーにフォーカスがあるときは ← → で前後の手順へ移って再生し、Esc で停止する。矢印のボタンを押した後はフォーカスがそのボタンに残る。図にフォーカスがあるときの矢印キーは、今の図と同じく図を動かす
      - 説明の文が読み上げの対象になる
    test: test_normal
  - name: 正常シナリオ（手順が多い）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 40 の案内を持つ map の構成図を描いたページ。幅 390px と幅 1280px の画面で開く
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 幅 390px の画面で、手順のバーの 20 の区切りを押す
        D-->>U: 手順 20 の区切りを広げて、繰り返し再生する
        U->>D: 幅 1280px の画面で、同じ区切りを押す
        D-->>U: 区切りを広げずに、繰り返し再生する
      ```

      <!-- /map -->
    expected:
      - どちらの幅でも、手順のバーは折り返さずに 1 行で、区切りがバーの幅に合わせて細くなり、左右の矢印のボタンが出る
      - 区切りが 12px より細くなる幅 390px では、今の手順の区切りだけが 24px に広がり、ほかの区切りが残りの幅を分ける
      - 区切りが 12px 以上の幅 1280px では、今の手順の区切りも、ほかの区切りと同じ幅
      - 左右の矢印で手順を移すと、広がる区切りも今の手順へ移る
    test: test_normal_when_many_steps
  - name: 正常シナリオ（状態遷移図の遷移を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（状態遷移図）の状態遷移図を描いたページ。補足の `walkthroughs` を持たない
        notes: 補足の `notes` で 1 本の遷移に説明を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 状態遷移図
        U->>D: 図の枠の下の右の矢印を押す
        D-->>U: 開始からの最初の遷移と、遷移先の状態を強調して繰り返し再生する
        U->>D: 右の矢印を 2 回押す
        D-->>U: 記載の順の 3 本目の遷移と遷移先を強調し、説明を出して繰り返し再生する
        U->>D: 図の枠の空いた場所を押す
        D-->>U: 停止し、強調を外す
      ```

      <!-- /map -->
    expected:
      - 図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、遷移の数（13）に区切った手順のバーと左右の矢印のボタンが出る
      - 手順ごとに、Mermaid に記載した順の遷移 1 本と遷移元・遷移先の状態が強調され、ほかが薄くなり、その遷移の上をデータの印が遷移元から遷移先へ流れる
      - 帯のタイトルに「遷移元 → 遷移先」とラベルが出て、説明を持つ遷移は帯に説明の文が出る
      - 遷移先が閉じた入れ子の状態の中にあるときは、その入れ子の状態を強調する。中へ入っているときに外の遷移の手順になると、中へ入ったまま遷移を薄い外の状態との線で強調する
      - 手順のバー・左右の矢印・繰り返しの再生・停止・矢印キー・なめらかな移動の動きは、構成図の案内と同じ
    test: test_normal_when_state_played
  - name: 正常シナリオ（ER 図と状態遷移図を案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つ ER 図と、手順 2 つの案内を持つ状態遷移図を描いたページ
        notes: ER 図の手順 2 は分類の箱の中へ入ってテーブル 2 つを強調する。状態遷移図の手順 2 は入れ子の状態の中へ入って状態 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ER 図の案内の右の矢印を 2 回押す
        D-->>U: 手順 2 の分類の箱の中へ入り、2 つのテーブルを強調する
        U->>D: 状態遷移図の案内の右の矢印を 2 回押す
        D-->>U: 手順 2 の入れ子の状態の中へ入り、状態を強調する
      ```

      <!-- /map -->
    expected:
      - ER 図と状態遷移図の案内の帯・手順の強調・中へ入る・停止で戻る動きが、構成図の案内と同じになる
      - 案内を持つ状態遷移図では、帯が案内の手順を進め、遷移の再生は出さない
    test: test_normal_when_er_and_state_walked
  - name: 正常シナリオ（追加した種類を案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つクラス図と、手順 2 つの案内を持つアーキテクチャ図を描いたページ
        notes: クラス図の手順 2 は namespace の中へ入ってクラス 2 つを強調する。アーキテクチャ図の手順 2 は group の中へ入って service 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: クラス図の案内の右の矢印を 2 回押す
        D-->>U: 手順 2 の namespace の中へ入り、2 つのクラスを強調する
        U->>D: アーキテクチャ図の案内の右の矢印を 2 回押す
        D-->>U: 手順 2 の group の中へ入り、service を強調する
      ```

      <!-- /map -->
    expected:
      - クラス図とアーキテクチャ図の案内の帯・手順の強調・中へ入る・停止で戻る動きが、構成図の案内と同じになる
    test: test_normal_when_added_kinds_walked
  - name: 正常シナリオ（マインドマップを案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つマインドマップを描いたページ
        notes: 手順 1 は 1 レイヤー目の枝 2 つを強調する。手順 2 は枝の中へ入って項目 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as マインドマップ
        U->>D: 案内の右の矢印を押す
        D-->>U: 手順 1 の 2 つの枝を強調し、説明を出す
        U->>D: 右の矢印を押す
        D-->>U: 手順 2 の枝の中へ入り、項目を強調する
        U->>D: 図の枠の空いた場所を押す
        D-->>U: 強調を外し、全体の図に戻す
      ```

      <!-- /map -->
    expected:
      - マインドマップの案内の帯・手順の強調・枝の中へ入る・停止で戻る動きが、構成図の案内と同じになる
      - 手順で強調する項目は、補足の `notes` と同じキー（ID か表示する文字）で指せる
    test: test_normal_when_mindmap_walked
  - name: 正常シナリオ（時系列の図を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（ガントチャート）・正常シナリオ（タイムライン）・正常シナリオ（Git グラフ）・正常シナリオ（ジャーニー）の図を描いたページ。どれも補足の `walkthroughs` を持たない
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ガントチャートの右の矢印を 2 回押す
        D-->>U: 開始日の順の 2 つ目のタスクを強調して繰り返し再生する
        U->>D: Git グラフの手順のバーの 3 つ目の区切りを押す
        D-->>U: 記載の順の 3 つ目の commit を強調して繰り返し再生する
        U->>D: 図の枠の空いた場所を押す
        D-->>U: 停止し、強調を外す
      ```

      <!-- /map -->
    expected:
      - 手順は、ガントチャートが開始日の順（同じ日は記載の順）のタスク、タイムラインが記載の順の期間、Git グラフが記載の順の commit、ジャーニーが記載の順のタスクで、手順ごとにその 1 つだけが強調され、ほかが薄くなる
      - 帯のタイトルに、ガントチャートはタスク名と開始日・終了日、タイムラインは期間と出来事、Git グラフはブランチ名と commit の ID（`id:` を持たない commit は `msg:` の文字か記載順の番号）、ジャーニーはタスク名と点数が出て、補足の説明を持つ項目は帯に説明の文が出る
      - 強調する項目が閉じた section の中にあるときは、その section を強調する
      - 補足の `walkthroughs` を持つ図では、帯が案内の手順を進め、再生は出さない。案内の手順で強調する項目は、補足の `notes` と同じキーで指せる
      - 4 つの図とも、図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、手順の数に区切った手順のバーと左右の矢印のボタンが出る
      - 手順のバー・左右の矢印・繰り返しの再生・停止・矢印キー・なめらかな移動の動きは、構成図の案内と同じ
    test: test_normal_when_time_series_played
  - name: 正常シナリオ（C4Dynamic の関係を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（C4 のコンテナ図・コンポーネント図・動的図・配置図）の C4Dynamic の図と、同じ C4Dynamic に補足の `walkthroughs` で手順 2 つの案内を加えた図と、補足の `walkthroughs` を持たない C4Container の図を描いたページ
        notes: C4Dynamic は番号を持たない `Rel` 3 本、`RelIndex` 1 本、記載の順の 5 本目に `BiRel` 1 本を持ち、4 本目の関係の先の要素を囲む `Container_Boundary` を補足の `layout` で閉じて始める。案内を持たない図は、補足の `notes` で 2 本目の関係に説明を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 動的図
        U->>D: 案内を持たない図の、図の枠の下の右の矢印を押す
        D-->>U: 番号 1 の関係と両端の要素を強調して繰り返し再生する
        U->>D: 手順のバーの 2 つ目の区切りを押す
        D-->>U: 番号 2 の関係と両端の要素を強調し、説明を出して繰り返し再生する
        U->>D: 手順のバーの 4 つ目の区切りを押す
        D-->>U: 番号 4 の関係と、先の要素を囲む閉じた境界を強調して繰り返し再生する
        U->>D: 右の矢印を押す
        D-->>U: 番号 5 の両向きの関係を強調し、両方へデータの印を流して繰り返し再生する
        U->>D: 図の枠の空いた場所を押す
        D-->>U: 停止し、強調を外す
        U->>D: 案内を持つ図の右の矢印を押す
        D-->>U: 案内の手順 1 を再生する
        U->>D: コンテナ図の下を確認する
        D-->>U: 帯を出さない
      ```

      <!-- /map -->
    expected:
      - 案内を持たない図では、図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、関係の数（5）に区切った手順のバーと左右の矢印のボタンが出る
      - 手順は関係の番号（記載の順。`RelIndex` も第 1 引数によらず記載の順）の順で、手順ごとにその関係の線と両端の要素が強調され、ほかが薄くなり、その線の上をデータの印が元から先へ流れる。両向きの関係では両方へ流れる
      - '帯のタイトルに「{番号}: 元の要素 → 先の要素」と関係のラベルが出て、説明を持つ関係は帯に説明の文が出る'
      - 強調する要素が閉じた境界の中にあるときは、その境界を強調する
      - 補足の `walkthroughs` を持つ図では、帯が案内の手順を進め、関係の再生は出さない
      - 手順のバー・左右の矢印・繰り返しの再生・停止・矢印キー・なめらかな移動の動きは、構成図の案内と同じ
      - C4Container の図には、補足の `walkthroughs` を持たないため帯が出ない（C4Dynamic のほかの C4 の種類は関係を再生しない）
    test: test_normal_when_c4_dynamic_played
tags:
  - name: topic:map
    main: true
  - name: topic:案内
