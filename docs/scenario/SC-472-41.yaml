id: SC-472-41
visibility: internal
title: 図を巡回する
lead: 読者が、map の構成図の補足に記載された案内の手順を、前へ・次へで進め、手順ごとの入るグループ・強調するノードと説明の文を読む。
issue: 324
test_file: tests/e2e/単一ユースケース/図を巡回する.spec.ts
primary_actor: 読者
trigger: 読者が、文書の作成者が用意した順番で構成図を読みたくなる
preconditions:
  - 文書に、補足の `walkthroughs` に手順 3 つの案内を持つ map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 手順ごとに、指定の段で図が表示され、強調するノードと説明の文が出る。巡回を終えると、始めた段へ戻る。
minimal_guarantee: 手順が指すノード・グループが図に無いときは、その指定を飛ばして説明の文を出し、書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 手順 3 つの案内を持つ map の構成図を描いたページ
        notes: 手順 1 は全体の図でノード 1 つを強調し、手順 2 は全体の図でデータのノード 3 つを強調し、手順 3 はグループの中へ入ってノード 2 つを強調する
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 図の枠の下の案内の帯の次へを押す
        D-->>U: 手順 1 の説明と強調を出す
        U->>D: 次へを押す
        D-->>U: 手順 2 の 3 つのノードを強調し、説明を出す
        U->>D: 次へを押す
        D-->>U: 手順 3 のグループに入り、2 つのノードを強調する
        U->>D: 前へを押す
        D-->>U: 手順 2 に戻す
        U->>D: 自動で進めるを押す
        D-->>U: 印の引数 interval の間隔ごとに手順 3・手順 1 の順に進める
        U->>D: 停止を押す
        D-->>U: 強調を外し、始めた段の図に戻す
    expected:
      - 図を開いたときから図の枠の下に案内の帯があり、手順の数（– / 3）と、右端に前へ・停止・自動で進める・次への 4 つのアイコンのボタンが出る（始める前は停止が押せない）。始めると番号（1 / 3）と説明の文が出て、4 つのボタンは同じ位置のまま。画面に間隔を変える部品は無い。ボタンはスクリーンリーダー向けの名前を持つ
      - 手順 1 で、指定のノードが強調され、ほかのノードが薄くなる
      - 手順 2 で、3 つのノードが強調され、ほかのノードが薄くなる
      - 手順 3 で、指定のグループの中に入り、2 つのノードが強調され、その 2 つのノードの間の線の上を、データの印が元から先へ流れ続ける。両向きの線（`<-->`）では両方へ流れる
      - 自動で進めている間は、手順ごとに強調するノードの中心へ図の枠の中がスクロールし、文書のスクロールと倍率は変わらない。図の枠をスクロールすると、自動で進め直すまでスクロールしない。前へ・次へで進めたときは図の枠の中のスクロールの位置が変わらない
      - 帯の 1 行目に、番号と 4 つのボタンの間に手順のタイトルが出る。狭い幅では番号とボタンの下の行に出る
      - 前へ・次へは常に押せ、最初の手順の前へで最後の手順へ、最後の手順の次へで最初の手順へ回る。始める前の前へは最後の手順、次へは最初の手順を出す
      - 自動で進めると、印の引数 `interval` の間隔（省くと 2 秒）ごとに次の手順へ進み、最後の次は最初の手順へ戻る
      - 手順を進めても、表示する枠の高さと図の倍率が変わらない
      - 停止を押すと、強調が外れ、案内を始めた全体の図に戻り、案内の帯は手順の数だけの状態に戻る
      - 案内の帯にフォーカスがあるときは、左右の矢印キーでも前へ・次へ進められる。図にフォーカスがあるときの矢印キーは、今の図と同じく図を動かす
      - 説明の文が読み上げの対象になる
    test: test_normal
  - name: 正常シナリオ（状態遷移図の遷移を再生する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオ（状態遷移図）の状態遷移図を描いたページ。補足の `walkthroughs` を持たない
        notes: 補足の `notes` で 1 本の遷移に説明を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 状態遷移図
        U->>D: 図の枠の下の再生の帯の次へを押す
        D-->>U: 開始からの最初の遷移と、遷移先の状態を強調する
        U->>D: 次へを 2 回押す
        D-->>U: 記載の順の 3 本目の遷移と遷移先を強調し、説明を出す
        U->>D: 停止を押す
        D-->>U: 強調を外す
    expected:
      - 図を開いたときから図の枠の下に、シーケンス図の再生と同じ帯があり、遷移の数（– / 13）と、前へ・停止・自動で進める・次への 4 つのボタンが出る
      - 手順ごとに、Mermaid に記載した順の遷移 1 本と遷移元・遷移先の状態が強調され、ほかが薄くなり、その遷移の上をデータの印が遷移元から遷移先へ流れる
      - 帯の 1 行目に「遷移元 → 遷移先」とラベルが出て、説明を持つ遷移は帯に説明の文が出る
      - 遷移先が閉じた入れ子の状態の中にあるときは、その入れ子の状態を強調する。中へ入っているときに外の遷移の手順になると、中へ入ったまま遷移を薄い外の状態との線で強調する
      - 前へ・次へ・自動で進める・停止・矢印キーの動きは、構成図の案内と同じ
    test: test_normal_when_state_played
  - name: 正常シナリオ（ER 図と状態遷移図を案内する）
    setup:
      - name: 図を描いたページ
        description: 補足の `walkthroughs` に手順 2 つの案内を持つ ER 図と、手順 2 つの案内を持つ状態遷移図を描いたページ
        notes: ER 図の手順 2 は分類の箱の中へ入ってテーブル 2 つを強調する。状態遷移図の手順 2 は入れ子の状態の中へ入って状態 1 つを強調する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ER 図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の分類の箱の中へ入り、2 つのテーブルを強調する
        U->>D: 状態遷移図の案内の帯の次へを 2 回押す
        D-->>U: 手順 2 の入れ子の状態の中へ入り、状態を強調する
    expected:
      - ER 図と状態遷移図の案内の帯・手順の強調・中へ入る・停止で戻る動きが、構成図の案内と同じになる
      - 案内を持つ状態遷移図では、帯が案内の手順を進め、遷移の再生は出さない
    test: test_normal_when_er_and_state_walked
