id: SC-472-59
visibility: internal
title: "文書を描く"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、描く先の要素を 1 つ持つ HTML
        notes: 設定は指定しない（既定を適用する）
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表・コードブロック・リンクを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: Markdown を解析し、マーカーを取得する
        M->>M: スクリプトを落とす
        M-->>P: 要素の中に本文を描く
        P-->>U: 文書を表示
    expected:
      - 描く先の要素の中に、見出し・段落・リスト・表・コードブロック・リンクの要素がある
      - リンクの要素の `href` が Markdown に記載した URL
    test: test_normal
  - name: 正常シナリオ（本文を差し替える）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオで見本の Markdown を描いた後のページ
      - name: 差し替える Markdown
        description: 見出し `## 新しいセクション` を 1 つだけ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 差し替える Markdown を指定する
        M->>M: 本文だけを再描画する
        M-->>P: 要素の中を新しい本文にする
        P-->>U: 新しい文書を表示
    expected:
      - 描いた文書の本文（右側の目次とそのボタンを除く）が、差し替えた Markdown の見出しだけになる
      - 前の本文の段落・表が残っていない
      - 右側の目次の項目が `新しいセクション` だけになり、前の本文の見出しの項目が残っていない
    test: test_normal_when_updated
  - name: 正常シナリオ（片付ける）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオで見本の Markdown を描いた後のページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 片付けさせる
        M->>M: 描いたものとイベントを片付ける
        M-->>P: 要素の中を空にする
    expected:
      - 描く先の要素の中が空になる
      - ページに右側の目次と目次を出すボタンが残っていない
      - 片付けた後に本文の差し替えを呼んでも、要素の中に何も描かれない
    test: test_normal_when_destroyed
  - name: 正常シナリオ（未知のマーカーがある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 未知のマーカーを持つ Markdown
        description: '段落の間に `<!-- unknown: {"size": 1} -->` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: 未知のマーカーを無視する
        M-->>P: 要素の中に本文を描く
        P-->>U: マーカーの前後の段落を表示
    expected:
      - マーカーの前後の段落が描かれている
      - 本文にマーカーの文字（`<!--`・`unknown`）が出ていない
    test: test_normal_when_unknown_mark
  - name: 正常シナリオ（今の書き方のマーカー）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 今の書き方のマーカーを持つ Markdown
        description: '`<!-- table: data +total total=数量:sum -->` 〜 `<!-- /table -->` で囲んだ表と、`<!-- details: 実行の例 open -->` 〜 `<!-- /details -->` の範囲を持つ文書と、同じ中身を `<!-- table: {"kind": "data", "columns": {"数量": {"total": [{"calc": "sum"}]}}} -->`・`<!-- details: {"title": "実行の例", "open": true} -->` で記載した文書'
        notes: 今の書き方は、この記載方法を入れたマイナーバージョンの間だけ参照する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と今の書き方の Markdown を指定して描かせる
        M->>M: JSON のオブジェクトでない引数を今の書き方として参照し、JSON の記載と同じ設定にする
        M-->>P: 要素の中に本文を描く
        P->>M: 別の要素と JSON の記載の Markdown を指定して描かせる
        M-->>P: 要素の中に本文を描く
        P-->>U: 2 つの文書を表示
    expected:
      - 2 つの文書の表が、どちらも数量の合計の行を持つ同じ表で描かれている
      - 2 つの文書の details の範囲が、どちらも見出し `実行の例` の開いた状態で描かれている
      - 今の書き方の文書にも記載の警告が出ていない（今の書き方は点検（`mdmark check`）が通知する）
    test: test_normal_when_legacy_mark_args
  - name: 異常シナリオ（JSON として読めないマーカーの引数）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 読めない引数を持つ Markdown
        description: '`<!-- details: {"title": 補足} -->` 〜 `<!-- /details -->` で段落を囲んだ範囲と、型の合わない `<!-- fig: {"id": 1} -->` の後の画像を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: マーカーの引数が JSON として読めない・JSON Schema の型に合わない
        M-->>P: マーカーの場所に記載の警告と、設定を適用しない範囲と画像を描く
        P-->>U: 記載の警告と本文を表示
    expected:
      - details のマーカーの場所に、引数を JSON として読めない位置と理由を記載した記載の警告があり、範囲は既定の見出し `詳細` の閉じた折り畳みで描かれている
      - fig のマーカーの場所に、`id` には文字列を記載することを記載した記載の警告があり、画像に番号が付いていない
      - 範囲の中の段落と画像は欠けずに描かれている
    test: test_error_when_mark_args_not_json
  - name: 正常シナリオ（文書にスクリプトがある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ。スクリプトが実行されたら立つ旗を `window` で見られる
      - name: スクリプトを記載した Markdown
        description: '`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・折り畳み（`details`）を持つ文書'
        notes: どのスクリプトも、実行されたら `window` の旗を起動する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: script 要素・イベント属性・javascript: の URL を落とす
        M-->>P: 要素の中に本文を描く
        U->>P: リンクを押す
        P-->>U: スクリプトは実行されない
    expected:
      - 描いた本文に `script` 要素・`onclick` 属性・`javascript:` の URL が無い
      - リンクを押しても `window` の旗が立たない
      - 折り畳み（`details`）は描かれている
    test: test_normal_when_script_in_markdown
  - name: 正常シナリオ（索引を指定する）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、索引・描く文書の `id`・ほかの文書から算出した参照を指定して文書を描く HTML
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース` を持ち、ほかの文書の `related` が描く文書を指す索引
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を指定して描かせる
        M-->>P: 用語に下線を付け、被参照の一覧を付けて描く
        P->>M: 本文を差し替える
        M-->>P: 同じ索引で再描画する
        P-->>U: 差し替えた本文を表示
    expected:
      - 描いた直後、`ワークスペース` に下線が付き、被参照の一覧がある
      - 本文を `ワークスペース` が出る別の段落に差し替えた後も、下線と被参照の一覧がある
    test: test_normal_when_index
  - name: 正常シナリオ（元の行番号を出す）
    setup:
      - name: 配布物を読み込んだページ
        description: 正常シナリオと同じ
      - name: 行の位置が分かる Markdown
        description: 1 行目に見出し、3 行目に段落、5〜7 行目に表、9〜11 行目にコードブロックを配置した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 行の位置が分かる Markdown を指定する
        M->>M: ブロックごとに元の行番号を付けて描く
        M-->>P: 元の行番号の属性を持つ本文
        P-->>U: 文書を表示
    expected:
      - 見出し・段落・表・コードブロックの要素が、それぞれ Markdown で始まる行の番号を元の行番号の属性に持つ
      - 外観（要素の位置と色の計算値）は、元の行番号の属性が無いときと同じ
    test: test_normal_when_source_lines
  - name: 正常シナリオ（エイリアスを指定する）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、索引を指定せずに、読み込んだエイリアスを指定して文書を描く HTML
      - name: エイリアス
        description: '`term` の `ワークスペース`（説明 `話し合いの記録を配置するフォルダ`）'
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 読み込んだエイリアスと Markdown を指定して描かせる
        M-->>P: エイリアスの単語に下線を描く
        P->>M: 本文を差し替える
        M-->>P: 同じエイリアスで再描画する
        P-->>U: 差し替えた本文を表示
    expected:
      - 描いた直後、`ワークスペース` に下線が付き、ツールチップに `話し合いの記録を配置するフォルダ` が出る
      - 本文を `ワークスペース` が出る別の段落に差し替えた後も、下線が付いている
    test: test_normal_when_aliases
  - name: 正常シナリオ（テーマを選ぶ）
    setup:
      - name: テーマを選ぶ設定
        description: テーマを選ぶキーに theme-paper を記載した `opts.config`
        notes: OS の配色はライト
      - name: 見本の Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(要素, Markdown, opts.config にテーマ)
        M-->>P: 選んだテーマの値が該当した本文
        P->>M: 本文を差し替える
        M-->>P: 同じテーマのままの本文
        P-->>U: theme-paper の配色で表示
    expected:
      - 描いた直後、描く先の要素の地の色の計算値が theme-paper の明るい配色の `--mdmark-color-bg` の値
      - 本文を差し替えた後も、地の色の計算値が同じ値
      - 片付けた後、描く先の要素とページにテーマを示す class か属性が残っていない
    test: test_normal_when_theme_selected
    refs:
      - SC-472-26#scenarios[正常シナリオ]
  - name: 正常シナリオ（フロントマターを持つ文書）
    setup:
      - name: 配布物を読み込んだページ
        description: 正常シナリオと同じ
        notes: 設定は指定しない（`features.frontmatter` は既定の `false`）
      - name: フロントマターを持つ Markdown
        description: '1〜4 行目に `---`・`title: テスト`・`tags: [a, b]`・`---` のフロントマター、6 行目に `# 見出し`、8 行目に段落を配置した文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: フロントマターを持つ Markdown を指定して描かせる
        M->>M: 先頭のフロントマターを本文から除外する
        M-->>P: フロントマターを除いた本文を描く
        P-->>U: 文書を表示
    expected:
      - '描く先の要素の中に `title: テスト` と `tags: [a, b]` の文字が無い'
      - 見出しの要素は `見出し` の h1 だけで、h2 の要素が無い
      - 右側の目次に `title` を含む項目が無い
      - '`見出し` の要素と段落の要素が、それぞれ 5 と 7 を元の行番号の属性に持つ'
    test: test_normal_when_frontmatter
  - name: 正常シナリオ（閉じる行の無い先頭の区切り線）
    setup:
      - name: 配布物を読み込んだページ
        description: 正常シナリオと同じ
      - name: 閉じる行の無い Markdown
        description: 1 行目に `---`、3 行目に段落、5 行目に `## 見出し` を配置し、2 行目以降に `---` と `...` だけの行を持たない文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 閉じる行の無い Markdown を指定して描かせる
        M->>M: フロントマターが無いものとして解析する
        M-->>P: 1 行目を区切り線にした本文を描く
        P-->>U: 文書を表示
    expected:
      - 本文の先頭に区切り線（`hr`）の要素がある
      - 段落と `見出し` の h2 の要素が描かれている
    test: test_normal_when_frontmatter_unclosed
lead: 利用側のページが、要素と Markdown と設定を mdmark に指定し、ブラウザで文書を描く。描いた後に本文だけを差し替えたり、片付けたりできる。
issue: 3
primary_actor: mdmark を使用するアプリのページ
stakeholders:
  - name: 読者
    interest: Markdown の見出し・段落・リスト・表・コードブロック・リンクが文書として読み込める
  - name: 利用側のアプリの開発者
    interest: サーバーは Markdown と設定を指定するだけで、描く処理を自前で持たない
trigger: 利用側のページが、配布物を読み込んだ後に文書を描く公開関数を呼ぶ
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 描く先の要素がページにある
success_guarantee: 描く先の要素の中に、Markdown を HTML にした本文が出る。文書に記載したスクリプトは実行されない。
minimal_guarantee: 未知のマーカーや描けない箇所があっても、ほかの本文は描かれる。
test_file: tests/e2e/単一ユースケース/文書を描く.spec.ts
