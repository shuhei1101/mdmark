id: SC-472-35
visibility: internal
title: リンクをカードの格子に並べる
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
        notes: 画面と描く先の要素の幅は 1280px
      - name: cards の範囲を持つ Markdown
        description: '`<!-- cards -->` 〜 `<!-- /cards -->` で、4 つの項目のリストを囲んだ文書。1 つ目は `` `icon:book` [使用方法](使い方/README.md) `` の次の行に説明 `導入と使用方法の手順`、2 つ目は `[リファレンス](リファレンス/README.md) 名前から参照する一覧`、3 つ目は `https://example.com/docs` だけ、4 つ目は `` `icon:rocket` [始める](はじめに/README.md) ``'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。`example.com` への要求を数える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 囲んだリストの項目からリンク・説明・アイコンを読み込む
        M-->>P: カードを格子に並べた文書
        P-->>U: 文書を表示
    expected:
      - 4 つのカードが、2 列以上で横に等しい幅で並んでいる
      - 1 つ目のカードに book のアイコン・タイトル `使用方法`・説明 `導入と使用方法の手順` が出ている
      - 2 つ目のカードのタイトルが `リファレンス`、説明が `名前から参照する一覧` で、アイコンを持たない
      - 3 つ目のカードのタイトルがスキームを除いた URL `example.com/docs` で、リンクと添付のカードになっていない
      - カードはそれぞれ、記載した URL とパスを `href` に持つ 1 つのリンクで、Tab で記載した順にフォーカスできる
      - カードの class が、リンクと添付のカードの `.mdmark-card` とビューのボードの `.mdmark-view-cards` と別の名前である
      - 本文にマーカーの文字が出ていない
      - '`example.com` への要求が 0 件'
    test: test_normal
    refs:
      - SC-472-34#scenarios[正常シナリオ]
  - name: 正常シナリオ（狭い画面）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面と描く先の要素の幅は 390px
      - name: cards の範囲を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: カードを記載した順に 1 列に追加して描く
        P-->>U: 文書を表示
    expected:
      - 4 つのカードが記載した順に 1 列に追加され、各カードの幅が本文の幅と等しい
      - 文書に横のスクロールが出ていない
    test: test_normal_when_narrow
  - name: 正常シナリオ（リンクを持たない項目）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: リンクを持たない項目を囲んだ Markdown
        description: cards の範囲のリストに、`` `icon:clock` 準備中 `` の次の行に説明 `次のバージョンで追加する` を記載した項目と、リンクを持つ項目を 1 つずつ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: リンクを持たないカードとリンクのカードを並べて描く
        P-->>U: 文書を表示
    expected:
      - 1 つ目のカードに clock のアイコン・タイトル `準備中`・説明が出ていて、リンクではなく Tab でフォーカスされない
      - 2 つ目のカードはリンクで、Tab でフォーカスできる
    test: test_normal_when_item_without_link
  - name: 正常シナリオ（機能を解除する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: カードの格子の機能を解除する Markdown
        description: '先頭にカードの格子の機能を解除する `<!-- features: {...} -->` を持ち、正常シナリオと同じ cards の範囲を持つ文書'
        notes: 機能名はインターフェース定義で決める
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: 囲んだリストを今のままのリストで描く
        P-->>U: 文書を表示
    expected:
      - 囲んだ範囲が格子にならず、4 つの項目のリストで出ている
      - 3 つ目の項目は今と同じく、リストの中でリンクと添付のカードとして出ている（リンクと添付のカードの機能はオンのまま）
      - マーカーの文字と記載の警告が出ていない
    test: test_normal_when_disabled
    refs:
      - SC-472-62#
  - name: 異常シナリオ（リスト以外の中身）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: リスト以外を囲んだ Markdown
        description: cards の範囲に、段落 1 つと 2 つの項目のリストを記載した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 範囲の中身がリスト 1 つでない
        M-->>P: 記載の警告と、中身を記載したとおりに描く
        P-->>U: 記載の警告と本文を表示
    expected:
      - 範囲の上に、cards のマーカーで囲めるのはリスト 1 つであることを記載した記載の警告がある
      - 段落とリストが格子にならず、記載したとおりに出ている
    test: test_error_when_not_list
lead: 文書の作成者が `<!-- cards -->` 〜 `<!-- /cards -->` でリストを囲み、mdmark が項目ごとのリンク・説明・アイコンをカードにして格子に並べる。狭い画面では列を減らす。
issue: 218
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 入口や目次のページで、行き先の見出しと説明を見比べて選べる
trigger: 利用側のページが、cards のマーカーで囲んだリストを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - カードの格子の機能がオン（既定）
success_guarantee: 囲んだリストの項目が、押すとそのリンク先へ移るカードになって格子に並ぶ。GitHub など mdmark の無い所では元のリストのまま読み込める。
minimal_guarantee: リスト以外の中身を囲んだ範囲は、記載の警告を出して中身を記載したとおりに描く。
test_file: tests/e2e/単一ユースケース/リンクをカードの格子に並べる.spec.ts
notes:
  項目の記載方法: 項目の最初のリンクがカードのリンクとタイトルになり、その前の `icon\:名前` がアイコン、残りの文字が説明になる
