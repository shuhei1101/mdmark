id: SC-472-49
visibility: internal
title: "拡張を登録してマーカーを追加する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 拡張を登録するページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、`registerExtension` で拡張を登録してから文書を描く HTML
        notes: '`directive` は `greet`。`load` は手元の代役のモジュールを `import()` で読み込む'
      - name: 拡張のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: world -->` を持つ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。拡張の代役は、マーカーの引数をマーカーの場所に記載するモジュールを返却し、受けた要求を数える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension で拡張を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 拡張のマーカーをマーカーの場所に置き換える
        M->>X: load でモジュールを読み込む
        X-->>M: モジュール
        M-->>P: マーカーの場所に拡張が描く
        P-->>U: 文書を表示
    expected:
      - 拡張の代役への要求が 1 件
      - マーカーの場所に `world` が描かれている
      - マーカーの前後の段落が描かれている
    test: test_normal
  - name: 正常シナリオ（マーカーが無い）
    setup:
      - name: 拡張を登録するページ
        description: 正常シナリオと同じ
      - name: マーカーの無い Markdown
        description: 段落だけを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension で拡張を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 拡張を読み込まずに本文を描く
        P-->>U: 文書を表示
    expected:
      - 拡張の代役への要求が 0 件
      - 段落が描かれている
    test: test_normal_when_no_mark
  - name: 異常シナリオ（引数が Schema に合わない）
    setup:
      - name: 拡張を登録するページ
        description: 正常シナリオと同じ
        notes: '`schema` は引数を 1 つだけ、英小文字で許す'
      - name: 合わない引数のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: World 2 -->` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension で拡張を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: マーカーの引数を schema で確認する
        M-->>P: マーカーの場所に合わない項目を記載した枠、ほかは本文を描く
        P-->>U: 枠と本文を表示
    expected:
      - マーカーの場所に、合わない引数を記載した枠がある
      - 拡張の代役はマーカーの場所に描いていない
      - マーカーの前後の段落が描かれている
    test: test_error_when_args_invalid
  - name: 異常シナリオ（モジュールを読み込めない）
    setup:
      - name: 拡張を登録するページ
        description: 正常シナリオと同じ
      - name: 拡張のマーカーを持つ Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 拡張の代役が 404 を返却する。ほかは正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension で拡張を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: load でモジュールを読み込む
        X-->>M: 404
        M-->>P: マーカーの場所に通知ブロック、ほかは本文を描く
        P-->>U: 通知ブロックと本文を表示
    expected:
      - マーカーの場所に通知ブロックがあり、拡張の名前が記載されている
      - マーカーの前後の段落が描かれている
    test: test_error_when_module_not_found
  - name: 正常シナリオ（部品の定義を指定する）
    setup:
      - name: 拡張を登録するページ
        description: 正常シナリオと同じ
      - name: 部品の定義を持つマーカーの Markdown
        description: 拡張のマーカーに、タイトルと項目 3 つを持つ部品の定義（JSON）を添えた文書
      - name: Mock
        description: 正常シナリオと同じ。拡張の代役は、受けた定義のタイトルと項目の数をマーカーの場所に記載する
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension で拡張を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: load でモジュールを読み込む
        X-->>M: モジュール
        M->>X: マーカーの引数と部品の定義を指定して描かせる
        M-->>P: マーカーの場所に拡張が描く
        P-->>U: 文書を表示
    expected:
      - マーカーの場所に、定義のタイトルと項目の数 3 が描かれている
      - 部品の定義の JSON は本文にそのまま出ていない
    test: test_normal_when_definition
lead: 利用側が `registerExtension({ name, directive, load, schema })` で自分のマーカーを追加する。mdmark は文書にそのマーカーがあるときだけ `load` でモジュールを読み込み、マーカーの場所に描かせる。
issue: 4
primary_actor: 利用側のアプリの開発者
stakeholders:
  - name: 文書の作成者
    interest: 利用側が追加したマーカーを mdmark のマーカーと同じ記載方法で使用でき、引数を誤るとその場で分かる
  - name: 読者
    interest: 拡張のマーカーを使用しない文書で、拡張のモジュールの読み込みを待たない
trigger: 利用側のページが、拡張を登録してから文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 拡張のモジュールは、利用側が TypeScript か JavaScript で記載し、JavaScript として配っている
success_guarantee: 文書に拡張のマーカーがあるときだけモジュールが 1 回読まれ、マーカーの場所に描かれる。
minimal_guarantee: モジュールを読み込めない、または引数が Schema に合わないマーカーの場所には枠が出て、ほかの本文は描かれる。
test_file: tests/e2e/単一ユースケース/拡張を登録してマーカーを追加する.spec.ts
