id: SC-472-23
visibility: internal
title: "タブを切り替える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: タブの範囲を持つ Markdown
        description: '`<!-- tabs -->` 〜 `<!-- /tabs -->` で、`### macOS`・`### Windows` の 2 つの見出しと、それぞれの下の段落を囲んだ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 見出しをタブ名にしたタブを描く
        P-->>U: 1 つ目のタブの中身を表示
        U->>P: Windows のタブを押す
        P-->>U: 2 つ目のタブの中身を表示
    expected:
      - 描いた直後、`macOS` のタブの `aria-selected` が `true` で、`macOS` の段落だけが表示されている
      - '`Windows` のタブを押した後、`Windows` のタブの `aria-selected` が `true` で、`Windows` の段落だけが表示されている'
      - タブ名にした見出しは本文の見出しとして残っていない
    test: test_normal
  - name: 正常シナリオ（キーボードで切り替える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: タブの範囲を持つ Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: タブを描く
        U->>P: 1 つ目のタブにフォーカスして右矢印キーを押す
        P-->>U: 2 つ目のタブを選んで中身を表示
    expected:
      - '`Windows` のタブにフォーカスがあり、`aria-selected` が `true`'
      - '`Windows` の段落だけが表示されている'
    test: test_normal_when_keyboard
  - name: 異常シナリオ（見出しの無い範囲）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 見出しの無いタブの範囲を持つ Markdown
        description: '`<!-- tabs -->` 〜 `<!-- /tabs -->` で段落だけを囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: タブ名にする見出しが無い
        M-->>P: 記載の警告と、範囲の中身をそのまま描く
        P-->>U: 記載の警告と段落を表示
    expected:
      - 範囲の上に、タブ名にする見出しが無いことを記載した記載の警告がある
      - 範囲の中の段落が表示されている
      - タブの並び（`role="tablist"`）が無い
    test: test_error_when_no_heading
  - name: 正常シナリオ（同じ組のタブの選択を統一する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 同じ組のタブを持つ Markdown
        description: '`<!-- tabs: {"group": "os"} -->` 〜 `<!-- /tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を 2 つと、`<!-- tabs: {"group": "os"} -->` で `### macOS`・`### Linux` を囲んだ範囲を 1 つ、`group` の無い `<!-- tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を 1 つ並べた文書'
        notes: 3 つ目は `Windows` のタブ名を持たない組の仲間、4 つ目は組に入らないタブ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 4 つのタブ群を描き、どれも 1 つ目のタブを選ぶ
        U->>P: 1 つ目のタブ群の Windows のタブを押す
        P->>M: 押したタブ群を Windows に切り替える
        M->>M: 同じ group で Windows を持つタブ群を Windows に切り替える
        P-->>U: 1 つ目と 2 つ目のタブ群で Windows の中身を表示
    expected:
      - 1 つ目と 2 つ目のタブ群で、`Windows` のタブの `aria-selected` が `true` で、`Windows` の段落だけが表示されている
      - '`Windows` のタブ名を持たない 3 つ目のタブ群は、`macOS` を選んだまま'
      - '`group` の無い 4 つ目のタブ群は、`macOS` を選んだまま'
      - フォーカスは押した 1 つ目のタブ群の `Windows` のタブにある
    test: test_normal_when_same_group
  - name: 正常シナリオ（再読み込みして選んだタブで開く）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 同じ組のタブを持つ Markdown
        description: '`<!-- tabs: {"group": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲と、`group` の無い `<!-- tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書。`group` が `os` の `macOS` の中身は `#### macOS の注意` と段落を持つ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant S as localStorage
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: タブを描く
        U->>P: group が os のタブ群の Windows のタブを押す
        M->>S: os の組に Windows を残す
        U->>P: ページを再読み込みする
        P->>M: 同じ Markdown を指定して描かせる
        M->>S: os の組に残したタブ名を読み込む
        M-->>P: group が os のタブ群を Windows を選んで描く
        P-->>U: Windows の中身を表示
        U->>P: URL の末尾に #macos-の注意 を付けて再読み込みする
        P->>M: 同じ Markdown を指定して描かせる
        M-->>P: URL の ID を優先して macOS のタブを選び、見出しへ移る
        P-->>U: macOS の中身を表示
    expected:
      - 再読み込みした後、`group` が `os` のタブ群の `Windows` のタブの `aria-selected` が `true` で、`Windows` の段落だけが表示されている
      - '`group` の無いタブ群は、再読み込みした後に `macOS` を選んでいる'
      - '`#macos-の注意` を付けて再読み込みした後、覚えた `Windows` より URL の ID を優先し、`group` が `os` のタブ群の `macOS` のタブの `aria-selected` が `true` で、`macOS の注意` の見出しが画面に入っている'
    test: test_normal_when_reloaded
  - name: 異常シナリオ（選んだタブを覚えられない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: localStorage が使用できないページ
        description: ページを開く前に、`window.localStorage` を読み込むと `SecurityError` を投げるように差し替える
        notes: ブラウザの設定でサイトのデータを拒んだときの状態に該当する
      - name: 同じ組のタブを持つ Markdown
        description: '`<!-- tabs: {"group": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲を 2 つ並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant S as localStorage
        P->>M: 設定と Markdown を指定して描かせる
        M->>S: os の組に残したタブ名を読み込む
        S-->>M: 例外
        M-->>P: 1 つ目のタブを選んでタブを描く
        U->>P: 1 つ目のタブ群の Windows のタブを押す
        M->>S: os の組に Windows を残す
        S-->>M: 例外
        M-->>P: 2 つのタブ群を Windows に切り替える
        P-->>U: Windows の中身を表示
    expected:
      - 描いた直後、2 つのタブ群とも `macOS` を選んでいる
      - 押した後、2 つのタブ群とも `Windows` のタブの `aria-selected` が `true` で、`Windows` の段落だけが表示されている
      - 記載の警告は出ていない
    test: test_error_when_storage_unavailable
  - name: 異常シナリオ（値の無い group）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 値の無い group を持つ Markdown
        description: '`<!-- tabs: {"group": ""} -->` で `### macOS`・`### Windows` を囲んだ範囲と、`<!-- tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: group の値が無い
        M-->>P: 記載の警告と、group を持たないタブを描く
        U->>P: 1 つ目のタブ群の Windows のタブを押す
        P-->>U: 1 つ目のタブ群だけ Windows の中身を表示
    expected:
      - 1 つ目のタブ群の上に、`group` には 1 文字以上の文字を記載することを記載した記載の警告がある
      - 1 つ目のタブ群は `Windows` を選び、2 つ目のタブ群は `macOS` を選んだまま
    test: test_error_when_empty_group
  - name: 正常シナリオ（知らないタブの指定）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない指定を持つ Markdown
        description: '`<!-- tabs: {"grop": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲と、`<!-- tabs: {"group": "os", "fold": true} -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書'
        notes: 1 つ目は `group` の記載を誤ったキー、2 つ目は知らないキー `fold` を持つ。知らないキーは、描くときは無視し、点検（`mdmark check`）が通知する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 知らないキーを無視する
        M-->>P: 読み込めた指定だけを適用したタブ群を描く
        U->>P: 1 つ目のタブ群の Windows のタブを押す
        P-->>U: 1 つ目のタブ群だけ Windows の中身を表示
    expected:
      - どちらのタブ群の上にも記載の警告が無い
      - どちらのタブ群もタブに描かれている
      - 1 つ目のタブ群は `Windows` を選び、`group` を持つ 2 つ目のタブ群は `macOS` を選んだまま
    test: test_normal_when_unknown_option
  - name: 正常シナリオ（折りたたみに入れたタブ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 折りたたみのタブを持つ Markdown
        description: '`<!-- tabs: {"collapse": {"open": false}} -->` で `### uv`・`### pip` を囲んだ範囲と、`<!-- tabs: {"collapse": {"open": true, "title": "入れ方"}} -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 1 つ目のタブ群を閉じた折りたたみ、2 つ目を開いた折りたたみに入れて描く
        U->>P: 1 つ目の折りたたみの見出しを押す
        P-->>U: 開いたタブ群
        U->>P: pip のタブを押す
        P-->>U: pip の中身を表示
    expected:
      - 1 つ目の折りたたみの見出しが `タブ（uv・pip）` で、描いた直後はタブの並びと中身が表示されていない
      - 2 つ目の折りたたみの見出しが `collapse.title` の「入れ方」で、描いた直後から `macOS` の中身が表示されている
      - 1 つ目の見出しを押した後、`uv` のタブが選ばれ、`pip` のタブを押すと `pip` の中身だけが表示される
      - 記載の警告は出ていない
    test: test_normal_when_folded
  - name: 異常シナリオ（オブジェクトでない折りたたみの指定）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: オブジェクトでない collapse を持つ Markdown
        description: '`<!-- tabs: {"collapse": "closed"} -->` で `### macOS`・`### Windows` を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: collapse がオブジェクトでないため適用しない
        M-->>P: 記載の警告と、折りたたみに入れないタブ群を描く
        P-->>U: 記載の警告とタブ群を表示
    expected:
      - 範囲の上に、`collapse` には `open`・`title` を持つオブジェクトを記載することを記載した記載の警告がある
      - タブ群は折りたたみに入らずに描かれ、`macOS` の中身が表示されている
    test: test_error_when_collapse_not_object
  - name: 正常シナリオ（入れ子のタブ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 入れ子のタブを持つ Markdown
        description: '外側の `<!-- tabs -->` 〜 `<!-- /tabs -->` で `### macOS`・`### Windows` を囲み、`### macOS` の下に内側の `<!-- tabs -->` 〜 `<!-- /tabs -->` で `#### zsh`・`#### bash` を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: タブのマーカーの入れ子を数え、開きと閉じを対応させる
        M-->>P: 外側のタブの中に内側のタブを描く
        U->>P: 内側の bash のタブを押す
        P-->>U: bash の中身を表示
        U->>P: 外側の Windows のタブを押す
        P-->>U: Windows の中身を表示
    expected:
      - 外側のタブが `macOS`・`Windows` の 2 つで、`macOS` の中に `zsh`・`bash` の 2 つのタブがある
      - 内側の `bash` を押した後も、外側の `macOS` の `aria-selected` が `true` のまま
      - 外側の `Windows` を押した後、`Windows` の段落だけが表示されている
      - 記載の警告が無く、タブのマーカーの文字が出ていない
    test: test_normal_when_nested
  - name: 正常シナリオ（太字のタブ名）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 太字の見出しを持つ Markdown
        description: '`<!-- tabs -->` 〜 `<!-- /tabs -->` で `### **案 A**`・`### 案 B` の 2 つの見出しを囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 見出しの太字を保ったタブ名のタブを描く
        P-->>U: 文書を表示
    expected:
      - '`案 A` のタブのボタンの中のタブ名が `strong` で強調され、`案 B` のタブ名は強調されていない'
      - タブ名に `**` の文字が出ていない
      - 強調したタブ名の外観が、デザイントークンの CSS 変数で上書きできる
    test: test_normal_when_bold_tab_name
  - name: 異常シナリオ（入れ子の閉じが足りない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 閉じの足りない入れ子を持つ Markdown
        description: 正常シナリオ（入れ子のタブ）の文書から、内側の `<!-- /tabs -->` を削除した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 入れ子を数え、閉じの無い外側の開きを見つける
        M-->>P: 記載の警告と、外側の範囲の中身をタブにせずそのまま描く
        P-->>U: 文書を表示
    expected:
      - 外側のタブの開きの位置に記載の警告があり、閉じが無いことが記載されている
      - 外側の範囲の中のタブのマーカーは全てタブにならず、4 つの見出しと中身の段落が全て表示されている
    test: test_error_when_nested_unclosed
  - name: 正常シナリオ（高さの違うタブへ切り替えても見出しの位置を保つ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面の高さは 800px。タブの部品が画面の中ほどに来る位置までスクロールしてから操作する
      - name: 高さの違うタブを持つ Markdown
        description: '`<!-- tabs -->` 〜 `<!-- /tabs -->` で、段落を 30 個持つ `### 長文` と段落を 1 つ持つ `### 短文` を囲んだタブを、文書の先頭・中ほど・末尾に 1 つずつ置き、間を画面の高さの 2 倍を超える段落で埋めた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 長文のタブを選んだ 3 つのタブの部品を描く
        U->>P: 先頭・中ほど・末尾のタブの部品ごとに、短文のタブを押す
        P-->>U: 押したタブの見出しを同じ位置に残し、短文の中身を表示
        U->>P: 同じタブの部品の長文のタブを押す
        P-->>U: 押したタブの見出しを同じ位置に残し、長文の中身を表示
    expected:
      - 先頭・中ほど・末尾のどのタブの部品でも、`短文` を押した前後で、押したタブの見出しの画面の上端からの位置の差が 1px 以内
      - 先頭・中ほど・末尾のどのタブの部品でも、`長文` を押した前後で、押したタブの見出しの画面の上端からの位置の差が 1px 以内
      - 押したタブの見出しが、切り替えた後も画面の中に表示されている
    test: test_normal_when_tab_heights_differ
  - name: 正常シナリオ（上にある同じ組のタブの高さが変わっても見出しの位置を保つ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面の高さは 800px。2 つ目のタブの部品が画面の中ほどに来る位置までスクロールしてから操作する
      - name: 同じ組の高さの違うタブを持つ Markdown
        description: '`<!-- tabs: {"group": "len"} -->` 〜 `<!-- /tabs -->` で、段落を 30 個持つ `### 長文` と段落を 1 つ持つ `### 短文` を囲んだタブを 2 つ、間を画面の高さの 2 倍を超える段落で埋めて並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 長文のタブを選んだ 2 つのタブの部品を描く
