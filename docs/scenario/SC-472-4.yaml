id: SC-472-4
visibility: internal
title: ClaudeCodeにプラグインを入れる
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空の設定のフォルダ
        description: プラグインもマーケットプレイスも入っていない Claude Code の設定のフォルダ（`CLAUDE_CONFIG_DIR`）
      - name: push したブランチ
        description: ビルドした `plugin/` を含むこのブランチを GitHub へ push したもの
        notes: マーケットプレイスは `shuhei1101/mdmark#{ブランチ}` で追加する。ローカルのパスで追加するとプラグインがその場で読み込まれ、キャッシュへのコピーを確認できない
      - name: Mock
        description: なし（GitHub から実際に入れる。モデルは使用しない）
      - name: 起動した常駐サーバー
        description: ビルドしたこのリポジトリの `mdmark serve` を `MDMARK_PORT` に空いたポートを指定して起動し、そのポートで待ち受けている
        notes: '`.mcp.json` の接続先の `${MDMARK_PORT:-8782}` を同じポートで展開する。手元の `mdmark serve` が使用する 8782 を回避する'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code
        participant R as GitHub の mdmark のリポジトリ
        W->>C: claude plugin marketplace add shuhei1101/mdmark#{ブランチ}
        C->>R: .claude-plugin/marketplace.json を読み込む
        R-->>C: プラグイン mdmark の行
        C-->>W: マーケットプレイス mdmark を追加した
        W->>C: claude plugin install mdmark@mdmark
        C->>C: plugin/ をキャッシュへ写す
        C-->>W: プラグインを入れた・終了コード 0
    expected:
      - '`claude plugin marketplace add` と `claude plugin install mdmark@mdmark` がどちらも終了コード 0 で終わる'
      - '`claude plugin list --json` に `mdmark@mdmark` が有効として出、その `installPath` が設定のフォルダのプラグインのキャッシュの下で、バージョンがブランチの commit の短縮 SHA（`plugin.json` が `version` を持たない）'
      - '`installPath` に `hooks/hooks.json`・`.mcp.json`・`scripts/pre-tool-use.js`・`scripts/session-start.js`・`scripts/guide-notice.js`・`skills/global-setup/SKILL.md`・`skills/setup/SKILL.md` があり、ガイドの `guide/`・`node_modules` が無い'
      - '`installPath` の `.mcp.json` が `type: http` と接続先 `http://127.0.0.1:${MDMARK_PORT:-8782}/mcp` を持ち、`command` を持たない'
      - '`.mcp.json` の接続先につなぐと、起動した常駐サーバーが `export_html`・`build_site`・`check` のツールの一覧を返却し、`read_guide` が無い'
      - '`hooks/hooks.json` に SessionStart の行が 1 つあり、UserPromptSubmit の行と、`Write`・`Edit` を対象にする PreToolUse の行が `scripts/guide-notice.js` を起動する'
    test: test_normal
  - name: 異常シナリオ（常駐サーバーが起動していない）
    setup:
      - name: 空の設定のフォルダ
        description: 正常シナリオと同じ
      - name: push したブランチ
        description: 正常シナリオと同じ
      - name: 止めた常駐サーバー
        description: '`MDMARK_PORT` に指定した空いたポートで待ち受けるプロセスが無い'
        notes: 正常シナリオと同じく、`.mcp.json` の接続先を同じポートで展開する
      - name: Mock
        description: Claude Code の接続の代わりに、`installPath` の `.mcp.json` の接続先へ HTTP でつなぐ MCP のクライアントを使用する。モデルは使用しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code
        participant R as GitHub の mdmark のリポジトリ
        participant M as MCP のクライアント
        W->>C: claude plugin marketplace add shuhei1101/mdmark#{ブランチ}
        C->>R: .claude-plugin/marketplace.json を読み込む
        R-->>C: プラグイン mdmark の行
        W->>C: claude plugin install mdmark@mdmark
        C-->>W: プラグインを入れた・終了コード 0
        M->>M: .mcp.json の接続先へつなぐ
        M-->>W: 接続を拒否されたエラー
    expected:
      - '`claude plugin install mdmark@mdmark` が終了コード 0 で終わり、`claude plugin list --json` に `mdmark@mdmark` が有効として出る'
      - '`.mcp.json` の接続先へのクライアントの接続が、接続を拒否されたエラー（`ECONNREFUSED`）で失敗する'
    test: test_error_when_server_not_running
    notes:
      Claude Code の実機での挙動: Claude Code 2.1.310 では、この状態で開いたセッションは MCP サーバーだけが `failed` になり、常駐サーバーを起動してから `/mcp` の Reconnect でセッションをもう一度開かずにツールを呼べた（外部ライブラリ『ClaudeCode』の `verification`）
  - name: 正常シナリオ（develop の commit で更新する）
    setup:
      - name: 使い捨てのブランチで入れたプラグイン
        description: 今の HEAD の commit から使い捨てのブランチ（`e2e/plugin-update-{実行ごとに一意の値}`）を切って GitHub へ push し、空の設定のフォルダで `shuhei1101/mdmark#{そのブランチ}` をマーケットプレイスとして追加し、プラグインを入れたもの。ブランチはテストの後に、成否によらず GitHub から削除し、配るブランチ（develop・release）にテストの commit を残さない
      - name: commit を追加した使い捨てのブランチ
        description: 使い捨てのブランチへ、`plugin/` のスキルを書き換えた commit を 1 つ push したもの（`plugin.json` は変えない）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code
        participant R as GitHub の mdmark のリポジトリ
        W->>C: claude plugin marketplace update mdmark
        C->>R: ブランチの新しい commit を取得する
        W->>C: claude plugin update mdmark@mdmark
        C->>C: 新しい commit の plugin/ をキャッシュへ写す
        C-->>W: 短縮 SHA の前後と、再起動で反映すること
    expected:
      - '`claude plugin update mdmark@mdmark` が終了コード 0 で終わり、`claude plugin list --json` の `mdmark@mdmark` のバージョンが追加した commit の短縮 SHA になる'
      - 新しい `installPath` のスキルが、追加した commit の内容になる
      - '`claude plugin marketplace update mdmark` だけでは、入れたプラグインのバージョンは変わらない'
    test: test_normal_when_commit_added
lead: 文書の作成者が、mdmark のリポジトリを Claude Code のマーケットプレイスとして追加し、mdmark のプラグインを入れる。
issue: 11
primary_actor: 文書の作成者
trigger: Claude Code で mdmark の文書を記載し始める前
preconditions:
  - 文書の作成者の手元に Claude Code と git と Node 24 以降がある
  - 文書の作成者の手元から GitHub と npm のレジストリへ届く
  - '`MDMARK_PORT` のポート（無ければ既定の 8782）を、mdmark の常駐サーバーのほかに使用するプロセスが無い'
success_guarantee: プラグインが有効になり、次に開くセッションで SessionStart・PreToolUse・UserPromptSubmit のフック・`global-setup` と `setup` のスキル・MCP サーバー `plugin:mdmark:mdmark` が読み込まれる。プラグインの配置場所にはまとめたフックだけがあり、依存を入れない。
minimal_guarantee: マーケットプレイスの定義が読み込めないときは、Claude Code が理由を出してプラグインを入れない。手元の他のプラグインの設定は変わらない。常駐サーバーが起動していなくてもプラグインは入り、MCP サーバー `plugin:mdmark:mdmark` だけが接続の失敗になる。
test_file: tests/e2e/単一ユースケース/ClaudeCodeにプラグインを入れる.spec.ts
