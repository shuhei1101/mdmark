    test: test_normal_when_map_data_drift
  - name: 正常シナリオ（記法を含む純粋な .md がある）
    setup:
      - name: 記法を含む純粋な .md を持つフォルダ
        description: '正常シナリオのフォルダの文書を、5 行目に表のマーカー `<!-- table: {"kind": "data"} -->` を記載した `a.md` と、同じマーカーを記載した `b.mark.md` にし、`c.md` に GFM の表と `mermaid` のコードブロックだけを記載したもの。索引に 3 つとも記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
