      - name: 重ねる設定を持つフォルダ
        description: '上のフォルダの `mdmark.config.yaml` に `side-toc.mode: wide` を記載し、その下の `docs/` の `mdmark.config.yaml` と索引と文書はずれが無い'
      - name: Mock
