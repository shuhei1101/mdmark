        notes: キーの名前とずれの種類はインターフェース定義で決める
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark check
        W->>C: mdmark check を実行する
        C->>C: 設定の明暗の値を記載できる値と照らす
        C-->>W: 明暗のキーを指すずれの行
    expected:
      - '`mdmark.config.yaml` の明暗のキーを指すずれの行が 1 つだけあり、内容に記載した値 `sepia` と記載できる値 `light`・`dark`・`auto` が記載されている'
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_color_scheme
    refs:
      - SC-472-33#scenarios[正常シナリオ（設定で全文書の既定にする）]
  - name: 正常シナリオ（map の補足にずれがある）
    setup:
      - name: map の補足にずれを持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つに、補足にずれを持つ map の範囲 1 つと、ずれの無い map の範囲 1 つを記載したもの
        notes: ずれは、Mermaid に無いノード・線の ID を指す `notes` のキー・知らないトップレベルのキー・`--` を含む `walkthroughs` の `text` の値・印の JSON のオブジェクトの知らないキーの 4 つ
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使用しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の map の範囲の Mermaid と補足を読み込み、補足のスキーマと ID の参照を点検する
