id: SC-472-78
visibility: internal
title: 設定と索引を点検する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ずれの無いフォルダ
        description: '`mdmark init` の後に拡張子が `.mark.md` の文書 2 つを記載し、索引に 2 つとも記載し、設定の `build.include` が 2 つに該当するフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 出力がずれ 0 件を示す
      - 終了コードが 0
      - 設定・索引・文書が変わっていない
    test: test_normal
  - name: 正常シナリオ（ずれがある）
    setup:
      - name: ずれを持つフォルダ
        description: 正常シナリオのフォルダから文書 1 つを削除し、索引には残したもの。設定の `build` は `out` を持たない
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 索引のその文書の行を指す `missing_doc` の行がある
      - '`mdmark.config.yaml` の `build` を指し、`out` が無いことを示す `schema` の行がある'
      - 各行がファイル・場所・種類・内容を持ち、内容に修正方法が記載されている
      - 終了コードが 0 以外
    test: test_normal_when_drift
  - name: 異常シナリオ（設定ファイルが無い）
    setup:
      - name: 設定ファイルの無いフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init で配置できること・終了コード 0 以外
    expected:
      - 出力に設定ファイルが無いことと、`mdmark init` で配置できることが出る
      - 終了コードが 0 以外
    test: test_error_when_config_missing
  - name: 正常シナリオ（知らないマーカーがある）
    setup:
      - name: 知らないマーカーを持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つの段落の間に、記法のマーカーにも拡張にも対応表にも無い `<!-- tabz -->` を記載し、同じ文書の `markdown` のコードブロックの中にも `<!-- tabz -->` を記載したもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の本文から、知っているマーカーに該当しないマーカーを取得する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - その文書と `<!-- tabz -->` を記載した行を指す `unknown_mark` の行が 1 つだけあり、内容にマーカーの名前 `tabz` と修正方法が記載されている
      - コードブロックの中の `<!-- tabz -->` を指す行が無い
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_mark
  - name: 正常シナリオ（今の書き方のマーカーがある）
    setup:
      - name: 今の書き方のマーカーを持つフォルダ
        description: '正常シナリオのフォルダの 1 つ目の文書に `<!-- table: data filter=名前 -->` 〜 `<!-- /table -->` で囲んだ表、2 つ目の文書に `<!-- section: closed -->` と、拡張のマーカーの今の書き方の記載を持つもの。設定の `extensions` に、そのマーカーの拡張のモジュールを記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の本文から、引数が JSON のオブジェクトでないマーカーを取得する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 表・section・拡張のマーカーを指す 3 つの行があり、種類が今の書き方のマーカーで、内容に JSON のオブジェクトでの記載方法と `mdmark upgrade` での移行の案内が記載されている
      - 拡張のマーカーの行の内容に、描くときにそのマーカーを描かないことが記載されている
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_legacy_mark
  - name: 正常シナリオ（座標で書いた図がある）
    setup:
      - name: 座標で書いた図を持つフォルダ
        description: 正常シナリオのフォルダの 1 つ目の文書に `<!-- flow -->` の範囲 1 つ、2 つ目の文書に `<!-- sequence -->` の範囲 1 つを記載したもの。どちらも廃止の前のバージョンで描けた部品の定義を持つ
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使用しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の本文から、廃止した flow・sequence の範囲を取得する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - '`flow`・`sequence` の範囲の始まりの行を指す行が 1 つずつあり、種類が廃止した図の記載方法で、内容に map の範囲で記載することと `mdmark upgrade` での変換の案内が記載されている'
      - 範囲の中の部品の定義の誤りやノードの重なりを指す行は出ない
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_retired_diagram
  - name: 正常シナリオ（マーカーの設定にずれがある）
    setup:
      - name: マーカーの設定のずれを持つフォルダ
        description: '正常シナリオのフォルダの 1 つ目の文書に、知らないキーを持つ `<!-- code: {"title": "app.ts", "color": "red"} -->`、型の合わない `<!-- section: {"open": "no"} -->`、機能を削除した表の列の設定 `<!-- table: {"features": {"total": {"enabled": false}}, "columns": {"数量": {"total": [{"calc": "sum"}]}}} -->` を記載したもの'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書のマーカーの JSON のオブジェクトを、マーカーごとの JSON Schema で検証する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - '`color` を知らないキーとして指す行、`open` の型の誤りを指す行、`enabled` を `false` にした `total` の機能の列の設定 `columns.数量.total` を適用しないことを指す行の 3 つがある'
      - 各行が文書のファイルとマーカーの行を指し、内容にそのマーカーで記載できるキーか値を挙げる
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_mark_options_drift
  - name: 正常シナリオ（比べる基準を指定する）
    setup:
      - name: 組で修正する文書を持つ git のフォルダ
        description: 正常シナリオのフォルダで、索引の 2 つの文書が互いを `change_together` で記載し、全てをコミットした git のリポジトリ
      - name: 片方だけの変更
        description: コミットの後に 1 つ目の文書の本文だけを書き換える
        notes: 比べる基準には、書き換える前のコミットを指定する
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant G as git
        participant M as mdmark の点検の処理
        W->>C: mdmark check（比べる基準: 書き換える前のコミット）
        C->>G: 基準から変わったファイルを参照する
        G-->>C: 1 つ目の文書のパス
        C->>M: checkIndex（索引・文書・変わったパス）
        M-->>C: 修正漏れの行
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
      ```
    expected:
      - 2 つ目の文書を指す修正漏れの行が 1 件あり、内容に組の相手と 1 つ目の文書が変わったことが記載されている
      - 終了コードが 0 以外
      - 同じフォルダで比べる基準を指定せずに実行すると、ずれ 0 件・終了コード 0
      - 設定・索引・文書と git の履歴が変わっていない
    test: test_normal_when_base_given
  - name: 異常シナリオ（比べる基準を参照できない）
    setup:
      - name: git のフォルダ
        description: 正常シナリオ（比べる基準を指定する）と同じ
      - name: 無い基準
        description: リポジトリに無い ref の名前を比べる基準に指定する
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant G as git
        W->>C: mdmark check（比べる基準: 無い ref）
        C->>G: 基準から変わったファイルを参照する
        G-->>C: 参照できない
        C-->>W: 基準を参照できないことと修正方法の 1 文・終了コード 0 以外
      ```
    expected:
      - 出力に、指定した ref を参照できないことと修正方法が出る
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_error_when_base_unknown
  - name: 正常シナリオ（エイリアスにずれがある）
    setup:
      - name: エイリアスを読み込むフォルダ
        description: 正常シナリオのフォルダに、設定の `aliases` とエイリアスの元の YAML を配置したもの。正しい行 1 つと、誤った行を混ぜる
      - name: 誤った行
        description: 'エイリアスのスキーマに合わない行（`alias_type` が 9 つの種類に無い `memo` の行と、`metadata.name` の値を `{type: ref, field: term}` で記載した行）・`paths` に該当するファイルが無い行・YAML として読み込めないファイルを指す行・`records` の配列が無い行・`metadata` に記載した列がレコードに無い行・種類の必須のキーが空の行（`command` の `command` が空）・ほかの行と ID が重なる行・別のレコードとエイリアスの `id` が重なるレコードを持つ行'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C->>C: aliases の行ごとにエイリアスの元を読み込んで確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 誤った行ごとに、その行かエイリアスの元のファイルを指すずれの行がある
      - スキーマに合わない行・読み込めない行・必須のキーが空の行・`alias_type` が 9 つの種類に無い行・行の `id` が重なる行・エイリアスの `id` が重なる行の内容に、修正方法が記載されている
      - 正しい行を指すずれの行が無い
      - 終了コードが 0 以外
    test: test_normal_when_alias_drift
  - name: 正常シナリオ（知らないテーマの名前がある）
    setup:
      - name: 知らないテーマの名前を記載したフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` のテーマを選ぶキーに mdmark に入っていない名前 `sepia` を記載する
        notes: キーは `colorTheme`、ずれの種類は `unknown_color_theme`（インターフェース定義『設定と索引を点検する』）
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark check
        W->>C: mdmark check を実行する
        C->>C: 設定のテーマの名前を mdmark に入っているテーマと照らす
        C-->>W: テーマの名前を指すずれの行
    expected:
      - '`mdmark.config.yaml` のテーマを選ぶキーを指すずれの行が 1 つだけあり、内容に記載した名前 `sepia` と選べるテーマの名前の一覧が記載されている'
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
      - テーマを選ぶキーを持たない設定と、選べるテーマの名前を記載した設定では、このずれの行が出ない
    test: test_normal_when_unknown_theme
    refs:
      - SC-472-26#scenarios[正常シナリオ（知らないテーマの名前）]
  - name: 正常シナリオ（見つからないファイルがある）
    setup:
      - name: 点検する文書
        description: '`docs/guide.md` が、実在しない `images/missing.png`・`media/missing.mp4`・`media/missing.mp3` と、リンクだけの段落 `[仕様書](files/missing.pdf)` を持ち、`images/logo.png` を相対パスで指す'
        notes: '`images/logo.png` は `docs/` の下には無く、`assets/images/logo.png` にだけある'
      - name: 設定
        description: '`mdmark.config.yaml` のアセットのルートが `assets` を指す'
      - name: Mock
        description: なし（実ファイルを使用する）
    flow: |-
      sequenceDiagram
        actor U as 文書の作成者
        participant C as mdmark CLI
        participant F as ファイル
        U->>C: mdmark check
        C->>F: 文書を読み込み、画像・動画・音声・添付のパスを文書からの相対パスとアセットのルートで確認する
        C-->>U: 見つからないファイルのずれの一覧と終了コード 1
    expected:
      - 終了コードが 1
      - ずれの一覧に、`docs/guide.md` の行番号と `images/missing.png`・`media/missing.mp4`・`media/missing.mp3`・`files/missing.pdf` の 4 行が出る
      - アセットのルートの下にある `images/logo.png` はずれの一覧に出ない
      - ずれの種類は見つからないファイルを表す種類
      - 書き出しは行わない
    test: test_normal_when_files_missing
  - name: 正常シナリオ（図の定義にずれがある）
    setup:
      - name: 図の定義にずれを持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つに、定義の誤りを持つ ER 図の部品の定義 1 つと、定義の誤りを持つグラフの部品の定義 1 つを記載したもの。もう 1 つの文書には、ずれの無い ER 図とグラフの部品の定義を記載する
        notes: ER 図の誤りは、定義に無いテーブルを関係の先に指定したもの。グラフの誤りは、系列の値の数が項目の数と合わないもの
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使用しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の図の部品の定義を読み込み、定義を点検する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 定義の誤りを持つ ER 図とグラフの定義の場所を指す行が、定義の誤りで 1 つずつあり、内容に誤りの箇所と修正の方法が記載されている
      - ずれの無い図の定義を持つ文書を指す行が無い
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_drift
  - name: 正常シナリオ（取り込み先が無い）
    setup:
      - name: 取り込み先の無いマーカーを持つフォルダ
        description: '正常シナリオのフォルダの 1 つ目の文書に、無いファイルを指す `<!-- include: {"path": "missing.md"} -->`、2 つ目の文書に無い見出しを指す include のマーカー、無い行の範囲を指す include のマーカーを記載し、正しい取り込み先を指す include のマーカーも 1 つ記載したもの'
        notes: 行の範囲は 5 行のファイルの 8〜10 行目を指す。ずれの種類の名前はインターフェース定義で決める
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の include のマーカーの取り込み先を、文書からの相対パスで確認する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 無いファイル・無い見出し・無い行の範囲を指すマーカーごとに、その文書とマーカーの行を指すずれの行が 1 つずつあり、内容に取り込み先と、無いものと、修正の方法が記載されている
      - 正しい取り込み先を指すマーカーを指す行が無い
      - ずれの種類は取り込み先が無いことを表す種類
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_include_missing
  - name: 正常シナリオ（図のツールチップの位置に誤った値がある）
    setup:
      - name: 誤った値を記載したフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` の `tooltips.diagramPlacement` に `left` を記載する
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C-->>W: tooltips.diagramPlacement を指すずれの行・終了コード 0 以外
    expected:
      - '`mdmark.config.yaml` の `tooltips.diagramPlacement` を指す `schema` の行が 1 つだけあり、内容に記載できる値 `top`・`bottom` が記載されている'
      - 終了コードが 0 以外
      - '`tooltips.diagramPlacement` に `top` か `bottom` を記載した設定と、記載しない設定では、このずれの行が出ない'
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_placement_invalid
  - name: 正常シナリオ（重ねた設定ファイルにずれがある）
    setup:
