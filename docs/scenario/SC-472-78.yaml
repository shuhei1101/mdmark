    expected:
      - ずれを持つ map の範囲の場所を指す行が 4 つあり、無いノード・線への参照・補足の知らないキー・`--` を含む値・印の知らないキーの種類で 1 つずつ、内容に対象のキーと修正の方法が記載されている
