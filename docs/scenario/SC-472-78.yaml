        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み込み、拡張子の提案を止める設定を読む
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 標準出力が `ずれ 0 件` の 1 行
      - 終了コードが 0
      - 設定・索引・文書が変わっていない
    test: test_normal_when_extension_hint_disabled
lead: 文書の作成者が `mdmark check` を実行し、設定ファイルと索引の構造・索引と文書のずれ・書き出す対象の有無・文書の本文にある知らないマーカー・図の部品の定義のずれ・廃止した `flow`・`sequence` の範囲を、ファイル・場所・種類・内容の一覧で受け取る。
issue: 9
primary_actor: 文書の作成者
trigger: 文書や索引を書き換えた後、書き出す前にずれを確認する
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
success_guarantee: 設定の Schema に合わないところ・索引と文書のずれ（`checkIndex` が返却するもの）・`build` の対象が 0 件であること・文書の本文にある知らないマーカー・今の書き方のマーカー・マーカーの設定の JSON Schema に合わないところ・図の部品の定義の誤り・廃止した `flow`・`sequence` の範囲・include のマーカーの取り込み先が無いこと・拡張子が純粋な `.md` の文書が mdmark の記法を含むこと（設定で止めたときを除く）が、ファイル・場所・種類・内容の一覧で出る。比べる基準の git の ref を指定したときは、基準から片方の文書だけが変わった `change_together` の組も、修正漏れとして同じ一覧に出る。ずれが無ければ終了コード 0、あれば 0 以外で終わる。
minimal_guarantee: 点検は設定・索引・文書を書き換えない。設定ファイルを読み込めないときは、原因と修正方法の 1 文を出して 0 以外で終わる。
refs:
  - SC-472-70#
