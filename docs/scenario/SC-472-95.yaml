id: SC-472-95
visibility: internal
title: 雛形から1枚のHTMLを配る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空のフォルダ
        description: 文書の作成者の作業のフォルダ。何も配置していない
      - name: 見本の文書群
        description: 雛形を配置した後に文書の作成者が手で追記する。文書 3 つ（入口・用語集の表を持つ文書・Chart.js のマーカーと相対パスで指す画像を持つ文書）と、その 3 つと用語を記載した索引、設定の `build`。文書どうしをリンクでつなぐ。入口の文書は、include のマーカーで用語集の表を持つ文書の見出しの中と、作業のフォルダのコードのファイルの行の範囲を取り込み、配布物にまとめていない名前の `icon:` を見出しに持つ
      - name: Mock
        description: 外部ライブラリのマーカーのモジュールは、URL の代わりに相対パスの手元のファイルを `libraries` に記載する（書き出しがネットワークを読み込まない）
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ] --> B[設定と索引を点検する:正常シナリオ]
        B --> C[複数の文書を1枚のHTMLにまとめる:正常シナリオ]
        C --> D[まとめたHTMLで文書を行き来する:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ]"
        click B "id:SC-472-78#scenarios[正常シナリオ]"
        click C "id:SC-472-76#scenarios[正常シナリオ]"
        click D "id:SC-472-13#scenarios[正常シナリオ]"
    expected:
      - '`mdmark init` が設定・`theme.css`・索引・拡張のビルドの雛形を配置する'
      - '`mdmark check` がずれ 0 件で終了コード 0 を返却する'
      - '`mdmark build` が `build.out` に 1 枚の HTML を書き込み、終了コード 0 を返却する'
      - 書き出した HTML だけを別の空のフォルダへコピーして file:// で開くと、外への要求が 0 件
      - '`entry` の文書が描かれ、文書の一覧から 3 つの文書へ移れる'
      - 文書間のリンクから別の文書へ移れる
      - 用語のツールチップ・被参照の一覧・Chart.js の図・相対パスで指した画像が描かれる
      - 入口の文書に、取り込んだ見出しの中とコードの行の範囲が描かれ、見出しの `icon:` がアイコンで描かれる
    test: test_normal
    uses:
      - SC-472-83#scenarios[正常シナリオ]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-76#scenarios[正常シナリオ]
      - SC-472-13#scenarios[正常シナリオ]
  - name: 正常シナリオ（1 文書だけを書き出す）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: 見本の文書
        description: 雛形を配置した後に文書の作成者が手で追記する、Chart.js のマーカーと相対パスで指す画像を持つ文書 1 つ
      - name: Mock
        description: 正常シナリオと同じく、外部ライブラリは手元のファイル
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ] --> B[文書をHTMLに書き出す:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ]"
        click B "id:SC-472-56#scenarios[正常シナリオ]"
    expected:
      - '`mdmark export` が指定した出力に 1 枚の HTML を書き込み、終了コード 0 を返却する'
      - 書き出した HTML だけを別の空のフォルダへコピーして file:// で開くと、外への要求が 0 件で、文書・Chart.js の図・相対パスで指した画像が描かれる
    test: test_normal_when_single_document
    uses:
      - SC-472-83#scenarios[正常シナリオ]
      - SC-472-56#scenarios[正常シナリオ]
  - name: 異常シナリオ（点検でずれが見つかる）
    setup:
      - name: ずれを持つ文書群
        description: 正常シナリオの見本の文書群から 1 つの文書を削除し、索引には残したもの
      - name: ずれを修正した索引
        description: 1 回目の点検の後に、文書の作成者が消えた文書の行を手で削除した索引
      - name: Mock
        description: 正常シナリオと同じく、外部ライブラリは手元のファイル
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ] --> B[設定と索引を点検する:正常シナリオ（ずれがある）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[複数の文書を1枚のHTMLにまとめる:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ]"
        click B "id:SC-472-78#scenarios[正常シナリオ（ずれがある）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-76#scenarios[正常シナリオ]"
    expected:
      - 1 回目の `mdmark check` が消えた文書の `missing_doc` を出し、終了コード 0 以外を返却する
      - ずれを修正した索引での 2 回目の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - その後の `mdmark build` が 1 枚の HTML を書き込む
    test: test_error_when_drift
    uses:
      - SC-472-83#scenarios[正常シナリオ]
      - SC-472-78#scenarios[正常シナリオ（ずれがある）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-76#scenarios[正常シナリオ]
lead: 文書の作成者が、サーバーを持たずに CLI で雛形を配置し、文書と索引を書き込んで点検し、1 枚の HTML にまとめて配る。読者は受け取った HTML を file:// で開き、外を読み込まずに文書を行き来する。
issue: 9
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: サーバーを起動せずに、手元の Markdown から配れる HTML を作れる
  - name: 読者
    interest: CDN を読み込めない環境（OneDrive など Microsoft の環境）でも、受け取った 1 枚の HTML で文書と図を読み込める
trigger: 文書の作成者が、Markdown の文書群をサーバー無しで配りたくなる
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
  - 文書の作成者の手元から、設定の `libraries` に記載した URL の先へ届く
success_guarantee: '`build.out` に 1 枚の HTML ができ、読者が file:// で開くと、外への要求 0 件で `entry` の文書が描かれ、文書の一覧と文書間のリンクで全ての文書へ移れ、用語のツールチップ・被参照・外部ライブラリの図が有効になる。'
minimal_guarantee: 点検でずれが見つかったときは、ずれの一覧を出して終了コードを 0 以外にする。CLI は文書と索引を書き換えない。
refs:
  - SC-472-70#
test_file: tests/e2e/複合ユースケース/雛形から1枚のHTMLを配る.spec.ts
