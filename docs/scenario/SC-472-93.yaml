id: SC-472-93
visibility: internal
title: 固有の部品で図の文書を描いて確認する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空のフォルダ
        description: 利用側の場所。何も配置していない
      - name: 固有の部品
        description: 雛形を配置した後に利用側が `// @ts-check` と JSDoc で追記する JavaScript の部品 1 つと、その部品の外観を変える固有の CSS。設定の `extensions` に固有の部品のモジュールを記載する
      - name: 見本の図の文書
        description: map の構成図（補足の `notes` で説明を持つシステムの枠と 3 層のグループ・枠の外の外部のシステム・交差する線・ループの戻りの線・印の引数のタイトル・用語集の用語を含むノード）と、固有の部品の定義を記載した文書 1 つ。索引に文書と用語を記載する
      - name: Mock
        description: 差し替えない。外部ライブラリを使用しない部品だけで組む
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ（JavaScript の雛形を配置する）] --> B[追加するJavaScriptを型で点検する:正常シナリオ]
        B --> C[固有の部品とCSSを適用する:正常シナリオ]
        C --> G[設定と索引を点検する:正常シナリオ]
        G --> D[Mermaidと補足で図を描く:正常シナリオ]
        D --> E[図の要素のツールチップを確認する:正常シナリオ]
        E --> F[図を拡大・縮小・移動する:正常シナリオ]
        F --> I[図を拡大・縮小・移動する:正常シナリオ（リサイズハンドルで高さを変える）]
        click A "id:SC-472-83#scenarios[正常シナリオ（JavaScript の雛形を配置する）]"
        click B "id:SC-472-79#scenarios[正常シナリオ]"
        click C "id:SC-472-44#scenarios[正常シナリオ]"
        click G "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-8#scenarios[正常シナリオ]"
        click E "id:SC-472-40#scenarios[正常シナリオ]"
        click F "id:SC-472-42#scenarios[正常シナリオ]"
        click I "id:SC-472-42#scenarios[正常シナリオ（リサイズハンドルで高さを変える）]"
    expected:
      - '`mdmark init` が JavaScript の雛形と、JavaScript も点検する tsconfig を配置する'
      - 固有の部品を追記した後の `tsc --noEmit` が誤り 0 件で終了コード 0 を返却する
      - 見本の図の文書を記載した後の `mdmark check` が、map の補足のずれを含めてずれ 0 件で終了コード 0 を返却する
      - 見本の図の文書を描くと、map の構成図がシステムの枠と 3 層の入れ子の箱・枠の外の外部のシステム・タイトルつきで自動配置され、ノードと箱が重ならず、残った交差は line jump になる
      - 固有の部品が、固有の CSS の外観で描かれる
      - 補足の `notes` で説明を持つ線・ノード・システムの枠と層にフォーカスすると、それぞれのツールチップが持ち主の下に出る。ノードの中の用語にフォーカスすると、用語のツールチップが出る。どれも Esc で消える
      - 図は置き場所の幅いっぱいの枠で開き、右上のボタンとキーの `+`・`-`・`0` で拡大・縮小でき、ドラッグと矢印キーで動かせる。枠の下端のリサイズハンドルで表示する枠の高さを変えられる
    test: test_normal
    uses:
      - SC-472-83#scenarios[正常シナリオ（JavaScript の雛形を配置する）]
      - SC-472-79#scenarios[正常シナリオ]
      - SC-472-44#scenarios[正常シナリオ]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ]
      - SC-472-40#scenarios[正常シナリオ]
      - SC-472-42#scenarios[正常シナリオ]
      - SC-472-42#scenarios[正常シナリオ（リサイズハンドルで高さを変える）]
  - name: 正常シナリオ（操作できる部品を配置する）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: 見本の操作の文書
        description: スライダーとグラフと今の値を写すボタンを組み合わせた部品の定義を記載した文書 1 つ
      - name: Mock
        description: クリップボードの書き込みを許したブラウザのコンテキストで開く
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ] --> B[図を描く:正常シナリオ]
        B --> C[操作できる部品で値を変えて写す:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ]"
        click B "id:SC-472-43#scenarios[正常シナリオ]"
        click C "id:SC-472-51#scenarios[正常シナリオ]"
    expected:
      - 見本の操作の文書を描くと、スライダー・グラフ・今の値を写すボタンが描かれる
      - スライダーを動かすとグラフが新しい値で再描画される
      - 今の値を写すボタンを押すと、スライダーの今の値を JSON にした文字列がクリップボードに入る
    test: test_normal_when_interactive
    uses:
      - SC-472-83#scenarios[正常シナリオ]
      - SC-472-43#scenarios[正常シナリオ]
      - SC-472-51#scenarios[正常シナリオ]
  - name: 異常シナリオ（追加した JavaScript の型が合わない）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: 型を誤った固有の部品
        description: 正常シナリオの固有の部品のうち、配布物の型定義に合わない値を返却する 1 行を持つもの
      - name: 修正した固有の部品
        description: 1 回目の点検の後に、利用側がその 1 行を手で修正したもの
      - name: Mock
        description: 差し替えない
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ（JavaScript の雛形を配置する）] --> B[追加するJavaScriptを型で点検する:異常シナリオ（型が合わない）]
        B --> C[追加するJavaScriptを型で点検する:正常シナリオ]
        C --> D[固有の部品とCSSを適用する:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ（JavaScript の雛形を配置する）]"
        click B "id:SC-472-79#scenarios[異常シナリオ（型が合わない）]"
        click C "id:SC-472-79#scenarios[正常シナリオ]"
        click D "id:SC-472-44#scenarios[正常シナリオ]"
    expected:
      - 1 回目の `tsc --noEmit` が誤りのファイルと行を出し、終了コード 0 以外を返却する
      - 修正した後の 2 回目の `tsc --noEmit` が誤り 0 件で終了コード 0 を返却する
      - その後に描いた文書に、固有の部品が描かれる
    test: test_error_when_type_mismatch
    uses:
      - SC-472-83#scenarios[正常シナリオ（JavaScript の雛形を配置する）]
      - SC-472-79#scenarios[異常シナリオ（型が合わない）]
      - SC-472-79#scenarios[正常シナリオ]
      - SC-472-44#scenarios[正常シナリオ]
  - name: 異常シナリオ（map の補足にずれがある）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: ずれを持つ図の文書
        description: 正常シナリオの見本の図の文書から固有の部品の定義を除いた map の構成図だけの文書のうち、補足の `notes` が Mermaid に無いノードの ID を指し、補足に知らないトップレベルのキーを持つもの。索引に文書を記載する
      - name: 修正した図の文書
        description: 1 回目の点検の後に、利用側が `notes` のキーを Mermaid のノードの ID に直し、知らないキーを削除したもの
      - name: Mock
        description: 差し替えない。点検はブラウザを使用しない
    flow: |-
      flowchart TD
        A[雛形を配置する:正常シナリオ] --> B[設定と索引を点検する:正常シナリオ（map の補足にずれがある）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[Mermaidと補足で図を描く:正常シナリオ]
        click A "id:SC-472-83#scenarios[正常シナリオ]"
        click B "id:SC-472-78#scenarios[正常シナリオ（map の補足にずれがある）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-8#scenarios[正常シナリオ]"
    expected:
      - 1 回目の `mdmark check` が、ずれを持つ図の文書と map の範囲の場所を指す、無いノードへの参照と補足の知らないキーのずれを出し、終了コード 0 以外を返却する
      - 修正した後の 2 回目の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - その後に描いた文書で、直した `notes` の説明がノードのツールチップに出る
      - 点検は文書を書き換えない
    test: test_error_when_diagram_drift
    uses:
      - SC-472-83#scenarios[正常シナリオ]
      - SC-472-78#scenarios[正常シナリオ（map の補足にずれがある）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ]
lead: 利用側（ワークスペースの持ち主と、その場所で HTML を作る AI）が、雛形に固有の部品と CSS を追加して型で点検し、共通の図の部品と固有の部品で文書を描き、読者の操作で確認する。
issue: 21
primary_actor: 利用側
stakeholders:
  - name: 利用側
    interest: 図・部品を一から記載せずに、共通の部品と自分の場所の部品で外観と作法のそろった文書を作れ、追加した JavaScript の誤りを使用する前に見つけられる
  - name: 読者
    interest: 図を拡大・縮小・移動して全体と細部を読み込め、矢印・ノード・用語の詳細をツールチップで読み込める
trigger: 利用側が、自分の場所の文書に図と、その場所だけの部品・外観を追加したくなる
preconditions:
  - 利用側の手元に Node 24 以降がある
  - 利用側の場所に、配布物と同じタグの `dist/` の型定義を配置できる
success_guarantee: 利用側の場所の文書に、共通の図の部品と固有の部品が固有の CSS で描かれ、読者が図を拡大・縮小・移動でき、ツールチップで詳細を読み込める。追加した JavaScript は `tsc --noEmit` を通っている。
minimal_guarantee: 型の点検で誤りが見つかったときは、誤りのファイルと行を出して終了コードを 0 以外にする。map の補足の点検でずれが見つかったときは、文書と map の範囲の場所を指すずれの一覧を出して終了コードを 0 以外にする。点検は利用側のファイルを書き換えない。
test_file: tests/e2e/複合ユースケース/固有の部品で図の文書を描いて確認する.spec.ts
