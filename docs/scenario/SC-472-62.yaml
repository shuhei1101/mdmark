    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: map の範囲を普通の Markdown として描く
        P-->>U: 文書を表示
    expected:
      - map の図が描かれず、範囲の中の mermaid のブロックが、mermaid のコードブロックと同じく mermaid の図で描かれる
