      - 記載の警告が出ていない
    test: test_normal_when_map_disabled
lead: '利用側が設定の `features` で機能のオン・オフの既定を決め、文書の作成者が文書の `<!-- features: {"機能": true か false} -->` でその文書だけ上書きする。この Issue が持つ機能の印刷（`print`）で確認する。'
