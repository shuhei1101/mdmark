        P-->>U: 文書を表示
    expected:
      - '`見出し` の要素より前に、フロントマターの表示の要素がある'
      - 'マーカーを `<!-- features: {"frontmatter": false} -->` にして設定の `features.frontmatter` を `true` にすると、フロントマターの表示の要素も `title: テスト` の文字も無い'
