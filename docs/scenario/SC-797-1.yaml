id: SC-797-1
visibility: internal
title: アプリの画面に部品のカスタム要素を並べて項目を確認する
lead: アプリの画面が mdmark の配布物をメジャーバージョンの範囲で読み込み、ビュー・コメント・グラフ・操作できる部品・map の図のカスタム要素にアプリのデータを指定する。利用者がビューで項目を探して詳細を開き、詳細の本文にコメントを付け、図で値と構成を確認する。
primary_actor: 利用者
stakeholders:
  - name: アプリの画面
    interest: ビュー・コメント・図をアプリごとに作らず、mdmark のバージョンを上げても依存の更新とビルドをせずに部品の修正と機能に追従できる
  - name: 利用者
    interest: アプリの項目を mdmark の文書と同じ操作で探し、その場で意見を残し、値と構成を図で確認できる
trigger: 利用者が、アプリの項目から目当ての項目を探し、中身を確認して意見を残したくなる
preconditions:
  - アプリの画面が jsDelivr の mdmark の配布物を読み込む記述を持つ
success_guarantee: メジャーバージョンの範囲で読み込んだ配布物のカスタム要素に、ビュー・コメント・図が文書のマーカーと同じ外観で描かれる。項目の押下・コメントの保存・値の変更・ノードの押下がイベントでアプリへ届き、アプリが詳細を開いて保存する。
minimal_guarantee: 配布物を読み込めないときも、アプリの画面のほかの要素は動く。データに誤りがあるときは、部品の場所に誤りの通知を出す。
test_file: tests/e2e/複合ユースケース/アプリの画面に部品のカスタム要素を並べて項目を確認する.spec.ts
scenarios:
  - name: 正常シナリオ
    setup:
      - name: アプリの画面
        description: '`https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@0/dist/` の `index.js` と `index.css` を読み込み、`<mdmark-view>` に項目の一覧を指定し、項目の押下のイベントで詳細の区画を開く HTML。詳細の区画は項目の本文を `<mdmark-comments>` の中に出し、コメントの保存のイベントで受け取ったコメントを手元の配列に保存して指定し直す'
      - name: 項目のデータ
        description: タイトル・状態・担当の 3 列と 5 件。項目ごとにキーと本文を持つ
      - name: Mock
        description: jsDelivr を、`@0` の要求にビルドした `dist/` を返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[配布物を読み込む:正常シナリオ（メジャーバージョンの範囲を指定する）] --> B[部品をカスタム要素で描く:正常シナリオ（ビューを描く）]
        B --> C[部品をカスタム要素で描く:正常シナリオ（ビューの項目を押す）]
        C --> D[部品をカスタム要素で描く:正常シナリオ（コメントを付ける）]
        click A "id:SC-472-28#scenarios[正常シナリオ（メジャーバージョンの範囲を指定する）]"
        click B "id:SC-797-2#scenarios[正常シナリオ（ビューを描く）]"
        click C "id:SC-797-2#scenarios[正常シナリオ（ビューの項目を押す）]"
        click D "id:SC-797-2#scenarios[正常シナリオ（コメントを付ける）]"
      ```

      <!-- /map -->
    expected:
      - '`@0` で読み込んだ配布物の `<mdmark-view>` に、5 件の項目がボード表示で描かれる'
      - 表形式に切り替えて担当で絞り込み、目当ての項目を押すと、アプリの詳細の区画にその項目の本文が開く
      - 本文の文字を選んでコメントを保存すると、アプリの配列にコメントが保存され、選んだ文字にマーカーが付く
    test: test_normal
    uses:
      - SC-472-28#scenarios[正常シナリオ（メジャーバージョンの範囲を指定する）]
      - SC-797-2#scenarios[正常シナリオ（ビューを描く）]
      - SC-797-2#scenarios[正常シナリオ（ビューの項目を押す）]
      - SC-797-2#scenarios[正常シナリオ（コメントを付ける）]
  - name: 正常シナリオ（図で確認する）
    setup:
      - name: アプリの画面
        description: 正常シナリオと同じ配布物を読み込み、`<mdmark-param>` と `<mdmark-chart>` で項目の見積もりの推移を、`<mdmark-map>` で項目が依存する部品の構成を出す HTML。値の変更のイベントで受け取った値をグラフの定義に反映して指定し直し、ノードの押下のイベントでその部品の詳細の区画を開く
      - name: 図のデータ
        description: スライダー 1 つとグラフを持つ操作できる部品の定義、折れ線のグラフの定義、ノード 3 つと線 2 本の Mermaid の flowchart と補足
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[配布物を読み込む:正常シナリオ（メジャーバージョンの範囲を指定する）] --> B[部品をカスタム要素で描く:正常シナリオ（グラフと操作できる部品を描く）]
        B --> C[部品をカスタム要素で描く:正常シナリオ（map の図を描く）]
        click A "id:SC-472-28#scenarios[正常シナリオ（メジャーバージョンの範囲を指定する）]"
        click B "id:SC-797-2#scenarios[正常シナリオ（グラフと操作できる部品を描く）]"
        click C "id:SC-797-2#scenarios[正常シナリオ（map の図を描く）]"
      ```

      <!-- /map -->
    expected:
      - スライダーを動かすと、アプリが受け取った値でグラフの定義を指定し直し、`<mdmark-chart>` が描き直される
      - '`<mdmark-map>` のノードを押すと、アプリの詳細の区画にその部品の詳細が開く'
    test: test_normal_when_diagrams_used
    uses:
      - SC-472-28#scenarios[正常シナリオ（メジャーバージョンの範囲を指定する）]
      - SC-797-2#scenarios[正常シナリオ（グラフと操作できる部品を描く）]
      - SC-797-2#scenarios[正常シナリオ（map の図を描く）]
tags:
  - name: topic:部品
    main: true
  - name: topic:ビュー
  - name: topic:コメント
  - name: topic:図
  - name: topic:配布物
  - name: tool:jsdelivr
