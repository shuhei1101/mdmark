id: SC-472-28
visibility: internal
title: "配布物を読み込む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 配布物を読み込むページ
        description: '`dist/index.js` を `<script type="module">` で読み込み、`dist/index.css` を `<link>` で読み込む HTML'
        notes: ビルドで埋めるバージョンは `v0.0.1`
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の配信に差し替える
        notes: '`/gh/shuhei1101/mdmark@v0.0.1/dist/{ファイル}` への要求に、作業ツリーの `dist/{ファイル}` を返却する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant C as jsDelivr
        U->>P: ページを開く
        P->>C: @v0.0.1/dist/index.css と index.js を要求
        C-->>P: CSS と JavaScript
        P->>P: 公開関数を呼ぶ
        P-->>U: バージョン v0.0.1 を表示
      ```

      <!-- /map -->
    expected:
      - 公開関数が `v0.0.1` を返却する
      - ページのルート要素の CSS 変数 `--mdmark-version` の計算値が `"v0.0.1"`
    test: test_normal
  - name: 異常シナリオ（配布物を読み込めない）
    setup:
      - name: 配布物を読み込むページ
        description: 正常シナリオと同じ HTML。本文に段落を 1 つ持つ
        notes: ページが読み込むバージョンは、打っていない `v9.9.9`
      - name: Mock
        description: jsDelivr を、どの要求にも 404 を返却する手元の配信に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant C as jsDelivr
        U->>P: ページを開く
        P->>C: @v9.9.9/dist/index.css と index.js を要求
        C-->>P: 404
        P-->>U: 本文だけを表示し、コンソールに読み込めなかった旨が出る
      ```

      <!-- /map -->
    expected:
      - ページの本文の段落が表示されている
      - ブラウザのコンソールに `index.js` を読み込めなかったエラーが出る
    test: test_error_when_dist_not_found
  - name: 正常シナリオ（develop を指定する）
    setup:
      - name: develop を読み込むページ
        description: 正常シナリオと同じ HTML で、URL のバージョンの位置に `develop` を記載したもの
        notes: ビルドで埋めるバージョンは、develop のビルドの `v0.0.1+develop.abc1234`
      - name: Mock
        description: jsDelivr を、develop のビルドの `dist/` を同じパスで返却する手元の配信に差し替える
        notes: '`/gh/shuhei1101/mdmark@develop/dist/{ファイル}` への要求に、develop のビルドの `dist/{ファイル}` を返却する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant C as jsDelivr
        U->>P: ページを開く
        P->>C: @develop/dist/index.css と index.js を要求
        C-->>P: develop の先頭の commit の CSS と JavaScript
        P->>P: 公開関数を呼ぶ
        P-->>U: develop のビルドのバージョンを表示
      ```

      <!-- /map -->
    expected:
      - 公開関数が `v0.0.1+develop.abc1234` を返却する
      - ページのルート要素の CSS 変数 `--mdmark-version` の計算値が、公開関数の返却値を引用符で囲んだ文字列
    test: test_normal_when_develop
  - name: 正常シナリオ（埋めた配布物から読み込む）
    setup:
      - name: 配布物を埋めたページ
        description: '`dist/index.css` は `<style>` に持つ。`dist/index.js` と部品の配布ファイル（`dist/map.js`・`dist/view.js`・`dist/comments.js`）と、利用側が 1 つのモジュールにまとめた mermaid は `text/plain` の `<script>` に持ち、それぞれを Blob の URL にして `import()` し、部品と mermaid のモジュールを mdmark に指定してから `mount` を呼ぶ HTML'
        notes: '`mount` に指定する Markdown は map の範囲・ビューのマーカー・map が描けない種類（`pie`）の mermaid のコードブロックを 1 つずつ持ち、設定でコメントの機能をオンにする。`mount` に `commentStore`（読み込みは空の一覧を返却し、保存は受け取った値を返却する関数）と `docId` を指定する'
      - name: Mock
        description: ページの外部への要求を全て拒否し、要求した URL を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as 埋めた配布物
        U->>P: ページを開く
        P->>M: index.js と部品の配布ファイルと mermaid を Blob の URL から import()
        M-->>P: モジュール
        P->>P: 部品と mermaid のモジュールを指定して mount を呼ぶ
        P-->>U: map・ビュー・コメント・mermaid の図のある文書を表示
      ```

      <!-- /map -->
    expected:
      - map の範囲が図として描かれている
      - ビューのマーカーの表がビューとして描かれている
      - 本文にコメントのボタンが付いている
      - mermaid のコードブロックが図として描かれている
      - ページが外部へ要求した URL が無い
      - ブラウザのコンソールにエラーが出ていない
    test: test_normal_when_embedded
  - name: 異常シナリオ（埋めていない部品のマーカーがある）
    setup:
      - name: 配布物を埋めたページ
        description: 正常シナリオ（埋めた配布物から読み込む）と同じ HTML で、map の部品のモジュールだけを埋めず指定しないもの
        notes: '`mount` に指定する Markdown は map の範囲と段落を 1 つずつ持つ'
      - name: Mock
        description: ページの外部への要求を全て拒否し、要求した URL を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as 埋めた配布物
        U->>P: ページを開く
        P->>M: index.js を Blob の URL から import()
        M-->>P: モジュール
        P->>P: mount を呼ぶ
        P-->>U: 段落を表示し、コンソールに map の部品を読み込めなかった旨が出る
      ```

      <!-- /map -->
    expected:
      - 本文の段落が表示されている
      - ブラウザのコンソールに map の部品を読み込めなかったエラーが出る
    test: test_error_when_part_not_embedded
  - name: 異常シナリオ（mermaid のモジュールを指定していない）
    setup:
      - name: 配布物を埋めたページ
        description: 正常シナリオ（埋めた配布物から読み込む）と同じ HTML で、mermaid のモジュールだけを埋めず指定しないもの
        notes: '`mount` に指定する Markdown は map が描けない種類（`pie`）の mermaid のコードブロックと段落を 1 つずつ持つ。設定の `mermaid.url` は既定のまま'
      - name: Mock
        description: ページの外部への要求を全て拒否し、要求した URL を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as 埋めた配布物
        U->>P: ページを開く
        P->>M: index.js を Blob の URL から import()
        M-->>P: モジュール
        P->>P: mount を呼ぶ
        P-->>U: 段落と mermaid のコードブロックを表示し、コンソールに mermaid を読み込めなかった旨が出る
      ```

      <!-- /map -->
    expected:
      - 本文の段落が表示されている
      - mermaid のコードブロックの場所に、読み込めなかった旨の通知ブロックとコードブロックが表示されている
      - ページが外部へ要求した URL は設定の `mermaid.url` の 1 件だけ
      - ブラウザのコンソールに mermaid を読み込めなかったエラーが出る
    test: test_error_when_mermaid_not_embedded
  - name: 正常シナリオ（メジャーバージョンの範囲を指定する）
    setup:
      - name: 範囲を読み込むページ
        description: 正常シナリオと同じ HTML で、URL のバージョンの位置に `0` を記載したもの
        notes: ビルドで埋めるバージョンは `v0.0.2`
      - name: Mock
        description: jsDelivr を、`@0` の要求に `v0.0.2` のビルドの `dist/` を返却する手元の配信に差し替える（`v0.0.1` と `v0.0.2` のタグがある状態の代役）
        notes: '`/gh/shuhei1101/mdmark@0/dist/{ファイル}` への要求に、`v0.0.2` のビルドの `dist/{ファイル}` を返却する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant C as jsDelivr
        U->>P: ページを開く
        P->>C: @0/dist/index.css と index.js を要求
        C-->>P: メジャーバージョン 0 の最新のタグの CSS と JavaScript
        P->>P: 公開関数を呼ぶ
        P-->>U: バージョン v0.0.2 を表示
      ```

      <!-- /map -->
    expected:
      - 公開関数が `v0.0.2` を返却する
      - ページのルート要素の CSS 変数 `--mdmark-version` の計算値が `"v0.0.2"`
    test: test_normal_when_major_range
lead: 利用側のページが、タグか develop を指定した URL で mdmark の JavaScript と CSS を読み込み、公開関数を呼ぶ。サーバーの言語によらず、ページに記載した参照だけで使用できる。
primary_actor: mdmark を使用するアプリのページ
trigger: 利用者が、mdmark を読み込むページをブラウザで開く
preconditions:
  - 読み込むバージョンのタグ・メジャーバージョンの範囲の最新のタグか develop が指す commit に `dist/` が入っている
  - ページが `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@{タグか develop}/dist/index.js` と `index.css` を読み込む記述を持つか、`dist/` の配布ファイルを埋めて持つ
success_guarantee: ページに CSS が該当し、JavaScript の公開関数が、タグを指定したときはそのタグ、develop を指定したときは develop のビルドのバージョン、メジャーバージョンの範囲（`@0`）を指定したときはその範囲の最新のタグのバージョンを返却する。配布ファイルを埋めたページは、埋めた部品と mermaid のモジュールを外部へ要求せずに読み込み、map・ビュー・コメント・mermaid の図を描く。
minimal_guarantee: 配布物を読み込めなかったときも、ページの本文はそのまま表示され、読み込めなかったことがブラウザのコンソールに出る。
test_file: tests/e2e/単一ユースケース/配布物を読み込む.spec.ts
tags:
  - name: topic:配布物
    main: true
  - name: topic:バージョン
  - name: tool:jsdelivr
