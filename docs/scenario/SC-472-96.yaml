id: SC-472-96
visibility: internal
title: 注釈を確認する
lead: 文書の作成者が注釈を ID つきで 1 回定義し、本文・表のセルの複数の場所から ID で参照すると、mdmark が参照の場所に注釈のマーカーを出し、文書の末尾に閉じた注釈の一覧をまとめる。読者はマーカーのツールチップか末尾の一覧で注釈の本文を確認する。
issue: 304
test_file: tests/e2e/単一ユースケース/注釈を確認する.spec.ts
primary_actor: 読者
stakeholders:
  - name: 文書の作成者
    interest: 同じ注記を 1 回の定義で複数の場所から参照でき、図や表の下に `※n` の注記の表を並べずに済む
  - name: 読者
    interest: 図や表の下の注記まで移らずに、参照の場所で注釈の本文を確認でき、脚注・用語のツールチップと見分けられる
trigger: 利用側のページが、注釈の定義と参照を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: 参照の場所ごとに注釈のマーカーがあり、どの参照のマーカーのツールチップと末尾の一覧でも、同じ ID の定義の本文を確認できる。ツールチップはホバーとフォーカスの両方で出て、Esc で消え、ツールチップの上に乗っても消えない。脚注の番号・ツールチップ・一覧は注釈を持たない文書と同じに描かれる。
minimal_guarantee: 定義の無い ID の参照・参照されていない定義・同じ ID の 2 つ目の定義があっても、本文は描かれ、その場所に記載の警告が出る。同じ ID の定義が 2 つあるときは、前の定義の本文を使用する。
refs:
  - SC-472-71#
  - SC-472-40#
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 注釈を持つ Markdown
        description: ID `cond` で本文 `条件を満たさないときは次の工程へ進む` の注釈を 1 つ定義し、1 つ目の段落と、表の 2 行目のセルの 2 か所から `cond` を参照する文書
        notes: 定義・参照の記載方法はインターフェース定義設計で決める。2 か所の参照で、同じ定義を再利用することを決定的に発生させる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 注釈の定義と参照を読み込む
        M-->>P: 参照の場所に注釈のマーカーを配置し、末尾に閉じた注釈の一覧を配置して描く
        U->>P: 段落のマーカーと表のセルのマーカーに順にポインターを乗せる
        P-->>U: どちらも cond の本文のツールチップを表示
    expected:
      - 1 つ目の段落と、表の 2 行目のセルの参照の場所に、注釈のマーカーが 1 つずつ出ている
      - 本文に定義と参照の記載の文字が出ていない
      - どちらのマーカーにポインターを乗せても `条件を満たさないときは次の工程へ進む` のツールチップが出て、ツールチップの上へポインターを移しても出たまま
      - 文書の末尾に注釈の一覧があり、描いた直後は閉じていて、一覧の中身が表示されていない
    test: test_normal
  - name: 正常シナリオ（キーボードで読み込む）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 注釈を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 参照の場所に注釈のマーカーを配置して描く
        U->>P: Tab で段落のマーカーへフォーカスを移す
        P-->>U: cond の本文のツールチップを表示
        U->>P: Esc を押す
        P-->>U: ツールチップを削除する
    expected:
      - Tab で段落の注釈のマーカーにフォーカスが移る
      - フォーカスしたマーカーの `aria-describedby` が、`role="tooltip"` を持つ注釈の本文の要素を指す
      - Esc を押すとツールチップが消え、フォーカスはマーカーに残る
    test: test_normal_when_keyboard
  - name: 正常シナリオ（末尾の一覧と行き来する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 注釈を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 末尾に閉じた注釈の一覧を配置して描く
        U->>P: 表のセルのマーカーを押す
        P-->>U: 一覧を開き、cond の項目を表示
        U->>P: cond の項目の 2 つ目の戻るリンクを押す
        P-->>U: 表のセルのマーカーの場所を表示
    expected:
      - マーカーを押すと、末尾の注釈の一覧が開き、`条件を満たさないときは次の工程へ進む` の項目が画面の中に入り、その項目にフォーカスが移る
      - 一覧の項目は `cond` の 1 つだけで、段落と表のセルの 2 つの参照の場所へそれぞれ戻るリンクを持つ
      - 2 つ目の戻るリンクを押すと、表のセルのマーカーが画面の中に入り、マーカーにフォーカスが移る
    test: test_normal_when_back_from_list
  - name: 正常シナリオ（脚注・用語と同じ段落に出る）
    setup:
      - name: mdmark を読み込むページ
        description: 索引と描く文書の `id` を指定して文書を描く。ほかは正常シナリオと同じ
      - name: 用語を持つ索引
        description: 用語 `ワークスペース`（意味 `話し合いの記録を配置するフォルダ`）を持ち、描く文書を `docs` に持つ索引
      - name: 注釈・脚注・用語が出る Markdown
        description: '段落に `ワークスペース`・脚注の参照 `[^1]`・注釈 `cond` の参照が出て、脚注の定義 `[^1]: 補足の文` と注釈 `cond` の定義を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を指定して描かせる
        M-->>P: 用語に下線を付け、脚注の番号と注釈のマーカーを配置して描く
        U->>P: 注釈のマーカー・脚注の番号・下線の付いた単語に順にポインターを乗せる
        P-->>U: 注釈・脚注・用語のツールチップを表示
    expected:
      - 注釈のマーカーは脚注の番号と形状が違い、用語の破線の下線が付いていない（構造で見分けられ、色だけで分けない）
      - 注釈のツールチップに注釈であることを示すタイトルがあり、脚注のタイトルと用語の区分が無い
      - 脚注の番号は `1` で、注釈の参照は脚注の番号を進めない
      - 文書の末尾の脚注の項目は番号 `1` の 1 つ、注釈の項目は `cond` の 1 つで、注釈の項目には番号が振られず、脚注の項目と見分けられる
    test: test_normal_when_with_footnotes_and_terms
  - name: 異常シナリオ（参照と定義が合わない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 定義の無い参照と参照されていない定義を持つ Markdown
        description: 段落で定義の無い ID `missing` と ID `cond` を参照し、どこからも参照しない ID `unused` の注釈を定義し、`cond` を本文 `前の定義` と本文 `後の定義` で 2 回定義する文書
        notes: 同じ ID の 2 つの定義の本文を変え、どちらを使用したかを決定的に見分ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 定義の無い参照・参照されていない定義・同じ ID の 2 つ目の定義を見つける
        M-->>P: 参照と定義の場所に記載の警告を配置して描く
        P-->>U: 段落と警告を表示
    expected:
      - '`missing` の参照の場所に注釈のマーカーが無く、定義の無い ID であることを示す記載の警告が出ている'
      - '`unused` の定義の場所に、参照されていない注釈であることを示す記載の警告が出ている'
      - '`cond` の 2 つ目の定義の場所に、同じ ID の定義が既にあることを示す記載の警告が出ている'
      - '`cond` のマーカーにポインターを乗せると `前の定義` のツールチップが出て、`後の定義` は出ない'
      - 末尾の注釈の一覧の項目は `cond` の 1 つだけで、`前の定義` を持つ
      - 段落の残りの文字は描かれている
    test: test_error_when_references_and_definitions_mismatch
  - name: 正常シナリオ（タッチ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じページを、タッチの端末（`hasTouch`）として開いたページ
      - name: 注釈を持つ Markdown
        description: 正常シナリオと同じ文書の後ろに、注釈を含まない段落を続けた文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 参照の場所に注釈のマーカーを配置して描く
        U->>P: 段落のマーカーをタップする
        P-->>U: cond の本文のツールチップを表示
        U->>P: 注釈を含まない段落をタップする
        P-->>U: ツールチップを削除する
        U->>P: 段落のマーカーを 2 回タップする
        P-->>U: 一覧を開き、cond の項目を表示
    expected:
      - 閉じたマーカーのタップで `条件を満たさないときは次の工程へ進む` のツールチップが出て、末尾の注釈の一覧は閉じたまま
      - ツールチップとマーカーの外をタップすると、ツールチップが消える
      - 開いたマーカーをもう一度タップすると、ツールチップが消え、末尾の注釈の一覧が開き、`cond` の項目にフォーカスが移る
    test: test_normal_when_touch
