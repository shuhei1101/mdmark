id: SC-472-83
visibility: internal
title: "雛形を配置する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空のフォルダ
        description: 配置先の作業のフォルダ。何も配置していない
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init
        C->>F: 設定・theme.css・索引・TypeScript の拡張のビルドの雛形を書き込む
        C-->>W: 配置したファイルの一覧・終了コード 0
    expected:
      - '`mdmark.config.yaml`・`theme.css`・索引の雛形・拡張のビルドの雛形（tsconfig とビルドのコマンド）がある'
      - 配置した `mdmark.config.yaml` と索引が、設定と索引の JSON Schema に合う
      - 配置した `mdmark.config.yaml` の `version` が、呼んだ CLI のバージョン
      - 出力に配置したファイルの一覧が出て、終了コードが 0
    test: test_normal
  - name: 正常シナリオ（JavaScript の雛形を配置する）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init（JavaScript を指定）
        C->>F: 設定・theme.css・索引・JavaScript の拡張の雛形と、JavaScript を点検する tsconfig を記載する
        C-->>W: 配置したファイルの一覧・終了コード 0
    expected:
      - 拡張の雛形が `// @ts-check` と JSDoc で型を付けた JavaScript で、TypeScript の雛形が無い
      - JavaScript を変換せずに配布物の型定義で点検する tsconfig を配置する
      - 設定・`theme.css`・索引の雛形は正常シナリオと同じ
      - 終了コードが 0
    test: test_normal_when_javascript
  - name: 正常シナリオ（既にあるファイルがある）
    setup:
      - name: 設定を記載したフォルダ
        description: 文書の作成者が中身を記載した `mdmark.config.yaml` だけがあるフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init
        C->>F: 無いファイルだけを記載する
        C-->>W: 配置したファイルと配置しなかったファイルの一覧・終了コード 0
    expected:
      - '`mdmark.config.yaml` の中身が変わっていない'
      - '`theme.css`・索引の雛形・拡張のビルドの雛形がある'
      - 出力に配置しなかったファイルとして `mdmark.config.yaml` が出て、終了コードが 0
    test: test_normal_when_file_exists
lead: 文書の作成者が `mdmark init` を実行し、設定・利用側の CSS・索引・拡張のビルドの雛形をフォルダに配置する。
issue: 9
primary_actor: 文書の作成者
trigger: 文書の作成者が、mdmark で文書を書き出すフォルダを用意する
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
success_guarantee: 配置先のフォルダに `mdmark.config.yaml`・`theme.css`・索引の雛形・拡張のビルドの雛形があり、配置したファイルの一覧が出る。
minimal_guarantee: 既にあるファイルは上書きせず、配置しなかったファイルの一覧を出す。
test_file: tests/e2e/単一ユースケース/雛形を配置する.spec.ts
