id: SC-472-60
visibility: internal
title: "本文に出た用語と文書の参照を取り出す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込み、取り出しの処理を呼ぶ
      - name: 用語と文書の別名を持つ索引
        description: 用語 `ワークスペース`（ID `ws`、別名 `WS`、意味 `話し合いの記録を配置するフォルダ`）と、文書 `api`（タイトル `API`、概要 `公開関数の一覧`、別名 `公開関数`）・文書 `guide` を持つ索引
      - name: 用語と別名が出る本文
        description: '`guide` の本文。1 つ目のセクションの段落に `ワークスペース` を 2 回と `WS` を、2 つ目のセクションの段落に `公開関数` を記載し、見出しと行内のコードとリンクの文字にも `ワークスペース` を記載する'
        notes: 見出し・コード・リンクの中の単語が一致にならないことを決定的に発生させる
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 用語・文書の別名を単語の区切りに統一して照合する
        M-->>C: 文書ごとの参照の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` の参照の一覧が、段落の `ワークスペース` 2 回・`WS`・`公開関数` の 4 件を本文の頭からの順に持つ'
      - '`ワークスペース` と `WS` の要素が、種類が索引の用語・ID `ws`・タイトル `ワークスペース`・短い説明 `話し合いの記録を配置するフォルダ` を持つ'
      - '`公開関数` の要素が、種類が文書・ID `api`・タイトル `API`・短い説明 `公開関数の一覧` を持つ'
      - 各要素が、一致した文字列と、本文の中でその文字列が出た位置を持つ
      - 見出し・行内のコード・リンクの文字の `ワークスペース` は一覧に無い
      - まとめた参照の一覧が、`ws` と `api` を 1 回ずつ持つ
      - 引数の索引と本文が書き換わっていない
    test: test_normal
    refs:
      - SC-472-65#scenarios[正常シナリオ]
  - name: 正常シナリオ（複数の文書に同じ参照先）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 同じ用語が出る 2 つの文書
        description: 正常シナリオの索引と、`guide` と `api` の本文。どちらの本文も段落に `ワークスペース` を記載し、`api` の本文は段落に自身の別名 `公開関数` も記載する
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と 2 つの文書の本文を指定して参照を取り出させる
        M->>M: 文書ごとに照合し、参照先の重なりを除いてまとめる
        M-->>C: 文書ごとの参照の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` と `api` のそれぞれの参照の一覧が、`ws` の要素を持つ'
      - まとめた参照の一覧が、`ws` を 1 回だけ持つ
      - '`api` の参照の一覧が、`api` 自身の別名 `公開関数` の要素を持たない'
    test: test_normal_when_same_target_in_documents
  - name: 正常シナリオ（用語集の表の用語）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 用語集の表を持つ文書
        description: 文書 `glossary`（`path` は `用語集.md`）と `guide` を持つ索引。`用語集.md` の本文が `glossary` のマーカーで、用語 `マーカー`（意味 `HTML コメントで記載する指定`）の行を持つ表を囲み、`guide` の本文の段落に `マーカー` と `印刷` を記載する
        notes: '`印刷` は用語 `マーカー` を含むが、単語の区切りは `印刷` の 1 単語'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 用語集の表の用語を辞書に入れて照合する
        M-->>C: 文書ごとの参照の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` の参照の一覧が、`マーカー` の 1 件を、種類が用語集の表の用語・タイトル `マーカー`・短い説明 `HTML コメントで記載する指定` で持つ'
      - '`印刷` の `マーカー` は一覧に無い'
      - '`用語集.md` の表の中の `マーカー` は一覧に無い'
    test: test_normal_when_glossary_table
    refs:
      - SC-472-72#scenarios[正常シナリオ]
  - name: 正常シナリオ（文書のマーカーで機能がオフ）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 機能をオフにした 2 つの文書
        description: '正常シナリオの索引に文書 `memo` を追加し、用語 `ワークスペース` の `avoid` に `作業場` を加えたものと、`guide`・`memo` の本文。どちらの本文も段落に `ワークスペース` と `公開関数` と `作業場` を記載し、`guide` の頭に `<!-- features: {"glossary": false} -->`、`memo` の頭に `<!-- features: {"glossary": false, "backlinks": false} -->` を記載する'
        notes: '`memo` で、用語も文書の別名も照合しないときに空の一覧が返ることを決定的に発生させる'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 文書のマーカーで決まった機能のオン・オフで照合する単語を選ぶ
        M-->>C: 文書ごとの参照の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` の参照の一覧が、索引の用語の要素を持たず、文書の別名 `公開関数` の要素を持つ'
      - '`memo` の参照の一覧が空'
      - まとめた参照の一覧が、`api` だけを持つ
      - '`guide` と `memo` のやめた言い方の一覧が空'
    test: test_normal_when_feature_off
    refs:
      - SC-472-62#
  - name: 正常シナリオ（埋め込んだ HTML と図の部品の用語）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: HTML と図の部品に用語を記載した本文
        description: 正常シナリオの索引と、`guide` の本文。`<!-- html -->` の範囲の `html` のコードブロックの段落に `ワークスペース` を記載し、同じ HTML の中に `ワークスペース` を文字に持つリンクも配置する。`<!-- map -->` の範囲の Mermaid のノードの名前に `ワークスペース` と `公開関数` を記載する
        notes: '`公開関数` は文書の別名で用語ではないため、map の図では参照にならないことを決定的に発生させる'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 埋め込んだ HTML の文字と map の範囲の Mermaid の文字も照合する
        M-->>C: 文書ごとの参照の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` の参照の一覧が、HTML の中の段落の `ワークスペース` と、`<!-- map -->` の図のノードの名前の `ワークスペース` の 2 件を `ws` の要素として持つ'
      - HTML の中のリンクの文字の `ワークスペース` は一覧に無い
      - map の図のノードの `公開関数` は一覧に無い
      - 各要素が、本文の Markdown の中でその文字列が出た位置を持つ
    test: test_normal_when_embedded_html_and_diagram
    refs:
      - SC-472-65#scenarios[正常シナリオ（埋め込んだ HTML の中の用語）]
      - SC-472-40#
      - SC-472-24#
  - name: 正常シナリオ（やめた言い方が本文に出る）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: やめた言い方を持つ索引
        description: 正常シナリオの索引の用語 `ワークスペース` の `avoid` に `作業場` を加えたもの
      - name: やめた言い方が出る本文
        description: '`guide` の本文。1 つ目のセクションの段落に `作業場` を 2 回と `ワークスペース` を、2 つ目のセクションの段落に `作業場` を記載し、見出しと行内のコードにも `作業場` を記載する'
        notes: 描いた文書ではセクションごとに最初の 1 回だけに付くマーカーが、取り出しでは出現の全てになることを、1 つ目のセクションに 2 回書いて決定的に発生させる
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 用語の単語・別名とやめた言い方を単語の区切りに統一して照合する
        M-->>C: 文書ごとの参照の一覧・やめた言い方の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` のやめた言い方の一覧が、段落の `作業場` 3 件を本文の頭からの順に持つ'
      - やめた言い方の各要素が、一致した文字列 `作業場` と、本文の中でその文字列が出た位置を持つ
      - やめた言い方の各要素が、代わりの用語として種類が索引の用語・ID `ws`・タイトル `ワークスペース`・短い説明 `話し合いの記録を配置するフォルダ` を持つ
      - 見出しと行内のコードの `作業場` はやめた言い方の一覧に無い
      - '`guide` の参照の一覧が、`ワークスペース` の要素を持ち、`作業場` の要素を持たない'
      - まとめた参照の一覧が、`ws` を 1 回だけ持つ
    test: test_normal_when_avoided_term
    refs:
      - SC-472-65#scenarios[正常シナリオ（やめた言い方が本文に出る）]
  - name: 正常シナリオ（全角と半角・大文字と小文字だけが違う単語）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 表記の揺れを持つ索引
        description: 正常シナリオの索引の用語 `ワークスペース` の `avoid` に `workplace` を加えたもの
      - name: 表記の違う単語が出る本文
        description: '`guide` の本文。段落の 1 行目に半角カタカナの `ﾜｰｸｽﾍﾟｰｽ` と全角の `ＷＳ` を、段落の 2 行目に小文字の `ws` と `WorkPlace` を記載する'
        notes: '`ﾜｰｸｽﾍﾟｰｽ`（8 文字）は正規化すると `ワークスペース`（7 文字）になり、正規化で長さが変わる単語の位置を決定的に発生させる'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引と文書の本文を指定して参照を取り出させる
        M->>M: 本文の単語と用語の単語・別名・やめた言い方を正規化して照合し、一致した範囲を正規化する前の本文の位置へ戻す
        M-->>C: 文書ごとの参照の一覧・やめた言い方の一覧と、まとめた参照の一覧
      ```
    expected:
      - '`guide` の参照の一覧が、`ﾜｰｸｽﾍﾟｰｽ`・`ＷＳ`・`ws` の 3 件を本文の頭からの順に持ち、どれも種類が索引の用語・ID `ws` を持つ'
      - '`ﾜｰｸｽﾍﾟｰｽ` の要素の始まりと終わりの位置が、本文の 1 行目で `ﾜｰｸｽﾍﾟｰｽ` が出た範囲（8 文字分）を指す'
      - '`ＷＳ` の要素の始まりの位置が、本文の 1 行目で `ＷＳ` が出た位置を指す'
      - '`guide` のやめた言い方の一覧が、`WorkPlace` の 1 件を、代わりの用語として ID `ws`・タイトル `ワークスペース` とともに持つ'
      - まとめた参照の一覧が、`ws` を 1 回だけ持つ
    test: test_normal_when_width_and_case_differ
    refs:
      - SC-472-65#scenarios[正常シナリオ（全角と半角・大文字と小文字だけが違う単語）]
  - name: 正常シナリオ（エイリアスを指定する）
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込み、索引・文書の本文・読み込んだエイリアスを指定して取り出しの処理を呼ぶ
      - name: 索引
        description: 文書 `guide` だけを持ち、`terms` を持たない索引
      - name: エイリアス
        description: '`command` の `単体テスト`（ID `unit-test`、説明 `ライブラリ本体の単体テストを実行する`、コマンド `npm run test:unit`）と、`avoid` の `作業場`（ID `workplace`、置き換え先 `ワークスペース`）'
      - name: エイリアスが出る本文
        description: '`guide` の本文。段落に `単体テスト` と `作業場` を記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引・文書の本文・エイリアスを指定して参照を取り出させる
        M->>M: 用語・文書の別名・エイリアスを単語の区切りに統一して照合する
        M-->>C: 文書ごとの参照の一覧・まとめた参照の一覧・やめた言い方の一覧
      ```
    expected:
      - '`guide` の参照の一覧の `単体テスト` の要素が、種類がエイリアス（`command`）・ID `unit-test`・タイトル `単体テスト`・短い説明 `ライブラリ本体の単体テストを実行する` を持つ'
      - まとめた参照の一覧が `unit-test` を 1 回持つ
      - '`guide` のやめた言い方の一覧が、`作業場` と代わりの用語 `ワークスペース` を持つ'
      - 引数の索引・本文・エイリアスが書き換わっていない
    test: test_normal_when_aliases
lead: 利用側の処理（AI へ本文を返却する MCP・サーバー）が、索引と文書の本文を mdmark に指定し、画面を出さずに、本文に出た用語・文書の別名と、その参照先の一覧を受け取る。
issue: 47
primary_actor: 利用側の処理
stakeholders:
  - name: 文書を読み込む AI
    interest: 本文と別に、利用者が画面のツールチップで確認するのと同じ用語の意味と関連する文書の説明を受け取れる
  - name: 利用側のアプリ（mindstella など）
    interest: 照合の処理を自前で持たず、画面と同じ一致の規則で参照を受け取れる。複数の文書を返却するときに、同じ用語の説明を何度も返却せずに済む
trigger: 利用側の処理が、読み込んだ索引と、文書のパスから本文を参照する表を指定して、参照を取り出させる
preconditions:
  - 利用側の処理が mdmark の配布物の JavaScript を読み込んでいる
  - 利用側の処理が索引の YAML と文書のファイルを読み込んでいる（mdmark はファイルを読み込まない）
success_guarantee: 文書ごとに、本文に出た用語・文書の別名の一致が、参照先の種類・ID・タイトル・短い説明と、一致した文字列・本文の中の位置を持つ一覧で返る。あわせて、指定した全ての文書の参照先を重なりを除いてまとめた一覧が返る。一致は、描いた文書で下線とツールチップが付く単語と同じ規則で決まり、全角と半角・英字の大文字と小文字・前後の空白の違いを区別しない。本文の中の位置は、正規化する前の本文の位置。本文に出た用語のやめた言い方は、参照先の一覧とは別に、文書ごとに一致した文字列・本文の中の位置・代わりの用語を持つ一覧で返る。
minimal_guarantee: 索引に用語も文書の別名も無いとき、本文に一致が無いときは、空の一覧が返る。取り出しは索引と文書を書き換えない。
refs:
  - SC-472-65#
  - SC-472-75#
