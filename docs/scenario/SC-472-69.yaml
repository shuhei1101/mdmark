id: SC-472-69
visibility: internal
title: 端末にmdmarkをセットアップする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空の端末
        description: 端末の設定（`MDMARK_CONFIG` が指すパス）・状態の配置場所（`MDMARK_STATE_DIR`）・Claude Code の設定のフォルダ（`CLAUDE_CONFIG_DIR`）を、どれも空の一時フォルダにする
        notes: '`MDMARK_CONFIG` は既定の `${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml` と違うパスにする'
      - name: systemd --user が使える端末と空いたポート
        description: '`systemctl --user is-system-running` が `running` か `degraded` を返却する端末で、`MDMARK_PORT` に待ち受けるプロセスの無いポートを指定する'
        notes: 手元の常駐サーバーの unit（`mdmark-mcp`）とポート 8782 を回避するため、unit の名前はテスト専用の名前にし、テストの後に unit を止めて unit のファイルを削除する
      - name: Mock
        description: スキルを読み込むモデルの代わりに、スキルの手順が呼ぶスクリプトを手順の順に実行し、利用者への確認には決めた回答を返却する。端末の設定のパスは `MDMARK_CONFIG` のパスを、キーは `features.table` に `false`・unit の名前にテスト専用の名前を、ほかは既定のままを回答し、書き込んでよいかには認める回答を返却する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant F as 端末の設定と settings.json
        participant D as systemd --user
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、端末の設定が無いこと
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 書き込む内容
        W->>C: 書き込んでよい
        C->>F: 端末の設定を書き込み、settings.json の env に MDMARK_CONFIG を書き込む
        C->>D: systemd --user が使えるので、unit を記載して enable --now する
        D->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C->>C: SessionStart のフックを実行する
        C-->>W: 作ったもの・書き込んだキー・unit の名前・ログの確認方法・止め方
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定があり、`features.table: false` を持ち、`mdmark check` と同じ点検が端末の設定の構造のずれを返却しない'
      - '`CLAUDE_CONFIG_DIR` の `settings.json` の `env` に、端末の設定のパスの `MDMARK_CONFIG` がある'
      - '`~/.config/systemd/user/{unit の名前}.service` があり、`systemctl --user is-enabled` が `enabled`、`is-active` が `active` を返却する'
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけあり、unit のメインのプロセスである（8782 では待ち受けない）'
      - '`journalctl --user -u {unit の名前}` に待ち受ける URL の 1 行がある'
      - '`tools/list` が返却するツールに `export_html`・`build_site`・`check` がある'
      - SessionStart のフックが何も出さずに終了コード 0 で終わる
      - 最後の報告に、端末の設定のパス・`settings.json` に書き込んだキー・systemd --user の unit で動いていること・unit の名前・ログを確認する操作（`journalctl --user -u {unit の名前}`）・止める操作が出る
    test: test_normal
  - name: 正常シナリオ（セットアップ済み）
    setup:
      - name: セットアップ済みの端末
        description: 正常シナリオを終えた後の端末の設定・`settings.json`・状態の配置場所・unit と、待ち受けている常駐サーバー
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant D as systemd --user
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>D: unit が今の内容で active で、ポートが待ち受けている
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 書き換えなかったこと・unit の名前・ログの確認方法・止め方
    expected:
      - 端末の設定と `settings.json` と unit のファイルの中身が呼ぶ前と同じ
      - unit を起動し直さず、常駐サーバーのプロセスが呼ぶ前と同じ
      - '`tools/list` が返却するツールに `export_html`・`build_site`・`check` がある'
      - 最後の報告に、書き換えなかったことと unit の名前が出る
    test: test_normal_when_already_set_up
  - name: 正常シナリオ（常駐サーバーが止まっている）
    setup:
      - name: 止めた常駐サーバー
        description: 正常シナリオを終えた後の端末から、`systemctl --user stop {unit の名前}` で unit を止め、`MDMARK_PORT` のポートで待ち受けるプロセスが無い状態
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant D as systemd --user
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>D: unit が active ではないので、起動する
        D->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 起動したこと・unit の名前・ログの確認方法・止め方
    expected:
      - 端末の設定と `settings.json` と unit のファイルの中身が呼ぶ前と同じ
      - unit の `is-active` が `active` を返却し、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - '`journalctl --user -u {unit の名前}` に、もう一度起動した後の待ち受ける URL の 1 行が追加される'
    test: test_normal_when_server_stopped
  - name: 正常シナリオ（プラグインを更新した）
    setup:
      - name: 古いプラグインで起動した常駐サーバー
        description: 正常シナリオを終えた後の端末で、unit のファイルの起動するコマンドが今のプラグインのビルドで埋めた mdmark のバージョンと違うバージョンの CLI を指し、その unit で常駐サーバーが待ち受けている
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant D as systemd --user
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>D: unit のファイルが今の内容と違うので、記載し直して daemon-reload し、起動し直す
        D->>S: 今のプラグインの CLI で起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: unit を記載し直して起動し直したこと・unit の名前
    expected:
      - unit のファイルの起動するコマンドが、今のプラグインのビルドで埋めた mdmark のバージョンの CLI を指す
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけあり、呼ぶ前のプロセスと違う'
      - 最後の報告に、unit を記載し直して起動し直したことが出る
    test: test_normal_when_plugin_updated
  - name: 正常シナリオ（tmux のセッションから unit へ移す）
    setup:
      - name: tmux のセッションで動く常駐サーバー
        description: 端末の設定のセッション名の tmux のセッションで `mdmark serve` が `MDMARK_PORT` のポートを待ち受け、unit は無い
        notes: '`TMUX_TMPDIR` を空の一時フォルダにして、手元と別の tmux サーバーで動かす'
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant D as systemd --user
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>T: セッションで動いている常駐サーバーを閉じる
        C->>D: unit を記載して enable --now する
        D->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: tmux のセッションから unit へ移したこと・unit の名前
    expected:
      - 端末の設定のセッション名の tmux のセッションが無い
      - unit の `is-active` が `active` を返却し、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - 最後の報告に、tmux のセッションを閉じて unit へ移したことが出る
    test: test_normal_when_moved_from_tmux
  - name: 正常シナリオ（systemd --user が使えない）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: systemctl の無い PATH
        description: '`PATH` から `systemctl` を削除する'
      - name: 手元と別の tmux サーバーと空いたポート
        description: '`TMUX_TMPDIR` を空の一時フォルダにして手元と別の tmux サーバーを先に起動しておき、`MDMARK_PORT` に待ち受けるプロセスの無いポートを指定する'
        notes: 手元の常駐サーバーが使用する 8782 と手元の tmux のセッションを回避する。tmux サーバーを先に起動しておくと、`MDMARK_PORT` がセッションへ渡る経路を確認できる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant F as 端末の設定と settings.json
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        W->>C: 書き込んでよい
        C->>F: 端末の設定と settings.json を書き込む
        C->>T: systemd --user が使えないので、新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 作ったもの・tmux のセッション名・ログの場所・止め方
    expected:
      - 端末の設定と `settings.json` は正常シナリオと同じに書き込まれる
      - unit のファイルが作られず、端末の設定のセッション名の tmux のセッションが 1 つだけあり、先に起動していた tmux サーバーの中でも `MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - 状態の配置場所に常駐サーバーのログ（`serve.log`）があり、待ち受ける URL の 1 行を含む
      - 最後の報告に、tmux のセッションで動いていること・セッション名・ログのパス・止める操作が出る
    test: test_normal_when_systemd_unavailable
  - name: 正常シナリオ（tmux に固定する）
    setup:
      - name: セットアップ済みの端末
        description: 正常シナリオを終えた後の端末の設定・unit と、unit で待ち受けている常駐サーバー
      - name: 手元と別の tmux サーバーと空いたポート
        description: '`systemd --user が使えない` と同じ'
      - name: Mock
        description: 正常シナリオと同じ。起動の方法のキーには `tmux` を、ほかのキーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant D as systemd --user
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 起動の方法は tmux、ほかは今の値のまま
        end
        W->>C: 書き込んでよい
        C->>D: unit を disable --now する
        C->>T: 新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        C-->>W: unit を止めて tmux のセッションへ移したこと・セッション名
    expected:
      - 端末の設定の起動の方法のキーが `tmux` になる
      - unit の `is-enabled` が `enabled` ではなく、`is-active` が `active` ではない
      - 端末の設定のセッション名の tmux のセッションが 1 つだけあり、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
    test: test_normal_when_fixed_to_tmux
  - name: 正常シナリオ（古いバージョンの端末の設定）
    setup:
      - name: 古いバージョンの端末の設定
        description: '`MDMARK_CONFIG` のパスに、`version` が今のバージョンより前の端末の設定を配置する'
      - name: テスト専用の移行の手順
        description: 一時フォルダに、端末の設定のバージョンと今のバージョンの間の移行の手順を 1 バージョンだけ配置し、その手順の配置場所を移行の手順の読み取り先にする
        notes: 今のバージョンには移行の手順が無いため、`mdmark upgrade` と同じ手順の当て方を確認するテストだけの手順を使用する
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。移行してよいかには認める回答を、各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant F as 端末の設定
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定の version が古いことと、適用する移行の手順
        W->>C: 移行してよい
        C->>F: コピーを残して移行の手順を適用する
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C-->>W: 移行したこと・コピーのパス
    expected:
      - 端末の設定にテスト専用の移行の手順が該当し、`version` が今のバージョンになり、`mdmark check` と同じ点検が端末の設定の構造のずれを返却しない
      - 移行する前の端末の設定のコピーが残り、最後の報告にそのパスが出る
    test: test_normal_when_settings_outdated
  - name: 異常シナリオ（書き込むことを断る）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: systemd --user が使える端末
        description: 正常シナリオと同じ
      - name: 手元と別の tmux サーバーと空いたポート
        description: '`systemd --user が使えない` と同じ'
      - name: Mock
        description: 正常シナリオと同じ。書き込んでよいかには断る回答を返却する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 書き込む内容
        W->>C: 書き込まない
        C->>T: 書き込みを断ったので unit を記載せず、新しいセッションで mdmark serve を起動する
        C-->>W: 端末の設定と settings.json を書き込まなかったこと
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定が無く、`settings.json` が作られていない'
      - 既定の名前の unit（`mdmark-mcp`）を記載せず、`~/.config/systemd/user/mdmark-mcp.service` の有無と中身と `systemctl --user is-enabled mdmark-mcp` の値が呼ぶ前と同じ
      - 既定のセッション名 `mdmark-mcp` の tmux のセッションで、常駐サーバーが `MDMARK_PORT` のポートで待ち受ける
      - 最後の報告に、端末の設定と `settings.json` を書き込まなかったことが出る
    test: test_error_when_write_declined
  - name: 異常シナリオ（systemd --user も tmux も無い）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: systemctl と tmux の無い PATH
        description: '`PATH` から `systemctl` と tmux を削除する'
      - name: 空いたポート
        description: '`MDMARK_PORT` に待ち受けるプロセスの無いポートを指定する'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        W->>C: /mdmark:global-setup
        C->>C: 端末の設定を書き込む
        C->>C: systemd --user も tmux も見つからない
        C-->>W: 端末で mdmark serve を開いたまま動かすコマンド
    expected:
      - 端末の設定と `settings.json` は正常シナリオと同じに書き込まれる
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが無い'
      - 最後の報告に、systemd --user も tmux も見つからないことと、端末で `mdmark serve` を開いたまま動かすコマンド（`MDMARK_PORT` を含む）が出る
    test: test_error_when_launcher_missing
  - name: 異常シナリオ（ポートをほかのプロセスが使用している）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: ポートを使用するほかのプロセス
        description: '`MDMARK_PORT` のポートを mdmark ではないプロセスが待ち受ける'
      - name: systemd --user が使える端末と空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant D as systemd --user
        W->>C: /mdmark:global-setup
        C->>D: unit が active ではない
        C->>C: ポートをほかのプロセスが待ち受けているので、起動しない
        C-->>W: ポートが使用されていることと修正方法
    expected:
      - '`~/.config/systemd/user/{unit の名前}.service` が作られず、`systemctl --user is-enabled {unit の名前}` が `enabled` ではない'
      - '`MDMARK_PORT` のポートは、ほかのプロセスが待ち受けたまま'
      - 最後の報告に、ポートが使用されていることと、`settings.json` の `env` の `MDMARK_PORT` を空いたポートに変え、セッションをもう一度開いて `global-setup` をもう一度呼ぶ修正方法が出る
    test: test_error_when_port_in_use
lead: 文書の作成者が Claude Code で `global-setup` を呼び、端末の設定を作る・移行し、systemd --user の unit か tmux のセッションで常駐サーバーを起動して、つながりとフックを確認する。
issue: 165
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 端末の設定のキーを 1 つずつ確認して回答するだけで端末がそろい、常駐サーバーが unit と tmux のセッションのどちらで動いているか・ログの確認方法・止め方が分かる。systemd --user が使える端末では、端末を起動し直しても常駐サーバーが自動で起動する
  - name: Claude Code
