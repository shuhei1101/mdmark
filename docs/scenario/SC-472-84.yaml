id: SC-472-84
visibility: internal
title: CSSのテンプレートを別のリポジトリに配置して書き出す
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 端末の設定
        description: 一時フォルダの `settings.yaml`。常駐サーバーを `MDMARK_CONFIG` でこのファイルを指して起動する。テンプレートのフォルダはまだ無い
      - name: リポジトリ A
        description: '`mdmark.config.yaml` と、見出しの色を変える規則を持つ CSS `brand.css`'
      - name: リポジトリ B
        description: '`theme` を持たない `mdmark.config.yaml` と、見出しを持つ文書 `guide.md`'
      - name: Mock
        description: Claude Code の代わりに、プラグインの PreToolUse のフックを経由した引数で常駐サーバーへ HTTP でつなぐ MCP のクライアントを、リポジトリごとに 1 つずつ使用する。モデルは使用しない
    flow: |-
      flowchart TD
        A[CSSのテンプレートを登録する:正常シナリオ（登録する）] --> B[CSSのテンプレートを配置する:正常シナリオ（一覧から選んで配置する）]
        B --> C[ClaudeCodeから点検と書き出しを呼ぶ:正常シナリオ（1 文書を書き出す）]
        click A "id:SC-472-1#scenarios[正常シナリオ（登録する）]"
        click B "id:SC-472-2#scenarios[正常シナリオ（一覧から選んで配置する）]"
        click C "id:SC-472-3#scenarios[正常シナリオ（1 文書を書き出す）]"
    expected:
      - リポジトリ A のクライアントの `add_template` の後、端末の設定のフォルダに `brand.css` と、その名前・説明・タグを持つ索引がある
      - リポジトリ B のクライアントの `list_templates` が、登録した名前・説明・タグを返却する
      - リポジトリ B のクライアントの `apply_template` が、リポジトリ B の `mdmark.config.yaml` のフォルダに CSS を配置し、`theme` に記載する値を返却する
      - 返った値を `theme` に記載して呼んだ `export_html` の HTML に、`brand.css` の見出しの規則が入る
      - リポジトリ A の `brand.css` と `mdmark.config.yaml` は書き換わらない
    test: test_normal
    uses:
      - SC-472-1#scenarios[正常シナリオ（登録する）]
      - SC-472-2#scenarios[正常シナリオ（一覧から選んで配置する）]
      - SC-472-3#scenarios[正常シナリオ（1 文書を書き出す）]
  - name: 異常シナリオ（同じ名前のテンプレートがある）
    setup:
      - name: 端末の設定
        description: 正常シナリオの登録を終えた後の端末の設定とテンプレートのフォルダ
      - name: リポジトリ A
        description: 正常シナリオの `brand.css` の見出しの色を書き換えたもの
      - name: リポジトリ B
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      flowchart TD
        A[CSSのテンプレートを登録する:異常シナリオ（同じ名前のテンプレートがある）] --> B[CSSのテンプレートを登録する:正常シナリオ（上書きして登録する）]
        B --> C[CSSのテンプレートを配置する:正常シナリオ（一覧から選んで配置する）]
        click A "id:SC-472-1#scenarios[異常シナリオ（同じ名前のテンプレートがある）]"
        click B "id:SC-472-1#scenarios[正常シナリオ（上書きして登録する）]"
        click C "id:SC-472-2#scenarios[正常シナリオ（一覧から選んで配置する）]"
    expected:
      - 上書きを指定しない `add_template` がエラーになり、テンプレートのフォルダの `brand.css` と索引が書き換わらない
      - 上書きを指定した `add_template` の後、テンプレートのフォルダの `brand.css` が書き換えた中身になり、索引の行は 1 つのまま
      - 続けてリポジトリ B で呼んだ `apply_template` が配置した CSS が、書き換えた中身になる
    test: test_error_when_template_name_exists
    uses:
      - SC-472-1#scenarios[異常シナリオ（同じ名前のテンプレートがある）]
      - SC-472-1#scenarios[正常シナリオ（上書きして登録する）]
      - SC-472-2#scenarios[正常シナリオ（一覧から選んで配置する）]
lead: 文書の作成者が、あるリポジトリで作った CSS を Claude Code から端末の設定のフォルダのテンプレートに登録し、別のリポジトリで一覧から選んで配置し、設定の `theme` に記載して書き出した HTML に適用する。
issue: 164
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 一度作った CSS を、リポジトリごとにもう一度コピーせずに、説明から選んで使い回せる
  - name: Claude Code
    interest: テンプレートの説明とタグから、作業に合う CSS を選んで配置できる
trigger: 文書の作成者が、別のリポジトリで作った CSS と同じ外観の文書を記載したくなる
preconditions:
  - Claude Code に mdmark のプラグインを入れ、MCP の常駐サーバーを起動している
  - 2 つのリポジトリのそれぞれに `mdmark.config.yaml` がある
success_guarantee: 登録した CSS がテンプレートの一覧に説明とタグつきで出て、別のリポジトリへ配置した CSS を `theme` に記載すると、書き出した HTML にその CSS の規則が適用される。
minimal_guarantee: 同じ名前のテンプレートを上書きを指定せずに登録しようとしたときは、テンプレートのフォルダの CSS と索引を書き換えない。
test_file: tests/e2e/複合ユースケース/CSSのテンプレートを別のリポジトリに配置して書き出す.spec.ts
