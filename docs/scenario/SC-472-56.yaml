  - name: 正常シナリオ（文書のマーカーで明暗を指定する）
    setup:
      - name: 明暗を指定した文書のフォルダ
        description: '正常シナリオと同じフォルダで、書き出す文書の先頭の行に `<!-- page: {"scheme": "dark", "theme": "theme-paper"} -->` を記載する'
        notes: 書き出した HTML を開くブラウザの配色はライト
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
