        participant F as 出力の HTML
        W->>C: docs/ で mdmark export 文書のパス
        C->>C: docs/ から上の mdmark.config.yaml だけを重ねる（端末の設定は重ねない）
        C->>F: HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
    expected:
      - 終了コードが 0 で HTML が記載されている
