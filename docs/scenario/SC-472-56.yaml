    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - file:// で開くと、ブラウザの配色がライトでも、描く先の要素の地の色の計算値が theme-paper の暗い配色の `--mdmark-color-bg` の値
