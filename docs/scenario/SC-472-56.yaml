id: SC-472-56
visibility: internal
title: 文書をHTMLに書き出す
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本の文書
        description: 表のマーカー・用語集の表・Chart.js のマーカー・相対パスで指す画像・他の文書へのリンク・`script` 要素を持つ文書 1 つと、`theme.css` を指す設定
      - name: Mock
        description: 外部ライブラリは、URL の代わりに相対パスの手元のモジュールを `libraries` に記載する（書き出しがネットワークを読み込まない）
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス（出力を指定）
        C->>C: 設定・索引・文書を読み込み、モジュールをまとめ、画像を読み込む
        C->>F: 配布物・CSS・モジュール・画像・本文を埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: HTML だけを空のフォルダへコピーして file:// で開く
        F-->>R: 文書・表のボタン・用語のツールチップ・図・画像
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - HTML だけを空のフォルダへコピーして file:// で開くと、描き終えるまでにページ自身と画像の `data:` のほかの要求が 0 件
      - 表に並べ替え・ピン止めのボタンが付き、用語集の表の用語にツールチップが出る
      - Chart.js のマーカーの場所に `canvas` が描かれ、通知ブロックが出ない
      - 相対パスで指した画像が描かれる（`naturalWidth` が 0 より大きい）
      - '`theme.css` の上書きが該当している'
      - 他の文書へのリンクが記載したままの `href` で残る
      - 文書に記載した `script` 要素が実行されていない
    test: test_normal
  - name: 正常シナリオ（読み込めない画像とモジュールがある）
    setup:
      - name: 読み込めないものを指す文書
        description: 無い画像ファイルを相対パスで指し、`libraries` に無いファイルのモジュールを記載したマーカーを持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: 画像とモジュールを読み込めない
        C->>F: 読み込めたものだけを埋めた HTML を書き込む
        C-->>W: 読み込めなかった画像とモジュールの警告・終了コード 0
        R->>F: file:// で開く
        F-->>R: 文書と、マーカーの場所の通知ブロック
    expected:
      - 終了コードが 0 で HTML が記載されている
      - 出力の警告に、読み込めなかった画像のパスとモジュールのマーカーの名前が出る
      - file:// で開くと、そのマーカーの場所に通知ブロックが出て、本文のほかの部分は描かれる
      - 外への要求が 0 件
    test: test_normal_when_unreadable_assets
  - name: 異常シナリオ（出力先へ書き込めない）
    setup:
      - name: 書き込めない出力先
        description: 出力のパスの親がフォルダではなくファイル
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark export 文書のパス（記載できない出力を指定）
        C-->>W: 書き込めない出力先と修正方法・終了コード 0 以外
    expected:
      - 終了コードが 0 以外
      - 出力に書き込めなかったパスと修正方法が出る
      - HTML がどこにも記載されていない
    test: test_error_when_output_unwritable
  - name: 正常シナリオ（色分けするコードブロック）
    setup:
      - name: 色分けする言語のコードブロックを持つ文書
        description: 言語 `ts` と `python` のコードブロックを 1 つずつ持つ文書 1 つと、設定
      - name: Mock
        description: 色分けのライブラリは、設定の `syntax.url` を本体と言語のモジュールを配置した手元のフォルダの相対パスにする（書き出しがネットワークを読み込まない）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: コードブロックの言語から、色分けの本体と使用する言語のモジュールをまとめる
        C->>F: 色分けのモジュールを埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: HTML だけを空のフォルダへコピーして file:// で開く
        F-->>R: 色分けしたコードブロック
      ```
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - HTML だけを空のフォルダへコピーして file:// で開くと、描き終えるまでにページ自身と画像の `data:` のほかの要求が 0 件
      - '`ts` と `python` のコードブロックが色分けされている'
      - 手元のフォルダにある言語のモジュールのうち、文書が使用しない言語（`yaml`）のモジュールは埋められていない
    test: test_normal_when_code_highlighted
  - name: 正常シナリオ（mermaid のコードブロック）
    setup:
      - name: mermaid のコードブロックを持つ文書
        description: 言語 `mermaid` の flowchart のコードブロックを 1 つ持つ文書 1 つと、設定
      - name: mermaid のコードブロックを持たない文書
        description: 段落だけを持つ文書 1 つ（同じ設定で別に書き出す）
      - name: Mock
        description: mermaid は、設定の `mermaid` の読み込み先を、mermaid の本体と chunk を配置した手元のフォルダの相対パスにする（書き出しがネットワークを読み込まない）
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: mermaid のコードブロックがあるので、mermaid の本体と chunk を 1 つのスクリプトにまとめる
        C->>F: mermaid を埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: HTML だけを空のフォルダへコピーして file:// で開く
        F-->>R: 図の枠に入った mermaid の図
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - HTML だけを空のフォルダへコピーして file:// で開くと、描き終えるまでにページ自身と画像の `data:` のほかの要求が 0 件
      - mermaid のコードブロックの場所に、図の枠と SVG の図がある
      - 書き出した HTML のスクリプトの動的 `import()` の数が、mermaid のコードブロックを持たない文書の書き出しと同じ（mermaid の chunk を動的 `import()` で読み込まない）
      - mermaid のコードブロックを持たない文書の書き出しには、mermaid が埋められていない
    test: test_normal_when_mermaid
  - name: 正常シナリオ（エイリアスを読み込む）
    setup:
      - name: エイリアスを読み込む設定
        description: '`aliases` に、`alias_type` が `term` で `ワークスペース`（説明 `話し合いの記録を配置するフォルダ`）を持つ YAML を指す行と、`alias_type` が `env` で `開発サーバー`（URL `http://127.0.0.1:8767/`、ポート `8767`）を持つ YAML を指す行と、無いファイルを指す行を持つ設定'
      - name: エイリアスが出る文書
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: 設定の aliases を読み込む（読み込めない行は飛ばす）
        C->>F: 読み込めたエイリアスを埋めた HTML を書き込む
        C-->>W: 読み込めなかった行の警告・終了コード 0
        R->>F: file:// で開く
        F-->>R: エイリアスの単語に下線を付けた文書
    expected:
      - 終了コードが 0 で HTML が記載されている
      - 出力の警告に、読み込めなかった行のパスが出る
      - file:// で開くと、`ワークスペース` に下線が付き、ツールチップに `話し合いの記録を配置するフォルダ` が出る
      - 書き出した HTML のソースに、`env` の `開発サーバー`・`http://127.0.0.1:8767/` が入っていない
      - 外への要求が 0 件
    test: test_normal_when_aliases
  - name: 正常シナリオ（テーマを選ぶ）
    setup:
      - name: テーマを選んだフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` のテーマを選ぶキーに theme-contrast を記載し、`theme` を持たない
        notes: 書き出した HTML を開くブラウザの配色はライト
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark export
        participant B as ブラウザ
        W->>C: mdmark export を実行する
        C->>C: 設定のテーマを描く先に適用する HTML を組み立てる
        C-->>W: HTML を書き込む
        W->>B: file:// で開く
        B-->>W: theme-contrast の明るい配色で表示
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - file:// で開くと、描く先の要素の地の色の計算値が theme-contrast の明るい配色の `--mdmark-color-bg` の値
      - 外への要求が 0 件
    test: test_normal_when_theme_selected
    refs:
      - SC-472-26#scenarios[正常シナリオ]
  - name: 正常シナリオ（画像・動画・音声を埋める）
    setup:
      - name: 書き出す文書と画像・動画・音声のファイル
        description: '`docs/guide.md` が相対パスで `images/chart.png`・`media/demo.mp4`・`media/voice.mp3`・`images/logo.png` を指し、リンクだけの段落 `[仕様書](files/spec.pdf)`、`#only-dark` の画像、GIF を持つ'
        notes: '`images/logo.png` は `docs/` の下には無く、`assets/images/logo.png` にだけある。そのほかのファイルは `docs/` からの相対パスにある'
      - name: 設定
        description: '`mdmark.config.yaml` のアセットのルートが `assets` を指す'
        notes: 'キー名は設定の設計書で決める（参考: `assets.root`）'
      - name: Mock
        description: なし（実ファイルを使用する）。外へのネットワークの要求を記録する
    flow: |-
      sequenceDiagram
        actor U as 文書の作成者
        participant C as mdmark CLI
        participant F as ファイル
        U->>C: mdmark export docs/guide.md
        C->>F: 文書を読み込み、画像・動画・音声を文書からの相対パス、無ければアセットのルートで探して読み込む
        C->>C: 画像を data URL で埋め、動画・音声を出力先のフォルダへコピーする
        C->>F: 1 枚の HTML と、コピーしたファイルを書き込む
        C-->>U: 終了コード 0
    expected:
      - 終了コードが 0
      - 書き出した HTML の画像（`#only-dark` の画像、GIF、アセットのルートにだけある `images/logo.png` を含む）が data URL で埋まっている
      - 動画・音声が出力先のフォルダへコピーされ、HTML がそのコピーを相対パスで指している
      - '`files/spec.pdf` はコピーされず、HTML のリンクは記載したパスのまま'
      - 書き出した HTML を file:// で開いたとき、外へのネットワークの要求が 0 件
    test: test_normal_when_media_embedded
  - name: '正常シナリオ（blob: と動的 import を許さない環境で開く）'
    setup:
      - name: 埋めるモジュールを使用する文書
        description: '`extensions` の拡張のマーカー・ビューのマーカー・Chart.js のマーカー・言語 `ts` のコードブロック・`libraries` に無いファイルのモジュールを記載したマーカーを持つ文書 1 つと、`extensions` にマーカーを描く拡張のモジュールを記載した設定'
        notes: 拡張のモジュールは `load` の中で同じフォルダの別のファイルを動的 `import()` で読み込む
      - name: Mock
        description: "外部ライブラリと色分けのライブラリは手元のモジュール。書き出した HTML を、`Content-Security-Policy: script-src 'unsafe-inline'` のヘッダーを付けて返却する手元のサーバーから開く（`blob:` と `data:` のスクリプトと、動的 `import()` で読み込むスクリプトを許さない）"
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: 起動の処理・拡張・部品・色分け・外部ライブラリを 1 つのスクリプトにまとめる
        C->>F: まとめたスクリプトを script 要素に入れた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: blob: と動的 import を許さない環境で開く
        F-->>R: 拡張のマーカー・ビュー・図・色分けしたコードブロック
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - 拡張のマーカーの場所に拡張が描いた要素があり、通知ブロックが出ない
      - ビューのマーカーの場所にビューが描かれる
      - Chart.js のマーカーの場所に `canvas` が描かれ、通知ブロックが出ない
      - '`ts` のコードブロックが色分けされている'
      - '`libraries` に無いファイルのモジュールを記載したマーカーの場所に通知ブロックが出る'
      - 開いてから描き終えるまでに、CSP の違反（`securitypolicyviolation`）が 0 件で、`blob:` の URL への要求が 0 件
    test: test_normal_when_blob_and_dynamic_import_blocked
  - name: 正常シナリオ（脚注を持つ文書）
    setup:
      - name: 脚注を持つ文書
        description: '段落に `[^src]` と定義 `[^src]: 出典の説明` を持つ文書 1 つと、設定'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>F: 配布物と本文を埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: file:// で開き、番号にポインターを乗せ、末尾の一覧を開く
        F-->>R: 脚注のツールチップと開いた一覧
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - file:// で開くと、番号 `1` にポインターを乗せたとき `出典の説明` のツールチップが出る
      - 末尾の脚注の一覧は閉じていて、見出しを押すと `1` と `出典の説明` が出る
      - 外への要求が 0 件
    test: test_normal_when_footnotes
    refs:
      - SC-472-71#scenarios[正常シナリオ]
  - name: 正常シナリオ（範囲のスクリプトと CSS）
    setup:
      - name: 範囲のスクリプトを持つ文書
        description: '`<!-- html -->` の範囲に `html`・`css`・`ts` のコードブロックを 1 つずつ配置した文書 1 つと、`features.html-scripts` を `true` にした設定'
        notes: '`ts` は型の注釈を持つ既定のエクスポートの関数で、ノードを押すと根の要素に class `is-open` を付与・解除する'
      - name: Mock
        description: "書き出した HTML を、`Content-Security-Policy: script-src 'unsafe-inline'` のヘッダーを付けて返却する手元のサーバーから開き、外への要求を全て止める（`blob:` と `data:` のスクリプトと、動的 `import()` で読み込むスクリプトを許さない）"
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス
        C->>C: 範囲の ts の型を削除し、既定のエクスポートを範囲ごとに登録する構造にする
        C->>F: 範囲の関数をまとめたスクリプトに加えた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: 外への要求を止めて開く
        F-->>R: 範囲の css と ts を適用した文書
        R->>F: 範囲のノードを押す
        F-->>R: 根の要素に class が付いた表示
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - 範囲のノードの背景が `css` の色で描かれる
      - 範囲のノードを押すと根の要素に class `is-open` が付く
      - 開いてから描き終えるまでに、CSP の違反（`securitypolicyviolation`）が 0 件で、`blob:` の URL への要求と外への要求が 0 件
    test: test_normal_when_range_scripts
  - name: 正常シナリオ（取り込みとアイコンを埋める）
    setup:
      - name: 取り込みとアイコンを持つ文書
        description: '`<!-- include: {"path": "共通/手順.md", "heading": "実行"} -->` と、作業のフォルダの `src/app.ts` の 3〜5 行目を指す include のマーカーと、配布物にまとめていない名前の `icon:` を持つ文書 1 つ'
        notes: '`共通/手順.md` と `src/app.ts` は作業のフォルダにある'
      - name: Mock
        description: 正常シナリオと同じく、書き出しがネットワークを読み込まない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: mdmark export 文書のパス（出力を指定）
        C->>C: 取り込むファイルと、文書が使用する Lucide のアイコンを読み込む
        C->>F: 取り込んだ中身とアイコンを埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: HTML だけを空のフォルダへコピーして file:// で開く
        F-->>R: 取り込んだ中身とアイコンを持つ文書
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - 開いた文書のマーカーの場所に、`実行` の見出しの下の中身と、`src/app.ts` の 3〜5 行目の言語 `ts` のコードブロックが描かれている
      - まとめていない名前のアイコンが描かれている
      - 描き終えるまでに、ページ自身と画像の `data:` のほかの要求が 0 件
    test: test_normal_when_includes_and_icons_embedded
  - name: 正常シナリオ（設定を重ねる）
    setup:
      - name: 端末の設定
        description: '`MDMARK_CONFIG` で指す一時フォルダの `settings.yaml`。`config.cascade: true`・`config.applyToExport: true`・`features.callout: false` を記載する'
      - name: 重ねる設定を持つフォルダ
        description: '上のフォルダの `mdmark.config.yaml` に `theme: ./theme.css` と `extensions` の固有の部品 1 つを記載し、その下の `docs/` の `mdmark.config.yaml` に `features.table: false` を記載する。`docs/` に注意書き・表・固有の部品のマーカーを持つ文書を 1 つ配置する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力の HTML
        actor R as 読者
        W->>C: docs/ で mdmark export 文書のパス
        C->>C: 端末の設定と docs/ から上の mdmark.config.yaml を読み込んで重ね、theme と extensions は記載した設定ファイルのフォルダから読み込む
        C->>F: 重ねた設定・theme の CSS・extensions を埋めた HTML を書き込む
        C-->>W: 出力のパス・終了コード 0
        R->>F: file:// で開く
        F-->>R: 文書
    expected:
      - 終了コードが 0 で、指定した出力に HTML が 1 つある
      - file:// で開くと、注意書きと表の機能がオフで描かれ、固有の部品が描かれ、`theme.css` の規則が該当する
      - 外への要求が 0 件
      - 端末の設定と 2 つの `mdmark.config.yaml` は書き換わらない
    test: test_normal_when_cascaded
  - name: 正常シナリオ（最初の 1 つだけを読み込む）
    setup:
      - name: 端末の設定
        description: '正常シナリオ（設定を重ねる）の端末の設定のうち、`config.cascade: false` にしたもの'
      - name: 重ねる設定を持つフォルダ
