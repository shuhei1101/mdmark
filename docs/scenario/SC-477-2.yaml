id: SC-477-2
visibility: internal
title: 座標で書いたフロー図とシーケンス図をmapへ移して描く
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 座標で書いた図の文書を持つフォルダ
        description: |-
          手元のバージョンを 1 つ前のマイナーバージョンにした設定・索引と、`<!-- flow -->` の範囲 2 つと `<!-- sequence -->` の範囲 1 つを記載した文書 1 つを持つフォルダ。
          フロー図の 1 つは、`hint` を持つシステムの枠と 3 層・枠の外の外部のシステム・種類の異なるノード（`llm`・`script`・`data`・`external`）・種類の異なる線（`flow`・`read`・`write`）・`tip` を持つ線・`io` を持つノード・リンク先を持つノード・題名を持つ。
          もう 1 つは判定フローチャートの種類のノード（開始・質問・アクション・結果）と `YES`・`NO` のラベルの線だけを持つ。
          シーケンス図は、参加者 3 つ・メッセージ 4 つ・loop の範囲 1 つを持つ
      - name: Mock
        description: 呼んだ CLI のバージョンを目標のバージョンにし、リポジトリの `migrations/next/` の移行の手順を目標のバージョンの手順として使用する。描くページは jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      flowchart TD
        A[図を描く:正常シナリオ（座標で書いた図の範囲）] --> B[設定と索引を点検する:正常シナリオ（座標で書いた図がある）]
        B --> C[バージョンを上げる:正常シナリオ（座標で書いた図を map へ書き換える）]
        C --> D[設定と索引を点検する:正常シナリオ]
        D --> E[Mermaidと補足で図を描く:正常シナリオ]
        E --> F[Mermaidと補足で図を描く:正常シナリオ（シーケンス図）]
        F --> G[図の要素のツールチップを確認する:正常シナリオ]
        click A "id:SC-472-43#scenarios[正常シナリオ（座標で書いた図の範囲）]"
        click B "id:SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]"
        click C "id:SC-472-27#scenarios[正常シナリオ（座標で書いた図を map へ書き換える）]"
        click D "id:SC-472-78#scenarios[正常シナリオ]"
        click E "id:SC-472-8#scenarios[正常シナリオ]"
        click F "id:SC-472-8#scenarios[正常シナリオ（シーケンス図）]"
        click G "id:SC-472-40#scenarios[正常シナリオ]"
    expected:
      - 移行の前に描くと、`flow`・`sequence` の範囲ごとに、図の代わりに map へ変換できる旨と `mdmark upgrade` の案内を持つ書き方の警告が出て、文書の残りは描かれる
      - 1 回目の `mdmark check` が、`flow`・`sequence` の範囲ごとにファイルと行を指し、`mdmark upgrade` での変換を案内する行を出し、終了コード 0 以外を返却する
      - '`mdmark upgrade` の後、文書の `flow`・`sequence` の範囲が `<!-- map -->` の範囲（`mermaid` のブロック 1 つと補足 `<!-- map-data: {…} -->`）に書き換わり、範囲の外の本文は変わっていない。設定の `map.kinds`・`map.lines` に、文書が使っていたノードの種類と線の種類の名前・アイコン・模様が加わる'
      - 移行の後の 2 回目の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 移行の後に描くと、構成図に元のフロー図と同じノード・システムの枠と層の入れ子の箱・線とラベルが、ノードの種類の行と線の模様つきで自動配置され、リンク先を持つノードを押すとリンク先へ移る。判定フローチャートは開始・質問・アクション・結果の形のノードと `YES`・`NO` のラベルで描かれる
      - シーケンス図に元と同じ参加者・メッセージが同じ順で描かれ、loop の範囲がブロックとして描かれる
      - 元の `hint`・`io`・`tip` の文が、補足の `notes` の説明として、ノード・箱・線のツールチップに出る
    test: test_normal
    uses:
      - SC-472-43#scenarios[正常シナリオ（座標で書いた図の範囲）]
      - SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]
      - SC-472-27#scenarios[正常シナリオ（座標で書いた図を map へ書き換える）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ（シーケンス図）]
      - SC-472-40#scenarios[正常シナリオ]
  - name: 正常シナリオ（書き換えない図がある）
    setup:
      - name: 書き換えない図を持つフォルダ
        description: 正常シナリオのフォルダの文書に、JSON として読めない部品の定義を持つ `<!-- flow -->` の範囲 1 つを加えたもの
      - name: 手で修正した文書
        description: 移行の後に、文書の作成者が、移行の報告に挙がった範囲を `<!-- map -->` の範囲（Mermaid と補足）で記載し直したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      flowchart TD
        A[バージョンを上げる:正常シナリオ（書き換えない記載を移行の報告に挙げる）] --> B[設定と索引を点検する:正常シナリオ（座標で書いた図がある）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[Mermaidと補足で図を描く:正常シナリオ]
        click A "id:SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]"
        click B "id:SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-8#scenarios[正常シナリオ]"
    expected:
      - '`mdmark upgrade` の出力の移行の報告に、読めない部品の定義を持つ範囲が、ファイルと行と理由つきで挙がる。その範囲は書き換わらず、ほかの範囲は正常シナリオと同じく map の範囲に書き換わる'
      - 手で修正する前の `mdmark check` が、書き換わらなかった 1 か所だけを座標で書いた図の範囲として指す
      - 手で修正した後の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 手で修正した後に描いた文書で、記載し直した範囲が map の図で描かれる
    test: test_normal_when_unconverted
    uses:
      - SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]
      - SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ]
lead: 文書の作成者が、座標を記載した JSON の `flow`・`sequence` で描いていた図を、描いた文書の警告と点検の案内に従って移行の手順で map の範囲へ書き換え、移行の報告に挙がった図を手で記載し直して、点検に合格した map の図で描く。
issue: 467
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 座標の JSON を手で Mermaid と補足に書き換えずに今の図を map へ移せ、移せなかった図だけを手で記載し直せる
  - name: 読者
    interest: 移行の前と同じノード・線・ラベル・説明を、map の図で辿って参照できる
trigger: 文書の作成者が、`flow`・`sequence` を廃止したバージョンの mdmark に上げる
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
success_guarantee: 文書の `flow`・`sequence` の範囲が全て map の範囲で記載され、点検がずれ 0 件で通り、描いた文書に元の図と同じノード・線・ラベル・参加者・メッセージと説明が map の図で描かれる。
minimal_guarantee: 移行の手順は、書き換えない範囲（読めない部品の定義）をファイルと行と理由つきで移行の報告に挙げ、その範囲を書き換えない。移行の前の文書と設定は、移行のコピーのフォルダに残る。書き換えていない `flow`・`sequence` の範囲は、描くと書き方の警告になり、文書の残りは描かれる。
test_file: tests/e2e/複合ユースケース/座標で書いたフロー図とシーケンス図をmapへ移して描く.spec.ts
