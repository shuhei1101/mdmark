id: SC-472-10
visibility: internal
title: VSCodeでプレビューを開く
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本のワークスペース
        description: 見出し・表・注意書き・map の構成図を持つ Markdown を 1 つ配置したフォルダ。`mdmark.version` は既定の `latest`
      - name: Mock
        description: jsDelivr の代わりに、このブランチでビルドした配布物を版付きの構造の URL で配る手元のサーバー。GitHub のタグ一覧は `v0.7.0`・`v0.6.0`・`vscode-v0.1.0` を返却する代役
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant ED as エディタ（VS Code）
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as プレビュー（Webview）
        participant CDN as jsDelivr
        W->>ED: Shift+Alt+D を押す
        ED->>EX: mdmark.openPreviewToSide
        EX->>GH: タグ一覧を取る
        GH-->>EX: v0.7.0・v0.6.0・vscode-v0.1.0
        EX->>EX: vX.Y.Z の最新 v0.7.0 を選び、前回のバージョンとして残す
        EX->>PV: 横の列にパネルを開く
        PV->>CDN: v0.7.0 の配布物を読み込む
        CDN-->>PV: dist/index.js・dist/index.css
        PV-->>EX: ready
        EX->>PV: Markdown の全文と設定を送信する
        PV->>PV: mount で描く
        PV-->>W: 描いた文書を表示
    expected:
      - Markdown のエディタの横の列にプレビューのパネルが開く
      - パネルに見出し・表・注意書き・map の構成図が mdmark で描かれる
      - 読み込んだ配布物のバージョンが `v0.7.0` で、`vscode-v0.1.0` を選んでいない
      - 前回のバージョンとして `v0.7.0` が拡張機能の状態に残る
    test: test_normal
  - name: 正常シナリオ（同じ列に開く）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant ED as エディタ（VS Code）
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>ED: コマンドパレットで mdmark: プレビューを開く
        ED->>EX: mdmark.openPreview
        EX->>PV: 同じ列のタブにパネルを開く
        PV-->>W: 描いた文書を表示
    expected:
      - プレビューのパネルが Markdown のエディタと同じ列のタブで開き、文書が描かれる
    test: test_normal_when_same_column
  - name: 正常シナリオ（バージョンを固定する）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ。ワークスペースの設定で `mdmark.version` を `v0.6.0` にする
      - name: Mock
        description: 正常シナリオと同じ。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        participant CDN as jsDelivr
        W->>EX: プレビューを横に開く
        EX->>PV: v0.6.0 でパネルを開く
        PV->>CDN: v0.6.0 の配布物を読み込む
        PV-->>W: 描いた文書を表示
    expected:
      - 読み込んだ配布物のバージョンが `v0.6.0`
      - タグ一覧の代役が 1 回も呼ばれない
    test: test_normal_when_version_pinned
  - name: 正常シナリオ（タグ一覧を取れない）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ
      - name: 前回のバージョン
        description: 拡張機能の状態に前回のバージョン `v0.6.0` が残っている
      - name: Mock
        description: タグ一覧の代役は応答しない（待ちの上限まで返却しない）。配布物は正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>GH: タグ一覧を取る
        GH--xEX: 待ちの上限まで応答なし
        EX->>EX: 前回のバージョン v0.6.0 を使用する
        EX->>PV: v0.6.0 でパネルを開く
        PV-->>W: 描いた文書を表示
    expected:
      - 読み込んだ配布物のバージョンが前回のバージョンの `v0.6.0`
      - パネルに描けない理由は出ない
    test: test_normal_when_tags_unreachable
  - name: 異常シナリオ（配布物を読み込めない）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ
      - name: Mock
        description: 配布物を配る手元のサーバーが配布物の要求に応えない（オフラインの代わり）。タグ一覧は正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        participant CDN as jsDelivr
        W->>EX: プレビューを横に開く
        EX->>PV: v0.7.0 でパネルを開く
        PV->>CDN: v0.7.0 の配布物を読み込む
        CDN--xPV: 応答なし
        PV-->>EX: 読み込めなかったことを通知する
        PV-->>W: 描けない理由と「リロード」のボタンを表示
    expected:
      - パネルに、配布物を読み込めない（オフライン）ことを示す理由と「リロード」のボタンが出る
      - Markdown と `mdmark.config.yaml` は書き換わらない
    test: test_error_when_distribution_unreachable
  - name: 異常シナリオ（指定したバージョンが無い）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ。ワークスペースの設定で `mdmark.version` を `v9.9.9` にする
      - name: Mock
        description: 配布物を配る手元のサーバーは `v9.9.9` に 404 を返却する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        participant CDN as jsDelivr
        W->>EX: プレビューを横に開く
        EX->>PV: v9.9.9 でパネルを開く
        PV->>CDN: v9.9.9 の配布物を読み込む
        CDN-->>PV: 404
        PV-->>W: 描けない理由と「リロード」のボタンを表示
    expected:
      - パネルに、指定したバージョン `v9.9.9` が無いことを示す理由と「リロード」のボタンが出る
    test: test_error_when_version_missing
  - name: 異常シナリオ（バージョンを決められない）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ
      - name: 前回のバージョン
        description: 拡張機能の状態に前回のバージョンが無い（初めて開く）
      - name: Mock
        description: タグ一覧の代役は応答しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>GH: タグ一覧を取る
        GH--xEX: 待ちの上限まで応答なし
        EX->>PV: バージョンを決められないことを通知してパネルを開く
        PV-->>W: 描けない理由と「リロード」のボタンを表示
    expected:
      - パネルに、バージョンを決められない（タグ一覧を取れず前回のバージョンも無い）ことを示す理由と「リロード」のボタンが出る
      - 配布物の要求が 0 件
    test: test_error_when_version_undecidable
  - name: 正常シナリオ（範囲のスクリプトと CSS）
    setup:
      - name: 見本のワークスペース
        description: '`<!-- html -->` の範囲に `html`・`css`・`ts` のコードブロックを 1 つずつ配置した Markdown と、`features.html-scripts` を `true` にした `mdmark.config.yaml` を配置したフォルダ'
      - name: Mock
        description: 正常シナリオと同じ。加えて、範囲の `ts` の型を削除する変換のライブラリを、配布物と同じ手元のサーバーから配る
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: mdmark.openPreviewToSide
        EX->>PV: 横の列にパネルを開く
        EX->>PV: Markdown の全文と設定を送信する
        PV->>PV: mount で描き、範囲の関数をページの nonce を付けた script 要素で動かす
        PV-->>W: 範囲の css と ts を適用した文書
        W->>PV: 範囲のノードを押す
        PV-->>W: 根の要素に class が付いた表示
    expected:
      - パネルの範囲のノードの背景が `css` の色で描かれる
      - 範囲のノードを押すと根の要素に class `is-open` が付く
      - パネルの CSP の値が正常シナリオと同じで、CSP の違反が 0 件
    test: test_normal_when_range_scripts
  - name: 正常シナリオ（mermaid のコードブロック）
    setup:
      - name: 見本のワークスペース
        description: 言語 `mermaid` の flowchart のコードブロックを 1 つ持つ Markdown と、`mermaid.url` に手元の配信の URL を記載した設定ファイルを配置したフォルダ
      - name: Mock
        description: 正常シナリオと同じ。加えて、mermaid の本体と chunk を、手元の配信が jsDelivr と同じパス（`/npm/mermaid@12.3.0/dist/`）で配る（既定の URL は jsDelivr の origin のため、手元の代役に差し替えられない）
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        participant CDN as jsDelivr
        W->>EX: mdmark.openPreviewToSide
        EX->>PV: 横の列にパネルを開き、Markdown の全文と設定を送信する
        PV->>CDN: mermaid の本体と chunk を読み込む
        CDN-->>PV: mermaid
        PV->>PV: mount で描く
        PV-->>W: 図の枠に入った mermaid の図
    expected:
      - パネルの mermaid のコードブロックの場所に、図の枠と SVG の図がある
      - パネルの CSP の値の `script-src` に mermaid の読み込み先の origin が入っていて、CSP の違反が 0 件
      - VS Code の配色をダークに切り替えると、mermaid の図が暗い配色で再描画される
    test: test_normal_when_mermaid
  - name: 正常シナリオ（取り込む文書を描く）
    setup:
      - name: 取り込みを持つワークスペース
        description: '`<!-- include: {"path": "共通/手順.md", "heading": "実行"} -->` を持つ Markdown と、その Markdown からの相対パスに `共通/手順.md` を配置したフォルダ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant ED as エディタ（VS Code）
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>ED: Shift+Alt+D を押す
        ED->>EX: mdmark.openPreviewToSide
        EX->>EX: include のマーカーの取り込み先をワークスペースから読み込む
        EX->>PV: Markdown の全文・設定・取り込む文書の表を送信する
        PV->>PV: mount で描く
        PV-->>W: 取り込んだ中身を持つ文書を表示
        W->>ED: 共通/手順.md を書き換えて保存する
        EX->>PV: 取り込む文書の表をもう一度送信する
        PV-->>W: 再描画した文書を表示
    expected:
      - プレビューのマーカーの場所に、`実行` の見出しとその下の中身が描かれている
      - '`共通/手順.md` を保存した後、プレビューの取り込んだ中身が書き換えた後の文になっている'
      - 取り込み先がワークスペースに無いマーカーの場所には、記載の警告が出ている
    test: test_normal_when_includes
  - name: 正常シナリオ（設定を重ねる）
    setup:
      - name: 端末の設定
        description: '`MDMARK_CONFIG` で指す一時フォルダの `settings.yaml`。`config.cascade: true` と `features.callout: false` を記載する'
      - name: 重ねる設定を持つワークスペース
        description: 'ワークスペースのフォルダの `mdmark.config.yaml` に `theme: ./theme.css` と `extensions` の固有の部品 1 つを記載し、その下の `docs/` の `mdmark.config.yaml` に `features.table: false` を記載する。`docs/` に注意書き・表・固有の部品のマーカーを持つ Markdown を 1 つ配置する'
        notes: '`mdmark.configPath` は既定の空'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant PV as プレビュー（Webview）
        W->>EX: docs/ の Markdown でプレビューを横に開く
        EX->>FS: 端末の設定と、docs/ から上の mdmark.config.yaml を読み込む
        EX->>EX: 端末の設定 → 上 → 近いの順に重ね、theme と extensions のフォルダを読み込める場所に追加する
        EX->>PV: theme の CSS と extensions を読み込むパネルを開く
        PV->>PV: extensions を登録してから mount で描く
        PV-->>W: 描いた文書を表示
    expected:
      - 注意書きが注意書きの枠ではなく引用として、表が機能を付けない表として描かれる
      - 固有の部品のマーカーの場所に、固有の部品が描いた要素がある
      - '`theme.css` の規則が描く先の要素の計算値に出ている'
      - パネルの CSP の違反が 0 件
    test: test_normal_when_cascaded
  - name: 正常シナリオ（最初の 1 つだけを読み込む）
    setup:
      - name: 端末の設定
        description: '正常シナリオ（設定を重ねる）の端末の設定のうち、`config.cascade: false` にしたもの'
      - name: 重ねる設定を持つワークスペース
        description: 正常シナリオ（設定を重ねる）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant PV as プレビュー（Webview）
        W->>EX: docs/ の Markdown でプレビューを横に開く
        EX->>FS: 端末の設定と、docs/ から上へ最初に見つかった mdmark.config.yaml を読み込む
        EX->>EX: 端末の設定 → docs/ の設定の順に重ねる
        EX->>PV: パネルを開いて描かせる
        PV-->>W: 描いた文書を表示
    expected:
      - 注意書きと表の機能がオフで描かれる
      - 固有の部品のマーカーの場所には何も描かれず、`theme.css` の規則は該当しない
    test: test_normal_when_first_only
  - name: 異常シナリオ（設定ファイルを読み込めない）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（設定を重ねる）の端末の設定のうち、YAML として読み込めない行（閉じていない括弧）を 1 つ持つもの
      - name: 重ねる設定を持つワークスペース
        description: 正常シナリオ（設定を重ねる）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant PV as プレビュー（Webview）
        W->>EX: docs/ の Markdown でプレビューを横に開く
        EX->>FS: 端末の設定を読み込む
        FS-->>EX: YAML として読み込めない
        EX->>PV: 読み込めた設定で描かせ、読み込めないファイルを通知する
        PV-->>W: 文書と、上部に読み込めないファイルを示す帯と「設定ファイルを開く」
        W->>PV: 「設定ファイルを開く」を押す
        PV-->>EX: 設定ファイルを開く依頼
        EX-->>W: 端末の設定をエディタで開く
    expected:
      - パネルに文書が描かれ、上部の帯に端末の設定を読み込めないことと、そのファイルのパスが出る
      - 帯の「設定ファイルを開く」を押すと、端末の設定の `settings.yaml` がエディタで開く
      - 端末の設定と 2 つの `mdmark.config.yaml` は書き換わらない
    test: test_error_when_config_unreadable
  - name: 正常シナリオ（設定の aliases のエイリアス）
    setup:
      - name: エイリアスを持つワークスペース
        description: '`mdmark.config.yaml` の `aliases` に、`glossary.yaml` の用語の列（名前・別名・意味）を指す用語のエイリアスの行を 1 つ記載したフォルダ。`glossary.yaml` は名前 `描画`・別名 `レンダリング`・意味 1 文の用語を 1 つ持つ。本文に `レンダリング` を含む Markdown を 1 つ配置する'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>FS: mdmark.config.yaml と aliases の行が指す glossary.yaml を読み込む
        EX->>EX: aliases の行と読み込んだ YAML からエイリアスを作る
        EX->>PV: Markdown の全文・設定・エイリアスを送信する
        PV->>PV: エイリアスを指定して mount で描く
        PV-->>W: 別名に下線を付けた文書を表示
        W->>PV: 下線の単語にポインターを乗せる
        PV-->>W: 用語の種類と意味のツールチップ
    expected:
      - 本文の `レンダリング` に用語の下線が付く
      - 下線の単語にポインターを乗せると、ツールチップの「用語」の区分に、名前 `描画` と `glossary.yaml` の意味が出る
      - 設定に `aliases` が無い文書のプレビューは、下線もツールチップも出さず、今と同じに描かれる
    test: test_normal_when_aliases
  - name: 異常シナリオ（aliases の YAML が無い）
    setup:
      - name: エイリアスを持つワークスペース
        description: 正常シナリオ（設定の aliases のエイリアス）の `aliases` に、無い YAML を指す行を 1 つ追加したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>FS: aliases の行が指す YAML を読み込む
        FS-->>EX: 1 つの行の YAML が無い
        EX->>EX: 読み込めない行を除いてエイリアスを作り、出力チャネルに警告を記録する
        EX->>PV: Markdown の全文・設定・エイリアスを送信する
        PV-->>W: 読み込めた行のエイリアスに下線を付けた文書を表示
    expected:
      - 本文の `レンダリング` に用語の下線が付き、文書が描かれる
      - 出力チャネルに、読み込めない `aliases` の行の位置とずれの種類が記録される
      - パネルに設定ファイルを読み込めない帯は出ない
    test: test_error_when_aliases_missing
  - name: 正常シナリオ（ツールチップの位置と相対パスの色分けのライブラリ）
    setup:
      - name: 手元の色分けのライブラリを指すワークスペース
        description: '`ts` のコードブロックと脚注の参照を 1 つずつ持つ Markdown と、`tooltips.placement: bottom` と、`syntax.url` に同じフォルダの `@highlightjs/cdn-assets` の `es/` フォルダの手元のコピーを相対パスで記載した `mdmark.config.yaml` を配置したフォルダ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: mdmark.openPreviewToSide
        EX->>EX: syntax.url を設定ファイルのフォルダから解決し、Webview で読み込める URL にする
        EX->>PV: 横の列にパネルを開き、Markdown の全文と設定を送信する
        PV->>PV: 手元の色分けのライブラリの本体と ts のモジュールを読み込み、mount で描く
        PV-->>W: 色分けしたコードブロック
        W->>PV: 脚注の参照にフォーカスを移す
        PV-->>W: 参照の下に出たツールチップ
    expected:
      - パネルの `ts` のコードブロックが色分けされ、通知ブロックが出ない
      - 読み込んだ色分けのライブラリの本体の URL が、設定ファイルのフォルダの手元のコピーを指す Webview の URL
      - 脚注の参照にフォーカスを移すと、ツールチップが参照の下に出る
      - CSP の違反が 0 件
