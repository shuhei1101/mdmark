id: SC-472-63
visibility: internal
title: "比較元のMarkdownを指定して変更を強調する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、要素・Markdown・比較元の Markdown を指定して文書を描く HTML
        notes: '`diffSource` は指定しない'
      - name: 比較元の Markdown
        description: 段落 A・段落 B・段落 C の 3 つの段落を持つ文書
      - name: 描く Markdown
        description: 比較元の段落 A の単語を 1 つ書き換え、段落 B を削除し、段落 C の後に段落 D を追加した文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素・Markdown・比較元の Markdown を指定して描かせる
        M->>M: 比較元と本文をブロックで比べる
        M-->>P: 変わったブロックを強調した文書
        P-->>U: 文書を表示
    expected:
      - 段落 A と段落 D が追加・変更のブロックとして強調され、段落 C は強調されていない
      - 段落 B が、段落 A の前（本文の先頭）に削除のブロックとして出る（直前の段落 A は書き換えたブロックで、変えていないブロックではないため）
      - 差分を開く「変更表示」のボタンが無い
      - '取り出し元を指定したときの `diffMode: blocks` と同じ外観（面の色と左の余白の `+`・`−`）で出る'
    test: test_normal
  - name: 正常シナリオ（比較元を差し替える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ。`mount` の戻り値の `update` を呼べる
      - name: 比較元の Markdown
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 正常シナリオと同じ
      - name: 次の比較元の Markdown
        description: 描く Markdown から段落 D だけを除いた文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 比較元の Markdown を指定して描かせる
        M-->>P: 段落 A・B・D を強調した文書
        P->>M: update(描く Markdown, {baseMarkdown: 次の比較元})
        M-->>P: 段落 D だけを強調した文書
        P->>M: update(描く Markdown)
        M-->>P: 段落 D だけを強調した文書
        P->>M: update(描く Markdown, {baseMarkdown: null})
        M-->>P: 強調の無い文書
        P-->>U: 文書を表示
    expected:
      - 次の比較元に差し替えた後、段落 D だけが追加のブロックとして強調され、削除のブロックが無い
      - 第 2 引数を省いて `update` を呼んだ後も、前の比較元（次の比較元）との強調のまま
      - '`baseMarkdown: null` で `update` を呼んだ後、追加・変更・削除のブロックが無い'
    test: test_normal_when_base_replaced
  - name: 正常シナリオ（比較元を指定しない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じページで、比較元を `null` にして文書を描く
      - name: 比較元の Markdown
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素・Markdown・比較元 null を指定して描かせる
        M-->>P: 強調の無い文書
        P->>M: update(描く Markdown, {baseMarkdown: 比較元})
        M-->>P: 段落 A・B・D を強調した文書
        P-->>U: 文書を表示
    expected:
      - 描いた直後、追加・変更・削除のブロックが無く、比較元を省いたときと同じ HTML になる
      - 比較元を `update` で指定した後、正常シナリオと同じブロックが強調される
    test: test_normal_when_base_null
  - name: 正常シナリオ（比較元と同じ本文）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 比較元の Markdown と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 比較元と同じ Markdown を指定して描かせる
        M-->>P: 強調の無い文書
        P-->>U: 文書を表示
    expected:
      - 追加・変更・削除のブロックが無い
    test: test_normal_when_unchanged
  - name: 異常シナリオ（文字列でない比較元）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じページで、比較元に数値 `1` を指定して文書を描く
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 比較元に 1 を指定して描かせる
        M-->>P: TypeError
    expected:
      - '`mount` が、`baseMarkdown` を文字列か `null` で指定するよう伝える `TypeError` を投げる'
      - 描く先の要素の中は空のまま
    test: test_error_when_base_not_string
  - name: 正常シナリオ（右側の目次で変わったセクションを示す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じページで、右側の目次を出す設定で文書を描く。`mount` の戻り値の `update` を呼べる
        notes: 設定の `side-toc.mode` は `hover`。右側の目次は、描いた後に右端の線へポインターを置いて出す
      - name: 比較元の Markdown
        description: h2 の見出し A・B・C の 3 つのセクションを持ち、各セクションが段落を 1 つ持つ文書
      - name: 描く Markdown
        description: 比較元のセクション B の段落の単語を 1 つ書き換え、セクション C の段落を削除し、末尾に段落を持つ h2 の見出し D のセクションを追加した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 比較元の Markdown を指定して描かせる
        M-->>P: 変わったブロックを強調し、変わったセクションの目次の項目に変更のマーカーを付けた文書
        U->>P: 右端の線へポインターを置く
        P-->>U: 見出し B・C・D の項目に変更のマーカーがある目次
        P->>M: update(描く Markdown, {baseMarkdown: null})
        M-->>P: 強調と変更のマーカーの無い文書
        P-->>U: 文書を表示
    expected:
      - 右側の目次の見出し B・C・D の項目に変更のマーカーがあり、見出し A の項目には無い
      - 変更のマーカーの付いた項目は、読み上げで項目の名前に続けて `変更` と読まれる（視覚に出さない文言を持つ）
      - '`baseMarkdown: null` で `update` を呼んだ後、右側の目次のどの項目にも変更のマーカーが無い'
    test: test_normal_when_side_toc_marked
  - name: 正常シナリオ（固定した右側の目次で変わったセクションを示す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次で変わったセクションを示す）と同じ
        notes: 設定の `side-toc.mode` は `fixed`。描いた後に目次を出すボタンを押し、右側の目次を出す
      - name: 比較元の Markdown
        description: 正常シナリオ（右側の目次で変わったセクションを示す）と同じ
      - name: 描く Markdown
        description: 正常シナリオ（右側の目次で変わったセクションを示す）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 比較元の Markdown を指定して描かせる
        M-->>P: 変わったセクションの目次の項目に変更のマーカーを付けた文書
        U->>P: 目次を出すボタンを押す
        P-->>U: 見出し B・C・D の項目に変更のマーカーがある目次
    expected:
      - 右側の目次の見出し B・C・D の項目に変更のマーカーがあり、見出し A の項目には無い
      - 変更のマーカーの付いた項目は、読み上げで項目の名前に続けて `変更` と読まれる
    test: test_normal_when_fixed_side_toc_marked
lead: 利用側のページが、描く Markdown と一緒に比較元の Markdown を文字列で `mount` に指定し、本文の中で比較元から追加・変更したブロックと削除したブロックの位置を差分のブロックで強調する。`update` で本文と比較元を差し替える。
issue: 222
primary_actor: mdmark を使用するアプリのページ
stakeholders:
  - name: 利用側のアプリの開発者
    interest: リビジョンの取り出し元を記載せずに、手元にある比較元の文字列を指定するだけで本文の中に変更を出せる
  - name: 読者
    interest: 本文を読み込みながら、比較元から変わったブロックと消えたブロックの位置が分かる
trigger: 利用側のページが、比較元の Markdown を持った状態で文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 描く先の要素がページにある
success_guarantee: 比較元から追加・変更したブロックは追加の色、削除したブロックは本文のその位置に削除の色で出る。右側の目次では、比較元から変わったブロックを持つセクションの項目に変更のマーカーが付く。比較元を省くか `null` にしたときは強調の無い文書を描く。
minimal_guarantee: 比較元が文字列でも `null` でもないときは、何も描かずに `TypeError` を投げる。
notes:
  取り出し元との関係: '`diffSource` と比較元を両方渡したときは、本文の中の強調に比較元を使用し、取り出し元はリビジョンを選ぶ差分の UI だけに使用する。`diffMode: blocks` と比較元を両方渡したときも、取り出し元からリビジョンを読み込まずに比較元で強調する。'
test_file: tests/e2e/単一ユースケース/比較元のMarkdownを指定して変更を強調する.spec.ts
