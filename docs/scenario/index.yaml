- page: SC-477-1.yaml
  summary: 文書の作成者が今の書き方のマーカーを点検の案内で移行の手順へかけ、移行の報告に挙がった記載を手で修正して、JSON の記載のまま書き出す
- page: SC-477-2.yaml
  summary: 文書の作成者が座標で書いたフロー図とシーケンス図を点検の案内で移行の手順へかけ、移行の報告に挙がった図を手で記載し直して、map の図で描く
- page: SC-472-93.yaml
  summary: 利用側が雛形に固有の部品と CSS を追加して型で点検し、図の文書を描いて読者の操作で確認する
- page: SC-472-89.yaml
