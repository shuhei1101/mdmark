  summary: 設定で mdmark に入れたテーマを選び、明暗は今の決め方のままそのテーマの配色で描く
- page: SC-472-30.yaml
  summary: プレビューの歯車のボタンかコマンドパレットから VS Code の設定画面を mdmark の項目に絞って開き、変えた設定をプレビューに映す
- page: SC-472-48.yaml
  summary: 文書の作成者が VS Code の差分ビューからプレビューを開き、追加・変更したブロックと削除したブロックを色分けした文書で読み込む
- page: SC-472-36.yaml
  summary: 表の列・行、バッジ、本文の一部を色の名前で強調し、テーマとダークに合わせた配色で描く
- page: SC-472-67.yaml
  summary: 画像に幅・統一し・キャプションを付け、ギャラリー・テーマごとの画像・動画・音声・GIF の停止を配置する
- page: SC-472-66.yaml
  summary: 読者が本文の画像を押すかキーで開き、ライトボックスで拡大して前後の画像へ移る
- page: SC-472-34.yaml
  summary: URL・リンク・添付のファイルだけの段落を、外へ要求せずにカードとして描く
- page: SC-472-35.yaml
  summary: cards のマーカーで囲んだリストの項目を、リンク・説明・アイコンのカードにして格子に並べる
- page: SC-472-69.yaml
  summary: 文書の作成者が Claude Code で global-setup を呼び、端末の設定を作る・移行し、tmux のセッションで常駐サーバーを起動して、つながりとフックを確認する
