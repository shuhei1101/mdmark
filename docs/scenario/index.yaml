- page: SC-472-77.yaml
  summary: Markdown と設定ファイルの書き換え・背面からの復帰・リロードで、プレビューを最後の内容で再描画する
- page: SC-472-14.yaml
  summary: エディタかプレビューをスクロールすると、元の行番号を手がかりにもう片方が同じ箇所まで動く
- page: SC-472-32.yaml
  summary: プレビューの配色を VS Code のライト・ダークに合わせて切り替え、設定で固定もできる
- page: SC-472-31.yaml
  summary: プレビューの外部の URL・Markdown へのリンク・`#` のリンクを開き、相対パスの画像を出す
- page: SC-472-6.yaml
  summary: 開いている Markdown を HTML に書き出し、既定のブラウザで開く
- page: SC-472-50.yaml
  summary: 開発者が `vscode-v{バージョン}` のタグを打つと、GitHub Actions が .vsix を作って GitHub Release に添える
