- page: SC-472-90.yaml
  summary: 文書の作成者が項目の表をビューのマーカーで囲み、読者がビューを切り替えて表形式を列で絞り込み、選んだ箇所にコメントを付ける
- page: SC-472-88.yaml
  summary: 文書の作成者が VS Code で記載しながら mdmark のプレビューで確認し、HTML に書き出してブラウザの印刷で PDF にする
- page: SC-472-86.yaml
  summary: 文書の作成者が MCP の常駐サーバーを起動し、プラグインを入れた 2 つのセッションから同じプロセスのツールを呼び、使用し終えたら止める
- page: SC-472-85.yaml
  summary: 文書の作成者がプラグインを入れ、Claude Code が記載する前に dev-docs でガイドを参照し、記載した後に check で点検する
- page: SC-472-94.yaml
  summary: 文書の作成者が端末の設定と上のフォルダの設定を重ね、VS Code のプレビュー・CLI の書き出し・Claude Code から呼んだ書き出しを同じ外観にそろえる
- page: SC-472-91.yaml
  summary: 文書の作成者がプラグインを入れ、global-setup で端末の設定と常駐サーバーを、setup で文書のフォルダの設定を用意して、MCP のツールで点検と書き出しを呼ぶ
- page: SC-472-84.yaml
  summary: 文書の作成者が CSS を端末の設定のフォルダのテンプレートに登録し、別のリポジトリで一覧から選んで配置し、theme に記載して書き出した HTML に適用する
- page: SC-472-87.yaml
  summary: 文書の作成者が Mermaid と補足で図を記載して点検し、読者が自動配置で描いた図をグループの中へ入る・開閉・巡回・シーケンスの再生で辿って読む
