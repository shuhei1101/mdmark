summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
items:
- page: SC-472-82.yaml
  summary: 開発者が依存の導入・lint・型検査・ビルド・テストを実行し、バージョンを埋めた配布物を得る
- page: SC-472-28.yaml
  summary: 利用側のページがバージョンのタグを固定した URL で配布物を読み込み、公開関数を呼ぶ
- page: SC-472-59.yaml
  summary: 利用側のページが要素と Markdown を指定して文書を描き、本文の差し替えと片付けをする
- page: SC-472-57.yaml
  summary: 利用側の処理が画面を持たずに Markdown を HTML 文字列にする
- page: SC-472-25.yaml
  summary: 利用側が自分の CSS で描いた文書の外観を変える
- page: SC-472-62.yaml
  summary: 設定の features を既定にし、文書のマーカーでその文書だけ機能をオン・オフする
- page: SC-472-46.yaml
  summary: 文書にマーカーがあるときだけ外部ライブラリを読み込み、読み込めない箇所に通知ブロックを出す
- page: SC-472-58.yaml
  summary: 印刷・PDF で折り畳みを開き、ダークを解除し、リンクの URL を併記して出す
- page: SC-472-73.yaml
  summary: マーカーで囲んだ表を、読者が並べ替え・絞り込み・ピン止めし、閉じた表を開く
- page: SC-472-64.yaml
  summary: GitHub と同じ `> [!NOTE]` などの引用を、種類ごとの注意書きの枠に描く
- page: SC-472-23.yaml
  summary: マーカーで囲んだ見出しごとのセクションをタブに描き、読者が切り替える
- page: SC-472-20.yaml
  summary: 番号付きリスト・罫線のフォルダ構成・`badge:` の行内のコードを、手順・ファイルツリー・バッジに描く
- page: SC-472-61.yaml
  summary: columns のマーカーで区切った本文を横に 2〜3 列で並べ、狭い画面では縦に並べる
- page: SC-472-12.yaml
  summary: include のマーカーの場所に、ほかの文書の全体・見出しの中・コードの行の範囲を取り込んで描く
- page: SC-472-38.yaml
  summary: wide のマーカーで囲んだ図・表・画像を、目次と文書の一覧に重ならない幅まで本文の幅より広げる
- page: SC-472-68.yaml
  summary: 見出しに GitHub と同じ ID とリンクを付け、マーカーの場所の目次からセクションへ移る
- page: SC-472-54.yaml
  summary: 一定量スクロールした文書で、画面の右下のボタンを押して描いた文書の先頭へ戻る
- page: SC-472-33.yaml
  summary: 文書の先頭のマーカーと設定で、配色の明暗・テーマ・右側の目次の出し方を文書ごとに指定する
- page: SC-472-21.yaml
  summary: 見出しのセクションと、表の行の下に出す行の詳細を、マーカーのとおりの開閉から開閉する
- page: SC-472-71.yaml
  summary: '`[^1]` と行内の `^[…]` の脚注を、本文の番号のツールチップと末尾の閉じた一覧で読み込む'
- page: SC-472-37.yaml
  summary: マーカーを付けた図と表に通し番号を付け、参照のリンクの文字を番号にする
- page: SC-472-49.yaml
  summary: 利用側が `registerExtension` でマーカーを追加し、マーカーのある文書でだけモジュールを読み込んで描かせる
- page: SC-472-65.yaml
  summary: 索引の用語が本文に出たら下線を付け、ポインターとフォーカスで意味を出す
- page: SC-472-72.yaml
  summary: マーカーで囲んだ表の用語・意味・別名の列から用語を入れる
- page: SC-472-75.yaml
  summary: 描いた文書を参照している文書と、用語が出る文書を確認する
- page: SC-472-70.yaml
  summary: 利用側の処理が索引と文書を指定し、ずれの一覧を受け取る
- page: SC-472-83.yaml
  summary: 文書の作成者が `mdmark init` で設定・利用側の CSS・索引・拡張のビルドの雛形を配置する
- page: SC-472-78.yaml
  summary: 文書の作成者が `mdmark check` で設定と索引の構造・索引と文書のずれ・書き出す対象を確認する
- page: SC-472-52.yaml
  summary: 文書の作成者が `mdmark check` に Markdown の文字列、またはファイルと YAML のキーを指定し、描いたときの記載の警告と同じずれを受け取る
- page: SC-472-56.yaml
  summary: 文書の作成者が `mdmark export` で 1 文書を、外を読み込まない 1 枚の HTML に書き出す
- page: SC-472-76.yaml
  summary: 文書の作成者が `mdmark build` で、参照・被参照・用語のツールチップが有効になる 1 枚の HTML にまとめる
- page: SC-472-13.yaml
  summary: 読者がまとめた HTML を file:// で開き、文書の一覧・リンク・戻ると進むで文書を行き来する
- page: SC-472-27.yaml
  summary: 文書の作成者が `mdmark upgrade` で移行の手順をバージョンの順に当て、点検に合格してから設定のバージョンを書き換える
- page: SC-472-43.yaml
  summary: 文書に部品の定義を記載し、共通の部品にグラフ・ER 図を図の決まりのとおりに描かせ、廃止した flow・sequence の範囲には変換の案内の警告を出す
- page: SC-472-11.yaml
  summary: 言語 mermaid のコードブロックを、mdmark の外観のテーマで図の枠に入れて描く
- page: SC-472-42.yaml
  summary: 読者が図を右上のボタンとキーで拡大・縮小し、ドラッグ・矢印キー・ボタンで動かす
- page: SC-472-40.yaml
  summary: 読者が図の矢印・ノード・ノードの中の用語の詳細を、ホバーとフォーカスで出るツールチップで読み込む
- page: SC-472-51.yaml
  summary: 読者がスライダーで値を変えてグラフを見、今の値を JSON にしてクリップボードへ写す
- page: SC-472-44.yaml
  summary: 利用側が自分の場所だけの部品を `registerExtension` で追加し、自分の場所だけの外観を CSS で適用する
- page: SC-472-79.yaml
  summary: 利用側が `// @ts-check` と JSDoc で記載した JavaScript を、配布物の型定義に対して `tsc --noEmit` で点検する
- page: SC-472-16.yaml
  summary: マーカーで囲んだ `html` のコードブロックを、スクリプトを落としてその場の HTML として描く
- page: SC-472-24.yaml
  summary: 埋め込んだ HTML の custom element に記載した定義から、図の部品をその場所に図の枠に記載して描く
- page: SC-472-47.yaml
  summary: 利用側のページが `DiffSource` を指定して文書を描き、差分を開いたときにリビジョンの一覧と本文を取り出す
- page: SC-472-63.yaml
  summary: 利用側のページが比較元の Markdown を文字列で指定し、本文の中で追加・変更・削除したブロックを強調する
- page: SC-472-55.yaml
  summary: 読者が 2 つのリビジョンの差分を、削除した行は赤・追加した行は緑・変わった文字は濃い色で見、リビジョンをもう一度選ぶ
- page: SC-472-45.yaml
  summary: 読者が差分の中の埋め込んだ HTML を、ソースの色分けから描いた結果の前と後に切り替える
- page: SC-472-29.yaml
  summary: マーカーで囲んだ項目の表を、読者がボード表示と表形式のビューで切り替えて確認する
- page: SC-472-74.yaml
  summary: 読者が表形式のビューを、マーカーの `filter=` で指定した列の見出しの絞り込みで絞る
- page: SC-472-80.yaml
  summary: 読者が本文の選んだ箇所にコメントを付け、利用側の読み込みと保存の関数で残す
- page: SC-472-81.yaml
  summary: 利用側がページと拡張のモジュールから部品の関数を呼び、要素にビューを描き、選んだ箇所にコメントを付ける
- page: SC-472-17.yaml
  summary: マーカーと行末の行コメントで、コードブロックにタイトル・行番号・行の強調と、追加した行・削除した行・強調のマーカーを付ける
- page: SC-472-10.yaml
