- page: SC-472-18.yaml
  summary: 読者が map のシーケンス図を、同じノードを持つ構成図の上で 1 通ずつ動かして読む
- page: SC-472-19.yaml
  summary: 読者が map のシーケンス図の参加者を選んでメッセージとライフラインを強調し、箱をドラッグして並び順を変える
- page: SC-472-95.yaml
