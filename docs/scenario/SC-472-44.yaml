id: SC-472-44
visibility: internal
title: "固有の部品とCSSを適用する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 固有の部品を読み込むページ
        description: mdmark の JavaScript と CSS の後に固有の CSS を読み込み、固有の部品を `registerExtension` で登録してから文書を描く HTML
      - name: 固有の部品の定義を持つ Markdown
        description: 固有の部品の定義 1 つと map の範囲 1 つを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。固有の部品は、受けた定義のタイトルを要素に記載する手元のモジュール
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 固有の部品
        P->>M: registerExtension で固有の部品を登録する
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: 部品の定義を指定して描かせる
        X-->>M: マーカーの場所に描く
        M-->>P: 固有の部品・map の図・本文
        P->>P: 固有の CSS が該当する
        P-->>U: 文書を表示
    expected:
      - 固有の部品の場所に、定義のタイトルが描かれている
      - 固有の CSS が変えた色が、固有の部品とmap の図の計算値に出ている
      - map の図と本文は共通の部品と同じように描かれている
    test: test_normal
  - name: 正常シナリオ（書き出す）
    setup:
      - name: 固有の部品と CSS を指す設定
        description: '`theme` に固有の CSS、`extensions` に固有の部品のモジュールを記載した `mdmark.config.yaml` と、正常シナリオと同じ Markdown'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        actor U as 読者
        W->>C: mdmark export
        C->>C: 固有の CSS と部品を 1 枚に埋める
        C-->>W: 書き出した HTML
        U->>U: 書き出した HTML を file:// で開く
    expected:
      - 書き出した HTML に、固有の部品が描かれ、固有の CSS が該当している
      - 開いてからの外への要求が 0 件
    test: test_normal_when_export
  - name: 正常シナリオ（別の場所の文書）
    setup:
      - name: 固有の部品を読み込まないページ
        description: mdmark の JavaScript と CSS だけを読み込み、固有の部品も固有の CSS も読み込まずに、正常シナリオと同じ Markdown を描く HTML
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 別の場所のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 登録されていないマーカーを取り除く
        M-->>P: map の図と本文
        P-->>U: 文書を表示
    expected:
      - 固有の部品の場所には何も描かれず、定義の JSON も出ない
      - map の図の色は mdmark の既定のまま
      - 本文が描かれている
    test: test_normal_when_other_place
  - name: 正常シナリオ（VS Code のプレビューで適用する）
    setup:
      - name: 固有の部品と CSS を指す設定
        description: 正常シナリオ（書き出す）と同じ `mdmark.config.yaml` と Markdown を配置したワークスペース
      - name: Mock
        description: VSCodeでプレビューを開くの正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>PV: theme の CSS と extensions を読み込むパネルを開く
        PV->>PV: extensions を registerExtension で登録してから描く
        PV-->>W: 固有の部品と固有の CSS を適用した文書
    expected:
      - プレビューの固有の部品の場所に、定義のタイトルが描かれている
      - 固有の CSS が変えた色が、固有の部品とmap の図の計算値に出ている
      - パネルの CSP の違反が 0 件
    test: test_normal_when_vscode_preview
lead: 利用側が、自分の場所だけの部品を `registerExtension` で追加し、自分の場所だけの外観を CSS で適用する。該当するのは、その部品と CSS を読み込んだページと、同じ設定ファイルで書き出した文書と VS Code のプレビューだけ。
issue: 21
primary_actor: 利用側（ワークスペースの持ち主）
trigger: 利用側が、共通の部品に無い自分の場所だけの部品と外観を文書に使用したくなる
preconditions:
  - 固有の部品は、利用側が JavaScript（`// @ts-check` と JSDoc）か TypeScript で記載し、JavaScript として配置している
success_guarantee: 固有の部品と CSS を読み込んだ場所の文書でだけ、固有の部品が描かれ、固有の CSS が該当する。文書に記載したスクリプトは動かない。
minimal_guarantee: 固有の部品を読み込んでいない場所の文書では、その部品のマーカーは知らないマーカーとして取り除かれ、ほかの本文は描かれる。
test_file: tests/e2e/単一ユースケース/固有の部品とCSSを適用する.spec.ts
