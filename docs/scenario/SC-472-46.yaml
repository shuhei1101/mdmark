id: SC-472-46
visibility: internal
title: 外部ライブラリを使用するときだけ読み込む
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
        notes: 設定の `libraries` で、テスト用のマーカーの読み込み先を手元の代役の URL へ向ける
      - name: 外部ライブラリのマーカーを持つ Markdown
        description: 段落の間にテスト用のマーカーを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。外部ライブラリの代役は、関数を 1 つ持つモジュールを返却し、受けた要求を数える
        notes: テスト用のマーカーは、設定の `libraries` で対応表に追加する
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: マーカーから対応表のモジュールの URL を参照する
        M->>X: モジュールを要求
        X-->>M: モジュール
        M-->>P: マーカーの場所に外部ライブラリが描く
        P-->>U: 文書を表示
    expected:
      - 外部ライブラリの代役への要求が 1 件
      - マーカーの場所に、代役のモジュールが描いた中身がある
      - マーカーの前後の段落が描かれている
    test: test_normal
  - name: 正常シナリオ（マーカーが無い）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: マーカーの無い Markdown
        description: 段落だけを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 外部ライブラリを読み込まずに本文を描く
        P-->>U: 文書を表示
    expected:
      - 外部ライブラリの代役への要求が 0 件
      - 段落が描かれている
      - 色分けのライブラリへの要求も 0 件
      - mermaid への要求も 0 件
    test: test_normal_when_no_mark
  - name: 異常シナリオ（外部ライブラリを読み込めない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 外部ライブラリのマーカーを持つ Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 外部ライブラリの代役が 404 を返却する。ほかは正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: モジュールを要求
        X-->>M: 404
        M-->>P: マーカーの場所に通知ブロック、ほかは本文を描く
        P-->>U: 通知ブロックと本文を表示
    expected:
      - マーカーの場所に通知ブロックがある
      - マーカーの前後の段落が描かれている
    test: test_error_when_library_not_found
  - name: 正常シナリオ（色分けするコードブロック）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 色分けする言語のコードブロックを持つ Markdown
        description: 外部ライブラリのマーカーを持たず、言語 `ts` と `yaml` のコードブロックを 1 つずつ持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` と、色分けのライブラリの本体と言語のモジュールを jsDelivr と同じパスで返却する手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: コードブロックの言語から、色分けする言語を集める
        M->>X: 本体と typescript・yaml のモジュールを要求
        X-->>M: モジュール
        M-->>P: コードブロックを色分けする
        P-->>U: 文書を表示
      ```
    expected:
      - 色分けのライブラリへの要求が、本体 1 件と `typescript`・`yaml` の言語のモジュール 1 件ずつの計 3 件で、文書が使用しない言語のモジュールへの要求が無い
      - 2 つのコードブロックが色分けされている
      - '`dist/index.js` に色分けのライブラリの本体が含まれていない（本体は別の要求で読み込まれる）'
    test: test_normal_when_code_highlighted
  - name: 正常シナリオ（まとめていない名前のアイコン）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: まとめていない名前のアイコンを持つ Markdown
        description: 見出しに `` `icon:sailboat` ``、段落に `` `icon:anchor` `` を持つ文書
        notes: '`sailboat`・`anchor` は配布物にまとめていない Lucide のアイコンの名前'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` と Lucide のアイコンを同じパスで返却する手元の応答に差し替える。Lucide への要求を数える
        notes: 読み込む URL の構造はライブラリ選定で決める
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as Lucide
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: まとめていないアイコンの名前を集める
        M->>X: アイコンを要求
        X-->>M: アイコンの形状
        M-->>P: アイコンの場所に描く
        P-->>U: 文書を表示
    expected:
      - '`sailboat` と `anchor` のアイコンが描かれている'
      - Lucide への要求が、文書が使用するまとめていないアイコンを得る分だけで、文書が使用しないアイコンの要求が無い
      - アイコンの前後の本文が描かれている
      - まとめていない名前の `icon:` を持たない文書では、Lucide への要求が 0 件
    test: test_normal_when_unbundled_icon
  - name: 異常シナリオ（Lucide に無いアイコンの名前）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: Lucide に無い名前のアイコンを持つ Markdown
        description: 段落に `` `icon:no-such-icon` `` と `` `icon:anchor` `` を持つ文書
      - name: Mock
        description: 正常シナリオ（まとめていない名前のアイコン）と同じ。`no-such-icon` は Lucide に無い
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as Lucide
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: アイコンを要求
        X-->>M: anchor の構造と、no-such-icon が無いこと
        M-->>P: no-such-icon の場所に記載の警告、anchor はアイコンで描く
        P-->>U: 記載の警告と文書を表示
    expected:
      - '`no-such-icon` の場所に、Lucide に無い名前であることを記載した記載の警告と、記載したとおりの行内のコードがある'
      - '`anchor` のアイコンが描かれている'
      - 段落のほかの本文が描かれている
    test: test_error_when_icon_not_in_lucide
  - name: 異常シナリオ（Lucide を読み込めない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: まとめていない名前のアイコンを持つ Markdown
        description: 正常シナリオ（まとめていない名前のアイコン）と同じ文書
      - name: Mock
        description: Lucide への要求が全て失敗する（応答しない）。ほかは正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as Lucide
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: アイコンを要求
        X-->>M: 失敗
        M-->>P: 通知ブロックを 1 つ配置し、アイコンの場所を行内のコードのまま残し、ほかは本文を描く
        P-->>U: 文書を表示
    expected:
      - アイコンの場所に、記載したとおりの行内のコードが出ている
      - 見出しと段落のほかの本文が描かれている
      - 文書に、Lucide のアイコンを読み込めないことを記載した通知ブロックが 1 つだけある（アイコンの数だけ並べない）
    test: test_error_when_lucide_unavailable
lead: mdmark が、文書に外部ライブラリを使用するマーカーがあるときだけ、バージョンを固定した URL からそのモジュールを読み込む。読み込めない箇所には通知ブロックを出し、ほかの本文は描く。
issue: 3
primary_actor: mdmark を使用するアプリのページ
stakeholders:
  - name: 読者
    interest: 外部ライブラリを使用しない文書は、余計な読み込みを待たずに表示される
  - name: 利用側のアプリの開発者
    interest: 外部ライブラリの読み込み先を設定の `libraries` で差し替えられる
trigger: 利用側のページが、外部ライブラリを使用するマーカーを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: 文書が使用する外部ライブラリだけが読み込まれ、マーカーの場所に描かれる。
minimal_guarantee: 外部ライブラリを読み込めなくても、その場所に通知ブロックが出て、ほかの本文は描かれる。
test_file: tests/e2e/単一ユースケース/外部ライブラリを使用するときだけ読み込む.spec.ts
