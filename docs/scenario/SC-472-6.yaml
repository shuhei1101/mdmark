id: SC-472-6
visibility: internal
title: "HTMLに書き出す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本のワークスペース
        description: VSCodeでプレビューを開くの正常シナリオと同じ。`mdmark.export.outputDir` は既定の空
      - name: Mock
        description: VSCodeでプレビューを開くの正常シナリオと同じ。既定のブラウザで開く操作は、開いた URL を記録する代役
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant ED as エディタ（VS Code）
        participant EX as 拡張機能
        participant BR as 既定のブラウザ
        W->>ED: mdmark: HTML に書き出す
        ED->>EX: mdmark.exportHtml
        EX->>EX: 決めたバージョンの配布物を読み込んで mount で描く HTML を組む
        EX->>EX: Markdown と同じフォルダに書き出す
        EX-->>W: 書き出したパスと「ブラウザで開く」の通知
        W->>EX: 通知の「ブラウザで開く」を押す
        EX->>BR: 書き出した HTML を開く
        BR-->>W: 文書を表示
    expected:
      - Markdown と同じフォルダに、Markdown と同じ名前の `.html` が 1 つ記載される
      - 通知に書き出したパスと「ブラウザで開く」が出る
      - ブラウザで開く代役に、書き出した HTML の URL が渡る
      - 書き出した HTML をブラウザで開くと、プレビューと同じ見出し・表・注意書き・map の構成図が描かれる
    test: test_normal
  - name: 正常シナリオ（ブラウザで開く）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ。書き出した HTML はまだ無い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant BR as 既定のブラウザ
        W->>EX: mdmark: ブラウザで開く
        EX->>EX: 開いている Markdown をもう一度書き出す
        EX->>BR: 書き出した HTML を開く
        BR-->>W: 文書を表示
    expected:
      - 書き出した HTML が無くても、1 回のコマンドで HTML が記載されてブラウザで開く代役に URL が渡る
      - 保存していない書き換えも、書き出した HTML に出る
    test: test_normal_when_open_in_browser
  - name: 異常シナリオ（書き出せない）
    setup:
      - name: 見本のワークスペース
        description: 正常シナリオと同じ。`mdmark.export.outputDir` に書き込めないフォルダを指定する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 書き出し先に書き込めない
        EX-->>W: 書き出せない理由の通知
    expected:
      - 通知に、書き出し先のパスと書き込めない理由が出る
      - 書き出し先に `.html` が残らない
      - ブラウザで開く代役は呼ばれない
    test: test_error_when_output_unwritable
  - name: 正常シナリオ（選んだテーマで書き出す）
    setup:
      - name: テーマを選んだ VS Code
        description: 正常シナリオと同じ Markdown を開き、`mdmark.config.yaml` のテーマを選ぶキーは theme-paper、VS Code の設定のテーマは theme-slate
        notes: 書き出した HTML を開くブラウザの配色はライト
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ
        W->>EX: HTML に書き出す
        EX->>EX: プレビューと同じ優先の順でテーマを決めて HTML に書き込む
        W->>B: 書き出した HTML を開く
        B-->>W: theme-slate の明るい配色で表示
    expected:
      - 書き出した HTML をブラウザで開くと、描く先の要素の地の色の計算値が theme-slate の明るい配色の `--mdmark-color-bg` の値（プレビューと同じテーマ）
    test: test_normal_when_theme_selected
    refs:
      - SC-472-32#scenarios[正常シナリオ（VS Code の設定でテーマを選ぶ）]
  - name: 正常シナリオ（theme と extensions を適用する）
    setup:
      - name: 固有の部品と CSS を指すワークスペース
        description: 『固有の部品とCSSを適用する』の正常シナリオ（書き出す）と同じ `mdmark.config.yaml` と Markdown を配置したワークスペース
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 重ねた設定の theme の CSS と extensions を入れた HTML を書き込む
        W->>B: 書き出した HTML を開く
        B-->>W: 固有の部品と固有の CSS を適用した文書
    expected:
      - 書き出した HTML をブラウザで開くと、固有の部品の場所に定義のタイトルが描かれ、固有の CSS が変えた色が計算値に出ている
      - プレビューの同じ要素の計算値と同じ
    test: test_normal_when_theme_and_extensions
  - name: 正常シナリオ（相対パスの外部ライブラリを Chromium で読み込む）
    setup:
      - name: 手元のライブラリを指すワークスペース
        description: '`mdmark.config.yaml` の `libraries` に、同じフォルダの別のファイルを import する手元のモジュールを相対パスで記載し、`html-scripts.url` に変換のライブラリの手元のコピーを相対パスで記載する。Markdown はその外部ライブラリのマーカーと、`features.html-scripts` をオンにした `ts` の範囲を持つ'
        notes: '`libraries` には文書にマーカーの無いライブラリの行も 1 つ記載する。そのモジュールは、他のファイルに出ない目印の文字列を持つ'
      - name: Mock
        description: 正常シナリオと同じ。書き出した HTML は Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 相対パスのライブラリをまとめて HTML に埋める
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 外部ライブラリのマーカーと範囲のスクリプトを描いた文書
    expected:
      - 書き出した HTML を Chromium で開くと、外部ライブラリのマーカーの場所がそのライブラリで描かれ、通知ブロックが出ない
      - 範囲の `ts` が動き、範囲の要素にスクリプトが記載した結果が出る
      - 書き出した HTML の `data:` の URL を復号した中に、文書にマーカーの無いライブラリの目印の文字列が無い
      - 開いている間に、書き出した HTML 以外の `file:` の URL への要求が出ない
    test: test_normal_when_relative_libraries
  - name: 正常シナリオ（相対パスの mermaid を読み込む）
    setup:
      - name: 手元の mermaid を指すワークスペース
        description: '`mdmark.config.yaml` の `mermaid` の読み込み先に、mermaid の本体と chunk の手元のコピーを相対パスで記載し、Markdown は言語 `mermaid` の flowchart のコードブロックを 1 つ持つ'
      - name: Mock
        description: 正常シナリオと同じ。書き出した HTML は Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 相対パスの mermaid をまとめて HTML に埋める
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 図の枠に入った mermaid の図
    expected:
      - 書き出した HTML を Chromium で開くと、mermaid のコードブロックの場所に図の枠と SVG の図があり、通知ブロックが出ない
      - 開いている間に、書き出した HTML 以外の `file:` の URL への要求が出ない
    test: test_normal_when_relative_mermaid
  - name: 正常シナリオ（ツールチップの位置と相対パスの色分けのライブラリ）
    setup:
      - name: 手元の色分けのライブラリを指すワークスペース
        description: '`ts` のコードブロックと脚注の参照を 1 つずつ持つ Markdown と、`tooltips.placement: bottom` と、`syntax.url` に同じフォルダの `@highlightjs/cdn-assets` の `es/` フォルダの手元のコピーを相対パスで記載した `mdmark.config.yaml` を配置したフォルダ'
        notes: 手元のコピーの、Markdown が使用しない言語のモジュールの 1 つは、他のファイルに出ない目印の文字列を持つ
      - name: Mock
        description: 正常シナリオと同じ。書き出した HTML は Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 色分けのライブラリの本体と文書が使用する言語のモジュールをまとめて HTML に埋める
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 色分けしたコードブロック
        W->>B: 脚注の参照にフォーカスを移す
        B-->>W: 参照の下に出たツールチップ
    expected:
      - 書き出した HTML を Chromium で開くと、`ts` のコードブロックが色分けされ、通知ブロックが出ない
      - 脚注の参照にフォーカスを移すと、ツールチップが参照の下に出る
      - 書き出した HTML に、文書が使用しない言語のモジュールの目印の文字列が無い
      - 開いている間に、書き出した HTML 以外の `file:` の URL への要求が出ない
    test: test_normal_when_tooltips_and_relative_syntax
  - name: 正常シナリオ（設定の aliases のエイリアス）
    setup:
      - name: エイリアスを持つワークスペース
        description: 『VSCodeでプレビューを開く』の正常シナリオ（設定の aliases のエイリアス）と同じ `mdmark.config.yaml`・`glossary.yaml`・Markdown を配置したフォルダ
      - name: Mock
        description: 正常シナリオと同じ。書き出した HTML は Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>FS: mdmark.config.yaml と aliases の行が指す glossary.yaml を読み込む
        EX->>EX: aliases の行と読み込んだ YAML からエイリアスを作る
        EX->>EX: エイリアスを埋め、mount にエイリアスを指定する HTML を書き込む
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 別名に下線を付けた文書
        W->>B: 下線の単語にポインターを乗せる
        B-->>W: 用語の種類と意味のツールチップ
    expected:
      - 書き出した HTML を Chromium で開くと、本文の `レンダリング` に用語の下線が付く
      - 下線の単語にポインターを乗せると、ツールチップの「用語」の区分に、名前 `描画` と `glossary.yaml` の意味が出る
      - 設定に `aliases` が無い文書を書き出した HTML は、下線もツールチップも出さず、今と同じに描かれる
    test: test_normal_when_aliases
    refs:
      - SC-472-10#scenarios[正常シナリオ（設定の aliases のエイリアス）]
  - name: 異常シナリオ（aliases の YAML が無い）
    setup:
      - name: エイリアスを持つワークスペース
        description: 正常シナリオ（設定の aliases のエイリアス）の `aliases` に、無い YAML を指す行を 1 つ追加したもの
      - name: Mock
        description: 正常シナリオ（設定の aliases のエイリアス）と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant FS as 設定ファイル
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>FS: aliases の行が指す YAML を読み込む
        FS-->>EX: 1 つの行の YAML が無い
        EX->>EX: 読み込めない行を除いてエイリアスを作り、出力チャネルに警告を記録する
        EX->>EX: HTML を書き込む
        EX-->>W: 書き出したパスと「ブラウザで開く」の通知
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 読み込めた行のエイリアスに下線を付けた文書
    expected:
      - Markdown と同じフォルダに `.html` が 1 つ記載され、通知に書き出したパスと「ブラウザで開く」が出る
      - 書き出した HTML を Chromium で開くと、本文の `レンダリング` に用語の下線が付く
      - 出力チャネルに、読み込めない `aliases` の行の位置とずれの種類が記録される
    test: test_error_when_aliases_missing
    refs:
      - SC-472-10#scenarios[異常シナリオ（aliases の YAML が無い）]
lead: 文書の作成者が、開いている Markdown をコマンドパレットから HTML に書き出し、既定のブラウザで開く。
issue: 22
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: プレビューと同じ外観の HTML と PDF を、外部のツールを入れずに作れる
trigger: '文書の作成者がコマンドパレットから「mdmark: HTML に書き出す」か「mdmark: ブラウザで開く」を選ぶ'
preconditions:
  - Markdown のファイルをエディタで開いている
  - 既定のブラウザから jsDelivr に届く
success_guarantee: 書き出し先に HTML が 1 つ書き込まれ、ブラウザで開くとプレビューと同じ文書が描かれる。
minimal_guarantee: 書き出せないときは理由を通知に出し、書き込みかけのファイルを残さない。Markdown は書き換えない。
test_file: tests/e2e/単一ユースケース/HTMLに書き出す.spec.ts
