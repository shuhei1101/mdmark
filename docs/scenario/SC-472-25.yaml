id: SC-472-25
visibility: internal
title: テーマを上書きする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 上書きの CSS を読み込むページ
        description: mdmark の CSS の後に、利用側の CSS を読み込み、文書を描く HTML
        notes: '利用側の CSS は `--mdmark-color-link` を赤（`rgb(255, 0, 0)`）にし、詳細度の低い `a { text-decoration: none }` を持つ。mdmark の CSS はリンクに詳細度の高いセレクタで下線を適用している'
      - name: 見本の Markdown
        description: 段落とリンクを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が該当した本文
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: 上書きした外観で表示
    expected:
      - リンクの色の計算値が `rgb(255, 0, 0)`
      - リンクの `text-decoration-line` の計算値が `none`
    test: test_normal
  - name: 正常シナリオ（上書きしない）
    setup:
      - name: mdmark だけを読み込むページ
        description: mdmark の CSS だけを読み込み、文書を描く HTML
        notes: '配色は明るい配色（`prefers-color-scheme: light`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: 既定の値が該当した本文
        P-->>U: 既定の外観で表示
    expected:
      - リンクの色の計算値が、デザイン方針の dev-swiss の明るい配色の `--mdmark-color-link` の値
    test: test_normal_when_not_overridden
  - name: 正常シナリオ（ダークの配色）
    setup:
      - name: mdmark だけを読み込むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: '配色はダーク（`prefers-color-scheme: dark`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: ダークの値が該当した本文
        P-->>U: ダークの外観で表示
    expected:
      - 描く先の要素の地の色の計算値が、デザイン方針の dev-swiss のダークの `--mdmark-color-bg` の値
    test: test_normal_when_dark
  - name: 正常シナリオ（図の色を上書きする）
    setup:
      - name: 上書きの CSS を読み込むページ
        description: mdmark の CSS の後に、図の線の色の CSS 変数を書き換える利用側の CSS を読み込み、文書を描く HTML
        notes: 図の線の色の CSS 変数 `--mdmark-color-diagram-line` を赤（`rgb(255, 0, 0)`）にする
      - name: map の構成図を持つ Markdown
        description: 『Mermaidと補足で図を描く』の正常シナリオと同じ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が該当した map の図
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: 上書きした色で図を表示
    expected:
      - 色を指定していない線の色の計算値が `rgb(255, 0, 0)`
      - 線の矢じりの色も同じ色に変わる
    test: test_normal_when_diagram
  - name: 正常シナリオ（親の class でダークにする）
    setup:
      - name: mdmark だけを読み込むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 'OS の配色はライト（`prefers-color-scheme: light`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: ダークの class
        description: 描く先の要素の祖先（`body`）に、ダークを表す class（VS Code の `vscode-dark` など。class の名前はインターフェース定義で決める）を付ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>P: body にダークの class を付ける
        P->>M: 文書を描かせる
        M-->>P: ダークの値が該当した本文
        P-->>U: ダークの外観で表示
    expected:
      - OS の配色がライトでも、描く先の要素の地の色の計算値がデザイン方針の dev-swiss のダークの `--mdmark-color-bg` の値
    test: test_normal_when_parent_class_dark
  - name: 正常シナリオ（親の class でライトにする）
    setup:
      - name: mdmark だけを読み込むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 'OS の配色はダーク（`prefers-color-scheme: dark`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: ライトの class
        description: 描く先の要素の祖先（`body`）に、ライトを表す class（VS Code の `vscode-light` など。class の名前はインターフェース定義で決める）を付ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>P: body にライトの class を付ける
        P->>M: 文書を描かせる
        M-->>P: ライトの値が該当した本文
        P-->>U: ライトの外観で表示
    expected:
      - OS の配色がダークでも、描く先の要素の地の色の計算値がデザイン方針の dev-swiss のライトの `--mdmark-color-bg` の値
    test: test_normal_when_parent_class_light
  - name: 正常シナリオ（見出し行の位置と本文の幅を変える）
    setup:
      - name: 上書きの CSS を読み込むページ
        description: 画面の上端に高さ 48px の固定のヘッダーを配置し、mdmark の CSS の後に利用側の CSS を読み込み、文書を描く HTML
        notes: 利用側の CSS は、見出し行を留める位置のずれの CSS カスタムプロパティ（名前はインターフェース定義で決める）を `48px`、`--mdmark-content-width` を `40rem` にする。画面の幅は 1280px
      - name: 大きい表を持つ Markdown
        description: 長い段落の後に 3 列 60 行の表を持ち、表の後に長い段落を持つ文書
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が該当した本文
        P->>P: 層の外の利用側の CSS が該当する
        U->>P: ページを縦にスクロールして表の途中を出す
        P-->>U: 固定のヘッダーの下に見出し行を留めた表
    expected:
      - 本文の段落の幅が `40rem` を超えない
      - 表の途中を出したとき、見出し行の上端が画面の上端から 48px の位置にあり、固定のヘッダーに隠れていない
    test: test_normal_when_layout_overridden
  - name: 正常シナリオ（既定の本文の幅）
    setup:
      - name: mdmark だけを読み込むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 画面の幅を 1280px で開き、後で 1920px に広げる
      - name: 長い段落を持つ Markdown
        description: 1920px の幅でも折り返す長さの段落を持つ文書
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: 既定の値が該当した本文
        U->>P: 画面の幅を 1920px に広げる
        P-->>U: 広げた幅を使用した本文
    expected:
      - 1280px のとき、1920px に広げたときのどちらも、段落の幅が描く先の要素の中身の幅と同じ（本文の幅に既定の上限が無い）
    test: test_normal_when_content_width_default
  - name: 正常シナリオ（選んだテーマの上から上書きする）
    setup:
      - name: 上書きの CSS を読み込むページ
        description: 正常シナリオと同じ利用側の CSS を読み込み、テーマを選ぶキーに theme-slate を記載した設定を `opts.config` に指定して文書を描く HTML
        notes: 利用側の CSS は `--mdmark-color-link` だけを赤（`rgb(255, 0, 0)`）にし、`--mdmark-color-bg` は記載しない。OS の配色はライト
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: テーマを選んだ設定を指定して文書を描かせる
        M-->>P: 選んだテーマの値が該当した本文
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: 選んだテーマの上に上書きを重ねた外観で表示
    expected:
      - リンクの色の計算値が `rgb(255, 0, 0)`
      - 描く先の要素の地の色の計算値が、theme-slate の明るい配色の `--mdmark-color-bg` の値
    test: test_normal_when_theme_selected
    refs:
      - SC-472-26#scenarios[正常シナリオ]
  - name: 正常シナリオ（色のプリセットを上書きする）
    setup:
      - name: 上書きの CSS を読み込むページ
        description: 正常シナリオと同じページで、利用側の CSS が blue の文字の色の CSS 変数を `rgb(0, 0, 128)`、blue の面の色の CSS 変数を `rgb(230, 240, 255)` にする
        notes: 変数名は `--mdmark-color-accent-blue-text`・`--mdmark-color-accent-blue-bg`（インターフェース定義『文書を描く』の制約「色のプリセット」）
      - name: 色の名前を記載した Markdown
        description: 行内のコード `` `badge:blue:参考` `` と、本文の `[決め手の 1 文]{color=blue}` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 色のプリセットの CSS 変数で色を付けた本文
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: 上書きした色で表示
    expected:
      - バッジと本文の `決め手の 1 文` の文字の色の計算値が `rgb(0, 0, 128)`
      - バッジの面の色の計算値が `rgb(230, 240, 255)`
    test: test_normal_when_color_preset_overridden
  - name: 正常シナリオ（地を透明にして周りの面の色を指定する）
    setup:
      - name: 周りの面になじませるページ
        description: body の地を `rgb(240, 240, 240)` にし、mdmark の CSS の後に利用側の CSS を読み込み、文書を描く HTML
        notes: 利用側の CSS は `.mdmark` の `--mdmark-color-bg` を `transparent`、`--mdmark-color-bg-opaque` を `rgb(240, 240, 240)` にする。OS の配色はライト、画面の幅は 1280px
      - name: 表と map の図を持つ Markdown
        description: 本文の幅に収まる 3 列 3 行の表と、『Mermaidと補足で図を描く』の正常シナリオと同じ map の構成図を持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が該当した本文
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: 周りの面になじんだ本文を表示
        U->>P: 説明を持つ線にポインターを乗せる
        P-->>U: 図のツールチップを表示
        U->>P: 図の全画面のボタンを押す
        P-->>U: 全画面の図を表示
    expected:
      - 描く先の要素の地の色の計算値が `rgba(0, 0, 0, 0)`
      - 表の本文の行の高さの真ん中で、表の左右の枠の内側の画素の色が `rgb(240, 240, 240)`（横スクロールしない表の端に影が出ない）
      - 図のツールチップの地の色の計算値が `rgb(240, 240, 240)`
      - 全画面の図の地の色の計算値が `rgb(240, 240, 240)`
    test: test_normal_when_bg_transparent_with_opaque_color
  - name: 正常シナリオ（利用側の pre への汎用の CSS）
    setup:
      - name: 上書きの CSS を読み込むページ
        description: mdmark の CSS の後に、利用側の CSS を読み込み、文書を描く HTML
        notes: '利用側の CSS は層の外に `pre { white-space: pre-wrap; overflow-wrap: anywhere; }` を持つ。画面の幅は 390px'
      - name: コードブロックとファイルツリーを持つ Markdown
        description: '表示の幅より長い行とインデントを持つマーカーの無い言語 `json` のコードブロック、表示の幅より長い名前を持つマーカーの無い言語 `tree` のコードブロック、`<!-- code: {"wrap": true} -->` の直後の長い行を持つ言語 `ts` のコードブロックの文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: 折り返しを記法で決めたコードブロックとファイルツリー
        P->>P: 層の外の利用側の CSS が該当する
        P-->>U: マーカーの無いブロックは折り返さずに表示
    expected:
      - マーカーの無い `json` のコードブロックの `white-space` の計算値が `pre` で、枠の中で横にスクロールできる
      - マーカーの無い `tree` のファイルツリーの項目が折り返さず、枠の中で横にスクロールできる
      - '`json` のインデントとファイルツリーの罫線と入れ子の位置が、利用側の CSS を読み込まないときと同じ'
      - '`wrap` の `ts` のコードブロックは折り返す'
    test: test_normal_when_host_pre_wraps
  - name: 正常シナリオ（VS Code のプレビューで上書きする）
    setup:
      - name: theme を指すワークスペース
        description: '`mdmark.config.yaml` の `theme` に、`--mdmark-color-link` を上書きする CSS を書き込んだワークスペースと、リンクを持つ Markdown'
      - name: Mock
        description: VSCodeでプレビューを開くの正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>PV: theme の CSS を読み込むパネルを開く
        PV-->>W: theme の CSS を適用した文書
    expected:
      - プレビューのリンクの色の計算値が、theme の CSS で上書きした `--mdmark-color-link` の値
      - 同じ設定で `mdmark export` を実行した HTML のリンクの色と同じ
    test: test_normal_when_vscode_preview
lead: 利用側が自分の CSS で `--mdmark-` の変数や本文の規則を記載し、mdmark が描いた文書の外観を変える。何も記載しなければ既定の外観（dev-swiss）で描かれる。
issue: 3
primary_actor: mdmark を使用するアプリの開発者
stakeholders:
  - name: 読者
    interest: アプリの外観に合った文書を読み込める
trigger: 利用側のページが、mdmark の CSS と自分の CSS を読み込んで文書を描く
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: 利用側が mdmark の層の外に記載した CSS は、詳細度によらず mdmark の CSS に勝つ。ただし、コードブロックとファイルツリーの折り返しは記法の `wrap` で決まり、利用側の要素名だけの `pre` への汎用の CSS で変わらない。
minimal_guarantee: 利用側が CSS を書き込まなくても、既定の外観で文書が描かれる。
test_file: tests/e2e/単一ユースケース/テーマを上書きする.spec.ts
