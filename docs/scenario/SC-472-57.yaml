id: SC-472-57
visibility: internal
title: 文書をHTML文字列にする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込む Node のスクリプト。DOM を持たない
      - name: 見本の Markdown
        description: '見出し・段落・リスト・表・コードブロック・リンク・折り畳み（`details`）・`<!-- features: +a -b -->`・`script` 要素を持つ文書'
      - name: Mock
        description: 差し替える依存は無い（手元の `dist/` を読み込む）
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: Markdown を指定して HTML 文字列にさせる
        M->>M: Markdown を解析し、マーカーを取得する
        M->>M: スクリプトを落とす
        M-->>C: HTML 文字列
    expected:
      - 見出し・段落・リスト・表・コードブロック・リンク・折り畳みの要素を持つ HTML 文字列が返る
      - 文字列に `script` 要素とマーカーの文字（`<!--`）が無い
    test: test_normal
  - name: 正常シナリオ（ブラウザで呼ぶ）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` を読み込む HTML
      - name: 見本の Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: Markdown を指定して HTML 文字列にさせる
        M-->>P: HTML 文字列
    expected:
      - ブラウザで返った HTML 文字列が、正常シナリオで Node が返却した文字列と一致する
      - ページの描く先の要素は変わらない（画面に描かない）
    test: test_normal_when_in_browser
  - name: 正常シナリオ（記法を持つ文書）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 記法を持つ Markdown
        description: '表のマーカーで囲んだ表、2 つの中身を持つタブの範囲、`> [!WARNING]` の注意書き、`<!-- section: closed -->` のセクション、`<!-- fig: arch -->` の図と `[図](#fig-arch)` のリンク、`script` 要素を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: Markdown を指定して HTML 文字列にさせる
        M->>M: マーカーと記法を読み込んで HTML にする
        M->>M: スクリプトを落とす
        M-->>C: HTML 文字列
    expected:
      - 文字列にタブの 2 つの中身と、閉じたセクションの中身がともにある
      - 注意書きが class `markdown-alert markdown-alert-warning` の要素になっている
      - 見出しが GitHub と同じ規則の ID を持ち、図に `図 1` の番号と、リンクの文字に `図 1` がある
      - 文字列に `script` 要素とマーカーの文字（`<!--`）が無い
    test: test_normal_when_syntax
  - name: 正常シナリオ（索引を指定する）
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込み、索引・描く文書の `id`・ほかの文書から算出した参照を指定して HTML 文字列にする
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース`（意味 `話し合いの記録を配置するフォルダ`）を持ち、文書 `api`（タイトル `API`）の `related` が描く文書を指す索引
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 索引・文書の id・参照・Markdown を指定して HTML 文字列にさせる
        M-->>C: 用語の意味と被参照の一覧を持つ HTML 文字列
    expected:
      - 文字列に、`ワークスペース` の下線の要素と、意味 `話し合いの記録を配置するフォルダ` を持つ要素がある
      - 文字列に、`API` へのリンクを持つ被参照の一覧がある
      - 文字列に `script` 要素とマーカーの文字（`<!--`）が無い
    test: test_normal_when_index
  - name: 正常シナリオ（エイリアスを指定する）
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込み、読み込んだエイリアスを指定して HTML 文字列にする
      - name: エイリアス
        description: '`term` の `ワークスペース`（説明 `話し合いの記録を配置するフォルダ`）と、`command` の `単体テスト`（コマンド `npm run test:unit`）'
      - name: エイリアスが出る Markdown
        description: 段落に `ワークスペース` と `単体テスト` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: 読み込んだエイリアスと Markdown を指定して HTML 文字列にさせる
        M-->>C: エイリアスの下線とツールチップを持つ HTML 文字列
    expected:
      - 文字列に、`ワークスペース` の下線の要素と、説明 `話し合いの記録を配置するフォルダ` を持つ要素がある
      - 文字列に、`単体テスト` の下線の要素と、コード `npm run test:unit` とコピーのボタンを持つ要素がある
      - 文字列に `script` 要素とマーカーの文字（`<!--`）が無い
    test: test_normal_when_aliases
  - name: 正常シナリオ（脚注を持つ文書）
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常シナリオと同じ
      - name: 脚注を持つ Markdown
        description: '段落に `[^src]` と行内の `^[行内の補足]` を持ち、定義 `[^src]: 出典の説明` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: Markdown を指定して HTML 文字列にさせる
        M->>M: 脚注の参照と定義を読み込み、番号を振る
        M-->>C: 脚注の番号と末尾の一覧を持つ HTML 文字列
    expected:
      - 文字列に、番号 `1`・`2` の上付きの要素と、それぞれの脚注の中身 `出典の説明`・`行内の補足` を持つ要素がある
      - 文字列の末尾に、閉じた脚注の一覧の要素がある
      - 文字列に `[^src]` と定義の行の文字が無い
    test: test_normal_when_footnotes
    refs:
      - SC-472-71#scenarios[正常シナリオ]
  - name: 正常シナリオ（取り込む文書を指定する）
    setup:
      - name: 取り込む文書の表
        description: '`共通/手順.md`（`## 準備` と `## 実行` の見出しと段落）を持つ、パスから本文を参照する表'
        notes: 表の指定方法はインターフェース定義で決める
      - name: include のマーカーを持つ Markdown
        description: '段落の間に `<!-- include: 共通/手順.md#実行 -->` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い（画面を持たない）
    flow: |-
      sequenceDiagram
        participant A as 利用側の処理
        participant M as mdmark
        A->>M: Markdown と取り込む文書の表を指定して HTML 文字列にさせる
        M->>M: include のマーカーの場所に、取り込み先の見出しの中を入れる
        M-->>A: HTML 文字列
    expected:
      - HTML 文字列のマーカーの場所に、`実行` の見出しとその下の段落があり、`準備` の段落が無い
      - 表を指定せずに呼ぶと、マーカーの場所に取り込み先が無い記載の警告が入る
    test: test_normal_when_includes_given
  - name: 正常シナリオ（フロントマターを持つ文書）
    setup:
      - name: フロントマターを持つ Markdown
        description: '1〜4 行目に `---`・`title: テスト`・`tags: [a, b]`・`---` のフロントマター、6 行目に `# 見出し`、8 行目に段落を配置した文書'
        notes: 設定は指定しない（`features.frontmatter` は既定の `false`）
      - name: Mock
        description: 差し替える依存は無い（画面を持たない）
    flow: |-
      sequenceDiagram
        participant A as 利用側の処理
        participant M as mdmark
        A->>M: フロントマターを持つ Markdown を HTML 文字列にさせる
        M->>M: 先頭のフロントマターを本文から除外する
        M-->>A: HTML 文字列
    expected:
      - 'HTML 文字列に `title: テスト` と `tags: [a, b]` の文字が無い'
      - HTML 文字列に h2 の要素が無く、`見出し` の h1 の要素と段落がある
    test: test_normal_when_frontmatter
lead: 利用側（書き出し・ビルドの処理やサーバー）が、画面を持たずに Markdown を mdmark で HTML 文字列にする。ブラウザでも Node でも同じ文字列を返却する。
issue: 3
primary_actor: mdmark で HTML を書き出す利用側の処理
stakeholders:
  - name: 書き出し・ビルドの CLI の開発者
    interest: ブラウザを起動せずに、ページで描くのと同じ本文の HTML を得られる
trigger: 利用側の処理が、Markdown を HTML 文字列にする公開関数を呼ぶ
preconditions:
  - 利用側の処理が mdmark の配布物の JavaScript を読み込んでいる
success_guarantee: ページで描くのと同じ本文の HTML 文字列が返る。文字列にスクリプトは含まれない。
test_file: tests/e2e/単一ユースケース/文書をHTML文字列にする.spec.ts
