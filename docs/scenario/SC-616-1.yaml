id: SC-616-1
visibility: internal
title: 部品の定義で書いたER図をmapへ移して描く
lead: 文書の作成者が、部品の定義の JSON の `er` で描いていた ER 図を、描いた文書の警告と点検の案内に従って移行の手順で map の範囲へ書き換え、移行の報告に挙がった図を手で記載し直して、点検に合格した map の ER 図で描く。
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 部品の定義の JSON を手で Mermaid と補足に書き換えずに今の ER 図を map へ移せ、移せなかった図と落ちた値だけを手で記載し直せる
  - name: 読者
    interest: 移行の前と同じテーブル・列・関係と説明を、map の ER 図で辿って参照できる
trigger: 文書の作成者が、`er` を廃止したバージョンの mdmark に上げる
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 部品の定義で書いた ER 図の文書を持つフォルダ
        description: |-
          手元のバージョンを 1 つ前のマイナーバージョンにした設定・索引と、`<!-- er -->` の範囲 1 つを記載した文書 1 つを持つフォルダ。
          ER 図は、物理名と論理名を持つテーブル 3 つ（種類 `master`・`transaction` と `color` を持つテーブルを含む）・主キー・外部キー・NOT NULL・説明を持つ列・多重度とラベルを持つ 1 対多の関係 2 本を持ち、列の多いテーブル 1 つに `folded` を記載する
      - name: Mock
        description: 呼んだ CLI のバージョンを目標のバージョンにし、リポジトリの `migrations/next/` の移行の手順を目標のバージョンの手順として使用する。描くページは jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[図を描く:正常シナリオ（座標で書いた図の範囲）] --> B[設定と索引を点検する:正常シナリオ（座標で書いた図がある）]
        B --> C[バージョンを上げる:正常シナリオ（部品の定義で書いた ER 図を map へ書き換える）]
        C --> D[設定と索引を点検する:正常シナリオ]
        D --> E[Mermaidと補足で図を描く:正常シナリオ（ER 図）]
        E --> F[図のグループの中へ入る・開閉する:正常シナリオ（ER 図の列と分類の箱を開閉する）]
        F --> G[図の要素のツールチップを確認する:正常シナリオ（ER 図のテーブル）]
        click A "id:SC-472-43#scenarios[正常シナリオ（座標で書いた図の範囲）]"
        click B "id:SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]"
        click C "id:SC-472-27#scenarios[正常シナリオ（部品の定義で書いた ER 図を map へ書き換える）]"
        click D "id:SC-472-78#scenarios[正常シナリオ]"
        click E "id:SC-472-8#scenarios[正常シナリオ（ER 図）]"
        click F "id:SC-472-39#scenarios[正常シナリオ（ER 図の列と分類の箱を開閉する）]"
        click G "id:SC-472-40#scenarios[正常シナリオ（ER 図のテーブル）]"
      ```

      <!-- /map -->
    expected:
      - 移行の前に描くと、`er` の範囲に、図の代わりに map へ変換できる旨と `mdmark upgrade` の案内を持つ書き方の警告が出て、文書の残りは描かれる
      - 1 回目の `mdmark check` が、`er` の範囲のファイルと行を指し、`mdmark upgrade` での変換を案内する行を出し、終了コード 0 以外を返却する
      - '`mdmark upgrade` の後、文書の `er` の範囲が `<!-- map -->` の範囲（`erDiagram` の `mermaid` のブロック 1 つと補足 `<!-- map-data: {…} -->`）に書き換わり、範囲の外の本文は変わっていない'
      - '`mdmark upgrade` の出力の移行の報告に、map に写す先の無い値（テーブルの種類 `kind`・テーブルの `color`・列の `nn`・題の行の範囲 `scope`・更新日 `updated`）が、文書と行と項目つきで挙がる。座標と大きさは挙がらない'
      - 移行の後の 2 回目の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 移行の後に描くと、map の ER 図に元と同じテーブル・列（型・名前・主キーと外部キーのマーカー）・関係の両端の多重度とラベルが自動配置で描かれ、元の題 `title` が印の引数 `title` として図の枠のタイトルに出る
      - '`folded` を記載していたテーブルは列を閉じた状態で描かれ、開くと元と同じ列が出る'
      - 元のテーブルの論理名 `label` と説明、列の説明が、補足の `notes` の説明（テーブルは論理名を先頭に置く）として、テーブルと列のツールチップに出る
    test: test_normal
    uses:
      - SC-472-43#scenarios[正常シナリオ（座標で書いた図の範囲）]
      - SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]
      - SC-472-27#scenarios[正常シナリオ（部品の定義で書いた ER 図を map へ書き換える）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ（ER 図）]
      - SC-472-39#scenarios[正常シナリオ（ER 図の列と分類の箱を開閉する）]
      - SC-472-40#scenarios[正常シナリオ（ER 図のテーブル）]
  - name: 正常シナリオ（書き換えない図がある）
    setup:
      - name: 書き換えない図を持つフォルダ
        description: 正常シナリオのフォルダの文書に、定義に無いテーブルを関係の先に指定した `<!-- er -->` の範囲 1 つを加えたもの
      - name: 手で修正した文書
        description: 移行の後に、文書の作成者が、移行の報告に挙がった範囲を `<!-- map -->` の範囲（`erDiagram` と補足）で記載し直したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[バージョンを上げる:正常シナリオ（書き換えない記載を移行の報告に挙げる）] --> B[設定と索引を点検する:正常シナリオ（座標で書いた図がある）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[Mermaidと補足で図を描く:正常シナリオ（ER 図）]
        click A "id:SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]"
        click B "id:SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-8#scenarios[正常シナリオ（ER 図）]"
      ```

      <!-- /map -->
    expected:
      - '`mdmark upgrade` の出力の移行の報告に、定義に無いテーブルを指す範囲が、ファイルと行と理由つきで挙がる。その範囲は書き換わらず、ほかの範囲は正常シナリオと同じく map の範囲に書き換わる'
      - 手で修正する前の `mdmark check` が、書き換わらなかった 1 か所だけを廃止した図の範囲として指す
      - 手で修正した後の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 手で修正した後に描いた文書で、記載し直した範囲が map の ER 図で描かれる
    test: test_normal_when_unconverted
    uses:
      - SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]
      - SC-472-78#scenarios[正常シナリオ（座標で書いた図がある）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-8#scenarios[正常シナリオ（ER 図）]
success_guarantee: 文書の `er` の範囲が全て map の範囲で記載され、点検がずれ 0 件で通り、描いた文書に元の ER 図と同じテーブル・列・関係と説明が map の ER 図で描かれる。
minimal_guarantee: 移行の手順は、書き換えない範囲（読めない部品の定義）をファイルと行と理由つきで移行の報告に挙げ、その範囲を書き換えない。移行の前の文書と設定は、移行のコピーのフォルダに残る。書き換えていない `er` の範囲は、描くと書き方の警告になり、文書の残りは描かれる。
test_file: tests/e2e/複合ユースケース/部品の定義で書いたER図をmapへ移して描く.spec.ts
