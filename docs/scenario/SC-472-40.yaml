id: SC-472-40
visibility: internal
title: 図の要素のツールチップを確認する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: map の構成図を描いたページ。補足の `notes` で、線 1 本・ノード 1 つ・システムの枠のグループと層のグループの 1 つに説明を持たせる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 説明を持つ線にポインターを乗せる
        D-->>U: 線の説明のツールチップ
        U->>D: ツールチップの上へポインターを動かす
        D-->>U: ツールチップを出したままにする
        U->>D: 説明を持つノードのマーカーにポインターを乗せる
        D-->>U: ノードの説明のツールチップ
        U->>D: システムの枠のグループのタイトルのマーカーにポインターを乗せる
        D-->>U: グループの説明のツールチップ
    expected:
      - 説明を持つ線の上で、`notes` の説明を記載した `role="tooltip"` の要素が出る。説明を持たない線では出ない
      - ツールチップの上へポインターを動かしても消えない
      - 説明を持つノードの右上のマーカーの上で、`notes` の説明を記載したツールチップがノードの下に出る（ツールチップの上端がノードの下端より下にある）。ノードのマーカーの外では出ない
      - ツールチップを持つノードにはマーカーがあり、持たないノードには無い
      - 説明を持つグループのタイトルの右にノードと同じマーカーがあり、説明を持たないグループのタイトルには無い
      - システムの枠のグループのタイトルのマーカーの上で、説明を記載したツールチップがマーカーの下に出る
    test: test_normal
  - name: 正常シナリオ（キーボード）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: Tab で説明を持つ線の押せる帯にフォーカスする
        D-->>U: 線の説明のツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを削除し、フォーカスは線の帯に残す
        U->>D: Tab で説明を持つノードのマーカーにフォーカスする
        D-->>U: ノードの説明のツールチップ
    expected:
      - フォーカスした線の押せる帯にツールチップが出て、帯の `aria-describedby` がそのツールチップを指す
      - Esc でツールチップが消え、フォーカスは線の帯に残る
      - フォーカスしたノードのマーカーにツールチップが出て、マーカーの `aria-describedby` がそのツールチップを指す
    test: test_normal_when_keyboard
  - name: 正常シナリオ（ノードの中の用語）
    setup:
      - name: 用語を持つ図を描いたページ
        description: 索引に記載した用語をノードの名前に含む map の構成図と、図の外の段落に同じ用語を持つ文書を、索引を指定して描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードの中の用語にポインターを乗せる
        D-->>U: 用語集の意味のツールチップ
    expected:
      - ノードの中の用語に本文の用語と同じ破線の下線が参照されている
      - 用語の上で、本文の用語と同じ外観のツールチップに用語集の意味が出る
      - 図の外の段落の同じ用語にも下線とツールチップがある
    test: test_normal_when_term
  - name: 正常シナリオ（埋め込んだ HTML の data-hint）
    setup:
      - name: ヒントを持つ HTML を描いたページ
        description: '`<!-- html -->` の範囲の `html` のコードブロックに、`data-hint` を付けたノード 1 つと、付けないノード 1 つを配置して描いたページ'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 埋め込んだ HTML
        U->>D: data-hint のノードのマーカーの外にポインターを乗せる
        D-->>U: ツールチップを出さない
        U->>D: data-hint のノードのマーカーにポインターを乗せる
        D-->>U: data-hint の文のツールチップ
        U->>D: Tab で data-hint のノードのマーカーにフォーカスする
        D-->>U: 同じツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを削除し、フォーカスはマーカーに残す
    expected:
      - '`data-hint` のノードの右上のマーカーの上で、`data-hint` の文を記載した `role="tooltip"` の要素が、図のツールチップと同じ外観で出る'
      - ツールチップはマーカーの下に出る（ツールチップの上端がマーカーの下端より下にある）
      - '`data-hint` のノードのマーカーの外にポインターを乗せても、ツールチップは出ず、ポインターの形状は変わらない'
      - '`data-hint` のノードのマーカーはフォーカスでき、フォーカスするとマーカーの `aria-describedby` がそのツールチップを指す'
      - Esc でツールチップが消え、フォーカスはマーカーに残る
      - '`data-hint` を持つノードには図のノードと同じマーカーがあり、持たないノードには無い'
    test: test_normal_when_data_hint
  - name: 正常シナリオ（ノードの hint）
    setup:
      - name: 説明を持つ図を描いたページ
        description: 補足の `notes` で説明を持つノード 1 つを含む map の構成図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 説明を持つノードのマーカーにポインターを乗せる
        D-->>U: 説明のツールチップ
    expected:
      - 説明を持つノードの右上のマーカーの上で、`notes` の説明を記載したツールチップが出る
      - 説明を持つノードには、ツールチップを持つノードのマーカーがある
    test: test_normal_when_node_hint
  - name: 正常シナリオ（ノードと線の注釈）
    setup:
      - name: 注釈を参照する図を描いたページ
        description: 文書に ID `cond` の注釈（本文 `条件を満たさないときは次の工程へ進む`）を定義し、補足でノード 1 つと線 1 本から `cond` を参照し、そのノードに `notes` の説明も持たせた map の構成図を描いたページ
        notes: 補足で注釈を参照するキーはインターフェース定義設計で決める
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 注釈を参照するノードのマーカーにポインターを乗せる
        D-->>U: 説明と注釈を持つツールチップ
        U->>D: 注釈を参照する線にポインターを乗せる
        D-->>U: 注釈を持つツールチップ
    expected:
      - ノードのツールチップに、`notes` の説明と、注釈であることを示すタイトルの付いた `条件を満たさないときは次の工程へ進む` の両方が出て、説明と注釈が分かれて表示されている
      - 線のツールチップに、注釈であることを示すタイトルの付いた `条件を満たさないときは次の工程へ進む` が出ている
      - 文書の末尾の注釈の一覧の `cond` の項目が、ノードと線の 2 つの参照の場所へ戻るリンクを持つ
    test: test_normal_when_annotations
  - name: 正常シナリオ（ヒントを削除する）
    setup:
      - name: ヒントを削除して描いたページ
        description: 正常シナリオ（ER 図のテーブル）の ER 図と、`data-hint` を付けたノードを持つ HTML を、設定の `features.hints` を `false` にして描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図と埋め込んだ HTML
        U->>D: ER 図のテーブル・data-hint のノードにポインターを乗せる
        D-->>U: ツールチップを出さない
    expected:
      - ER 図のテーブルと `data-hint` のノードのどれに乗せても、ツールチップが出ない
      - テーブルの説明のボタンと `data-hint` のノードのマーカーが無い
      - テーブルと列の名前・`data-hint` のノードの文字は描かれている
    test: test_normal_when_hints_off
  - name: 正常シナリオ（下に収まらないノード）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオの map の構成図を描き、図の下に高い本文を続けたページ
        notes: 説明を持つノードの下端が画面の下端に一致するまでスクロールし、ノードの下にツールチップの高さが残らない状態を決定的に発生させる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードの下端が画面の下端に一致するまでスクロールする
        U->>D: 説明を持つノードのマーカーにポインターを乗せる
        D-->>U: ノードの上に説明のツールチップ
    expected:
      - 説明を持つノードのツールチップがノードの上に出る（ツールチップの下端がノードの上端より上にある）
      - ツールチップの全体が画面の中に収まっている
    test: test_normal_when_no_room_below
  - name: 正常シナリオ（設定で上に出す）
    setup:
      - name: 上に出す設定で描いたページ
        description: 正常シナリオ（ER 図のテーブル）の ER 図と、`data-hint` を付けたノードを持つ HTML と、索引に記載した用語を持つ段落を、設定の `tooltips.diagramPlacement` を `top`、`tooltips.placement` を `bottom` にして描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図と埋め込んだ HTML
        participant B as 本文
        U->>D: テーブルの説明のボタンにポインターを乗せる
        D-->>U: テーブルの上にテーブルの概要のツールチップ
        U->>D: data-hint のノードのマーカーにポインターを乗せる
        D-->>U: マーカーの上に data-hint の文のツールチップ
        U->>B: 段落の用語にポインターを乗せる
        B-->>U: 単語の下に用語の意味のツールチップ
    expected:
      - テーブルのツールチップがテーブルの上に出る（ツールチップの下端がテーブルの上端より上にある）
      - '`data-hint` のツールチップがマーカーの上に出る（ツールチップの下端がマーカーの上端より上にある）'
      - 段落の用語のツールチップは `tooltips.placement` のとおり単語の下に出る（図の位置の設定に影響されない）
    test: test_normal_when_diagram_placement_top
  - name: 正常シナリオ（ノードの中の表記の違う用語）
    setup:
      - name: 表記の違う用語を持つ図を描いたページ
        description: 索引に用語 `MCP` を記載し、ノードの名前に全角の小文字で `ｍｃｐ` と記載した map の構成図を持つ文書を、索引を指定して描いたページ
        notes: ノードに記載した単語と索引の用語が、全角と半角・大文字と小文字だけ違う状態を決定的に発生させる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードの中の用語にポインターを乗せる
        D-->>U: 用語の意味のツールチップ
    expected:
      - ノードの中の `ｍｃｐ` に本文の用語と同じ破線の下線が参照され、文字はノードに記載した表記のまま
      - 用語の上で、索引の用語 `MCP` の意味のツールチップが出る
    test: test_normal_when_term_width_and_case_differ
  - name: 正常シナリオ（タッチ）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオの map の構成図を、タッチの端末（`hasTouch`）として開いたページ
        notes: Chromium のタッチの再現では `:hover` が残らないため、外のタップで閉じる期待値は今の実装でも pass する。iOS の `:hover` が残る状態は単体テストで、`pointerleave`・`blur` を発火させずに外の `pointerdown` だけで閉じることを確認する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 説明を持つノードのマーカーをタップする
        D-->>U: 説明のツールチップ
        U->>D: 同じマーカーをもう一度タップする
        D-->>U: ツールチップを削除する
        U->>D: 説明を持つ線をタップする
        D-->>U: 線の説明のツールチップ
        U->>D: ツールチップの中をタップする
        D-->>U: ツールチップを出したままにする
        U->>D: 図の外の本文をタップする
        D-->>U: ツールチップを削除する
    expected:
      - 説明を持つノードのマーカーのタップで、説明を記載したツールチップが出る
      - 同じマーカーをもう一度タップすると、ツールチップが消える
      - 説明を持つ線のタップで、線の説明のツールチップが出る
      - ツールチップの中をタップしても、ツールチップは消えない
      - ツールチップと持ち主の外をタップすると、ツールチップが消える
    test: test_normal_when_touch
  - name: 正常シナリオ（ER 図のテーブル）
    setup:
      - name: 図を描いたページ
        description: 概要を持つテーブル 1 つと、説明を持つ列 2 つを記載した ER 図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: テーブルの説明のボタンにポインターを乗せる
        D-->>U: テーブルの概要と列の説明のツールチップ
        U->>D: ツールチップの上へポインターを動かす
        D-->>U: ツールチップを出したままにする
        U->>D: Esc を押す
        D-->>U: ツールチップを閉じる
        U->>D: Tab で説明のボタンにフォーカスを移す
        D-->>U: テーブルの概要と列の説明のツールチップ
    expected:
      - 説明のボタンの上で、テーブルの概要と、説明を持つ 2 つの列の名前と説明を記載した `role="tooltip"` の要素が出る
      - ツールチップはテーブルの下に出る
      - ツールチップの上へポインターを動かしても消えず、Esc で消える
      - キーボードで説明のボタンにフォーカスしたときも同じツールチップが出る
    test: test_normal_when_er_table
  - name: 正常シナリオ（リンク先を持つノードのツールチップ）
    setup:
      - name: 図を描いたページ
        description: 補足の `notes` の説明と `click` のリンク先の両方を持つノード 1 つを含む map の構成図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ。リンク先への遷移を手元の応答で受け、開いた URL を記録する
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードの右上のマーカーにポインターを乗せる
        D-->>U: 説明のツールチップ
        U->>D: マーカーを押す
        D-->>U: ツールチップを出したままにし、リンク先を開かない
        U->>D: Tab でノードとマーカーに順にフォーカスする
        D-->>U: マーカーにフォーカスしたときだけツールチップ
        U->>D: マーカーの外のノードを押す
        D-->>U: ノードのリンク先を開く
    expected:
      - マーカーの上で、説明を記載したツールチップが出る
      - マーカーを押してもリンク先が開かない
      - Tab でノードのリンクとマーカーに別々にフォーカスでき、マーカーにフォーカスしたときにツールチップが出る
      - マーカーの外のノードを押すと、リンク先が開く
    test: test_normal_when_linked_node_has_tip
  - name: 正常シナリオ（グラフの項目）
    setup:
      - name: グラフを描いたページ
        description: 系列 2 つ・項目 4 つの折れ線のグラフ、系列 2 つ・項目 4 つの棒のグラフ、項目 3 つの円のグラフ、系列 1 つ・点 6 つの散布図を描いたページ
        notes: 横の目盛りは `1月`〜`4月`。円の項目は `A`・`B`・`C` で、値は `50`・`30`・`20`
      - name: 追加した種類のグラフを描いたページ
        description: 『図を描く』の正常シナリオ（追加したグラフの種類）の 8 つのグラフを描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as グラフ
        U->>D: 折れ線の点にポインターを乗せる
        D-->>U: 系列の名前・横の目盛り・値のツールチップ
        U->>D: 棒にポインターを乗せる
        D-->>U: 系列の名前・横の目盛り・値のツールチップ
        U->>D: 円の扇形にポインターを乗せる
        D-->>U: 項目の名前・値・割合のツールチップ
        U->>D: 散布図の点にポインターを乗せる
        D-->>U: 系列の名前と x と y のツールチップ
        U->>D: Tab で折れ線の点にフォーカスする
        D-->>U: 同じツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを削除し、フォーカスは点に残す
    expected:
      - 折れ線の点の上で、系列の名前・横の目盛り（`2月` など）・値を記載した `role="tooltip"` の要素が出る
      - 点の外観の外の、点の周りのクリックを受ける範囲にポインターを乗せても、同じツールチップが出る
      - 棒の上で、系列の名前・横の目盛り・値のツールチップが出る
      - 円の扇形の上で、項目の名前・値・全体に対する割合（`A` は `50%`）のツールチップが出る
      - 散布図の点の上で、系列の名前と x と y の値のツールチップが出る
      - ツールチップは項目の下に出る（ツールチップの上端が項目の下端より下にある）
      - 追加した 8 つの種類のグラフの項目にも、系列か項目の名前と値のツールチップが出る
      - 項目はキーボードでフォーカスでき、フォーカスした項目の `aria-describedby` がツールチップを指す。Esc でツールチップが消え、フォーカスは項目に残る
    test: test_normal_when_chart_items
lead: 読者が、図の線・ノード・グループ・ノードの中の用語・グラフの項目・ER 図のテーブルにポインターを乗せるかフォーカスして、詳細をツールチップで読み込む。map の図の線・ノード・グループは補足の `notes` の説明、用語は用語集の意味、グラフの項目は系列の名前と値を出す。埋め込んだ HTML の要素の `data-hint` も同じツールチップで出し、設定の `features.hints` でまとめて削除できる。
issue: 21
primary_actor: 読者
trigger: 読者が、図の線やノードに記載した要約より詳しく知りたくなる
preconditions:
  - 文書に図が描かれている（『図を描く』）
  - 用語のツールチップを出すときは、索引か用語集の表に用語がある
success_guarantee: ツールチップはホバーとフォーカスの両方で出て、Esc で消え、ツールチップの上に乗っても消えない（WCAG 1.4.13）。タッチの端末では、タップで出て、ツールチップと持ち主の外のタップか、同じ持ち主のもう一度のタップで消える。図のツールチップは既定で持ち主の下に出て、下に収まらないときだけ上に出る。設定の `tooltips.diagramPlacement` で上を先にでき（map の図を除く）、本文の用語のツールチップの位置（`tooltips.placement`）とは別に決まる。
minimal_guarantee: ツールチップを出せない環境（印刷）でも、ノードと線の要約と図の外の用語集で図を読み込める。
test_file: tests/e2e/単一ユースケース/図の要素のツールチップを確認する.spec.ts
