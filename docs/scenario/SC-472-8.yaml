id: SC-472-8
visibility: internal
title: Mermaidと補足で図を描く
lead: 文書の map の範囲の Mermaid と補足を、mdmark が入れ子のグループを自動配置した図にして図の枠に描く。補足の layout で、配置と外観を必要な箇所だけ上書きする。
test_file: tests/e2e/単一ユースケース/Mermaidと補足で図を描く.spec.ts
primary_actor: 文書の作成者（AI を含む）
stakeholders:
  - name: 文書の作成者
    interest: 座標を記載せずに、GitHub でも読み取れる Mermaid で入れ子の構成図を記載でき、必要な箇所だけ配置と外観を調整できる
  - name: 読者
    interest: 入れ子の構成が、重ならず線が交わりにくい図で、使用する側が決めた種類のアイコン・形・色で読み取れる
trigger: 利用側のページが、map の範囲を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: map の範囲の場所に、Mermaid のノード・グループ・線を自動配置した図が図の枠に描かれる。補足の上書きは指定した箇所だけに適用され、上書きの無い箇所は自動配置のまま。
minimal_guarantee: 読み取れない行・知らないキー・描かない図の種類・許可しないノードのリンク先は書き方の警告にして、読み取れた部分の図を描く。ほかの本文と図は描かれる。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描くページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、文書を描く HTML
      - name: 構成図の map を持つ Markdown
        description: 'map の範囲を 1 つ持つ文書。印に `{"title": "全体の構成"}` を持ち、範囲の中に flowchart の mermaid のブロックと補足を持つ'
        notes: 入れ子 2 レイヤーのグループ（外のグループの向きが LR、中のグループの向きが TB）・グループをまたぐ線 3 本以上・同じグループの同じ列に並ぶ 3 つのノードから別のグループのノードへ 1 本ずつ出る線・使用する側の設定（`map.kinds`）で名前・アイコン・形・色を作った 3 種類のクラス・中のグループの隣り合う段に置いた、短いラベル（ノードの幅が最小の幅）の 1 つのノードから、下の段に横に並ぶ短いラベルの 2 つのノードへ出る線 2 本（線の両端の中心の差は縦が横より大きい）・日本語 30 文字のラベルのノード 1 つ・用語集の用語を含むラベル 1 つ。補足の `notes` で 1 つのノードと 1 本の線に説明を持つ。動くと `window.__mdmarkScriptRan` を `true` にする `<script>` を文書に 1 つ持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。mermaid のライブラリへの要求を数える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: map の範囲の Mermaid と補足を読み込む
        M->>M: 内側のグループから配置し、線の経路を決める
        M-->>P: 図の枠に入れた map の図と本文
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - map の範囲の場所に図の枠と SVG の図があり、mermaid のブロックの文字と補足の文字が出ていない
      - 図の枠のタイトルが印の `title` の「全体の構成」で、タイトルの行に範囲と更新日が無い
      - 押して選べる・動かせる場所ではポインターが持ち手の形、ノードの名前の文字の上では文字の形になる
      - 中のグループが外のグループの中に描かれ、外のグループの中は左から右、中のグループの中は上から下に並ぶ
      - ノードとグループが重ならず、線が端点とその祖先以外のノード・グループを横切らない
      - 線の両端が、相手のノードに向いた辺（2 つのノードの中心を結ぶ向きのうち、縦と横で差が大きい方の辺）につながる。その辺への経路がほかのノード・端点の祖先でないグループの枠でふさがる線だけが、残りの辺のうち経路が短い辺につながる。中のグループで下の段の 2 つのノードへ出る 2 本の線は、上のノードの下の辺の上の別々の位置から出て（2 本の端が辺の中点 1 か所に集まらない）、下の段のノードの上の辺に入る。同じノードの同じ辺に出入りする線の端は、辺の上に間隔を空けて並び、相手のノードの並びと同じ順に並ぶ
      - 30 文字のラベルがノードの幅の上限で文節の切れ目で折り返され、文字がノードの中に収まっている。種類を持つノードは種類の行が左上にあり、種類を持たないノードは名前がノードの上下の中央にある。名前が 2 行のノードは高さが中身に合わせて広がる。ノードの名前・種類の行・線のラベルの文字は、mermaid の図と同じく太字にせず、本文より小さい大きさで描かれる
      - ほかのラベルとノードに重ならない置き場所が無い線のラベルは出ず、その線にポインターを重ねるとツールチップにラベルが出る
      - クラスのノードが、設定の種類の名前とアイコンの行・形・色で描かれ、種類を記載しないノードは種類の行を出さない。凡例は無い。線の矢じりは線と同じ色で描かれる
      - ノードが種類のアイコンと種類の名前の行・名前で描かれ、交差する線は飛び越えの弧で描かれる
      - 補足の `notes` を持つノードにツールチップのマーカーがあり、フォーカスすると説明が出る
      - 線にポインターを重ねると、線と両端のノードの表示は変わらず、ほかのノード・線・ラベルが薄くなり、重ねている間はその線の上をデータの印が流れ（離すと消える）、説明を持つ線だけツールチップにその説明が出る。ポインターの形は変わらない。線の押せる範囲は線に沿った範囲だけで、折れた線を囲む矩形の中の、線から離れたノード・ボタンは axe の target-size に検出されない
      - 図の枠が置き場所の幅いっぱい（右側の目次の右端の線の手前まで）に広がり、リサイズハンドルが表示する枠の下端に枠線の無い帯で出て、右端に横の 2 本線のアイコンがあり、本文の幅との切り替えのボタンが無い。図が図の枠より広いときは等倍のまま図の枠の中で横にスクロールする
      - 用語集の用語を含むラベルに用語の下線がある
      - mermaid のライブラリへの要求が 0 件
      - '`window.__mdmarkScriptRan` が `true` になっていない'
      - 同じグループの同じ列に並ぶ 3 つのノードから出る 3 本の線が、同じ区間を重ならずに通り、並んで同じ向きに走る区間では線どうしの間隔を空けて通る
    test: test_normal
  - name: 正常シナリオ（配置と外観を上書きする）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 上書きを持つ map の Markdown
        description: 正常シナリオの文書の補足に `layout` を追加したもの
        notes: 2 つのノードを同じ段に揃える指定・段の中の並び順の指定・1 つのノードの座標の固定・1 つのノードの幅と名前の色・1 つのグループの色・1 本の線の色・1 本の線の出る辺の指定を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 自動配置に layout の指定を適用する
        M-->>P: 上書きを適用した map の図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 揃える指定の 2 つのノードが同じ段に並ぶ
      - 並び順を指定したノードが、同じ段の中で指定の順に並ぶ
      - 座標を固定したノードが指定の位置にあり、ほかのノードと重ならない
      - 幅を指定したノードがその幅で、名前の色を指定したノードがその色の名前の配色で描かれる
      - 色を指定したグループの面とタイトルの文字が、その色の名前の面と文字の配色で描かれる
      - 色を指定した線が、その色の名前の文字の配色で描かれる
      - 出る辺を指定した線が、指定の辺から出る
      - 上書きの無いノードと線は、正常シナリオと同じ規則で配置され、重なりと横切りが無い
    test: test_normal_when_layout_overridden
  - name: 正常シナリオ（構成図の層を指定する）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 層を持つ map の Markdown
        description: システムのグループ（`subgraph`、`direction TB`）の中に、使用する側が名前を付けた 3 つの層のグループ（`subgraph`）を入れ子にし、それぞれにノードを配置した文書。層のグループの 1 つに補足の `layout` で色を指定する。システムのグループの外に外部のシステムのノードを 1 つ持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 入れ子のグループの内側から自動配置する
        M-->>P: 層を持つ map の図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - システムのグループの中に 3 つの層のグループが上から並び、それぞれのタイトルが出て、色を指定した層のグループだけその色の面になる
      - 外部のシステムのノードがシステムのグループの外にある
      - 凡例が無い
    test: test_normal_when_layers
  - name: 正常シナリオ（シーケンス図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: シーケンス図の map を持つ Markdown
        description: sequenceDiagram の mermaid のブロック（相手 3 つ・メッセージ 6 つ・`loop` 1 つ・その中の `alt` と `else`・`Note over`・`->>+` と `-->>-`・`--x`・`-)`・`autonumber`）を持つ map の範囲の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 相手とメッセージを読み込む
        M-->>P: 図の枠に入れたシーケンス図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 相手が記載の順に左から右へ並び、メッセージが記載の順に上から下へ並ぶ
      - 名前が 3 行に折り返して高くなった参加者の箱も、メッセージ・ブロックのタブと枠・ノートと重ならず、最初の行が一番高い箱の下から始まる
      - '`loop` の範囲のメッセージが繰り返しの枠に入る'
      - '`alt` と `else` の範囲が 1 つの枠に入り、区間が破線で分かれ、枠の左上に `alt` とラベル、区間の左上に `[else のラベル]` が出る。見出しはメッセージのラベルと重ならない'
      - '`Note over` のノートが 2 人の参加者をまたぐ箱で出て、メッセージと重ならない'
      - '`->>+` から `-->>-` までの間、受け手の縦線の上に活性化の帯が出る'
      - '`-->>` は点線、`--x` は × の矢じり、`-)` は開いた矢じりで描かれ、`autonumber` のときだけメッセージに番号が付く'
      - mermaid のライブラリへの要求が 0 件
    test: test_normal_when_sequence
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: ER 図の map を持つ Markdown
        description: 'erDiagram の mermaid のブロック（テーブル 5 つ・関連 5 本）と補足を持つ map の範囲の文書。印に `{"title": "記録の構造"}` を持つ'
        notes: テーブルの 1 つは列を 8 つ持ち、PK・FK・UK のキーと `"コメント"` を持つ列を含む。関連 5 本の記号は `||--o{`・`||--|{`・`}o--||`・`|o--||`・`||..o{`（点線）で、どれもラベルを持つ。補足の `notes` で 1 つのテーブル・1 つの列（`{テーブル}.{列}`）・1 本の関連に説明を持ち、補足の `groups` でテーブル 3 つを 1 つの分類「記録」にまとめる。分類の外の 2 つのテーブルから、分類「記録」の中のテーブルへ 1 本ずつ出る関連を持つ。関連 5 本のうち 1 本は、分類「記録」の中で上下に並ぶ 2 つのテーブルをつなぐ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: テーブル・列・関連と補足を読み込む
        M->>M: 分類の箱の内側から配置し、関連の経路を決める
        M-->>P: 図の枠に入れた ER 図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 図の枠に、テーブルごとにテーブル名の行と列の行（キー・名前・型）を持つ箱が描かれ、mermaid のブロックと補足の文字が出ていない
      - 補足の `groups` の 3 つのテーブルが「記録」のタイトルを持つ分類の箱の中に描かれ、ほかの 2 つのテーブルは箱の外にある
      - テーブルと分類の箱が重ならず、関連の線が両端のテーブルとその祖先の箱以外を横切らない。分類の外の 2 つのテーブルから出る関連の線が、同じ区間を重ならずに通る
      - 関連の線の両端に、記号に合った多重度の印（1・0 か 1・0 以上・1 以上）が描かれ、`..` の関連は点線で描かれ、ラベルが線の上に出る
      - 列の行が、関連の線の端と同じ高さの辺につながる（FK の列から引く）
      - 関連の線の両端が、左右の辺のうち相手のテーブルの中心に近い方の辺につながる。分類「記録」の中で上下に並ぶ 2 つのテーブル（横の中心の差が無い）をつなぐ線は、両端とも右の辺につながる
      - 説明を持つテーブル・列・関連にツールチップのマーカーがあり（列のマーカーは丸の枠線を持たない 14px の線の i のアイコンを薄い色で、列の行の高さの中央に出し、押せる範囲は 24px 四方）、フォーカスかポインターで説明が出る。`"コメント"` を持つ列はコメントを説明として出す
      - 補足の `layout` の色・座標・並び順の指定が、構成図と同じ規則でテーブル・分類の箱・関連に該当する
      - mermaid のライブラリへの要求が 0 件
      - 関連の線にポインターを重ねたときと、テーブルを選んでそのテーブルの関連の線にデータの印が流れるとき（正常シナリオ（ER 図のテーブルを選んで強調する））、データの印は多い側（左の端の `}|`・`}o`、右の端の `|{`・`o{`）のテーブルから少ない側（`||`・`|o`・`o|`）のテーブルへ流れる。`}o--||` の関連は記載の左のテーブルから右のテーブルへ、`||--o{` の関連は右のテーブルから左のテーブルへ流れる。両端が同じ側の多重度の関連（`|o--||`）は、記載の左のテーブルから右のテーブルへ流れる
    test: test_normal_when_er
  - name: 正常シナリオ（状態遷移図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 状態遷移図の map を持つ Markdown
        description: 'stateDiagram-v2 の mermaid のブロックと補足を持つ map の範囲の文書。印に `{"title": "作業の状態"}` を持つ'
        notes: '開始と終了（`[*]`）・入れ子の外の状態 4 つ・中に `[*]` を持つ入れ子の状態（`state 実行中 { … }`）1 つと中の状態 2 つと中の開始と終了・中に `[*]` を持たない入れ子の状態（`state 保留 { 待機 }`）1 つと中の状態 1 つ・遷移 13 本（記載順に、外の `[*]` から最初の状態への遷移 1 本・ラベルを持つ遷移 7 本・入れ子の中の `[*]` から中の状態への遷移 1 本・中の状態から入れ子の中の `[*]` への遷移 1 本・最後の状態から外の `[*]` への遷移 1 本・外の状態から「保留」への遷移 1 本・「保留」から外の状態への遷移 1 本。`[*]` の遷移 4 本はラベルを持たず、ラベルを持つ 9 本は同じ状態への遷移 1 本・外の状態から入れ子の状態への遷移 1 本・外の状態から入れ子の中の状態への遷移 1 本・「保留」への遷移と「保留」からの遷移を含む）・`direction LR`・`note right of`・`<<choice>>` 1 つ・`state "長い名前" as s1` を含む。補足の `notes` で 1 つの状態と 1 本の遷移に説明を持つ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 状態・遷移・入れ子の状態と補足を読み込む
        M->>M: 入れ子の状態の内側から配置し、遷移の経路を決める
        M-->>P: 図の枠に入れた状態遷移図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 状態が角の丸い箱、開始が黒丸、終了が二重丸、`<<choice>>` がひし形で描かれ、`as` で付けた名前が箱に出る
      - 入れ子の状態が、名前のタイトルを持つグループとして中の状態と中の開始・終了を囲み、`direction LR` の向きに並ぶ
      - 入れ子の状態そのものへの遷移は中の開始へ、入れ子の状態からの遷移は中の終了からつながる。中に `[*]` を持たない入れ子の状態は、遷移を持つときだけ中の開始・終了を補って描く
      - 状態とグループが重ならず、遷移の線が両端とその祖先以外を横切らない。外の状態から入れ子の状態とその中の状態へ入る遷移の線が、同じ区間を重ならずに通る。同じ状態への遷移は、その状態の辺から出て同じ状態へ戻る線で描かれる
      - 遷移のラベルが線の上に出て、置き場所が無いラベルはその線のツールチップに出る
      - '`note right of` のノートが状態の右に置かれ、状態と点線でつながる'
      - 説明を持つ状態と遷移にツールチップのマーカーがあり、フォーカスかポインターで説明が出る
      - mermaid のライブラリへの要求が 0 件
