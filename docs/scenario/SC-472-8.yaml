  - name: 正常シナリオ（クラス図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: クラス図の map を持つ Markdown
        description: 'classDiagram の mermaid のブロック（クラス 6 つ・関係 7 本）と補足を持つ map の範囲の文書。印に `{"title": "型の構成"}` を持つ'
        notes: |-
          クラスは「図面」「図形」「基本図形」「円」「一覧」「描画器」の 6 つ。
          「図形」は `<<interface>>`、「一覧」は型の引数 `~T~` を持ち、「基本図形」は抽象のメソッド `描く()*` を持つ。
          メンバーは可視性（`+`・`-`・`#`・`~`）・型・メソッドの引数と戻り値・静的（`$`）・抽象（`*`）を含む。
          関係 7 本は記載順に「基本図形 `..|>` 図形」「基本図形 `<|--` 円」「図面 `*--` 基本図形」「図面 `o--` 一覧」「描画器 `-->` 図面（ラベル「描く」）」「描画器 `..>` 図形」「一覧 `"1" -- "*"` 円」。
