        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ノードのリンク先を本文のリンクと同じ許可で確認する
        M-->>P: 許可しないリンク先の書き方の警告と、リンクにしないノードの map の図と本文
        P-->>U: 警告と図と本文を表示
    expected:
