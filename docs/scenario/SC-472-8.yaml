    expected:
      - 開いたとき、図が閉じた折りたたみに入り、見出しに印の `title` が出る
      - 折りたたみを開くと、正常シナリオと同じ配置の図が出る
    test: test_normal_when_closed
  - name: 正常シナリオ（ノードを選んで強調する）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 構成図の map を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 線を 2 本持つノードを押す
        D-->>U: そのノードとそのノードの線のほかを薄くし、その線にデータの印を流す
        U->>D: 相手のノードの 1 つも押す
        D-->>U: 選んだ 2 つのノードの間の線と両端のほかを薄くする
        U->>D: 右上の「配置と選択を元に戻す」を押す
        D-->>U: 選択を解く
    expected:
      - 1 つ選ぶと、そのノードとつながる 2 本の線とラベルの表示は変わらず、線の相手のノードを含むほかのノード・線・ラベルが薄くなり、2 本の線の上をデータの印が流れ続ける
      - 2 つ選ぶと、選んだ 2 つのノードとその間の線だけが残る
      - 線を押すと両端の 2 つのノードが選ばれ、もう一度押すと両方の選択が解ける。片方だけ選んだ状態で線を押すと両方が選ばれる
      - 「配置と選択を元に戻す」は選んだか、ノード・線を動かしたときだけ押せ、押すか Esc で全ての選択が解け、薄くした表示とデータの印が消える
      - ノードの中の i と、閉じたグループの開くボタンを押したときは選択が変わらない
      - 案内の途中で選ぶと、選んだノードの強調が案内の強調より優先される
    test: test_normal_when_node_selected
  - name: 正常シナリオ（ノードと線を動かす）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
      - name: 構成図の map を持つ Markdown
        description: 正常シナリオと同じ（グループの中のノードと、折れ点が 2 つ以上ある線を持つ）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: グループの中のノードを、グループの下端を越える位置までドラッグする
        D-->>U: ノードを動かし、グループを中身に合わせて広げる
        U->>D: ノードを、ほかのノードに重なる位置までドラッグする
        D-->>U: 間が 16px になる手前で止める
        U->>D: 線の中ほどの区間と、ノードにつながる端の区間を、区間と直角の向きへドラッグする
        D-->>U: 区間を動かし、隣の区間をつなぎ直す
        U->>D: ページを再読み込みする
        D-->>U: 動かした配置のまま描く
        U->>D: 右上の「配置と選択を元に戻す」を押す
        D-->>U: 自動配置に戻す
    expected:
      - どの深さのグループの中のノードも、ポインターの動いた分だけ動き、ノードを含むグループの枠がノードを囲むまで右と下へ広がる。動かしたノードと、それを含むグループの大きさのほかは位置が変わらない。押しただけ（4px 未満）のときは選択が切り替わる
      - ノードはグループの左端・上端より外へは動かない
      - グループのタイトルの行をドラッグすると、グループと中のノード・グループが同じ並びのまま動き、外のグループが中身に合わせて広がる
      - グループの面（タイトルの行の外）と余白をドラッグすると、グループは動かず、図の枠の中がスクロールする
      - ノードや広がったグループと、ほかのノード・グループとの間が 16px より狭くなる位置へは動かない
      - 選ばずにノードや区間を動かしただけでも、「配置と選択を元に戻す」が押せる
      - 線のどの区間の上でもポインターが動かせる向きの形になり、ドラッグすると区間がその向きへ動く。端の区間は、ノードにつながる端がノードの辺に沿って動く。辺の端を越えるまで動かすと、越えた側の辺につなぎ替わり、線がノードの中央から直角にその辺へ入り、矢じりもその辺に付く。真ん中の区間をノードの上へ動かすと、線はノードの上の辺から入る
      - ノードの名前の文字の上を押しても選択もドラッグもされず、文字を選んでコピーできる。種類を書かないノードも、名前の上の高さ 24px の行を押して選び、ドラッグできる
      - 再読み込みした後も、動かしたノードと区間の位置のまま描かれ、文書の Markdown は変わらない
      - 「配置と選択を元に戻す」で、全てのノードと線が自動配置の位置に戻る
    test: test_normal_when_moved
  - name: 正常シナリオ（表示する枠の高さを変える）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 構成図の map を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 下端のリサイズハンドルを、図の高さを越えるまで下へドラッグする
        D-->>U: 表示する枠を高くする
        U->>D: リサイズハンドルをダブルクリックする
        D-->>U: 表示する枠の高さを図の高さに合わせる
    expected:
      - 図の高さを越えても、ドラッグした分だけ表示する枠が高くなる
      - ダブルクリックで、表示する枠の高さが図の高さに合い、図の倍率は変わらない
      - リサイズハンドルが横のスクロールバーと重ならない
    test: test_normal_when_frame_resized
  - name: 正常シナリオ（ER 図のテーブルを選んで強調する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオ（ER 図）の ER 図を描いたページ
        notes: '「顧客」と「注文」が `||--o{`、「注文」と「明細」が `||--|{`、「明細」と「商品」が `}o--||`、「商品」と「顧客」が `|o--||` でつながる。「注文」と「商品」は直接つながらず、最短の経路は「明細」を通る 1 本だけ。「顧客」と「明細」は直接つながらず、最短の経路は「注文」を通る 1 本と「商品」を通る 1 本の 2 本'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as ER 図
        U->>D: 「明細」のテーブル名の行を押す
        D-->>U: 「明細」と関連する 2 つのテーブルと関連の線のほかを薄くする
        U->>D: Esc を押してから「注文」と「商品」を押す
        D-->>U: 2 つをつなぐ経路のテーブルと関連だけを残し、1 対多の向きにたどる関連に印を付ける
        U->>D: Esc を押してから「顧客」と「明細」を押す
        D-->>U: 2 本の最短の経路のテーブルと関連を全て残し、経路ごとに 1 対多の向きにたどる関連に印を付ける
        U->>D: 右上の「配置と選択を元に戻す」を押す
        D-->>U: 選択を解く
    expected:
      - 1 つ選ぶと、そのテーブル・関連の線・線の相手のテーブルの表示は変わらず、ほかのテーブルと関連が薄くなる
      - 「注文」と「商品」を選ぶと、間の「明細」を通る経路のテーブルと関連だけが残る
      - 「顧客」と「明細」を選ぶと、「注文」を通る経路と「商品」を通る経路の両方のテーブルと関連が残り、「顧客」→「注文」と「注文」→「明細」の関連に行が増える旨の印が付く。「商品」を通る経路は「顧客」→「商品」が 0 か 1、「商品」→「明細」が 0 以上なので、「商品」→「明細」の関連に印が付く
      - 経路のうち 1 の側から多の側へたどる関連に、行が増える旨の印が付き、印にフォーカスすると、どのテーブルで行が増えるかがツールチップに出る
      - 列の行を押しても選択は変わらず、列の名前の文字を選んでコピーできる
      - 「配置と選択を元に戻す」か Esc で選択が解け、薄くした表示と印が消える
      - テーブルの箱はキーボードで選べ、選んでいるかの状態をスクリーンリーダー向けに持つ
    test: test_normal_when_er_table_selected
  - name: 正常シナリオ（状態遷移図の状態を選んで強調する）
