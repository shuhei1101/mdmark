        notes: C4Container は `Person`・`Container`・`ContainerDb`・`ContainerQueue`・`Container_Ext`・`System_Ext` と、それらを囲む `Container_Boundary` を持つ。C4Component は `Component`・`ComponentDb`・`ComponentQueue`・`Component_Ext` と `Container_Boundary` を持つ。C4Dynamic は番号を持たない `Rel` 3 本と `RelIndex` 1 本を持つ。C4Deployment は 3 レイヤーの入れ子の `Deployment_Node` と、`Node_L`・`Node_R` の中の `Container`・`ContainerDb` を持つ。どの図も 1 つの要素に技術と説明の引数を持ち、補足の `notes` で 1 つの要素に説明を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 4 種類の境界・配置先のノード・要素・関係を読み込む
        M->>M: C4Context と同じく境界と配置先のノードの内側から配置する
        M-->>P: 図の枠に入れた 4 つの C4 図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - '4 つの図とも、要素が種類の行・名前・説明を持つ箱で描かれ、種類の行は技術の引数を持つ要素で `[Container: {技術}]`・`[Component: {技術}]` のように種類と技術を出す。`*Db` はデータベースのアイコン、`*Queue` は角の丸い横長の形、`_Ext` の要素は種類の行が `[External Container]` のように `External` を付けて灰色の面で描かれる（正常シナリオ（C4 図）と同じ描き分け）'
      - '`Container_Boundary` が名前と種類のタイトルを持つ破線の枠で中の要素を囲む'
      - C4Dynamic の関係の線のラベルの前に、記載の順の番号が出る。`RelIndex` も、Mermaid と同じく第 1 引数によらず記載の順の番号にする
      - C4Deployment の `Deployment_Node`・`Node`・`Node_L`・`Node_R` は、名前と種類の引数（`Ubuntu 22.04` など）をタイトルに持つ実線の枠で中の配置先のノードと要素を囲み、入れ子の配置先のノードは外の配置先のノードの中に描かれる。`Node_L`・`Node_R` は兄弟の配置先のノードの左・右に置かれる
      - 要素と境界・配置先のノードが重ならず、関係の線が両端とその祖先以外を横切らない
      - 説明を持つ要素にツールチップのマーカーがあり、フォーカスかポインターで補足の説明が出る。補足の `notes` のキー・`layout` の指定・ドラッグ・案内は、正常シナリオ（C4 図）と同じ規則で該当する
      - mermaid のライブラリへの要求が 0 件
    test: test_normal_when_c4_other_kinds
  - name: 正常シナリオ（計画した変更を示す）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 計画した変更を持つ map の Markdown
        description: map の範囲を 2 つ持つ文書。1 つ目は flowchart で、補足の `changes` で、ノード 1 つと線 1 本に `added`、ノード 1 つに `changed`、ノード 1 つと線 1 本に `removed` を持つ。2 つ目は sequenceDiagram で、メッセージ `1` に `added` を持つ
        notes: '`changes` の値は `{"type": "{値}"}` のオブジェクトで記載する。flowchart の `changes` に知らない値 `moved` を持つ ID を 1 つ持つ。種類の色 `green` を持つノードを `added` にし、補足の `layout` で `color` に `blue` を持つノードを `changed` にする'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 補足に changes を持つ Markdown を指定して描かせる
        M->>M: changes の ID と値を点検する
        M-->>P: 追加・変更・削除の色とバッジを付けたノードと線
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - '`added` のノードは差分の追加の色（`--mdmark-color-diff-add-sign`）の枠線、`added` の線は同じ色の線で描かれ、ノードに「追加」のバッジがある'
      - '`changed` のノードは色の名前 `orange` の枠線で描かれ、「変更」のバッジがある'
      - '`removed` のノードは差分の削除の色（`--mdmark-color-diff-del-sign`）の破線の枠線と取り消し線の名前で描かれ、「削除」のバッジがある。`removed` の線は同じ色の破線で描かれる'
      - '`removed` のノードと線も配置に含まれ、ほかのノードと重ならない'
      - '`layout` の `color` か種類の色を持つノードも、枠線は変更の色で描かれ、種類のアイコンと名前の行は種類の色のまま'
      - '`changes` を描くのは、構成図の部品の上に描く種類（flowchart・ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図）だけ。シーケンス図・マインドマップ・軸と格子の配置の図の補足が `changes` を持つときは、図の前の記載の警告に `map_invalid_value` が 1 件出て、色とバッジを付けない'
      - 1 つ目の図の前の記載の警告に、知らない値 `moved` の `map_invalid_value`（使用できる値の一覧を含む）が 1 件出て、そのノードは枠線の色とバッジが正常シナリオと同じ
    test: test_normal_when_planned_changes
  - name: 正常シナリオ（図を SVG・PNG に書き出す）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 構成図の map を持つ Markdown
        description: 正常シナリオと同じ文書。グループを 1 つ閉じ、ノードを 1 つ選んだ状態にする
      - name: Mock
        description: 正常シナリオと同じ。ブラウザのダウンロードを受け取るように用意する。端末の `devicePixelRatio` は 1
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant B as ブラウザ
        U->>D: 右上のパネルを開いて書き出すボタンを押す
        D-->>U: SVG と PNG の項目のメニュー
        U->>D: SVG を選ぶ
        D->>B: 今の見せ方の図の全体を SVG のファイルにして保存させる
        U->>D: 書き出すボタンを押して PNG を選ぶ
        D->>B: 同じ図を PNG のファイルにして保存させる
      ```

      <!-- /map -->
    expected:
      - パネルを開くと、拡大・全画面のボタンと並んで、スクリーンリーダー向けの名前「図を書き出す」を持つ書き出すボタンがある
      - SVG と PNG のファイル名が `{図の枠のタイトル}.svg`・`{図の枠のタイトル}.png`（タイトルが無い図は `図 {文書の中の map の番号}`）になる
      - 書き出した SVG は、閉じたグループの名前を持ち、閉じたグループの中のノードの名前を持たない。`width`・`height` は倍率と表示する位置に依らず、等倍の図の全体の大きさになる
      - 書き出した SVG は、選択の強調・パネル・リサイズハンドル・ツールチップのマーカー・記載の警告の要素を持たない
      - 書き出した SVG は外部の資源（外部への `href`・`url()`・CSS 変数の `var()`）を持たず、ノードの名前の文字・種類のアイコンの図形・ノードの枠線の色（ページで計算した値）を SVG の中に持つ
      - PNG の幅・高さは、書き出した SVG の `width`・`height` の 2 倍
      - Esc でメニューが閉じ、書き出すボタンへフォーカスが戻る
    test: test_normal_when_exported
  - name: 正常シナリオ（一覧の表示で読む）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 構成図の map を持つ Markdown
        description: map の範囲を 3 つ持つ文書。1 つ目は正常シナリオの構成図、2 つ目は正常シナリオ（シーケンス図）の sequenceDiagram、3 つ目は正常シナリオ（ガントチャート）の gantt
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 構成図のパネルを開いて一覧の表示のボタンを押す
        D-->>U: グループとノードの入れ子の一覧
        U->>D: 一覧にフォーカスして ↓・→・← を押す
        D-->>U: 項目を移り、グループの項目を開閉する
        U->>D: シーケンス図の一覧の表示のボタンを押す
        D-->>U: メッセージを記載順に並べた一覧
        U->>D: 構成図の一覧の表示のボタンをもう一度押す
        D-->>U: 図の表示に戻す
      ```

      <!-- /map -->
    expected:
      - 一覧の表示のボタンはスクリーンリーダー向けの名前「一覧で表示」と `aria-pressed` を持ち、押すと表示する枠の中が図から一覧に替わる
      - 一覧の表示のボタンは、構成図の部品の上に描く種類（flowchart・ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図）とシーケンス図のパネルにある。3 つ目のガントチャートのパネルには一覧の表示のボタンが無い（マインドマップとほかの軸と格子の配置の図も同じ）
      - 構成図の一覧は、グループを子を持つ項目、ノードを項目にした入れ子の一覧で、ノードの項目は名前・種類の名前・補足の `notes` の説明と、出る線（「→ {相手の名前}」と線のラベル）を持つ
      - ↑・↓ で項目を移り、→ でグループの項目を開き、← で閉じる。項目はスクリーンリーダーで名前・種類・説明・出る線の数の順に読み上げられる
      - 'シーケンス図の一覧は、メッセージを記載順に「{送信元} → {送信先}: {メッセージ}」の項目で並べる'
      - 一覧の表示は文書の目次に見出しを追加しない
      - もう一度押すと図の表示に戻り、図の倍率・位置・開閉は一覧に切り替える前と同じ
    test: test_normal_when_list
  - name: 正常シナリオ（グループの大きさを変える）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオの構成図と、正常シナリオ（ER 図）の ER 図を描いたページ
        notes: 構成図は入れ子 2 レイヤーのグループを持ち、中のグループの右に外のグループのノードがある。中のグループを右へ広げると、そのノードとの間が 16px になる位置を決定的に発生させる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 中のグループの右下の角を右下へドラッグする
        D-->>U: 中のグループを広げ、外のグループを中身に合わせて広げる
        U->>D: 同じ角を、右のノードに重なる位置まで右へドラッグする
        D-->>U: 間が 16px になる手前で止める
        U->>D: 同じ角を中のノードより内側まで左上へドラッグする
        D-->>U: 中のノードを囲む大きさで止める
        U->>D: 角にフォーカスして → と ↓ を押す
        D-->>U: グループを右と下へ広げる
        U->>D: ページを再読み込みする
        D-->>U: 変えた大きさのまま描く
        U->>D: 右上のパネルを開いて「配置と選択を元に戻す」を押す
        D-->>U: 自動配置の大きさに戻す
      ```

      <!-- /map -->
    expected:
      - グループの右下の角にポインターを重ねると、ポインターが斜めの大きさを変える形になる
      - 角をドラッグすると、グループの右端と下端がポインターの動いた分だけ動き、左端・上端と中のノード・線の位置は変わらない。外のグループは広げたグループを囲むまで広がる
      - グループは中のノードとグループを囲む大きさより小さくならず、ほかのノード・グループとの間が 16px より狭くなる大きさへは広がらない
      - 角はキーボードでフォーカスでき、フォーカスの枠が見え、スクリーンリーダー向けの名前を持つ。→・↓ で広がり、←・↑ で狭まり、ノードをキーで動かすときと同じ刻みで変わる
      - 再読み込みした後も、変えた大きさのまま描かれ、文書の Markdown は変わらない。大きさを変えただけでも「配置と選択を元に戻す」が押せる
      - 「配置と選択を元に戻す」で、全てのグループが自動配置の大きさに戻る
      - 構成図のグループと同じ規則で、ER 図の分類の箱・状態遷移図の入れ子の状態・クラス図の namespace・アーキテクチャ図の group・C4 図の境界と配置先のノードも、角をドラッグして大きさを変えられる。閉じたグループと、グループの中へ入っているときの外のグループには角が無い
      - グループの左・右・下の縁（内側 8px の帯）にポインターを重ねると掴む形になり、ドラッグすると、タイトルの行をドラッグしたときと同じく、グループと中のノード・グループが同じ並びのまま動く。右下の角は大きさを変える操作を優先する。縁を掴んで動かす操作は、角を出すのと同じ図の種類のグループ（構成図のグループ・ER 図の分類の箱・状態遷移図の入れ子の状態・クラス図の namespace・アーキテクチャ図の group・C4 図の境界と配置先のノード）にあり、閉じたグループと、グループの中へ入っているときの外のグループには無い
    test: test_normal_when_group_resized
