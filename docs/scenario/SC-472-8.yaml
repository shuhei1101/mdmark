      - name: リンク先を持つノードの map を持つ Markdown
        description: 'flowchart の map の範囲 1 つを持つ文書。ノード 3 つのうち、1 つに `click {ID} "https://example.com/spec"`、1 つに `click {ID} "./other.md"` の行でリンク先を持たせ、1 つは持たせない'
      - name: Mock
