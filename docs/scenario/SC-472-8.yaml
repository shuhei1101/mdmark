    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: Mermaid の click の行を読み、リンク先を持つノードをリンクにする
        M-->>P: map の図と本文
        P-->>U: 文書を表示
        U->>P: リンク先を持つノードを押す
        P-->>U: ノードのリンク先を開く
    expected:
      - リンク先を持つ 2 つのノードがリンクになり、リンク先を持たないノードはリンクにならない
      - '`https://example.com/spec` のノードを押すと、そのリンク先が開く。`./other.md` のノードを押すと、本文の相対パスのリンクと同じく、ページの URL を基準にした `other.md` が開く'
      - キーボードでリンク先を持つノードにフォーカスでき、フォーカスの枠が見え、Enter で同じリンク先が開く
      - リンク先を持つノードを押したままドラッグしたときは、リンク先を開かずにノードが動く
