  - name: 正常シナリオ（インデントで畳む・開く）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 入れ子のコードを持つ Markdown
        description: 3 階層の入れ子のキーを持つ言語 `yaml` のコードブロック、閉じ括弧の行で終わる入れ子のオブジェクトを持つ言語 `json` のコードブロック、言語 `tree` のコードブロックを持つ文書
