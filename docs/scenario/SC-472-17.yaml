    test: test_error_when_fold_line_invalid
  - name: 正常シナリオ（折り返す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面の幅は 390px
      - name: 折り返すマーカーを持つ Markdown
        description: '`<!-- code: {"lines": {}, "wrap": true} -->` の直後に、2 行目だけが表示の幅より長い 3 行の言語 `ts` のコードブロックと、マーカーの無い同じコードブロックを配置した文書'
      - name: Mock
