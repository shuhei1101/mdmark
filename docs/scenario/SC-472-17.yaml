      - '`dockerfile` と `docker` のコードブロックの `FROM`・`RUN` などの命令が、地の文字と違う色で出ている'
      - '`diff` と `patch` のコードブロックの `+` で始まる行と `-` で始まる行が、地の文字とも互いとも違う色で出ている'
      - '`[!code ++]` を付けた diff の行が追加した行の地の色と行頭の `+` で出ていて、行の中の文字は色分けされている'
      - 色分けのライブラリへの要求が、本体 1 件と `dockerfile`・`diff` の言語のモジュール 1 件ずつ（別名の `docker`・`patch` は同じモジュールを使用する）
      - 各コードブロックのラベルは記載した情報文字列のとおり（`dockerfile`・`docker`・`diff`・`patch`）
    test: test_normal_when_dockerfile_and_diff_highlighted
