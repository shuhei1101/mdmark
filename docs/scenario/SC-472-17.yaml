    expected:
      - 描いた直後、2 行目と 6 行目の下の深い行が隠れ、2 行目と 6 行目に ▸ と ⋯ が出ている
      - クリップボードの中身が、畳んだ行を含むコードブロックの全ての行を持つ
      - 再読み込みした後、開閉の状態は覚えておらず、`fold` のとおり 2 行目と 6 行目を畳んだ状態で描かれる
