      - '`wrap` のブロックのコピーボタンでコピーした文字に、折り返しの改行が入っていない'
    test: test_normal_when_wrap
lead: '文書の作成者が、コードブロックの直前の `<!-- code: {"title": "タイトル", "lines": {}, "highlight": [行]} -->` と、コードの行末の行コメントの `[!code ++]`・`[!code --]`・`[!code highlight]` を記載すると、mdmark がコードブロックにタイトル・行番号・行の強調と、追加した行・削除した行・強調のマーカーを付けて描く。言語の指定があれば言語のラベルを出し、読者はコピーボタンで変更後のコードをコピーする。'
issue: 25
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: どのファイルのコードか、何行目か、どの行を変えたか・確認するべきかが確認して取れ、コピーしたコードに行番号と行頭の `+`・`-` が混ざらない
trigger: 利用側のページが、コードブロックのマーカーかコードの行のマーカーを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - コードブロックの機能（`code`）がオン（既定）
success_guarantee: |-
  コードブロックの上にタイトルが、各行の左に行番号が出て、指定した行とマーカーを付けた行が色と行頭の `+`・`-` で分かれる。マーカーと、マーカーだけを持つ行コメントの頭は画面に出ない。GitHub ではコードブロックのマーカーが見えず、コードの行のマーカーは行コメントとして読み込める。

  tree を除くコードブロックは、インデントの深い行を畳む・開くことができ、インデントのレベルごとに縦線が参照される。コピーボタンは畳んだ行も含めてコピーする。

  色分けに対応する言語のコードブロックは、タイトル・行番号・行のマーカーを保ったまま中身が言語に応じて色分けされる。色分けのライブラリは、色分けする言語のコードブロックがある文書でだけ、本体と使用する言語の分を読み込む。
minimal_guarantee: |-
  知っているキーの型・選べる値に合わない値と知らないマーカーは、その指定だけを適用せずに描かれ、上に記載の警告が出る。知らないキーは、警告を出さずに無視する。コードの中身は欠けずに出る。

  色分けのライブラリか言語のモジュールを読み込めないときは、そのコードブロックを色分けせずに記載したとおりに出す。
test_file: tests/e2e/単一ユースケース/コードブロックを飾る.spec.ts
