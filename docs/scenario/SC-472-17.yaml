        description: 正常シナリオと同じ
      - name: focus・error・warning のマーカーを持つ Markdown
        description: 行末に `// [!code focus]` を付けた行、`// [!code error]` を付けた行、`// [!code warning]` を付けた行、マーカーの無い行の 4 行を持つ言語 `ts` のコードブロックの文書
