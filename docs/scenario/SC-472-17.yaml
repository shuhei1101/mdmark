    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 畳める行に開閉のボタンを付けたコードブロックを描く
        U->>P: yaml の 1 行目のキーの行にポインターを乗せ、▾ を押す
        P-->>U: その行より深い行を畳んだコードブロック
        U->>P: 畳んだ行の末尾の ⋯ を押す
        P-->>U: 開いたコードブロック
        U->>P: Shift を押しながら 1 行目のキーの ▾ を押し、もう一度 Shift を押しながら ▸ を押す
        P-->>U: 入れ子もまとめて畳み、まとめて開いたコードブロック
        U->>P: json のオブジェクトの行の ▾ を押す
        P-->>U: 閉じ括弧の行を残して畳んだコードブロック
    expected:
      - 描いた直後は全ての行が出ていて、▾ は行番号の右にあり、ポインターを乗せた行にだけ出る
      - ▾ を押した後、その行より深い行が、次の同じ深さ以下の行の手前まで隠れ、畳んだ行の ▸ が常に出て、行の末尾に行数を持たない ⋯ だけが出る
      - ⋯ を押すと畳んだ行が開く
      - Shift を押しながら畳むと、開いたときに内側の行も畳んだまま残らず、全ての入れ子がまとめて開閉する
      - json のオブジェクトを畳んだ後も、閉じ括弧の行が出ている
      - 開閉のボタンはキーボードで操作でき、`aria-expanded` で開閉の状態を示す
      - '`tree` のコードブロックには、インデントの開閉のボタンが付かない'
    test: test_normal_when_folded_by_indent
  - name: 正常シナリオ（インデントの縦線）
