id: SC-472-66
visibility: internal
title: "画像をライトボックスで拡大する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書を描いたページ
        description: バージョンを固定した URL で mdmark を読み込み、文書を描いた HTML
      - name: 3 つの画像の Markdown
        description: '`a.png`・`b.png`・`c.png` の 3 つの画像を、本文の段落を挟んで並べた文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。画像は手元の応答で返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像を押す
        M-->>U: 2 つ目の画像を拡大した全画面のダイアログ
        U->>M: 右の矢印キーを押す
        M-->>U: 3 つ目の画像
        U->>M: 前へのボタンを 2 回押す
        M-->>U: 1 つ目の画像
        U->>M: Esc を押す
        M-->>U: ダイアログを閉じた文書
      ```

      <!-- /map -->
    expected:
      - 2 つ目の画像を押した後、全画面のダイアログが開き、`b.png` が表示されている
      - 右の矢印キーの後に `c.png`、前へのボタンを 2 回押した後に `a.png` が表示されている
      - ダイアログに、何枚目か（3 枚のうち）が出ている
      - Esc の後にダイアログが閉じ、フォーカスが 2 つ目の画像へ戻り、文書のスクロールの位置が押す前と同じ
      - ダイアログの前へ・次へ・閉じるのボタンが `aria-label` を持ち、ダイアログの中で Tab のフォーカスが循環する
    test: test_normal
  - name: 正常シナリオ（キーで開く）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: 3 つの画像の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 描いた文書
        participant M as mdmark
        U->>P: Tab で 1 つ目の画像にフォーカスする
        U->>P: Enter を押す
        M-->>U: 1 つ目の画像を拡大した全画面のダイアログ
      ```

      <!-- /map -->
    expected:
      - 画像が Tab でフォーカスでき、拡大できることがスクリーンリーダーで知らされる
      - Enter の後、全画面のダイアログで `a.png` が表示されている
    test: test_normal_when_opened_by_key
  - name: 正常シナリオ（拡大しない画像）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: nolightbox を持つ Markdown
        description: '`a.png`・`![アイコン](b.png){nolightbox}`・`c.png` を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像を押す
        P-->>U: 何も開かない
        U->>P: 1 つ目の画像を押す
        M-->>U: 1 つ目の画像の全画面のダイアログ
        U->>M: 右の矢印キーを押す
        M-->>U: 3 つ目の画像
      ```

      <!-- /map -->
    expected:
      - 2 つ目の画像を押してもダイアログが開かず、2 つ目の画像は Tab でフォーカスされない
      - 1 つ目から右の矢印キーで送信すると `c.png` が表示され、`b.png` は飛ばされる
      - ダイアログの枚数が 2 枚になっている
    test: test_normal_when_nolightbox
  - name: 正常シナリオ（スマホのピンチで拡大・縮小する）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
        notes: 画面の幅は 390px。タッチの操作で開く
      - name: 3 つの画像の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像をタップする
        M-->>U: 2 つ目の画像を拡大した全画面のダイアログ
        U->>M: 画像の上で 2 本の指の間を広げる
        M-->>U: 2 本の指の中点を保って倍率を上げて表示
        U->>M: 2 本の指の間を狭め、開いたときの倍率の 0.25 倍になった後もさらに狭める
        M-->>U: 開いたときの倍率の 0.25 倍より縮めずに表示
      ```

      <!-- /map -->
    expected:
      - 画像の上で広げると画像の倍率が上がり、ブラウザはページ全体を拡大しない
      - 倍率を変えても、2 本の指の中点の下にあった画像の場所が中点の下に残る
      - 狭めると倍率が下がり、開いたときの倍率の 0.25 倍より下へは縮まず、5 倍より上へは拡大しない（図と同じ範囲）
      - ダイアログの上のバーの倍率の表示が、ピンチで変えた倍率に合う。上のバーのボタンの配置は変わらない
    test: test_normal_when_pinch
  - name: 正常シナリオ（ドラッグしないで拡大した画像を動かす）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
        notes: 画面の幅は 390px。タッチの操作で開き、押してから離すまで 4px 未満しか動かさない
      - name: 3 つの画像の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像をタップする
        M-->>U: 2 つ目の画像を拡大した全画面のダイアログ
        U->>M: 上のバーの拡大のボタンを 2 回タップする
        M-->>U: 画像を拡大し、移動のボタンを出す
        U->>M: 移動のボタンをタップし、開いたメニューの「右へ移す」をタップする
        M-->>U: 画像の右側が見えるように画像を動かし、メニューを開いたままにする
      ```

      <!-- /map -->
    expected:
      - 画像が画像の場所より大きい倍率のときだけ、押せる範囲が 24px 以上でスクリーンリーダー向けの名前を持つ移動のボタンが出る。全体が収まる倍率に戻すと消える
      - 移動のメニューは「上へ移す」「下へ移す」「左へ移す」「右へ移す」を持ち、押すたびに矢印キーで動かすときと同じ量だけ、押した向きの先が見えるように画像が動く。画像の端まで動いた向きの項目は押せない
      - メニューで動かしても倍率と上のバーのボタンの配置は変わらず、ページはスクロールしない
      - メニューは矢印キーで項目を移り、Enter で押せ、Esc とメニューの外を押すとメニューだけが閉じてフォーカスが移動のボタンへ戻る。メニューを閉じた状態で Esc を押すとダイアログが閉じる
      - マウスでも同じ操作ができる
    test: test_normal_when_moved_without_drag
lead: 読者が文書の画像を押すと、全画面のダイアログで拡大し、同じ文書の画像を前後に切り替える。キー・ボタン・閉じ方は図の全画面と統一する。`nolightbox` の属性を付けた画像は拡大しない。
primary_actor: 読者
stakeholders:
  - name: 文書の作成者
    interest: 細かい画像を本文では小さく配置し、読者に拡大して見せられる
trigger: 読者が、描いた文書の画像を押す
preconditions:
  - 利用側のページが、画像を持つ文書を描いている
  - ライトボックスの機能がオン（既定）
success_guarantee: 押した画像が全画面で拡大され、前後の画像へ送信できて、閉じると押した画像へフォーカスが戻る。
minimal_guarantee: 拡大を閉じた後の文書は、押す前と同じスクロールの位置にある。
test_file: tests/e2e/単一ユースケース/画像をライトボックスで拡大する.spec.ts
tags:
  - name: topic:ライトボックス
    main: true
  - name: topic:画像
  - name: action:拡大
