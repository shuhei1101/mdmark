id: SC-472-42
visibility: internal
title: 図を拡大・縮小・移動する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオの map の構成図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ページを開く
        D-->>U: 置き場所の幅いっぱいの枠に、等倍で表示し、右上に倍率の表示と開くボタンだけのパネルを重ねる
        U->>D: パネルの開くボタンを押す
        D-->>U: パネルに縮小・拡大・全画面のボタンを並べる
        U->>D: 拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: 縮小のボタンを押す
        D-->>U: 倍率を下げて表示
        U->>D: 図にフォーカスして + を押す
        D-->>U: 倍率を上げて表示
        U->>D: - を押す
        D-->>U: 倍率を下げて表示
        U->>D: 拡大してから 0 を押す
        D-->>U: 開いたときの倍率に戻す
        U->>D: 拡大のボタンを押してから、パネルの倍率の表示を押す
        D-->>U: 開いたときの倍率と位置に戻す
        U->>D: 押せなくなるまで縮小のボタンを押す
        D-->>U: 倍率の表示 25% で止める
        U->>D: 押せなくなるまで拡大のボタンを押す
        D-->>U: 倍率の表示 500% で止める
        U->>D: パネルの開くボタンをもう一度押す
        D-->>U: パネルを倍率の表示と開くボタンだけに畳む
      ```

      <!-- /map -->
    expected:
      - 開いたとき、図の枠が置き場所の幅いっぱいに広がり、図は等倍で描かれ、枠に収まらない分は枠の中で横にスクロールできる
      - 開いたとき、図の右上に図へ重ねた小さいパネルがあり、倍率の表示のボタンと開くボタンだけを出す。表示する枠の上に図と別の行を作らない
      - 開くボタンを押すと、同じパネルに縮小・倍率の表示・拡大・全画面のボタンが並び、開くボタンは畳んだときと同じ位置に残る。もう一度押すと畳む
      - 開くボタンはスクリーンリーダー向けの名前（畳んだとき「表示の操作を開く」、開いたとき「表示の操作を閉じる」）と `aria-expanded`（畳んだとき `false`、開いたとき `true`）を持ち、パネルのほかのボタンもそれぞれスクリーンリーダー向けの名前を持つ。図を動かす矢印のボタンは無い
      - 拡大のボタンと `+` で倍率が上がり、縮小のボタンと `-` で倍率が下がる
      - 倍率の表示は開いたときの倍率を 100% とした値で、縮小は 25%、拡大は 500% で止まり、そこで縮小・拡大のボタンはそれぞれ押せなくなる
      - '`0` と、パネルの倍率の表示を押すことで、開いたときの倍率と位置に戻る'
    test: test_normal
  - name: 正常シナリオ（ホイール）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ。図の下にも段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 図の上でホイールを回す
        D->>P: 倍率を変えずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
        U->>D: Shift を押しながらホイールを回す
        D-->>U: 図を横に動かす
      ```

      <!-- /map -->
    expected:
      - 図の上のホイールで図の倍率が変わらず、文書が縦にスクロールする
      - Shift とホイールで、図が横に動く
    test: test_normal_when_wheel
  - name: 正常シナリオ（ドラッグと文字の選択）
    setup:
      - name: 拡大した図
        description: 正常シナリオの map の構成図を拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードと線の外の余白を押したまま動かす
        D-->>U: 図を動かしただけ動かし、文字を選ばない
        U->>D: ノードの名前の上で押したまま動かす
        D-->>U: 図を動かさず、文字を選ぶ
      ```

      <!-- /map -->
    expected:
      - 余白の上ではカーソルが動かせる構造で、ドラッグした分だけ図が動く
      - ドラッグ中は文字が選ばれない
      - 文字の上ではカーソルが I の構造で、ドラッグした範囲の文字が選ばれ、図は動かない
    test: test_normal_when_drag
  - name: 正常シナリオ（矢印キーで動かす）
    setup:
      - name: 拡大した図
        description: 表示する枠より広い mermaid の xychart-beta（正常シナリオ（mermaid の図）と同じ図） を拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 図にフォーカスして→を押す
        D-->>U: 図を左へずらして右側を見せる
        U->>D: ↓を押す
        D-->>U: 図を上へずらして下側を見せる
      ```

      <!-- /map -->
    expected:
      - 矢印キーで、押した向きの先が見えるように図が動く
      - パネルに図を動かす矢印のボタンは無い
      - キーボードだけで図へフォーカスでき、フォーカスの枠が見える
    test: test_normal_when_keyboard
  - name: 正常シナリオ（埋め込んだ HTML の中のチャート）
    setup:
      - name: チャートを描いたページ
        description: 『チャートを描く』の正常シナリオの棒のチャートを、同じ HTML の中の段落と一緒に描いたページ。チャートの下にも文書の段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as チャート
        participant P as 文書
        U->>D: 右上のパネルを開いて拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: チャートにフォーカスして - と 0 を押す
        D-->>U: 倍率を下げ、全体が収まる倍率に戻す
        U->>D: 拡大してからドラッグする
        D-->>U: チャートを動かして表示
        U->>D: チャートの上でホイールを回す
        D->>P: 倍率を変えずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
      ```

      <!-- /map -->
    expected:
      - 拡大のボタンで倍率が上がり、`-` で下がり、`0` で開いたときの倍率と位置に戻る
      - 拡大した後のドラッグでチャートの位置が動く
      - ホイールでは倍率が変わらず、文書がスクロールする
      - 拡大してもチャートの線と文字が SVG のまま描かれ、ぼやけない
      - 同じ HTML の中の段落には、拡大・縮小のボタンが無い
    test: test_normal_when_embedded_chart
  - name: 正常シナリオ（mermaid の図）
    setup:
      - name: 図を描いたページ
        description: map の範囲の外に、言語 `mermaid` の xychart-beta・flowchart・sequenceDiagram のコードブロックを 1 つずつ持つ文書を描いたページ
        notes: xychart-beta（map が描けない種類）は幅が表示する枠の幅より広く、x 軸の項目を 12 個持つ棒のチャート。flowchart は線のラベルを持つ線を 1 本持ち、sequenceDiagram はメッセージを 3 本持つ（どちらも map の図で描かれる）
      - name: Mock
        description: 『mermaidの図を描く』の正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as mermaid の図
        U->>D: ページを開く
        D-->>U: xychart-beta を全体が収まる倍率で表示
        U->>D: xychart-beta の右上のパネルを開いて拡大のボタンを押し、棒の外の余白を押したまま動かす
        D-->>U: 倍率を上げ、動かした位置で表示
        U->>D: xychart-beta の x 軸のラベル・flowchart のノードの文字と線のラベル・sequenceDiagram のメッセージの文字の上で、それぞれ押したまま動かしてコピーする
        D-->>U: 図を動かさず、文字を選ぶ
        U->>D: xychart-beta の右下のリサイズハンドルを下へドラッグする
        D-->>U: 表示する枠を高くして表示
        U->>D: xychart-beta のパネルの全画面のボタンを押す
        D-->>U: 全画面で表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
      ```

      <!-- /map -->
    expected:
      - 開いたとき、xychart-beta の全体が表示する枠の中に収まっている
      - 拡大のボタンで倍率が上がり、棒の外の余白のドラッグで図が動き、ドラッグ中は文字が選ばれない
      - xychart-beta の x 軸のラベル・flowchart のノードの文字と線のラベル・sequenceDiagram のメッセージの文字の上では、それぞれカーソルが I の構造で、ドラッグした範囲の文字が選ばれ、図は動かない。コピーした文字が、それぞれ記載した文字と一致する
      - リサイズハンドルのドラッグで、表示する枠の高さが変わる
      - 全画面のボタンで xychart-beta が全画面で表示される
      - '`0` で開いたときの倍率と位置に戻る'
      - xychart-beta の右上のパネルが、畳んだときは倍率の表示と開くボタン、開いたときは縮小・倍率の表示・拡大・全画面・開くボタンの並びで、パネルのボタンとリサイズハンドルがそれぞれスクリーンリーダー向けの名前を持つ
      - 拡大しても線と文字が SVG のまま描かれ、ぼやけない
    test: test_normal_when_mermaid
  - name: 正常シナリオ（リサイズハンドルで高さを変える）
    setup:
      - name: 縦に長い図を描いたページ
        description: 幅が表示する枠に収まり、等倍の高さが `--mdmark-diagram-max-height` を超える縦に長い map の構成図を描いたページ
        notes: 開いたとき、表示する枠の高さが `--mdmark-diagram-max-height` で切られる。下へドラッグして高くできる状態を決定的に発生させる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as ページ
        U->>D: 下端のリサイズハンドルを下へドラッグする
        D-->>U: 倍率を変えずに表示する枠を高くする
        U->>D: リサイズハンドルにフォーカスして ↑ を押す
        D-->>U: 表示する枠を低くする
        U->>P: ページを再読み込みする
        P-->>U: 変えた高さの表示する枠で図を描く
        U->>D: リサイズハンドルをダブルクリックする
        D-->>U: 倍率を変えずに、図の全体が収まる高さに合わせる
        U->>D: 右上のパネルを開いて全画面のボタンを押す
        D-->>U: リサイズハンドルの無い全画面
      ```

      <!-- /map -->
    expected:
      - 表示する枠の下端に、枠線と面を持たない高さ 24 CSS px 以上の帯のリサイズハンドルがあり、中央に横棒がある。帯のどこでもドラッグできる。横のスクロールバーと重ならず、スクリーンリーダー向けの名前を持ち、キーボードでフォーカスできる
      - 下へドラッグした分だけ表示する枠が高くなり、幅は変わらない
      - 図の高さ（図の高さ × 今の倍率）を越えても、ドラッグした分だけ高くでき、倍率は変わらない
      - ↑ で表示する枠が低くなり、↓ で高くなる
      - 再読み込みした後も、変えた高さで表示する枠が描かれる
      - ダブルクリックで、倍率を変えずに図の全体が収まる高さ（図の高さ × 今の倍率）に合い、再読み込みしても合わせた高さのまま
      - 全画面で開いた図にはリサイズハンドルが無い
    test: test_normal_when_resized
  - name: 正常シナリオ（グラフの項目の上で動かす）
    setup:
      - name: 拡大したグラフ
        description: 『図を描く』の正常シナリオの折れ線のグラフを、拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as グラフ
        U->>D: 点にポインターを乗せる
        D-->>U: 点のツールチップ
        U->>D: 点の上で押し、わずかに動かして離す
        D-->>U: 図を動かさず、ツールチップを出したままにする
        U->>D: 点の上で押したまま大きく動かす
        D-->>U: 図を動かし、ツールチップを削除する
      ```

      <!-- /map -->
    expected:
      - 点の上で押し、動かした距離が小さいまま離すと、図は動かず、点のツールチップが出たまま
      - 点の上で押したまま大きく動かすと、動かした分だけ図が動き、ツールチップは消える
    test: test_normal_when_drag_on_chart_item
  - name: 正常シナリオ（スマホの指で動かす）
    setup:
      - name: 図を描いたページ
        description: 図の枠に描く図を 1 つずつ並べ、どの図も拡大のボタンで 2 回拡大したページ。並べるのは、『Mermaidと補足で図を描く』の正常シナリオの map の構成図とシーケンス図、『図を描く』の正常シナリオのグラフ、正常シナリオ（mermaid の図）の xychart-beta、『チャートを描く』の正常シナリオの埋め込んだ HTML の中の棒のチャート。最後の図の下にも段落が続き、文書が縦にスクロールできる
        notes: 画面の幅は 390px。タッチの操作で開く。フローの操作を図ごとに行う。ドラッグを始める位置とタップする位置は図の余白（ノード・線・項目の無いところ）。端を越える操作では、図の下端に届く距離より長く指を動かす
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 拡大した図の上を指 1 本で縦と横にドラッグする
        D-->>U: 図を動かしただけ動かす
        U->>D: 指を離さずに、図の下端を越えるまで上へドラッグを続ける
        D->>P: 図の端を越えた分のスクロールを指定する
        P-->>U: 文書が縦にスクロールする
        U->>D: 図の余白を指でタップする
        D-->>U: 倍率と位置を変えずに表示する
        U->>D: 倍率の表示を押して開いたときの倍率に戻し、図の上を指で縦にドラッグする
        D->>P: 図を動かさずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
        U->>D: 開いたときの倍率のまま、図の上を指で横にドラッグする
        D-->>U: 枠に収まらない分だけ図を横に動かす
      ```

      <!-- /map -->
    expected:
      - 開いたときの倍率より拡大した図の上の指 1 本のドラッグで、余白を先にタップしなくても図が縦にも横にも動き、図の端に達するまでは文書はスクロールしない
      - 指を離さずに図の端を越えて続けたドラッグでは、端を越えた分だけ文書がスクロールする
      - 図をタップしても、図の倍率と位置は変わらない
      - 開いたときの倍率以下で、表示する枠に縦に収まっている図の上の縦のドラッグでは、文書がスクロールし、図は縦に動かない
      - 開いたときの倍率以下の図の上の横のドラッグでは、枠に収まらない分だけ図が横に動き、枠に収まっている図は横に動かない
      - setup で並べた全ての図で、上の結果が同じになる
    test: test_normal_when_touch_drag
  - name: 正常シナリオ（スマホのピンチで拡大・縮小する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオ（スマホの指で動かす）と同じ図を並べたページ。どの図も開いたときの倍率のまま
        notes: 画面の幅は 390px。タッチの操作で開く。フローの操作を図ごとに行う。ピンチは図の余白に 2 本の指を配置して始める
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 図の上で 2 本の指の間を広げる
        D-->>U: 2 本の指の中点を保って倍率を上げて表示
        U->>D: 2 本の指の間を狭める
        D-->>U: 倍率を下げて表示
        U->>D: 倍率の表示が 25% になった後も、さらに 2 本の指の間を狭める
        D-->>U: 25% より縮めずに表示
        U->>P: 図の外の段落の上で 2 本の指の間を広げる
        P-->>U: ブラウザがページ全体を拡大する
      ```

      <!-- /map -->
    expected:
      - 図の上で広げると図の倍率が上がり、ブラウザはページ全体を拡大しない
      - 倍率を変えても、2 本の指の中点の下にあった図の場所が中点の下に残る
      - 狭めると倍率が下がり、倍率の表示で 25% より下へは縮まず、500% より上へは拡大しない（ボタンと同じ範囲）
      - パネルの倍率の表示が、ピンチで変えた倍率に合う
      - setup で並べた全ての図で、上の結果が同じになる
      - 図の外の段落の上のピンチでは、ブラウザがページ全体を拡大する
    test: test_normal_when_pinch
  - name: 正常シナリオ（全画面で map の図を操作する）
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオの map の構成図と、正常シナリオ（ER 図）の ER 図を描いたページ
        notes: 構成図は入れ子のグループを持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 右上のパネルを開いて全画面のボタンを押す
        D-->>U: 全画面で表示
        U->>D: 線にポインターを重ねる
        D-->>U: ほかのノードと線を薄くし、その線にデータの印を流す
        U->>D: ノードを押す
        D-->>U: そのノードとそのノードの線のほかを薄くし、その線にデータの印を流す
        U->>D: グループの開閉のボタンを押し、ノードをドラッグする
        D-->>U: グループを閉じ、ノードを動かす
        U->>D: Esc を 2 回押す
        D-->>U: 1 回目で選択を解き、2 回目で全画面を閉じる
      ```

      <!-- /map -->
    expected:
      - 全画面で開いた構成図でも、線にポインターを重ねると、通常の表示と同じくほかのノード・線・ラベルが薄くなり、重ねている間はその線の上をデータの印が流れる（離すと消える）
      - 全画面でノードを押すと、通常の表示と同じくそのノードとつながる線のほかが薄くなり、その線の上をデータの印が流れ続ける
      - 全画面でも、グループの開閉・中へ入る・ノードと線の区間のドラッグ・グループの大きさの変更・案内と再生の帯が、通常の表示と同じに動く。押しても動かないボタンは無い
      - 全画面の Esc は、開いているツールチップを閉じる・選択を解く・中へ入ったグループから外へ戻る、の順に 1 回に 1 つだけ行い、どれも無いときに全画面を閉じる
      - 全画面で開いた ER 図でも、関連の線のデータの印が通常の表示と同じ向きに流れる
      - 全画面で変えた開閉・配置・グループの大きさは、全画面を閉じた後の元の図にも反映される。選択と中へ入った状態は元の図に反映しない。閉じた後も、元の図の操作は全画面を開く前と同じに動く
    test: test_normal_when_map_fullscreen
  - name: 正常シナリオ（スマホの指で縦に長い図を動かす）
    setup:
      - name: 縦に長い図を描いたページ
        description: 正常シナリオ（リサイズハンドルで高さを変える）と同じ縦に長い map の構成図を描き、図の下にも段落が続いて文書が縦にスクロールできるページ
        notes: 画面の幅は 390px。タッチの操作で開き、倍率は開いたときのまま。表示する枠の高さが `--mdmark-diagram-max-height` で切られ、図が枠に縦に収まらない。ドラッグを始める位置は図の余白
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 図の上を指 1 本で上へドラッグする
        D-->>U: 図を縦に動かして、枠の下に隠れていた部分を出す
        U->>D: 指を離さずに、図の下端を越えるまで上へドラッグを続ける
        D->>P: 図の端を越えた分のスクロールを指定する
        P-->>U: 文書が縦にスクロールする
      ```

      <!-- /map -->
    expected:
      - 開いたときの倍率のままでも、枠に縦に収まらない図の上の縦のドラッグで、図が縦に動き、図の端に達するまでは文書はスクロールしない
      - 指を離さずに図の端を越えて続けたドラッグでは、端を越えた分だけ文書がスクロールする
      - 倍率の表示は、ドラッグの前と変わらない
    test: test_normal_when_touch_drag_tall_diagram
lead: 読者が、図の右上に重ねたパネルを開いて拡大・縮小・全画面のボタンを押し、キー・ピンチでも図を拡大・縮小し、ドラッグ（スマホの指を含む）・矢印キーで動かし、右下のリサイズハンドルで表示する枠の高さを変える。文字の上では文字を選べ、ホイールは文書のスクロールに使用する。map の図・グラフ・mermaid の図と、埋め込んだ HTML の中のチャートの共通の操作。倍率は開いたときの倍率を 100% として 25%〜500% の範囲で変わり、図を動かす矢印のボタンは持たない。
primary_actor: 読者
trigger: 読者が、図の全体と細部を見比べたくなる
preconditions:
  - 文書に図が描かれている（『図を描く』）
success_guarantee: ボタン・キー・ドラッグ（スマホの指を含む）・ピンチのどれでも図の倍率と位置が変わり、文書のスクロールと文字の選択は妨げられない。グラフの項目の上でも、動かした距離が小さいうちはツールチップを優先する。リサイズハンドルで変えた高さは同じタブの中で再読み込みしても保ち、ダブルクリックで倍率を変えずに図の全体が収まる高さに合う。
minimal_guarantee: 倍率は下限と上限を超えない。`0` でいつでも開いたときの倍率と位置に戻れる。
test_file: tests/e2e/単一ユースケース/図を拡大・縮小・移動する.spec.ts
tags:
  - name: topic:図
    main: true
  - name: action:拡大
