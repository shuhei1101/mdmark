id: SC-472-42
visibility: internal
title: 図を拡大・縮小・移動する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『図を描く』の正常シナリオのフロー図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: 右上の縮小のボタンを押す
        D-->>U: 倍率を下げて表示
        U->>D: 図にフォーカスして + を押す
        D-->>U: 倍率を上げて表示
        U->>D: - を押す
        D-->>U: 倍率を下げて表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
        U->>D: 拡大のボタンを押してから、右上の倍率の表示を押す
        D-->>U: 開いたときの倍率と位置に戻す
    expected:
      - 開いたとき、図の全体が表示する枠の中に収まっている
      - 拡大のボタンと `+` で倍率が上がり、縮小のボタンと `-` で倍率が下がる
      - '`0` と、右上の倍率の表示を押すことで、開いたときの倍率と位置に戻る'
      - 拡大・縮小のボタンと倍率の表示のボタンが図の右上にあり、それぞれスクリーンリーダー向けの名前を持つ。戻すための別のボタンは無い
    test: test_normal
  - name: 正常シナリオ（ホイール）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ。図の下にも段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 図の上でホイールを回す
        D->>P: 倍率を変えずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
        U->>D: Shift を押しながらホイールを回す
        D-->>U: 図を横に動かす
    expected:
      - 図の上のホイールで図の倍率が変わらず、文書が縦にスクロールする
      - Shift とホイールで、図が横に動く
    test: test_normal_when_wheel
  - name: 正常シナリオ（ドラッグと文字の選択）
    setup:
      - name: 拡大した図
        description: 正常シナリオの図を拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ノードの外の余白を押したまま動かす
        D-->>U: 図を動かしただけ動かし、文字を選ばない
        U->>D: ノードの文字の上で押したまま動かす
        D-->>U: 図を動かさず、文字を選ぶ
    expected:
      - 余白の上ではカーソルが動かせる構造で、ドラッグした分だけ図が動く
      - ドラッグ中は文字が選ばれない
      - 文字の上ではカーソルが I の構造で、ドラッグした範囲の文字が選ばれ、図は動かない（リンク先を持つノードの文字を除く）
    test: test_normal_when_drag
  - name: 正常シナリオ（矢印キーとボタンで動かす）
    setup:
      - name: 拡大した図
        description: 正常シナリオ（ドラッグと文字の選択）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 図にフォーカスして→を押す
        D-->>U: 図を左へずらして右側を見せる
        U->>D: 移動のボタン（↓）を押す
        D-->>U: 図を上へずらして下側を見せる
    expected:
      - 矢印キーで、押した向きの先が見えるように図が動く
      - 移動のボタンでも同じだけ図が動き、ボタンはスクリーンリーダー向けの名前を持つ
      - キーボードだけで図へフォーカスでき、フォーカスの枠が見える
    test: test_normal_when_keyboard
  - name: 正常シナリオ（埋め込んだ HTML の中のチャート）
    setup:
      - name: チャートを描いたページ
        description: 『チャートを描く』の正常シナリオの棒のチャートを、同じ HTML の中の段落と一緒に描いたページ。チャートの下にも文書の段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as チャート
        participant P as 文書
        U->>D: 右上の拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: チャートにフォーカスして - と 0 を押す
        D-->>U: 倍率を下げ、全体が収まる倍率に戻す
        U->>D: 拡大してからドラッグする
        D-->>U: チャートを動かして表示
        U->>D: チャートの上でホイールを回す
        D->>P: 倍率を変えずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
    expected:
      - 拡大のボタンで倍率が上がり、`-` で下がり、`0` で開いたときの倍率と位置に戻る
      - 拡大した後のドラッグでチャートの位置が動く
      - ホイールでは倍率が変わらず、文書がスクロールする
      - 拡大してもチャートの線と文字が SVG のまま描かれ、ぼやけない
      - 同じ HTML の中の段落には、拡大・縮小のボタンが無い
    test: test_normal_when_embedded_chart
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描いたページ
        description: 『図を描く』の正常シナリオ（ER 図）の ER 図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押し、図をドラッグする
        D-->>U: 倍率を上げ、動かした位置で表示
        U->>D: 右上の全画面のボタンを押す
        D-->>U: 全画面で表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
    expected:
      - 開いたとき、ER 図の全体が表示する枠の中に収まっている
      - 拡大のボタンで倍率が上がり、ドラッグで図が動く
      - 全画面のボタンで ER 図が全画面で表示される
      - '`0` で開いたときの倍率と位置に戻る'
      - 右上のボタンが、フロー図と同じ並びとスクリーンリーダー向けの名前を持つ
    test: test_normal_when_er_diagram
  - name: 正常シナリオ（mermaid の図）
    setup:
      - name: 図を描いたページ
        description: 『mermaidの図を描く』の正常シナリオの flowchart を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: 『mermaidの図を描く』の正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as mermaid の図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押し、図をドラッグする
        D-->>U: 倍率を上げ、動かした位置で表示
        U->>D: 右下のリサイズハンドルを下へドラッグする
        D-->>U: 表示する枠を高くして表示
        U->>D: 右上の全画面のボタンを押す
        D-->>U: 全画面で表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
    expected:
      - 開いたとき、mermaid の図の全体が表示する枠の中に収まっている
      - 拡大のボタンで倍率が上がり、ドラッグで図が動く
      - リサイズハンドルのドラッグで、表示する枠の高さが変わる
      - 全画面のボタンで mermaid の図が全画面で表示される
      - '`0` で開いたときの倍率と位置に戻る'
      - 右上のボタンとリサイズハンドルが、フロー図と同じ並びとスクリーンリーダー向けの名前を持つ
      - 拡大しても線と文字が SVG のまま描かれ、ぼやけない
    test: test_normal_when_mermaid
  - name: 正常シナリオ（列の多いテーブルを畳む）
    setup:
      - name: 図を描いたページ
        description: 主キー 1 つ・外部キー 1 つと、ほかの列 10 個を持つテーブルを含む ER 図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全ての列を出したテーブル
        U->>D: テーブルの列の開閉のボタンを押す
        D-->>U: 主キーと外部キーの列だけを出したテーブル
        U->>D: キーボードで同じボタンにフォーカスして Enter を押す
        D-->>U: 全ての列を出したテーブル
    expected:
      - 開いたとき、テーブルに 12 個の列が全て出ている
      - 開閉のボタンを押した後、主キーと外部キーの 2 つの列だけが出て、畳んだ列があることがテーブルに示されている
      - 開閉のボタンの `aria-expanded` が、列を全て出しているときは `true`、畳んでいるときは `false`
      - 開閉のボタンはキーボードで操作でき、関係の線はテーブルの高さの変化に合わせてもう一度結ばれる
    test: test_normal_when_er_columns_folded
  - name: 正常シナリオ（リンク先を持つノードの上のドラッグ）
    setup:
      - name: 拡大した図
        description: 『図を描く』の正常シナリオ（リンク先を持つノード）の図を、拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ。リンク先への遷移を手元の応答で受け、開いた URL を記録する
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: リンク先を持つノードの名前の文字の上で押したまま動かす
        D-->>U: 図を動かした分だけ動かし、離してもリンク先を開かない
        U->>D: 同じノードを動かさずに押して離す
        D-->>U: ノードのリンク先を開く
    expected:
      - リンク先を持つノードの名前の文字の上から始めたドラッグで、文字が選ばれず、動かした分だけ図が動く
      - ドラッグの後に離しても、リンク先が開かない
      - 動かさずに押して離すと、リンク先が開く。リンク先を持つノードの上では、名前の文字の上も含めてカーソルが押せる構造で、I の構造にならない
    test: test_normal_when_drag_on_linked_node
  - name: 正常シナリオ（グループのタイトルを留める）
    setup:
      - name: 拡大した図
        description: 『図を描く』の正常シナリオのフロー図（システムの枠と 3 層）を、拡大のボタンで 2 回拡大した状態
        notes: 定義は `stickyTitles` を記載しない（既定のオン）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 図を上へドラッグして、処理の層の途中を見せる
        D-->>U: システムの枠と処理の層のタイトルを表示する枠の上端に留める
        U->>D: 処理の層が表示する枠の上へ出るまで動かす
        D-->>U: 処理の層のタイトルを留めず、データの層のタイトルを留める
    expected:
      - 処理の層の途中を見せたとき、システムの枠のタイトルと処理の層のタイトルが、表示する枠の上端に見えている
      - 処理の層が表示する枠の上へ出た後、処理の層のタイトルは留まらず、データの層のタイトルが上端に見えている
      - 留めたタイトルは不透明な背景を持ち、タイトルの真ん中の位置で `elementFromPoint` がタイトルの要素を返却する（下のノードと線より前に描かれる）
      - 留めたタイトルの `hint` のマーカーにポインターを乗せると、ツールチップが出る
    test: test_normal_when_group_titles_stuck
  - name: 正常シナリオ（グループのタイトルを留めない）
    setup:
      - name: 拡大した図
        description: '正常シナリオ（グループのタイトルを留める）と同じ図で、定義に `stickyTitles: false` を記載したもの'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        U->>D: 図を上へドラッグして、処理の層の途中を見せる
        D-->>U: タイトルも図と一緒に動かす
    expected:
      - システムの枠と処理の層のタイトルが、図と同じだけ動いて表示する枠の上へ隠れる
    test: test_normal_when_sticky_titles_off
  - name: 正常シナリオ（リサイズハンドルで高さを変える）
    setup:
      - name: 縦に長い図を描いたページ
        description: 幅が表示する枠に収まり、全体が収まる高さが `--mdmark-diagram-max-height` を超える縦に長いフロー図を描いたページ
        notes: 開いたとき、表示する枠の高さが `--mdmark-diagram-max-height` で切られ、図の全体が収まる倍率はその高さで決まる。下へドラッグして高くできる状態を決定的に発生させる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as ページ
        U->>D: 下端のリサイズハンドルを下へドラッグする
        D-->>U: 表示する枠を高くし、全体が収まる倍率をもう一度計算する
        U->>D: リサイズハンドルにフォーカスして ↑ を押す
        D-->>U: 表示する枠を低くする
        U->>P: ページを再読み込みする
        P-->>U: 変えた高さの表示する枠で図を描く
        U->>D: リサイズハンドルをダブルクリックする
        D-->>U: 倍率を変えずに、図の全体が収まる高さに合わせる
        U->>D: 右上の全画面のボタンを押す
        D-->>U: リサイズハンドルの無い全画面
    expected:
      - 表示する枠の下端に、枠線と面を持たない帯のリサイズハンドルがあり、右端に横の 2 本線のアイコンがある。横のスクロールバーと重ならず、スクリーンリーダー向けの名前を持ち、キーボードでフォーカスできる
      - 下へドラッグした分だけ表示する枠が高くなり、幅は変わらない
      - 図の全体が収まる高さ（定義の高さ × 今の倍率）を越えても、ドラッグした分だけ高くできる
      - 高くした後に `0` を押すと、変えた高さで図の全体が収まる倍率になる
      - ↑ で表示する枠が低くなり、↓ で高くなる
      - 再読み込みした後も、変えた高さで表示する枠が描かれる
      - ダブルクリックで、倍率を変えずに図の全体が収まる高さ（定義の高さ × 今の倍率）に合い、再読み込みしても合わせた高さのまま
      - 全画面で開いた図にはリサイズハンドルが無い
    test: test_normal_when_resized
  - name: 正常シナリオ（グラフの項目の上で動かす）
    setup:
      - name: 拡大したグラフ
        description: 『図を描く』の正常シナリオ（グラフ）の折れ線のグラフを、拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as グラフ
        U->>D: 点にポインターを乗せる
        D-->>U: 点のツールチップ
        U->>D: 点の上で押し、わずかに動かして離す
        D-->>U: 図を動かさず、ツールチップを出したままにする
        U->>D: 点の上で押したまま大きく動かす
        D-->>U: 図を動かし、ツールチップを削除する
    expected:
      - 点の上で押し、動かした距離が小さいまま離すと、図は動かず、点のツールチップが出たまま
      - 点の上で押したまま大きく動かすと、動かした分だけ図が動き、ツールチップは消える
    test: test_normal_when_drag_on_chart_item
  - name: 正常シナリオ（スマホの指で動かす）
    setup:
      - name: 図を描いたページ
        description: 図の枠に描く図を 1 つずつ並べ、どの図も拡大のボタンで 2 回拡大したページ。並べるのは、『Mermaidと補足で図を描く』の正常シナリオの map の構成図とシーケンス図、『図を描く』の正常シナリオのフロー図・シーケンス図・グラフ・ER 図、『mermaidの図を描く』の正常シナリオの flowchart、『チャートを描く』の正常シナリオの埋め込んだ HTML の中の棒のチャート。最後の図の下にも段落が続き、文書が縦にスクロールできる
        notes: 画面の幅は 390px。タッチの操作で開く。フローの操作を図ごとに行う。タップするのは図の余白（ノード・線・項目の無いところ）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 図
        participant P as 文書
        U->>D: 図に触れていない状態で、図の上を指で縦にドラッグする
        D->>P: 図を動かさずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
        U->>D: 図に触れていない状態で、図の上を指で横にドラッグする
        D-->>U: 図を横に動かしただけ動かす
        U->>D: 図の余白を指でタップする
        D-->>U: 図を操作中の表示にする
        U->>D: 図の上を指で縦と横にドラッグする
        D-->>U: 図を動かしただけ動かす
        U->>P: 図の外の文書をタップする
        P-->>U: 図の操作中の表示を解く
        U->>D: 図の上を指で縦にドラッグする
        D->>P: 図を動かさずスクロールを指定する
        P-->>U: 文書が縦にスクロールする
    expected:
      - 図をタップする前は、図の上の縦のドラッグで文書がスクロールし、図は縦に動かない
      - 図をタップする前も、図の上の横のドラッグでは図が横に動く
      - 図をタップした後は、図の上の指のドラッグで図が縦にも横にも動き、文書はスクロールしない
      - 図を操作中かが図の枠の見た目で分かり、図の外をタップすると解ける
      - 図をタップしても、図の倍率と位置は変わらない
      - setup で並べた全ての図で、上の結果が同じになる
    test: test_normal_when_touch_drag
