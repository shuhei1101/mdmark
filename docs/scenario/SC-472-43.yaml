id: SC-472-43
visibility: internal
title: 図を描く
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描くページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、文書を描く HTML
      - name: グラフの定義を持つ Markdown
        description: 系列 2 つ・点 5 つずつの折れ線のグラフの部品の定義の文書
        notes: 動くと `window.__mdmarkScriptRan` を `true` にする `<script>` を文書に 1 つ持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M->>M: グラフの部品が系列を描く
        M-->>P: タイトルと凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 2 つの系列が、色と線の模様の組で分かれて描かれている
      - 題名と、系列の名前を記載した凡例がある
      - '`window.__mdmarkScriptRan` が `true` になっていない（文書に記載した `<script>` が動いていない）'
      - 色分けのライブラリへの要求が 0 件（図の部品の定義の `json` のコードブロックは色分けの対象にならない）
    test: test_normal
  - name: 異常シナリオ（定義を読み込めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読み込めない定義を持つ Markdown
        description: JSON として読み込めないグラフの定義 1 つと、正しいグラフの定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M-->>P: 読み込めない定義の場所に記載の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読み込めない定義の場所に記載の警告があり、読み込めない箇所が記載されている
      - 正しい定義のグラフが描かれている
      - 段落が描かれている
    test: test_error_when_definition_invalid
  - name: 正常シナリオ（棒のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 棒のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が棒・系列 2 つ・項目 4 つで、縦の軸の範囲を記載しない定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: データから縦の軸の目盛りを切り、棒を描く
        M-->>P: タイトルと凡例つきの棒のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 系列 2 つを色と模様の組で分けた棒が、項目 4 つ分描かれている
      - 縦の軸の目盛りが、データの最小と最大を含む 1・2・5×10 のべき乗の刻みで切られている
      - 題名と、系列の名前を記載した凡例がある
      - グラフは `role="img"` と、題名と系列の値を記載したスクリーンリーダー向けの名前を持つ
    test: test_normal_when_bar
  - name: 正常シナリオ（円のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 円のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が円で項目 3 つの定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 項目の値の割合で扇形を描く
        M-->>P: タイトルと凡例つきの円のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 項目 3 つの扇形が、値の割合の角度で、色と模様の組で分けて描かれている
      - 凡例に項目の名前が並ぶ
    test: test_normal_when_pie
  - name: 正常シナリオ（散布図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 散布図の定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が散布図で系列 1 つ・点 6 つ（横と縦がどちらも数値）の定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 横と縦の両方の軸の目盛りを切り、点を配置する
        M-->>P: タイトルと凡例つきの散布図と本文
        P-->>U: 文書を表示
    expected:
      - 点 6 つが、横と縦の値の位置に系列の点のマーカーで配置されている
      - 横と縦の両方の軸に、数値の目盛りがある
    test: test_normal_when_scatter
  - name: 正常シナリオ（追加したグラフの種類）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 追加した種類のグラフの定義を持つ Markdown
        description: 面・積み上げの棒・積み上げの面・横棒・ドーナツ・レーダー・バブル・折れ線と棒の組み合わせの 8 つのグラフの部品の定義を、系列 2 つずつで記載した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: グラフの部品が種類ごとに系列を描く
        M-->>P: タイトルと凡例つきの 8 つのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 8 つの定義の場所に、それぞれの種類のグラフが図の枠に載って描かれている
      - 積み上げの棒と面は、同じ項目の系列の値を積み上げた高さで描かれている
      - 折れ線と棒の組み合わせは、系列ごとに指定した折れ線と棒で同じ軸に描かれている
      - 各グラフにタイトルと、系列の名前を記載した凡例がある
      - 記載の警告が無い
    test: test_normal_when_more_chart_types
  - name: 正常シナリオ（5 つ以上の系列）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 系列の多いグラフの定義を持つ Markdown
        description: 系列 6 つ・点 5 つずつの折れ線のグラフと、系列 6 つの棒のグラフの部品の定義を記載した文書
      - name: Mock
        description: 正常シナリオと同じ。ライトとダークの両方の配色で描く
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 系列ごとに色・点のマーカー・塗りの模様の組を適用する
        M-->>P: タイトルと凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 6 つの系列が全て描かれ、凡例に 6 つの系列の名前がある
      - 6 つの系列の色・点のマーカー・塗りの模様の組が互いに異なる
      - ライトとダークのどちらの配色でも、系列の色が背景と見分けられる
    test: test_normal_when_many_series
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: ER 図の定義を持つ Markdown
        description: テーブル 3 つ（物理名と論理名）と、主キー・外部キー・NOT NULL の列を持つ列の一覧、1 対多の関係 2 本（ラベルつき）を記載した ER 図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ER 図の部品がテーブルと関係を配置する
        M-->>P: タイトルと凡例つきの ER 図と本文
        P-->>U: 文書を表示
    expected:
      - 3 つのテーブルが、物理名と論理名を持つノードとして描かれている
      - 各テーブルに列の名前と型が並び、主キー・外部キー・NOT NULL の列にそれぞれのマーカーがある
      - 2 本の関係が、元と先のテーブルを結ぶ線と、両端の多重度のマーカーとラベルで描かれている
      - ER 図が図の枠に載り、タイトルとマーカーの意味の凡例がある
    test: test_normal_when_er_diagram
  - name: 異常シナリオ（ER 図の定義を読み込めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読み込めない ER 図の定義を持つ Markdown
        description: 定義に無いテーブルを関係の先に指定した ER 図の定義 1 つと、正しい ER 図の定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ER 図の定義を読み込んで構造を確認する
        M-->>P: 読み込めない定義の場所に記載の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読み込めない定義の場所に記載の警告があり、関係の先のテーブルが定義に無いことが記載されている
      - 正しい定義の ER 図が描かれている
      - 段落が描かれている
    test: test_error_when_er_definition_invalid
  - name: 正常シナリオ（座標で書いた図の範囲）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 座標で書いた図を持つ Markdown
        description: '`<!-- flow -->` の範囲 1 つと `<!-- sequence -->` の範囲 1 つに、廃止の前のバージョンで描けた部品の定義を記載し、その間と後に段落とグラフの定義 1 つを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: flow・sequence の範囲を図として読まずに、廃止した記載方法として扱う
        M-->>P: 範囲ごとに、map へ変換できる旨の書き方の警告と、本文とグラフ
        P-->>U: 警告と本文とグラフを表示
    expected:
      - '`flow`・`sequence` の範囲ごとに書き方の警告が 1 つずつ出て、図は描かれない'
      - 警告に、その記載方法を廃止したことと、`mdmark upgrade` で map の範囲へ変換できることが記載されている
      - 範囲の中の部品の定義（JSON）は、コードブロックとしても本文としても出ない
      - 段落とグラフは描かれている
    test: test_normal_when_retired_diagram
lead: 文書の作成者が、文書に部品の定義（JSON）だけを記載し、mdmark の共通の図の部品にグラフ・ER 図を描かせる。廃止した `flow`・`sequence` の範囲は描かずに、map へ変換できる旨の書き方の警告を出す。
issue: 21
primary_actor: 文書の作成者（AI を含む）
stakeholders:
  - name: 文書の作成者
    interest: HTML と CSS を一から記載せずに、部品の定義だけで外観のそろった図を描ける
  - name: 読者
    interest: どの文書の図も同じ決まりで描かれ、凡例で色・構造・線の意味を読み込める。廃止した記載方法の図は、警告で変換の方法が分かる
trigger: 利用側のページが、図の部品の定義を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: 部品の定義の場所に、決まりのとおりの図が描かれる。文書に記載したスクリプトは動かない。
minimal_guarantee: 定義を読み込めない図と、廃止した `flow`・`sequence` の範囲の場所には記載の警告が出て、ほかの本文と図は描かれる。
test_file: tests/e2e/単一ユースケース/図を描く.spec.ts
