id: SC-472-73
visibility: internal
title: 表を操作する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 並べ替えの表を持つ Markdown
        description: '`<!-- table: {"kind": "data"} -->` 〜 `<!-- /table -->` で、数値の列を持つ 3 行の表を囲んだ文書'
        notes: 数値の列の値は上から `10`・`2`・`33`
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: data の種類の機能を付けた表を描く
        U->>P: 数値の列の見出しの並べ替えを押す
        P-->>U: 降順に並べ替えた表
        U->>P: もう一度押す
        P-->>U: 昇順に並べ替えた表
        U->>P: もう一度押す
        P-->>U: 元の並びに戻した表
    expected:
      - 1 回押した後、数値の列が上から `33`・`10`・`2` の順（数値として比べる）で、見出しの `aria-sort` が `descending`
      - 2 回押した後、数値の列が上から `2`・`10`・`33` の順で、見出しの `aria-sort` が `ascending`
      - 3 回押した後、数値の列が上から `10`・`2`・`33`（元の並び）で、見出しが `aria-sort` を持たない
      - 表の前後にマーカーの文字が出ていない
      - 件数・テーブル設定・コピーのボタン、集計の行、行へのリンクが無い（この 5 つは `+機能` を記載した表にだけ付く）
    test: test_normal
  - name: 正常シナリオ（列の値を選んで絞り込む）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 値で絞り込む列を持つ Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"名前": {"filter": {}}}} -->` 〜 `<!-- /table -->` で、名前の列に `りんご`・`みかん`・`りんご飴` を持つ表を囲んだ文書'
        notes: '`filter` に `type` を記載しない列は、値を選んで絞り込む（`select`）'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 名前の列の見出しに絞り込みのボタンを持つ表を描く
        U->>P: 名前の列の絞り込みのボタンを押す
        P-->>U: 列の値をチェックボックスで並べたドロワー
        U->>P: 候補の検索欄に「りんご」を入れる
        P-->>U: 「りんご」を含む候補だけのドロワー
        U->>P: 「りんご」のチェックボックスを選ぶ
        P-->>U: 選んだ値の行だけの表
    expected:
      - 絞り込みのボタンは名前の列の見出しにだけあり、ほかの列の見出しには無い
      - ドロワーに `りんご`・`みかん`・`りんご飴` のチェックボックスが並ぶ
      - 候補の検索欄に `りんご` を入れた後、ドロワーの候補が `りんご`・`りんご飴` だけになる
      - '`りんご` を選んだ後、`りんご` の行だけが表示され、名前の列の絞り込みのボタンが絞り込み中であることを示す'
      - チェックボックスを全て削除すると 3 行とも表示される
      - ドロワーが開くと、スマホの画面幅でも候補の検索欄にフォーカスが移る
      - 「絞り込みを解除」を押すと、選択と候補の検索欄が空になり、3 行とも表示され、ボタンの絞り込み中の表示が消える
    test: test_normal_when_filtered_by_values
  - name: 正常シナリオ（文字で絞り込む）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 文字で絞り込む列を持つ Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"説明": {"filter": {"type": "text"}}}} -->` 〜 `<!-- /table -->` で、説明の列に `描画を速くする`・`印刷を修正する`・`描画の崩れを修正する` を持つ表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 説明の列の見出しに絞り込みのボタンを持つ表を描く
        U->>P: 説明の列の絞り込みのボタンを押す
        P-->>U: 文字の入力欄
        U->>P: 入力欄に「描画」を入れる
        P-->>U: 説明に「描画」を含む行だけの表
    expected:
      - 絞り込みのボタンを押すと、チェックボックスではなく文字の入力欄が出る
      - '`描画` を入れた後、`描画を速くする`・`描画の崩れを修正する` の行が表示され、`印刷を修正する` の行が表示されていない'
    test: test_normal_when_filtered_by_text
  - name: 正常シナリオ（日付で絞り込む）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 日付で絞り込む列を持つ Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"更新日": {"filter": {"type": "date"}}}} -->` 〜 `<!-- /table -->` で、更新日の列に `2026-10-01`・`2026-10-10`・`2026-10-20` を持つ表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 更新日の列の見出しに絞り込みのボタンを持つ表を描く
        U->>P: 更新日の列の絞り込みのボタンを押す
        P-->>U: 開始日と終了日の入力欄
        U->>P: 開始日に 2026-10-05、終了日に 2026-10-15 を入れる
        P-->>U: 期間に入る行だけの表
    expected:
      - 絞り込みのボタンを押すと、開始日と終了日の日付の入力欄が出る
      - 期間を入れた後、`2026-10-10` の行だけが表示されている
      - 開始日だけを入れたときは、その日以降の行が表示される
    test: test_normal_when_filtered_by_date
  - name: 正常シナリオ（ピン止めする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 描く先の要素の幅は、表が横にスクロールする幅
      - name: 列の多い表を持つ Markdown
        description: 10 列 30 行の表を持ち、表のマーカーで囲まない文書（既定の種類）
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 1 列目を留め、列の見出しにピン止めのボタンを持つ表を描く
        U->>P: 3 列目のピン止めを押す
        U->>P: 表を 4 列目が見えなくなるまで右へスクロールする
        P-->>U: 1 列目と 3 列目が左端に並んだ表
        U->>P: 8 列目と 9 列目のピン止めを押す
        U->>P: 表を左端までスクロールする
        P-->>U: 8 列目と 9 列目が右端に留まった表
        U->>P: 3 列目のピン止めをもう一度押す
        P-->>U: 3 列目だけを解除した表
    expected:
      - 表がはみ出しているため、各列の見出しにピン止めのボタンがある
      - 3 列目のピン止めを押して右へスクロールした後、1 列目と 3 列目が表の左端に重ならずに並んで見えていて、2 列目は見えていない
      - 1 列目と 3 列目のピン止めのボタンの `aria-pressed` が `true` で、2 列目は `false`
      - 8 列目と 9 列目のピン止めを押して左端までスクロールした後、8 列目と 9 列目が表の右端に重ならずに並んで見えていて、1 列目から 3 列目は元の位置に並んでいる
      - 3 列目のピン止めをもう一度押した後、3 列目の `aria-pressed` が `false` になり、1 列目・8 列目・9 列目は留まったまま
      - 並べ替えのボタンが無い（既定の種類はピン止めと列の幅の変更だけ）
    test: test_normal_when_pinned
  - name: 正常シナリオ（閉じた表）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 閉じた表を持つ Markdown
        description: '`<!-- table: {"kind": "data", "collapse": {"open": false}} -->` 〜 `<!-- /table -->` で 3 行の表を囲み、続けて `<!-- table: {"kind": "data", "collapse": {"open": true, "title": "リリースの一覧"}} -->` 〜 `<!-- /table -->` で 2 行の表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 1 つ目の表を閉じた折りたたみ、2 つ目の表を開いた折りたたみに入れて描く
        U->>P: 1 つ目の折りたたみの見出しを押す
        P-->>U: 開いた表
    expected:
      - 描いた直後、1 つ目の表が閉じた折りたたみの中にあり、表の行が表示されていない
      - 1 つ目の折りたたみの見出しが「表（3 行）」で、2 つ目の折りたたみの見出しが `collapse.title` の「リリースの一覧」
      - 2 つ目の表は描いた直後から 2 行が表示されている
      - 1 つ目の見出しを押した後、表の 3 行が表示されている
    test: test_normal_when_closed
  - name: 正常シナリオ（機能を解除する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 機能を解除した表を持つ Markdown
        description: '`<!-- table: {"kind": "data", "features": {"sort": {"enabled": false}}} -->` 〜 `<!-- /table -->` で表を囲んだ文書'
        notes: 表は 10 列 30 行で、描く先の要素からはみ出す大きさ（ピン止めのボタンは、はみ出す表にだけ出る）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 並べ替えを削除した表を描く
        P-->>U: 表を表示
    expected:
      - 表の見出しに並べ替えのボタンが無い
      - 表の見出しにピン止めのボタンがある
    test: test_normal_when_feature_removed
  - name: 異常シナリオ（知らない種類）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない種類を記載した Markdown
        description: '`<!-- table: {"kind": "unknown", "features": {"sort": {}}} -->` 〜 `<!-- /table -->` で表を囲み、表の後に段落を持つ文書'
        notes: 表は 10 列 30 行で、描く先の要素からはみ出す大きさ（ピン止めのボタンは、はみ出す表にだけ出る）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: kind の値が選べる値に無いため kind を適用せず、既定の種類にする
        M-->>P: 記載の警告と、既定の種類に features の sort を適用した表を描く
        P-->>U: 記載の警告と表を表示
    expected:
      - 表の上に、`kind` の `unknown` が選べる値に無いことと、選べる値（`data`・`plain`）を記載した記載の警告がある
      - 表にピン止めと並べ替えのボタンがある
      - 表の後の段落が描かれている
    test: test_error_when_unknown_kind
  - name: 異常シナリオ（閉じのマーカーが無い）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 閉じのマーカーの無い Markdown
        description: '`<!-- table: {"kind": "data"} -->` の後に表を 2 つ持ち、`<!-- /table -->` を持たない文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: マーカーから文書の終わりまでを範囲にする
        M-->>P: 記載の警告と、2 つの表に data の機能を付けて描く
        P-->>U: 記載の警告と表を表示
    expected:
      - 範囲の始まりに、`<!-- /table -->` が無いことを記載した記載の警告がある
      - 2 つの表の両方に並べ替えのボタンがある
    test: test_error_when_range_end_missing
  - name: 正常シナリオ（知らない機能・キー）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない機能とキーを記載した Markdown
        description: '`<!-- table: {"kind": "data", "features": {"unknown": {}}, "size": 2} -->` 〜 `<!-- /table -->` で表を囲んだ文書'
        notes: 知らない機能 `features.unknown` と知らないキー `size` は、描くときは無視し、点検（`mdmark check`）が通知する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 知らない機能とキーをスキップする
        M-->>P: data の機能を付けた表を描く
        P-->>U: 表を表示
    expected:
      - 表の上に記載の警告が無い
      - 表にピン止めと並べ替えのボタンがある
    test: test_normal_when_unknown_feature_or_key
  - name: 異常シナリオ（知らない絞り込みの種類）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない絞り込みの種類を記載した Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"名前": {"filter": {"type": "range"}}, "説明": {"filter": {"type": "text"}}}} -->` 〜 `<!-- /table -->` で表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 知らない絞り込みの種類を適用しない
        M-->>P: 記載の警告と、説明の列だけに絞り込みのボタンを付けた表を描く
        P-->>U: 記載の警告と表を表示
    expected:
      - 表の上に、`columns.名前.filter.type` の `range` が選べる値に無いことと、選べる値（`select`・`text`・`date`）を記載した記載の警告がある
      - 説明の列の見出しに絞り込みのボタンがあり、名前の列の見出しには無い
    test: test_error_when_unknown_filter_kind
  - name: 正常シナリオ（件数を確認する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 件数を出す表を持つ Markdown
        description: '`<!-- table: {"kind": "data", "features": {"count": {}}, "columns": {"説明": {"filter": {"type": "text"}}}} -->` 〜 `<!-- /table -->` で、説明の列に `描画を速くする`・`印刷を修正する`・`描画の崩れを修正する` を持つ 3 行の表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 表の上に件数を出した表を描く
        U->>P: 説明の列を「描画」で絞り込む
        P-->>U: 件数を書き換えた表
    expected:
      - 描いた直後、表の上の件数が、表示している行の数 3 と全ての行の数 3 を示す
      - 「描画」で絞り込んだ後、件数が、表示している行の数 2 と全ての行の数 3 を示す
      - 件数の書き換えがスクリーンリーダーで知らされる（件数の要素が `aria-live="polite"` を持つ）
      - 「絞り込みを解除」を押すと、件数が 3 と 3 に戻る
    test: test_normal_when_counting_rows
  - name: 正常シナリオ（列を隠す・出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 列を隠した表を持つ Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"説明": {"hidden": true}}} -->` 〜 `<!-- /table -->` で、名前・説明・更新日の 3 列 3 行の表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 説明の列を隠した表を描く
        U->>P: 表の上のテーブル設定のボタンを押す
        P-->>U: 列名と目のアイコンを並べたテーブル設定のパネル
        U->>P: 説明の目のアイコンで表示し、更新日の目のアイコンで隠す
        P-->>U: 名前と説明の列を出した表
        U->>P: Esc を押す
        P-->>U: パネルを閉じた表
    expected:
      - 描いた直後、説明の列の見出しとセルが表示されておらず、名前と更新日の列が表示されている
      - テーブル設定のボタンは文字を持たないアイコンだけのボタンで、ツールチップが「テーブル設定」
      - 描いた直後、ボタンのアイコンに隠した列の数 `1` のバッジがあり、ボタンのスクリーンリーダーに「（1 列を非表示）」が含まれる
      - テーブル設定のパネルに名前・説明・更新日の目のアイコンが並び、説明だけが隠した状態になっている
      - 先頭の列（名前）の目のアイコンは押せず（`disabled`）、パネルの案内に `先頭の列は隠せません` が出ている
      - 説明を表示し、更新日を隠した後、名前と説明の列が元の位置（1 列目・2 列目）に表示され、更新日の列が表示されていない
      - 列を隠している間、テーブル設定のボタンに隠した列の数のバッジが出ている
      - Esc でパネルが閉じ、フォーカスがテーブル設定のボタンへ戻る
    test: test_normal_when_columns_toggled
  - name: 正常シナリオ（列の表示の切り替えを受け取る）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じページで、受けた引数を配列に記録する `onColumnsChange` を指定して文書を描く
      - name: 列を隠す表を 2 つ持つ Markdown
        description: '表のマーカーで囲まない表を 1 つ配置し、続けて `<!-- table: {"kind": "data", "features": {"columns": {}}} -->` で名前・説明・更新日の 3 列の表と、`<!-- table: {"kind": "data", "columns": {"備考": {"hidden": true}}} -->` で名前・備考の 2 列の表を囲んだ文書'
        notes: 表の番号は列の表示・非表示の機能（`features.columns` か `columns.{列名}.hidden`）を持つ表だけを数え、1 つ目が `0`、2 つ目が `1`
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
