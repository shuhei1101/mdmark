      - 表の上の帯に、アイコンだけで `aria-label` とツールチップが「テーブル設定」のボタンがあり、押すと列の一覧が開き、`aria-expanded` が `true` になる
      - 一覧の各行に、並べ替えのつまみと、表示・非表示の目のアイコンがある。Markdown に記載した先頭の列（`名前`）の目のアイコンは、並べ替えて先頭でなくなった後も `disabled` で、一覧の下の案内に「先頭の列は隠せません」の理由を出す
