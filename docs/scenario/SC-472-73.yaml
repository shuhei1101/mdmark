      - 動かしている間、表もページも横にスクロールしない
      - ダブルタップした後、名前の列の幅が描いた直後の幅に戻る
      - ダブルタップしても、ページが拡大されない
    test: test_normal_when_column_resized_by_touch
  - name: 正常シナリオ（キーボードで列の幅を変える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 幅を変える表を持つ Markdown
        description: '`<!-- table: {"kind": "data"} -->` で、名前・説明・更新日の 3 列 3 行の表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 列の見出しの右端につまみを持つ表を描く
        U->>P: Tab で名前の列のつまみへフォーカスを移す
        U->>P: → キーを 2 回押す
        P-->>U: 名前の列が広がった表
        U->>P: ← キーを 1 回押す
        P-->>U: 名前の列が狭まった表
        U->>P: Enter を押す
        P-->>U: 名前の列が元の幅に戻った表
    expected:
      - つまみにフォーカスが移るとつまみが出る
      - つまみが `role="separator"`・`aria-orientation="vertical"`・`tabindex="0"` と、`名前` を含む `aria-label` を持ち、`aria-valuenow` が名前の列の今の幅（px）、`aria-valuemin` が列の最小幅（px）、`aria-valuemax` が名前の列を広げられる上限の幅（px。表の見える幅から、ほかの留めた列の幅の合計を引いた幅）、`aria-valuetext` が「{今の幅}px」
      - つまみを持つ見出しのセルの、並べ替え・ピン止め・絞り込みのボタンの Tab の順は、つまみより前
      - → キーを 2 回押した後、名前の列の幅が押す前より 32px 広く、`aria-valuenow` と `aria-valuetext` が広げた後の幅になり、説明・更新日の列の幅は押す前と同じ
      - ← キーを 1 回押した後、名前の列の幅が → キー 1 回分だけ狭まる
      - Enter を押した後、名前の列の幅と `aria-valuenow` が描いた直後の幅に戻り、フォーカスはつまみに残る
      - →・← キーで表もページも横にスクロールしない
    test: test_normal_when_column_resized_by_keyboard
  - name: 正常シナリオ（狭い幅で列の幅を変える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面と描く先の要素の幅は 600px
      - name: 最終列の短い表を持つ Markdown
        description: '`<!-- table: {"kind": "data"} -->` 〜 `<!-- /table -->` で、名前・状態・説明の 3 列 3 行の表を囲んだ文書'
        notes: 説明はどの行も 600px の幅で 1 行に収まる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 横にスクロールしない表を描く
        U->>P: 名前の列のつまみを、表が描く先の要素からはみ出すまで右へドラッグして離す
        P-->>U: 横にスクロールする表
        U->>P: 説明の列のつまみを、説明のセルが折り返すまで左へドラッグして離す
        P-->>U: 説明の列を折り返して出した表
    expected:
      - 名前の列を広げて離した後、説明の列の幅は広げる前と同じ
      - 名前の列を広げて離した後、表が横にスクロールでき、ページ全体は横にスクロールしない
      - 説明の列を狭めて離した後、説明のセルが折り返して出ている
    test: test_normal_when_column_resized_in_narrow_width
lead: '文書の作成者が `<!-- table: {JSON のオブジェクト} -->` 〜 `<!-- /table -->` で表を囲み、読者が描かれた表を見出し行を見ながらページのスクロールで読み込み、列で並べ替え・絞り込み・ピン止めし、閉じた表を開き、表と行の URL をコピーする。'
