minimal_guarantee: 表のマーカーに読み込めない指定があっても、表は描かれ、読み込めた指定だけが該当する。知っているキーの誤った値と組み合わせの誤りには範囲の上に記載の警告が出て、知らない種類・機能・キーは警告を出さずにスキップする。
