      - 見出しの並べ替えのボタンを押しても列は動かず、行だけが並べ替わる。行を並べ替えた後と絞り込んだ後も、動かした列の順が保たれている
      - '`features` に `reorder` だけを記載した表の一覧にはつまみだけがあり、目のアイコンが無い。`reorder` も `columns` も記載しない表にはテーブル設定のボタンが無い'
