        description: '`<!-- table: {"kind": "data", "features": {"reorder": {}, "columns": {}}, "columns": {"名前": {"filter": {"type": "text"}}}} -->` 〜 `<!-- /table -->` で囲んだ 4 列 3 行の表と、`features` に `reorder` だけを記載した表と、`reorder` も `columns` も記載しない `<!-- table: {"kind": "data"} -->` の表を 1 つずつ持つ文書'
