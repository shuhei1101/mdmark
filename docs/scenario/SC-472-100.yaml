id: SC-472-100
visibility: internal
title: markdownのコードブロックを描いた結果と見比べる
lead: 読者が、言語が `markdown`（`md`）のコードブロックで、帯の切り替えのボタンを押してソースの表示と描いた結果の表示を切り替え、記載した Markdown がどう描かれるかを見比べる。
test_file: tests/e2e/単一ユースケース/markdownのコードブロックを描いた結果と見比べる.spec.ts
primary_actor: 読者
trigger: 読者が、言語が markdown のコードブロックの中身を描いた結果で確認したくなる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - コードブロックの機能（`code`）がオン（既定）
success_guarantee: 言語が `markdown`・`md` のコードブロックだけに切り替えのボタンが出る。描いた直後はソースの表示で、切り替えると中身を描いた結果が出て、もう一度切り替えるとソースに戻る。どちらの表示でも、コピーボタンはソースをコピーする。
minimal_guarantee: 描いた結果を出せないときも、ソースの表示とコピーボタンは今のとおり使用できる。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 言語 markdown のコードブロックを持つ Markdown
        description: 見出し・箇条書き・表を記載した言語 `markdown` のコードブロック 1 つと、同じ中身の言語 `md` のコードブロック 1 つと、言語 `ts` のコードブロック 1 つを配置した文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 描いた文書
        U->>D: 文書を開く
        D-->>U: 言語 markdown のコードブロックをソースの表示で出す
        U->>D: 言語 markdown のコードブロックの切り替えのボタンを押す
        D-->>U: コードブロックの中身を描いた結果を出す
        U->>D: コピーボタンを押す
        D-->>U: ソースをコピーする
        U->>D: 切り替えのボタンをもう一度押す
        D-->>U: ソースの表示に戻す
      ```

      <!-- /map -->
    expected:
      - 描いた直後は、どのコードブロックもソースの表示で、言語のラベル・コピーボタン・行の見え方が切り替えのボタンを除いて今と同じ
      - 言語 `markdown` と `md` のコードブロックの帯に切り替えのボタンがあり、言語 `ts` のコードブロックには無い
      - 切り替えのボタンを押すと、そのコードブロックだけが、中身の見出し・箇条書き・表を描いた結果の表示になり、ソースのコードが隠れる。ほかのコードブロックの表示は変わらない
      - 描いた結果の見出しは、文書の右側の目次と見出しの番号に入らない
      - 描いた結果の表示でコピーボタンを押すと、ソースの表示と同じ文字（コードブロックに記載した Markdown）がコピーされる
      - 切り替えのボタンをもう一度押すと、ソースの表示に戻る
      - 切り替えのボタンはスクリーンリーダー向けの名前と、今の表示が描いた結果かを表す押した状態を持ち、フォーカスして Enter・Space で切り替わる
      - 切り替えても、文書のスクロールの位置が変わらない
    test: test_normal
  - name: 正常シナリオ（機能をオフにした文書）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 機能を解除した Markdown
        description: '`<!-- features: {"code": false} -->` を記載し、言語 `markdown` のコードブロックを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 描いた文書
        U->>D: 文書を開く
        D-->>U: 言語 markdown のコードブロックを、切り替えのボタンを持たないソースのまま出す
      ```

      <!-- /map -->
    expected:
      - 言語のラベル・コピーボタン・切り替えのボタンが出ていない
      - コードブロックが記載したソースのまま出ている
    test: test_normal_when_feature_off
tags:
  - name: topic:コードブロック
    main: true
  - name: topic:markdown
  - name: action:切り替え
  - name: action:描画
