id: SC-472-100
visibility: internal
title: markdownのコードブロックを描いた結果と見比べる
lead: 読者が、言語が `markdown`（`md`）のコードブロックで、描いた結果の表示と、帯の Raw のボタンで出す元の Markdown の表示を切り替え、記載した Markdown がどう描かれるかを見比べる。
test_file: tests/e2e/単一ユースケース/markdownのコードブロックを描いた結果と見比べる.spec.ts
primary_actor: 読者
trigger: 読者が、言語が markdown のコードブロックの中身を描いた結果で確認したくなる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - コードブロックの機能（`code`）がオン（既定）
success_guarantee: 言語が `markdown`・`md` のコードブロックだけに Raw のボタンが出る。描いた直後は中身を描いた結果で（code のマーカーで指定したコードブロックは元の Markdown で）、Raw のボタンを押すと元の Markdown が出て、もう一度押すと描いた結果に戻る。どちらの表示でも、コピーボタンは元の Markdown をコピーする。
minimal_guarantee: 描いた結果を出せないときも、元の Markdown の表示とコピーボタンは今のとおり使用できる。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 言語 markdown のコードブロックを持つ Markdown
        description: 見出し・箇条書き・表を記載した言語 `markdown` のコードブロック 1 つと、同じ中身の言語 `md` のコードブロック 1 つと、言語 `ts` のコードブロック 1 つを配置した文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 描いた文書
        U->>D: 文書を開く
        D-->>U: 言語 markdown のコードブロックの中身を描いた結果で出す
        U->>D: 言語 markdown のコードブロックの Raw のボタンを押す
        D-->>U: 元の Markdown を出す
        U->>D: コピーボタンを押す
        D-->>U: 元の Markdown をコピーする
        U->>D: Raw のボタンをもう一度押す
        D-->>U: 描いた結果の表示に戻す
      ```

      <!-- /map -->
    expected:
      - 描いた直後は、言語 `markdown` と `md` のコードブロックが中身の見出し・箇条書き・表を描いた結果の表示で、言語 `ts` のコードブロックは今と同じ表示
      - 言語 `markdown` と `md` のコードブロックの帯の、コピーボタンの左に Raw のボタンがあり、言語 `ts` のコードブロックには無い
      - 描いた結果の見出しは、文書の右側の目次と見出しの番号に入らない
      - 描いた結果の表示でコピーボタンを押すと、コードブロックに記載した Markdown がコピーされる
      - Raw のボタンを押すと、そのコードブロックだけが元の Markdown の表示になり、描いた結果が隠れる。ほかのコードブロックの表示は変わらない
      - Raw のボタンをもう一度押すと、描いた結果の表示に戻る
      - Raw のボタンはスクリーンリーダー向けの名前と、今の表示が元の Markdown かを表す押した状態を持ち、フォーカスして Enter・Space で切り替わる
      - 切り替えても、文書のスクロールの位置が変わらない
    test: test_normal
  - name: 正常シナリオ（code のマーカーで既定を元の Markdown にした文書）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 既定を元の Markdown にしたコードブロックを持つ Markdown
        description: code のマーカーで既定を元の Markdown にした言語 `markdown` のコードブロック 1 つと、マーカーの無い言語 `markdown` のコードブロック 1 つを配置した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 描いた文書
        U->>D: 文書を開く
        D-->>U: マーカーで指定したコードブロックを元の Markdown で、ほかのコードブロックを描いた結果で出す
        U->>D: マーカーで指定したコードブロックの Raw のボタンを押す
        D-->>U: 描いた結果を出す
      ```

      <!-- /map -->
    expected:
      - 描いた直後は、マーカーで指定したコードブロックが元の Markdown の表示で、Raw のボタンが押した状態になっている
      - マーカーの無いコードブロックは、描いた結果の表示になっている
      - マーカーで指定したコードブロックの Raw のボタンを押すと、そのコードブロックだけが描いた結果の表示になる
    test: test_normal_when_raw_by_marker
  - name: 正常シナリオ（機能をオフにした文書）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 機能を解除した Markdown
        description: '`<!-- features: {"code": false} -->` を記載し、言語 `markdown` のコードブロックを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 描いた文書
        U->>D: 文書を開く
        D-->>U: 言語 markdown のコードブロックを、Raw のボタンを持たない元の Markdown のまま出す
      ```

      <!-- /map -->
    expected:
      - 言語のラベル・コピーボタン・Raw のボタンが出ていない
      - コードブロックが記載した Markdown のまま出ている
    test: test_normal_when_feature_off
tags:
  - name: topic:コードブロック
    main: true
  - name: topic:markdown
  - name: action:切り替え
  - name: action:描画
