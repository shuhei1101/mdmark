id: SC-472-97
visibility: internal
title: ClaudeCodeの返答を共通スタイルで描く
lead: Claude Code を使用する人が、mdmark-style を入れた Claude Code の画面で、アシスタントの返答の表・注意書き・見出し・コードと、行の詳細・ステップなどの本文の部品を mdmark の共通スタイルの部品で確認する。返答に記載された mdmark のマーカーは描き方に使用し、画面には出さない。
primary_actor: Claude Code を使用する人
trigger: アシスタントの返答が Claude Code の画面に描かれる
preconditions:
  - Claude Code に mdmark-style を入れている
  - mdmark-style の設定の `enabled` が `true` で、`targets` に `assistant` がある
stakeholders:
  - name: Claude Code を使用する人
    interest: 返答の表・注意書き・見出し・コードと、行の詳細・ステップ・ファイルツリー・バッジ・文字の色・蛍光ペン・キー・タブなどの中身・図と表の番号を、Web で開く mdmark の文書と同じ見た目で確認できる。マーカーの文字が画面に出ない
  - name: Claude Code
    interest: mdmark-style が描けない返答でも、Claude Code の元の描画で返答が出る
scenarios:
  - name: 正常シナリオ
    decisions:
      - D-75
      - D-76
      - D-77
      - D-94
    setup:
      - name: mdmark-style を入れた Claude Code
        description: ターミナル版の Claude Code を tmux の手元と別のソケットで起動し、ビルドしたこのリポジトリの mdmark-style を `--plugin-dir` で読み込む
        notes: 設定ファイルは配置せず、既定値で動かす
      - name: 固定の返答
        description: '見出し・太字と行内のコードを含む段落・箇条書き・行内と単独の行のマーカー・`<!-- table: {"kind": "data"} -->` を付けた表・マーカーの無い表・`> [!NOTE]` の注意書き・`<!-- code: title=a.ts lines -->` を付けて行末に `[!code ++]` を持つ行を含む言語 `ts` のコードブロック・`<!-- details: 用語を読み込む場所 -->` 〜 `<!-- /details -->` の範囲を持つ Markdown をファイルに配置し、その中身だけを返答させる発言'
      - name: Mock
        description: なし（実際の Claude Code とモデルで、固定の Markdown をそのまま返答させる）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 本文をブロックに分け、マーカーを描き方に使用する
        M-->>C: 共通スタイルの部品の木
        C-->>U: 描き換えた返答
      ```

      <!-- /map -->
    expected:
      - 表が罫線と列の幅で描かれ、列の幅が全角の文字を 2 つ分として統一される
      - '`<!-- table: {"kind": "data"} -->` を付けた表はその表の種類の描き方（見出しの行の強調）で描かれ、マーカーの無い表は既定の表の描き方で描かれる'
      - 注意書きが左の縦線・種類の色・先頭の種類のラベルで描かれる
      - 見出しが太字と見出しの色で描かれる
      - コードブロックが Code 部品で言語の色分けつきで描かれる
      - 画面に `<!--` の文字が 0 件で、行内のマーカーの前後の文字が 1 つの空白でつながる
      - 色・罫線は共通スタイルの定義の値で描かれる
      - 表・注意書き・見出し・コードのほかのブロック（段落・箇条書き）と、その中の太字・行内のコード・リンクは、Claude Code の標準の返答と同じ描き方で描かれ、`**`・`- `・バッククォートの記号が画面に出ない
      - コードブロックが背景の面で本文と分かれ、言語のラベル・タイトル `a.ts`・行番号が付き、`[!code ++]` の行は追加した行の色で描かれて `[!code ++]` の文字は出ない
      - 開閉の範囲が `[ ▸ 用語を読み込む場所 ]` の Button で描かれ、押すと中身が開き、もう一度押すと閉じる
    test: test_normal
  - name: 正常シナリオ（部品をオフにしている）
    decisions:
      - D-93
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` で一時フォルダの設定ファイルを指す
        notes: 設定ファイルの `global.parts.table` を `false` にする
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 表のブロックだけ Claude Code の Markdown 部品に任せる
        M-->>C: 部品の木
        C-->>U: 表だけ Claude Code の描き方の返答
      ```

      <!-- /map -->
    expected:
      - 表が Claude Code の Markdown の描き方で描かれる
      - 注意書き・見出し・コードは正常シナリオと同じく共通スタイルで描かれる
      - 画面に `<!--` の文字が 0 件
    test: test_normal_when_part_disabled
  - name: 正常シナリオ（返答を描き換えない設定）
    decisions:
      - D-93
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` で一時フォルダの設定ファイルを指す
        notes: 設定ファイルの `global.targets` を `[user]` にする
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M-->>C: 受けた本文のまま Claude Code の描画に任せる
        C-->>U: Claude Code の元の描画の返答
      ```

      <!-- /map -->
    expected:
      - 返答が Claude Code の元の描画で描かれ、マーカーの文字も元の描画のとおりに出る
    test: test_normal_when_assistant_not_targeted
  - name: 正常シナリオ（狭い端末）
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。tmux の端末の幅を 50 列にする
      - name: 広い表の返答
        description: 3 列で、3 列目のセルが 60 文字の表を持つ Markdown をファイルに配置し、その中身だけを返答させる発言
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 広い表を返答させる発言
        C->>M: ui.render（AssistantMessage・本文・描く幅）
        M->>M: 列の幅を描く幅に収める
        M-->>C: セルの中で折り返す表の部品の木
        C-->>U: 端末の幅に収まった表
      ```

      <!-- /map -->
    expected:
      - 表の罫線が端末の幅の中に収まり、3 列目のセルの中身が複数の行に折り返されて全ての文字が画面に出る
    test: test_normal_when_terminal_narrow
  - name: 異常シナリオ（設定ファイルを読めない）
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` が YAML として読めない設定ファイルを指す
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 設定ファイルを読めず、デバッグログに理由を出す
        M-->>C: next(e) の戻り値
        C-->>U: Claude Code の元の描画の返答
      ```

      <!-- /map -->
    expected:
      - 返答が Claude Code の元の描画で描かれる
      - Claude Code のデバッグログに、mdmark-style の名前と設定ファイルを読めなかった理由の行がある
    test: test_error_when_config_unreadable
  - name: 正常シナリオ（本文の部品）
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ
        notes: 設定ファイルは配置せず、既定値で動かす
      - name: 本文の部品の返答
        description: '`<!-- row-detail: {"at": 1} -->` 〜 `<!-- /row-detail -->` の詳細を持つ表・`<!-- steps -->` の 2 項目の番号付きリスト・注釈（`# ソース`）を持つ言語 `tree` のコードブロック・行内の `badge:green:完了`・`[注意]{color=red}`・`==決め手==`・`kbd:Ctrl+C`・見出し `macOS`・`Windows` で区切った `<!-- tabs -->` の範囲・`<!-- column -->` で 2 列に区切った `<!-- columns -->` の範囲・2 項目の `<!-- cards -->` のリスト・`<!-- view -->` の範囲の表・`<!-- wide -->` 〜 `<!-- /wide -->` で囲んだ表・言語 `csv` のコードブロック・`<!-- fig: {"id": "price"} -->` を付けた表を持つ Markdown をファイルに配置し、その中身だけを返答させる発言'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 本文の部品の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 本文をブロックに分け、部品のマーカーと記法を描き方に使用する
        M-->>C: 共通スタイルの部品の木
        C-->>U: 描き換えた返答
        U->>C: 表の行の詳細のボタンを押す
        C->>M: ui.render（同じ返答）
        M-->>C: 行の下に詳細を開いた部品の木
        C-->>U: 行の詳細が開いた返答
      ```

      <!-- /map -->
    expected:
      - 表の 1 行目の先頭に `▸` の開閉のボタンが描かれ、詳細の文は描かれない。押すと 1 行目の下に詳細の文が開き、もう一度押すと閉じる
      - ステップの番号 `1`・`2` が共通スタイルの色で描かれ、番号の右に項目の文が描かれる
      - ファイルツリーが罫線のまま等幅で描かれ、注釈 `ソース` が薄い色で描かれて `#` は出ない
      - バッジ `完了` が緑の文字、`注意` が赤の太字、`決め手` が黄色の背景で描かれ、`badge:`・`{color=red}`・`==` の文字は出ない
      - キーが `[Ctrl]+[C]` の囲みで描かれ、`kbd:` の文字は出ない
      - タブの `macOS`・`Windows` が見出しとして描かれ、それぞれの下に中身が順に縦に並ぶ
      - 段組みの 2 列の中身とカードの 2 項目が、横に並ばずに記載した順に縦に並ぶ
      - ビューの範囲の表・wide の範囲の表・CSV のコードブロックが、正常シナリオの表と同じ罫線の表で描かれ、CSV は 1 行目が見出しの行になる。ビュー・wide・CSV の切り替えのボタンは描かれない
      - 番号を付けた表の上に `表 1` が描かれる
      - 画面に `<!--` の文字が 0 件
    test: test_normal_when_document_parts
success_guarantee: 返答の表・注意書き・見出し・コードと、行の詳細・ステップ・ファイルツリー・バッジ・文字の色・蛍光ペン・キー・タブなどの中身・図と表の番号が共通スタイルの部品で描かれ、mdmark のマーカーの文字は画面に出ない。設定でオフにした部品と場所は Claude Code の描き方のまま描かれる。
minimal_guarantee: mdmark-style が描けないときも、返答は Claude Code の元の描画で出て、セッションは続く。返答として保存される本文は変わらない。
notes:
  描かないもの: 図（言語 `mermaid` のコードブロック・map の範囲）と埋め込んだ HTML（`<!-- html -->` の範囲）は、図や HTML として描かず、コードブロックとして Code 部品で描く。文字の大きさは変えない。
test_file: tests/e2e/単一ユースケース/ClaudeCodeの返答を共通スタイルで描く.spec.ts
