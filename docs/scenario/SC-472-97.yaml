id: SC-472-97
visibility: internal
title: ClaudeCodeの返答を共通スタイルで描く
lead: Claude Code を使用する人が、mdmark-style を入れた Claude Code の画面で、アシスタントの返答の表・注意書き・見出し・コードを mdmark の共通スタイルの部品で確認する。返答に記載された mdmark のマーカーは描き方に使用し、画面には出さない。
primary_actor: Claude Code を使用する人
trigger: アシスタントの返答が Claude Code の画面に描かれる
preconditions:
  - Claude Code に mdmark-style を入れている
  - mdmark-style の設定の `enabled` が `true` で、`targets` に `assistant` がある
stakeholders:
  - name: Claude Code を使用する人
    interest: 返答の表・注意書き・見出し・コードを、Web で開く mdmark の文書と同じ見た目で確認できる。マーカーの文字が画面に出ない
  - name: Claude Code
    interest: mdmark-style が描けない返答でも、Claude Code の元の描画で返答が出る
scenarios:
  - name: 正常シナリオ
    decisions:
      - D-75
      - D-76
      - D-77
      - D-94
    setup:
      - name: mdmark-style を入れた Claude Code
        description: ターミナル版の Claude Code を tmux の手元と別のソケットで起動し、ビルドしたこのリポジトリの mdmark-style を `--plugin-dir` で読み込む
        notes: 設定ファイルは配置せず、既定値で動かす
      - name: 固定の返答
        description: '見出し・行内と単独の行のマーカー・`<!-- table: {"kind": "data"} -->` を付けた表・マーカーの無い表・`> [!NOTE]` の注意書き・言語 `ts` のコードブロックを持つ Markdown をファイルに配置し、その中身だけを返答させる発言'
      - name: Mock
        description: なし（実際の Claude Code とモデルで、固定の Markdown をそのまま返答させる）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 本文をブロックに分け、マーカーを描き方に使用する
        M-->>C: 共通スタイルの部品の木
        C-->>U: 描き換えた返答
      ```

      <!-- /map -->
    expected:
      - 表が罫線と列の幅で描かれ、列の幅が全角の文字を 2 つ分として統一される
      - '`<!-- table: {"kind": "data"} -->` を付けた表はその表の種類の描き方（見出しの行の強調）で描かれ、マーカーの無い表は既定の表の描き方で描かれる'
      - 注意書きが左の縦線・種類の色・先頭の種類のラベルで描かれる
      - 見出しが太字と見出しの色で描かれる
      - コードブロックが Code 部品で言語の色分けつきで描かれる
      - 画面に `<!--` の文字が 0 件で、行内のマーカーの前後の文字が 1 つの空白でつながる
      - 色・罫線は共通スタイルの定義の値で描かれる
    test: test_normal
  - name: 正常シナリオ（部品をオフにしている）
    decisions:
      - D-93
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` で一時フォルダの設定ファイルを指す
        notes: 設定ファイルの `global.parts.table` を `false` にする
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 表のブロックだけ Claude Code の Markdown 部品に任せる
        M-->>C: 部品の木
        C-->>U: 表だけ Claude Code の描き方の返答
      ```

      <!-- /map -->
    expected:
      - 表が Claude Code の Markdown の描き方で描かれる
      - 注意書き・見出し・コードは正常シナリオと同じく共通スタイルで描かれる
      - 画面に `<!--` の文字が 0 件
    test: test_normal_when_part_disabled
  - name: 正常シナリオ（返答を描き換えない設定）
    decisions:
      - D-93
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` で一時フォルダの設定ファイルを指す
        notes: 設定ファイルの `global.targets` を `[user]` にする
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M-->>C: 受けた本文のまま Claude Code の描画に任せる
        C-->>U: Claude Code の元の描画の返答
      ```

      <!-- /map -->
    expected:
      - 返答が Claude Code の元の描画で描かれ、マーカーの文字も元の描画のとおりに出る
    test: test_normal_when_assistant_not_targeted
  - name: 異常シナリオ（設定ファイルを読めない）
    setup:
      - name: mdmark-style を入れた Claude Code
        description: 正常シナリオと同じ。`MDMARK_STYLE_CONFIG` が YAML として読めない設定ファイルを指す
      - name: 固定の返答
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as Claude Code を使用する人
        participant C as Claude Code
        participant M as mdmark-style
        U->>C: 固定の Markdown を返答させる発言
        C->>M: ui.render（AssistantMessage と返答の本文）
        M->>M: 設定ファイルを読めず例外を投げる
        C-->>U: Claude Code の元の描画の返答
      ```

      <!-- /map -->
    expected:
      - 返答が Claude Code の元の描画で描かれる
      - Claude Code のデバッグログに、mdmark-style の名前と設定ファイルを読めなかった理由の行がある
    test: test_error_when_config_unreadable
success_guarantee: 返答の表・注意書き・見出し・コードが共通スタイルの部品で描かれ、mdmark のマーカーの文字は画面に出ない。設定でオフにした部品と場所は Claude Code の描き方のまま描かれる。
minimal_guarantee: mdmark-style が描けないときも、返答は Claude Code の元の描画で出て、セッションは続く。返答として保存される本文は変わらない。
notes:
  描かないもの: 図（言語 `mermaid` のコードブロック・map の範囲）と埋め込んだ HTML（`<!-- html -->` の範囲）は、図や HTML として描かず、コードブロックとして Code 部品で描く。文字の大きさは変えない。
test_file: tests/e2e/単一ユースケース/ClaudeCodeの返答を共通スタイルで描く.spec.ts
tags:
  - name: action:描画
    main: true
  - name: tool:claude-code
  - name: topic:プラグイン
  - name: topic:テーブル
  - name: topic:注意書き
  - name: topic:見出し
  - name: topic:コードブロック
  - name: topic:マーカー
