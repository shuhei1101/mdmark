id: SC-472-52
visibility: internal
title: 文字列とYAMLのキーの記法を点検する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 作業のフォルダ
        description: '`mdmark init` の後のフォルダ'
      - name: 点検する文字列
        description: '正しいグラフの部品の定義と、`<!-- table: {"kind": "data"} -->` で囲んだ表を持つ Markdown の文字列'
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使用しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで記載の警告を集める
        R-->>C: 空の警告の一覧
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 出力がずれ 0 件を示す
      - 終了コードが 0
      - 作業のフォルダのファイルが変わっていない
    test: test_normal
  - name: 正常シナリオ（記載の警告がある）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 記載の警告を持つ文字列
        description: '廃止した `<!-- flow -->` の範囲、知らないマーカー `<!-- tabz -->`、`<!-- code: {"highlight": [9]} -->` の直後の 3 行のコードブロックを持つ Markdown の文字列'
        notes: 同じ文字列を `render` で描いたときに、記載の警告が 3 つ出る
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで記載の警告を集める
        R-->>C: 記載の警告の一覧
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 'ずれの行が 3 つあり、それぞれが文字列の中の `<!-- flow -->`・`<!-- tabz -->`・`<!-- code: {"highlight": [9]} -->` の行を指す'
      - 各行の内容が、同じ文字列を `render` で描いたときの記載の警告の文言と同じ
      - 終了コードが 0 以外
    test: test_normal_when_warnings
  - name: 正常シナリオ（ファイルとYAMLのキー）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: Markdown をキーに持つ YAML のファイル
        description: '`items[0].body` に、ブロックスカラー（`|`）の 3 行目へ知らないマーカー `<!-- tabz -->` を記載した Markdown、`items[1].body` に正しい Markdown を持つ `records.yaml`'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as ファイル
        participant R as mdmark の描画の処理
        W->>C: mdmark check（records.yaml・items[0].body）
        C->>F: YAML のファイルを読み込み、キーの値を取り出す
        C->>R: キーの値を描くときと同じ読み取りで記載の警告を集める
        R-->>C: 記載の警告の一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 'ずれの行が 1 つだけで、`records.yaml` と、`<!-- tabz -->` を記載した YAML のファイルの行を指す'
      - 内容にマーカーの名前 `tabz` と修正の方法が記載されている
      - '`items[1].body` を指す行が無い'
      - 終了コードが 0 以外
      - '`records.yaml` が変わっていない'
    test: test_normal_when_yaml_key
  - name: 正常シナリオ（拡張のマーカー）
    setup:
      - name: 拡張を登録した作業のフォルダ
        description: '正常シナリオのフォルダの設定の `extensions` に、マーカー `note-card` を追加する拡張を記載したもの'
      - name: 拡張のマーカーを持つ文字列
        description: '`<!-- note-card -->` と知らないマーカー `<!-- tabz -->` を持つ Markdown の文字列'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>C: 設定の extensions が追加するマーカーを読み込む
        C->>R: 文字列を描くときと同じ読み取りで記載の警告を集める
        R-->>C: 記載の警告の一覧
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 'ずれの行が `<!-- tabz -->` を指す 1 つだけで、`<!-- note-card -->` を指す行が無い'
      - 終了コードが 0 以外
    test: test_normal_when_extension_mark
  - name: 異常シナリオ（キーが無い）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオ（ファイルとYAMLのキー）と同じ
      - name: 無いキー
        description: '`records.yaml` に無いキー `items[5].body` を指定する'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as ファイル
        W->>C: mdmark check（records.yaml・items[5].body）
        C->>F: YAML のファイルを読み込み、キーを探す
        C-->>W: キーが無いことと修正の方法の 1 文・終了コード 0 以外
    expected:
      - '出力に、指定したキーが `records.yaml` に無いことと修正の方法が出る'
      - 終了コードが 0 以外
      - '`records.yaml` が変わっていない'
    test: test_error_when_key_missing
  - name: 正常シナリオ（知らないキー・機能・指定）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 知らないキー・機能・指定を持つ文字列
        description: '`<!-- table: {"kind": "data", "features": {"unknown": {}}, "widht": {"説明": {}}} -->` で囲んだ表と、`<!-- tabs: {"grop": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲を持つ Markdown の文字列'
        notes: 同じ文字列を `render` で描いたときに、記載の警告は出ない
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りとマーカーの JSON Schema の検証で、記載の警告と無視したキーを集める
        R-->>C: 空の警告の一覧と、無視したキーの一覧
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 3 つあり、`features.unknown`・`widht` の 2 つが表のマーカーの行を、`grop` がタブのマーカーの行を指す
      - 各行の種類が記載の警告でも知らないマーカーでもない、知らないキーの種類
      - 各行の内容が、無視したキーの場所（`features.unknown` など）と、その場所で使用できるキーを挙げる
      - 終了コードが 0 以外
    test: test_normal_when_unknown_mark_args
  - name: 正常シナリオ（今の書き方のマーカーがある）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 今の書き方のマーカーを持つ文字列
        description: '`<!-- table: data +total total=数量:sum -->` で囲んだ表と、`<!-- details: 補足 open -->` 〜 `<!-- /details -->` の範囲を持つ Markdown の文字列'
        notes: 同じ文字列を `render` で描くと、表と範囲は今の書き方のとおりに描かれ、記載の警告は出ない
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告と今の書き方のマーカーを集める
        R-->>C: 空の警告の一覧と、今の書き方のマーカーの一覧
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 2 つあり、表のマーカーの行と details のマーカーの行を指す
      - 各行の種類が今の書き方のマーカーの種類
      - 各行の内容が、マーカーの引数を JSON のオブジェクトで記載することと、`mdmark upgrade` で書き換えられることを挙げる
      - 終了コードが 0 以外
    test: test_normal_when_legacy_mark_args
  - name: 正常シナリオ（JSON として読めない引数）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 読めない引数を持つ文字列
        description: '末尾のカンマを持つ `<!-- code: {"title": "app.ts",} -->` の直後のコードブロックと、値に `--\u003e` を記載した `<!-- details: {"title": "a --\u003e b"} -->` 〜 `<!-- /details -->` の範囲を持つ Markdown の文字列'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告を集める
        R-->>C: code のマーカーの JSON として読めない引数の記載の警告
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 1 つだけで、code のマーカーの行を指し、種類が記載の警告、内容が JSON として読めない位置と理由を挙げる
      - details のマーカーを指す行が無い（`\u003e` で記載した `>` は値の `-->` として読む）
      - 終了コードが 0 以外
    test: test_normal_when_mark_args_not_json
  - name: 正常シナリオ（値に --> を記載した引数）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 値に --> を持つ文字列
        description: '段落の後に、値に `-->` をそのまま記載した `<!-- details: {"title": "a --> b"} -->` と段落と `<!-- /details -->` を持つ Markdown の文字列'
        notes: 'HTML コメントは最初の `-->` で閉じるため、マーカーの引数は `{"title": "a ` までになり、残りの ` b"} -->` はコメントの外の文字になる。同じ文字列を `render` で描くと、details のマーカーの場所に JSON として読めない引数の記載の警告が出て、範囲は既定の見出し `詳細` の閉じた折り畳みで描かれ、` b"} -->` は本文の文字として出る'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告を集める
        R-->>C: details のマーカーの JSON として読めない引数の記載の警告
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が details のマーカーの行を指し、種類が記載の警告
      - 行の内容が、JSON として読めない位置と理由に加えて、値に `-->` を記載するとコメントがそこで閉じることと、`>` を `\u003e` にした `--\u003e` で記載する方法を挙げる
      - 終了コードが 0 以外
    test: test_normal_when_comment_end_in_value
  - name: 正常シナリオ（map の書き方の警告がある）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: map の書き方を誤った文字列
        description: map の範囲の中に、GitHub の Mermaid でも読めない行を 1 行持つ mermaid のブロックと、知らないトップレベルのキーを 1 つ持つ補足を持つ Markdown の文字列
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告を集める
        R-->>C: map の書き方の警告 2 件
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 2 つあり、読めない行と知らないキーをそれぞれ指す
      - 各行の内容が、同じ文字列を描いたときの書き方の警告と同じ
      - 終了コードが 0 以外
    test: test_normal_when_map_warnings
  - name: 正常シナリオ（注記の参照と定義が合わない）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 注記の参照と定義が合わない文字列
        description: 本文で定義の無い注記の ID `missing` を参照し、どこからも参照しない ID `unused` の注記を定義し、参照する ID `cond` の注記を 2 回定義し、map の補足のノード 1 つから定義の無い ID `gone` を参照する Markdown の文字列
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告を集める
        R-->>C: 注記の記載の警告 4 件
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 4 つあり、`missing` の参照・`unused` の定義・`cond` の 2 つ目の定義・補足の `gone` の参照をそれぞれ指す
      - '`missing` と `gone` の行は定義の無い注記の参照、`unused` の行は参照されていない注記の定義、`cond` の行は重複した注記の定義の種類を持つ'
      - 各行の内容が、同じ文字列を描いたときの記載の警告と同じ
      - 終了コードが 0 以外
    test: test_normal_when_annotation_mismatch
  - name: 正常シナリオ（罫線のフォルダ構成の言語が tree でない）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: 罫線を言語 tree でないコードブロックに記載した文字列
        description: 『ステップ・ファイルツリー・バッジで本文を組む』の異常シナリオ（罫線のフォルダ構成の言語が tree でない）の言語 `text` のコードブロックだけを持つ Markdown の文字列
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant R as mdmark の描画の処理
        W->>C: mdmark check（Markdown の文字列）
        C->>R: 文字列を描くときと同じ読み取りで、記載の警告を集める
        R-->>C: 罫線のコードブロックの警告 1 件
        C-->>W: 場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - ずれの行が 1 つあり、コードブロックの開始の行を指す
      - 行の内容が、同じ文字列を描いたときの記載の警告と同じで、言語を `tree` にすることと警告を止める指定を案内している
      - 終了コードが 0 以外
    test: test_normal_when_tree_lines_without_tree_language
lead: |-
  文書の作成者が `mdmark check` に Markdown の文字列、またはファイルと YAML のキーを指定し、描いたときの記載の警告と同じ内容をずれの一覧で受け取る。
  YAML のキーの中に Markdown を書き込むツール（dev-docs・MindStella）も、書き込みのたびに同じ点検を呼ぶ。
issue: 288
primary_actor: 文書の作成者（AI と、書き込みのたびに点検を呼ぶツールを含む）
stakeholders:
  - name: 文書の作成者
    interest: 描く前に、描いたときに出る記載の警告を見つけて修正できる
  - name: 読者
    interest: 描いた文書に記載の警告が残らない
  - name: 書き込みを受けるツール（dev-docs・MindStella）
    interest: 書き込みのたびに、描くときと同じ点検をブラウザなしで呼べる
trigger: Markdown を文字列のまま持つか YAML のキーへ書き込んだ後、記法の誤りを確認する
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
success_guarantee: 指定した Markdown を描いたときの記載の警告と同じ内容と、描くときにスキップするマーカーの知らないキー・機能・指定が、ファイル・場所・種類・内容の一覧で出る。ずれが無ければ終了コード 0、あれば 0 以外で終わる。
minimal_guarantee: 点検はファイルを書き換えない。ファイルやキーを読み込めないときは、原因と修正の方法の 1 文を出して 0 以外で終わる。
refs:
  - SC-472-78#
  - SC-472-57#
test_file: tests/e2e/単一ユースケース/文字列とYAMLのキーの記法を点検する.spec.ts
