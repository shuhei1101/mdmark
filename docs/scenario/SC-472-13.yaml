id: SC-472-13
visibility: internal
title: まとめたHTMLで文書を行き来する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: まとめた HTML
        description: 文書 A（`entry`）・B・C をまとめた HTML。A は文書間のリンクを持たず、B は C へリンクし、目次のマーカーと h2 を 2 つ持つ
      - name: Mock
        description: 差し替える依存は無い（HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: URL の # を付けずに開く
        P-->>R: A と文書の一覧（A が開いている）
        R->>P: 一覧で B を選ぶ
        P-->>R: B
        R->>P: B の目次で 2 つ目の見出しを押す
        P-->>R: B の 2 つ目の見出しへ移る
        R->>P: B の C へのリンクを押す
        P-->>R: C
        R->>P: ブラウザの戻る
        P-->>R: B
        R->>P: ブラウザの戻る
        P-->>R: A
        R->>P: ブラウザの進む
        P-->>R: B
    expected:
      - 開いたとき A が出て、文書の一覧で A が開いている文書として示される（`aria-current`）
      - 一覧で B を選ぶと B が出て、URL が B を指す
      - 目次のリンクで B の中の見出しへ移り、開いている文書は B のまま
      - B のリンクで C が出る
      - 戻るで B、もう一度戻るで A、進むで B が出る
      - 外への要求が 0 件
    test: test_normal
  - name: 正常シナリオ（URL が文書と見出しを指す）
    setup:
      - name: まとめた HTML
        description: 正常シナリオと同じ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: URL の # で B の 2 つ目の見出しを指して開く
        P-->>R: B の 2 つ目の見出し
    expected:
      - B が出て、2 つ目の見出しが画面に入っている
      - 文書の一覧で B が開いている文書として示される
    test: test_normal_when_url_points_heading
  - name: 正常シナリオ（狭い幅で文書の一覧を開く）
    setup:
      - name: まとめた HTML
        description: 正常シナリオと同じ
      - name: 狭い幅
        description: 画面の幅 390px
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開く
        P-->>R: A（文書の一覧は閉じている）
        R->>P: 文書の一覧を開く
        P-->>R: 文書の一覧のパネル
        R->>P: パネルで B を選ぶ
        P-->>R: パネルを閉じ、B
        R->>P: ブラウザの戻る
        P-->>R: A
    expected:
      - 開いたとき A が出て、文書の一覧は閉じている
      - 一覧を開く操作でパネルが開き、B を選ぶとパネルが閉じて B が出る
      - 戻るでパネルではなく A が出る（パネルの開閉が履歴に追加されていない）
      - 横スクロールが出ない
    test: test_normal_when_narrow
  - name: 異常シナリオ（URL が 1 枚に無い文書を指す）
    setup:
      - name: まとめた HTML
        description: 正常シナリオと同じ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: URL の # で 1 枚に無い文書を指して開く
        P-->>R: A
    expected:
      - A が出て、文書の一覧で A が開いている文書として示される
      - ページに例外が出ない
    test: test_error_when_url_points_missing_document
  - name: 正常シナリオ（wide の範囲を持つ文書）
    setup:
      - name: まとめた HTML
        description: 文書 A（`entry`）が `<!-- wide -->` 〜 `<!-- /wide -->` で 8 列の表を囲んだ範囲を持つ、文書 A・B をまとめた HTML
        notes: 画面の幅は 1280px。設定の `theme` の CSS で `--mdmark-content-width` を `640px` にしている
      - name: Mock
        description: 差し替える依存は無い（HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開く
        P-->>R: A と文書の一覧。wide の範囲を本文の列の中で広げる
        R->>P: 文書の一覧で B を選ぶ
        P-->>R: B
    expected:
      - wide の範囲が本文の段落より広く描かれ、左の文書の一覧の列に重なっていない
      - 文書の一覧で B を選べ、B が出る
    test: test_normal_when_wide_range
  - name: 正常シナリオ（図のノードのリンク）
    setup:
      - name: まとめた HTML
        description: 正常シナリオの B に、C を相対パスで指す `click` のリンク先を持つノード 1 つの map の構成図を加えてまとめた HTML
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 文書の一覧で B を選ぶ
        P-->>R: B
        R->>P: B の map の図の C を指すノードを押す
        P-->>R: C
        R->>P: ブラウザの戻る
        P-->>R: B
    expected:
      - ノードを押すと C が出て、URL が C を指す
      - 戻るで B が出る
      - 外への要求が 0 件
    test: test_normal_when_map_node_link
  - name: 正常シナリオ（文書ごとのページの設定）
    setup:
      - name: まとめた HTML
        description: '先頭の行に `<!-- page: {"scheme": "dark"} -->` を持つ文書 A（`entry`）と、マーカーを持たない文書 B をまとめた HTML'
        notes: 設定ファイルは明暗のキーを持たない。ブラウザの配色はライト
      - name: Mock
        description: 差し替える依存は無い（HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開く
        P-->>R: ダークの配色の A
        R->>P: 文書の一覧で B を選ぶ
        P-->>R: 明るい配色の B
        R->>P: ブラウザの戻る
        P-->>R: ダークの配色の A
    expected:
      - 開いたとき、描く先の要素の地の色の計算値がダークの `--mdmark-color-bg` の値
      - B を選ぶと、地の色の計算値が明るい配色の `--mdmark-color-bg` の値になる
      - 戻るで A に戻ると、地の色の計算値がダークの `--mdmark-color-bg` の値に戻る
    test: test_normal_when_page_settings_per_document
    refs:
      - SC-472-33#scenarios[正常シナリオ]
  - name: 正常シナリオ（戻る・進むで離れたときの位置に戻る）
    setup:
      - name: まとめた HTML
        description: 画面の高さの 5 倍より長い文書 A（`entry`）と B をまとめた HTML。A は中ほどの段落に B へのリンクを持ち、B は末尾に A へのリンクを持つ
        notes: 画面の幅は 1280px、高さは 800px
      - name: Mock
        description: 差し替える依存は無い（HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開く
        P-->>R: A の頭
        R->>P: A を B へのリンクが画面に入るまでスクロールし、リンクを押す
        P-->>R: B の頭
        R->>P: B を少しスクロールする
        R->>P: ブラウザの戻る
        P-->>R: A のリンクを押したときの位置
        R->>P: ブラウザの進む
        P-->>R: B の戻るを押したときの位置
        R->>P: B の末尾の A へのリンクを押す
        P-->>R: A の頭
    expected:
      - リンクで B へ移ると、B の頭（縦のスクロール位置が 0）が出る
      - 戻るで A に戻ると、縦のスクロール位置が A のリンクを押したときの値になり、B へのリンクが画面に入っている
      - 進むで B に戻ると、縦のスクロール位置が B で戻るを押したときの値になる
      - B の末尾のリンクで A へ移ると、新しい履歴の項目として A の頭（縦のスクロール位置が 0）が出る
      - URL にスクロール位置が出ない
    test: test_normal_when_back_forward_restore_scroll
  - name: 正常シナリオ（再読み込みで離れたときの位置に戻る）
    setup:
      - name: まとめた HTML
        description: 正常シナリオ（戻る・進むで離れたときの位置に戻る）と同じ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開いて A を中ほどまでスクロールする
        R->>P: ブラウザの再読み込み
        P-->>R: 再読み込みの前の位置の A
    expected:
      - 再読み込みの後、A が出て、縦のスクロール位置が再読み込みの前の値になる
    test: test_normal_when_reload_restore_scroll
  - name: 正常シナリオ（戻る・進むで開閉と選んだタブを戻す）
    setup:
      - name: まとめた HTML
        description: '文書 A（`entry`）が、`<!-- section: {"open": false} -->` で既定で閉じた h2 のセクションと、その中の `group` の無い 2 つのタブを持ち、2 つ目のタブの中に B へのリンクを持つ、文書 A・B をまとめた HTML'
        notes: セクションの中身は画面の高さより長い
      - name: Mock
        description: 差し替える依存は無い（HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開く
        P-->>R: セクションが閉じた A
        R->>P: セクションを開き、2 つ目のタブを選ぶ
        R->>P: 2 つ目のタブの B へのリンクを押す
        P-->>R: B
        R->>P: ブラウザの戻る
        P-->>R: セクションを開き、2 つ目のタブを選んだ A のリンクを押したときの位置
    expected:
      - 戻るで A に戻ると、セクションのボタンの `aria-expanded` が `true` で、中身が `hidden` を持たない
      - 2 つ目のタブの `aria-selected` が `true`
      - 縦のスクロール位置が A のリンクを押したときの値になり、B へのリンクが画面に入っている
    test: test_normal_when_back_restore_folds_and_tabs
  - name: 異常シナリオ（sessionStorage が使えない）
    setup:
      - name: まとめた HTML
        description: 正常シナリオ（戻る・進むで離れたときの位置に戻る）と同じ
      - name: sessionStorage が使えないページ
        description: 開く前に、`window.sessionStorage` を読むと `SecurityError` を投げるように差し替える
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor R as 読者
        participant P as まとめた HTML
        R->>P: 開いて A をスクロールし、B へのリンクを押す
        P-->>R: B の頭
        R->>P: ブラウザの戻る
        P-->>R: A の頭
    expected:
      - 戻るで A が出て、縦のスクロール位置が 0
      - ページに例外が出ない
    test: test_error_when_session_storage_unavailable
lead: 読者が `mdmark build` の 1 枚の HTML を file:// で開き、文書の一覧・文書間のリンク・ブラウザの戻ると進むで文書を行き来し、見出しのアンカーと目次でセクションへ移る。
issue: 9
primary_actor: 読者
trigger: 読者が、受け取った 1 枚の HTML を開く
preconditions:
  - 読者のブラウザが非機能要件『対応ブラウザ』の版以降
success_guarantee: 開くと URL が指す文書（指していなければ `entry` の文書）が出る。文書を移るたびに履歴に追加し、戻る・進むで確認してきた順に行き来できる。一覧のパネルの開閉は履歴に追加しない。戻る・進む・再読み込みで履歴の項目へ戻ったときは、その項目を離れたときの開閉・選んだタブ・スクロール位置から表示し、文書の一覧・文書間のリンクで移ったときは見出しか文書の頭から表示する。外への要求は 0 件。
minimal_guarantee: URL が 1 枚に無い文書を指していても、`entry` の文書を出して読み込める状態にする。離れたときの状態を残せない・読めないときも、見出しか文書の頭から文書を出す。
test_file: tests/e2e/単一ユースケース/まとめたHTMLで文書を行き来する.spec.ts
