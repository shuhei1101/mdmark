id: SC-472-64
visibility: internal
title: "注意書きを記載する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 5 種の注意書きを持つ Markdown
        description: '`> [!NOTE]`・`> [!TIP]`・`> [!IMPORTANT]`・`> [!WARNING]`・`> [!CAUTION]` の引用を 1 つずつ持ち、それぞれの 2 行目に本文の段落を持つ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 引用の 1 行目の種類を読み込む
        M-->>P: 種類ごとの注意書きの枠を描く
        P-->>U: 注意書きを表示
    expected:
      - 5 つの引用が、class `markdown-alert` と種類ごとの class（`markdown-alert-note` など）を持つ枠になっている
      - 各枠に種類ごとのタイトルとアイコンがあり、タイトルの文字で種類が分かる
      - 各枠に本文の段落があり、`[!NOTE]` などの種類の文字が本文に出ていない
    test: test_normal
  - name: 正常シナリオ（閉じた注意書き）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 閉じた注意書きを持つ Markdown
        description: 1 行目が `> [!WARNING]-` で、本文の段落を持つ引用の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 閉じた折り畳みの注意書きを描く
        U->>P: 注意書きのタイトルを押す
        P-->>U: 開いた注意書き
    expected:
      - 描いた直後、注意書きは閉じていて、タイトルに `WARNING` の種類のタイトルが出ている
      - タイトルを押した後、本文の段落が表示されている
    test: test_normal_when_collapsed
  - name: 正常シナリオ（知らない種類）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない種類の注意書きを持つ Markdown
        description: '`> [!FAQ]` の引用を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 知らない種類を NOTE として解釈する
        M-->>P: NOTE の注意書きの枠を描く
        P-->>U: 注意書きを表示
    expected:
      - 引用が class `markdown-alert-note` の枠になっている
      - 枠に本文の段落がある
    test: test_normal_when_unknown_kind
  - name: 正常シナリオ（タイトルを付けた注意書き）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: タイトルを持つ注意書きの Markdown
        description: 1 行目が `> [!TIP] 設定を先に確認する` で、本文の段落を持つ引用の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 種類の後ろの文字をタイトルとして読み込む
        M-->>P: タイトルを持つ TIP の注意書きの枠を描く
        P-->>U: 注意書きを表示
    expected:
      - 引用が class `markdown-alert-tip` の枠になり、TIP のアイコンがある
      - 枠のタイトルが `設定を先に確認する` で、スクリーンリーダーで種類が TIP であることが分かる
      - 本文に `[!TIP]` とタイトルの文字が出ていない
    test: test_normal_when_titled
  - name: 正常シナリオ（開いた折りたたみの注意書き）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 開いた折りたたみの注意書きの Markdown
        description: 1 行目が `> [!NOTE]+ 詳細` で、本文の段落を持つ引用の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 開いた折りたたみの注意書きを描く
        U->>P: 注意書きのタイトルを押す
        P-->>U: 閉じた注意書き
    expected:
      - 描いた直後、注意書きは開いていて、タイトル `詳細` と本文の段落が表示されている
      - タイトルを押した後、本文の段落が表示されていない
    test: test_normal_when_expanded
  - name: 正常シナリオ（入れ子の注意書き）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 入れ子の注意書きの Markdown
        description: '`> [!WARNING]` の引用の中に、`> > [!TIP]` で始まる引用と本文の段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 引用の入れ子ごとに種類を読み込む
        M-->>P: WARNING の枠の中に TIP の枠を描く
        P-->>U: 注意書きを表示
    expected:
      - class `markdown-alert-warning` の枠の中に、class `markdown-alert-tip` の枠がある
      - 2 つの枠のそれぞれに本文の段落があり、`[!WARNING]`・`[!TIP]` の文字が出ていない
    test: test_normal_when_nested
  - name: 正常シナリオ（描き直しても手で開閉した注意書きを保つ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: '`mount` の戻り値の `update` で、本文を差し替えて描き直す'
      - name: 折りたたみの注意書きの Markdown
        description: 1 行目が `> [!NOTE]+ 詳細` の引用と、1 行目が `> [!TIP]- 補足` の引用を並べ、それぞれ本文の段落を持つ文書
      - name: 描き直す Markdown
        description: 2 つの注意書きの本文の段落の文字を書き換え、末尾に 1 行目が `> [!NOTE]- 付録` で本文の段落を持つ引用を追加した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 詳細を開き、補足を閉じた注意書きを描く
        U->>P: 「詳細」と「補足」のタイトルを押す
        P-->>U: 詳細を閉じ、補足を開いた注意書き
        P->>M: 書き換えた Markdown で描き直させる
        M-->>P: 手で変えた開閉のまま描き、追加した付録は閉じて描く
        P-->>U: 書き換えた本文を表示
    expected:
      - 描き直した後、`詳細` の本文の段落が表示されていない
      - 描き直した後、`補足` の書き換えた本文の段落が表示されている
      - 描き直した後、追加した `付録` の本文の段落が表示されていない
    test: test_normal_when_updated_after_toggle
lead: 文書の作成者が GitHub と同じ `> [!NOTE]` などの引用で注意書きを記載すると、mdmark が種類ごとのタイトル・色・アイコンを持つ枠に描く。種類の後ろの文字はタイトルにし、末尾に `-` を付けた注意書きは閉じた、`+` を付けた注意書きは開いた折り畳みにする。注意書きは入れ子にできる。
issue: 4
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 注意・補足・ヒントを本文と見分けて読み込め、色が分からなくても種類が分かる
trigger: 利用側のページが、注意書きを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 注意書きの機能（`callout`）がオン（既定）
success_guarantee: 注意書きが種類ごとのタイトル・色・アイコンを持つ枠になり、GitHub で読み込んでも同じ種類の注意書きとして読み込める。利用側のページが本文を描き直しても、読者が手で開閉した折りたたみの注意書きは保たれる。
minimal_guarantee: 知らない種類を記載しても、注意書きは `NOTE` の枠で描かれ、中身は読み込める。
test_file: tests/e2e/単一ユースケース/注意書きを記載する.spec.ts
