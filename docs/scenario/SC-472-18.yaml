id: SC-472-18
visibility: internal
title: シーケンスを構成図の上で再生する
lead: 読者が、map のシーケンス図を、同じノードを持つ構成図の上で、手順のバーと左右の矢印で選んだ 1 通ずつ繰り返し再生し、メッセージがどのノードからどのノードへ流れるかを読む。
test_file: tests/e2e/単一ユースケース/シーケンスを構成図の上で再生する.spec.ts
primary_actor: 読者
trigger: 読者が、処理の流れを構成図のどこを通るかで追いたくなる
preconditions:
  - 文書に、map の構成図と、補足の `plays_over` でその構成図を指す map のシーケンス図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 選んだメッセージの、構成図とシーケンス図の線に沿って、データの印が送り手から受け手へ流れ続け、帯にメッセージの文が出る。停止すると始めた段へ戻る。
minimal_guarantee: 動きを減らす設定でも、読者が始めた再生のデータの印は流し、停止で止められる。構成図に無い相手のメッセージは、文だけを出して書き方の警告を出す。印の廃止した引数 `play`・`interval` は読まずに、書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 構成図と、構成図のノードと同じ ID の相手を持つシーケンス図（メッセージ 4 つ）を描いたページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        participant D as 構成図
        U->>S: シーケンス図の下の手順のバーの 1 つ目の区切りを押す
        S->>D: メッセージ 1 を構成図の上でも強調する
        D-->>U: 構成図とシーケンス図のメッセージ 1 の線にデータの印を流し、文を出して、停止するまで繰り返す
        U->>S: 右の矢印を押す
        D-->>U: メッセージ 2 へ移って繰り返し再生する
        U->>S: 4 つ目の区切りを押す
        D-->>U: メッセージ 4 へ移り、送り手と受け手が収まる位置と倍率へ図をなめらかに移して繰り返し再生する
        U->>D: 構成図の枠の空いた場所を押す
        D-->>U: 停止し、強調を外す
      ```

      <!-- /map -->
    expected:
      - シーケンス図の下に、開いたときから、メッセージの数（4）に区切った手順のバーと左右の矢印のボタンだけの帯がある。始めると、帯に今のメッセージの文と、補足の `notes` の説明を改行のまま出す
      - 帯で選んだメッセージが、シーケンス図と構成図の両方で強調され、構成図の案内を始めるとシーケンス図の強調が解ける
      - メッセージごとに、送り手と受け手のノードが強調され、データの印が構成図とシーケンス図の線の上を送り手から受け手へ、停止するか別のメッセージへ移るまで繰り返し流れ、帯にメッセージの文が出る。次のメッセージへは自動で進まない
      - 手順のバーの区切りの描き分け、区切りと左右の矢印で移って繰り返し再生する動き、同じ区切りをもう一度押して最初から再生し直す動き、端で反対の端へ回る動き、停止する範囲、矢印キーが、『図を巡回する』の案内と同じ
      - 構成図とシーケンス図の両方で、今のメッセージの線と送り手・受け手の表示は変わらず、ほかが薄くなる
      - メッセージを移すたび（区切り・矢印のボタン・矢印キー）に、構成図の図の枠は送り手と受け手のノードが、シーケンス図の図の枠は今のメッセージの線が収まる位置と倍率へなめらかに移る。図の枠を触ると、次にバーか矢印のボタンを押すまでその図を移さない
      - 帯を操作しても、文書のスクロールの位置が変わらない
      - 停止すると、帯の文と強調が消え、再生を始めた段の図と倍率・スクロールの位置に戻り、帯はバーと矢印だけの状態に戻る
    test: test_normal
  - name: 正常シナリオ（動きを減らす設定）
    setup:
      - name: 図を描いたページ
        description: '正常シナリオと同じ。ブラウザのコンテキストを `prefers-reduced-motion: reduce` で開く'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 手順のバーの区切りを押す
        D-->>U: 送り手と受け手を強調し、線の上にデータの印を流す
      ```

      <!-- /map -->
    expected:
      - 動きを減らす設定でも、データの印が送り手から受け手へ線の上を流れ、送り手と受け手のノードとその間の線が強調される
      - 帯のバー以外の場所を押して停止すると、データの印が止まって消える
      - メッセージを移すたびに、構成図とシーケンス図の図の枠の位置と倍率を時間をかけずに移す
      - 帯に今の番号とメッセージの文が出る
    test: test_normal_when_reduced_motion
  - name: 正常シナリオ（構成図に無い相手がある）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図に、構成図に無い相手から送るメッセージを 1 つ足した文書を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 無い相手のメッセージの区切りを押す
        D-->>U: 強調も動きも出さずに、メッセージの文を出す
      ```

      <!-- /map -->
    expected:
      - シーケンス図の図の枠の上に、構成図に無い相手である旨の書き方の警告がある
      - 無い相手のメッセージでは、構成図のノードが強調されず、帯にメッセージの文が出る
      - ほかのメッセージは正常シナリオと同じく動く
    test: test_normal_when_missing_participant
  - name: 正常シナリオ（印に廃止した引数を持つ）
    setup:
      - name: 図を描いたページ
        description: '正常シナリオのシーケンス図の印に `{"play": "autoplay", "interval": 1}` を持つ文書を描いたページ。シーケンス図は文書の 2 画面目より下にある'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        U->>S: 文書をスクロールしてシーケンス図を画面に入れる
        S-->>U: 再生を始めずに、書き方の警告と、バーと矢印だけの帯を出す
        U->>S: 手順のバーの 2 つ目の区切りを押す
        S-->>U: メッセージ 2 を繰り返し再生する
      ```

      <!-- /map -->
    expected:
      - シーケンス図の図の枠の上に、`play`・`interval` を廃止した旨と、`mdmark upgrade` で削除できる旨の書き方の警告がある
      - シーケンス図が画面に入っても再生が始まらず、帯はバーと矢印だけの状態で出る
      - 区切りを押すと、正常シナリオと同じ 1 周の時間でそのメッセージを繰り返し再生し、`interval` の値で変わらない
    test: test_normal_when_retired_options
tags:
  - name: topic:map
    main: true
  - name: topic:シーケンス
  - name: action:再生
