id: SC-472-2
visibility: internal
title: CSSのテンプレートを配置する
scenarios:
  - name: 正常シナリオ（一覧から選んで配置する）
    setup:
      - name: 端末の設定
        description: 一時フォルダの `settings.yaml` と、テンプレートを 1 つ登録したテンプレートのフォルダ。常駐サーバーを `MDMARK_CONFIG` でこのファイルを指して起動する
      - name: 配置先の作業のフォルダ
        description: '`theme` を持たない `mdmark.config.yaml` を直下に持ち、作業のフォルダはその下の `docs/`'
      - name: Mock
        description: Claude Code の代わりに、起動した常駐サーバーへ HTTP でつなぐ MCP のクライアントを使用する。ツールの引数には、プラグインの PreToolUse のフックを経由して作業のフォルダの絶対パスを入れる
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant T as テンプレートのフォルダ
        participant F as 作業のフォルダ
        C->>S: list_templates
        S->>T: 索引を読み込む
        S-->>C: 名前・説明・タグの一覧
        C->>S: apply_template（名前）
        S->>F: 上へ探して最も近い mdmark.config.yaml を見つける
        S->>F: そのフォルダへ CSS をコピーする
        S-->>C: 配置したパスと theme に記載する値
    expected:
      - '`mdmark.config.yaml` のフォルダに、テンプレートと同じ中身の CSS が配置される'
      - '`apply_template` が、配置したパスと、`mdmark.config.yaml` のフォルダからの相対パスを `theme` に記載する値として返却する'
      - '`mdmark.config.yaml` とテンプレートのフォルダは書き換わらない'
    test: test_normal_when_applying_from_list
  - name: 正常シナリオ（テンプレートが無い）
    setup:
      - name: 端末の設定
        description: 一時フォルダの `settings.yaml`。テンプレートのフォルダは無い
      - name: 配置先の作業のフォルダ
        description: 正常シナリオ（一覧から選んで配置する）と同じ
      - name: Mock
        description: 正常シナリオ（一覧から選んで配置する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant T as テンプレートのフォルダ
        C->>S: list_templates
        S->>T: 索引を探す
        S-->>C: 空の一覧
    expected:
      - '`list_templates` が空の一覧を返却し、エラーにならない'
      - テンプレートのフォルダが作られない
    test: test_normal_when_no_templates
  - name: 正常シナリオ（上書きして配置する）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（一覧から選んで配置する）と同じ
      - name: 同じ名前の CSS を持つ作業のフォルダ
        description: 正常シナリオ（一覧から選んで配置する）のフォルダの `mdmark.config.yaml` の隣に、テンプレートと同じファイル名で中身の違う CSS を配置したもの
      - name: Mock
        description: 正常シナリオ（一覧から選んで配置する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: apply_template（名前・上書きする）
        S->>F: 既にある CSS をテンプレートの CSS で置き換える
        S-->>C: 配置したパスと theme に記載する値
    expected:
      - 配置先の CSS がテンプレートと同じ中身になる
    test: test_normal_when_overwriting
  - name: 異常シナリオ（配置先に同じ名前の CSS がある）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（一覧から選んで配置する）と同じ
      - name: 同じ名前の CSS を持つ作業のフォルダ
        description: 正常シナリオ（上書きして配置する）と同じ
      - name: Mock
        description: 正常シナリオ（一覧から選んで配置する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: apply_template（名前・上書きしない）
        S->>F: 配置先に同じ名前の CSS を見つける
        S-->>C: エラー（同じ名前の CSS があることと、上書きの指定で置き換えられること）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、配置先に同じ名前の CSS があることと、上書きを指定すれば置き換えられることが出る
      - 配置先の CSS が書き換わらない
    test: test_error_when_css_exists
  - name: 異常シナリオ（配置先の設定ファイルが無い）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（一覧から選んで配置する）と同じ
      - name: 設定ファイルの無い作業のフォルダ
        description: そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 正常シナリオ（一覧から選んで配置する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: apply_template（名前・配置先を省く）
        S->>F: 上へ mdmark.config.yaml を探す
        S-->>C: エラー（設定ファイルが無いことと、配置先を指定するか mdmark init で配置できること）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、設定ファイルが無いことと、配置先を指定するか `mdmark init` で設定ファイルを配置できることが出る
      - 作業のフォルダに CSS が配置されない
    test: test_error_when_config_missing
lead: Claude Code が MCP のツールで、テンプレートの一覧から CSS を選び、作業のフォルダの設定ファイルの隣へ配置して、`theme` に記載する値を受け取る。
issue: 164
primary_actor: Claude Code
stakeholders:
  - name: 文書の作成者
    interest: 登録した CSS を、もう一度コピーせずに今のリポジトリで使用できる
  - name: Claude Code
    interest: 説明とタグで CSS を選び、`theme` に記載する値を受け取れる
trigger: 文書の作成者が Claude Code に、使用できる CSS を探して配置するよう頼む
preconditions:
  - Claude Code に mdmark のプラグインを入れ、MCP の常駐サーバーを起動している
success_guarantee: 選んだテンプレートの CSS が作業のフォルダの設定ファイルの隣にあり、`theme` に記載する値が返る。
minimal_guarantee: エラーのときは、作業のフォルダの設定ファイルと CSS、テンプレートのフォルダを書き換えない。
test_file: tests/e2e/単一ユースケース/CSSのテンプレートを配置する.spec.ts
