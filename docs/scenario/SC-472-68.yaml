id: SC-472-68
visibility: internal
title: 目次と見出しのアンカーでセクションへ移る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 目次のマーカーを持つ Markdown
        description: 先頭に `<!-- toc -->` を持ち、`## 導入`・`### 前提`・`## 使用方法` の見出しとそれぞれの段落を持つ、画面より長い文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 見出しに ID とリンクを付け、マーカーの場所に目次を描く
        U->>P: 目次の「使用方法」を押す
        P-->>U: 「使用方法」の見出しへ移る
    expected:
      - マーカーの場所に、`導入`・`前提`・`使用方法` を見出しの階層どおりに入れ子にした目次があり、各項目が `#導入`・`#前提`・`#使い方` を指す
      - 目次の `使用方法` を押した後、URL の末尾が `#使い方` で、`使用方法` の見出しが画面に入っている
      - 各見出しに、見出しの ID を指すリンクがある
    test: test_normal
  - name: 正常シナリオ（GitHub と同じ規則の ID）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 記号と同じ文字の見出しを持つ Markdown
        description: '`## Hello, World!`・`## 使用方法`・`## 使用方法` の見出しを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: GitHub と同じ規則で見出しに ID を付けて描く
        P-->>U: 文書を表示
    expected:
      - 見出しの ID が上から `hello-world`・`使用方法`・`使用方法-1`
    test: test_normal_when_github_ids
  - name: 正常シナリオ（URL にセクションの ID を付けて開く）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: ページの URL の末尾に `#使い方` を付けて開く
      - name: 目次のマーカーを持つ Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: #使い方 付きの URL を開く
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 描いた後に URL の ID の見出しへ移る
        P-->>U: 「使用方法」の見出しを表示
    expected:
      - 描いた後、`使用方法` の見出しが画面に入っている
    test: test_normal_when_opened_with_fragment
  - name: 正常シナリオ（タブの中の見出しへ移る）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: ページの URL の末尾に `#windows-の注意` を付けて開く
      - name: タブの中に見出しを持つ Markdown
        description: '長い段落の後に、`## 導入` とその直後の `<!-- section: {"open": false} -->` を持ち、そのセクションの中に `<!-- tabs -->` 〜 `<!-- /tabs -->` で `### macOS`・`### Windows` を囲んだ文書'
        notes: '`macOS` の中身は `#### macOS の注意` と段落、`Windows` の中身は `#### Windows の注意` と段落'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: #windows-の注意 付きの URL を開く
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ID が選ばれていないタブの中の見出しを指す
        M-->>P: 外側のセクションを開き、Windows のタブを選んでから見出しへ移る
        P-->>U: 「Windows の注意」の見出しを表示
        U->>P: URL の #ID を #macos-の注意 に変える
        M-->>P: macOS のタブを選んでから見出しへ移る
        P-->>U: 「macOS の注意」の見出しを表示
    expected:
      - ページを開いた後、`導入` のセクションが開き、`Windows` のタブの `aria-selected` が `true` で、`Windows の注意` の見出しが画面に入っている
      - URL の `#ID` を `#macos-の注意` に変えた後（`hashchange`）、`macOS` のタブの `aria-selected` が `true` で、`macOS の注意` の見出しが画面に入っている
      - 選ばれたタブの中身だけが表示されている
    test: test_normal_when_fragment_in_tab
  - name: 正常シナリオ（見出しの無い文書）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 見出しの無い Markdown
        description: 段落だけを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 右側の目次を配置せずに描く
        P-->>U: 段落を表示
    expected:
      - 右側の目次と目次を出すボタンが無い
      - 段落が描かれている
    test: test_normal_when_no_headings
  - name: 正常シナリオ（右側の目次をホバーで出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面の幅は 1280px。設定に `side-toc.mode` を記載しない（出し方は既定の `hover`）
      - name: 見出しを持つ Markdown
        description: '`# 手引き`・`## 導入`・`### 前提`・`## 使用方法` の見出しとそれぞれの段落を持つ、画面より長い文書'
        notes: '`<!-- toc -->` のマーカーは記載しない'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 文書と、隠した右側の目次を描く
        U->>P: 画面の右端にポインターを配置する
        P-->>U: 右側の目次を表示
        U->>P: 右側の目次の「使用方法」を押す
        P-->>U: 「使用方法」の見出しへ移る
        U->>P: ポインターを本文へ動かす
        P-->>U: 右側の目次を隠す
    expected:
      - 描いた直後、右側の目次が表示されていない
      - 右端にポインターを配置した後、右側の目次が表示され、`手引き`・`導入`・`前提`・`使用方法` を見出しの階層どおりに入れ子にした項目が `#手引き`・`#導入`・`#前提`・`#使い方` を指す
      - '`使用方法` を押した後、URL の末尾が `#使い方` で、`使用方法` の見出しが画面に入っている'
      - ポインターを本文へ動かした後、右側の目次が表示されていない
      - 本文の中に目次が無い
    test: test_normal_when_side_toc_hovered
  - name: 正常シナリオ（右側の目次をピン止めする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表示
        U->>P: ピン止めのボタンを押す
        U->>P: ポインターを本文へ動かす
        P-->>U: 右側の目次を出し続ける
        U->>P: ピン止めのボタンをもう一度押し、ポインターを本文へ動かす
        P-->>U: 右側の目次を隠す
    expected:
      - ピン止めのボタンを押した後、ボタンの `aria-pressed` が `true`
      - ピン止めした後にポインターを本文へ動かしても、右側の目次が表示されている
      - ピン止めのボタンをもう一度押してポインターを本文へ動かした後、ボタンの `aria-pressed` が `false` で、右側の目次が表示されていない
    test: test_normal_when_side_toc_pinned
  - name: 正常シナリオ（右側の目次をサイドバーで出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
        notes: 設定の `side-toc.mode` は `fixed`
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 文書と、目次を出すボタンを描く
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を出さない
        U->>P: 目次を出すボタン（三点リーダー）を押す
        P-->>U: 右側の目次をサイドバーとして表示
        U->>P: 目次を出すボタンをもう一度押す
        P-->>U: 右側の目次を隠す
    expected:
      - 描いた直後、目次を出すボタンがあり、`aria-expanded` が `false` で、右側の目次が表示されていない
      - 右端にポインターを配置しても、右側の目次が表示されていない
      - 目次を出すボタンを押した後、`aria-expanded` が `true` で、右側の目次が表示され、ポインターを本文へ動かしても表示されている
      - 目次を出すボタンをもう一度押した後、`aria-expanded` が `false` で、右側の目次が表示されていない
    test: test_normal_when_side_toc_fixed
  - name: 正常シナリオ（キーボードで右側の目次を出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: Tab キーでフォーカスを右側の目次の項目へ移す
        P-->>U: 右側の目次を表示
        U->>P: Enter キーで「使用方法」を押す
        P-->>U: 「使用方法」の見出しへ移る
        U->>P: フォーカスを右側の目次の外へ移す
        P-->>U: 右側の目次を隠す
    expected:
      - フォーカスが右側の目次の項目に入った後、右側の目次が表示されている
      - Enter キーで `使用方法` を押した後、URL の末尾が `#使い方` で、`使用方法` の見出しが画面に入っている
      - フォーカスが右側の目次の外へ出た後、右側の目次が表示されていない
    test: test_normal_when_side_toc_focused
  - name: 正常シナリオ（今いるセクションをハイライトする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をサイドバーで出す）と同じ
        notes: 描いた後に目次を出すボタンを押して、右側の目次を出しておく
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
        notes: 各節の段落は、画面の高さより長い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 先頭のセクションの項目をハイライトする
        U->>P: 「使用方法」のセクションまでスクロールする
        M-->>P: 「使用方法」の項目をハイライトする
        U->>P: 「前提」のセクションまで戻る
        M-->>P: 「前提」の項目をハイライトする
    expected:
      - 描いた直後、右側の目次の `手引き` の項目だけが `aria-current` を持つ
      - '`使用方法` のセクションまでスクロールした後、`使用方法` の項目だけが `aria-current` を持つ'
      - '`前提` のセクションまで戻った後、`前提` の項目だけが `aria-current` を持つ'
    test: test_normal_when_current_section_highlighted
  - name: 正常シナリオ（右側の目次から閉じたセクションの中へ移る）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
      - name: 閉じたセクションの中に見出しを持つ Markdown
        description: '長い段落の後に、`## 補足` とその直後の `<!-- section: {"open": false} -->`、そのセクションの中の `### 注意` と段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表示
        U->>P: 右側の目次の「注意」を押す
        M-->>P: 補足のセクションを開いてから見出しへ移る
        P-->>U: 「注意」の見出しを表示
    expected:
      - 右側の目次に、閉じたセクションの中の `注意` の項目がある
      - '`注意` を押した後、`補足` のセクションが開き、見出しのボタンの `aria-expanded` が `true` で、`注意` の見出しが画面に入っている'
      - URL の末尾が `#注意`
    test: test_normal_when_side_toc_into_closed_section
  - name: 正常シナリオ（右側の目次で閉じたセクションの見出しを押す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
        notes: '`mount` の戻り値の `update` で、本文を差し替えて描き直す'
      - name: 入れ子の閉じたセクションを持つ Markdown
        description: '長い段落の後に、`## 補足` とその直後の `<!-- section: {"open": false} -->`、そのセクションの中の `### 注意` とその直後の `<!-- section: {"open": false} -->` と段落、`## 付録` とその直後の `<!-- section: {"open": false} -->` と段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表示
        U->>P: 右側の目次の「注意」を押す
        M-->>P: 補足のセクションと注意のセクションを開いてから見出しへ移る
        P-->>U: 「注意」の見出しと段落を表示
        U->>P: 右側の目次の「付録」を押す
        M-->>P: 付録のセクションを開いてから見出しへ移る
        P-->>U: 「付録」の見出しと段落を表示
        P->>M: 段落の文字を書き換えた Markdown で描き直させる
        M-->>P: 目次で開いた開閉のまま描き直す
        P-->>U: 書き換えた本文を表示
    expected:
      - '`注意` を押した後、`補足` と `注意` のセクションが開き、2 つの見出しのボタンの `aria-expanded` が `true` で、`注意` の段落が表示されている'
      - '`付録` を押した後、`付録` のセクションが開き、見出しのボタンの `aria-expanded` が `true` で、`付録` の段落が表示されている'
      - '`付録` を押した後も、`補足` と `注意` のセクションは開いたまま'
      - URL の末尾が `#付録`
      - 描き直した後も、`補足`・`注意`・`付録` のセクションが開いていて、3 つの見出しのボタンの `aria-expanded` が `true`
    test: test_normal_when_side_toc_opens_own_section
  - name: 異常シナリオ（知らない出し方）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
        notes: 設定の `side-toc.mode` は `left`
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 知らない出し方を hover にする
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表示
    expected:
      - 描いた直後、右側の目次が表示されておらず、目次を出すボタンが無い
      - 右端にポインターを配置した後、右側の目次が表示されている
      - 文書が描かれている
    test: test_error_when_unknown_side_toc_mode
  - name: 正常シナリオ（狭い幅で右側の目次を出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をサイドバーで出す）と同じ
        notes: 画面と描く先の要素の幅は 390px
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 目次を出すボタンを押す
        P-->>U: 右側の目次を表示
        U->>P: 右側の目次の「使用方法」を押す
        P-->>U: 「使用方法」の見出しへ移り、右側の目次を隠す
    expected:
      - 描いた直後、本文の段落が右側の目次に覆われておらず、ページに横スクロールが出ていない
      - 目次を出すボタンを押した後、右側の目次が表示され、その項目が画面の幅に収まっている
      - '`使用方法` を押した後、`使用方法` の見出しが画面に入っている'
      - '`使用方法` を押した後、目次を出すボタンの `aria-expanded` が `false` で、右側の目次が表示されておらず、`使用方法` の段落がどの要素にも覆われていない'
    test: test_normal_when_side_toc_in_narrow_width
  - name: 正常シナリオ（文書の途中で右側の目次をホバーで出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
        notes: 各節の段落は、画面の高さより長い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 文書と、隠した右側の目次を描く
        U->>P: 「使用方法」のセクションまでスクロールし、右端にポインターを配置する
        P-->>U: 画面の上端寄りに右側の目次を表示
        U->>P: ポインターを本文へ動かし、文書の先頭まで戻って右端にポインターを配置する
        P-->>U: 同じ位置に右側の目次を表示
    expected:
      - 右側の目次の上部に「目次」の文字が無く、すべて展開・すべて折りたたむ・目次をピン止めの 3 つのボタンだけがある
      - '`使用方法` のセクションまでスクロールして右端にポインターを配置した後、右側の目次が表示され、その上端が右端の線の位置によらず、画面の上端から `--mdmark-sticky-top` に目次の上の余白を加算した位置にある'
      - 文書の先頭まで戻って右端にポインターを配置した後も、右側の目次の上端がスクロールしたときと同じ位置にある
    test: test_normal_when_side_toc_hovered_after_scroll
  - name: 正常シナリオ（表と重なる位置で右側の目次をホバーで出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
      - name: 幅の広い表を持つ Markdown
        description: '`## 導入`・`## 使用方法` の見出しの間に、`<!-- table: {"kind": "data", "columns": {"数量": {"total": [{"calc": "sum"}]}, "名前": {"pinned": true}}} -->` 〜 `<!-- /table -->` で囲んだ、描く先の要素の幅を越える列を持ち、画面より長い表を配置した文書'
        notes: 表は先頭の列 `名前` と数値の列 `数量` を含む 10 列と 30 行を持ち、見出し行と集計の行の右側のセルが右側の目次の枠の下に重なる。ピン止めした列（`名前`）は表の左端に留まり、右端の枠の下には重ならないため、重なりの順の比較で確認する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 表の見出し行が画面の上端に留まるまでスクロールする
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表の上に重ねて表示
        U->>P: 右側の目次の「使用方法」を押す
        P-->>U: 「使用方法」の見出しへ移る
    expected:
      - 右端にポインターを配置した後、右側の目次の枠の中のどの位置でも、最も手前にある要素が右側の目次の中の要素で、表の見出し行・集計の行・ピン止めした列のセルではない
      - '`使用方法` を押した後、URL の末尾が `#使い方` で、`使用方法` の見出しが画面に入っている'
      - 右側の目次（`aside`）の `z-index` が、表の見出し行・集計の行・ピン止めした列のセルのどの `z-index` より大きい
    test: test_normal_when_side_toc_over_table
  - name: 正常シナリオ（文書の末尾までスクロールしても右側の目次の上端が見切れない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
        notes: '画面の高さは 800px と 500px の 2 通り。描く先の要素を、画面より低くスクロールする要素（`overflow-y: auto`。高さは画面の高さが 800px のとき 600px、500px のとき 375px）の中に配置する場合と、ページ全体でスクロールする場合の 2 通り'
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
        notes: 各節の段落は、画面の高さより長い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        U->>P: 文書の途中までスクロールする
        P-->>U: 右端の線を見えている枠の上端の近くに留める
        U->>P: 文書の末尾までスクロールする
        P-->>U: 右端の線を同じ位置に留める
        U->>P: 右端にポインターを配置する
        P-->>U: 右側の目次を表示
    expected:
      - 文書の途中と末尾のどちらまでスクロールした後も、右端の線の上端が、見えている枠（スクロールする場所）の上端から `--mdmark-sticky-top` と `--mdmark-space` を加算した位置にあり、見えている枠の上端より上に出ていない
      - 文書の途中と末尾のどちらまでスクロールした後も、右端の線の下端が見えている枠の下端より上にある
      - 文書の末尾までスクロールして右端にポインターを配置した後、右側の目次の枠の上端が、見えている枠の上端から `--mdmark-sticky-top` と `--mdmark-space` を加算した位置にある
    test: test_normal_when_side_toc_scrolled_to_end
  - name: 正常シナリオ（描く先の要素が画面より狭いときも右側の目次を画面の右端に出す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ
        notes: '画面の幅は 1600px、高さは 800px。描く先の要素は幅 992px で、左端を画面の左端から 312px の位置に配置する（右端は画面の右端から 296px 内側）。ページ全体でスクロールする場合と、画面の左端に配置した幅 1200px・高さ 600px のスクロールする要素（`overflow-y: auto`。文書が高さを越えて縦のスクロールバーを出す）の中に、幅 800px の描く先の要素を左に詰めて配置する場合の 2 通り'
      - name: 見出しを持つ Markdown
        description: 正常シナリオ（右側の目次をホバーで出す）と同じ文書
        notes: 各節の段落は、画面の高さより長い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 右端の線を画面の右端に配置する
        U->>P: 「使用方法」のセクションまでスクロールし、画面の右端にポインターを配置する
        P-->>U: 画面の右端に右側の目次を表示
        U->>P: ピン止めのボタンを押す
        P-->>U: 右側の目次を本文の右の列に出し続ける
    expected:
      - 2 通りの配置方法のどちらでも、描いた直後と「使用方法」のセクションまでスクロールした後のどちらも、右端の線の右端が描く先の要素の右端より右にある。右端の線の右端から、見えている枠のスクロールバーを除いた右端（ページ全体でスクロールする場合は `document.documentElement.clientWidth`、スクロールする要素の中に配置する場合はその要素の左端に `clientLeft` と `clientWidth` を加算した位置）までの距離が、4 つ（2 通りの配置方法 × 描いた直後とスクロールした後）のどれも等しい
      - 画面の右端にポインターを配置した後、右側の目次の枠が表示され、その右端が右端の線の右端と同じ位置にある
      - スクロールする要素の中に配置する場合、右端の線と右側の目次の枠が、スクロールする要素のスクロールバーの左端より左にある
      - ピン止めのボタンを押した後、右側の目次の枠の右端が描く先の要素の右端より左にあり、本文の列の右端が枠の左端より左にある
    test: test_normal_when_side_toc_at_viewport_edge
lead: mdmark が見出しに GitHub と同じ規則の ID とその ID へのリンクを付け、文書の `<!-- toc -->` の場所と描いた文書の右側に見出しの目次を配置する。読者は目次や見出しのリンクからセクションへ移り、右側の目次で今いるセクションを確認し、セクションの URL を人へ指定する。
issue: 4
primary_actor: 読者
stakeholders:
  - name: 文書の作成者
    interest: GitHub で記載した `#見出し` へのリンクが、mdmark で描いた文書でも同じセクションを指す
trigger: 読者が、文書の目次か見出しのリンクを押す
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込み、`mount` で文書を描いている
  - 目次・見出しのアンカー・右側の目次の機能（`toc`・`anchors`・`side-toc`）がオン（既定）
success_guarantee: |-
  全ての見出しが GitHub と同じ ID を持ち、目次と見出しのリンクがその ID を指す。

  右側の目次は設定の `side-toc.mode` の出し方で出し、今いるセクションの項目だけをハイライトする。
