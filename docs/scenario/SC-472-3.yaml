id: SC-472-3
visibility: internal
title: ClaudeCodeから点検と書き出しを呼ぶ
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ずれの無い作業のフォルダ
        description: 設定・索引と、拡張子が `.mark.md` の文書 2 つ。索引に 2 つとも載り、設定の `build` が 2 つに該当する
      - name: Mock
        description: Claude Code の代わりに、起動した常駐サーバーへ HTTP でつなぐ MCP のクライアントを使用する。ツールの引数には、プラグインの PreToolUse のフックを経由して作業のフォルダの絶対パスを入れる
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: check
        S->>F: 設定・索引・文書を読み込む
        S-->>C: 空のずれの一覧
        C->>S: build_site
        S->>F: build.out に 1 枚の HTML を書き込む
        S-->>C: 書き出したパス・入れた文書の数・警告
    expected:
      - '`check` が空のずれの一覧を返却する'
      - '`build_site` が `build.out` に 1 枚の HTML を書き込み、書き出したパスと入れた文書の数 2 を返却する'
      - 書き出した HTML が、同じフォルダで `mdmark build` を実行して記載した HTML と同じ
    test: test_normal
  - name: 正常シナリオ（ずれがある）
    setup:
      - name: ずれを持つ作業のフォルダ
        description: 正常シナリオのフォルダから文書 1 つを削除し、索引には残したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: check
        S->>F: 設定・索引・文書を読み込む
        S-->>C: ずれの一覧（ファイル・場所・種類・内容）
    expected:
      - ずれの一覧に、消えた文書の行を指す `missing_doc` が 1 件ある
      - 各行がファイル・場所・種類・内容を持ち、内容に修正方法が記載されている
      - 同じフォルダで `mdmark check` を実行したときと同じずれが返る
      - 設定・索引・文書が変わっていない
    test: test_normal_when_drift
  - name: 正常シナリオ（1 文書を書き出す）
    setup:
      - name: ずれの無い作業のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: export_html（文書のパス）
        S->>F: 文書と設定を読み込む
        S->>F: 1 枚の HTML を書き込む
        S-->>C: 書き出したパス
    expected:
      - '`export_html` が 1 枚の HTML を書き込み、書き出したパスを返却する'
      - 書き出した HTML が、同じ文書で `mdmark export` を実行して記載した HTML と同じ
    test: test_normal_when_single_document
  - name: 異常シナリオ（設定ファイルが無い）
    setup:
      - name: 設定ファイルの無い作業のフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: check
        S->>S: 設定ファイルを探す
        S-->>C: エラー（設定ファイルが無いことと、mdmark init で配置できること）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、設定ファイルが無いことと `mdmark init` で配置できることが出る
    test: test_error_when_config_missing
  - name: 正常シナリオ（比べる基準を指定する）
    setup:
      - name: 組で修正する文書を持つ作業のフォルダ
        description: 正常シナリオのフォルダで、索引の 2 つの文書が互いを `change_together` で記載し、全てをコミットした後に 1 つ目の文書の本文だけを書き換えた git のリポジトリ
        notes: 比べる基準には、書き換える前のコミットを指定する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: check（比べる基準: 書き換える前のコミット）
        S->>F: 設定・索引・文書と、基準から変わったファイルを読み込む
        S-->>C: 修正漏れの行を持つずれの一覧
      ```
    expected:
      - ずれの一覧に、2 つ目の文書を指す修正漏れの行が 1 件ある
      - 同じフォルダで同じ基準を指定して `mdmark check` を実行したときと同じずれが返る
      - 設定・索引・文書が変わっていない
    test: test_normal_when_base_given
  - name: 正常シナリオ（取り込み先が無い）
    setup:
      - name: 取り込み先の無いマーカーを持つフォルダ
        description: 『設定と索引を点検する』の正常シナリオ（取り込み先が無い）と同じフォルダ
      - name: Mock
        description: 差し替える依存は無い。MCP のテストのクライアントからツールを呼ぶ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant CC as Claude Code
        participant S as mdmark の MCP サーバー
        W->>CC: 点検を頼む
        CC->>S: check（作業のフォルダ）
        S->>S: mdmark check と同じ処理でずれを集める
        S-->>CC: ずれの一覧
        CC-->>W: 取り込み先が無いずれを伝える
    expected:
      - check が返却するずれの一覧に、`mdmark check` と同じ取り込み先が無いずれが同じ数だけある
      - ツールの一覧で得た check の説明文に、取り込み先が無いことも点検すると記載されている
      - 設定・索引・文書が変わっていない
    test: test_normal_when_include_missing
  - name: 正常シナリオ（文字列とYAMLのキーを指定する）
    setup:
      - name: ずれの無い作業のフォルダ
        description: 正常シナリオと同じ
      - name: 記載の警告を持つ Markdown
        description: 知らないマーカー `<!-- tabz -->` を 1 つ持つ Markdown の文字列と、同じ文字列を `items[0].body` のキーに持つ YAML のファイル `records.yaml`
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: check（Markdown の文字列）
        S-->>C: 記載の警告のずれの一覧
        C->>S: check（records.yaml・items[0].body）
        S->>F: YAML のファイルを読み込み、キーの値を取り出す
        S-->>C: 記載の警告のずれの一覧
    expected:
      - 文字列を指定した `check` が、知らないマーカーのずれを 1 件返す
      - ファイルとキーを指定した `check` が、`records.yaml` を指す同じ種類のずれを 1 件返す
      - 同じ引数で `mdmark check` を実行したときと同じずれが返る
      - 設定・索引・文書と `records.yaml` が変わっていない
    test: test_normal_when_text_and_key
  - name: 正常シナリオ（設定を重ねる）
    setup:
      - name: 重ねる設定を持つ作業のフォルダ
        description: 『文書をHTMLに書き出す』の正常シナリオ（設定を重ねる）と同じフォルダ。作業のフォルダは `docs/`
      - name: 端末の設定
        description: 同じシナリオと同じ `settings.yaml`。常駐サーバーを `MDMARK_CONFIG` でこのファイルを指して起動する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: export_html（文書のパス）
        S->>F: 端末の設定と、作業のフォルダから上の mdmark.config.yaml を読み込んで重ねる
        S->>F: 1 枚の HTML を書き込む
        S-->>C: 書き出したパス
    expected:
      - '`export_html` が 1 枚の HTML を書き込み、書き出したパスを返却する'
      - 書き出した HTML が、同じ文書と同じ端末の設定で `mdmark export` を実行して記載した HTML と同じ
    test: test_normal_when_cascaded
  - name: 正常シナリオ（記法を含む純粋な .md がある）
    setup:
      - name: 記法を含む純粋な .md を持つ作業のフォルダ
        description: 正常シナリオのフォルダの文書 1 つを、表のマーカーを記載した `b.md` にしたもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: check
        S->>F: 設定・索引・文書を読み込む
        S-->>C: ずれの一覧（ファイル・場所・種類・内容）
    expected:
      - ずれの一覧に、`b.md` の表のマーカーの行を指す拡張子の提案が 1 件あり、内容に拡張子を `.mark.md` に変えることが記載されている
      - 同じフォルダで `mdmark check` を実行したときと同じずれが返る
      - 設定・索引・文書が変わっていない
    test: test_normal_when_plain_md_has_marks
  - name: 正常シナリオ（隠す既定と隠さない指定）
    setup:
      - name: ずれの無い作業のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: export_html（文書のパス）
        S->>F: mdmark の名前を別名へ置き換えた HTML を書き込む
        S-->>C: 書き出したパス
        C->>S: build_site
        S->>F: mdmark の名前を別名へ置き換えた 1 枚の HTML を書き込む
        S-->>C: 書き出したパス・入れた文書の数・警告
        C->>S: export_html（文書のパス・隠さない書き出しを指定する）
        S->>F: 名前を置き換えない HTML を書き込む
        S-->>C: 書き出したパス
        C->>S: build_site（隠さない書き出しを指定する）
        S->>F: 名前を置き換えない 1 枚の HTML を書き込む
        S-->>C: 書き出したパス・入れた文書の数・警告
    expected:
      - 引数を指定しない `export_html` が書き出した HTML が、同じ文書で `mdmark export` を実行して書き出した HTML と同じで、class `mdmark` と `--mdmark-version` を持たない
      - 引数を指定しない `build_site` が書き出した HTML が、同じフォルダで `mdmark build` を実行して書き出した HTML と同じで、class `mdmark` と `--mdmark-version` を持たない
      - 隠さない書き出しを指定した `export_html`・`build_site` が書き出した HTML が、同じ指定で `mdmark export`・`mdmark build` を実行して書き出した HTML と同じで、class `mdmark` と `--mdmark-version` を持つ
    test: test_normal_when_traces_hidden_by_default_and_kept_on_request
    refs:
      - SC-472-56#scenarios[正常シナリオ（隠さない書き出しを指定する）]
      - SC-472-76#scenarios[正常シナリオ（隠さない書き出しを指定する）]
lead: Claude Code が MCP のツール `check`・`export_html`・`build_site` で、`mdmark check`・`export`・`build` と同じ点検・1 文書の書き出し・1 枚へのまとめを呼び、結果を受け取る。
issue: 11
primary_actor: Claude Code
trigger: Claude Code が文書と索引を書き込み終え、点検してから配れる構造にしたくなる
preconditions:
  - ビルドしたこのリポジトリの `mdmark serve` で、MCP の常駐サーバーが起動している
success_guarantee: '`check` が `mdmark check` と同じずれの一覧を返却し、`export_html`・`build_site` が CLI と同じ HTML を書き込んで、書き出したパスを返却する。隠さない書き出しの指定も CLI と同じ意味で、指定しなければ mdmark を使用していることを隠す。'
minimal_guarantee: '`check` は設定・索引・文書を書き換えない。設定ファイルが無いときは、何も書き込まずに、無いことと `mdmark init` で配置できることを返却する。'
refs:
  - SC-472-78#
  - SC-472-56#
  - SC-472-76#
test_file: tests/e2e/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.spec.ts
