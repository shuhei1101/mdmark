id: SC-472-72
visibility: internal
title: "表から用語集に用語を入れる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、索引を指定せずに文書を描く HTML
      - name: 用語集の表を持つ Markdown
        description: '`<!-- glossary: term=用語 aliases=別名 meaning=意味 -->` 〜 `<!-- /glossary -->` で、用語 `マーカー`（別名 `マーク、オン・オフのマーカー`、意味 `HTML コメントで記載する指定`）の行を持つ表を囲み、表の後の段落に `マーク` が、別のセクションの段落に `オン・オフのマーカー` が出る文書'
        notes: 別名のセルは「、」で区切り、「・」では区切らない
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: Markdown を指定して描かせる
        M->>M: glossary のマーカーで囲んだ表の列から用語を入れる
        M-->>P: 表を描き、本文の用語に下線を付ける
        U->>P: 下線の付いた単語にポインターを乗せる
        P-->>U: 表の意味のツールチップを表示
    expected:
      - 用語集の表が表として描かれ、表の中の単語には下線が付いていない
      - 段落の `マーク` に破線の下線が付き、ポインターを乗せると `HTML コメントで記載する指定` のツールチップが出る
      - 別のセクションの `オン・オフのマーカー` が 1 つの下線になり、`オン` だけの下線にはならない
      - 本文にマーカーの文字（`<!--`・`glossary`）が出ていない
    test: test_normal
  - name: 正常シナリオ（索引に同じ単語がある）
    setup:
      - name: mdmark を読み込むページ
        description: 索引と描く文書の `id` を指定して文書を描く。ほかは正常シナリオと同じ
      - name: 同じ単語を持つ索引
        description: 用語 `マーカー`（意味 `索引に記載した意味`）を持ち、描く文書を `docs` に持つ索引
      - name: 用語集の表を持つ Markdown
        description: 正常シナリオと同じ表を持ち、表の後の段落に `マーカー` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を指定して描かせる
        M->>M: 表の用語より索引の用語を優先する
        M-->>P: 本文の用語に下線を付ける
        U->>P: 下線の付いた単語にポインターを乗せる
        P-->>U: 索引の意味のツールチップを表示
    expected:
      - 段落の `マーカー` のツールチップが `索引に記載した意味`
      - 表の意味の列の文字はツールチップに出ていない
    test: test_normal_when_index_has_same_term
  - name: 異常シナリオ（表に無い列名）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 列名を誤った Markdown
        description: '`<!-- glossary: term=用語 meaning=説明 -->` で、列が `用語`・`意味` の表を囲んだ文書'
        notes: '`説明` の列は表に無い'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: Markdown を指定して描かせる
        M->>M: 列名が表に無いマーカーの表から用語を入れない
        M-->>P: 表と記載の警告を描く
        P-->>U: 表と警告を表示
    expected:
      - 表が描かれている
      - 表のあたりに、表に無い列名 `説明` と修正方法を記載した記載の警告がある
      - 本文の単語に下線が付いていない
    test: test_error_when_unknown_column
  - name: 正常シナリオ（ほかの文書の表）
    setup:
      - name: mdmark を読み込むページ
        description: 索引・描く文書の `id`・ほかの文書から算出した参照を指定して文書を描く。ほかは正常シナリオと同じ
      - name: 2 つの文書を持つ索引
        description: 文書 `glossary`（用語集のページ）と `guide` を持ち、`terms` を持たない索引
      - name: ほかの文書の本文
        description: '`glossary` の本文が、正常シナリオと同じ用語集の表だけを持つ'
      - name: 描く Markdown
        description: '`guide` の本文。用語集の表を持たず、段落に `マーク` が出る'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を指定して描かせる
        M->>M: ほかの文書の表から入れた用語を照合する
        M-->>P: 本文の用語に下線を付ける
        U->>P: 下線の付いた単語にポインターを乗せる
        P-->>U: 表の意味のツールチップを表示
    expected:
      - '`guide` の段落の `マーク` に破線の下線が付き、ポインターを乗せると `HTML コメントで記載する指定` のツールチップが出る'
    test: test_normal_when_other_document
  - name: 正常シナリオ（やめた言い方の列がある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: やめた言い方の列を持つ Markdown
        description: '`<!-- glossary: term=用語 meaning=意味 avoid=やめた言い方 -->` で、用語 `ワークスペース`（意味 `作業の配置場所`、やめた言い方 `作業場、ワーク場`）の行を持つ表を囲み、表の後の段落に `ワークスペース` と `作業場` が出る文書'
        notes: やめた言い方のセルは別名と同じく「、」で区切る
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: Markdown を指定して描かせる
        M->>M: glossary のマーカーで囲んだ表の用語・意味・やめた言い方の列を読み込む
        M-->>P: 表を描き、本文の用語に下線を、やめた言い方にマーカーを付ける
        U->>P: マーカーの付いた単語にポインターを乗せる
        P-->>U: 代わりの用語と意味のツールチップを表示
    expected:
      - 用語集の表が、やめた言い方の列を含めて表として描かれ、表の中の `作業場`・`ワーク場` にはマーカーが付いていない
      - 段落の `ワークスペース` に破線の下線が付き、ポインターを乗せると `作業の配置場所` のツールチップが出る
      - 段落の `作業場` に、用語の破線の下線と構造で見分けられるマーカーが付き、ポインターを乗せると代わりの用語 `ワークスペース` と意味 `作業の配置場所` のツールチップが出る
      - 記載の警告が出ていない
    test: test_normal_when_avoid_column
  - name: 正常シナリオ（ほかの文書の表のやめた言い方）
    setup:
      - name: mdmark を読み込むページ
        description: 索引・描く文書の `id`・ほかの文書から算出した参照を指定して文書を描く。ほかは正常シナリオと同じ
      - name: 2 つの文書を持つ索引
        description: 文書 `glossary`（用語集のページ）と `guide` を持ち、`terms` を持たない索引
      - name: ほかの文書の本文
        description: '`glossary` の本文が、正常シナリオ（やめた言い方の列がある）と同じ用語集の表だけを持つ'
      - name: 描く Markdown
        description: '`guide` の本文。用語集の表を持たず、段落に `作業場` が出る'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を指定して描かせる
        M->>M: ほかの文書の表のやめた言い方を照合する
        M-->>P: 本文のやめた言い方にマーカーを付ける
        U->>P: マーカーの付いた単語にポインターを乗せる
        P-->>U: 代わりの用語と意味のツールチップを表示
    expected:
      - '`guide` の段落の `作業場` にマーカーが付き、ポインターを乗せると代わりの用語 `ワークスペース` と意味 `作業の配置場所` のツールチップが出る'
    test: test_normal_when_other_document_avoid_column
  - name: 正常シナリオ（索引とエイリアスと表に同じ単語がある）
    setup:
      - name: mdmark を読み込むページ
        description: 索引・描く文書の `id`・読み込んだエイリアスを指定して文書を描く。ほかは正常シナリオと同じ
      - name: 同じ単語を持つ索引
        description: 用語 `マーカー`（意味 `索引に記載した意味`）を持ち、描く文書を `docs` に持つ索引
      - name: 同じ単語を持つエイリアス
        description: '`term` の `マーカー`（説明 `エイリアスに記載した意味`）と、`term` の `マーク`（説明 `エイリアスに記載したマークの意味`）'
        notes: '`マーク` は索引に無く、表の別名にある単語'
      - name: 用語集の表を持つ Markdown
        description: 正常シナリオと同じ表（用語 `マーカー`、別名 `マーク、オン・オフのマーカー`）を持ち、表の後の段落に `マーカー` と `マーク` と `オン・オフのマーカー` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・エイリアス・Markdown を指定して描かせる
        M->>M: 索引の用語、エイリアス、表の用語の順で先の意味を選ぶ
        M-->>P: 本文の用語に下線を付ける
        U->>P: 下線の付いた単語にポインターを乗せる
        P-->>U: 選んだ意味のツールチップを表示
    expected:
      - 段落の `マーカー` のツールチップが `索引に記載した意味`
      - 段落の `マーク` のツールチップが `エイリアスに記載したマークの意味`
      - 段落の `オン・オフのマーカー` のツールチップが表の意味 `HTML コメントで記載する指定`
    test: test_normal_when_aliases_have_same_term
lead: '文書の作成者が本文の表を `<!-- glossary: term=列名 meaning=列名 aliases=列名 -->` 〜 `<!-- /glossary -->` で囲むと、mdmark がその表の用語・意味・別名の列から用語を入れ、本文に出たその単語に意味のツールチップを付ける。'
issue: 5
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 文書の用語集の表に記載した意味を、本文のその場で参照できる
  - name: 文書の作成者
    interest: 索引を持たない文書でも、記載している用語集の表をそのまま使用でき、GitHub でも表として読み込める
trigger: 利用側のページが、用語集の表を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 用語のツールチップの機能（`glossary`）がオン（既定）
success_guarantee: 用語集の表の用語と別名が本文に出ると、表の意味の列の文字をツールチップに出す。同じ単語が索引・指定したエイリアス・表にあるときは、索引の用語 → エイリアス → 描く文書の表 → ほかの文書の表の順で先の意味を出す。やめた言い方の列の言い方には、索引の用語のやめた言い方と同じマーカーを付け、その行の用語の単語と意味を代わりの用語としてツールチップに出す。
minimal_guarantee: マーカーの列名が表に無いときも、表と本文は描かれ、記載の警告がその箇所に出る。
refs:
  - SC-472-65#
  - SC-472-73#
test_file: tests/e2e/単一ユースケース/表から用語集に用語を入れる.spec.ts
