id: SC-477-1
visibility: internal
title: 今の書き方のマーカーをJSONの記載へ移して書き出す
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 今の書き方の文書を持つフォルダ
        description: |-
          手元のバージョンを 1 つ前のマイナーバージョンにした設定・索引と、マーカーを今の書き方（`キー=値`・`+機能`・位置の値）で記載した文書 2 つを持つフォルダ。
          文書は、集計・絞り込み・隠す列を持つ表、タイトル・行番号・行の範囲の強調を持つコードブロックの飾り、タイトルと開いた状態を持つ details の範囲、図の番号、見出しと行の範囲の取り込みのマーカーを持つ。
          どの記載も今の実装が適用している設定だけを持つ
      - name: Mock
        description: 呼んだ CLI のバージョンを目標のバージョンにし、リポジトリの `migrations/next/` の移行の手順を目標のバージョンの手順として使用する
    flow: |-
      flowchart TD
        A[設定と索引を点検する:正常シナリオ（今の書き方のマーカーがある）] --> B[バージョンを上げる:正常シナリオ（文書のマーカーを JSON の記載へ書き換える）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[文書をHTMLに書き出す:正常シナリオ]
        click A "id:SC-472-78#scenarios[正常シナリオ（今の書き方のマーカーがある）]"
        click B "id:SC-472-27#scenarios[正常シナリオ（文書のマーカーを JSON の記載へ書き換える）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-56#scenarios[正常シナリオ]"
    expected:
      - 1 回目の `mdmark check` が、今の書き方のマーカーごとにファイルと行を指し、`mdmark upgrade` での移行を案内する行を出す
      - '`mdmark upgrade` の後、文書の全てのマーカーが名前の後ろの JSON のオブジェクトで記載され、マーカーの外の本文は変わっていない'
      - 移行の後の 2 回目の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 移行の後に書き出した HTML の描いた文書が、移行の前の文書を書き出した HTML の描いた文書と同じ表・コードブロック・details・図の番号・取り込みになる
    test: test_normal
    uses:
      - SC-472-78#scenarios[正常シナリオ（今の書き方のマーカーがある）]
      - SC-472-27#scenarios[正常シナリオ（文書のマーカーを JSON の記載へ書き換える）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-56#scenarios[正常シナリオ]
  - name: 正常シナリオ（書き換えない記載がある）
    setup:
      - name: 書き換えない記載を持つフォルダ
        description: |-
          正常シナリオのフォルダの文書に、今の実装が適用していない記載（`+total` の無い表の `total=`）と、拡張のマーカーの今の書き方の記載を加えたもの。
          設定の `extensions` に、そのマーカーの拡張のモジュールを記載する
      - name: 手で修正した文書
        description: 移行の後に、文書の作成者が移行の報告に挙がった 2 か所を JSON のオブジェクトで記載し直したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      flowchart TD
        A[バージョンを上げる:正常シナリオ（書き換えない記載を移行の報告に挙げる）] --> B[設定と索引を点検する:正常シナリオ（今の書き方のマーカーがある）]
        B --> C[設定と索引を点検する:正常シナリオ]
        C --> D[拡張を登録してマーカーを追加する:正常シナリオ]
        click A "id:SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]"
        click B "id:SC-472-78#scenarios[正常シナリオ（今の書き方のマーカーがある）]"
        click C "id:SC-472-78#scenarios[正常シナリオ]"
        click D "id:SC-472-49#scenarios[正常シナリオ]"
    expected:
      - '`mdmark upgrade` の出力の移行の報告に、適用されていない `total=` の記載と、拡張のマーカーの記載が、ファイルと行と理由つきで挙がる。どちらも文書の中では書き換わっていない'
      - 手で修正する前の `mdmark check` が、報告に挙がった 2 か所を今の書き方のマーカーとして指す
      - 手で修正した後の `mdmark check` がずれ 0 件で終了コード 0 を返却する
      - 手で修正した後に描いた文書で、拡張のマーカーが拡張の描く処理で描かれる
    test: test_normal_when_unconverted
    uses:
      - SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]
      - SC-472-78#scenarios[正常シナリオ（今の書き方のマーカーがある）]
      - SC-472-78#scenarios[正常シナリオ]
      - SC-472-49#scenarios[正常シナリオ]
lead: 文書の作成者が、今の書き方（`キー=値`・`+機能`・位置の値）でマーカーを記載した文書を、点検の案内に従って移行の手順で JSON の記載へ書き換え、移行の報告に挙がった記載を手で修正し、書き換える前と同じ描画のまま点検に合格して書き出す。
issue: 451
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 手で書き換えずに今の文書のマーカーを JSON の記載へ移せ、移せなかった記載だけを手で修正できる
  - name: 読者
    interest: 移行の前と同じ表・コードブロック・範囲で文書を参照できる
trigger: 文書の作成者が、マーカーを JSON で記載するバージョンの mdmark に上げる
preconditions:
  - 文書の作成者の手元に Node 24 以降がある
success_guarantee: 文書の全てのマーカーが JSON のオブジェクトで記載され、点検がずれ 0 件で通り、書き出した HTML の描いた文書が移行の前と同じになる。
minimal_guarantee: 移行の手順が書き換えない記載は、文書の中で書き換えずにファイルと行と理由を移行の報告に挙げる。移行の前の文書は、移行のコピーのフォルダに残る。
decisions:
  - D-312
  - D-335
test_file: tests/e2e/複合ユースケース/今の書き方のマーカーをJSONの記載へ移して書き出す.spec.ts
