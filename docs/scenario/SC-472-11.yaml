id: SC-472-11
visibility: internal
title: mermaidの図を描く
lead: mdmark が、言語 `mermaid` のコードブロックを図の枠に入れて描く。map が描ける種類は補足の無い map の図に、それ以外の種類は mdmark の外観のテーマの mermaid の図にする。mermaid のライブラリは、map が描けない種類のコードブロックがある文書のときだけ読み込む。
test_file: tests/e2e/単一ユースケース/mermaidの図を描く.spec.ts
primary_actor: mdmark を使用するアプリのページ
stakeholders:
  - name: 読者
    interest: ほかのツールで記載した mermaid の図を、mdmark のほかの図と同じ外観と操作で読み込める
  - name: 文書の作成者
    interest: mermaid のコードブロックを修正せずに、そのまま図にできる
  - name: 利用側のアプリの開発者
    interest: mermaid を使用しない文書と、map が描ける種類のコードブロックだけを持つ文書では、mermaid を読み込む時間と通信が増えない
trigger: 利用側のページが、言語 `mermaid` のコードブロックを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
success_guarantee: mermaid のコードブロックが、map が描ける種類は map の図、それ以外の種類は mdmark の外観のテーマの mermaid の図として、図の枠に入って描かれる。
minimal_guarantee: mermaid を読み込めない・記法を解釈できないコードブロックは、コードブロックのまま残り、ほかの本文と図は描かれる。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
        notes: 設定の `mermaid` の読み込み先は既定（jsDelivr のバージョンを固定した URL）のまま
      - name: mermaid のコードブロックを持つ Markdown
        description: 段落の間に、言語 `mermaid` の flowchart・sequenceDiagram・gantt のコードブロックを 1 つずつ持つ文書
        notes: flowchart は front matter の `title` を持ち、sequenceDiagram は `actor` を持つ。gantt は map が描けない種類
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` と mermaid の本体と chunk を jsDelivr と同じパスで返却する手元の応答に差し替える。mermaid への要求を数える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as mermaid
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 言語 mermaid のコードブロックを集め、map が描ける種類と描けない種類に分ける
        M->>M: flowchart と sequenceDiagram を、補足の無い map の図として描く
        M->>X: 本体を要求
        X-->>M: 本体と、gantt の chunk
        M->>M: 描く先の要素の CSS 変数からテーマを作る
        M-->>P: gantt の場所に、図の枠に入れた mermaid の図を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - mermaid の本体への要求が 1 件（gantt の分だけ読み込む）
      - 3 つのコードブロックの場所に、それぞれ図の枠があり、コードブロックの文字が出ていない
      - flowchart と sequenceDiagram の図の枠は map の図で、同じ Mermaid を補足の無い map の範囲で囲んだ文書と同じノード・線・参加者とラベルで描かれる
      - flowchart の図の枠のタイトルが front matter の `title` の文字
      - sequenceDiagram の actor が、設定に `map.kinds.actor` が無くても人のアイコンで描かれる。front matter の `title` を持たない sequenceDiagram の図の枠のタイトルが「シーケンス図」
      - gantt の図の枠には mermaid の SVG の図があり、タスクの棒の塗りと文字の色が、描く先の要素の CSS 変数の値と一致する
      - 図の文字の書体が、描く先の要素の本文の書体と一致する
      - コードブロックの前後の段落が描かれている
    test: test_normal
  - name: 正常シナリオ（mermaid のコードブロックが無い）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: mermaid のコードブロックを持たない Markdown
        description: 言語 `ts` のコードブロックと段落だけを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: mermaid を読み込まずに本文を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - mermaid への要求が 0 件
      - '`ts` のコードブロックと段落が描かれている'
    test: test_normal_when_no_mermaid
  - name: 正常シナリオ（ダークの配色）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 'OS の配色はダーク（`prefers-color-scheme: dark`）'
      - name: map が描けない種類の mermaid のコードブロックを持つ Markdown
        description: 言語 `mermaid` の gantt のコードブロックを 1 つ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 暗い配色の CSS 変数からテーマを作る
        M-->>P: 暗い配色の図を描く
        P-->>U: 文書を表示
        U->>P: OS の配色を明るいに切り替える
        P->>M: 配色の変化
        M-->>P: 明るい配色の CSS 変数で図を再描画する
        P-->>U: 明るい配色の図を表示
      ```

      <!-- /map -->
    expected:
      - 開いたとき、gantt のタスクの棒の塗りと文字の色が、暗い配色の CSS 変数の値と一致する
      - OS の配色を明るいに切り替えると、タスクの棒の塗りと文字の色が明るい配色の CSS 変数の値になる
      - 再描画しても、mermaid の本体への要求が増えない
    test: test_normal_when_dark
  - name: 正常シナリオ（テーマを設定で変える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 設定の `mermaid` で、テーマを mermaid の `neutral` にし、gantt のタスクの塗り `taskBkgColor` を上書きする。キーの構造はインターフェース定義で決める
      - name: mermaid のコードブロックを持つ Markdown
        description: 言語 `mermaid` の gantt と flowchart のコードブロックを 1 つずつ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: テーマを変えた設定と Markdown を指定して描かせる
        M-->>P: 設定のテーマと上書きした変数で図を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - gantt のタスクの棒の塗りが、設定で上書きした `taskBkgColor` の色
      - gantt のタスクの棒の枠線の色が、mermaid の `neutral` テーマの値で、描く先の要素の CSS 変数の値ではない
      - flowchart は map の図で、ノードの色が設定の `mermaid` のテーマに左右されない
    test: test_normal_when_theme_configured
  - name: 正常シナリオ（機能をオフにする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: mermaid の機能を解除する Markdown
        description: '先頭に `<!-- features: {"mermaid": false} -->` を持ち、言語 `mermaid` の flowchart のコードブロックを 1 つ持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: mermaid を読み込まず、コードブロックのまま描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - mermaid への要求が 0 件
      - flowchart のソースが、map の図にならず、ほかの言語と同じコードブロックとして出ている
      - 本文にマーカーの文字が出ていない
    test: test_normal_when_disabled
  - name: 異常シナリオ（mermaid を読み込めない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: mermaid のコードブロックを持つ Markdown
        description: 言語 `mermaid` の gantt と flowchart のコードブロックを 1 つずつ持つ文書
      - name: Mock
        description: mermaid の本体への要求が 404 を返却する。ほかは正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as mermaid
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: 本体を要求
        X-->>M: 404
        M-->>P: コードブロックの前に通知ブロックを配置し、コードブロックのまま描く
        P-->>U: 通知ブロックと本文を表示
      ```

      <!-- /map -->
    expected:
      - gantt のコードブロックの前に、mermaid を読み込めないことを記載した通知ブロックがあり、gantt のソースがコードブロックのまま出ている
      - flowchart は mermaid を読み込めなくても、map の図として描かれている
      - コードブロックの前後の段落が描かれている
    test: test_error_when_mermaid_not_found
  - name: 異常シナリオ（記法を解釈できない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 解釈できない mermaid を持つ Markdown
        description: 言語 `mermaid` のコードブロックを 2 つ持ち、1 つ目は図の種類の行が無い（mermaid が解釈できない）、2 つ目は map が描けない種類の gantt
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        participant X as mermaid
        P->>M: 設定と Markdown を指定して描かせる
        M->>X: 本体を要求
        X-->>M: 本体
        M->>X: 1 つ目のソースを描かせる
        X-->>M: 解釈できないエラー
        M->>X: 2 つ目のソースを描かせる
        X-->>M: SVG
        M-->>P: 1 つ目は記載の警告とコードブロック、2 つ目は図を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - 1 つ目のコードブロックの前に、mermaid が解釈できなかった理由を記載した記載の警告があり、ソースがコードブロックのまま出ている
      - 2 つ目のコードブロックの場所に、図の枠と SVG の図がある
      - mermaid が文書の中に出すエラーの図が無い
    test: test_error_when_syntax_invalid

  - name: 正常シナリオ（map の範囲の中の mermaid のブロック）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: map の範囲と mermaid のコードブロックを持つ Markdown
        description: map の範囲の中に flowchart の mermaid のブロックを 1 つ持ち、範囲の外に flowchart の mermaid のコードブロックを 1 つ持つ文書と、map の範囲の中にだけ mermaid のブロックを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 範囲の中のブロックは範囲の引数と補足で、範囲の外のコードブロックは補足の無い map の範囲として描く
        M-->>P: どちらも map の図を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - どちらの文書も、mermaid の本体への要求が 0 件
      - 範囲の中のブロックは、範囲の引数と補足を適用した map の図として描かれる
      - 範囲の外のコードブロックは、補足の無い map の図として描かれる
    test: test_normal_when_inside_map
  - name: 正常シナリオ（click の行の URL でノードをリンクにする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: click の行を持つ mermaid のコードブロックの Markdown
        description: 言語 `mermaid` の flowchart と classDiagram のコードブロックを 1 つずつ持つ文書。flowchart のノードに `click {ノード} href "{URL}"`・`click {ノード} "{URL}"`・`click {ノード} href "{URL}" _blank`・`click {ノード} href "javascript:alert(1)"`・`click {ノード} call show()` の行を、classDiagram のクラスに `click {クラス} href "{URL}"`・`link {クラス} "{URL}"`・`click {クラス} href "{URL}" _blank`・`click {クラス} href "javascript:alert(1)"`・`click {クラス} call show()` の行を 1 つずつ持つ
        notes: URL は相対パス `./a.md`・`#` のアンカー付きのパス `../b.md#c`・`https://example.com/` を使う。classDiagram には `click {クラス} "{URL}"` の文法が無く、`href` を省いた形は `link {クラス} "{URL}"` で記載する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: flowchart と classDiagram の click・link の行から URL を取り出し、許可する URL のノードをリンクにする
        M-->>P: 図の枠に入れた map の図を描く
        P-->>U: 文書を表示
        U->>P: リンクのノードを押す
        P-->>U: 本文のリンクと同じく、同じタブで URL を開く
      ```

      <!-- /map -->
    expected:
      - '`href` の形・`href` を持たない形（classDiagram は `link` の行）・後ろに `_blank` を持つ形のノードが、それぞれ `href` が記載した URL の文字のままのリンクの中にあり、リンクは `target` を持たない'
      - '`javascript:` の URL とコールバックの行のノードはリンクの中に無く、ノードとして描かれている'
      - リンクのノードを押すと、同じタブで URL を開く。ページが本文の要素に置いたクリックのイベントの処理が、押したリンクを受け取る
      - リンクのノードは Tab でフォーカスでき、Enter で URL を開く
      - click の行を持たないノードはリンクの中に無い
    test: test_normal_when_click_url
  - name: 正常シナリオ（シーケンス図の参加者の行を留める）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 縦に長いシーケンス図の mermaid のコードブロックを持つ Markdown
        description: map の範囲の外に言語 `mermaid` の sequenceDiagram のコードブロックを 1 つ、map の範囲に同じ sequenceDiagram を 1 つ持つ文書。図の下にも段落が続き、文書が縦にスクロールできる
        notes: 参加者は actor 1 つと participant 3 つ。メッセージは 30 本。拡大のボタンを 2 回押した倍率で、図の高さが表示する枠の高さより大きい
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant D as シーケンス図
        P->>D: 設定と Markdown を指定して描かせる
        D-->>U: 図の枠に入れたシーケンス図を表示
        U->>D: 右上の拡大のボタンを 2 回押し、図の余白を押したまま上へ動かす
        D-->>U: 参加者の行を表示する枠の上端に留めたまま、メッセージを動かす
        U->>D: 図の余白を押したまま下へ動かし、一番上へ戻す
        D-->>U: 参加者の行を図の中の元の位置に戻す
        U->>P: 文書を下へスクロールし、図の上端を画面の外へ出す
        D-->>U: 参加者の行を画面の上端に留める
        U->>P: 図の下端が画面の上端を過ぎるまでスクロールする
        D-->>U: 参加者の行を図と一緒に画面の外へ出す
      ```

      <!-- /map -->
    expected:
      - 拡大して図の余白を上へドラッグしても、4 つの参加者の名前が表示する枠の上端に見えている
      - 留まった参加者の行の下を、メッセージとライフラインが通り過ぎ、留まった行の後ろのメッセージの文字が透けて見えない
      - 図の余白を下へドラッグして一番上へ戻すと、参加者の行が図の中の元の位置に戻る
      - 文書をスクロールして図の上端が画面の外へ出ても、図の下端が画面の上端を過ぎるまでは、参加者の行が画面の上端（利用側が指定した `--mdmark-sticky-top` の位置）に見えている
      - 図の下端が画面の上端を過ぎると、参加者の行も図と一緒に画面の外へ出る
      - map の範囲の sequenceDiagram も、純粋な Mermaid と同じく参加者の行を留める
      - 参加者の行を留めている間も、表示する枠の左右の枠線が欠けない
      - 留まった参加者の行の文字も、スクロールする前と同じくスクリーンリーダーが読み上げる
    test: test_normal_when_sequence_heads_stuck
  - name: 正常シナリオ（map が描ける種類だけの文書）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: map が描ける種類の mermaid のコードブロックだけを持つ Markdown
        description: map の範囲の外に、言語 `mermaid` の flowchart と sequenceDiagram のコードブロックを 1 つずつ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 2 つのコードブロックを、補足の無い map の範囲として描く
        M-->>P: mermaid を読み込まずに、図の枠に入れた map の図を描く
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
      - mermaid への要求が 0 件
      - 2 つのコードブロックの場所に、それぞれ map の図の枠があり、コードブロックの文字が出ていない
    test: test_normal_when_only_map_kinds
  - name: 正常シナリオ（actor のアイコンを設定で変える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 設定の `map.kinds.actor` で、アイコンを lucide の `bot` にする
      - name: sequenceDiagram の mermaid のコードブロックを持つ Markdown
        description: map の範囲の外に、`actor` を 1 つ持つ言語 `mermaid` の sequenceDiagram のコードブロックを 1 つ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: map.kinds.actor を持つ設定と Markdown を指定して描かせる
        M-->>P: actor を設定の種類で描いた map の図
        P-->>U: 文書を表示
      ```

      <!-- /map -->
    expected:
