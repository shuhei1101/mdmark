id: SC-472-20
visibility: internal
title: ステップ・ファイルツリー・バッジで本文を組む
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 3 つの部品を持つ Markdown
        description: '`<!-- steps -->` 〜 `<!-- /steps -->` で囲んだ 3 項目の番号付きリスト、`src/` の下に `index.ts` と `parts/` を持つ罫線を記載した言語 `tree` のコードブロック、行内のコード `` `badge:v0.1.0` `` を持つ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 手順・ファイルツリー・バッジを描く
        P-->>U: 文書を表示
    expected:
      - 番号付きリストが手順になり、3 つの項目に 1〜3 の番号が出ている
      - コードブロックが入れ子のツリーになり、`src/` と `parts/` がフォルダ、`index.ts` がファイルとして出ている
      - 行内のコードが、文言 `v0.1.0` の札になっている（`badge:` の頭は出ていない）
      - 色分けのライブラリへの要求が 0 件（言語 `tree` のコードブロックは色分けの対象にならない）
    test: test_normal
  - name: 正常シナリオ（バッジの記載方法を見せる）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 打ち消したバッジを持つ Markdown
        description: 行内のコード `` `badge\:v0.1.0` `` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 打ち消しの \ を削除した行内のコードを描く
        P-->>U: 文書を表示
    expected:
      - 行内のコードが `badge:v0.1.0` の文字のまま出ていて、札になっていない
    test: test_normal_when_badge_escaped
  - name: 異常シナリオ（ファイルツリーに読み込めない行がある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 読み込めない行を持つファイルツリーの Markdown
        description: 上の行より 2 階層深い項目を持つ言語 `tree` のコードブロックの文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 罫線の階層を読み込めない行がある
        M-->>P: 記載の警告と、元のコードブロックを描く
        P-->>U: 記載の警告とコードブロックを表示
    expected:
      - コードブロックの上に、読み込めない行の行番号を記載した記載の警告がある
      - コードブロックが元の罫線の文字のまま出ている
    test: test_error_when_tree_line_invalid
  - name: 異常シナリオ（番号付きリストの無いステップの範囲）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 番号付きリストの無いステップの範囲を持つ Markdown
        description: '`<!-- steps -->` 〜 `<!-- /steps -->` で、番号の無いリストだけを囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 手順にする番号付きリストが無い
        M-->>P: 記載の警告と、範囲の中身をそのまま描く
        P-->>U: 記載の警告とリストを表示
    expected:
      - 範囲の上に、手順にする番号付きリストが無いことを記載した記載の警告がある
      - 範囲の中のリストが、記載したとおりの番号の無いリストで表示されている
    test: test_error_when_steps_without_ordered_list
  - name: 正常シナリオ（中身の無い badge:）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: '中身の無い badge: を持つ Markdown'
        description: 行内のコード `` `badge:` `` と、`badge:` の後ろが空白だけの行内のコードを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: badge: の後ろが空か空白だけのためバッジにしない
        M-->>P: 行内のコードをそのまま描く
        P-->>U: 文書を表示
    expected:
      - 2 つの行内のコードが札にならず、記載したとおりの文字（`badge:` とその後ろの空白）の行内のコードで出ている
      - 中身の無い札が無く、記載の警告も出ていない
    test: test_normal_when_badge_empty
  - name: 正常シナリオ（折りたたみに入れたステップ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 折りたたみのステップを持つ Markdown
        description: '`<!-- steps: {"collapse": {"open": false}} -->` で 2 項目の番号付きリストを囲んだ範囲と、`<!-- steps: {"collapse": {"open": true, "title": "準備"}} -->` で 3 項目の番号付きリストを囲んだ範囲を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 1 つ目の手順を閉じた折りたたみ、2 つ目を開いた折りたたみに入れて描く
        U->>P: 1 つ目の折りたたみの見出しを押す
        P-->>U: 開いた手順
    expected:
      - 1 つ目の折りたたみの見出しが `手順（2 ステップ）` で、描いた直後は手順が表示されていない
      - 2 つ目の折りたたみの見出しが `collapse.title` の「準備」で、描いた直後から 3 つの手順が表示されている
      - 1 つ目の見出しを押した後、手順に 1・2 の番号が出ている
    test: test_normal_when_steps_folded
  - name: 異常シナリオ（ステップの読み込めない指定）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 読み込めない指定のステップを持つ Markdown
        description: '`<!-- steps: {"collapse": {"open": "no"}} -->`・`<!-- steps: {"fold": true} -->`・`<!-- steps: {"collapse": {"title": "準備"}} -->` で、それぞれ 2 項目の番号付きリストを囲んだ範囲を並べた文書'
        notes: 知らないキー `fold` は、描くときは無視し、点検（`mdmark check`）が通知する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: collapse.open の型が合わない指定を適用せず、知らないキーを無視する
        M-->>P: 記載の警告と、読み込めた指定だけを適用した手順を描く
        P-->>U: 記載の警告と手順を表示
    expected:
      - 1 つ目の範囲の上に、`collapse.open` には真偽（`true`・`false`）を記載することを記載した記載の警告がある
      - 2 つ目と 3 つ目の範囲の上に記載の警告が無い
      - 1 つ目の手順は `collapse.open` を適用せず、既定の閉じた折りたたみに入る。2 つ目の手順は折りたたみに入らずに描かれ、3 つ目の手順は見出しが「準備」の閉じた折りたたみに入る
    test: test_error_when_steps_option_invalid
  - name: 正常シナリオ（ファイルツリーに注釈を記載する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 注釈を持つファイルツリーの Markdown
        description: '`<!-- tree: {"depth": "all"} -->` の後ろに、`mdmark/` の下へ `src/ #ソース`・`` index.ts # 入口の `mount` ``・`` README.md # **必読** `badge:新規` ``・`C#/`・`#notes.md`・`...` を罫線で記載した言語 `tree` のコードブロックを持つ文書'
        notes: '`index.ts` は `src/` の下。そのほかは `mdmark/` の直下'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 項目の名前と注釈を分ける
        M-->>P: 注釈を列に統一し、拡張子ごとのアイコンを付けたツリーを描く
        P-->>U: 文書を表示
    expected:
      - '`src/`・`index.ts`・`README.md` の項目の名前に `#` とその後ろが含まれず、注釈が項目の右に出ている'
      - 3 つの注釈の左端が、階層の深さによらず同じ位置に一致している
      - 注釈の中の `mount` が行内のコード、`必読` が太字、`badge:新規` が文言 `新規` の札で描かれている
      - '`C#/` が名前 `C#/` のフォルダ、`#notes.md` が名前 `#notes.md` のファイルとして出ていて、注釈を持たない'
      - '`index.ts` と `README.md` のアイコンが、拡張子ごとに違うアイコンになっている'
      - '`...` の項目が、ファイルでもフォルダでもない「ほかにもある」の項目として出ていて、スクリーンリーダーでもそう知らされる'
    test: test_normal_when_tree_annotated
  - name: 正常シナリオ（ファイルツリーのフォルダを開閉する）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 入れ子の深いファイルツリーの Markdown
        description: 'マーカーの無い言語 `tree` のコードブロックと、`<!-- tree: {"depth": 2} -->` の後ろの言語 `tree` のコードブロックを並べた文書。どちらも `app/` の下に `src/`、その下に `parts/`、その下に `tree.ts` を持つ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 1 つ目はルートだけ、2 つ目は 2 階層まで開いたツリーを描く
        U->>P: 1 つ目のツリーの src/ の名前を押す
        P-->>U: src/ を開いたツリー
        U->>P: 1 つ目のツリーの app/ のアイコンを Shift を押しながら押す
        P-->>U: app/ と入れ子を全て閉じたツリー
        U->>P: もう一度 Shift を押しながら app/ のアイコンを押す
        P-->>U: 入れ子を全て開いたツリー
    expected:
      - 描いた直後、1 つ目のツリーは `app/` だけが開き、`src/` が閉じて `parts/` が表示されていない
      - 描いた直後、2 つ目のツリーは `app/` と `src/` が開き、`parts/` が閉じて `tree.ts` が表示されていない
      - '`src/` の名前を押した後、`parts/` が表示され、`src/` の開閉のボタンの `aria-expanded` が `true`'
      - Shift を押しながら押すたびに、`app/` の入れ子のフォルダが全て閉じ、次に全て開いて `tree.ts` が表示される
      - フォルダの開閉は、フォーカスして Enter でもできる
    test: test_normal_when_tree_folders_toggled
  - name: 正常シナリオ（ASCII の罫線のファイルツリー）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: ASCII の罫線の Markdown
        description: '`tree --charset=ascii` の出力のように、`|-- `・`` `-- ``・`|   ` で `src/` の下に `index.ts` と `parts/` を書き込んだ言語 `tree` のコードブロックを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ASCII の罫線を今の罫線と同じ階層で読み込む
        M-->>P: 入れ子のツリーを描く
        P-->>U: 文書を表示
    expected:
      - コードブロックが入れ子のツリーになり、`src/` と `parts/` がフォルダ、`index.ts` がファイルとして出ている
      - 項目の名前に `|`・`` ` ``・`--` が含まれていない
      - 記載の警告は出ていない
    test: test_normal_when_tree_ascii
  - name: 正常シナリオ（ファイルツリーをコピーする）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 注釈を持つファイルツリーの Markdown
        description: 正常シナリオ（ファイルツリーに注釈を記載する）のコードブロックを、マーカーを付けずに持つ文書
      - name: クリップボードの権限
        description: ページにクリップボードへの書き込みと読み取りを許す
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: コピーボタンを持つツリーを描く
        U->>P: コピーボタンを押す
        M->>M: 元の罫線のテキストをクリップボードへ書き込む
        P-->>U: コピーしたことを通知する
    expected:
      - クリップボードの中身が、コードブロックに書き込んだ罫線・注釈を含むテキストと一致する（閉じたフォルダの中の行も含む）
      - コピーしたことがボタンの表示とスクリーンリーダーで知らされる
    test: test_normal_when_tree_copied
  - name: 異常シナリオ（ファイルツリーをクリップボードに書き込めない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: ファイルツリーの Markdown
        description: 正常シナリオと同じ言語 `tree` のコードブロックを持つ文書
      - name: クリップボードの権限
        description: ページにクリップボードへの書き込みを許さない
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: コピーボタンを持つツリーを描く
        U->>P: コピーボタンを押す
        M->>M: クリップボードへの書き込みが拒まれる
        P-->>U: コピーする中身を選択したパネル
    expected:
      - コピーできなかったことと手でコピーできることが知らされ、スクリーンリーダーでも知らされる
      - パネルの中に、元の罫線のテキストが全て選択された状態で出ている
      - パネルは閉じるボタンと Esc で閉じ、フォーカスがコピーボタンへ戻る
    test: test_error_when_tree_clipboard_denied
  - name: 異常シナリオ（ファイルツリーの読み込めない depth）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 読み込めない depth の Markdown
        description: '`<!-- tree: {"depth": "deep"} -->` の後ろに、正常シナリオ（ファイルツリーのフォルダを開閉する）と同じコードブロックを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: depth の値が型と選べる値に合わない
        M-->>P: 記載の警告と、既定の開閉のツリーを描く
        P-->>U: 記載の警告とツリーを表示
    expected:
      - ツリーの上に、`depth` には `"all"` か 1 以上の整数を記載することを記載した記載の警告がある
      - ツリーは既定のとおり `app/` だけを開いて描かれている
    test: test_error_when_tree_open_invalid
  - name: 正常シナリオ（アイコン・キー・ルビ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: アイコン・キー・ルビを持つ Markdown
        description: 見出し ``## `icon:flag` はじめに``、段落の行内のコード `` `icon:check` ``・`` `kbd:Ctrl+C` ``、文書の HTML の `<ruby>漢字<rt>かんじ</rt></ruby>` を持つ文書
        notes: '`flag`・`check` は配布物にまとめたアイコンの名前。`kbd:` の `+` の区切り方はインターフェース定義で決める'
      - name: Mock
        description: 正常シナリオと同じ。Lucide のアイコンへの要求を数える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: アイコン・キー・ルビを描く
        P-->>U: 文書を表示
    expected:
      - 見出しの `はじめに` の前と段落に、`flag`・`check` のアイコンが描かれ、`icon:` の文字は出ていない
      - アイコンはスクリーンリーダーの対象から削除され、見出しのスクリーンリーダー向けの名前が `はじめに` になっている
      - '`Ctrl+C` が `Ctrl` と `C` のキーの外観で描かれ、`kbd:` の文字は出ていない'
      - '`漢字` の上に `かんじ` のルビが描かれている'
      - Lucide のアイコンへの要求が 0 件
      - 記載の警告が出ていない
    test: test_normal_when_icon_kbd_ruby
  - name: 正常シナリオ（アイコンとキーの記載方法を見せる）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 打ち消したアイコンとキーを持つ Markdown
        description: 行内のコード `` `icon\:check` `` と `` `kbd\:Ctrl+C` `` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 打ち消しの \ を削除した行内のコードを描く
        P-->>U: 文書を表示
    expected:
      - 行内のコードが `icon:check`・`kbd:Ctrl+C` の文字のまま出ていて、アイコンとキーの外観になっていない
    test: test_normal_when_icon_kbd_escaped
  - name: 異常シナリオ（アイコンの名前の記載方法が誤っている）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 誤った名前のアイコンを持つ Markdown
        description: 行内のコード `` `icon:Rocket!` `` と `` `icon:` `` を持つ文書
        notes: Lucide の名前は英小文字・数字・`-` だけ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: icon: の後ろが Lucide の名前の記載方法に合わない
        M-->>P: 記載の警告と、元の行内のコードを描く
        P-->>U: 記載の警告と行内のコードを表示
    expected:
      - '`icon:Rocket!` の段落の上に、名前が Lucide の名前の記載方法に合わないことを記載した記載の警告がある'
      - '`icon:Rocket!` が記載したとおりの文字の行内のコードで出ている'
      - 中身の無い `icon:` は `badge:` と同じく記載したとおりの行内のコードで出て、記載の警告は出ていない
      - Lucide のアイコンへの要求が 0 件
    test: test_error_when_icon_name_invalid
  - name: 正常シナリオ（ファイルツリーを折り返す）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面の幅は 390px
      - name: 折り返すマーカーを持つファイルツリーの Markdown
        description: '`<!-- tree: {"depth": "all", "wrap": true} -->` の直後に、表示の幅より長い名前のファイルを入れ子の中に持つ言語 `tree` のコードブロックと、`<!-- tree: {"depth": "all"} -->` の直後の同じコードブロックを配置した文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: wrap を持つツリーだけを折り返して描く
        P-->>U: 文書を表示
    expected:
      - '`wrap` のツリーの長い名前が項目の中で折り返され、ツリーに横スクロールが出ない'
      - 折り返した名前の続きが、その項目のアイコンの右の名前の頭に一致し、罫線と入れ子の位置が `wrap` の無いツリーと同じ
      - '`wrap` の無いツリーは折り返さず、横にスクロールできる'
    test: test_normal_when_tree_wrap
  - name: 異常シナリオ（罫線のフォルダ構成の言語が tree でない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 罫線を言語 tree でないコードブロックに記載した Markdown
        description: 正常シナリオの罫線（`├── `・`└── ` の行が 2 行以上）を言語 `text` のコードブロックに、ASCII の罫線（`|-- `・`` `-- `` の行が 2 行以上）を言語の無いコードブロックに記載し、`├── ` の行を 1 行だけ持つ言語 `text` のコードブロックも持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 言語が tree でないコードブロックに、罫線の行が 2 行以上ある
        M-->>P: 記載の警告と、元のコードブロックを描く
        P-->>U: 記載の警告とコードブロックを表示
    expected:
      - 罫線の行を 2 行以上持つ 2 つのコードブロックの上に、言語を `tree` にするとファイルツリーに描かれることと、警告を止める指定を記載した記載の警告がある
      - 2 つのコードブロックは、記載したとおりの言語のコードブロックのまま描かれ、ファイルツリーにならない
      - 罫線の行を 1 行だけ持つコードブロックには、記載の警告が無い
    test: test_error_when_tree_lines_without_tree_language
  - name: 正常シナリオ（罫線の例の警告を止める）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 警告を止めた Markdown
        description: 異常シナリオ（罫線のフォルダ構成の言語が tree でない）と同じ文書で、罫線の行を 2 行以上持つ言語 `text` のコードブロックの直前にだけ、警告を止める指定を記載したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 警告を止めたコードブロックを、記載の警告を付けずに描く
        P-->>U: 文書を表示
    expected:
      - 警告を止めたコードブロックの上に記載の警告が無く、罫線の文字のまま言語 `text` のコードブロックで描かれている
      - 警告を止めていない言語の無いコードブロックの上には、記載の警告が残っている
    test: test_normal_when_tree_lines_warning_suppressed
lead: 文書の作成者が、`<!-- steps -->` 〜 `<!-- /steps -->` で囲んだ番号付きリスト・言語 `tree` のコードブロック・頭に `badge:` を付けた行内のコードを記載すると、mdmark がそれぞれ手順・ファイルツリー・バッジに描く。手順は `closed`・`open` で見出し付きの折りたたみに入れられ、ファイルツリーは `#` の後ろの注釈を列に統一し、読者がフォルダを開閉して元の罫線のテキストをコピーできる。
issue: 4
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 手順の順番・フォルダの入れ子・状態やバージョンの札を確認して取れる
trigger: 利用側のページが、ステップ・ファイルツリー・バッジを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - ステップ・ファイルツリー・バッジの機能（`steps`・`tree`・`badge`）がオン（既定）
success_guarantee: 番号付きリストが番号と線でつないだ手順に、罫線のフォルダ構成が入れ子のツリーに、`badge:` の行内のコードが札になる。GitHub ではリスト・コードブロック・行内のコードとして読み込める。
minimal_guarantee: 読み込めない記載方法の部品は、記載したとおりのリスト・コードブロックで描かれ、上に記載の警告が出る。
