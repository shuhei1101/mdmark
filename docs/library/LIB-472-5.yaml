id: LIB-472-5
visibility: internal
title: axe-core
kind: ライブラリ
version:
  current: '`axe-core==4.14.0`（`@storybook/addon-a11y==10.6.2` が使用するバージョンとは別に、Webview のテストのビルドに入れる）'
  latest: 4.14.0
  checked_on: '2026-11-06'
  source: vscode/package.json
  pinning: 完全一致
catalogs:
  - name: API
    version: 4.14.0
    entries:
      - name: axe.run
        kind: 関数
        purpose: 要素の範囲をアクセシビリティの規則で検査し、違反を返却する
        params:
          - name: context.include
            type: Element[] | string[][]
            required: false
            description: 検査する範囲
          - name: context.exclude
            type: Element[] | string[][]
            required: false
            description: 検査から除外する範囲
          - name: options.resultTypes
            type: string[]
            required: false
            description: '`["violations"]` で違反だけを詳しく返却する'
        returns:
          - name: violations[].id
            type: string
            description: 規則の名前
          - name: violations[].impact
            type: string
            description: '`minor`・`moderate`・`serious`・`critical`'
          - name: violations[].nodes[].target
            type: string[]
            description: 違反した要素のセレクタ
lead: HTML をアクセシビリティの規則（WCAG）で検査するエンジン。
purl: pkg:npm/axe-core@4.14.0
dependency_scope: 開発のみ
adoption: 採用
upstream: dequelabs/axe-core
used_in:
  - vscode/scripts/build.ts
  - vscode/src/webview/features/preview/panel/document-view.ts
verification:
  state: 済
  date: '2026-11-06'
  detail: 'Playwright の Chromium で `axe.min.js` を読み込み、`axe.run({ include: [["#root"]], exclude: [["#ex"]] }, { resultTypes: ["violations"] })` が名前の無い `button` の `button-name`（`critical`）だけを返却し、削除した `img` の `image-alt` を返却しないことを確認した'
license: MPL-2.0（商用利用可。ファイルを改変して配るときは改変したファイルのソースを公開する）
official_url: https://www.deque.com/axe/
docs_url: https://github.com/dequelabs/axe-core/blob/develop/doc/API.md
install: '```bash

  npm i -D -E axe-core@4.14.0

  ```


  テストのビルドのときだけ `axe.min.js` を `media/test/axe.js` にコピーし、.vsix には入れない。'
