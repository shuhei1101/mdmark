id: LIB-472-36
visibility: internal
title: "yaml"
kind: "ライブラリ"
version:
  current: 2.9.1
  latest: 2.9.1
  checked_on: '2026-10-16'
  source: package.json
  pinning: 完全一致。`dependencies` に配置し、CLI の配布物にまとめない。依存は lockfile で固定する
catalogs:
  - name: API
    version: 2.9.1
    entries:
      - name: parse
        kind: 関数
        purpose: YAML 1.2 の文字列を 1 文書読んで JavaScript の値にする
        params:
          - name: src
            type: string
            required: true
            description: 読み込む YAML の文字列
          - name: options.uniqueKeys
            type: boolean
            default: 'true'
            description: 同じマップの中の重なったキーを誤りにするか
          - name: options.maxAliasCount
            type: number
            default: '100'
            description: 展開するエイリアスの上限
        returns:
          - name: '-'
            type: any
            description: 読み込んだ値。空の文字列は `null`
            notes: 構造は検査しない。設定と索引の Schema の検査で確認する
        status: planned
        introduced:
          pr: 32
      - name: YAMLParseError
        kind: クラス
        purpose: '`parse` が YAML を読み込めないときに投げる誤り'
        returns:
          - name: code
            type: string
            description: 誤りの種類（`BAD_INDENT`・`DUPLICATE_KEY` など）
          - name: linePos
            type: '[{ line: number; col: number }, { line: number; col: number }]'
            description: 誤りの場所の開始と終わりの行と列（1 始まり）
          - name: message
            type: string
            description: 誤りの内容、行と列、該当行の抜き出し
        status: planned
        introduced:
          pr: 32
      - name: parseDocument
        kind: 関数
        purpose: 'YAML をコメントとキーの並びを保った Document として読み込む。読み込んだ Document を書き換えて `doc.toString({ flowCollectionPadding: false })` で文字に戻す'
        params:
          - name: src
            type: string
            required: true
            description: YAML の文字列
        returns:
          - name: '-'
            type: Document
            description: 読み込んだ Document。読み込めないところは投げずに `doc.errors` に入る。`hasIn`・`getIn`・`setIn`・`deleteIn`・`has`・`set`・`createPair` で読み込みと保存し、`isMap`・`isSeq`・`isScalar` でセクションを判定する
            notes: '値を同じ型のスカラーで書き換えると、コメントと記載方法が残る。`String(doc)` はフロー形式の並びの内側に空白を入れる（`["**/*.md"]` が `[ "**/*.md" ]` になる）ため、書き込んで戻しは `toString({ flowCollectionPadding: false })` で行う（2.9.1 で確認した）'
        status: planned
        introduced:
          pr: 39
      - name: LineCounter
        kind: クラス
        purpose: '`parseDocument` の `lineCounter` に指定し、読み込んだセクションの `range` の位置を行と列にする'
        returns:
          - name: linePos
            type: '(offset: number) => { line: number; col: number }'
            description: 文字の位置の行と列（1 始まり）。ブロックスカラー（`Scalar.BLOCK_LITERAL`・`Scalar.BLOCK_FOLDED`）のセクションの `range[0]` はインジケータ（`|`・`>`）の位置で、値の 1 行目はその次の行
        status: planned
        introduced:
          pr: 328
lead: YAML 1.2 を読み込みと保存をするライブラリ。既定で core スキーマで読み込み、読み込めないときは行と列を持つ誤りを投げる。
purl: pkg:npm/yaml@2.9.1
dependency_scope: 必須
adoption: 採用
upstream: eemeli/yaml
license: ISC（商用利用可）。実行時の依存は無い
docs_url: https://eemeli.org/yaml/
verification:
  state: 済
  date: '2026-10-17'
  detail: Node v24.14.0 の ESM から 2.9.1 を `import { parse, YAMLParseError } from "yaml"` で読、`build` の入った設定をオブジェクトにできること、空の文字列が `null` を返却すること、閉じていない `[` が `YAMLParseError`（`BAD_INDENT`、`linePos` の開始が 3 行 1 列）、重なったキーが `DUPLICATE_KEY`（2 行 1 列）になることを確認した。`017` は 17、`yes` は文字列、`0o17` は 15 で YAML 1.2 の core スキーマの読み込み方だった（reviewer の確認）。`parseDocument` で読み込んだ Document のキーの名前を同じ位置で変え、コメントと並びを保って `String(doc)` で戻せること、`set` で既存のキーの値をコメントを残して書き換えられること、キーを先頭に追加できること、フロー形式の配列を書き込んで戻すと `[ "a" ]` と中括弧の内側に空白が入ることを確認した。2026-11-05 に Node v24.14.0 で、`parseDocument(text, { lineCounter })` の `getIn(["items", 0, "body"], true)` が `type` が `Scalar.BLOCK_LITERAL` のセクションを返却し、`lineCounter.linePos(range[0])` がインジケータ `|` の行を返却すること、ダブルクォートの値は `QUOTE_DOUBLE` で値の行を返却すること、閉じていない `[` は投げずに `doc.errors` に `BAD_INDENT` と `linePos` を入れることを確認した
selection:
  candidates: yaml 2.9.1・js-yaml 5.5.0・confbox 0.3.1・@std/yaml 1.3.0 を比べた。
  decision: 実行時の依存が 0 件で YAML 1.2 を読み込め、読み込めないときの行と列がそのまま取れる。js-yaml は CLI 用の argparse を引き、空の入力で例外を投げる。confbox はまとめた js-yaml の修正が再リリースまで届かない。@std/yaml は npmjs に無く、`.npmrc` を持たない利用側の npx で入らない。
  consequences: 戻り値は `any` のため、設定と索引の構造は Schema の検査で確認する。空の設定ファイルは `null` になり、Schema に合わない設定として扱う。
install: |-
  ```bash
  npm i -E yaml@2.9.1
  ```
used_in:
  - src/cli/
  - vscode/src/
