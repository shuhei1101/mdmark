title: "playwright"
kind: "フレームワーク"
version:
  current: 1.64.0
  latest: 1.64.0
  checked_on: '2026-10-13'
  source: package.json
  pinning: 完全一致
catalogs:
  - name: API
    version: 1.64.0
    entries:
      - name: page.route
        kind: 関数
        purpose: mermaid の見本の SVG を描くページで、手元の配信元の URL への要求を横取りする
      - name: route.fulfill
        kind: 関数
        purpose: 横取りした要求に本文と Content-Type を返却する
      - name: page.evaluate
        kind: 関数
        purpose: ページの中で `getComputedStyle` を呼ぶ
  - name: コマンド
    version: 1.64.0
    entries:
      - name: playwright install
        kind: コマンド
        purpose: ブラウザを入れる
lead: Chromium・Firefox・WebKit を操作するブラウザの自動化のライブラリ。
purl: pkg:npm/playwright@1.64.0
dependency_scope: 開発のみ
adoption: 採用
upstream: microsoft/playwright
verification:
  state: 済
  date: '2026-10-13'
  detail: '`page.route()` で jsDelivr の URL への要求を横取りして手元の `dist/` を返却し、ページの HTML も同じ仕組みで返却して、公開関数と `--mdmark-version` を確認した。Chromium と Firefox で pass。WebKit は OS のライブラリ（libgtk-4 など）が無く起動できず、入れるには sudo が要るため E2E の対象から除外した'
license: Apache-2.0（商用利用可）
docs_url: https://playwright.dev/docs/api/class-page
install: |-
  ```bash
  npm i -D -E playwright@1.64.0
  npx playwright install chromium
  ```
