id: LIB-472-1
visibility: internal
title: "ClaudeCode"
kind: "CLI"
version:
  current: 2.1.309
  latest: 2.1.309
  checked_on: '2026-10-23'
  source: 利用側の手元の Claude Code（`claude --version`）
  pinning: 固定しない（利用側の手元のバージョン）
catalogs:
  - name: ファイル
    version: 2.1.309
    entries:
      - name: .claude-plugin/marketplace.json
        kind: ファイル
        purpose: リポジトリをマーケットプレイスにし、`plugin/` のプラグインを記載する
        params:
          - name: name
            type: string
            required: true
            description: マーケットプレイスの名前
          - name: plugins[].name
            type: string
            required: true
            description: プラグインの名前
          - name: plugins[].source
            type: string
            required: true
            description: プラグインのフォルダ（リポジトリの直下から `./plugin`）
      - name: .claude-plugin/plugin.json
        kind: ファイル
        purpose: プラグインの名前・バージョン・説明
        params:
          - name: name
            type: string
            required: true
            description: プラグインの名前
          - name: version
            type: string
            required: false
            description: バージョン。変わったときだけ入れたプラグインが更新される
          - name: description
            type: string
            required: false
            description: 説明
      - name: .mcp.json
        kind: ファイル
        purpose: プラグインの MCP サーバーへのつなぎ方
        params:
          - name: mcpServers.{名前}.type
            type: "'http'"
            required: true
            description: Streamable HTTP で起動済みのサーバーにつなぐ
          - name: mcpServers.{名前}.url
            type: string
            required: true
            description: つなぐ URL。`${変数}` と `${変数:-既定}` が Claude Code の環境変数（`~/.claude/settings.json` の `env` を含む）で展開される
      - name: hooks/hooks.json
        kind: ファイル
        purpose: プラグインのフックの定義
        params:
          - name: hooks.PreToolUse[].hooks[].type
            type: "'command'"
            required: true
            description: コマンドを実行するフック
          - name: hooks.PreToolUse[].hooks[].command
            type: string
            required: true
            description: 実行するコマンド
          - name: hooks.PreToolUse[].hooks[].args
            type: string[]
            required: false
            description: 引数。`${CLAUDE_PLUGIN_ROOT}` が展開される
          - name: hooks.PreToolUse[].matcher
            type: string
            required: false
            description: フックを実行するツール名の正規表現。MCP のツールは `mcp__plugin_{プラグイン}_{サーバー}__{ツール}` の完全名で適用する
          - name: hooks.UserPromptSubmit[].hooks[].command
            type: string
            required: false
            description: 利用者の発言を Claude Code が処理する前に実行するコマンド。`matcher` を持たない
          - name: hooks.PreCompact[].hooks[].command
            type: string
            required: false
            description: 会話を圧縮する前に実行するコマンド。`matcher` を省くと手動（`/compact`）と自動の両方で実行する。圧縮の後も `session_id` は変わらない
      - name: package.json・package-lock.json
        kind: ファイル
        purpose: プラグインの実行時の依存。導入時に Claude Code が入れる
        status: removed
  - name: 環境変数
    version: 2.1.309
    entries:
      - name: CLAUDE_PLUGIN_ROOT
        kind: 環境変数
        purpose: プラグインの直下（入れたプラグインのキャッシュの下）。`.mcp.json` と `hooks.json` の引数に展開される
      - name: CLAUDE_PROJECT_DIR
        kind: 環境変数
        purpose: セッションのフォルダ。フックの環境に渡る。HTTP でつなぐ MCP サーバーには渡らない
      - name: MCP_TIMEOUT
        kind: 環境変数
        purpose: MCP サーバーの接続を待つ上限のミリ秒。既定は 30 秒
  - name: フックの入力
    version: 2.1.309
    entries:
      - name: 標準入力の JSON
        kind: JSON のキー
        purpose: フックのコマンドの標準入力に渡る呼び出しの内容
        params:
          - name: session_id
            type: string
            required: true
            description: セッションの ID。同じセッションのフックには同じ値が渡る
          - name: hook_event_name
            type: string
            required: true
            description: フックの種類
          - name: tool_name・tool_input
            type: string・object
            required: false
            description: PreToolUse のときのツール名と引数。Write・Edit の `tool_input.file_path` は書き込み先の絶対パス
          - name: prompt
            type: string
            required: false
            description: UserPromptSubmit のときの利用者の発言
          - name: trigger
            type: "'manual' | 'auto'"
            required: false
            description: PreCompact のときの圧縮の契機
        status: planned
        introduced:
          pr: 541
  - name: フックの出力
    version: 2.1.309
    entries:
      - name: hookSpecificOutput.additionalContext
        kind: JSON のキー
        purpose: PreToolUse・UserPromptSubmit・SessionStart のフックが標準出力に書き込む JSON で、文を Claude Code の文脈に加える。呼び出しと発言は止めない
        params:
          - name: hookSpecificOutput.hookEventName
            type: "'PreToolUse' | 'UserPromptSubmit' | 'SessionStart'"
            required: true
            description: フックの種類
          - name: hookSpecificOutput.additionalContext
            type: string
            required: true
            description: 文脈に加える文
        status: planned
        introduced:
          pr: 541
      - name: hookSpecificOutput.updatedInput
        kind: JSON のキー
        purpose: PreToolUse のフックが標準出力に書き込む JSON で、ツールに指定する引数を置き換える。auto モードは書き換える前の入力を確認しているため、`permissionDecision` を記載しないと書き換えた呼び出しを拒否しうる
        params:
          - name: hookSpecificOutput.hookEventName
            type: "'PreToolUse'"
            required: true
            description: フックの種類
          - name: hookSpecificOutput.permissionDecision
            type: "'allow' | 'deny' | 'ask' | 'defer'"
            required: false
            description: '`allow` は権限の確認を省く（plan mode の読み取りだけでない呼び出しと、どのモードでも自動で許可しない操作を除く）。設定の deny・ask のルールはフックの返却に関係なく評価される'
          - name: hookSpecificOutput.permissionDecisionReason
            type: string
            required: false
            description: 許可・拒否の理由。`allow` のときはデバッグのログにだけ書かれる
          - name: hookSpecificOutput.updatedInput
            type: object
            required: true
            description: ツールに指定する引数の全体
        status: planned
        introduced:
          pr: 141
lead: Anthropic のコーディングエージェントの CLI。マーケットプレイスからプラグインを入れ、プラグインのフックと MCP サーバーを起動する。
supplier: Anthropic
dependency_scope: 任意
adoption: 採用
used_in:
  - plugin/.claude-plugin/plugin.json
  - plugin/.mcp.json
  - plugin/hooks/hooks.json
  - .claude-plugin/marketplace.json
upstream: anthropics/claude-code
verification:
  state: 済
  date: '2026-11-12'
  detail: '2.1.309 で次を確認した。PoC（#73）でマーケットプレイスの追加と導入が終了コード 0、導入時に `plugin/package.json` から `node_modules` が作られた。ユーザーの手元の対話のセッションで、SessionStart の `additionalContext`（8,982 文字）の末尾まで届き、MCP の `instructions` と `read_guide`・`check` の呼び出しが起動の直後の依頼に間に合った（[返信](https://github.com/shuhei1101/mdmark/pull/72#discussion_r4357235963)）。プラグインの MCP サーバーのプロセスの環境に `CLAUDE_PROJECT_DIR` がセッションのフォルダで渡った（[レビュー](https://github.com/shuhei1101/mdmark/pull/72#discussion_r4358172495)）。MCP-SDK v2 のサーバーに新方式で接続した。2.1.310 で次を確認した（[#141 の PoC 結果](https://github.com/shuhei1101/mdmark/blob/feat/claude-code-plugin/mcp-http-server/dev/pr/141/ClaudeCodeプラグイン.md#poc-結果)）。`.mcp.json` の `type: http` と `url` の `${MDMARK_PORT:-8782}` の展開でつながり、並行する 2 つのセッションが同じプロセスのツールを呼んだ。PreToolUse のフックの `updatedInput` で入れた引数がツールに届き、許可の判定は変わらなかった。サーバーが起動していないと MCP サーバーだけが `failed`（`ECONNREFUSED`）になり、サーバーを起動してから `/mcp` の Reconnect でもう一度つなぐと、セッションをもう一度開かずにツールを呼べた。採用した構造（まとめた MCP-SDK v2 のサーバー・ガイドの `index.json`・`plugin.json` の `version` の記載方法）での導入と呼び出しは E2E で確認する。2.1.322 で、`plugin.json` に `version` が無いプラグインは導入の記録の `version` が commit の短縮 SHA、`gitCommitSha` が commit の SHA になり、commit を追加して `claude plugin marketplace update` → `claude plugin update` で新しい commit に更新された。`version` を持つプラグインは、`version` を変えずに commit を追加しても更新されなかった（[#493 の PoC](https://github.com/shuhei1101/mdmark/pull/493)。マーケットプレイスは手元の smart HTTP の git URL で追加した）。2.1.323 で、同じ仕組みで動く rule-inject の PreToolUse のフックの `additionalContext`（ルールの案内）が、ツールの呼び出しを止めずに対話のセッションの文脈に届いた。UserPromptSubmit の `additionalContext` と PreCompact の後の再案内は、#541 の実装の後に手元の対話のセッションで確認する'
license: 商用の利用規約（Anthropic の Commercial Terms）。mdmark は同梱も再配布もしない
official_url: https://code.claude.com/
docs_url: https://code.claude.com/docs/en/plugins-reference
install: |-
  利用側が Claude Code を入れておき、セッションで次を実行する。

  ```text
  /plugin marketplace add shuhei1101/mdmark
  /plugin install mdmark@mdmark
  ```
limitations:
  - item: MCP の instructions の文字数
    content: '4,096 文字を超えた分は切られる。v2.1.296 より前は 2,048 文字。`CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH` で変えられる'
    notes: '[MCP](https://code.claude.com/docs/en/mcp) の「For MCP server authors」'
  - item: ツールの結果の大きさ
    content: 50,000 文字を超えた結果はファイルに逃がし、本文の代わりにパスを指定する
  - item: プラグインの依存の導入
    content: '`package.json` と lockfile が一致するときだけ、`--ignore-scripts` で入れ、60 秒で打ち切る。ローカルのパスで追加したマーケットプレイスでは入らない'
    notes: esbuild は postinstall に頼らず `@esbuild/{プラットフォーム}` の optional dependency で動く
  - item: プラグインの更新
    content: '`plugin.json` が `version` を持つときは `version` が変わったときだけ、持たないときは commit が変わったときに、`claude plugin update` で更新する。`version` を持たないときのバージョンは commit の短縮 SHA（12 桁）。`claude plugin marketplace update` だけでは更新せず、更新は Claude Code の再起動で反映する'
  - item: MCP のプロトコル
    content: 先に `server/discover`（2026-07-28）を送信し、エラーなら `initialize`（2025-11-25）へ落ちる
  - item: HTTP の MCP サーバーが起動していない
    content: その MCP サーバーだけが `failed`（`ECONNREFUSED`）になる。サーバーを起動してから `/mcp` の Reconnect でつなぎ修正できる
