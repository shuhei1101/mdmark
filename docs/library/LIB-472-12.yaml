id: LIB-472-12
visibility: internal
title: eslint
kind: ライブラリ
version:
  current: '`eslint==10.13.0`（直下）/ `eslint==9.39.5`（`tools/eslint/`）'
  latest: 10.13.0
  checked_on: '2026-11-06'
  source: package.json・tools/eslint/package.json
  pinning: 完全一致
catalogs:
  - name: API
    version: 10.13.0
    entries:
      - name: Linter
        kind: クラス
        purpose: ファイルを読み込まずに、指定したコードに flat config の規則を適用する（`verify`）
      - name: Linter.getSourceCode
        kind: 関数
        purpose: 直前の `verify` の構文木と、位置からセクション・祖先・元の文字列を参照する `SourceCode` を返却する
  - name: コマンド
    version: 9.39.5
    entries:
      - name: eslint -c tools/eslint/eslint.config.js --max-warnings 0
        kind: コマンド
        purpose: '`src/`・`scripts/`・`vscode/src/`・`plugin/` の TypeScript に複雑さの規則を、Webview の TypeScript に React・アクセシビリティ・import の向き・Tailwind の規則を適用する'
        description: '`tools/eslint/node_modules/eslint/bin/eslint.js` を node で呼ぶ（直下の `eslint` 10 ではない）。設定の `basePath` を直下にし、引数が無いときは設定の `files` の全てを検査する（`node_modules/`・`dist/`・JavaScript は `ignores` で除外する）'
  - name: 同梱プラグイン
    version: 9.39.5
    entries:
      - name: typescript-eslint 8.72.1
        kind: プラグイン
        purpose: '`recommendedTypeChecked`・`projectService` で型の情報を使用する規則'
        description: TypeScript 6.1 未満だけに対応するため、`tools/eslint/` に TypeScript 6.0.3 を入れる
      - name: eslint-plugin-react-hooks 7.1.1
        kind: プラグイン
        purpose: '`recommended-latest`（フックの規則と React Compiler の規則）'
      - name: eslint-plugin-jsx-a11y 6.10.2
        kind: プラグイン
        purpose: JSX のアクセシビリティの規則
        description: ESLint 9 までに対応する
      - name: eslint-plugin-boundaries 7.4.2
        kind: プラグイン
        purpose: '`boundaries/dependencies` で要素の間の import の向きを限る'
        description: 要素の `pattern` はフォルダに該当する。ファイルを指すと警告が出る
      - name: eslint-plugin-better-tailwindcss 4.10.0
        kind: プラグイン
        purpose: '`recommended-error`（class の並び・正準形・不明な class）と `no-restricted-classes`'
      - name: eslint-plugin-sonarjs 4.2.2
        kind: プラグイン
        purpose: '`sonarjs/cognitive-complexity`'
      - name: eslint-plugin-import-x 4.17.1
        kind: プラグイン
        purpose: '`import-x/no-default-export`'
lead: JavaScript を構文木にして規則を当て、違反を報告する lint のツール。
purl: pkg:npm/eslint@10.13.0
dependency_scope: 開発のみ
adoption: 採用
upstream: eslint/eslint
used_in:
  - scripts/baseline.ts
  - tools/eslint/eslint.config.js
verification:
  state: 済
  date: '2026-11-06'
  detail: 'PoC #87 で `ESLint` に eslint-plugin-compat を指定してまとめた JS を照らし、`Linter` の `getSourceCode()` の `getIndexFromLoc`・`getNodeByRangeIndex`・`getAncestors`・`getText` で報告の位置を囲む `IfStatement` を辿れることを確認した。`linterOptions.noInlineConfig: true` で、まとめた依存が持つ他のプラグインの `eslint-disable` のコメントを読み込まない（その通知は `ruleId` が `null`）。`tools/eslint/` の 9.39.5 で `npm run lint:eslint` が Webview の 30 ファイルだけを検査し、指摘を修正した後に 0 件になった'
license: MIT（商用利用可）
official_url: https://eslint.org/
docs_url: https://eslint.org/docs/latest/integrate/nodejs-api
install: '```bash

  npm i -D -E eslint@10.13.0

  ```


  複雑さと Webview の規則は `tools/eslint/` の package に入れる。


  ```bash

  npm i -D -E --prefix tools/eslint eslint@9.39.5 typescript@6.0.3 typescript-eslint@8.72.1 eslint-plugin-react-hooks@7.1.1 eslint-plugin-jsx-a11y@6.10.2 eslint-plugin-boundaries@7.4.2 eslint-plugin-better-tailwindcss@4.10.0 eslint-plugin-sonarjs@4.2.2 eslint-plugin-import-x@4.17.1

  ```'
