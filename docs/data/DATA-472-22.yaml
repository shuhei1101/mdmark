id: DATA-472-22
visibility: internal
title: 'データ: 用語集の表'
lead: 用語集の表のマーカー 1 つの設定。
datastore: JSON
fields:
- key: term
  title: 用語の列
  type: object
  description: 用語の列。`alias_row` が無いとき必須で、`alias_row` と一緒に記載しない
  required: false
  example: '{"column": "用語"}'
- key: term.column
  title: 列の見出しの文字
  type: string
  description: 列の見出しの文字
  required: true
  example: 用語
- key: meaning
  title: 意味の列
  type: object
  description: 意味の列。`alias_row` が無いとき必須で、`alias_row` と一緒に記載しない
  required: false
  example: '{"column": "意味"}'
- key: meaning.column
  title: 列の見出しの文字
  type: string
  description: 列の見出しの文字
  required: true
  example: 意味
- key: aliases
  title: 別名の列
  type: object
  description: 別名の列。`alias_row` と一緒に記載しない
  example: '{"column": "別名"}'
- key: aliases.column
  title: 列の見出しの文字
  type: string
  description: 列の見出しの文字
  required: true
  example: 別名
- key: avoid
  title: やめた言い方の列
  type: object
  description: やめた言い方の列。`alias_row` と一緒に記載しない
  example: '{"column": "やめた言い方"}'
- key: avoid.column
  title: 列の見出しの文字
  type: string
  description: 列の見出しの文字
  required: true
  example: やめた言い方
- key: alias_row
  title: エイリアスの元の行
  type: ref
  ref: DATA-472-6#fields[id]
  description: 表を囲まず、この行から作った `term` のエイリアスで用語集の表を描くときの、設定の `aliases` の行の `id`。記載したマーカーは閉じのマーカーを持たず、`term`・`meaning`・`aliases`・`avoid` と一緒に記載しない。描く表の列は `用語`・`別名`・`使用しない言い方`・`意味`・`詳細` に固定する
  example: terms
refs:
