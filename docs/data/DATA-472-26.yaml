id: DATA-472-26
visibility: internal
title: 'データ: タブ'
lead: タブのマーカー 1 つの設定。
datastore: JSON
fields:
- key: group
  title: タブの組の名前
  type: string
  description: タブの組の名前。1 文字以上。空の文字は記載の警告にし、組を持たないタブにする
  example: os
- key: collapse
  title: 共通のオブジェクトの折り畳み
  type: object
  description: 共通のオブジェクトの折り畳み
  example: '{"open": true}'
- key: wrap
  title: タブ名の並びの折り返し
  type: bool
  description: タブ名の並びが横幅に入りきらないときに、横にスクロールさせず折り返して並べる。省くと `false`（横にスクロールする）。真偽値でない値は記載の警告にし、省いたときと同じに描く
  example: 'true'
