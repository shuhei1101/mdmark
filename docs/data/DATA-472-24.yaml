  example: autoplay
- key: interval
  title: 自動で進める間隔の秒
  type: int
  description: 自動で進める間隔の秒。正の数。省くと 2
  example: '3'
- key: collapse
  title: 図を折り畳みに入れる
  type: object
  description: 共通のオブジェクトの折り畳み
  example: '{"open": false}'
