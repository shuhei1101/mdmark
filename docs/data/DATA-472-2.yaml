id: DATA-472-2
visibility: internal
title: 'データ: 補足'
lead: map の範囲 1 つの補足。
datastore: JSON
fields:
- key: version
  title: バージョン
  type: int
  description: 補足のバージョン
  required: true
  example: '1'
- key: notes
  title: 説明
  type: object
  description: 'ノード・線の ID ごとの説明と注記の参照（`{ "text": 説明の文, "annotations": [注記の ID] }`。どちらか一方だけでもよい）。線にポインターを乗せたツールチップと、再生の帯の説明に出す。`annotations` の注記は、ツールチップの説明の下に区分を分けて出す'
  example: '{"mount": {"text": "文書を描く公開関数", "annotations": ["cond"]}}'
- key: plays_over
  title: 再生を重ねる構成図
  type: int
  description: シーケンス図の補足だけが持つ。再生の強調を重ねる構成図の図の番号
  example: '1'
- key: walkthroughs
  title: 案内の手順
  type: array
  description: 構成図の案内の手順の並び。配列の順が手順の順。要素はデータ『案内の手順』の 1 件
  example: '[{"text": "map のマーカーを読み取り、範囲を 1 つの図にする", "nodes": ["marker"]}]'
- key: layout
  title: 配置の上書き
  type: object
  description: ノード・グループ・線の ID ごとの配置と外観の上書き（キーが ID）。値はデータ『配置の上書き』の 1 件
  example: '{"mount": {"color": "blue"}}'
- key: groups
  title: 分類
  type: object
  description: ER 図の補足だけが持つ。テーブルをまとめる分類の箱（キーが分類の ID）。値はデータ『分類』の 1 件
  example: '{"rec": {"title": "記録", "tables": ["注文"]}}'
- key: changes
  title: 計画した変更
  type: object
  description: ノード・グループ・線の ID ごとの計画した変更（キーが ID）。値はデータ『計画した変更』の 1 件
  example: '{"mount": {"type": "added"}}'
refs:
- ER-472-2#tables[map_data]
