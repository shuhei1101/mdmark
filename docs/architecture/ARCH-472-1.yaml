repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/mdmark
subsystems:
  - name: ライブラリ本体
    scope: lib
    role: Markdown の表示に使用する JavaScript と CSS をビルドして配り、同じバージョンの CLI で文書を 1 枚の HTML に書き出す
    runtime: TypeScript 7
    runs_on: 利用側のページを開いたブラウザ（`mount`・`render`）と、利用側の Node の処理（`render`）と、文書の作成者の手元の Node 24（CLI の `dist/cli.js`。`npx github:shuhei1101/mdmark#v{バージョン}` で入れ、実行時の依存の yaml と esbuild を `dependencies` から読み込む。`mdmark serve` は 127.0.0.1 で Claude Code プラグインの MCP サーバーとして常駐する）
    status: planned
  - name: VS Code 拡張機能
    scope: vscode
    role: VS Code で開いている Markdown を、jsDelivr から読み込んだ配布物の `mount` で Webview に描き、HTML に書き出す。mdmark の配布物は同梱しない
    runtime: TypeScript 7。Webview は React（Vite で書き出し、shadcn/ui と Tailwind の部品）
    runs_on: 文書の作成者の VS Code（拡張機能のホストと Webview）。`vscode/` に独自の `package.json` を配置し、.vsix で配る
    refs:
      - IF-472-22#
    status: planned
  - name: Claude Code プラグイン
    scope: claude-code-plugin
    role: Claude Code に、記載する前に dev-docs でガイドを参照し記載した後に点検する順序を MCP の instructions で示し、書き出し・まとめ・点検を MCP のツールで呼ばせる。`.mark.md` の記載と mdmark で記載する指示では、フックが記法のルールの参照をセッションに 1 回案内する。MCP のツールは、ライブラリ本体の CLI の `mdmark serve` が常駐の HTTP サーバーとして返却する
    runtime: TypeScript 7（Node 24）
    runs_on: 文書の作成者の手元の Claude Code が、プラグインのキャッシュの `plugin/` から `node` で起動するフックと、`.mcp.json` の URL へ HTTP でつなぐ `mdmark serve` の MCP サーバー（文書の作成者が `npx github:shuhei1101/mdmark#v{バージョン} serve` で起動しておく）
    reason: Claude Code のバージョンと仕様に依る部分を、ブラウザと Node で動くライブラリ本体と分けて確認する
    status: planned
  - name: mdmark-style
    scope: mdmark-style
    role: Claude Code の返答と利用者の発言を、描く前に mdmark の共通スタイルの部品の木（表・注意書き・見出し・コードブロック・開閉の範囲・用語のマーカー）に描き換え、SessionStart でマーカーの記載方法をモデルに渡す。記法の解釈と用語の照合はライブラリ本体の関数をまとめて使用し、MCP は持たない
    runtime: TypeScript 7（Claude Code の mod。Node・DOM は無く、`$` で画面・ファイル・設定を扱う）
    runs_on: 文書の作成者の手元の Claude Code が、プラグインのキャッシュの `mdmark-style/hooks/mod/mod.js` を mod として読み込む。ターミナル版・デスクトップ版・VS Code の拡張機能で同じ mod が動く
    reason: フックと MCP の Claude Code プラグインと分け、利用者が画面の描き換えだけを入れたり外したりできるようにする（規約『Claude プラグインルール』の機能ごとの単独）
    refs:
      - IF-472-45#
      - IF-472-46#
      - IF-472-47#
    status: planned
lead: mdmark の配布物が、開発者のビルドから利用側のページへ届くまでの全体構成。
external_systems:
  - name: jsDelivr
    purpose: GitHub のリポジトリのバージョンのタグが指す配布物を、利用側のページへ配る
    direction: 受信のみ
    protocol: HTTPS
    detail: API-472-2#
    cost: 無料。1 ファイル 20MB まで
    status: planned
    notes:
      事前確認: 否。ライブラリ本体は実行時に jsDelivr を呼ばない。
  - name: 外部ライブラリのモジュール
    purpose: 文書にマーカーがあるときだけ、対応表（既定と設定の `libraries`）の URL から ES モジュールを読み込み、マーカーの場所に描かせる
    direction: 受信のみ
    protocol: ブラウザの動的 `import()`（HTTPS。URL はページの `document.baseURI` を基準に解決する）
    cost: 無料。マーカーの無い文書では要求が 0 件
    status: planned
    refs:
      - IF-472-35#constraints[外部ライブラリの読み込み]
    notes:
      事前確認: 否。この Issue の既定の対応表は空で、読み込む先は利用側が設定で指定する。結合テストは手元の開発サーバーが配る代役のモジュールで確認する。既定の対応表に外部の配信元を記載する Issue（[コードブロックの HTML を表示し、図・チャートの部品とヒントを持たせる](https://github.com/shuhei1101/mdmark/issues/6)）が、その配信元の事前確認を決める
  - name: GitHub のタグ一覧
    purpose: 'VS Code 拡張機能が `mdmark.version: latest` のときに、読み込む mdmark のバージョンを選ぶ'
    direction: 受信のみ
    protocol: HTTPS（REST、認証なし）
    detail: API-472-1#
    cost: 無料。60 回/時（送信元の IP ごと）。プレビューを開く・リロードする・書き出すときだけ 1 回呼ぶ
    refs:
      - IF-472-22#constraints[バージョンの決め方]
    status: planned
  - name: GitHub Actions と GitHub Releases
    purpose: '`vscode-v*` のタグで拡張機能の .vsix を作り、そのタグの Release に添える。develop への push で `dist/`・`plugin/` の生成物を再作成し、差分があれば develop へ commit する。手動の起動で、テスト実行方法の実行場所が `runner` の層のテストを回し、ログを成果物に上げる'
    direction: 送信のみ
    protocol: GitHub Actions のワークフロー（`.github/workflows/vscode-release.yml`・`.github/workflows/test.yml`）と `gh release`・`gh workflow run`
    detail: LIB-472-34#
    cost: 公開リポジトリの GitHub Actions は無料。Release に .vsix を残す
    refs:
      - IF-472-23#
      - IF-472-44#
    status: planned
  - name: Visual Studio Marketplace
    purpose: '`vscode-v*` のタグのワークフローが、Release に添えた .vsix を拡張機能 `ShuheiNishikawa.mdmark-vscode` の新しいバージョンとして公開し、文書の作成者の VS Code へ更新を届ける'
    direction: 送信のみ
    protocol: '`vsce publish --oidc`（GitHub Actions の OIDC トークンを、publisher `ShuheiNishikawa` に登録した trusted publishing のポリシーで公開用のトークンに交換する）'
    detail: LIB-472-34#
    cost: 無料。公開したバージョンは上書きできない
    refs:
      - IF-472-23#
    status: planned
    notes:
      事前確認: '済。[PoC: GitHub Actions の OIDC トークンを Marketplace のトークンに交換する](https://github.com/shuhei1101/mdmark/pull/555) で、ブランチへの push で動かした `vscode-release.yml` が vsce 4.1.1 の `getOIDCCredential` でトークンを交換できることを 2026-11-14 に確認した。公開は最初のタグで確認する'
  - name: VS Code
    purpose: 拡張機能を動かし、コマンド・設定・エディタ・Webview の API を指定する
    direction: 双方向
    protocol: VS Code の拡張機能の API（`vscode`）と Webview の `postMessage`
    detail: LIB-472-35#
    cost: 無料
    refs:
      - NFR-472-1#requirements[対応する VS Code のバージョン]
    status: planned
  - name: Claude Code
    purpose: マーケットプレイスからプラグインを入れ、常駐の MCP サーバーへ HTTP でつないで instructions を受け取り、ツールを呼ぶ。ツールの呼び出しの前に PreToolUse のフックを、利用者の発言の処理の前と会話の圧縮の前に UserPromptSubmit・PreCompact のフックを実行する
    direction: 双方向
    protocol: フックは子プロセスの標準入出力（JSON）、MCP は 127.0.0.1 への Streamable HTTP（JSON-RPC）
    detail: LIB-472-1#
    cost: mdmark の側には無い（Claude Code の利用料は利用側が持つ）。`export_html`・`build_site` は利用側の作業のフォルダに書き込む
    refs:
      - IF-472-4#
    status: planned
  - name: dev-docs
    purpose: Claude Code が、mdmark のクローンを登録した配信元 `mdmark` から、ガイドのページを `search_docs` で参照する。mdmark のプラグインと MCP サーバーは dev-docs を呼ばず、端末の設定も書き換えない
    direction: 受信のみ
    protocol: Claude Code から dev-docs の MCP（127.0.0.1 への Streamable HTTP）
    detail: LIB-472-8#
    cost: 無料。dev-docs は文書の作成者が自分の端末に入れ、mdmark のクローンを配信元に登録する
    refs:
      - SC-472-15#
    status: planned
    notes:
      事前確認: 否。mdmark の処理は dev-docs を呼ばない。E2E は一時フォルダの端末の設定で起動した dev-docs で確認する
notes:
  フォルダの役割: |-
    | 場所 | 役割 | 利用側への届き方 | 作る Issue |
    | --- | --- | --- | --- |
    | `src/` | TypeScript と CSS の本体 | ビルドして `dist/` | この土台 |
    | `dist/` | 配布物の JavaScript と CSS、CLI の `cli.js`（develop への push のワークフローが `--develop` でビルドして develop へ commit し、スプリントの区切りの develop・release・hotfix ではタグのバージョンで commit する。作業 PR では commit しない） | jsDelivr から `develop`（既定）かバージョンのタグを指定した URL で読み込む。CLI は `npx github:shuhei1101/mdmark#develop` か `#v{バージョン}` で入れる | この土台・[サーバー無しで Markdown を HTML に書き出し、複数の文書を 1 枚にまとめる CLI を作る](https://github.com/shuhei1101/mdmark/issues/9) |
    | `scripts/` | 開発のスクリプト（ビルド） | 届けない | この土台 |
    | `tests/` | 単体・結合・E2E のテスト | 届けない | この土台 |
    | `templates/` | 利用側へ配置する雛形（設定・`theme.css`・索引・拡張の雛形。差分のアダプターのサンプルは [文書の変更を行と文字で色分けする差分表示を作る](https://github.com/shuhei1101/mdmark/issues/7)） | CLI の `init` が配置する | [サーバー無しで Markdown を HTML に書き出し、複数の文書を 1 枚にまとめる CLI を作る](https://github.com/shuhei1101/mdmark/issues/9) |
    | `schemas/` | 設定・索引・部品の JSON Schema | CDN と CLI | [Markdown をブラウザで描く土台（mount・render・テーマ・機能のオン・オフ）を作る](https://github.com/shuhei1101/mdmark/issues/3)・[文書の索引・用語のツールチップ・被参照を表示する](https://github.com/shuhei1101/mdmark/issues/5)・[コードブロックの HTML を表示し、図・チャートの部品とヒントを持たせる](https://github.com/shuhei1101/mdmark/issues/6)・[dev/ を廃止して文書を docs/ 1 つにまとめ、ai-monitor#3307 と同じ構成へ移す](https://github.com/shuhei1101/mdmark/issues/454) |
    | `docs/` | 設計書（種類ごとのフォルダに `{ID}.yaml`）・公開ドキュメント（`guide/`）・PR ドキュメント（`pr/`）・モック（`mock/`）。公開範囲は各文書の `visibility` | `visibility` が `public` の文書を GitHub Pages で公開する（`_config.yml` の `exclude` で `internal` を除く） | [dev/ を廃止して文書を docs/ 1 つにまとめ、ai-monitor#3307 と同じ構成へ移す](https://github.com/shuhei1101/mdmark/issues/454) |
    | `migrations/` | バージョンごとの移行の手順とスクリプト（`v{バージョン}/`）、出していないバージョンの手順（`next/`）、移行の手順が要らないスキーマの変更の一覧（`no-steps.yaml`） | CLI の `upgrade` が `v{バージョン}/` を読み込む（`next/` と `no-steps.yaml` は配布物のビルドだけが読み込む） | [版を上げるときに移行の手順を当てる upgrade を作る](https://github.com/shuhei1101/mdmark/issues/10) |
    | `guide/` | ガイドの索引（`index.yaml`。本文は `docs/guide/` のページを指す） | 配布物のビルドが検査し、Claude Code が dev-docs の配信元 `mdmark` からタグ `topic:ガイド` で絞って参照する | [Claude Code のプラグインと MCP で、使い方集の索引と書き出し・点検を渡す](https://github.com/shuhei1101/mdmark/issues/11) |
    | `.claude-plugin/` | マーケットプレイスの定義（`marketplace.json`。`plugin/` と `mdmark-style/` を記載する） | `/plugin marketplace add shuhei1101/mdmark` | [Claude Code のプラグインと MCP で、使い方集の索引と書き出し・点検を渡す](https://github.com/shuhei1101/mdmark/issues/11) |
    | `plugin/` | Claude Code のプラグインの定義（`plugin.json`・`.mcp.json`・`hooks/hooks.json`）と、配布物のビルドが記載するまとめたフック（`dist/` と同じ時期にだけ commit する。`hooks.json` に行を追加する PR では、その行が起動するまとめたフックも入れる） | プラグインのマーケットプレイスから Claude Code が入れる。`plugin.json` は `version` を持たず、develop の commit がプラグインの更新で届く | [Claude Code のプラグインと MCP で、使い方集の索引と書き出し・点検を渡す](https://github.com/shuhei1101/mdmark/issues/11) |
    | `vscode/` | VS Code 拡張機能（独自の `package.json`。バージョンは develop の commit に打つ `vscode-v{バージョン}` のタグ） | GitHub Release に添えた .vsix と、タグのワークフローが公開する Visual Studio Marketplace（拡張機能の ID `ShuheiNishikawa.mdmark-vscode`・表示名 `mdmark for VS Code`） | [VS Code で mdmark のプレビューを出す拡張機能を作る](https://github.com/shuhei1101/mdmark/issues/22) |
    | `mdmark-style/` | mod のプラグイン mdmark-style の定義（`plugin.json`・`hooks/hooks.json`・`settings.sample.yaml`）と、配布物のビルドが `src/mdmark-style/` から記載する mod の本体（`hooks/mod/mod.js`。`dist/` と同じ時期にだけ commit する。`src/mdmark-style/` を変える PR では、ビルドした `mod.js` も入れる） | プラグインのマーケットプレイスから Claude Code が入れる。`plugin.json` は `version` を持たず、develop の commit がプラグインの更新で届く | [Claude Code の画面を mdmark の共通スタイルで描く](https://github.com/shuhei1101/mdmark/issues/116) |
    | `.github/workflows/` | `vscode-v*` のタグで .vsix を作って Release に添え、Marketplace へ公開するワークフローと、develop への push で `dist/`・`plugin/`・`mdmark-style/` の生成物を再作成して develop へ commit するワークフロー | 届けない | [VS Code で mdmark のプレビューを出す拡張機能を作る](https://github.com/shuhei1101/mdmark/issues/22) |
    | `project-index.yaml` | dev-docs・project-index の配信元の設定（設計書の種類ごとの行と、各フォルダの `files.yaml` の行と、dev-docs の画面のタブとサイドバーの構成） | 届けない | [mdmark の既存の文書を dev-docs.yaml に載せ、タグで引けるようにする](https://github.com/shuhei1101/mdmark/issues/178) |
    | 各フォルダの `files.yaml`（`docs/` の下は `files.yml`） | YAML の設計書でないファイルの概要文・タグ・関連（1 ファイル 1 行。スキーマは knowledge の `schemas/knowledge-files.schema.yaml`） | 届けない | [mdmark の既存の文書を dev-docs.yaml に載せ、タグで引けるようにする](https://github.com/shuhei1101/mdmark/issues/178) |

    この土台で実体を作るのは `src/`・`dist/`・`scripts/`・`tests/` だけで、他は中身を持つ Issue が作る。
tags:
  - name: topic:アーキテクチャ
    main: true
  - name: topic:構成
