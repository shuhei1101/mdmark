    category: はじめに
    description: 索引を正にし、被参照を描くときに算出し、ずれを点検で見つける仕組み。mdmark の仕組みを理解するときに参照する。
    tags: [topic:仕組み, topic:索引]
  - path: コアコンセプト-1枚にまとめる仕組み.md
    visibility: public
    category: はじめに
