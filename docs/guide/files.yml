# yaml-language-server: $schema=../../schemas/files.schema.yaml
files:
  - path: コアコンセプト-文書を描く仕組み.md
    visibility: public
    category: はじめに
    description: Markdown と設定を指定してから描かれるまでの流れと、テーマの層・機能のオン・オフの優先順。mdmark の仕組みを理解するときに参照する。
    tags: [topic:仕組み]
  - path: コアコンセプト-共通の定義と固有の定義.md
    visibility: public
    category: はじめに
