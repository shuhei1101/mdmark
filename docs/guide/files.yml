    tags: [topic:仕組み, topic:設定]
  - path: コアコンセプト-バージョンを上げる仕組み.md
    visibility: public
    category: はじめに
    description: バージョンごとの移行の手順をバージョンの順に当て、コピーから戻し、点検してからバージョンを書き換える流れ。mdmark の仕組みを理解するときに参照する。
    tags: [topic:仕組み, topic:バージョン, topic:移行]
