<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>document / a-auto-width（表の列の幅とコードブロックの帯） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->

  <!-- 利用側のページの外観と、モック専用の操作列（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../../../refs/287/assets/scene.css">
  <!-- 表の列の幅・コードブロックの帯と開閉のボタンの規則と、画面の幅いっぱいに描く場面の規則（#505 で共有するアセット） -->
