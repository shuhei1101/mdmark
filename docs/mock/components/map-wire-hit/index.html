<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-wire-hit（map の図の線の押せる範囲の作り） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- #772 で変える見た目 -->
  <link rel="stylesheet" href="../../refs/772/assets/mock.css">
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-wire-hit
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-wire-hit</h1>
    <p class="state-note">配布物の mount で描いた実物の図の、線の押せる範囲（1 本の path）を、区間ごとの帯に分けている。URL の <code>?focus=first|longest&amp;width=14|24</code> で、フォーカスを持つ帯と帯の幅を切り替える（axe の target-size の確認用）</p>
  </main>
  <script type="module">
    import { drawMap, spreadPorts, splitWireHits } from "../../refs/772/assets/mock.js";

    const params = new URLSearchParams(location.search);
    const focusOn = params.get("focus") ?? "first";
    const width = Number(params.get("width") ?? "14");
    const fence = (title, source) => `<!-- map: {"title": "${title}"} -->

\`\`\`mermaid
${source}
\`\`\`

<!-- /map -->
`;
    const FAN = `flowchart TB
  hub[mount] --> a[表]
  hub --> b[図]
  hub --> c[注意書き]
  hub --> d[コードブロック]
  x[設定] --> hub
  y[索引] --> hub`;
    const FLOW = `flowchart LR
  subgraph app[利用側のアプリ]
    direction LR
    subgraph page[ページ]
      direction TB
      md[Markdown] --> mount[mount]
      config[設定] --> mount
    end
    store[(保存先)]
  end
  mount --> store
  mount --> cdn[配布物の CDN]`;
    const ER = `erDiagram
  顧客 {
    int id PK
    string 名前
  }
  注文 {
    int id PK
    int 顧客ID FK
  }
  商品 {
    int id PK
    string 名前
  }
  顧客 ||--o{ 注文 : "注文する"
  注文 }o--|| 商品 : "含む"`;
    const catalog = document.getElementById("catalog");
    const add = (tag, text) => catalog.append(Object.assign(document.createElement(tag), { textContent: text }));
    add("h2", `フォーカスを持つ帯: ${focusOn === "longest" ? "最も長い区間" : "最初の区間"}・帯の幅: ${width}px`);
    for (const [title, source] of [["同じ辺から出る線（端を 16px ずらす）", FAN], ["入れ子のグループ（#764 の保存先）", FLOW], ["ER 図（#764 の商品）", ER]]) {
      add("h3", title);
      const host = document.createElement("div");
      catalog.append(host);
      drawMap(host, fence(title, source), (h) => { spreadPorts(h, 16); splitWireHits(h, { focusOn, width }); });
    }
  </script>
</body>
</html>
