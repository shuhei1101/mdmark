<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-wire-ports（map の図の同じ辺から出る線の端と間隔） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- #772 で変える見た目 -->
  <link rel="stylesheet" href="../../refs/772/assets/mock.css">
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-wire-ports
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-wire-ports</h1>
    <p class="state-note">配布物の mount で描いた実物の図の、同じ点に集まった線の端と最初の折れ目を、辺に沿って案の間隔でずらしている。並んで走る区間の間隔は、端をずらした分だけ空く（実装では経路を決めるときに区間ごとに間隔を取る）。ラベルの位置は今の配置のまま</p>
  </main>
  <script type="module">
    import { drawMap, spreadPorts } from "../../refs/772/assets/mock.js";

    const fence = (title, source) => `<!-- map: {"title": "${title}"} -->

\`\`\`mermaid
${source}
\`\`\`

<!-- /map -->
`;
    const DECIDE = `flowchart LR
  A[要望を受ける] --> B{対応するか}
  B -->|する| C[計画へ記載する]
  B -->|しない| D[理由を返却する]
  B -->|保留| E[後で決める]`;
    const FAN = `flowchart TB
  hub[mount] --> a[表]
  hub --> b[図]
  hub --> c[注意書き]
  hub --> d[コードブロック]
  x[設定] --> hub
  y[索引] --> hub`;
    /** 案の囲みの class・見出し・補足・端の間隔（px）。間隔が 0 の案は今の描き方 */
    const VARIANTS = [
      ["今の見た目", "同じ辺から出る線は辺の中点 1 か所から出て、最初の区間が重なる", 0],
      ["案 A: 端を 16px 間隔で辺の上に並べる（推奨）", "相手のノードの並びの順に、辺の中点を中心として 16px ずつずらす。辺の長さに収まらないときは辺の長さを線の数で等分する", 16],
      ["案 B: 端を 8px 間隔で辺の上に並べる", "ずらす幅を小さくし、辺の中央に寄せる。矢じり（8px）の幅とほぼ同じため、入る側の矢じりは隣どうしで接する", 8],
    ];
    /** 状態の見出し・補足・Markdown */
    const STATES = [
      ["分岐から 3 本（#747 のモックの「対応するか」）", "分岐の右の辺から 3 本の線が出る", fence("要望の扱い", DECIDE)],
      ["1 つのノードの上下の辺に 4 本と 2 本", "下の辺から 4 本出て、上の辺に 2 本入る", fence("描く部品", FAN)],
    ];
    const catalog = document.getElementById("catalog");
    const add = (parent, tag, text, className) => parent.append(Object.assign(document.createElement(tag), { textContent: text, ...(className ? { className } : {}) }));
    VARIANTS.forEach(([heading, note, gap], v) => {
      add(catalog, "h2", heading);
      add(catalog, "p", note, "state-note");
      const patch = gap === 0 ? undefined : (host) => spreadPorts(host, gap);
      STATES.forEach(([title, stateNote, markdown]) => {
        add(catalog, "h3", title);
        add(catalog, "p", stateNote, "state-note");
        const host = document.createElement("div");
        catalog.append(host);
        drawMap(host, markdown, patch);
      });
      if (v === 1) {
        add(catalog, "h3", "狭い幅（390px）");
        add(catalog, "p", "表示する枠の中で横にスクロールしても、端の間隔は変わらない", "state-note");
        const host = document.createElement("div");
        host.classList.add("narrow");
        catalog.append(host);
        drawMap(host, fence("要望の扱い（狭い幅）", DECIDE), patch);
      }
    });
  </script>
</body>
</html>
