<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-band（案内・再生の帯の手順のバー・再生の種類・速度） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体）: 色・余白・角丸の CSS 変数 -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- 案内・再生の帯の規則（#660 で追加するアセット） -->
  <link rel="stylesheet" href="../../refs/660/assets/band.css">
  <style>
    /* カタログの並び: 状態ごとに見出しと帯を縦に並べる */
    .map-catalog { box-sizing: border-box; max-width: 1100px; margin: 0 auto; padding: 16px; }
    .map-catalog h2 { font-size: 24px; margin: 48px 0 8px; }
    .map-catalog h3 { font-size: 18px; margin: 32px 0 4px; }
    .map-catalog p.state-note { margin: 0 0 4px; color: var(--mdmark-color-muted); font-size: 13px; }
    .narrow { max-width: 390px; }
  </style>
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-band
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-band</h1>
    <h2>実演</h2>
    <p class="state-note">帯を操作すると、手順で強調するノードが表示する枠に収まる位置と倍率へ、図がなめらかに移る。図を押した後は、次に帯を操作するまで図を移さない。動きを減らす設定では時間をかけずに移す</p>
    <div id="live-figure"></div>
    <div id="live-band"></div>
  </main>
  <script type="module">
    import { createBand, createFigure, renderBand } from "../../refs/660/assets/band.js";

    /** 実演の図のノードと、案内の手順 */
    const NODES = [
      { id: "doc", label: "文書の作成者", x: 40, y: 40 },
      { id: "md", label: "Markdown", x: 260, y: 40 },
      { id: "parse", label: "記法を読む", x: 480, y: 40 },
      { id: "map", label: "map の範囲", x: 480, y: 200 },
      { id: "layout", label: "自動で配置する", x: 700, y: 200 },
      { id: "render", label: "図を描く", x: 700, y: 360 },
      { id: "reader", label: "読者", x: 260, y: 460 },
    ];
    const STEPS = [
      { title: "文書を書く", text: "作成者が Markdown に map の範囲を書く", nodes: ["doc", "md"] },
      { title: "記法を読む", text: "mdmark が記法と範囲を読み取る", nodes: ["parse", "map"] },
      { title: "配置する", text: "入れ子のグループを自動で配置する", nodes: ["layout"] },
      { title: "図を描く", text: "図の枠に描き、読者が辿って読む\n2 行目の説明", nodes: ["render", "reader"] },
    ];
    const figure = createFigure(document.getElementById("live-figure"), { title: "文書を描く流れ", nodes: NODES });
    createBand(document.getElementById("live-band"), { steps: STEPS, interval: 2, label: "文書を描く流れの案内" }, figure);

    const TITLES = STEPS.map((step) => step.title);
    const base = { total: 4, titles: TITLES, label: "文書を描く流れの案内" };
    /** 状態の見出し・補足・帯の状態 */
    const STATES = [
      ["始める前", "番号は –/4。停止は押せない。手順のバーはどの区切りも塗らない", { ...base }],
      ["手順 2（止まっている）", "済んだ区切りは濃い灰色、今の区切りは高くしてマーカーの色の縁を付ける。番号とボタンの間にタイトル、2 行目に説明の文", { ...base, index: 1, title: "記法を読む", text: "mdmark が記法と範囲を読み取る" }],
      ["この手順を再生（途中）", "今の区切りを間隔をかけて塗り、塗り終えたらその手順で止まる。ボタンは押した状態", { ...base, index: 1, title: "記法を読む", text: "mdmark が記法と範囲を読み取る", playing: "one", fill: 0.45 }],
      ["全て再生（途中・2 倍）", "全て再生のボタンが一時停止のアイコンになる。速度は 2 倍を選んだ状態", { ...base, index: 2, title: "配置する", text: "入れ子のグループを自動で配置する", playing: "all", fill: 0.7, speed: 2 }],
      ["シーケンス図の再生", "単位がメッセージのとき、ボタンの名前は前のメッセージ・このメッセージを再生・次のメッセージ", { total: 9, titles: Array.from({ length: 9 }, (_, i) => `メッセージ ${i + 1}`), index: 2, unit: "message", title: "mount を呼ぶ", label: "シーケンス図の再生" }],
      ["手順が多い（40）", "区切りは幅に合わせて細くなる。押した位置に近い手順へ移る（バー全体が 1 つのスライダー）", { total: 40, titles: Array.from({ length: 40 }, (_, i) => `手順 ${i + 1}`), index: 23, title: "手順 24" , label: "案内" }],
      ["案 B: 区切りごとのボタン", "区切りを 1 つずつのボタンにし、矢印キーで区切りの間を移る（ツールバー）。押せる範囲は高さ 24px", { ...base, index: 1, title: "記法を読む", segUi: "buttons" }],
      ["案 B: 速度を選択欄にする", "速度を 1 つの選択欄にする", { ...base, index: 1, title: "記法を読む", speedUi: "select" }],
    ];
    const catalog = document.getElementById("catalog");
    const add = (title, note, state, narrow = false) => {
      catalog.append(Object.assign(document.createElement("h3"), { textContent: title }));
      catalog.append(Object.assign(document.createElement("p"), { className: "state-note", textContent: note }));
      const host = document.createElement("div");
      if (narrow) host.className = "narrow";
      host.innerHTML = renderBand({ ...state, label: `${state.label}（${title}）` });
      catalog.append(host);
    };
    catalog.append(Object.assign(document.createElement("h2"), { textContent: "状態" }));
    for (const [title, note, state] of STATES) add(title, note, state);
    catalog.append(Object.assign(document.createElement("h2"), { textContent: "狭い幅" }));
    add("狭い幅（390px）", "タイトルは番号とボタンの下の行に回す。手順のバーは帯の幅いっぱい", { ...base, index: 1, title: "記法を読む", text: "mdmark が記法と範囲を読み取る" }, true);
  </script>
</body>
</html>
