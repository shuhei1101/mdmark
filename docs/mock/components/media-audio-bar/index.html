<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>media-audio-bar（埋め込んだ音声の再生バーの見切れの切り分け） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- #820 の測定の表 -->
  <link rel="stylesheet" href="../../refs/820/assets/mock.css?v=7">
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / media-audio-bar
  </nav>
  <main class="mock820-catalog" id="catalog">
    <h1>media-audio-bar</h1>
    <p class="state-note">配布物の mount で描いた実物の音声の再生バーと、その下に、描いた高さと、図とその祖先の overflow で切られた高さを測った表を並べる。mdmark の CSS だけで描いたときに切られた高さが 0px なら、見切れの原因は利用側（MindStella）の CSS にある</p>
  </main>
  <script type="module">
    import { draw, measureAudio } from "../../refs/820/assets/mock.js?v=7";

    const AUDIO = "../../refs/263/assets/media/voice.mp3";
    const MARKDOWN = `![読み上げ](${AUDIO} "セリフの音声")

![読み上げ](${AUDIO})
`;
    const catalog = document.getElementById("catalog");
    const add = (tag, text, className) => catalog.append(Object.assign(document.createElement(tag), { textContent: text, ...(className ? { className } : {}) }));
    const scene = (heading, note, narrow) => {
      add("h2", heading);
      add("p", note, "state-note");
      const host = document.createElement("div");
      if (narrow) host.classList.add("narrow");
      const out = document.createElement("div");
      catalog.append(host, out);
      draw(host, MARKDOWN, (root) => measureAudio(root, out));
      // 再生バーの高さはメタデータの読み込みの後に決まるため、読み込んだ後にも測る
      host.addEventListener("loadedmetadata", () => measureAudio(host, out), true);
    };
    scene("本文の幅", "キャプションのある音声と無い音声", false);
    scene("狭い幅（390px）", "スマホの幅でも再生バーの下端が切られないか", true);
  </script>
</body>
</html>
