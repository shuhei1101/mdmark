  <main class="mock820-catalog" id="catalog">
    <h1>lightbox-move-menu</h1>
    <p class="state-note">配布物の mount で描いた実物の画像を押すとライトボックスが開く。上のバーの拡大のボタンで画像の場所より大きくすると、バーの先頭に「移動」のボタンが出る。ボタンで開くメニューの「上へ移す」「下へ移す」「左へ移す」「右へ移す」は、矢印キーと同じ量だけ押した向きの先を見せる。メニューを開いている間の Esc はメニューだけを閉じ、もう一度 Esc でライトボックスを閉じる。全体が収まる倍率に戻すとボタンは消える</p>
    <div id="doc"></div>
  </main>
  <script type="module">
    import { draw, attachLightboxMove } from "../../refs/820/assets/mock.js?v=7";

    draw(document.getElementById("doc"), `![構成の全体](sample.svg "押すとライトボックスで拡大する")

![構成の細部](sample.svg "2 枚目")
`);
    attachLightboxMove();
  </script>
</body>
