<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-mindmap-item（map のマインドマップの項目の枠線・文字・選び方） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- #772 で変える見た目 -->
  <link rel="stylesheet" href="../../refs/772/assets/mock.css">
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-mindmap-item
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-mindmap-item</h1>
    <p class="state-note">配布物の mount で描いた実物のマインドマップに、項目の枠線・文字・ポインターを重ねたときと選んだときの面・名前の文字の上で選べる操作を重ねている。項目の位置は今の配置のまま（実装では名前の幅に合わせた項目の幅で配置し直す）</p>
  </main>
  <script type="module">
    import { drawMap, selectOnName } from "../../refs/772/assets/mock.js";

    const MINDMAP = (title) => `<!-- map: {"title": "${title}"} -->

\`\`\`mermaid
mindmap
  root((mdmark))
    記法
      表
      注意書き
    図
      map
      mermaid
    書き出し
      文書の作成者が書いた 30 文字の長い名前を持つ項目の例
    [VS Code]
      (プレビュー)
\`\`\`

<!-- /map -->
`;
    /** 案の囲みの class・見出し・補足・名前の上で選ぶか */
    const VARIANTS = [
      ["", "今の見た目", "形状の指定の無い項目は枠線が無く下線だけ。項目を選べるのは名前の周りの余白と下線の上だけで、名前の文字の上では選べない", false],
      ["mind-a", "案 A: どの項目も枠線を持ち、名前の文字の上を押しても選ぶ（推奨）", "形状の指定の無い項目は枝の色の 1px の枠線と角の丸い四角。ポインターを重ねた項目の面に枝の色をうっすら敷いて押せる範囲を示し、選んだ項目は外側の枠線と面の色で示す。名前の文字はドラッグで選んでコピーでき、押しただけなら項目を選ぶ", true],
      ["mind-a", "案 B: どの項目も枠線を持ち、選べる場所は今のまま", "枠線・文字・ポインターを重ねたときの面は案 A と同じ。名前の文字の上では今と同じく選ばず、文字を選ぶ", false],
    ];
    const catalog = document.getElementById("catalog");
    const add = (parent, tag, text, className) => parent.append(Object.assign(document.createElement(tag), { textContent: text, ...(className ? { className } : {}) }));
    VARIANTS.forEach(([variant, heading, note, onName], v) => {
      add(catalog, "h2", heading);
      add(catalog, "p", note, "state-note");
      add(catalog, "h3", "形状の指定の無い項目・短い名前（map）・30 文字の名前");
      add(catalog, "p", "`map`・`mermaid` は 1 行で描く。30 文字の名前は項目の幅の上限で折り返す", "state-note");
      const host = document.createElement("div");
      if (variant) host.classList.add(variant);
      catalog.append(host);
      drawMap(host, MINDMAP("mdmark の機能"), onName ? selectOnName : undefined);
      if (v === 1) {
        add(catalog, "h3", "狭い幅（390px）");
        add(catalog, "p", "表示する枠の中で横にスクロールしても、項目の枠線と文字は変わらない", "state-note");
        const narrow = document.createElement("div");
        narrow.classList.add("narrow", variant);
        catalog.append(narrow);
        drawMap(narrow, MINDMAP("mdmark の機能（狭い幅）"), selectOnName);
      }
    });
  </script>
</body>
</html>
