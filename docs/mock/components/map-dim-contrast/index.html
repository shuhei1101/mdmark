<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-dim-contrast（map の図で薄くした要素の文字のコントラスト） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体）: 色・余白・角丸の CSS 変数 -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- map の図のモックの規則（#445 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/445/assets/map-mock.css">
  <!-- ER 図・状態遷移図（#531）・クラス図と C4 図（#596）・C4 の 4 種類と再生の帯（#660）で共有するアセット -->
  <link rel="stylesheet" href="../../refs/531/assets/er-state.css">
  <link rel="stylesheet" href="../../refs/596/assets/class-arch-c4.css">
  <link rel="stylesheet" href="../../refs/660/assets/c4-kinds.css">
  <link rel="stylesheet" href="../../refs/660/assets/band.css">
  <!-- 薄め方の案 A・B（#707） -->
  <link rel="stylesheet" href="../../refs/707/assets/dim-contrast.css">
  <style>
    /* カタログの並び: 案ごとに状態の見出しと図を縦に並べる */
    .map-catalog { box-sizing: border-box; max-width: 1100px; margin: 0 auto; padding: 16px; }
    .map-catalog h2 { font-size: 24px; margin: 48px 0 8px; }
    .map-catalog h3 { font-size: 18px; margin: 32px 0 4px; }
    .map-catalog p.state-note { margin: 0 0 4px; color: var(--mdmark-color-muted); font-size: 13px; }
    .narrow { max-width: 390px; }
    /* #445 のモックの帯は、#660 の手順のバーの帯に置き換えたため出さない */
    .map-catalog .map-band { display: none; }
  </style>
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-dim-contrast
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-dim-contrast</h1>
    <p class="state-note">案内・再生・選択で強調しない要素（map-dim・map-focus）と、中へ入ったときにグループの外側に残す要素（map-faded）の薄め方を、案ごとに同じ状態で並べる。どの案も、薄くした要素の文字は背景に対して 4.5:1 以上のコントラストを保つ</p>
  </main>
  <script type="module">
    import { createC4DynamicStill, DYNAMIC, DYNAMIC_DATA } from "../../refs/677/assets/c4-dynamic-play.js";
    import { createErMap, createStateMap } from "../../refs/531/assets/er-state.js";
    import { ER, ER_DATA, STATE, STATE_DATA } from "../../refs/531/assets/samples.js";
    import { createClassMap } from "../../refs/596/assets/class-arch-c4.js";
    import { CLASS, CLASS_DATA } from "../../refs/596/assets/samples.js";

    /** 案の囲みの class・見出し・補足 */
    const VARIANTS = [
      ["dim-a", "案 A: opacity を 0.8 まで上げる", "薄くした要素を、文字のコントラストが 4.5:1 以上になる opacity 0.8 で描く。線・ライフラインも同じ濃さになり、強調する要素との差は小さい"],
      ["dim-b", "案 B: 文字は薄めず、色を変える（推奨）", "文字を持つ要素は opacity で薄くせず、文字を本文の文字色と背景の色を混ぜた色（背景に対して 4.5:1 以上）にし、枠と面も背景の色と混ぜる。文字を持たない線・ライフライン・関係の端は今の opacity 0.25 のまま薄くする"],
    ];
    /** 状態の見出し・補足・描く関数 */
    const STATES = [
      ["C4Dynamic の再生（番号 2 の関係）", "注文の画面と注文の API のほかを薄くする（map-focus）", (host, id) => createC4DynamicStill(host, { id, title: "注文の流れ", label: "「注文の流れ」の再生（番号 2 の関係）", source: DYNAMIC, data: DYNAMIC_DATA }, { index: 1, fill: 0.45 })],
      ["ER 図（分類の中）", "分類の箱の外のテーブルを薄く残す（map-faded）", (host, id) => createErMap(host, { id, title: "記録の構造（分類の中）", source: ER, data: ER_DATA }, { enter: "記録" })],
      ["状態遷移図（再生）", "6 本目の遷移のほかを薄くする（map-dim）", (host, id) => createStateMap(host, { id, title: "作業の状態（再生）", source: STATE, data: STATE_DATA }, { step: 5 })],
      ["クラス図（namespace の中）", "namespace の外のクラスを薄く残す（map-faded）", (host, id) => createClassMap(host, { id, title: "図形（namespace の中）", source: CLASS, data: CLASS_DATA }, { enter: "形状" })],
    ];
    const catalog = document.getElementById("catalog");
    const add = (parent, tag, text, className) => parent.append(Object.assign(document.createElement(tag), { textContent: text, ...(className ? { className } : {}) }));
    VARIANTS.forEach(([variant, title, text], v) => {
      const section = document.createElement("section");
      section.className = variant;
      catalog.append(section);
      add(section, "h2", title);
      add(section, "p", text, "state-note");
      STATES.forEach(([state, note, draw], s) => {
        add(section, "h3", state);
        add(section, "p", note, "state-note");
        const host = document.createElement("div");
        section.append(host);
        draw(host, `${variant}-${s}`);
      });
      add(section, "h3", "狭い幅（390px）");
      add(section, "p", "C4Dynamic の再生（番号 2 の関係）を狭い幅で描く", "state-note");
      const narrow = document.createElement("div");
      narrow.className = "narrow";
      section.append(narrow);
      STATES[0][2](narrow, `${variant}-narrow`);
    });
    // 選択で薄くする状態（ER 図・クラス図のテーブル・クラスを押す、線にポインターを乗せる）はモックの初期状態では持たないため、図の操作で再現する
    add(catalog, "p", "選択: ER 図のテーブル・クラス図のクラスの見出しの余白を押すか、線にポインターを乗せると、関係しない要素を同じ薄め方で薄くする", "state-note");
  </script>
</body>
</html>
