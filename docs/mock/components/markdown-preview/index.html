<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>components / markdown-preview（markdown のコードブロックのプレビュー） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- モック専用の操作列とカタログの並び（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- この PR の案（番号で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/709/assets/markdown-preview.css">
  <!-- 配布物の mount でコードブロックを描き、帯に案の切り替えのボタンを差し込む -->
  <script type="module" src="../../refs/709/assets/markdown-preview.js"></script>
</head>
<body>
  <!-- モック専用の操作列: 配色の切り替え。[data-scene-axis] [data-scene-value]: markdown-preview.js が行き先の URL と今の配色の aria-current を適用する -->
  <div class="mock-bar" data-mock-bar>
    <div class="mock-bar-group" role="group" aria-label="配色">
      <span class="mock-bar-label">配色</span>
      <a class="mock-bar-item" data-scene-axis="scheme" data-scene-value="light">ライト</a>
      <a class="mock-bar-item" data-scene-axis="scheme" data-scene-value="dark">ダーク</a>
    </div>
  </div>

  <main class="catalog-page">
    <nav class="crumbs" aria-label="パンくずリスト">
      <a href="../index.md">components</a> / markdown-preview
    </nav>
    <div class="catalog" id="catalog">
      <section>
        <h1 class="catalog-title">markdown のコードブロックのプレビュー</h1>
        <p class="catalog-note">言語が <code>markdown</code>・<code>md</code> のコードブロックの帯に、ソースと描いた結果を切り替えるボタンを配置する。既定はソースの表示で、ボタンを押すと同じ枠の中に描いた結果を出す。見本は配布物の <code>mount</code> で描き、帯にボタンを差し込んでいる（見本のボタンは押して切り替えられる）。</p>
      </section>
    </div>
  </main>
</body>
</html>
