<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>diagram-frame-touch | mdmark の部品のモック</title>
  <!-- 本文の規則とモック専用の操作列（#16 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/16/assets/sample.css">
  <!-- 採用スタイル本体の変数の値 -->
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- 拡張記法の規則とカタログの並べ方（#19 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/19/assets/syntax.css">
  <link rel="stylesheet" href="../../refs/19/assets/catalog.css">
  <!-- 図の部品の規則（#42 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/42/assets/diagram.css">
  <!-- 図の右上に重ねるボタンのパネルの規則（#659 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/659/assets/panel.css">
  <!-- 狭い枠の見本の幅（図の枠の部品のモックと同じ） -->
  <link rel="stylesheet" href="../diagram-frame/style.css">
  <!-- 配色の切り替え -->
  <script src="../../refs/16/assets/sample.js" defer></script>
  <!-- 図の定義の見本と、図を描いて操作を付けるスクリプト（#42 で共有するアセット） -->
  <script src="../../refs/42/assets/samples.js" defer></script>
  <script src="../../refs/308/assets/samples.js" defer></script>
  <script src="../../refs/42/assets/diagram.js" defer></script>
</head>
<body>
  <!-- モック専用の操作列: 配色の切り替え -->
  <div class="mock-bar">
    <div class="mock-bar-group" role="group" aria-label="配色">
      <button class="mock-bar-item" type="button" data-scheme-set="light" aria-pressed="false">明るい配色</button>
      <button class="mock-bar-item" type="button" data-scheme-set="dark" aria-pressed="false">ダーク</button>
    </div>
  </div>

  <main class="host">
    <div class="catalog">
      <h1 class="catalog-title">図の枠を指で動かす</h1>

      <!-- 開いたときの倍率: 縦の指のドラッグは文書のスクロール。横の指のドラッグは、枠に収まらない分だけ図を動かす -->
      <section aria-labelledby="state-fit">
        <h2 class="catalog-label" id="state-fit">開いたときの倍率（縦のドラッグは文書のスクロール。横のドラッグは枠に収まらない分だけ図を動かす）</h2>
        <!-- [data-mock-panel]: panel.css がこの中の図のパネルを推奨の案 A にする（モックだけの指定） -->
        <article class="mdmark catalog-narrow" data-mock-panel="a">
          <figure data-mock-diagram="inquiry"></figure>
        </article>
      </section>

      <!-- 拡大した: 余白をタップしなくても、指 1 本で縦にも横にも図を動かす。枠線は変えない。指を離さずに図の端を越えた分は文書のスクロールになる -->
      <section aria-labelledby="state-zoomed">
        <h2 class="catalog-label" id="state-zoomed">拡大した（指 1 本で縦にも横にも図を動かす。枠線は変えない。指を離さずに図の端を越えた分は文書のスクロール）</h2>
        <article class="mdmark catalog-narrow" data-mock-panel="a">
          <figure data-mock-diagram="inquiry" data-mock-zoom="1.25" data-mock-scroll="230,90"></figure>
        </article>
      </section>

      <!-- ピンチで拡大した: 2 本の指の中点を保って倍率を変える。パネルの倍率の表示がピンチで変えた倍率に合う -->
      <section aria-labelledby="state-pinched">
        <h2 class="catalog-label" id="state-pinched">ピンチで拡大した（2 本の指の中点を保って倍率を変え、パネルの倍率の表示が合う）</h2>
        <article class="mdmark catalog-narrow" data-mock-panel="a">
          <figure data-mock-diagram="inquiry" data-mock-zoom="2" data-mock-scroll="400,150"></figure>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
