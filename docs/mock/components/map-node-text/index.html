<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-node-text（map の図のノードと線のラベルの文字） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- #772 で変える見た目 -->
  <link rel="stylesheet" href="../../refs/772/assets/mock.css">
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-node-text
  </nav>
  <main class="map-catalog" id="catalog">
    <h1>map-node-text</h1>
    <p class="state-note">配布物の mount で描いた実物の図に、ノードの名前・種類の行・線のラベルの文字の大きさと太さだけを案ごとに重ねている。ノードの大きさは今の文字の大きさで配置したまま（実装では文字に合わせて小さくなる）</p>
  </main>
  <script type="module">
    import { drawMap } from "../../refs/772/assets/mock.js";

    const FLOW = (title) => `<!-- map: {"title": "${title}"} -->

\`\`\`mermaid
flowchart LR
  subgraph app[利用側のアプリ]
    direction LR
    subgraph page[ページ]
      direction TB
      md[Markdown] -->|読み込む| mount[mount]
      config[設定] -->|重ねる| mount
    end
    store[(保存先)]
  end
  mount -->|コメントを保存する| store
  mount --> cdn[配布物の CDN]
  long[文書の作成者が書いた 30 文字の長い名前を持つノードの例] --> md
\`\`\`

<!-- map-data: {"version": 1} -->

<!-- /map -->
`;
    const C4 = (title) => `<!-- map: {"title": "${title}"} -->

\`\`\`mermaid
C4Context
  Person(writer, "文書の作成者", "Markdown を書く")
  System(lib, "mdmark", "Markdown を描く")
  System_Ext(cdn, "jsDelivr", "配布物を配る")
  Rel(writer, lib, "書いた文書を描かせる")
  Rel(lib, cdn, "配布物を読み込む")
\`\`\`

<!-- /map -->
`;
    /** 案の囲みの class・見出し・補足 */
    const VARIANTS = [
      ["", "今の見た目", "名前 14px の太字（700）・種類の行 11px の 600・線のラベル 12px"],
      ["text-a", "案 A: 名前 13px・種類の行と線のラベル 11px、どれも太字にしない（推奨）", "mermaid の図と同じく、どの文字も標準の太さ（400）。名前と種類の行は大きさと色の濃さで分ける"],
      ["text-b", "案 B: 名前と種類の行を中くらいの太さ（500）にする", "大きさは案 A と同じ。名前を少しだけ太くして、線のラベルより目立たせる"],
    ];
    /** 状態の見出し・補足・Markdown */
    const STATES = [
      ["構成図（種類を持たないノード・ラベルを持つ線・30 文字の名前）", "30 文字の名前は今と同じくノードの幅の上限で折り返す", FLOW("描く流れ")],
      ["C4 図（種類の行と説明を持つノード）", "種類の行（Person・System）・名前・説明の 3 段の文字の差", C4("全体の関係")],
    ];
    const catalog = document.getElementById("catalog");
    const add = (parent, tag, text, className) => parent.append(Object.assign(document.createElement(tag), { textContent: text, ...(className ? { className } : {}) }));
    VARIANTS.forEach(([variant, heading, note], v) => {
      add(catalog, "h2", heading);
      add(catalog, "p", note, "state-note");
      STATES.forEach(([title, stateNote, markdown]) => {
        add(catalog, "h3", title);
        add(catalog, "p", stateNote, "state-note");
        const host = document.createElement("div");
        if (variant) host.classList.add(variant);
        catalog.append(host);
        drawMap(host, markdown);
      });
      if (v === 1) {
        add(catalog, "h3", "狭い幅（390px）");
        add(catalog, "p", "表示する枠の中で横にスクロールしても、文字の大きさは変わらない", "state-note");
        const host = document.createElement("div");
        host.classList.add("narrow", variant);
        catalog.append(host);
        drawMap(host, FLOW("描く流れ（狭い幅）"));
      }
    });
  </script>
</body>
</html>
