id: global-setup
visibility: internal
type: skill
title: mdmark の端末のセットアップ
summary: 端末ごとに 1 回、mdmark の端末の設定を作る・移行し、systemd --user の unit か tmux のセッションで MCP の常駐サーバーを起動して、つながることを確認する。再インストール・端末の移行・プラグインの更新の後と、常駐サーバーが待ち受けていないと伝わったときにも使用する
tags:
  - topic:セットアップ
  - topic:常駐
  - topic:サーバー
  - topic:スキル
skill:
  path: plugin/skills/global-setup/SKILL.md
  name: global-setup
  allowed_tools:
    - Bash(node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js *)
    - Bash(node ${CLAUDE_PLUGIN_ROOT}/scripts/session-start.js)
    - Bash(npx -y github:shuhei1101/mdmark*)
steps:
  - name: 端末の状態を示す
    body: |-
      端末の設定のパス・バージョン・起動の方法（`launcher.resolved`）・unit の名前か tmux のセッション名・待ち受けているかを利用者に示す。
      `setup.js` の結果は標準出力の JSON の 1 行、誤りは標準エラーの文で返る。
    calls:
      - type: command
        command: node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js status
  - name: 端末の設定を移行する
    when: 端末の設定があり、`settings.version` が `settings.target_version` より前のバージョンのとき
    body: '`--plan` で適用する手順を示し、利用者が認めたら `--plan` を削除して実行する。'
    calls:
      - type: command
        command: npx -y github:shuhei1101/mdmark#{target_version} upgrade --settings --plan
  - name: キーを確認する
    body: キーを 1 つずつ、今の値と既定と説明を示して、そのままにするか変えるかを利用者に聞く。
    calls:
      - type: command
        command: node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js keys --target settings
  - name: 端末の設定を書き込む
    body: |-
      変えるキーと値を示し、書き込んでよいかを利用者に聞く。
      認めたら実行する（変えるキーが無く、端末の設定が無いときも、認めたら `--set` 無しで実行して雛形から作る）。
      断ったら書き込まずに次へ進む。端末の設定が無いまま断ったときは、次の工程で `--launcher tmux` を付ける（unit のファイルを作らない）。
    calls:
      - type: command
        command: node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js write-settings --set {キー}={値} ...
  - name: 常駐サーバーを起動する
    body: |-
      - 終了コード 2: 使用する起動の方法（systemd --user・tmux）が使えない。標準エラーのコマンドを、端末を開いたまま動かすよう利用者に示す
      - 終了コード 1・3: 標準エラーの理由と修正方法を利用者に示す
    calls:
      - type: command
        command: node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js start-server
  - name: フックを確認する
    body: 標準出力が空で終了コード 0 なら、フックが動き常駐サーバーが待ち受けていると示す。1 行が出たら、その文を利用者に示す。
    calls:
      - type: command
        command: node ${CLAUDE_PLUGIN_ROOT}/scripts/session-start.js
  - name: MCP の接続を案内する
    when: 常駐サーバーが待ち受けているとき
    body: '`/mcp` で `plugin:mdmark:mdmark` をもう一度接続するよう利用者に示す。'
  - name: 結果を示す
    body: |-
      作った・書き込んだファイル、`settings.json` に書き込んだキー、常駐サーバーが動いている方法（`launcher`）と unit の名前かセッション名、行った変更（`changes`）、ログの確認方法（`log`）、止める操作（`stop`）を示す。
      `settings.json` の `env` を書き込んだときは、セッションをもう一度開くと次のセッションから有効になると示す。
