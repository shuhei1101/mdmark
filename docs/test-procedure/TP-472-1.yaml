id: TP-472-1
visibility: internal
title: テスト実行方法
layers:
  - id: TL-1
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-2
    name: E2E テスト
    run_all: 未確定
  - id: TL-3
    name: 結合テスト（フロント）
    description: Vitest の `integration-node`（ビルドの入口を子プロセスで実行する・ビルドした配布物を Node で読み込む・Claude Code プラグインの MCP サーバーとフックを実行する）と `integration-browser`（ビルドした配布物を Chromium で読み込む）と `integration-storybook`（部品の描画のインターフェースと Storybook を空きポートで起動し、ストーリーを Playwright で開く。起動に約 40 秒。続けて Chromium を 1 つ起動し、最初のストーリーを開いて Vite が依存をまとめ終えるまで待ち、約 1 分かかる。各ファイルはその Chromium に接続してストーリーを開き、開いたページをテストごとに閉じる）と `integration-browser-touch`（タッチの点がある Chromium のコンテキストで、`mount.browser.test.ts` の名前が `_by_touch` で終わるテストだけを実行する）で実行する。同時に実行するファイルの数は、`integration-node`・`integration-storybook` の合計と `integration-browser`・`integration-browser-touch` のそれぞれで CPU 数の半分（全てのプロジェクトに同じ `maxWorkers`）までにする。VS Code 拡張機能の結合テストは Vitest でなく、補足「VS Code 拡張機能」のコマンドで別に実行する
    prerequisites:
      - '`npm ci` で依存を入れ、`npx playwright install chromium` で Chromium を入れてある'
      - Claude Code プラグインの結合テスト（`tests/integration/ClaudeCodeプラグイン/`）は、ビルドした `dist/cli.js` の MCP サーバーと `plugin/` のフックを実行する。Claude Code を起動しない
      - MCP サーバーは、ビルドした `dist/cli.js` の `serve` を `MDMARK_PORT` に空きポートを指定して子プロセスで起動し、`StreamableHTTPClientTransport` で MCP のクライアントとつなぐ（作業のフォルダーはツールの引数 `project_dir` で指定する）。ポートの上書き・使用中・不正な値を確認するケースは、`MDMARK_PORT` を指定して起動する
      - どのケースも 8782 を使用しない（手元の `mdmark serve` が使用する）
      - フックは `hooks/hooks.json` の PreToolUse のコマンドを、`CLAUDE_PLUGIN_ROOT` を `plugin/` にして子プロセスで実行する
    run_all: |-
      ```bash
      npm run test:integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --project 'integration*' {テストファイルパス}
        ```
    notes:
      VS Code 拡張機能: |-
        `@vscode/test-electron` が VS Code 1.141.0 と stable を起動し、拡張機能ホストの中で mocha が `vscode/tests/integration/*.test.ts`（ビルドした `vscode/out/test/*.test.mjs`）を実行する。Webview の DOM は拡張機能がテストのときだけ返却する `inspectPreview` で確認する。`vscode` を import しない処理は単体テスト（フロント）の `unit` プロジェクトが `tests/unit/vscode/` で実行する。

        前提: `npm ci` と `npm --prefix vscode ci` で依存を入れ、Node は 24 を使用する（`PATH` の先頭の `node` が古いと、拡張機能の配布物を作るテストが落ちる）。代役の配信が配る配布物は、テストの入口がこのブランチのソースを一時フォルダにビルドして用意する。ヘッドレスの Linux では `xvfb-run` を入れてある。

        ```bash
        xvfb-run -a npm --prefix vscode run test:integration
        ```

        初回と stable が上がったときは VS Code を `vscode/.vscode-test/` に取得する。jsDelivr と GitHub へは接続せず、`MDMARK_VSCODE_DIST_BASE`・`MDMARK_VSCODE_TAGS_URL` で手元の代役に差し替える（`MDMARK_VSCODE_DIST_BASE` は `http://127.0.0.1:{ポート}/mdmark` の構造で、配布物は `/mdmark@{バージョン}/dist/{ファイル}` で参照する）。VS Code のバージョンごとに新しい `--user-data-dir` で起動し、前回のバージョンが空の状態から始める。ユーザーデータの `User/settings.json` に `workbench.colorTheme` を `Dark 2026`（VS Code の既定のダークのテーマ）で配置し、パネルの axe の検査を起動ごとに同じテーマで確認する
      Claude Code の mod の結合テスト: |-
        `tests/integration/ClaudeCodeプラグイン/mdmark-style/` の mod のプラグイン mdmark-style の結合テストは Vitest でなく、`claude plugin test` で別に実行する。`scripts/test-mdmark-style.ts` が、ビルドした `mdmark-style/` を一時フォルダにコピーしてテストを並べ、`claude plugin validate` と `claude plugin test` を実行する（`claude-code/testing` の `$.ui.mount`・`$.classic` でエンジンが読み込んだ mod を通して描く。Claude Code のセッションは起動しない）。

        ランナーには Claude Code の CLI が無いため、手元で実行する。

        前提: `npm run build` で `mdmark-style/hooks/mod/mod.js` をビルドしてあり、Claude Code の CLI（`claude`）を PATH に入れてある。

        ```bash
        npm run test:mdmark-style
        ```

        1 ファイルだけ実行するときは、ファイル名を後ろに付ける（`npm run test:mdmark-style -- render-reply.test.tsx`）。テストは `claude-code/testing` の型で記載するため、ルートの `tsc` の対象から除いてある
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=integration -f paths="{結合テストのパス}" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-4
    name: 結合テスト（バック）
    run_all: 未確定
  - id: TL-5
    name: 単体テスト（フロント）
    description: Vitest の `unit` プロジェクト（Node）と、DOM を使用する `*.browser.test.ts` を実行する `unit-browser` プロジェクト（Chromium）で実行する
    prerequisites:
      - '`npm ci` で依存を入れ、`npx playwright install chromium` で Chromium を入れてある'
    run_all: |-
      ```bash
      npm run test:unit
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --project 'unit*' {テストファイルパス}
        ```
    notes:
      単体と結合を続けて実行する: |-
        ```bash
        npm test
        ```

        `npm run test:unit` のあとに `npm run test:integration` を実行する。E2E は含まない。
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-6
    name: 単体テスト（バック）
    run_all: 未確定
  - id: TL-7
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-8
    name: lint
    description: Biome の check（lint と整形）と、ESLint（`tools/eslint/` の ESLint 9。`src/`・`scripts/`・`vscode/src/`・`vscode/scripts/`・`plugin/`・`tests/`・`vscode/tests/` の TypeScript に複雑さの規則、Webview（`vscode/src/webview/`）に React などの規則）と、ルートと VS Code 拡張機能（`vscode/`）の tsc の型検査と、`.github/workflows/` の workflow の actionlint の検査。どれかが失敗しても全てを最後まで回し、1 つでも失敗したら失敗で終える。
    prerequisites:
      - '`npm ci` で依存を入れてある（`tools/eslint/` の依存は、無ければ `npm run lint:eslint` が起動の前に入れる）'
      - '`vscode/` の依存を入れてある（`npm --prefix vscode ci`）'
      - actionlint を PATH に入れてある（取得方法は [actionlint の公式のドキュメント](https://github.com/rhysd/actionlint/blob/main/docs/install.md)）
    run_all: |-
      ```bash
      (rc=0; npm run lint || rc=1; npm run lint:eslint || rc=1; npm run typecheck || rc=1; npm --prefix vscode run typecheck || rc=1; actionlint || rc=1; exit $rc)
      ```
    location: local
tags:
  - name: topic:テスト
    main: true
  - name: action:実行
lead: テストの層ごとの実行コマンドと前提を定め、単体・結合・E2E のテストや lint を実行するときに参照する。
