id: API-472-2
visibility: internal
title: "jsDelivr"
version:
  api_version: バージョンなし（URL にバージョンを持たない）
  checked_on: '2026-10-13'
auth:
  method: なし
endpoints:
  - name: GET /gh/{user}/{repo}@{version}/{file}
    method: GET
    path: /gh/{user}/{repo}@{version}/{file}
    summary: GitHub のリポジトリの、バージョンのタグか develop のブランチが指す commit のファイルを返却する
    idempotent: true
    description: バージョンにはタグ・commit・ブランチ・semver の範囲を指定できる。タグと commit の指定は中身が変わらず無期限にキャッシュされ、ブランチは 12 時間、バージョンの範囲と `latest` は 7 日キャッシュされる。1 ファイル 20MB を超えるファイルは配らない。
    request:
      - name: user
        type: string
        required: true
        location: path
        description: GitHub のユーザー名
        example: shuhei1101
      - name: repo
        type: string
        required: true
        location: path
        description: リポジトリ名
        example: mdmark
      - name: version
        type: string
        required: true
        location: path
        description: バージョンのタグか、develop の最新を読み込むときは `develop`
        example: v0.1.0
      - name: file
        type: string
        required: true
        location: path
        description: リポジトリの直下からのファイルのパス
        example: dist/index.js
    request_example: GET /gh/shuhei1101/mdmark@v0.1.0/dist/index.js
    status_codes:
      - code: '200'
        condition: ファイルがある
      - code: '404'
        condition: タグかファイルが無い
  - name: GET /npm/{package}@{version}/{file}
    method: GET
    path: /npm/{package}@{version}/{file}
    summary: npm のパッケージのバージョンを固定したファイルを配る（色分けのライブラリ）
    idempotent: true
    description: '`mount` が色分けの対象のコードブロックを持つ文書を描いた後に、`@highlightjs/cdn-assets` の `es/core.min.js` と `es/languages/{言語}.min.js` を `import()` で読み込む。CLI の書き出しも同じ URL から読み込んで埋める。`/+esm` は使用しない。応答は `application/javascript` と `access-control-allow-origin: *` を持つ'
    request:
      - name: package
        type: string
        required: true
        description: npm のパッケージ名（scope を含む）
        location: path
        example: '@highlightjs/cdn-assets'
      - name: version
        type: string
        required: true
        description: バージョン。完全に固定する
        location: path
        example: 11.12.0
      - name: file
        type: string
        required: true
        description: パッケージの中のファイルのパス
        location: path
        example: es/languages/typescript.min.js
    request_example: GET https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/core.min.js
    status_codes:
      - code: '200'
        condition: パッケージのそのバージョンにファイルがある
      - code: '404'
        condition: パッケージ・バージョン・ファイルのどれかが無い
  - name: GET /gh/{user}/{repo}@{version}/{file}（キャッシュの削除）
    method: GET
    path: /gh/{user}/{repo}@{version}/{file}
    summary: ブランチを指した URL のキャッシュを削除し、次の要求からそのブランチの先頭の commit のファイルを返却させる
    idempotent: true
    description: ホストは `https://purge.jsdelivr.net`。認証は要らない。応答は `id`・`status`（`finished`）・`timestamp`・`paths` を持つ JSON で、`paths` のキーは `/gh/{user}/{repo}@{version}/{file}`、値は `throttled` と提供元ごとの結果 `providers` を持つ。同じファイルを数秒の間に 3 回以上削除すると `throttled` が `true` になり（削除していない）、その後は測った 274 秒の間 `true` のままだった。続けて 2 回までは `false`
    request:
      - name: user
        type: string
        required: true
        location: path
        description: GitHub のユーザー名
        example: shuhei1101
      - name: repo
        type: string
        required: true
        location: path
        description: リポジトリ名
        example: mdmark
      - name: version
        type: string
        required: true
        location: path
        description: キャッシュを削除するブランチ
        example: develop
      - name: file
        type: string
        required: true
        location: path
        description: リポジトリの直下からのファイルのパス
        example: dist/index.js
    request_example: GET https://purge.jsdelivr.net/gh/shuhei1101/mdmark@develop/dist/index.js
    status_codes:
      - code: '200'
        condition: 削除を受け付けた（`throttled` が `true` のときは削除していない）
      - code: 4xx / 5xx
        condition: 書式の誤りか jsDelivr の障害
lead: npm と GitHub の公開リポジトリのファイルを配る無料の CDN。
verification:
  state: 済
  date: '2026-11-24'
  detail: '`GET /gh/shuhei1101/mdmark@480d928/README.md` が 200、同じ commit の無いファイル `dist/index.js` と、打っていないタグ `@v9.9.9` が 404 を返却することを確認した（2026-10-13）。キャッシュの削除は `GET https://purge.jsdelivr.net/gh/shuhei1101/mdmark@develop/dist/index.js` が 200 と `status: finished`・`throttled: false` を返却し、続けてもう 1 回も `false`、7 秒の間に 3 回目を呼ぶと 200 のまま `throttled: true` になり、10 秒おきに 274 秒呼び続けても `true` のままだったことを確認した（2026-11-24）'
base_urls:
  - env: 本番
    url: https://cdn.jsdelivr.net
  - env: 本番（キャッシュの削除）
    url: https://purge.jsdelivr.net
official_url: https://www.jsdelivr.com/
docs_url: https://github.com/jsdelivr/jsdelivr
used_in:
  - vscode/src/
  - .github/workflows/develop-dist.yml
tags:
  - name: tool:jsdelivr
    main: true
  - name: topic:配布物
