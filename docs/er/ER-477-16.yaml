id: ER-477-16
visibility: internal
title: 'ER 図: 用語集の表のマーカーの設定'
lead: '`<!-- glossary: {JSON のオブジェクト} -->` の名前の後ろに記載する、用語集の表のマーカーの設定の構造。'
tables:
  - name: glossary
    title: 用語集の表
    source: DATA-472-22#
    datastore: JSON
    access: 全件
    scale: ~1
    summary: 用語集の表のマーカー 1 つの設定
    columns:
      - name: term
        title: 用語の列
        source: DATA-472-22#fields[term]
        type: object
        description: 用語の列。`alias_row` が無いとき必須で、`alias_row` と一緒に記載しない
        not_null: false
        example: '{"column": "用語"}'
      - name: term.column
        title: 列の見出しの文字
        source: DATA-472-22#fields[term.column]
        type: string
        description: 列の見出しの文字
        not_null: true
        example: '"用語"'
      - name: meaning
        title: 意味の列
        source: DATA-472-22#fields[meaning]
        type: object
        description: 意味の列。`alias_row` が無いとき必須で、`alias_row` と一緒に記載しない
        not_null: false
        example: '{"column": "意味"}'
      - name: meaning.column
        title: 列の見出しの文字
        source: DATA-472-22#fields[meaning.column]
        type: string
        description: 列の見出しの文字
        not_null: true
        example: '"意味"'
      - name: aliases
        title: 別名の列
        source: DATA-472-22#fields[aliases]
        type: object
        description: 別名の列
        example: '{"column": "別名"}'
      - name: aliases.column
        title: 列の見出しの文字
        source: DATA-472-22#fields[aliases.column]
        type: string
        description: 列の見出しの文字
        not_null: true
        example: '"別名"'
      - name: avoid
        title: やめた言い方の列
        source: DATA-472-22#fields[avoid]
        type: object
        description: やめた言い方の列
        example: '{"column": "やめた言い方"}'
      - name: avoid.column
        title: 列の見出しの文字
        source: DATA-472-22#fields[avoid.column]
        type: string
        description: 列の見出しの文字
        not_null: true
        example: '"やめた言い方"'
      - name: alias_row
        title: エイリアスの元の行
        source: DATA-472-22#fields[alias_row]
        type: string
        check: 空でない
        description: 表を囲まず、この行から作った `term` のエイリアスで用語集の表を描くときの、設定の `aliases` の行の `id`。記載したマーカーは閉じのマーカーを持たない
        example: '"terms"'
notes:
  見本: |-
    ```html
    <!-- glossary: {"term": {"column": "用語"}, "meaning": {"column": "意味"}, "aliases": {"column": "別名"}} -->
    <!-- glossary: {"alias_row": "terms"} -->
    ```
  今の引数との対応: |-
    | 今の引数 | JSON のキー |
    | --- | --- |
    | `term=`・`meaning=`・`aliases=`・`avoid=` | `term.column`・`meaning.column`・`aliases.column`・`avoid.column` |
