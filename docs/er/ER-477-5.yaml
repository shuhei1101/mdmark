id: ER-477-5
visibility: internal
title: 'ER 図: ファイルツリーのマーカーの設定'
lead: '`<!-- tree: {JSON のオブジェクト} -->` の名前の後ろに記載する、ファイルツリーのマーカーの設定の構造。'
tables:
- name: tree
  title: ファイルツリー
  datastore: JSON
  access: 全件
  scale: ~1
  summary: ファイルツリーのマーカー 1 つの設定
  columns:
  - name: depth
    title: 開いて描く階層
    type: string / integer
    description: 開いて描く階層。整数は 1 以上で、ルートの深さを 0 として、その数より浅いフォルダを開く。省くと `"all"`（全てのフォルダを開く）
    default: '`"all"`'
    enum_values: '`all`'
    example: '2'
  - name: wrap
    title: 長い名前を折り返す
    type: boolean
    description: 長い名前を折り返す。省くと `false`
    default: '`false`'
    example: 'true'
notes:
  見本: |-
    ```html
    <!-- tree: {"depth": 2, "wrap": true} -->
    ```
  今の引数との対応: |-
    | 今の引数 | JSON のキー |
    | --- | --- |
    | `open=all`・`open=階層の数`・`wrap` | `depth`・`wrap` の `true` |
