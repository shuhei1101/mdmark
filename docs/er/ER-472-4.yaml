id: ER-472-4
visibility: internal
title: "ER 図: ガイド"
lead: ガイドにする `docs/` のページの索引。行ごとに名前・参照するとき・概要と、本文にする `docs/` のページを持つ。
overview: 原本はリポジトリの直下の `guide/index.yaml`（YAML の 1 ファイル）。最上位は `schema`（索引のバージョン。整数で今は `1`、必須）と `guides`（行の並び、必須）の 2 つのキーを持ち、ほかのキーを拒む。本文は別に記載せず、`docs/` の使用方法・リファレンスのページを指す。指したページは `docs/files.yaml` の行にタグ `topic:ガイド` を持ち、Claude Code は dev-docs の配信元 `mdmark` の `docs` の行からタグで絞って参照する。配布物のビルドが索引の構造と指すページの有無を検査し、プラグインには写さない
tables:
  - name: guides
    title: ガイドの行
    datastore: YAML
    summary: ガイドの名前 1 つと、その本文のページ
    primary_key: name
    scale: ~50
    access: 全件
    columns:
      - name: name
        title: 名前
        type: string
        not_null: true
        primary_key: true
        unique: true
        check: 空でない
        description: ガイドの名前。索引の中で一意
        example: notation
      - name: when
        title: 参照するとき
        type: string
        not_null: true
        check: 空でない
        description: どんな作業のときに参照するか
        example: マーカーと記法を記載するとき
      - name: summary
        title: 概要
        type: string
        not_null: true
        check: 空でない
        description: 1 文の概要
        example: 表・注意書き・タブなどのマーカーの一覧
      - name: page
        title: 本文のページ
        type: string
        not_null: true
        check: '`docs/` で始まり `.md` で終わる。区切りは `/`'
        description: 本文にするページ。リポジトリの直下からの相対パス。`docs/files.yaml` のこのページの行にタグ `topic:ガイド` を付ける
        example: docs/guide/記法.md
        notes: 無いページを指すと配布物のビルドが止まる
    status: planned
    introduced:
      pr: 72
refs:
  - SC-472-15#
  - IF-472-41#exceptions[ガイドの索引の誤り（終了コード 1）]
