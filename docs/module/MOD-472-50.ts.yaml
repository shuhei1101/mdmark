id: MOD-472-50
visibility: internal
title: ClaudeCodeプラグイン / MCPサーバー / mcp.ts
test_files:
  - tests/unit/src/plugin/mcp.test.ts
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP サーバーの名前（`serverInfo.name`）
    value: mdmark
    status: planned
  - name: INSTRUCTIONS_PROMPT_ID
    title: instructions のプロンプトの id
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP の `instructions` の本文を持つプロンプトファイルの id。変数 `location` に常駐サーバーが動いている場所（`describeServerLocation`）を指定する
    value: mcp/mdmark/instructions
    status: planned
  - name: TOOL_PROMPT_DIR
    title: ツールの説明のプロンプトのフォルダ
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: ツールの description のプロンプトファイルの id の頭。id は `{TOOL_PROMPT_DIR}/{ツールの名前の _ を - にしたもの}`
    value: mcp/mdmark/tools
    status: planned
functions:
  - name: describeServerLocation
    title: 常駐サーバーが動いている場所の文を作る
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 処理
    summary: '`instructions` の `{location}` に入れる文を、起動の方法から作る'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ launcher: string | undefined; unit: string; session: string }'
        required: true
        description: '`MDMARK_LAUNCHER` の値・unit の名前・tmux のセッション名'
    returns:
      type: string
      description: 場所の文
    process: 1. `launcher` が `systemd` なら `systemd --user の unit {unit}（ログは journalctl --user -u {unit}）`、ほかは `tmux のセッション {session}` を返却する
    unit_tests:
      - name: test_describe_server_location
        case: 正常
        summary: systemd なら unit とログ、ほかは tmux のセッション
        condition: '`launcher` が `systemd`・`tmux`・`undefined`、unit `u`・セッション `s`'
        mock: なし
        expected: '`systemd --user の unit u（ログは journalctl --user -u u）`・`tmux のセッション s`・`tmux のセッション s`'
    refs:
      - IF-472-4#constraints[instructions]
    status: planned
  - name: createMcpServer
    title: MCP サーバーを作る
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 組み立て
    summary: '`instructions` を持ち、`TOOLS` のツールを登録した `McpServer` を作る'
    description: '`mdmark serve` は要求ごとにこの関数でサーバーを作る。結合テストはこの関数で作ったサーバーを `InMemoryTransport` でクライアントとつなぐ'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ roots: ServerRoots; version: string; prompts: { instructions: string; descriptions: Record<string, string> }; stderr: (line: string) => void }'
        required: true
        description: サーバーの読み込む場所・サーバーのバージョン（mdmark のバージョン）・`loadServerPrompts` で描いた instructions と description・標準エラーへ 1 行書く関数
    returns:
      type: McpServer
      description: ツールを登録したサーバー
    process: |-
      1. `{ name: SERVER_NAME, version }` と `{ capabilities: { tools: {} }, instructions: prompts.instructions }` で `McpServer` を作る
      2. `TOOLS` の各ツールを、`prompts.descriptions` のそのツールの説明・`fromJsonSchema(inputSchema, ACCEPT_ALL_VALIDATOR)`・`annotations`で登録し、呼び出しごとに `roots` を指定してツールを呼ぶ（ツールを呼ぶ）
    unit_tests:
      - name: test_create_mcp_server
        case: 正常
        summary: 7 つのツールと instructions と annotations を出す
        condition: 作ったサーバーを `InMemoryTransport` でクライアントとつなぐ
        mock: なし（SDK の `Client`）
        expected: '`listTools` の名前が `TOOLS` の 7 つと一致し、どのツールの `inputSchema.properties` にも `project_dir` が無く、`check` と `list_templates` の `annotations` が `{ readOnlyHint: true }`、ほかの 5 つが `{ readOnlyHint: false, destructiveHint: true }`、`getInstructions()` が `prompts.instructions` と一致し、各ツールの `description` が `prompts.descriptions` と一致する'
      - name: test_create_mcp_server_when_arguments_invalid
        case: 正常
        summary: 合わない引数は SDK でなく日本語の文で返る
        condition: '`export_html` を一時フォルダの `project_dir` だけで呼ぶ'
        mock: なし（SDK の `Client`）
        expected: '`isError: true` で、テキストが `Input validation error` を含まず `file` を含む'
    callees:
      - 'MOD-472-48#functions[callTool]'
    refs:
      - LIB-472-2#catalogs[API].entries[McpServer]
    status: planned
  - name: loadServerPrompts
    title: サーバーの文を描く
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 読み込み
    summary: instructions と各ツールの description をプロンプトファイルから描く
    description: '`mdmark serve` が待ち受ける前に 1 回呼ぶ'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ root: string; serverLocation: string }'
        required: true
        description: パッケージの直下の絶対パスと、常駐サーバーが動いている場所の文
    returns:
      type: 'Promise<{ instructions: string; descriptions: Record<string, string> }>'
      description: 描いた instructions と、ツールの名前ごとの description
    process: |-
      1. `INSTRUCTIONS_PROMPT_ID` を `loadPrompt` で読み込み、`renderPrompt` に `{ location: serverLocation }` を指定して描く
      2. `TOOLS` の各ツールについて、`{TOOL_PROMPT_DIR}/{名前の _ を - にしたもの}` を読み込んで変数なしで描く
      3. どれかが `PromptError` ならそのまま投げる
    unit_tests:
      - name: test_load_server_prompts
        case: 正常
        summary: リポジトリのプロンプトファイルから全てのツールの文を描く
        condition: '`root` にリポジトリの直下、`serverLocation` に `tmux のセッション s`'
        mock: なし
        expected: '`instructions` が `tmux のセッション s` を含み 4,096 文字以下で、`descriptions` のキーが `TOOLS` の名前と一致し、どれも空でない'
      - name: test_load_server_prompts_when_prompt_missing
        case: 異常
        summary: ツールのプロンプトファイルが無いと誤りにする
        condition: 一時フォルダに instructions だけを配置する
        mock: なし
        expected: '`PromptError` を投げる'
    callees:
      - MOD-775-1#functions[loadPrompt]
      - MOD-775-1#functions[renderPrompt]
    status: planned
lead: 'MCP サーバーの組み立て・ツールの登録・instructions を受け持ち、MCP サーバーが示す使用方法を変えるときに参照する。'
tags:
  - name: tool:mcp
    main: true
  - name: tool:claude-code
  - name: topic:サーバー
  - name: action:登録
