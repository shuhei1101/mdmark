id: MOD-472-50
visibility: internal
title: ClaudeCodeプラグイン / MCPサーバー / mcp.ts
test_files:
  - tests/unit/src/plugin/mcp.test.ts
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP サーバーの名前（`serverInfo.name`）
    value: mdmark
    status: planned
    introduced:
      pr: 72
  - name: INSTRUCTIONS
    title: サーバーの使用方法の説明
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP の `instructions` に指定する、使用する場面と順序の事実の文。`{location}` は常駐サーバーが動いている場所（`describeServerLocation`）
    value: |-
      mdmark は Markdown 文書の記法・部品・図を描くライブラリで、この MCP サーバーは mdmark の文書の点検（check）・HTML への書き出し（export_html）・1 枚へのまとめ（build_site）と、利用側の CSS のテンプレートの一覧（list_templates）・登録（add_template）・配置（apply_template）を持つ。
      mdmark の記法・部品・図の記載方法は、ガイドとして dev-docs の配信元 mdmark にある。
      mdmark の文書を記載する前に、dev-docs の search_docs で source: "mdmark" の kind が docs の文書をタグ topic:ガイド で絞って一覧を引き、当てはまるページを view: "full" で読み込む。作業場所が mdmark のリポジトリの外なら outside_scope: true を付ける。
      dev-docs が無い、または配信元 mdmark が登録されていないときは、dev-docs が無いので見つかりません。
      記載した後は check で点検し、図はガイドの『描いた図を確認する』の手順で確認する。
      利用側の CSS を探すときは list_templates で一覧を引き、選んだテンプレートを apply_template で配置して、返った theme の値を設定の theme に記載する。作った CSS を使い回すときは add_template で登録する。
      mdmark の記法で記載する文書の拡張子は .mark.md で、利用者の指示が無い限り、純粋な .md には記法を使用しない。
      記法を使用しない Markdown の編集とコードの調査には、この MCP サーバーとガイドは要らない。

      この常駐サーバーは {location} で動く。止まったときは /mdmark:global-setup でもう一度起動できる。
    refs:
      - IF-472-4#constraints[instructions]
    status: planned
    introduced:
      pr: 72
functions:
  - name: describeServerLocation
    title: 常駐サーバーが動いている場所の文を作る
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 処理
    summary: '`instructions` の `{location}` に入れる文を、起動の方法から作る'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ launcher: string | undefined; unit: string; session: string }'
        required: true
        description: '`MDMARK_LAUNCHER` の値・unit の名前・tmux のセッション名'
    returns:
      type: string
      description: 場所の文
    process: 1. `launcher` が `systemd` なら `systemd --user の unit {unit}（ログは journalctl --user -u {unit}）`、ほかは `tmux のセッション {session}` を返却する
    unit_tests:
      - name: test_describe_server_location
        case: 正常
        summary: systemd なら unit とログ、ほかは tmux のセッション
        condition: '`launcher` が `systemd`・`tmux`・`undefined`、unit `u`・セッション `s`'
        mock: なし
        expected: '`systemd --user の unit u（ログは journalctl --user -u u）`・`tmux のセッション s`・`tmux のセッション s`'
    refs:
      - IF-472-4#constraints[instructions]
    status: planned
    introduced:
      pr: 444
  - name: createMcpServer
    title: MCP サーバーを作る
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 組み立て
    summary: '`instructions` を持ち、`TOOLS` のツールを登録した `McpServer` を作る'
    description: '`mdmark serve` は要求ごとにこの関数でサーバーを作る。結合テストはこの関数で作ったサーバーを `InMemoryTransport` でクライアントとつなぐ'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ roots: ServerRoots; version: string; serverLocation: string; stderr: (line: string) => void }'
        required: true
        description: サーバーの読み込む場所・サーバーのバージョン（mdmark のバージョン）・常駐サーバーが動いている場所の文・標準エラーへ 1 行書く関数
    returns:
      type: McpServer
      description: ツールを登録したサーバー
    process: |-
      1. `{ name: SERVER_NAME, version }` と `{ capabilities: { tools: {} }, instructions: INSTRUCTIONS の {location} を serverLocation にしたもの }` で `McpServer` を作る
      2. `TOOLS` の各ツールを、説明・`fromJsonSchema(inputSchema, ACCEPT_ALL_VALIDATOR)`・`annotations`（持つツールだけ）で登録し、呼び出しごとに `roots` を指定してツールを呼ぶ（ツールを呼ぶ）
    unit_tests:
      - name: test_create_mcp_server
        case: 正常
        summary: 6 つのツールと instructions と annotations を出す
        condition: 作ったサーバーを `InMemoryTransport` でクライアントとつなぐ
        mock: なし（SDK の `Client`）
        expected: '`listTools` の名前が `TOOLS` の 6 つと一致し、どのツールの `inputSchema.properties` にも `project_dir` が無く、`check` と `list_templates` だけの `annotations.readOnlyHint` が `true`、`getInstructions()` が `INSTRUCTIONS` の `{location}` を指定した文にしたもので 4,096 文字以下'
      - name: test_create_mcp_server_when_arguments_invalid
        case: 正常
        summary: 合わない引数は SDK でなく日本語の文で返る
        condition: '`export_html` を一時フォルダの `project_dir` だけで呼ぶ'
        mock: なし（SDK の `Client`）
        expected: '`isError: true` で、テキストが `Input validation error` を含まず `file` を含む'
    callees:
      - 'MOD-472-48#functions[callTool]'
    refs:
      - LIB-472-2#catalogs[API].entries[McpServer]
    status: planned
    introduced:
      pr: 72
