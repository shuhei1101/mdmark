id: MOD-472-116
visibility: internal
title: ライブラリ本体 / CLI / config-files.ts
test_files:
  - tests/unit/src/config-files.test.ts
data_models:
  - name: LayeredConfig
    title: 重ねた設定
    container: src/config-files.ts
    usecase: 共通
    role: DTO
    summary: '`loadLayeredConfig` の戻り値'
    properties:
      - name: config
        type: CliConfig
        description: 重ねた設定。相対パスの値はその値を記載した設定ファイルのフォルダから解決した絶対パス
      - name: files
        type: ConfigFile[]
        description: 重ねた設定ファイルを重ねた順（端末の設定 → 上 → 近い）に並べたもの
      - name: nearest
        type: string | undefined
        description: 最も近い `mdmark.config.yaml` の絶対パス（`explicit` のときはそのパス）
      - name: unreadable
        type: '{ path: string; line: number; message: string } | undefined'
        description: YAML として読み込めなかった最初の設定ファイル
      - name: issues
        type: CheckIssue[]
        description: 重ねた設定ファイルごとの `schema` のずれ（`file` は絶対パス）
    status: planned
    introduced:
      pr: 347
  - name: ConfigFile
    title: 重ねた設定ファイル
    container: src/config-files.ts
    usecase: 共通
    role: DTO
    summary: 重ねた設定ファイル 1 つの場所と層
    properties:
      - name: path
        type: string
        description: 絶対パス
      - name: layer
        type: '"settings" | "folder"'
        description: 端末の設定か、フォルダの `mdmark.config.yaml` か
    status: planned
    introduced:
      pr: 347
constants:
  - name: SETTINGS_FILE
    title: 端末の設定のファイル名
    container: src/config-files.ts
    usecase: 共通
    summary: '`${XDG_CONFIG_HOME:-~/.config}/mdmark/` の下の端末の設定のファイル名'
    value: '"settings.yaml"'
    status: planned
    introduced:
      pr: 347
functions:
  - name: validateConfig
    title: 設定の構造を検める
    container: src/config-files.ts
    usecase: 共通
    summary: 読み込んだ値を `schemas/mdmark.config.schema.json` と同じ構造で検め、合わないところを `schema` のずれで返却する
    description: 検めるのは、最上位がオブジェクトであること・`version` が `VERSION_PATTERN` に合う文字列・`features` の値が真偽値・`libraries` の値が文字列でキーがマーカーの名前・`index`・`theme`・`colorTheme`・`colorScheme` が文字列（`colorTheme` の知らない名前と `colorScheme` の知らない値はここでは拒まず、設定に残す）・`extensions` が文字列の配列・`build` があれば `include`（1 つ以上の文字列）と `out`（`.html` の文字列）を持ち `exclude`・`glossary` が文字列の配列で `entry` が文字列であること・`check` があれば `ignore` がマーカーの名前（`MARK_NAME_PATTERN`）の文字列の配列であること・`tooltips` があれば `placement` と `diagramPlacement` がどちらも（あれば）`top` か `bottom` であること・`labels` があればオブジェクトで `paramCopy` があれば空でない文字列であること（合わなければ `labels` を設定から落とす。知らないキーは拒まない）・`side-toc` があればオブジェクトで `mode` が `hover` か `fixed` であること・`table` があればオブジェクトで `pin` が（あれば）`each` か `through`、`long_column_min` が（あれば）0 より大きい有限の数であること（合わなければ `table` を設定から落とす）・`syntax` があればオブジェクトで `url` が文字列であること・`html-scripts` があればオブジェクトで `url` が文字列であること（合わなければ `html-scripts` を設定から落とす）・`mermaid` があればオブジェクトで、`url`・`theme` が（あれば）文字列、`themeVariables` が（あれば）オブジェクトであること（合わなければ `mermaid` を設定から落とす。`theme` の知らない名前はここでは拒まず、設定に残す）・`assets` があればオブジェクトで `root` が文字列であること・`map` があればオブジェクトであること（合わなければ `map` を設定から落とす。値はここでは拒まず設定に残し、描くときに既定にする）。`aliases` があれば配列であることを確認し、行は `validateAliasRows` で検める（ずれをそのまま `schema` のずれに加え、返った行を `config.aliases` に入れる）。知らない最上位のキーは拒まない。`aliases` の行のほかの構造の検査は手書きで、ライブラリを追加しない（索引の `normalizeIndex` と同じやり方）。検める構造は `schemas/mdmark.config.schema.json` と統一する
    kind: 関数
    scope: public
    args:
      - name: raw
        type: unknown
        required: true
        description: '`loadConfig` が読み込んだ値'
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
    returns:
      type: '{ config: CliConfig; issues: CheckIssue[] }'
      description: 構造の合うところだけを残した設定と、`schema` のずれ（無ければ空）
    unit_tests:
      - name: test_validate_config
        case: 正常
        summary: 構造の合う設定はずれ 0 件
        condition: '`version: v0.3.0`・`theme`・`extensions`・`build`（`include`・`out`）と知らないキー `title` を持つ値'
        mock: なし
        expected: '`issues` が空'
      - name: test_validate_config_when_build_out_missing
        case: 正常
        summary: '`build.out` が無いと schema のずれを返却する'
        condition: '`build` が `include` だけを持つ'
        mock: なし
        expected: '`{ where: "build", kind: "schema" }` の 1 件で、`message` に `build.out` が入る'
      - name: test_validate_config_when_empty
        case: 正常
        summary: 空の設定ファイル（`null`）を schema のずれにする
        condition: '`raw` が `null`'
        mock: なし
        expected: '`{ where: "", kind: "schema" }` の 1 件'
      - name: test_validate_config_when_libraries_not_object
        case: 正常
        summary: 構造の違う `libraries` を schema のずれにし、設定から落とす
        condition: '`libraries` が文字列'
        mock: なし
        expected: '`where` が `libraries` のずれが 1 件で、`config.libraries` が無い'
      - name: test_validate_config_when_version_invalid
        case: 異常
        summary: 書式の違う version を schema のずれにする
        condition: '`version: 0.3`'
        mock: なし
        expected: '`where` が `version` の `schema` のずれが 1 件'
      - name: test_validate_config_when_check_ignore_invalid
        case: 正常
        summary: マーカーの名前の書式に合わない `check.ignore` の値を schema のずれにし、設定から落とす
        condition: '`check.ignore` が `["prettier-ignore", "Bad Name"]`'
        mock: なし
        expected: '`where` が `check.ignore[1]` の `schema` のずれが 1 件で、`config.check.ignore` が `["prettier-ignore"]`'
      - name: test_validate_config_when_tooltip_placement_invalid
        case: 正常
        summary: '`top`・`bottom` 以外の `tooltips.placement` を schema のずれにし、設定から落とす'
        condition: '`tooltips.placement` が `left` の値と、`bottom` の値'
        mock: なし
        expected: '`left` は `where` が `tooltips.placement` の `schema` のずれが 1 件で `config.tooltips` が無い。`bottom` は `issues` が空で `config.tooltips.placement` が `bottom`'
      - name: test_validate_config_when_labels_invalid
        case: 正常
        summary: オブジェクトでない `labels` と、空でない文字列でない `labels.paramCopy` を schema のずれにし、設定から落とす
        condition: '`labels` が `コピー`（文字列）の値、`labels.paramCopy` が `""` の値、`1` の値、`コピー` の値'
        mock: なし
        expected: 1 つ目は `where` が `labels`、2・3 つ目は `where` が `labels.paramCopy` の `schema` のずれがそれぞれ 1 件で `config.labels` が無い。4 つ目は `issues` が空で `config.labels.paramCopy` が `コピー`
      - name: test_validate_config_when_html_scripts_url_invalid
        case: 正常
        summary: 文字列でない `html-scripts.url` を schema のずれにし、設定から落とす
        condition: '`html-scripts.url` が `1` の値と、`/vendor/babel.mjs` の値'
        mock: なし
        expected: '`1` は `where` が `html-scripts.url` の `schema` のずれが 1 件で `config["html-scripts"]` が無い。`/vendor/babel.mjs` は `issues` が空で `config["html-scripts"].url` が `/vendor/babel.mjs`'
      - name: test_validate_config_when_mermaid_invalid
        case: 正常
        summary: 構造の合わない `mermaid` を schema のずれにし、設定から落とす
        condition: '`mermaid.url` が `1` の値、`mermaid.themeVariables` が `"x"` の値、`{ url: "/vendor/mermaid.mjs", theme: "no-such-theme" }` の値'
        mock: なし
        expected: 1 つ目は `where` が `mermaid.url`、2 つ目は `mermaid.themeVariables` の `schema` のずれが 1 件で、どちらも `config.mermaid` が無い。3 つ目は `issues` が空で `config.mermaid` が記載した値のまま
      - name: test_validate_config_when_syntax_url_invalid
        case: 正常
        summary: 文字列でない `syntax.url` を schema のずれにし、設定から落とす
        condition: '`syntax.url` が `1` の値と、`/vendor/hl/` の値'
        mock: なし
        expected: '`1` は `where` が `syntax.url` の `schema` のずれが 1 件で `config.syntax` が無い。`/vendor/hl/` は `issues` が空で `config.syntax.url` が `/vendor/hl/`'
      - name: test_validate_config_when_side_toc_mode_invalid
        case: 正常
        summary: '`hover`・`fixed` 以外の `side-toc.mode` を schema のずれにし、設定から落とす'
        condition: '`side-toc.mode` が `left` の値と、`fixed` の値'
        mock: なし
        expected: '`left` は `where` が `side-toc.mode` の `schema` のずれが 1 件で `config["side-toc"]` が無い。`fixed` は `issues` が空で `config["side-toc"].mode` が `fixed`'
      - name: test_validate_config_when_aliases_invalid
        case: 異常
        summary: aliases の Schema に合わない行を schema のずれにし、行の位置を保つ
        condition: '`aliases` に、Schema に合う行と、`alias_type` が `memo` の行'
        mock: なし
        expected: '`schema` のずれが 1 件で `where` が `aliases[1].alias_type`、`config.aliases` の長さが 2 で 2 番目が `null`'
      - name: test_validate_config_when_color_theme_invalid
        case: 正常
        summary: 文字列でない `colorTheme` を schema のずれにして落とし、知らない名前はそのまま残す
        condition: '`colorTheme` が `1` の値と、`sepia` の値'
        mock: なし
        expected: '`1` は `where` が `colorTheme` の `schema` のずれが 1 件で `config.colorTheme` が無い。`sepia` は `issues` が空で `config.colorTheme` が `sepia`'
      - name: test_validate_config_when_color_scheme_invalid
        case: 正常
        summary: 文字列でない `colorScheme` を schema のずれにして落とし、知らない値はそのまま残す
        condition: '`colorScheme` が `1` の値と、`sepia` の値'
        mock: なし
        expected: '`1` は `where` が `colorScheme` の `schema` のずれが 1 件で `config.colorScheme` が無い。`sepia` は `issues` が空で `config.colorScheme` が `sepia`'
      - name: test_validate_config_when_assets_not_string
        case: 正常
        summary: 構造の違う assets.root を schema のずれにする
        condition: '`assets: { root: 1 }`'
        mock: なし
        expected: '`{ where: "assets.root", kind: "schema" }` の 1 件'
      - name: test_validate_config_when_diagram_placement_invalid
        case: 異常
        summary: '`top`・`bottom` 以外の `tooltips.diagramPlacement` を schema のずれにし、設定から落とす'
        condition: '`tooltips.diagramPlacement` が `left` の値と、`top` の値'
        mock: なし
        expected: '`left` は `where` が `tooltips.diagramPlacement` の `schema` のずれが 1 件で、内容に `top`・`bottom` があり、`config.tooltips` が無い。`top` は `issues` が空で `config.tooltips.diagramPlacement` が `top`'
      - name: test_validate_config_when_map_invalid
        case: 正常
        summary: オブジェクトでない `map` を schema のずれにして落とし、知らない値はそのまま残す
        condition: '`map.kinds.store.shape` が `hexagon` の値と、`map` が文字列の値'
        mock: なし
        expected: 1 つ目は `issues` が空で `config.map.kinds.store.shape` が `hexagon` のまま。2 つ目は `where` が `map` のずれが 1 件で `config.map` が無い
      - name: test_validate_config_when_table_pin_invalid
        case: 正常
        summary: '`each`・`through` 以外の `table.pin` を schema のずれにし、設定から落とす'
        condition: '`table.pin` が `left` の値と、`through` の値'
        mock: なし
        expected: '`left` は `where` が `table.pin` の `schema` のずれが 1 件で `config.table` が無い。`through` は `issues` が空で `config.table.pin` が `through`'
      - name: test_validate_config_when_table_long_column_min_invalid
        case: 正常
        summary: 0 より大きい数でない `table.long_column_min` を schema のずれにし、設定から落とす
        condition: '`table.long_column_min` が `0`・`"wide"` の値と、`30` の値'
        mock: なし
        expected: '`0`・`"wide"` はどちらも `where` が `table.long_column_min` の `schema` のずれが 1 件で `config.table` が無い。`30` は `issues` が空で `config.table.long_column_min` が `30`'
    status: planned
    introduced:
      pr: 32
    notes:
      配置場所: 設定を重ねて読み込む処理と VS Code 拡張機能からも呼ぶため、`src/config-files.ts` に配置し、`src/cli/config.ts` は import して使用する。使用する `schemaIssue`・`validateBuild`・`validateCheck`・`isValid*` も同じファイルへ移す。`CliError` には依存しない
  - name: loadLayeredConfig
    title: 設定を重ねて読み込む
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    role: サービス
    summary: 端末の設定と上のフォルダの設定ファイルを読み込み、構造を検めて、相対パスを絶対パスにしてから重ねる
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; explicit?: string; purpose: "preview" | "export"; env: Record<string, string | undefined>; home: string; readFile: (path: string) => Promise<string>; isFile: (path: string) => Promise<boolean>; explicitName: string; keepInvalid?: boolean }'
        required: true
        description: インターフェース定義『設定を重ねて読み込む』のリクエストと、ファイルを読み込む関数（`ENOENT` の例外を投げる）・ファイルがあるかを確認する関数・誤りの文に入れる `explicit` の呼び名（CLI は `--config のパス`、MCP は `config のパス`、VS Code 拡張機能は `mdmark.configPath`）・構造の合わない設定ファイルも合うところだけを重ねるか（`mdmark check` が残りを点検するために `true` で呼ぶ。既定 `false`）
    returns:
      type: Promise<LayeredConfig>
      description: 重ねた設定・重ねた設定ファイル・最も近い設定ファイル・読み込めないファイル・ずれ
    process: |-
      1. 端末の設定のパスを決める（端末の設定のパスを決める）
      2. 端末の設定を `readFile` で読み込み、YAML として読み込む
         - `ENOENT` の場合、端末の設定を空の設定として扱い、層に含めない
         - YAML として読み込めない場合、`unreadable` に入れ、端末の設定を重ねない
      3. 端末の設定の構造を検める（設定の構造を検める、端末の設定だけのキーを検める）。ずれは `issues` に入れ、ずれがあれば端末の設定を重ねない（`keepInvalid` が `true` のときは、構造の合うところだけを重ねる）
      4. 端末の設定の `config.cascade`（既定 `false`）を読み込む
      5. `explicit` があれば `cwd` から解決したそのファイルだけを、無ければ上のフォルダの設定ファイルを集める（上のフォルダの設定ファイルを探す。`isFile` は引数のものを指定する）
         - `explicit` のファイルが無い（`isFile` が `false`）場合、`ConfigNotFoundError` を投げる
      6. 集めたファイルを上 → 近いの順に読み込み、2・3 と同じく `unreadable`・`issues` に入れ、読み込めて構造が合うものだけを残す（構造は設定の構造を検めるだけで検める）。`config` のキーはフォルダの設定では捨てる
      7. 残した各層の相対パスを、その層のファイルのフォルダから絶対パスにする（相対パスを絶対パスにする）
      8. `purpose` が `export` で端末の設定の `config.applyToExport` が `false` の場合、端末の設定の層を削除する
      9. 端末の設定 → 上 → 近いの順に重ねる（設定を重ねる）
      10. 重ねた設定から `config` のキーを除き、`LayeredConfig` を返却する
    exceptions:
      - name: ConfigNotFoundError
        condition: '`explicit` のファイルが無い'
        message: '{explicit} が見つかりません（{explicitName}）。パスを修正するか、mdmark init で配置してください。'
    callees:
      - '#functions[resolveSettingsPath]'
      - '#functions[findConfigChain]'
      - '#functions[validateSettingsKeys]'
      - '#functions[absolutizeConfigPaths]'
      - '#functions[mergeConfigs]'
      - MOD-472-116#functions[validateConfig]
    refs:
      - IF-472-40#
    unit_tests:
      - name: test_load_layered_config
        case: 正常
        summary: 端末の設定・上・近いを重ね、相対パスを記載したファイルから解決する
        condition: '端末の設定に `config.cascade: true`・`features.callout: false`、上に `theme: ./theme.css`、近いに `features.table: false`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`config.features` が `{ callout: false, table: false }`、`config.theme` が上のフォルダの絶対パス、`files` が 3 つの順'
      - name: test_load_layered_config_when_first_only
        case: 正常
        summary: '`config.cascade` が `false` なら近い 1 つだけ'
        condition: '`config.cascade` を持たない端末の設定と、上と近いの設定ファイル'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` が端末の設定と近いの 2 つ、`config.theme` が無い'
      - name: test_load_layered_config_when_export_without_settings
        case: 正常
        summary: '`config.applyToExport: false` の書き出しで端末の設定を重ねない'
        condition: '`purpose: export`、端末の設定に `config.applyToExport: false`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` に端末の設定が無く、`config.features.callout` が無い'
      - name: test_load_layered_config_when_settings_missing
        case: 正常
        summary: 端末の設定が無ければ空の設定として扱う
        condition: '`readFile` が端末の設定に `ENOENT` を投げる'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` に端末の設定が無く、`unreadable`・`issues` が空'
      - name: test_load_layered_config_when_unreadable
        case: 正常
        summary: YAML として読み込めないファイルを `unreadable` にして重ねない
        condition: 端末の設定の 3 行目に閉じていない括弧
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`unreadable.path` が端末の設定、`line` が 3、`files` に端末の設定が無い'
      - name: test_load_layered_config_when_invalid
        case: 正常
        summary: 構造の合わないファイルのずれを返却して重ねない
        condition: '近いの設定に `features.callout: maybe`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`issues[0].file` が近いの設定の絶対パス、`issues[0].where` が `features.callout`'
      - name: test_load_layered_config_when_folder_has_config_key
        case: 正常
        summary: フォルダの設定の `config` のキーは読み込まない
        condition: '近いの設定に `config.cascade: true`、端末の設定は `config.cascade` を持たない'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` が端末の設定と近いの 2 つ（上を重ねない）'
      - name: test_load_layered_config_when_explicit_missing
        case: 異常
        summary: '`explicit` のファイルが無い'
        condition: '`explicit` に無いファイル'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`ConfigNotFoundError` を投げ、メッセージにそのパス'
        exception: '`explicit` のファイルが無い'
    status: planned
    introduced:
      pr: 347
  - name: resolveSettingsPath
    title: 端末の設定のパスを決める
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: '`MDMARK_CONFIG`、無ければ `${XDG_CONFIG_HOME:-{home}/.config}/mdmark/settings.yaml` を返却する'
    scope: public
    args:
      - name: options
        type: '{ env: Record<string, string | undefined>; home: string }'
        required: true
        description: 環境変数とホームのフォルダ
    returns:
      type: string
      description: 端末の設定の絶対パス
    process: |-
      1. `env.MDMARK_CONFIG` が空でなければその値を返却する
      2. `env.XDG_CONFIG_HOME` が空でなければそれを、無ければ `{home}/.config` を基準にし、`mdmark/{SETTINGS_FILE}` を続けて返却する
    unit_tests:
      - name: test_resolve_settings_path
        case: 正常
        summary: '`MDMARK_CONFIG` を優先する'
        condition: '`MDMARK_CONFIG` と `XDG_CONFIG_HOME` の両方がある'
        mock: なし
        expected: '`MDMARK_CONFIG` の値'
      - name: test_resolve_settings_path_when_xdg
        case: 正常
        summary: '`XDG_CONFIG_HOME` の下を使用する'
        condition: '`XDG_CONFIG_HOME` だけがある'
        mock: なし
        expected: '`{XDG_CONFIG_HOME}/mdmark/settings.yaml`'
      - name: test_resolve_settings_path_when_no_env
        case: 正常
        summary: ホームの `.config` の下を使用する
        condition: どちらの環境変数も無い
        mock: なし
        expected: '`{home}/.config/mdmark/settings.yaml`'
    status: planned
    introduced:
      pr: 347
  - name: findConfigChain
    title: 上のフォルダの設定ファイルを探す
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: '`cwd` から上へ `mdmark.config.yaml` を探し、上 → 近いの順に返却する'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; cascade: boolean; isFile: (path: string) => Promise<boolean> }'
        required: true
        description: 起点のフォルダ・全て集めるか・ファイルがあるかを確認する関数
    returns:
      type: Promise<string[]>
      description: 見つけた設定ファイルの絶対パス（上 → 近いの順）。無ければ空
    process: |-
      1. `cwd` からルートまで、各フォルダの `mdmark.config.yaml` を確認する
         - `cascade` が `false` の場合、最初に見つかった 1 つで止める
      2. 見つけた順（近い → 上）を逆にして返却する
    unit_tests:
      - name: test_find_config_chain
        case: 正常
        summary: 全て集めて上 → 近いの順に返却する
        condition: '`cascade: true`、2 段上と起点に設定ファイル'
        mock: '`isFile` を表に差し替える'
        expected: 2 段上・起点の順の 2 つ
      - name: test_find_config_chain_when_first_only
        case: 正常
        summary: '`cascade: false` なら近い 1 つ'
        condition: '`cascade: false`、同じ配置'
        mock: '`isFile` を表に差し替える'
        expected: 起点の 1 つ
      - name: test_find_config_chain_when_none
        case: 正常
        summary: 見つからなければ空
        condition: どのフォルダにも無い
        mock: '`isFile` を表に差し替える'
        expected: 空の配列
    status: planned
    introduced:
      pr: 347
    description: 'VS Code 拡張機能の「設定ファイルを開く」も、最も近い設定ファイルを参照するために `cascade: false` で呼ぶ'
  - name: absolutizeConfigPaths
    title: 相対パスを絶対パスにする
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 1 つの層の設定の相対パスの値を、その層のファイルのフォルダから絶対パスにする
    scope: internal
    args:
      - name: options
        type: '{ config: CliConfig; dir: string }'
        required: true
        description: 1 つの層の検めた設定と、そのファイルのフォルダ
    returns:
      type: CliConfig
      description: 相対パスを絶対パスにした設定（指定した設定は書き換えない）
    process: |-
      1. `theme`・`index`・`assets.root`・`build.out`・`build.entry` と、`extensions`・`build.include`・`build.exclude`・`build.glossary` の各要素と、`libraries` の値・`html-scripts.url`・`syntax.url` と `aliases` の各行の `paths` を、`dir` から絶対パスにする
         - `http:`・`https:` の URL は替えない
    unit_tests:
      - name: test_absolutize_config_paths
        case: 正常
        summary: 相対パスを絶対パスにし、URL は替えない
        condition: '`theme: ./theme.css`・`libraries: { a: ./a.js, b: https://x/b.js }`・`build.include: ["*.md"]`'
        mock: なし
        expected: '`theme`・`libraries.a`・`build.include[0]` が `dir` の下の絶対パスで、`libraries.b` はそのまま'
    status: planned
    introduced:
      pr: 347
  - name: mergeConfigs
    title: 設定を重ねる
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 層を前から順に重ね、マップはキーごとに、それ以外は後の値で置き換える
    scope: public
    args:
      - name: layers
        type: CliConfig[]
        required: true
        description: 重ねる順に並べた層
    returns:
      type: CliConfig
      description: 重ねた設定
    process: |-
      1. 空の設定から始め、各層のキーごとに次を適用する
         - 前の値と後の値がどちらもマップ（配列でも `null` でもないオブジェクト）の場合、キーごとに同じ規則で重ねる
         - それ以外の場合、後の値で置き換える
    unit_tests:
      - name: test_merge_configs
        case: 正常
        summary: マップはキーごと、配列と文字列は置き換え
        condition: '前 `{ features: { a: true }, extensions: [x], theme: t1 }`、後 `{ features: { b: false }, extensions: [y], theme: t2 }`'
        mock: なし
        expected: '`{ features: { a: true, b: false }, extensions: [y], theme: t2 }`'
    status: planned
    introduced:
      pr: 347
  - name: displayConfigPath
    title: 設定ファイルのパスを表示の構造にする
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 基準のフォルダの中なら相対パス、外ならホームを `~` にしたパスを返却する
    scope: public
    args:
      - name: options
        type: '{ path: string; base: string; home: string }'
        required: true
        description: 設定ファイルの絶対パス・基準のフォルダ・ホームのフォルダ
    returns:
      type: string
      description: 表示するパス（区切りは `/`）
    process: |-
      1. `path` が `base` の下なら `base` からの相対パスを返却する
      2. `home` の下なら先頭の `home` を `~` にして返却する
      3. どちらでもなければ `path` を返却する
    unit_tests:
      - name: test_display_config_path
        case: 正常
        summary: 基準の中は相対パス
        condition: '`path` が `base/docs/mdmark.config.yaml`'
        mock: なし
        expected: '`docs/mdmark.config.yaml`'
      - name: test_display_config_path_when_home
        case: 正常
        summary: 基準の外でホームの下は `~` のパス
        condition: '`path` が `{home}/.config/mdmark/settings.yaml`、`base` はホームの外'
        mock: なし
        expected: '`~/.config/mdmark/settings.yaml`'
      - name: test_display_config_path_when_outside
        case: 正常
        summary: どちらの外も絶対パス
        condition: '`path` が `/etc/mdmark/settings.yaml`'
        mock: なし
        expected: '`/etc/mdmark/settings.yaml`'
    status: planned
    introduced:
      pr: 347
  - name: validateSettingsKeys
    title: 端末の設定だけのキーを検める
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 端末の設定の `config` がマップで、`config.cascade`・`config.applyToExport` が真偽値かを検め、合わないところを `schema` のずれで返却する
    scope: internal
    args:
      - name: raw
        type: unknown
        required: true
        description: 端末の設定を YAML として読み込んだ値
      - name: file
        type: string
        required: true
        description: ずれの `file` に入れる端末の設定の絶対パス
    returns:
      type: CheckIssue[]
      description: '`config`・`config.cascade`・`config.applyToExport` のずれ。合うときは空'
    process: |-
      1. `raw.config` が無ければ空を返却する
      2. `raw.config` がマップでなければ、`config` の `schema` のずれを返却する
      3. `cascade`・`applyToExport` のうち、あって真偽値でないものごとに `config.{キー}` の `schema` のずれを返却する（知らないキーは拒まない）
    unit_tests:
      - name: test_validate_settings_keys
        case: 正常
        summary: 真偽値ならずれが無い
        condition: '`config: { cascade: true, applyToExport: false }`'
        mock: なし
        expected: 空の配列
      - name: test_validate_settings_keys_when_not_boolean
        case: 正常
        summary: 真偽値でない値をずれにする
        condition: '`config: { cascade: maybe }`'
        mock: なし
        expected: '`where` が `config.cascade` の `schema` のずれ 1 件'
      - name: test_validate_settings_keys_when_not_map
        case: 正常
        summary: '`config` がマップでない'
        condition: '`config: true`'
        mock: なし
        expected: '`where` が `config` の `schema` のずれ 1 件'
    status: planned
    introduced:
      pr: 347
  - name: relativizeConfigPaths
    title: パスを相対パスに戻す
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 重ねた設定のパスの値のうち `dir` の下のものを `dir` からの相対パス（区切りは `/`）に戻す
    description: CLI（`requireConfig`・`collectCheckIssues`）は最も近い設定ファイルのフォルダを基準に設定のパスを読み込み、書き出しの通知や「`build.entry` がまとめる文書に該当するか」の照合もそのフォルダからの相対パスで行うため、重ねた後に戻す。外のパスと URL は替えない。対象のキーは相対パスを絶対パスにすると同じ
    scope: public
    args:
      - name: options
        type: '{ config: CliConfig; dir: string }'
        required: true
        description: 重ねた設定と、最も近い設定ファイルのフォルダ
    returns:
      type: CliConfig
      description: '`dir` の下のパスを相対パスにした設定（指定した設定は書き換えない）'
    unit_tests:
      - name: test_relativize_config_paths
        case: 正常
        summary: 下のパスだけを相対パスに戻し、外のパスと URL は替えない
        condition: '`dir` が `/w/docs`、`theme: /w/docs/theme.css`・`index: /w/index.yaml`・`libraries: { b: https://x/b.js }`・`build: { include: [/w/docs/*.md], out: /w/docs/site.html }`'
        mock: なし
        expected: '`theme` が `theme.css`、`index` が `/w/index.yaml`、`libraries.b` がそのまま、`build.include[0]` が `*.md`、`build.out` が `site.html`'
    status: planned
    introduced:
      pr: 347
