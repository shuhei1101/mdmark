id: MOD-472-10
visibility: internal
title: ClaudeCodeプラグイン / セットアップ / 書き込み / write.ts
lead: '`write-settings`・`write-config` と `settings.json` の `env` の書き換え。'
test_files:
  - tests/unit/src/plugin/setup/write.test.ts
functions:
  - name: parseSetArgs
    title: --set を読み込む
    kind: 関数
    container: src/plugin/setup/write.ts
    usecase: 端末の設定を書き込む
    role: 処理
    summary: '`{キー}={値}` の並びを、ドットのキーと YAML として読み込んだ値の組にする'
    scope: public
    is_async: false
    args:
      - name: args
        type: string[]
        required: true
        description: '`--set` の値の並び'
    returns:
      type: 'Array<{ path: string[]; value: unknown }>'
      description: キーの区切りと値
    process: 1. 最初の `=` で分け、キーを `.` で区切り、値を YAML として読み込む。`=` が無ければ `SetupError`（1）
    unit_tests:
      - name: test_parse_set_args
        case: 正常
        summary: 値を YAML として読み込む
        condition: '`["features.table=false", "serve.tmuxSession=x"]`'
        mock: なし
        expected: '`[{ path: ["features","table"], value: false }, { path: ["serve","tmuxSession"], value: "x" }]`'
      - name: test_parse_set_args_when_no_equal
        case: 異常
        summary: = が無ければ SetupError
        condition: '`["features.table"]`'
        mock: なし
        expected: 終了コード 1 の `SetupError`
    refs:
      - IF-472-12#request
    status: planned
    introduced:
      pr: 354
  - name: writeSettings
    title: 端末の設定を書き込む
    kind: 関数
    container: src/plugin/setup/write.ts
    usecase: 端末の設定を書き込む
    role: 処理
    summary: '`write-settings` の本体。端末の設定を作る・書き換え、既定のパスでなければ `settings.json` の `env` に `MDMARK_CONFIG` を書き込む'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; pluginRoot: string; version: string } & { sets: string[] }'
        required: true
        description: 環境変数・プラグインの直下・プラグインのビルドで埋めた mdmark のバージョン・`--set` の値
    returns:
      type: 'Promise<{ written: string[]; keys: string[] }>'
      description: 書き込んだファイルとキー
    process: |-
      1. パスを決め、端末の設定があれば `yaml` の `Document` で読み込む。無ければ `plugin/settings.sample.yaml` を雛形にし、`version` をプラグインのビルドで埋めた mdmark のバージョンにする
      2. `--set` の組を `Document.setIn` で当て、`toJS()` を `validateConfig`（`settings: true`）で検める。ずれがあれば `SetupError`（1）で何も書き込まない
      3. 端末の設定を書き込む（親のフォルダが無ければ作る）
      4. `defaultPath` が偽なら `writeClaudeEnv` で `MDMARK_CONFIG` を書き込む
    side_effects: 端末の設定と `settings.json` を書き込む
    callees:
      - '#functions[parseSetArgs]'
      - '#functions[writeClaudeEnv]'
      - MOD-472-116#functions[validateSettingsKeys]
      - LIB-472-36#
    unit_tests:
      - name: test_write_settings
        case: 正常
        summary: 雛形から作り env を書き込む
        condition: 一時フォルダの `MDMARK_CONFIG`・`CLAUDE_CONFIG_DIR`、`sets` が `["features.table=false"]`
        mock: なし
        expected: '端末の設定が `version` と `features.table: false` を持ち、`settings.json` の `env.MDMARK_CONFIG` が端末の設定のパス'
      - name: test_write_settings_when_invalid
        case: 異常
        summary: Schema に合わなければ書き込まない
        condition: '`sets` が `["config.cascade=yes"]`'
        mock: なし
        expected: 終了コード 1 の `SetupError`、端末の設定と `settings.json` が無い
      - name: test_write_settings_when_comment
        case: 正常
        summary: コメントを残す
        condition: 'コメントの行と `features.callout: false` を持つ端末の設定、`sets` が `["serve.tmuxSession=x"]`'
        mock: なし
        expected: 'コメントの行と `features.callout: false` が残り、`version` が変わらない'
    refs:
      - IF-472-12#
    status: planned
    introduced:
      pr: 354
  - name: writeClaudeEnv
    title: settings.json の env に書き込む
    kind: 関数
    container: src/plugin/setup/write.ts
    usecase: 端末の設定を書き込む
    role: 処理
    summary: '`settings.json` の `env` の 1 つのキーだけを書き換える'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ path: string; key: string; value: string }'
        required: true
        description: '`settings.json` のパス・キー・値'
    returns:
      type: Promise<boolean>
      description: 書き換えたか（同じ値なら偽で書き込まない）
    process: |-
      1. `settings.json` を JSON として読み込み（無ければ `{}`）、`env[key]` が同じ値なら偽を返却する
      2. `env[key]` を書き込み、ほかのキーの並びを保って 2 つの空白で字下げした JSON を書き込む
    side_effects: '`settings.json` を書き込む'
    unit_tests:
      - name: test_write_claude_env
        case: 正常
        summary: ほかのキーを残して env を書き込む
        condition: '`{ "model": "x", "env": { "A": "1" } }` の `settings.json`'
        mock: なし
        expected: '`env` が `{ "A": "1", "MDMARK_CONFIG": "/p" }`、`model` が残る'
      - name: test_write_claude_env_when_same
        case: 正常
        summary: 同じ値なら書き込まない
        condition: '`env.MDMARK_CONFIG` が `/p` の `settings.json`'
        mock: なし
        expected: 偽を返却し、ファイルの更新時刻が変わらない
    refs:
      - IF-472-12#constraints[settings.json]
    status: planned
    introduced:
      pr: 354
  - name: writeConfig
    title: 文書のフォルダの設定を書き込む
    kind: 関数
    container: src/plugin/setup/write.ts
    usecase: 文書のフォルダの設定を書き込む
    role: 処理
    summary: '`write-config` の本体'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; pluginRoot: string; version: string } & { dir: string; sets: string[] }'
        required: true
        description: 環境変数・プラグインの直下・プラグインのビルドで埋めた mdmark のバージョン・文書のフォルダ・`--set` の値
    returns:
      type: 'Promise<{ written: string[]; keys: string[] }>'
      description: 書き込んだファイルとキー
    process: |-
      1. `{dir}/mdmark.config.yaml` があれば `Document` で読み込み、無ければ `mdmark init` と同じ雛形を読み込み `version` をプラグインのビルドで埋めた mdmark のバージョンにする
      2. `--set` のキーが端末の設定だけが持つキー（`config.*`・`serve.*`）なら `SetupError`（1）
      3. 適用した後を `validateConfig` で検め、ずれがあれば `SetupError`（1）で書き込まない
      4. 書き込む
    side_effects: '`mdmark.config.yaml` を書き込む'
    callees:
      - '#functions[parseSetArgs]'
      - MOD-472-23#
    unit_tests:
      - name: test_write_config
        case: 正常
        summary: 雛形から作る
        condition: '`mdmark.config.yaml` の無い一時フォルダ、`sets` が `["features.callout=false"]`'
        mock: なし
        expected: '`version` と `features.callout: false` を持つ'
      - name: test_write_config_when_settings_key
        case: 異常
        summary: 端末の設定だけのキーは書き込まない
        condition: '`sets` が `["config.cascade=true"]`'
        mock: なし
        expected: 終了コード 1 の `SetupError`、ファイルが無い
    refs:
      - IF-472-8#
    status: planned
    introduced:
      pr: 354
