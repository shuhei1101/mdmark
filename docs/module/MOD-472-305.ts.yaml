id: MOD-472-305
visibility: internal
title: ライブラリ本体 / 設定と機能 / features.ts
test_files:
  - tests/unit/src/features.test.ts
functions:
  - name: resolveFeatures
    title: 文書のマーカーで機能のオン・オフを決める
    container: src/features.ts
    kind: 関数
    scope: public
    summary: 設定の `features` に、文書の `features` のマーカーの引数（`+名前`・`-名前`）を記載した順に重ねる
    description: 既定に無い名前と、`+`・`-` で始まらない引数は無視する。同じ名前が何度も出たら後のものが勝つ。機能を作る Issue は、この戻り値を読み込んで機能を出すかを決める
    args:
      - name: options
        type: '{ defaults: Record<string, boolean>; args: string[] }'
        required: true
        description: '`defaults` は既定を適用した設定の `features`、`args` は文書の `features` のマーカーの引数を記載した順に並べたもの'
    returns:
      type: Record<string, boolean>
      description: 決まったオン・オフ（`defaults` は書き換えない）
    unit_tests:
      - name: test_resolve_features
        case: 正常
        summary: マーカーが無ければ設定のまま
        condition: '`defaults` が `{ print: true }`、`args` が `[]`'
        mock: なし
        expected: '`{ print: true }`'
      - name: test_resolve_features_when_disabled
        case: 正常
        summary: '`-名前` でオフにする'
        condition: '`defaults` が `{ print: true }`、`args` が `["-print"]`'
        mock: なし
        expected: '`{ print: false }`'
      - name: test_resolve_features_when_enabled
        case: 正常
        summary: '`+名前` でオンにし、知らない名前と符号の無い引数を無視する'
        condition: '`defaults` が `{ print: false }`、`args` が `["+print", "+unknown", "print"]`'
        mock: なし
        expected: '`{ print: true }`'
      - name: test_resolve_features_when_repeated
        case: 正常
        summary: 同じ名前は後のものが勝つ
        condition: '`defaults` が `{ print: true }`、`args` が `["-print", "+print"]`'
        mock: なし
        expected: '`{ print: true }`'
