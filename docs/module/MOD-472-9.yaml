id: MOD-472-9
visibility: internal
title: ClaudeCodeプラグイン / セットアップ / 全体
lead: '`global-setup`・`setup` のスキルが Bash で呼ぶ `plugin/bin/setup.js` のサブコマンド（`status`・`keys`・`write-settings`・`start-server`・`write-config`）と、スキルの本文。'
directory: |-
  ```tree
  src/plugin/
  ├── port.ts            # 待ち受けているかの確認（モジュール構成『ポート』）
  ├── session-start.ts   # SessionStart のフック。常駐サーバーが待ち受けていないときだけ 1 行を指定する（モジュール構成『SessionStartのフック』）
  └── setup/
      ├── main.ts        # setup.js の入口とサブコマンドの振り分け
      ├── paths.ts       # 端末の設定・状態の配置場所・settings.json のパスとセッション名
      ├── status.ts      # status
      ├── keys.ts        # keys
      ├── write.ts       # write-settings・write-config
      ├── server.ts      # start-server
      └── systemd.ts     # systemd --user の確認・unit のファイル・unit の状態
  plugin/
  ├── bin/setup.js       # ビルドがまとめる
  ├── settings.sample.yaml
  └── skills/
      ├── global-setup/SKILL.md
      └── setup/SKILL.md
  ```
