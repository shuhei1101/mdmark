id: MOD-472-271
visibility: internal
title: ライブラリ本体 / 画像と動画 / image.syntax.ts
test_files:
  - tests/unit/src/media/image.syntax.test.ts
data_models:
  - name: ImageAttributes
    title: 画像の属性
    container: src/media/image.syntax.ts
    summary: 画像の直後の `{…}` を読み込んだ結果。`readImages` がトークンの `meta.mdmarkImage` に配置し、図を作るコアルールが読み込む
    properties:
      - name: kind
        type: MediaKind
        description: '`src` の拡張子で見分けた種類'
      - name: width
        type: string | undefined
        description: '`300px` か `40%` の構造の幅'
      - name: align
        type: '"left" | "center" | "right" | undefined'
        description: 配置。文の中の画像には入れない
      - name: lightbox
        type: boolean
        description: '`nolightbox` を記載したら `false`'
      - name: autoplay
        type: boolean
        description: 動画・音声だけ
      - name: muted
        type: boolean
        description: 動画・音声だけ。`autoplay` が `true` なら `true`
      - name: loop
        type: boolean
        description: 動画・音声だけ
      - name: poster
        type: string | undefined
        description: 動画だけ。記載したパス
      - name: items
        type: WarningItem[]
        description: 読み込めなかった属性（知らない属性・読み込めない値・文の中の画像の `align`・画像に記載した動画と音声だけの属性・音声の `thumbnail`・`poster` を持たない動画の `thumbnail`・再生のボタンの `width`・`align`）
      - name: modal
        type: boolean
        description: 動画・音声だけ。`modal` を記載したら `true`
      - name: thumbnail
        type: boolean
        description: '`poster` を持つ動画だけ。`thumbnail` を記載したら `true`'
      - name: opener
        type: boolean
        description: 再生のボタンにするか。`readImageAttributes` が、`position.opener` が `true` か、読み込んだ `modal`・`thumbnail` が `true` のとき `true` にする
    refs:
      - IF-472-34#constraints[画像の属性]
    status: planned
constants:
  - name: MEDIA_EXTENSIONS
    title: 動画と音声の拡張子
    container: src/media/image.syntax.ts
    summary: '`src` の拡張子（小文字）から種類を参照する。どれにも該当しない `gif` は `gif`、それ以外は `image`。CLI の書き出しと点検も使用する'
    entries:
      - key: video
        value: '["mp4", "m4v", "webm", "mov", "ogv"]'
      - key: audio
        value: '["mp3", "m4a", "aac", "ogg", "oga", "opus", "wav", "flac"]'
    refs:
      - IF-472-34#constraints[動画と音声]
    status: planned
  - name: IMAGE_ATTRIBUTE_NAMES
    title: 画像の属性の名前
    container: src/media/image.syntax.ts
    summary: '`{…}` に記載できる属性の名前。記載の警告の本文に並べる。`autoplay` から `modal` は動画・音声だけ、`thumbnail` は動画だけ'
    value: '["width", "align", "nolightbox", "autoplay", "muted", "loop", "poster", "modal", "thumbnail"]'
    status: planned
functions:
  - name: mediaKindOf
    title: 画像の種類を見分ける
    container: src/media/image.syntax.ts
    kind: 関数
    scope: internal
    summary: '`src` からクエリとフラグメントを除いた拡張子を小文字にし、`MEDIA_EXTENSIONS` の動画・音声なら `video`・`audio`、`gif` なら `gif`、それ以外は `image` を返却する'
    args:
      - name: src
        type: string
        required: true
        description: 画像の `src`
    returns:
      type: MediaKind
      description: '`"image" | "gif" | "video" | "audio"`'
    unit_tests:
      - name: test_media_kind_of
        case: 正常
        summary: 拡張子で種類を見分ける
        condition: '`demo.MP4?v=2`・`voice.m4a#t=3`・`build.gif`・`chart.png`・`readme`'
        mock: なし
        expected: '`video`・`audio`・`gif`・`image`・`image`'
    status: planned
  - name: readImageAttributes
    title: 画像の属性を読み込む
    container: src/media/image.syntax.ts
    kind: 関数
    scope: internal
    summary: '`{` と `}` の中の文字を空白で区切って `ImageAttributes` を作る。`width` は `1` 以上の整数か `{整数}px` を px、`1`〜`100` の `{整数}%` を % にする。`autoplay` に `muted` が無いときは `muted` を `true` にする。`modal`・`thumbnail` は真偽値にし、音声の `thumbnail` と `poster` を持たない動画の `thumbnail` も読み込めない属性にする。`position.opener` が `true` か、読み込んだ `modal`・`thumbnail` が `true` なら `opener` を `true` にし、`width`・`align` を読み込めない属性にする。読み込めない属性は適用せずに `items` に入れる'
    args:
      - name: text
        type: string
        required: true
        description: '`{` と `}` の中の文字'
      - name: kind
        type: MediaKind
        required: true
        description: 画像の種類（`mediaKindOf`）
      - name: position
        type: '{ inline: boolean; opener?: boolean }'
        required: true
        description: '`inline` は文の中の画像か（`align` を読み込めない属性にする）、`opener` は表のセルの中の動画・音声か（既定 `false`）'
    returns:
      type: ImageAttributes
      description: 画像の属性
    unit_tests:
      - name: test_read_image_attributes
        case: 正常
        summary: 幅・配置・nolightbox を読み込む
        condition: '`width=300 align=center nolightbox`・`width=40%`（`image`・段落の画像）'
        mock: なし
        expected: 1 つ目が `width` `300px`・`align` `center`・`lightbox` `false`、2 つ目が `width` `40%`、どちらも `items` が空
      - name: test_read_image_attributes_when_media
        case: 正常
        summary: 動画の属性を読み込み、autoplay に muted を追加する
        condition: '`autoplay loop poster=demo.png width=480`（`video`）'
        mock: なし
        expected: '`autoplay`・`muted`・`loop` が `true`、`poster` が `demo.png`、`width` が `480px`'
      - name: test_read_image_attributes_when_unreadable
        case: 異常
        summary: 読み込めない属性を項目にする
        condition: '`width=big width=0% width=101% foo autoplay`（`image`）と `align=left`（`image`・文の中）'
        mock: なし
        expected: 1 つ目の `width` が無く、`items` の項目が `width=big`・`width=0%`・`width=101%`・`foo`・`autoplay` の 5 つ。2 つ目の `align` が無く、`items` の項目が `align` の 1 つ
      - name: test_read_image_attributes_when_modal
        case: 正常
        summary: modal と thumbnail を読み込む
        condition: '`modal`（`audio`）と `thumbnail poster=p.png`（`video`）'
        mock: なし
        expected: 1 つ目の `modal` が `true`、2 つ目の `thumbnail` が `true`、どちらも `items` が空
      - name: test_read_image_attributes_when_modal_unreadable
        case: 異常
        summary: 読み込めない modal・thumbnail・width・align を項目にする
        condition: '`modal`（`image`）・`thumbnail`（`audio`）・`thumbnail`（`poster` の無い `video`）・`modal width=320 align=center`（`video`）・`align=right`（`video`・`position.opener` が `true`）'
        mock: なし
        expected: 順に `items` が `modal`・`thumbnail`・`thumbnail`・`width=320` と `align=center`・`align=right` で、どれもその属性を適用しない
    status: planned
  - name: readImages
    title: 画像の属性を読み込んで種類を見分ける
    container: src/media/image.syntax.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。画像のトークンに種類と属性を読み込み、読み込めない属性を記載の警告にする'
    description: |-
      `inline` の子の `image` のトークンごとに、`mediaKindOf` の種類と、`images` がオンなら直後の `text` の頭の `{…}` を `readImageAttributes` で読み込んだ属性を `meta.mdmarkImage` に配置し、`{…}` を `text` から除外する。
      `gif` の画像に `data-gif` を、文の中の画像の `width` を `img` の `style` の `--mdmark-image-width` に付ける。
      読み込めない属性は段落の前に 1 つの記載の警告を差し込む。
      `media` がオフのときは動画・音声も `image` として扱う。
      リンクの中の画像は種類と属性を読み込むが、図にしない。
      表のセル（`th_open`・`td_open` の後の `inline`）の中の動画・音声は `readImageAttributes` の `position.opener` に `true` を指定する。表のセルの中の記載の警告は表の前に差し込む
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[mediaKindOf]'
      - '#functions[readImageAttributes]'
      - 'MOD-472-213#functions[pushWarning]'
    refs:
      - IF-472-34#constraints[画像の属性]
      - IF-472-34#constraints[GIF]
    unit_tests:
      - name: test_read_images
        case: 正常
        summary: 属性を読み込んで削除し、種類を配置する
        condition: '`![グラフ](chart.png){width=300 align=center}` だけの段落と `押す前に ![アイコン](icon.png){width=16} を確認する。`'
        mock: なし
        expected: '1 つ目の `image` の `meta.mdmarkImage` が `width` `300px`・`align` `center`、2 つ目の `img` が `style="--mdmark-image-width: 16px"` を持ち、どちらの段落の文字にも `{width=` が無い'
      - name: test_read_images_when_gif
        case: 正常
        summary: GIF に data-gif を付ける
        condition: '`![ビルド](build.gif)`'
        mock: なし
        expected: '`img` が `data-gif` を持つ'
      - name: test_read_images_when_unreadable
        case: 異常
        summary: 読み込めない属性を警告にする
        condition: '`![グラフ](chart.png){width=big align=center foo}` だけの段落'
        mock: なし
        expected: 段落の前に記載の警告が 1 つあり本文に `width=big`・`foo` と `IMAGE_ATTRIBUTE_NAMES` の名前があり、`meta.mdmarkImage.align` が `center`
      - name: test_read_images_when_feature_off
        case: 正常
        summary: images がオフなら属性を読み込まない
        condition: '`env.features.images` が `false` で `![グラフ](chart.png){width=300}`'
        mock: なし
        expected: 段落の文字に `{width=300}` が残る
      - name: test_read_images_when_table_cell
        case: 正常
        summary: 表のセルの中の動画に opener を配置する
        condition: 表のセルの `![素材 1](m1.mp4)` と `![グラフ](chart.png)`
        mock: なし
        expected: '`m1.mp4` の `meta.mdmarkImage.opener` が `true`、`chart.png` は `false`'
      - name: test_read_images_when_opener_unreadable
        case: 異常
        summary: 読み込めない thumbnail の動画・音声に opener を配置しない
        condition: '`![読み上げ](voice.mp3){thumbnail}` だけの段落と、`poster` の無い `![操作](demo.mp4){thumbnail}` だけの段落'
        mock: なし
        expected: どちらも `meta.mdmarkImage.opener` が `false` で、段落の前に `thumbnail` の記載の警告がある
    status: planned
  - name: buildImageFigures
    title: 画像と動画と音声を図にする
    container: src/media/image.syntax.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。画像だけの段落と動画・音声を、部品『画像の図』と部品『動画と音声』にする'
    description: |-
      `images` がオンなら、画像 1 つだけの段落（前後の空白を除く。図表の番号とギャラリーが図にしたもの・リンクの中の画像を除く）を部品『画像の図』（`opener: false`）の `html_block` に置き換える。
      `media` がオンなら、`video`・`audio` の画像を部品『動画と音声』の `html_block` にし、画像 1 つだけの段落は段落ごと置き換え、文の中のものは段落の後ろに配置する。
      部品へは `meta.mdmarkImage` の属性・`src`・`alt`（子のトークンの文字）・title を指定する。
      再生バーを持つ動画で属性に `width` が無いときは、`env.page?.mediaWidth`、無ければ `env.mediaWidth` を `width` に指定する（どちらも無ければ指定しない）。音声と再生のボタンには指定しない。
      `#only-dark`・`#only-light` のフラグメントは `only` にする。
      `media` がオンで `meta.mdmarkImage.opener` が `true` の動画・音声は、部品『動画と音声』（`opener` は `thumbnail` と `poster` を持つとき `thumbnail`、それ以外は `button`）の再生のボタンにする。画像 1 つだけの段落は `inline: false` の `html_block` で段落ごと置き換え、表のセルの中と文の途中は `inline: true` の `html_inline` で画像のトークンの場所に置き換える（段落の後ろへ移さない）。
      文の中の `#only-*` の画像は `img` に class `mdmark-only-*` を付ける
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - MOD-472-327#functions[renderImageFigure]
      - MOD-472-330#functions[renderMedia]
      - MOD-472-330#functions[renderMediaOpener]
    refs:
      - IF-472-34#constraints[画像の図とキャプション]
      - IF-472-34#constraints[テーマごとの画像]
      - IF-472-34#constraints[動画と音声]
      - IF-472-34#constraints[動画と音声の再生のボタン]
      - IF-472-34#constraints[動画と音声]
    unit_tests:
      - name: test_build_image_figures
        case: 正常
        summary: 画像だけの段落を図にし、title をキャプションにする
        condition: '`![グラフ](chart.png "売上の推移"){width=300 align=center}`・`![構成](arch-dark.png#only-dark)` をそれぞれ画像だけの段落に持つ'
        mock: なし
        expected: '1 つ目が `<figure class="mdmark-figure mdmark-image" data-align="center" style="--mdmark-image-width: 300px">` と `<figcaption class="mdmark-figure-caption">売上の推移</figcaption>`、2 つ目の `figure` が class `mdmark-only-dark` を持ち `src` が `arch-dark.png#only-dark`。どちらも `button` が無い'
      - name: test_build_image_figures_when_media
        case: 正常
        summary: 動画と音声を再生バー付きの図にする
        condition: '`![操作の様子](demo.mp4 "保存までの操作"){autoplay poster=demo.png}` だけの段落と、`読み上げは ![読み上げ](voice.mp3) で聞く。` の段落'
        mock: なし
        expected: 1 つ目が `figure.mdmark-media` の `video`（`controls`・`autoplay`・`muted`・`playsinline`・`preload="metadata"`・`poster`）と `img.mdmark-media-print`。2 つ目の段落の後ろに `audio` の `figure.mdmark-media` があり、段落の中に `img` が無い
      - name: test_build_image_figures_when_link
        case: 正常
        summary: リンクの中の画像と、文の中の画像は図にしない
        condition: '`[![ロゴ](logo.png)](https://example.com)` だけの段落と `押す前に ![アイコン](icon.png) を確認する。`'
        mock: なし
        expected: どちらも `figure` が無い
      - name: test_build_image_figures_when_media_off
        case: 正常
        summary: media がオフなら動画を画像として描く
        condition: '`env.features.media` が `false` で `![操作](demo.mp4)` だけの段落'
        mock: なし
        expected: '`video` が無く、`figure.mdmark-image` の `img` の `src` が `demo.mp4`'
      - name: test_build_image_figures_when_opener
        case: 正常
        summary: 表のセル・段落・文の途中の動画を再生のボタンにする
        condition: 表のセルの `![素材 1](m1.mp4 "手順 1")`、動画だけの段落 `![操作](demo.mp4){modal}`、`手順は ![手順](steps.mp4){modal} で確認する。`、`![素材 2](m2.mp4){thumbnail poster=m2.png}` だけの段落
        mock: なし
        expected: セルの中に `button.mdmark-media-open` と `手順 1` のキャプションがあり、`demo.mp4` は `div.mdmark-media-inline-figure`、`steps.mp4` は段落の文の間のボタン、`m2.mp4` は `button.mdmark-media-thumb`。どこにも `video` が無い
      - name: test_build_image_figures_when_opener_media_off
        case: 正常
        summary: media がオフなら表のセルの動画を画像のままにする
        condition: '`env.features.media` が `false` で表のセルの `![素材 1](m1.mp4)`'
        mock: なし
        expected: '`button.mdmark-media-open` が無く、`img` の `src` が `m1.mp4`'
      - name: test_build_image_figures_when_default_video_width
        case: 正常
        summary: 属性の無い動画を既定の幅で描き、属性とページの設定を優先する
        condition: '`env.mediaWidth` が `50%`。`![a](clip.mp4)`・`![b](clip.mp4){width=320}`・`![c](voice.mp3)`。別に `env.page.mediaWidth` が `80%`'
        mock: なし
        expected: '1 つ目の `figure` が `--mdmark-image-width: 50%`（ページの設定があるときは `80%`）、2 つ目が `320px`、音声は `--mdmark-image-width` を持たない'
    status: planned
lead: '画像・動画・音声の属性の読み取りと画像の図を受け持ち、画像と動画の記法を変えるときに参照する。'
