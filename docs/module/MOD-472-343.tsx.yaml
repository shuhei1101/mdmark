id: MOD-472-343
visibility: internal
title: ライブラリ本体 / 部品の描画 / vscode-theme.tsx
constants:
  - name: VSCODE_THEME_COLORS
    title: VS Code の配色の仮の値
    container: .storybook/vscode-theme.tsx
    summary: '`light`・`dark` ごとの `--vscode-*` の値（Light Modern・Dark Modern。値は `docs/mock/refs/342/assets/panel.css` と同じ）'
    value: '`{ light: { "--vscode-font-family": "system-ui, sans-serif", "--vscode-editor-background": "#ffffff", … }, dark: { … } }`'
functions:
  - name: withVsCodeTheme
    title: VS Code の配色を与える
    container: .storybook/vscode-theme.tsx
    kind: 関数
    scope: public
    summary: '`title` が `VSCode/` で始まるストーリーで、`globals.scheme` の `VSCODE_THEME_COLORS` を `document.documentElement` の `style` に与え、`body` に class `vscode-light`・`vscode-dark` を付けるデコレーター。パネルの CSS（`panel.css`）を読み込む'
    description: Webview の `:root` のトークンは `--vscode-*` と同じ要素で計算されるため、ストーリーの要素でなく `:root` に与える
    args:
      - name: Story
        type: StoryFn
        required: true
        description: ストーリー
      - name: context
        type: StoryContext
        required: true
        description: '`title` と `globals.scheme` を読み込む'
    returns:
      type: ReactElement
      description: 描く要素
