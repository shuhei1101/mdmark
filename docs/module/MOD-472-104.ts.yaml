id: MOD-472-104
visibility: internal
title: VS Code 拡張機能 / 設定 / config.ts
test_files:
  - tests/unit/vscode/src/config.test.ts
data_models:
  - name: PreviewConfig
    title: mount に指定する設定
    container: vscode/src/config.ts
    usecase: 共通
    summary: 設定ファイルから取り出した `features`・`libraries`・`html-scripts`・`side-toc`・`table`・`labels`・`mermaid`・`map`・`tooltips`・`syntax`・`colorTheme`・`colorScheme`。`render` の `config` と書き出す HTML の `config` になる
    properties:
      - name: features
        type: Record<string, unknown> | undefined
        description: 記載した値のまま（中の知らない名前と型の違う値は mdmark が無視する）
      - name: libraries
        type: Record<string, unknown> | undefined
        description: 記載した値のまま。URL は呼ぶ側が修正する（libraries の URL を修正する）
      - name: side-toc
        type: Record<string, unknown> | undefined
        description: 記載した値のまま（`mode` の知らない値は mdmark が `hover` で描く）
      - name: labels
        type: Record<string, unknown> | undefined
        description: 記載した値のまま（中の知らないキーと、空文字・文字列でない値は mdmark が無視して既定の文言で描く）
      - name: mermaid
        type: Record<string, unknown> | undefined
        description: 記載した値のまま。`url` は呼ぶ側が修正する（mermaid の URL を修正する）。`theme` の知らない名前は mdmark が `mdmark` で描く
      - name: map
        type: Record<string, unknown> | undefined
        description: 設定ファイルの `map`（マップのときだけ。中の値は mdmark が検める）
      - name: colorTheme
        type: string | undefined
        description: 設定ファイルに書き込んだ値のまま。`mdmark.colorTheme` が空でないときは `applyColorTheme` がその値に置き換える（知らない名前は mdmark が dev-swiss で描く）
      - name: colorScheme
        type: string | undefined
        description: 設定ファイルに書き込んだ値のまま。プレビューでは `mdmark.preview.theme` が `light`・`dark` のとき `applyPreviewTheme` が除く（知らない値は mdmark が `auto` で描く）
      - name: table
        type: Record<string, unknown> | undefined
        description: 記載した値のまま（`pin` の知らない値は mdmark が `each` で描く）
      - name: tooltips
        type: Record<string, unknown> | undefined
        description: 記載した値のまま（`placement`・`diagramPlacement` の知らない値は mdmark が既定の場所に出す）
      - name: syntax
        type: Record<string, unknown> | undefined
        description: 記載した値のまま。`url` は呼ぶ側が修正する（色分けのライブラリの URL を修正する・相対パスの色分けのライブラリを埋める）。文字列でない `url` は mdmark が無視して既定の URL から読み込む
    status: planned
  - name: ConfigLoad
    title: 設定ファイルの読み取りの結果
    container: vscode/src/config.ts
    usecase: 記載した内容をプレビューに映す
    summary: '`loadConfig` の戻り値。重ねた設定から取り出した `mount` に指定するキー・`theme`・`extensions`・見張るファイル・最も近い設定ファイル・読み込めないファイル'
    properties:
      - name: config
        type: PreviewConfig
        description: 重ねた設定のうち、マップの `features`・`libraries`・`html-scripts`・`side-toc`・`table`・`labels`・`mermaid`・`map` と文字列の `colorTheme`・`colorScheme`。読み込めない・構造の合わないファイルは重ねずに残りを重ねた値。相対パスはその値を記載した設定ファイルのフォルダから解決した絶対パス
      - name: theme
        type: string | undefined
        description: 重ねた設定の `theme` の絶対パス
      - name: extensions
        type: string[]
        description: 重ねた設定の `extensions` の絶対パス。無ければ空
      - name: files
        type: string[]
        description: 重ねた設定ファイルの絶対パス（端末の設定 → 上 → 近い）。見張るファイルに使用する
      - name: nearest
        type: string | undefined
        description: 最も近い `mdmark.config.yaml`（`mdmark.configPath` を記載したときはそのファイル）の絶対パス。「設定ファイルを開く」が開く
      - name: assetsRoot
        type: string | undefined
        description: 重ねた設定の `assets.root` の絶対パス。`mount` には指定しない
      - name: problem
        type: ConfigProblem | undefined
        description: 読み込めない・構造の合わない最初の設定ファイル（端末の設定 → 上 → 近いの順）
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: 重ねた設定に `aliases` があるときに作ったエイリアス（`purpose` によらない）。無いときは持たない
      - name: aliasIssues
        type: CheckIssue[]
        description: エイリアスを作ったときのずれ（`loadAliases` の `issues`）。無ければ空
      - name: aliasFiles
        type: string[]
        description: '`aliases` の行の `paths` に該当した YAML の絶対パス。見張るファイルに使用する。無ければ空'
    status: planned
  - name: ConfigProblem
    title: 読み込めない設定ファイル
    container: vscode/src/config.ts
    usecase: 記載した内容をプレビューに映す
    role: DTO
    summary: 帯に出す、読み込めない・構造の合わない設定ファイル 1 つ
    properties:
      - name: path
        type: string
        description: 設定ファイルの絶対パス
      - name: line
        type: number | undefined
        description: YAML として読み込めない行（1 始まり）。構造に合わないときは無い
      - name: settingKey
        type: string | undefined
        description: 設定の構造に合わない最初のキー（`features.callout` のように `.` でつなぐ）。YAML として読み込めないときは無い
      - name: message
        type: string
        description: 誤りの文（ログに出す）
    status: planned
    introduced:
      pr: 347
constants:
  - name: CONFIG_TEMPLATE
    title: 設定ファイルの雛形
    container: vscode/src/config.ts
    summary: '`mdmark.openConfig` が「作成」で記載する YAML。キーを記載せず、記載方法をコメントで示す'
    description: 値は画面設計の「雛形の中身」の YAML をそのまま持つ
    refs:
      - SCR-472-1#elements[雛形の中身]
    status: planned
functions:
  - name: resolveConfigPath
    title: 設定ファイルの場所を決める
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`mdmark.configPath` が相対パスなら基準のフォルダから解決し、絶対パスならそのまま返却する'
    scope: public
    args:
      - name: options
        type: '{ configPath: string; baseDir: string }'
        required: true
        description: '`mdmark.configPath` と、Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）の絶対パス'
    returns:
      type: string
      description: 設定ファイルの絶対パス
    unit_tests:
      - name: test_resolve_config_path
        case: 正常
        summary: 相対パスは基準のフォルダから、絶対パスはそのまま
        condition: '`baseDir` が `/ws`、`configPath` が `docs/mdmark.config.yaml` と `/etc/mdmark.yaml`'
        mock: なし
        expected: '`/ws/docs/mdmark.config.yaml` と `/etc/mdmark.yaml`'
    refs:
      - IF-472-21#constraints[設定ファイルの場所]
    status: planned
  - name: parseConfig
    title: 設定を取り出す
    kind: 関数
    container: vscode/src/config.ts
    usecase: 記載した内容をプレビューに映す
    summary: YAML を `yaml` の `parse` で読み込み、最上位がマップのときだけ `features`・`libraries`・`html-scripts`・`side-toc`・`table`・`map`・`colorTheme`・`colorScheme` を取り出す。`assets` がマップで `root` が文字列なら `assetsRoot` に入れる
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 設定ファイルの中身
    returns:
      type: ConfigLoad
      description: '`ok` か `error`'
    process: |-
      1. `parse(text)` を呼ぶ
         - `YAMLParseError` の場合、`{ kind: "error", line: error.linePos[0].line, message: error.message }` を返却する
      2. 最上位がマップでなければ（空のファイルを含む）`{ kind: "ok", config: {} }` を返却する
      3. `features`・`libraries`・`html-scripts`・`side-toc`・`table` のうち値がマップのキーと、値が文字列の `colorTheme`・`colorScheme` だけを `config` に入れ、`assets.root` が文字列なら `assetsRoot` に入れて返却する。他のキーは読み込まない
    refs:
      - IF-472-21#constraints[設定の取り出し方]
      - IF-472-21#constraints[設定ファイルを読み込めないとき]
      - LIB-472-36#
    status: removed
  - name: loadConfig
    title: 設定ファイルを読み込む
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: ライブラリ本体の `loadLayeredConfig` で設定を重ねて読み込み、`ConfigLoad` にする。設定ファイルが 1 つも無ければ端末の設定だけで返却する
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; configPath: string; baseDir: string; purpose: "preview" | "export"; env: Record<string, string | undefined>; home: string; readFile: ReadTextFile; isFile: (path: string) => Promise<boolean> }'
        required: true
        description: Markdown のフォルダ・`mdmark.configPath`・基準のフォルダ（設定ファイルの場所を決める）・プレビューか書き出しか・環境変数・ホームのフォルダ・読み込む関数・ファイルがあるかを確認する関数
    returns:
      type: Promise<ConfigLoad>
      description: 読み取りの結果
    process: |-
      1. `configPath` が空でなければ設定ファイルの場所を決める（設定ファイルの場所を決める）
         - そのファイルが無い（`isFile` が `false`）場合、`explicit` を指定せず、`isFile` を常に `false` を返却する関数にして呼ぶ（上へ探さず、端末の設定だけを重ねる）
      2. 設定を重ねて読み込む（設定を重ねて読み込む。`explicitName` は `mdmark.configPath`）
      3. 結果を `ConfigLoad` にする
         - `config` は重ねた設定のうち、値がマップの `features`・`libraries`・`html-scripts`・`side-toc`・`table`・`labels`・`mermaid`・`tooltips`・`syntax` と、値が文字列の `colorTheme`・`colorScheme` だけ
         - `files` は重ねた設定ファイルの `path`、`theme`・`extensions`・`assetsRoot` は重ねた設定の `theme`・`extensions`・`assets.root`
         - `unreadable` がある場合、`problem` は `{ path, line, message }`。無く `issues` がある場合、`problem` は `{ path: issues[0].file, settingKey: issues[0].where, message: issues[0].message }`
      4. 重ねた設定に `aliases` がある場合、`purpose` によらずエイリアスを読み込む（エイリアスを読み込む）
         - 指定する設定ファイルは `nearest`、無ければ端末の設定ファイル（`resolveSettingsPath` の `env`・`home`）。`dir` はそのフォルダで、`config` は重ねた設定のパスの値を `dir` からの相対パスに戻した値（`relativizeConfigPaths`）
         - 返った `aliases`・`issues`・`files` を `aliases`・`aliasIssues`・`aliasFiles` に入れる
    exceptions:
      - name: Error
        condition: '`readFile` が `ENOENT` 以外で失敗した（もう一度投げる）'
    unit_tests:
      - name: test_load_config
        case: 正常
        summary: 重ねた設定から mount のキー・theme・extensions を取り出す
        condition: '端末の設定に `features.callout: false`、`/w/docs/mdmark.config.yaml` に `theme: ./t.css`・`extensions: [./e.js]`・`build: { include: ["*.md"], out: a.html }`、`cwd` が `/w/docs`、`configPath` が空'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`config` が `{ features: { callout: false } }`、`theme` が `/w/docs/t.css`、`extensions` が `["/w/docs/e.js"]`、`files` が端末の設定と `/w/docs/mdmark.config.yaml`、`nearest` が `/w/docs/mdmark.config.yaml`、`problem` が無い'
      - name: test_load_config_when_missing
        case: 正常
        summary: 設定ファイルが 1 つも無ければ空の設定
        condition: '`readFile` がどのファイルにも `ENOENT` を投げ、`isFile` がどれも `false`'
        mock: '`readFile`・`isFile` を代役にする'
        expected: '`config` が `{}`、`extensions` と `files` が空、`nearest`・`problem` が無い'
      - name: test_load_config_when_assets_root
        case: 正常
        summary: assets.root を記載した設定ファイルのフォルダから解決する
        condition: '`/w/mdmark.config.yaml` に `assets: { root: ./assets }`、`cwd` が `/w`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`assetsRoot` が `/w/assets` で、`config` に `assets` が無い'
      - name: test_load_config_when_unreadable
        case: 正常
        summary: YAML として読み込めないファイルを problem にし、残りを重ねる
        condition: '端末の設定に `features.callout: false`、`/w/mdmark.config.yaml` の 4 行目に閉じていない `[`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`problem` の `path` が `/w/mdmark.config.yaml`・`line` が 4、`config` が `{ features: { callout: false } }`'
      - name: test_load_config_when_invalid
        case: 正常
        summary: 構造の合わないファイルを problem にしてキーを返却する
        condition: '端末の設定に `features.callout: maybe`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`problem` の `path` が端末の設定・`settingKey` が `features.callout`・`line` が無い'
      - name: test_load_config_when_config_path_missing
        case: 正常
        summary: mdmark.configPath のファイルが無ければ上へ探さず端末の設定だけを重ねる
        condition: '`configPath` が `missing.yaml`、`/w/mdmark.config.yaml` に `features.table: false`、端末の設定に `features.callout: false`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`config` が `{ features: { callout: false } }`、`files` が端末の設定だけ、`nearest` が無い'
      - name: test_load_config_when_labels
        case: 正常
        summary: labels を config に入れ、labels がマップでない設定ファイルは重ねない
        condition: '`/w/mdmark.config.yaml` に `labels: { paramCopy: コピー }`、`/w/b/mdmark.config.yaml` に `labels: コピー`、`cwd` が `/w` と `/w/b` の 2 回（端末の設定は無い）'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`cwd` が `/w` のとき `config` が `{ labels: { paramCopy: "コピー" } }`、`/w/b` のとき `config` に `labels` が無く、`problem` の `settingKey` が `labels`'
      - name: test_load_config_when_aliases
        case: 正常
        summary: プレビューでは重ねた設定の aliases からエイリアスを作り、読み込んだ YAML を返却する
        condition: '一時フォルダの `mdmark.config.yaml` に `aliases` の用語の行（`paths: [glossary.yaml]`）、`glossary.yaml` に用語 1 件、`purpose` が `preview`'
        mock: 一時フォルダ（`readFile`・`isFile` は実のファイルを読み込む）
        expected: '`aliases` が用語の 1 件、`aliasIssues` が空、`aliasFiles` が `glossary.yaml` の絶対パスの 1 件'
      - name: test_load_config_when_aliases_without_nearest
        case: 正常
        summary: mdmark.config.yaml が無いときは端末の設定ファイルを基準にエイリアスを作る
        condition: '`MDMARK_CONFIG` が一時フォルダの `settings.yaml` で、そこに `aliases` の行（`paths: [glossary.yaml]`）、同じフォルダに `glossary.yaml`。`cwd` の上に `mdmark.config.yaml` は無い'
        mock: 一時フォルダ
        expected: '`nearest` が無く、`aliases` が用語の 1 件、`aliasFiles` が端末の設定のフォルダの `glossary.yaml`'
      - name: test_load_config_when_aliases_missing_files
        case: 正常
        summary: 該当するファイルの無い行はずれにして残りで作る
        condition: '`aliases` の 1 行目が `glossary.yaml`、2 行目が `paths: [missing/*.yaml]`'
        mock: 一時フォルダ
        expected: '`aliases` が 1 行目の用語だけ、`aliasIssues` が `alias_no_files`（`where` が `aliases[1].paths`）の 1 件'
      - name: test_load_config_when_export
        case: 正常
        summary: 書き出しのときもエイリアスを作る
        condition: '`test_load_config_when_aliases` と同じファイルで `purpose` が `export`'
        mock: 一時フォルダ
        expected: '`aliases` が用語の 1 件、`aliasIssues` が空、`aliasFiles` が `glossary.yaml` の絶対パスの 1 件'
      - name: test_load_config_when_table
        case: 正常
        summary: 設定の `table` を `mount` に指定する設定に入れ、マップでない `table` は入れない
        condition: '`/w/mdmark.config.yaml` に `table: { pin: through }`、`/w/b/mdmark.config.yaml` に `table: through`。`cwd` が `/w` と `/w/b` のそれぞれ'
        mock: '`readFile`・`isFile` を差し替える（`test_load_config_when_labels` と同じ）'
        expected: '`/w` の `config` が `{ table: { pin: "through" } }`。`/w/b` の `config` が `table` を持たず、`problem.settingKey` が `table`'
      - name: test_load_config_when_tooltips_and_syntax
        case: 正常
        summary: tooltips と syntax を config に入れ、マップでない値は入れない
        condition: '`/w/mdmark.config.yaml` に `tooltips: { placement: bottom }`・`syntax: { url: ./hljs/ }`、`/w/b/mdmark.config.yaml` に `tooltips: bottom`。`cwd` が `/w` と `/w/b` のそれぞれ（端末の設定は無い）'
        mock: '`readFile`・`isFile` を差し替える（`test_load_config_when_labels` と同じ）'
        expected: '`/w` の `config` が `{ tooltips: { placement: "bottom" }, syntax: { url: "/w/hljs" } }`（`url` は設定を重ねる処理が絶対パスにした値）。`/w/b` の `config` が `tooltips` を持たず、`problem.settingKey` が `tooltips`'
    callees:
      - '#functions[resolveConfigPath]'
      - MOD-472-116#functions[loadLayeredConfig]
      - MOD-472-124#functions[loadAliases]
    refs:
      - IF-472-22#constraints[エイリアス]
      - IF-472-15#constraints[エイリアス]
    status: planned
  - name: resolveLibraries
    title: libraries の URL を修正する
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`libraries` の各値について、`http:`・`https:` の URL はそのまま、それ以外の文字列は設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にして返却する'
    description: プレビューは `toUrl` に `asWebviewUri` を、書き出しは `pathToFileURL` を指定する。文字列でない値はそのまま指定し、mdmark が無視する
    scope: public
    args:
      - name: options
        type: '{ libraries: Record<string, unknown>; configDir: string; toUrl: (path: string) => string }'
        required: true
        description: 取り出した `libraries`、設定ファイルのあるフォルダ、絶対パスを読み込める URL にする関数
    returns:
      type: Record<string, unknown>
      description: URL を修正した `libraries`
    unit_tests:
      - name: test_resolve_libraries
        case: 正常
        summary: 相対パスだけを設定ファイルのフォルダから修正する
        condition: '`{ a: "./libs/a.js", b: "https://cdn.example.com/b.js", c: "../c.js" }`、`configDir` が `/ws/docs`、`toUrl` が頭に `web:` を付ける'
        mock: なし
        expected: '`{ a: "web:/ws/docs/libs/a.js", b: "https://cdn.example.com/b.js", c: "web:/ws/c.js" }`'
    refs:
      - IF-472-21#constraints[libraries の URL]
      - IF-472-15#constraints[設定と相対パス]
    status: planned
  - name: resolveHtmlScripts
    title: html-scripts の URL を修正する
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`html-scripts.url` が `http:`・`https:` でない文字列なら、設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にした `html-scripts` を返却する。それ以外はそのまま返却する'
    scope: public
    args:
      - name: options
        type: '{ htmlScripts: Record<string, unknown>; configDir: string; toUrl: (path: string) => string }'
        required: true
