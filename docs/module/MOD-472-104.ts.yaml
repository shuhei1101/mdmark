    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`mermaid.url` が `http:`・`https:` でない文字列なら、設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にした `mermaid` を返却する。それ以外はそのまま返却する（`resolveHtmlScripts` と同じ修正方法）'
    scope: public
    args:
      - name: options
        type: '{ mermaid: Record<string, unknown>; configDir: string; toUrl: (path: string) => string }'
        required: true
        description: 取り出した `mermaid`、設定ファイルのあるフォルダ、絶対パスを読み込める URL にする関数
    returns:
      type: Record<string, unknown>
      description: '`url` を修正した `mermaid`。`theme`・`themeVariables` はそのまま'
    unit_tests:
      - name: test_resolve_mermaid
        case: 正常
        summary: 相対パスの url だけを設定ファイルのフォルダから修正し、ほかのキーを残す
        condition: '`{ url: "./libs/mermaid.mjs", theme: "neutral" }`・`{ url: "https://cdn.example.com/mermaid.mjs" }`・`{ theme: "dark" }`、`configDir` が `/ws/docs`、`toUrl` が頭に `web:` を付ける'
        mock: なし
        expected: '`{ url: "web:/ws/docs/libs/mermaid.mjs", theme: "neutral" }`・`{ url: "https://cdn.example.com/mermaid.mjs" }`・`{ theme: "dark" }`'
