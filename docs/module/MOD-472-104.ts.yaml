    returns:
      type: Record<string, unknown>
      description: '`url` を修正した `syntax`'
    description: '`syntax.url` は本体と言語のモジュールを読み込むフォルダの URL で、`resolve` と `asWebviewUri` が末尾の `/` を削除するため、修正した後に `/` を付ける'
