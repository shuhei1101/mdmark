  - name: resolveSyntax
    title: 色分けのライブラリの URL を修正する
    kind: 関数
    container: vscode/src/config.ts
    usecase: VSCodeでプレビューを開く
    summary: '`syntax.url` が `http:`・`https:` でない文字列なら、設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にし、末尾が `/` でなければ `/` を付けた `syntax` を返却する。それ以外はそのまま返却する'
