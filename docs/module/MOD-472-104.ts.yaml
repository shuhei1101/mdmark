      - name: options
        type: '{ config: PreviewConfig; colorTheme: PreviewSettings["colorTheme"] }'
        required: true
        description: 設定ファイルから取り出した設定と、`readSettings` の `colorTheme`
    returns:
      type: PreviewConfig
      description: '`mount` に指定する設定'
    unit_tests:
      - name: test_apply_color_theme
        case: 正常
        summary: 空でない mdmark.colorTheme が設定ファイルに勝ち、空なら設定ファイルのまま
        condition: '`config` が `{ colorTheme: "theme-paper", features: { callout: false } }` で `colorTheme` が `theme-slate` と `""`。別に `config` が `{}` で `colorTheme` が `""`'
        mock: なし
        expected: '1 つ目は `{ colorTheme: "theme-slate", features: { callout: false } }`、2 つ目は `{ colorTheme: "theme-paper", features: { callout: false } }`、3 つ目は `{}`。指定した `config` は変わらない'
    refs:
