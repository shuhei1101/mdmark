  - name: libraryOrigins
    title: libraries の配信元を取得する
    kind: 関数
    container: vscode/src/config.ts
    usecase: VSCodeでプレビューを開く
    summary: '`libraries` の値と `html-scripts.url`・`mermaid.url`・`syntax.url`（それぞれ無ければライブラリ本体の既定の URL）のうち `http:`・`https:` の URL の origin を、重なりを除いて返却する（CSP の `script-src` に使用する）'
    scope: public
    args:
      - name: libraries
        type: Record<string, unknown> | undefined
        required: true
        description: 取り出した `libraries`
      - name: htmlScripts
        type: Record<string, unknown> | undefined
        required: false
        description: 取り出した `html-scripts`
      - name: mermaid
        type: Record<string, unknown> | undefined
        required: false
        description: 取り出した `mermaid`
      - name: syntax
        type: Record<string, unknown> | undefined
        required: false
        description: 取り出した `syntax`
    returns:
      type: string[]
      description: origin の並び
    unit_tests:
      - name: test_library_origins
        case: 正常
        summary: http・https の origin だけを重なりなく取得する
        condition: '`{ a: "https://cdn.example.com/a.js", b: "https://cdn.example.com/b.js", c: "./c.js", d: 1 }`、`htmlScripts` は省く'
        mock: なし
        expected: '`["https://cdn.example.com", "https://cdn.jsdelivr.net"]`（後ろは `html-scripts.url` の既定の URL の origin）'
      - name: test_library_origins_when_html_scripts
        case: 正常
        summary: html-scripts.url の http・https の origin を追加し、それ以外の url では追加しない
        condition: '`libraries` が `{ a: "https://cdn.example.com/a.js" }` で、`htmlScripts` が `{ url: "https://babel.example.com/b.mjs" }` のときと `{ url: "./babel.mjs" }` のとき'
        mock: なし
        expected: '前者は `["https://cdn.example.com", "https://babel.example.com", "https://cdn.jsdelivr.net"]`、後者は `["https://cdn.example.com", "https://cdn.jsdelivr.net"]`（後ろは `mermaid` を省いたときの `mermaid.url` の既定の URL の origin）'
      - name: test_library_origins_when_mermaid
        case: 正常
        summary: mermaid.url の http・https の origin を追加し、相対パスでは追加しない
        condition: '`libraries` が `{}`、`htmlScripts` が `{ url: "./babel.mjs" }` で、`mermaid` が `{ url: "https://mermaid.example.com/m.mjs" }` のときと `{ url: "./m.mjs" }` のとき'
        mock: なし
        expected: '前者は `["https://mermaid.example.com", "https://cdn.jsdelivr.net"]`、後者は `["https://cdn.jsdelivr.net"]`（後ろは `syntax` を省いたときの `syntax.url` の既定の URL の origin）'
      - name: test_library_origins_when_syntax
        case: 正常
        summary: syntax.url の http・https の origin を追加し、相対パスでは追加しない
        condition: '`libraries` が `{}`、`htmlScripts` が `{ url: "./babel.mjs" }`、`mermaid` が `{ url: "./m.mjs" }` で、`syntax` が `{ url: "https://hljs.example.com/es/" }` のときと `{ url: "./hljs/" }` のとき'
        mock: なし
        expected: 前者は `["https://hljs.example.com"]`、後者は `[]`
    refs:
      - IF-472-22#constraints[CSP]
    status: planned
  - name: applyColorTheme
    title: テーマの設定で上書きする
    container: vscode/src/config.ts
