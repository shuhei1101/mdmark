  - name: applyPreviewTheme
    title: プレビューの配色の固定で明暗を解除する
    container: vscode/src/config.ts
    usecase: プレビューをVSCodeのテーマに合わせる
    kind: 関数
    scope: public
    summary: '`mdmark.preview.theme` が `light`・`dark` なら、設定から `colorScheme` を除いた設定を返却する。`auto` なら `config` をそのまま返却する'
    description: プレビューの `render` だけが経由し、書き出す HTML の `config` は経由しない（書き出しは `mdmark.preview.theme` によらず設定ファイルの明暗を指定する）。指定されたオブジェクトは書き換えない
    args:
      - name: options
        type: '{ config: PreviewConfig; theme: PreviewSettings["theme"] }'
        required: true
        description: '`applyColorTheme` の後の設定と、`readSettings` の `theme`'
    returns:
      type: PreviewConfig
      description: プレビューの `render` に指定する設定
    unit_tests:
      - name: test_apply_preview_theme
        case: 正常
        summary: 固定した配色のときだけ設定の明暗を解除する
        condition: '`config` が `{ colorScheme: "light", colorTheme: "theme-paper" }` で、`theme` が `dark` と `auto`'
        mock: なし
        expected: '`dark` は `{ colorTheme: "theme-paper" }`、`auto` は `{ colorScheme: "light", colorTheme: "theme-paper" }`。指定した `config` は変わらない'
    refs:
