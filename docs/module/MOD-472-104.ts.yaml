    summary: '`mdmark.colorTheme` が空でなければ、設定ファイルから取り出した設定の `colorTheme` をその値に置き換えた設定を返却する'
    description: プレビューの `render` と書き出す HTML の `config` の両方が経由する。空のときは `config` をそのまま返却する。指定されたオブジェクトは書き換えない
