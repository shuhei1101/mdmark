  - name: readFolds
    title: 行のインデントと畳む行を決める
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: 行の文字から `measureIndents` でインデントのレベルを、`foldLinesOf` で畳む行の数を決めて行に付け、`folds` の行のうち畳める行に `folded` を付ける。畳めない行（コードブロックに無い行は `readCodeSpec` が除く）は当てずに警告にする
    args:
      - name: options
