id: MOD-472-276
visibility: internal
title: ライブラリ本体 / 記法 / code-blocks.ts
test_files:
  - tests/unit/src/render/syntax/code-blocks.test.ts
constants:
  - name: LINE_COMMENT_HEADS
    title: 行コメントの頭
    container: src/render/syntax/code-blocks.ts
    summary: マーカーだけを持つ行コメントのときにマーカーと一緒に削除する、マーカーの直前の頭。言語に依らず同じものを適用する。`//`・`/*`・`<!--` は前の文字を問わずに削除し、`#`・`--`・`;` は行頭か空白の後ろにあるときだけ削除する（`i--`・`foo();` を頭と取り違えない）
    entries:
      - key: //
        value: C 系・TypeScript など
      - key: '#'
        value: Python・YAML・シェルなど
      - key: --
        value: SQL・Lua など
      - key: ;
        value: Lisp・INI など
      - key: <!-- 〜 -->
        value: HTML・XML・Markdown（マーカーの後ろの `-->` も削除する）
      - key: /* 〜 */
        value: CSS など（マーカーの後ろの `*/` も削除する）
  - name: SYNTAX_LANGUAGES
    title: 色分けの言語の対応表
    container: src/render/syntax/code-blocks.ts
    summary: 情報文字列の最初の単語（小文字）から、highlight.js の言語のモジュール名を参照する表。モジュール名は `{url}languages/{モジュール名}.min.js` と npm の `highlight.js/lib/languages/{モジュール名}` の名前に該当する
    value: '{ typescript: "typescript", ts: "typescript", tsx: "typescript", javascript: "javascript", js: "javascript", jsx: "javascript", mjs: "javascript", cjs: "javascript", json: "json", yaml: "yaml", yml: "yaml", python: "python", py: "python", bash: "bash", sh: "bash", shell: "bash", zsh: "bash", html: "xml", xml: "xml", css: "css", markdown: "markdown", md: "markdown", sql: "sql", dockerfile: "dockerfile", docker: "dockerfile", diff: "diff", patch: "diff" }'
    refs:
      - IF-472-35#constraints[色分けの対象]
    status: planned
    introduced:
      pr: 97
  - name: TREE_LINE_PATTERN
    title: 罫線のフォルダ構成の行
    container: src/render/syntax/code-blocks.ts
    summary: 罫線でフォルダ構成を記載した行に当たる正規表現。行頭の空白（タブ・空白・`tree` コマンドが縦線の後ろに出す NBSP の U+00A0）と縦線（`│`・`|`）の後に `├── `・`└── `・`|-- `・`` `-- `` が続く行。`tree` 2.1.1 の出力を `od -c` で測り、縦線の後ろが NBSP 2 つと空白 1 つであることを確かめた
    value: '/^[\t \u00A0│|]*(?:├── |└── |\|-- |`-- )/u'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成の記載の警告]
    status: planned
    introduced:
      pr: 508
  - name: TREE_WARNING_MIN_LINES
    title: 罫線の記載の警告を出す行の数
    container: src/render/syntax/code-blocks.ts
    summary: '`TREE_LINE_PATTERN` に当たる行がこの数以上あるコードブロックに、罫線のフォルダ構成の記載の警告を出す。1 行だけの罫線は説明の中の例として許す'
    value: '2'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成の記載の警告]
    status: planned
    introduced:
      pr: 508
functions:
  - name: readCodeSpec
    title: コードブロックのマーカーを読み込む
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: '`code` のマーカーの設定（`validateMarkOptions` を経た値）を、タイトル（`title`。空白を含められる）・行番号の有無と最初の行の番号（`lines`・`lines.start`）・強調する行（`highlight`）・最初から畳む行（`fold`）・折り返すか（`wrap`）・罫線のフォルダ構成の記載の警告を出すか（`tree_warning`。`false` だけを止める指定にし、ほかは `true`）に読み込む。`highlight`・`fold` の要素は行の番号か行の範囲（`from`〜`to`。`to` を省くと `from` の 1 行）で、`lines.start` から数えた行の番号として読み、コードブロックの行に無い番号と `from` より小さい `to` は当てずに警告にする'
    args:
      - name: options
        type: '{ options: MarkOptions; lineCount: number }'
        required: true
        description: '`options` はマーカーの設定、`lineCount` はマーカーを削除した後のコードブロックの行の数'
    returns:
      type: '{ title: string; lineNumbers: boolean; lineStart: number; highlights: Set<number>; folds: Set<number>; wrap: boolean; treeWarning: boolean; warnings: WarningItem[] }'
      description: タイトル（無ければ空）・行番号を出すか・最初の行の番号・強調する行と最初から畳む行の位置（1 から）・折り返すか・罫線のフォルダ構成の記載の警告を出すか・読み込めなかった指定
    unit_tests:
      - name: test_read_code_spec
        case: 正常
        summary: タイトル・行番号・行と範囲の強調を読み込む
        condition: '`{"title": "My App.ts", "lines": {}, "highlight": [2, {"from": 4, "to": 6}]}`、`lineCount` が 6'
        mock: なし
        expected: '`title` が `My App.ts`、`lineNumbers` が `true`、`lineStart` が 1、`highlights` が 2・4・5・6、`warnings` が空'
      - name: test_read_code_spec_when_line_start
        case: 正常
        summary: 最初の行の番号から数えて強調する行を読む
        condition: '`{"lines": {"start": 10}, "highlight": [11, {"from": 13}]}`、`lineCount` が 5'
        mock: なし
        expected: '`lineStart` が 10、`highlights` が 2・4、`warnings` が空'
      - name: test_read_code_spec_when_line_missing
        case: 異常
        summary: 行に無い番号と逆の範囲を削除して警告にする
        condition: '`{"highlight": [2, 5, {"from": 3, "to": 1}]}`、`lineCount` が 3'
        mock: なし
        expected: '`highlights` が 2 だけ、`warnings` に `5` と `{"from": 3, "to": 1}` の項目がある'
      - name: test_read_code_spec_when_fold
        case: 正常
        summary: 最初から畳む行を読み取り、無い行を警告にする
        condition: '`{"fold": [2, {"from": 4, "to": 5}, 99]}`、`lineCount` が 6'
        mock: なし
        expected: '`folds` が 2・4・5、`warnings` に `99` の項目がある'
      - name: test_read_code_spec_when_wrap
        case: 正常
        summary: wrap を読み込む
        condition: '`{"lines": {}, "wrap": true}` と `{}`、`lineCount` が 3'
        mock: なし
        expected: 1 つ目は `wrap` が `true`、2 つ目は `wrap` が `false` で `lineNumbers` が `false`。どちらも `warnings` が空
      - name: test_read_code_spec_when_tree_warning
        case: 正常
        summary: tree_warning の false だけで罫線の記載の警告を止める
        condition: '`{"tree_warning": false}`・`{"tree_warning": true}`・`{}`、`lineCount` が 3'
        mock: なし
        expected: '`treeWarning` が順に `false`・`true`・`true`。どれも `warnings` が空'
  - name: countTreeLines
    title: 罫線のフォルダ構成の行を数える
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: コードブロックの中身を行に分け、`TREE_LINE_PATTERN` に当たる行の数を返却する
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身
    returns:
      type: number
      description: 罫線のフォルダ構成の行の数
    unit_tests:
      - name: test_count_tree_lines
        case: 正常
        summary: 今の罫線と ASCII の罫線と縦線の後ろの罫線を数える
        condition: '`mdmark/`・`├── src/`・`│   └── index.ts`・`└── README.md`・`|-- a`・`` `-- b ``・`|   |-- c`・`tree` コマンドの出力の `│` の後ろが NBSP 2 つと空白 1 つの `│\u00A0\u00A0 └── b`'
        mock: なし
        expected: '`7`'
      - name: test_count_tree_lines_when_not_tree
        case: 正常
        summary: 行の途中の罫線と、罫線の後ろに空白の無い行は数えない
        condition: '`a ├── b`・`├──b`・`-- コメント`・`const a = b || c;`'
        mock: なし
        expected: '`0`'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成の記載の警告]
    status: planned
    introduced:
      pr: 508
  - name: readLineMarks
    title: コードの行のマーカーを読み込む
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: コードブロックの中身を行に分け、行末の `[!code ++]`・`[!code --]`・`[!code highlight]`・`[!code focus]`・`[!code error]`・`[!code warning]` を行の種類（`add`・`del`・`highlight`・`focus`・`error`・`warning`）にしてマーカーを削除する。行コメントがマーカーだけならマーカーの直前の行コメントの頭（`LINE_COMMENT_HEADS`）も削除し、削除した後の行末の空白も削除する。`[\!code …]` は `\` を削除した文字にする。知らないマーカー（`[!code blink]` など）はその行に当てず記載した文字のままにし、警告にする
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身（末尾の改行 1 つは行に数えない）
    returns:
      type: '{ lines: CodeLine[]; warnings: WarningItem[] }'
      description: 行と、知らないマーカーの警告
    unit_tests:
      - name: test_read_line_marks
        case: 正常
        summary: マーカーとマーカーだけの行コメントの頭と行末の空白を削除する
        condition: '`let count = 1; // [!code ++]`・`foo(); // 削除する [!code --]`・`x = 1  # [!code highlight]`・`<p>a</p> <!-- [!code ++] -->`・`a; /* [!code --] */`・`foo();// [!code ++]`・`i-- [!code ++]`'
        mock: なし
        expected: '`{ text: "let count = 1;", kind: "add" }`・`{ text: "foo(); // 削除する", kind: "del" }`・`{ text: "x = 1", kind: "highlight" }`・`{ text: "<p>a</p>", kind: "add" }`・`{ text: "a;", kind: "del" }`・`{ text: "foo();", kind: "add" }`・`{ text: "i--", kind: "add" }`'
      - name: test_read_line_marks_when_focus_error_warning
        case: 正常
        summary: focus・error・warning を行の種類にする
        condition: '`a(); // [!code focus]`・`b(); # [!code error]`・`c(); /* [!code warning] */`'
        mock: なし
        expected: '`{ text: "a();", kind: "focus" }`・`{ text: "b();", kind: "error" }`・`{ text: "c();", kind: "warning" }`'
      - name: test_read_line_marks_when_escaped
        case: 正常
        summary: 打ち消したマーカーは `\` を削除した文字にして適用しない
        condition: '`let count = 1; // [\!code ++]`'
        mock: なし
        expected: '`{ text: "let count = 1; // [!code ++]" }`（`kind` を持たない）'
      - name: test_read_line_marks_when_unknown
        case: 異常
        summary: 知らないマーカーは当てずに警告にする
        condition: '`foo(); // [!code blink]`'
        mock: なし
        expected: '`{ text: "foo(); // [!code blink]" }` と、`[!code blink]` の警告'
  - name: buildCodeBlocks
    title: コードブロックを飾る
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。残っている `fence` のトークンごとに、情報文字列を `splitInfoString` で言語とファイル名に分けてから次の処理をする。`code` がオンのときは `readLineMarks` で行を読み込み、直前のトークンが `code` のマーカーなら `readCodeSpec` で指定を読み込み、全てのコードブロックを部品『コードブロック』（言語・ファイル名・タイトル・行番号と最初の行の番号・`wrap`・行と、`syntax` がオンなら言語を `syntaxLanguageOf` で参照した色分けの言語。`copyState` は指定しない）の `ownBlock` に置き換える。帯の右端のコピーのボタンは `mount` が付ける。`code` がオフのときは行のマーカーを削除せず中身の行をそのまま使用し、`syntax` がオンで色分けの言語を持つコードブロックだけを帯を持たない部品（`bar: false`）に置き換え、それ以外は `fence` のまま情報文字列の最初の単語を言語に書き換える（`ts:app.ts` の `code` の class を `language-ts` にし、`:` の前が空なら最初の単語を削除する）。`mermaid` がオンで情報文字列の最初の単語がちょうど `mermaid` のコードブロックは、`code` のオン・オフによらず部品に置き換え（`code` がオフなら `bar: false`）、`mermaid: true` を指定し、色分けの言語を指定しない。`code` がオンのときは、`readFolds` で行にインデントのレベル・畳む行の数・`fold` の畳んだ状態を付けてから部品へ指定する。`readCodeSpec` と `readLineMarks` と `readFolds` の読み込めない指定はコードブロックの前に警告を差し込む。後ろが `fence` でない `code` のマーカーの場所にも警告を差し込む（`code` がオンのときだけ）。`code` がオンで、mermaid のコードブロックでなく、`readCodeSpec` の `treeWarning` が `true` のコードブロックのうち、`countTreeLines` が `TREE_WARNING_MIN_LINES` 以上のものの前に、罫線のフォルダ構成の記載の警告（画面設計『文書』の記載の警告の文言。言語が空なら `言語の無いコードブロックに`）を差し込む。言語 `tree`・図の部品・埋め込んだ HTML のコードブロックは、先のコアルールが最初の単語との一致で `fence` でなくしているため該当せず、`tree:src` のように `:ファイル名` を付けたものはここで普通のコードブロックとして描く'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readCodeSpec]'
      - '#functions[readLineMarks]'
      - 'MOD-472-213#functions[pushWarning]'
      - MOD-472-306#functions[renderCodeBlock]
      - '#functions[syntaxLanguageOf]'
      - '#functions[splitInfoString]'
      - '#functions[readFolds]'
      - '#functions[countTreeLines]'
    unit_tests:
      - name: test_build_code_blocks_when_tree_lines
        case: 異常
        summary: 罫線の行が 2 行以上の言語が tree でないコードブロックの前に罫線の記載の警告を差し込む
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（罫線のフォルダ構成の言語が tree でないコードブロック）」の文書
        mock: なし
        expected: 1 つ目（言語 `text`）と 2 つ目（言語なし）の前に罫線の記載の警告があり、本文がそれぞれ `言語 text のコードブロックに、`・`言語の無いコードブロックに、` で始まる。3 つ目（1 行だけ）・4 つ目（`tree_warning` が `false`）の前には無く、6 つ目の前には `tree_warning` の値の警告と罫線の記載の警告の 2 つがある。どのコードブロックも記載した言語の部品のまま
      - name: test_build_code_blocks_when_tree_lines_in_mermaid
        case: 正常
        summary: mermaid のコードブロックと code がオフの文書には罫線の記載の警告を出さない
        condition: '罫線の行を 3 行持つ言語 `mermaid` のコードブロックと、`<!-- features: {"code": false} -->` の文書の罫線の行を 3 行持つ言語 `text` のコードブロック'
        mock: なし
        expected: どちらの前にも記載の警告が無い
      - name: test_build_code_blocks
        case: 正常
        summary: マーカーと行のマーカーを持つコードブロックも何も持たないコードブロックも帯を持つ部品にする
        condition: '`<!-- code: {"title": "app.ts", "lines": {}} -->` の直後の 2 行の言語 `ts` のコードブロックと、マーカーも行のマーカーも持たない言語 `text` のコードブロック。`syntax` はオフ'
        mock: なし
        expected: 1 つ目が `<figure class="mdmark-code">` と `<figcaption class="mdmark-code-title mdmark-code-bar">` を持つ `html_block`、2 つ目が `<div class="mdmark-code">` と `<div class="mdmark-code-bar">` の中の `mdmark-code-lang-name` が `text` の `html_block`。どちらも `mdmark-code-copy` を持たない
      - name: test_build_code_blocks_when_file_name
        case: 正常
        summary: 情報文字列の `言語:ファイル名` を言語のラベルとファイル名とスクリーンリーダー向けの名前に分ける
        condition: 言語 `python:hoge.py` のコードブロックと、言語 `:a.txt` のコードブロック
        mock: なし
        expected: '1 つ目が `mdmark-code-lang-name` が `python`・`mdmark-code-file` が `hoge.py`・`code` の class が `language-python`・`pre` の `aria-label` が `コード: hoge.py`。2 つ目は `mdmark-code-lang` を持たず、`code` が class を持たず、`aria-label` が `コード`'
      - name: test_build_code_blocks_when_tree_with_file_name
        case: 正常
        summary: '`tree:src` はファイルツリーにせず普通のコードブロックにする'
        condition: 言語 `tree:src` で罫線のフォルダ構成を記載したコードブロック
        mock: なし
        expected: '`mdmark-tree` が無く、`mdmark-code-lang-name` が `tree`・`mdmark-code-file` が `src` の部品'
      - name: test_build_code_blocks_when_escaped
        case: 正常
        summary: 打ち消したマーカーは `\` を削除した文字の行にする
        condition: '`let count = 1; // [\!code ++]` だけのコードブロック'
        mock: なし
        expected: 部品の中身が `let count = 1; // [!code ++]` を持ち `\` が無く、`mdmark-code-line` に分けていない
      - name: test_build_code_blocks_when_unknown_line_mark
        case: 異常
        summary: 知らないマーカーだけのコードブロックの前に警告を差し込む
        condition: '`foo(); // [!code blink]` だけのコードブロック'
        mock: なし
        expected: コードブロックの前に警告（本文に `[!code blink]`）があり、部品の中身は `foo(); // [!code blink]` のまま
      - name: test_build_code_blocks_when_no_fence
        case: 異常
        summary: 後ろにコードブロックの無いマーカーを警告にする
        condition: '`<!-- code: {"title": "app.ts"} -->` の直後が段落'
        mock: なし
        expected: マーカーの場所に警告があり、段落が残る
      - name: test_build_code_blocks_when_disabled
        case: 正常
        summary: '`code` も `syntax` もオフなら `fence` のまま、情報文字列を言語だけにする'
        condition: '`features.code` と `features.syntax` が `false` で、行末に `// [!code ++]` を持つ言語 `ts:app.ts` のコードブロック'
        mock: なし
        expected: '`fence` のままで、`info` の最初の単語が `ts`、中身に `// [!code ++]` が残り、`mdmark-code-bar` が無い'
      - name: test_build_code_blocks_when_syntax
        case: 正常
        summary: 色分けの対象に色分けの属性を付け、対象外には付けない
        condition: マーカーも行のマーカーも持たない言語 `yml` のコードブロックと、言語 `text` のコードブロック。`syntax` はオン
        mock: なし
        expected: 1 つ目が `<code class="language-yml" data-mdmark-syntax="yaml">` を含む帯を持つ部品、2 つ目は `data-mdmark-syntax` の無い帯を持つ部品
      - name: test_build_code_blocks_when_syntax_disabled
        case: 正常
        summary: '`syntax` がオフなら色分けの属性を付けない'
        condition: '`<!-- features: {"syntax": false} -->` と、マーカーも行のマーカーも持たない言語 `ts` のコードブロックと、`<!-- code: {"lines": {}} -->` の直後の言語 `ts` のコードブロック'
        mock: なし
        expected: 1 つ目は帯を持つ部品、2 つ目は行番号を持つ部品で、どちらにも `data-mdmark-syntax` が無い
      - name: test_build_code_blocks_when_code_disabled_with_syntax
        case: 正常
        summary: '`code` がオフでも `syntax` がオンなら、行のマーカーを削除せず帯を持たない部品で色分けの属性を付ける'
        condition: '`features.code` が `false` で、行末に `// [!code ++]` を持つ言語 `ts:app.ts` のコードブロック'
        mock: なし
        expected: '`<code class="language-ts" data-mdmark-syntax="typescript">` を持つ `html_block` で、`mdmark-code-bar` が無く、行に分けず、中身に `// [!code ++]` が残る'
      - name: test_build_code_blocks_when_dockerfile_and_diff
        case: 正常
        summary: dockerfile・diff と別名を色分けの言語に参照する
        condition: 言語 `dockerfile`・`docker`・`diff`・`patch` のコードブロック。`syntax` はオン
        mock: なし
        expected: '`data-mdmark-syntax` が順に `dockerfile`・`dockerfile`・`diff`・`diff`'
      - name: test_build_code_blocks_when_mermaid
        case: 正常
        summary: mermaid のコードブロックに mermaid の対象の属性を付け、色分けの対象にしない
        condition: '言語 `mermaid` のコードブロックと、言語 `mermaid:a.mmd` のコードブロック。`syntax`・`mermaid` はオン'
        mock: なし
        expected: '1 つ目が `data-mdmark-mermaid` を持つ帯を持つ部品で `data-mdmark-syntax` が無く、`code` が `language-mermaid`。2 つ目は `data-mdmark-mermaid` を持たない'
      - name: test_build_code_blocks_when_mermaid_disabled
        case: 正常
        summary: '`mermaid` がオフなら、ほかの言語と同じコードブロックにする'
        condition: '`<!-- features: {"mermaid": false} -->` と言語 `mermaid` のコードブロック。`code` はオン'
        mock: なし
        expected: 帯を持つ部品で、`data-mdmark-mermaid` が無い
      - name: test_build_code_blocks_when_mermaid_without_code
        case: 正常
        summary: '`code` がオフでも mermaid のコードブロックは帯を持たない部品にして属性を付ける'
        condition: '`features.code` が `false` で、言語 `mermaid` のコードブロック'
        mock: なし
        expected: '`<pre data-mdmark-mermaid` で始まる `html_block` で、`mdmark-code-bar` が無い'
      - name: test_build_code_blocks_when_foldable
        case: 正常
        summary: インデントのある行と畳める行を行に分け、fold の行を畳んだ状態にする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（畳める行とインデント）」の文書
        mock: なし
        expected: yaml の 1 行目が `data-fold-lines="3"`、2 行目が `data-indent="1"`・`data-fold-lines="1"`・`data-folded`、3 行目が `data-indent="2"`。json のオブジェクトを開く行の `data-fold-lines` が閉じ括弧の行を含まない。`tree` のコードブロックが `mdmark-code-line` を持たない
      - name: test_build_code_blocks_when_fold_invalid
        case: 異常
        summary: 畳めない fold の行を警告にする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（畳めない行の fold）」の文書
        mock: なし
        expected: コードブロックの前の警告が 1 つで、項目に `3` と `99` があり、1 行目だけが `data-folded` を持つ
      - name: test_build_code_blocks_when_focus
        case: 正常
        summary: focus の行を持つ pre に mdmark-code-has-focus を付ける
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（focus・error・warning の行）」の文書
        mock: なし
        expected: '`pre` が `mdmark-code-lines` と `mdmark-code-has-focus` を持ち、1〜3 行目が `data-kind` の `focus`・`error`・`warning`'
    reason: 色分けの対象を、mdmark が出した要素だけが持ち続ける属性 `data-mdmark-syntax` で示すため、マーカーも行のマーカーも持たない色分けの対象も部品に置き換える（`fence` のままだと `code` の属性は sanitize が生の HTML と同じく落とす）。部品は `pre` に同じスクリーンリーダー向けの名前と `tabindex` を付け、`markSourceLines` が元の行番号を付けるため、出力は `fence` のときと属性 1 つだけ違う
  - name: syntaxLanguageOf
