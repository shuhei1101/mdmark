        required: true
        description: '`readLineMarks` の行と、`readCodeSpec` の最初から畳む行の番号'
    returns:
      type: '{ lines: CodeLine[]; warnings: WarningItem[] }'
      description: '`indent`・`foldLines`・`folded` を付けた行と、畳めない行の警告'
    callees:
      - MOD-472-237#functions[measureIndents]
      - MOD-472-237#functions[foldLinesOf]
    unit_tests:
      - name: test_read_folds
        case: 正常
        summary: インデントと畳む行を付け、指定の行を畳んだ状態にする
        condition: '`a:`・`  b:`・`    c: 1`・`  d: 2` の行と、`folds` が 2'
        mock: なし
