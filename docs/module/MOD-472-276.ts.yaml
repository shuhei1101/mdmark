  - name: splitInfoString
    title: 情報文字列を言語とファイル名に分ける
    container: src/render/syntax/code-blocks.ts
    summary: 情報文字列の最初の単語を最初の `:` で分け、前を言語、後ろをファイル名にする。`:` が無ければ単語の全てが言語でファイル名は空。`:` の前が空なら言語もファイル名も空にする
