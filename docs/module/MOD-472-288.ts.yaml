id: MOD-472-288
visibility: internal
title: ライブラリ本体 / 記法 / toc.ts
test_files:
  - tests/unit/src/render/syntax/toc.test.ts
functions:
  - name: buildToc
    title: 目次を配置する
    container: src/render/syntax/toc.ts
    kind: 関数
    scope: internal
    summary: コアルール。`toc` がオンなら、`toc` のマーカーの場所に `env.headings` の h2・h3 の部品『目次』を配置する
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - MOD-472-319#functions[renderToc]
    unit_tests:
      - name: test_build_toc
        case: 正常
        summary: h2 と h3 を入れ子にし、h4 は記載しない
        condition: '`<!-- toc -->` と `## 導入`・`### 前提`・`#### 細目`・`## 使用方法`'
        mock: なし
        expected: マーカーの場所に `mdmark-toc` があり、`前提` が `導入` の入れ子で、`細目` が無い
