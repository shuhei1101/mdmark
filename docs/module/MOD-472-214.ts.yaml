id: MOD-472-214
visibility: internal
title: ライブラリ本体 / 描画 / sanitize.ts
test_files:
  - tests/unit/src/render/sanitize.test.ts
constants:
  - name: ALIGN_VALUES
    title: 列の配置の値
    container: src/render/sanitize.ts
    summary: class `mdmark-align-{値}` に移す `text-align` の値
    value: '["left", "center", "right"]'
  - name: SANITIZE_OPTIONS
    title: 落とす設定
    container: src/render/sanitize.ts
    summary: sanitize-html に指定する設定。記法の要素と属性を許し（mdmark が出した `style.mdmark-html-style` と `template.mdmark-html-script`・`data-html-scope`・`data-lang` を含む。文書に記載した `style`・`template` は落とす）、誰が出したかは `sanitize` の `transformTags` が見分ける。`allowedTags` に `nav`・`figure`・`figcaption` を追加し、`allowedAttributes`・`allowedClasses` に記法が出す class（部品設計の HTML）・`data-kind`・`data-features`・`data-filter`・`data-section`・`data-row`・`data-mdmark-own`・見出しと `figure`・`div` の `id`・`colspan`・`rowspan`・`scope`・`aria-label`・`role`（`note`・`status`）を追加する。今の値は下の entries。記法が出す `video`・`audio` と、`controls`・`autoplay`・`muted`・`loop`・`playsinline`・`preload`・`poster`・`data-color`・`data-align`・`data-nolightbox`・`data-gif`・`data-card`・`data-file-kind` も許す（文書に記載した `video`・`audio`・`source` は `sanitize` が落とす）
    value: 下の entries
    entries:
      - key: allowedTags
        value: 既定 + `img`・`del`・`details`・`summary`・`input`
      - key: allowedAttributes
        value: '`*`: `data-source-line` / `a`: `href`・`title` / `img`: `src`・`alt`・`title` / `details`: `open` / `input`: `type`・`disabled`・`checked` / `td`: `data-label` / `pre`・`table`: `tabindex`・`aria-label` / `div`: `data-mdmark-slot`・`data-mdmark-args`・`role`（値は `status` だけ）'
      - key: allowedClasses
        value: '`code`: `language-*` / `li`: `task-list-item` / `th`・`td`: `mdmark-align-*` / `div`: `mdmark-embed`。ここに無い要素は class を持てない（`allowedAttributes` に `class` を記載しない）'
      - key: allowedSchemes
        value: '`http`・`https`・`mailto`（相対 URL は既定で許す）'
      - key: parseStyleAttributes
        value: '`false`（postcss を呼ばない）'
      - key: transformTags
        value: '`*`: `style` の `text-align` の値が `ALIGN_VALUES` なら class `mdmark-align-{値}` を追加し、`style` は常に削除する。`data-source-line` は値が `^\d+$` の構造でなければ削除する / `img`: `src` が `data:` で始まり `data:image/(png|jpeg|gif|webp|svg+xml);base64,{base64 の文字}` の構造（末尾に `#only-light`・`#only-dark` のフラグメントを持ってよい）でなければ `src` を削除する / `input`: `type="checkbox"` と `disabled` をもう一度付け、`checked` だけを引き継ぐ / `pre`・`table`: `tabindex` があれば `"0"` にする'
      - key: allowedSchemesByTag
        value: '`img`: `http`・`https`・`data`（書き出しが画像を `data:` URL で埋めるため。残す `data:` URL の構造は `transformTags` が絞る） / `video`・`audio`: `http`・`https`・`data`（`src` と `poster`。`data:` URL は `poster` の `img` と同じ構造だけを残し、`src` の `data:` URL は削除する）'
  - name: EMBED_STYLES
    title: 埋め込んだ HTML の残す宣言
    container: src/render/sanitize.ts
    summary: 埋め込んだ HTML の要素の `style` に残す宣言の名前と、値の許可の正規表現。sanitize-html の `allowedStyles` には指定せず（postcss を差し替えているため）、`filterEmbeddedStyle` が使用する。どの宣言も値に `url(`・`expression(`・単位 `vw`・`vh` を含むと落とす
    value: 下の entries
    entries:
      - key: display
        value: /^(block|inline|inline-block|flex|inline-flex|grid|inline-grid|none)$/
      - key: flex・flex-direction・flex-wrap・flex-grow・flex-shrink・flex-basis・align-items・justify-content・align-self
        value: キーワード・数値・長さ
      - key: grid-template-columns・grid-template-rows・grid-column・grid-row・gap・row-gap・column-gap
        value: キーワード・数値・長さ・`fr`・`repeat(`・`minmax(`
      - key: margin*・padding*
        value: 0 以上の長さ・`auto`（負の値は落とす。負の `margin` で枠の外へ出して重ねる表示を作らせない）
      - key: border*・border-radius
        value: 長さ・線の種類・色
      - key: width・max-width・min-width・height
        value: 長さ・割合・`auto`
      - key: color・background-color
        value: 色（`var(--mdmark-` で始まる変数を含む）
      - key: font-size・font-weight・text-align
        value: 長さ・割合・キーワード・数値
    refs:
      - IF-472-34#constraints[埋め込んだ HTML]
    status: planned
    introduced:
      pr: 45
functions:
  - name: sanitize
    title: 許可していないものを落とす
    container: src/render/sanitize.ts
    kind: 関数
    scope: internal
    summary: '`SANITIZE_OPTIONS` に `nonce` を確認する `transformTags` を追加して sanitize-html を呼ぶ。`data-mdmark-own` が `nonce` と等しい要素は記法の class・`data-*`・`id`・`role`・`aria-*` を残して属性だけを削除し（mdmark が出した要素の `style` は、図の部品の位置・大きさ・余白・倍率（`DIAGRAM_STYLE_PATTERN`。余白は `padding` の 0 以上の px の値 1 つか 2 つ）か、コードブロックの `code` の行番号の桁の数（`--mdmark-code-digits: {数字}`）か、画像の幅（`--mdmark-image-width: {整数}px` か `{整数}%`）か、ギャラリーの列の数（`--mdmark-gallery-cols: {1〜6}`）か、埋め込んだ HTML の中の要素の `filterEmbeddedStyle` の宣言だけを残す）、それ以外の要素からは記法の class（`mdmark-` で始まる記法のものと `markdown-alert*`）・記法の `data-*`・`id`・`hidden`・`colspan`・`rowspan`・`scope` を落とす。`data-source-line` は誰が出した要素でも、値が 0 以上の整数のときだけ残す。`video`・`audio` は `data-mdmark-own` が `nonce` と等しいときだけ残し、それ以外は中身ごと落とす'
    args:
      - name: html
        type: string
        required: true
        description: 解析器の出した HTML
      - name: nonce
        type: string
        required: true
        description: この描画の `env.nonce`
    returns:
      type: string
      description: 落とした後の HTML
    unit_tests:
      - name: test_sanitize
        case: 正常
        summary: スクリプトと `style` を落とし、折り畳みを残す
        condition: '`<script>`・`<a onclick="x" href="javascript:x">`・`<p style="position:fixed">`・`<details><summary>`'
        mock: なし
        expected: '`script`・`onclick`・`javascript:`・`style` が無く、`details` と `summary` が残る'
      - name: test_sanitize_when_align
        case: 正常
        summary: 列の配置を class に移す
        condition: '`<td style="text-align:right">` と `<td style="text-align:justify;color:red">`'
        mock: なし
        expected: 前者が `class="mdmark-align-right"`、後者は class も `style` も持たない
      - name: test_sanitize_when_input
        case: 正常
        summary: 入力欄を無効のチェックボックスにもう一度付ける
        condition: '`<input type="text" value="x">` と `<input type="checkbox" checked>`'
        mock: なし
        expected: '`<input type="checkbox" disabled />` と `<input type="checkbox" disabled checked />`'
      - name: test_sanitize_when_classes
        case: 正常
        summary: 許した要素の許した class だけを残し、`role` は `status` だけを残す
        condition: '`<code class="language-ts evil">`・`<div class="mdmark-embed other" data-mdmark-slot="x" role="status">`・`<p class="x">`・`<div class="mdmark-embed" role="alert">`'
        mock: なし
        expected: '`class="language-ts"` と `class="mdmark-embed"`。`data-mdmark-slot` と `role="status"` は残る。`<p>` は class を持たず、`role="alert"` が無い（値の無い `role` 属性は残る）'
      - name: test_sanitize_when_tabindex
        case: 正常
        summary: 文書に記載した `tabindex` を 0 にする
        condition: '`<table tabindex="5">`'
        mock: なし
        expected: '`<table tabindex="0">`'
      - name: test_sanitize_when_data_image
        case: 正常
        summary: 画像の種類と base64 の構造の `data:` URL だけを画像の `src` に残す
        condition: '`<img src="data:image/png;base64,iVBORw0KGgo=">`・`<img src="data:text/html;base64,PHNjcmlwdD4=">`・`<img src="data:image/svg+xml,<svg/>">`・`<a href="data:image/png;base64,iVBORw0KGgo=">`'
        mock: なし
        expected: 1 つ目の `img` だけが `src` を持ち、2 つ目と3 つ目の `img` は `src` を持たず、`a` は `href` を持たない
      - name: test_sanitize_when_own_style
        case: 正常
        summary: 自分が出した要素の style は図の部品と埋め込んだ HTML の許した宣言だけ残し、記載した要素の style は落とす
        condition: '`data-mdmark-own` が `nonce` と等しい図のノードの `<div class="mdmark-diagram-node" style="left:10px;top:20px">` と、`div.mdmark-html` の中の `<div style="display:flex;position:fixed">`、持たない `<div style="display:flex">`'
        mock: なし
        expected: 図のノードが `style="left:10px;top:20px"`、埋め込んだ HTML の要素が `style="display:flex"`、記載した要素は `style` を持たない
      - name: test_sanitize_when_diagram_node_padding
        case: 正常
        summary: 自分が出した図のノードの余白の style を位置と大きさと一緒に残し、負の余白の style は図の部品の宣言として扱わない
        condition: '`data-mdmark-own` が `nonce` と等しい `<div class="mdmark-diagram-node" style="left:10px;top:20px;width:280px;height:136px;padding:34px 70px">`・`<div class="mdmark-diagram-node" style="left:0px;top:0px;width:56px;height:56px;padding:14.6px">`・`<div class="mdmark-diagram-node" style="left:10px;top:20px;padding:-4px">`'
        mock: なし
        expected: 1 つ目と 2 つ目の `style` が記載したとおり残り、3 つ目は `left`・`top` を持たない
      - name: test_sanitize_when_code_digits
        case: 正常
        summary: 自分が出したコードブロックの行番号の桁の数だけを残す
        condition: '`data-mdmark-own` が `nonce` と等しい `<code style="--mdmark-code-digits: 2">` と `<code style="--mdmark-code-digits: 2; color: red">`、持たない `<code style="--mdmark-code-digits: 2">`'
        mock: なし
        expected: 1 つ目が `style="--mdmark-code-digits:2"`、2 つ目と 3 つ目は `style` を持たない
      - name: test_sanitize_when_source_line
        case: 正常
        summary: 元の行番号は整数のときだけ残す
        condition: '`<p data-source-line="3">`・`<td data-source-line="12">`・`<p data-source-line="x">`'
        mock: なし
        expected: 1 つ目と 2 つ目は属性が残り、3 つ目は `data-source-line` を持たない
      - name: test_sanitize_when_media
        case: 正常
        summary: 記法の動画を残し、文書に記載した動画を落とす
        condition: '`nonce` を持つ `<figure data-mdmark-own><video src="a.mp4" controls preload="metadata" playsinline aria-label="操作" poster="a.png"></video></figure>` と、文書に記載した `<video src="b.mp4"><source src="b.webm"></video>`'
        mock: なし
        expected: 1 つ目の `video` と属性が残り、2 つ目の `video`・`source` が無い
      - name: test_sanitize_when_image_style
        case: 正常
        summary: 画像の幅とギャラリーの列の数の style だけを残す
        condition: '`nonce` を持つ `<figure style="--mdmark-image-width: 40%">`・`<div style="--mdmark-gallery-cols: 3">`・`<figure style="--mdmark-image-width: calc(1px)">` と、文書に記載した `<p style="--mdmark-image-width: 10px">`'
        mock: なし
        expected: 1 つ目と 2 つ目の `style` が残り、3 つ目と 4 つ目は `style` を持たない
      - name: test_sanitize_when_cell_span
        case: 正常
        summary: セルの結合と見出しの範囲は記法が出したセルにだけ残す
        condition: '`data-mdmark-own` が `nonce` と等しい `<th rowspan="2" colspan="2" scope="colgroup">` と、文書に記載した `<td rowspan="9" scope="row">`'
        mock: なし
        expected: 前者が `rowspan`・`colspan`・`scope` を持ち、後者はどれも持たない
  - name: sanitizeEmbedded
    title: 埋め込んだ HTML を落とす
    container: src/render/sanitize.ts
    summary: 埋め込んだ HTML の中身を `SANITIZE_OPTIONS` に `button`・`data-hint`・`style` を追加した設定で落とし、`style` は `transformTags` で `filterEmbeddedStyle` に経由する。`button` は `type="button"` にもう一度付け `form` で始まる属性を落とし、記載した人の class・`id`・`data-hint` 以外の `data-*`・`role`・`aria-*` を落とす。`textFilter` で文字を `onText` に指定し、返った HTML に置き換える（用語の下線。`a`・`code`・`pre`・見出しの中は指定しない）
    kind: 関数
    scope: internal
    args:
      - name: html
        type: string
        required: true
        description: コードブロックの中身（図の部品の custom element を置き換えた後）
      - name: onText
        type: '(text: string) => string'
        required: true
        description: 文字（エスケープ済み）を受け、置き換える HTML を返却する関数
      - name: keepClasses
        type: boolean
        required: false
        description: '真なら、記載した人の class を記法の class（`SYNTAX_CLASS_PATTERN` に合うもの）を除いて残し、class を残した要素に `data-mdmark-keep-class` を付ける（`sanitize` は、mdmark が出した要素のうちこの属性を持つものの class を絞らず、属性を削除する）。記載した人の `data-mdmark-keep-class` は削除する。`html-scripts` がオンの範囲の `html` で真にする。既定は偽'
    returns:
      type: string
      description: 落とした後の HTML
    unit_tests:
      - name: test_sanitize_embedded
        case: 正常
        summary: スクリプトを落とし、ボタンと data-hint を残す
        condition: '`<script>`・`<button onclick="x" type="submit" formaction="/x">`・`<div data-hint="説明" data-x="1" class="evil">`'
        mock: なし
        expected: '`script`・`onclick`・`formaction`・`data-x`・`class` が無く、`<button type="button">` と `data-hint="説明"` が残る'
      - name: test_sanitize_embedded_when_style
        case: 正常
        summary: style を filterEmbeddedStyle で絞る
        condition: '`style="display: flex; position: fixed"` と `style="position: fixed"`'
        mock: なし
        expected: 前者が `style="display:flex"`、後者は `style` を持たない
      - name: test_sanitize_embedded_when_text
        case: 正常
        summary: 本文の文字だけを onText に指定する
        condition: '`<p>索引</p><a href="#">索引</a><code>索引</code>`、`onText` は `索引` を `<span class="t">索引</span>` にする'
        mock: なし
        expected: '`p` の中だけが置き換わり、`a` と `code` の中は文字のまま'
      - name: test_sanitize_embedded_when_keep_classes
        case: 正常
        summary: keepClasses が真なら、記法の class を除いて記載した人の class を残す
        condition: '`<div class="box mdmark-table has-tip" data-mdmark-keep-class="x">`、`keepClasses` が `true` と省いたとき'
        mock: なし
        expected: '`true` は `<div class="box" data-mdmark-keep-class>`、省いたときは `class` と `data-mdmark-keep-class` が無い'
    refs:
      - '#constants[EMBED_STYLES]'
      - '#constants[SANITIZE_OPTIONS]'
    status: planned
    introduced:
      pr: 45
  - name: filterEmbeddedStyle
    title: 埋め込んだ HTML の style を絞る
    container: src/render/sanitize.ts
    summary: '`style` の値を `;` で宣言に分け、宣言ごとに `:` の前を名前、後ろを値として `EMBED_STYLES` の名前と値の正規表現で絞り、残った宣言を `名前:値` を `;` でつないでもう一度組む。値に `/*`・引用符・`\` を含む宣言は落とす。postcss を使用しない（`DIAGRAM_STYLE_PATTERN` と同じ作り）'
    kind: 関数
    scope: internal
    args:
      - name: style
        type: string
        required: true
        description: 要素の `style` の値
    returns:
      type: string
      description: 残した宣言をつないだ値。残る宣言が無ければ空の文字で、呼び元は `style` を削除する
    unit_tests:
      - name: test_filter_embedded_style
        case: 正常
        summary: 許した宣言だけを残す
        condition: '`display: flex; gap: 12px; position: fixed; background-image: url(https://example.com/a.png); width: 100vw; color: var(--mdmark-color-accent); margin-top: -9999px; padding: 4px`'
        mock: なし
        expected: '`display:flex;gap:12px;color:var(--mdmark-color-accent);padding:4px`（負の `margin-top` は落ちる）'
      - name: test_filter_embedded_style_when_tricky
        case: 異常
        summary: コメントと引用符を含む宣言を落とす
        condition: '`color: red /* x */; font-size: "12px"; padding: 4px`'
        mock: なし
        expected: '`padding:4px`'
    refs:
      - '#constants[EMBED_STYLES]'
    status: planned
    introduced:
      pr: 45
  - name: isAllowedUrl
    title: 許す URL かを確認する
    container: src/render/sanitize.ts
    kind: 関数
    scope: internal
    summary: '`SANITIZE_OPTIONS` の `allowedSchemes`（`http`・`https`・`mailto`）のスキームか、スキームを持たない相対 URL なら `true` を返却する。スキームは前後の空白と制御文字を除き、小文字にして比べる（sanitize-html と同じ見分け）'
    args:
      - name: url
        type: string
        required: true
        description: 確認する URL
    returns:
      type: boolean
      description: 本文のリンクで許すか
    unit_tests:
      - name: test_is_allowed_url
        case: 正常
        summary: 本文のリンクと同じスキームを許す
        condition: '`https://example.com`・`mailto:a@example.com`・`./other.md`・`#top`・`javascript:alert(1)`・` JavaScript:alert(1)`・`id:spec#items`'
        mock: なし
        expected: 前の 4 つが `true`、後ろの 3 つが `false`
    status: planned
    introduced:
      pr: 328
