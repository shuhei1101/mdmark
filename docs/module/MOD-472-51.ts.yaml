id: MOD-472-51
visibility: internal
title: ClaudeCodeプラグイン / MCPサーバー / http.ts
test_files:
  - tests/unit/src/plugin/http.test.ts
constants:
  - name: LISTEN_HOST
    title: 待ち受けるアドレス
    container: src/plugin/http.ts
    usecase: 共通
    summary: 待ち受けるアドレス
    value: 127.0.0.1
    refs:
      - IF-472-4#constraints[待ち受けるアドレス]
    status: planned
    introduced:
      pr: 141
  - name: MCP_PATH
    title: MCP のパス
    container: src/plugin/http.ts
    usecase: 共通
    summary: MCP の要求を受けるパス
    value: /mcp
    refs:
      - IF-472-4#constraints[パス]
    status: planned
    introduced:
      pr: 141
  - name: PORT_IN_USE_MESSAGE
    title: ポートが使用されているときの文
    container: src/plugin/http.ts
    usecase: 共通
    summary: 待ち受けるポートを別のプロセスが使用しているときに標準エラーに書き込む文。`{port}` をポートに置き換える
    value: ポート {port} は別のプロセスが使用しています。mdmark serve が既に起動しているなら、そのまま使用できます。別のポートで動かすときは、~/.claude/settings.json の env と mdmark serve を起動する環境の両方に同じ MDMARK_PORT を設定してください。
    refs:
      - IF-472-4#exceptions[なし（ポートが使用されている・終了コード 1）]
    status: planned
    introduced:
      pr: 141
functions:
  - name: routeRequest
    title: 要求を振り分ける
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: パス・Host・Origin を確認し、通った要求だけを MCP のハンドラーへ指定する
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ request: Request; handler: McpHttpHandler }'
        required: true
        description: 組み込みの `Request` にした要求と、`createMcpHandler` が返却したハンドラー
    returns:
      type: Promise<Response>
      description: 返却する応答
    process: |-
      1. パスが `MCP_PATH` でなければ 404 を返却する
      2. `hostHeaderValidationResponse(request, localhostAllowedHostnames())` か `originValidationResponse(request, localhostAllowedOrigins())` が応答を返却すれば、それ（403）を返却する
      3. `handler.fetch(request)` の応答を返却する
    unit_tests:
      - name: test_route_request
        case: 正常
        summary: localhost の /mcp はハンドラーへ指定する
        condition: '`http://127.0.0.1:8782/mcp`、Host が `127.0.0.1:8782`、Origin なし'
        mock: 呼ばれた要求を記録して 200 を返却する `fetch` のハンドラー
        expected: 200 で、ハンドラーが 1 回呼ばれる
      - name: test_route_request_when_path_unknown
        case: 異常
        summary: /mcp 以外は 404
        condition: パスが `/`
        mock: 呼ばれたかを記録するハンドラー
        expected: 404 で、ハンドラーが呼ばれない
      - name: test_route_request_when_host_not_localhost
        case: 異常
        summary: localhost でない Host を拒む
        condition: Host が `evil.example:8782`
        mock: 呼ばれたかを記録するハンドラー
        expected: 403 で、ハンドラーが呼ばれない
      - name: test_route_request_when_origin_not_localhost
        case: 異常
        summary: localhost でない Origin を拒む
        condition: Origin が `https://evil.example`
        mock: 呼ばれたかを記録するハンドラー
        expected: 403 で、ハンドラーが呼ばれない
    callees:
      - LIB-472-2#catalogs[API].entries[hostHeaderValidationResponse]
      - LIB-472-2#catalogs[API].entries[originValidationResponse]
    refs:
      - IF-472-4#constraints[パス]
    status: planned
    introduced:
      pr: 141
  - name: toRequest
    title: 要求を変換する
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: '`node:http` の要求を組み込みの `Request` にする'
    scope: internal
    is_async: false
    args:
      - name: options
        type: '{ req: IncomingMessage; port: number }'
        required: true
        description: 受けた要求と待ち受けているポート
    returns:
      type: Request
      description: '`http://{LISTEN_HOST}:{port}{req.url}` を URL にし、メソッド・ヘッダー・本文を移した要求'
    process: |-
      1. メソッドとヘッダーを移す
      2. GET・HEAD 以外は `req` を本文のストリームにし、`duplex: "half"` を付ける
    unit_tests:
      - name: test_to_request
        case: 正常
        summary: メソッド・パス・ヘッダー・本文を移す
        condition: '`POST /mcp`、`content-type: application/json`、本文 `{"a":1}` の要求を一時サーバーで受ける'
        mock: なし（`node:http` の一時サーバー）
        expected: 'URL が `http://127.0.0.1:{port}/mcp`、`content-type` が移り、`await request.json()` が `{ a: 1 }`'
    status: planned
    introduced:
      pr: 141
  - name: writeResponse
    title: 応答を記載する
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: 組み込みの `Response` を `node:http` の応答へ引き渡す
    scope: internal
    is_async: true
    side_effects: '`res` に記載する'
    args:
      - name: options
        type: '{ response: Response; res: ServerResponse }'
        required: true
        description: 返却する応答と書き込む先
    returns:
      type: Promise<void>
      description: 本文を実行し終えたら解決する
    process: |-
      1. ステータスとヘッダーを記載する
      2. 本文があれば読み込みながら記載し、読み込み終えたら `res` を閉じる（SSE の応答も実行しながら記載する）
    unit_tests:
      - name: test_write_response
        case: 正常
        summary: ステータス・ヘッダー・本文を実行する
        condition: '`new Response("ok", { status: 202, headers: { "x-a": "1" } })` を一時サーバーで返却する'
        mock: なし（`node:http` の一時サーバー）
        expected: クライアントが受けたステータスが 202、`x-a` が `1`、本文が `ok`
    status: planned
    introduced:
      pr: 141
  - name: runServe
    title: 常駐サーバーを動かす
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    role: 組み立て
    summary: '`mdmark serve` の本体。`LISTEN_HOST` の `MCP_PATH` で待ち受け、止める合図で閉じる'
    scope: public
    is_async: true
    side_effects: ポートを待ち受ける。標準出力・標準エラーへ書き込む
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; packageDir: string; version: string; signal: AbortSignal; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: 環境変数・`mdmark serve` を起動したパッケージの直下・mdmark のバージョン・止める合図・標準出力と標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 終了コード
    process: |-
      1. ポートを読み込む（`CliError` は呼び出し元の CLI が終了コード 1 にする）
      2. `{packageDir}/dist` でサーバーの読み込む場所を作り、端末の設定（`resolveSettingsPath`）の `serve.systemdUnit`・`serve.tmuxSession`（無ければどちらも `mdmark-mcp`）と `MDMARK_LAUNCHER` を `describeServerLocation` に渡して、常駐サーバーが動いている場所の文にする。端末の設定を読み込めなければ既定の名前にする
      3. `createMcpHandler` に、要求ごとに MCP サーバーを作る関数を指定してハンドラーを作る
      4. `node:http` のサーバーで、要求ごとに要求を変換し、要求を振り分け、応答を記載する
      5. `LISTEN_HOST` とポートで待ち受ける。`EADDRINUSE` なら `PORT_IN_USE_MESSAGE` を標準エラーに書き込んで 1 を返却する
      6. 待ち受けたら `MCP サーバーを起動しました: http://{LISTEN_HOST}:{port}{MCP_PATH}` を標準出力に 1 行書く
      7. `signal` が止める合図になったらサーバーを閉じ、0 を返却する
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けの URL を記載し、tools/list に回答し、合図で止まる
        condition: '`MDMARK_PORT` に空きポート、`packageDir` にこのリポジトリの直下、`AbortController` の `signal`'
        mock: なし（SDK の `Client` と `StreamableHTTPClientTransport`）
        expected: 標準出力に `http://127.0.0.1:{port}/mcp` を含む 1 行、`listTools` が 6 つ、`abort()` の後に 0 で解決し、同じポートへの接続が拒まれる
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用されていれば 1 を返却する
        condition: 先に同じポートを別の `node:http` サーバーで待ち受ける
        mock: なし
        expected: 1 で解決し、標準エラーにポートの番号と `MDMARK_PORT` を含む文
    callees:
      - MOD-472-15#functions[readPort]
      - '#functions[toRequest]'
      - '#functions[routeRequest]'
      - '#functions[writeResponse]'
      - 'MOD-472-50#functions[createMcpServer]'
      - LIB-472-2#catalogs[API].entries[createMcpHandler]
      - MOD-472-7#functions[readSessionName]
    refs:
      - IF-472-4#
    status: planned
    introduced:
      pr: 141
