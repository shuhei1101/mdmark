id: MOD-472-115
visibility: internal
title: ライブラリ本体 / CLI / main.ts
test_files:
  - tests/unit/src/cli/main.test.ts
functions:
  - name: main
    title: CLI を実行する
    container: src/cli/main.ts
    usecase: 共通
    summary: 最初の引数のコマンド名で `init`・`check`・`export`・`build`・`upgrade`・`serve` を呼び分け、終了コードを返却する
    description: '引数は `node:util` の `parseArgs`（`--out`・`--config`・`--base`・`--text`・`--file`・`--key` は文字列、`--js`・`--plan`・`--yes`・`--keep-traces` は真偽値、位置引数を許す）で読み込む。`export`・`build` は `--keep-traces` を `keepTraces` にして `runExport`・`runBuild` に指定する。`upgrade` はパッケージの直下・`cliVersion()`・今の時刻・`ask` を `runUpgrade` に指定する。`init` は `cliVersion()` を `runInit` に指定する。`serve` は `process.env`・パッケージの直下・`cliVersion()`・`SIGINT` か `SIGTERM` で止める合図になる `AbortSignal` を `runServe` に指定する。コマンドが投げた `CliError` はその文を標準エラーに出して 1 を返却する。知らないコマンド・知らない引数・引数が無いときは、使用できるコマンドの一覧を標準エラーに出して 1 を返却する。`check` の `--text -` は標準入力を終わりまで読み込んだ文字を `text` にして `runCheck` に指定する。`src/cli/main.ts` の末尾で、入口として実行されたときだけ `main(process.argv.slice(2), 標準の入出力, createLinePrompter({ input: process.stdin, write: 標準エラー }))` を呼び、戻り値を `process.exitCode` に入れる'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: argv
        type: string[]
        required: true
        description: コマンド名から始まる引数
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先（テストで差し替える）
      - name: ask
        type: Prompter
        required: true
        description: '`upgrade` の質問（テストで差し替える）'
    returns:
      type: Promise<0 | 1>
      description: コマンドの終了コード
    unit_tests:
      - name: test_main
        case: 正常
        summary: コマンド名で init を呼び、その終了コードを返却する
        condition: '`["init", "{一時フォルダ}"]`'
        mock: 出力を配列に貯める `CliIo`、`vi.stubGlobal("__MDMARK_VERSION__", "v0.5.0")`（`init` が `cliVersion()` を読み込むため）
        expected: 0 を返却し、標準出力に `配置した:` の行がある
      - name: test_main_when_keep_traces
        case: 正常
        summary: '`--keep-traces` を `keepTraces` にして書き出しへ指定する'
        condition: '設定と `guide.md` を持つ一時フォルダで `["export", "guide.md", "--keep-traces"]`'
        mock: 出力を配列に貯める `CliIo`
        expected: 0 を返却し、書き出した `guide.html` に `id="mdmark-payload"` がある
      - name: test_main_when_command_unknown
        case: 異常
        summary: 知らないコマンドは一覧を出して 1 を返却する
        condition: '`["deploy"]`'
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返却し、標準エラーに `init`・`check`・`export`・`build`・`serve` が出る
      - name: test_main_when_cli_error
        case: 異常
        summary: コマンドが投げた CliError の文を出して 1 を返却する
        condition: 設定ファイルの無い一時フォルダで `["check"]`
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返却し、標準エラーに `mdmark init` が出る
      - name: test_main_when_upgrade
        case: 正常
        summary: upgrade を呼び、--plan を runUpgrade に指定する
        condition: 設定の `version` がパッケージと同じ一時フォルダで `["upgrade", "--plan"]`
        mock: 出力を配列に貯める `CliIo`、呼ばれたら失敗にする `Prompter`
        expected: 0 を返却し、標準出力に `適用する手順はありません` が出る
    status: planned
    introduced:
      pr: 32
