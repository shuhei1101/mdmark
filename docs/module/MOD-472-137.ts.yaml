id: MOD-472-137
visibility: internal
title: ライブラリ本体 / map / 読み取り / flowchart.ts
test_files:
  - tests/unit/src/map/flowchart.test.ts
data_models:
  - name: Flowchart
    title: 構成図の読み取り結果
    container: src/map/flowchart.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseFlowchart` の戻り値'
    properties:
      - name: direction
        type: '"TB" | "LR"'
        description: 最上位の向き（`TD` は `TB`、`RL` は `LR`、`BT` は `TB`）
      - name: nodes
        type: FlowNode[]
        description: ノード（`id`・`label`・`shape`・`classes`・`parent`）。`shape` は Mermaid の形状（`rect`・`round`・`stadium`・`circle`・`cylinder`・`rhombus`・`hexagon`・`subroutine`）
      - name: groups
        type: FlowGroup[]
        description: '`subgraph`（`id`・`title`・`parent`・`direction`）'
      - name: edges
        type: FlowEdge[]
        description: 線（`id`・`from`・`to`・`arrow`（`-->`・`-.->`・`==>`・`---`）・`both`・`label`）。`id` は `e1@-->` の ID、無ければ `{from}->{to}`（重なれば末尾に `#{番号}`）
      - name: links
        type: Record<string, string>
        description: '`click {ID} "{リンク先}"` の行のノードの ID からリンク先（記載したまま。許すかは `mapLinkProblems` が確かめる）。同じノードの行が 2 つ以上あれば後の行'
      - name: problems
        type: MapProblem[]
        description: 読めない行と閉じの無い `subgraph`
functions:
  - name: parseFlowchart
    title: flowchartを読む
    kind: 関数
    container: src/map/flowchart.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`flowchart` の Mermaid を、ノード・グループ・線と読めない行の項目に読む'
    scope: public
    args:
      - name: source
        type: string
        required: true
        description: mermaid のブロックの中身
    returns:
      type: Flowchart
      description: 読み取り結果
    process: |-
      1. 1 行目の `flowchart`・`graph` と向きを読む
      2. 2 行目からを行ごとに、`subgraph`・`end`・`direction`・`classDef`・`class`・`style`・`linkStyle`・`click`・`%%` の行と、ノードと線の文に分けて読む（`classDef`・`style`・`linkStyle` は読んで捨てる。`click` は `click {ID} "{リンク先}"`（後ろの `"{ツールチップ}"`・`_blank` などは捨てる）を `links` に入れ、`href` を省いた形とコールバックの関数を指す形は読んで捨てる）
      3. ノードと線の文は、ノード・矢印・ノードの並び（`&` と連なりを含む）を左から読み、ノードは最初に出たときのラベルと形状、`:::クラス` は `classes` に足す
         - 読めない行は `map_invalid` の項目（行・行の文字・`->` なら `-->` にする直し方）にして次の行へ進む
      4. 閉じの無い `subgraph` を `map_invalid` の項目にし、最後の行で閉じたものとして扱う
    unit_tests:
      - name: test_parse_flowchart
        case: 正常
        summary: 入れ子の subgraph・クラス・ラベル付きの線
        condition: モックの `FLOW`
        mock: なし
        expected: ノード 10・グループ 4・線 12 で親子と `classes` がモックと一致し、`problems` が空
      - name: test_parse_flowchart_when_shapes
        case: 正常
        summary: 形状の記法
        condition: '`A([a])`・`B[(b)]`・`C{c}`・`D((d))`・`E{{e}}`・`F[[f]]`'
        mock: なし
        expected: '`shape` が `stadium`・`cylinder`・`rhombus`・`circle`・`hexagon`・`subroutine`'
      - name: test_parse_flowchart_when_click
        case: 正常
        summary: click の行のリンク先を読み、関数を指す形を捨てる
        condition: '`click a "https://example.com/spec" "説明" _blank`・`click b href "./other.md"`・`click c callback`'
        mock: なし
        expected: '`links` が `{ a: "https://example.com/spec", b: "./other.md" }` で、`problems` が空'
      - name: test_parse_flowchart_when_chained
        case: 正常
        summary: 連なりと & の線
        condition: '`A & B --> C --> D`'
        mock: なし
        expected: 線が `A->C`・`B->C`・`C->D` の 3 本
      - name: test_parse_flowchart_when_edge_ids
        case: 正常
        summary: 線の ID と重なり
        condition: '`e1@--> ` の線と、ID の無い `A-->B` 2 本'
        mock: なし
        expected: '`e1` と `A->B`・`A->B#2`'
      - name: test_parse_flowchart_when_unreadable_line
        case: 異常
        summary: 読めない行
        condition: 4 行目が `A -> B`
        mock: なし
        expected: '`problems` に `map_invalid` が 1 件（`line` 3・`-->` にする直し方）、ほかの行は読む'
      - name: test_parse_flowchart_when_unclosed_subgraph
        case: 異常
        summary: 閉じの無い subgraph
        condition: '`subgraph g` の後に `end` が無い'
        mock: なし
        expected: '`problems` に `g` を含む `map_invalid` が 1 件で、`g` のグループがある'
  - name: mapLinkProblems
    title: ノードのリンク先を確かめる
    kind: 関数
    container: src/map/flowchart.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`links` のリンク先を `isAllowedUrl` で確かめ、許すものの対応と、許さないリンク先のノードの ID とリンク先の項目（`map_invalid_value`。書き方の警告に並べる）を返却する'
    scope: public
    args:
      - name: links
        type: Record<string, string>
        required: true
        description: '`parseFlowchart` の `links`'
    returns:
      type: '{ allowed: Record<string, string>; problems: MapProblem[] }'
      description: 許したリンク先と、許さないリンク先の項目（記載の順）
    callees:
      - MOD-472-214#functions[isAllowedUrl]
    refs:
      - IF-472-35#constraints[map のノードのリンク]
    unit_tests:
      - name: test_map_link_problems
        case: 正常
        summary: 許さないリンク先だけを項目にする
        condition: '`https://example.com/spec`・`./other.md`・`mailto:a@example.com`・`javascript:alert(1)`・`id:spec#items` のリンク先を持つ 5 つのノード'
        mock: なし
        expected: '`allowed` が前の 3 つで、`problems` が `javascript:alert(1)` と `id:spec#items` の 2 件。本文が画面設計『文書』の map のノードの許さないリンク先の文言と、ノードの ID とリンク先を含む'
