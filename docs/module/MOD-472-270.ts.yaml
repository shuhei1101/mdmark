id: MOD-472-270
visibility: internal
title: ライブラリ本体 / 記法 / collapse.ts
test_files:
  - tests/unit/src/render/syntax/collapse.test.ts
data_models:
  - name: CollapseSpec
    title: 折り畳みの指定
    container: src/render/syntax/collapse.ts
    summary: 表・タブ・ステップのマーカーの `collapse` を読み込んだ結果
    properties:
      - name: collapse
        type: '"none" | "closed" | "open"'
        description: '折り畳みに入れるかと、既定の開閉。`collapse` が無ければ `none`、`collapse.open` が `true` なら `open`、それ以外は `closed`'
      - name: title
        type: string | undefined
        description: '折り畳みの見出し（`collapse.title`）。`collapse` が `none` のときと空の文字では入れない'
    status: planned
    introduced:
      pr: 225
functions:
  - name: readCollapse
    title: 折り畳みの指定を読み込む
    container: src/render/syntax/collapse.ts
    summary: 表・タブ・ステップのマーカーの設定の `collapse`（共通のオブジェクトの折り畳み）を読み込み、`CollapseSpec` を作る
    kind: 関数
    scope: internal
    args:
      - name: options
        type: MarkOptions
        required: true
        description: マーカーの設定（`validateMarkOptions` を経た値）
    returns:
      type: CollapseSpec
      description: 折り畳みの指定
    unit_tests:
      - name: test_read_collapse
        case: 正常
        summary: 閉じた折り畳みと見出しを読み込む
        condition: '`{"kind": "data", "collapse": {"title": "リリースの一覧"}}`'
        mock: なし
        expected: '`collapse` が `closed`、`title` が `リリースの一覧`'
      - name: test_read_collapse_when_none
        case: 正常
        summary: collapse が無ければ折り畳まない
        condition: '`{"group": "os"}`'
        mock: なし
        expected: '`collapse` が `none`、`title` が無い'
      - name: test_read_collapse_when_open
        case: 正常
        summary: open の true を開いた折り畳みにし、空の見出しを入れない
        condition: '`{"collapse": {"open": true, "title": ""}}`'
        mock: なし
        expected: '`collapse` が `open`、`title` が無い'
    status: planned
    introduced:
      pr: 225
  - name: titleTailOf
    title: title= の後ろの単語を参照する
    container: src/render/syntax/collapse.ts
    kind: 関数
    scope: internal
    summary: 今の書き方のマーカーの引数の文字から、`title=値` の直後に空白を挟んで続く `キー=値` でない単語を返却する（空白を含むタイトルの続きとみなす単語）。無ければ `undefined`。`convertLegacyArgs` が使用し、今の書き方を参照しなくなるバージョンで削除する
    args:
      - name: text
        type: string
        required: true
        description: 今の書き方のマーカーの引数の文字
    returns:
      type: string | undefined
      description: '`title=` の直後の単語'
    unit_tests:
      - name: test_title_tail_of
        case: 正常
        summary: title= の直後の単語だけを返却する
        condition: '`title=My App.ts color=red`、`title=app.ts color=red`、`lines App.ts` をそれぞれ指定する'
        mock: なし
        expected: '`App.ts`・`undefined`・`undefined`'
    status: planned
  - name: titleTailItem
    title: title= の続きの警告の項目を作る
    container: src/render/syntax/collapse.ts
    kind: 関数
    scope: internal
    summary: '`title=` の値の空白の後ろの単語を `label` にし、今の書き方のマーカーの引数は空白で区切るため `title=` の値に空白は記載できないことを伝える項目を返却する。`convertLegacyArgs` が `titleTailOf` の単語の書き出さない記載の理由に使用する'
    args:
      - name: word
        type: string
        required: true
        description: '`titleTailOf` の単語'
    returns:
      type: WarningItem
      description: 警告の項目
    status: planned
