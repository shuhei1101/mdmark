id: MOD-472-318
visibility: internal
title: ライブラリ本体 / 部品 / badge.ts
test_files:
  - tests/unit/src/parts/badge.test.ts
functions:
  - name: renderBadge
    title: バッジを描く
    container: src/parts/badge.ts
    kind: 関数
    scope: internal
    summary: 部品設計『バッジ』の HTML を返却する。`color` を指定したときは `data-color` を付ける
    args:
      - name: options
        type: '{ label: string; color?: ColorName }'
        required: true
        description: 札の文言と色の名前
    returns:
      type: string
      description: '`<span class="mdmark-badge">` の HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_badge
        case: 正常
        summary: 文言をエスケープして札にする
        condition: '`label: "<b>v1</b>"`'
        mock: なし
        expected: '`<span class="mdmark-badge">&lt;b&gt;v1&lt;/b&gt;</span>`'
      - name: test_render_badge_when_colored
        case: 正常
        summary: 色の名前を data-color にする
        condition: '`label: "要確認"`、`color: red`'
        mock: なし
        expected: '`<span class="mdmark-badge" data-color="red">要確認</span>`'
