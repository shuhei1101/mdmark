constants:
  - name: COLUMN_RESIZE_STEP_PX
    title: キーで変える列の幅
    container: src/interact/table-resize.ts
    summary: 列の幅のつまみにフォーカスして ←・→ キーを 1 回押したときに変える幅（px）
    value: '16'
    refs:
      - IF-472-35#constraints[列の幅]
    status: planned
    introduced:
      pr: 449
  - name: DOUBLE_TAP_MS
    title: ダブルタップの間隔
    container: src/interact/table-resize.ts
    summary: タッチの 2 回のタップをダブルタップとみなす、前のタップを離してから次のタップを離すまでの上限（ms）
    value: '300'
    refs:
      - IF-472-35#constraints[列の幅]
    status: planned
