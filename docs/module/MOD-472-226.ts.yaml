  - name: TAP_MOVE_TOLERANCE_PX
    title: タップとみなす移動の上限
    container: src/interact/table-resize.ts
    summary: タッチの `pointerdown` から `pointerup` までの移動がこの幅（px）以内なら、ドラッグでなくタップとして数える
