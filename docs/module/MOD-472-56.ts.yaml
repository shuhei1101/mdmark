id: MOD-472-56
visibility: internal
title: VS Code 拡張機能 / Webview / scroll.ts
test_files:
  - tests/unit/vscode/src/webview/features/preview/panel/scroll.browser.test.ts
data_models:
  - name: Anchor
    title: 行のマーカー
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: '`data-source-line` を持つ要素の元の行番号と、文書の先頭からの位置'
    properties:
      - name: line
        type: number
        description: 元の行番号（0 始まり）
      - name: top
        type: number
        description: スクロールする要素の先頭からの位置（px）
      - name: collapsed
        type: boolean
        description: 閉じたセクションの見出しのとき `true`。この行より後で次のマーカーの行より前の行は、この見出しの位置に配置する。それ以外の要素は持たない
    status: planned
functions:
  - name: collectAnchors
    title: 行のマーカーを集める
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: 描いた文書の `data-source-line` を持つ要素を、位置の順に `Anchor` にして返却する。同じ行は最初の要素だけ、見えていない要素（高さ 0）と閉じたセクションの中の要素は除き、閉じたセクションの見出しには `collapsed` を付ける
    process: |-
      1. `root` の中の `[data-source-line]` の要素を文書の順に参照する
      2. 祖先に `hidden` の付いた `.mdmark-section-body` を持つ要素は除く（入れ子のときは、最も外側の閉じたセクションの見出しだけが残る）
      3. 高さ 0 の要素、行が整数でない要素、行か位置が直前のマーカー以下の要素は除く
      4. 見出し（`.mdmark-heading`）の直後（差分のブロックに包まれているときはそのブロックの直後）の `.mdmark-section-body` に `hidden` が付いているときは、`collapsed: true` を付ける
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; scroller: HTMLElement }'
        required: true
        description: 描いた文書の要素と、スクロールする要素
    returns:
      type: Anchor[]
      description: '`line` と `top` がどちらも増えていく並び（行が戻る要素は除く）'
    unit_tests:
      - name: test_collect_anchors
        case: 正常
        summary: 行と位置が増えていく並びにする
        condition: '`data-source-line` が 0・2・2・1・5 の要素を上から並べる（3 つ目は 2 つ目の中）'
        mock: なし
        expected: '`line` が `[0, 2, 5]` の並び'
      - name: test_collect_anchors_when_closed_section
        case: 正常
        summary: 閉じたセクションの中の要素を除き、見出しに collapsed を付ける
        condition: '`data-source-line` が 0 の見出しと 2 の段落、4 の見出しと `hidden` の付いた中身（6 の段落と、8 の見出しの閉じた入れ子のセクション）、12 の見出しを並べる'
        mock: なし
        expected: '`line` が `[0, 2, 4, 12]` の並びで、`collapsed` は 4 のマーカーだけが `true`'
      - name: test_collect_anchors_when_closed_section_in_diff_block
        case: 正常
        summary: 差分のブロックに包まれた閉じたセクションの見出しにも collapsed を付ける
        condition: '`data-source-line` が 0 の見出し、`.mdmark-diff-block` で包んだ 4 の見出しと、ブロックの直後の `hidden` の付いた中身（6 の段落）、12 の見出しを並べる'
        mock: なし
        expected: '`line` が `[0, 4, 12]` の並びで、`collapsed` は 4 のマーカーだけが `true`'
    status: planned
  - name: topForLine
    title: 行を位置にする
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: 行以下の最後のマーカーと次のマーカーの間を、行の割合で内分した位置を返却する。行以下の最後のマーカーが `collapsed` のときは、内分せずにそのマーカーの位置を返却する
    scope: public
    args:
      - name: anchors
        type: Anchor[]
        required: true
        description: 行のマーカー
      - name: line
        type: number
        required: true
        description: 元の行番号
    returns:
      type: number
      description: 先頭に配置する位置（px）。マーカーが無いか最初のマーカーより前は `0`、最後のマーカーより後は最後のマーカーの位置
    unit_tests:
      - name: test_top_for_line
        case: 正常
        summary: マーカーの間を行の割合で内分する
        condition: '`[{ line: 0, top: 0 }, { line: 10, top: 400 }]` で行 5・行 0・行 30'
        mock: なし
        expected: '`200`・`0`・`400`'
      - name: test_top_for_line_when_no_anchor
        case: 正常
        summary: マーカーが無ければ先頭
        condition: '`[]` で行 5'
        mock: なし
        expected: '`0`'
      - name: test_top_for_line_when_collapsed
        case: 正常
        summary: 閉じたセクションの中の行は見出しの位置
        condition: '`[{ line: 0, top: 0 }, { line: 4, top: 100, collapsed: true }, { line: 12, top: 140 }]` で行 4・行 11・行 12'
        mock: なし
        expected: '`100`・`100`・`140`'
    status: planned
  - name: lineForTop
    title: 位置を行にする
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: 位置の前後のマーカーの間で内分した行番号を、整数に切り捨てて返却する
    description: '`fractionalLineForTop` の値を整数に切り捨てる'
    scope: public
    args:
      - name: anchors
        type: Anchor[]
        required: true
        description: 行のマーカー
      - name: top
        type: number
        required: true
        description: 見えている先頭の位置（`scrollTop`）
    returns:
      type: number
      description: 元の行番号。マーカーが無いか最初のマーカーより前は `0`、最後のマーカーより後は最後のマーカーの行
    unit_tests:
      - name: test_line_for_top
        case: 正常
        summary: マーカーの間を内分して切り捨てる
        condition: '`[{ line: 0, top: 0 }, { line: 10, top: 400 }]` で位置 210・位置 900'
        mock: なし
        expected: '`5`・`10`'
    callees:
      - '#functions[fractionalLineForTop]'
    status: planned
  - name: fractionalLineForTop
    title: 位置を切り捨てない行にする
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: 記載した内容をプレビューに映す
    summary: 位置の前後のマーカーの間で内分した行番号を、切り捨てずに返却する
    scope: public
    args:
      - name: anchors
        type: Anchor[]
        required: true
        description: 行のマーカー
      - name: top
        type: number
        required: true
        description: 見えている先頭の位置（`scrollTop`）
    returns:
      type: number
      description: 小数部で行の途中の割合を持つ元の行番号。マーカーが無いか最初のマーカーより前は `0`、最後のマーカーより後は最後のマーカーの行
    unit_tests:
      - name: test_fractional_line_for_top
        case: 正常
        summary: マーカーの間を内分して切り捨てない
        condition: '`[{ line: 0, top: 0 }, { line: 10, top: 400 }]` で位置 210・位置 900・位置 -5'
        mock: なし
        expected: '`5.25`・`10`・`0`'
      - name: test_fractional_line_for_top_when_round_trip
        case: 正常
        summary: 切り捨てない行を topForLine に指定すると元の位置に戻る
        condition: '`[{ line: 0, top: 0 }, { line: 10, top: 400 }, { line: 12, top: 1000 }]` で位置 210・位置 700 を行にしてから `topForLine` で位置に戻す'
        mock: なし
        expected: '`210`・`700`'
    refs:
      - IF-472-21#constraints[背面のパネル]
    status: planned
    introduced:
      pr: 252
  - name: topInset
    title: 上端の帯の高さを測る
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: 狭い幅で右側の目次（`.mdmark-side-toc`）を描いた文書の上端の帯にしているとき、帯の下端からスクロールする要素の上端までの高さを返却する。帯が無いときは 0
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; scroller: Element }'
        required: true
        description: 描いた文書の要素と、スクロールする要素
    returns:
      type: number
      description: 見えている先頭を下げる高さ（px）
    process: |-
      1. `root` の中の `.mdmark-side-toc` が無いか、その幅が `root` の中の本文の列（`.mdmark-content`）の幅より狭い（広い幅の右の列）ときは 0 を返却する
      2. 帯の `getBoundingClientRect().bottom` から、スクロールする要素の上端（画面がスクロールするときは 0）を参照した値を返却する（負なら 0）
    unit_tests:
      - name: test_top_inset_when_band
        case: 正常
        summary: 狭い幅の帯の下端までの高さを返却する
        condition: 幅 390px の要素に右側の目次を持つ文書を描く
        mock: なし
        expected: 帯の高さ（`getBoundingClientRect().bottom`）と等しい値
      - name: test_top_inset_when_wide
        case: 正常
        summary: 広い幅の右の列では 0
        condition: 幅 1280px の要素に右側の目次を持つ文書を描く
        mock: なし
        expected: '`0`'
      - name: test_top_inset_when_no_side_toc
        case: 正常
        summary: 右側の目次が無い文書では 0
        condition: 見出しの無い文書を描く
        mock: なし
        expected: '`0`'
    refs:
      - IF-472-17#constraints[プレビューから合わせる]
    status: planned
