constants:
  - name: STICKY_MODE_ATTRIBUTE
    title: 行の留め方の属性
    container: src/table/table-sticky.interact.ts
    summary: '`attachStickyRows` が表ごとの留める要素（表を包む横のスクロールの要素 `.mdmark-table-scroll`。包む要素が無い表は `table`）に付ける属性。値は `timeline`（`animation-timeline` でずらす）か `script`（JS でずらす量を入れる）で、CSS はこの属性で適用する規則を分ける'
    value: '"data-mdmark-sticky"'
    status: planned
functions:
  - name: attachStickyRows
    title: 表の見出し行と集計の行を留める
    container: src/table/table-sticky.interact.ts
    summary: '`root` の中の本文の行を持つ全ての `table`（表の部品で包まない表を含む）の見出し行と集計の行を、表がスクロールする場所にかかっている間だけ、その端に留める'
    description: |-
      見出し行をスクロールする場所の上端（から `--mdmark-sticky-top` を `readStickyTop` で px に換算した分だけ下）に、集計の行をスクロールする場所の下端に留める（`docs/mock/refs/151/assets/table.js`・`table.css`）。

      対象は `root` の中の `thead` を持ち本文の行（`tBodies[0].rows`）が 1 つ以上ある全ての `table` で、表の部品（`.mdmark-table`）で包むかを問わない。
      表ごとの留める要素は、表を包む `.mdmark-table-scroll` があればそれ、無ければ `table`。属性と `view-timeline` は留める要素に付け、CSS 変数は `table` に入れる。
      スクロールする場所は、留める要素の親から祖先へたどって最初に `overflow-y` の計算値が `auto`・`scroll`・`hidden` で `scrollHeight > clientHeight` の要素で、無ければ画面（インターフェース定義『文書を描く』の制約『見出し行と集計の行を留める』）。横にだけスクロールする `.mdmark-wide-range`・`.mdmark-html` などは縦にはみ出さないため選ばない。
      留め方は表ごとに決める。`CSS.supports(...)` が真で、留める要素の親から最初に `overflow-y` の計算値が `visible`・`clip` でない祖先（`view-timeline` が従う要素。無ければ画面）がスクロールする場所と同じ表だけ `timeline`、それ以外は `script` にする。
      スクロールする場所と留め方は、付けたときと `ResizeObserver` の通知のたびに再選択し、留め方が変わった表は前の留め方の CSS 変数を取り除く。

      | 表ごとの留め方 | 留める要素の `data-mdmark-sticky` | 表ごとに入れる値 |
      | --- | --- | --- |
      | 真 | `timeline` | `stickyRange` の値を `--mdmark-sticky-head-start`・`--mdmark-sticky-head-max`・`--mdmark-sticky-foot-max`・`--mdmark-sticky-foot-end` に入れ、動かすのは CSS のスクロール連動のアニメーションに任せる |
      | 偽 | `script` | スクロールする場所の上端（要素なら `getBoundingClientRect().top + clientTop`、画面なら 0）に `readStickyTop(table)` を加算した値を `stickyTop`、下端（要素なら上端 + `clientHeight`、画面なら `document.documentElement.clientHeight`）を `viewportBottom` にした `stickyShift` の値を `--mdmark-sticky-head-shift`・`--mdmark-sticky-foot-shift` に入れ、集計の行を上げている間だけ `--mdmark-sticky-foot-reach` を `2px`（それ以外は `0px`）にする |

      `timeline` は `view-timeline` が留める要素の最も近いスクロールする祖先に従うため、スクロールする場所を求めない。
      値は付けたときと、各表とスクロールする場所の要素の `ResizeObserver`（絞り込み・集計の出し入れ・幅の変化で表や区画の高さが変わったとき）でもう一度求める。
      `readStickyTop(table)` の値は付けたときと `resize`・`ResizeObserver` の通知のときだけ求めて表ごとに保持し、`scroll` では保持した値を使用する（測るための要素を毎フレーム配置しない）。
      `script` の表が 1 つでもあり得るため、`window` の `scroll`（capture・passive のため、スクロールする場所の要素の `scroll` も受け取る。もう一度求めるのは `requestAnimationFrame` で 1 フレームに 1 回）と `resize` でももう一度求める。
      表を囲む要素（`.mdmark-table`）が表のメニューのボタン（`button.mdmark-table-menu`。横のスクロールの外に重ねる）を持つ表は、ボタンと、ボタンが開く表のメニュー（中のサブメニューを含む）・テーブル設定のパネルを、見出し行と同じだけ下へずらす（ずらす規則は CSS が持ち、この関数は値と属性を入れる）。`script` の表は `--mdmark-sticky-head-shift` を囲む要素にも入れ、`timeline` の表は囲む要素に `timeline-scope` で留める要素の view timeline の名前を持ち上げて、ボタンとメニュー・パネルに見出し行と同じアニメーションを適用する（`timeline` にする判定の `CSS.supports(...)` に `timeline-scope` を加え、使用できないブラウザは `script` にする）。

      本文の行が 1 つもない表は留めない
    kind: 関数
    scope: internal
    side_effects: '留める要素の属性と表の CSS 変数を書き換え、`window` の `scroll`・`resize` を受け取る'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: 受け取りと `ResizeObserver` を削除し、留める要素の `data-mdmark-sticky` と表の CSS 変数を取り除く関数
    unit_tests:
      - name: test_attach_sticky_rows_when_timeline
        case: 正常
        summary: animation-timeline を持つブラウザでは動く範囲を CSS 変数に入れる
        condition: 本文 30 行と集計の行を持つ表（集計の行は先に `attachTables` で配置する）を付け、削除する
        mock: '`CSS.supports` を`true` を返却する関数に差し替える'
        expected: 付けた後は表を包む `.mdmark-table-scroll` が `data-mdmark-sticky="timeline"` で `root` は属性を持たず、表の `--mdmark-sticky-head-max` と `--mdmark-sticky-foot-max` が 0px より大きい。削除した後は属性と CSS 変数が無い
      - name: test_attach_sticky_rows_when_script
        case: 正常
        summary: animation-timeline を持たないブラウザではスクロールに合わせてずらす量を入れる
        condition: 画面より高い本文 60 行と集計の行を持つ表（集計の行は先に `attachTables` で配置する）を付け、見出し行の上端が画面の上端より 300px 上になるまでスクロールして 1 フレーム待つ
        mock: '`CSS.supports` を `false` を返却する関数に差し替える'
        expected: '表を包む `.mdmark-table-scroll` が `data-mdmark-sticky="script"`、表の `--mdmark-sticky-head-shift` が 300px、`--mdmark-sticky-foot-reach` が `2px`、見出し行の上端が画面の上端と一致し、集計の行の下端が画面の下端と一致する'
      - name: test_attach_sticky_rows_when_detached
        case: 正常
        summary: 削除した後はスクロールしても書き換えない
        condition: '`test_attach_sticky_rows_when_script` の表を付けて削除し、スクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `false` を返却する関数に差し替える'
        expected: '`root` の中のどの要素にも `data-mdmark-sticky` が無く、表に `--mdmark-sticky-head-shift` が無い'
      - name: test_attach_sticky_rows_when_in_scroller
        case: 正常
        summary: スクロールする区画の中の表は、区画の上端からずれの分だけ下・区画の下端を基準にずらす量を入れる
        condition: '上端が画面の 100px の位置にある高さ 400px の `overflow: auto` の要素の中に、本文 60 行と集計の行を持つ表を配置し、要素に `--mdmark-sticky-top: 40px` を適用して付け、見出し行の上端が要素の上端より 300px 上になるまで要素をスクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `false` を返却する関数に差し替える'
        expected: 見出し行の上端が画面の 140px（要素の上端 + 40px）±1px、集計の行の下端が画面の 500px（要素の下端）±1px
      - name: test_attach_sticky_rows_when_in_wide_range
        case: 正常
        summary: 横にだけスクロールする要素の中の表は、画面を基準にし、animation-timeline を持つブラウザでも JS でずらす
        condition: '`overflow-x: auto` の要素（縦にははみ出さない）の中に本文 60 行の表を配置して付け、見出し行の上端が画面の上端より 300px 上になるまでページをスクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `true` を返却する関数に差し替える'
        expected: '表を包む `.mdmark-table-scroll` が `data-mdmark-sticky="script"`、表の `--mdmark-sticky-head-shift` が 300px、見出し行の上端が画面の上端 ±1px'
      - name: test_attach_sticky_rows_when_unwrapped
        case: 正常
        summary: 表の部品で包まない表も、table に属性を付けて留める
        condition: '`.mdmark-table` で包まない、本文 60 行の `table` を付け、見出し行の上端が画面の上端より 300px 上になるまでスクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `false` を返却する関数に差し替える'
        expected: '`table` が `data-mdmark-sticky="script"`、`--mdmark-sticky-head-shift` が 300px'
      - name: test_attach_sticky_rows_when_sticky_top_calc
        case: 正常
        summary: px 以外の長さの留める位置も JS でずらす量に換算する
        condition: '`root` に `--mdmark-sticky-top: calc(.25rem * 24)` を適用し、本文 60 行の表を付け、見出し行の上端が画面の上端より 300px 上になるまでスクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `false` を返却する関数に差し替える'
        expected: 見出し行の上端が画面の上端から 96px ±1px
      - name: test_attach_sticky_rows_when_table_menu
        case: 正常
        summary: 表のメニューのボタンを見出し行と同じだけ下へずらす
        condition: 表のメニューのボタンを持つ本文 60 行の表（ボタンは先に `attachTables` で配置する）を付け、見出し行の上端が画面の上端より 300px 上になるまでスクロールして 1 フレーム待つ。`CSS.supports` が `false` と `true` の 2 通り
        mock: '`CSS.supports` を `false`・`true` を返却する関数に差し替える'
        expected: どちらもボタンの上端と見出し行の上端の差がスクロールの前と同じ（±1px）。スクロールした後にボタンを押すと、表のメニューの上端がボタンの下端の直下（±4px）にあり、メニューの矩形が画面の中に入っている。「テーブル設定」で開いたパネルの上端もボタンの下端の直下（±4px）で画面の中にある。`false` のときは囲む要素の `--mdmark-sticky-head-shift` が 300px
    callees:
      - 'MOD-472-371#functions[readStickyTop]'
      - 'MOD-472-218#functions[stickyShift]'
      - 'MOD-472-218#functions[stickyRange]'
    status: planned
lead: '表の見出し行と集計の行を画面の端に留める処理を受け持ち、表の見出しの固定を変えるときに参照する。'
