id: MOD-472-148
visibility: internal
title: ライブラリ本体 / バージョンを上げる / versions.ts
test_files:
  - tests/unit/src/cli/versions.test.ts
constants:
  - name: VERSION_PATTERN
    title: バージョンの書式
    container: src/cli/versions.ts
    summary: 手元のバージョン・パッケージのバージョン・移行の手順のフォルダ名が合うべき書式
    value: '`/^v(\d+)\.(\d+)\.(\d+)$/`'
  - name: DEVELOP_VERSION
    title: develop の最新を表す手元のバージョン
    container: src/cli/versions.ts
    summary: 設定・端末の設定の `version` と、develop のビルドの常駐サーバーの取り出し元に記載する値
    value: '`"develop"`'
  - name: DEVELOP_BUILD_PATTERN
    title: develop のビルドのバージョンの書式
    container: src/cli/versions.ts
    summary: ビルドが `--develop` で埋めたバージョン（ビルドメタデータ付き）
    value: '`/^(v\d+\.\d+\.\d+)\+develop\.[0-9a-f]{7,}$/`'
functions:
  - name: parseVersion
    title: バージョンを読み込む
    container: src/cli/versions.ts
    usecase: バージョンを上げる
    summary: '`v{MAJOR}.{MINOR}.{PATCH}` を 3 つの数にする。書式が違えば `undefined`'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: バージョンの文字列
    returns:
      type: '[number, number, number] | undefined'
      description: MAJOR・MINOR・PATCH
    unit_tests:
      - name: test_parse_version
        case: 正常
        summary: バージョンを 3 つの数にする
        condition: '`v0.12.3`'
        mock: なし
        expected: '`[0, 12, 3]`'
      - name: test_parse_version_when_invalid
        case: 異常
        summary: 書式の違うバージョンは undefined
        condition: '`0.3`・`v0.3`・`v0.3.0-rc`'
        mock: なし
        expected: どれも `undefined`
    status: planned
  - name: compareVersions
    title: バージョンを比べる
    container: src/cli/versions.ts
    usecase: バージョンを上げる
    summary: 2 つのバージョンを MAJOR・MINOR・PATCH の順に数として比べる
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: a
        type: string
        required: true
        description: 書式の合うバージョン
      - name: b
        type: string
        required: true
        description: 書式の合うバージョン
    returns:
      type: -1 | 0 | 1
      description: '`a` が古ければ -1、同じなら 0、新しければ 1'
    exceptions:
      - name: Error
        condition: どちらかが `VERSION_PATTERN` に合わない（呼ぶ側の不具合）
        message: 'バージョンの書式が違います: {バージョン}'
    unit_tests:
      - name: test_compare_versions
        case: 正常
        summary: 桁ごとに数として比べる
        condition: '`v0.10.0` と `v0.9.9`、`v1.0.0` と `v1.0.0`、`v0.3.0` と `v0.4.0`'
        mock: なし
        expected: 1・0・-1
    status: planned
  - name: cliVersion
    title: 呼んだ CLI のバージョン
    container: src/cli/versions.ts
    usecase: 共通
    summary: ビルドが `dist/cli.js` に埋めた `__MDMARK_VERSION__` を返却する
    description: ライブラリ本体の `version()` と同じ出所。hotfix のビルドは `version.ini` を上げず `--version` で打つタグのバージョンを埋めるため、`version.ini` は読み込まない
    kind: 関数
    scope: public
    is_async: false
    returns:
      type: string
      description: 埋めたバージョン（`v{MAJOR}.{MINOR}.{PATCH}`）
    unit_tests:
      - name: test_cli_version
        case: 正常
        summary: 埋めたバージョンを返却する
        condition: '`__MDMARK_VERSION__` が `v0.5.0`'
        mock: '`vi.stubGlobal("__MDMARK_VERSION__", "v0.5.0")`'
        expected: '`v0.5.0`'
    status: planned
  - name: isDevelopBuild
    title: develop のビルドか
    container: src/cli/versions.ts
    usecase: 共通
    summary: 埋めたバージョンが `DEVELOP_BUILD_PATTERN` に合うか
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: version
        type: string
        required: true
        description: 埋めたバージョン
    returns:
      type: boolean
      description: develop のビルドなら `true`
    unit_tests:
      - name: test_is_develop_build
        case: 正常
        summary: ビルドメタデータの有無で分ける
        condition: '`v0.5.0+develop.abc1234`・`v0.5.0`・`v0.5.0-develop.abc1234`'
        mock: なし
        expected: '`true`・`false`・`false`'
    status: planned
  - name: releaseVersionOf
    title: ビルドの元のバージョン
    container: src/cli/versions.ts
    usecase: バージョンを上げる
    summary: develop のビルドは `+` より前を、それ以外はそのまま返却する
    description: upgrade の目標のバージョンと、`next/` に手順があるときに案内するタグに使用する
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: version
        type: string
        required: true
        description: 埋めたバージョン
    returns:
      type: string
      description: '`v{MAJOR}.{MINOR}.{PATCH}`'
    unit_tests:
      - name: test_release_version_of
        case: 正常
        summary: ビルドメタデータを除く
        condition: '`v0.5.0+develop.abc1234`・`v0.5.0`'
        mock: なし
        expected: どちらも `v0.5.0`
    status: planned
  - name: localVersionOf
    title: 設定に記載する手元のバージョン
    container: src/cli/versions.ts
    usecase: 共通
    summary: develop のビルドは `DEVELOP_VERSION`、それ以外はそのまま返却する
    description: '`init` が配置する設定・セットアップが作る端末の設定の `version`、状態の `target_version`、常駐サーバーの取り出し元に使用する'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: version
        type: string
        required: true
        description: 埋めたバージョン
    returns:
      type: string
      description: '`v{MAJOR}.{MINOR}.{PATCH}` か `develop`'
    unit_tests:
      - name: test_local_version_of
        case: 正常
        summary: develop のビルドだけ develop にする
        condition: '`v0.5.0+develop.abc1234`・`v0.5.0`'
        mock: なし
        expected: '`develop`・`v0.5.0`'
    status: planned
  - name: isLocalVersion
    title: 手元のバージョンとして受け付けるか
    container: src/cli/versions.ts
    usecase: 共通
    summary: '`VERSION_PATTERN` に合うか `DEVELOP_VERSION` と等しいか'
    description: 端末の設定の `version` の検査（`config-files.ts`）に使用する
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: value
        type: unknown
        required: true
        description: 設定の `version` の値
    returns:
      type: boolean
      description: 受け付けるなら `true`
    unit_tests:
      - name: test_is_local_version
        case: 正常
        summary: タグの書式と develop を受け付ける
        condition: '`v0.5.0`・`develop`・`latest`・`v0.5.0+develop.abc1234`・`1`'
        mock: なし
        expected: '`true`・`true`・`false`・`false`・`false`'
    status: planned
lead: 'バージョンの書式と比較を受け持ち、バージョンを上げるときのバージョンの扱いを変えるときに参照する。'
tags:
  - name: topic:バージョン
    main: true
  - name: topic:移行
  - name: topic:cli
