id: MOD-472-235
visibility: internal
title: ライブラリ本体 / 操作 / trees.ts
test_files:
  - tests/unit/src/interact/trees.browser.test.ts
functions:
  - name: attachFileTrees
    title: ファイルツリーに開閉とコピーを付ける
    container: src/interact/trees.ts
    summary: '各 `div.mdmark-tree` の `ul` の前に `renderTreeBar` の帯を配置し、子を持つフォルダの名前を `aria-expanded`・`aria-controls` を持つ `mdmark-tree-toggle` のボタンで包む。`data-open` とルートを 0 とした深さを `folderOpenByDefault` に指定し、開かないフォルダの入れ子の `ul` を `hidden="until-found"` にする。注釈を持つツリーは、最も右で終わる名前の端を測って `--mdmark-tree-note-start` に入れる。ボタンを押すとそのフォルダを開閉し、Shift を押しながらなら入れ子のフォルダも同じ状態にする。ページ内検索が閉じた `ul` を開いたとき（`beforematch`）はそのフォルダを開いた状態にする。コピーボタンは `copyText` で `data-source` を記載し、書き込めたら `data-state="copied"` と `role="status"` の通知にして 2 秒で `idle` に戻し、書き込めなければツリーの下に `renderCopyPanel`（`format: tree`）のパネルを配置して文字を選んだ状態にする（閉じるボタンでパネルを取り除き、コピーボタンへフォーカスを戻す）'
    kind: 関数
    scope: internal
    side_effects: ツリーに帯・ボタン・パネルを配置し、クリップボードへ書き込む
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: 帯・ボタン・パネル・タイマーを取り除き、入れ子の `ul` の `hidden` を削除して `render` の出した状態に戻す関数
    unit_tests:
      - name: test_attach_file_trees
        case: 正常
        summary: 帯と開閉のボタンを配置し、指定が無ければ全てのフォルダを開く
        condition: '`mdmark/` の下に `src/`（子 `index.ts`、注釈 `ソース`）と `package.json` を描いた `data-open` の無いツリーに付ける'
        mock: なし
        expected: '`mdmark-tree-bar` があり、`mdmark/` と `src/` の `mdmark-tree-toggle` が `aria-expanded="true"` で、入れ子の `ul` が `hidden` を持たない。`package.json` はボタンを持たない。`div.mdmark-tree` が `--mdmark-tree-note-start` を持つ'
      - name: test_attach_file_trees_when_open
        case: 正常
        summary: data-open の階層まで開く
        condition: '`app/`・`src/`・`parts/`・`tree.ts` の入れ子を描いた `data-open="2"` と `data-open="all"` のツリーに付ける'
        mock: なし
        expected: 1 つ目は `app/`・`src/` が `aria-expanded="true"`、`parts/` が `aria-expanded="false"`。2 つ目は全て `aria-expanded="true"` で、`hidden` の `ul` が無い
      - name: test_attach_file_trees_when_toggled
        case: 正常
        summary: 押すとそのフォルダだけを、Shift を押しながらなら入れ子も開閉する
        condition: '`data-open="all"` の `app/`・`src/`・`parts/` のツリーで、`src/` を押し、次に `app/` を Shift を押しながら 2 回押す'
        mock: なし
        expected: 1 回目の後は `src/` だけが `aria-expanded="false"` で `parts/` は `true` のまま。2 回目の後は 3 つとも `false`、3 回目の後は 3 つとも `true` で入れ子の `ul` が `hidden` を持たない
      - name: test_attach_file_trees_when_found
        case: 正常
        summary: ページ内検索で開いたフォルダを開いた状態にする
        condition: 閉じた `src/` の入れ子の `ul` に `beforematch` を送信する
        mock: なし
        expected: '`src/` のボタンが `aria-expanded="true"` で、入れ子の `ul` が `hidden` を持たない'
      - name: test_attach_file_trees_when_copied
        case: 正常
        summary: 押すと元の罫線のテキストをコピーして 2 秒でボタンを戻す
        condition: '`data-source="src/\n└── index.ts"` のツリーのコピーボタンを押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: '`src/\n└── index.ts` で 1 回呼ばれ、ボタンが `data-state="copied"` で `コピーしました` を持ち、`mdmark-tree-status` が `コピーしました`。2 秒進めると `idle`'
      - name: test_attach_file_trees_when_copy_denied
        case: 正常
        summary: 書き込めなければツリーの下にパネルを出し、閉じると取り除く
        condition: コピーボタンを押し、次にパネルの閉じるボタンを押す
        mock: '`navigator.clipboard.writeText` を `NotAllowedError` で拒む関数に差し替える'
        expected: 1 回目の後は `mdmark-tree-list` の後ろに `mdmark-copy-panel` があり、`textarea` の中身が `data-source` で全て選ばれている。閉じた後はパネルが無く、コピーボタンにフォーカスがある。`unhandledrejection` が起きない
      - name: test_attach_file_trees_when_detached
        case: 正常
        summary: 削除すると render の出した状態に戻す
        condition: 閉じたフォルダを持つツリーでコピーボタンを押してすぐ削除し、2 秒進める
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: '`mdmark-tree-bar`・`mdmark-tree-toggle` が無く、入れ子の `ul` が `hidden` を持たず、例外が出ない'
    callees:
      - 'MOD-472-232#functions[copyText]'
      - MOD-472-269#functions[folderOpenByDefault]
      - MOD-472-269#functions[renderTreeBar]
      - MOD-472-315#functions[renderCopyPanel]
      - '#functions[setFolderOpen]'
      - MOD-472-269#functions[renderTreeCopyContent]
    status: planned
    introduced:
      pr: 225
  - name: setFolderOpen
    title: フォルダを開閉する
    container: src/interact/trees.ts
    summary: '`mdmark-tree-toggle` の `aria-expanded` を書き換え、開くときはそのフォルダの入れ子の `ul` の `hidden` を削除し、閉じるときは `hidden="until-found"` にする。`attachFileTrees` と印刷の前後の `attachPrint` が使用する'
    kind: 関数
    scope: internal
    side_effects: ボタンの `aria-expanded` と入れ子の `ul` の `hidden` を書き換える
    args:
      - name: toggle
        type: Element
        required: true
        description: フォルダの `mdmark-tree-toggle` のボタン
      - name: open
        type: boolean
        required: true
        description: 開くか
    returns:
      type: void
      description: なし
    status: planned
    introduced:
      pr: 225
  - name: alignFileTreeNotes
    title: ファイルツリーの注釈の列を統一する
    container: src/interact/trees.ts
    summary: '`render` が出した `div.mdmark-tree` の注釈の列の位置を測り、`--mdmark-tree-note-start` に入れる。`attachFileTrees` と同じ測り方で、Storybook の `preview.js` がファイルツリーのストーリーに使用する（`/render/trees.js`）'
    kind: 関数
    scope: internal
    side_effects: ツリーの要素のスタイルに CSS 変数を記載する
    args:
      - name: tree
        type: HTMLElement
        required: true
        description: '`div.mdmark-tree` の要素'
    returns:
      type: void
      description: なし
    status: planned
    introduced:
      pr: 225
