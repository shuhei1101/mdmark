id: MOD-472-94
visibility: internal
title: VS Code 拡張機能 / プレビュー / assets.ts
test_files:
  - tests/unit/vscode/src/preview/assets.test.ts
functions:
  - name: assetCandidates
    title: 探す場所の候補を返却する
    kind: 関数
    container: vscode/src/preview/assets.ts
    usecase: プレビューのリンクと画像を開く
    summary: 記載したパスからクエリとフラグメントを削除し、Markdown のフォルダ、`assetsRoot` があればその後に `assetsRoot` を基準にした絶対パスを返却する。解決したパスがワークスペースのフォルダのどれの配下にも無い候補は除く。削除したクエリとフラグメントも返却する
    scope: public
    args:
      - name: path
        type: string
        required: true
        description: 記載したパス
      - name: options
        type: '{ docDir: string; assetsRoot?: string; workspaceDirs: string[] }'
        required: true
        description: Markdown のフォルダ・`assets.root` の絶対パス・ワークスペースのフォルダ
    returns:
      type: '{ files: string[]; suffix: string }'
      description: 探す順の絶対パスと、URL の後ろに戻すクエリとフラグメント
    refs:
      - IF-472-22#constraints[動画・音声とアセットのルートの解決]
    unit_tests:
      - name: test_asset_candidates
        case: 正常
        summary: Markdown のフォルダ、次にアセットのルートを返却する
        condition: '`m/demo.mp4?v=1#t=3`、`docDir` が `/w/docs`、`assetsRoot` が `/w/assets`、`workspaceDirs` が `["/w"]`'
        mock: なし
        expected: '`files` が `["/w/docs/m/demo.mp4", "/w/assets/m/demo.mp4"]`、`suffix` が `?v=1#t=3`'
      - name: test_asset_candidates_when_outside
        case: 正常
        summary: ワークスペースの外へ出る候補を除く
        condition: '`../../etc/passwd`、`docDir` が `/w/docs`、`workspaceDirs` が `["/w"]`'
        mock: なし
        expected: '`files` が空'
    status: planned
    introduced:
      pr: 263
