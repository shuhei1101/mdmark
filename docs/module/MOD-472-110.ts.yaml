id: MOD-472-110
visibility: internal
title: ライブラリ本体 / CLI / check.ts
test_files:
  - tests/unit/src/cli/check.test.ts
data_models:
  - name: CheckIssue
    title: 点検のずれ
    container: src/cli/check.ts
    usecase: 設定と索引を点検する
    summary: '`mdmark check` が出すずれ 1 件'
    properties:
      - name: file
        type: string
        description: ずれのあるファイル（設定ファイルのフォルダからの相対パス。文字列を点検したときは `-`、設定ファイルが無いときは今のフォルダからの相対パス）
      - name: where
        type: string
        description: キーのパスか行。ファイル全体は空文字
      - name: kind
        type: "'schema' | 'unknown_color_theme' | 'unknown_color_scheme' | 'no_documents' | MdmarkIndexIssue['kind'] | 'alias_no_files' | 'alias_unreadable' | MdmarkAliasProblem['kind'] | 'missing_file' | 'unknown_mark' | 'diagram_invalid' | 'diagram_node_overlap' | 'diagram_node_overflow' | 'diagram_wire_crosses_node' | 'diagram_label_too_long' | 'syntax_warning' | 'unknown_mark_arg' | 'legacy_mark' | 'mark_option_unapplied' | 'mark_option_invalid' | 'map_invalid' | 'map_unknown_ref' | 'map_unknown_key' | 'map_invalid_value' | 'map_unknown_icon' | 'map_unknown_class' | 'map_unknown_line' | 'plain_md_with_marks'"
        description: ずれの種類
      - name: message
        type: string
        description: 内容と修正方法の 1 文
functions:
  - name: runCheck
    title: 設定と索引を点検する
    container: src/cli/check.ts
    usecase: 設定と索引を点検する
    summary: '設定の構造・設定が指すファイル・`build` の対象・`checkIndex` のずれと文書の本文の知らないマーカーを集め、`{ファイル}:{場所}: {種類}: {内容}` の行と `ずれ {件数} 件` を出す'
    description: '`text` か `file` を指定したときは、引数の組（`text` と `file`・`base` を一緒に指定できない、`file` と `key` は一緒に指定する、`file` と `base` を一緒に指定できない）を確認し、`checkMarkdownSource` のずれを同じ行の構造で出す（設定と索引は点検しない）。それ以外は設定ファイルを `findConfigFile` で探し、`collectCheckIssues`（`base` を指定する）のずれを 1 件 1 行で出す'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ config?: string; base?: string; text?: string; file?: string; key?: string }'
        required: true
        description: '`--config`・`--base`・`--text`（`-` のときは読み込んだ標準入力）・`--file`・`--key` の値'
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
    returns:
      type: Promise<0 | 1>
      description: ずれが 0 件なら 0、あれば 1
    exceptions:
      - name: CliError
        condition: 引数の組が誤り・設定ファイルが無い（`text`・`file` で `config` を指定しないときを除く）・`checkMarkdownSource` が投げた・YAML として読み込めない・`--base` を指定し、比べる基準を参照できない
        message: '`findConfigFile`・`loadConfig`・`changedPathsSince` のメッセージ'
    unit_tests:
      - name: test_run_check
        case: 正常
        summary: ずれの無いフォルダで 0 件
        condition: 索引に 2 つの文書を記載し、`build.include` が 2 つに該当する
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: 0 を返却し、標準出力が `ずれ 0 件` の 1 行
      - name: test_run_check_when_drift
        case: 正常
        summary: 設定の schema と索引の missing_doc をこの順に出す
        condition: '`build.out` が無く、索引の `old.md` が無い'
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: '1 を返却し、`mdmark.config.yaml:build: schema:` の行、`missing_doc` の行、`ずれ 2 件` の順に出る'
      - name: test_run_check_when_no_documents
        case: 正常
        summary: build の対象が 0 件なら no_documents
        condition: '`build.include` がどのファイルにも該当しない'
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: '1 を返却し、`mdmark.config.yaml:build.include: no_documents:` の行がある'
      - name: test_run_check_when_entry_outside
        case: 正常
        summary: まとめる文書に該当しない build.entry を schema のずれにする
        condition: '`build.entry: missing.md`'
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: '1 を返却し、`mdmark.config.yaml:build.entry: schema:` の行がある'
      - name: test_run_check_when_unknown_mark
        case: 正常
        summary: 知らないマーカーを文書と行を指す unknown_mark の行にする
        condition: 索引に記載した文書 `a.md` の 3 行目に `<!-- tabz -->`、`markdown` のコードブロックの中にも `<!-- tabz -->`
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: '1 を返却し、`a.md:3: unknown_mark:` で始まる行が 1 つだけで、`ずれ 1 件`'
      - name: test_run_check_when_base_given
        case: 正常
        summary: '`--base` から片方だけが変わった change_together の組を出す'
        condition: '索引の `a`（`a.md`）と `b`（`b.md`）が互いを `change_together` で記載したフォルダをコミットしてタグ `base` を付け、`a.md` だけを書き換えてコミットする。`{ base: "base" }` と `{}` の 2 回'
        mock: 一時フォルダの git のリポジトリ、出力を配列に貯める `CliIo`
        expected: '1 回目は 1 を返却し、`b.md: missed_change_together:` で始まる行と `ずれ 1 件` を出す。2 回目は 0 を返却し、`ずれ 0 件`'
      - name: test_run_check_when_base_unknown
        case: 異常
        summary: 参照できない `--base` はずれを点検せずに止める
        condition: '`test_run_check_when_base_given` と同じリポジトリ、`{ base: "no-such-ref" }`'
        mock: 一時フォルダの git のリポジトリ、出力を配列に貯める `CliIo`
        expected: '`CliError` を投げ、メッセージに `no-such-ref` が入り、標準出力に `ずれ` の行が無い'
        exception: 比べる基準を参照できない
      - name: test_run_check_when_text
        case: 正常
        summary: 文字列の記載の警告を - の行にして出す
        condition: '`mdmark init` の後のフォルダで、インターフェース定義『設定と索引を点検する』の「正常系（文字列に記載の警告がある）」の文字列を `{ text }` で指定する'
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: '1 を返却し、`-:1: diagram_invalid:`・`-:20: unknown_mark:`・`-:22: syntax_warning:` の行と `ずれ 3 件` を出す'
      - name: test_run_check_when_arguments_conflict
        case: 異常
        summary: 一緒に指定できない引数を点検せずに止める
        condition: '`{ text: "a", base: "main" }` と `{ file: "records.yaml" }`'
        mock: 一時フォルダ、出力を配列に貯める `CliIo`
        expected: どちらも `CliError` で、1 つ目の文に `--text` と `--base`、2 つ目の文に `--key` がある
    callees:
      - 'MOD-472-109#functions[requireConfig]'
      - 'MOD-472-117#functions[collectBuildDocuments]'
      - 'MOD-472-117#functions[readIndexWithDocuments]'
      - MOD-472-256#functions[checkIndex]
    refs:
      - IF-472-39#
      - 'MOD-472-122#functions[changedPathsSince]'
    status: planned
    introduced:
      pr: 32
  - name: collectCheckIssues
    title: 点検のずれを集める
    container: src/cli/check.ts
    usecase: 共通
    summary: '設定を重ねて読み込み（`purpose: export`）、重ねた設定ファイルのそれぞれと端末の設定（`config.applyToExport` によらず）の構造のずれを先に、続けて `mdmark check` と同じ並びのずれを返却する。ずれの `file` は設定ファイルのパスを表示の構造にしたパス（`base` は今のフォルダ）'
    description: '並びは設定の `schema`（`validateConfig` のずれ、`theme`・`extensions` の無いファイル、`build.glossary`・`build.entry` がまとめる文書に該当しないもの）→ `unknown_color_theme`（設定の `colorTheme` が `COLOR_THEMES` に無いとき 1 件。`where` は `colorTheme`、`message` は `不明なテーマ名 {名前} です。{COLOR_THEMES を「・」で結んだもの} のいずれかに修正してください。`）→ `unknown_color_scheme`（設定の `colorScheme` が `COLOR_SCHEMES` に無いとき 1 件。`where` は `colorScheme`、`message` は `不明な明暗 {値} です。{COLOR_SCHEMES を「・」で結んだもの} のいずれかに修正してください。`）→ `no_documents` → `checkIndex` の並び → エイリアスのずれ（`loadAliases` の `issues`。設定に `aliases` があるときだけ）→ `missing_file`（`collectCheckDocuments` の文書ごとの `checkMissingFiles`）→ `unknown_mark`（`checkUnknownMarks`）→ マーカーの設定のずれ（`checkMarkOptions`。`unknownMarks` が `false` のときは拡張のマーカーを点検しない）→ 図の点検のずれ（`checkDiagrams`。`unknownMarks` によらず点検する）→ map のずれ（`checkMaps`）→ `plain_md_with_marks`（`checkPlainMarkdown`。`unknownMarks` が `false` のときと、設定の `check.suggestMarkExtension` が `false` のときは点検しない）。設定の `map` の値のうち `schemas/mdmark.config.schema.json` の記載できる値に無いもの（`node_fit`・`url_state`・`kinds` の `shape`・`lines` の `dash`・`width`・`head`）は、`where` が値のキー（`map.kinds.store.shape` など）で、記載できる値を「・」で結んで並べた `schema` のずれにし、`map_unknown_icon`（`checkMapConfig`）と合わせて設定の `schema` の並びの後ろに配置する。知らないマーカーの点検では、`collectCheckDocuments` の文書を、`loadExtensionDirectives` の `directive` を知っているマーカーに入れて点検し、`loadExtensionDirectives` の `schema` のずれは設定の `schema` の並びの最後に配置する。索引のずれの `file` は設定ファイルのフォルダからの相対パスに修正する。索引を読み込めないときは索引を指す `schema` のずれにする。`base` があり設定に `index` があるときだけ、ずれを集める前に `changedPathsSince`（`cwd` は設定ファイルのフォルダ、`indexDir` は索引のファイルのフォルダ）で変わったファイルを引き、`checkIndex` の `changedPaths` に指定する。`runCheck` と `runUpgrade` が呼び、`runUpgrade` は `unknownMarks: false` で呼ぶ（拡張を読み込まず、知らないマーカーを点検しない）。設定の `assets.root` のフォルダが無いときは `assets.root` を指す `schema` のずれを設定の `schema` の並びに配置し、`missing_file` は文書のフォルダだけで探す'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: path
        type: string
        required: true
        description: 設定ファイルの絶対パス
      - name: options
        type: '{ unknownMarks?: boolean; base?: string; cwd?: string; explicit?: boolean }'
        required: false
        default: '`{ unknownMarks: true }`'
        description: '`unknownMarks` が `false` なら、拡張を読み込まず、知らないマーカーを点検しない。`base` があれば、`change_together` の修正漏れを確認する。`cwd` はずれの `file` の表示の基準（既定は `path` のフォルダ）。`explicit` が `true` のときは上へ探さず、`path` と端末の設定だけを重ねる（`--config`・MCP の `config` を指定したとき）'
    returns:
      type: Promise<CheckIssue[]>
      description: ずれの並び（無ければ空）
    exceptions:
      - name: CliError
        condition: 設定ファイルを YAML として読み込めない・`base` を指定し、比べる基準を参照できない
        message: '`loadConfig`・`changedPathsSince` のメッセージ'
    unit_tests:
      - name: test_collect_check_issues
        case: 正常
        summary: 設定の schema と索引の missing_doc をこの順に返却する
        condition: '`build.out` が無く、索引の `old.md` が無い'
        mock: 一時フォルダ
        expected: 2 件で、`kind` が `schema`・`missing_doc` の順
      - name: test_collect_check_issues_when_unknown_mark
        case: 正常
        summary: 知らないマーカーを checkIndex のずれの後ろに返却する
        condition: 索引の `old.md` が無く、文書 `a.md` の 3 行目に `<!-- tabz -->`
        mock: 一時フォルダ
        expected: '`kind` が `missing_doc`・`unknown_mark` の順で、`unknown_mark` の `file` が `a.md`・`where` が `3`'
      - name: test_collect_check_issues_when_plain_md_has_marks
        case: 正常
        summary: 記法を含む純粋な .md の提案を map のずれの後ろに配置し、設定と unknownMarks で止める
        condition: '文書 `a.md` の 5 行目に `<!-- table: {"kind": "data"} -->` と 7 行目に `<!-- tabz -->`、`b.mark.md` に同じ表のマーカー。`check.suggestMarkExtension` が無いとき・`false` のとき・`{ unknownMarks: false }` のとき'
        mock: 一時フォルダ
        expected: '無いときは `kind` が `unknown_mark`（`a.md`・`7`）・`plain_md_with_marks`（`a.md`・`5`）の順で `b.mark.md` を指すずれが無い。`false` のときと `unknownMarks: false` のときは `plain_md_with_marks` が無い'
      - name: test_collect_check_issues_when_unknown_marks_off
        case: 正常
        summary: '`unknownMarks: false` では知らないマーカーを返却せず、拡張を読み込まない'
        condition: '文書 `a.md` に `<!-- tabz -->`、設定の `extensions` に読み込めない拡張 `broken.js`、`{ unknownMarks: false }`'
        mock: 一時フォルダ
        expected: '`unknown_mark` のずれも `extensions[0]` の `schema` のずれも無い'
      - name: test_collect_check_issues_when_base_without_index
        case: 正常
        summary: 設定に `index` が無ければ `base` を使用しない
        condition: '`index` の無い設定を持ち git のリポジトリでない一時フォルダ、`{ base: "no-such-ref" }`'
        mock: 一時フォルダ
        expected: 例外を投げず、`base` を指定しないときと同じずれを返却する
      - name: test_collect_check_issues_when_alias_drift
        case: 正常
        summary: エイリアスのずれを checkIndex の後・unknown_mark の前に配置する
        condition: インターフェース定義『設定と索引を点検する』の「正常系（エイリアスにずれがある）」のフォルダに、知らないマーカーのある文書を加える
        mock: 一時フォルダ
        expected: ずれの並びが `alias_no_files`（`missing/*.yaml`）→ `alias_required_empty`（`description`）→ `unknown_mark` で、`env` のレコードを指すずれが無い
      - name: test_collect_check_issues_when_unknown_color_theme
        case: 正常
        summary: 知らないテーマの名前を schema の後・no_documents の前に返却する
        condition: '`colorTheme: sepia` と、無いファイルを指す `extensions`、`build.out` と該当する文書の無い `build.include` を持つ `build` を持つ設定。別に `colorTheme: theme-slate` の設定'
        mock: 一時フォルダ
        expected: 前者の `kind` が `schema`・`unknown_color_theme`・`no_documents` の順で、`unknown_color_theme` の `where` が `colorTheme`、`message` に `sepia` と 4 つの名前を含む。後者は `unknown_color_theme` が無い
      - name: test_collect_check_issues_when_unknown_color_scheme
        case: 正常
        summary: 知らない明暗の値を unknown_color_theme の後・no_documents の前に返却する
        condition: '`colorTheme: sepia` と `colorScheme: sepia` を持つ設定。別に `colorScheme: dark` の設定'
        mock: 一時フォルダ
        expected: 前者の `kind` が `unknown_color_theme`・`unknown_color_scheme` の順で、`unknown_color_scheme` の `where` が `colorScheme`、`message` に `sepia` と `light`・`dark`・`auto` を含む。後者は `unknown_color_scheme` が無い
      - name: test_collect_check_issues_when_missing_file
        case: 正常
        summary: 見つからないファイルを unknown_mark の前に返却し、無い assets.root を schema にする
        condition: '`assets.root: none` の設定、文書 `a.md` の 2 行目に `![図](x.png)` と 4 行目に `<!-- tabz -->`'
        mock: 一時フォルダ
        expected: '`kind` が `schema`（`where` が `assets.root`）・`missing_file`（`where` が `2`）・`unknown_mark` の順'
      - name: test_collect_check_issues_when_diagram
        case: 正常
        summary: 図の点検のずれを最後に返却し、upgrade の呼び方でも点検する
        condition: 索引の無い設定で、`docs/a.md` の 3 行目に読み込めない `<!-- flow -->` の定義と、見つからない画像。`unknownMarks` が `true` と `false`
        mock: なし
        expected: 'どちらも `missing_file` の後に `{ file: "docs/a.md", where: "3", kind: "diagram_invalid" }` の 1 件がある'
    refs:
      - 'MOD-472-116#functions[validateConfig]'
      - MOD-472-256#functions[checkIndex]
      - '#functions[checkUnknownMarks]'
      - '#functions[checkMarkOptions]'
      - '#functions[checkPlainMarkdown]'
      - 'MOD-472-122#functions[changedPathsSince]'
    status: planned
    introduced:
      pr: 39
    callees:
      - 'MOD-472-113#functions[checkMissingFiles]'
      - '#functions[checkDiagrams]'
    process: |-
      1. 設定を重ねて読み込む（設定を重ねて読み込む。`purpose: export`、`keepInvalid: true`、`explicit` のときは `explicit` に `path`、それ以外は `cwd` に `path` のフォルダ）
         - `unreadable` がある場合、そのファイルのパス（設定ファイルのパスを表示の構造にする）と行で「YAML として読み込めません」の `CliError` を投げる
      2. `issues` の `file` を表示の構造にして、設定の構造のずれにする
      3. 重ねた設定のパスを `path` のフォルダからの相対パスに戻し（パスを相対パスに戻す）、`{ path, dir: path のフォルダ, config }` で、設定が指すファイル以降のずれを `description` の並びで集めて、構造のずれの後ろに続けて返却する
  - name: loadExtensionDirectives
    title: 拡張のマーカーの名前を読み込む
    container: src/cli/check.ts
    usecase: 設定と索引を点検する
    summary: 設定の `extensions` の拡張を `bundleModule` でまとめて Node で読み込み、既定の書き出しの `directive` を集める
    description: '`extensions` の位置の順に、ファイルが在る拡張だけをまとめる（無いファイルは `checkReferencedFiles` のずれだけにする）。まとめたコードは `importCode` で読み込む。まとめられない・読み込めない・既定の書き出しの `directive` がマーカーの名前（`MARK_NAME_PATTERN`）の文字列でない拡張は、`extensions[{位置}]` を指す `schema` のずれにし、`directive` に入れない。読み込めないときの内容は、元のエラーの 1 行目と、読み込みの時点でブラウザの API を使用する処理を `load` の中へ移す修正方法'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 拡張のモジュールを Node で読み込む（モジュールの最上位の処理が動く）
    args:
      - name: loaded
        type: LoadedConfig
        required: true
        description: 構造を検めた設定
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
      - name: importCode
        type: '(code: string) => Promise<unknown>'
        required: false
        default: コードを `data:text/javascript;base64,` の URL にして `import()` する
        passing: injected
        description: まとめたコードを読み込み、モジュールの名前空間を返却する関数（テストで差し替える）
    returns:
      type: 'Promise<{ directives: Set<string>; issues: CheckIssue[] }>'
      description: 読み込めた拡張の `directive` と、読み込めなかった拡張の `schema` のずれ
    unit_tests:
      - name: test_load_extension_directives
        case: 正常
        summary: 拡張の既定の書き出しの directive を集める
        condition: 設定の `extensions` に `mdmark init` の雛形の `extensions/example.js`
        mock: 一時フォルダ
        expected: '`directives` が `{"greet"}` で、`issues` が空'
      - name: test_load_extension_directives_when_browser_api
        case: 異常
        summary: 読み込みの時点でブラウザの API を使用する拡張を schema のずれにする
        condition: 最上位で `class extends HTMLElement` を定義する `extensions/broken.js`（`directive` は `broken`）
        mock: 一時フォルダ
