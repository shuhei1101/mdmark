id: MOD-472-170
visibility: internal
title: ライブラリ本体 / 公開の入口 / index.css
styles:
  - name: index
    title: 入口の CSS
    container: src/index.css
    summary: 描いた文書の CSS。全ての規則を `@layer mdmark` に入れ、外観の値を `--mdmark-` の CSS 変数で配る。バージョンの CSS 変数 `--mdmark-version` はビルドが先頭に `:root` の宣言として差し込む
    description: |-
      採用したモックの規則を写す。本文の規則は `docs/mock/refs/16/assets/sample.css` の `@layer mdmark` の中身、変数の値は `docs/mock/assets/style.css`、横スクロールの影は同じフォルダの `style.css`、印刷は `print.css` から取る。記法の規則は `docs/mock/refs/19/assets/syntax.css` と `syntax-print.css`（印刷）から取り、エイリアスのツールチップの規則は `docs/mock/refs/176/assets/alias-tip.css` の `@layer mdmark` の中身から取り、アイコンは `mask-image` の SVG の data URL で付ける。モック専用の規則（`.mock-*`・`.host*`・`.catalog*`・`body`・`--host-*`）は写さない。

      ダークの配色は、モックの `:root[data-scheme="dark"]` を `@media screen and (prefers-color-scheme: dark)` の `:root` に置き換えて持つ（印刷では明るい配色のまま）。描く先の祖先の class で決める配色も `:root` に値を配置し、利用側が層の外で `:root` に記載した上書きと `document.body` の直下の部品にも同じ配色が届くようにする。選んだテーマの配色も、描く先の属性 `data-mdmark-color-theme` を `:root:has()` で確認して `:root` に配置する。入れ子の規則はソースに記載したまま配置し、ビルドが対象のブラウザに合わせて展開する。
    values:
      - class_name: :root
        target: 変数の既定
        value: '`--mdmark-font-body`・`--mdmark-font-heading`・`--mdmark-font-mono`・`--mdmark-font-size`（`0.875rem`）・`--mdmark-line-height`（`1.8`）・`--mdmark-content-width`（`none`。行の長さを抑えたい利用側が上限を指定する）・`--mdmark-space`（`0.875rem`）・`--mdmark-padding`（`1.5rem`）・`--mdmark-radius`（`4px`）・`--mdmark-heading-weight`・`--mdmark-heading-rule-width`（`1px`）・`--mdmark-table-rule-inline`・`--mdmark-h1-marker`・`--mdmark-h2-marker`・`--mdmark-h3-marker`（見出しの前の記号。既定は持たず、規則の側で空の文字列に落とす）と、`--mdmark-color-`（`bg`・`text`・`heading`・`muted`・`link`・`border`・`surface`・`scroll-shadow`・`notice-bg`・`notice-border`・`notice-text`）・`--mdmark-color-bg-opaque`（`var(--mdmark-color-bg)`。配色の規則は配置せず、`:root` の `--mdmark-color-bg` に追従させる）・`--mdmark-color-border-muted`（`color-mix(in oklab, var(--mdmark-color-border) 70%, var(--mdmark-color-bg))`。見出し 1・見出し 2 の下の線の色。配色の規則は配置せず、`.mdmark` で宣言して各テーマのライト・ダークの枠線の色と地の色に追従させる）。値は `docs/mock/assets/style.css` の `:root`（`--mdmark-content-width` だけはモック作成で決めた `none`）'
      - class_name: :root
        target: ダークの配色（画面で OS の設定がダークのとき）
        value: '`--mdmark-color-` の 11 個をダークの値にし、`color-scheme: dark`。値は `docs/mock/assets/style.css` の `:root[data-scheme="dark"]`'
      - class_name: .mdmark
        target: 描く先の要素
        value: '地の色 `--mdmark-color-bg`・`--mdmark-color-bg-opaque: var(--mdmark-color-bg)` と `--mdmark-color-border-muted: color-mix(in oklab, var(--mdmark-color-border) 70%, var(--mdmark-color-bg))` の宣言（`.mdmark` で上書きした `--mdmark-color-bg`・`--mdmark-color-border` を受ける）・内側の余白 `--mdmark-padding`・角丸 `--mdmark-radius`。枠と影は付けない。行の長さ・書体・行間・ブロックの間隔と、中の見出し・段落・リスト・引用・表・コード・リンク・折り畳み・区切り線・画像・タスクリストの規則。見出し 1・見出し 2 は下に `--mdmark-heading-rule-width` の `--mdmark-color-border-muted` の線を描き、文字と線の間を `0.3em` にする（見出し 3 以降は線を描かない）。区切り線は `0.25em` の `--mdmark-color-border` の線にする（`docs/mock/refs/320/assets/proposal.css`）'
      - class_name: .mdmark :is(pre, table)
        target: 横スクロールする表とコードブロック
        value: コードブロックは、続きがある側の端に影を出す背景の重ね合わせ（中身と動く面の `local` を `--mdmark-color-surface` で塗り、端に留まる影の `scroll`）。表は影を出さず、地を `--mdmark-color-bg-opaque` で塗り、ピン止めした本文のセルも同じ地にする（見出し行のセルは面の色）。値は `docs/mock/refs/283/assets/table.css`（モックの `--mdmark-color-bg` は `--mdmark-color-bg-opaque` として解釈する）
      - class_name: .mdmark :is(th, td).mdmark-align-{left,center,right}
        target: 表の列の配置
        value: '`text-align: left` / `center` / `right`。`center` の見出しのセルは `.mdmark-th` も中央に配置する'
      - class_name: .mdmark .mdmark-table :is(th, td).mdmark-wide と .mdmark-check
        target: 広く取る列と真偽値の ✓
        value: '`mdmark-wide` は `white-space: nowrap`。`mdmark-check` は `inline-flex` で、中の `.mdmark-icon` を `1.1em` 角・塗り無し・`currentcolor` の太さ 3 の線にする。値は `docs/mock/refs/283/assets/table.css`'
      - class_name: .mdmark .mdmark-diagram-box[data-touch-active]
        target: 指で図を動かす操作中の図の枠
        value: '枠線（表示するノードの `box-shadow` の内側の線）をリンクの色の 2px にする（`inset 0 0 0 2px var(--mdmark-color-link)`）。中の `.mdmark-diagram-viewport` の `touch-action` を `pan-y` から `none` にする。値は `docs/mock/refs/508/assets/touch.css`'
      - class_name: .mdmark .mdmark-embed:not([data-mdmark-drawn])
        target: 読み込み中のブロック
        value: '`min-height: 12rem`・`--mdmark-color-border` の破線・角丸 `--mdmark-radius`・文字を中央に `--mdmark-color-muted` で配置する'
      - class_name: .mdmark .mdmark-notice
        target: 通知ブロック
        value: 地 `--mdmark-color-notice-bg`・1px の線（4 辺）`--mdmark-color-notice-border`・文字 `--mdmark-color-notice-text`・角丸 `--mdmark-radius`。タイトル（`.mdmark-notice-title`）は太字のブロック、`code` は折り返す
      - class_name: '@media print .mdmark'
        target: 印刷のとき
        value: '地と余白を削除して紙の幅いっぱいにする。`a[href^="http"]::after` で URL を併記する。表・コードブロック・図・読み込み中のブロック・通知ブロックを改ページで切らない。図の表示する枠は `attachDiagrams` が適用したインラインの高さと上限を `height: auto !important; max-height: none !important` で削除し、図の全体の高さで出す。表とコードブロックの横スクロールと影をやめて紙の幅に収め、長い行を折り返す。`h1`〜`h3` の直後で改ページしない'
      - class_name: '@media print and (max-width: 40rem) .mdmark'
        target: 狭い紙幅で印刷するとき
        value: 表を行ごとに縦に並べ、見出し行を隠し、`td::before` に `attr(data-label)` で列名を出す。セルの統一は列の配置の class より強い指定で `start` に戻す
      - class_name: :root（記法）
        target: 記法の変数の既定
        value: '`--mdmark-color-table-head`・`--mdmark-color-callout-note`・`-tip`・`-important`・`-warning`・`-caution`・`--mdmark-sticky-top`（`0px`。見出し行を留める画面の上端からのずれ）・`--mdmark-color-code-highlight-bg`（`#fef3c7`、ダーク `#5c4a12`）・`--mdmark-color-code-highlight-line`（`#b45309`、ダーク `#fbbf24`）・ファイルの種類のアイコンの色 `--mdmark-color-file-text`・`-code`・`-config`・`-image`・`-sheet`・`-archive`・`-script`（値とダークの値は `docs/mock/refs/225/assets/tree.css`）。値とダークの値は `docs/mock/assets/style.css`'
      - class_name: .mdmark .mdmark-table ほか記法の class
        target: 記法の部品
        value: '部品設計（表・注意書き・タブ・ステップ・ファイルツリー・バッジ・目次・セクション・行の詳細・図表の番号・記載の警告・コードブロック）の HTML に適用する規則。表は縦の高さの上限を持たず（横にはみ出す表は表の中で横にスクロールする）、見出し行と集計の行はページのスクロールで留める。留め方は `root` の `data-mdmark-sticky` で分け、`timeline` は `@supports (animation-timeline: view()) and (animation-range: 0% 100%)` の中で `view-timeline`（inset は `var(--mdmark-sticky-top, 0px) 0px`）と `--mdmark-sticky-head-start`・`-head-max`・`-foot-max`・`-foot-end` の `animation-range` で動かし、`script` は `--mdmark-sticky-head-shift`・`-foot-shift` の `transform: translateY()` で動かす。集計の行は計算ごとの行を面の色でつなぎ、`max-width: 768px` ではセルの上下の余白を `0.2em` に詰める。集計とコピーの形式のメニュー・コピーできないときのパネル・行の URL の通知もここで適用する。値は `docs/mock/refs/151/assets/table.css`（モックの `--mdmark-mock-*` は `--mdmark-sticky-*`、`.is-sticky-timeline`・`.is-sticky-shift` は `[data-mdmark-sticky]` として解釈する）。タイトルを持つコードブロックの入れ物の `figure` を含め、`figure` のブラウザ既定の余白は、描く先の要素の「ブラウザ既定の余白を削除する」規則（`.mdmark :where(h1, h2, h3, p, ul, ol, pre, table, blockquote, details, hr, figure) { margin: 0 }`）で 0 にする。コードブロック（`.mdmark-code`）とファイルツリー（`.mdmark-tree`）の入れ物の規則は上の余白（`margin-block-start`）を指定せず、前のブロックとの間は、入れ物（描く先の要素・セクションの中身・タブの中身・リストの項目・引用・折り畳み・行の詳細）の `> * + *` の規則に任せる（インターフェース定義『文書を描く』の制約「ブロックの間隔」。#326）。コードブロックは全てのブロックに帯（左端に言語のラベル、続けてタイトルかファイル名、右端にコピーのボタン）を配置し、値は `docs/mock/refs/151/assets/code-block.css`。帯（`.mdmark-code-bar`・`.mdmark-code-title`）は本文と同じ `--mdmark-color-surface` の地にし、帯に続く `pre` の上の枠線を削除して帯と `pre` を 1 つの外側の枠線と角丸で囲み、言語のラベル（`.mdmark-code-bar > .mdmark-code-lang`）は帯の上端に接した枠線の無い塗りのタブにする（ライトとダークの配色と印刷で同じ。値は `docs/mock/refs/505/assets/code-block.css`）。開閉のボタン（`.mdmark-code-fold`）は、乗った行（`.mdmark-code-line:hover`）と、`pre[data-fold-hover]`（開閉のボタンの列にポインターが乗っている）のときに全てのボタンを不透明度 1 にする。`plain` は縦の罫線と面を削除する。表は本文の行を地の色にして見出し行だけを面の色で塗り、外側を `calc(var(--mdmark-radius) * 2)` の角丸の 1px の枠で囲む。セルの線は内側だけに引き、見出し行の下・集計の上の線も 1px（`docs/mock/refs/80/assets/table-options.css` の案 A〜C 共通と案 B。`plain` は外側の枠を参照せず見出し行も地の色）。注意書きの面は種類の色を `--mdmark-color-bg` に 7%、線は 40% `color-mix(in oklab, …)` で混ぜる（`docs/mock/refs/80/assets/canvas-themes.css` の `.theme-dev-swiss .markdown-alert`）。表・タブ・ステップの折り畳み（`.mdmark-collapsible` と閉じた表の帯）は `docs/mock/refs/225/assets/collapse.css`、ファイルツリーの帯・注釈の列（`--mdmark-tree-note-start`）・`data-file-icon` ごとのアイコンと色・「ほかにもある」の項目・フォルダの開閉は `docs/mock/refs/225/assets/tree.css` から取る。モックのアイコンの要素（`.mdmark-icon`・`.mdmark-tree-chevron`）は、フォルダは開閉のボタンの `aria-expanded`、ファイルは `data-file-icon` で選ぶ `mask-image` として解釈する。フロントマターの表示（`.mdmark-collapsible.mdmark-frontmatter`）は、折り畳みの規則に加えて見出しの文字を `--mdmark-color-muted` にする（`docs/mock/refs/422/assets/frontmatter.css` の見出しの規則。#422）'
      - class_name: '@media print の記法'
        target: 印刷のときの記法
        value: 表の絞り込み・ピン止め・開閉のボタンとタブの並びを隠し、見出し行・集計の行・列を留めず（`animation` と `transform` を削除する）、セルの余白を詰める。集計とコピーの形式のメニュー・コピーできないときのパネル・行の URL の通知を隠し、`data-auto-width` の表の固定の列の幅（`table-layout` の `fixed` と `--mdmark-auto-width`・`--mdmark-auto-table-width`）を当てない（`docs/mock/refs/151/assets/table-print.css`）。コードブロックのコピーのボタンを隠し、言語のラベルは残す（`docs/mock/refs/151/assets/code-block-print.css`）。飾ったコードブロックはタイトル・行番号・行の地の色と `+`・`-` を出したまま行を折り返し、行番号は折り返した最初の 1 行にだけ出す（`docs/mock/refs/65/assets/code-block-print.css`）。`[data-printing]` のタブは全ての中身をタブ名をタイトルにして縦に並べる。タブ・ステップの折り畳みの見出しの開閉のマーカーを削除する（`docs/mock/refs/225/assets/collapse-print.css`）。ファイルツリーの帯（コピーボタン）・コピーできないときのパネル・開閉のアイコンを隠し、長い名前と注釈を折り返す（`docs/mock/refs/225/assets/tree-print.css`）
      - class_name: .mdmark .mdmark-html と .mdmark-hint-*
        target: 埋め込んだ HTML とヒント
        value: '部品設計（埋め込んだHTML・ヒント）の HTML に適用する規則。`docs/mock/refs/45/assets/embed.css` から取る。`.is-wide` の間だけ横にスクロールし、ブロックのマーカー（`.mdmark-hint-mark`）は要素の右上に `position: absolute` で配置し、アイコンは lucide の `info` を `mask-image` で付ける。行内（`.mdmark-hint-inline`）は破線の下線。ツールチップは図のツールチップと同じ規則。用語・ヒント・図の線のラベルとノードのマーカーに `cursor: help` を付けない。印刷ではマーカーとツールチップを隠し、横のスクロールをやめて紙の幅に収める'
      - class_name: :root（差分）
        target: 差分の変数の既定
        value: '`--mdmark-color-diff-del-bg`（`#fbe6e3`）・`-del-word`（`#eeb4ad`）・`-del-sign`（`#b91c1c`）・`-add-bg`（`#e1ede2`）・`-add-word`（`#a9ccaf`）・`-add-sign`（`#15803d`）、`--mdmark-diff-minimap-width`（`14px`）・`--mdmark-diff-minimap-z-index`（`10`）。ダークの値は `docs/mock/assets/style.css`'
      - class_name: .mdmark-diff-* と body > .mdmark-diff-minimap
        target: 差分の部品
        value: '差分を開くボタン・リビジョンの選択・差分の行・埋め込んだ HTML の差分・差分の状態の文は `.mdmark` の下。ミニマップは `document.body` の直下に配置するため `.mdmark` の外で当て、`position: fixed` と `z-index: var(--mdmark-diff-minimap-z-index)`。`@media print` ではミニマップを隠す。値は `docs/mock/assets/style.css`'
      - class_name: :root（ビューとコメント）
        target: ビューとコメントの変数の既定
        value: '`--mdmark-view-column-width`（`12rem`）・`--mdmark-color-comment-bg`（`#f2effe`、ダーク `#25222d`）・`--mdmark-color-comment-line`（`#6d28d9`、ダーク `#c4a7ff`）・`--mdmark-color-error`（`#b91c1c`、ダーク `#f87171`）。値は `docs/mock/assets/style.css`。コメントのボタン・入力欄・吹き出しは `.mdmark` の外に配置するため、この 4 つは `.mdmark` でなく `:root` に配置する'
      - class_name: .mdmark .mdmark-view-*
        target: ビューの部品
        value: 部品設計（ビュー）の HTML に適用する規則。`docs/mock/refs/55/assets/view.css` から取る。切り替えの選んだボタンは濃い地で塗り、ボードの列は地の枠を持たず見出しの下の線で区切る（確認ログ）。列の最小の幅は `var(--mdmark-view-column-width)` で、収まらない列は `.mdmark-view-board` の中で横にスクロールする。列の見出しのアイコンは部品の HTML が持つ SVG
      - class_name: .mdmark-comment-* と ::highlight(mdmark-comment-pending)
        target: コメントの部品
        value: '部品設計（コメントのボタン・入力欄・マーカー・吹き出し・箇所が見つからないコメントの一覧）の HTML に適用する規則。`docs/mock/refs/55/assets/comment.css` から取る。マーカーと一覧は `.mdmark` の下、ボタン（`.mdmark-comment-add`）・入力欄と吹き出し（`.mdmark-comment-popover`）は `document.body` に配置するため `.mdmark` の外で当て、`position: fixed` にする。保存のボタン（`.is-primary`）は地と線を `--mdmark-color-text`、文字を `--mdmark-color-bg` にする（`docs/mock/refs/80/assets/canvas-themes.css` の `.theme-dev-swiss .mdmark-comment-button.is-primary`）。`::highlight(mdmark-comment-pending)` は入力欄を開いている間の選んだ文字に `--mdmark-color-comment-bg` を適用する'
      - class_name: .mdmark .mdmark-comment-margin と .mdmark-comment-marker
        target: 余白のマーカー
        value: '部品設計『余白のマーカー』の HTML と余白の列に適用する規則。`docs/mock/refs/277/assets/margin.css` の案 A（`[data-place]` を持たない規則）から取る。`.mdmark` に `--mdmark-comment-margin-width`（`2.25rem`）を配置する。右側の目次を持たず余白の列を持つ描く先の要素（`.mdmark:has(> .mdmark-comment-margin):not(:has(> .mdmark-side-toc))`）は、`display: flex`・`flex-wrap: nowrap`・`gap: var(--mdmark-space)`・`align-items: flex-start`・`max-width: none` にして本文の列と余白の列を横に並べる（行の長さの上限は本文の列が持つ）。この要素には `container: mdmark / inline-size` と `@container mdmark (width < 48rem)` の帯の規則を適用しない（帯は右側の目次の規則）。右側の目次を持つときは、右側の目次の規則の flex の中で、本文の列と右側の目次の間に並ぶ。余白の列は `position: relative`・`flex: none`・`align-self: stretch` で本文の列の右に並べ、マーカーは `position: absolute` で縦の中ほどを `top` に合わせる（`translate: 0 -50%`）。`[data-current]` は地と文字の色を反転し（文字は `--mdmark-color-bg-opaque`。ホバーの地も `--mdmark-color-comment-line` と `--mdmark-color-bg-opaque` を混ぜる）、`[data-closed]` は線を破線にする。押せる範囲は `::before` で 0.375rem ずつ広げる。`@media print` では余白の列を出さない'
      - class_name: '@media print（ビューとコメント）'
        target: ビューとコメントのマーカー刷
        value: '`docs/mock/refs/55/assets/view-print.css` から取る。ビューは今のビューを出し、切り替えを隠す（絞り込みのボタンは表の印刷の規則が隠す）。ボードは横のスクロールをやめ、紙の幅に収まる数の列で折り返し、列と項目を改ページで切らない。コメントのボタン・入力欄・吹き出しを隠し、マーカーは地の色を削除して下線だけで箇所を示す'
      - class_name: :root:has({class} .mdmark)
        target: 描く先の祖先の class で決める配色（画面のとき）
        value: '`@media screen` の中で、ダークの class の下に `.mdmark` があればダークの配色の値（`prefers-color-scheme: dark` の `:root` と同じ値と `color-scheme: dark`）を、ライトの class の下にあれば `:root` の既定と同じ値と `color-scheme: light` を `:root` に配置する。ダークの class は `mdmark-theme-dark`・`vscode-dark`・`vscode-high-contrast:not(.vscode-high-contrast-light)`、ライトの class は `mdmark-theme-light`・`vscode-light`・`vscode-high-contrast-light`。`vscode-*` の規則は、`.mdmark` かその祖先が `mdmark-theme-*` を持つときに適用しない。同じ優先度のライトとダークが入れ子になるときは、内側の class を持つ祖先の下の `.mdmark` を外側の規則から `:not()` で削除し、描く先に近い祖先に従わせる'
        notes: '`:root` より強い指定のため、OS の設定のダークの規則に勝つ。`@media print` では当てず、印刷は明るい配色のまま'
      - class_name: .mdmark .mdmark-term-avoided
        target: やめた言い方のマーカー
        value: '`.mdmark-term` の破線を波線（`text-decoration: underline wavy`）に替え、色を `--mdmark-color-avoided-underline`（既定 `var(--mdmark-color-notice-border)`、`:root` に配置する）にする。代わりの用語の単語 `mdmark-term-tip-replacement` は太字。印刷では波線を削除する（`.mdmark-term` の印刷の規則より詳細度が高いので別に宣言する）。値は `docs/mock/refs/79/assets/avoided-term.css`・`avoided-term-print.css`'
      - class_name: :root（色分け）と .mdmark code [class^="hljs-"]
        target: コードブロックの色分け
        value: '`--mdmark-color-syntax-{keyword,string,number,type,name,comment}` の既定とダークの値を `:root` に配置し（部品設計『コードブロック』の CSS カスタムプロパティ）、`hljs-*` の class を 6 つの変数へ統一する（部品設計の補足『色分けの種類』。コメントは斜体、`hljs-subst` は本文の色、`hljs-strong` は太字、`hljs-emphasis` は斜体）。`diff` の色分けの `hljs-addition`・`hljs-deletion` は差分の `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` にする（`docs/mock/refs/151/assets/code-block.css`）。値は `docs/mock/refs/97/assets/syntax-highlight.css`。`@media print` では色分けした `code` に `print-color-adjust: exact` を当て、明るい配色の色で印刷する'
        notes: 色分けの HTML は `mount` が描いた後に入れるため、規則は描いた文書の class `.mdmark` の下で適用する
      - class_name: .mdmark .mdmark-mermaid と .mdmark-mermaid-print・.mdmark-mermaid-actor
        target: mermaid の図
        value: '部品設計『mermaid の図』の HTML に適用する規則。`docs/mock/refs/382/assets/mermaid.css` から取る。SVG の `[filter]` と `.actor` の `filter` を `none` にする（テーマの変数の `dropShadow` では削除されない影を削除する）。`.mdmark-mermaid-actor` は `fill: none`・`stroke: var(--mdmark-color-text)`・`stroke-width: 1.5`・丸い端と角。状態遷移図の終了のマーカー（`svg[aria-roledescription="stateDiagram"] g.node.default[id*="_end-"]`。状態は class `statediagram-state` を持ち、`default` だけを持つのは開始と終了のマーカー）の線と内側の塗りを `--mdmark-color-text` にする。表示する枠より小さい図は、`figure.mdmark-diagram[data-diagram="mermaid"] .mdmark-diagram-sizer` の `margin-inline: auto` で枠の中で横の中央に配置する（モックの `place-items: center` と同じ見え方。大きい図は左端から動かす）。`.mdmark-mermaid-print` は画面では `display: none`、`@media print` では `.mdmark-mermaid-has-print > svg` を `display: none` にして `.mdmark-mermaid-print` を出す'
        notes: 印刷用の SVG は暗い配色で描いたときだけ配置する（インターフェース定義『文書を描く』の制約「mermaid のテーマ」）
      - class_name: .mdmark:has(> .mdmark-side-toc) と .mdmark-content・.mdmark-side-toc-*・.mdmark-fold-all
        target: 右側の目次と本文の列
        value: '部品設計（右側の目次）の HTML に適用する規則。`docs/mock/refs/166/assets/side-toc.css` から取る。右側の目次を持つ描く先の要素を `container: mdmark / inline-size` の flex にして本文の列と右側の目次を並べ、行の長さの上限（`--mdmark-content-width`）は本文の列が持つ。右側の目次は `position: sticky` で `calc(var(--mdmark-sticky-top, 0px) + var(--mdmark-space))` に留め、広い幅と狭い幅のどちらも `z-index: 5` で表の見出し行と集計の行（`3`）・ピン止めした列（`4`）より手前に描く（同じ `5` の先頭へ戻るボタンは後ろに配置されるためその手前に出、ツールチップとメニューの `10` は目次より手前に出る）。`data-mode`・`data-open`・`data-pinned` で出し方を切り替える。`@container mdmark (width < 48rem)` では右側の目次を本文の上の狭い幅の帯にして `var(--mdmark-sticky-top, 0px)` に留め、見出しに `scroll-margin-block-start: calc(var(--mdmark-sticky-top, 0px) + 3.5rem)` を付ける。広い幅の見出しは `scroll-margin-block-start: var(--mdmark-sticky-top, 0px)`。目次の頭（`.mdmark-side-toc-head`）は、まとめて開閉するボタンの並びを左、ピン止めのボタンを右に 1 行で並べ、下に `--mdmark-color-border` の線を描く（頭の中の `.mdmark-side-toc-actions` は余白と下の線を持たない）。ピン止めのボタンは `aria-pressed` で `.mdmark-side-toc-pin-off`（`panel-right-dashed`）と `.mdmark-side-toc-pin-on`（`panel-right`）のどちらかを出し、押した後は `--mdmark-color-current-bg` の背景と `--mdmark-color-link` の色にしてアイコンを塗らない。hover の出し方でピン止めしていない目次の枠は `position: fixed` にし、`inset-block-start`・`inset-inline-end`・`min-height` を `attachSideToc` が aside に入れる `--mdmark-side-toc-panel-top`・`--mdmark-side-toc-panel-end`・`--mdmark-side-toc-panel-min-height` で決める（`docs/mock/refs/320/assets/proposal.css`）。同じ条件の右端の線（`.mdmark-side-toc-rail`）も `position: fixed` にし、`inset-block-start`・`inset-inline-end`・`height` を `attachSideToc` が入れる `--mdmark-side-toc-rail-top`・`--mdmark-side-toc-panel-end`・`--mdmark-side-toc-rail-height` で決め、aside が `data-rail-outside` を持つ間（描く先の要素の下端が線の上端より上）は線を `display: none` にする。aside は線の幅（`1.5rem`）を `min-width` で取っておく（線が aside の高さを持たないので、描く先の要素の下端で押し上げられない。#285）'
      - class_name: '@media print（右側の目次）'
        target: 右側の目次の印刷
        value: '右側の目次を隠し、描く先の要素を `display: block`、本文の列を `max-width: none` にして紙の幅いっぱいに並べる（`docs/mock/refs/166/assets/side-toc-print.css`）'
      - class_name: .mdmark-back-to-top と .mdmark:has(> .mdmark-back-to-top:not([hidden]))
        target: 先頭へ戻るボタン
        value: '部品設計『先頭へ戻るボタン』の HTML に適用する規則。`docs/mock/refs/287/assets/back-to-top.css` から取る。`.mdmark` に `--mdmark-back-to-top-size`（`2.75rem`）・`--mdmark-back-to-top-gap`（`1rem`）を配置する。ボタンは `position: fixed` で、`inset-inline-end`・`inset-block-end` を `var(--mdmark-back-to-top-right, var(--mdmark-back-to-top-gap))`・`var(--mdmark-back-to-top-bottom, var(--mdmark-back-to-top-gap))` にし、`z-index: 5`。ポインターを乗せている間・キーボードのフォーカス・押している間の色は部品設計の CSS カスタムプロパティのとおり。`[hidden]` は `display: none`。押した後にフォーカスを受ける本文の列（`.mdmark-content[tabindex="-1"]` と、本文の列を持たないときの `.mdmark[tabindex="-1"]`）は `:focus` で輪郭を出さない。ボタンを出している間は、右側の目次の枠（`.mdmark-side-toc-panel`）の `max-height` をボタンの高さと間の分だけ短くする。`@media print` ではボタンを出さない'
      - class_name: .mdmark [data-mdmark-diff-hidden]
        target: 差分を開いている間に隠す要素
        value: '`display: none !important`（`DIFF_HIDDEN_ATTRIBUTE`）'
      - class_name: :root:has(.mdmark[data-mdmark-color-theme="{テーマ}"])
        target: 選んだテーマの明るい配色
        value: '`theme-paper`・`theme-slate`・`theme-contrast` のそれぞれに、そのテーマの `--mdmark-color-*` の明るい配色の値と `color-scheme: light` を `:root` に配置する。値は `docs/mock/assets/themes/{テーマ}.css` の `:root`。`dev-swiss` の規則は配置せず、`:root` の既定の値のままにする'
        notes: 属性は `mount` が描く先の要素に付ける（`COLOR_THEME_ATTRIBUTE`）。印刷でもこの値を使用する。同じページに別のテーマの文書が並んだときは、`theme-paper`・`theme-slate`・`theme-contrast` の並びで後のテーマが全ての文書に該当する（`dev-swiss` は規則を持たないため他のテーマに負ける）
      - class_name: :root:has(.mdmark[data-mdmark-color-theme="{テーマ}"])（暗い配色）
        target: 選んだテーマの暗い配色（画面のとき）
        value: '`@media screen and (prefers-color-scheme: dark)` の中と、暗い class の下に属性を持つ `.mdmark` があるときは、そのテーマの暗い配色の値と `color-scheme: dark` を、明るい class の下では明るい配色の値を `:root` に配置する。class の種類・`mdmark-theme-*` が `vscode-*` に勝つ優先・入れ子は内側に従う決まりは `:root:has({class} .mdmark)` の行と同じで、その行のセレクタの `.mdmark` に属性を重ねる。値は `docs/mock/assets/themes/{テーマ}.css` の `@media screen` の中'
        notes: '`@media screen` の中にだけ配置し、印刷は明るい配色のまま。`prefers-color-scheme` の規則は明るい配色の規則の後に配置する。class の規則は属性を重ねた分だけ `:root:has({class} .mdmark)` の規則より詳細度が高く、既定の明暗の値に勝つ。`@layer mdmark` の中なので、利用側が層の外で `:root` や `.mdmark` に記載した変数には負ける'
      - class_name: .mdmark .mdmark-diff-block
        target: 差分のブロック
        value: '部品設計（差分のブロック）の HTML に適用する規則。`docs/mock/refs/196/assets/diff-preview.css` の `@layer mdmark` の中身（`.mdmark-diff-block`・`.mdmark-diff-block-sign`・`.mdmark-diff-block-label`）から取る。`data-kind` ごとに地を `--mdmark-color-diff-add-bg`・`--mdmark-color-diff-del-bg`、左の余白の記号を `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` にする。削除した `li` は番号を出さず後ろの項目の番号を進めない（`list-style-type: none`・`counter-increment: list-item 0`）'
      - class_name: :root（色のプリセット）
        target: 色の名前ごとの面と文字の色
        value: '`--mdmark-color-accent-{blue,red,green,yellow,orange,purple,gray}-{bg,text}` の明るい配色とダークの値。選んだテーマの配色の規則にも、そのテーマの値を配置する。値は `docs/design-policy.md` と `docs/mock/components/color-preset/index.html` の `<style>`'
      - class_name: .mdmark .mdmark-col-highlight[data-color]・.mdmark tr[data-color]・.mdmark-badge[data-color]・.mdmark-color[data-color]
        target: 列と行の色・バッジの色・本文の文字の色
        value: '強調した列のセルと色を付けた行のセルの地を `--mdmark-color-accent-{色}-bg` にし、強調した列の見出しのセルに下端の線、色を付けた行に上下の線（`-text`）を付ける。バッジは地と文字、`mdmark-color` は文字の色と `font-weight: 700`。`docs/mock/components/table/`・`docs/mock/components/badge/`・`docs/mock/components/color-preset/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-image・.mdmark-image-open・.mdmark-only-*
        target: 画像の図
        value: '`--mdmark-image-width` を `figure` の幅の上限にし、`data-align` で左・中央・右に配置する。拡大のボタンは枠を持たず、ホバーとフォーカスで右上の `maximize-2` を出す。`mdmark-only-dark` は明るい配色で、`mdmark-only-light` は暗い配色（OS の設定・祖先の class・選んだテーマ）で `display: none`。`docs/mock/components/figure/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-gallery
        target: ギャラリー
        value: '`container-type: inline-size` を持ち、格子を `--mdmark-gallery-cols` 列にする。配置場所の幅が 32rem より狭いときは 2 列まで、20rem より狭いときは 1 列に減らす（`@container`）。画像は切り抜かず縦横比を保つ。`docs/mock/components/figure/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-lightbox
        target: ライトボックス
        value: '`dialog` を画面いっぱいに開き、`::backdrop` を暗くする。帯の送信し・枚数・拡大の操作・閉じるのボタンは図の全画面のボタンと同じ外観にする。`docs/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-media・.mdmark-media-print
        target: 動画と音声
        value: '`video` を `--mdmark-image-width` の幅に収め、`audio` は列の幅にする。`mdmark-media-print` は画面では `display: none`。`docs/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-gif・.mdmark-gif-toggle
        target: GIF
        value: '`canvas` を `img` に重ね、`canvas[hidden]` を `display: none` にする。ボタンは画像の右上に配置し、`aria-pressed` で `pause` と `play` のアイコンを出し分ける。`docs/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-card
        target: リンクと添付のカード
        value: アイコン・タイトル・ドメインと URL を並べる枠。長い URL は折り返す。アイコンは `data-card` と `data-file-kind` ごとに `mask-image` の lucide（`globe`・`file-text`・`file-spreadsheet`・`file-archive`・`file`）で付ける。`docs/mock/components/link-card/` の `<style>` から取る
      - class_name: '@media print（画像と動画）'
        target: 画像・動画・カードの印刷
        value: 拡大のアイコンと GIF のボタンを隠し、`mdmark-only-light` を出して `mdmark-only-dark` を隠す。`video`・`audio` を隠して `mdmark-media-print` を出す。カードの後ろにリンク先の URL を出す。色のプリセットは選んだテーマの明るい配色の値で残す
      - class_name: .mdmark :is(.mdmark-fn-ref, .mdmark-footnotes)
        target: 脚注の番号・ツールチップ・末尾の一覧
        value: '`docs/mock/refs/311/assets/footnote.css` の `@layer mdmark` の中身と、印刷の `footnote-print.css`（ツールチップと戻るリンクを隠す）。番号の色は `--mdmark-color-footnote-ref`（既定 `var(--mdmark-color-link)`）'
      - class_name: .mdmark .mdmark-inline-icon
        target: 行内のアイコン
        value: '`inline-flex` で文字の高さの中央にそろえ、中の `.mdmark-icon` を `--mdmark-icon-inline-size`（既定 `1em`）角にする。値は `docs/mock/refs/307/assets/notations.css`'
      - class_name: .mdmark .mdmark-kbd-group と .mdmark-kbd
        target: キー
        value: キーは `--mdmark-color-surface` の地・`--mdmark-color-border` の線と下の影・等幅の書体。間の `+` は `--mdmark-color-muted`。値は `docs/mock/refs/307/assets/notations.css`
      - class_name: .mdmark mark.mdmark-highlight
        target: 蛍光ペン
        value: '文字の高さ全体に `--mdmark-highlight-bg`（`data-color` を持てば `--mdmark-color-accent-{色}-bg`）の面を引き、`padding: 0.05em 0.15em`・`border-radius: 2px`。行をまたぐときは `box-decoration-break: clone`。値は `docs/mock/refs/307/assets/notations.css`'
      - class_name: .mdmark ruby rt
        target: ルビ
        value: '`font-size: max(0.6em, 11px)`（確認ログのモックの決定）'
      - class_name: .mdmark .mdmark-layout-columns
        target: 段組み
        value: '`container-type: inline-size` の囲みの中で、`data-count` の数の等しい幅の列を `--mdmark-space` の間隔で並べ、囲みの幅が `40rem` 未満のときは縦に並べる。値は `docs/mock/refs/307/assets/notations.css`'
      - class_name: .mdmark .mdmark-pagebreak
        target: 改ページ
        value: '画面では `display: block; height: 0`。`@media print` で `break-before: page`'
      - class_name: .mdmark .mdmark-wide-range と .mdmark-wide-bar
        target: wide の範囲
        value: '`data-state="wide"` の範囲は `attachWideToggles` が入れた広げられる幅（`--mdmark-wide-width`・`--mdmark-wide-shift`）まで広げて本文の列の中央にそろえ（右側の目次と文書の一覧の列・右端の線の内側）、`narrow` は本文の幅。帯は本文の幅で、ボタンを右端に配置し、`aria-pressed` で 2 つのアイコンの片方だけを出す。印刷では帯を出さず、範囲を紙の幅に収める。値は `docs/mock/refs/307/assets/notations.css`'
      - class_name: .mdmark .mdmark-table[data-source="csv"]
        target: CSV の表と RAW のボタン
        value: '囲みを記法の表と同じく本文の幅（`width: 100%`。確認ログの「CSV の表の幅」）にして、表を包む要素（`.mdmark-table-scroll`。無ければ表）と `pre.mdmark-raw` を同じ格子の場所に重ね、`data-view="raw"` で表を包む要素を隠して `pre.mdmark-raw` を出す。RAW のボタンは押していないとき `--mdmark-color-muted`、押したとき `--mdmark-color-accent-blue-text` のアイコンと `--mdmark-color-accent-blue-bg` の面（確認ログの案 C）。値は `docs/mock/refs/307/assets/notations.css`'
      - class_name: .mdmark .mdmark-code pre・.mdmark .mdmark-tree .mdmark-tree-list・.mdmark-code-wrap・.mdmark-tree-wrap
        target: コードブロックとファイルツリーの折り返し
        value: '折り返さない既定（`white-space: pre`・`nowrap` と `overflow-wrap: normal`）は `@layer mdmark` の外に `.mdmark .mdmark-code pre`・`.mdmark .mdmark-code pre code`・`.mdmark .mdmark-tree .mdmark-tree-list` で、印刷以外（`@media not print`。印刷は層の中の印刷の規則でコードを紙の幅に折り返す）に配置する（利用側の要素名だけ・クラス 1 つの `pre` への CSS より詳細度が高く、利用側が mdmark のクラスを指定すれば上書きできる）。`mdmark-code-wrap` と `mdmark-tree-wrap` の規則も同じく層の外に配置し、値はモック `docs/mock/refs/328/assets/wrap.css` から取る（ツリーの注釈の字下げは開閉のマーカーの幅とアイコンの幅と間隔の和）'
      - class_name: .mdmark .mdmark-diagram-node.has-link・.mdmark-diagram-node-link
        target: リンク先を持つ map の構成図のノード
        value: 'リンクはノードの全体を覆い（`position: absolute; inset: 0`）、名前を本文のリンクと同じ色と下線にし、ノードの上は文字の上も `cursor: pointer`・`user-select: none` にする。ホバーはノードの地に種類の色をうっすら敷き、フォーカスはノードの外側に枠を出す。右上のマーカーはリンクの上に重ねる。値はモック `docs/mock/refs/42/assets/diagram.css` の `.mdmark-diagram-node.has-link` の規則'
      - class_name: .mdmark .mdmark-table-scroll と .mdmark-table-tool.is-icon-only・.mdmark-table-tool-badge
        target: 表を横にスクロールさせる包みと、アイコンだけの帯のボタン
        value: '包みは本文の幅いっぱい（`width: 100%`）で横にスクロールし、外側の角丸の枠と続きがある側の端の影を持つ。中の `table` は `display: table`・`width: max-content` で列の幅の合計で描き、本文の幅まで広げない（列の最小幅と見出しを折り返さない指定は今のままにする）。印刷以外（`@media not print`）では、`data-auto-width` の表を `table-layout: fixed`・`width: var(--mdmark-auto-table-width)` にし、`is-resized` でない見出しのセルを `box-sizing: border-box`・`width: var(--mdmark-auto-width, auto)`（変数は外側の幅）、セルの `min-width` を `0` にする（読者がつまみで入れたインラインの `width` が優先される。値は `docs/mock/refs/505/assets/table-width.css`）。アイコンだけのボタンは帯のほかのボタンと同じ高さの正方形で、バッジはアイコンの右上に重ねる。印刷では包みのスクロールを削除する。値は `docs/mock/refs/308/assets/table.css`'
      - class_name: .mdmark .mdmark-diagram-resize・.mdmark-diagram-item-hit・.mdmark-diagram-group-info
        target: 図のリサイズハンドル・グラフの項目の該当し・map の構成図のグループのタイトルのマーカー
        value: 'リサイズハンドルは表示するノードの右下の角に `position: absolute` で配置し、`cursor: ns-resize`・`touch-action: none`、ホバーと `.is-resizing` で面の色、フォーカスの枠を持つ。クリックを受ける円は透明で `pointer-events: all`、フォーカスしたときにリンクの色の輪。map の構成図のグループのタイトルのマーカーはノードのマーカーと同じ外観をタイトルの行（`.map-group-head`）の中に配置する（`position: static`）。廃止したフロー図の枠・層・判定フローチャートの形・シーケンス図の相手の行と、`.is-stuck`・ノードの種類ごとの色の CSS 変数（`--mdmark-color-diagram-llm` など）の規則は削除する。印刷ではリサイズハンドルを隠す。値は `docs/mock/refs/42/assets/diagram.css`'
