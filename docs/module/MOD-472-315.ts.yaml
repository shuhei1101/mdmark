id: MOD-472-315
visibility: internal
title: ライブラリ本体 / 表 / table.part.ts
test_files:
  - tests/unit/src/table/table.part.test.ts
functions:
  - name: renderTable
    title: 表を描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の HTML を返却する
    description: |-
      | 呼び出し元 | 使い方 |
      | --- | --- |
      | `render` | 表を `SLOT_MARKER` にして囲みだけを使用する |
      | Storybook | `columns`・`rows` と状態の引数で、操作を付けた後の外観を作る |

      Storybook の状態の引数は `sort`・`overflow`・`pinned`・`unpinned`・`openFilter`・`filterValues`・`hiddenColumns`・`openColumns`・`copyState`・`targetRow`・`shownTotals`・`openTotals`・`openCopy`・`copyFallback`・`rowLinkNotice`・`autoWidths`・`openMenu`・`moveMenu`・`rawShown`。

      折り畳みの見出しは `title` か `表（{`rows` の数か `rowCount`} 行）`。
      表（と `SLOT_MARKER`）は横にスクロールさせる `div.mdmark-table-scroll` で包む（計画書の案 A。表の `tabindex="0"` と `aria-label` は `table` に残す）。

      囲みには `hide`・`totals` を `data-hide`・`data-total`、`pin`・`unpin`（半角の空白で区切る）・`check` を `data-pin`・`data-unpin`・`data-check` で持たせる。

      `rows` を指定したときは、次も描く。

      | 条件 | 描くもの |
      | --- | --- |
      | 条件なし | `renderTableMenu` の表のメニューのボタンとメニュー（`div.mdmark-table-scroll` の外に配置し、最も右の見えている列の最下段の `th` に class `mdmark-th-menu-space` を付ける。キーの階層の表も同じで、件数は補った行を数えない） |

        | `rawCsv` のとき | `pre.mdmark-raw` と、その右上の `renderRawToggle` のボタン。`rawShown` のときは表を包む要素と表のメニューのボタンに `hidden` を付け、`pre` とボタンの `hidden` を解除する |
      | `copyFallback` のとき | `renderCopyPanel` のパネル |
      | 条件なし | `renderTotalRows` の集計の行 |
      | `rowIds` の行 | 行の `id` と行へのリンクと通知の要素 |
      | `rowKeys` の行 | 行の `data-key`。`pressable` のときは行の `mdmark-row-pressable` と `tabindex`（`focusRow` の行だけ `0`、ほかは `-1`） |
      | `editable` の列 | `td` の `mdmark-cell-editable`。`editing` のセルは `mdmark-cell-editing` と `renderCellEditor` の中身 |
      | `addRow` のとき | 表の後ろの `renderAddRow` のボタン |
      | `columnKeys` の列 | 最下段の `th` の `data-column-key`（`<mdmark-table>` が描き直しで列を見分ける） |

      集計の値は `filterValues` に合う行から `computeTotal` で出し、全ての行で `findUnreadableTotals` が返却した列と計算のセルは空にする。

      セルには次を付ける。

      | 対象 | 付けるもの |
      | --- | --- |
      | `highlight` の列の `th`・`td` | class `mdmark-col-highlight` と `data-color` |
      | `rowColors` の行の `tr` | `data-color` |
      | `rowHeader` の列のセル | `<th scope="row">` にする |
      | `mergeColumns` の列 | 表示する行から `mergeSpans` で結合を決めて、始まりのセルに `rowspan` と `is-merged`、続くセルに `hidden` |
      | `rows` を指定したときの `wide` の列の `th`・`td` | class `mdmark-wide` |
      | `rows` を指定したときの `check` の列の `th`・`td` | class `mdmark-align-center` |
      | `rows` を指定したときの `check` の列の `true`・`false` のセル | `data-value` と `renderCheckCell` の中身にする |

      `highlight`・`rowColors` は、`render` では記法のコアルールがトークンに付けるため、Storybook の外観にだけ使用する。

      `headRows` を指定すると `thead` を行ごとのセル（`rowspan`・`colspan`・`scope`）で描き、`bottomHeadCells` で決めた最下段のセルにだけ `renderTableTools` のボタンを配置する。

      `pinned` を省いたときは `rowHeader` の全ての列を留める。
      留める列は `pinned` の位置のセルに `is-pinned-col` を付け、結合した見出しのセルはまたぐ列が全て `pinned` にあるときだけ付ける
    args:
      - name: options
        type: TableOptions
        required: true
        description: 部品設計の引数（`kind`・`features`・`columns`・`rows`・`filters`・`collapse`・`title`・`rowCount`（`rows` を省いたときの本文の行の数）・`hide`・`totals`・`rowIds`・`highlight`・`rowColors`・`pin`（`data-pin` に写す列の位置の並び）・`unpin`（`data-unpin` に写す、既定で留める列から除く列の位置の並び）・`pinMode`（ピン止めのボタンの名前と押した状態を決める。既定 `each`）・`widths`（`{ column, width }` の並び。指定した列の見出しのセルの `width`・`min-width`・`--mdmark-column-min-width` に入れ、セルに `is-resized` を付ける）・`resizing`（つまみの線を出したままにする列の位置）・`long`（`data-long` に写す長文の列の位置の並び）・`noSort`（`data-no-sort` に写す並べ替えを付けない列の位置の並び。空なら属性を付けない）・`widthRanges`（`{ column, min?, max? }` の並び。`data-width` に `{位置}:{min}-{max}` を空白で区切ってコピーし、記載しない側は空にする）・`autoWidths`（`{ column, width }` の並び。表に `data-auto-width` と `--mdmark-auto-table-width`（幅の合計）、見出しのセルに `--mdmark-auto-width` を入れる）・`wide`・`check`・`headRows`・`rowHeader`・`mergeColumns`・状態の引数）。`rows` を省いて `body` に `SLOT_MARKER` を指定すると囲みだけを作る
    returns:
      type: string
      description: '`<div class="mdmark-table"` で始まる HTML'
    callees:
      - '#functions[renderTableTools]'
      - 'MOD-472-313#functions[escapeHtml]'
      - '#functions[renderTotalRows]'
      - '#functions[renderCopyPanel]'
      - MOD-472-218#functions[bottomHeadCells]
      - MOD-472-218#functions[mergeSpans]
      - '#functions[renderCheckCell]'
      - '#functions[renderTableMenu]'
      - '#functions[renderRawToggle]'
    unit_tests:
      - name: test_render_table
        case: 正常
        summary: 囲みに種類・機能・絞り込みを属性で持たせる
        condition: '`kind: data`、`features: [sort, pin, filter]`、`filters: [{0, select}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: '`<div class="mdmark-table" data-kind="data" data-features="sort pin filter" data-filter="0:select">` の中の `div.mdmark-table-scroll` に `SLOT_MARKER`'
      - name: test_render_table_when_closed
        case: 正常
        summary: 閉じた表は折り畳みに入れる
        condition: '`collapse: closed`、`rowCount: 3`'
        mock: なし
        expected: '`<details class="mdmark-table-details"><summary>表（3 行）</summary>` を持ち、`open` を持たない'
      - name: test_render_table_when_filtered
        case: 正常
        summary: 適用した絞り込みに合わない行を隠し、一致する行が無ければ通知の行を出す
        condition: '`filterValues: [{ column: 1, text: "存在しない" }]`'
        mock: なし
        expected: 本文の行が全て `hidden` で、`一致する行がありません` の行が `hidden` を持たない
      - name: test_render_table_when_feature_attributes
        case: 正常
        summary: 囲みに隠す列と集計する列を属性で持たせる
        condition: '`features: [sort, pin, filter, columns, total]`、`hide: [1]`、`totals: [{2, sum}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: 囲みが `data-hide="1"`・`data-total="2:sum"` を持ち、表のメニューのボタンと集計の行を持たない
      - name: test_render_table_when_all_features
        case: 正常
        summary: 5 つの機能の状態を描く
        condition: '部品設計の `AllFeatures`（`hide: [1]`、`totals: [{2, sum}]`、`rowIds`）に `targetRow: 1`'
        mock: なし
        expected: '`mdmark-table-bar` が無く、`div.mdmark-table-scroll` の外に `aria-label` が `表のメニュー（3 / 3 件・1 列を非表示）` の `button.mdmark-table-menu` があり、メニューに `3 / 3 件を表示`・テーブル設定・表をコピーの項目、最も右の見えている列の `th` が `mdmark-th-menu-space`、説明の列の見出し・セル・集計のセルが `hidden`、`tfoot` に `合計 25`、各行に `id` と `mdmark-row-anchor`、2 行目だけ `data-target`'
      - name: test_render_table_when_totals_unreadable
        case: 正常
        summary: 数として読み込めないセルを持つ列の合計と平均を空にし、計算ごとの行を出す
        condition: 部品設計の `TotalsUnreadable`（数量の列に `-`・`約 3`）
        mock: なし
        expected: '`tfoot` に `data-total-kind` が `sum`・`avg` の 2 行がこの順にあり、合計の行の数量のセルが空、平均の行の単価のセルが `250`'
      - name: test_render_table_when_totals_hidden
        case: 正常
        summary: 出さない計算の集計の行を隠す
        condition: '部品設計の `TotalsHidden`（`shownTotals: [sum]`）'
        mock: なし
        expected: 平均と件数の行が `hidden`、合計の行が `hidden` を持たず、表のメニューの集計の項目が `is-active`
      - name: test_render_table_when_copy_fallback
        case: 正常
        summary: クリップボードに書き込めなかったときのパネルを表を包む要素の前に出す
        condition: '部品設計の `CopyFallback`（`copyFallback: { format: tsv, text: "名前\t数量" }`、`copyState: failed`）'
        mock: なし
        expected: '`div.mdmark-table-scroll` の直前に `role="group"` の `mdmark-copy-panel` があり、案内が `「TSV」の中身を選択しています。` で始まり、`textarea` が `readonly` で中身が `名前\t数量`'
      - name: test_render_table_when_row_link_notice
        case: 正常
        summary: 行の URL をコピーした結果をマーカーの横の通知に出す
        condition: '部品設計の `RowLinkCopied`（`targetRow: 1`、`rowLinkNotice: copied`）'
        mock: なし
        expected: どの行にも `role="status"` の `mdmark-row-link-notice` があり、2 行目だけが `data-state="copied"` と `リンクをコピーしました` を持つ
      - name: test_render_table_when_title
        case: 正常
        summary: 開いた折り畳みの見出しを title にし、エスケープする
        condition: '部品設計の `OpenTitle`（`collapse: open`、`title: リリースの一覧`）と、`title: a<b` にしたもの'
        mock: なし
        expected: 1 つ目が `<details class="mdmark-table-details" open><summary>リリースの一覧</summary>`、2 つ目の `summary` が `a&lt;b`
      - name: test_render_table_when_long_columns
        case: 正常
        summary: 長文の列と列の幅の範囲を囲みにコピーし、自動の列の幅を入れる
        condition: '`body: SLOT_MARKER`・`long: [1, 3]`・`widthRanges: [{1, min: 20, max: 30}, {3, max: 12}]` と、部品設計の `AutoWidth`'
        mock: なし
        expected: 1 つ目の囲みが `data-long="1 3"`・`data-width="1:20-30 3:-12"` を持つ。部品設計の `LongColumnNotSortable` の囲みが `data-no-sort="2"` を持ち、説明の列の見出しが `mdmark-sort` を持たない。`AutoWidth` の表が `data-auto-width` と `--mdmark-auto-table-width:1145px` を持ち、6 列の見出しのセルが `autoWidths` の幅の `--mdmark-auto-width` を持つ
      - name: test_render_table_when_colors
        case: 正常
        summary: 強調する列と色を付ける行を属性にする
        condition: 部品設計の `HighlightAndRowColors`
        mock: なし
        expected: 強調する列の見出しと各セルが class `mdmark-col-highlight` と `data-color` を持ち、色を付けた行の `tr` だけが `data-color` を持つ
      - name: test_render_table_when_merged
        case: 正常
        summary: 多段の見出しと行見出しと結合したセルを描き、ボタンを最下段に配置する
        condition: 部品設計『表』の `Merged` の引数
        mock: なし
        expected: '`thead` の `tr` が 2 つで、`上期` の `th` が `colspan="2"`・`scope="colgroup"` を持ちボタンを持たない。2 行目の `th` が並べ替えのボタンを持つ。本文の 1 列目が `<th scope="row">` で、`東日本` の始まりのセルが `rowspan="3"`・`is-merged`、続く 2 つが `hidden`'
      - name: test_render_table_when_merged_sorted
        case: 正常
        summary: 並べ替えた順で隣り合う同じ値だけを結合する
        condition: 部品設計『表』の `MergedSorted` の引数
        mock: なし
        expected: 地域の列の結合が、並べ替えた順で隣り合う同じ値の行だけに付いている
      - name: test_render_table_when_columns_specified
        case: 正常
        summary: 留める列と真偽値の列を属性に持たせ、広く取る列と真偽値のセルを描く
        condition: 部品設計の `PinAndWide` と `Check`
        mock: なし
        expected: 1 つ目の囲みが `data-pin="1"` を持ち、概要の列の見出しと各セルが class `mdmark-wide` を持ち、2 列目のセルだけが `is-pinned-col` で 2 列目のボタンが `aria-pressed="true"`。2 つ目の囲みが `data-check="2"` を持ち、必須の列の `true` のセルが `data-value="true"` と `mdmark-check`、`false` のセルが `data-value="false"` と `いいえ`、既定の列は文字のまま
      - name: test_render_table_when_resized
        case: 正常
        summary: 指定した列の幅を見出しのセルに入れ、ドラッグ中の列のつまみに印を付ける
        condition: '`features: [sort, pin, filter, resize]`、`widths: [{ column: 0, width: 200 }]`、`resizing: 0`'
        mock: なし
        expected: 1 列目の `th` の `style` に `width:200px`・`min-width:200px`・`--mdmark-column-min-width:200px` があり、1 列目のセルが `is-resized`、1 列目の `mdmark-col-resize` が `is-dragging` を持つ

      - name: test_render_table_when_raw_shown
        case: 正常
        summary: 元の CSV を出している間は表と表のメニューのボタンを隠し、表で表示のボタンを出す
        condition: 部品設計の `CsvTable` と `CsvRaw`
        mock: なし
        expected: '`CsvTable` は `mdmark-table-bar` が無く、表のメニューに `raw` の項目があり、`pre.mdmark-raw` と `button.mdmark-raw-toggle` が `hidden`。`CsvRaw` は `div.mdmark-table-scroll` と `button.mdmark-table-menu` が `hidden` で、`pre.mdmark-raw` と `button.mdmark-raw-toggle` が `hidden` を持たない'
      - name: test_render_table_when_tree_counted
        case: 正常
        summary: キーの階層の表の件数を表のメニューに出し、補った行を数えない
        condition: 部品設計の `Tree` に `features` の `count` を加えたもの
        mock: なし
        expected: '`mdmark-table-bar` が無く、`button.mdmark-table-menu` の `aria-label` とメニューの件数が補った行を除いた行の数で、最後の列の `th` が `mdmark-th-menu-space` を持つ'
  - name: renderCheckCell
    title: 真偽値のセルの中身を描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '`true` は `<span class="mdmark-check" role="img" aria-label="はい">` に lucide の `check` の SVG を入れた HTML、`false` は `<span class="mdmark-visually-hidden">いいえ</span>` を返却する'
    args:
      - name: value
        type: '"true" | "false"'
        required: true
        description: セルの文字
    returns:
      type: string
      description: セルの中身の HTML
    unit_tests:
      - name: test_render_check_cell
        case: 正常
        summary: true を ✓、false をスクリーンリーダー向けのいいえにする
        condition: '`true` と `false` をそれぞれ指定する'
        mock: なし
        expected: 1 つ目が `role="img"`・`aria-label="はい"` の `mdmark-check` で `<svg` を持ち、2 つ目が `いいえ` だけを持つ `mdmark-visually-hidden`
  - name: renderTableTools
    title: 表の見出しのボタンとドロワーを描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 列 1 つの見出しの中身（並べ替え・絞り込み・ピン止めのボタンと、`features` に `resize` を含むときは `.mdmark-th` の後ろに列の幅のつまみ `span.mdmark-col-resize`。描いた時点から `aria-valuenow`・`aria-valuetext`・`aria-valuemin`・`aria-valuemax` を持ち、`width` があれば 3 つの値をその幅、`aria-valuetext` を `{幅}px`、無ければ 3 つとも `0`、`aria-valuetext` を `自動` にする）と、その列の絞り込みのドロワーの HTML を返却する。`mount` が描いた表に追加するのにも使用する
    args:
      - name: options
        type: '{ id: string; column: number; label: string; features: string[]; sortable?: boolean; filter?: { kind: "select" | "text" | "date"; values: string[] }; active?: boolean; open?: boolean; value?: FilterValue; pinVisible?: boolean; pinPressed?: boolean; pinUnpinned?: boolean; pinMode?: TablePinMode; width?: number }'
        required: true
        description: ドロワーの id の頭、列の位置、列名、機能、並べ替えのボタンにするか（既定 `true`。`false` なら `features` に `sort` があっても列名を `span.mdmark-th-label` にする）、絞り込み（`select` は候補の値）、絞り込み中か、ドロワーを開いているか、適用している絞り込み、ピン止めのボタンを出すか（既定 `false`。`mount` が幅を測って決め、Storybook は `overflow` で出す）、ピン止めのボタンを押した状態にするか、ピン止めのボタンを見えている幅に収まらず留まっていない状態にするか（既定 `false`。`true` なら `is-unpinned` を付け、`aria-label` と `title` に `（表の幅に収まらないため留まっていません）` を付ける。`mount` が入れ、Storybook は `unpinned` で入れる）、つまみを描く時点の列の幅（px。`renderTable` が `widths`・`autoWidths` のその列の幅を指定する。`mount` は指定せず、操作を付けた後に `attachColumnResize` が更新する）、ピン止めの動き（既定 `each`。ボタンの `aria-label` は `each` なら `「{列名}」の列をピン止め`、`through` なら `「{列名}」の列までピン止め`）
    returns:
      type: '{ header: string; drawer: string }'
      description: 見出しの中身とドロワー（絞り込みが無ければ空）
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_table_tools
        case: 正常
        summary: 値を選ぶドロワーとボタンを返却する
        condition: '`features: [sort, pin, filter]`、`filter: { kind: select, values: ["りんご", "みかん"] }`、列名 `名前`'
        mock: なし
        expected: '`header` に `mdmark-sort`・`mdmark-filter`（`aria-label="「名前」で絞り込む"`）・`mdmark-pin`（`hidden`）、`drawer` に `hidden` の `mdmark-filter-drawer`・候補の検索欄・2 つのチェックボックス・`絞り込みを解除`'
      - name: test_render_table_tools_when_not_sortable
        case: 正常
        summary: sortable が false の列は並べ替えのボタンにせず、ほかのボタンは付ける
        condition: '`features: [sort, pin, filter]`、`sortable: false`、`filter: { kind: text }`、列名 `説明`'
        mock: なし
        expected: '`header` に `mdmark-sort` が無く、`<span class="mdmark-th-label">説明</span>`・`mdmark-filter`・`mdmark-pin` がある'
      - name: test_render_table_tools_when_date
        case: 正常
        summary: 日付のドロワーは開始日と終了日の欄を持つ
        condition: '`filter: { kind: date }`'
        mock: なし
        expected: '`drawer` に `開始日`・`終了日` の `<input type="date">` がある'
      - name: test_render_table_tools_when_resize
        case: 正常
        summary: '`resize` の機能を持つ列の見出しに、列の幅のつまみを出す'
        condition: '`features: [sort, resize]`、列名 `名前` と、`features: [sort]`'
        mock: なし
        expected: 1 つ目の `header` の末尾に `<span class="mdmark-col-resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="「名前」の列の幅">` があり、2 つ目の `header` に `mdmark-col-resize` が無い
      - name: test_render_table_tools_when_pin_mode
        case: 正常
        summary: ピン止めのボタンの名前をピン止めの動きで切り替える
        condition: '`features: [pin]`、列名 `名前`、`pinVisible: true`、`pinPressed: true` で、`pinMode` を省いたものと `through`'
        mock: なし
        expected: 1 つ目の `mdmark-pin` が `aria-label="「名前」の列をピン止め"`、2 つ目が `aria-label="「名前」の列までピン止め"` で、どちらも `aria-pressed="true"`
      - name: test_render_table_tools_when_unpinned
        case: 正常
        summary: 見えている幅に収まらず留まっていない列のボタンに、留まっていないことを付ける
        condition: '`features: [pin]`、列名 `名前`、`pinVisible: true`、`pinPressed: true`、`pinUnpinned: true` と、`pinUnpinned` を省いたもの'
        mock: なし
        expected: 1 つ目の `mdmark-pin` が `is-unpinned` を持ち、`aria-label` と `title` が `「名前」の列をピン止め（表の幅に収まらないため留まっていません）`、`aria-pressed="true"`。2 つ目は `is-unpinned` を持たず、`aria-label` が `「名前」の列をピン止め`
      - name: test_render_table_tools_when_resize_values
        case: 正常
        summary: つまみが描いた時点から値の属性を持つ
        condition: '`features: ["resize"]` で、(a) `width` を渡さない、(b) `width: 160` を渡す'
        mock: なし
        expected: (a) つまみが `aria-valuenow="0"`・`aria-valuemin="0"`・`aria-valuemax="0"`・`aria-valuetext="自動"`、(b) `aria-valuenow="160"`・`aria-valuemin="160"`・`aria-valuemax="160"`・`aria-valuetext="160px"`
  - name: renderTableMenu
    title: 表のメニューのボタンとメニューを描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '表のメニューのボタンと、表のメニュー（件数・項目・集計とコピーの形式のメニュー）・テーブル設定のパネルの HTML を返却する'
    description: |-
      ボタンは `<button class="mdmark-table-menu" type="button">`（lucide の `ellipsis`。`copyState` が `copied` なら `check`、`failed` なら `circle-alert` にし、`data-state` に入れる）で、`title="表のメニュー"`・`aria-expanded`（`openMenu`・`openTotals`・`openCopy` のどれかのとき `true`）・`aria-controls` を持ち、`aria-haspopup` を持たない。隠した列があればバッジ `span.mdmark-table-tool-badge` と `is-active` を付ける。

      | `aria-label` | 条件 |
      | --- | --- |
      | `表のメニュー（{shown} / {total} 件・{隠した列の数} 列を非表示）` | `count` で列を隠している |
      | `表のメニュー（{shown} / {total} 件）` | `count` で列を隠していない |
      | `表のメニュー（{隠した列の数} 列を非表示）` | `count` でなく列を隠している |
      | `表のメニュー` | それ以外 |

      メニューは `<div class="mdmark-table-menu-panel" role="group" aria-label="表のメニュー">` で、`count` のとき先頭に `p.mdmark-table-count`（`{shown} / {total} 件を表示`）を配置し、続けて機能を持つときだけ次の項目をこの順に並べる。項目が 1 つも無ければパネルに `tabindex="-1"` を付ける。`openMenu` でなければ `hidden` を付ける（`openTotals`・`openCopy` のときは付けない）。

      | 項目（`button.mdmark-table-menu-item`） | 機能 | `data-action` | アイコン | 持つもの |
      | --- | --- | --- | --- | --- |
      | テーブル設定 | `columns`・`reorder` | `settings` | `settings-2` | パネルを指す `aria-controls` |
      | 集計 | `total` | `totals` | `sigma` | `aria-expanded`・`aria-controls`。出さない計算があれば `is-active` とスクリーンリーダー向けの `（{隠している数} 件を非表示にしています）` |
      | 表をコピー | `copy` | `copy` | `copy` | `aria-expanded`・`aria-controls` |
      | 元の CSV を表示 | `raw` が真 | `raw` | `code-xml` | なし |

      集計のメニュー（`div.mdmark-totals-menu.mdmark-table-submenu`、タイトル `表示する集計` と計算の `value` を持つチェックボックス）とコピーの形式のメニュー（`div.mdmark-copy-menu.mdmark-table-submenu`、`Markdown の表`・`TSV` の形式の名前と用途）はメニューの中のその項目の後ろに配置し、`openTotals`・`openCopy` でなければ `hidden` にする。テーブル設定のパネルは `renderTableSettings` でメニューの外に配置し、`openColumns` でなければ `hidden` にする。

      アイコンは lucide の `ellipsis`・`settings-2`・`sigma`・`copy`・`code-xml`・`check`・`circle-alert`（`ellipsis` は `src/shared/icons.part.ts` に追加する）。`mount` が描いた表に追加するのにも使用する
    args:
      - name: options
        type: '{ id: string; features: string[]; labels: string[]; shown: number; total: number; hiddenColumns: number[]; openMenu?: boolean; openColumns?: boolean; copyState?: "idle" | "copied" | "failed"; totals?: TotalCalc[]; shownTotals?: TotalCalc[]; openTotals?: boolean; openCopy?: boolean; raw?: boolean }'
        required: true
        description: メニューの id の頭、機能、列名、表示している行の数、全ての行の数、隠している列、表のメニューを開いているか、テーブル設定のパネルを開いているか、コピーの結果、表が持つ集計の計算、出している計算（既定は `totals` の全て）、集計のメニューを開いているか、コピーの形式のメニューを開いているか、CSV の表か（「元の CSV を表示」を並べる）
    returns:
      type: '{ button: string; menus: string }'
      description: 表のメニューのボタンと、表のメニュー・テーブル設定のパネルをつないだもの（件数・項目のどちらも無ければ両方とも空）
    unit_tests:
      - name: test_render_table_menu
        case: 正常
        summary: 件数とテーブル設定とコピーの項目を持つ表のメニューを返却する
        condition: '`features: [count, columns, copy]`、列名 `名前`・`説明`・`更新日`、`shown: 2`、`total: 3`、`hiddenColumns: [1]`'
        mock: なし
        expected: '`button` が `aria-expanded="false"`・`title="表のメニュー"`・`aria-label="表のメニュー（2 / 3 件・1 列を非表示）"`・`data-state="idle"`・`is-active`・バッジ `1` を持ち、見える文字と `aria-haspopup` を持たない。`menus` の `role="group"` のメニューが `hidden` で、先頭が `2 / 3 件を表示`、項目が `settings`・`copy` の順。テーブル設定のパネルが `hidden` で、名前の目のアイコンが `disabled`、コピーの形式のメニューが `hidden` で `data-format` が `markdown`・`tsv` のボタンを持つ'
      - name: test_render_table_menu_when_copy_failed
        case: 正常
        summary: コピーできなかったボタンを返却する
        condition: '`features: [copy]`、`copyState: failed`'
        mock: なし
        expected: '`button` が `data-state="failed"` と `circle-alert` のアイコン、`aria-label="表のメニュー"` を持ち、メニューに件数とテーブル設定の項目が無く、`menus` にテーブル設定のパネルが無い'
      - name: test_render_table_menu_when_totals
        case: 正常
        summary: 集計の項目とメニューを表のメニューの中に返却し、隠している計算の数をスクリーンリーダー向けの名前に加える
        condition: '`features: [total]`、`totals: [sum, avg, count]`、`shownTotals: [sum]`、`openTotals: true`'
        mock: なし
        expected: '`button` が `aria-expanded="true"`。メニューが `hidden` を持たず、`data-action="totals"` の項目が `is-active` と `aria-expanded="true"` と `（2 件を非表示にしています）` を持ち、その後ろの `aria-label="表示する集計"` の `mdmark-table-submenu` が `hidden` を持たず、`合計` だけ `checked`'
      - name: test_render_table_menu_when_copy_menu_open
        case: 正常
        summary: コピーの形式のメニューを表のメニューの中に開いて返却する
        condition: '`features: [copy]`、`openCopy: true`'
        mock: なし
        expected: '`data-action="copy"` の項目が `aria-expanded="true"`、`aria-label="コピーの形式"` のメニューが `hidden` を持たず、`Markdown の表`（`文書に貼るとそのまま表になる`）・`TSV`（`表計算ソフトに貼るとセルに分かれる`）の順'
      - name: test_render_table_menu_when_count_only
        case: 正常
        summary: 項目の無いメニューはメニューそのものがフォーカスを受ける
        condition: '`features: [count]`、`shown: 3`、`total: 3`、`openMenu: true`'
        mock: なし
        expected: メニューが `tabindex="-1"` を持ち `hidden` を持たず、`3 / 3 件を表示` だけを持つ。`button` の `aria-label` が `表のメニュー（3 / 3 件）`
      - name: test_render_table_menu_when_raw
        case: 正常
        summary: CSV の表のメニューの最後に「元の CSV を表示」を並べる
        condition: '`features: [count, copy]`、`raw: true`'
        mock: なし
        expected: '項目が `copy`・`raw` の順で、`raw` の項目が `code-xml` のアイコンと文字 `元の CSV を表示` を持つ。`features: []`・`raw: true` でも `button` と `raw` の項目を返却する'
    refs:
      - 'MOD-472-313#functions[escapeHtml]'
  - name: renderTotalRows
    title: 集計の行を描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '`totals` の計算ごとの集計の行を `<tfoot>` に入れて返却する'
    description: |-
      `totals` が持つ計算ごとに 1 行（`sum`・`avg`・`count` の順）の `<tr class="mdmark-table-total" data-total-kind="{計算}">` を、`<tfoot>` に入れて返却する。
      行は列の数だけセルを持ち、先頭のセルに計算の名前（`TOTAL_LABELS` の `合計`・`平均`・`件数`）の `mdmark-total-name` を配置し、その計算を持つ列のセルは `data-total="{計算}"` と値の `mdmark-total-value` を持つ（先頭の列を集計する行は名前と値を同じセルに配置する）。
      隠している列のセルと、`shown` に含まない計算の行は `hidden` を持つ。
      `mount` がもう一度集計するときにも使用する
    args:
      - name: options
        type: '{ columns: number; totals: Array<{ column: number; calc: TotalCalc; value: string }>; shown?: TotalCalc[]; hiddenColumns: number[]; labels: string[] }'
        required: true
        description: 列の数、集計する列と計算と整えた値（`computeTotal` の戻り値。数として読み込めないセルを持つ列の `sum`・`avg` は空）、出している計算（既定は `totals` の全ての計算）、隠している列、列名（`data-label`）
    returns:
      type: string
      description: '`<tfoot>` の HTML'
    unit_tests:
      - name: test_render_total_rows
        case: 正常
        summary: 計算ごとに行を分け、名前と値を出して隠した列のセルを隠す
        condition: '`columns: 3`、`totals: [{2, avg, "250"}, {1, sum, "45"}, {0, count, "4"}]`、`hiddenColumns: [2]`'
        mock: なし
        expected: '`data-total-kind` が `sum`・`avg`・`count` の 3 行がこの順にあり、合計の行は先頭のセルが `合計`・2 つ目のセルが `data-total="sum"` で `45`、平均の行の 3 つ目のセルが `250` で `hidden`、件数の行は先頭のセルが `件数` と `4` を持つ'
      - name: test_render_total_rows_when_shown
        case: 正常
        summary: 出さない計算の行を隠す
        condition: '`columns: 2`、`totals: [{1, sum, "45"}, {1, avg, "15"}]`、`shown: [avg]`'
        mock: なし
        expected: 合計の行が `hidden`、平均の行が `hidden` を持たない
    refs:
      - MOD-472-218#functions[computeTotal]
  - name: renderCopyPanel
    title: 表のコピーできないときのパネルを描く
    container: src/table/table.part.ts
    summary: クリップボードに書き込めなかったときに表を包む要素の前へ配置するパネルの HTML を返却する
    description: |-
      パネルは `<div class="mdmark-copy-panel" role="group" aria-labelledby>` で、次を持つ。

      | 要素 | 中身 |
      | --- | --- |
      | タイトル | `クリップボードにコピーできませんでした`（`circle-alert` のアイコン付き。`reason` があれば後ろに `（{reason}）`） |
      | 閉じるボタン | `x` のアイコン、`aria-label="閉じる"` |
      | 案内 | `「{形式の名前}」の中身を選択しています。Ctrl+C（Mac は ⌘C）でコピーしてください。`（`tree` は `ツリーのテキストを選択しています。Ctrl+C（Mac は ⌘C）でコピーしてください。`、`document` は `Markdown を選択しています。Ctrl+C（Mac は ⌘C）でコピーしてください。`） |
      | テキスト | `text` を入れた `<textarea class="mdmark-copy-panel-text" readonly rows="6">` |

      | 形式 | 形式の名前 |
      | --- | --- |
      | `markdown` | `Markdown の表` |
      | `tsv` | `TSV` |
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ id: string; format: "markdown" | "tsv" | "tree" | "document"; text: string; reason?: string }'
        required: true
        description: タイトルの id の頭、コピーする形式（`tree` はファイルツリーの元の罫線のテキスト、`document` は文書を変換した純粋な Markdown）、コピーする文字、タイトルに添える理由
    returns:
      type: string
      description: '`<div class="mdmark-copy-panel"` で始まる HTML'
    unit_tests:
      - name: test_render_copy_panel
        case: 正常
        summary: タイトル・案内・エスケープした中身を持つパネルを返却する
        condition: '`format: markdown`、`text: "| a<b |\n| --- |"`'
        mock: なし
        expected: '`role="group"` で `aria-labelledby` がタイトルの id、案内が `「Markdown の表」の中身を選択しています。` で始まり、`textarea` の中身が `| a&lt;b |` を含み、`aria-label="閉じる"` のボタンがある'
      - name: test_render_copy_panel_when_tree
        case: 正常
        summary: ツリーのパネルはツリーの案内を出す
        condition: '`format: tree`、`text: "src/\n└── index.ts"`'
        mock: なし
        expected: 案内が `ツリーのテキストを選択しています。` で始まり、`textarea` の中身が `src/\n└── index.ts`
      - name: test_render_copy_panel_when_document_with_reason
        case: 正常
        summary: 文書の Markdown のパネルに理由を添える
        condition: '`format: "document"`・`reason: "許可されていません"`・`text: "# a"`'
        mock: なし
        expected: タイトルが `クリップボードにコピーできませんでした（許可されていません）`、案内が `Markdown を選択しています。` で始まる
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    status: planned
  - name: renderTableSettings
    title: テーブル設定のパネルを返却する
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』のテーブル設定のパネル（タイトル・列名の一覧・案内）の HTML を返却する
    description: タイトルは `columns` があれば `表示と並び順`、`reorder` だけなら `並び順`。一覧は `order` の順に並べ、`pinned` の列（`through` の表の `pinned` で留めた列）・結合した見出しの範囲ごと・範囲の外の列に分け、分けたまとまりが 2 つ以上あるときだけまとまりの見出しを配置する。各行は `reorder` のときつまみ（どちらの向きにも動かせないとき `disabled`）、`columns` のとき目のアイコン（Markdown に記載した先頭の列は `disabled`）を持つ。つまみは `aria-expanded`（`moveMenu` の列だけ `true`）と列の移動のメニューを指す `aria-controls` を持つ。パネルは列の移動のメニュー `div.mdmark-table-move-menu`（`aria-label` が `「{列名}」の列の移動`、`data-move` が `before`・`after` の `前へ移す`・`後ろへ移す` のボタン。その向きへ `canMoveColumn` で動かせないボタンは `disabled`）を 1 つ持ち、`moveMenu` があればその列の行（`li`）の中の末尾に `hidden` を付けずに配置し、無ければ一覧（`ul`）の後ろに `hidden` で配置する（`ul` の直下には `li` だけを配置する）。ストーリーと `mount` が同じ HTML を使用する
    args:
      - name: options
        type: '{ id: string; columns: string[]; order: number[]; hidden: number[]; features: TableFeature[]; groups: Array<string | undefined>; pinned: number; dragging?: { column: number; target: number; side: "before" | "after" }; moveMenu?: number }'
        required: true
        description: '`columns` は元の列の順の列名、`order` は今の列の順、`groups` は列ごとの結合した見出しの範囲、`pinned` は `through` の表で `columns.{列名}.pinned` で留めた列の数（`each` の表と `pinned` が無い表は 0。`each` の表は留めた列で一覧を分けない）'
    returns:
      type: string
      description: '`div.mdmark-table-settings` の HTML（`hidden` は付けない。開閉は呼ぶ側が決める）'
    unit_tests:
      - name: test_render_table_settings
        case: 正常
        summary: つまみと目のアイコンを持つ一覧を今の列の順で返却する
        condition: '`columns` が `["名前","型","既定","説明"]`、`order` が `[3,0,2,1]`、`hidden` が `[3]`、`features` に `columns`・`reorder`'
        mock: なし
        expected: タイトルが `表示と並び順`、行の `data-column` が `3,0,2,1` の順で、説明の目のアイコンが `aria-pressed="true"`・`aria-label="「説明」を表示"`、名前の目のアイコンが `disabled`
      - name: test_render_table_settings_when_reorder_only
        case: 正常
        summary: '`reorder` だけのときはタイトルが `並び順` で目のアイコンを配置しない'
        condition: '`features` に `reorder` だけ'
        mock: なし
        expected: タイトルが `並び順`、`mdmark-table-settings-eye` が無い
      - name: test_render_table_settings_when_groups
        case: 正常
        summary: ピン止めと結合した見出しの範囲で一覧を分け、動かせないつまみを `disabled` にする
        condition: '`groups` が `[undefined,"0:1","0:1","0:1",undefined]`、`pinned` が 1'
        mock: なし
        expected: '`mdmark-table-settings-group` が 3 つで、名前と備考のつまみが `disabled`'
      - name: test_render_table_settings_when_move_menu
        case: 正常
        summary: 開いたつまみの後ろに列の移動のメニューを出し、動かせない向きを `disabled` にする
        condition: '`columns` が `["名前","型","既定","説明"]`、`order` が `[0,1,2,3]`、`features` に `reorder`、`moveMenu` が 0 と 2'
        mock: なし
        expected: '`moveMenu: 0` では名前のつまみだけ `aria-expanded="true"`、その行の `li` の中の `aria-label="「名前」の列の移動"` のメニューが `hidden` を持たず、`前へ移す` が `disabled`。`moveMenu: 2` では `前へ移す`・`後ろへ移す` のどちらも `disabled` を持たない。どの場合も `ul` の直下の要素は `li` だけ。`moveMenu` を省くとメニューが `ul` の後ろで `hidden` で全てのつまみが `aria-expanded="false"`'
    status: planned
