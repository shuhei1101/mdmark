  - name: renderTypeCell
    title: 型のセルを返却する
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '`a \| b` の構造なら値ごとの `span.mdmark-type-chip`、それ以外は `span.mdmark-type-badge`（`data-type`）の HTML を返却する。空の文字は空を返却する'
    args:
      - name: text
        type: string
        required: true
        description: 型の列のセルの文字
    returns:
      type: string
      description: HTML
    unit_tests:
      - name: test_render_type_cell
        case: 正常
        summary: 列挙はチップ、それ以外はバッジにする
        condition: '`bool` と `ref | custom` と空の文字'
        mock: なし
        expected: '`<span class="mdmark-type-badge" data-type="bool">bool</span>`、`ref`・`custom` の `mdmark-type-chip` 2 つ、空の文字'
    status: planned
  - name: renderTreeTools
    title: 階層の表のボタンを返却する
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 階層の行の開閉のボタン（`chevron-down`。`aria-expanded`・`{パス} を畳む`）・パスのコピーのボタン（`全体のパスをコピー`）・見本の表示を切り替えるボタン（`見本を隠す` / `見本を表示`）の HTML を返却する
    args:
      - name: options
        type: '{ kind: "toggle" | "copy" | "example"; path?: string; expanded?: boolean; controls?: string }'
        required: true
        description: '`kind` で返却するボタンを選ぶ。`path` は行のパス、`expanded` は開いているか、`controls` は見本の `id`'
    returns:
      type: string
      description: '`button` の HTML'
    unit_tests:
      - name: test_render_tree_tools
        case: 正常
        summary: 開閉・コピー・見本のボタンを返却する
        condition: '`{ kind: "toggle", path: "aliases[]", expanded: false }`・`{ kind: "copy" }`・`{ kind: "example", expanded: true, controls: "t-example" }`'
        mock: なし
        expected: '`aria-expanded="false"`・`aria-label="aliases[] を開く"` のボタン、`aria-label="全体のパスをコピー"` のボタン、`aria-controls="t-example"` で文字が `見本を隠す` のボタン'
    status: planned
  - name: renderRawToggle
    title: 表で表示のボタンを描く
    container: src/table/table.part.ts
    summary: 部品設計『表』の「表で表示」のボタンの HTML を返却する。`renderTable` は `rawCsv` を受けると `data-source="csv"` と `pre.mdmark-raw` を出し、`pre` の右上にこのボタンを重ねる
    kind: 関数
    scope: internal
    args:
      - name: shown
        type: boolean
        required: true
        description: 元の CSV を出しているか（`false` なら `hidden` を付ける）
    returns:
      type: string
      description: 部品の HTML
    unit_tests:
      - name: test_render_raw_toggle
        case: 正常
        summary: 元の CSV を出している間だけボタンを出す
        condition: '`false` と `true`'
        mock: なし
        expected: どちらも `<button class="mdmark-raw-toggle" type="button" aria-label="表で表示" title="表で表示">` で `table` のアイコンだけを持ち、`aria-pressed` を持たない。`false` だけ `hidden` を持つ
  - name: renderCellEditor
    title: セルの入力欄を描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 編集中のセルの中身（`input.mdmark-cell-input` と案内 `span.mdmark-cell-hint`）の HTML を返却する
    args:
      - name: options
        type: '{ value: string; label: string; hintId: string }'
        required: true
        description: 入力欄の値・スクリーンリーダー向けの名前（`{列名}（{行の番号} 行目）を編集する`）・案内の `id`
    returns:
      type: string
      description: '`<input class="mdmark-cell-input" type="text" value="…" aria-label="…" aria-describedby="{hintId}"><span class="mdmark-cell-hint" id="{hintId}">Enter で確定・Esc で取り消す</span>`'
    unit_tests:
      - name: test_render_cell_editor
        case: 正常
        summary: 値と名前をエスケープした入力欄と案内を返却する
        condition: '`{ value: "<b>鈴木", label: "担当（2 行目）を編集する", hintId: "h1" }`'
        mock: なし
        expected: '`value` が `&lt;b&gt;鈴木`、`aria-describedby="h1"`、案内が `Enter で確定・Esc で取り消す`'
    callees:
      - MOD-472-313#functions[escapeHtml]
    refs:
      - CMP-472-61#args[editing]
  - name: renderAddRow
    title: 行追加のボタンを描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: 表の下の左端に配置する `行追加` のボタン（`div.mdmark-table-add` の中の `button.mdmark-table-add-button`。`plus` のアイコンは `aria-hidden`）の HTML を返却する
    returns:
      type: string
      description: ボタンの HTML
    unit_tests:
      - name: test_render_add_row
        case: 正常
        summary: 文字を持つボタンを返却する
        condition: 引数なし
        mock: なし
        expected: '`button` の文字が `行追加` で、アイコンが `aria-hidden="true"`'
    refs:
      - CMP-472-61#args[addRow]
  - name: renderPlainTable
    title: 操作を付ける前の表を描く
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '列の見出しと行のセルの HTML から、記法の表と同じ構造の操作を付ける前の表（`th` の `data-column-key`、`tr` の `data-key`・`mdmark-row-pressable`・`tabindex`、`td` の `mdmark-cell-editable` を持つ）の HTML を返却する。`<mdmark-table>` が `renderTable` の `body` に指定する'
    args:
      - name: options
        type: TableOptions
        required: true
        description: '`columns`・`rows`・`columnKeys`・`rowKeys`・`pressable`・`focusRow`・`editable` を使用する'
    returns:
      type: string
      description: '`<table tabindex="0" aria-label="表">` で始まる HTML'
    refs:
      - MOD-793-3#classes[MdmarkTableElement]
  - name: cellEditorLabel
    title: 編集中のセルの入力欄の名前を返却する
    container: src/table/table.part.ts
    kind: 関数
    scope: internal
    summary: '`{列名}（{行の番号} 行目）を編集する` を返却する'
    args:
      - name: column
        type: string
        required: true
        description: 列名
      - name: rowNumber
        type: number
        required: true
        description: 表示している行の番号（1 始まり）
    returns:
      type: string
      description: 入力欄のスクリーンリーダー向けの名前
lead: '表・表の上のバー・集計の行・コピーのパネル・畳んだ列の HTML を受け持ち、表の部品の外観を変えるときに参照する。'
