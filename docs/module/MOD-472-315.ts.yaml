  - name: renderTotalRows
    title: 集計の行を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: '`totals` が持つ計算ごとに 1 行（`sum`・`avg`・`count` の順）の `<tr class="mdmark-table-total" data-total-kind="{計算}">` を、`<tfoot>` に入れて返却する。行は列の数だけセルを持ち、先頭のセルに計算の名前（`TOTAL_LABELS` の `合計`・`平均`・`件数`）の `mdmark-total-name` を配置し、その計算を持つ列のセルは `data-total="{計算}"` と値の `mdmark-total-value` を持つ（先頭の列を集計する行は名前と値を同じセルに配置する）。隠している列のセルと、`shown` に含まない計算の行は `hidden` を持つ。`mount` がもう一度集計するときにも使用する'
    args:
      - name: options
        type: '{ columns: number; totals: Array<{ column: number; calc: TotalCalc; value: string }>; shown?: TotalCalc[]; hiddenColumns: number[]; labels: string[] }'
        required: true
        description: 列の数、集計する列と計算と整えた値（`computeTotal` の戻り値。数として読み込めないセルを持つ列の `sum`・`avg` は空）、出している計算（既定は `totals` の全ての計算）、隠している列、列名（`data-label`）
    returns:
      type: string
      description: '`<tfoot>` の HTML'
    unit_tests:
      - name: test_render_total_rows
        case: 正常
        summary: 計算ごとに行を分け、名前と値を出して隠した列のセルを隠す
        condition: '`columns: 3`、`totals: [{2, avg, "250"}, {1, sum, "45"}, {0, count, "4"}]`、`hiddenColumns: [2]`'
        mock: なし
        expected: '`data-total-kind` が `sum`・`avg`・`count` の 3 行がこの順にあり、合計の行は先頭のセルが `合計`・2 つ目のセルが `data-total="sum"` で `45`、平均の行の 3 つ目のセルが `250` で `hidden`、件数の行は先頭のセルが `件数` と `4` を持つ'
      - name: test_render_total_rows_when_shown
        case: 正常
        summary: 出さない計算の行を隠す
        condition: '`columns: 2`、`totals: [{1, sum, "45"}, {1, avg, "15"}]`、`shown: [avg]`'
        mock: なし
        expected: 合計の行が `hidden`、平均の行が `hidden` を持たない
    refs:
      - MOD-472-218#functions[computeTotal]
