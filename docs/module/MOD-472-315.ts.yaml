id: MOD-472-315
visibility: internal
title: ライブラリ本体 / 部品 / table.ts
test_files:
  - tests/unit/src/parts/table.test.ts
functions:
  - name: renderTable
    title: 表を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の HTML を返却する。`render` は表を `SLOT_MARKER` にして囲みだけを使用し、Storybook は `columns`・`rows` と状態の引数（`sort`・`overflow`・`pinned`・`unpinned`・`openFilter`・`filterValues`・`hiddenColumns`・`openColumns`・`copyState`・`targetRow`・`shownTotals`・`openTotals`・`openCopy`・`copyFallback`・`rowLinkNotice`・`autoWidths`）で操作を付けた後の外観を作る。折り畳みの見出しは `title` か `表（{`rows` の数か `rowCount`} 行）`。表（と `SLOT_MARKER`）は横にスクロールさせる `div.mdmark-table-scroll` で包む（計画書の案 A。表の `tabindex="0"` と `aria-label` は `table` に残す）。囲みには `hide`・`totals` を `data-hide`・`data-total` で持たせ、`rows` を指定したときは `renderTableBar` の帯とメニュー、`copyFallback` のときは `renderCopyPanel` のパネル、`renderTotalRows` の集計の行、`rowIds` の行の `id` と行へのリンクと通知の要素も描く。集計の値は `filterValues` に合う行から `computeTotal` で出し、全ての行で `findUnreadableTotals` が返却した列と計算のセルは空にする。`highlight` の列の `th`・`td` に class `mdmark-col-highlight` と `data-color`、`rowColors` の行の `tr` に `data-color` を付ける（`render` はこれらを記法のコアルールがトークンに付けるため、Storybook の外観にだけ使用する）。`headRows` を指定すると `thead` を行ごとのセル（`rowspan`・`colspan`・`scope`）で描き、`bottomHeadCells` で決めた最下段のセルにだけ `renderTableTools` のボタンを配置する。`rowHeader` の列のセルは `<th scope="row">`、`mergeColumns` の列は表示する行から `mergeSpans` で結合を決めて始まりのセルに `rowspan` と `is-merged`、続くセルに `hidden` を付ける。`pinned` を省いたときは `rowHeader` の全ての列を留める。留める列は `pinned` の位置のセルに `is-pinned-col` を付け、結合した見出しのセルはまたぐ列が全て `pinned` にあるときだけ付ける。囲みには `pin`・`unpin`（半角の空白で区切る）・`check` を `data-pin`・`data-unpin`・`data-check` で持たせる。`rows` を指定したときは、`wide` の列の `th`・`td` に class `mdmark-wide`、`check` の列の `th`・`td` に class `mdmark-align-center` を付け、`check` の列の `true`・`false` のセルを `data-value` と `renderCheckCell` の中身にする
    args:
      - name: options
        type: TableOptions
        required: true
        description: 部品設計の引数（`kind`・`features`・`columns`・`rows`・`filters`・`collapse`・`title`・`rowCount`（`rows` を省いたときの本文の行の数）・`hide`・`totals`・`rowIds`・`highlight`・`rowColors`・`pin`（`data-pin` に写す列の位置の並び）・`unpin`（`data-unpin` に写す、既定で留める列から除く列の位置の並び）・`pinMode`（ピン止めのボタンの名前と押した状態を決める。既定 `each`）・`widths`（`{ column, width }` の並び。指定した列の見出しのセルの `width`・`min-width`・`--mdmark-column-min-width` に入れ、セルに `is-resized` を付ける）・`resizing`（つまみの線を出したままにする列の位置）・`long`（`data-long` に写す長文の列の位置の並び）・`noSort`（`data-no-sort` に写す並べ替えを付けない列の位置の並び。空なら属性を付けない）・`widthRanges`（`{ column, min?, max? }` の並び。`data-width` に `{位置}:{min}-{max}` を空白で区切って写し、記載しない側は空にする）・`autoWidths`（`{ column, width }` の並び。表に `data-auto-width` と `--mdmark-auto-table-width`（幅の合計）、見出しのセルに `--mdmark-auto-width` を入れる）・`wide`・`check`・`headRows`・`rowHeader`・`mergeColumns`・状態の引数）。`rows` を省いて `body` に `SLOT_MARKER` を指定すると囲みだけを作る
    returns:
      type: string
      description: '`<div class="mdmark-table"` で始まる HTML'
    callees:
      - '#functions[renderTableTools]'
      - 'MOD-472-313#functions[escapeHtml]'
      - '#functions[renderTotalRows]'
      - '#functions[renderTableBar]'
      - '#functions[renderCopyPanel]'
      - MOD-472-218#functions[bottomHeadCells]
      - MOD-472-218#functions[mergeSpans]
      - '#functions[renderCheckCell]'
    unit_tests:
      - name: test_render_table
        case: 正常
        summary: 囲みに種類・機能・絞り込みを属性で持たせる
        condition: '`kind: data`、`features: [sort, pin, filter]`、`filters: [{0, select}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: '`<div class="mdmark-table" data-kind="data" data-features="sort pin filter" data-filter="0:select">` の中の `div.mdmark-table-scroll` に `SLOT_MARKER`'
      - name: test_render_table_when_closed
        case: 正常
        summary: 閉じた表は折り畳みに入れる
        condition: '`collapse: closed`、`rowCount: 3`'
        mock: なし
        expected: '`<details class="mdmark-table-details"><summary>表（3 行）</summary>` を持ち、`open` を持たない'
      - name: test_render_table_when_filtered
        case: 正常
        summary: 適用した絞り込みに合わない行を隠し、一致する行が無ければ通知の行を出す
        condition: '`filterValues: [{ column: 1, text: "存在しない" }]`'
        mock: なし
        expected: 本文の行が全て `hidden` で、`一致する行がありません` の行が `hidden` を持たない
      - name: test_render_table_when_feature_attributes
        case: 正常
        summary: 囲みに隠す列と集計する列を属性で持たせる
        condition: '`features: [sort, pin, filter, columns, total]`、`hide: [1]`、`totals: [{2, sum}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: 囲みが `data-hide="1"`・`data-total="2:sum"` を持ち、帯と集計の行を持たない
      - name: test_render_table_when_all_features
        case: 正常
        summary: 5 つの機能の状態を描く
        condition: '部品設計の `AllFeatures`（`hide: [1]`、`totals: [{2, sum}]`、`rowIds`）に `targetRow: 1`'
        mock: なし
        expected: 帯に `3 / 3 件`・テーブル設定のボタン・`表をコピー`、説明の列の見出し・セル・集計のセルが `hidden`、`tfoot` に `合計 25`、各行に `id` と `mdmark-row-anchor`、2 行目だけ `data-target`
      - name: test_render_table_when_totals_unreadable
        case: 正常
        summary: 数として読み込めないセルを持つ列の合計と平均を空にし、計算ごとの行を出す
        condition: 部品設計の `TotalsUnreadable`（数量の列に `-`・`約 3`）
        mock: なし
        expected: '`tfoot` に `data-total-kind` が `sum`・`avg` の 2 行がこの順にあり、合計の行の数量のセルが空、平均の行の単価のセルが `250`'
      - name: test_render_table_when_totals_hidden
        case: 正常
        summary: 出さない計算の集計の行を隠す
        condition: '部品設計の `TotalsHidden`（`shownTotals: [sum]`）'
        mock: なし
        expected: 平均と件数の行が `hidden`、合計の行が `hidden` を持たず、`集計` のボタンが `is-active`
      - name: test_render_table_when_copy_fallback
        case: 正常
        summary: クリップボードに書き込めなかったときのパネルを帯の直後に出す
        condition: '部品設計の `CopyFallback`（`copyFallback: { format: tsv, text: "名前\t数量" }`、`copyState: failed`）'
        mock: なし
        expected: '`mdmark-table-bar` の直後に `role="group"` の `mdmark-copy-panel` があり、案内が `「TSV」の中身を選択しています。` で始まり、`textarea` が `readonly` で中身が `名前\t数量`'
      - name: test_render_table_when_row_link_notice
        case: 正常
        summary: 行の URL をコピーした結果をマーカーの横の通知に出す
        condition: '部品設計の `RowLinkCopied`（`targetRow: 1`、`rowLinkNotice: copied`）'
        mock: なし
        expected: どの行にも `role="status"` の `mdmark-row-link-notice` があり、2 行目だけが `data-state="copied"` と `リンクをコピーしました` を持つ
      - name: test_render_table_when_title
        case: 正常
        summary: 開いた折り畳みの見出しを title にし、エスケープする
        condition: '部品設計の `OpenTitle`（`collapse: open`、`title: リリースの一覧`）と、`title: a<b` にしたもの'
        mock: なし
        expected: 1 つ目が `<details class="mdmark-table-details" open><summary>リリースの一覧</summary>`、2 つ目の `summary` が `a&lt;b`
      - name: test_render_table_when_long_columns
        case: 正常
        summary: 長文の列と列の幅の範囲を囲みに写し、自動の列の幅を入れる
        condition: '`body: SLOT_MARKER`・`long: [1, 3]`・`widthRanges: [{1, min: 20, max: 30}, {3, max: 12}]` と、部品設計の `AutoWidth`'
        mock: なし
        expected: 1 つ目の囲みが `data-long="1 3"`・`data-width="1:20-30 3:-12"` を持つ。部品設計の `LongColumnNotSortable` の囲みが `data-no-sort="2"` を持ち、説明の列の見出しが `mdmark-sort` を持たない。`AutoWidth` の表が `data-auto-width` と `--mdmark-auto-table-width:1145px` を持ち、6 列の見出しのセルが `autoWidths` の幅の `--mdmark-auto-width` を持つ
      - name: test_render_table_when_colors
        case: 正常
        summary: 強調する列と色を付ける行を属性にする
        condition: 部品設計の `HighlightAndRowColors`
        mock: なし
        expected: 強調する列の見出しと各セルが class `mdmark-col-highlight` と `data-color` を持ち、色を付けた行の `tr` だけが `data-color` を持つ
      - name: test_render_table_when_merged
        case: 正常
        summary: 多段の見出しと行見出しと結合したセルを描き、ボタンを最下段に配置する
        condition: 部品設計『表』の `Merged` の引数
        mock: なし
        expected: '`thead` の `tr` が 2 つで、`上期` の `th` が `colspan="2"`・`scope="colgroup"` を持ちボタンを持たない。2 行目の `th` が並べ替えのボタンを持つ。本文の 1 列目が `<th scope="row">` で、`東日本` の始まりのセルが `rowspan="3"`・`is-merged`、続く 2 つが `hidden`'
      - name: test_render_table_when_merged_sorted
        case: 正常
        summary: 並べ替えた順で隣り合う同じ値だけを結合する
        condition: 部品設計『表』の `MergedSorted` の引数
        mock: なし
        expected: 地域の列の結合が、並べ替えた順で隣り合う同じ値の行だけに付いている
      - name: test_render_table_when_columns_specified
        case: 正常
        summary: 留める列と真偽値の列を属性に持たせ、広く取る列と真偽値のセルを描く
        condition: 部品設計の `PinAndWide` と `Check`
        mock: なし
        expected: 1 つ目の囲みが `data-pin="1"` を持ち、概要の列の見出しと各セルが class `mdmark-wide` を持ち、2 列目のセルだけが `is-pinned-col` で 2 列目のボタンが `aria-pressed="true"`。2 つ目の囲みが `data-check="2"` を持ち、必須の列の `true` のセルが `data-value="true"` と `mdmark-check`、`false` のセルが `data-value="false"` と `いいえ`、既定の列は文字のまま
      - name: test_render_table_when_resized
        case: 正常
        summary: 指定した列の幅を見出しのセルに入れ、ドラッグ中の列のつまみに印を付ける
        condition: '`features: [sort, pin, filter, resize]`、`widths: [{ column: 0, width: 200 }]`、`resizing: 0`'
        mock: なし
        expected: 1 列目の `th` の `style` に `width:200px`・`min-width:200px`・`--mdmark-column-min-width:200px` があり、1 列目のセルが `is-resized`、1 列目の `mdmark-col-resize` が `is-dragging` を持つ

  - name: renderCheckCell
    title: 真偽値のセルの中身を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: '`true` は `<span class="mdmark-check" role="img" aria-label="はい">` に lucide の `check` の SVG を入れた HTML、`false` は `<span class="mdmark-visually-hidden">いいえ</span>` を返却する'
    args:
      - name: value
        type: '"true" | "false"'
        required: true
        description: セルの文字
    returns:
      type: string
      description: セルの中身の HTML
    unit_tests:
      - name: test_render_check_cell
        case: 正常
        summary: true を ✓、false をスクリーンリーダー向けのいいえにする
        condition: '`true` と `false` をそれぞれ指定する'
        mock: なし
        expected: 1 つ目が `role="img"`・`aria-label="はい"` の `mdmark-check` で `<svg` を持ち、2 つ目が `いいえ` だけを持つ `mdmark-visually-hidden`
  - name: renderTableTools
    title: 表の見出しのボタンとドロワーを描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 列 1 つの見出しの中身（並べ替え・絞り込み・ピン止めのボタンと、`features` に `resize` を含むときは `.mdmark-th` の後ろに列の幅のつまみ `span.mdmark-col-resize`）と、その列の絞り込みのドロワーの HTML を返却する。`mount` が描いた表に追加するのにも使用する
    args:
      - name: options
        type: '{ id: string; column: number; label: string; features: string[]; sortable?: boolean; filter?: { kind: "select" | "text" | "date"; values: string[] }; active?: boolean; open?: boolean; value?: FilterValue; pinVisible?: boolean; pinPressed?: boolean; pinUnpinned?: boolean; pinMode?: TablePinMode }'
        required: true
        description: ドロワーの id の頭、列の位置、列名、機能、並べ替えのボタンにするか（既定 `true`。`false` なら `features` に `sort` があっても列名を `span.mdmark-th-label` にする）、絞り込み（`select` は候補の値）、絞り込み中か、ドロワーを開いているか、適用している絞り込み、ピン止めのボタンを出すか（既定 `false`。`mount` が幅を測って決め、Storybook は `overflow` で出す）、ピン止めのボタンを押した状態にするか、ピン止めのボタンを見えている幅に収まらず留まっていない状態にするか（既定 `false`。`true` なら `is-unpinned` を付け、`aria-label` と `title` に `（表の幅に収まらないため留まっていません）` を付ける。`mount` が入れ、Storybook は `unpinned` で入れる）、ピン止めの動き（既定 `each`。ボタンの `aria-label` は `each` なら `「{列名}」の列をピン止め`、`through` なら `「{列名}」の列までピン止め`）
    returns:
      type: '{ header: string; drawer: string }'
      description: 見出しの中身とドロワー（絞り込みが無ければ空）
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_table_tools
        case: 正常
        summary: 値を選ぶドロワーとボタンを返却する
        condition: '`features: [sort, pin, filter]`、`filter: { kind: select, values: ["りんご", "みかん"] }`、列名 `名前`'
        mock: なし
        expected: '`header` に `mdmark-sort`・`mdmark-filter`（`aria-label="「名前」で絞り込む"`）・`mdmark-pin`（`hidden`）、`drawer` に `hidden` の `mdmark-filter-drawer`・候補の検索欄・2 つのチェックボックス・`絞り込みを解除`'
      - name: test_render_table_tools_when_not_sortable
        case: 正常
        summary: sortable が false の列は並べ替えのボタンにせず、ほかのボタンは付ける
        condition: '`features: [sort, pin, filter]`、`sortable: false`、`filter: { kind: text }`、列名 `説明`'
        mock: なし
        expected: '`header` に `mdmark-sort` が無く、`<span class="mdmark-th-label">説明</span>`・`mdmark-filter`・`mdmark-pin` がある'
      - name: test_render_table_tools_when_date
        case: 正常
        summary: 日付のドロワーは開始日と終了日の欄を持つ
        condition: '`filter: { kind: date }`'
        mock: なし
        expected: '`drawer` に `開始日`・`終了日` の `<input type="date">` がある'
      - name: test_render_table_tools_when_resize
        case: 正常
        summary: '`resize` の機能を持つ列の見出しに、列の幅のつまみを出す'
        condition: '`features: [sort, resize]`、列名 `名前` と、`features: [sort]`'
        mock: なし
        expected: 1 つ目の `header` の末尾に `<span class="mdmark-col-resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="「名前」の列の幅">` があり、2 つ目の `header` に `mdmark-col-resize` が無い
      - name: test_render_table_tools_when_pin_mode
        case: 正常
        summary: ピン止めのボタンの名前をピン止めの動きで切り替える
        condition: '`features: [pin]`、列名 `名前`、`pinVisible: true`、`pinPressed: true` で、`pinMode` を省いたものと `through`'
        mock: なし
        expected: 1 つ目の `mdmark-pin` が `aria-label="「名前」の列をピン止め"`、2 つ目が `aria-label="「名前」の列までピン止め"` で、どちらも `aria-pressed="true"`
      - name: test_render_table_tools_when_unpinned
        case: 正常
        summary: 見えている幅に収まらず留まっていない列のボタンに、留まっていないことを付ける
        condition: '`features: [pin]`、列名 `名前`、`pinVisible: true`、`pinPressed: true`、`pinUnpinned: true` と、`pinUnpinned` を省いたもの'
        mock: なし
        expected: 1 つ目の `mdmark-pin` が `is-unpinned` を持ち、`aria-label` と `title` が `「名前」の列をピン止め（表の幅に収まらないため留まっていません）`、`aria-pressed="true"`。2 つ目は `is-unpinned` を持たず、`aria-label` が `「名前」の列をピン止め`
  - name: renderTableBar
    title: 表の上の帯とテーブル設定のパネルを描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: '`count`・`columns`・`reorder`・`total`・`copy` のうち付けた機能の帯（件数・テーブル設定のアイコンだけのボタン（`settings-2`。隠した列の数のバッジと、隠した列があるとき `テーブル設定（{数} 列を非表示）` の `aria-label`）・`集計`・`表をコピー` と、スクリーンリーダーに使用する `role="status"` の `mdmark-table-status`）と、テーブル設定のパネル（`renderTableSettings`）・集計のメニュー（タイトル `表示する集計` と、集計する計算の `value` を持つチェックボックス）・コピーの形式のメニュー（`Markdown の表`・`TSV` の形式の名前と用途）の HTML を返却する。`集計` のボタンは出さない計算があれば `is-active` にし、スクリーンリーダー向けの名前に `（{隠している数} 件を非表示にしています）` を加える。テーブル設定と `表をコピー` のボタンは class `is-icon-only` でアイコンだけを見せ、`title` を持つ。`表をコピー` は `mdmark-visually-hidden` のスクリーンリーダー向けの名前（`copyState` の文言）を持つ。列を隠しているときはテーブル設定のボタンに `is-active` を付ける。アイコンは lucide の `settings-2`・`sigma`・`copy`・`check`・`circle-alert`・`chevron-down`（`sigma` は `src/parts/icons.ts` に追加する）。`mount` が描いた表に追加するのにも使用する'
    args:
      - name: options
        type: '{ id: string; features: string[]; labels: string[]; shown: number; total: number; hiddenColumns: number[]; openColumns?: boolean; copyState?: "idle" | "copied" | "failed"; totals?: TotalCalc[]; shownTotals?: TotalCalc[]; openTotals?: boolean; openCopy?: boolean }'
        required: true
        description: メニューの id の頭、機能、列名、表示している行の数、全ての行の数、隠している列、テーブル設定のパネルを開いているか、コピーのボタンの状態、表が持つ集計の計算、出している計算（既定は `totals` の全て）、集計のメニューを開いているか、コピーの形式のメニューを開いているか
    returns:
      type: '{ bar: string; menus: string }'
      description: 帯と、テーブル設定のパネル・集計・コピーの形式のうち付けた機能のメニューをつないだもの（該当する機能が無ければ空）
    unit_tests:
      - name: test_render_table_bar
        case: 正常
        summary: 件数とテーブル設定とコピーの帯を返却する
