id: MOD-472-45
visibility: internal
title: ライブラリ本体 / 設定を重ねて読み込む
lead: 端末の設定と、起点のフォルダから上のフォルダの `mdmark.config.yaml` を探して重ねる処理。CLI・MCP のツール・VS Code 拡張機能が同じ関数を呼ぶ。
diagrams:
  - name: 全体
    diagram: |-
      <!-- map -->

      ```mermaid
      flowchart LR
        n1["設定を重ねて読み込む"]
        n2["端末の設定のパスを決める"]
        n3["上のフォルダの設定ファイルを探す"]
        n4["設定の構造を検める"]
        n5["相対パスを絶対パスにする"]
        n6["設定を重ねる"]
        n1 -.-> n2
        n1 -.-> n3
        n1 -.-> n4
        n1 -.-> n5
        n1 -.-> n6
      ```

      <!-- /map -->
notes:
  配置場所: '`src/config-files.ts` は `node:path`・`yaml`（YAML として読み込む）・`src/cli/alias-schema.ts`（`aliases` の行の検め。ajv の Schema をまとめる）だけを import し、`CliError` など CLI だけの型には依存しない。

    ファイルの読み取りと有無の確認は引数で受ける。

    設定の構造を検める `validateConfig` とそれが使用する `schemaIssue`・`validateBuild`・`validateCheck`・`isValid*` は `src/cli/config.ts` からこのファイルへ移し、`src/cli/config.ts` はこのファイルから import する。

    CLI（`src/cli/`）・MCP（`src/plugin/`）と、esbuild でまとめる VS Code 拡張機能（`vscode/src/`）の両方から import する。

    配布物（ブラウザ）の入口からは import しない'
  ディレクトリ: |-
    ```text
    src/
    └── config-files.ts   # loadLayeredConfig・resolveSettingsPath・findConfigChain・mergeConfigs・absolutizeConfigPaths・displayConfigPath
    ```
tags:
  - name: topic:設定
    main: true
  - name: action:読み込み
