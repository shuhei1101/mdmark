id: MOD-472-228
visibility: internal
title: ライブラリ本体 / 操作 / tables.ts
test_files:
  - tests/unit/src/interact/tables.browser.test.ts
functions:
  - name: attachTables
    title: 表に操作を付ける
    container: src/interact/tables.ts
    kind: 関数
    scope: internal
    summary: 表を横にスクロールさせるのは表を包む `div.mdmark-table-scroll` で、ピン止めを適用するはみ出しはその要素の `scrollWidth` と `clientWidth` で決める。列の表示を切り替えるたびに、テーブル設定のボタンの隠した列の数のバッジ（`span.mdmark-table-tool-badge`。0 列なら `hidden` にする）・`is-active`・`aria-label` を書き換える。コピーの結果はボタンの `title` とスクリーンリーダー向けの名前を書き換えて示す。各 `mdmark-table` の `data-features`・`data-filter`・`data-hide`・`data-total`・`data-pin`・`data-unpin` を読み込み、見出しに `renderTableTools` のボタンとドロワーを配置して、並べ替え・ピン止め・絞り込みを付ける。`count`・`columns`・`reorder`・`total`・`copy` の表は `renderTableBar` の帯とメニュー（テーブル設定の一覧を分ける留めた列の数は `data-pin` がある表だけ数え、無い表は 0）を、`columns`・`reorder` の表は `attachTableSettings` でテーブル設定を、`data-tree` の表は `attachTableTree` で階層の操作を、`total` の表は `renderTotalRows` の集計の行を配置し、`rowlink` の表は行へ移る処理と行の URL のコピーを付け、`resize` の表は `attachColumnResize` で列の幅のつまみの操作を付ける。全ての表に、`attachAutoColumnWidths` で列の幅を自動で決める処理を付ける。`thead` が複数の行を持つ表は `bottomHeadCells` で列ごとの最下段の見出しのセルを決め、ボタンをそのセルにだけ配置し、列の位置はそのセルの列で数える（`cellIndex` を使用しない）。`data-merge-columns` の表は、並べ替え・絞り込みのたびに、表示している本文の行のその列の値から `mergeSpans` で結合を決め、始まりのセルに `rowspan` と `is-merged`、続くセルに `hidden` をもう一度付ける。結合で隠したセルも値を持つセルとして並べ替え・絞り込み・コピー・集計に使用する。囲み・表から探す部品の要素（ピン止めのボタン・ドロワー・行の詳細の行など）は、`closest(".mdmark-table")` がその囲みのものだけにし、行の詳細の中の表の要素を取得しない。受け取り（`click`・`change`・`input`・`keydown`）は、対象の `closest(".mdmark-table")` がその囲みのときだけ処理する
    description: |-
      並べ替えは降順 → 昇順 → 元の並び（描いたときの順を行に記録する）を繰り返し、`th` の `aria-sort` を付与・解除する。行の詳細の行はその行に付いて動かす。ピン止めのボタンは `ResizeObserver` で表がはみ出すときだけ出し、留める列の位置の集まり（付けたときは `initialPinnedColumns`、ボタンを押すと `togglePinnedColumn`）のセルに、表がはみ出す間だけ `position: sticky` と `pinOffsets` の `left`（`each` は `right` も）を適用する（はみ出さない間は留めず、留める列は記録したまま）。列の幅は見出しの列ごとのセルの `offsetWidth`（隠した列は 0）で測る。ボタンの `aria-pressed` は、`each` は留めた列、`through` は留めた最も右の列だけを `true` にする。境の線は、表を包む要素の `scroll` と留める列を変えるたびに、左端に留まっている最も右の列のセルに `is-pinned-edge`、右端に留まっている最も左の列のセルに `is-pinned-edge-end` を付ける（留まっているかは列の元の位置と `scrollLeft`・`clientWidth`・`pinOffsets` で決める）。`thead` が複数の行を持つ表の見出しのセルは、またぐ列が全て留める列のときだけ留め、`left` は最初の列、`right` は最後の列の値にする。セルの値は `cellValue` で読み込む（`data-check` の列は `data-value`）。絞り込みのドロワーは `hidden` と `aria-expanded` で開閉し、同時に 1 つだけ開く。開いたら最初の入力欄へフォーカスを移し（スマホでもボタンの押下の処理の中で移す）、開いている間だけ `document` の `pointerdown`（外を押す）と `keydown`（Esc）を受け取る。「絞り込みを解除」はその列の入力を空にして絞り込みをもう一度適用する（ドロワーの中の押下を外の押下として扱わない）。列ごとの絞り込みは `matchesFilter` で重ねて当て、合わない行に `hidden` を付ける。

      件数と集計の行は、絞り込みを適用するたびに、行の詳細・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行から再作成する（集計は `computeTotal`）。集計の行は計算ごとの 1 行で、付けたときに全ての本文の行から `findUnreadableTotals` で数として読み込めないセルを持つ列と計算を記録し、そのセルは再作成しても空にする。`集計` のボタンのメニュー（`表示する集計`）のチェックボックスに合わせて計算の行の `hidden` を切り替え、ボタンの `is-active` とスクリーンリーダー向けの名前を書き換え、`{計算の名前}の行を出しました`・`{計算の名前}の行を隠しました` を帯の `mdmark-table-status` に入れる（選択は覚えない）。テーブル設定のパネル・集計のメニュー・コピーの形式のメニューは絞り込みのドロワーと同じ開閉の受け取りを使用する（同時に開くのはドロワーとパネル・メニューを合わせて 1 つ）。列の表示と順の切り替え（テーブル設定のパネルの目のアイコンとつまみ）は `attachTableSettings` に任せ、切り替えても列の幅は決め直さない。ピン止めの左端からの位置は隠した列を除いてもう一度測る。`onColumnsChange` を指定したときは、`attachTableSettings` が目のアイコンで列の表示を切り替えた後に、`{ tableIndex, hidden }` で 1 回呼ぶ。`tableIndex` は付けたときに `root` の中の `columns` の表（`.mdmark-diff-block[data-kind="del"]` の中の表を除く）を文書の順に並べた位置、`hidden` は隠している列の見出しのセルの `visibleText` を列の順に並べた新しい配列。例外を投げたら、`onColumnsChange` と元のエラーを `console.error` に出して続ける。

      コピーは形式のボタンの `data-format` で、見出しの行と、行の詳細・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行と階層の表の畳んで隠した行（補った行 `is-virtual` を除く）の、テーブル設定で隠していない列の `visibleText`（階層の表のキーの列は行の `data-path`）を `tableToMarkdown` か `tableToTsv` にして `copyText` で書き込む。書き込めたらボタンを `copied` にして 2 秒で `idle` に戻し、`{形式の名前}をコピーしました` を `mdmark-table-status` に入れる。書き込めなければボタンを `failed` にし、前のパネルを取り除いてから帯の直後に `renderCopyPanel` のパネルを配置し、`textarea` へフォーカスを移して `select()` し、`クリップボードにコピーできませんでした。選択した{形式の名前}を手動でコピーできます` を入れる。パネルは閉じるボタンか、パネルの中の Esc で取り除き、フォーカスを `表をコピー` に戻す。

      行へ移る処理は、付けたときと `hashchange` で `rowIdFromHash` の ID を持つ行を探し、囲む閉じた `details` を開き（閉じたセクションは、`attachInteractions` が先に付けた `attachSections` が同じきっかけで開いている）、行が `hidden` ならその表の絞り込みを全て削除し、`scrollIntoView` してその行だけに `data-target` を付ける。行へのリンクのマーカーを押すと、移る動きはそのままにマーカーの `href` プロパティ（解決済みの絶対 URL）を `copyText` で記載し、描いたときにマーカーの横へ配置した `mdmark-row-link-notice` に `data-state` と文言（`リンクをコピーしました`・`リンクをコピーできませんでした`）を入れて 2 秒後に空に戻す。

      ピン止めは、`pinColumns` が選んだ列（`through` は押した列までの列）を今の列の並びで `fitPinnedColumns` に渡し、表を包む要素の `clientWidth` に収まる列だけを `pinOffsets` で留め、収まらない列のセルは `left`・`right` と `is-pinned-col` を外す。押した列のボタン（`each` はその列、`through` は最も右の列）が収まらない列なら、`aria-pressed` を `true` のまま `is-unpinned` を付け、`aria-label` と `title` に `（表の幅に収まらないため留まっていません）` を付ける（収まれば外す）。`pinColumns` は、ピン止めのボタン・描く先の要素の幅の変化・列の幅の変更・列の表示の切り替え・列の並べ替えのたびに呼ぶ。

      列の幅は、`attachColumnResize` に、列の幅の上限を返す関数（`columnWidthLimit` に、表を包む要素の `clientWidth`・はみ出しているか・列ごとの幅・`fitPinnedColumns` の `fitted`（実際に留まっている列）を渡す）と、幅を変えた後の処理と、幅を入れた後・測る前に `attachAutoColumnWidths` の `refresh` を呼ぶ関数を渡す。幅を変えた後と戻した後は、`refresh` で表の幅を列の幅の合計にし、留める列があれば `pinColumns` で留める位置と境の線をもう一度決める。

      列の幅を自動で決める処理は、囲みごとに `attachAutoColumnWidths` に、囲み・表を包む要素・最下段の見出しのセル・`longColumnMin` と、幅を入れた後に留める列があれば `pinColumns` を呼ぶ関数を渡して付ける。列の表示を切り替えた後は、戻り値の `columnsChanged` を呼ぶ。ピン止めのボタンを出すかのはみ出しは、幅を入れた後に測る。
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
      - name: options
        type: '{ onColumnsChange?: (event: MdmarkColumnsChange) => void; pinMode?: TablePinMode; longColumnMin?: number }'
        required: false
        description: 列の表示の通知と、ピン止めの動き（既定 `each`）と、長文の列の最小の幅（em。既定 `DEFAULT_LONG_COLUMN_MIN_EM`）
    returns:
      type: () => void
      description: ボタン・ドロワー・パネル・受け取り・`ResizeObserver`・タイマー・自動の列の幅を削除する関数
    side_effects: 表の DOM を書き換え、イベントと `ResizeObserver` を付ける
    callees:
      - 'MOD-472-218#functions[compareCells]'
      - 'MOD-472-218#functions[matchesFilter]'
      - MOD-472-315#functions[renderTableTools]
      - 'MOD-472-229#functions[visibleText]'
      - 'MOD-472-229#functions[cellValue]'
      - 'MOD-472-218#functions[findUnreadableTotals]'
      - 'MOD-472-218#functions[tableToMarkdown]'
      - 'MOD-472-232#functions[copyText]'
      - MOD-472-315#functions[renderCopyPanel]
      - MOD-472-347#functions[attachAutoColumnWidths]
      - 'MOD-472-218#functions[bottomHeadCells]'
      - 'MOD-472-218#functions[mergeSpans]'
      - 'MOD-472-218#functions[fitPinnedColumns]'
      - 'MOD-472-226#functions[attachColumnResize]'
      - 'MOD-472-218#functions[columnWidthLimit]'
    unit_tests:
      - name: test_attach_tables_when_sorted
        case: 正常
        summary: 3 回の押下で降順・昇順・元の並びになる
        condition: '`data` の表（値の列が `10`・`2`・`33`）の値の列の見出しを 3 回押す'
        mock: なし
        expected: '`33,10,2`・`2,10,33`・`10,2,33` の順で、`aria-sort` が `descending`・`ascending`・無し'
      - name: test_attach_tables_when_filtered
        case: 正常
        summary: ドロワーで絞って除外し、外の押下で閉じる
        condition: '`data-filter="0:select"` の表でボタンを押し、`りんご` を選び、「絞り込みを解除」を押し、表の外を押す'
        mock: なし
        expected: 開いた後に候補の検索欄にフォーカス、選んだ後に 1 行だけ、削除した後に全ての行とドロワーが開いたまま、外を押した後にドロワーが `hidden`
      - name: test_attach_tables_when_escape
        case: 正常
        summary: Esc で閉じてボタンへフォーカスを戻す
        condition: ドロワーを開いて Esc
        mock: なし
        expected: ドロワーが `hidden`、ボタンにフォーカス
      - name: test_attach_tables_when_pinned
        case: 正常
        summary: はみ出す表だけピン止めのボタンを出して先頭の列を既定で留め、押した列だけを留める
        condition: 幅 800px の要素（留める 1・3 列目が見えている範囲に収まる）に 10 列の表と 2 列の表、3 列目のピン止めを押し、もう一度押す
        mock: なし
        expected: 10 列の表だけボタンが `hidden` を持たない。付けた直後は 10 列の表の 1 列目のセルだけが `sticky` で 1 列目のボタンが `aria-pressed="true"`、2 列の表はどのセルも `sticky` でない。押した後は 1・3 列目のセルが `sticky` で 2 列目は `sticky` でなく、3 列目のセルの `left` が 1 列目のセルの `offsetWidth`、もう一度押した後は 1 列目のセルだけが `sticky`
      - name: test_attach_tables_when_pin_specified
        case: 正常
        summary: data-pin の列だけを留め、pin の無い表は留めず、幅が広がると留めを解除する
        condition: 幅 320px の要素に、`data-features="pin"`・`data-pin="1"` の 8 列の表と `data-features=""` の 10 列の表を付け、要素の幅を 2000px にする
        mock: なし
        expected: 付けた直後は 1 つ目の表の 2 列目のセルだけが `sticky` で 2 列目のボタンだけが `aria-pressed="true"`、2 つ目の表はピン止めのボタンが無くどのセルも `sticky` でない。2000px にした後は 1 つ目の表のどのセルも `sticky` でない
      - name: test_attach_tables_when_check_column
        case: 正常
        summary: 真偽値の列を data-value の値で並べ替え・絞り込み・コピーする
        condition: '`data-features="sort filter copy"`・`data-filter="1:select"`・`data-check="1"` の表（名前 `a`・`b`・`c`、必須の `td` が `data-value` の `true`・`false`・`true` と ✓ か `いいえ` の中身）で、必須の列を昇順に並べ、`true` に絞り、TSV でコピーする'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に差し替える'
        expected: 並べた後の名前が `b`・`a`・`c`、絞り込みの候補が `true`・`false`、絞った後は `a`・`c` の 2 行、`名前\t必須\na\ttrue\nc\ttrue` で 1 回呼ばれる
      - name: test_attach_tables_when_detached
        case: 正常
        summary: 削除すると document の受け取りが残らない
        condition: ドロワーを開いたまま削除する関数を呼ぶ
        mock: '`document.removeEventListener` を数える関数で包む'
        expected: '`pointerdown`・`keydown` が削除されている'
      - name: test_attach_tables_when_cell_has_term
        case: 正常
        summary: セルに用語の下線があっても、絞り込みの値の候補と見出しのボタンの名前にツールチップの文字を含めない
        condition: '`<!-- table: {"kind": "data", "columns": {"名前": {"filter": {}}}} -->` の表（列 `名前`・`値`、行 `マーカー`・`表`）と、`マーカー`・`名前` を入れた用語集の表を `mount` で描く'
        mock: なし
        expected: 絞り込みの値の候補が `["マーカー", "表"]`、見出しのボタンの名前が `名前` と `値`、`マーカー` のセルに用語の下線が残る
      - name: test_attach_tables_when_counted
        case: 正常
        summary: 絞り込みに合わせて件数と計算ごとの集計の行を再作成する
        condition: '`data-features="sort pin filter count total"`・`data-filter="0:text"`・`data-total="0:count 1:sum 2:avg"` の表（名前 `りんご`・`みかん`・`りんご飴`・`ぶどう`、数量 `10`・`2`・`33`・空、単価 `100`・`200`・`300`・`400`）を `りんご` で絞り込む'
        mock: なし
        expected: 絞り込む前は `4 / 4 件` と、`合計 45`・`平均 250`・`件数 4` の 3 行がこの順、後は `2 / 4 件` と `合計 43`・`平均 200`・`件数 2`、絞り込みを `存在しない` にした後は `0 / 4 件` と `合計 0`・`平均 —`・`件数 0`（`一致する行がありません` の行を数えない）
      - name: test_attach_tables_when_columns_toggled
        case: 正常
        summary: テーブル設定のパネルの目のアイコンで列を出し入れし、Esc でパネルを閉じる
        condition: '`data-features="sort pin filter columns total"`・`data-hide="1"`・`data-total="2:sum"` の 3 列の表で、テーブル設定のパネルを開き、目のアイコンで 2 列目を表示して 3 列目を隠し、Esc'
        mock: なし
        expected: 付けた直後は 2 列目の `th`・`td` が `hidden`、開いた後は 1 列目の目のアイコンが `disabled` で 2 つ目の目のアイコンにフォーカス、切り替えた後は 3 列目の `th`・`td`・集計のセルが `hidden` で 2 列目は `hidden` を持たない、Esc の後はパネルが `hidden` でテーブル設定のボタンにフォーカス
      - name: test_attach_tables_when_copied
        case: 正常
        summary: 形式のメニューで TSV を選び、表示している行と列をコピーして 2 秒でボタンを戻す
        condition: '`data-features="sort pin filter columns copy"`・`data-hide="1"`・`data-filter="0:text"` の表（列 `名前`・`説明`・`更新日`、名前 `りんご`・`みかん`・`りんご飴`、更新日 `2026-10-01`・`2026-10-10`・`2026-10-20`）を `りんご` で絞り、`表をコピー` を押して `TSV` を押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: '`表をコピー` を押した後に形式のメニューが `hidden` を持たず、`TSV` を押した後にメニューが `hidden` でフォーカスが `表をコピー`。`名前\t更新日\nりんご\t2026-10-01\nりんご飴\t2026-10-20` で 1 回呼ばれ、ボタンが `data-state="copied"`、`mdmark-table-status` が `TSVをコピーしました`、2 秒進めると `idle`'
      - name: test_attach_tables_when_copy_denied
        case: 正常
        summary: 拒まれたら手動でコピーするパネルを出し、Esc で閉じる
        condition: '`data-features="copy"` の表で `表をコピー` を押して `Markdown の表` を押し、パネルの中で Esc'
        mock: '`navigator.clipboard.writeText` を `NotAllowedError` で拒む関数に、時計を偽の時計に差し替える'
        expected: ボタンが `data-state="failed"` で 2 秒進めても変わらず、帯の直後に `mdmark-copy-panel` があり、`textarea` にフォーカスがあって中身が全て選ばれ、`mdmark-table-status` が `クリップボードにコピーできませんでした。選択したMarkdown の表を手動でコピーできます`。Esc の後はパネルが無くフォーカスが `表をコピー`。`unhandledrejection` が起きない
      - name: test_attach_tables_when_row_linked
        case: 正常
        summary: '#ID が指す行を開いて強調し、hashchange で移す'
        condition: 閉じた `details` の中の `rowlink` の表（`id` `みかん` の行）と、`data-filter="0:text"` で `ぶどう` に絞った `rowlink` の表（`id` `もも` の行）を描いた要素で、`#みかん` のまま付け、`#もも` にし、`#/a.md#%E3%81%BF%E3%81%8B%E3%82%93` にする
        mock: なし
        expected: 付けた後は `details` が `open` で `みかん` の行だけ `data-target`、`#もも` の後は 2 つ目の表の行が全て `hidden` を持たず `もも` の行だけ `data-target`、`#/a.md#…` の後は `みかん` の行だけ `data-target`
      - name: test_attach_tables_when_copied_markdown
        case: 正常
        summary: Markdown の表の形式で写す
        condition: '`data-features="copy"` の表（列 `名前`・`式`、行 `a`・`x | y`）で `表をコピー` を押して `Markdown の表` を押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に差し替える'
        expected: '`| 名前 | 式 |\n| --- | --- |\n| a | x \| y |` で 1 回呼ばれ、`mdmark-table-status` が `Markdown の表をコピーしました`'
      - name: test_attach_tables_when_totals_unreadable
        case: 正常
        summary: 数として読み込めないセルを持つ列の合計と平均は、絞り込んでも空のままにする
        condition: '`data-features="sort pin filter total"`・`data-filter="0:text"`・`data-total="1:sum 1:avg 1:count"` の表（名前 `りんご`・`みかん`、数量 `10`・`約 3`）を `りんご` で絞り込む'
        mock: なし
        expected: 絞り込む前も後も合計と平均の行の数量のセルが空で、件数の行は `2`・`1`
      - name: test_attach_tables_when_totals_toggled
        case: 正常
        summary: 集計のメニューで計算の行を隠して出し、スクリーンリーダーで通知する
        condition: '`data-features="total"`・`data-total="1:sum 1:avg"` の表で `集計` を押し、`平均` のチェックを解除し、もう一度入れ、Esc'
        mock: なし
        expected: 開いた後はメニューが `hidden` を持たず最初のチェックボックスにフォーカス、削除した後は平均の行が `hidden` でボタンが `is-active`・スクリーンリーダー向けの名前に `（1 件を非表示にしています）`・`mdmark-table-status` が `平均の行を隠しました`、もう一度入れた後は平均の行が `hidden` を持たず `平均の行を出しました`、Esc の後はメニューが `hidden` で `集計` にフォーカス
      - name: test_attach_tables_when_row_link_copied
        case: 正常
        summary: 行へのリンクのマーカーを押すと行の絶対 URL をコピーし、通知を 2 秒出す
        condition: '`rowlink` の表（`id` `みかん` の行）で、その行のマーカーを押す。もう 1 つの表では書き込みを拒む'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数（1 つ目）と `NotAllowedError` で拒む関数（2 つ目）に、時計を偽の時計に差し替える'
        expected: 1 つ目は `location.href` の `#` より前に `#%E3%81%BF%E3%81%8B%E3%82%93` を続けた URL で呼ばれ、マーカーの横の `mdmark-row-link-notice` が `data-state="copied"` と `リンクをコピーしました`、2 つ目は `data-state="failed"` と `リンクをコピーできませんでした`。2 秒進めるとどちらも空で `data-state` を持たない。どちらも行が `data-target` を持つ
      - name: test_attach_tables_when_nested_table
        case: 正常
        summary: 行の詳細の中の表の要素を、親の表の操作が取得しない
        condition: 幅 320px の要素に、`data-features="sort pin filter"`・`data-filter="0:select"` の 10 列の親の表を付ける。1 行目の行の詳細の中に `data-features="pin filter"`・`data-filter="0:select"` の 2 列の表の囲みを配置し、`attachSections` の後に付ける。行の詳細は閉じたまま、付けた後に描く先の要素の幅を 300px に変えて `ResizeObserver` の呼び出しを待ち、さらに親の表の囲みの幅だけを 250px に変えて待ち、続けて親の表の 1 列目の絞り込みのボタンを押す
        mock: なし
        expected: 親の表のピン止めのボタンが `hidden` を持たず、中の表のピン止めのボタンが `hidden` を持つ。押した後に開くのは親の表の囲みの 1 列目のドロワーだけで、中の表のドロワーは `hidden` のまま。値の候補に中の表のセルの文字が無い。中の表の囲みに親の表のドロワーが配置されない
      - name: test_attach_tables_when_nested_table_sorted
        case: 正常
        summary: 行の詳細の中の表の並べ替えのボタンを押しても、親の表を並べ替えない
        condition: '`data-features="sort pin"` の 2 列の親の表（1 列目の値が上から `a`・`b`）を付ける。1 行目の行の詳細の中に `data-features="sort pin"` の 2 列の表の囲みを配置し、`attachSections` の後に付け、中の表の 1 列目の並べ替えのボタンを押す'
        mock: なし
        expected: 親の表の本文の行の並びが `a`・`b` のままで、親の表の見出しのセルが `aria-sort` を持たない。中の表の 1 列目の見出しのセルの `aria-sort` が `descending`
      - name: test_attach_tables_when_merged_sorted
        case: 正常
        summary: 最下段の見出しにボタンを配置し、並べ替え・絞り込みの後にもう一度結合する
        condition: インターフェース定義『文書を描く』の「正常系（結合した表を並べ替えて絞り込む）」の表
        mock: '`navigator.clipboard.writeText` を記録する関数'
        expected: ボタンが 2 行目の `th` にだけある。降順の後に分類のセルがどれも `rowspan` と `hidden` を持たない。`A` に絞り込んだ後に 1 行目の分類のセルが `rowspan="2"`。TSV の各行の分類が `A`
      - name: test_attach_tables_when_row_header_pinned
        case: 正常
        summary: 行見出しを持つはみ出す表を、描いた直後に行見出しの全ての列を留める
        condition: 幅 800px の要素（行見出しの 2 列が見えている範囲に収まる）に、`header.columns` が 2 の 10 列 5 行の表
        mock: なし
        expected: 1・2 列目のピン止めのボタンが `aria-pressed="true"`、1・2 列目のセルの `position` が `sticky`、3 列目は `sticky` でない
      - name: test_attach_tables_when_tree_copied
        case: 正常
        summary: 階層の表のコピーに畳んだ行を含め、キーを全体のパスで記載し、補った行を含めない
        condition: '`data-tree="0"` の表（キーは `features.table`・`aliases[].id`）で `aliases[]` を畳み、Markdown の表でコピーする'
        mock: '`navigator.clipboard.writeText` を代役にする'
        expected: '記載した文字の本文の行が `features.table`・`aliases[].id` の 2 行で、キーのセルが全体のパスのまま。`features`・`aliases[]` の行が無い'
      - name: test_attach_tables_when_columns_notified
        case: 正常
        summary: 列の表示を切り替えるたびに、表の番号と隠している列の見出しで通知する
        condition: '`data-features="columns"` の表を 3 つ（1 つ目は `div.mdmark-diff-block[data-kind="del"]` の中、2 つ目は `data-hide="2"`、3 つ目は列 `名前`・`状態`・`説明`）付け、3 つ目の表のテーブル設定のパネルで `状態` の目のアイコンを押して隠し、もう一度押して表示する'
        mock: '`onColumnsChange` は引数を記録する関数'
        expected: '付けた時点では呼ばれない。隠した後に `{ tableIndex: 1, hidden: ["状態"] }`、戻した後に `{ tableIndex: 1, hidden: [] }` で、合わせて 2 回呼ばれる'
      - name: test_attach_tables_when_columns_callback_throws
        case: 異常
        summary: 通知が例外を投げても列の表示を切り替える
        condition: '`data-features="columns"` の表で 2 列目のチェックを解除する'
        mock: '`onColumnsChange` は例外を投げる。`console.error` を記録する'
        expected: 2 列目の `th`・`td` が `hidden` を持ち、`console.error` に `onColumnsChange` と投げたエラー
      - name: test_attach_tables_when_columns_badge
        case: 正常
        summary: 列の表示を切り替えるたびにバッジとスクリーンリーダー向けの名前を書き換える
        condition: '`data-features="columns"`・`data-hide="1"` の 3 列の表で、2 列目を表示し、次に 2 列目と 3 列目を隠し、3 列目を表示する'
        mock: なし
        expected: 付けた直後はバッジ `1` と `aria-label` が `テーブル設定（1 列を非表示）`。表示した後はバッジが `hidden` で `is-active` を持たず、`aria-label` が `テーブル設定`。隠した後はバッジ `2`。3 列目を表示した後はバッジ `1`
      - name: test_attach_tables_when_scroll_wrapper
        case: 正常
        summary: 包む要素がはみ出す間だけピン止めを適用する
        condition: 幅 1000px の要素に、`div.mdmark-table-scroll` で包んだ 2 列の `data` の表と 12 列の `data` の表
        mock: なし（Chromium）
        expected: 2 列の表はピン止めのボタンが `hidden` で、`table` の幅が包む要素の幅より狭く（列の幅の合計で描く）、包む要素が横にスクロールしない。12 列の表はピン止めのボタンが `hidden` を持たず、包む要素の `scrollWidth` が `clientWidth` より大きい
      - name: test_attach_tables_when_pinned_at_end
        case: 正常
        summary: 留めた列より左を表示している間は、留めた列を右端に並べて留める
        condition: 幅 800px の要素（既定で留める先頭の列と 8・9 列目が見えている範囲に収まる）に 10 列の表、右端までスクロールして 8・9 列目のピン止めを押し、左端までスクロールする
        mock: なし
        expected: 8 列目のセルの `right` が 9 列目のセルの `offsetWidth`、9 列目のセルの `right` が `0px`。左端に戻した後、表を包む要素の右端と 9 列目のセルの右端がそろい、8 列目のセルが `is-pinned-edge-end` を持ち、9 列目は持たない
      - name: test_attach_tables_when_pinned_through
        case: 正常
        summary: '`pinMode: through` の表は押した列までを左端に留め、押した列のボタンだけを押した状態にする'
        condition: '幅 800px の要素（1〜3 列目の幅の合計が見えている範囲に収まる）に 10 列の表を `pinMode: "through"` で付け、3 列目のピン止めを押し、もう一度押す'
        mock: なし
        expected: 押した後は 1〜3 列目のセルが `sticky` で `right` が空、3 列目のボタンだけが `aria-pressed="true"`、ボタンの `aria-label` が `「{列名}」の列までピン止め`。もう一度押した後はどのセルも `sticky` でない
      - name: test_attach_tables_when_pinned_exceed_visible_width
        case: 正常
        summary: 見えている幅に収まらない選んだ列は留めず、ボタンを留まっていない状態にし、幅が広がれば再び留める
        condition: 幅 390px の要素（留める列が 2 列までしか収まらない）に、どの列も同じ長さの値の 10 列の表を付け、3 列目と 9 列目のピン止めを押し、要素の幅を 800px にし、390px に戻す
        mock: なし
        expected: '押した後、1・3 列目のセルが `sticky` で、9 列目のセルは `sticky` でなく `left`・`right` が空、9 列目のボタンが `aria-pressed="true"`・`is-unpinned` で `aria-label` と `title` が `「{列名}」の列をピン止め（表の幅に収まらないため留まっていません）`。800px にした後、9 列目のセルが `sticky` でボタンが `is-unpinned` を持たない。390px に戻した後、9 列目が再び `sticky` でなくボタンが `is-unpinned` を持つ'
      - name: test_attach_tables_when_pinned_through_exceed_visible_width
        case: 正常
        summary: '`through` の表は、押した列までのうち収まる列だけを留め、押した列のボタンを留まっていない状態にする'
        condition: '幅 390px の要素に同じ 10 列の表を `pinMode: "through"` で付け、3 列目のピン止めを押す'
        mock: なし
        expected: 1・2 列目のセルが `sticky` で、3 列目のセルは `sticky` でない。3 列目のボタンだけが `aria-pressed="true"`・`is-unpinned` で、`aria-label` が `「{列名}」の列までピン止め（表の幅に収まらないため留まっていません）`
      - name: test_attach_tables_when_resized_with_unpinned
        case: 正常
        summary: 留まっていない列があるとき、列の幅の上限は実際に留まっている列だけを引き、列を狭めて収まれば再び留める
        condition: '幅 390px の要素に `data-features="pin resize"` の 10 列の表を付ける。1・9 列目は 2 文字の値で列の最小幅（6em）になり、3 列目は `mdmark-wide` で折り返さない 30 文字の値を持つ（1・3・9 列目の幅の合計が見えている幅を超え、3 列目を最小幅にすると収まる）。3 列目と 9 列目のピン止めを押し、3 列目のつまみにフォーカスして、← キーを `aria-valuenow` が `aria-valuemin` になるまで押す'
        mock: なし
        expected: ← キーの前、1・3・9 列目の `th` の `offsetWidth` の合計が表を包む要素の `clientWidth` より大きく、9 列目のボタンが `is-unpinned` を持ち、3 列目のつまみの `aria-valuemax` が `clientWidth` から 1 列目の `th` の `offsetWidth` を引いた値（9 列目の幅は引かない。切り捨て）。最小幅まで狭めた後、1・3・9 列目の `th` の `offsetWidth` の合計が `clientWidth` 以下で、9 列目のセルが `sticky` でボタンが `is-unpinned` を持たない
      - name: test_attach_tables_when_pinned_under_merged_header
        case: 正常
        summary: 結合した見出しの下の 1 列だけを留めると、結合したセルは留めない
        condition: 幅 800px の要素（留める `名前`・`既定` が見えている範囲に収まる）に、1 行目が `名前`・`設定`（3 列）・`備考`、2 行目が `名前`・`型`・`既定`・`必須`・`備考` の表を付け、`既定` のピン止めを押す
        mock: なし
        expected: '`既定` の 2 行目の `th` と本文の `td` が `sticky` で `left` が `名前` のセルの `offsetWidth`、1 行目の `設定` の `th` は `sticky` でない'
      - name: test_attach_tables_when_column_resized
        case: 正常
        summary: '`resize` の表は、留めた列の幅を変えると留める位置を計算し直し、上限で止める'
        condition: 幅 320px の要素に `data-features="pin resize"` の、列名が短く留めた 1 列目と 3 列目の幅の合計が見えている幅に収まる 10 列の表を付け、3 列目のピン止めを押し、1 列目のつまみで → キーを押し、続けて 1 列目のつまみを 2000px 右へドラッグする
        mock: なし
        expected: → キーの後、3 列目のセルの `left` が 1 列目の `th` の `offsetWidth`。ドラッグの後、1 列目の `th` の `offsetWidth` が表を包む要素の `clientWidth` から 3 列目の `th` の `offsetWidth` を引いた値以下で、つまみの `aria-valuenow` と `aria-valuemax` が同じ。続けて 3 列目のつまみにフォーカスすると、その `aria-valuemax` が表を包む要素の `clientWidth` から 1 列目の `th` の `offsetWidth` を引いた値（切り捨て）
      - name: test_attach_tables_when_resize_off
        case: 正常
        summary: '`resize` を持たない表には、つまみの操作を付けない'
        condition: '`data-features="sort pin"` の表を付ける'
        mock: なし
        expected: '`mdmark-col-resize` が無い'
      - name: test_attach_tables_when_auto_width
        case: 正常
        summary: 狭い幅でも最終列を畳まず、列の幅を自動で決めてから、はみ出す表にピン止めを付ける
        condition: 幅 390px の要素に、名前・状態・説明（どの行も 1 行に収まらない長文の列。`data-long="2"`）の 3 列 3 行の表を付ける
        mock: なし
        expected: 表が `data-auto-width` を持ち、説明の列のセルが表示され、どの行にも開閉のボタンと `mdmark-fold-col` が無い。表を包む要素の `scrollWidth` が `clientWidth` より大きく、先頭の列が留まっている
      - name: test_attach_tables_when_resized_refreshes_width
        case: 正常
        summary: つまみで列の幅を変えた後と戻した後に、列の幅を決め直す
        condition: '`test_attach_tables_when_auto_width` の表を幅 1280px で付け、名前の列のつまみで → を 2 回押し、Enter を押す'
        mock: なし
        expected: → の後、表の `--mdmark-auto-table-width` が名前の列の広げた幅を含む合計で、名前の列の `--mdmark-auto-width` が無い。Enter の後、名前の列に `--mdmark-auto-width` が入り直す
      - name: test_attach_tables_when_column_hidden_keeps_widths
        case: 正常
        summary: 列を隠しても、残った列の幅を変えない
        condition: '`test_attach_tables_when_auto_width` の表に `columns` の機能を付けて幅 1280px で付け、テーブル設定の目のアイコンで状態の列を隠す'
        mock: なし
        expected: 残った名前・説明の列の見出しのセルの `offsetWidth` が隠す前と同じ（差が 1px 以内）
