id: MOD-472-242
visibility: internal
title: ライブラリ本体 / 操作 / wide.ts
test_files:
  - tests/unit/src/interact/wide.browser.test.ts
functions:
  - name: attachWideToggles
    title: wide の範囲の切り替えを付ける
    container: src/interact/wide.ts
    summary: '`div.mdmark-wide-range` の直前に部品『wide の範囲』の帯とボタンを配置し、押すたびに `data-state` と `aria-pressed` を入れ替える。広げられる幅（右側の目次が本文の右に並ぶときは描く先の要素の内側から目次を除いた幅、それ以外は描く先の要素の親の内側の幅。どちらも画面の幅まで）を描く先の要素と親の `ResizeObserver` で確認して、本文の幅以下なら帯を隠す。広い幅の `hover` でピン止めしていない右側の目次があるときは、範囲の右端を右端の線の左までに収める CSS 変数を範囲に入れる'
    kind: 関数
    scope: internal
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描く先の要素
    returns:
      type: () => void
      description: 削除する関数
    side_effects: 描く先の要素の子を追加し、`click` と `ResizeObserver` を付ける
    callees:
      - MOD-472-338#functions[renderWide]
    unit_tests:
      - name: test_attach_wide_toggles
        case: 正常
        condition: '`data-state="wide"` と `narrow` の範囲を持つ要素'
        expected: それぞれの直前に `aria-pressed` が `true`・`false` のボタンがあり、1 つ目を押すと `data-state="narrow"`・`aria-pressed="false"` になる
        mock: なし（ブラウザ）
        summary: ボタンを配置して状態を入れ替える
      - name: test_attach_wide_toggles_when_narrow_host
        case: 正常
        condition: 描く先の要素の親の幅を本文の幅以下にする
        expected: 帯が `hidden` を持つ
        mock: なし（ブラウザ）
        summary: 狭い幅では帯を隠す
