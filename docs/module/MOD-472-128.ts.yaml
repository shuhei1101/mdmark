id: MOD-472-128
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / index.ts
test_files:
  - tests/unit/src/map/index.browser.test.ts
data_models:
  - name: MapPartModule
    title: mapの部品のモジュール
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`dist/map.js` が export する関数'
    properties:
      - name: attachMap
        type: '(root: HTMLElement, config: ResolvedConfig, hooks?: MapHooks) => () => void'
        description: '`root` の中の `div.mdmark-map` を全て図にし、片付ける関数を返却する'
  - name: MapHooks
    title: mapの図から呼ぶ関数
    container: src/map/index.ts
    usecase: mermaidの図を描く
    role: データモデル
    summary: '`attachMap` に `mount` が指定する関数'
    properties:
      - name: resolveIdLink
        type: ResolveIdLink | undefined
        description: '`mount` の `resolveIdLink`。構成図のノードの `id:` のリンク先を URL に変える'
      - name: onNodeClick
        type: '((id: string) => void) | undefined'
        description: map の図のカスタム要素だけが指定する。構成図のノードの押下・Enter で、今の選択と強調に加えてノードの Mermaid の ID で呼ぶ。`mount` は指定しない
functions:
  - name: attachMap
    title: mapを付ける
    kind: 関数
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`root` の中の `div.mdmark-map` ごとに、種類で構成図・シーケンス図・ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図・マインドマップのどれかを付け、案内と再生をつなぎ、片付ける関数を返却する'
    scope: public
    callees:
      - MOD-472-130#functions[attachMapFlow]
      - MOD-472-131#functions[attachMapSequence]
      - MOD-531-3#functions[attachMapEr]
      - MOD-531-4#functions[attachMapState]
      - MOD-596-4#functions[attachMapClass]
      - MOD-596-5#functions[attachMapArchitecture]
      - MOD-596-6#functions[attachMapC4]
      - MOD-472-140#functions[parseMapArgs]
      - MOD-472-135#functions[collectMapProblems]
      - MOD-649-3#functions[attachMapMindmap]
      - MOD-653-3#functions[attachMapAxisGrid]
      - MOD-472-135#functions[collectPlainMapProblems]
    args:
      - name: root
        type: HTMLElement
        required: true
        description: '`mount` が描いた要素'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を適用した設定
      - name: hooks
        type: MapHooks
        required: false
        description: '`mount` の `resolveIdLink`'
    returns:
      type: () => void
      description: 付けた操作と観察を解除する関数
    process: |-
      1. `div.mdmark-map` ごとに `data-map-args` を `parseMapArgs` で読み取り、`data-map-kind`（`flowchart`・`sequenceDiagram`・`erDiagram`・`stateDiagram`・`classDiagram`・`architecture`・`C4Context`・`C4Container`・`C4Component`・`C4Dynamic`・`C4Deployment`・`mindmap`・`gantt`・`timeline`・`gitGraph`・`journey`・`block`）で `attachMapFlow`・`attachMapSequence`・`attachMapEr`・`attachMapState`・`attachMapClass`・`attachMapArchitecture`・`attachMapC4`・`attachMapMindmap`・`attachMapAxisGrid` のどれかに引数と一緒に指定する（`attachMapFlow`・`attachMapEr`・`attachMapState`・`attachMapClass`・`attachMapArchitecture`・`attachMapC4` には `hooks.resolveIdLink` も指定する）。`collapse` があれば図の枠を `details`（`open` は `collapse.open`、見出しは `collapse.title` か `title`）で包む
      2. 範囲ごとに `collectMapProblems`（`includeUnknownKeys: false`、`idLinks` は `resolve` と `hooks.resolveIdLink`。範囲が `data-map-annotations` を持てば、そのキーを定義のある注記の ID として指定する）から `collectMapStructure` の項目を除いた項目があれば、`render` の記載の警告に追加するか、無ければ図の枠の前に部品『書き方の警告』を配置する
      3. シーケンス図の補足の `plays_over` が指す構成図を探し、再生の強調を構成図にも適用する。片方の図で案内か再生を始めたら、もう片方の強調を解く。再生でメッセージへ移ったら構成図の `resumeFollow` と `follow` で、送り手と受け手のノードが収まる倍率と位置へ構成図を移す（構成図に無い相手のメッセージでは移さない）
      4. `data-map-plain` を持つ範囲は、mermaid の図に戻さずに手順 1 のとおり図を付ける。手順 2 の代わりに `collectPlainMapProblems` の項目（Mermaid の読み取れない行・閉じの無い `subgraph` と複合フラグメント）だけを、図の枠の前の記載の警告にする（許可しないリンク先はリンクを持たないノード、設定の `map.kinds` に無いクラスは種類を持たないノードで描き、警告にしない）
    unit_tests:
      - name: test_attach_map
        case: 正常
        summary: 構成図とシーケンス図
        condition: 2 つの `div.mdmark-map`
        mock: なし（jsdom）
        expected: '`figure.mdmark-diagram[data-diagram=map]` が 2 つになり、返却した関数で操作が解除される'
      - name: test_attach_map_when_collapse
        case: 正常
        summary: 折りたたみ
        condition: '`data-map-args` が `{"title":"全体","collapse":{"open":false}}`'
        mock: なし（jsdom）
        expected: 図の枠が `open` を持たない `details` に入り、`summary` の文字が `全体`
      - name: test_attach_map_when_problems
        case: 異常
        summary: 書き方の誤り
        condition: 読み取れない Mermaid の行と知らない補足のキー `layuot` を持つ範囲
        mock: なし（jsdom）
        expected: 図の枠の前の記載の警告が 1 つで、読み取れない行と `layuot` を含む
      - name: test_attach_map_when_annotation_undefined
        case: 異常
        summary: 補足の定義の無い注記の参照
        condition: '定義 `※[cond]` を持つ文書で、補足の `notes.mount.annotations` が `["cond", "gone"]` の範囲。同じ範囲を注記の機能をオフにして描いた文書'
        mock: なし（jsdom）
        expected: 図の枠の前の記載の警告が 1 つで `gone` を含み `cond` の警告を含まない。機能のオフの文書には記載の警告が無い
      - name: test_attach_map_when_missing_participant
        case: 正常
        summary: 構成図に無い再生の相手
        condition: '構成図と、`plays_over: 1` で構成図に無い参加者 `ghost` を持つシーケンス図'
        mock: なし（jsdom）
        expected: シーケンス図の図の枠の前の記載の警告に `ghost` がある
      - name: test_attach_map_when_played_follow
        case: 正常
        summary: 再生で構成図を移す
        condition: '構成図と `plays_over: 1` のシーケンス図で、シーケンス図の 1 つ目の区切りを押す。次に構成図の表示する枠でホイールを回してから、2 つ目の区切りを押す'
        mock: 構成図の表示する枠の `zoomControlOf` の `centerRect`
        expected: 1 つ目の区切りで構成図の `centerRect` を 1 回呼び、ホイールの後の 2 つ目の区切りでも `resumeFollow` で再開して呼ぶ
      - name: test_attach_map_when_plain
        case: 正常
        summary: 範囲の外の map の図は警告を出さない
        condition: '`data-map-plain` を持ち、`click A "javascript:alert(1)"` の行を持つ flowchart の範囲'
        mock: なし（jsdom）
        expected: '`figure.mdmark-diagram[data-diagram=map]` が 1 つで、記載の警告が無く、ノード A が `a.mdmark-diagram-node-link` を持たない'
      - name: test_attach_map_when_plain_styled
        case: 正常
        summary: 外観の指定と設定の行と読み取れない行を持つ範囲の外の図を map の図で描く
        condition: '`style A fill:#f9f` の行と `%%{init: {"theme": "forest"}}%%` の行を持つ `data-map-plain` の flowchart の範囲と、読み取れない行 `A -> ->` と設定の `map.kinds` に無いクラス `:::warn` を持つ `data-map-plain` の flowchart の範囲'
        mock: なし（jsdom）
        expected: どちらも `figure.mdmark-diagram[data-diagram=map]` になり `data-mdmark-mermaid` を持つ要素が無い。1 つ目のノード A の面が `#f9f` で記載の警告が無い。2 つ目の図の枠の前の記載の警告が読み取れない行の 1 件だけで、`warn` の項目を持たない
      - name: test_attach_map_when_mindmap
        case: 正常
        summary: マインドマップ
        condition: '`data-map-kind="mindmap"` の範囲と、`data-map-plain` を持ち `::icon()` の行を持つ mindmap の範囲'
        mock: なし（jsdom）
        expected: 1 つ目の範囲が `div.map-mindmap-item` を持つ図の枠になり、2 つ目の範囲も `div.map-mindmap-item` を持つ図の枠になり、`::icon()` の行の項目が無く、記載の警告が無い
      - name: test_attach_map_when_axis_grid
        case: 正常
        summary: 軸と格子の配置の図
        condition: '`data-map-kind` が `gantt`・`timeline`・`gitGraph`・`journey`・`block` の範囲と、`data-map-plain` を持ち読み取れない行を持つ gantt の範囲'
        mock: なし（jsdom）
        expected: 5 つの範囲がそれぞれの `data-map-kind` を持つ図の枠になり、読み取れない行の範囲も `gantt` の図の枠になり、図の枠の前の記載の警告に読み取れない行が 1 件ある
      - name: test_attach_map_when_id_link
        case: 正常
        summary: 'id: のノードのリンク先'
        condition: '`click A "id:SC-1"`・`click B "id:unknown"` の flowchart の範囲に、`id:SC-` だけを URL に変える `hooks.resolveIdLink` を指定する'
        mock: なし（jsdom）
        expected: A が `href` が URL の `a.mdmark-diagram-node-link` を持ち、B は持たず、図の枠の前の記載の警告に `B` と `id:unknown` がある
      - name: test_attach_map_when_class_id_link
        case: 正常
        summary: 'クラス図の id: のリンク先'
        condition: '`click A href "id:SC-1"`・`click B href "id:unknown"` の classDiagram の範囲に、`id:SC-` だけを URL に変える `hooks.resolveIdLink` を指定する'
        mock: なし（jsdom）
        expected: A が `href` が URL の `a.mdmark-diagram-node-link` を持ち、B は持たず、図の枠の前の記載の警告に `B` と `id:unknown` がある
      - name: test_attach_map_when_export
        case: 正常
        summary: 全ての種類に書き出すボタン
        condition: 構成図・シーケンス図・ガントチャートの範囲を持つ文書
        mock: なし（Chromium）
        expected: 3 つの範囲に `[data-tool="export"]` があり、`[data-tool="list"]` は構成図とシーケンス図だけにある。片付けた後は書き出すボタンを押しても `aria-expanded` が変わらない
      - name: test_attach_map_when_node_clicked
        case: 正常
        summary: onNodeClick を指定するとノードの押下で呼ぶ
        condition: ノード `api`・`db` の flowchart の範囲に `hooks.onNodeClick` を指定し、`api` のノードと線を押す
        mock: '`onNodeClick` を記録する関数'
        expected: '`onNodeClick` が `api` で 1 回だけ呼ばれ、線の押下では呼ばれない'
    refs:
      - IF-472-35#constraints[範囲の外の map の図の設定の行と見た目を指定する行]
      - IF-472-35#constraints[範囲の外の map の図に付く操作]
    notes:
      書き出し: '範囲ごとに `attachMapExport` を文書の中の map の番号（`data-map`）と今の図の枠のタイトル（`figcaption` の題名。プレーンの map の図の種類の名前はタイトルとして扱う）で付け、片付ける関数を返却する片付けで呼ぶ。全ての種類の map の図が `renderDiagramFrame` に `exportable: true` を指定する'
lead: 'map の部品のモジュールのエントリーポイントを受け持ち、map の図の付け方を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
