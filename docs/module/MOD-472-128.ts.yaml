id: MOD-472-128
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / index.ts
test_files:
  - tests/unit/src/map/index.browser.test.ts
data_models:
  - name: MapPartModule
    title: mapの部品のモジュール
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`dist/map.js` が export する関数'
    properties:
      - name: attachMap
        type: '(root: HTMLElement, config: ResolvedConfig, hooks?: MapHooks) => () => void'
        description: '`root` の中の `div.mdmark-map` を全て図にし、片付ける関数を返す'
  - name: MapHooks
    title: mapの図から呼ぶ関数
    container: src/map/index.ts
    usecase: mermaidの図を描く
    role: データモデル
    summary: '`attachMap` が範囲の外の map の図を mermaid の図に戻したときに呼ぶ関数'
    properties:
      - name: restoreMermaid
        type: '(blocks: HTMLElement[]) => void'
        description: 戻した mermaid のコードブロック（`data-mdmark-mermaid` を持つ要素）を指定して呼ぶ。`mount` が mermaid の図を付ける
      - name: resolveIdLink
        type: ResolveIdLink | undefined
        description: '`mount` の `resolveIdLink`。構成図のノードの `id:` のリンク先を URL に変える'
functions:
  - name: attachMap
    title: mapを付ける
    kind: 関数
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`root` の中の `div.mdmark-map` ごとに、種類で構成図・シーケンス図・ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図・マインドマップのどれかを付け、案内と再生をつなぎ、片付ける関数を返す'
    scope: public
    callees:
      - MOD-472-130#functions[attachMapFlow]
      - MOD-472-131#functions[attachMapSequence]
      - MOD-531-3#functions[attachMapEr]
      - MOD-531-4#functions[attachMapState]
      - MOD-596-4#functions[attachMapClass]
      - MOD-596-5#functions[attachMapArchitecture]
      - MOD-596-6#functions[attachMapC4]
      - MOD-472-140#functions[parseMapArgs]
      - MOD-472-135#functions[collectMapProblems]
      - MOD-472-135#functions[needsMermaidFallback]
      - MOD-649-3#functions[attachMapMindmap]
      - MOD-653-3#functions[attachMapAxisGrid]
    args:
      - name: root
        type: HTMLElement
        required: true
        description: '`mount` が描いた要素'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を当てた設定
      - name: hooks
        type: MapHooks
        required: false
        description: 範囲の外の map の図を mermaid の図に戻したときに呼ぶ関数
    returns:
      type: () => void
      description: 付けた操作と観察を外す関数
    process: |-
      1. `div.mdmark-map` ごとに `data-map-args` を `parseMapArgs` で読み、`data-map-kind`（`flowchart`・`sequenceDiagram`・`erDiagram`・`stateDiagram`・`classDiagram`・`architecture`・`C4Context`・`C4Container`・`C4Component`・`C4Dynamic`・`C4Deployment`・`mindmap`・`gantt`・`timeline`・`gitGraph`・`journey`・`block`）で `attachMapFlow`（`hooks.resolveIdLink` も指定する）・`attachMapSequence`・`attachMapEr`・`attachMapState`・`attachMapClass`・`attachMapArchitecture`・`attachMapC4`・`attachMapMindmap`・`attachMapAxisGrid` のどれかに引数と一緒に指定する。`collapse` があれば図の枠を `details`（`open` は `collapse.open`、見出しは `collapse.title` か `title`）で包む
      2. 範囲ごとに `collectMapProblems`（`includeUnknownKeys: false`、`idLinks` は `resolve` と `hooks.resolveIdLink`。範囲が `data-map-annotations` を持てば、そのキーを定義のある注記の ID として指定する）から `collectMapStructure` の項目を除いた項目があれば、`render` の記載の警告に足すか、無ければ図の枠の前に部品『書き方の警告』を配置する
      3. シーケンス図の補足の `plays_over` が指す構成図を探し、再生の強調を構成図にも当てる。片方の図で案内か再生を始めたら、もう片方の強調を解く。再生でメッセージへ移ったら構成図の `resumeFollow` と `follow` で、送り手と受け手のノードが収まる倍率と位置へ構成図を移す（構成図に無い相手のメッセージでは移さない）
      4. `data-map-plain` を持つ範囲は、`needsMermaidFallback` が `true` なら図を付けず、`data-map-front-matter` と中のコードブロックのソースをつないだ元の文字を `renderCodeBlock`（`mermaid: true`）の mermaid のコードブロックにして範囲と置き換え、置き換えた要素を全てまとめて `hooks.restoreMermaid` に指定する。`false` なら手順 1 のとおり図を付け、手順 2 の記載の警告を出さない（許可しないリンク先はリンクを持たないノードで描く）
    unit_tests:
      - name: test_attach_map
        case: 正常
        summary: 構成図とシーケンス図
        condition: 2 つの `div.mdmark-map`
        mock: なし（jsdom）
        expected: '`figure.mdmark-diagram[data-diagram=map]` が 2 つになり、返した関数で操作が外れる'
      - name: test_attach_map_when_collapse
        case: 正常
        summary: 折りたたみ
        condition: '`data-map-args` が `{"title":"全体","collapse":{"open":false}}`'
        mock: なし（jsdom）
        expected: 図の枠が `open` を持たない `details` に入り、`summary` の文字が `全体`
      - name: test_attach_map_when_problems
        case: 異常
        summary: 書き方の誤り
        condition: 読めない Mermaid の行と知らない補足のキー `layuot` を持つ範囲
        mock: なし（jsdom）
        expected: 図の枠の前の記載の警告が 1 つで、読めない行と `layuot` を含む
      - name: test_attach_map_when_annotation_undefined
        case: 異常
        summary: 補足の定義の無い注記の参照
        condition: '定義 `※[cond]` を持つ文書で、補足の `notes.mount.annotations` が `["cond", "gone"]` の範囲。同じ範囲を注記の機能をオフにして描いた文書'
        mock: なし（jsdom）
        expected: 図の枠の前の記載の警告が 1 つで `gone` を含み `cond` の警告を含まない。機能のオフの文書には記載の警告が無い
      - name: test_attach_map_when_missing_participant
        case: 正常
        summary: 構成図に無い再生の相手
        condition: '構成図と、`plays_over: 1` で構成図に無い参加者 `ghost` を持つシーケンス図'
        mock: なし（jsdom）
        expected: シーケンス図の図の枠の前の記載の警告に `ghost` がある
      - name: test_attach_map_when_played_follow
        case: 正常
        summary: 再生で構成図を移す
        condition: '構成図と `plays_over: 1` のシーケンス図で、シーケンス図の 1 つ目の区切りを押す。次に構成図の表示する枠でホイールを回してから、2 つ目の区切りを押す'
        mock: 構成図の表示する枠の `zoomControlOf` の `focusRect`
        expected: 1 つ目の区切りで構成図の `focusRect` を 1 回呼び、ホイールの後の 2 つ目の区切りでも `resumeFollow` で再開して呼ぶ
      - name: test_attach_map_when_plain
        case: 正常
        summary: 範囲の外の map の図は警告を出さない
        condition: '`data-map-plain` を持ち、`click A "javascript:alert(1)"` の行を持つ flowchart の範囲'
        mock: なし（jsdom）
        expected: '`figure.mdmark-diagram[data-diagram=map]` が 1 つで、記載の警告が無く、ノード A が `a.mdmark-diagram-node-link` を持たない'
      - name: test_attach_map_when_plain_fallback
        case: 正常
        summary: 見た目の指定を持つ図を mermaid のコードブロックに戻す
        condition: '`data-map-front-matter` に `title: 受付` を持ち、`style A fill:#f9f` の行を持つ `data-map-plain` の flowchart の範囲と、読める行だけの `data-map-plain` の範囲。`hooks.restoreMermaid` に呼ばれた引数を記録する関数を指定する'
        mock: なし（jsdom）
        expected: 1 つ目の範囲が `data-mdmark-mermaid` を持つ要素に替わり、その `code` の文字が `---` から始まり `style A fill:#f9f` を含む。`restoreMermaid` が 1 回、その要素だけを持つ配列で呼ばれる。図の枠は 2 つ目の範囲の 1 つだけ
      - name: test_attach_map_when_mindmap
        case: 正常
        summary: マインドマップ
        condition: '`data-map-kind="mindmap"` の範囲と、`data-map-plain` を持ち `::icon()` の行を持つ mindmap の範囲'
        mock: なし（jsdom）
        expected: 1 つ目の範囲が `div.map-mindmap-item` を持つ図の枠になり、2 つ目の範囲が `data-mdmark-mermaid` を持つ要素に替わる
      - name: test_attach_map_when_axis_grid
        case: 正常
        summary: 軸と格子の配置の図
        condition: '`data-map-kind` が `gantt`・`timeline`・`gitGraph`・`journey`・`block` の範囲と、`data-map-plain` を持ち読めない行を持つ gantt の範囲'
        mock: なし（jsdom）
        expected: 5 つの範囲がそれぞれの `data-map-kind` を持つ図の枠になり、読めない行の範囲が `data-mdmark-mermaid` を持つ要素に替わる
      - name: test_attach_map_when_id_link
        case: 正常
        summary: 'id: のノードのリンク先'
        condition: '`click A "id:SC-1"`・`click B "id:unknown"` の flowchart の範囲に、`id:SC-` だけを URL に変える `hooks.resolveIdLink` を指定する'
        mock: なし（jsdom）
        expected: A が `href` が URL の `a.mdmark-diagram-node-link` を持ち、B は持たず、図の枠の前の記載の警告に `B` と `id:unknown` がある
    refs:
      - IF-472-35#constraints[範囲の外の map の図を mermaid の図に戻す]
      - IF-472-35#constraints[範囲の外の map の図に付く操作]
lead: 'map の部品のモジュールのエントリーポイントを受け持ち、map の図の付け方を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
