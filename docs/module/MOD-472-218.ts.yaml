        type: boolean
        required: true
        description: 長文の列か
    returns:
      type: FilterKind
      description: 絞り込みの種類
    unit_tests:
      - name: test_default_filter_kind
        case: 正常
        summary: 長文の列は text、ほかは select
        condition: '`true`・`false`'
        mock: なし
        expected: '`text`・`select`'
    status: planned
    introduced:
      pr: 505
  - name: columnBounds
    title: 列の最小の幅と望む幅を決める
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の注記「列の幅」の 1 つ目の図（読者が幅を変えた列を除く）で、列が折り返すかと最小の幅・望む幅（px）を返却する
    description: '`nowrap` か、`range` も `long` も持たない列は、折り返さず最小の幅も望む幅も `longest`。`range` を持つか `long` の列は折り返し、最小の幅は `range.min` の em（無ければ `longColumnMin` の em と `longestWord` の広い方を `longest` で抑えた幅）、最大の幅は `range.max` の em（無ければ上限なし）にし、最小の幅を最大の幅で抑える。望む幅は `longest` を最大の幅で抑え、最小の幅を下回らない幅'
    args:
      - name: options
        type: '{ nowrap: boolean; long: boolean; range?: { min?: number; max?: number }; longest: number; longestWord: number; em: number; longColumnMin: number }'
        required: true
        description: '`width.mode` が `nowrap` か、長文の列か、`data-width` の範囲（em）、最も長い行の幅と最も長い半角の単語の幅（px。セルの余白と罫線を含む）、表の文字の大きさ（px）、長文の列の最小の幅（em）'
    returns:
      type: '{ wraps: boolean; min: number; wanted: number }'
      description: 折り返すか・最小の幅・望む幅（px）
    unit_tests:
      - name: test_column_bounds
        case: 正常
        summary: 折り返さない列・長文の列・幅の範囲の列の最小の幅と望む幅
        condition: '`em: 14`・`longColumnMin: 45` で、(a) `long: false`・`longest: 80`、(b) `long: true`・`longest: 1700`・`longestWord: 60`、(c) `long: true`・`longest: 323`、(d) `long: true`・`longest: 1700`・`longestWord: 700`、(e) `nowrap: true`・`long: true`・`longest: 1700`'
        mock: なし
        expected: (a) `{false, 80, 80}`、(b) `{true, 630, 1700}`、(c) `{true, 323, 323}`、(d) `{true, 700, 1700}`、(e) `{false, 1700, 1700}`
      - name: test_column_bounds_when_range
        case: 正常
        summary: '`width.min`・`width.max` で最小の幅と望む幅を決め、最小の幅は最大の幅を超えない'
        condition: '`em: 14` で、(a) `range: {min: 20, max: 30}`・`longest: 2800`、(b) `range: {max: 12}`・`long: true`・`longest: 1120`、(c) `range: {min: 30, max: 20}`・`longest: 2800`、(d) `range: {min: 10}`・`long: false`・`longest: 60`'
        mock: なし
        expected: (a) `{true, 280, 420}`、(b) `{true, 168, 168}`、(c) `{true, 280, 280}`、(d) `{true, 140, 140}`
    status: planned
    introduced:
      pr: 505
  - name: distributeColumnWidths
    title: 表の列の幅を決める
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の注記「列の幅」の 2 つ目の図で、列ごとの最小の幅・望む幅と表の見える幅から、列の幅（px）と横にスクロールするかを返却する
    description: '最小の幅の合計が `available` を超えるときは各列を最小の幅にして `overflow` を `true` にする。望む幅の合計が `available` 以下なら望む幅にする。どちらでもなければ、`available` から折り返さない列の幅を引いた残りを、折り返す列へ望む幅の比で分け、最小の幅を下回る列は最小の幅で止めて、止めた列を除いた残りをほかの列へ分け直す（止める列が出なくなるまで繰り返す）。`fixed` の列（読者がつまみで幅を変えた列）は `wanted` の幅のまま分けない'
    args:
      - name: columns
        type: '{ wraps: boolean; min: number; wanted: number; fixed?: boolean }[]'
        required: true
        description: '列ごとの `columnBounds` の結果（読者が幅を変えた列は、その幅を `min`・`wanted` に入れて `fixed` を `true` にする）'
      - name: available
        type: number
        required: true
        description: 表の見える幅から、表の左右の枠線と列ごとに切り上げる 1px を引いた幅（px）
    returns:
      type: '{ widths: number[]; overflow: boolean }'
      description: 列ごとの幅（px）と、最小の幅で横にスクロールさせるか
    unit_tests:
      - name: test_distribute_column_widths
        case: 正常
        summary: 収まる・分ける・最小の幅で止めて分け直す・はみ出す
        condition: '(a) `[{false, 80, 80}, {true, 323, 323}]`・`available: 1000`、(b) `[{false, 388, 388}, {true, 630, 1700}]`・`available: 1145`、(c) `[{false, 67, 67}, {true, 630, 1700}, {true, 323, 323}]`・`available: 1145`、(d) `[{false, 67, 67}, {true, 630, 1700}, {true, 630, 1100}]`・`available: 390`'
        mock: なし
        expected: (a) `{[80, 323], false}`、(b) `{[388, 757], false}`、(c) `{[67, 755, 323], false}`、(d) `{[67, 630, 630], true}`
      - name: test_distribute_column_widths_when_fixed
        case: 正常
        summary: 読者が幅を変えた列は分けずにその幅のまま残す
        condition: '`[{false, 118, 118, fixed: true}, {true, 630, 1700}]`・`available: 1145`'
        mock: なし
        expected: '`{[118, 1027], false}`'
    status: planned
    introduced:
      pr: 505
