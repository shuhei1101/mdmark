  - name: findLongColumns
    title: 長文の列を決める
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 列ごとに、本文のセルが全て短い値でなく、見出しか本文のセルの改行で分けた行のどれかが `LONG_COLUMN_CHARS` 文字以上の列の位置を、小さい順に返却する
    description: セルの `compact` は呼ぶ側が決める（`render` は `isCompactCellText` に加えて、中身が行内のコードだけのセル（`badge:` のバッジを含む）を `true` にする）。見出しのセルは `compact` を見ずに行の文字数だけで数える
    args:
      - name: columns
        type: '{ head: string[]; cells: { lines: string[]; compact: boolean }[] }[]'
        required: true
        description: 列ごとの、見出しのセルの改行で分けた行と、本文のセルの改行で分けた行と短い値だけのセルか
    returns:
      type: number[]
      description: 長文の列の位置
    unit_tests:
      - name: test_find_long_columns
        case: 正常
        summary: 20 文字以上の行を持つ文の列だけを長文の列にする
        condition: 列 0 が `No`（`1`・`2`）、列 1 が `名前`（全角 6 文字）、列 2 が `手順`（`<br>` で分けた全角 10 文字の 3 行）、列 3 が `説明`（全角 20 文字の 1 行と全角 19 文字）、列 4 が `更新日`（20 桁の数値 `12345678901234567890`）
        mock: なし
        expected: '`[3]`（列 4 は全てのセルが短い値のため長文の列にしない）'
      - name: test_find_long_columns_when_head
        case: 正常
        summary: 見出しだけが 20 文字以上の列も長文の列にする
        condition: 見出しが全角 20 文字で、本文のセルが全角 2 文字の列
        mock: なし
        expected: '`[0]`'
    status: planned
    introduced:
      pr: 505
  - name: defaultFilterKind
