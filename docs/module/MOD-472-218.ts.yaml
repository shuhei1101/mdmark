        case: 正常
        summary: 数値・日付・✓・空だけを短い値にする
        condition: '`""`・`"1,234"`・`"12.5%"`・`"2026-11-01"`・`"2026/1/2"`・`"✓"`・`"りんご"`・`"v1.0 を出す"`'
        mock: なし
