id: MOD-472-21
visibility: internal
title: "VS Code 拡張機能 / 設定"
lead: VS Code の設定 `mdmark.*` の読み取りと、`mdmark.config.yaml` の場所の解決・端末の設定と重ねた設定の読み取り・`mount` に指定するキーの取り出し・雛形の作成。
directory: |-
  ```tree
  vscode/src/
  ├── settings.ts     # settings.json の mdmark.* を読み込み、範囲の外の値を既定に戻す（vscode を import しない）
  ├── config.ts       # 設定ファイルの場所・読み取り・features と libraries の取り出し・雛形（vscode を import しない）
  ├── config-file.ts  # mdmark.openConfig（設定ファイルを開く・雛形を作るか尋ねる）
  └── extensions-bundle.ts # 重ねた設定の extensions を esbuild-wasm で ES モジュールにまとめる（vscode を import しない）
  ```
