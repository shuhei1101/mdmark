id: MOD-472-118
visibility: internal
title: ライブラリ本体 / CLI / used.ts
test_files:
  - tests/unit/src/render/used.test.ts
functions:
  - name: usedLibraryMarks
    title: 文書が使用するマーカーの名前を取得する
    container: src/render/used.ts
    usecase: 共通
    summary: 文書の Markdown から `MARK_PATTERN` に該当するマーカーの名前を取得し、対応表にあるものだけを返却する
    kind: 関数
    scope: public
    args:
      - name: markdowns
        type: string[]
        required: true
        description: 文書の Markdown
      - name: libraries
        type: Record<string, string>
        required: true
        description: 既定の対応表に設定の `libraries` を重ねた表
    returns:
      type: Set<string>
      description: 埋めるマーカーの名前
    unit_tests:
      - name: test_used_library_marks
        case: 正常
        summary: 対応表にあるマーカーだけを取得する
        condition: '文書に `<!-- chart: {"data": "a"} -->` と `<!-- table: {"kind": "data"} -->` と `<!-- unknown -->`、対応表は `chart` だけ'
        mock: なし
        expected: '`{"chart"}`'
    status: planned
    introduced:
      pr: 32
    description: esbuild を import しないファイルに配置し、CLI の書き出しと VS Code 拡張機能の書き出し（`embedLocalLibraries`）が使用する
  - name: usesMermaid
    title: 文書が mermaid を使用するかを確認する
    container: src/render/used.ts
    kind: 関数
    scope: public
    summary: 文書ごとに `render` を設定と一緒に呼び、返った HTML に `data-mdmark-mermaid` があれば `true` を返却する
    description: '`mount` と同じ mermaid の対象（機能 `mermaid` と文書の `<!-- features: {"mermaid": false} -->` を含む）を、同じ処理から得るために `render` を経由する。VS Code 拡張機能の書き出しも呼ぶため、`collectRangeScripts` と同じく `src/render/used.ts` に配置し、`src/cli/embed.ts` から同じ名前で export する'
    args:
      - name: options
        type: '{ markdowns: string[]; config: MdmarkConfig }'
        required: true
        description: 文書の Markdown と読み込んだ設定
    returns:
      type: boolean
      description: どれかの文書に mermaid の対象があるか
    callees:
      - MOD-472-212#functions[render]
    refs:
      - IF-472-33#constraints[埋める mermaid]
    unit_tests:
      - name: test_uses_mermaid
        case: 正常
        summary: mermaid のコードブロックがある文書があれば true、機能を解除した文書だけなら false
        condition: '`mermaid` のコードブロックを持つ文書と `ts` だけの文書の組、`<!-- features: {"mermaid": false} -->` と `mermaid` のコードブロックを持つ文書だけの組、`features.mermaid: false` の設定と `mermaid` のコードブロックを持つ文書の組'
        mock: なし
        expected: 順に `true`・`false`・`false`
    status: planned
    introduced:
      pr: 382
  - name: usedSyntaxLanguages
    title: 文書が使用する色分けの言語を取得する
    container: src/render/used.ts
    kind: 関数
    scope: public
    summary: 文書ごとに `render` を設定と一緒に呼び、返った HTML の `data-mdmark-syntax` の値を重なりなく取得する
    description: '`mount` と同じ色分けの対象（機能 `syntax` と文書の `<!-- features: {"syntax": false} -->`、生の HTML の `code` を削除することを含む）を、同じ処理から得るために `render` を経由する。VS Code 拡張機能の書き出しも呼ぶため、`collectRangeScripts` と同じく `src/render/used.ts` に配置し、`src/cli/embed.ts` から同じ名前で export する'
    args:
      - name: options
        type: '{ markdowns: string[]; config: MdmarkConfig }'
        required: true
        description: 文書の Markdown と読み込んだ設定
    returns:
      type: string[]
      description: 言語のモジュール名。名前の順に並べる
    callees:
      - MOD-472-212#functions[render]
    unit_tests:
      - name: test_used_syntax_languages
        case: 正常
        summary: 色分けの対象の言語だけを取得し、機能を解除した文書は取得しない
        condition: '文書 1 が `ts`・`yml`・`text` のコードブロックと生の HTML `<pre><code class="language-python">x</code></pre>`、文書 2 が `<!-- features: {"syntax": false} -->` と `sql` のコードブロック。設定は空'
        mock: なし
        expected: '`["typescript", "yaml"]`'
      - name: test_used_syntax_languages_when_disabled
        case: 正常
        summary: 設定で機能を解除すると何も取得しない
        condition: '`ts` のコードブロックを持つ文書と、`features.syntax: false` の設定'
        mock: なし
        expected: '`[]`'
      - name: test_used_syntax_languages_when_aliases_and_file_name
        case: 正常
        summary: 別名とファイル名付きの言語をモジュール名にして取得する
        condition: '`dockerfile`・`patch`・`ts:app.ts` のコードブロックを持つ文書。設定は空'
        mock: なし
        expected: '`["diff", "dockerfile", "typescript"]`'
    status: planned
    introduced:
      pr: 97
  - name: collectRangeScripts
    title: 範囲のスクリプトを集める
    container: src/render/used.ts
    usecase: 共通
    kind: 関数
    scope: public
    summary: 文書を `renderDocument` で設定と一緒に描き、返った HTML の `template.mdmark-html-script` の言語と、エスケープを戻したコードを記載した順に返却する
    description: '`mount` が変換のライブラリを読み込むのと同じ出力から判定する。`html-scripts` がオフの文書は `template` を出さないため、空を返却する。esbuild を import しないファイルに配置し、CLI の `compileHtmlScripts` と VS Code 拡張機能の `embedLocalLibraries` が使用する'
    args:
      - name: options
        type: '{ markdown: string; config: MdmarkConfig }'
        required: true
        description: 文書の Markdown と設定
    returns:
      type: 'Array<{ lang: "ts" | "js"; source: string }>'
      description: 範囲のスクリプトの言語とコード
    unit_tests:
      - name: test_collect_range_scripts
        case: 正常
        summary: 設定か文書のマーカーでオンの文書の範囲の `ts` を、エスケープを戻して返却する
        condition: '`''` と `<` を含む `ts` の範囲を持つ文書を、`features.html-scripts` が `true` の設定と、設定に記載せず文書に `<!-- features: {"html-scripts": true} -->` を持つ場合で呼ぶ'
        mock: なし
        expected: 'どちらも `[{ lang: "ts", source: 範囲のコード }]`'
      - name: test_collect_range_scripts_when_off_or_no_script
        case: 正常
        summary: オフか、範囲に `ts`・`js` が無いと空
        condition: '`features.html-scripts` が `true` で文書に `<!-- features: {"html-scripts": false} -->` を持つ場合と、オンで範囲が `html`・`css` だけの場合と、範囲の外に `ts` のコードブロックがある場合'
        mock: なし
        expected: どれも空の配列
    callees:
      - MOD-472-212#functions[renderDocument]
    status: planned
