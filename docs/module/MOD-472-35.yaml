id: MOD-472-35
visibility: internal
title: "ライブラリ本体 / 差分"
lead: '`mount` に指定した取り出し元から 2 つのリビジョンの本文を受け、行と単語を比べて描き、ミニマップでスクロールする処理と、描いた文書のブロックを追加と削除の色で塗り分ける処理と、その部品の HTML。ブラウザでだけ動く（部品の HTML と比較は Node でも動く）。'
diagrams:
  - name: 全体
    diagram: |-
      <!-- map -->

      ```mermaid
      flowchart LR
        n1["差分を付ける"]
        n2["取り出し元の値を検める"]
        n3["差分を計算する"]
        n4["比べる2つの本文を取り出す"]
        n5["ブロックを色分けする"]
        n6["部品のHTML"]
        n7["差分の計算の関数型"]
        n8["jsdiffの計算"]
        n9["ミニマップを付ける"]
        n1 -.->|戻り値を検める| n2
        n1 -.->|本文を指定する| n3
        n4 -.->|戻り値を検める| n2
        n5 -.->|本文を指定する| n3
        n5 -.->|色を適用する| n6
        n3 -.->|使用する| n7
        n8 -.->|実装する| n7
        n1 -.->|行を描いたら付ける| n9
        n1 -.->|描く| n6
      ```

      <!-- /map -->
notes:
  単体テストの実行場所: '`checkRevisions`・`normalizeDiffMode`・`computeDiff` と `render*` は DOM を使用せず `tests/unit/src/diff/{source,compute}.test.ts` と `tests/unit/src/diff/{diff-*,revision-picker}.part.test.ts` で Vitest の `unit` プロジェクトで実行する。`attachDiff`・`attachMinimap`・`src/diff/blocks.ts` の関数は `tests/unit/src/diff/{panel,minimap,blocks}.browser.test.ts` で `unit-browser` プロジェクトで実行する'
  配布物の大きさ: jsdiff は `diffLines`・`diffWords`・`diffChars` だけを名前で import し、使用しない関数をまとめない。追加した後の `dist/index.js` が非機能要件の上限に収まることを、ビルドのサイズの検査で確認する
  ディレクトリ: |-
    ```tree
    src/
    └── diff/
        ├── source.ts   # 公開の型 DiffSource・DiffRevision・DiffMode と対応する差分の出し方 diffModes、取り出し元が返却した値の検査
        ├── compute.ts  # 行と単語の比較（jsdiff を差分の計算の関数型の後ろに配置する）
        ├── panel.ts    # 差分を開く UI・待ち・再選択・通知ブロックを付ける attachDiff
        ├── blocks.ts   # 比べる 2 つの本文の取り出し loadDiffPair と、描いた文書のブロックの色分け colorDiffBlocks
        ├── minimap.ts  # スクロール先ごとに 1 本のミニマップを配置する attachMinimap
        ├── diff-toggle.part.ts # 差分を開くボタンの HTML
        ├── revision-picker.part.ts # リビジョンの選択の HTML
        ├── diff-lines.part.ts # 差分の行の HTML
        ├── diff-html.part.ts # 埋め込んだ HTML の差分の HTML
        ├── diff-blocks.part.ts # 差分のブロックの HTML
        ├── diff-minimap.part.ts # ミニマップの HTML
        ├── diff-message.part.ts # 差分の状態の文の HTML
        └── {部品}.part.stories.ts # 部品設計の states ごとのストーリー（上の部品ごとに 1 つ）
    ```
tags:
  - name: topic:差分
    main: true
