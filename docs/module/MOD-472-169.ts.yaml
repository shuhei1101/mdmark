id: MOD-472-169
visibility: internal
title: ライブラリ本体 / 公開の入口 / index.ts
test_files:
  - tests/unit/src/index.test.ts
functions:
  - name: version
    title: バージョンを返却する
    container: src/index.ts
    kind: 関数
    scope: public
    summary: ビルドで埋めたバージョンを返却する
    description: 'ビルドが識別子 `__MDMARK_VERSION__` をバージョンの文字列に置き換える。ソースでは `declare const __MDMARK_VERSION__: string` で宣言する。'
    returns:
      type: string
      description: '`v{MAJOR}.{MINOR}.{PATCH}` のバージョン'
    unit_tests:
      - name: test_version
        case: 正常
        summary: 埋めたバージョンを返却する
        condition: '`__MDMARK_VERSION__` に `v9.9.9` を配置する'
        mock: '`globalThis.__MDMARK_VERSION__` に値を配置してから読み込む'
        expected: '`v9.9.9` を返却する'
    refs:
      - IF-472-29#
lead: '公開関数・定数・公開の型のエクスポートを受け持ち、公開関数や配布物のエントリーポイントを変えるときに参照する。'
tags:
  - name: topic:api
    main: true
  - name: topic:エントリポイント
  - name: action:配布
notes:
  公開する型とカスタム要素: |-
    `MdmarkTableElement`・`MdmarkTableColumn`・`MdmarkTableRow`・`MdmarkTableValue`・`MdmarkTableFeatures`・`MdmarkTableRowClickDetail`・`MdmarkTableCellEditDetail` を型として export する。
    `declare global` で `HTMLElementTagNameMap` に `"mdmark-table": MdmarkTableElement`、`HTMLElementEventMap` に `"mdmark-row-click": CustomEvent<MdmarkTableRowClickDetail>`・`"mdmark-cell-edit": CustomEvent<MdmarkTableCellEditDetail>`・`"mdmark-row-add": CustomEvent<Record<string, never>>` を加える。
    モジュールの最後で `defineElements()`（`src/elements.ts`）を 1 回呼ぶ。
refs:
  - IF-793-1#constraints[型の配布]
  - MOD-793-4#functions[defineElements]
