id: MOD-472-316
visibility: internal
title: ライブラリ本体 / 部品 / tabs.ts
test_files:
  - tests/unit/src/parts/tabs.test.ts
functions:
  - name: renderTabs
    title: タブを描く
    container: src/parts/tabs.ts
    kind: 関数
    scope: internal
    summary: 部品設計『タブ』の HTML を返却する。`group` を指定すると `mdmark-tabs` に `data-group` を付ける。`selected` を指定するとタブの並びを付け、選んだもの以外の中身を `hidden` にする。`collapse` が `closed`・`open` なら、`mdmark-tabs` を `renderCollapsible` の折り畳み（見出しは `title` か `タブ（{タブ名を・で並べたもの}）`）に入れる。タブ名は行内の HTML（エスケープ済み）としてそのまま配置し、折り畳みの見出しの既定にはタグを除いた文字を使用する
    args:
      - name: options
        type: '{ id: string; titles: string[]; panels: string[]; selected?: number; group?: string; collapse?: "none" | "closed" | "open"; title?: string }'
        required: true
        description: id の頭、タブ名、タブごとの中身の HTML（`SLOT_MARKER` を指定できる）、選んだタブ、組の名前、折り畳み（既定 `none`）、折り畳みの見出し
    returns:
      type: string
      description: '`<div class="mdmark-tabs">` で始まる HTML'
    unit_tests:
      - name: test_render_tabs
        case: 正常
        summary: selected が無ければ全ての中身を隠さずに出す
        condition: '`titles: [macOS, Windows]`'
        mock: なし
        expected: '`mdmark-tab-title` が 2 つ、`role="tablist"` と `hidden` が無い'
      - name: test_render_tabs_when_selected
        case: 正常
        summary: selected のタブだけを出す
        condition: '`selected: 1`'
        mock: なし
        expected: '`role="tablist"` と 2 つの `role="tab"`、2 つ目が `aria-selected="true"` と `tabindex="0"`、1 つ目の `tabpanel` が `hidden`'
      - name: test_render_tabs_when_group
        case: 正常
        summary: group を data-group に写す
        condition: '`group: "os\"&"`'
        mock: なし
        expected: '`<div class="mdmark-tabs" data-group="os&quot;&amp;">` で始まる（値をエスケープする）'
      - name: test_render_tabs_when_collapsed
        case: 正常
        summary: 折り畳みの見出しをタブ名か title にする
        condition: '部品設計の `Closed`（`titles: [uv, pip]`、`collapse: closed`）と `OpenTitle`（`collapse: open`、`title: 入れ方`）'
        mock: なし
        expected: 1 つ目が `<details class="mdmark-collapsible"><summary>タブ（uv・pip）</summary><div class="mdmark-tabs"` で始まり、2 つ目が `<details class="mdmark-collapsible" open><summary>入れ方</summary>` で始まる
      - name: test_render_tabs_when_strong_title
        case: 正常
        summary: タブ名の strong をそのまま配置する
        condition: '`titles` が `["<strong>案 A</strong> SVG のまま","案 B"]`、`selected` が 0、`collapse` が `closed`'
        mock: なし
        expected: 1 つ目のタブのボタンとタブ名の `p` が `<strong>案 A</strong>` を持ち、折り畳みの見出しが `タブ（案 A SVG のまま・案 B）`
    callees:
      - 'MOD-472-325#functions[renderCollapsible]'
