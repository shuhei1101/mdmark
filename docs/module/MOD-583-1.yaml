id: MOD-583-1
visibility: internal
title: ライブラリ本体 / 表
lead: 表の記法（表のマーカー・セルの結合・キーの階層の表・CSV の表・行の詳細）を HTML にするコアルールと表の部品、`mount` が付ける表の操作（並べ替え・ピン止め・絞り込み・列の幅・テーブル設定・階層の開閉・見出し行と集計の行を留める処理・CSV の切り替え）、それらが使用する DOM を使用しない計算。操作だけはブラウザでだけ動く。
notes:
  ディレクトリ: |-
    ```tree
    src/table/
    ├── csv.syntax.ts              # CSV の読み取りと CSV の表
    ├── row-detail.syntax.ts       # 行の詳細
    ├── table-tree.syntax.ts       # `tree` の表の階層の行・型・必須・既定のセルと、`tree.example` の見本を表の下へ移す処理
    ├── table.syntax.ts            # 表の種類・機能・絞り込みと、表の属性・列と行の色・多段の見出しと行見出しとセルの結合
    ├── row-detail.part.ts         # 行の詳細の renderRowDetail
    ├── table.part.ts              # 表の renderTable・renderTableTools・renderTableBar・renderTableSettings・renderTreeKeyCell・renderTypeCell・renderTreeTools・renderTotalRows・renderCopyPanel・renderCheckCell
    ├── {部品}.part.stories.ts       # 部品設計の states ごとのストーリー（上の部品ごとに 1 つ）
    ├── csv.interact.ts            # CSV の表と元の CSV の切り替え
    ├── table-resize.interact.ts   # 列の幅のつまみのドラッグ・←→ キーで列の幅を変え、ダブルクリック・ダブルタップ・Enter で戻す
    ├── table-settings.interact.ts # テーブル設定のパネルの開閉・列の表示の切り替え・列の並べ替え（ドラッグと ↑・↓ キー）
    ├── table-sticky.interact.ts   # 表の見出し行と集計の行を画面の端に留める
    ├── table-tree.interact.ts     # 階層の表の開閉・パスのツールチップとコピー・行の選択・絞り込み・見本との連動
    ├── table-width.interact.ts    # 列の中身の幅を測り、列の幅を自動で決める
    ├── table.interact.ts          # 表の並べ替え・ピン止め・絞り込み・件数・集計・コピー・行へ移る・行の URL のコピー
    ├── table-cells.logic.ts       # 表の `^^`・`<<` のセルの結合の計画（トークンを使用しない）
    ├── table-tree.logic.ts        # キーのパスの分け方・階層の行の計画・YAML の見本の行のパス・階層の絞り込み（render と操作が使用する。DOM もトークンも使用しない）
    └── table.logic.ts             # 列を動かせるかの判定と列の順の入れ替え・列の幅の上限と収め方・表の並べ替えの比べ方・最下段の見出しのセル・隣り合う同じ値の結合・絞り込みの当てはめ・数の読み込み方・集計と読み込めないセル・TSV と Markdown の表・長文の列と列の幅の決め方・行を留める量（部品の表と操作が使用する）
    ```
