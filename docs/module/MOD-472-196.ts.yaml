id: MOD-472-196
visibility: internal
title: ライブラリ本体 / 差分 / diff-lines.ts
test_files:
  - tests/unit/src/parts/diff-lines.test.ts
functions:
  - name: renderDiffLines
    title: 差分の行を描く
    container: src/parts/diff-lines.ts
    summary: 部品設計『差分の行』の HTML を返却する。`html` の塊は `renderDiffHtml` で描く
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ blocks: DiffBlock[]; sides: "side" | "stack"; labels?: { before: string; after: string } }'
        required: true
        description: 塊の並びと、埋め込んだ HTML のプレビューの並べ方、プレビューの前と後の `figcaption` に出すリビジョンの説明
    returns:
      type: string
      description: '`role="group"`・`aria-label="変更の行"` の要素。行は `mdmark-diff-line`・`data-kind`、行頭のマーカー（`aria-hidden`）、削除した行・追加した行の見えないスクリーンリーダー向けの名前を持ち、`changed` の切れを `del`・`ins` で囲む。文字はエスケープする'
    unit_tests:
      - name: test_render_diff_lines
        case: 正常
        summary: 行の種類と変わった単語を出す
        condition: '`same`・`del`（`差分` が `changed`）・`add`（`変更` が `changed`）の 3 行'
        mock: なし
        expected: '`del` の行に `-` と `削除した行: ` と `<del class="mdmark-diff-word">差分</del>`、`add` の行に `+` と `追加した行: ` と `<ins class="mdmark-diff-word">変更</ins>`'
      - name: test_render_diff_lines_when_escaped
        case: 正常
        summary: 行の文字を HTML として解釈しない
        condition: '`<script>` を含む行'
        mock: なし
        expected: '`&lt;script&gt;` になる'
    callees:
      - 'MOD-472-197#functions[renderDiffHtml]'
    refs:
      - CMP-472-45#
