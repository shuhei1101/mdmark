id: MOD-472-220
visibility: internal
title: ライブラリ本体 / タブ / tabs.interact.ts
test_files:
  - tests/unit/src/tabs/tabs.interact.browser.test.ts
constants:
  - name: TAB_CHOICE_KEY_PREFIX
    title: 残したタブ名のキーの頭
    container: src/tabs/tabs.interact.ts
    summary: 選んだタブ名を残す localStorage のキーの頭。キーは `{頭}{group}`
    value: '"mdmark-tabs:"'
    refs:
      - IF-472-35#constraints[タブの操作]
  - name: tabSelectors
    title: タブを名前で選ぶ関数の記録
    container: src/tabs/tabs.interact.ts
    summary: '`attachTabs` が操作を付けた `mdmark-tabs` から、タブ名でタブを選ぶ関数を参照する。ページの別の `mount` のタブも同じ記録しから参照して統一する。削除する関数が取り除く'
    value: 'new WeakMap<HTMLElement, (name: string) => void>()'
  - name: tabPanelSelectors
    title: タブの中身を選ぶ関数の記録
    container: src/tabs/tabs.interact.ts
    summary: '`attachTabs` が操作を付けた `mdmark-tabs` から、中身（`mdmark-tab-panel`）を指定してそのタブを選ぶ関数を参照する。選んだタブ名を残さず、同じ `group` のほかのタブ群も切り替えない。削除する関数が取り除く'
    value: 'new WeakMap<HTMLElement, (panel: HTMLElement) => void>()'
    status: planned
functions:
  - name: attachTabs
    title: タブに操作を付ける
    container: src/tabs/tabs.interact.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-tabs` にタブの並びを配置し、タブを選ぶ操作を付ける
    description: |-
      各 `mdmark-tabs` の頭にタブの並びを配置し、中身を `role="tabpanel"` にする。
      `data-group` を持つものは `loadTabChoice` のタブ名のタブ、無ければ 1 つ目を選ぶ。
      中身の選び方を `tabPanelSelectors` に登録する。
      `followHash` が `false` でなければ、付けたときに URL の `#ID`（`rowIdFromHash` で読み込む）が選ばれていない中身の中を指すなら、残したタブ名より先に `revealTabTarget` でそのタブを選んで要素を `scrollIntoView` する。

      押すと左右の矢印・Home・End で選ぶ。
      `data-group` を持つときは、ページの `document.querySelectorAll(".mdmark-tabs[data-group]")` を `dataset.group === group` で絞った `mdmark-tabs` を、`tabSelectors` から参照した関数で同じタブ名へ切り替え、`saveTabChoice` で残す。
      切り替えるときは、組の名前をセレクタに入れず、`tabSelectors` に無いものは飛ばし、フォーカスは動かさず、そのタブ名が無ければ変えない。

      タブのボタンにはタブ名の要素の子のノードのコピーを入れ（`strong` を残す）、組の統一と残すタブ名にはその文字を使用する。
      入れ子の `mdmark-tabs` はそれぞれ別の並びにし、キーの移動と選択はその並びの中だけで行う。

      読者が押すかキーで選ぶときは、選ぶ前に押したタブのボタンの `getBoundingClientRect().top` を測り、選んで同じ組を統一した後にもう一度測る。
      `findScrollContainer` の要素（画面全体なら `window.scrollBy`）を差の分だけスクロールする（文書が縮んで戻しきれない分はブラウザがスクロール位置の上限で止める）。
      付けたときの選択と `revealTabTarget` の選択ではスクロールしない。

      `data-wrap` を持たない `mdmark-tabs` は、並びを配置した後に `attachTablistScroll` で並びを包んで端のボタンを付ける。
      タブを選ぶたびに（押す・キー・付けたときの選択・`tabSelectors` の統一・`tabPanelSelectors` の選択）、中身を出し分けた後に `revealSelectedTab` で選んだタブのボタンを並びの見える範囲へ入れる。
      押したタブのボタンの位置を戻すスクロールは、並びを動かした後に測る。
      `data-wrap` を持つ `mdmark-tabs` には、どちらも付けない
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
      - name: options
        type: '{ followHash?: boolean }'
        required: false
        description: URL の `#ID` の指すタブを選ぶか（`followHash`。既定 `true`）
    returns:
      type: () => void
      description: タブの並びと `attachTablistScroll` が付けた包み・端のボタンを取り除き、`tabSelectors` と `tabPanelSelectors` から除外し、中身を `render` の構造に戻す関数
    side_effects: タブの DOM を書き換え、イベントを付ける。読者がタブを選ぶとスクロールする場所のスクロール位置を書き換える。`data-group` を持つときは localStorage を読み込みと保存し、`root` の外の同じ `data-group` のタブも切り替える
    callees:
      - '#functions[loadTabChoice]'
      - '#functions[saveTabChoice]'
      - MOD-472-316#functions[renderTabs]
      - '#functions[revealTabTarget]'
      - 'MOD-583-17#functions[rowIdFromHash]'
      - MOD-472-234#functions[findScrollContainer]
      - '#functions[attachTablistScroll]'
      - '#functions[revealSelectedTab]'
    unit_tests:
      - name: test_attach_tabs
        case: 正常
        summary: 押すと矢印キーで切り替わる
        condition: 3 つの中身のタブ、2 つ目を押し、右の矢印、End、Home
        mock: なし
        expected: 2 つ目・3 つ目・3 つ目・1 つ目の順に `aria-selected="true"` とフォーカスが移り、その中身だけが `hidden` を持たない
      - name: test_attach_tabs_when_group_synced
        case: 正常
        summary: 同じ組のタブを統一して残す
        condition: '`data-group="os"` の `macOS`・`Windows` のタブを 2 つ、`data-group="os"` の `macOS`・`Linux` のタブを 1 つ、組の無い `macOS`・`Windows` のタブを 1 つ、2 つの `root` に分けて付け、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 1 つ目と 2 つ目は `Windows` を選び、3 つ目と 4 つ目は `macOS` のまま。フォーカスは 1 つ目の `Windows`。localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_attach_tabs_when_choice_saved
        case: 正常
        summary: 残したタブ名のタブを選んで付ける
        condition: localStorage の `mdmark-tabs:os` が `Windows`、`mdmark-tabs:lang` が `Go`。`data-group="os"` の `macOS`・`Windows` と `data-group="lang"` の `Python`・`TypeScript` のタブ
        mock: なし
        expected: '`os` は `Windows`、`lang` は `Python` を選ぶ。localStorage は書き換わらない'
      - name: test_attach_tabs_when_detached
        case: 正常
        summary: 削除したタブは統一する対象から削除される
        condition: '`data-group="os"` のタブを 2 つの `root` に付け、1 つ目の `root` を削除してから 2 つ目の `Windows` を押す'
        mock: なし
        expected: 例外が出ず、1 つ目の `root` にタブの並びが無く、中身に `hidden` が無い
      - name: test_attach_tabs_when_group_has_quote
        case: 正常
        summary: セレクタの記号を含む組の名前でも統一する
        condition: '`data-group` が `a"b\c]` の `macOS`・`Windows` のタブを 2 つ、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 例外が出ず、2 つとも `Windows` を選び、localStorage の `mdmark-tabs:a"b\c]` が `Windows`
      - name: test_attach_tabs_when_hash_in_tab
        case: 正常
        summary: 'URL の #ID が指す要素を含むタブを、残したタブ名より先に選ぶ'
        condition: localStorage の `mdmark-tabs:os` が `macOS`。`data-group="os"` の `macOS`・`Windows` のタブで、`Windows` の中身に `### 注意`。`location.hash` を `#注意` にしてから付ける
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`Windows` を選び、`### 注意` で `scrollIntoView` が 1 回呼ばれる。localStorage の `mdmark-tabs:os` は `macOS` のまま'
      - name: test_attach_tabs_when_nested
        case: 正常
        summary: 入れ子のタブをそれぞれの並びで切り替え、強調したタブ名をボタンに残す
        condition: インターフェース定義『文書を描く』の「正常系（入れ子のタブを切り替える）」の文書を描いた要素
        mock: なし
        expected: '`role="tablist"` が 2 つで、`Windows` のボタンが `strong` を持つ。`bash` を押した後も `macOS` が選ばれたまま。内側の `bash` で右の矢印を押すとフォーカスが `zsh` に移る'
      - name: test_attach_tabs_when_position_kept
        case: 正常
        summary: 高さの違うタブへ切り替えても、押したタブのボタンの画面の位置を保つ
        condition: '高さ 600px・`overflow-y: auto` の `div` の中に、高さ 1200px の要素・段落 30 個の `長文` と段落 1 つの `短文` のタブ・高さ 1200px の要素を並べて付け、タブのボタンが `div` の上端から 300px の位置までスクロールしてから `短文` を押し、続けて `長文` を押す'
        mock: なし
        expected: どちらの後も、押したボタンの `getBoundingClientRect().top` の差が押す前と 1px 以内
      - name: test_attach_tabs_when_group_above_shrinks
        case: 正常
        summary: 上にある同じ組のタブの高さが変わっても、押したタブのボタンの位置を保つ
        condition: '`data-group="len"` の `長文`・`短文` のタブを 2 つ、間と後ろに高さ 1200px の要素を挟んで画面全体で並べ、2 つ目のタブのボタンが画面の上端から 300px の位置までスクロールしてから 2 つ目の `短文` を押す'
        mock: localStorage を空にしておく
        expected: 2 つのタブが `短文` を選び、2 つ目のボタンの `getBoundingClientRect().top` の差が押す前と 1px 以内
      - name: test_attach_tabs_when_cannot_restore
        case: 正常
        summary: 文書が縮んで戻しきれないときはスクロール位置の上限で止まる
        condition: 画面全体の末尾に `長文`・`短文` のタブを配置し、タブのボタンが画面の上端から 300px の位置までスクロールしてから `短文` を押す
        mock: なし
        expected: '`scrollY` と `document.documentElement.scrollHeight - innerHeight` の差が 1px 以内で、押したボタンが画面の中にある'
      - name: test_attach_tabs_when_position_kept_with_anchoring
        case: 正常
        summary: スクロールのアンカリングを持つブラウザでも、補正が二重に効かず押したタブのボタンの位置を保つ
        condition: '`data-group="len"` の `長文`・`短文` のタブを 2 つ、間と後ろに高さ 1200px の要素を挟んで画面全体で並べ（アンカリングは止めない）、2 つ目のタブのボタンが画面の上端から 300px の位置までスクロールしてから 2 つ目の `短文` を押し、続けて `長文` を押す。それぞれ描画のフレームを 2 回待ってから測る'
        mock: なし
        expected: どちらの後も、押したボタンの `getBoundingClientRect().top` の差が押す前と 1px 以内
      - name: test_attach_tabs_when_tablist_overflows
        case: 正常
        summary: はみ出す並びで選んだタブを見える範囲へ入れ、data-wrap のタブ群には付けない
        condition: 幅 320px の `root` に、7 つのタブ名の幅の合計が 320px を超える `data-group="many"` のタブを 2 つと、`data-wrap` を持つ同じタブを 1 つ並べて付け、1 つ目のタブ群の 1 つ目のタブにフォーカスして End を押す
        mock: localStorage を空にしておく
        expected: 1 つ目と 2 つ目の並びが `div.mdmark-tablist-wrap` に包まれ、7 つ目のボタンの左端と右端がそれぞれの並びの見える範囲に入る。3 つ目のタブ群は `mdmark-tablist-wrap` と `mdmark-tablist-scroll` を持たず、並びの `scrollLeft` が 0。`scrollY` は押す前と同じ
  - name: loadTabChoice
    title: 残したタブ名を読み込む
    container: src/tabs/tabs.interact.ts
    kind: 関数
    scope: internal
    summary: localStorage の `{TAB_CHOICE_KEY_PREFIX}{group}` を読み込む。`window.localStorage` の取り出しと読み込み出しを try の中で行い、例外は `console.warn` に出して `undefined` を返却する
    args:
      - name: group
        type: string
        required: true
        description: 組の名前
    returns:
      type: string | undefined
      description: 残したタブ名。残していないか読み込めないときは `undefined`
    unit_tests:
      - name: test_load_tab_choice
        case: 正常
        summary: 残したタブ名を返却する
        condition: localStorage の `mdmark-tabs:os` が `Windows`
        mock: なし
        expected: '`Windows`'
      - name: test_load_tab_choice_when_storage_unavailable
        case: 異常
        summary: localStorage を取り出せなければ undefined
        condition: '`window.localStorage` を読み込むと `SecurityError` を投げる'
        mock: '`window.localStorage` の getter と `console.warn` を差し替える'
        expected: 例外を投げず `undefined` を返却し、`console.warn` が 1 回呼ばれる
  - name: saveTabChoice
    title: 選んだタブ名を残す
    container: src/tabs/tabs.interact.ts
    kind: 関数
    scope: internal
    summary: localStorage の `{TAB_CHOICE_KEY_PREFIX}{group}` にタブ名を記載する。`window.localStorage` の取り出しと書き込みを try の中で行い、例外は `console.warn` に出して続ける
    args:
      - name: choice
        type: '{ group: string; name: string }'
        required: true
        description: 組の名前と選んだタブ名
    side_effects: localStorage に記載する
    unit_tests:
      - name: test_save_tab_choice
        case: 正常
        summary: タブ名を残す
        condition: '`{ group: "os", name: "Windows" }`'
        mock: なし
        expected: localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_save_tab_choice_when_storage_unavailable
        case: 異常
        summary: localStorage を取り出せなければ記載せずに続ける
        condition: '`window.localStorage` を読み込むと `SecurityError` を投げる'
        mock: '`window.localStorage` の getter と `console.warn` を差し替える'
        expected: 例外を投げず、`console.warn` が 1 回呼ばれる
  - name: revealTabTarget
    title: 要素を含むタブを選ぶ
    container: src/tabs/tabs.interact.ts
    summary: 要素を含む `role="tabpanel"` を外側から順にたどり、`tabPanelSelectors` から参照した関数でその中身のタブを選ぶ。選んだタブは `saveTabChoice` で残さず、同じ組のタブも統一しない。タブの中に無ければ何もしない
    kind: 関数
    scope: internal
    side_effects: タブの `aria-selected` と中身の `hidden` を書き換える
    args:
      - name: target
        type: Element
        required: true
        description: URL の `#ID` が指す要素
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_reveal_tab_target
        case: 正常
        summary: 入れ子のタブを外側から選ぶ
        condition: 外側のタブの 2 つ目の中身に内側のタブがあり、その 2 つ目の中身の `### 注意` を指定する。外側は `data-group="os"`
        mock: localStorage を空にしておく
        expected: 外側と内側の 2 つ目のタブが `aria-selected="true"` で、`### 注意` の祖先に `hidden` が無い。localStorage は空のまま
      - name: test_reveal_tab_target_when_outside
        case: 正常
        summary: タブの外の要素では何もしない
        condition: タブの外の見出しを指定する
        mock: なし
        expected: 例外が出ず、タブの選択が変わらない
    status: planned
  - name: revealSelectedTab
    title: 選んだタブを並びの見える範囲へ入れる
    container: src/tabs/tabs.interact.ts
    kind: 関数
    scope: internal
    summary: 並びの中の `aria-selected="true"` のボタンの左端か右端が見える範囲の外にあれば、並びの `scrollLeft` だけを動かしてボタンの全体を入れる
    description: |-
      見える範囲は、並びの `getBoundingClientRect()` の左右から、並びを包む要素の `mdmark-tablist-scroll` の `offsetWidth`（無ければ 0）を除いた範囲にする。
      ボタンの左端が範囲の左より左ならその差だけ `scrollLeft` を減らし、右端が範囲の右より右ならその差だけ増やす（動きは即座にし、`scrollIntoView` は使用しない）。
      範囲に入っているときと、並びの `clientWidth` が 0（配置が無い）のときは何もしない
    args:
      - name: tablist
        type: HTMLElement
        required: true
        description: タブの並び（`role="tablist"`）
    returns:
      type: void
      description: なし
    side_effects: 並びの `scrollLeft` を書き換える。ページと祖先のスクロール位置は動かさない
    refs:
      - IF-472-35#constraints[タブの操作]
    unit_tests:
      - name: test_reveal_selected_tab
        case: 正常
        summary: 右の外にある選んだタブを入れる
        condition: '`attachTablistScroll` を付けた幅 320px の並びに 7 つのタブ、`scrollLeft` 0 で、右端が並びの見える範囲の外にある 5 つ目を選んだ'
        mock: なし
        expected: 5 つ目のボタンの右端が並びの右端から `end` のボタンの幅を除いた位置と 1px 以内で一致し、`scrollY` は変わらない
      - name: test_reveal_selected_tab_when_visible
        case: 正常
        summary: 見える範囲にあれば動かさない
        condition: 同じ並びで 2 つ目を選んだ
        mock: なし
        expected: '`scrollLeft` が 0 のまま'
      - name: test_reveal_selected_tab_when_not_laid_out
        case: 正常
        summary: 配置の無い並びは動かさない
        condition: document に取り付けていない並びで 7 つ目を選んだ
        mock: なし
        expected: 例外が出ず、`scrollLeft` が 0 のまま
      - name: test_reveal_selected_tab_when_last
        case: 正常
        summary: 最後のタブは並びを右端まで動かして入れる
        condition: '`attachTablistScroll` を付けた幅 320px の並びに 7 つのタブ、`scrollLeft` 0 で 7 つ目を選んだ後、描画のフレームを 1 回待つ'
        mock: なし
        expected: '`scrollLeft` が `scrollWidth - clientWidth` と 1px 以内で一致し、7 つ目のボタンの右端が並びの右端と 1px 以内で一致し、`end` が `hidden`'
  - name: attachTablistScroll
    title: 並びに端のボタンを付ける
    container: src/tabs/tabs.interact.ts
    kind: 関数
    scope: internal
    summary: 並びを `div.mdmark-tablist-wrap` で包み、残りのタブがある側の端にだけ、押すと並びを動かすボタンを出す
    description: |-
      並びの前後に `button.mdmark-tablist-scroll`（`type="button"`・`data-dir` が `start`・`end`・`aria-hidden="true"`・`tabindex="-1"`。中身は `iconSvg` の `chevron-left`・`chevron-right`）を配置し、並びと一緒に `div.mdmark-tablist-wrap` へ入れる。
      ボタンを押すと、並びをその側へ `clientWidth` の 8 割だけ `scrollBy` で動かす（`prefers-reduced-motion: reduce` のときは `behavior: "auto"`、それ以外は `"smooth"`）。選んだタブとフォーカスは変えない。
      並びの `scroll` と `ResizeObserver` で、`scrollLeft` が 1px 以下なら `start` を、残り（`scrollWidth - clientWidth - scrollLeft`）が 1px 以下なら `end` を `hidden` にする。
      `ResizeObserver` は、並びの幅が 0 から変わったとき（取り付けた・開いた）に `revealSelectedTab` も呼ぶ
    args:
      - name: tablist
        type: HTMLElement
        required: true
        description: タブの並び（`role="tablist"`）
    returns:
      type: () => void
      description: '`ResizeObserver` を止めてイベントを解除し、ボタンと包みを取り除いて並びを元の場所に戻す関数'
    side_effects: 並びの要素を包み、ボタンとイベントと `ResizeObserver` を付ける
    callees:
      - '#functions[revealSelectedTab]'
      - MOD-472-180#functions[iconSvg]
    refs:
      - IF-472-35#constraints[タブの操作]
      - CMP-472-22#
    unit_tests:
      - name: test_attach_tablist_scroll
        case: 正常
        summary: 残りがある側のボタンだけを出し、押すと並びを動かす
        condition: 幅 320px の並びに 7 つのタブ、付けた後に `data-dir="end"` のボタンを押す
        mock: '`matchMedia` を `prefers-reduced-motion: reduce` が合うものに差し替える'
        expected: 付けた直後は `end` だけが `hidden` を持たない。押した後は `scrollLeft` が `clientWidth` の 8 割と 1px 以内で一致し、`start` も `hidden` を持たず、`aria-selected` と `document.activeElement` は押す前と同じ。どちらのボタンも `aria-hidden="true"`・`tabindex="-1"`
      - name: test_attach_tablist_scroll_when_laid_out_later
        case: 正常
        summary: 幅が 0 から変わったときに選んだタブを入れる
        condition: document に取り付けていない、幅 320px の 7 つのタブの並びで 7 つ目を選んで付け、その後に document へ取り付けて描画のフレームを 2 回待つ
        mock: なし
        expected: 7 つ目のボタンの左端と右端が並びの見える範囲に入り、`end` が `hidden`、`start` が `hidden` を持たない
      - name: test_attach_tablist_scroll_when_detached
        case: 正常
        summary: 返った関数で並びを元に戻す
        condition: 付けた後に返った関数を呼ぶ
        mock: なし
        expected: '`mdmark-tablist-wrap` と `mdmark-tablist-scroll` が無く、並びが元の親の同じ位置にある'
