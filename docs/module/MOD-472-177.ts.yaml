functions:
  - name: attachZoom
    title: 拡大・縮小・移動を付ける
    container: src/shared/zoom.interact.ts
    kind: 関数
    scope: internal
    summary: '表示する枠と中身に、拡大・縮小・ピンチと拡大中の移動の操作を付ける'
    description: |-
      拡大・縮小は、全体が収まる倍率（`fitScale` の倍率。`fitMin` より小さくしない）の `ZOOM.minRatio` 倍から `ZOOM.maxRatio` 倍までで、縮小・拡大・倍率のボタンと `+`・`-`・`0`、表示する枠の上のピンチで操作する。
      拡大中の移動は、矢印キーとドラッグで操作する。
      指（`pointerType` が `touch`）の移動は `touchPan` で決める。`native` は指のポインターではドラッグを始めず、表示する枠のスクロールとしてブラウザに任せる。`pointer` は指もマウスと同じドラッグで動かす。
      倍率は中身に `transform: scale()` を掛け、大きさのノードを倍率を掛けた大きさにしてスクロールさせる。

      倍率が変わるたびに次を書き換え、`onChange` に倍率を通知する。

      - 端のボタンの `disabled`（縮小は下限、拡大は上限）
      - 倍率の文字とスクリーンリーダー向けの名前（`percentBase` が `fit` なら全体が収まる倍率を 100%、`content` なら中身の大きさを 100% とする）
      - 表示する枠の `data-at-fit`（倍率が全体が収まる倍率以下で、倍率を掛けた中身の高さが表示する枠の `clientHeight` 以下の間だけ付ける。表示する枠の大きさが変わったときも付け直す）

      ピンチは、表示する枠の `touchstart`・`touchmove`（`passive: false`）で指が 2 本の間、始めの 2 本の指の距離と倍率を覚え、`touchmove` ごとに「始めの倍率 × 今の距離 ÷ 始めの距離」を下限・上限に収め、今の 2 本の指の中点の下の中身の点が中点の下に残る位置へ倍率と位置を変えて `preventDefault` する。指が 2 本の間はドラッグを止める。表示する枠の上の Safari の `gesturestart`・`gesturechange` は `preventDefault` する。

      `wheelToScroller` が `true` のとき、表示する枠を縦にスクロールできる間（`data-at-fit` を持たず `scrollHeight` が `clientHeight` より大きい）は、`ctrlKey` を持たない `wheel`（`passive: false`）を `preventDefault` し、`wheelDelta` で px に換算した縦の量を `scrollParentOf` の要素の `scrollBy` に、横の量を表示する枠の `scrollLeft` に加える。縦にスクロールできない間は `wheel` を受け取らない。

      `.mdmark-diagram-node-link` の上からもドラッグを始める（文字を選ばせず、リンクの `dragstart` を `preventDefault` してブラウザのリンクのドラッグを始めない）。
      `dragOwner` に当たる要素（部品が自分でドラッグを受け持つ要素。リンクを持つノードを含む）の上では、`.mdmark-diagram-node-link` でも移動のドラッグを始めない（map の要素を動かす間、表示する枠をスクロールさせない。インターフェース定義『文書を描く』の制約『map の要素のドラッグとスクロール』）。
      `DRAG_THRESHOLD` を超えて動いたときだけ動かしたことにする。
      ドラッグを始めたとき（`DRAG_THRESHOLD` を超えたとき）に `onPanStart` を 1 回呼ぶ（超えないまま離したら動かさない）。

      動かした後の `pointerup` で `window` にキャプチャの `click` の受け取り（次の 1 回を `preventDefault`・`stopPropagation` して削除される）を付け、`setTimeout(0)` でも解除する（`click` が来ない終わり方で受け取りを残さない）。
      `pointercancel` では受け取りを付けず、`detach` でも解除する。

      `fitHeight` は真偽値か、全体が収まる倍率を求めるたびに呼ぶ関数で受ける。
      `refit()` は今の倍率と位置を保ったまま、全体が収まる倍率と、下限・上限・ボタンの状態をもう一度求める（倍率が変更後の範囲の外なら範囲に収める）。
      図（`attachDiagrams`）とライトボックス（`attachLightbox`）が使用する

      `focusRect(rect, { margin, duration })` は、倍率を掛ける前の中身の座標の矩形と周りの `margin` が表示する枠に収まる倍率（全体が収まる倍率以上・上限以下）と、矩形の中心が表示する枠の中央に来る位置へ、`duration` ミリ秒かけて `requestAnimationFrame` で倍率と位置を変える（`duration` が 0 なら 1 回で変える。文書のスクロールは変えない）。移している間に読者がホイール・ドラッグ・キー・ツールのボタン（`data-tool`）で操作したら、移すのを止める（ボタンを持つ要素の中の帯の区切りなど、ほかの押下では止めない）。

      `centerRect(rect, { duration })` は、倍率を変えずに、倍率を掛ける前の中身の座標の矩形の中心が表示する枠の中央に来る位置へ、`focusRect` と同じ動きと止め方で移す（中身の端より外へはスクロールしない）。今の倍率が全体が収まる倍率で、矩形の全体が表示する枠に見えているときは移さない。

      `resize(size)` は、中身の大きさ（倍率を掛ける前）を `size` の値をその場で書き換えて差し替え、全体が収まる倍率を再計算する。全体が収まる倍率で表示していたなら `reset` と同じく変更後の全体が収まる倍率と左上の位置にし、そうでなければ今の倍率の全体が収まる倍率に対する比（倍率の文字）を保つ倍率（下限・上限に収める）にして、表示する枠の中央にあった中身の座標を中央に保つ

      `ratio()` は全体が収まる倍率に対する今の倍率の比を返却する。`setRatio(ratio)` は倍率を「全体が収まる倍率 × `ratio`」（下限・上限に収める）にし、表示する枠の中央にあった中身の座標を中央に保つ（図のカスタム要素が描き直す前後で倍率を保つのに使用する）

      付けた表示する枠と戻り値を `zoomControlOf` で引けるように登録し、`detach` で登録を削除する
    args:
      - name: options
        type: '{ viewport: HTMLElement; content: HTMLElement; size: { width: number; height: number }; tools: HTMLElement; onChange?: (zoom: number, fit: number) => void; onPanStart?: () => void; fitHeight?: boolean | (() => boolean); dragIgnore?: string; dragOwner?: string; keyTargets?: HTMLElement[]; percentBase?: "fit" | "content"; fitMin?: number; touchPan?: "native" | "pointer"; wheelToScroller?: boolean }'
        required: true
        description: 表示する枠・倍率を掛ける中身・中身の大きさ・ボタンを持つ要素（`data-tool` で見分ける）・倍率が変わったときに呼ぶ関数・全体が収まる倍率を高さでも決めるか（既定 `true`。文書の中の図は `false` で幅だけで決める）・ドラッグを始めない要素のセレクタ（押せる要素に加える）・キーを受ける要素（既定は表示する枠とボタンを持つ要素）・倍率の文字の基準（既定 `content`。ライトボックスは画像の大きさを 100% にする）・全体が収まる倍率の下限（既定は下限なし。`attachDiagrams` が図の `data-fit-min` を指定する）・指の移動の扱い（既定 `pointer`。`attachDiagrams` は `native`）・拡大中のホイールをスクロールする祖先へ指定するか（既定 `false`。`attachDiagrams` は `true`）
    returns:
      type: 'ZoomControl'
      description: 全体が収まる倍率に戻す関数・今の全体が収まる倍率を返却する関数・倍率を保って下限を再計算する関数・矩形が収まる倍率と位置へ移す関数・倍率を変えずに矩形を中央へ移す関数・倍率の文字を保って中身の大きさを差し替える関数・全体が収まる倍率に対する今の倍率の比を返却する関数・その比の倍率にする関数・付けた操作を削除する関数
    callees:
      - 'MOD-472-173#functions[fitScale]'
    unit_tests:
      - name: test_attach_zoom
        case: 正常
        summary: 収まる倍率で始め、拡大・縮小と戻す
        condition: 幅 600px の枠に幅 1100 の中身
        mock: なし
        expected: 倍率の文字が `55%` で縮小が `disabled` を持たず、拡大の後に `68%`、`0` の後に `55%`、`onChange` が倍率ごとに呼ばれる
      - name: test_attach_zoom_when_panned
        case: 正常
        summary: 拡大中は矢印キーとドラッグで動かす
        condition: 拡大を 2 回押し、枠で `ArrowRight` を押してから左へ 40px ドラッグ
        mock: なし
        expected: '`scrollLeft` が 80 増えた後に 40 増える'
      - name: test_attach_zoom_when_detached
        case: 正常
        summary: 削除すると操作が有効にならない
        condition: '`detach()` を呼んで拡大を押す'
        mock: なし
        expected: 倍率が変わらない
      - name: test_attach_zoom_when_percent_base_fit
        case: 正常
        summary: 全体が収まる倍率を 100% として出す
        condition: 幅 600px の枠に幅 1100 の中身、`percentBase` が `fit`。拡大を 1 回押す
        mock: なし
        expected: 倍率の文字が `100%` で始まり、拡大の後に `125%` でスクリーンリーダー向けの名前が `倍率 125%。全体が収まる倍率に戻す`
      - name: test_attach_zoom_when_dragged_on_link
        case: 正常
        summary: リンクの上から動かした後の click を window で止め、次のタスクで受け取りを解除する
        condition: 拡大を 2 回押し、中身の `a.mdmark-diagram-node-link` の上で `pointerdown` → 40px の `pointermove` → `pointerup` → `click`。もう 1 回、動かして離した後に `click` を出さず、次のタスクで `document` に `click` を出す
        mock: '`document` のキャプチャの `click` を数える関数'
        expected: 1 回目の `click` が `defaultPrevented` で `document` に届かず、`scrollLeft` が 40 変わる。2 回目の後の `document` の `click` は止められず届く
      - name: test_attach_zoom_when_link_pressed
        case: 正常
        summary: しきい値以下の動きはドラッグにしない
        condition: リンクの上で `pointerdown` → 3px の `pointermove` → `pointerup` → `click`
        mock: なし
        expected: '`click` が `defaultPrevented` でなく、`scrollLeft` が変わらない'
      - name: test_attach_zoom_when_drag_threshold
        case: 正常
        summary: しきい値までのドラッグでは動かさず、超えたら動かして `onPanStart` を呼ぶ
        condition: 拡大を 2 回押し、中身の上で押して 2px 動かして離し、次に 40px 左へ動かして離す
        mock: '`onPanStart` に呼ばれた回数を数える関数'
        expected: 2px の後は `scrollLeft` が変わらず `onPanStart` が 0 回、40px の後は `scrollLeft` が増え `onPanStart` が 1 回
      - name: test_attach_zoom_when_refit
        case: 正常
        summary: '`fitHeight` の関数が `true` を返却するようになった後の `refit()` で、倍率を保ち下限を高さでもう一度求める'
        condition: 幅 600px・高さ 400px の枠に幅 500・高さ 1600 の中身。始めは `fitHeight` が `false` を返却し、`true` を返却するようにして `refit()` を呼ぶ
        mock: なし
        expected: '`refit()` の前後で倍率が `1` のままで、`fit()` が `1` から `0.25` になり、表示する枠が前後とも `data-at-fit` を持たない（倍率 `1` の中身の高さ 1600 が枠の高さ 400 に収まらない）'
      - name: test_attach_zoom_when_link_dragstart
        case: 正常
        summary: ノードのリンクの上の押下で、ブラウザのリンクのドラッグを始めない
        condition: 拡大を 2 回押し、中身の `a.mdmark-diagram-node-link` に `dragstart` を出す
        mock: なし
        expected: '`dragstart` が `defaultPrevented`'
      - name: test_attach_zoom_when_focus_rect
        case: 正常
        summary: 矩形が収まる倍率と位置へ移す
        condition: '幅 600px・高さ 400px の枠に幅 1200・高さ 800 の中身。`focusRect({ x: 500, y: 300, width: 200, height: 100 }, { margin: 32, duration: 0 })`'
        mock: なし
        expected: 倍率が `min((600 - 64) / 200, (400 - 64) / 100)` を上限（全体が収まる倍率 0.5 × `ZOOM.maxRatio` = 2.5）で抑えた 2.5 で、矩形の中心 `(600, 350)` が表示する枠の中央にある
      - name: test_attach_zoom_when_focus_rect_wide
        case: 正常
        summary: 収まる倍率より小さくしない
        condition: 同じ枠で、中身の全体を囲む矩形を指定する
        mock: なし
        expected: 倍率が全体が収まる倍率
      - name: test_attach_zoom_when_focus_rect_animated
        case: 正常
        summary: 時間をかけて移し、読者の操作で止める
        condition: '`duration: 300` で `focusRect` を呼び、時計を 150 ミリ秒進めてからホイールを回し、さらに 300 ミリ秒進める'
        mock: '`requestAnimationFrame`・時計'
        expected: 150 ミリ秒の時点の倍率が始めの倍率と目標の倍率の間にあり、ホイールの後は目標の倍率にならない
      - name: test_zoom_control_of
        case: 正常
        summary: 表示する枠から操作を引く
        condition: '`attachZoom` の後と `detach` の後に `zoomControlOf(viewport)` を呼ぶ'
        mock: なし
        expected: 後の前は戻り値と同じ操作、`detach` の後は `undefined`
      - name: test_attach_zoom_when_focus_rect_other_click
        case: 正常
        summary: ボタンを持つ要素の中のツールでない要素の押下では止めない
        condition: '`duration: 300` で `focusRect` を呼び、時計を 150 ミリ秒進めてから、ボタンを持つ要素の中の `data-tool` を持たない要素を押し、さらに 300 ミリ秒進める'
        mock: '`requestAnimationFrame`・時計'
        expected: 目標の倍率になる
      - name: test_attach_zoom_when_bounds
        case: 正常
        summary: 全体が収まる倍率の 0.25 倍と 5 倍で止める
        condition: 幅 600px の枠に幅 1100 の中身、`percentBase` が `fit`。縮小を 10 回押してから、拡大を 20 回押す
        mock: なし
        expected: 縮小の後に倍率の文字が `25%` で縮小が `disabled`、拡大の後に `500%` で拡大が `disabled`
      - name: test_attach_zoom_when_at_fit
        case: 正常
        summary: 全体が収まる倍率以下の間だけ `data-at-fit` を付ける
        condition: 開いた直後、拡大を 1 回押した後、`0` の後に縮小を 1 回押した後
        mock: なし
        expected: 表示する枠が `data-at-fit` を持ち、拡大の後に持たず、縮小の後に持つ
      - name: test_attach_zoom_when_tall_at_fit
        case: 正常
        summary: 全体が収まる倍率でも、中身が枠に縦に収まらなければ data-at-fit を付けない
        condition: 幅 600px・高さ 300px の枠に、幅 600・高さ 1200 の中身。`fit` は幅で決めた 1（高さを `--mdmark-diagram-max-height` で切った枠）。開いた直後
        mock: なし
        expected: 倍率が全体が収まる倍率のまま、表示する枠が `data-at-fit` を持たない
      - name: test_attach_zoom_when_pinched
        case: 正常
        summary: 2 本の指の間隔の変化で、中点を保って倍率を変える
        condition: 幅 600px・高さ 400px の枠に幅 1200・高さ 800 の中身。表示する枠に指 2 本の `touchstart`（間隔 100px）と、同じ中点で間隔 200px の `touchmove` を発火し、続けて間隔 1px の `touchmove` を発火する
        mock: '`Touch` を作る関数'
        expected: 1 つ目の `touchmove` の後に倍率が始めの 2 倍で、中点の下の中身の点が変わらず、`touchmove` が `defaultPrevented`。2 つ目の後に倍率が下限（全体が収まる倍率 × `ZOOM.minRatio`）
      - name: test_attach_zoom_when_native_touch
        case: 正常
        summary: '`touchPan` が `native` のとき、指のポインターでは動かさない'
        condition: '`touchPan: "native"` で拡大を 2 回押し、`pointerType` が `touch` の `pointerdown` → 40px の `pointermove` → `pointerup`、続けて同じ動きを `mouse` で'
        mock: なし
        expected: '`touch` の後は `scrollLeft` が変わらず、`mouse` の後は 40 変わる'
      - name: test_attach_zoom_when_wheel
        case: 正常
        summary: 拡大して縦にスクロールできる間だけ、ホイールをスクロールする祖先へ指定する
        condition: '`wheelToScroller: true`、`overflow-y: auto` で中身があふれる要素の中の表示する枠。開いた直後と、拡大を 2 回押した後に、表示する枠へ `deltaY: 100` の `wheel` を発火し、最後に `ctrlKey` を持つ `wheel` を発火する'
        mock: なし
        expected: 開いた直後の `wheel` は `defaultPrevented` でない。拡大の後の `wheel` は `defaultPrevented` で、表示する枠の `scrollTop` が変わらず、祖先の要素の `scrollTop` が 100 増える。`ctrlKey` の `wheel` は `defaultPrevented` でない
      - name: test_attach_zoom_when_shift_wheel
        case: 正常
        summary: 拡大中の Shift＋ホイールは、縦の量のまま届いても表示する枠を横に動かす
        condition: '`test_attach_zoom_when_wheel` と同じ表示する枠で拡大を 2 回押し、`scrollLeft` を 0 にしてから、`shiftKey` と `deltaY: 100` の `wheel`、続けて `shiftKey` と `deltaX: 50` の `wheel` を発火する'
        mock: なし
        expected: どちらの `wheel` も `defaultPrevented` で、表示する枠の `scrollLeft` が 100、続けて 150 になり、祖先の要素の `scrollTop` は変わらない
      - name: test_attach_zoom_when_center_rect
        case: 正常
        summary: 倍率を変えずに矩形を中央へ移す
        condition: '幅 600px・高さ 400px の枠に幅 1200・高さ 800 の中身。拡大のボタンで倍率を 1 にしてから `centerRect({ x: 550, y: 350, width: 100, height: 100 }, { duration: 0 })`'
        mock: なし
        expected: 倍率が 1 のままで、`scrollLeft` が 300、`scrollTop` が 200
      - name: test_attach_zoom_when_center_rect_at_fit
        case: 正常
        summary: 全体が収まる倍率で矩形が見えていれば移さない
        condition: '同じ枠と中身を全体が収まる倍率（0.5）のまま `centerRect({ x: 900, y: 600, width: 100, height: 100 }, { duration: 0 })`'
        mock: なし
        expected: 倍率が 0.5 のままで、`scrollLeft`・`scrollTop` が 0
      - name: test_attach_zoom_when_center_rect_at_fit_hidden
        case: 正常
        summary: 全体が収まらない下限の倍率では、見えていない矩形だけを中央へ移す
        condition: '`fitMin: 1` で同じ枠と中身。`centerRect({ x: 100, y: 100, width: 100, height: 100 }, { duration: 0 })` の後に `centerRect({ x: 900, y: 600, width: 100, height: 100 }, { duration: 0 })`'
        mock: なし
        expected: 1 回目の後は `scrollLeft`・`scrollTop` が 0。2 回目の後は倍率が 1 のままで、`scrollLeft` が 600・`scrollTop` が 400（中身の端で止める）
      - name: test_attach_zoom_when_resize
        case: 正常
        summary: 中身の大きさを差し替えても倍率の文字を保つ
        condition: '`percentBase: "fit"` で同じ枠と中身。倍率を全体が収まる倍率の 2 倍（1）にしてから `resize({ width: 600, height: 400 })`'
        mock: なし
        expected: 全体が収まる倍率が 1、倍率が 2、倍率の文字が `200%` のまま
      - name: test_attach_zoom_when_resize_at_fit
        case: 正常
        summary: 全体が収まる倍率では変更後の中身の全体が収まる倍率にする
        condition: '`percentBase: "fit"` で同じ枠と中身を全体が収まる倍率のまま `resize({ width: 2400, height: 800 })`'
        mock: なし
        expected: 倍率が 0.25、倍率の文字が `100%`、`scrollLeft`・`scrollTop` が 0
      - name: test_attach_zoom_when_drag_owner
        case: 正常
        summary: 部品が受け持つ要素の上では動かさない
        condition: '`dragOwner: "[data-drag-owner]"` で付け、拡大してから `data-drag-owner` を持つ要素と、その中の `.mdmark-diagram-node-link` をそれぞれマウスで左へ 40px ドラッグする'
        mock: なし
        expected: どちらも表示する枠の `scrollLeft` が変わらず、`onPanStart` を呼ばない
      - name: test_attach_zoom_when_ratio
        case: 正常
        summary: 全体が収まる倍率に対する比を読み、その比の倍率にする
        condition: 幅 600px の枠に幅 1100 の中身、`percentBase` が `fit`。拡大を 2 回押して `ratio()` を読み、新しい表示する枠に付けた `attachZoom` の `setRatio` に渡す。`setRatio(100)` も呼ぶ
        mock: なし
        expected: '`ratio()` が `1.5625`、新しい枠の倍率の文字が `156%`。`setRatio(100)` の後は上限の `500%`'
    status: planned
  - name: zoomControlOf
    title: 表示する枠の拡大・縮小の操作を引く
    container: src/shared/zoom.interact.ts
    kind: 関数
    scope: internal
    summary: '`attachZoom` を付けた表示する枠の `ZoomControl` を返却する（付けていなければ `undefined`）'
    args:
      - name: viewport
        type: HTMLElement
        required: true
        description: 表示する枠
    returns:
      type: ZoomControl | undefined
      description: 付けた操作
    status: planned
  - name: wheelDelta
    title: ホイールの量を px に換算する
    container: src/shared/zoom.interact.ts
    kind: 関数
    scope: internal
    summary: '`deltaMode` が px（`0`）ならそのまま、行（`1`）なら `WHEEL_LINE` 倍、ページ（`2`）なら横は `page.width`、縦は `page.height` 倍にした量を返却する'
    args:
      - name: input
        type: '{ event: { deltaX: number; deltaY: number; deltaMode: number }; page: { width: number; height: number } }'
        required: true
        description: '`wheel` の量と単位、ページ単位のときの 1 ページの幅と高さ（スクロールする要素の高さと表示する枠の幅）'
    returns:
      type: '{ x: number; y: number }'
      description: 横と縦の px
    unit_tests:
      - name: test_wheel_delta
        case: 正常
        summary: 単位ごとに px に換算する
        condition: '`deltaY: 3` で `deltaMode` が `0`・`1`・`2`、`page` が `{ width: 600, height: 800 }`'
        mock: なし
        expected: '`y` がそれぞれ `3`・`48`・`2400`'
    status: planned
  - name: scrollParentOf
    title: 縦にスクロールする祖先を引く
    container: src/shared/zoom.interact.ts
    kind: 関数
    scope: internal
    summary: '`element` の祖先のうち、`overflow-y` の計算値が `auto` か `scroll` で `scrollHeight` が `clientHeight` より大きい最も近い要素を返却する。無ければ `document.scrollingElement` を返却する'
    args:
      - name: element
        type: HTMLElement
        required: true
        description: 表示する枠
    returns:
      type: Element
      description: ホイールを指定する要素
    unit_tests:
      - name: test_scroll_parent_of
        case: 正常
        summary: 縦にスクロールする最も近い祖先を返却する
        condition: '`overflow-y: auto` で中身があふれる要素の中の表示する枠と、その外の表示する枠'
        mock: なし
        expected: 中の表示する枠はその要素、外の表示する枠は `document.scrollingElement`
    status: planned
