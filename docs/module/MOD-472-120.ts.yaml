id: MOD-472-120
visibility: internal
title: ライブラリ本体 / CLI / export.ts
test_files:
  - tests/unit/src/cli/export.test.ts
functions:
  - name: prepareEmbeds
    title: 埋めるものを用意する
    container: src/cli/export.ts
    usecase: 共通
    summary: 文書の画像を埋め、マーカーのある外部ライブラリと設定の拡張と色分けのモジュールがまとめられることを確認して読み込み先を集め、`html-scripts` がオンの文書の範囲の `ts`・`js` を `compileHtmlScripts` で変えて `embeds.htmlScripts` に入れ、`theme` を読み込み、索引があれば参照の表を作って、書き出しの中身と警告を返却する。設定に `assets.root` があれば設定ファイルのフォルダから解決し、文書ごとに `copyMedia`（書き出しの中で共有する `copied` を指定する）の後に `inlineImages` を呼ぶ。`bundle` では `inlineImages` に共有の表を指定し、埋めた画像を `payload.assets` に入れる。設定の `features` で `images`・`media` をオフにした文書も同じく扱う
    description: '`export` と `build` に共通の処理。`usesMap` が `true` なら `embeds.map` を `true` にする。埋める設定には、設定の `features`・`tooltips`・`side-toc`・`table`・`colorTheme`・`colorScheme`・`labels`・`map` をあるときだけ写す（`map` の Schema に合わない値は `validateConfig` が設定の誤りにする）。`colorTheme` が `COLOR_THEMES` に無い名前のときもコピーしたうえで、警告 `{設定ファイル}: 不明なテーマ名 {名前} です。既定の dev-swiss で描画します。` を 1 件出す。外部ライブラリ・拡張・色分けのモジュールは 1 つずつ `bundleModule` でまとめてみて、まとめられたものだけの読み込み先（URL はそのまま、パスは設定ファイルのあるフォルダを基準にした絶対パス）を `embeds` に入れる。同じ URL のモジュールは 1 回だけまとめる。外部ライブラリと拡張で、まとめたコードに `hasDynamicImport` が該当するものは `embeds` に入れたうえで、警告 `{設定ファイル}: 拡張 \`{パス}\` はまとめた後も動的 import() が残り、blob: と動的 import を許さない環境では読み込めません。読み込む先をリテラルの文字列にしてください。`（外部ライブラリは `外部ライブラリ \`{マーカーの名前}\``）を 1 件出す。文書の色分けの言語を `usedSyntaxLanguages` で取得し、1 つ以上あれば設定の `syntax.url`（無ければ `DEFAULT_SYNTAX_URL`）の `core.min.js` と言語ごとの `languages/{モジュール名}.min.js` を確認して `embeds.syntax` に入れる（まとめたコードは esbuild の既定で頭の著作権表示を残す）。本体をまとめられなければ言語も確認せず `embeds.syntax` を持たない。言語のモジュールだけまとめられなければ、その言語を `embeds.syntax.languages` に入れず、警告を 1 件出す（その言語のコードブロックは色分けせずに描く）。埋める設定には `syntax` を写さない（開いたときに外へ要求しない）。文書に mermaid のコードブロックがあるかを `usesMermaid` で確認して、あれば設定の `mermaid.url`（無ければ `DEFAULT_MERMAID_URL`。パスは設定ファイルのあるフォルダを基準にした絶対パス）をまとめてみて `embeds.mermaid` に入れる。まとめられなければ `embeds.mermaid` を持たず、警告 `{設定ファイル}: mermaid \`{URL}\` をまとめられません（{理由}）。\`mermaid.url\` を修正してください。` を 1 件出す（mermaid のコードブロックは開いたときに通知ブロックとコードブロックになる）。埋める設定には `mermaid` の `theme`・`themeVariables` だけをコピーし、`url` を写さない。設定に `aliases` があれば `loadAliases` の `aliases` を `payload.aliases` に入れ、`issues` は 1 件ずつずれを 1 行にした（`formatCheckIssue`）警告にする（終了コードは変えない）。警告は `{ファイル}: {内容}` の文字列で、読み込めない画像・絶対 URL の画像・まとめられないモジュールと拡張・まとめられない色分けのライブラリ（`{設定ファイル}: 色分けのライブラリ \`{URL}\` をまとめられません（{理由}）。\`syntax.url\` を修正してください。`）・読み込めない `theme`・読み込めない索引の文書を出す'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 外部ライブラリの URL の先を読み込む
    args:
      - name: options
        type: "{ loaded: LoadedConfig; docs: Array<{ path: string; file: string }>; kind: 'document' | 'bundle'; entry: string; out: string; fetchText: FetchText }"
        required: true
        description: 読み込んだ設定、埋める文書のパスと絶対パス、種類、最初に開く文書、出力の HTML の絶対パス、URL を読み込む関数（`bundleViewer` と共有する `cacheFetchText` の関数）
    returns:
      type: 'Promise<{ payload: ExportPayload; embeds: ViewerEmbeds; themeCss?: string; warnings: string[] }>'
      description: 書き出しの中身・まとめるモジュールの読み込み先・利用側の CSS・警告
    unit_tests:
      - name: test_prepare_embeds
        case: 正常
        summary: マーカーのあるモジュールだけをまとめ、拡張と theme を読み込む
        condition: '`libraries` に `test-lib`（マーカーあり）と `other`（マーカーなし）、`extensions` に 1 つ、`theme` あり'
        mock: 一時フォルダに手元のモジュールを配置する
        expected: '`embeds.libraries` のキーが `test-lib` だけ、`embeds.extensions` が拡張の絶対パスの 1 件、`themeCss` があり、`warnings` が空'
      - name: test_prepare_embeds_when_unreadable
        case: 正常
        summary: 読み込めないものを警告にして続ける
        condition: '`test-lib` が無いファイルを指し、`theme` も無い'
        mock: 一時フォルダ
        expected: '`embeds.libraries` が空、`warnings` に `test-lib` と `theme` のパスが入る'
      - name: test_prepare_embeds_when_index
        case: 正常
        summary: 索引があれば参照の表と docId を入れる
        condition: 索引に `guide`（`guide.md`）と `api`（`api.md`、`related` に `guide`）
        mock: 一時フォルダ
        expected: '`payload.references.backlinks.guide` に `api` があり、`guide.md` の `docId` が `guide`'
      - name: test_prepare_embeds_when_tooltip_placement
        case: 正常
        summary: 設定の `tooltips` を埋める設定に写す
        condition: '`tooltips.placement: bottom` を持つ設定と、`tooltips` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.tooltips` が `{ placement: "bottom" }`、後者は `payload.config` が `tooltips` を持たない'
      - name: test_prepare_embeds_when_labels
        case: 正常
        summary: 設定の `labels` を埋める設定に写す
        condition: '`labels.paramCopy: コピー` を持つ設定と、`labels` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.labels` が `{ paramCopy: "コピー" }`、後者は `payload.config` が `labels` を持たない'
      - name: test_prepare_embeds_when_map
        case: 正常
        summary: 設定の `map` を埋める設定に写す
        condition: '`map.kinds.store.label: 保存先` を持つ設定と、`map` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.map` が設定の `map` と同じ値、後者は `payload.config` が `map` を持たない'
      - name: test_prepare_embeds_when_syntax
        case: 正常
        summary: 文書が使用する言語だけ色分けのモジュールをまとめ、埋める設定に `syntax` を写さない
        condition: 文書に `ts` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js`・`hl/languages/yaml.min.js` に手元のモジュールを配置する
        expected: '`embeds.syntax.core` が `hl/core.min.js` の絶対パスで、`embeds.syntax.languages` のキーが `typescript` だけ。`payload.config` が `syntax` を持たず、`warnings` が空'
      - name: test_prepare_embeds_when_syntax_unreadable
        case: 正常
        summary: 色分けの本体をまとめられなければ警告にして埋めずに続ける
        condition: 文書に `ts` のコードブロック。設定の `syntax.url` が無いフォルダ `missing/`
        mock: 一時フォルダ
        expected: '`embeds.syntax` が無く、`warnings` に `missing/core.min.js` と `syntax.url` を含む 1 件'
      - name: test_prepare_embeds_when_mermaid
        case: 正常
        summary: mermaid のコードブロックがある文書だけ mermaid をまとめ、埋める設定に url を写さない
        condition: '文書に `mermaid` のコードブロック。設定の `mermaid` が `{ url: "vendor/mermaid.mjs", theme: "neutral" }`。もう 1 つは同じ設定で mermaid のコードブロックを持たない文書'
        mock: 一時フォルダの `vendor/mermaid.mjs` に既定のエクスポートを持つ手元のモジュールを配置する
        expected: '前者の `embeds.mermaid` が `vendor/mermaid.mjs` の絶対パスで、`payload.config.mermaid` が `{ theme: "neutral" }`、`warnings` が空。後者は `embeds.mermaid` を持たない'
      - name: test_prepare_embeds_when_mermaid_unreadable
        case: 正常
        summary: mermaid をまとめられなければ警告にして埋めずに続ける
        condition: 文書に `mermaid` のコードブロック。設定の `mermaid.url` が無いファイル `missing/mermaid.mjs`
        mock: 一時フォルダ
        expected: '`embeds.mermaid` が無く、`warnings` に `missing/mermaid.mjs` と `mermaid.url` を含む 1 件'
      - name: test_prepare_embeds_when_syntax_language_unreadable
        case: 正常
        summary: まとめられない言語だけ埋めずに警告にし、他の言語は埋める
        condition: 文書に `ts` と `yml` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js` だけに手元のモジュールを配置し、`yaml.min.js` は配置しない
        expected: '`embeds.syntax.languages` のキーが `typescript` だけで、`warnings` に `hl/languages/yaml.min.js` と `syntax.url` を含む 1 件'
      - name: test_prepare_embeds_when_dynamic_import_left
        case: 正常
        summary: まとめた後に動的 import が残る拡張を入れたうえで警告にする
        condition: '`extensions` に、`load` の中で `import(name)`（変数を指定する）を記載した拡張 1 つ'
        mock: 一時フォルダ
        expected: '`embeds.extensions` が 1 件で、`warnings` に拡張のパスと `動的 import()` を含む 1 件'
      - name: test_prepare_embeds_when_side_toc_mode
        case: 正常
        summary: 設定の `side-toc` を埋める設定に写す
        condition: '`side-toc.mode: fixed` を持つ設定と、`side-toc` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config["side-toc"]` が `{ mode: "fixed" }`、後者は `payload.config` が `side-toc` を持たない'
      - name: test_prepare_embeds_when_aliases
        case: 正常
        summary: エイリアスを payload に入れ、ずれを警告にする
        condition: インターフェース定義『文書をHTMLに書き出す』の「正常系（エイリアスを読み込む）」のフォルダ
        mock: 一時フォルダ
        expected: '`payload.aliases` が `command` の `run-test` の 1 件だけで `dev-server` を含まず、`warnings` に `alias_required_empty` の 1 件がある'
      - name: test_prepare_embeds_when_color_theme
        case: 正常
        summary: 設定の `colorTheme` を埋める設定にコピーし、知らない名前はコピーして警告する
        condition: '`colorTheme: theme-slate` の設定、`colorTheme: sepia` の設定、`colorTheme` を持たない設定'
        mock: 一時フォルダ
        expected: 1 つ目の `payload.config.colorTheme` が `theme-slate` で `warnings` が空。2 つ目は `sepia` で `warnings` に `sepia` を含む 1 件。3 つ目は `payload.config` が `colorTheme` を持たない
      - name: test_prepare_embeds_when_color_scheme
        case: 正常
        summary: 設定の `colorScheme` を埋める設定に写す
        condition: '`colorScheme: dark` の設定と、`colorScheme` を持たない設定'
        mock: 一時フォルダ
        expected: 1 つ目の `payload.config.colorScheme` が `dark`、2 つ目の `payload.config` が `colorScheme` を持たない
      - name: test_prepare_embeds_when_media
        case: 正常
        summary: 動画をコピーしてから画像を埋める
        condition: '`assets.root: assets` の設定、文書に `![操作](demo.mp4){poster=demo.png}` と `![図](a.png)`、`assets/` に 3 つのファイル、`out` が `guide.html`'
        mock: 一時フォルダ
        expected: '`guide_files/` に `demo.mp4` があり、`payload.docs[0].markdown` の `src` がコピーへの相対パスで、`poster` と画像が `data:` URL'
      - name: test_prepare_embeds_when_diagram_placement
        case: 正常
        summary: 設定の `tooltips.diagramPlacement` を埋める設定に写す
        condition: '`tooltips: { placement: bottom, diagramPlacement: top }` を持つ設定'
        mock: なし
        expected: '`payload.config.tooltips` が `{ placement: "bottom", diagramPlacement: "top" }`'
      - name: test_prepare_embeds_when_table_pin
        case: 正常
        summary: 設定の `table` を埋める設定に写す
        condition: '`table.pin: through` を持つ設定と、`table` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.table` が `{ pin: "through" }`、後者は `payload.config` が `table` を持たない'
    callees:
      - 'MOD-472-118#functions[usedLibraryMarks]'
      - 'MOD-472-112#functions[usedParts]'
      - 'MOD-472-119#functions[bundleModule]'
      - 'MOD-472-112#functions[hasDynamicImport]'
      - 'MOD-472-112#functions[inlineImages]'
      - 'MOD-472-117#functions[readIndexWithDocuments]'
      - 'MOD-472-117#functions[documentTitle]'
      - 'MOD-472-118#functions[usedSyntaxLanguages]'
      - 'MOD-472-124#functions[loadAliases]'
      - 'MOD-472-113#functions[copyMedia]'
      - 'MOD-472-112#functions[inlineImages]'
    status: planned
    introduced:
      pr: 32
  - name: runExport
    title: 文書を HTML に書き出す
    container: src/cli/export.ts
    usecase: 文書をHTMLに書き出す
    summary: '文書 1 つを `kind: document` の中身にして HTML を書き込み、警告と `書き出した: {出力}` を出す'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 出力のパスに HTML を書き込む
    args:
      - name: options
        type: '{ file: string; out?: string; config?: string; distDir: string }'
        required: true
        description: 文書・`--out`・`--config`・`dist/` の場所
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
    returns:
      type: Promise<0>
      description: 書き出したら 0
    exceptions:
      - name: CliError
        condition: 設定の誤り・文書が無い・出力先へ書き込めない
        message: '文書が無い: {パス} が見つかりません。文書のパスを修正してください。／書き込めない: {出力} に書き込めません（{理由}）。出力先のフォルダを確認してください。'
    unit_tests:
      - name: test_run_export
        case: 正常
        summary: 既定の出力に HTML を書き込む
        condition: '`file: guide.md`、`--out` 無し'
        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: '0 を返却し、`guide.html` があり、標準出力が `書き出した: guide.html`'
      - name: test_run_export_when_document_missing
        case: 異常
        summary: 無い文書は CliError
        condition: '`file: missing.md`'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `missing.md` が入る'
        exception: CliError
      - name: test_run_export_when_output_unwritable
        case: 異常
        summary: 書き込めない出力先は CliError
        condition: '`out: blocked/guide.html` で `blocked` がファイル'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `blocked/guide.html` が入る'
        exception: CliError
    callees:
      - '#functions[exportDocument]'
    refs:
      - IF-472-33#
    status: planned
    introduced:
      pr: 32
  - name: readDistAssets
    title: 配布物を読み込む
    container: src/cli/export.ts
    usecase: 共通
    summary: '`dist/index.css` を読み込み、`dist/viewer.js`・`dist/view.js` があることを確認して絶対パスを返却し、`bundle` では `dist/viewer.css` を CSS の後ろに追加する'
    description: '`dist/viewer.css` が無いときは追加せずに続ける（それ以外の読み込めない理由はそのまま投げる）。`index.css` を読み込めないか、`viewer.js`・`view.js` が無ければ `CliError`'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ distDir: string; kind: "document" | "bundle" }'
        required: true
        description: '`dist/` の場所と書き出しの種類'
    returns:
      type: 'Promise<{ distCss: string; viewer: string; view: string }>'
      description: 埋める CSS と、起動の処理（`dist/viewer.js`）・ビューの部品のモジュール（`dist/view.js`）の絶対パス
    exceptions:
      - name: CliError
        condition: '`index.css` を読み込めないか、`viewer.js`・`view.js` が無い'
        message: 配布物を読み込めません（{理由}）。mdmark をもう一度入れてください。
    status: planned
    introduced:
      pr: 32
  - name: writeHtml
    title: HTML を書き込む
    container: src/cli/export.ts
    usecase: 共通
    summary: 親のフォルダを作って HTML を書き込む
    kind: 関数
    scope: public
    is_async: true
    side_effects: 出力のパスに HTML を書き込む
    args:
      - name: options
        type: '{ file: string; display: string; html: string }'
        required: true
        description: 記載する先の絶対パス・利用者に見せるパス・HTML
    returns:
      type: Promise<void>
      description: 記載したら解決する
    exceptions:
      - name: CliError
        condition: 記載する先に記載できない
        message: '書き込めない: {出力} に書き込めません（{理由}）。出力先のフォルダを確認してください。'
    status: planned
    introduced:
      pr: 32
  - name: exportDocument
    title: 文書を HTML に書き出して結果を返却する
    kind: 関数
    container: src/cli/export.ts
    usecase: 文書をHTMLに書き出す
    summary: '文書 1 つを `kind: document` の中身にして HTML を書き込み、書き込んだパスと警告を返却する。動画と音声は HTML を書き込む前に `_files/` へコピーする（埋めるものを用意する）'
    description: '`runExport`（CLI）と MCP の `export_html` が同じ処理を呼ぶ。標準出力・標準エラーには書き込まない'
    scope: public
    is_async: true
    side_effects: 出力のパスに HTML を書き込む
    args:
      - name: options
        type: '{ cwd: string; file: string; out?: string; config?: string; distDir: string }'
        required: true
        description: 今のフォルダ・文書・出力・設定ファイル・`dist/` の場所
    returns:
      type: 'Promise<{ out: string; display: string; warnings: string[] }>'
      description: '記載した HTML の絶対パス、利用者に見せるパス（`--out` か今のフォルダからの相対パス）、`{ファイル}: {内容}` の警告'
    process: |-
      1. 設定を読み込む（設定を読み込んで構造を検める）
      2. 文書が無ければ例外にする
      3. 出力のパスを決める。`out` が無ければ文書と同じフォルダの拡張子を `.html` にしたパス
      4. URL を読み込む関数を `cacheFetchText` で作って埋めるものを用意し、配布物を読み込み、起動の処理と埋めるモジュールを 1 つのスクリプトにまとめて HTML を組み立てて記載する（埋めるものを用意する・配布物を読み込む・起動の処理の入口を作る・起動の処理と埋めるモジュールをまとめる・HTML を書き込む）
      5. 絶対パス・見せるパス・警告を返却する
    exceptions:
      - name: CliError
        condition: 設定の誤り・文書が無い・出力先へ書き込めない
