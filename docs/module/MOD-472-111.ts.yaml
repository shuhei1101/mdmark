id: MOD-472-111
visibility: internal
title: ライブラリ本体 / CLI / html.ts
test_files:
  - tests/unit/src/cli/html.test.ts
data_models:
  - name: ExportPayload
    title: 書き出しの中身
    container: src/cli/html.ts
    usecase: 共通
    summary: 書き出した HTML に JSON で埋め、開いたときに起動の処理が読み込む中身
    properties:
      - name: kind
        type: "'document' | 'bundle'"
        description: '`export` は `document`、`build` は `bundle`'
      - name: config
        type: MdmarkConfig
        description: '`features`・`libraries` を持つ設定（`libraries` の値は埋めたモジュールの名前に替える）'
      - name: index
        type: MdmarkIndex | undefined
        description: 索引
      - name: references
        type: MdmarkReferences | undefined
        description: '`collectReferences` の参照の表'
      - name: docs
        type: 'Array<{ path: string; title: string; markdown: string; docId?: string }>'
        description: 埋める文書。`markdown` は画像を `data:` URL に替え、動画・音声の `src` をコピーへの相対パスに替えたもの（`bundle` では画像を `mdmark-asset:{キー}` に替える）
      - name: entry
        type: string
        description: 最初に開く文書の `path`
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: '`loadAliases` が作ったエイリアス（`env` を含まない）。設定に `aliases` が無ければ持たない'
      - name: assets
        type: Record<string, string> | undefined
        description: '`bundle` で埋めた画像のキーから `data:` URL を参照する表。複数の文書が指す同じ画像を 1 回だけ持つ。`document` では持たない'
functions:
  - name: assembleHtml
    title: 書き出す HTML を組み立てる
    container: src/cli/html.ts
    usecase: 共通
    summary: 配布物の CSS・利用側の CSS・まとめたスクリプト・書き出しの中身を埋めた 1 枚の HTML を返却する
    description: '`<style>` に配布物の CSS、続けて利用側の CSS、`<script type="application/json" id="mdmark-payload">` に書き出しの中身、`src` を持たない `<script type="module">` に起動の処理と埋めるモジュールをまとめたスクリプトを配置する。`kind` が `bundle` のときは画面設計『まとめたHTML』の骨組み、`document` のときは描く先の要素だけを `body` に配置する。`#mdmark-payload` の JSON だけは、`JSON.stringify` した文字列の `<` を `\u003c`（JSON の文字列のエスケープ）に替え、文書の `</script>` で要素が閉じないようにする。まとめたスクリプトは替えずに配置する（`</script` と `<!--` の並びは `bundleViewer` が替えてある）。ページのタイトルは `entry` の文書のタイトル'
    kind: 関数
    scope: public
    args:
      - name: parts
        type: '{ payload: ExportPayload; distCss: string; themeCss?: string; script: string }'
        required: true
        description: 埋めるもの。`script` は `bundleViewer` が返却したまとめたスクリプト
    returns:
      type: string
      description: HTML の文字列
    unit_tests:
      - name: test_assemble_html
        case: 正常
        summary: CSS・中身・起動の処理をこの順に埋める
        condition: '`kind: document` の中身と `themeCss`'
        mock: なし
        expected: 配布物の CSS が利用側の CSS より前にあり、`id="mdmark-payload"` の JSON を `JSON.parse` すると中身に戻る
      - name: test_assemble_html_when_script_in_markdown
        case: 正常
        summary: 文書の `</script>` で要素が閉じない
        condition: 文書の Markdown が `</script><script>alert(1)</script>` を持つ
        mock: なし
        expected: HTML の `</script>` は起動の処理と中身の要素を閉じる 2 つだけで、中身を `JSON.parse` すると元の Markdown に戻る
      - name: test_assemble_html_when_bundle
        case: 正常
        summary: bundle は画面の骨組みを配置する
        condition: '`kind: bundle` の中身'
        mock: なし
        expected: '`body` に `.mdmark-bundle`・`.mdmark-bundle-side`・`dialog.mdmark-bundle-panel` がある'
    status: planned
    introduced:
      pr: 32
    refs:
      - MOD-472-166#functions[buildDist]
