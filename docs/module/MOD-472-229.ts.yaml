id: MOD-472-229
visibility: internal
title: ライブラリ本体 / 記法の共通 / text.interact.ts
test_files:
  - tests/unit/src/shared/text.interact.browser.test.ts
functions:
  - name: visibleText
    title: 要素の見える文字を読み込む
    container: src/shared/text.interact.ts
    kind: 関数
    scope: internal
    summary: 要素の `textContent` から、用語のツールチップ（`.mdmark-term-tip`）と脚注・注記の参照（`.mdmark-fn-ref`。番号・スクリーンリーダー用の文字・ツールチップ）の文字を除いて前後の空白を落とした文字を返却する
    description: 表の並べ替え・絞り込み・ピン止めのセルの値、見出しのボタンの名前、行の詳細の開閉ボタンの名前は、この関数で読み込む。脚注・注記の参照の外にあるスクリーンリーダー用の文字（`.mdmark-visually-hidden`）は残す。要素は書き換えない
    args:
      - name: element
        type: Element
        required: true
        description: 読み込む要素
    returns:
      type: string
      description: ツールチップと脚注・注記の参照を除いた文字
    unit_tests:
      - name: test_visible_text
        case: 正常
        summary: ツールチップの文字を除く
        condition: '`<td>本文の<span class="mdmark-term-wrap"><span class="mdmark-term">マーカー</span><span class="mdmark-term-tip">用語HTML コメントで記載する指定</span></span></td>`'
        mock: なし（Chromium）
        expected: '`本文のマーカー`、`td` の中身が変わらない'
      - name: test_visible_text_when_footnote_ref
        case: 正常
        summary: 脚注・注記の参照の番号・スクリーンリーダー用の文字・ツールチップを除く
        condition: '`<td>確認<sup class="mdmark-fn-ref"><a class="mdmark-fn-link"><span class="mdmark-visually-hidden">脚注 </span>1</a><span class="mdmark-fn-tip">脚注定義</span></sup></td>` と `<td>承認<sup class="mdmark-fn-ref mdmark-note-ref"><a class="mdmark-fn-link"><span class="mdmark-visually-hidden">注記 </span>1</a><span class="mdmark-fn-tip">注記定義</span></sup></td>`'
        mock: なし（Chromium）
        expected: '`確認` と `承認`、`td` の中身が変わらない'
  - name: cellValue
    title: 表のセルの値を読み込む
    container: src/shared/text.interact.ts
    kind: 関数
    scope: internal
    summary: セルが `data-value` を持てばその値を、持たなければ `visibleText` の文字を返却する
    description: 表の並べ替え・絞り込み（候補を含む）・コピー・集計のセルの値は、この関数で読み込む
    args:
      - name: cell
        type: HTMLTableCellElement
        required: true
        description: 読み込むセル
    returns:
      type: string
      description: セルの値
    callees:
      - '#functions[visibleText]'
    unit_tests:
      - name: test_cell_value
        case: 正常
        summary: data-value を優先し、無ければ見える文字を読み込む
        condition: '`<td data-value="false"><span class="mdmark-visually-hidden">いいえ</span></td>` と `<td>未定</td>`'
        mock: なし（Chromium）
        expected: '`false` と `未定`'
  - name: removeHiddenText
    title: 幅を取らない文字の要素を取り除く
    container: src/shared/text.interact.ts
    kind: 関数
    scope: internal
    summary: 要素の子孫のうち `HIDDEN_TEXT_SELECTOR` に該当する要素を取り除く
    description: 表の列の幅を測るときに、複製したセルと見出しの中身を指定して呼ぶ（描いた要素を指定しない）。並べ替え・絞り込みの値を読み込む `visibleText` は、スクリーンリーダー用の文字を値に含めるため、この関数を使用しない
    args:
      - name: root
        type: Element
        required: true
        description: 取り除く要素を探す要素（複製した要素）
    returns:
      type: void
      description: 戻り値は無い
    side_effects: '`root` の子孫から該当した要素を取り除く'
    unit_tests:
      - name: test_remove_hidden_text
        case: 正常
        summary: ツールチップとスクリーンリーダー用の文字を取り除き、見えている文字を残す
        condition: '`<td><span class="mdmark-term-wrap"><span class="mdmark-term">ターン</span><span class="mdmark-term-tip is-open">用語意味</span></span>と確認<sup class="mdmark-fn-ref"><a class="mdmark-fn-link"><span class="mdmark-visually-hidden">脚注 </span>1</a><span class="mdmark-fn-tip">脚注定義</span></sup></td>` を複製した要素'
        mock: なし（Chromium）
        expected: 複製した要素の `textContent` が `ターンと確認1`（開いているツールチップも取り除く）。元の `td` の中身が変わらない
lead: '要素の見える文字と表のセルの値の取り出しを受け持ち、コピーや見出しの文字の取り出し方を変えるときに参照する。'
tags:
  - name: topic:用語
    main: true
  - name: topic:dom
  - name: action:操作
  - name: topic:部品
  - name: action:コピー
  - name: action:取り出し
constants:
  - name: HIDDEN_TEXT_SELECTOR
    title: セルの中で幅を取らない文字の要素
    container: src/shared/text.interact.ts
    summary: 用語・脚注・注記のツールチップと画面に出さないスクリーンリーダー用の文字の要素を指すセレクタ。表示の状態（開いているか）でなくクラスで決める
    value: "'.mdmark-term-tip, .mdmark-fn-tip, .mdmark-visually-hidden'"
    refs:
      - CMP-472-61#notes
    status: planned
