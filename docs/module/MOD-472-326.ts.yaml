id: MOD-472-326
visibility: internal
title: ライブラリ本体 / 部品 / text-color.ts
test_files:
  - tests/unit/src/parts/text-color.test.ts
functions:
  - name: renderTextColor
    title: 文字の色を描く
    container: src/parts/text-color.ts
    kind: 関数
    scope: internal
    summary: 部品設計『文字の色』の HTML を返却する。`text` は描いた行内の HTML（`SLOT_MARKER` を指定できる）
    args:
      - name: options
        type: '{ color: ColorName; text: string }'
        required: true
        description: 色の名前と中身の HTML
    returns:
      type: string
      description: '`<span class="mdmark-color" data-color="{color}">` の HTML'
    refs:
      - CMP-472-48#
    unit_tests:
      - name: test_render_text_color
        case: 正常
        summary: 色の名前を data-color にして中身を包む
        condition: '`color: blue`、`text: "<strong>重要</strong>"`'
        mock: なし
        expected: '`<span class="mdmark-color" data-color="blue"><strong>重要</strong></span>`'
    status: planned
    introduced:
      pr: 263
