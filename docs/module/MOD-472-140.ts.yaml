id: MOD-472-140
visibility: internal
title: ライブラリ本体 / map / 読み取り / spec.ts
test_files:
  - tests/unit/src/map/spec.test.ts
data_models:
  - name: MapProblem
    title: 書き方の誤りの項目
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 読み取りと点検が返却する 1 件
    properties:
      - name: kind
        type: '"map_invalid" | "map_unknown_ref" | "map_unknown_key" | "map_retired_key" | "map_invalid_value" | "map_unknown_icon" | "map_unknown_class" | "map_unknown_line" | "map_ambiguous_ref" | "annotation_undefined"'
        description: ずれの種類と同じ名前
      - name: line
        type: number | undefined
        description: 範囲の開きのマーカーからの行（0 から）。範囲の全体を指すときは無い
      - name: message
        type: string
        description: 書き方の警告と点検の内容に出す 1 文（修正方法を含む）
  - name: MapKind
    title: ノードの種類
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 設定の `map.kinds` の 1 つの値（公開の型）
    properties:
      - name: label
        type: string | undefined
        description: 種類の行の名前
      - name: icon
        type: string | undefined
        description: Lucide のアイコンの名前
      - name: shape
        type: '"rounded" | "rect" | "pill" | "double" | undefined'
        description: 形状
      - name: color
        type: string | undefined
        description: 色の名前
  - name: MapLine
    title: 線の種類
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 設定の `map.lines` の 1 つの値（公開の型）
    properties:
      - name: dash
        type: '"solid" | "dashed" | "dotted" | "dash-dot" | "long-dash" | undefined'
        description: 模様
      - name: width
        type: '"thin" | "normal" | "thick" | undefined'
        description: 太さ
      - name: head
        type: '"filled" | "open" | "none" | undefined'
        description: 矢じり
      - name: color
        type: string | undefined
        description: 色の名前
  - name: MapArgs
    title: 印の引数
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseMapArgs` が読み取った印の引数（A-128 の構成）'
    properties:
      - name: title
        type: string | undefined
        description: 図の枠と折りたたみの見出し
      - name: focus
        type: string | undefined
        description: 最初に入るグループの ID
      - name: collapse
        type: '{ open: boolean; title: string | undefined } | undefined'
        description: 図を折りたたみに入れる（A-128 の共通の折り畳み）
constants:
  - name: MAP_ARG_KEYS
    title: 印の引数のキー
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    summary: 印の JSON のオブジェクトで読み取るキー
    value: '["title", "focus", "collapse"]'
  - name: RETIRED_MAP_ARG_KEYS
    title: 廃止した印の引数のキー
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    summary: 読み取らずに `map_retired_key` の項目にする印のキー
    value: '["play", "interval"]'
functions:
  - name: parseMapArgs
    title: 印の引数を読み取る
    kind: 関数
    container: src/map/spec.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    scope: public
    summary: 印の引数の文字を JSON のオブジェクトとして読み取り、`MAP_ARG_KEYS` のキーだけを `MapArgs` にし、廃止したキーと読み取れない・型の合わない値を項目にし、知らないキーを返却する
    args:
      - name: source
        type: string
        required: true
        description: '`<!-- map:` と `-->` の間の文字（無ければ空）'
    returns:
      type: '{ args: MapArgs; normalized: string; problems: MapProblem[]; unknownKeys: string[] }'
      description: 読み取った引数・`data-map-args` に入れる空白なしの JSON・書き方の警告にする項目・点検だけが通知する知らないキー
    process: |-
      1. 空なら既定の `MapArgs` を返却する
      2. `JSON.parse` で読み取り、オブジェクトでなければ `map_invalid_value`（JSON のオブジェクトで記載する修正方法）の項目にして既定を返却する
      3. `RETIRED_MAP_ARG_KEYS` のキーを捨て、あれば記載したキーを `・` でつないだ `map_retired_key`（`mdmark upgrade` で削除できる旨）の項目を 1 つにする
      4. `MAP_ARG_KEYS` にも `RETIRED_MAP_ARG_KEYS` にも無いキーを `unknownKeys` に入れて捨てる
      5. 型の合わない値（`collapse` がオブジェクトでない など）を `map_invalid_value` の項目にして既定にする
    unit_tests:
      - name: test_parse_map_args
        case: 正常
        summary: 全てのキー
        condition: '`{"title": "全体", "focus": "read", "collapse": {"open": false}}`'
        mock: なし
        expected: 全てのキーが読み取れ、`problems`・`unknownKeys` が空
      - name: test_parse_map_args_when_empty
        case: 正常
        summary: 引数なし
        condition: 空の文字
        mock: なし
        expected: 'どのキーも無い'
      - name: test_parse_map_args_when_unknown_key
        case: 正常
        summary: 知らないキー
        condition: '`{"title": "全体", "mdoe": 1}`'
        mock: なし
        expected: '`unknownKeys` が `[mdoe]` で、`problems` が空、`normalized` に `mdoe` が無い'
      - name: test_parse_map_args_when_not_json
        case: 異常
        summary: JSON として読み取れない
        condition: '`{title: 全体}`'
        mock: なし
        expected: '`map_invalid_value` が 1 件で、既定の引数'
      - name: test_parse_map_args_when_wrong_type
        case: 異常
        summary: 型の合わない値
        condition: '`{"collapse": "abc"}`'
        mock: なし
        expected: '`map_invalid_value` が 1 件で、`collapse` が無い'
      - name: test_parse_map_args_when_retired
        case: 正常
        summary: 廃止したキー
        condition: '`{"title": "再生", "play": "autoplay", "interval": 3}`'
        mock: なし
        expected: '`problems` が `map_retired_key` の 1 件で内容に `play・interval` と `mdmark upgrade` があり、`unknownKeys` が空、`normalized` が `{"title":"再生"}`'
lead: 'map のマーカーの引数の読み取りと map の型を受け持ち、マーカーの引数を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
  - name: action:読み取り
