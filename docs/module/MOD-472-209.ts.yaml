id: MOD-472-209
visibility: internal
title: ライブラリ本体 / 描く / highlight-lines.ts
test_files:
  - tests/unit/src/highlight-lines.test.ts
functions:
  - name: highlightLines
    title: 色分けした行を作る
    container: src/highlight-lines.ts
    kind: 関数
    scope: internal
    summary: '行の文字を改行でつないで highlight.js の `highlight`（`ignoreIllegals: true`）に経由し、`splitHighlightedLines` で行ごとの HTML に戻す'
    description: 行をまたぐコメント・文字列も正しく色分けするため、行ごとでなくつないだ文字を一度に経由する。`mount` と部品の描画のインターフェース（Node）が使用する
    args:
      - name: options
        type: '{ hljs: HLJSApi; language: string; lines: string[] }'
        required: true
        description: '`hljs` は言語を登録した本体（型は npm の `highlight.js` から `import type`）、`language` は言語のモジュール名、`lines` はエスケープ前の行の文字'
    returns:
      type: string[]
      description: 行ごとの色分けした HTML。数は `lines` と同じ
    callees:
      - '#functions[splitHighlightedLines]'
    unit_tests:
      - name: test_highlight_lines
        case: 正常
        summary: 行をまたぐ文字列を色分けし、行の数と文字を変えない
        condition: 'npm の `highlight.js/lib/core` に `yaml` を登録し、`key: |`・`  a < b`・`  c` の 3 行'
        mock: なし
        expected: 3 要素で、2・3 要素目が `<span class="hljs-string">` で始まり `</span>` で終わる。各要素のタグを削除してエスケープを戻した文字が元の行と同じ
    status: planned
    introduced:
      pr: 97
  - name: splitHighlightedLines
    title: 色分けしたHTMLを行に分ける
    container: src/highlight-lines.ts
    kind: 関数
    scope: internal
    summary: highlight.js が返却した HTML を改行で分け、行末で開いている `span` を閉じて次の行の頭で同じ開始タグをもう一度開く
    description: 入力のタグは highlight.js が出す `<span class="...">` と `</span>` だけとして扱い、文字はエスケープ済みのまま切り分ける。開いている開始タグを入れ子の順に持ち、行末でその数だけ `</span>` を追加し、次の行の頭に同じ順で開始タグを配置する
    args:
      - name: html
        type: string
        required: true
        description: highlight.js の `highlight` の `value`
    returns:
      type: string[]
      description: 行ごとの HTML。改行が n 個なら n + 1 要素
    unit_tests:
      - name: test_split_highlighted_lines
        case: 正常
        summary: 行をまたぐ `span` を行末で閉じ、次の行でもう一度開く
        condition: '`<span class="hljs-comment">/*\n * a\n */</span>\nx`'
        mock: なし
        expected: '`["<span class=\"hljs-comment\">/*</span>", "<span class=\"hljs-comment\"> * a</span>", "<span class=\"hljs-comment\"> */</span>", "x"]`'
      - name: test_split_highlighted_lines_when_nested
        case: 正常
        summary: 入れ子の `span` を内側から閉じ、外側からもう一度開く
        condition: '`<span class="hljs-string">`a<span class="hljs-subst">${b\nc}</span>`</span>`'
        mock: なし
        expected: 1 要素目が `</span></span>` で終わり、2 要素目が `<span class="hljs-string"><span class="hljs-subst">c}` で始まる
      - name: test_split_highlighted_lines_when_single_line
        case: 正常
        summary: 改行が無ければそのまま 1 要素で返却する
        condition: '`<span class="hljs-number">1</span> &lt; 2`'
        mock: なし
        expected: '`["<span class=\"hljs-number\">1</span> &lt; 2"]`'
    status: planned
    introduced:
      pr: 97
