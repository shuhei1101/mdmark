id: MOD-472-135
visibility: internal
title: ライブラリ本体 / map / 点検 / check.ts
test_files:
  - tests/unit/src/map/check.test.ts
functions:
  - name: collectMapProblems
    title: 書き方の誤りを集める
    kind: 関数
    container: src/map/check.ts
    usecase: 設定と索引を点検する
    role: 処理
    summary: map の範囲の Mermaid と補足と設定から、`collectMapStructure` の項目に Mermaid と補足の中身の項目を加えた `MapProblem` を全て集める（`dist/map.js` と CLI が呼ぶ）
    scope: public
    callees:
      - MOD-589-1#functions[collectMapStructure]
      - MOD-472-137#functions[parseFlowchart]
      - MOD-472-138#functions[parseSequence]
      - MOD-531-1#functions[parseErDiagram]
      - MOD-531-2#functions[parseStateDiagram]
      - MOD-596-1#functions[parseClassDiagram]
      - MOD-596-2#functions[parseArchitecture]
      - MOD-596-3#functions[parseC4Context]
      - MOD-472-139#functions[parseMapData]
      - MOD-472-140#functions[parseMapArgs]
      - MOD-472-137#functions[mapLinkProblems]
      - MOD-649-1#functions[parseMindmap]
      - MOD-653-1#functions[parseAxisGrid]
      - MOD-653-1#functions[axisGridItemOf]
    args:
      - name: range
        type: '{ args: string; mermaid: string | undefined; mermaidCount: number; data: string | undefined; dataCount: number }'
        required: true
        description: 範囲の印の引数・mermaid のブロック・補足とその数
      - name: config
        type: ResolvedConfig["map"]
        required: true
        description: 既定を当てた設定の `map`
      - name: options
        type: '{ includeUnknownKeys: boolean; idLinks: { mode: "resolve"; resolveIdLink: ResolveIdLink | undefined } | { mode: "skip" } }'
        required: true
        description: 印の知らないキーを項目にするか（`checkMaps` は `true`、`attachMap` は `false`）と、`id:` のノードのリンク先の扱い（`checkMaps` は `skip`、`attachMap` は `resolve` と `hooks.resolveIdLink`）
    returns:
      type: MapProblem[]
      description: 項目（範囲の行の順）
    process: |-
      1. `collectMapStructure` で範囲の形を確かめ、`kind` が無ければその項目を返して終える
      2. 印の引数の`unknownKeys` は `includeUnknownKeys` が `true` のとき（点検）だけ `map_unknown_key` にする（描くときは警告にしない）
      3. 種類ごとに `parseFlowchart`・`parseSequence`・`parseErDiagram`・`parseStateDiagram`・`parseClassDiagram`・`parseArchitecture`・`parseC4Context`・`parseMindmap`・`parseAxisGrid` のどれかと `parseMapData` の項目を合わせる
      4. 補足の `notes`・`walkthroughs`・`layout`・`plays_over` が指す ID が Mermaid に無いものを `map_unknown_ref` にする。`notes.{ID}.annotations` が指す注記の ID のうち、文書に定義が無いもの（呼び出し元が指定する、文書の注記の定義の ID の集合に無いもの）を `annotation_undefined` にする。`ends`・`via` を持つノード・グループの ID は `map_invalid_value` にする（`notes` はノード・線・`subgraph` の ID を指せる）
      5. ER 図は、補足の `notes` のキーのうちテーブル名・`{テーブル}.{列}`・関連の `r{番号}`・分類の ID に無いものと、`groups` の `tables` に無いテーブルと `parent` に無い分類を `map_unknown_ref`、2 つの分類に入るテーブル・テーブル名と同じ分類の ID・`r{番号}` と同じテーブル名を `map_invalid_value` にする。状態遷移図は、`notes` のキーのうち状態の ID・遷移の `t{番号}` に無いものを `map_unknown_ref`、`t{番号}` と同じ状態の ID を `map_invalid_value` にする。クラス図は、`notes` のキーのうちクラス名・`{クラス名}.{メンバー名}`・関係の `r{番号}`・`namespace` の ID に無いものを、アーキテクチャ図は service・group・junction の ID・線の `r{番号}` に無いものを、C4 図は要素・境界の別名・関係の `r{番号}` に無いものを `map_unknown_ref` にする。マインドマップは、補足のキーのうち項目の ID と ID を持たない項目の表示する文字に無いものを `map_unknown_ref`、補足とマーカーの引数の `focus` のキーのうち `parseMindmap` の `ambiguous` にあるものを `map_ambiguous_ref`（その項目に ID を記載して ID で指す修正の方法を添える）、`layout` の `color`・`collapsed` のほかのキーを `map_invalid_value`（並び順は Mermaid の行の順で変える旨を添える）にする。ガントチャート・タイムライン・Git グラフ・ジャーニー・ブロック図は、補足とマーカーの引数の `focus` のキーを `axisGridItemOf` で照らし、`missing` を `map_unknown_ref`、`ambiguous` を `map_ambiguous_ref`（項目に ID を記載して ID で指すか、section の名前を分ける修正の方法を添える）、`layout` の `color`・`collapsed` のほかのキーをマインドマップと同じく `map_invalid_value` にする
      6. `flowchart` の `links` を `mapLinkProblems`（`idLinks` は引数の `idLinks`）で確かめ、許さないリンク先を `map_invalid_value` にする
      7. ノードのクラスが `config.kinds` に無いものを `map_unknown_class`、`layout` の `line` が `config.lines` に無いものを `map_unknown_line` にする（同じ名前は 1 件）
    unit_tests:
      - name: test_collect_map_problems
        case: 正常
        summary: ずれの無い範囲
        condition: モックの `FLOW`・`DATA`・`CONFIG`
        mock: なし
        expected: 空
      - name: test_collect_map_problems_when_unknown_ref
        case: 異常
        summary: 無い ID
        condition: 補足の `notes.ghost`
        mock: なし
        expected: '`map_unknown_ref` が 1 件で `notes.ghost` を含む'
      - name: test_collect_map_problems_when_group_note
        case: 正常
        summary: グループの ID を指す notes をずれにしない
        condition: 補足の `notes.lib`（`lib` は `subgraph` の ID）
        mock: なし
        expected: 空
      - name: test_collect_map_problems_when_link_not_allowed
        case: 異常
        summary: 許さないノードのリンク先
        condition: '`click a "javascript:alert(1)"` の行'
        mock: なし
        expected: '`map_invalid_value` が 1 件で、`a` と `javascript:alert(1)` を含む'
      - name: test_collect_map_problems_when_wire_override_on_node
        case: 異常
        summary: 線の上書きをノードに指定した
        condition: '`via` を持つノード'
        mock: なし
        expected: '`map_invalid_value` が 1 件'
      - name: test_collect_map_problems_when_unknown_class
        case: 異常
        summary: 設定に無いクラス
        condition: '`:::queue` のノードと `queue` の無い `kinds`'
        mock: なし
        expected: '`map_unknown_class` が 1 件'
      - name: test_collect_map_problems_when_unknown_line
        case: 異常
        summary: 設定に無い線の名前
        condition: '`layout` の `line: back` と `back` の無い `lines`'
        mock: なし
        expected: '`map_unknown_line` が 1 件'
      - name: test_collect_map_problems_when_no_mermaid
        case: 異常
        summary: mermaid のブロックが無い
        condition: '`mermaidCount: 0`'
        mock: なし
        expected: '`map_invalid` が 1 件だけ'
      - name: test_collect_map_problems_when_unsupported_kind
        case: 異常
        summary: 描けない種類
        condition: '`pie` のブロック'
        mock: なし
        expected: '`map_invalid` が 1 件で、`flowchart`・`sequenceDiagram`・`erDiagram`・`stateDiagram-v2`・`classDiagram`・`architecture-beta`・`C4Context`・`mindmap`・`gantt`・`timeline`・`gitGraph`・`journey`・`block-beta` を含む'
      - name: test_collect_map_problems_when_unknown_arg
        case: 異常
        summary: 印の知らないキー
        condition: '`{"mdoe": 1}` と `includeUnknownKeys: true`'
        mock: なし
        expected: '`map_unknown_key` が 1 件で、使用できるキーの一覧を含む。`includeUnknownKeys: false` では空'
      - name: test_collect_map_problems_when_er
        case: 異常
        summary: ER 図の補足のずれ
        condition: テーブル「注文」「明細」・関連 2 本と、補足の `notes` の `注文.幽霊`・`r3`・分類の ID `記録`、`groups` の `記録`（無いテーブル「支払い」）と `明細`
        mock: なし
        expected: '`map_unknown_ref` が 3 件と `map_invalid_value` が 1 件で、`notes.記録` の項目は無い'
      - name: test_collect_map_problems_when_state
        case: 異常
        summary: 状態遷移図の補足のずれ
        condition: 遷移 1 本と、補足の `notes` の `t2`
        mock: なし
        expected: '`map_unknown_ref` が 1 件で `notes.t2` を含む'
      - name: test_collect_map_problems_when_class_architecture_c4
        case: 異常
        summary: クラス図・アーキテクチャ図・C4 図の補足のずれ
        condition: クラス図の補足の `notes` の `図面.幽霊`、アーキテクチャ図の `notes` の `r9`、C4 図の `layout` の `ghost`
        mock: なし
        expected: '`map_unknown_ref` が 3 件で、`notes.図面.幽霊`・`notes.r9`・`layout.ghost` を含む'
      - name: test_collect_map_problems_when_mindmap
        case: 異常
        summary: マインドマップの補足とマーカーの引数のずれ
        condition: モックの `MINDMAP` と、補足の `notes` の `課題`・`幽霊`、`layout` の `マイルストーン` の `pos`・`a1` の `color`、マーカーの引数の `focus` の `課題`
        mock: なし
        expected: '`map_ambiguous_ref` が 2 件で `notes.課題` と `focus` を含み、ID を記載して ID で指す修正の方法を含む。`map_unknown_ref` が 1 件で `notes.幽霊` を含む。`map_invalid_value` が 1 件で `layout.マイルストーン.pos` を含み、`a1` の `color` の項目は無い'
      - name: test_collect_map_problems_when_mindmap_second_root
        case: 異常
        summary: マインドマップの 2 つ目の根
        condition: モックの `MINDMAP_UNREADABLE`
        mock: なし
        expected: '`map_invalid` が 1 件で、範囲の開きのマーカーからの行を持つ'
      - name: test_collect_map_problems_when_axis_grid
        case: 異常
        summary: 軸と格子の配置の図の補足のずれ
        condition: 'モックの `GANTT` に補足の `notes` の `幽霊` と `layout` の `準備: { collapsed: true }`・`tst` の `pos`、`id:` を持たず同じ `msg:` を持つ commit 2 つの gitGraph に `notes` のその `msg:`、`BLOCK` に `layout` の `ghost`、ずれの無い `TIMELINE_DATA`'
        mock: なし
        expected: '`map_unknown_ref` が 2 件（`notes.幽霊`・`layout.ghost`）、`map_ambiguous_ref` が 2 件（`layout.準備` に section の名前を分ける修正の方法、commit に `id:` を記載する修正の方法）、`map_invalid_value` が 1 件（`layout.tst.pos`）。タイムラインの項目は無い'
      - name: test_collect_map_problems_when_id_link
        case: 正常
        summary: 'id: のノードのリンク先'
        condition: '`click A "id:SC-1"`・`click C "javascript:alert(1)"` の flowchart を `idLinks` が `skip` と、関数を持たない `resolve` で集める'
        mock: なし
        expected: '`skip` は `map_invalid_value` が `C` の 1 件だけ。`resolve` は `A` と `C` の 2 件'
  - name: checkMapConfig
    title: map の設定を点検する
    kind: 関数
    container: src/map/check.ts
    usecase: 設定と索引を点検する
    role: 処理
    summary: 設定の `map.kinds` の `icon` のうち `lucideIconNames` に無い名前を `map_unknown_icon` の項目にする（Schema の検査は `validateConfig`）
    scope: public
    args:
      - name: map
        type: unknown
        required: true
        description: 設定ファイルの `map` の値
    returns:
      type: 'Array<{ key: string; message: string }>'
      description: キーのパス（`map.kinds.store.icon`）と内容
    unit_tests:
      - name: test_check_map_config
        case: 正常
        summary: 知っているアイコン
        condition: '`icon: database`'
        mock: なし
        expected: 空
      - name: test_check_map_config_when_unknown_icon
        case: 異常
        summary: 無いアイコン
        condition: '`icon: no-such-icon`'
        mock: なし
        expected: 1 件で、キーが `map.kinds.store.icon`
  - name: needsMermaidFallback
    title: 範囲の外のmapの図をmermaidの図に戻すかを確かめる
    container: src/map/check.ts
    kind: 関数
    scope: internal
    summary: 範囲の外の map の図（`data-map-plain`）を mermaid の図に戻すかを返却する。図の種類の読み取りが返す Mermaid の書き方の項目（読めない行・閉じの無い `subgraph` と複合フラグメント）が 1 つでもあるか、map が読み捨てる見た目の指定（`classDef`・`style`・`linkStyle`・`cssClass` の行、flowchart と状態遷移図の `class` の行、ノードの `:::` のクラスの指定、マインドマップの `::icon()` の行）が 1 つでもあれば `true`
    description: '`collectMapProblems` と同じ図の種類ごとの読み取りで確かめ、補足と設定は確かめない。`dist/map.js` の `attachMap` と CLI の `usesMermaid` が同じ判定に使用する'
    args:
      - name: options
        type: '{ kind: MapKindName; mermaid: string }'
        required: true
        description: 図の種類と、front matter を除いた Mermaid のソース
    returns:
      type: boolean
      description: mermaid の図に戻すか
    refs:
      - IF-472-35#constraints[範囲の外の map の図を mermaid の図に戻す]
    unit_tests:
      - name: test_needs_mermaid_fallback
        case: 正常
        summary: map が読める図は戻さない
        condition: 読める行だけの flowchart と、`class 図面` の宣言を持つ classDiagram
        mock: なし
        expected: どちらも `false`
      - name: test_needs_mermaid_fallback_when_unreadable
        case: 正常
        summary: 読めない行と閉じの無い subgraph で戻す
        condition: '`A --o B` の行を持つ flowchart と、`end` の無い `subgraph` を持つ flowchart'
        mock: なし
        expected: どちらも `true`
      - name: test_needs_mermaid_fallback_when_style
        case: 正常
        summary: 見た目の指定で戻す
        condition: '`style A fill:#f9f` の flowchart、`A:::warn` の flowchart、`cssClass "図面" warn` の classDiagram、`class 待機 idle` の stateDiagram'
        mock: なし
        expected: どれも `true`
      - name: test_needs_mermaid_fallback_when_mindmap
        case: 正常
        summary: マインドマップの見た目の指定
        condition: モックの `MINDMAP`（`::icon(fa fa-book)` と `:::urgent` を持つ）・`::icon()` の行だけを持つ mindmap・`MINDMAP_PLAIN`
        mock: なし
        expected: 前の 2 つが `true`、`MINDMAP_PLAIN` が `false`
lead: 'map の記載の誤りの収集と設定の点検を受け持ち、map の記載の警告と点検のずれを変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
  - name: action:点検
