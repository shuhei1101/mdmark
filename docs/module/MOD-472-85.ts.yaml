id: MOD-472-85
visibility: internal
title: VS Code 拡張機能 / ビルドと配布 / build.ts
test_files:
  - tests/unit/vscode/scripts/build.test.ts
functions:
  - name: buildExtension
    title: 拡張機能をビルドする
    kind: 関数
    container: vscode/scripts/build.ts
    usecase: 拡張機能の配布物を作る
    summary: 'esbuild で `src/extension.ts` を `dist/extension.cjs`（`format: "cjs"`・`platform: "node"`・`external: ["vscode"]`）に書き込み、Vite の `build()` で `vite.config.ts` のとおり Webview を `media/preview.js`・`media/preview.css` に書き込む'
    description: '拡張機能をまとめるときは、`esbuild-wasm/lib/browser.js` の先頭に `var self = globalThis;` を追加する esbuild のプラグインを当て（`globalThis` に `self` を追加しない）、`esbuild-wasm/esbuild.wasm` を `dist/esbuild.wasm` に複写する。`tests` が `true` のときは、`tests/integration/index.ts` と `*.test.ts` も `out/test/*.mjs`（`format: "esm"`・`platform: "node"`・`external: ["vscode", "mocha"]`）に記載し、`axe-core` の `axe.min.js` を `media/test/axe.js` に複写する（Webview が `axe` を受けたときだけ読み込む。本番の `preview.js` にはまとめない）。ファイルの末尾で `import.meta.main` が `true` のときだけ、`process.argv` に `--tests` があるかを指定して呼ぶ'
    scope: public
    is_async: true
    side_effects: '`dist/`・`media/`・`out/` に書き込む'
    args:
      - name: options
        type: '{ root: string; tests: boolean }'
        required: true
        description: '`vscode/` の場所と、結合テストもまとめるか'
    returns:
      type: Promise<void>
      description: 書き込み終えたら解決する
    exceptions:
      - name: Error
        condition: esbuild か Vite が失敗した（もう一度投げる。`main` では終了コード 1）
    unit_tests:
      - name: test_build_extension
        case: 正常
        summary: 拡張機能と Webview を書き出し、vscode と axe をまとめない
        condition: 作業ツリーの `vscode/` を、`node_modules/`・`.vscode-test/`・`out/`・`dist/`・`media/` を除外して一時フォルダに複製し（`node_modules/` はシンボリックリンク）、`tests` が `false` で呼ぶ
        mock: なし（一時フォルダ）
        expected: '`dist/extension.cjs` が `require("vscode")` と、`self` を `globalThis` にする宣言（esbuild が名前に数字を付けた `var self{数字} = globalThis;`）を含み、`dist/esbuild.wasm` があり、`media/` の JS が `preview.js` の 1 つだけで `axe-core` を含まず、`media/preview.css` があり、`out/` と `media/test/` が無い'
      - name: test_build_extension_when_tests
        case: 正常
        summary: 結合テストのビルドでは axe を media/test に複写する
        condition: 同じ複製で `tests` が `true` で呼ぶ
        mock: なし（一時フォルダ）
        expected: '`out/test/index.mjs` と `media/test/axe.js` があり、`media/preview.js` が `axe-core` を含まない'
    refs:
      - LIB-472-10#
      - LIB-472-32#
      - LIB-472-5#
      - MOD-472-61#constants[viteConfig]
    status: planned
