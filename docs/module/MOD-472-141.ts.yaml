id: MOD-472-141
visibility: internal
title: ライブラリ本体 / map / 配置 / layout.ts
test_files:
  - tests/unit/src/map/layout.test.ts
data_models:
  - name: MapView
    title: 見せ方
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`layoutMap` に指定する中へ入ったグループ・閉じたグループ'
    properties:
      - name: entered
        type: string | undefined
        description: 中へ入ったグループの ID
      - name: collapsed
        type: string[]
        description: 閉じたグループの ID
  - name: MapOverride
    title: 配置の上書き
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 補足の `layout`・動かした位置・測った大きさ・種類の形状の余白を合わせた 1 つの ID の制約
    properties:
      - name: align
        type: string | undefined
        description: 同じ段に配置する相手の ID
      - name: order
        type: number | undefined
        description: 段の中の並び順
      - name: pos
        type: '{ x: number; y: number } | undefined'
        description: 親の中身の左上からの座標で固定する
      - name: width
        type: number | undefined
        description: ノードの幅
      - name: justify
        type: '"start" | "center" | "end" | undefined'
        description: 段の中で寄せる側
      - name: ends
        type: '{ from?: "top" | "right" | "bottom" | "left"; to?: "top" | "right" | "bottom" | "left" } | undefined'
        description: 線の端をつなぐ辺（補足の `ends` と、つなぎ替えた辺の `attachments`）
      - name: via
        type: 'Array<{ x: number; y: number }> | undefined'
        description: 線の経由点（両端の共通の祖先の中身の左上からの座標）
      - name: size
        type: '{ w: number; h: number } | undefined'
        description: 描いて測ったノードの大きさ。見積もりの代わりに使用する
      - name: above
        type: number | undefined
        description: ノードの上に空ける高さ（同じ状態への遷移の線とラベルの置き場所）。ほかのノードを重ねず、線も通さない
      - name: aside
        type: number | undefined
        description: ノードの左右それぞれに空ける幅（ER 図の関連の端と多重度の置き場所）。ほかのノードを重ねず、線は通す
      - name: rankless
        type: boolean | undefined
        description: 線の ID に指定すると、段を決める処理でその線を使用しない（アーキテクチャ図の上下の辺でつなぐ線・C4 図の `Rel_L`・`Rel_R`）。経路は引く
      - name: sides
        type: '"horizontal" | undefined'
        description: ノードの ID に指定すると、そのノードの線の端を左右の辺だけにつなぐ（ER 図のテーブル。端を列の行の高さへ付け替えるため）
      - name: padLeft
        type: number | undefined
        description: ノードの左の余白（px）。種類の形状が `pill` のノードは `LABEL_METRICS.padPill`。無ければ `LABEL_METRICS.padX`
  - name: MapLayout
    title: 配置の結果
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`layoutMap` の戻り値（部品『mapの構成図』の `layout`）'
    properties:
      - name: width
        type: number
        description: 図の幅
      - name: height
        type: number
        description: 図の高さ
      - name: nodes
        type: PlacedNode[]
        description: ノード（`id`・`x`・`y`・`w`・`h`・`lines`・`faded`・`ancestors`）。`ancestors` は内側から
      - name: groups
        type: PlacedGroup[]
        description: グループ（`id`・`title`・`x`・`y`・`w`・`h`・`ancestors`・`collapsed`）
      - name: wires
        type: PlacedWire[]
        description: 線（`id`・`from`・`to`・`points`・`label`・`merged`）
constants:
  - name: LABEL_METRICS
    title: ノードの文字の大きさと余白
    container: src/map/layout.ts
    summary: 描いた文書の CSS の `.mdmark-diagram-node` と同じ文字の大きさと余白。名前を折り返す行の数とノードの大きさの見積もりに使用する。右の余白 `padRight` は、map のノードが右上の i と開閉の山形の分だけ右に空ける幅（`src/index.css` の map のノードの `padding-right`）。`padPill` は種類の形状が `pill` のノードの左の余白（`src/index.css` の `pill` のノードの `padding-inline`。右は後に記載した `padding-right` が優先される）。`border` はノードの枠線の幅（`.mdmark-diagram-node` の `border`）。CSS を修正したときは合わせて修正する
    value: 種類 11px・名前 13px・補足 12px・文字の太さ 400・行の高さ 1.4 倍・余白 上下 6px 左右 10px・右の余白 28px・pill の左の余白 16px・枠線 1.5px
  - name: MAP_LAYOUT
    title: 配置の寸法
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 配置の寸法（px）と経路の重み
    entries:
      - key: maxWidth
        value: '220'
        description: '`node_fit` が `height` のノードの幅の上限'
      - key: maxWidthWide
        value: '360'
        description: '`node_fit` が `width` のノードの幅の上限'
      - key: minWidth
        value: '120'
        description: ノードの幅の下限
      - key: gapItem
        value: '48'
        description: 段の中の間
      - key: gapRank
        value: '64'
        description: 段の間
      - key: groupPad
        value: '24'
        description: グループの内側の余白
      - key: groupTitle
        value: '36'
        description: グループのタイトルの行の高さ
      - key: margin
        value: '24'
        description: 図の外の余白
      - key: clearance
        value: '12'
        description: 線の通り道の矩形からの離れ
      - key: bendCost
        value: '30'
        description: 曲がり 1 回の重み
      - key: borderCost
        value: '100000'
        description: 祖先でないグループの枠の出入り 1 回の重み
      - key: sideCost
        value: '1000'
        description: 線の端を、相手のノードに向いた辺でない辺から出入りさせる 1 回の重み。向いた辺へ回るときの曲がりと遠回り（ノード 1 つ分の回り込み）より大きくし、向いた辺の出入り口が通れないとき・向いた辺へ回る経路がこの重みより長いときだけほかの辺を選ばせる
      - key: minGap
        value: '16'
        description: ドラッグで近づけられる間の下限
      - key: usedCost
        value: '60'
        description: 先に引いた線が通った同じ向きの格子の区間 1 つの重み（曲がり 2 回分。別の通り道へ回るほうを選ばせる）
      - key: wireGap
        value: '16'
        description: 同じ区間を通る線を並べるときの線の間
      - key: closedCount
        value: '17'
        description: 閉じたグループの数の行の高さ（補足の文字 12px × 行の高さ 1.4 の切り上げ）
      - key: closedBorder
        value: '6'
        description: '閉じたグループの二重の枠線の上下の幅の和（CSS の `.map-closed-group` の `border: 3px double`）'
functions:
  - name: layoutMap
    title: 入れ子を配置する
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 構成図と見せ方と上書きから、ノード・グループ・線の配置を返却する
    scope: public
    callees:
      - MOD-472-141#functions[routeWires]
    args:
      - name: chart
        type: Flowchart
        required: true
        description: 読み取った構成図
      - name: view
        type: MapView
        required: true
        description: 見せ方
      - name: options
        type: '{ overrides: Record<string, MapOverride>; nodeFit: "height" | "width"; spread?: number; measureText: (text: string) => number }'
        required: true
        description: ID ごとの上書きと、ノードの大きさの合わせ方と、名前の幅の測り方
      - name: options.overrides
        type: Record<string, MapOverride>
        required: true
        description: ID ごとの上書き
      - name: options.nodeFit
        type: '"height" | "width"'
        required: true
        description: 設定の `map.node_fit`
      - name: options.spread
        type: number | undefined
        required: false
        description: 段の中の間（`gapItem`）と段の間（`gapRank`）に追加する幅（px）。`separateWires` が返却した `crowded` を指定する。省くと 0
      - name: options.measureText
        type: '(text: string) => number'
        required: true
        description: ノードの名前の文字（`LABEL_METRICS.nameSize`・太字）の 1 行の幅（px）を返却する関数。ブラウザで描く `attachMapFlow` は描くフォントで測る関数、DOM を持たない呼び出し（部品の描画のサーバー・単体テスト）は `estimateTextWidth` を指定する
    returns:
      type: MapLayout
      description: 配置の結果
    process: |-
      1. 見せ方で表示する木を作る。中へ入ったグループの外は `faded` で残し、閉じたグループは 1 つのノードにして、そこへの線を同じ相手ごとに 1 本にまとめて元の線を `merged` に持つ。上書きの `size` を持たない葉は、上書きの `width` を持てばその幅、持たなければ `measureText` で測った名前の幅（`textWidth`）に左の余白（上書きの `padLeft`、無ければ `LABEL_METRICS.padX`）・右の余白 `LABEL_METRICS.padRight`・左右の枠線（`LABEL_METRICS.border` × 2）を加えた幅（小数は切り上げる）を `MAP_LAYOUT.minWidth` から上限（`nodeFit` が `height` なら `maxWidth`、`width` なら `maxWidthWide`）までに収めた幅にし、その幅から左右の余白と枠線を引いた幅で、名前を `measureText` で測って行に分けた（`splitLines`）行の数の `leafHeight` を高さにする。上書きの `size` を持つ葉は、その大きさにし、同じ幅で名前を行に分ける（表示する木を作る）
      2. 内側のグループから順に、子孫の線を直下の子どうしの線に持ち上げ、`rankless` の線を除き、閉路の戻りを解除した最長路で段を決め、重心の 4 回の掃引で段の中の並びを決め、上書きの `align`・`order`・`justify`・`pos` を適用して大きさを決める。段の中の間と段の間には `spread` を追加する。線の `length` が 2 以上の線は、先のノードを元のノードから `length` 段離して段を決める。`invisible` の線は段と並びを決めるのに使用し、線の経路を引かず `wires` に含めない。アーキテクチャ図の `align` は、並べた ID を同じ段（`row`）か同じ列（`column`）にそろえる上書きにする。閉じたグループの葉の高さは、見積もりの高さと `groupTitle` + `closedCount` + 余白 上下 6px + `closedBorder` の大きいほうにする（グループの中を配置する）
      3. 外側から座標を追加して図の座標にし、線の経路を引く。線の端が開いたグループの ID（Mermaid の `subgraph` を指す線）なら、そのグループの枠につなぐ（線の経路を引く）
    unit_tests:
      - name: test_layout_map_when_length_and_invisible
        case: 正常
        summary: 長さを指定した線と見えない線で段を決める
        condition: '`flowchart TB` で `A --> B`・`A ----> C`・`B ~~~ D` の構成図'
        mock: なし
        expected: '`C` が `B` より 2 段下、`D` が `B` の 1 段下で、`wires` に `B->D` が無い'
      - name: test_layout_map
        case: 正常
        summary: 重なりと横切りが無い
        condition: モックの `FLOW` と空の見せ方
        mock: なし
        expected: どの 2 つのノード・グループも重ならず、線が端点とその祖先以外の矩形を横切らず、祖先の枠の出入りが 1 回
      - name: test_layout_map_when_entered
        case: 正常
        summary: 中へ入る
        condition: '`entered: read`'
        mock: なし
        expected: '`read` の外のノードの `faded` が `true` で、`read` の中のノードは `read` の中に収まる'
      - name: test_layout_map_when_collapsed
        case: 正常
        summary: 閉じる
        condition: '`collapsed: [store]`'
        mock: なし
        expected: '`store` が 1 つのノードになり、`store` への線が相手ごとに 1 本で `merged` に元の線を持つ'
      - name: test_layout_map_when_overrides
        case: 正常
        summary: 上書き
        condition: '`align`・`order`・`pos` を 1 つずつ'
        mock: なし
        expected: 指定どおりの段・並び・座標で、重なりと横切りが無い
      - name: test_layout_map_when_measured_size
        case: 正常
        summary: 測った大きさ
        condition: 'ノード 1 つに `size: { w: 300, h: 90 }`'
        mock: なし
        expected: そのノードの `w`・`h` が 300・90
      - name: test_layout_map_when_above
        case: 正常
        summary: ノードの上に空ける高さ
        condition: 'ノード `mount` に `above: 40`'
        mock: なし
        expected: '`mount` の高さは空けないときと同じで、`mount` の上 40px を含めた矩形にほかのノードが重ならない'
      - name: test_layout_map_when_rankless
        case: 正常
        summary: 段を決める処理で使用しない線
        condition: 'ノード `a`・`b` を結ぶ線に `rankless: true`、`a` に `order: 0`、`b` に `align: a` と `order: 1`'
        mock: なし
        expected: '`a` と `b` が同じ段で `b` が `a` の後に並び、線の経路が引かれる'
      - name: test_layout_map_when_justify
        case: 正常
        summary: 寄せる
        condition: '段の幅が親より短い段のノードに `justify: start` と `end`'
        mock: なし
        expected: '`start` のノードの左端が親の中身の左端、`end` のノードの右端が親の中身の右端'
      - name: test_layout_map_when_node_fit_width
        case: 正常
        summary: node_fit が width
        condition: '名前が全角 30 文字のノードと `nodeFit: width`'
        mock: なし
        expected: そのノードの幅が 220 より大きく 360 以下
      - name: test_layout_map_when_collapsed_count
        case: 正常
        summary: 閉じたグループのノードの数
        condition: '部品の Default の Mermaid で `collapsed: ["read", "lib"]`'
        mock: なし
        expected: 閉じた `lib` の `count` が、入れ子の `read`・`place` の中を含む 7。開いたグループは `count` を持たない
      - name: test_layout_map_when_collapsed_height
        case: 正常
        summary: 閉じたグループの高さ
        condition: '`collapsed: [store]` と、`store` に測った大きさ `size: { w: 120, h: 30 }`（見積もりの高さが 65px に満たない）'
        mock: なし
        expected: 閉じた `store` の `h` が `groupTitle` + `closedCount` + 余白 上下 6px + `closedBorder`（65）以上
      - name: test_layout_map_when_spread
        case: 正常
        summary: 間を広げる
        condition: '`flowchart LR` の `A --> B`・`A --> C`（`B` と `C` が同じ段）を `spread` なしと `spread: 16` で配置する'
        mock: なし
        expected: '`spread: 16` のほうが、同じ段の `B` と `C` の間と、隣の段の `A` と `B` の間がそれぞれ 16px 広い'
      - name: test_layout_map_when_name_fits_with_right_padding
        case: 正常
        summary: 右の余白を加えた幅で 1 行に収まる名前
        condition: 名前が「データベース層」（全角 7 文字・見積もりの幅 91px）のノード 1 つ
        mock: なし
        expected: そのノードの `w` が 132（91 + 10 + 28 + 1.5 × 2）、`h` が `leafHeight(1)`、`lines` が 1 行
      - name: test_layout_map_when_name_wraps_with_right_padding
        case: 正常
        summary: 右の余白を除いた幅で折り返す名前
        condition: '名前が全角 14 文字（見積もりの幅 182px）のノード 1 つと `nodeFit: height`'
        mock: なし
        expected: そのノードの `w` が 220、`lines` が 2 行（220 - 41 = 179px で折り返す）、`h` が `leafHeight(2)`
      - name: test_layout_map_when_width_with_right_padding
        case: 正常
        summary: 幅を指定したノードの折り返し
        condition: '名前が全角 13 文字（見積もりの幅 169px）のノードに上書きの `width: 200`'
        mock: なし
        expected: そのノードの `w` が 200、`lines` が 2 行（200 - 41 = 159px で折り返す）、`h` が `leafHeight(2)`
      - name: test_layout_map_when_measured_text_width
        case: 正常
        summary: 測った名前の幅で大きさを決める
        condition: 名前が `Markdown`（半角 8 文字）のノード 1 つと、1 文字を 12px と測る `measureText`（見積もりの 8.4px より広い）
        mock: '`measureText`'
        expected: そのノードの `w` が 137（96 + 10 + 28 + 1.5 × 2）、`lines` が 1 行、`h` が `leafHeight(1)`
      - name: test_layout_map_when_measured_text_wraps
        case: 正常
        summary: 測った幅で折り返す
        condition: '名前が半角 20 文字のノード 1 つ、1 文字を 12px と測る `measureText`、`nodeFit: height`'
        mock: '`measureText`'
        expected: そのノードの `w` が 220、`lines` が 2 行（1 行目が 14 文字。220 - 41 = 179px に 12px の文字が 14 文字収まる）、`h` が `leafHeight(2)`
      - name: test_layout_map_when_pill_padding
        case: 正常
        summary: pill の左の余白
        condition: '名前が「利用側のページ」（全角 7 文字・見積もりの幅 91px）のノードに `padLeft: 16` の上書き、`measureText` は `estimateTextWidth`'
        mock: なし
        expected: そのノードの `w` が 138（91 + 16 + 28 + 1.5 × 2）、`lines` が 1 行
      - name: test_layout_map_when_wire_to_group
        case: 正常
        summary: subgraph を指す線をグループの枠につなぐ
        condition: '`flowchart LR` で `subgraph g` の中に `B --> C` を持ち、`A --> g` を持つ構成図'
        mock: なし
        expected: '`wires` に `A->g` があり、終点がグループ `g` の左の辺の上（x が `g` の x と同じで、y が `g` の上端から下端の間）'
  - name: routeWires
    title: 線の経路を引く
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 矩形の辺から離した座標と中心の座標の格子の A* で、縦横の折れ線の経路を引く
    scope: internal
    args:
      - name: nodes
        type: PlacedNode[]
        required: true
        description: 配置したノード
      - name: groups
        type: PlacedGroup[]
        required: true
        description: 配置したグループ
      - name: wires
        type: ViewWire[]
        required: true
        description: 表示する線
    returns:
      type: PlacedWire[]
      description: '`points` を持つ線'
    process: |-
      1. 端点とその祖先以外の矩形の内側の格子点を通れない点にする
      2. 線を記載順に 1 本ずつ引き、片方の端点だけの祖先の枠の出入りに `borderCost`、曲がりに `bendCost`、先に引いた線が通った同じ向きの格子の区間に `usedCost` を追加し、残りの出入りの数を見積もりに加えた A* で経路を探す。上書きの `ends` がある端は、その辺の中央から辺と直角に出入りする点だけを始点・終点にする。上書きの `sides` が `horizontal` のノードの端は、左右の辺の出入り口だけを始点・終点にする。`via` がある線は、始点 → 経由点 → 終点の区間ごとに探してつなぐ
         - `ends` の無い端の、相手のノードに向いた辺（2 つのノードの中心を結ぶ向きのうち、縦と横で差が大きい方の辺。`sides` が `horizontal` のノードは相手の中心が右か左かで決め、横の中心の差が無いときは右）でない辺の出入り口には、始点では始めの重み、終点では着いたときの重みとして `sideCost` を追加する。向いた辺の出入り口が端点とその祖先以外の矩形の内側にあって通れないときは、残りの辺の出入り口を同じ重みで比べる
         - 終点の出入り口へ、辺と直角にノードへ入る向き以外の向きで着いたときは、着いたときの重みに `bendCost` を追加する（辺へ入るときの曲がりを数える）
         - 両端以外のノードの 4 辺（`sides` が `horizontal` のノードは左右の辺）の出入り口の点を通るときは、`usedCost` を追加する（そのノードに出入りする線と、出入り口の区間で重ねない）
      3. 一直線に並ぶ点を除く（経由点は除かない）
      4. 引いた線が通った格子の区間を、向きごとに次の線の重みへ指定する
    unit_tests:
      - name: test_route_wires
        case: 正常
        summary: 矩形を回避する
        condition: 間にノードを 1 つ挟む 2 つのノードの線
        mock: なし
        expected: 線の点が挟んだノードの矩形の外
      - name: test_route_wires_when_nested
        case: 正常
        summary: 祖先の枠の出入り
        condition: 別のグループの中のノードどうしの線
        mock: なし
        expected: グループの枠の出入りがそれぞれ 1 回
      - name: test_route_wires_when_ends
        case: 正常
        summary: 端の辺
        condition: '左右に並んだ 2 つのノードの線に `ends: { from: bottom, to: top }`'
        mock: なし
        expected: 最初の点が元のノードの下の辺の中央、最後の点が先のノードの上の辺の中央で、最初と最後の区間が縦
      - name: test_route_wires_when_via
        case: 正常
        summary: 経由点
        condition: '線に `via: [{ x: 240, y: 300 }]`'
        mock: なし
        expected: 線の点に図の座標にした経由点があり、矩形を横切らない
      - name: test_route_wires_when_facing_side
        case: 正常
        summary: 向いた辺につなぐ
        condition: 幅 120 の 1 つのノードから、下の段に横に並ぶ幅 120 の 2 つのノードへ出る線 2 本
        mock: なし
        expected: 2 本とも、最初の点が元のノードの下の辺、最後の点が先のノードの上の辺にある
      - name: test_route_wires_when_placement_patterns
        case: 正常
        summary: 配置のパターンごとに向いた辺につなぎ、ノードを横切らない
        condition: 5 つの配置を 1 つずつ配置する。縦に並ぶ 3 つのノード（`TB`）・横に並ぶ 3 つのノード（`LR`）・上の段の 1 つから下の段の左右の 2 つと、その 2 つから下の段の 1 つへの線（斜め）・`LR` の 2 つのグループの中に 2 つずつ並ぶノードと、グループをまたぐ線 3 本・上の段の 5 つのノードから下の段の 1 つのノードへ集まる線 5 本
        mock: なし
        expected: どの配置でも、どの線の両端も向いた辺（向いた辺の出入り口が通れない端は残りの辺）にあり、どの線の区間も両端とその祖先以外の矩形の内側を通らない
      - name: test_route_wires_when_facing_side_blocked
        case: 正常
        summary: 向いた辺の出入り口が通れない
        condition: 先のノードの上の辺の出入り口に、ほかのノードの矩形が重なる配置で、上の段のノードから引く線
        mock: なし
        expected: 最後の点が先のノードの左右の辺のうち、経路の短い方の辺にあり、線がほかのノードの矩形を横切らない
      - name: test_route_wires_when_sides_horizontal
        case: 正常
        summary: 左右の辺だけにつなぐ
        condition: '上下に並ぶ 2 つのノード（横の中心の差が無い）と、斜めに並ぶ 2 つのノードに `sides: horizontal` を指定した線'
        mock: なし
        expected: 上下に並ぶ 2 つのノードの線は両端とも右の辺にあり、斜めに並ぶ 2 つのノードの線は両端が左右の辺のうち相手の中心に近い方の辺にある
      - name: test_route_wires_when_foreign_port
        case: 正常
        summary: 両端以外のノードの出入り口の点を通らない
        condition: '`pos` で固定した 3 つのノード（M・その右の D・右上の B）で、M から B への最短の経路の 1 つが D の左の辺の出入り口の点を通る配置の線'
        mock: なし
        expected: M から B への線が、D の 4 辺の出入り口の点のどれも通らない
      - name: test_route_wires_when_used
        case: 正常
        summary: 先に引いた線の区間を回避する
        condition: 同じグループの同じ列に並ぶ 3 つのノード `a1`・`a2`・`a3` から、別のグループの `b3`・`b1`・`b2` へ 1 本ずつ出る線
        mock: なし
        expected: 後に引いた線が、先に引いた線と同じ向きで同じ直線の上に重なる区間の長さの合計が、`usedCost` を 0 にしたときより短い
  - name: separateWires
    title: 同じ区間の線を並べる
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 同じ向きで同じ直線の上に重なる区間を持つ線を、区間と直角の向きに `wireGap` ずつずらして並べ、両側の矩形の間に収まらないときに広げる幅を返却する
    scope: public
    args:
      - name: layout
        type: MapLayout
        required: true
        description: 配置の結果（アーキテクチャ図は `rewireMapArchitecture` で再計算した線）
    returns:
      type: '{ wires: PlacedWire[]; crowded: number }'
      description: 並べた線と、並べた線が端点とその祖先以外の矩形に入る区間があるときに `layoutMap` の `spread` に指定する幅（入らなければ 0）
    process: |-
      1. 全ての線の縦と横の区間を、向きと直線の座標ごとに集め、範囲が重なる区間の束を作る（`spreadWireEnds` でずらした線の端の区間は束に入れない）
      2. 束ごとに、束の範囲で両側にある矩形（端点とその祖先を除く。`clearance` を含める）の間を通り道にし、中の n 本を記載順に、束の中ほどが通り道の中ほどになるように `wireGap` ずつ並べる（片側に矩形が無ければ、矩形のある側から遠ざかる向きへ並べ、両側に無ければ束の中ほどを元の直線にする）。ずらした区間の前後の区間の端も同じ量だけ動かす。線の端点は ER 図の列の行の高さ・同じ点から出る線の端の 16px ずらしなど、図の種類ごとの決まりで配置されているため動かさず、端点を含む区間は、端点から区間の向きへ `clearance` の長さだけ進んだ点で折り、そこから先をずらす（区間の長さが `clearance` 以下のときは、区間の中ほどで折る）
      3. 通り道の幅が束の幅（`wireGap` × (n − 1)）に足りない束があれば、足りない幅の最大を `crowded` にする（`spread` でこの幅だけ間を広げると、通り道の中ほどに束が収まる）。幅が足りない束も、通り道の中ほどに並べたまま返却する
    unit_tests:
      - name: test_separate_wires
        case: 正常
        summary: 同じ区間の 3 本を並べる
        condition: 左のノードの右の辺から 40px の縦の直線の上で範囲が重なる区間を持つ 3 本の線と、左のノードの右の辺から 80px に左の辺を持つ右のノード（元の直線が、`clearance` を含めた通り道 12〜68px の中ほど）
        mock: なし
        expected: 3 本のその区間の x 座標が、左のノードの右の辺から 24・40・56px で、どの 2 本も同じ向きの区間が同じ直線の上で重ならず、線は縦横の折れ線のまま。`crowded` が 0
      - name: test_separate_wires_when_shared_end
        case: 正常
        summary: 同じ点から出る線の端
        condition: 同じノードの同じ辺の中央から出て、最初の区間だけが重なる 2 本の線
        mock: なし
        expected: 2 本の点の並びが引数のまま
      - name: test_separate_wires_when_grid_line
        case: 正常
        summary: 辺から 12px の格子の線を通る束
        condition: 左のノードの右の辺から 12px（`clearance`）の縦の直線の上で範囲が重なる 3 本の線と、右のノードの左の辺が左のノードの右の辺から 80px
        mock: なし
        expected: 3 本のその区間の x 座標が、左のノードの右の辺から 24・40・56px（通り道 12〜68px の中ほど 40px が束の中ほど）で、どの区間も両側の矩形に入らず、`crowded` が 0
      - name: test_separate_wires_when_crowded
        case: 正常
        summary: 通り道の幅が足りない
        condition: test_separate_wires_when_grid_line の 3 本と、右のノードの左の辺が左のノードの右の辺から 40px
        mock: なし
        expected: '`crowded` が 16（束の幅 32px に対して通り道 12〜28px の幅が 16px）で、`layoutMap` に `spread: 16` を指定して再配置した後の線を並べると `crowded` が 0'
      - name: test_separate_wires_when_end_segment
        case: 正常
        summary: 端点を含む区間は端点を動かさずに並べる
        condition: 上のノードの下の辺から下へ出る線と、下のノードの上の辺から上へ出る線の 2 本で、どちらも最初の区間（端点を含む）が同じ縦の直線の上で重なり、その後は右の別のノードへ折れる
        mock: なし
        expected: 2 本の最初と最後の点（端点）が引数のままで、どの 2 本も同じ向きの区間が同じ直線の上で重ならず、線は縦横の折れ線のまま。`crowded` が 0
      - name: test_separate_wires_when_short_end
        case: 正常
        summary: 長さが clearance 以下の端の区間
        condition: 上のノードの下の辺から下へ 12px（`clearance`）進んで右へ折れる線と、下のノードの上の辺から上へ出て右へ折れる線の 2 本で、上の線の端点を含む長さ 12px の縦の区間が、下の線の縦の区間と同じ直線の上で重なる
        mock: なし
        expected: どの線にも長さ 0 の区間が無く、連続する 3 点が同じ直線の上で向きを戻さない（折り返さない）。端点は引数のままで、重なりが 0
  - name: textWidth
    title: 文の幅を測る
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 改行で分けた行ごとに `measure` で幅を測り、最も広い行の幅を返却する。ノードの幅の既定の見積もりと、クラス図のノートの幅の見積もり（`classPartInputs`）が使用する
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 名前・ノートの文
      - name: measure
        type: '(text: string) => number'
        required: true
        description: 1 行の幅（px）を返却する関数（`layoutMap` の `measureText`）
    returns:
      type: number
      description: 幅（px）
  - name: splitLines
    title: 文を行に分ける
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 改行で分けた段落ごとに、先頭から 1 文字ずつ追加した行の幅を `measure` で測り、`width` を超える文字の手前で折り返した行を返却する（行の先頭の 1 文字は幅を超えてもその行に入れる）。ノードの大きさの既定の見積もりと、クラス図のノートの行の数の見積もり（`classPartInputs`）が使用する
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 名前・ノートの文
      - name: width
        type: number
        required: true
        description: 文字の列の幅（px。ノードの左右の余白を含めない）
      - name: measure
        type: '(text: string) => number'
        required: true
        description: 1 行の幅（px）を返却する関数（`layoutMap` の `measureText`）
    returns:
      type: string[]
      description: 行
    unit_tests:
      - name: test_split_lines_when_measure
        case: 正常
        summary: 測った幅で折り返す
        condition: 文 `abcdef`、幅 30、1 文字を 10px と測る `measure`
        mock: '`measure`'
        expected: '`["abc", "def"]`'
  - name: leafHeight
    title: ノードの高さを見積もる
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 種類の行と名前の行の数から、`ceil((kindSize + 行の数 × nameSize) × lineHeight) + padY × 2 + 16` でノードの高さを返却する。ノードの大きさの既定の見積もりと、クラス図のノートの高さの見積もり（`classPartInputs`）が使用する
    scope: public
    args:
      - name: lines
        type: number
        required: true
        description: 名前の行の数
    returns:
      type: number
      description: 高さ（px）
    unit_tests:
      - name: test_leaf_height
        case: 正常
        summary: 行の数の高さ
        condition: 行の数 1 と 2
        mock: なし
        expected: 1 行が 62、2 行が 80（`ceil((11 + 2 × 13) × 1.4) + 6 × 2 + 16`）
  - name: estimateTextWidth
    title: 名前の幅を見積もる
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 全角の文字を `LABEL_METRICS.nameSize`、半角の文字（U+007E 以下と半角カナ）をその 0.6 倍の幅とみなした 1 行の幅を返却する。DOM を持たず描くフォントを測れない呼び出し（部品の描画のサーバー・単体テスト）が `layoutMap` の `measureText` に指定する
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 1 行の文字
    returns:
      type: number
      description: 幅（px）
    unit_tests:
      - name: test_estimate_text_width
        case: 正常
        summary: 全角と半角の見積もり
        condition: 「文書の Markdown」
        mock: なし
        expected: 109.2（全角 3 文字 × 13 + 半角 9 文字 × 7.8）
  - name: spreadWireEnds
    title: 同じ辺の線の端を並べる
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 同じノードの同じ辺の同じ点に出入りする 2 本以上の線の端を、相手の端の並びの順に、元の点を中心として `MAP_LAYOUT.wireGap`（16px）間隔で辺に沿って並べ（辺に収まらないときは辺の長さを線の数で等分）、端から次の点までの区間を辺と直角に保つ（全ての図の種類）
    scope: public
    args:
      - name: layout
        type: MapLayout
        required: true
        description: 配置の結果（図の種類ごとの `rewire` を当てた後の線。ER 図は列の行へ付け替えた端、アーキテクチャ図は辺の指定の端）
    returns:
      type: MapLayout["wires"]
      description: 端を並べた線
    process: |-
      1. 全ての線の両端を、端の点（丸めた座標）ごとに集める
      2. 2 つ以上の端を持つ点ごとに、端から次の点への向きで辺を決め、その点を辺に持つノード（`layout.nodes`）の辺の長さを求める
      3. 端を、線の向こう側の点（3 つ目の点、無ければもう片方の端）の辺に沿った座標の順に並べる（線どうしが端の近くで交わらない）
      4. 間隔を `wireGap` とし、`wireGap × 端の数` が辺の長さを超えるときは、辺の長さを端の数で等分した位置（辺の始点から `辺の長さ × (順番 + 0.5) / 端の数`）にする
      5. 端と端から次の点を同じ量だけ辺に沿って動かす。2 点だけの線は中ほどで折って端の側だけを動かす
    unit_tests:
      - name: test_spread_wire_ends
        case: 正常
        summary: 同じ点に入る 3 本
        condition: 幅 120px のノードの上の辺の中ほどに先の端を持ち、向こう側の点が左から順に並ぶ線 3 本
        mock: なし
        expected: 3 本の先の端の x が 16px ずつ違い、中ほどの端が元の点で、左の端が向こう側の点が最も左の線。端から次の点までの区間が縦
      - name: test_spread_wire_ends_when_short_side
        case: 正常
        summary: 辺に収まらない
        condition: 幅 48px のノードの下の辺の中ほどから出る線 4 本（16px 間隔では 64px 要る）
        mock: なし
        expected: 4 本の元の端の x が、ノードの左端から 6・18・30・42px（48px を 4 等分した位置）で、どの端も辺の外に出ない
      - name: test_spread_wire_ends_when_single
        case: 正常
        summary: 1 本だけの端
        condition: 辺の中ほどから 1 本だけ出る線
        mock: なし
        expected: 線の点の並びが引数のまま
lead: '入れ子のグループの自動配置と線の経路を受け持ち、構成図の配置を変えるときに参照する。'
