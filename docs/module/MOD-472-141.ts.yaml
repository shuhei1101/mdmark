id: MOD-472-141
visibility: internal
title: ライブラリ本体 / map / 配置 / layout.ts
test_files:
  - tests/unit/src/map/layout.test.ts
data_models:
  - name: MapView
    title: 見せ方
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`layoutMap` に指定する中へ入ったグループ・閉じたグループ'
    properties:
      - name: entered
        type: string | undefined
        description: 中へ入ったグループの ID
      - name: collapsed
        type: string[]
        description: 閉じたグループの ID
  - name: MapOverride
    title: 配置の上書き
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 補足の `layout`・動かした位置・測った大きさを合わせた 1 つの ID の制約
    properties:
      - name: align
        type: string | undefined
        description: 同じ段に置く相手の ID
      - name: order
        type: number | undefined
        description: 段の中の並び順
      - name: pos
        type: '{ x: number; y: number } | undefined'
        description: 親の中身の左上からの座標で固定する
      - name: width
        type: number | undefined
        description: ノードの幅
      - name: justify
        type: '"start" | "center" | "end" | undefined'
        description: 段の中で寄せる側
      - name: ends
        type: '{ from?: "top" | "right" | "bottom" | "left"; to?: "top" | "right" | "bottom" | "left" } | undefined'
        description: 線の端をつなぐ辺（補足の `ends` と、つなぎ替えた辺の `attachments`）
      - name: via
        type: 'Array<{ x: number; y: number }> | undefined'
        description: 線の経由点（両端の共通の祖先の中身の左上からの座標）
      - name: size
        type: '{ w: number; h: number } | undefined'
        description: 描いて測ったノードの大きさ。見積もりの代わりに使う
      - name: above
        type: number | undefined
        description: ノードの上に空ける高さ（同じ状態への遷移の線とラベルの置き場所）。ほかのノードを重ねず、線も通さない
      - name: aside
        type: number | undefined
        description: ノードの左右それぞれに空ける幅（ER 図の関連の端と多重度の置き場所）。ほかのノードを重ねず、線は通す
      - name: rankless
        type: boolean | undefined
        description: 線の ID に指定すると、段を決める処理でその線を使わない（アーキテクチャ図の上下の辺でつなぐ線・C4 図の `Rel_L`・`Rel_R`）。経路は引く
  - name: MapLayout
    title: 配置の結果
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`layoutMap` の戻り値（部品『mapの構成図』の `layout`）'
    properties:
      - name: width
        type: number
        description: 図の幅
      - name: height
        type: number
        description: 図の高さ
      - name: nodes
        type: PlacedNode[]
        description: ノード（`id`・`x`・`y`・`w`・`h`・`lines`・`faded`・`ancestors`）。`ancestors` は内側から
      - name: groups
        type: PlacedGroup[]
        description: グループ（`id`・`title`・`x`・`y`・`w`・`h`・`ancestors`・`collapsed`）
      - name: wires
        type: PlacedWire[]
        description: 線（`id`・`from`・`to`・`points`・`label`・`merged`）
constants:
  - name: LABEL_METRICS
    title: ノードの文字の大きさと余白
    container: src/map/layout.ts
    summary: 描いた文書の CSS の `.mdmark-diagram-node` と同じ文字の大きさと余白。名前を折り返す行の数とノードの大きさの見積もりに使用する。CSS を修正したときは合わせて修正する
    value: 種類 11px・名前 14px・補足 12px・行の高さ 1.4 倍・余白 上下 6px 左右 10px
  - name: MAP_LAYOUT
    title: 配置の寸法
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 配置の寸法（px）と経路の重み
    entries:
      - key: maxWidth
        value: '220'
        description: '`node_fit` が `height` のノードの幅の上限'
      - key: maxWidthWide
        value: '360'
        description: '`node_fit` が `width` のノードの幅の上限'
      - key: minWidth
        value: '120'
        description: ノードの幅の下限
      - key: gapItem
        value: '48'
        description: 段の中の間
      - key: gapRank
        value: '64'
        description: 段の間
      - key: groupPad
        value: '24'
        description: グループの内側の余白
      - key: groupTitle
        value: '36'
        description: グループのタイトルの行の高さ
      - key: margin
        value: '24'
        description: 図の外の余白
      - key: clearance
        value: '12'
        description: 線の通り道の矩形からの離れ
      - key: bendCost
        value: '30'
        description: 曲がり 1 回の重み
      - key: borderCost
        value: '100000'
        description: 祖先でないグループの枠の出入り 1 回の重み
      - key: minGap
        value: '16'
        description: ドラッグで近づけられる間の下限
      - key: usedCost
        value: '60'
        description: 先に引いた線が通った同じ向きの格子の区間 1 つの重み（曲がり 2 回分。別の通り道へ回るほうを選ばせる）
      - key: wireGap
        value: '8'
        description: 同じ区間を通る線を並べるときの線の間
      - key: closedCount
        value: '17'
        description: 閉じたグループの数の行の高さ（補足の文字 12px × 行の高さ 1.4 の切り上げ）
functions:
  - name: layoutMap
    title: 入れ子を配置する
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 構成図と見せ方と上書きから、ノード・グループ・線の配置を返す
    scope: public
    callees:
      - MOD-472-141#functions[routeWires]
      - MOD-472-141#functions[wrapLabel]
    args:
      - name: chart
        type: Flowchart
        required: true
        description: 読み取った構成図
      - name: view
        type: MapView
        required: true
        description: 見せ方
      - name: options
        type: '{ overrides: Record<string, MapOverride>; nodeFit: "height" | "width" }'
        required: true
        description: ID ごとの上書きと、ノードの大きさの合わせ方
      - name: options.overrides
        type: Record<string, MapOverride>
        required: true
        description: ID ごとの上書き
      - name: options.nodeFit
        type: '"height" | "width"'
        required: true
        description: 設定の `map.node_fit`
      - name: options.spread
        type: number | undefined
        required: false
        description: 段の中の間（`gapItem`）と段の間（`gapRank`）に足す幅（px）。`separateWires` が返した `crowded` を指定する。省くと 0
    returns:
      type: MapLayout
      description: 配置の結果
    process: |-
      1. 見せ方で表示する木を作る。中へ入ったグループの外は `faded` で残し、閉じたグループは 1 つのノードにして、そこへの線を同じ相手ごとに 1 本にまとめて元の線を `merged` に持つ（表示する木を作る）
      2. 内側のグループから順に、子孫の線を直下の子どうしの線に持ち上げ、`rankless` の線を除き、閉路の戻りを外した最長路で段を決め、重心の 4 回の掃引で段の中の並びを決め、上書きの `align`・`order`・`justify`・`pos` を当てて大きさを決める。段の中の間と段の間には `spread` を足す。閉じたグループの葉の高さは、見積もりの高さと `groupTitle` + `closedCount` + 余白 上下 6px の大きいほうにする（グループの中を配置する）
      3. 外側から座標を足して図の座標にし、線の経路を引く（線の経路を引く）
    unit_tests:
      - name: test_layout_map
        case: 正常
        summary: 重なりと横切りが無い
        condition: モックの `FLOW` と空の見せ方
        mock: なし
        expected: どの 2 つのノード・グループも重ならず、線が端点とその祖先以外の矩形を横切らず、祖先の枠の出入りが 1 回
      - name: test_layout_map_when_entered
        case: 正常
        summary: 中へ入る
        condition: '`entered: read`'
        mock: なし
        expected: '`read` の外のノードの `faded` が `true` で、`read` の中のノードは `read` の中に収まる'
      - name: test_layout_map_when_collapsed
        case: 正常
        summary: 閉じる
        condition: '`collapsed: [store]`'
        mock: なし
        expected: '`store` が 1 つのノードになり、`store` への線が相手ごとに 1 本で `merged` に元の線を持つ'
      - name: test_layout_map_when_overrides
        case: 正常
        summary: 上書き
        condition: '`align`・`order`・`pos` を 1 つずつ'
        mock: なし
        expected: 指定どおりの段・並び・座標で、重なりと横切りが無い
      - name: test_layout_map_when_measured_size
        case: 正常
        summary: 測った大きさ
        condition: 'ノード 1 つに `size: { w: 300, h: 90 }`'
        mock: なし
        expected: そのノードの `w`・`h` が 300・90
      - name: test_layout_map_when_above
        case: 正常
        summary: ノードの上に空ける高さ
        condition: 'ノード `mount` に `above: 40`'
        mock: なし
        expected: '`mount` の高さは空けないときと同じで、`mount` の上 40px を含めた矩形にほかのノードが重ならない'
      - name: test_layout_map_when_rankless
        case: 正常
        summary: 段を決める処理で使わない線
        condition: 'ノード `a`・`b` を結ぶ線に `rankless: true`、`a` に `order: 0`、`b` に `align: a` と `order: 1`'
        mock: なし
        expected: '`a` と `b` が同じ段で `b` が `a` の後に並び、線の経路が引かれる'
      - name: test_layout_map_when_justify
        case: 正常
        summary: 寄せる
        condition: '段の幅が親より短い段のノードに `justify: start` と `end`'
        mock: なし
        expected: '`start` のノードの左端が親の中身の左端、`end` のノードの右端が親の中身の右端'
      - name: test_layout_map_when_node_fit_width
        case: 正常
        summary: node_fit が width
        condition: '名前が全角 30 文字のノードと `nodeFit: width`'
        mock: なし
        expected: そのノードの幅が 220 より大きく 360 以下
      - name: test_layout_map_when_collapsed_count
        case: 正常
        summary: 閉じたグループのノードの数
        condition: '部品の Default の Mermaid で `collapsed: ["read", "lib"]`'
        mock: なし
        expected: 閉じた `lib` の `count` が、入れ子の `read`・`place` の中を含む 7。開いたグループは `count` を持たない
      - name: test_layout_map_when_collapsed_height
        case: 正常
        summary: 閉じたグループの高さ
        condition: '`collapsed: [store]` と、`store` に測った大きさ `size: { w: 120, h: 30 }`（見積もりの高さが 59px に満たない）'
        mock: なし
        expected: 閉じた `store` の `h` が `groupTitle` + `closedCount` + 余白 上下 6px（59）以上
      - name: test_layout_map_when_spread
        case: 正常
        summary: 間を広げる
        condition: '`flowchart LR` の `A --> B`・`A --> C`（`B` と `C` が同じ段）を `spread` なしと `spread: 16` で配置する'
        mock: なし
        expected: '`spread: 16` のほうが、同じ段の `B` と `C` の間と、隣の段の `A` と `B` の間がそれぞれ 16px 広い'
  - name: routeWires
    title: 線の経路を引く
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 矩形の辺から離した座標と中心の座標の格子の A* で、縦横の折れ線の経路を引く
    scope: internal
    args:
      - name: nodes
        type: PlacedNode[]
        required: true
        description: 配置したノード
      - name: groups
        type: PlacedGroup[]
        required: true
        description: 配置したグループ
      - name: wires
        type: ViewWire[]
        required: true
        description: 表示する線
    returns:
      type: PlacedWire[]
      description: '`points` を持つ線'
    process: |-
      1. 端点とその祖先以外の矩形の内側の格子点を通れない点にする
      2. 線を記載順に 1 本ずつ引き、片方の端点だけの祖先の枠の出入りに `borderCost`、曲がりに `bendCost`、先に引いた線が通った同じ向きの格子の区間に `usedCost` を足し、残りの出入りの数を見積もりに加えた A* で経路を探す。上書きの `ends` がある端は、その辺の中央から辺と直角に出入りする点だけを始点・終点にする。`via` がある線は、始点 → 経由点 → 終点の区間ごとに探してつなぐ
      3. 一直線に並ぶ点を除く（経由点は除かない）
      4. 引いた線が通った格子の区間を、向きごとに次の線の重みへ渡す
    unit_tests:
      - name: test_route_wires
        case: 正常
        summary: 矩形を避ける
        condition: 間にノードを 1 つ挟む 2 つのノードの線
        mock: なし
        expected: 線の点が挟んだノードの矩形の外
      - name: test_route_wires_when_nested
        case: 正常
        summary: 祖先の枠の出入り
        condition: 別のグループの中のノードどうしの線
        mock: なし
        expected: グループの枠の出入りがそれぞれ 1 回
      - name: test_route_wires_when_ends
        case: 正常
        summary: 端の辺
        condition: '左右に並んだ 2 つのノードの線に `ends: { from: bottom, to: top }`'
        mock: なし
        expected: 最初の点が元のノードの下の辺の中央、最後の点が先のノードの上の辺の中央で、最初と最後の区間が縦
      - name: test_route_wires_when_via
        case: 正常
        summary: 経由点
        condition: '線に `via: [{ x: 240, y: 300 }]`'
        mock: なし
        expected: 線の点に図の座標にした経由点があり、矩形を横切らない
      - name: test_route_wires_when_used
        case: 正常
        summary: 先に引いた線の区間を避ける
        condition: 同じグループの同じ列に並ぶ 3 つのノード `a1`・`a2`・`a3` から、別のグループの `b3`・`b1`・`b2` へ 1 本ずつ出る線
        mock: なし
        expected: 後に引いた線が、先に引いた線と同じ向きで同じ直線の上に重なる区間の長さの合計が、`usedCost` を 0 にしたときより短い
  - name: wrapLabel
    title: 名前を折り返す
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 全角の文字を文字の大きさ、半角の文字を 0.6 倍の幅とみなし、幅で折り返した行を返す
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 名前
      - name: width
        type: number
        required: true
        description: 折り返す幅（px）
    returns:
      type: string[]
      description: 行
    unit_tests:
      - name: test_wrap_label
        case: 正常
        summary: 全角 30 文字
        condition: 220px
        mock: なし
        expected: 2 行以上で、各行の見積もりの幅が 220 - 20 以下
  - name: separateWires
    title: 同じ区間の線を並べる
    kind: 関数
    container: src/map/layout.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 同じ向きで同じ直線の上に重なる区間を持つ線を、区間と直角の向きに `wireGap` ずつずらして並べ、両側の矩形の間に収まらないときに広げる幅を返す
    scope: public
    args:
      - name: layout
        type: MapLayout
        required: true
        description: 配置の結果（アーキテクチャ図は `rewireMapArchitecture` で引き直した線）
    returns:
      type: '{ wires: PlacedWire[]; crowded: number }'
      description: 並べた線と、並べた線が端点とその祖先以外の矩形に入る区間があるときに `layoutMap` の `spread` に指定する幅（入らなければ 0）
    process: |-
      1. 全ての線の縦と横の区間を、向きと直線の座標ごとに集め、範囲が重なる区間の束を作る（同じ点から出る・入る線の端の区間は束に入れない）
      2. 束ごとに、束の範囲で両側にある矩形（端点とその祖先を除く。`clearance` を含める）の間を通り道にし、中の n 本を記載順に、束の中ほどが通り道の中ほどになるように `wireGap` ずつ並べる（片側に矩形が無ければ、矩形のある側から遠ざかる向きへ並べ、両側に無ければ束の中ほどを元の直線にする）。ずらした区間の前後の区間の端も同じ量だけ動かす。線の端点は ER 図の列の行の高さ・同じ点から出る線の端の 16px ずらしなど、図の種類ごとの決まりで置かれているため動かさず、端点を含む区間は、端点から区間の向きへ `clearance` の長さだけ進んだ点で折り、そこから先をずらす
      3. 通り道の幅が束の幅（`wireGap` × (n − 1)）に足りない束があれば、足りない幅の最大を `crowded` にする（`spread` でこの幅だけ間を広げると、通り道の中ほどに束が収まる）。幅が足りない束も、通り道の中ほどに並べたまま返す
    unit_tests:
      - name: test_separate_wires
        case: 正常
        summary: 同じ区間の 3 本を並べる
        condition: 左のノードの右の辺から 40px の縦の直線の上で範囲が重なる区間を持つ 3 本の線と、左のノードの右の辺から 80px に左の辺を持つ右のノード（元の直線が、`clearance` を含めた通り道 12〜68px の中ほど）
        mock: なし
        expected: 3 本のその区間の x 座標が、左のノードの右の辺から 32・40・48px で、どの 2 本も同じ向きの区間が同じ直線の上で重ならず、線は縦横の折れ線のまま。`crowded` が 0
      - name: test_separate_wires_when_shared_end
        case: 正常
        summary: 同じ点から出る線の端
        condition: 同じノードの同じ辺の中央から出て、最初の区間だけが重なる 2 本の線
        mock: なし
        expected: 2 本の点の並びが引数のまま
      - name: test_separate_wires_when_grid_line
        case: 正常
        summary: 辺から 12px の格子の線を通る束
        condition: 左のノードの右の辺から 12px（`clearance`）の縦の直線の上で範囲が重なる 5 本の線と、右のノードの左の辺が左のノードの右の辺から 80px
        mock: なし
        expected: 5 本のその区間の x 座標が、左のノードの右の辺から 24・32・40・48・56px（通り道 12〜68px の中ほど 40px が束の中ほど）で、どの区間も両側の矩形に入らず、`crowded` が 0
      - name: test_separate_wires_when_crowded
        case: 正常
        summary: 通り道の幅が足りない
        condition: test_separate_wires_when_grid_line の 5 本と、右のノードの左の辺が左のノードの右の辺から 40px
        mock: なし
        expected: '`crowded` が 16（束の幅 32px に対して通り道 12〜28px の幅が 16px）で、`layoutMap` に `spread: 16` を指定して配置し直した後の線を並べると `crowded` が 0'
      - name: test_separate_wires_when_end_segment
        case: 正常
        summary: 端点を含む区間は端点を動かさずに並べる
        condition: 上のノードの下の辺から下へ出る線と、下のノードの上の辺から上へ出る線の 2 本で、どちらも最初の区間（端点を含む）が同じ縦の直線の上で重なり、その後は右の別のノードへ折れる
        mock: なし
        expected: 2 本の最初と最後の点（端点）が引数のままで、どの 2 本も同じ向きの区間が同じ直線の上で重ならず、線は縦横の折れ線のまま。`crowded` が 0
lead: '入れ子のグループの自動配置と線の経路を受け持ち、構成図の配置を変えるときに参照する。'
tags:
