id: MOD-472-158
visibility: internal
title: ライブラリ本体 / ビューとコメント / mount-parts.ts
test_files:
  - tests/unit/src/mount-parts.browser.test.ts
data_models:
  - name: PartsHandle
    title: 描いた文書に付けた部品の操作
    container: src/mount-parts.ts
    role: モジュールの構造
    summary: '`attachParts` の戻り値'
    properties:
      - name: detach
        type: () => void
        description: 付けた部品を削除する。読み込みを待っている間に呼ぶと、読み込めた後に付けない
      - name: reloadComments
        type: () => Promise<void>
        description: 付けたコメントの `reload` を呼ぶ。コメントを付けていないときは解決した Promise を返却する
      - name: focusComment
        type: '(id: string) => void'
        description: 付けたコメントの `focus` を呼ぶ。コメントを付けていないときは何もしない
    status: planned
    introduced:
      pr: 280
functions:
  - name: mountView
    title: ビューを描く公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、ビューの部品のモジュールを読み込んで `el` にビューを描く
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中を書き換える。読み込めないときは通知ブロックを配置し、`console.error` に出す'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先の要素
      - name: opts
        type: MdmarkViewOptions
        required: true
        description: 項目と表示の指定
    args_example: |-
      ```ts
      const view = await mountView(slot, { columns: ["タイトル", "状態"], items, group: "状態" });
      view.destroy();
      ```
    returns:
      type: Promise<MdmarkViewHandle>
      description: 描き終えたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkViewOptions` が投げる（同期）'
    process: |-
      1. `checkViewOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("view")` を待ち、`module.drawView(el, opts)` の削除する関数を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読み込めないときは `el` の中を class `mdmark` の要素 1 つにし、その中に `renderNotice({ name: "view", figure: false, source: "part" })` を配置し、部品の名前・URL・元のエラーを `console.error` に出して、元のエラーで reject する
    unit_tests:
      - name: test_mount_view
        case: 正常
        summary: モジュールの drawView を呼んで destroy を返却する
        condition: '`columns`・`items`・`group` を指定する'
        mock: '`loadPartModule` の `importModule` は、呼ばれた引数を記録して削除する関数を返却する `drawView` を持つモジュールを返却する'
        expected: '`drawView` が `el` と `opts` で呼ばれる。`destroy` を 2 回呼んでも解除する関数は 1 回だけ呼ばれる'
      - name: test_mount_view_when_invalid
        case: 異常
        summary: 引数が合わないと同期で投げ、モジュールを読み込まない
        condition: '`group` に無い列名'
        mock: '`importModule` は呼ばれたかを記録する'
        expected: '`TypeError` を同期で投げ、`importModule` は呼ばれず、`el` は変わらない'
      - name: test_mount_view_when_module_unavailable
        case: 異常
        summary: 読み込めないと通知ブロックを配置して reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`console.error` を記録する関数で包む'
        expected: '`el` の中にタイトルが `この箇所を表示できません` の通知ブロックがあり、元のエラーで reject する。`console.error` に `view` と URL'
    refs:
      - IF-472-30#
  - name: mountComments
    title: コメントを付ける公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、コメントの部品のモジュールを読み込んで `el` の中にコメントを付ける
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中にマーカー・ボタン・一覧を配置し、`document` に受け取りを付ける'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: コメントを付けられる範囲の要素
      - name: opts
        type: '{ store: MdmarkCommentStore; docId: string }'
        required: true
        description: 読み込みと保存の関数と対象の ID
    returns:
      type: Promise<MdmarkCommentsHandle>
      description: 読み込んだコメントにマーカーを付けたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkCommentOptions` が投げる（同期）'
    process: |-
      1. `checkCommentOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("comments")` を待ち、`module.attachComments({ root: el, store, docId })` が返却した `CommentsController` の `detach` を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読み込めないときは `el` を書き換えず、`load` を呼ばずに元のエラーで reject する
    unit_tests:
      - name: test_mount_comments
        case: 正常
        summary: モジュールの attachComments を呼んで destroy を返却する
        condition: '`store` と `docId: "panel-setup"`'
        mock: '`importModule` は、引数を記録して削除する関数で解決する `attachComments` を持つモジュールを返却する'
        expected: '`attachComments` が `{ root: el, store, docId }` で呼ばれる。`destroy` で削除する関数が 1 回呼ばれる'
      - name: test_mount_comments_when_invalid
        case: 異常
        summary: 読み込みと保存の関数が無いと同期で投げる
        condition: '`store` に `save` が無い'
        mock: なし
        expected: メッセージに `opts.store` を含む `TypeError` を同期で投げる
      - name: test_mount_comments_when_module_unavailable
        case: 異常
        summary: 読み込めないと el を書き換えずに reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`load` は呼ばれたかを記録する'
        expected: 元のエラーで reject し、`el` の中は変わらず、`load` は呼ばれない
    refs:
      - IF-472-27#
  - name: attachParts
    title: 描いた文書に部品を付ける
    container: src/mount-parts.ts
    summary: '`mount` が描くたびに呼ぶ。ビューのマーカーとコメントの機能があるときだけ部品のモジュールを読み込んで付け、削除する関数を返却する'
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; commentStore?: MdmarkCommentStore; docId?: string; isCurrent: () => boolean; warned: { missingStore: boolean } }'
        required: true
        description: 描いた要素・文書で決まった機能・`mount` の `commentStore` と `docId`・描いた文書がまだ今のものか・`mount` ごとに記録する、読み込みと保存の関数が無いことを出したか
    returns:
      type: PartsHandle
      description: 付けた部品を削除する関数と、付けたコメントを再読み込みする・マーカーへ移る関数
    process: |-
      1. `features.views` がオンで `root` に `div.mdmark-view` があれば `loadPartModule("view")` を待ち、`isCurrent()` で削除していなければ、`div.mdmark-view` ごとに `attachView` を呼んで削除する関数を記録する
      2. `features.comments` がオンで `commentStore` と `docId` があれば `loadPartModule("comments")` を待ち、`isCurrent()` で削除していなければ `attachComments({ root, store: commentStore, docId, reveal: openEnclosing, margin: true })` を待って `CommentsController` を記録する（待つ間に削除したら、得た `detach` をすぐ呼ぶ）。この待ちの Promise（読み込めない・削除したときは `undefined` で解決する）も記録する。`features.comments` がオンで `commentStore` を指定していなければ、モジュールを読み込まず、コメントの機能に読み込みと保存の関数が要ることを `console.error` に出す（`mount` ごとに 1 回。`mount` が指定する `warned` で記録する）
      3. `features.map` がオンで `root` に `div.mdmark-map` があれば `loadPartModule("map")` を待ち、`isCurrent()` で削除していなければ `attachMap(root, config)` を呼んで削除する関数を記録する
      4. 読み込めないときは付けずに、部品の名前（`view`・`comments`・`map`）・URL・元のエラーを `console.error` に 1 回出す（ページの中で部品ごとに 1 回）。ビューのマーカーの場所は `render` の表のまま残す
      5. `reloadComments` は、コメントの待ちの Promise を記録していなければ解決した Promise を返却する。記録していれば待ち、`CommentsController` を得て削除していなければその `reload()` を返却し、それ以外は解決する。`focusComment(id)` は、`CommentsController` を記録していて削除していなければその `focus(id)` を呼ぶ
      6. `detach` は、削除したマーカーを起動し、記録した削除する関数を逆の順に呼ぶ。続けて `root` の中の要素ごとに、`mountedViews`・`mountedComments` に残っている戻り値の `destroy` を呼ぶ（拡張の `draw` から呼んだ `mountView`・`mountComments` を、`mount` の `update`・`destroy` で片付ける）
    unit_tests:
      - name: test_attach_parts
        case: 正常
        summary: ビューのマーカーごとに attachView を呼ぶ
        condition: '`div.mdmark-view` 2 つを持つ `root`、`views: true`'
        mock: '`importModule` は呼ばれた要素を記録する `attachView` を返却する'
        expected: '`attachView` が 2 回呼ばれ、削除する関数で両方の削除する関数が呼ばれる'
      - name: test_attach_parts_when_no_marks
        case: 正常
        summary: マーカーも機能も無ければモジュールを読み込まない
        condition: 'ビューのマーカーの無い `root`、`comments: false`'
        mock: '`importModule` は呼ばれたかを記録する'
        expected: '`importModule` が呼ばれない'
      - name: test_attach_parts_when_comments_without_store
        case: 正常
        summary: comments がオンでも読み込みと保存の関数が無ければ読み込まず、console.error に 1 回だけ出す
        condition: '`comments: true`、`commentStore` を指定せず、同じ `warned` で 2 回呼ぶ'
        mock: '`importModule` は呼ばれたかを記録する。`console.error` を記録する'
        expected: '`importModule` が呼ばれない。`console.error` が 1 回だけ呼ばれる'
      - name: test_attach_parts_when_detached_while_loading
        case: 正常
        summary: 読み込みを待つ間に削除すると付けない
        condition: 読み込みを合図まで待たせ、削除する関数を呼んでから返却する
        mock: 合図で返却する `importModule`
        expected: '`attachView` が呼ばれない'
      - name: test_attach_parts_when_module_unavailable
        case: 異常
        summary: 読み込めないと表を残して console.error に 1 回出す
        condition: '`div.mdmark-view` 2 つ'
        mock: '`importModule` は reject する。`console.error` を記録する'
        expected: '`root` の中は変わらない。`console.error` が `view` と URL で 1 回だけ呼ばれる'
      - name: test_attach_parts_when_parts_mounted_inside
        case: 正常
        summary: 削除する関数で root の中に mountView・mountComments で付けた部品も片付ける
        condition: '`root` の中の要素 1 つに `mountView`、別の要素に `mountComments` を呼び、解決してから `attachParts` の削除する関数を呼ぶ。`root` の外の要素にも `mountView` を呼ぶ'
        mock: '`importModule` は、呼ばれた回数を記録する削除する関数を返却する `drawView`・`attachComments` を持つモジュールを返却する'
        expected: '`root` の中の 2 つの削除する関数が 1 回ずつ呼ばれ、`root` の外のビューの削除する関数は呼ばれない'
      - name: test_attach_parts_when_comments_reloaded
        case: 正常
        summary: reloadComments と focusComment を付けたコメントに任せる
        condition: '`comments: true`・`commentStore`・`docId` で呼び、`reloadComments()` と `focusComment("c1")` を呼ぶ'
        mock: '`importModule` は、引数を記録し、`reload`・`focus` の呼び出しを記録する `CommentsController` で解決する `attachComments` を持つモジュールを返却する'
        expected: '`attachComments` の引数の `reveal` が `openEnclosing`。`reload` が 1 回呼ばれて `reloadComments()` が解決し、`focus` が `c1` で 1 回呼ばれる'
      - name: test_attach_parts_when_comments_reload_disabled
        case: 正常
        summary: コメントを付けていないとき・読み込めないときは load を呼ばずに解決する
        condition: '`comments: false` で呼んだ戻り値と、`importModule` が reject するときの戻り値の `reloadComments()`'
        mock: '`importModule` は呼ばれたかを記録するか reject する。`console.error` を記録する'
        expected: どちらも解決し、1 つ目は `importModule` が呼ばれない
      - name: test_attach_parts_when_comments_reload_after_detach
        case: 正常
        summary: 削除した後の reloadComments は reload を呼ばずに解決する
        condition: '`attachComments` の解決の前に `detach` を呼び、その後に `reloadComments()`'
        mock: 合図で解決する `attachComments`
        expected: '`reloadComments()` が解決し、`reload` は呼ばれず、得た `detach` が 1 回呼ばれる'
    refs:
      - IF-472-35#exceptions[なし（ビュー・コメントの部品のモジュールを読み込めない）]
      - IF-472-35#constraints[コメントの再読み込み]
