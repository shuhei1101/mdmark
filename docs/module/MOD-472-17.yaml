id: MOD-472-17
visibility: internal
title: "VS Code 拡張機能 / ビルドと配布"
lead: 拡張機能を esbuild、Webview を Vite で書き出し、タグとバージョンを照合して .vsix を GitHub Release に添える。拡張機能ホストで実行する結合テストの起動も持つ。配布物には入らない。
directory: |-
  ```tree
  vscode/
  ├── .vscodeignore              # .vsix に入れないもの（src/・tests/・scripts/・out/・node_modules/・media/test/）
  ├── tsconfig.json              # 型の検査（types: node・vscode・mocha、jsx: react-jsx、paths: `@/*` → `src/webview/*`）
  ├── scripts/
  │   ├── build.ts               # dist/extension.cjs（esbuild）・media/preview.js・media/preview.css（Vite）と、--tests のとき out/test/ と media/test/axe.js を書き込む
  │   └── release-check.ts       # タグと package.json の version を照合する
  └── tests/integration/
      ├── run.ts                 # 代役の配信を起動し、runTests を 1.141.0 と stable で呼ぶ
      ├── stub-server.ts         # 代役の配信（配布物とタグ一覧）。結合テストが使用する
      ├── index.ts               # 拡張機能ホストの中で mocha を動かす run()
      └── {インターフェース定義}.test.ts
  .github/workflows/
  └── vscode-release.yml         # vscode-v* のタグで .vsix を作り Release に添える
  ```

  `dist/`・`media/`（丸ごと）・`out/`・`.vscode-test/` は git の管理の外（`.gitignore`）にする。Webview の Vite の設定（`vite.config.ts`）は設計書『VS Code 拡張機能 / Webview』にある。
