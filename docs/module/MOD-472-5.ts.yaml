id: MOD-472-5
visibility: internal
title: ClaudeCodeプラグイン / セットアップ / systemd / systemd.ts
lead: '`start-server`・`status` が呼ぶ systemd --user の確認・unit のファイルの組み立て・unit の状態の読み取り。'
test_files:
  - tests/unit/src/plugin/setup/systemd.test.ts
data_models:
  - name: UnitState
    title: unit の状態
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    summary: '`systemctl --user show` から読んだ unit の状態'
    properties:
      - name: activeState
        type: string
        description: '`ActiveState`（`active`・`activating`・`inactive`・`failed` など）'
      - name: subState
        type: string
        description: '`SubState`（`running`・`auto-restart`・`dead` など）'
      - name: nRestarts
        type: number
        description: '`NRestarts`。`start`・`restart` で 0 に戻る'
      - name: mainPid
        type: number
        description: '`MainPID`。動いていなければ 0'
      - name: enabled
        type: boolean
        description: '`UnitFileState` が `enabled`'
    refs:
      - LIB-472-25#catalogs
    status: planned
    introduced:
      pr: 444
constants:
  - name: UNIT_BASE_PATH
    title: unit の PATH の末尾
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    summary: unit の `PATH` で、`node`・`npx` のフォルダの後ろに続けるフォルダ
    value: /usr/local/bin:/usr/bin:/bin
    refs:
      - IF-472-7#constraints[unit のファイル]
    status: planned
    introduced:
      pr: 444
  - name: SYSTEMD_USABLE_STATES
    title: systemd --user が使える状態
    container: src/plugin/setup/systemd.ts
    usecase: 端末の状態を調べる
    summary: '`is-system-running` の標準出力のうち、user のマネージャーが動いている値'
    value: '["running", "degraded", "starting"]'
    refs:
      - IF-472-7#constraints[systemd --user が使えるか]
    status: planned
    introduced:
      pr: 444
functions:
  - name: hasSystemd
    title: systemd --user が使えるか
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 端末の状態を調べる
    role: 処理
    summary: '`systemctl --user is-system-running` の標準出力が `SYSTEMD_USABLE_STATES` のどれかか'
    scope: public
    is_async: true
    args:
      - name: run
        type: RunCommand
        required: true
        description: コマンドの実行
    returns:
      type: Promise<boolean>
      description: 使えるか
    process: 1. `run("systemctl", ["--user", "is-system-running"])` の標準出力の前後の空白を除いた値が `SYSTEMD_USABLE_STATES` に含まれるかを返却する。終了コードは見ない（`systemctl` が無いと 127 で標準出力が空）
    unit_tests:
      - name: test_has_systemd
        case: 正常
        summary: degraded でも使える
        condition: 終了コード 1・標準出力 `degraded\n` を返却する `run`
        mock: 差し替えた `run`
        expected: '`true`'
      - name: test_has_systemd_when_offline
        case: 正常
        summary: offline・コマンドが無いときは使えない
        condition: 標準出力 `offline\n` を返却する `run` と、終了コード 127・標準出力が空の `run`
        mock: 差し替えた `run`
        expected: どちらも `false`
    refs:
      - LIB-472-25#catalogs
    status: planned
    introduced:
      pr: 444
  - name: escapeUnitValue
    title: unit の値を打ち消す
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: unit のファイルに記載する値の `\`・`"` を `\` で、`%` を `%%` で打ち消す
    scope: public
    is_async: false
    args:
      - name: value
        type: string
        required: true
        description: 値
    returns:
      type: string
      description: 打ち消した値
    process: 1. `\` を `\\`、`"` を `\"`、`%` を `%%` に置き換えて返却する
    unit_tests:
      - name: test_escape_unit_value
        case: 正常
        summary: 指定子と引用符を打ち消す
        condition: '`a "b" 50% \c`'
        mock: なし
        expected: '`a \"b\" 50%% \\c`'
    refs:
      - IF-472-7#constraints[unit の値の書き方]
    status: planned
    introduced:
      pr: 444
  - name: buildUnitFile
    title: unit のファイルを組み立てる
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 常駐サーバーの unit のファイルの中身を作る
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ port: number; settingsPath: string; stateDir: string; path: string; command: string }'
        required: true
        description: ポート・端末の設定のパス・状態の配置場所・unit の `PATH`（`buildUnitPathEnv` の値）・起動するコマンド
    returns:
      type: string
      description: unit のファイルの中身（末尾は改行）
    process: |-
      1. `[Unit]` に `Description=mdmark MCP server` を記載する
      2. `[Service]` に `Environment="MDMARK_PORT=…"`・`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`MDMARK_LAUNCHER=systemd`・`PATH` を 1 行ずつ、値を `escapeUnitValue` で打ち消して記載する
      3. `ExecStart=/bin/sh -c '{command}'`（コマンドは一重引用符を `'\''` にし、`%` を `%%`、`$` を `$$` にする）と `Restart=on-failure` を記載する
      4. `[Install]` に `WantedBy=default.target` を記載する
    callees:
      - '#functions[escapeUnitValue]'
    unit_tests:
      - name: test_build_unit_file
        case: 正常
        summary: 環境変数と起動のコマンドを記載する
        condition: ポート 18782・`PATH` が `/a b:/c`・コマンド `npx -y x serve --v 100% $HOME`
        mock: なし
        expected: '`Environment="MDMARK_PORT=18782"`・`Environment="MDMARK_LAUNCHER=systemd"`・`Environment="PATH=/a b:/c"`・`ExecStart=/bin/sh -c ''npx -y x serve --v 100%% $$HOME''`・`Restart=on-failure`・`WantedBy=default.target` の行がある'
    refs:
      - IF-472-7#constraints[unit のファイル]
      - LIB-472-25#limitations
    status: planned
    introduced:
      pr: 444
  - name: buildUnitPathEnv
    title: unit の PATH を作る
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 呼んだ側の `PATH` から `node`・`npx` のあるフォルダだけを取り、`UNIT_BASE_PATH` を続けた値を作る
    description: セッションや worktree によって変わる `PATH` をそのまま unit に記載すると、呼ぶたびに中身が変わって unit を起動し直すため、セッションによらず決まる値にする
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ path: string | undefined; isExecutable: (file: string) => boolean }'
        required: true
        description: 呼んだ側の `PATH` と、ファイルが実行できるかを返す関数
    returns:
      type: string
      description: unit に記載する `PATH`
    process: |-
      1. `path` を `:` で区切り、前から順に `{フォルダ}/node`・`{フォルダ}/npx` が `isExecutable` で真になる最初のフォルダをそれぞれ取る
      2. 取れたフォルダ（同じなら 1 つ）を前に、`UNIT_BASE_PATH` のフォルダを後ろに、重なりを除いて `:` でつないで返却する
    unit_tests:
      - name: test_build_unit_path_env
        case: 正常
        summary: node と npx のフォルダだけを取り、重なりと関係の無いフォルダを除く
        condition: '`PATH` が `/h/.local/bin:/h/.local/bin:/w/.venv/bin:/n/v24/bin:/usr/bin`、`/n/v24/bin/node` と `/n/v24/bin/npx` だけが実行できる'
        mock: 差し替えた `isExecutable`
        expected: '`/n/v24/bin:/usr/local/bin:/usr/bin:/bin`'
      - name: test_build_unit_path_env_when_same_input
        case: 正常
        summary: 関係の無いフォルダの並びが変わっても同じ値
        condition: 上の `PATH` と、`/w/.venv/bin` を除いて `/x/bin` を先頭に足した `PATH`
        mock: 差し替えた `isExecutable`
        expected: どちらも同じ値
    refs:
      - IF-472-7#constraints[unit のファイル]
      - LIB-472-25#limitations
    status: planned
    introduced:
      pr: 444
  - name: readUnitState
    title: unit の状態を読む
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`systemctl --user show` の `Key=Value` の行から `UnitState` を作る'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ run: RunCommand; unit: string }'
        required: true
        description: コマンドの実行と unit の名前
    returns:
      type: Promise<UnitState>
      description: unit の状態
    process: 1. `run("systemctl", ["--user", "show", "-p", "ActiveState", "-p", "SubState", "-p", "NRestarts", "-p", "MainPID", "-p", "UnitFileState", "{unit}.service"])` の `Key=Value` の行を読み、無い値は空・0 にする。`--value` は使用しない（行の順が `-p` の順にならない）
    unit_tests:
      - name: test_read_unit_state
        case: 正常
        summary: Key=Value の行を順によらず読む
        condition: '`NRestarts=2`・`ActiveState=activating`・`MainPID=0`・`SubState=auto-restart`・`UnitFileState=enabled` を返却する `run`'
        mock: 差し替えた `run`
        expected: '`{ activeState: "activating", subState: "auto-restart", nRestarts: 2, mainPid: 0, enabled: true }`'
    refs:
      - LIB-472-25#catalogs
    status: planned
    introduced:
      pr: 444
  - name: hasUnitExited
    title: unit の常駐サーバーが終わったか
    kind: 関数
    container: src/plugin/setup/systemd.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`NRestarts` が 1 以上・`SubState` が `auto-restart`・`ActiveState` が `failed` のどれかか'
    scope: public
    is_async: false
    args:
      - name: state
        type: UnitState
        required: true
        description: unit の状態
    returns:
      type: boolean
      description: 終わったか
    process: 1. `state.nRestarts >= 1 || state.subState === "auto-restart" || state.activeState === "failed"` を返却する
    unit_tests:
      - name: test_has_unit_exited
        case: 正常
        summary: 起動し直した・起動し直す前・failed を終わったとする
        condition: '`nRestarts: 1` の状態、`subState: "auto-restart"` の状態、`activeState: "failed"` の状態、`active`・`running`・`nRestarts: 0` の状態'
        mock: なし
        expected: 前の 3 つが `true`、最後が `false`
    refs:
      - IF-472-7#constraints[終わったことの判定]
    status: planned
    introduced:
      pr: 444
