id: MOD-472-240
visibility: internal
title: ライブラリ本体 / 表 / table-settings.interact.ts
test_files:
  - tests/unit/src/table/table-settings.interact.browser.test.ts
functions:
  - name: attachTableSettings
    title: テーブル設定を付ける
    container: src/table/table-settings.interact.ts
    kind: 関数
    scope: internal
    summary: 表のメニューの「テーブル設定」の項目でパネルを開き（表のメニューを閉じてから開き、Esc で閉じると表のメニューのボタンへフォーカスを戻す）、目のアイコンで列を隠し、つまみのドラッグ＆ドロップと ↑・↓ キーで列を動かす。列を動かしたら見出し・本文の行・集計の行のセルと一覧をもう一度並べ、隠したら表のメニューのボタンのバッジと `aria-label` を書き換えて `onColumnsChange` を呼ぶ
    description: 並べ替えはセルの並びを DOM の上で入れ替え、列の位置は各セルに描いたときの `data-col` を持たせて数える（並べ替え・絞り込み・コピー・集計は `data-col` で列を参照する）。動かせるかは `canMoveColumn`（`pinned` は `through` の表の `pin=` で留めた列だけを `true` にする）、新しい順は `moveColumn` で決める。`dragover` で動かせない行には `preventDefault` せず線も出さない。列の順は覚えない。つまみの `click`（ドラッグで動かした後は発火しない）と、つまみにフォーカスした Enter・Space で、パネルの列の移動のメニュー（`div.mdmark-table-move-menu`）をそのつまみの行（`li`）の中の末尾へ移して開き、つまみの `aria-expanded` を `true` にして、押せる最初のボタンへフォーカスを移す（どちらへも動かせない `disabled` のつまみでは開かない）。`前へ移す`・`後ろへ移す` は `canMoveColumn`・`moveColumn` で同じ範囲の中で 1 つ動かし、メニューを開いたままボタンの `disabled` を付け直し、押したボタンが `disabled` になったらもう一方のボタンへフォーカスを移す。メニューは Esc・メニューの外の `pointerdown`・パネルを閉じると閉じ、Esc ではそのつまみへフォーカスを戻す（メニューが開いている間の Esc はパネルを閉じない）。受け取りはその表の囲みの中だけで処理する
    side_effects: 表のセルと一覧の並び・`hidden`・ボタンの属性を書き換える。パネルを開いている間だけ `document` の `pointerdown`・`keydown` を受け取る
    args:
      - name: options
        type: '{ wrapper: HTMLElement; onColumnsChange?: (change: { hidden: string[] }) => void }'
        required: true
        description: '`wrapper` は `div.mdmark-table`、`onColumnsChange` は `attachTables` が `tableIndex` を付けて指定する通知し'
    returns:
      type: () => void
      description: 受け取りを解除する関数
    callees:
      - 'MOD-472-218#functions[canMoveColumn]'
      - 'MOD-472-218#functions[moveColumn]'
      - MOD-472-315#functions[renderTableSettings]
    unit_tests:
      - name: test_attach_table_settings_when_dragged
        case: 正常
        summary: ドラッグ＆ドロップで列を動かし、全ての行のセルをもう一度並べる
        condition: '`reorder`・`columns` の機能の 4 列 3 行の表。説明のつまみを名前の上へ `dragstart`・`dragover`・`drop`'
        mock: '`DataTransfer` を作って指定する'
        expected: 見出しと 3 行のセルの `data-col` が `3,0,1,2` の順で、一覧も同じ順
      - name: test_attach_table_settings_when_arrow_key
        case: 正常
        summary: つまみの ↓ キーで 1 つ動かし、フォーカスを残す
        condition: 同じ表で型のつまみにフォーカスして `ArrowDown`
        mock: なし
        expected: 列が `0,2,1,3` の順で、`document.activeElement` が型のつまみ
      - name: test_attach_table_settings_when_group_boundary
        case: 正常
        summary: 結合した見出しの範囲の外とピン止めの境には動かさず、動かせないつまみを `disabled` にする
        condition: '`header.rows` が 2 で `名前` の列が `pinned` の表を `pinMode: "through"` で付け、型を備考の下へ `drop`'
        mock: なし
        expected: 列の順が変わらず、名前と備考のつまみが `disabled`
      - name: test_attach_table_settings_when_hidden
        case: 正常
        summary: 目のアイコンで列を隠し、バッジとスクリーンリーダー向けの名前を書き換えて通知する
        condition: 説明の目のアイコンを押す
        mock: '`onColumnsChange` を見張る'
        expected: '説明のセルが `hidden`、表のメニューのボタンのバッジが `1`・`aria-label` が `表のメニュー（1 列を非表示）`、`onColumnsChange` が `{ hidden: ["説明"] }` で 1 回'
      - name: test_attach_table_settings_when_move_menu
        case: 正常
        summary: つまみを押して開いたメニューで列を 1 つずつ動かし、端ではフォーカスをもう一方のボタンへ移す
        condition: '`reorder`・`columns` の機能の 4 列 3 行の表（`名前`・`型`・`既定`・`説明`）。既定のつまみを `click` し、`前へ移す` を 2 回押し、Esc'
        mock: なし
        expected: '`click` の後は既定のつまみが `aria-expanded="true"`、その行の `li` の中のメニューが `hidden` を持たず `前へ移す` にフォーカス。1 回目の後は列が `0,2,1,3` の順でメニューが開いたまま、2 回目の後は `2,0,1,3` で `前へ移す` が `disabled`、`後ろへ移す` にフォーカス。Esc の後はメニューが `hidden`、パネルは開いたままで、既定のつまみが `aria-expanded="false"` とフォーカスを持つ'
      - name: test_attach_table_settings_when_move_menu_by_keyboard
        case: 正常
        summary: つまみの Enter でメニューを開き、動かせないつまみでは開かない
        condition: 同じ表で名前のつまみにフォーカスして Enter。`test_attach_table_settings_when_group_boundary` の表で `disabled` の名前のつまみを `click`
        mock: なし
        expected: 1 つ目は `前へ移す` が `disabled` で `後ろへ移す` にフォーカス。2 つ目はメニューが `hidden` のまま
    status: planned
lead: 'テーブル設定のパネルの開閉・列の表示の切り替え・列の並べ替えを受け持ち、テーブル設定の操作を変えるときに参照する。'
