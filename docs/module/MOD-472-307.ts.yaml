id: MOD-472-307
visibility: internal
title: ライブラリ本体 / 部品 / side-toc.ts
test_files:
  - tests/unit/src/parts/side-toc.test.ts
data_models:
  - name: SideTocHeading
    title: 右側の目次の見出し
    container: src/parts/side-toc.ts
    summary: 右側の目次に並べる見出し 1 つ
    properties:
      - name: level
        type: 1 | 2 | 3
        description: 見出しのレベル
      - name: id
        type: string
        description: 見出しの ID
      - name: text
        type: string
        description: 目次に出す見出しの文字
      - name: changed
        type: boolean | undefined
        description: 比較元から変わったセクションか。`true` なら項目と右端の線に変更のマーカーを付ける（省くと付けない）
    status: planned
    introduced:
      pr: 166

functions:
  - name: renderSideToc
    title: 右側の目次を描く
    container: src/parts/side-toc.ts
    summary: 部品設計『右側の目次』の HTML を返却する。深いレベルの見出しは直前の浅いレベルの入れ子にし、右端の線を見出しの数だけ並べる。項目のリンクは `href="#{id}"` と、見出しの ID を持つ `data-heading-id` を持つ。`changed` の見出しは、項目のリンクに `data-changed` と `aria-label="{text}（変更）"` を付けてリンクの文字の後ろに `<span class="mdmark-side-toc-changed" aria-hidden="true"></span>` を配置し、右端の線に `data-changed` を付ける。`sections` が `false` ならすべて展開・すべて折りたたむを配置しない。目次の頭にはタイトルを配置せず、まとめて開閉するボタンの並び（`sections` が `true` のとき）とピン止めのボタンをこの順に配置する。ピン止めのボタンには押す前のアイコン（`panel-right-dashed`、`mdmark-side-toc-pin-off`）と押した後のアイコン（`panel-right`、`mdmark-side-toc-pin-on`）を両方置き、CSS が `aria-pressed` で片方を出す。アイコンは lucide の ellipsis・panel-right-dashed・panel-right・chevrons-up-down・chevrons-down-up（`src/parts/icons.ts` に PanelRightDashed と PanelRight を追加する。`pin` は表のピン止めで使用するため残す）
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ headings: SideTocHeading[]; mode?: SideTocMode; sections?: boolean; open?: boolean; pinned?: boolean; current?: string; panelId?: string }'
        required: true
        description: 部品設計の引数と、パネルの ID（既定 `mdmark-side-toc-panel`。目次を出すボタンの `aria-controls` に写す）
    returns:
      type: string
      description: '`<aside class="mdmark-side-toc" data-mode="{mode}">` で始まる HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_side_toc
        case: 正常
        summary: 見出しを入れ子にし、右端の線とスクリーンリーダー向けの名前を付ける
        condition: '`手引き`（h1）・`導入`（h2）・`前提`（h3）・`使用方法`（h2）を既定の引数で指定する'
        mock: なし
        expected: '`data-mode="hover"`、`nav` が `aria-label="右側の目次"`、`手引き` の `li` の中に `導入`・`使用方法`、`導入` の `li` の中に `#前提` のリンクがあり、`data-heading-id="前提"` を持つ。右端の線が 4 本で `aria-hidden="true"`。目次を出すボタンが `aria-expanded="false"` で `aria-controls="mdmark-side-toc-panel"`、ピン止めが `aria-pressed="false"` で `mdmark-side-toc-pin-off` と `mdmark-side-toc-pin-on` の 2 つのアイコンを持ち、`data-fold-all="open"` と `data-fold-all="close"` のボタンがある。`mdmark-side-toc-head` の子が `mdmark-side-toc-actions` と `mdmark-side-toc-pin` の順で、`mdmark-side-toc-title` と「目次」の文字が無い'
      - name: test_render_side_toc_when_fixed_open
        case: 正常
        summary: 出し方と出している状態を属性に写す
        condition: '`mode: "fixed"`、`open: true`、`pinned: true`'
        mock: なし
        expected: '`data-mode="fixed"`・`data-open`・`data-pinned` を持ち、ボタンが `aria-expanded="true"` と `aria-pressed="true"`'
      - name: test_render_side_toc_when_without_sections
        case: 正常
        summary: sections が false ならすべて展開・すべて折りたたむを配置しない
        condition: '`sections: false`'
        mock: なし
        expected: '`data-fold-all` を持つボタンが無く、`mdmark-side-toc-head` の子が `mdmark-side-toc-pin` だけ'
      - name: test_render_side_toc_when_changed
        case: 正常
        summary: 変わったセクションの項目と右端の線に変更のマーカーを付ける
        condition: '`手引き`（h1・`changed: true`）・`導入`（h2）・`使用方法`（h2・`changed: true`）'
        mock: なし
        expected: '`#手引き`・`#使用方法` のリンクが `data-changed` と `aria-label="手引き（変更）"`・`aria-label="使用方法（変更）"` を持ち、リンクの文字が `手引き`・`使用方法` のままで、末尾に `aria-hidden="true"` の `span.mdmark-side-toc-changed` を持つ。`#導入` のリンクは `data-changed`・`aria-label`・`span.mdmark-side-toc-changed` を持たない。右端の線の 1 本目と 3 本目だけが `data-changed` を持つ'
      - name: test_render_side_toc_when_current
        case: 正常
        summary: 今いるセクションの項目・線・狭い幅の帯の文字を付ける
        condition: '`test_render_side_toc` の見出しに `current: "前提"`'
        mock: なし
        expected: '`#前提` のリンクだけが `aria-current="location"`、3 本目の線だけが `data-current`、`mdmark-side-toc-current` が `前提`'
      - name: test_render_side_toc_when_text_has_html
        case: 正常
        summary: 見出しの文字と ID をエスケープする
        condition: '`text: "<b>太字</b>"`、`id: "a\"b"` の見出し'
        mock: なし
        expected: '`&lt;b&gt;太字&lt;/b&gt;` と `href="#a&quot;b"` と `data-heading-id="a&quot;b"` を含み、`<b>` を含まない'
    refs:
      - CMP-472-37#
    status: planned
    introduced:
      pr: 166
