id: MOD-472-283
visibility: internal
title: ライブラリ本体 / 記法 / steps.ts
test_files:
  - tests/unit/src/render/syntax/steps.test.ts
functions:
  - name: buildSteps
    title: ステップにする
    container: src/render/syntax/steps.ts
    kind: 関数
    scope: internal
    summary: コアルール。`steps` がオンなら、`steps` の範囲の最初の番号付きリスト（入れ子は除く）の `ol` に class `mdmark-steps` を付ける。マーカーの設定は `readStepsOptions` で読み込む。`collapse` が `closed`・`open` なら、その `ol` を `renderCollapsible` の折り畳み（見出しは `title` か `手順（{入れ子を除く項目の数} ステップ）`）に入れる。番号付きリストが無ければ警告を差し込む
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - 'MOD-472-213#functions[pushWarning]'
      - '#functions[readStepsOptions]'
      - MOD-472-325#functions[renderCollapsible]
    unit_tests:
      - name: test_build_steps
        case: 正常
        summary: 範囲の番号付きリストを手順にし、入れ子はそのまま
        condition: 入れ子の番号付きリストを持つ 3 項目のリストを囲んだ範囲
        mock: なし
        expected: 外側の `ol` だけが class `mdmark-steps` を持つ
      - name: test_build_steps_when_no_list
        case: 正常
        summary: 番号付きリストが無い範囲は警告を差し込む
        condition: 番号の無いリストを囲んだ範囲
        mock: なし
        expected: 警告と `<ul>` があり、`mdmark-steps` が無い
      - name: test_build_steps_when_collapsed
        case: 正常
        summary: 折り畳みのステップを collapse.title か項目の数の見出しの折り畳みに入れる
        condition: '`<!-- steps: {"collapse": {"open": false}} -->` で入れ子の番号付きリストを持つ 2 項目のリスト、`<!-- steps: {"collapse": {"open": true, "title": "準備"}} -->` で 3 項目のリストを囲んだ範囲'
        mock: なし
        expected: 1 つ目が `open` を持たない `<details class="mdmark-collapsible"><summary>手順（2 ステップ）</summary><ol class="mdmark-steps">`、2 つ目が `<details class="mdmark-collapsible" open><summary>準備</summary>`
      - name: test_build_steps_when_unreadable_options
        case: 異常
        summary: 読み込めない指定は警告にして折り畳まずに手順にする
        condition: '`<!-- steps: {"fold": true} -->` と `<!-- steps: {"collapse": "closed"} -->` でそれぞれ 2 項目の番号付きリストを囲んだ範囲'
        mock: なし
        expected: 1 つ目の範囲の前に記載の警告が無く（`fold` は `unknown_mark_arg` になる）、2 つ目の範囲の前に `collapse` の型の記載の警告がある。どちらの `<ol class="mdmark-steps">` も `details` に入らない
  - name: readStepsOptions
    title: ステップのマーカーの指定を読み込む
    container: src/render/syntax/steps.ts
    summary: ステップのマーカーの設定の `collapse` を `readCollapse` で読み込む
    kind: 関数
    scope: internal
    args:
      - name: mark
        type: Mark
        required: true
        description: ステップの開きのマーカー
    returns:
      type: '{ collapse: "none" | "closed" | "open"; title?: string }'
      description: 折り畳みの指定
    unit_tests:
      - name: test_read_steps_options
        case: 正常
        summary: 開いた折り畳みと見出しを読み込む
        condition: '`<!-- steps: {"collapse": {"open": true, "title": "準備"}} -->`'
        mock: なし
        expected: '`collapse` が `open`、`title` が `準備`'
      - name: test_read_steps_options_when_none
        case: 正常
        summary: 引数が無ければ折り畳まない
        condition: '`<!-- steps -->`'
        mock: なし
        expected: '`collapse` が `none` で、`title` が無い'
    status: planned
    introduced:
      pr: 225
    callees:
      - 'MOD-472-270#functions[readCollapse]'
