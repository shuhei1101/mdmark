id: MOD-472-101
visibility: internal
title: VS Code 拡張機能 / 書き出し / write.ts
test_files:
  - tests/unit/vscode/src/export/write.test.ts
functions:
  - name: writeFileAtomically
    title: 一時ファイルから置き換える
    kind: 関数
    container: vscode/src/export/write.ts
    usecase: HTMLに書き出す
    summary: フォルダが無ければ作り、同じフォルダの `.{名前}.{乱数}.tmp` に記載してから `rename` で置き換える。失敗したら一時ファイルを削除してもう一度投げる
    scope: internal
    is_async: true
    side_effects: フォルダとファイルを書き込む
    args:
      - name: options
        type: '{ path: string; content: string }'
        required: true
        description: 書き出す先と中身
    returns:
      type: Promise<void>
      description: 置き換えたら解決する
    exceptions:
      - name: Error
        condition: フォルダを作れない・記載できない・置き換えられない（OS の誤りをもう一度投げる）
    unit_tests:
      - name: test_write_file_atomically
        case: 正常
        summary: 無いフォルダを作って記載し、一時ファイルを残さない
        condition: 一時フォルダの下の無いフォルダ `out/guide.html` に書き込む
        mock: なし（一時フォルダ）
        expected: '`out/guide.html` が中身どおりで、`out/` に `.tmp` のファイルが無い'
      - name: test_write_file_atomically_when_not_writable
        case: 異常
        summary: 書き込めなければ一時ファイルを削除してもう一度投げる
        condition: 書き出す先が既にあるフォルダ（`rename` が失敗する）
        mock: なし（一時フォルダ）
        expected: 例外を投げ、フォルダに `.tmp` のファイルが無い
        exception: 置き換えられない
    status: planned
