id: MOD-472-282
visibility: internal
title: ライブラリ本体 / 記法 / tabs.ts
test_files:
  - tests/unit/src/render/syntax/tabs.test.ts
functions:
  - name: buildTabs
    title: タブの範囲を区切る
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: コアルール。`tabs` がオンなら、`tabs` の範囲を最初に出る見出しの階層で区切り、部品『タブ』（`selected` 無し）の囲みと中身にする。マーカーの設定は `readTabsOptions` で読み込み、`group` と折り畳みの指定（`collapse`・`title`）を部品へ指定する。区切りの見出しのトークンは取り除く。見出しが無ければ警告を差し込み、中身をそのまま残す。範囲の閉じは `findTabsClose` で入れ子を数えて探し、中身の中のタブのマーカーの範囲も同じ処理でタブにする（内側のタブは外側の中身の中で、内側の範囲で最初に出る見出しの階層で区切る）。タブ名は区切りの見出しの `inline` のトークンを `state.md.renderer.renderInline` で HTML にしたもの（`**` の強調は `strong` のまま）を部品へ指定し、折り畳みの見出しの既定にはタブ名のタグを除いた文字を使用する。閉じの無い開きは、範囲の中に別のタブの開きを持たなければ文書の終わりまでを範囲にし、持てばその開きの場所に閉じの無い警告を 1 つ差し込み、文書の終わりまでのタブのマーカーをどれもタブにせず、見出しと中身をそのまま残す
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readTabsOptions]'
      - MOD-472-316#functions[renderTabs]
      - 'MOD-472-213#functions[pushWarning]'
      - '#functions[findTabsClose]'
    unit_tests:
      - name: test_build_tabs
        case: 正常
        summary: 見出しごとの中身に区切る
        condition: '`### macOS` と段落、`### Windows` と段落を囲んだ範囲'
        mock: なし
        expected: '`mdmark-tabs` の中に `mdmark-tab-title` が `macOS`・`Windows` の 2 つの中身があり、`<h3` が無い'
      - name: test_build_tabs_when_no_heading
        case: 正常
        summary: 見出しの無い範囲は警告と中身にする
        condition: 段落だけを囲んだ範囲
        mock: なし
        expected: 警告と段落があり、`mdmark-tabs` が無い
      - name: test_build_tabs_when_group
        case: 正常
        summary: group を部品に写す
        condition: '`<!-- tabs: {"group": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲'
        mock: なし
        expected: '`<div class="mdmark-tabs" data-group="os">` があり、記載の警告が無い'
      - name: test_build_tabs_when_unreadable_options
        case: 正常
        summary: 読み込めない指定は警告にしてタブにはする
        condition: '`<!-- tabs: {"group": "", "grop": "os"} -->` で `### macOS`・`### Windows` を囲んだ範囲'
        mock: なし
        expected: 範囲の前に `group`（1 文字以上）の記載の警告が 1 つあり、`env.warnings` に `grop` の `unknown_mark_arg` がある。`data-group` を持たない `mdmark-tabs` がある
      - name: test_build_tabs_when_collapsed
        case: 正常
        summary: closed のタブをタブ名の見出しの折り畳みに入れる
        condition: '`<!-- tabs: {"collapse": {"open": false}} -->` で `### uv`・`### pip` を囲んだ範囲'
        mock: なし
        expected: '`open` を持たない `<details class="mdmark-collapsible"><summary>タブ（uv・pip）</summary>` の中に `mdmark-tabs` があり、記載の警告が無い'
      - name: test_build_tabs_when_nested
        case: 正常
        summary: 入れ子のタブを外側の中身の中のタブにする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（入れ子のタブと強調したタブ名）」の文書
        mock: なし
        expected: 外側の `mdmark-tabs` の直下の `mdmark-tab-panel` が 2 つで、`macOS` の中身に `zsh`・`bash` の `mdmark-tabs` がある。記載の警告が無い
      - name: test_build_tabs_when_strong_title
        case: 正常
        summary: 見出しの強調をタブ名の strong に残す
        condition: '`### **Windows**` と `### macOS` を囲んだ範囲'
        mock: なし
        expected: '`<p class="mdmark-tab-title"><strong>Windows</strong></p>` があり、`**` が無い'
      - name: test_build_tabs_when_nested_unclosed
        case: 異常
        summary: 閉じの足りない入れ子は外側の開きに警告を配置し、タブにしない
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（閉じの足りない入れ子のタブ）」の文書
        mock: なし
        expected: 外側の開きの場所に記載の警告が 1 つあり、`mdmark-tabs` が無く、`<h3` の `macOS`・`Windows` と `<h4` の `zsh`・`bash` が残る
  - name: readTabsOptions
    title: タブのマーカーの指定を読み込む
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: タブのマーカーの設定（`validateMarkOptions` を経た値）から `group` を読み込み、`collapse` を `readCollapse` で読み込む
    args:
      - name: mark
        type: Mark
        required: true
        description: タブの開きのマーカー
    returns:
      type: '{ group?: string; collapse: "none" | "closed" | "open"; title?: string }'
      description: 組の名前と折り畳みの指定
    unit_tests:
      - name: test_read_tabs_options
        case: 正常
        summary: group を読み込む
        condition: '`<!-- tabs: {"group": "os"} -->`'
        mock: なし
        expected: '`group` が `os`、`collapse` が `none`'
      - name: test_read_tabs_options_when_none
        case: 正常
        summary: 引数が無ければ組も折り畳みも無い
        condition: '`<!-- tabs -->`'
        mock: なし
        expected: '`group` が無く、`collapse` が `none`'
      - name: test_read_tabs_options_when_collapse
        case: 正常
        summary: 折り畳みの指定を group と一緒に読み込む
        condition: '`<!-- tabs: {"group": "os", "collapse": {"open": true, "title": "入れ方"}} -->`'
        mock: なし
        expected: '`group` が `os`、`collapse` が `open`、`title` が `入れ方`'
    callees:
      - 'MOD-472-270#functions[readCollapse]'
  - name: findTabsClose
    title: タブの閉じを探す
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: '`openIndex` のタブのマーカーと同じ階層のタブの開きと閉じを数え、対応する閉じの位置を返却する。共通の `findClose` は使用しない（タブ以外のマーカーの閉じの対応を変えないため）'
    args:
      - name: tokens
        type: Token[]
        required: true
        description: トークンの並び
      - name: openIndex
        type: number
        required: true
        description: タブの開きのマーカーの位置
    returns:
      type: '{ close: number; nested: boolean }'
      description: '`close` は対応する閉じの位置（無ければ `-1`）、`nested` は範囲（閉じが無ければ文書の終わりまで）に別のタブの開きを持つか'
    unit_tests:
      - name: test_find_tabs_close
        case: 正常
        summary: 入れ子の閉じを飛ばして外側の閉じを返却する
        condition: 開き・開き・閉じ・閉じのタブのマーカーの並びで、1 つ目の開き
        mock: なし
        expected: '`close` が 4 つ目の位置、`nested` が `true`'
      - name: test_find_tabs_close_when_unclosed
        case: 異常
        summary: 閉じが足りなければ -1 を返却する
        condition: 開き・開き・閉じの並びで、1 つ目の開き
        mock: なし
        expected: '`close` が `-1`、`nested` が `true`'
    status: planned
    introduced:
      pr: 275
