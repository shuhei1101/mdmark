id: MOD-472-323
visibility: internal
title: ライブラリ本体 / 部品 / doc-list.ts
test_files:
  - tests/unit/src/parts/doc-list.test.ts
functions:
  - name: renderDocList
    title: 文書の一覧を描く
    container: src/parts/doc-list.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 部品設計『文書の一覧』の HTML を返却する。フォルダの無い文書を先に、フォルダごとに 1 階層の見出しでまとめ、`current` の行に `aria-current="page"` を付ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ docs: Array<{ path: string; title: string }>; current?: string }'
        required: true
        description: まとめた文書と開いている文書のパス
    returns:
      type: string
      description: '`<nav class="mdmark-doc-list" aria-label="文書の一覧">` で始まる HTML。各リンクは `href="#/{path}"` と `data-doc-path` を持つ'
    unit_tests:
      - name: test_render_doc_list
        case: 正常
        summary: フォルダの無い文書を先に、フォルダごとに最初に出た順でまとめる
        condition: '`docs` が `a/x.md`・`README.md`・`b/y.md`・`a/z.md`、`current` が `b/y.md`'
        mock: なし
        expected: まとまりが見出しなし（`README.md`）・`a`（`x.md`・`z.md`）・`b` の順で、`b/y.md` のリンクだけが `aria-current="page"` を持つ
      - name: test_render_doc_list_when_escaped
        case: 正常
        summary: タイトルとパスの HTML の特殊文字を替える
        condition: タイトルが `<b>&` の文書
        mock: なし
        expected: タイトルが `&lt;b&gt;&amp;` で出る
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    refs:
      - CMP-472-49#
    status: planned
    introduced:
      pr: 32
