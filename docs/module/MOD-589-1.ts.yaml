id: MOD-589-1
visibility: internal
title: ライブラリ本体 / map / 点検 / structure.ts
test_files:
  - tests/unit/src/map/structure.test.ts
lead: map の範囲の中身の型と、Mermaid と補足の中身を参照せずに範囲の構造（ブロックの数・図の種類・マーカーの引数）を確認する処理。`dist/index.js`・`dist/map.js` と CLI が使用する。
data_models:
  - name: MapRangeSource
    title: mapの範囲の中身
    container: src/map/structure.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 範囲のマーカーの引数・mermaid のブロック・補足とその数。行は範囲の開きのマーカーからの行
    properties:
      - name: args
        type: string
        description: 範囲の開きのマーカーの引数
      - name: mermaid
        type: string | undefined
        description: mermaid のコードブロックの中身（無いときは無い）
      - name: mermaidCount
        type: number
        description: 範囲の中の mermaid のコードブロックの数
      - name: data
        type: string | undefined
        description: 補足の中身（省略できる）
      - name: dataCount
        type: number
        description: 範囲の中の補足の数
      - name: mermaidLine
        type: number | undefined
        description: mermaid のブロックの中身の 1 行目の、範囲の開きのマーカーからの行（省略できる）
      - name: dataLine
        type: number | undefined
        description: 補足の YAML の 1 行目の、範囲の開きのマーカーからの行（省略できる）
enums:
  - name: MapKindName
    title: 描ける図の種類
    container: src/map/structure.ts
    usecase: Mermaidと補足で図を描く
    role: 型
    summary: map で描ける図の種類
    values:
      - value: flowchart
        title: 構成図
        description: Mermaid の 1 行目が `flowchart`・`graph`
      - value: sequenceDiagram
        title: シーケンス図
        description: Mermaid の 1 行目が `sequenceDiagram`
      - value: erDiagram
        title: ER 図
        description: Mermaid の 1 行目が `erDiagram`
      - value: stateDiagram
        title: 状態遷移図
        description: Mermaid の 1 行目が `stateDiagram-v2`・`stateDiagram`
      - value: classDiagram
        title: クラス図
        description: Mermaid の 1 行目が `classDiagram`・`classDiagram-v2`
      - value: architecture
        title: アーキテクチャ図
        description: Mermaid の 1 行目が `architecture-beta`
      - value: C4Context
        title: C4 図
        description: Mermaid の 1 行目が `C4Context`
      - value: mindmap
        title: マインドマップ
        description: Mermaid の 1 行目が `mindmap`
      - value: gantt
        title: ガントチャート
        description: Mermaid の 1 行目が `gantt`
      - value: timeline
        title: タイムライン
        description: Mermaid の 1 行目が `timeline`
      - value: gitGraph
        title: Git グラフ
        description: Mermaid の 1 行目が `gitGraph`
      - value: journey
        title: ジャーニー
        description: Mermaid の 1 行目が `journey`
      - value: block
        title: ブロック図
        description: Mermaid の 1 行目が `block-beta`
functions:
  - name: mapKindOf
    title: 図の種類を決める
    kind: 関数
    container: src/map/structure.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    scope: public
    summary: Mermaid の 1 行目の最初の単語から、描く図の種類を決める
    args:
      - name: mermaid
        type: string
        required: true
        description: mermaid のコードブロックの中身
    returns:
      type: MapKindName | undefined
      description: 図の種類。描けない種類のときは無い
    process: |-
      1. 先頭の空白を除いた最初の単語が `flowchart`・`graph` なら `flowchart`、`sequenceDiagram` なら `sequenceDiagram`、`erDiagram` なら `erDiagram`、`stateDiagram-v2`・`stateDiagram` なら `stateDiagram`、`classDiagram`・`classDiagram-v2` なら `classDiagram`、`architecture-beta` なら `architecture`、`C4Context` なら `C4Context`、`mindmap` なら `mindmap`、`gantt`・`timeline`・`gitGraph`・`journey` ならそのまま、`block-beta` なら `block` を返却する
      2. ほかは無しを返却する
  - name: collectMapStructure
    title: 範囲の形を確かめる
    kind: 関数
    container: src/map/structure.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    scope: public
    summary: 範囲の mermaid のブロックと補足の数・図の種類・マーカーの引数だけを確かめ、`MapProblem` を返す。Mermaid と補足の中身は読まない（`dist/index.js` に Mermaid と補足の読み取りを入れない）
    args:
      - name: range
        type: MapRangeSource
        required: true
        description: 範囲のマーカーの引数・mermaid のブロック・数
    returns:
      type: '{ problems: MapProblem[]; kind: MapKindName | undefined; args: ParsedMapArgs }'
      description: 項目・描く図の種類（描かないときは無い）・`parseMapArgs` の結果
    process: |-
      1. mermaid のブロックが 0 か 2 つ以上、補足が 2 つ以上なら `map_invalid` を 1 件返し、`kind` を無しにする
      2. `mapKindOf` で図の種類を決める。無ければ `map_invalid`（描ける種類の一覧を含む）にし、`kind` を無しにする（図の種類を決める）
      3. `parseMapArgs` の `problems` を合わせる
    callees:
      - '#functions[mapKindOf]'
      - MOD-472-140#functions[parseMapArgs]
    unit_tests:
      - name: test_collect_map_structure
        case: 正常
        summary: 形の正しい範囲
        condition: mermaid のブロック 1 つ（`flowchart LR`）・補足 1 つ・空の引数
        mock: なし
        expected: 項目が空で、`kind` が `flowchart`
      - name: test_collect_map_structure_when_er_and_state
        case: 正常
        summary: ER 図と状態遷移図
        condition: 1 行目が `erDiagram`・`stateDiagram-v2`・`stateDiagram` の範囲
        mock: なし
        expected: 項目が空で、`kind` が `erDiagram`・`stateDiagram`・`stateDiagram`
      - name: test_collect_map_structure_when_class_architecture_c4
        case: 正常
        summary: クラス図・アーキテクチャ図・C4 図
        condition: 1 行目が `classDiagram`・`architecture-beta`・`C4Context` の範囲と、`C4Container` の範囲
        mock: なし
        expected: 前の 3 つは項目が空で、`kind` が `classDiagram`・`architecture`・`C4Context`。`C4Container` は `map_invalid` が 1 件で `kind` が無い
      - name: test_collect_map_structure_when_two_blocks
        case: 異常
        summary: mermaid のブロックが 2 つ
        condition: '`mermaidCount: 2`'
        mock: なし
        expected: '`map_invalid` が 1 件で、`kind` が無い'
      - name: test_collect_map_structure_when_bad_args
        case: 異常
        summary: 読めない引数
        condition: '引数 `{title: 全体}`'
        mock: なし
        expected: '`map_invalid_value` が 1 件で、`kind` が `flowchart`'
      - name: test_collect_map_structure_when_mindmap
        case: 正常
        summary: マインドマップ
        condition: 1 行目が `mindmap` の範囲
        mock: なし
        expected: 項目が空で、`kind` が `mindmap`
      - name: test_collect_map_structure_when_axis_grid
        case: 正常
        summary: 軸と格子の配置の図
        condition: 1 行目が `gantt`・`timeline`・`gitGraph`・`journey`・`block-beta` の範囲
        mock: なし
        expected: 項目が空で、`kind` が `gantt`・`timeline`・`gitGraph`・`journey`・`block`
  - name: plainMapSourceOf
    title: 範囲の外のmapの図にするかを確かめる
    container: src/map/structure.ts
    kind: 関数
    scope: internal
    summary: mermaid のコードブロックのソースから、front matter（先頭の `---` で囲んだ行）と `%%` で始まるコメントの行を飛ばした最初の単語を `mapKindOf` で図の種類にし、範囲の外の map の図にする中身を返却する。front matter に `config` を持つか `%%{` で始まる行を持つとき、図の種類が map で描けないときは `undefined`
    description: タイトルは `splitMermaidTitle` の `title`（front matter の `title`、無ければ `accTitle` の値）。`body` は front matter を除いたソース、`frontMatter` は除いた front matter の行（`---` を含む。無ければ `undefined`）。`dist/index.js` の `render` と CLI が使用する
    args:
      - name: source
        type: string
        required: true
        description: mermaid のコードブロックのソース
    returns:
      type: '{ kind: MapKindName; body: string; frontMatter: string | undefined; title: string | undefined } | undefined'
      description: 範囲の外の map の図にする中身。しないときは `undefined`
    callees:
      - '#functions[mapKindOf]'
      - MOD-472-144#functions[splitMermaidTitle]
    refs:
      - IF-472-34#constraints[mermaid のコードブロック]
    unit_tests:
      - name: test_plain_map_source_of
        case: 正常
        summary: front matter とコメントの行を飛ばす
        condition: '`---\ntitle: 受付\n---\n%% メモ\nflowchart LR\n  A --> B`'
        mock: なし
        expected: '`kind` が `flowchart`、`title` が `受付`、`body` が `%% メモ` から始まり `---` を含まない、`frontMatter` が `---\ntitle: 受付\n---`'
      - name: test_plain_map_source_of_when_acc_title
        case: 正常
        summary: accTitle のタイトル
        condition: '`sequenceDiagram\n  accTitle: 注文\n  A->>B: 送る`'
        mock: なし
        expected: '`kind` が `sequenceDiagram`、`title` が `注文`、`frontMatter` が `undefined`'
      - name: test_plain_map_source_of_when_config
        case: 正常
        summary: 設定を持つと対象にしない
        condition: 'front matter に `config:` を持つ flowchart と、1 行目が `%%{init: {"theme": "forest"}}%%` の flowchart'
        mock: なし
        expected: どちらも `undefined`
      - name: test_plain_map_source_of_when_other_kind
        case: 正常
        summary: map が描けない種類
        condition: '`pie` と `xychart-beta` のソース'
        mock: なし
        expected: どちらも `undefined`
tags:
  - name: topic:map
    main: true
  - name: topic:図
