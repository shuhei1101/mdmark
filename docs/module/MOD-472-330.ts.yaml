id: MOD-472-330
visibility: internal
title: ライブラリ本体 / 部品 / media.ts
test_files:
  - tests/unit/src/parts/media.test.ts
functions:
  - name: renderMedia
    title: 動画と音声を描く
    container: src/parts/media.ts
    kind: 関数
    scope: internal
    summary: 部品設計『動画と音声』の HTML を返却する。`video`・`audio` に `controls`・`preload="metadata"`・`aria-label`（`alt`）を付け、`video` には `playsinline` も付ける。`autoplay` のときは `muted` も付ける。`poster` を指定したときは `video` の `poster` と、印刷用の `img.mdmark-media-print`（`alt=""`）を配置する
    args:
      - name: options
        type: '{ kind: "video" | "audio"; src: string; alt: string; caption?: string; width?: string; poster?: string; autoplay?: boolean; muted?: boolean; loop?: boolean }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<figure class="mdmark-figure mdmark-media"` で始まる HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    refs:
      - CMP-472-36#
    unit_tests:
      - name: test_render_media
        case: 正常
        summary: 動画に再生バーと印刷用の画像を付ける
        condition: 部品設計の `Video`
        mock: なし
        expected: '`video` が `controls`・`preload="metadata"`・`playsinline`・`aria-label`・`poster` を持ち、`img.mdmark-media-print` の `alt` が空'
      - name: test_render_media_when_autoplay
        case: 正常
        summary: 自動で再生するなら muted を付ける
        condition: 部品設計の `VideoAutoplay`
        mock: なし
        expected: '`video` が `autoplay`・`muted`・`loop` を持ち、`figure` の `style` が `--mdmark-image-width: 320px`'
      - name: test_render_media_when_audio
        case: 正常
        summary: 音声は playsinline を持たない
        condition: 部品設計の `Audio`
        mock: なし
        expected: '`audio` が `controls` を持ち、`playsinline` と `img.mdmark-media-print` を持たない'
    status: planned
    introduced:
      pr: 263
