id: MOD-472-30
visibility: internal
title: ライブラリ本体 / バージョンを上げる
lead: '`mdmark upgrade` の処理。バージョンの読み取りと比較、移行の手順の読み取り・検め・適用、コピーと戻し、変更履歴の行の抽き出し、標準入力での質問を持ち、`runUpgrade` がこれらと CLI の点検をつなぐ。'
directory: |-
  ```tree
  src/cli/
  ├── versions.ts    # バージョンの書式・比較・呼んだ CLI のバージョン
  ├── migrations.ts  # 移行の手順の読み取り・構造の検め・適用
  ├── backup.ts      # 適用する前のコピーとコピーからの戻し
  ├── changelog.ts   # 変更履歴の表から範囲の行を抽き出す
  ├── prompt.ts      # 標準入力の 1 行を回答にする質問
  └── upgrade.ts     # mdmark upgrade
  schemas/
  └── mdmark.steps.schema.json  # steps.yaml の JSON Schema
  migrations/
  ├── v{バージョン}/        # 出したバージョンの steps.yaml とスクリプト
  ├── next/          # 出していないバージョンの steps.yaml とスクリプト
  │   ├── steps.yaml
  │   └── marker-json.mjs  # 文書のマーカーの今の書き方の引数を JSON のオブジェクトへ書き換える
  └── no-steps.yaml  # 移行の手順が要らないスキーマの変更の一覧
  ```
