id: MOD-472-132
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / band.ts
test_files:
  - tests/unit/src/map/band.browser.test.ts
data_models:
  - name: BandStep
    title: 帯の手順
    container: src/map/band.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachBand` が進める 1 つの手順'
    properties:
      - name: title
        type: string
        description: 帯のタイトル
      - name: text
        type: string
        description: 説明の文
      - name: nodes
        type: string[]
        description: 強調するノードか参加者
      - name: wires
        type: string[]
        description: データの印を流す線
      - name: enter
        type: string | undefined
        description: その手順で中へ入るグループ
  - name: BandHandle
    title: 帯の操作の口
    container: src/map/band.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachBand` の戻り値'
    properties:
      - name: stop
        type: () => void
        description: 強調を解いて始める前に戻す
      - name: update
        type: '(steps: BandStep[]) => void'
        description: 進める手順を差し替え、始める前の状態に戻す（強調は当て直さない）
      - name: destroy
        type: () => void
        description: 時計と操作を外す
  - name: FollowHandle
    title: 表示する枠のスクロールの操作の口
    container: src/map/band.ts
    usecase: 図を巡回する
    role: データモデル
    summary: '`createFollow` の戻り値'
    properties:
      - name: reveal
        type: '(ids: string[]) => void'
        description: ノードか参加者を囲む矩形と `FOCUS_MARGIN_PX` の余白が表示する枠に収まる倍率と位置へ、`zoomControlOf` の `focusRect` で図を移す（読者が触った後は `resume` まで何もしない）
      - name: resume
        type: () => void
        description: 読者が触って止めた移動を再開する
      - name: destroy
        type: () => void
        description: 表示する枠のイベントを外す
constants:
  - name: STEP_MS
    title: 手順の 1 周の時間
    container: src/map/band.ts
    usecase: 図を巡回する
    summary: 手順を繰り返すときの 1 周の時間（ミリ秒）。今の区切りをこの時間で塗り、塗り終えたら最初から塗り直す
    value: '2000'
  - name: BAND_DENSE_PX
    title: 細い区切りの幅
    container: src/map/band.ts
    usecase: 図を巡回する
    summary: 区切りの幅がこの px より細いとき、手順のバーに `is-dense` を付けて今の区切りを広げる
    value: '12'
  - name: FOCUS_MARGIN_PX
    title: 手順へ移すときの余白
    container: src/map/band.ts
    usecase: 図を巡回する
    summary: 強調するノードを囲む矩形の周りに残す、表示する枠の中の余白（px）
    value: '32'
  - name: FOCUS_MS
    title: 手順へ移す時間
    container: src/map/band.ts
    usecase: 図を巡回する
    summary: 強調するノードへ図の倍率と位置を移す時間（ミリ秒）。動きを減らす設定では 0
    value: '300'
functions:
  - name: attachBand
    title: 案内と再生を進める
    kind: 関数
    container: src/map/band.ts
    usecase: 図を巡回する
    role: 処理
    summary: 図の枠の下に案内の帯を配置し、区切り・左右の矢印のボタン・キーで選んだ手順を停止するまで繰り返し、帯のバーと矢印のボタンの外・図の枠の空いた場所・Esc で停止する
    scope: public
    args:
      - name: options
        type: '{ figure: HTMLElement; mode: "walkthrough" | "playback"; unit?: "message" | "transition" | "task" | "period" | "commit"; steps: BandStep[]; apply: (step: BandStep | undefined) => void; onStep?: (step: BandStep, index: number) => void }'
        required: true
        description: 図の枠・モード・再生で進める単位（既定 `message`。`renderMapBand` の `unit` に渡す）・手順・強調を当てる関数・手順へ移ったときに呼ぶ関数（図の移動に使う）
    returns:
      type: BandHandle
      description: 止める関数と片付ける関数
    process: |-
      1. `renderMapBand`（`titles` は手順の `title`）で帯を描き、手順のバーの幅を `ResizeObserver` で見て、区切りの幅（バーの幅から区切りの間を引いて手順の数で割った幅）が `BAND_DENSE_PX` より細いときだけバーに `is-dense` を付ける
      2. 区切りの押下・左右の矢印のボタン・バーの ← → Home End で手順へ移る（矢印のボタンと ← → は端で反対の端へ回し、始める前の左は最後、右は最初）。移ったら `apply` で強調を当てて `onStep` を呼び、`requestAnimationFrame` で今の区切りを `STEP_MS` の 1 周で塗り、塗り終えたら最初から塗り直す（次の手順へは進めない）。今の手順の区切りを押したときは、塗りを最初からにして `apply` を呼び直す
      3. 描き直す前にフォーカスが帯の中にあれば、矢印のボタンなら同じ向きのボタンへ、それ以外ならバーへ、描き直した後にフォーカスを戻す
      4. 帯の中のバーと矢印のボタンの外の押下・バーの Esc・図の枠の表示する枠の中でノード（`[data-node]`・`[data-participant]`）・線の押せる帯（`.map-wire-hit`）・ボタン・リンクの外を押して `DRAG_THRESHOLD` 以下の動きで離したときに停止する。停止で塗りを止め、`apply(undefined)` を呼び、始めた段に戻して帯をバーと矢印のボタンだけにする
      5. `update` で手順を差し替えたときは、塗りを止めて番号を無しに戻す（`apply` は呼ばない）
    unit_tests:
      - name: test_attach_band_when_segment
        case: 正常
        summary: 区切りで手順へ移る
        condition: 4 手順で 3 つ目の区切りを押す
        mock: '`apply`・`onStep`'
        expected: '`apply` と `onStep` に手順 2 が 1 回ずつ渡り、バーの `aria-valuenow` が 3、帯が `is-idle` を持たない'
      - name: test_attach_band_when_loop
        case: 正常
        summary: 手順を繰り返す
        condition: 3 つ目の区切りを押し、時計を `STEP_MS` の 1.5 倍進める
        mock: '`requestAnimationFrame`・時計'
        expected: '`apply` が手順 2 の 1 回だけで、今の区切りの塗りが 50%'
      - name: test_attach_band_when_repressed
        case: 正常
        summary: 同じ区切りをもう一度押す
        condition: 3 つ目の区切りを押し、時計を `STEP_MS` の半分進めてから、同じ区切りを押す
        mock: '`requestAnimationFrame`・時計・`apply`'
        expected: '`apply` に手順 2 が 2 回渡り、塗りが 0% に戻る'
      - name: test_attach_band_when_arrows
        case: 正常
        summary: 左右の矢印のボタン
        condition: 4 手順で、始める前に左の矢印のボタンを押し、次に右の矢印のボタンを押す
        mock: '`apply`'
        expected: '`apply` に手順 3・0 が渡り、描き直した後もフォーカスが右の矢印のボタンにある'
      - name: test_attach_band_when_keys
        case: 正常
        summary: バーのキー
        condition: バーにフォーカスして → を 2 回、Home、Esc を押す
        mock: '`apply`'
        expected: '`apply` に手順 0・1・0 と `undefined` が渡り、描き直した後もフォーカスがバーにある'
      - name: test_attach_band_when_stopped_outside
        case: 正常
        summary: バーの外と図の枠の空いた場所で停止する
        condition: 手順を始めて、帯のタイトルを押す。もう一度始めて、図の枠の空いた場所で 2px 動かして離す。もう一度始めて、空いた場所で 10px 動かして離し、ノードの上で押して離す
        mock: '`apply`'
        expected: タイトルと 2px の後に `apply(undefined)` を呼び、10px とノードの上では呼ばない
      - name: test_attach_band_when_update
        case: 正常
        summary: 手順の差し替え
        condition: 4 手順で 2 つ目の区切りを押してから、2 手順に `update` する
        mock: '`apply`'
        expected: 区切りが 2 つでバーの `aria-valuenow` が 0、`update` で `apply` を呼ばない
      - name: test_attach_band_when_dense
        case: 正常
        summary: 細い区切り
        condition: 40 手順の帯を、幅 390px と幅 1280px の図の枠で描く
        mock: なし
        expected: 幅 390px ではバーが `is-dense` を持ち、幅 1280px では持たない
  - name: createFollow
    title: 表示する枠をノードへスクロールする
    kind: 関数
    container: src/map/band.ts
    usecase: 図を巡回する
    role: 処理
    summary: 図の枠の中を、指定したノードか参加者を囲む矩形が収まる倍率と位置へ移し、読者が表示する枠を触ったら `resume` まで止める
    scope: public
    args:
      - name: figure
        type: HTMLElement
        required: true
        description: 図の枠
      - name: reducedMotion
        type: boolean
        required: true
        description: 動きを減らす設定（`true` なら時間をかけずに移す）
    returns:
      type: FollowHandle
      description: 移す関数・再開する関数・片付ける関数
    process: |-
      1. `reveal` は、指定した ID の `[data-node]`・`[data-participant]`（シーケンス図の線は `.map-wire-hit[data-message]`）を囲む矩形を、倍率を掛ける前の中身の座標で求め、表示する枠の `zoomControlOf` の `focusRect`（余白 `FOCUS_MARGIN_PX`、時間は `reducedMotion` なら 0、そうでなければ `FOCUS_MS`）を呼ぶ
      2. 読者が表示する枠でホイール・`pointerdown`・キー・タッチをしたら、`resume` まで `reveal` で移さない
    unit_tests:
      - name: test_create_follow_when_touched
        case: 正常
        summary: 読者が触る
        condition: '`reveal` を呼び、表示する枠でホイールを回して `reveal`、`resume` の後に `reveal` を呼ぶ'
        mock: '`zoomControlOf` が返す `focusRect`'
        expected: '`focusRect` を 1 回目と 3 回目だけ呼ぶ'
      - name: test_create_follow_when_reduced_motion
        case: 正常
        summary: 動きを減らす設定
        condition: '`reducedMotion: true` で 2 つのノードの `reveal` を呼ぶ'
        mock: '`focusRect`'
        expected: '`focusRect` に 2 つのノードを囲む矩形と、余白 32・時間 0 が渡る'
    callees:
      - MOD-472-177#functions[zoomControlOf]
lead: '案内と再生のバーの手順の選び方と繰り返し・停止と、手順へ図を移す処理を受け持ち、案内と再生のバーの操作を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
