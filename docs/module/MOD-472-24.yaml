notes:
  配布ファイルの分け方: '`src/map/index.ts` は別の esbuild の入口で、`dist/map.js` にまとめる（`dist/index.js` を `import` しない）。`dist/index.js` はコアルール・`spec.ts`・`check.ts` の `collectMapStructure` だけを持ち、Mermaid と補足の読み取り・配置・描画・操作を持たない（配布ファイル 1 つのサイズの上限のため）。Mermaid と補足の中身の書き方の警告は `dist/map.js` が `mount` の後に足す。`mount` は `attachParts` が `div.mdmark-map` を見つけたときだけ `loadPartModule("map")` で読み込む。部品の CSS は `src/index.css` に入れる'
  配置の方式: 計画書の `## PoC 結果` の方式（内側からの配置・段と重心の掃引・格子の A* の線の経路）。PoC の `poc/map/layout.ts` を元にする
