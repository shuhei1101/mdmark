notes:
  配布ファイルの分け方: '`src/map/index.ts` は別の esbuild の入口で、`dist/map.js` にまとめる（`dist/index.js` を `import` しない）。`dist/index.js` はコアルール・`spec.ts`・`check.ts` の `collectMapStructure` だけを持ち、Mermaid と補足の読み取り・配置・描画・操作を持たない（配布ファイル 1 つのサイズの上限のため）。Mermaid と補足の中身の書き方の警告は `dist/map.js` が `mount` の後に足す。`mount` は `attachParts` が `div.mdmark-map` を見つけたときだけ `loadPartModule("map")` で読み込む。部品の CSS は `src/index.css` に入れる'
  配置の方式: 計画書の `## PoC 結果` の方式（内側からの配置・段と重心の掃引・格子の A* の線の経路）。PoC の `poc/map/layout.ts` を元にする
  ディレクトリ: |-
    ```tree
    src/
    └── map/
        ├── map.syntax.ts      # map のマーカーの範囲を div.mdmark-map にするコアルール（dist/index.js）
        ├── spec.ts            # 設定の map と補足の型・既定・検査（dist/index.js と CLI）
        ├── structure.ts       # 範囲の mermaid のブロックと補足の数・図の種類・マーカーの引数の確認（dist/index.js・dist/map.js と CLI）
        ├── flowchart.ts       # flowchart の読み取りと click のリンク先の確認（dist/map.js と CLI）
        ├── sequence.ts        # sequenceDiagram の読み取り（dist/map.js と CLI）
        ├── er.ts              # erDiagram の読み取りと構成図の入力への読み替え・経路（dist/map.js と CLI）
        ├── state-diagram.ts   # stateDiagram-v2 の読み取りと構成図の入力への読み替え（dist/map.js と CLI）
        ├── class-diagram.ts   # classDiagram の読み取りと構成図の入力への読み替え（dist/map.js と CLI）
        ├── architecture.ts    # architecture-beta の読み取りと構成図の入力への読み替え（dist/map.js と CLI）
        ├── c4.ts              # C4Context の読み取りと構成図の入力への読み替え（dist/map.js と CLI）
        ├── mindmap.ts         # mindmap の読み取りと、補足のキーが指す項目の解決（dist/map.js と CLI）
        ├── axis-grid.ts       # gantt・timeline・gitGraph・journey・block-beta の読み取りと、補足のキーが指す項目の解決（dist/map.js と CLI）
        ├── data.ts            # 補足の JSON の読み取り（dist/map.js と CLI）
        ├── check.ts           # 書き方の誤りの項目を集める（dist/index.js・dist/map.js と CLI）
        ├── lucide-names.ts    # 点検が照らす lucide のアイコンの名前（点検で呼んだときだけ作る）
        ├── layout.ts          # 入れ子の自動配置と線の経路（dist/map.js と CLI）
        ├── sequence-rows.ts   # シーケンス図の表示する行（dist/map.js）
        ├── mindmap-layout.ts  # マインドマップの木の配置と枝の色（dist/map.js）
        ├── axis-grid-layout.ts # 軸に沿った配置と格子の配置（dist/map.js）
        ├── state.ts           # sessionStorage とクエリ文字列の状態（dist/map.js）
        ├── flow-view.ts       # 構成図を描いて操作を付ける（dist/map.js）
        ├── sequence-view.ts   # シーケンス図を描いて操作を付ける（dist/map.js）
        ├── er-view.ts         # ER 図を構成図の上に描いて固有の操作を足す（dist/map.js）
        ├── state-view.ts      # 状態遷移図を構成図の上に描いて固有の操作を足す（dist/map.js）
        ├── class-view.ts      # クラス図を構成図の上に描いて固有の操作を足す（dist/map.js）
        ├── architecture-view.ts # アーキテクチャ図を構成図の上に描いて固有の操作を足す（dist/map.js）
        ├── c4-view.ts         # C4 図を構成図の上に描いて固有の操作を足す（dist/map.js）
        ├── mindmap-view.ts    # マインドマップを木の配置で描いて操作を付ける（dist/map.js）
        ├── axis-grid-view.ts  # 軸と格子の配置の図を描いて操作を付ける（dist/map.js）
        ├── drag.ts            # ノード・グループ・線の区間のドラッグ（dist/map.js）
        ├── band.ts            # 案内と再生の進め方（dist/map.js）
        ├── index.ts           # dist/map.js の入口。attachMap
        ├── convert.ts         # 廃止した flow・sequence の範囲を map の範囲へ書き換える（移行の手順のスクリプトがまとめて読み込む）
        ├── map.part.ts        # 部品『mapの構成図』『mapのシーケンス図』『mapのER図』『mapの状態遷移図』『mapのクラス図』『mapのアーキテクチャ図』『mapのC4図』『mapのマインドマップ』『mapの軸と格子の配置の図』『案内の帯』の HTML（dist/map.js）
        └── {部品}.part.stories.ts # 部品設計の states ごとのストーリー
    ```
