id: MOD-472-222
visibility: internal
title: ライブラリ本体 / 操作 / sections.ts
test_files:
  - tests/unit/src/interact/sections.browser.test.ts
constants:
  - name: sectionSetters
    title: セクションの開閉の関数の記録
    container: src/interact/sections.ts
    summary: '`attachSections` が操作を付けたセクションの中身（`mdmark-section-body`）から、そのセクションを開くか閉じる関数を参照する。`revealTarget`・`foldAllSections` と Shift での入れ子の開閉が使用し、削除する関数が取り除く'
    value: 'new WeakMap<HTMLElement, (open: boolean) => void>()'
    status: planned
    introduced:
      pr: 166
functions:
  - name: attachSections
    title: セクションと行の詳細に開閉を付ける
    container: src/interact/sections.ts
    kind: 関数
    scope: internal
    summary: '`sections` がオンならセクションの見出し（h1〜h4）を開閉のボタンにして `data-section="closed"` の中身を `hidden="until-found"` にし、`row-details` がオンなら詳細を持つ行に開閉のボタンを配置して詳細の行を閉じる。見出しが差分のブロック（`div.mdmark-diff-block`）の中にあるときは、そのブロックの次の兄弟の `mdmark-section-body` をセクションの中身にする。セクションの開閉の関数を `sectionSetters` に記録する。`states` を指定したときは、`states` に中身の `id` があり `data-section` が記録した `marker` と同じセクションを記録の開閉で始め、それ以外をマーカーのとおりの開閉で始める。開閉の関数と `beforematch` で開閉が変わるたびに、中身の `id` で開閉と `data-section` を `states` に書く。Shift を押しながら開閉のボタンを押したとき（`click` の `shiftKey`）と、ボタンで Shift を押しながら Enter・Space を押したとき（`keydown` の `shiftKey`。既定の動きを止め、`click` を発生させない）は、そのセクションを今と逆の状態にし、中の入れ子の全てのセクション（中身の中の `mdmark-section-body`）を同じ状態にする。URL の `#ID`（`rowIdFromHash` で読み込む。まとめた HTML の `#/{文書のパス}#{ID}` も同じ）が指す要素があるとき（`revealHash` が `true` のときの付けたときと、`hashchange`）は `revealTarget` を呼び、`beforematch` でそのセクションを開く'
    args:
      - name: options
        type: '{ root: HTMLElement; sections: boolean; rowDetails: boolean; states?: SectionStates; revealHash?: boolean }'
        required: true
        description: 描いた要素と、セクション・行の詳細の機能と、セクションの開閉の記録（省くと記録しない）と、付けたときに URL の `#ID` で開くか（既定 `true`）
    returns:
      type: () => void
      description: ボタン・`hashchange` の受け取りを解除する関数
    side_effects: セクション・行の DOM を書き換え、`window` の `hashchange` を受け取る
    callees:
      - MOD-472-320#functions[renderSection]
      - MOD-472-321#functions[renderRowDetail]
      - 'MOD-472-229#functions[visibleText]'
      - 'MOD-472-220#functions[revealTabTarget]'
    unit_tests:
      - name: test_attach_sections
        case: 正常
        summary: 閉じたセクションを閉じ、押すと開く
        condition: '`data-section="closed"` のセクションと開いたセクション'
        mock: なし
        expected: 閉じたセクションの中身が `hidden="until-found"`、押した後に `hidden` が無く `aria-expanded="true"`
      - name: test_attach_sections_when_hash
        case: 正常
        summary: 閉じたセクションの中の ID への hashchange で開く
        condition: 閉じたセクションの中の `### 注意`、`location.hash` を `#注意`
        mock: なし
        expected: セクションの中身が `hidden` を持たない
      - name: test_attach_sections_when_row_detail
        case: 正常
        summary: 行の詳細を閉じ、押すと開く
        condition: 2 行目に詳細を持つ表
        mock: なし
        expected: ボタンは 2 行目にだけあり、押した後に詳細の行が `hidden` を持たない
      - name: test_attach_sections_when_row_has_term
        case: 正常
        summary: 行の詳細の開閉ボタンの名前にツールチップの文字を含めない
        condition: 行の詳細を持つ表で、持ち主の行の 1 列目に用語 `マーカー` の下線がある
        mock: なし
        expected: 開閉ボタンのスクリーンリーダー向けの名前に `マーカー` が入り、ツールチップの意味の文字が入らない
      - name: test_attach_sections_when_bundle_hash
        case: 正常
        summary: 'まとめた HTML の # の構造でも閉じたセクションを開く'
        condition: 閉じたセクションの中の `### 注意`、`location.hash` を `#/a.md#%E6%B3%A8%E6%84%8F`
        mock: なし
        expected: セクションの中身が `hidden` を持たない
      - name: test_attach_sections_when_hash_in_tab
        case: 正常
        summary: 選ばれていないタブの中の ID への hashchange でそのタブを選ぶ
        condition: '`attachTabs` を付けた `macOS`・`Windows` のタブの `Windows` の中身にある閉じたセクションの中の `### 注意`、`location.hash` を `#注意`'
        mock: なし
        expected: '`Windows` が `aria-selected="true"` で、セクションの中身が `hidden` を持たない'
      - name: test_attach_sections_when_h1
        case: 正常
        summary: H1 のセクションも開閉する
        condition: '`# 手引き`・段落・`## 概要`・段落を `render` で描いた要素に付け、`手引き` の開閉のボタンを押す'
        mock: なし
        expected: '`手引き` のボタンが `aria-expanded="false"` で `section-手引き` が `hidden="until-found"`、`概要` の見出しも隠れる'
      - name: test_attach_sections_when_shift_click
        case: 正常
        summary: Shift を押しながら押すと、そのセクションと入れ子のセクションを同じ状態にし、外のセクションは変えない
        condition: '`## A`（中に `### B`、その中に閉じた `#### C`）と `## D` のセクションで、`A` のボタンを `shiftKey: true` の `click` で押し、もう一度押す'
        mock: なし
        expected: 1 回目の後は `A`・`B`・`C` のボタンが `aria-expanded="false"`、2 回目の後は 3 つとも `true` で `C` の中身が `hidden` を持たない。`D` はどちらも `true`
      - name: test_attach_sections_when_shift_key
        case: 正常
        summary: Shift を押しながら Enter・Space を押しても入れ子をまとめて開閉し、click を発生させない
        condition: '`test_attach_sections_when_shift_click` のセクションで、`A` のボタンに `shiftKey: true` の Enter の `keydown` を送信し、続けて Space の `keydown` を送信する'
        mock: ボタンの `click` を数える関数を付ける
        expected: Enter の後は `A`・`B`・`C` が閉じ、Space の後は 3 つとも開く。`keydown` の `defaultPrevented` が `true` で、`click` は 0 回
      - name: test_attach_sections_when_detached
        case: 正常
        summary: 削除するとセクションの開閉の関数の記録から取り除く
        condition: セクションを付けて削除し、`foldAllSections` で閉じる
        mock: なし
        expected: 中身が `hidden` を持たないまま
      - name: test_attach_sections_when_diff_block
        case: 正常
        summary: 差分のブロックに包まれた見出しのセクションも開閉する
        condition: '`## 新しいセクション`・段落を描き、`h2` を `renderDiffBlock({ kind: "add", unit: "block" })` の `div` で包んだ要素に付け、`新しいセクション` の開閉のボタンを押す'
        mock: なし
        expected: '`h2` が `.mdmark-section-toggle` を持ち、押した後にボタンが `aria-expanded="false"` で、`div` の次の `mdmark-section-body` が `hidden="until-found"`'
      - name: test_attach_sections_when_states
        case: 正常
        summary: 記録した開閉で始める
        condition: '`data-section="closed"` の `## A` と開いた `## B` に空の `states` を指定して付け、`A` を開いて `B` を閉じてから削除し、同じ HTML を描き直した要素に同じ `states` でもう一度付ける'
        mock: なし
        expected: '2 回目に付けた後、`A` の中身が `hidden` を持たずボタンが `aria-expanded="true"`、`B` の中身が `hidden="until-found"`。`states` の `section-A` が `{ open: true, marker: "closed" }`'
      - name: test_attach_sections_when_marker_changed
        case: 正常
        summary: '`data-section` が記録したときと違うセクションはマーカーのとおりに始める'
        condition: '`states` に `section-A` を `{ open: true, marker: "open" }` で入れ、`data-section="closed"` の `## A` に付ける'
        mock: なし
        expected: '`A` の中身が `hidden="until-found"` でボタンが `aria-expanded="false"`'
      - name: test_attach_sections_when_beforematch
        case: 正常
        summary: ページ内検索で開いたセクションを記録する
        condition: '`data-section="closed"` の `## A` に空の `states` を指定して付け、中身に `beforematch` を発生させる'
        mock: なし
        expected: '`states` の `section-A` が `{ open: true, marker: "closed" }`'
      - name: test_attach_sections_when_reveal_hash_off
        case: 正常
        summary: '`revealHash` が `false` なら付けたときに `#ID` で開かず、`hashchange` では開く'
        condition: '閉じた `## A` の中の `### 注意`、`location.hash` を `#注意` にして `revealHash: false` で付け、続けて `hashchange` を発生させる'
        mock: なし
        expected: 付けた直後は `A` の中身が `hidden="until-found"`、`hashchange` の後は `hidden` を持たない
    refs:
      - 'MOD-472-218#functions[rowIdFromHash]'
  - name: openEnclosing
    title: 要素を囲む閉じたものを開く
    container: src/interact/sections.ts
    summary: 要素を囲む閉じたセクションを外側から `sectionSetters` の関数で開き、選ばれていないタブの中なら `revealTabTarget` でそのタブを選び、閉じた行の詳細の中なら、その行の `mdmark-row-toggle` を押した状態にして詳細の行を出す。スクロールしない。`focusComment` でマーカーへ移るときに使用する
    kind: 関数
    scope: internal
    side_effects: セクションの中身の `hidden`・タブの選択・行の詳細の `hidden` と開閉のボタンの `aria-expanded` を書き換える
    args:
      - name: target
        type: HTMLElement
        required: true
        description: 開いて見せる要素
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_open_enclosing
        case: 正常
        summary: 閉じたセクションと閉じた行の詳細を開き、スクロールしない
        condition: 閉じた `## A` の中の表の、閉じた行の詳細の中の段落を指定する
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`A` の中身と詳細の行が `hidden` を持たず、セクションの見出しのボタンと行の開閉のボタンが `aria-expanded="true"`。`scrollIntoView` は呼ばれない'
    refs:
      - IF-472-35#constraints[コメントの箇所へ移る]
    status: planned
    introduced:
      pr: 280
  - name: revealTarget
    title: 要素へ移る
    container: src/interact/sections.ts
    summary: 要素を囲む閉じたセクションを外側から `sectionSetters` の関数で開き、要素がセクションの見出し（`sectionSetters` に記録した見出しの要素）なら、続けて見出し自身の閉じたセクションも開く。選ばれていないタブの中なら `revealTabTarget` でそのタブを選び、表の行（`tr`）でなければ `scrollIntoView` する。URL の `#ID` で移るときと右側の目次の項目で移るときに使用する
    kind: 関数
    scope: internal
    side_effects: セクションの中身の `hidden`・タブの選択を書き換え、スクロールする
    args:
      - name: target
        type: HTMLElement
        required: true
        description: 移る先の要素
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_reveal_target
        case: 正常
        summary: 入れ子の閉じたセクションを外側から開いて移る
        condition: 閉じた `## A` の中の閉じた `### B` の中の `#### C` を指定する
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`A`・`B` の中身が `hidden` を持たず、ボタンが `aria-expanded="true"`。`C` で `scrollIntoView` が 1 回呼ばれる'
      - name: test_reveal_target_when_row
        case: 正常
        summary: 表の行へはスクロールしない
        condition: 閉じたセクションの中の表の `tr` を指定する
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: セクションが開き、`scrollIntoView` は呼ばれない
      - name: test_reveal_target_when_heading
        case: 正常
        summary: 見出しを指定すると、囲むセクションに加えて見出し自身の閉じたセクションも開く
        condition: 閉じた `## A` の中の閉じた `### B` の見出しを指定し、続けて閉じたセクションの中の段落を指定する
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: 見出しを指定した後、`A`・`B` の中身が `hidden` を持たず、2 つのボタンが `aria-expanded="true"`。段落を指定したときは、段落を囲むセクションだけが開き、段落の後ろの見出しのセクションは開かない
    status: planned
    introduced:
      pr: 166
  - name: foldAllSections
    title: すべてのセクションを開閉する
    container: src/interact/sections.ts
    summary: '`root` の中の `sectionSetters` に記録した全てのセクションを、`open` が `true` なら開く。`false` なら、見出しが `h1` のセクションを開き、h2〜h4 のセクションを閉じる'
    kind: 関数
    scope: internal
    side_effects: セクションの中身の `hidden` と開閉のボタンの `aria-expanded` を書き換える
    args:
      - name: options
        type: '{ root: HTMLElement; open: boolean }'
        required: true
        description: 描いた本文と、開くか
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_fold_all_sections
        case: 正常
        summary: すべて展開は全てを開き、すべて折りたたむは H1 だけ開く
        condition: '`# 手引き` の中に `## 導入`（中に閉じた `### 注意`）と `## 付録`。`open: true` で呼び、次に `open: false` で呼ぶ'
        mock: なし
        expected: 1 回目の後は全てのボタンが `aria-expanded="true"`。2 回目の後は `手引き` だけが `true` で、`導入`・`注意`・`付録` は `false`
    status: planned
    introduced:
      pr: 166
data_models:
  - name: SectionStates
    title: セクションの開閉の記録
    container: src/interact/sections.ts
    usecase: 利用側のページが文書を描く
    summary: '読者が開閉したセクションの開閉を、セクションの中身の `id`（`section-{見出しの ID}`）から引く `Map<string, { open: boolean; marker: string }>`。`mount` ごとに 1 つ作り、`attachSections` が読み書きする'
    properties:
      - name: open
        type: boolean
        description: セクションが開いているか
      - name: marker
        type: string
        description: 記録したときの中身の `data-section` の値（`open`・`closed`）
    status: planned
    introduced:
      pr: 497
