id: MOD-472-121
visibility: internal
title: ライブラリ本体 / CLI / build.ts
test_files:
  - tests/unit/src/cli/build.test.ts
functions:
  - name: runBuild
    title: 複数の文書を 1 枚にまとめる
    container: src/cli/build.ts
    usecase: 複数の文書を1枚のHTMLにまとめる
    summary: '`build` の対象の文書を `kind: bundle` の中身にして `build.out` に HTML を書き込み、警告と `書き出した: {build.out}（文書 {件数} 件）` を出す'
    description: 警告には `prepareEmbeds` のものに、`findOutsideLinks` のリンク、`build.glossary` と `build.entry` がまとめる文書に該当しないことを追加する。`build.glossary` の文書は、索引が無いときもその用語集の表を全ての文書で有効にしるため、索引の `docs` に無ければ追加してから `collectReferences` を呼ぶ
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`build.out` に HTML を書き込む'
    args:
      - name: options
        type: '{ config?: string; distDir: string; keepTraces?: boolean }'
        required: true
        description: '`--config`・`dist/` の場所・`--keep-traces`'
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
    returns:
      type: Promise<0>
      description: 書き出したら 0
    exceptions:
      - name: CliError
        condition: 設定の誤り・`build` が無い・対象が 0 件・出力先へ書き込めない
        message: 'build が無い: 設定に build がありません。build.include と build.out を記載してください。／0 件: build.include に該当する文書がありません。build.include を修正してください。'
    unit_tests:
      - name: test_run_build
        case: 正常
        summary: 3 つの文書をまとめて build.out に記載する
        condition: '`include: ["**/*.md"]` が 3 つに該当する'
        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: '0 を返却し、標準出力が `書き出した: dist/docs.html（文書 3 件）`、中身の `docs` が 3 件'
      - name: test_run_build_when_link_outside_bundle
        case: 正常
        summary: 1 枚に含まれない文書へのリンクを警告に出す
        condition: '`README.md` が exclude した `下書き/メモ.md` へリンクする'
        mock: 一時フォルダ
        expected: '標準エラーに `警告: README.md:` で始まり `下書き/メモ.md` を含む行がある'
      - name: test_run_build_when_glossary_without_index
        case: 正常
        summary: 索引が無くても build.glossary の用語を参照の表に入れる
        condition: '`index` 無し、`glossary: ["用語集.md"]` の用語集の表に `マーカー`'
        mock: 一時フォルダ
        expected: 中身の `references` の用語に `マーカー` がある
      - name: test_run_build_when_build_missing
        case: 異常
        summary: build が無いと CliError
        condition: '`build` の無い設定'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `build.include` と `build.out` が入る'
        exception: CliError
      - name: test_run_build_when_no_documents
        case: 異常
        summary: 対象が 0 件だと CliError で HTML を書き込まない
        condition: '`build.include` がどのファイルにも該当しない'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、`build.out` が無い'
        exception: CliError
    callees:
      - '#functions[buildSite]'
    refs:
      - IF-472-38#
    status: planned
    introduced:
      pr: 32
  - name: buildSite
    title: 複数の文書を 1 枚にまとめて結果を返却する
    kind: 関数
    container: src/cli/build.ts
    usecase: 複数の文書を1枚のHTMLにまとめる
    summary: '`build` の対象の文書を `kind: bundle` の中身にして `build.out` に HTML を書き込み、書き込んだパス・文書の数・警告を返却する。動画と音声は HTML を書き込む前に `_files/` へコピーする（埋めるものを用意する）'
    description: '`runBuild`（CLI）と MCP の `build_site` が同じ処理を呼ぶ。警告の中身と並びは `runBuild` が標準エラーに出していたものと同じ。標準出力・標準エラーには書き込まない'
    scope: public
    is_async: true
    side_effects: '`build.out` に HTML を書き込む'
    args:
      - name: options
        type: '{ cwd: string; config?: string; distDir: string; keepTraces?: boolean }'
        required: true
        description: 今のフォルダ・設定ファイル・`dist/` の場所・`--keep-traces`（省略時 `false`）
    returns:
      type: 'Promise<{ out: string; display: string; docs: number; warnings: string[] }>'
      description: 記載した HTML の絶対パス、`build.out` のままのパス、入れた文書の数、警告
    process: |-
      1. 設定を読み込み、`build` が無ければ例外にする（設定を読み込んで構造を検める）
      2. まとめる文書を集め、0 件なら例外にする（build の対象の文書を集める）
      3. 最初に開く文書を決め、`build.entry`・`build.glossary` がまとめる文書に該当しないことを警告にする
      4. URL を読み込む関数を `cacheFetchText` で作って埋めるものを用意し、1 枚に含まれない文書へのリンクを警告に追加する（埋めるものを用意する・1 枚に含まれない文書へのリンク）
      5. 配布物を読み込み、起動の処理と埋めるモジュールを 1 つのスクリプトにまとめて HTML を書き込む（起動の処理の入口を作る・起動の処理と埋めるモジュールをまとめる）。`keepTraces` が `true` でなければ、`exportDocument` と同じく `hideTraces` を指定する
      6. 絶対パス・`build.out`・文書の数・警告を返却する
    exceptions:
      - name: CliError
        condition: 設定の誤り・`build` が無い・対象が 0 件・出力先へ書き込めない
        message: '`runBuild` と同じ'
    unit_tests:
      - name: test_build_site
        case: 正常
        summary: まとめて絶対パスと文書の数を返却する
        condition: '`include: ["**/*.md"]` が 2 つに該当し、`out: dist/docs.html`'
        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: '`out` が `dist/docs.html` の絶対パスでファイルがあり、`docs` が 2、`warnings` が空'
      - name: test_build_site_when_traces_kept
        case: 正常
        summary: '`keepTraces` のときは名前を置き換えない'
        condition: '`include: ["**/*.md"]` が 2 つに該当し、`keepTraces: true`'
        mock: 一時フォルダと、中身を短くした配布物（`:root{--mdmark-version:"v0.12.0"}` を持つ `dist/index.css`）
        expected: 書き出した HTML に `id="mdmark-payload"` と `--mdmark-version` があり、`keepTraces` を指定しないまとめの HTML には無い
      - name: test_build_site_when_entry_outside
        case: 正常
        summary: まとめる文書に該当しない build.entry を警告で返却する
        condition: '`build.entry: missing.md`'
        mock: 一時フォルダ
        expected: '`warnings` に `missing.md` を含む文がある'
      - name: test_build_site_when_build_missing
        case: 異常
        summary: build が無いと CliError
        condition: '`build` の無い設定'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `build.include` と `build.out` が入る'
        exception: 設定の誤り・`build` が無い・対象が 0 件・出力先へ書き込めない
      - name: test_build_site_when_shared_image
        case: 正常
        summary: 同じ画像を 1 回だけ埋める
        condition: '`a.md` と `b.md` が同じ `img/a.png` を指す'
        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: 記載した HTML の中の `data:image/png;base64,` が 1 つで、`payload.assets` が 1 件
    callees:
      - 'MOD-472-109#functions[requireConfig]'
      - 'MOD-472-117#functions[collectBuildDocuments]'
      - 'MOD-472-112#functions[findOutsideLinks]'
      - 'MOD-472-120#functions[prepareEmbeds]'
      - 'MOD-472-120#functions[readDistAssets]'
      - 'MOD-472-119#functions[cacheFetchText]'
      - 'MOD-472-112#functions[createViewerEntry]'
      - 'MOD-472-112#functions[bundleViewer]'
      - 'MOD-472-111#functions[assembleHtml]'
      - 'MOD-472-120#functions[writeHtml]'
    refs:
      - IF-472-38#
      - IF-472-13#
    status: planned
    introduced:
      pr: 72
