id: MOD-472-134
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / drag.ts
test_files:
  - tests/unit/src/map/drag.browser.test.ts
constants:
  - name: DRAG_THRESHOLD_PX
    title: 押した扱いの動き
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: この値より動かずに離したら押した扱いにする（px）
    value: '4'
  - name: KEY_MOVE_PX
    title: キー 1 回で動かす量
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: Alt + 矢印キー 1 回で動かす量（px）。Shift も押すと `KEY_MOVE_PX_LARGE`
    value: '8'
  - name: KEY_MOVE_PX_LARGE
    title: Shift で動かす量
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: Alt + Shift + 矢印キー 1 回で動かす量（px）
    value: '32'
functions:
  - name: startDrag
    title: ドラッグを始める
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 押した場所（ノード・グループのタイトルの行と左・右・下の縁の帯・グループの右下の角・線の区間）を判定し、角ではグループの大きさを変え、4px 動くまでは押した扱い、動いたら全てのノードとグループの位置を固定してから動かす。`pointercancel` で動かした分を戻して終える
    scope: public
    args:
      - name: options
        type: '{ event: PointerEvent; layout: MapLayout; state: MapState; onMove: (state: MapState) => void; onClick: () => void; scale?: number; pointOf?: (event: PointerEvent) => [number, number] }'
        required: true
        description: 押したイベント・配置・状態・動かしたとき・押したときの関数・図の中身とポインターの座標の比・ポインターの位置を図の中身の座標にする関数（線の区間を選ぶ）
    returns:
      type: void
      description: なし
    process: |-
      1. 押した要素からノード・グループ・線の区間を決める（グループの面と余白は図の移動に任せて何もしない）。`pointerType` が `touch` でなければ、押した要素で `setPointerCapture` を呼び、`pointerdown` を `preventDefault` する（文書のスクロールと文字の選択を始めない）
      2. 4px 動くまでは待ち、離したら `onClick` を呼ぶ
      3. 動いたら全てのノードとグループの今の位置を `positions` に入れ、ノード・グループは動いた分を追加し、線の区間は `wireShifts` に追加する。ほかとの間が `minGap` より狭くなる位置と、グループの左端・上端より外へは進めない
      4. 線の端の区間がノードの辺の端を越えたら、越えた側の辺へつなぎ替える
      5. `pointerup` か `pointercancel` で `window` の `pointermove`・`pointerup`・`pointercancel` の受け取りを削除する。`pointercancel`（指のドラッグをブラウザが文書のスクロールに切り替えたとき）では、動かしていれば `onMove` を押した時点の状態で呼んで動かした分を戻し、`onClick` は呼ばない
    unit_tests:
      - name: test_start_drag_when_cancelled
        case: 正常
        summary: pointercancel で動かした分を戻し、その後の移動で動かさない
        condition: ノードに `pointerType` が `touch` の `pointerdown` と、下へ 40px の `pointermove` を発火し、`pointercancel` を発火した後に、さらに下へ 40px の `pointermove` を発火する
        mock: '`onMove`・`onClick`'
        expected: '`pointercancel` の後の `onMove` の最後の呼び出しの状態でノードの `y` が押した時点と同じで、続く `pointermove` で `onMove` が呼ばれず、`onClick` も呼ばれない'
      - name: test_start_drag_when_click
        case: 正常
        summary: 押しただけ
        condition: 3px 動かして離す
        mock: '`onMove`・`onClick`'
        expected: '`onClick` を 1 回呼び、`onMove` を呼ばない'
      - name: test_start_drag_when_node
        case: 正常
        summary: ノードを動かす
        condition: ノードを下へ 40px
        mock: '`onMove`'
        expected: そのノードの `y` が 40 増え、ほかのノードの位置が変わらない
      - name: test_start_drag_when_blocked
        case: 正常
        summary: 近づけすぎ
        condition: 隣のノードとの間が 10px になる位置まで動かす
        mock: '`onMove`'
        expected: 間が 16px の位置で止まる
      - name: test_start_drag_when_reattach
        case: 正常
        summary: つなぎ替え
        condition: 線の真ん中の区間を相手のノードの上まで動かす
        mock: '`onMove`'
        expected: 線の端がそのノードの上の辺に付く
      - name: test_start_drag_when_mouse_captured
        case: 正常
        summary: マウスではポインターを捕まえる
        condition: ノードに `pointerType` が `mouse` の `pointerdown`
        mock: '`setPointerCapture`'
        expected: '`setPointerCapture` を押したポインターの ID で 1 回呼び、イベントの `defaultPrevented` が `true`。`touch` ではどちらもしない'
  - name: moveByKey
    title: キーで動かす
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: フォーカスしたノード・グループを指定した量だけ、線は真ん中の区間を区間と直角の向きへ動かした状態を返却する。動かせないときは `undefined`
    scope: public
    args:
      - name: options
        type: '{ layout: MapLayout; state: MapState; target: { node?: string; group?: string; wire?: string }; dx: number; dy: number }'
        required: true
        description: 配置・状態・動かす要素の ID・動かす量（px。`KEY_MOVE_PX` か `KEY_MOVE_PX_LARGE` に矢印の向きを掛けた値）
    returns:
      type: MapState | undefined
      description: 動かした後の状態
    process: |-
      1. 全てのノードとグループの今の位置を `positions` に入れ、ノード・グループは `startDrag` と同じく、ほかとの間が `minGap` より狭くなる位置とグループの左端・上端より外へは進めない
      2. 線は真ん中の区間のずらしに、横の区間なら `dy`、縦の区間なら `dx` を追加し、端のつなぎ替えを `attachments` に入れる。区間と同じ向きの矢印では動かさない
    unit_tests:
      - name: test_move_by_key_when_node
        case: 正常
        summary: ノード
        condition: '`A` を `dy: 8`'
        mock: なし
        expected: '`positions.A` が `{ x: 0, y: 8 }`'
      - name: test_move_by_key_when_wire
        case: 正常
        summary: 線の真ん中の区間
        condition: '`A->C`（点 5 つ。真ん中の区間は縦）を `dx: 8`'
        mock: なし
        expected: '`wireShifts["A->C"]` の区間 1 のずらしが 8'
      - name: test_move_by_key_when_blocked
        case: 正常
        summary: 動かせない
        condition: '図の余白の内側の左上にある `A` を `dy: -8`。縦の区間の線を `dy: 8`'
        mock: なし
        expected: どちらも `undefined`
  - name: resizeByKey
    title: キーでグループの大きさを変える
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: フォーカスしたグループの角で、グループの幅と高さを指定した量だけ変えた状態を返却する。中のノードとグループを囲む大きさより小さくなるとき、ほかのノード・グループとの間が 16px より狭くなるときは、その手前の大きさにする。変えられないときは `undefined`
    scope: public
    args:
      - name: options
        type: '{ layout: MapLayout; state: MapState; group: string; dw: number; dh: number }'
        required: true
        description: 配置・状態・グループの ID・変える量（px。`KEY_MOVE_PX` か `KEY_MOVE_PX_LARGE` に矢印の向きを掛けた値。→・↓ で正、←・↑ で負）
    returns:
      type: MapState | undefined
      description: 大きさを変えた後の状態
    process: |-
      1. 配置の今のグループの幅と高さに `dw`・`dh` を加え、中のノードとグループを囲む矩形（中の余白を含む）より小さくしない
      2. 広げた矩形がほかのノード・グループに 16px より近づくときは、近づく手前の大きさにする
      3. `groupSizes` にグループの幅と高さを入れた状態を返却する。手順 1・2 の後に大きさが変わらなければ `undefined`
    unit_tests:
      - name: test_resize_by_key
        case: 正常
        summary: 広げる
        condition: 'グループ `page` を `dw: 8`・`dh: 32`'
        mock: なし
        expected: '`groupSizes.page` が今の幅に 8、高さに 32 を加えた値'
      - name: test_resize_by_key_when_min
        case: 正常
        summary: 中身より小さくしない
        condition: 'グループ `page` を中のノードを囲む大きさから `dw: -32`'
        mock: なし
        expected: '`undefined`'
      - name: test_resize_by_key_when_blocked
        case: 正常
        summary: ほかのノードに近づけない
        condition: '右のノードとの間が 20px のグループ `page` を `dw: 32`'
        mock: なし
        expected: '`groupSizes.page` の幅が今の幅に 4 を加えた値'
  - name: applyWireShifts
    title: 線の区間のずらしを当てる
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 動かした線の区間のずらしを線の点に当て、動かした区間の位置だけを保って前後の区間をノードの辺までの直角の経路で引き直し、端のつなぐ辺を決め直す。点の数が変わった線のずらしは捨てる
    scope: public
    args:
      - name: layout
        type: MapLayout
        required: true
        description: 配置の結果（ノード・グループを動かした後の位置を含む）
      - name: state
        type: Pick<MapState, "wireShifts">
        required: true
        description: 線の ID ごとの区間のずらし
    returns:
      type: '{ wires: PlacedWire[]; attachments: MapState["attachments"]; wireShifts: MapState["wireShifts"] }'
      description: ずらしを当てた線・線の両端がつなぐ辺・当てたずらし
    process: |-
      1. ずらしを持たない線と、点の数が変わった線はそのまま返す
      2. ずらした区間をその位置に置き、前後の区間を両端のノードの辺までの直角の経路で引き直す（区間の前後を引き直す）
         - 縦（横）の区間が接続先のノードの左右（上下）の端の内側にある場合、そのノードの上下（左右）の辺につなぐ
         - 端より外にある場合、越えた側の辺（右の端を越えたら右の辺）へ、区間から直角に曲がってつなぐ
      3. 両端の点がノードの辺の上にあることを保ち、端のつなぐ辺を `attachments` に入れる
      4. つながっていないノードは避けずに経路を引く
    unit_tests:
      - name: test_apply_wire_shifts_when_inside_edge
        case: 正常
        summary: 動かした区間を保つ
        condition: 左下のノードの右の辺から右上のノードの下の辺への L 字の線の縦の区間を、右上のノードの左右の端の内側で右へ 20px ずらす
        mock: なし
        expected: 縦の区間の x 座標が 20 増え、線の端が右上のノードの下の辺と左下のノードの右の辺の上にあり、全ての区間が水平か垂直
      - name: test_apply_wire_shifts_when_beyond_edge
        case: 正常
        summary: 越えた側の辺へ回り込む
        condition: 同じ L 字の線の縦の区間を、右上のノードの右端より 30px 右へずらす
        mock: なし
        expected: 線の端が右上のノードの右の辺の上にあり、`attachments` の `to` が `right`、縦の区間の x 座標がずらした位置のまま
      - name: test_apply_wire_shifts_when_node_moved
        case: 正常
        summary: ノードを動かした後も浮かない
        condition: 区間をずらした線の接続先のノードを上へ 40px 動かした配置
        mock: なし
        expected: 線の両端がノードの辺の上にある
      - name: test_apply_wire_shifts_when_points_changed
        case: 正常
        summary: 点の数が変わった線のずらしは捨てる
        condition: ずらしの `count` と線の点の数が違う
        mock: なし
        expected: 線がそのままで、戻り値の `wireShifts` にその線が無い
lead: 'ノード・グループ・線の区間のドラッグとキーでの移動を受け持ち、構成図の移動の操作を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
  - name: action:移動
