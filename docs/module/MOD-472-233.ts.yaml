id: MOD-472-233
visibility: internal
title: ライブラリ本体 / コードブロック / code-block.interact.ts
test_files:
  - tests/unit/src/code-block/code-block.interact.browser.test.ts
functions:
  - name: attachCodeCopy
    title: コードブロックにコピーを付ける
    container: src/code-block/code-block.interact.ts
    summary: 'コードブロックの帯にコピーのボタンを配置し、押すとコードを写して結果を表示する'
    description: |-
      各 `.mdmark-code > .mdmark-code-bar`（ファイルツリーの帯 `.mdmark-tree > .mdmark-code-bar` は除く。ファイルツリーのコピーは `attachFileTrees` が持つ）の末尾に `renderCodeCopy` のボタンを配置し、押すと `copyText` でコードを写す。
      写す文字は、行に分けたブロックでは `data-kind="del"` の行を除いた `mdmark-code-text` を改行でつないだもの（畳んで `hidden` を持つ行も含め、`⋯` のボタンの文字は含めない）、それ以外は `code` の文字から末尾の改行を 1 つ除いたもの。
      書き込めたら `data-state="copied"` にして 2 秒で `idle` に戻し、書き込めなければ `failed` にして次に押すまで残す
    kind: 関数
    scope: internal
    side_effects: コードブロックの帯にボタンを配置し、クリップボードへ書き込む
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: ボタンとタイマーを取り除く関数
    unit_tests:
      - name: test_attach_code_copy
        case: 正常
        summary: 押すとコードをコピーして 2 秒でボタンを戻す
        condition: '`ts` のコードブロック（`const a = 1;\nconst b = 2;\n`）のコピーのボタンを押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: '`const a = 1;\nconst b = 2;` で 1 回呼ばれ、ボタンが `data-state="copied"`、2 秒進めると `idle`'
      - name: test_attach_code_copy_when_line_marks
        case: 正常
        summary: 削除した行を除いて写す
        condition: 行のマーカー `[!code --]` の行 `old()`、`[!code ++]` の行 `next()`、マーカーの無い行 `keep()` のコードブロックのボタンを押す
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に差し替える'
        expected: '`next()\nkeep()` で呼ばれる'
      - name: test_attach_code_copy_when_denied
        case: 正常
        summary: 拒まれたら失敗の表示を残す
        condition: コードブロックのボタンを押し、2 秒進め、もう一度押す（2 回目は解決する）
        mock: '`navigator.clipboard.writeText` を 1 回目は `NotAllowedError` で拒み 2 回目は解決する関数に、時計を偽の時計に差し替える'
        expected: 1 回目の後と 2 秒後は `data-state="failed"`、2 回目の後は `copied`。`unhandledrejection` が起きない
      - name: test_attach_code_copy_when_detached
        case: 正常
        summary: 削除するとボタンを取り除く
        condition: コードブロックのボタンを押してすぐ削除し、2 秒進める
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: 帯に `mdmark-code-meta` が無く、例外が出ない
      - name: test_attach_code_copy_when_folded
        case: 正常
        summary: 畳んだ行もコピーに含める
        condition: 2 行目と 6 行目を畳んだ 8 行のコードブロック
        mock: '`navigator.clipboard.writeText` を記録する関数'
        expected: 記載した文字が 8 行全てを持ち、`⋯` を含まない
      - name: test_attach_code_copy_when_file_tree
        case: 正常
        summary: ファイルツリーの帯にはコピーのボタンを重ねない
        condition: '`renderTree`（`interactive`・`language` が `text`）のツリーと `ts` のコードブロックを持つ要素で呼ぶ'
        mock: なし
        expected: ツリーの帯の `mdmark-code-copy` が 1 つのままで、コードブロックの帯にだけボタンを配置する
    callees:
      - 'MOD-472-232#functions[copyText]'
      - MOD-472-306#functions[renderCodeCopy]
    status: planned
  - name: attachCodeWraps
    title: コードブロックとファイルツリーに折り返しの切り替えを付ける
    kind: 関数
    container: src/code-block/code-block.interact.ts
    scope: internal
    summary: 帯のコピーのボタンの前に折り返しのボタンを配置し、押すたびにそのブロックだけの折り返しを切り替える
    description: |-
      帯を持つ `.mdmark-code`（対象はその `pre`、class は `mdmark-code-wrap`）と `.mdmark-tree`（対象はツリー、class は `mdmark-tree-wrap`）ごとに、帯の `.mdmark-code-meta` の先頭（コピーのボタンがまだ無ければ帯の末尾）に `renderCodeWrapToggle` のボタンを配置する。

      描いた直後の状態は、`render` が class を付けた（マーカーの `wrap` を持つ）ブロックと、`defaultWrap` が `true` のときのマーカーの無いブロックを折り返す。`partStates` に同じ位置のブロックの切り替えた状態があればそちらを優先する（`update` で保つ）。

      押すとそのブロックの class と `aria-pressed` を切り替え、`partStates` に記録する。ツリーを切り替えたときは注釈の列をそろえ直す（`alignFileTreeNotes`）
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
      - name: options.defaultWrap
        type: boolean
        required: true
        description: 設定の `code.wrap`
      - name: options.partStates
        type: PartStates | undefined
        required: false
        description: 再描画で保つ部品の状態
      - name: options.blocks
        type: '{ code: boolean; tree: boolean } | undefined'
        required: false
        description: ボタンを付ける種類（機能 `code`・`tree` のオン・オフ）。既定は両方
    returns:
      type: () => void
      description: ボタンと受け取りを取り除く関数
    callees:
      - MOD-472-306#functions[renderCodeWrapToggle]
      - MOD-472-235#functions[alignFileTreeNotes]
    side_effects: 帯にボタンを配置し、ブロックの class と `partStates` を書き換える
    status: planned
    unit_tests:
      - name: test_attach_code_wraps
        case: 正常
        summary: 押したブロックだけを切り替える
        condition: '`wrap` のコードブロック・マーカーの無いコードブロック・ファイルツリーを持つ要素で `defaultWrap: false` で呼び、2 つ目のボタンを押す'
        expected: 押す前の `aria-pressed` が `true`・`false`・`false`、押した後は 2 つ目の `pre` が `mdmark-code-wrap` を持ち `aria-pressed` が `true`。ほかの 2 つは変わらない
        mock: なし
      - name: test_attach_code_wraps_when_default_wrap
        case: 正常
        summary: 既定を折り返すにしたときはマーカーの無いブロックも折り返す
        condition: 'マーカーの無いコードブロックとファイルツリーで `defaultWrap: true` で呼ぶ'
        expected: '`pre` が `mdmark-code-wrap`、ツリーが `mdmark-tree-wrap` を持ち、どちらのボタンも `aria-pressed` が `true`'
        mock: なし
      - name: test_attach_code_wraps_when_updated
        case: 正常
        summary: 再描画しても切り替えた状態を保つ
        condition: 同じ `partStates` で呼び、1 つ目のボタンを押してから取り除き、同じ HTML を描き直してもう一度呼ぶ
        expected: 1 つ目のブロックは押した後の状態、ほかは描いた直後の状態
        mock: なし
      - name: test_attach_code_wraps_when_order
        case: 正常
        summary: コピーのボタンの前に配置する
        condition: '`attachCodeCopy` の後に呼ぶ'
        expected: 帯の `.mdmark-code-meta` の中で、折り返しのボタンがコピーのボタンの前にある
        mock: なし
lead: 'コードブロックのコピーの操作を受け持ち、コードブロックのコピーを変えるときに参照する。'
