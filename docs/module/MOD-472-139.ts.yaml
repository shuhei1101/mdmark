id: MOD-472-139
visibility: internal
title: ライブラリ本体 / map / 読み取り / data.ts
test_files:
  - tests/unit/src/map/data.test.ts
data_models:
  - name: MapData
    title: 補足
    container: src/map/data.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseMapData` が読み込んだ補足（ER 図『mapの補足』）'
    properties:
      - name: version
        type: '1'
        description: 補足のバージョン
      - name: notes
        type: 'Record<string, { text?: string; annotations?: string[] }>'
        description: ノード・線の ID ごとの説明と、参照する注記の ID の並び（ER 図『map の補足』の `notes`。どちらか一方だけでもよい）
      - name: walkthroughs
        type: MapStep[]
        description: 案内の手順（`title`・`text`・`nodes`・`edges`・`enter`）
      - name: layout
        type: Record<string, MapLayoutEntry>
        description: ID ごとの上書き（`align`・`order`・`pos`・`width`・`color`・`line`・`packet`・`justify`・`ends`・`via`・`collapsed`）
      - name: plays_over
        type: number
        description: シーケンス図の再生を重ねる構成図の番号
      - name: groups
        type: 'Record<string, { title: string; tables: string[]; parent?: string }>'
        description: ER 図の分類（分類の ID ごとのタイトル・テーブル名・親の分類）
functions:
  - name: parseMapData
    title: 補足を読む
    kind: 関数
    container: src/map/data.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 補足の JSON のオブジェクトを読み込み、スキーマに合う部分を `MapData` にし、合わない箇所を項目にする
    scope: public
    args:
      - name: source
        type: string | undefined
        required: true
        description: '`pre.mdmark-map-data` の文字。無ければ空の補足'
    returns:
      type: '{ data: MapData; problems: MapProblem[] }'
      description: 読み込んだ補足と項目
    process: |-
      1. `JSON.parse` で読み込む。読み込めないか最上位がオブジェクトでなければ `map_invalid_value`（JSON のオブジェクトで記載する直し方。読めないときは原因と、エラーの位置から求めた補足の中の行）にして空の補足を返す
      2. トップレベル・`walkthroughs` の手順・`layout` の値・`groups` の値の知らないキーは `map_unknown_key`（使用できるキーの一覧を含む）、型の違う値は `map_invalid_value` にして捨てる
      3. 補足の文字の中で `--` をそのまま記載した文字の値は `map_invalid_value`（HTML コメントを閉じてしまうため、`--` をそのまま記載せずに 2 つ目の `-` を JSON の Unicode エスケープで記載する直し方）にする。値の `--` は、`jsonPaths` が返す元の文字に `--` をそのまま記載したパスで判定し、JSON の Unicode エスケープで記載した `--` はずれにしない
    unit_tests:
      - name: test_parse_map_data
        case: 正常
        summary: モックの補足
        condition: モックの `DATA`
        mock: なし
        expected: '`notes`（値は `{ text }`）・`walkthroughs`・`layout`（`justify`・`ends`・`via`・`collapsed` を含む）・`plays_over` が読め、`problems` が空'
      - name: test_parse_map_data_when_empty
        case: 正常
        summary: 補足が無い
        condition: '`undefined`'
        mock: なし
        expected: '`version: 1` だけの補足と空の `problems`'
      - name: test_parse_map_data_when_unknown_key
        case: 異常
        summary: 知らないキー
        condition: '`{"version": 1, "layuot": {}}`'
        mock: なし
        expected: '`map_unknown_key` が 1 件で、使用できるキーの一覧を含む'
      - name: test_parse_map_data_when_double_hyphen
        case: 異常
        summary: -- を含む値
        condition: '`walkthroughs[0].text` が `a -- b`'
        mock: なし
        expected: '`map_invalid_value` が 1 件'
      - name: test_parse_map_data_when_unreadable
        case: 異常
        summary: JSON のオブジェクトとして読めない
        condition: '`{"notes": [` と `[1]`'
        mock: なし
        expected: どちらも `map_invalid_value` が 1 件で、補足は空
      - name: test_parse_map_data_when_invalid_side
        case: 異常
        summary: 知らない辺
        condition: '`layout` の線の `ends.from.side` が `middle`、`justify` が `left`'
        mock: なし
        expected: '`map_invalid_value` が 2 件で、`ends` と `justify` を捨てる'
      - name: test_parse_map_data_when_note_is_string
        case: 異常
        summary: 説明が文字
        condition: '`{"version": 1, "notes": {"mount": "公開関数"}}`'
        mock: なし
        expected: '`map_invalid_value` が 1 件で、`notes` に `mount` が無い'
      - name: test_parse_map_data_when_escaped_double_hyphen
        case: 正常
        summary: Unicode エスケープで記載した -- を含む値
        condition: '`notes.a.text` の元の文字が、2 つ目の `-` を Unicode エスケープで記載した `a --b`'
        mock: なし
        expected: '`notes.a.text` が `a --b` で読め、`problems` が空'
  - name: jsonPaths
    title: 補足のパスを走査する
    kind: 関数
    container: src/map/data.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 補足の JSON の文字を走査し、オブジェクトのキーと配列の要素のパスごとの始まる行と、元の文字に `--` をそのまま記載した文字列の値のパスを返す
    scope: public
    args:
      - name: source
        type: string
        required: true
        description: '`JSON.parse` で読み込めた補足の文字'
    returns:
      type: '{ lines: Map<string, number>; hyphens: Set<string> }'
      description: パス（`notes.ghost`・`walkthroughs[0]`）ごとの始まる行（0 から）と、元の文字に `--` をそのまま記載した文字列の値のパス
    process: |-
      1. 値・オブジェクトのキー・配列の要素を先頭から走査し、キーと要素のパスごとに始まる行を記録する
      2. 文字列の値は、元の文字（エスケープを解く前）に `--` があればそのパスを記録する。JSON の Unicode エスケープで記載した `--` は記録しない
    unit_tests:
      - name: test_parse_map_data_when_double_hyphen
        case: 異常
        summary: -- を含む値
        condition: '`parseMapData` の同名のテスト'
        mock: なし
        expected: '`walkthroughs[0].text` のパスが記録され、`parseMapData` が `map_invalid_value` にする'
      - name: test_parse_map_data_when_escaped_double_hyphen
        case: 正常
        summary: Unicode エスケープで記載した -- を含む値
        condition: '`parseMapData` の同名のテスト'
        mock: なし
        expected: '`notes.a.text` のパスが記録されず、`parseMapData` の `problems` が空'
lead: 'map の補足の JSON の読み取りを受け持ち、補足のキーと読み取り方を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
  - name: action:読み取り
