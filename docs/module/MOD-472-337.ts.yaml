id: MOD-472-337
visibility: internal
title: ライブラリ本体 / 部品 / layout-columns.ts
test_files:
  - tests/unit/src/parts/layout-columns.test.ts
functions:
  - name: renderLayoutColumns
    title: 段組みを描く
    container: src/parts/layout-columns.ts
    summary: 部品設計『段組み』の HTML を返却する
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ columns: string[] }'
        required: true
        description: 列ごとの中身の HTML（`SLOT_MARKER` を指定できる）
    returns:
      type: string
      description: 部品の HTML
    unit_tests:
      - name: test_render_layout_columns
        case: 正常
        condition: 2 列の中身
        expected: '`<div class="mdmark-layout-columns" data-count="2">` の中に `div.mdmark-layout-column` が 2 つ'
        mock: なし
        summary: 列の数を `data-count` に入れる
