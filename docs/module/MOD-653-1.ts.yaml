        description: '`journey`'
      - value: block
        title: ブロック図
        description: '`block-beta`'
  - name: AxisGridShape
    title: 軸と格子の配置の図の項目の形状
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: 型
    summary: 部品設計『mapの軸と格子の配置の図』の `grid.items[].shape`
    values:
      - value: bar
        title: 棒
        description: ガントチャートのタスク
      - value: milestone
        title: ひし形
        description: ガントチャートの `milestone`
      - value: period
        title: 期間
        description: タイムラインの期間
      - value: event
        title: 出来事
        description: タイムラインの出来事
      - value: commit
        title: commit
        description: '`type: NORMAL` の commit'
      - value: highlight
        title: 強調の commit
        description: '`type: HIGHLIGHT`'
      - value: reverse
