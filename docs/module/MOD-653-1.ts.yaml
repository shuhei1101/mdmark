      - value: rounded
        title: 角の丸い四角
        description: ブロック図の `("")`
      - value: circle
        title: 丸
        description: ブロック図の `((""))`
      - value: cylinder
        title: 円柱
        description: ブロック図の `[("")]`
      - value: space
        title: 空き
        description: ブロック図の `space`（描かず列を進める）
functions:
  - name: parseAxisGrid
    title: 軸と格子の配置の図を読む
    kind: 関数
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 5 種類の Mermaid を、種類ごとの読み取りで共通の `AxisGrid` に読む
    scope: public
    args:
      - name: options
        type: '{ kind: AxisGridKind; source: string }'
        required: true
        description: 図の種類と mermaid のブロックの中身
    returns:
      type: AxisGrid
      description: 読み取り結果
    process: |-
      1. 1 行目・空の行・`%%` で始まる行を飛ばし、`title` の行を `title` にする
      2. `kind` ごとに行を読む（ガントチャートは `dateFormat`・`axisFormat`・`excludes`・`todayMarker`・`section`・タスクの行、タイムラインは `section` と `{期間} : {出来事}` の行と `:` で始まる続きの行、Git グラフは `commit`・`branch`・`checkout`・`switch`・`merge`・`cherry-pick`、ジャーニーは `section` と `{タスク名}: {点数}: {人}` の行、ブロック図は `columns`・ブロック・`space`・`block:{ID}` と `end`・線）。読めない行は `map_invalid` の項目（行番号・行の文字・直し方）にして次の行へ進む
      3. ガントチャートは、開始の `after {ID}` をそのタスクの終了日に、終了の `{数}d` を開始日からの日数（`excludes weekends` のときは土日を数えない）にして開始日と終了日を決め、`after` を `links` に入れる。無い ID を指す `after`・読めない日付のタスクは `map_invalid` にして読み飛ばす
      4. Git グラフは、commit を今のブランチの先頭につなぎ、親を `links`（`parent`）に、merge は取り込むブランチの先頭も `merge`、cherry-pick は元の commit を `cherryPick` に入れる。Mermaid が振る乱数の ID は作らない
      5. ブロック図は、入れ子の `block:{ID}` を `sections` に入れ、中の項目の `section` をその `stateKey` にする。線は `arrow` とラベルで `links` に入れる。閉じの無い `block` は `map_invalid` にし、最後の行で閉じたものとして扱う
      6. ID を持たない項目の `label` と section の名前を数え、2 つ以上のものを `ambiguous` に入れ、その項目の `stateKey` を `n{order}`、section の `stateKey` を `s{order}` にする
    unit_tests:
      - name: test_parse_axis_grid_when_gantt
        case: 正常
        summary: ガントチャート
        condition: モックの `GANTT`
        mock: なし
        expected: タスク 8・section 4 で、「設計する」の開始日が「要件を決める」の終了日、「実装する」の終了日が土日を数えない 5 日後。`links` に `after` が 4 本、`ambiguous` が `準備` だけで 2 つの「準備」の `stateKey` が `s1`・`s3`。「手順書を書く」の `key` がタスク名。`problems` が空
      - name: test_parse_axis_grid_when_timeline
        case: 正常
        summary: タイムライン
        condition: モックの `TIMELINE`
        mock: なし
        expected: 期間 6・出来事 9・section 2 で、「2026-04」の `section` が無く、「注意書き」の `parent` が「2026-05」。`title` が `mdmark の歩み`
      - name: test_parse_axis_grid_when_git_graph
        case: 正常
        summary: Git グラフ
        condition: モックの `GIT_GRAPH`
        mock: なし
        expected: '`branches` が `main`・`develop`・`feat`、commit 10 で、6 個目の `label` が空で `key` が `c6`。`axis` の `shape` が `highlight`、cherry-pick の元が `map`、merge が 2 つで `links` に `merge` が 2 本'
      - name: test_parse_axis_grid_when_journey
        case: 正常
        summary: ジャーニー
        condition: モックの `JOURNEY`
        mock: なし
        expected: タスク 7・section 3・`actors` が `作成者`・`AI`・`読者` で、「図を辿る」の人が 3 人・点数が 4
      - name: test_parse_axis_grid_when_block
        case: 正常
        summary: ブロック図
        condition: モックの `BLOCK`
        mock: なし
        expected: '`columns` が 3、「利用側のページ」の幅が 2、`space` が 1 つ、`sections` が `core`（`columns` 2・中の項目 2）、`links` にラベル「描く」の線を含む 3 本'
      - name: test_parse_axis_grid_when_unreadable
        case: 異常
        summary: 読めない行
        condition: モックの `GANTT_UNREADABLE`
        mock: なし
        expected: '`map_invalid` が 1 件で、行番号とその行の文字を含む。ほかのタスクは読む'
    refs:
      - IF-472-35#constraints[map のガントチャート]
      - IF-472-35#constraints[map のタイムライン]
      - IF-472-35#constraints[map の Git グラフ]
      - IF-472-35#constraints[map のジャーニー]
      - IF-472-35#constraints[map のブロック図]
  - name: axisGridItemOf
    title: キーが指す項目を探す
    kind: 関数
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 補足とマーカーの引数のキー（ID・表示する文字・`c{番号}`・section の名前・ブランチ名）が指す項目か section を探す
    scope: public
    args:
      - name: options
        type: '{ grid: AxisGrid; key: string }'
        required: true
        description: 読み取り結果と、補足かマーカーの引数のキー
    returns:
      type: '{ kind: "item"; item: AxisGridItem } | { kind: "section"; section: AxisGridSection } | { kind: "branch"; branch: string } | { kind: "ambiguous" } | { kind: "missing" }'
      description: '`id` が一致する項目、無ければ `id` を持たない項目の `label`・`c{番号}`・section の名前・ブランチ名の順に照らす。キーが `ambiguous` にあれば `ambiguous`、どれにも一致しなければ `missing`'
    unit_tests:
      - name: test_axis_grid_item_of
        case: 正常
        summary: 各種のキー
        condition: モックの `GANTT` でキー `imp`・`手順書を書く`・`公開`・`準備`・`幽霊`、`GIT_GRAPH` で `c6`・`feat`・`README を書く`
        mock: なし
        expected: '`imp` と `手順書を書く` と `c6`・`README を書く` が `item`、`公開` が `section`、`feat` が `branch`、`準備` が `ambiguous`、`幽霊` が `missing`'
refs:
  - IF-472-35#constraints[map の軸と格子の配置の図の補足]
tags:
  - name: topic:map
  - name: topic:図
  - name: action:読み取り
