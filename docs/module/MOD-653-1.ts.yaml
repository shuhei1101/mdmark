id: MOD-653-1
visibility: internal
title: ライブラリ本体 / map / 読み取り / axis-grid.ts
lead: Mermaid の gantt・timeline・gitGraph・journey・block-beta の読み取りと、補足とマーカーの引数のキーが指す項目の解決を受け持ち、map の軸と格子の配置の図の読み取りを変えるときに参照する。
test_files:
  - tests/unit/src/map/axis-grid.test.ts
data_models:
  - name: AxisGrid
    title: 軸と格子の配置の図の読み取り結果
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseAxisGrid` の戻り値。5 種類で共通の構造で持ち、種類に固有の値は項目の `detail` に持つ'
    properties:
      - name: kind
        type: AxisGridKind
        description: 図の種類
      - name: title
        type: string | undefined
        description: Mermaid の `title` の行の文字。無ければ無い
      - name: items
        type: AxisGridItem[]
        description: 項目（記載の順）。ガントチャートとジャーニーはタスク、タイムラインは期間と出来事、Git グラフは commit、ブロック図はブロックと `space`
      - name: sections
        type: AxisGridSection[]
        description: section（ガントチャート・タイムライン・ジャーニー）と入れ子のブロック（ブロック図）。記載の順
      - name: branches
        type: string[]
        description: Git グラフのブランチ名（作った順。先頭が `main`）。ほかの種類は空
      - name: actors
        type: string[]
        description: ジャーニーの人（出てくる順）。ほかの種類は空
      - name: links
        type: AxisGridLink[]
        description: つながり（ガントチャートの `after`・Git グラフの親の commit・ブロック図の線）
      - name: options
        type: '{ dateFormat?: string; axisFormat?: string; excludesWeekends: boolean; todayMarker: boolean; columns?: number }'
        description: ガントチャートの `dateFormat`・`axisFormat`・`excludes weekends`・`todayMarker off` が無いかと、ブロック図の最上位の `columns`
      - name: ambiguous
        type: ReadonlySet<string>
        description: ID を持たない 2 つ以上の項目が使う表示する文字と、2 つ以上の section が使う名前（補足とマーカーの引数の `focus` で指すと、どの項目にも適用しない）
      - name: problems
        type: MapProblem[]
        description: 読めない行の `map_invalid`（行番号・行の文字・直し方）
  - name: AxisGridItem
    title: 軸と格子の配置の図の項目
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 項目 1 つ
    properties:
      - name: order
        type: number
        description: 記載の順の番号（1 から。Git グラフの `c{番号}` の番号）
      - name: id
        type: string | undefined
        description: 記載した ID（タスクの ID・commit の `id:`・ブロックの ID）。無ければ無い
      - name: label
        type: string
        description: 表示する文字（タスク名・期間と出来事の文・commit の `msg:`・ブロックの名前）。`id:` も `msg:` も持たない commit は空
      - name: shape
        type: AxisGridShape
        description: 形状
      - name: section
        type: string | undefined
        description: 属する section・入れ子のブロックの `stateKey`。無ければ無い
      - name: parent
        type: number | undefined
        description: タイムラインの出来事の期間の `order`
      - name: detail
        type: AxisGridDetail
        description: 種類に固有の値（ガントチャートの開始日・終了日・タグ、Git グラフのブランチ・`tag:`・元の ID、ジャーニーの点数と人、ブロック図の幅）。`kind` で判別できる union
      - name: key
        type: string
        description: 補足とマーカーの引数の `focus` が指すキー（`id`、無ければ `label`、どちらも空の commit は `c{order}`）
      - name: stateKey
        type: string
        description: 状態の保存と描画が項目を区別するキー。`key` と同じ。ID を持たない同じ文字の項目が 2 つ以上あるときは、その項目だけ `n{order}`
  - name: AxisGridSection
    title: section と入れ子のブロック
    container: src/map/axis-grid.ts
    usecase: 図のグループの中へ入る・開閉する
    role: データモデル
    summary: 開閉と中へ入るの対象 1 つ
    properties:
      - name: order
        type: number
        description: 記載の順の番号（1 から。`s{番号}` の番号）
      - name: label
        type: string
        description: section の名前か、入れ子のブロックの ID
      - name: stateKey
        type: string
        description: 状態のキー。`label`、同じ名前の section が 2 つ以上あるときはその section だけ `s{order}`
      - name: members
        type: number[]
        description: 中の項目の `order`（タイムラインは期間だけ。出来事は期間に属する）
      - name: columns
        type: number | undefined
        description: 入れ子のブロックの中の `columns`
      - name: parent
        type: string | undefined
        description: 入れ子のブロックの外の入れ子の `stateKey`
  - name: AxisGridLink
    title: つながり
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 項目の間のつながり 1 つ
    properties:
      - name: from
        type: number
        description: 元の項目の `order`
      - name: to
        type: number
        description: 先の項目の `order`
      - name: kind
        type: '"after" | "parent" | "merge" | "cherryPick" | "arrow"'
        description: ガントチャートの `after`、Git グラフの親・merge の取り込み・cherry-pick の元、ブロック図の線
      - name: label
        type: string | undefined
        description: ブロック図の線のラベル
  - name: AxisGridSelection
    title: 選んだ項目
    container: src/map/axis-grid.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapの軸と格子の配置の図』の `selected`。配置・描画・操作が使用する
    properties:
      - name: kind
        type: '"item" | "branch" | "actor"'
        description: 項目・Git グラフのブランチ・ジャーニーの人
      - name: key
        type: string
        description: 項目の `stateKey`・ブランチ名・人の名前
