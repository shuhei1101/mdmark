id: MOD-472-112
visibility: internal
title: ライブラリ本体 / CLI / embed.ts
test_files:
  - tests/unit/src/cli/embed.test.ts
data_models:
  - name: ViewerEmbeds
    title: 起動の処理とまとめるモジュール
    container: src/cli/embed.ts
    usecase: 共通
    summary: '`prepareEmbeds` がまとめられることを確認した、起動の処理と 1 つのスクリプトにまとめるモジュールの読み込み先（URL か絶対パス）'
    properties:
      - name: libraries
        type: Record<string, string>
        description: 文書にマーカーがありまとめられた外部ライブラリの、マーカーの名前から読み込み先を参照する表
      - name: extensions
        type: string[]
        description: まとめられた設定の `extensions` の拡張の読み込み先。設定の順
      - name: syntax
        type: '{ core: string; languages: Record<string, string> } | undefined'
        description: まとめられた色分けの本体の読み込み先と、言語のモジュール名から読み込み先を参照する表。文書に色分けの対象があり本体をまとめられたときだけ持つ
      - name: view
        type: boolean
        description: ビューの部品をまとめるか。文書にビューのマーカーがあるときだけ `true`（書き出した HTML はコメントの読み込みと保存の関数を持たないため、コメントの部品はまとめない）
      - name: mermaid
        type: string | undefined
        description: まとめられた mermaid の読み込み先。文書に mermaid のコードブロックがあり、まとめられたときだけ持つ
      - name: htmlScripts
        type: 'Array<{ source: string; code: string }> | undefined'
        description: '`compileHtmlScripts` の結果。`source` は範囲のコードの文字（開いたときに `mount` が参照する鍵）、`code` は CommonJS のコード。範囲が無ければ入れない'
    refs:
      - IF-472-33#constraints[まとめるスクリプト]
    status: planned
    introduced:
      pr: 296
functions:
  - name: hasDynamicImport
    title: 動的 import が残るかを確認する
    container: src/cli/embed.ts
    usecase: 共通
    summary: まとめたコードに動的 `import()` の呼び出し（`import(` の並び。間の空白を許す）が残るかを返却する
    description: 変数を指定する `import()` は esbuild が取り込めず、まとめた後もコードに残る
    kind: 関数
    scope: internal
    args:
      - name: code
        type: string
        required: true
        description: '`bundleModule` がまとめたコード'
    returns:
      type: boolean
      description: 動的 `import()` が残るか
    unit_tests:
      - name: test_has_dynamic_import
        case: 正常
        summary: 残った動的 import を見つけ、無ければ false
        condition: '`a.load=()=>import(n)`・`import (n)`・`const x=1`'
        mock: なし
        expected: 順に `true`・`true`・`false`
    status: planned
    introduced:
      pr: 296
  - name: createViewerEntry
    title: 起動の処理の入口を作る
    container: src/cli/embed.ts
    usecase: 共通
    summary: 起動の処理・部品・色分けを静的な `import`、外部ライブラリと拡張をリテラルの動的 `import()` を返却する関数で取り込み、`startViewer(document, 埋めたモジュール)` を呼ぶ入口のモジュールのソースを返却する
    description: 読み込み先は `JSON.stringify` した文字列リテラルで記載する。`syntax` の本体と言語は `default` の import、ビューの部品は名前空間の import にする
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ viewer: string; view: string; embeds: ViewerEmbeds; hideTraces?: boolean }'
        required: true
        description: '`dist/viewer.js`・`dist/view.js`・`dist/map.js` の絶対パスと、まとめるモジュールの読み込み先。`hideTraces` は省略時 `false`'
    returns:
      type: string
      description: 入口のモジュールの JavaScript のソース
    process: |-
      1. `viewer` から `startViewer` を import する行を配置する
      2. `embeds.view` が `true` なら `view` を、`embeds.map` が `true` なら `map`（`dist/map.js`）を名前空間で import する行を配置し、`parts` に入れる
      3. `embeds.syntax` があれば、本体と言語ごとに `default` を import する行を配置する。`embeds.mermaid` があれば、mermaid を名前空間で import する行を配置する（mermaid が中で読み込む chunk の動的 `import()` は同じスクリプトに取り込まれる）
      4. `embeds.htmlScripts` があれば、範囲ごとに `compileHtmlScripts` の CommonJS のコードを `(module, exports, require) => { … }` で包んだ関数を、範囲のコードの文字を鍵にした `htmlScripts` の表に配置する行を配置する。`hideTraces` が `true` のときは、鍵の代わりに `"{HTML_SCRIPT_KEY_PREFIX}{番号}@@"`（番号は `embeds.htmlScripts` の添字）を記載する
      5. `startViewer(document, { parts, syntax, mermaid, libraries, extensions, htmlScripts })` を呼ぶ行を配置する。`mermaid` は `embeds.mermaid` があれば import した名前空間、無ければ持たない。`libraries` はマーカーの名前ごとの `() => import("{読み込み先}")`、`extensions` は `embeds.extensions` の順の `() => import("{読み込み先}")`
    unit_tests:
      - name: test_create_viewer_entry
        case: 正常
        summary: 部品と色分けを静的に、外部ライブラリと拡張を関数で取り込む
        condition: '`embeds` が `{ view: true, libraries: { chart: "https://cdn.example/chart.js" }, extensions: ["/w/ext.js"], syntax: { core: "/w/hl/core.min.js", languages: { typescript: "/w/hl/languages/typescript.min.js" } } }`'
        mock: なし
        expected: ソースに `dist/viewer.js`・`dist/view.js`・`core.min.js`・`typescript.min.js` の静的な `import` があり、`chart` と拡張は `() => import("…")` で、`startViewer(document,` を 1 回呼ぶ
      - name: test_create_viewer_entry_when_nothing_embedded
        case: 正常
        summary: 埋めるものが無ければ起動の処理だけを取り込む
        condition: '`embeds` が `{ view: false, libraries: {}, extensions: [] }`'
        mock: なし
        expected: '`import` は `startViewer` の 1 行だけで、`parts` が `{}`、`syntax` を持たない'
      - name: test_create_viewer_entry_when_mermaid
        case: 正常
        summary: mermaid を名前空間で静的に取り込む
        condition: '`embeds` が `{ view: false, libraries: {}, extensions: [], mermaid: "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs" }`'
        mock: なし
        expected: ソースに `import * as` と mermaid の URL の静的な `import` が 1 行あり、`startViewer(document,` に `mermaid` を指定する
      - name: test_create_viewer_entry_when_traces_hidden
        case: 正常
        summary: 隠すときは範囲のスクリプトの表の鍵を仮の文字列で記載する
        condition: '`hideTraces: true`、`embeds.htmlScripts` が `[{ source: "window.__mdmarkOpened = true", code: "…" }]`'
        mock: なし
        expected: ソースに `"@@html-script-key-0@@"` があり、`window.__mdmarkOpened` が無い
    status: planned
    introduced:
      pr: 296
  - name: bundleViewer
    title: 起動の処理と埋めるモジュールをまとめる
    container: src/cli/embed.ts
    usecase: 共通
    summary: '`createViewerEntry` のソースを入口に、esbuild で分割せずに 1 つの ES モジュールのスクリプトにまとめ、`</script` の並びを `<\/script` に、`<!--` の並びを `<\x21--` に替えて返却する'
    description: '`bundleModule` と同じ設定（`bundle: true`・`format: esm`・`minify: true`・対応ブラウザの `target`・`http:`・`https:` の import を `fetchText` で読み込むプラグイン）で、入口は `stdin`（`resolveDir` は設定ファイルのあるフォルダ）。リテラルとパターンの動的 `import()` は同じスクリプトに取り込まれ、評価は呼び出しまで遅れる。`</script` の並び（大文字小文字を問わない）は `<\/script` に、`<!--` の並びは `<\x21--` に替え、HTML の `script` 要素が途中で閉じないように、また script data escaped state に入って閉じなくならないようにする。esbuild はコードのトークンとして `<!--` を出力せず、どちらの並びも文字列・テンプレート・正規表現・コメントの中にしか現れないため、替えても意味は変わらない（`String.raw` の raw の値だけが変わる）。`prepareEmbeds` が確認したモジュールだけを指定するため、まとめる失敗は例外のまま投げる。`hideTraces` があれば、替える前のまとめたコードを `hideScript` に通す'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: URL の先を読み込む
    args:
      - name: options
        type: '{ entry: string; baseDir: string; fetchText: FetchText; hideTraces?: { keys: string[] } }'
        required: true
        description: '`createViewerEntry` のソース、設定ファイルのあるフォルダ、URL を読み込む関数。`hideTraces` は隠すときだけ指定し、`keys` は `embeds.htmlScripts` の `source` の並び'
    returns:
      type: Promise<string>
      description: まとめたスクリプト
    unit_tests:
      - name: test_bundle_viewer
        case: 正常
        summary: 入口と関数で取り込んだモジュールを 1 つにまとめ、動的 import を残さない
        condition: 一時フォルダに `startViewer` を export する `viewer.js` と、`load` の中で `./part.js` を動的 `import()` で読み込む `ext.js`。入口は `viewer.js` を静的に、`ext.js` を `() => import(…)` で取り込む
        mock: 一時フォルダ
        expected: 戻り値に `import(` と `from"` の並びが無く、`part.js` の中身を含む
      - name: test_bundle_viewer_when_script_close
        case: 正常
        summary: '`</script` を替えて返却する'
        condition: '`ext.js` が `/*! </SCRIPT> */` の注釈を持つ'
        mock: 一時フォルダ
        expected: 戻り値に `</script` の並び（大文字小文字を問わない）が無く、`<\/SCRIPT>` がある
      - name: test_bundle_viewer_when_html_comment_open
        case: 正常
        summary: '`<!--` を替え、評価した文字列は元と同じ'
        condition: '`ext.js` が `"<!-- <script>"` の文字列を export する'
        mock: 一時フォルダ
        expected: 戻り値に `<!--` の並びが無く、戻り値を評価して取り出した文字列が `<!-- <script>`
      - name: test_bundle_viewer_when_traces_hidden
        case: 正常
        summary: 隠すときは名前を置き換え、範囲のスクリプトの表の鍵を元の文字に戻す
        condition: '`hideTraces: { keys: ["window.__mdmarkOpened = true"] }`、入口が `__mdmarkHtmlScript` を持ち、`"@@html-script-key-0@@"` を鍵にした表を export する'
        mock: 一時フォルダ
        expected: 戻り値に `__zqHtmlScript` があり `__mdmarkHtmlScript` が無く、評価して取り出した表の鍵が `window.__mdmarkOpened = true`
    callees:
      - MOD-472-350#functions[hideScript]
    refs:
      - IF-472-33#constraints[まとめるスクリプト]
      - IF-472-33#constraints[mdmark の痕跡]
    status: planned
    introduced:
      pr: 296
  - name: inlineImages
    title: 画像を埋める
    container: src/cli/embed.ts
    usecase: 共通
    summary: Markdown の画像（`![]()` と HTML の `img`）の相対パスを、文書のフォルダを基準に読み込んだ `data:` URL に替える。`options.assetsRoot` があれば `resolveAssetFile` の順で探し、フラグメントは `data:` URL の後ろに残す。画像の属性の `poster=` も替え、動画・音声は替えない（`copyMedia` が扱う）。`options.assets` を指定したとき（`build`）は `data:` URL の代わりに `mdmark-asset:{キー}` に替え、同じファイルを同じキーにして `options.assets` に `data:` URL を入れる
    description: 画像の場所は markdown-it のトークン（`image` と `html_inline`・`html_block` の `src`）から取得し、その文字列だけを置き換える。MIME は拡張子（png・jpg・jpeg・gif・webp・svg）で決める。読み込めない画像は記載したまま残して警告に、絶対 URL の画像は読み込まずに残して警告にする
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: markdown
        type: string
        required: true
        description: 文書の Markdown
      - name: docFile
        type: string
        required: true
        description: 文書の絶対パス
      - name: options
        type: '{ assetsRoot?: string; assets?: Map<string, { key: string; url: string }> }'
        required: false
        description: '`assets.root` の絶対パスと、`build` が文書をまたいで共有する埋めた画像の表'
    returns:
      type: 'Promise<{ markdown: string; warnings: string[] }>'
      description: 画像を替えた Markdown と警告の内容
    unit_tests:
      - name: test_inline_images
        case: 正常
        summary: '相対パスの画像を data: URL に替える'
        condition: '`![図](img/a.png)` と `img/a.png`'
        mock: 一時フォルダ
        expected: '`markdown` に `data:image/png;base64,` が入り、`warnings` が空'
      - name: test_inline_images_when_missing
        case: 正常
        summary: 読み込めない画像は残して警告にする
        condition: '`![図](img/missing.png)` でファイルが無い'
        mock: 一時フォルダ
        expected: '`markdown` が元のままで、`warnings` に `img/missing.png` が入る'
      - name: test_inline_images_when_absolute_url
        case: 正常
        summary: 絶対 URL の画像は読み込まずに警告にする
        condition: '`![図](https://example.com/a.png)`'
        mock: なし
        expected: '`markdown` が元のままで、`warnings` に `https://example.com/a.png` が入る'
      - name: test_inline_images_when_assets_root
        case: 正常
        summary: アセットのルートの画像とフラグメントと poster を替える
        condition: '`assets/a.png` だけがあり `![図](a.png#only-dark)` と `![操作](demo.mp4){poster=a.png}`、`assetsRoot` が `assets`'
        mock: 一時フォルダ
        expected: '`data:image/png;base64,…#only-dark` と `poster=data:image/png;base64,…` に替わり、`demo.mp4` は元のまま'
      - name: test_inline_images_when_shared
        case: 正常
        summary: build では同じ画像を 1 つのキーにする
        condition: 2 つの文書が同じ `img/a.png` を指し、同じ `assets` を指定する
        mock: 一時フォルダ
        expected: どちらの `markdown` も同じ `mdmark-asset:{キー}` を持ち、`assets` が 1 件
    status: planned
    introduced:
      pr: 32
    callees:
      - 'MOD-472-113#functions[resolveAssetFile]'
      - 'MOD-472-113#functions[collectAssetRefs]'
  - name: findOutsideLinks
    title: 1 枚に含まれない文書へのリンクを取得する
    container: src/cli/embed.ts
    usecase: 複数の文書を1枚のHTMLにまとめる
    summary: 文書の相対リンクのうち、`.md` を指してまとめる文書に無いものを返却する
    description: リンクは markdown-it の `link_open` の `href` から取得し、`resolveLink`（索引と用語）で文書のパスから解く。`#` だけのリンクとスキームを持つリンクは取得しない
    kind: 関数
    scope: public
    args:
      - name: markdown
        type: string
        required: true
        description: 文書の Markdown
      - name: docPath
        type: string
        required: true
        description: 文書のパス
      - name: paths
        type: ReadonlySet<string>
        required: true
        description: まとめる文書のパス
    returns:
      type: string[]
      description: 1 枚に含まれないリンク先（記載したままの `href`。記載した順）
    unit_tests:
      - name: test_find_outside_links
        case: 正常
        summary: まとめる文書に無い .md へのリンクだけを返却する
        condition: '`README.md` が `[a](使い方/guide.md)`・`[b](下書き/メモ.md)`・`[c](#見出し)`・`[d](https://example.com/x.md)` を持ち、まとめるのは `README.md`・`使い方/guide.md`'
        mock: なし
        expected: '`["下書き/メモ.md"]`'
    status: planned
    introduced:
      pr: 32
  - name: usedParts
    title: 埋める部品を選ぶ
    container: src/cli/embed.ts
    summary: 埋める文書にビューのマーカーがあれば `true` を返却する。`prepareEmbeds` が `embeds.view` に入れる
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ markdowns: string[] }'
        required: true
        description: 埋める文書の Markdown
    returns:
      type: boolean
      description: ビューの部品をまとめるか
    process: 1. `MARK_PATTERN` でマーカーを取得し、閉じでない `view` のマーカーを持つ Markdown が 1 つでもあれば `true` を返却する。無ければ `false`
    unit_tests:
      - name: test_used_parts
        case: 正常
        summary: ビューのマーカーがあるときだけ部品をまとめる
        condition: '`<!-- view: {"board": {"group": {"column": "状態"}}} -->` を持つ文書と、マーカーの無い文書だけ'
        mock: なし
        expected: 前者は `true`、後者は `false`
    refs:
      - IF-472-33#
  - name: compileHtmlScripts
    title: 範囲のスクリプトを変える
    container: src/cli/embed.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: '文書ごとに `collectRangeScripts` で範囲のコードを集め、`ts` は型を削除して、esbuild の `transform`（`format: "cjs"`）で CommonJS に変える。同じコードは 1 回だけ変える'
    description: '`render` は文書の `features` のマーカーを重ねるので、`html-scripts` がオフの文書は `template` を出さず対象にならない。変えられない範囲は返却せず、文書のパスと元のエラーの 1 行の警告にする（開いたときは `mount` が表に無い範囲として記載の警告を出す）'
    args:
      - name: options
        type: '{ documents: Array<{ path: string; markdown: string }>; config: MdmarkConfig }'
        required: true
        description: 書き出す文書と設定
    returns:
      type: 'Promise<{ scripts: Array<{ source: string; code: string }>; warnings: string[] }>'
      description: 変えた範囲と警告
    unit_tests:
      - name: test_compile_html_scripts
        case: 正常
        summary: 範囲の `ts` の型を削除して CommonJS にし、同じコードは 1 つにする
        condition: '`features.html-scripts` が `true` の設定と、同じ `ts` の範囲を持つ 2 つの文書'
        mock: なし
        expected: '`scripts` が 1 件で、`code` が `exports.default` への代入を含み、型の注釈を含まない'
      - name: test_compile_html_scripts_when_off
        case: 正常
        summary: '`html-scripts` がオフの文書は変えない'
        condition: 設定に `html-scripts` を記載しない
        mock: なし
        expected: '`scripts` が空'
      - name: test_compile_html_scripts_when_syntax_error
        case: 異常
        summary: 変えられない範囲は警告にし、返却しない
        condition: 閉じ括弧の足りない `js` の範囲
        mock: なし
        expected: '`scripts` が空で、`warnings` に文書のパスを含む 1 行'
    status: planned
    introduced:
      pr: 303
    callees:
      - 'MOD-472-118#functions[collectRangeScripts]'
  - name: usesMap
    title: mapの部品を埋めるか
    container: src/cli/embed.ts
    usecase: 文書をHTMLに書き出す
    kind: 関数
    scope: internal
    summary: 文書ごとに `render` を設定と一緒に呼び、返った HTML に `div.mdmark-map` があれば `true` を返す。`prepareEmbeds` が `embeds.map` に入れる
    args:
      - name: options
        type: '{ markdowns: string[]; config: MdmarkConfig }'
        required: true
        description: 埋める文書の Markdown と設定
    returns:
      type: boolean
      description: map の部品をまとめるか
    unit_tests:
      - name: test_uses_map
        case: 正常
        summary: map の範囲があるときだけ
        condition: map の範囲を持つ文書と、持たない文書だけ
        mock: なし
        expected: 前者は `true`、後者は `false`
      - name: test_uses_map_when_disabled
        case: 正常
        summary: 機能を外した文書
        condition: '`features: -map` と map の範囲'
        mock: なし
        expected: '`false`'
