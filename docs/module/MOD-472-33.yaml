id: MOD-472-33
visibility: internal
title: ライブラリ本体 / 公開の入口
lead: 配布物の入口の JavaScript と CSS。JavaScript は公開関数と公開の型を export し、CSS は描いた文書の外観を `@layer mdmark` に入れて持つ。
directory: |-
  ```tree
  src/
  ├── index.ts   # 公開関数 version()・mount()・render()・registerExtension()・collectReferences()・collectMatches()・checkIndex()・buildAliases()・定数 diffModes と公開の型の export
  └── index.css  # 描いた文書と記法の CSS（@layer mdmark）
  ```
notes:
  公開するもの: '`src/index.ts` は `version` に加えて、`mount`（`src/mount.ts`）・`render`（`src/render/index.ts`）・`registerExtension`（`src/extensions.ts`）・`collectReferences`（`src/knowledge/references.ts`）・`collectMatches`（`src/knowledge/matches.ts`）・`checkIndex`（`src/knowledge/check.ts`）・`buildAliases`（`src/knowledge/aliases.ts`）・`mountView`・`mountComments`（`src/mount-parts.ts`）と定数 `diffModes`（`src/diff/source.ts`）を export し、型 `MdmarkConfig`・`MountOptions`・`MountHandle`・`MdmarkColumnsChange`（`src/mount.ts`）・`MdmarkExtension`・`MdmarkExtensionModule`・`MdmarkMarkArgs`・`StandardSchemaV1`・`MdmarkIndex`・`MdmarkIndexDocTag`・`MdmarkIndexRelated`・`MdmarkRelationType`・`MdmarkReferences`・`MdmarkMatches`・`MdmarkMatch`・`MdmarkMatchTarget`・`MdmarkAvoidedMatch`・`MdmarkIndexIssue`・`MdmarkAlias`・`MdmarkAliasType`・`MdmarkAliasSource`・`MdmarkAliasProblem`・`DiffSource`・`DiffRevision`・`DiffMode`（`src/diff/source.ts`）・`MdmarkViewOptions`・`MdmarkViewHandle`（`src/views/spec.ts`）・`MdmarkComment`・`MdmarkCommentDraft`・`MdmarkCommentStore`・`MdmarkCommentsHandle`（`src/comments/spec.ts`）を `export type` で出す。他の関数は export しない。公開の型は markdown-it・sanitize-html の型を参照しない（`dist/index.d.ts` を利用側がその型を入れずに型検査できるようにする）'
