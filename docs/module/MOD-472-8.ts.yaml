id: MOD-472-8
visibility: internal
title: ClaudeCodeプラグイン / セットアップ / 入口 / main.ts
lead: '`setup.js` の入口とサブコマンドの振り分け。'
test_files:
  - tests/unit/src/plugin/setup/main.test.ts
constants:
  - name: SETUP_EXIT
    title: setup.js の終了コード
    container: src/plugin/setup/main.ts
    usecase: 常駐サーバーを起動する
    summary: サブコマンドの終了コード
    entries:
      - key: ok
        value: '0'
        description: 正常
      - key: failed
        value: '1'
        description: 設定を読み込めない・Schema に合わない・ポートが使用されている
      - key: launcherMissing
        value: '2'
        description: 使用する起動の方法（systemd --user・tmux）が使えない
      - key: timedOut
        value: '3'
        description: 待ち受けを待つ上限を超えた
    status: planned
    introduced:
      pr: 354
functions:
  - name: runSetup
    title: setup.js を動かす
    kind: 関数
    container: src/plugin/setup/main.ts
    usecase: 共通
    role: 入口
    summary: サブコマンドを振り分け、結果の JSON を標準出力に 1 行書き、終了コードを返却する
    description: まとめた `plugin/bin/setup.js` を入口として実行したときだけ `process.argv`・`process.env` で呼び、戻り値を終了コードにする（`import.meta.main`）
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ argv: string[]; env: NodeJS.ProcessEnv; pluginRoot: string; version: string; run: RunCommand; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: 引数・環境変数・プラグインの直下・プラグインのビルドで埋めた mdmark のバージョン・コマンドの実行・出力の先
    returns:
      type: Promise<0 | 1 | 2 | 3>
      description: '`SETUP_EXIT` の値'
    process: |-
      1. 先頭の引数でサブコマンドを選び、知らないサブコマンドは使用方法を標準エラーに書き込んで 1 を返却する
      2. 各サブコマンドの関数を呼び、成功なら結果を JSON の 1 行で標準出力に書き込む。`start-server` は `--launcher` を読み、`systemd`・`tmux` 以外の値は使用方法を添えて `SetupError`（1）
      3. `SetupError` は理由と修正方法を標準エラーに書き込み、その終了コードを返却する
    callees:
      - MOD-472-11#functions[readTerminalStatus]
      - MOD-472-6#functions[listConfigKeys]
      - MOD-472-10#functions[writeSettings]
      - MOD-472-10#functions[writeConfig]
      - MOD-472-12#functions[startServer]
    unit_tests:
      - name: test_run_setup
        case: 正常
        summary: status の結果を JSON の 1 行で標準出力に書き込む
        condition: '`argv` が `["status"]`、一時の端末の環境変数'
        mock: 行を配列に貯める `stdout`、終了コード 1 の `run`（tmux が無い）
        expected: 0 を返却し、`stdout` の 1 行を JSON として読み込むと `tmux.available` が `false`
      - name: test_run_setup_when_unknown_command
        case: 異常
        summary: 知らないサブコマンドは 1
        condition: '`argv` が `["foo"]`'
        mock: 行を配列に貯める `stderr`
        expected: 1 を返却し、`stderr` に `status` を含む使用方法が出る
    refs:
      - IF-472-11#
      - IF-472-7#
    status: planned
    introduced:
      pr: 354
