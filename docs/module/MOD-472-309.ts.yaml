id: MOD-472-309
visibility: internal
title: ライブラリ本体 / 部品 / embed.ts
test_files:
  - tests/unit/src/parts/embed.test.ts
constants:
  - name: LOADING_TEXT
    title: 読み込み中の文言
    container: src/parts/embed.ts
    summary: 読み込み中のブロックに出す文字
    value: '"図を読み込んでいます"'
functions:
  - name: renderEmbed
    title: 読み込み中のブロックを描く
    container: src/parts/embed.ts
    kind: 関数
    scope: public
    summary: 部品設計『読み込み中のブロック』の HTML を返却する
    args:
      - name: options
        type: '{ name: string; args?: string[] }'
        required: true
        description: マーカーの名前と引数（既定 `[]`）
    returns:
      type: string
      description: '`<div class="mdmark-embed" data-mdmark-slot="{name}" data-mdmark-args="{args}" role="status">図を読み込んでいます</div>`'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    refs:
      - CMP-472-64#
    unit_tests:
      - name: test_render_embed
        case: 正常
        summary: マーカーの名前と引数を属性に持つ枠を返却する
        condition: '`{ name: "chart", args: ["a", "b"] }`'
        mock: なし
        expected: '`data-mdmark-slot="chart"`・`data-mdmark-args="a b"`・`role="status"`・文字 `図を読み込んでいます`'
      - name: test_render_embed_when_args_have_quote
        case: 正常
        summary: 引数をエスケープする
        condition: '`{ name: "chart", args: ["\"><script>"] }`'
        mock: なし
        expected: '`data-mdmark-args="&quot;&gt;&lt;script&gt;"`'
