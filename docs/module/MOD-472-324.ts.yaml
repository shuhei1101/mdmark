id: MOD-472-324
visibility: internal
title: ライブラリ本体 / 部品 / back-to-top.ts
test_files:
  - tests/unit/src/parts/back-to-top.test.ts
functions:
  - name: renderBackToTop
    title: 先頭へ戻るボタンを描く
    container: src/parts/back-to-top.ts
    summary: 部品設計『先頭へ戻るボタン』の HTML を返却する。アイコンは lucide の arrow-up-to-line（`src/parts/icons.ts` に ArrowUpToLine を追加する）
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ hidden?: boolean }'
        required: false
        description: 部品設計の引数
    returns:
      type: string
      description: '`<button class="mdmark-back-to-top" type="button">` の HTML'
    unit_tests:
      - name: test_render_back_to_top
        case: 正常
        summary: スクリーンリーダー向けの名前とアイコンを持つボタンを返却する
        condition: 引数を指定しない
        mock: なし
        expected: '`type="button"`・`aria-label="先頭へ戻る"`・`title="先頭へ戻る"` を持ち、`hidden` を持たない。中の `svg` が `aria-hidden="true"`'
      - name: test_render_back_to_top_when_hidden
        case: 正常
        summary: hidden を属性に写す
        condition: '`hidden: true`'
        mock: なし
        expected: ボタンが `hidden` 属性を持つ
    refs:
      - CMP-472-34#
    status: planned
    introduced:
