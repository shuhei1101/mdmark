id: MOD-472-303
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / map.syntax.ts
test_files:
  - tests/unit/src/map/map.syntax.test.ts
functions:
  - name: buildMapRanges
    title: mapの範囲を組み立てる
    container: src/map/map.syntax.ts
    usecase: Mermaidと補足で図を描く
    kind: 関数
    scope: internal
    summary: 'コアルール。`map` の範囲を `div.mdmark-map` で囲み、補足を `pre.mdmark-map-data` にする'
    description: |-
      `map` がオンのとき、`<!-- map -->` 〜 `<!-- /map -->` の範囲ごとに mermaid のブロックと補足の HTML コメントを数え、範囲を `div.mdmark-map` の開きと閉じのトークンで囲み、補足を `pre.mdmark-map-data[hidden]` にし、`collectMapStructure` の項目があれば範囲の前に記載の警告（`kind: map`）を差し込む（Mermaid と補足の中身の警告は `dist/map.js` が足す）。

      範囲に付ける属性と中身は次のとおり。

      | 属性・要素 | 値 |
      | --- | --- |
      | `data-map-args` | 印の引数を `parseMapArgs` で読んだ `normalized`（知らないキーは警告にせず落とす） |
      | `pre.mdmark-map-data` の中身 | 補足のマーカーの引数の文字（`map-data:` の後ろから `-->` の前まで）を JSON のまま入れる |
      | `data-map-terms` | `glossary` がオンのとき、`buildDictionary` の辞書で範囲の Mermaid と補足の文字を `findWords` で照合し、意味を持つ用語（エイリアスを除く）を、文字に出たままの用語から意味への JSON にしたもの（該当が無ければ付けない） |
      | `data-map-annotations` | 補足の `notes.{ID}.annotations` が、`collectAnnotations` が番号を振った注記を参照する範囲で、参照する注記のうち定義のある ID から番号への JSON （補足が注記を参照する範囲は、定義のある ID が無くても `{}` で付ける。注記の機能がオフの文書と、補足が注記を参照しない範囲には付けない） |

      図の番号は文書の中の map の範囲の順に 1 から振る（描かない範囲も数える）。
      範囲の中の mermaid のブロックには `data-mdmark-mermaid` と色分けの属性を付けない（`attachMermaid` の対象から外れる）。
      描かない範囲（mermaid のブロックが無い・2 つ以上・補足が 2 つ以上・描けない種類）は `div.mdmark-map` で囲まず、警告だけを差し込む。
      `map` がオフの文書では範囲のマーカーと補足のコメントを落とし、mermaid のブロックは普通の mermaid のコードブロックにする。
      `mermaid` と `map` がオンの文書で、範囲の外の言語 `mermaid` のコードブロックは、`plainMapSourceOf` が値を返したとき、補足を持たない範囲と同じ `div.mdmark-map` で囲み、`data-map-plain` を付ける（図の番号は範囲と通し）。
      `data-map-args` は `{"title": …}` だけで、値は `plainMapSourceOf` の `title`、無ければ `mermaidKindName` の図の種類の名前にする。
      中のコードブロックのソースは `body` にし、`frontMatter` があれば `data-map-front-matter` に入れる。
      `data-map-terms` は範囲と同じく付け、`data-map-annotations` と記載の警告は付けない
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    returns:
      type: void
      description: なし
    callees:
      - MOD-589-1#functions[collectMapStructure]
      - MOD-589-1#functions[plainMapSourceOf]
      - MOD-472-144#functions[mermaidKindName]
    unit_tests:
      - name: test_build_map_ranges
        case: 正常
        summary: 2 つの範囲
        condition: 構成図とシーケンス図の範囲
        mock: なし
        expected: '`div.mdmark-map` が 2 つで `data-map` が `1`・`2`、`data-map-kind` が `flowchart`・`sequenceDiagram`、mermaid のブロックが `data-mdmark-mermaid` を持たない'
      - name: test_build_map_ranges_when_problems
        case: 異常
        summary: 範囲の形の誤り
        condition: 'JSON として読めない引数 `{title: 全体}` と、読めない Mermaid の行と知らない補足のキーを持つ範囲'
        mock: なし
        expected: 範囲の前に記載の警告が 1 つで、引数を JSON で記載する直し方を含み、Mermaid の行と `layuot` は含まない。`div.mdmark-map` がある
      - name: test_build_map_ranges_when_no_mermaid
        case: 異常
        summary: mermaid のブロックが無い
        condition: 補足だけの範囲
        mock: なし
        expected: 記載の警告だけで `div.mdmark-map` が無い
      - name: test_build_map_ranges_when_disabled
        case: 正常
        summary: 機能を外した
        condition: '`features: -map` の文書'
        mock: なし
        expected: '`div.mdmark-map` が無く、mermaid のブロックが `data-mdmark-mermaid` を持つ'
      - name: test_build_map_ranges_when_terms
        case: 正常
        summary: 用語
        condition: 索引に意味を持つ用語 `補足` と意味の無い用語 `図` を持ち、Mermaid のノードの名前が「補足の検査」の範囲
        mock: なし
        expected: '`data-map-terms` が `{"補足": "{意味}"}` で、`図` を含まない。`glossary` をオフにすると `data-map-terms` が無い'
      - name: test_build_map_ranges_when_annotations
        case: 正常
        summary: 補足が参照する注記の番号を範囲に入れる
        condition: '本文で `※[img]` を参照し、補足の `notes.mount.annotations` が `["cond", "img", "missing"]` の範囲と、定義 `※[cond]`・`※[img]` を持つ文書'
        mock: なし
        expected: '`data-map-annotations` が `{"cond":2,"img":1}`。`annotations` をオフにすると `data-map-annotations` が無い。補足の注記の参照が `missing` だけの範囲は `data-map-annotations` が `{}`'
      - name: test_build_map_ranges_when_plain
        case: 正常
        summary: 範囲の外の純粋な Mermaid を map の図にする
        condition: 範囲の外の flowchart と gantt のコードブロック、その後ろに構成図の範囲
        mock: なし
        expected: flowchart が `div.mdmark-map[data-map-plain]` で `data-map` が `1`、`data-map-args` が `{"title":"フローチャート"}`。gantt は `data-mdmark-mermaid` を持つコードブロックのまま。範囲の `data-map` が `2`
      - name: test_build_map_ranges_when_plain_front_matter
        case: 正常
        summary: front matter を除いてタイトルにする
        condition: 'front matter に `title: 受付` と `displayMode: compact` を持つ flowchart のコードブロック'
        mock: なし
        expected: '`data-map-args` が `{"title":"受付"}`、中のコードブロックのソースが `flowchart` から始まる、`data-map-front-matter` が front matter の 4 行'
      - name: test_build_map_ranges_when_plain_config
        case: 正常
        summary: 設定を持つコードブロックは mermaid のまま
        condition: 'front matter に `config:` を持つ flowchart と、1 行目が `%%{init: {"theme": "forest"}}%%` の sequenceDiagram'
        mock: なし
        expected: '`div.mdmark-map` が無く、どちらも `data-mdmark-mermaid` を持つ'
      - name: test_build_map_ranges_when_plain_features_off
        case: 正常
        summary: 機能を外すと範囲の外の map の図にしない
        condition: 'flowchart のコードブロックを、`features: -map` と `features: -mermaid` の文書で描く'
        mock: なし
        expected: '`-map` では `data-mdmark-mermaid` を持つコードブロック、`-mermaid` では `data-mdmark-mermaid` も `data-map-plain` も持たないコードブロック'
lead: 'map の範囲の組み立てを受け持ち、map の範囲の出力を変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:記法
  - name: topic:構文
