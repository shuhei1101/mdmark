id: MOD-472-138
visibility: internal
title: ライブラリ本体 / map / 読み取り / sequence.ts
test_files:
  - tests/unit/src/map/sequence.test.ts
data_models:
  - name: Sequence
    title: シーケンス図の読み取り結果
    container: src/map/sequence.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseSequence` の戻り値'
    properties:
      - name: participants
        type: SequenceParticipant[]
        description: '`participant`・`actor` と、メッセージで初めて出た参加者（`id`・`label`・`actor`）。記載の順'
      - name: messages
        type: SequenceMessage[]
        description: メッセージ（`from`・`to`・`text`・`arrow`・`activation`）。`arrow` は `->`・`-->`・`->>`・`-->>`・`-x`・`--x`・`-)`・`--)`・`<<->>`・`<<-->>`
      - name: fragments
        type: SequenceFragment[]
        description: '複合フラグメントと `rect`（`kind`・`label`・`depth`・`sections`・`start`・`end`）。記載の順（0 から番号を振る）。名前の無い `rect` の `label` は直前の `%% block: 名前` の値'
      - name: notes
        type: SequenceNote[]
        description: ノート（`after`・`placement`・`of`・`text`）
      - name: activations
        type: SequenceActivation[]
        description: 活性化の区間（`id`・`start`・`end`・`depth`）。`+`・`-` と `activate`・`deactivate` から作る
      - name: autonumber
        type: boolean
        description: '`autonumber` の行があるか'
      - name: problems
        type: MapProblem[]
        description: 読めない行と閉じの無いブロック
functions:
  - name: parseSequence
    title: sequenceDiagramを読む
    kind: 関数
    container: src/map/sequence.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`sequenceDiagram` の Mermaid を、参加者・メッセージ・ブロック・ノート・活性化と読めない行の項目に読む'
    scope: public
    args:
      - name: source
        type: string
        required: true
        description: mermaid のブロックの中身
    returns:
      type: Sequence
      description: 読み取り結果
    process: |-
      1. 行ごとに、`participant`・`actor`（`as` の別名）・`autonumber`・`activate`・`deactivate`・`Note`・`loop`・`alt`・`opt`・`par`・`critical`・`break`・`rect`・`else`・`and`・`option`・`end`・`box`・`%% block:`・`%%`・メッセージの行に分けて読む
      2. メッセージは長い矢印から順に照らし、受け手の前の `+`・送り手の `-` で活性化の区間を開閉する
      3. ブロックは開いた順に番号を振り、区切りの行で `sections` を足し、`end` で `end` を記録する
         - 読めない行・閉じの無いブロック・対の無い `deactivate` は `map_invalid` の項目にする
      4. 参加者の名前・メッセージ・ノート・ブロックのラベルを、`decodeEntities` で文字の参照から戻す
    unit_tests:
      - name: test_parse_sequence
        case: 正常
        summary: 全ての記法
        condition: モックの `SEQUENCE`
        mock: なし
        expected: 参加者 5・メッセージ 7・ブロック 3（`rect`・`loop`・`alt`。番号 0・1・2）・ノート 1・活性化 1 で、`autonumber` が `true`、`rect` の `label` が `描く前の準備`
      - name: test_parse_sequence_when_arrows
        case: 正常
        summary: 矢印の種類
        condition: 10 種類の矢印のメッセージを 1 つずつ
        mock: なし
        expected: '`arrow` が記載のとおり'
      - name: test_parse_sequence_when_entity
        case: 正常
        summary: 名前とラベルの文字の参照を文字に戻す
        condition: '`participant A as #35;1#59; 受付`・`A->>A: a#59; b`・`loop #quot;x#quot;`'
        mock: なし
        expected: '参加者の名前が `#1; 受付`、メッセージのラベルが `a; b`、ブロックのラベルが `"x"`'
      - name: test_parse_sequence_when_sections
        case: 正常
        summary: alt の区切り
        condition: '`alt a` `else b` `end`'
        mock: なし
        expected: '`sections` が 2 つで、ラベルが `a`・`b`'
      - name: test_parse_sequence_when_unclosed_block
        case: 異常
        summary: 閉じの無いブロック
        condition: '`loop` の後に `end` が無い'
        mock: なし
        expected: '`problems` に `map_invalid` が 1 件で、ブロックは最後のメッセージまで'
      - name: test_parse_sequence_when_unreadable_line
        case: 異常
        summary: 読めない行
        condition: '`A => B: x`'
        mock: なし
        expected: '`problems` に `map_invalid` が 1 件'
