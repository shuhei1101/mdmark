id: MOD-472-38
visibility: internal
title: ライブラリ本体 / 描画
lead: Markdown を本文の HTML 文字列にする処理。markdown-it で解析し、トークンの段階でマーカーを取得し GitHub Flavored Markdown の不足と画面設計の属性を追加し、sanitize-html で許可していない要素・属性・URL を落とす。DOM に頼らず、ブラウザと Node で同じ文字列を返却する。
directory: |-
  ```tree
  src/render/
  ├── index.ts     # render と renderDocument
  ├── parser.ts    # markdown-it の解析器と、追加するコアルール
  ├── marks.ts     # マーカーを読み込み、置き換えるコアルール
  ├── mark-options.ts # マーカーの引数の JSON の読み取りと、読めない JSON の警告の文
  ├── mark-schema.ts  # マーカーごとの JSON Schema での設定の検証と、点検だけが通知する注記
  ├── legacy-marks.ts # 今の書き方の引数の JSON のオブジェクトへの変換と、文書の書き換え（dist/legacy-marks.js にもまとめる）
  ├── page.ts      # ページの設定のマーカーの読み取り
  ├── frontmatter.ts # 文書の先頭のフロントマターの判定と、本文からの除外（DOM を使用しない）
  ├── sanitize.ts  # sanitize-html の設定と sanitize
  ├── used.ts      # 書き出しで埋める外部ライブラリと範囲のスクリプトを文書から取得する usedLibraryMarks・collectRangeScripts（esbuild を import しない。『CLI』）
  ├── scope-css.ts # 埋め込んだ HTML の範囲の css を範囲の根の要素の中だけに適用する scopeCss（DOM を使用しない）
  └── syntax/      # 記法ごとのコアルール（『記法』）
  ```
