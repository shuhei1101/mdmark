id: MOD-472-38
visibility: internal
title: ライブラリ本体 / 描画
lead: Markdown を本文の HTML 文字列にする処理。markdown-it で解析し、トークンの段階でマーカーを取得し GitHub Flavored Markdown の不足と画面設計の属性を追加し、sanitize-html で許可していない要素・属性・URL を落とす。DOM に頼らず、ブラウザと Node で同じ文字列を返却する。
notes:
  ディレクトリ: |-
    ```tree
    src/render/
    ├── index.ts     # render と renderDocument
    ├── parser.ts    # markdown-it の解析器と、追加するコアルール
    ├── marks.ts     # マーカーを読み込み、置き換えるコアルール
    ├── mark-options.ts # マーカーの引数の JSON の読み取りと、読めない JSON の警告の文
    ├── mark-schema.ts  # マーカーごとの JSON Schema での設定の検証と、点検だけが通知する注記
    ├── legacy-marks.ts # 今の書き方の引数の JSON のオブジェクトへの変換と、文書の書き換え（移行の手順のフォルダの legacy-marks.js にもまとめる）
    ├── page.ts      # ページの設定のマーカーの読み取り
    ├── includes.ts  # 取り込みのパスの解き方・取り込む範囲の選び方・トークンの差し込み
    ├── sanitize.ts  # sanitize-html の設定と sanitize
    └── used.ts      # 書き出しで埋める外部ライブラリと範囲のスクリプトを文書から取得する usedLibraryMarks・collectRangeScripts（esbuild を import しない。『CLI』）
    ```
  コアルールの順: |-
    描画の `createParser` が登録する。
    マーカー → 機能の重ね合わせ → ページの設定 → 取り込み → 蛍光ペン → 脚注の機能のオン・オフ → カードの格子 → 行内のアイコン → 見出し → 用語集の表 → 行の詳細 → ビュー → CSV の表 → 表 → タブ → ステップ → 注意書き → ファイルツリー → バッジ → キー → 本文の文字の色 → 図の部品 → 埋め込んだ HTML → コードブロック → 表の見本の移動 → 画像の属性と種類 → 図表の番号 → ギャラリー → 画像と動画と音声の図 → カード → 段組み → details の範囲 → wide の範囲 → 改ページ → 用語の下線 → セクション → 目次 → 脚注の一覧 → 関連文書の一覧 → タスクリスト → www の自動リンク → 残ったマーカーを取り除く → 元の行番号 → 脚注の定義の取り出し → 記載の警告を集める。
    行の詳細は表の囲みより前、セクションは記法の警告を差し込んだ後、目次は見出しの ID を付けた後。
    埋め込んだ HTML は用語の下線より前に配置し、`html_block` にした中身を用語の下線が重ねて照合しないようにする。
    画像の属性は図表の番号より前に読み込み、図表の番号がギャラリーに番号を指定してからギャラリーを囲む。
    残った画像だけの段落は、その後に図にする
  部品の差し込み方: 中身を持つ部品（セクション・タブ・注意書き・行の詳細・図表の番号・表）は、中身の代わりに `SLOT_MARKER` を指定して HTML を作り、`markOwn` を掛けてから `SLOT_MARKER` の前後で分け、開きと閉じの `html_block` のトークンで中身のトークンを挟む。中身の HTML には `markOwn` を掛けない。見出し・表など Markdown から作ったトークンに付ける記法の属性は、同じトークンに `data-mdmark-own` も付ける。埋め込んだ HTML は例外で、`sanitizeEmbedded` で先に落とした中身にも `markOwn` を掛ける
  記法のコアルールの置き場所: 記法ごとのコアルールは、機能のフォルダの `*.syntax.ts`（『表』『タブ』など）と、複数の記法が使用する助けの『記法の共通』に配置する。
tags:
  - name: action:描画
    main: true
  - name: topic:部品
