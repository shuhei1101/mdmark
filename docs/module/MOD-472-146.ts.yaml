id: MOD-472-146
visibility: internal
title: ライブラリ本体 / バージョンを上げる / migrations.ts
test_files:
  - tests/unit/src/cli/migrations.test.ts
data_models:
  - name: MigrationStep
    title: 移行の手順
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: '`steps.yaml` の `steps` の要素 1 つ。`op` で分けた判別子つきユニオン'
    properties:
      - name: op
        type: '"rename_key" | "set_default" | "map_values" | "replace_mark" | "call"'
        description: 手順の種類。残りのプロパティは種類ごとに ER 図『移行の手順』の必須のとおりに持つ
      - name: description
        type: string
        description: 何をどう変えるかの 1 文
      - name: destructive
        type: boolean
        default: 'false'
        description: 壊すマーカー
      - name: file
        type: '"config" | "index"'
        description: '`rename_key`・`set_default`・`map_values` が書き換える YAML'
      - name: from
        type: string
        description: '`rename_key` の元のキーのパス、`replace_mark` の書き換える前のマーカー'
      - name: to
        type: string
        description: '`rename_key` の新しいキーのパス、`replace_mark` の書き換えた後のマーカー'
      - name: key
        type: string
        description: '`set_default`・`map_values` のキーのパス'
      - name: value
        type: unknown
        description: '`set_default` が追加する値'
      - name: ask
        type: string
        description: '`set_default` が値を聞く質問の文'
      - name: mapping
        type: Record<string, unknown>
        description: '`map_values` の解釈しの表'
      - name: script
        type: string
        description: '`call` のスクリプトの、`steps.yaml` のあるフォルダからの相対パス'
      - name: files
        type: ("config" | "index" | "documents")[]
        description: '`call` が書き換えうるもの'
    refs:
      - ER-472-5#tables[migrations/{バージョン}/steps.yaml]
  - name: MigrationVersion
    title: 適用するバージョン
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 適用する 1 つのバージョンと、そのバージョンの検めた手順
    properties:
      - name: version
        type: string
        description: バージョン（`v{MAJOR}.{MINOR}.{PATCH}`）
      - name: dir
        type: string
        description: そのバージョンのフォルダの絶対パス（`call` のスクリプトの基準）
      - name: steps
        type: MigrationStep[]
        description: 記載した順の手順
  - name: MigrationTarget
    title: 手順の当て先
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 手順を適用する設定・索引・文書の場所と、適用する前に聞いた回答
    properties:
      - name: configPath
        type: string
        description: 設定ファイルの絶対パス
      - name: indexPath
        type: string | undefined
        description: 設定の `index` が指す索引の絶対パス。設定に `index` が無ければ `undefined`
      - name: documents
        type: string[]
        description: '`build` の対象と索引の文書の絶対パス（重なりなし）'
      - name: answers
        type: Map<MigrationStep, string>
        description: '`ask` を持つ `set_default` に回答した値'
constants:
  - name: MIGRATIONS_DIR
    title: 移行の手順のフォルダ
    container: src/cli/migrations.ts
    summary: パッケージの直下からの移行の手順のフォルダと、その中の名前
    entries:
      - key: root
        value: '`migrations`'
      - key: next
        value: '`next`'
      - key: steps
        value: '`steps.yaml`'
      - key: noSteps
        value: '`no-steps.yaml`'
  - name: SCRIPT_EXTENSIONS
    title: スクリプトの拡張子
    container: src/cli/migrations.ts
    summary: '`call` のスクリプトに許す拡張子（`node_modules` の下で実行できるものだけ）'
    value: '`[".js", ".mjs"]`'
functions:
  - name: validateSteps
    title: 移行の手順の構造を検める
    container: src/cli/migrations.ts
    usecase: 共通
    summary: 読み込んだ `steps.yaml` を `schemas/mdmark.steps.schema.json` と同じ構造で検め、手順の並びと合わないところを返却する
    description: 検めるのは、最上位が `steps`（配列）だけを持つこと・各手順の `op` が 5 つのどれかで `description` が空でないこと・`op` ごとの必須のプロパティ・`set_default` が `value` か `ask` のどちらか 1 つだけを持つこと・`replace_mark` の `to` が `from` を含まないこと・`map_values` の解釈しの表の新しい値が元の値に無いこと・`call` の `script` の拡張子が `SCRIPT_EXTENSIONS` のどれかで `files` が 1 つ以上。構造の検査は `validateConfig` と同じく手書きで、ライブラリを追加しない。配布物のビルドもこの関数で検める
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: raw
        type: unknown
        required: true
        description: YAML として読み込んだ値
      - name: file
        type: string
        required: true
        description: 合わないところに出すファイルの名前（`migrations/v0.5.0/steps.yaml` など）
    returns:
      type: '{ steps: MigrationStep[]; problems: string[] }'
      description: '構造の合う手順と、合わないところ 1 つ 1 文（`{ファイル}: steps[{番号}].{キー}: {内容}`）。`problems` が空でなければ `steps` を使用しない'
    unit_tests:
      - name: test_validate_steps
        case: 正常
        summary: 5 つの種類の手順をそのまま返却する
        condition: '`rename_key`・`set_default`（`value`）・`map_values`・`replace_mark`・`call`（`.mjs`）を 1 つずつ持つ値'
        mock: なし
        expected: '`problems` が空で、`steps` が 5 つ'
      - name: test_validate_steps_when_required_missing
        case: 異常
        summary: op の必須のプロパティが無いと合わないところを返却する
        condition: '`replace_mark` が `to` を持たない'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].to` を含む'
      - name: test_validate_steps_when_not_reapplicable
        case: 異常
        summary: もう一度適用すると結果が変わる手順を拒む
        condition: '`to` が `from` を含む `replace_mark` と、新しい値が元の値にある `map_values`'
        mock: なし
        expected: '`problems` が 2 つ'
      - name: test_validate_steps_when_script_ts
        case: 異常
        summary: 拡張子 .ts のスクリプトを拒む
        condition: '`script: move.ts` の `call`'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].script` を含む'
    status: planned
    introduced:
      pr: 39
  - name: loadMigrationVersions
    title: 適用するバージョンを読み込む
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: パッケージの `migrations/` から手元のバージョンより新しく目標のバージョン以下の `v{バージョン}` をバージョンの昇順に読み込み、構造を検めて返却する
    description: '`v{バージョン}` でないフォルダ（`next` を含む）とファイルは飛ばす。`migrations/` が無ければ空の並びを返却する。全てのバージョンを検めてから、合わないところを 1 つの `CliError` にまとめて投げる。`call` のスクリプトはバージョンのフォルダの配下にあることを確認する'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ packageDir: string; from: string; to: string }'
        required: true
        description: パッケージの直下・手元のバージョン・目標のバージョン
    returns:
      type: Promise<MigrationVersion[]>
      description: 適用するバージョンの並び（昇順）
    exceptions:
      - name: CliError
        condition: '`steps.yaml` を読み込めない・構造が合わない、`call` のスクリプトが無いかバージョンのフォルダの外を指す'
        message: 移行の手順に誤りがあります（{合わないところを `、` でつないだもの}）。mdmark をもう一度入れてください。
    unit_tests:
      - name: test_load_migration_versions
        case: 正常
        summary: 範囲のバージョンだけを昇順に返却する
        condition: '`v0.3.0`・`v0.4.0`・`v0.10.0`・`next` のフォルダ、`from: v0.3.0`・`to: v0.10.0`'
        mock: 一時フォルダのパッケージ
        expected: '`v0.4.0`・`v0.10.0` の 2 つ'
      - name: test_load_migration_versions_when_steps_invalid
        case: 異常
        summary: 構造の合わないバージョンがあれば CliError
        condition: '`v0.4.0` の手順が `op` を持たない'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` の文に `migrations/v0.4.0/steps.yaml` と `steps[0].op` が入る'
      - name: test_load_migration_versions_when_script_outside
        case: 異常
        summary: バージョンのフォルダの外を指すスクリプトを拒む
        condition: '`script: ../x.mjs` の `call`'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` を投げる'
    refs:
      - '#functions[validateSteps]'
      - 'MOD-472-148#functions[compareVersions]'
    status: planned
    introduced:
      pr: 39
  - name: renameKey
    title: キーの名前を変える
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: YAML の Document で、元のキーがあり新しいキーが無いときだけ、値とコメントを保って新しいキーへ移す
    description: キーのパスは `.` で区切る。新しいキーが同じ親の下なら元のキーの位置で名前だけを替え、親が違えば新しい親の末尾に移す（無い親は作る）
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: from
        type: string
        required: true
        description: 元のキーのパス
      - name: to
        type: string
        required: true
        description: 新しいキーのパス
    returns:
      type: boolean
      description: 書き換えたら `true`
    unit_tests:
      - name: test_rename_key
        case: 正常
        summary: 同じ親の下で名前を変え、位置とコメントを保つ
        condition: '`build:` の下に `# 書き出す先` のコメントつきの `out` と `include` がある。`build.out` → `build.output`'
        mock: なし
        expected: '`true` を返却し、文字列にすると `output` が `out` の位置にありコメントが残る'
      - name: test_rename_key_when_already_renamed
        case: 正常
        summary: 新しいキーがあれば何もしない
        condition: '`build.output` だけがある'
        mock: なし
        expected: '`false` を返却し、文字列が変わらない'
    status: planned
    introduced:
      pr: 39
  - name: setDefault
    title: 無いキーを追加する
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: キーが無いときだけ値を追加する
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: value
        type: unknown
        required: true
        description: 追加する値
    returns:
      type: boolean
      description: 追加したら `true`
    unit_tests:
      - name: test_set_default
        case: 正常
        summary: 無いキーを追加する
        condition: '`features.diff` が無い。値 `true`'
        mock: なし
        expected: '`true` を返却し、`features.diff` が `true`'
      - name: test_set_default_when_present
        case: 正常
        summary: あるキーは変えない
        condition: '`features.diff: false` がある'
        mock: なし
        expected: '`false` を返却し、値が `false` のまま'
    status: planned
    introduced:
      pr: 39
  - name: mapValues
    title: 値を解釈する
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: キーの値が解釈しの表の元の値のときだけ新しい値に替える
    description: 値が配列のときは要素ごとに替える。比べるのは YAML の値としての一致
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: mapping
        type: Record<string, unknown>
        required: true
        description: 元の値から新しい値への表
    returns:
      type: boolean
      description: 替えたら `true`
    unit_tests:
      - name: test_map_values
        case: 正常
        summary: 表にある値を替え、無い値は残す
        condition: '`build.include: [docs/**/*.md, a.md]`、表 `{ "docs/**/*.md": "**/*.md" }`'
        mock: なし
        expected: '`true` を返却し、`[**/*.md, a.md]`'
      - name: test_map_values_when_no_match
        case: 正常
        summary: もう一度適用しても変わらない
        condition: 替えた後の値に同じ表を適用する
        mock: なし
        expected: '`false` を返却する'
    status: planned
    introduced:
      pr: 39
  - name: replaceMark
    title: マーカーを書き換える
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 文書の本文の `from` を全て `to` にする
    description: 文字列として一致した箇所を替える（正規表現にしない）。`to` は `from` を含まないため、もう一度適用しても結果が変わらない
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: 文書の本文
      - name: from
        type: string
        required: true
        description: 書き換える前のマーカー
      - name: to
        type: string
        required: true
        description: 書き換えた後のマーカー
    returns:
      type: string
      description: 書き換えた本文
    unit_tests:
      - name: test_replace_mark
        case: 正常
        summary: 全てのマーカーを書き換える
        condition: '`<!-- note -->` を 2 つ持つ本文、`<!-- note -->` → `<!-- callout -->`'
        mock: なし
        expected: 2 つとも `<!-- callout -->` になり、他の文字が変わらない
    status: planned
    introduced:
      pr: 39
  - name: stepFiles
    title: 手順が書き換えうるファイル
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 適用する全ての手順が書き換えうるファイルを、設定ファイルを先頭に重なりなく返却する
    description: '設定ファイルはバージョンを書き換えるため手順に関わらず含める。`file: index` と `files` の `index` は索引を、`replace_mark` と `files` の `documents` は文書を追加する。索引が無いときは追加しない'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: versions
        type: MigrationVersion[]
        required: true
        description: 適用するバージョン
      - name: target
        type: MigrationTarget
        required: true
        description: 手順の当て先
    returns:
      type: string[]
      description: 絶対パスの並び
    unit_tests:
      - name: test_step_files
        case: 正常
        summary: 設定・索引・文書を重なりなく返却する
        condition: '`file: index` の `rename_key` と `replace_mark` と `files: [index, documents]` の `call`、文書 2 つ'
        mock: なし
        expected: 設定・索引・文書 2 つの 4 つで、先頭が設定
      - name: test_step_files_when_no_index
        case: 正常
        summary: 索引が無ければ追加しない
        condition: '`indexPath` が `undefined` で `file: index` の手順を持つ'
        mock: なし
        expected: 設定だけ
    status: planned
    introduced:
      pr: 39
  - name: applyStep
    title: 手順を適用する
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 手順 1 つを当て先へ適用する
    description: '`rename_key`・`set_default`・`map_values` は対象の YAML を `parseDocument` で読み込み、`renameKey`・`setDefault`・`mapValues` が書き換えたときだけ `doc.toString({ flowCollectionPadding: false })` で書き込んで戻す。`file: index` で索引が無ければ何もしない。`set_default` の `ask` は `target.answers` の値を YAML の値として読み込んで追加する。`replace_mark` は各文書の本文を `replaceMark` で書き換え、変わった文書だけ書き込んで戻す。`call` は `process.execPath` で `[{スクリプト}, "--config", {設定ファイル}]` を設定ファイルのフォルダで実行し（シェルを経由しない）、標準出力を行に分けて空行を除いた並びを返却する。0 以外で終わったときは、標準エラーの空でない行を `CliError` のメッセージの後ろに改行で続ける。`call` 以外は空の並びを返却する'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 設定・索引・文書を書き換える。`call` は子プロセスを実行する
    args:
      - name: options
        type: '{ step: MigrationStep; version: MigrationVersion; target: MigrationTarget }'
        required: true
        description: 適用する手順・そのバージョン・当て先
    returns:
      type: Promise<string[]>
      description: '`call` のスクリプトが標準出力に書き込んだ行。ほかの手順は空'
    exceptions:
      - name: CliError
        condition: ファイルを読み込めない・記載できない、対象の YAML を読み込めない、`call` のスクリプトが 0 以外で終わった
        message: '{バージョン} の手順「{説明}」に失敗しました（{理由}）。（`call` のスクリプトが標準エラーに書き込んだ行があれば、改行して続ける）'
    unit_tests:
      - name: test_apply_step
        case: 正常
        summary: rename_key で設定のキーの名前を変えて書き込んで戻す
        condition: '`file: config` の `rename_key`（`legacy` → `renamed`）'
        mock: 一時フォルダの設定
        expected: 設定ファイルに `renamed` があり `legacy` が無い
      - name: test_apply_step_when_asked
        case: 正常
        summary: ask の回答を YAML の値として追加する
        condition: '`ask` を持つ `set_default`（`key: count`）、回答 `3`'
        mock: 一時フォルダの設定
        expected: '`count` が数 `3`'
      - name: test_apply_step_when_index_missing
        case: 正常
        summary: '索引が無ければ file: index の手順は何もしない'
        condition: '`indexPath` が `undefined` で `file: index` の `rename_key`'
        mock: 一時フォルダの設定
        expected: 例外を投げず、ファイルが変わらない
      - name: test_apply_step_when_script_fails
        case: 異常
        summary: スクリプトが 0 以外で終わると CliError
        condition: '`process.exit(1)` する `.mjs` を実行する `call`'
        mock: 一時フォルダのスクリプト
        expected: '`CliError` の文にバージョンと手順の説明と終了コード 1 が入る'
      - name: test_apply_step_keeps_flow_style
        case: 正常
        summary: 手順が触らないフロー形式の並びの記載方法を残す
        condition: '`legacy: 1` と `include: ["**/*.md"]` を持つ設定に `rename_key`（`legacy` → `renamed`）'
        mock: 一時フォルダの設定
        expected: '設定ファイルに `include: ["**/*.md"]` がそのまま残る'
      - name: test_apply_step_when_script_prints
        case: 正常
        summary: call のスクリプトの標準出力の行を返却する
        condition: 標準出力に `a`・空行・`b` を書き込んで 0 で終わる `.mjs` を実行する `call`
        mock: 一時フォルダのスクリプト
        expected: '`["a", "b"]` を返却する'
      - name: test_apply_step_when_script_fails_with_stderr
        case: 異常
        summary: call のスクリプトの標準エラーの行を CliError のメッセージに続ける
        condition: 標準エラーに `行を分けてください` を書き込んで 1 で終わる `.mjs` を実行する `call`
        mock: 一時フォルダのスクリプト
        expected: '`CliError` を投げ、メッセージの 2 行目が `行を分けてください`'
    refs:
      - '#functions[renameKey]'
      - '#functions[setDefault]'
      - '#functions[mapValues]'
      - '#functions[replaceMark]'
    status: planned
    introduced:
      pr: 39
