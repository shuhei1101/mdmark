id: MOD-589-3
visibility: internal
title: ライブラリ本体 / 記法の共通 / icon-node.logic.ts
lead: lucide のアイコンの形状（要素の並び）を、24 の格子の svg の文字列にする処理。
functions:
  - name: iconNodeBody
    title: アイコンの形状をsvgの中身にする
    kind: 関数
    container: src/shared/icon-node.logic.ts
    role: 変換
    scope: public
    summary: lucide のアイコンの形状（要素の並び）を、24 の格子の svg の中身の文字列にする
    args:
      - name: node
        type: IconNode
        required: true
        description: lucide のアイコンの形状（要素名と属性の組の並び）
    returns:
      type: string
      description: svg の中身の文字列
    process: |-
      1. 要素ごとに、値が `undefined` でない属性を ` {名前}="{値}"` で並べ、`<{要素名}{属性}></{要素名}>` にする
      2. 要素の順につないで返却する
  - name: iconSvgOf
    title: svgの中身をsvgにする
    kind: 関数
    container: src/shared/icon-node.logic.ts
    role: 変換
    scope: public
    summary: svg の中身を、class `mdmark-icon`・`viewBox="0 0 24 24"`・`aria-hidden="true"` の svg の文字列にする
    args:
      - name: body
        type: string
        required: true
        description: svg の中身の文字列（`iconNodeBody` の結果）
    returns:
      type: string
      description: svg の文字列
  - name: iconNodeSvg
    title: IconNode を svg にする
    container: src/shared/icon-node.logic.ts
    summary: 'Lucide の IconNode を、描画の要素と属性だけを残した `svg.mdmark-icon` の文字にする'
    description: |-
      Lucide の IconNode を、`path`・`circle`・`rect`・`line`・`polyline`・`polygon`・`ellipse` の要素と描画の属性（`d`・`cx`・`cy`・`r`・`rx`・`ry`・`x`・`y`・`x1`・`y1`・`x2`・`y2`・`width`・`height`・`points`）だけを残した `svg.mdmark-icon` の文字にする。
      値はエスケープする
    kind: 関数
    scope: internal
    args:
      - name: node
        type: MdmarkIconNode
        required: true
        description: Lucide の IconNode
    returns:
      type: string
      description: '`<svg class="mdmark-icon"` で始まる HTML'
    unit_tests:
      - name: test_icon_node_svg
        case: 正常
        condition: '`[["path",{d:"M1 1"}],["script",{}],["circle",{cx:"1",onclick:"x"}]]`'
        expected: '`path` と `cx` だけを持つ `circle` を持つ svg で、`script`・`onclick` が無い'
        mock: なし
        summary: 許す要素と属性だけを残す
tags:
  - name: tool:lucide
    main: true
  - name: topic:部品
  - name: tool:svg
test_files:
  - tests/unit/src/shared/icon-node.logic.test.ts
