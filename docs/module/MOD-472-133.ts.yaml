id: MOD-472-133
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / map.part.ts
test_files:
  - tests/unit/src/map/map.part.test.ts
data_models:
  - name: MapFlowArgs
    title: mapの構成図の引数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapの構成図』の引数（`layout`・`notes`・`links`・`collapsed`・`entered`・`selected`・`focus`・`packets`・`dragging`）
    properties:
      - name: styles
        type: MermaidStyles | undefined
        description: Mermaid の `style`・`classDef`・`linkStyle` の色（`readMermaidStyles` の戻り値）。ノードの面・枠線・名前の文字と、線・矢じり・線のラベルの文字に適用する。`color` を持たず `fill` を持つノードの文字は `textColorOn` の色。`changes` を持つノード・線は変更の色を枠線と線に優先し、面と文字の色は `styles` のままにする
      - name: layout
        type: MapLayout
        description: 配置の結果
      - name: notes
        type: Record<string, string> | undefined
        description: 補足の `notes` の ID ごとの説明（ノード・グループ・線）
      - name: annotations
        type: 'Record<string, Array<{ number: number; html: string }>> | undefined'
        description: 補足の `notes.{ID}.annotations` の、要素の ID ごとの注記（番号の順）。持つ要素は、説明を持たなくても持ち主（線の押せる帯・ノードやグループのマーカーのボタン。ER 図の列は `renderMapEr` の説明のボタン）を持ち、持ち主に `id="mdmark-note-owner-{図の通し番号}-{要素の ID}"`（図の通し番号は `id` の `map-` の後ろ）を付けて、`renderDiagramTip` の `annotations` に指定する（ノードと線は `renderFlow` の `annotations` に任せる）。ER 図・状態遷移図・シーケンス図の引数も同じ項目を持つ
      - name: links
        type: Record<string, string> | undefined
        description: '`mapLinkProblems` が許可したノードのリンク先'
      - name: hints
        type: boolean | undefined
        description: '`false` のとき、`notes` の説明と注記のツールチップ・ノードとグループのマーカー・線の `data-tip-owner` を作らず、注記の持ち主の `id` をノードの `span.mdmark-diagram-node-hit`・グループのタイトルのボタン・線の `.map-wire-hit`・ER 図の列の行に付ける。既定は `true`'
      - name: collapsed
        type: string[]
        description: 閉じたグループ
      - name: entered
        type: string | undefined
        description: 中へ入ったグループ
      - name: selected
        type: string[]
        description: 選んだノード
      - name: focus
        type: '{ nodes: string[]; wires: string[] } | undefined'
        description: 強調
      - name: packets
        type: MapPacket[]
        description: データの印
      - name: dragging
        type: string | undefined
        description: 動かしている要素
      - name: shapes
        type: Record<string, MapStateShape> | undefined
        description: ノードの ID ごとの状態遷移図の形状と、アーキテクチャ図の junction。`start`・`end`・`choice`・`junction` は `data-shape` をその値にし、名前と種類の行を出さず、`role="img"` と `aria-label`（開始・終了・分岐・分岐点）を持ちフォーカスを持たない。`note` は種類の行「ノート」
      - name: keep
        type: '{ nodes: string[]; wires: string[] } | undefined'
        description: 選択と強調の代わりに残すノードと線（ほかを薄くする）
      - name: nodeParts
        type: 'Record<string, { head: string; body: string; tips: string }> | undefined'
        description: ノードの ID ごとに、種類の行の末尾（`head`）とノードの末尾（`body`）へ入れる HTML と、そのツールチップ（ER 図の列の開閉のボタンと列の行）
      - name: changes
        type: Record<string, "added" | "changed" | "removed"> | undefined
        description: 部品設計『mapの構成図』の `changes`。ノード・グループに class `map-change-{値}` と右上のバッジ `span.mdmark-map-change`（`data-change`、`aria-hidden`）を付け、押せる要素のスクリーンリーダー向けの名前の末尾に「、{変更の名前}」を追加する。線は線の `path` に class `map-change-{値}` を付ける。色・破線・取り消し線は CSS が持ち、`layout` の `color` と種類の色のインラインの値より優先する
