functions:
  - name: renderMapFlow
    title: mapの構成図のHTML
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapの構成図』の HTML を返却する
    description: |-
      ノードと線（`notes` の説明を `hint`、`links` のリンク先を `href` にする）を `renderFlow` で描き、グループの面とタイトルの行・開閉と中へ入るボタン・閉じたグループを重ねる。
      中へ入ったグループと薄く残したグループのほかは、タイトルの行に動かす帯（`.map-group-bar`）を配置する。

      `notes` に説明を持つグループ（閉じたグループのノードを含む）は、タイトルの右にノードと同じマーカーとツールチップの中身を配置する。

      | 項目 | 値 |
      | --- | --- |
      | マーカー | `button.mdmark-diagram-info.mdmark-diagram-group-info` |
      | `aria-label` | `「{タイトル}」の説明` |
      | 置き場所 | タイトルのボタンの外 |

      ノードと線を押す場所はフォーカスできるボタンにする。
      リンク先を持たず形状が開始・終了・分岐でないノードは、ノードの `div` に `tabindex`・`role` を付けず、ノードの `div` の先頭にノードの全体を覆う `span.mdmark-diagram-node-hit` を入れる。

      | `span.mdmark-diagram-node-hit` の属性 | 値 |
      | --- | --- |
      | `role` | `button` |
      | `tabindex` | `0` |
      | `aria-roledescription` | `ノード` |
      | `aria-keyshortcuts` | 付ける |
      | `aria-label` | ノードの名前。選んでいれば末尾に `（選択中）` |

      種類の行・名前・説明のマーカー・`nodeParts` の中身はその後ろの兄弟として重ね、押せる要素の中に入れない。
      選んだノードの `div` には今と同じく `data-selected` を付ける。

      `styles` の色は、ノードの `div` の `style` 属性の `--map-node-fill`・`--map-node-stroke`・`--map-node-text` と、線の `path` の `stroke`・ラベルの `color` に入れる（明るい配色と暗い配色で変えない）。
      線の `ends` は線の端に線の色の円（`circle`）か×（`cross`）の `marker` を付け、`invisible` の線は線・ラベル・押せる帯を描かない。
      ノードの形状は `data-shape` に持たせ、追加した形状（`lean-right`・`lean-left`・`trapezoid`・`trapezoid-alt`・`double-circle`・`@{ shape }` の形状）は CSS の `clip-path` と外側の枠線で描く（文書など `clip-path` で表せない形状はノードの下に SVG の形状を重ねる）
    scope: public
    callees:
      - MOD-747-1#functions[textColorOn]
      - MOD-472-172#functions[renderFlow]
    args:
      - name: args
        type: MapFlowArgs
        required: true
        description: 部品の引数
    returns:
      type: '{ html: string; tips: string }'
      description: 図の HTML（`html`）と、ノードの説明と用語のツールチップの HTML（`tips`。図の枠の `.mdmark-diagram-box` に配置する）
    unit_tests:
      - name: test_render_map_flow_when_styles
        case: 正常
        summary: style・classDef・linkStyle の色をノードと線に適用し、文字の色をコントラストで決める
        condition: 部品設計『mapの構成図』の状態 `Styled` の引数と、ノード `D` に `changes` の `changed` を重ねたもの
        mock: なし
        expected: '`A` のノードの `style` が面 `#f9f`・枠線 `#c3c`・文字 `#000000`、`D`・`E` が面 `#ffe08a` で文字 `#000000`、2 本目の線が `#d33`。`changed` を重ねた `D` の枠線は `orange` の色で、面は `#ffe08a` のまま'
      - name: test_render_map_flow_when_wire_ends_and_shapes
        case: 正常
        summary: 線の端の丸・×、見えない線、追加した形状を描く
        condition: 部品設計『mapの構成図』の状態 `WireEndsAndShapes` の引数
        mock: なし
        expected: '`--o` の線の終端に円、`--x` の線の終端に×の記号があり、`~~~` の線の `path.mdmark-diagram-wire` と押せる帯とラベルが無い。平行四辺形・台形・二重の円・文書のノードが `data-shape` にそれぞれの形状を持ち、名前が形状の内側に収まる'
      - name: test_render_map_flow
        case: 正常
        summary: グループとノード
        condition: 部品の Default の引数
        mock: なし
        expected: '`[data-group]` が 4 つ、`[data-node]` が 10 で、凡例が無い'
      - name: test_render_map_flow_when_keyboard
        case: 正常
        summary: キーで操作する場所
        condition: '`entered: read` と、`entered` なし'
        mock: なし
        expected: '配置した全てのノードの `span.mdmark-diagram-node-hit` と線の押せる帯が `tabindex="0"`・`role="button"` を持ち、ノードの `div` は `tabindex`・`role` を持たず、`read` の `.map-group-bar` が `entered: read` では無く、`entered` なしではある'
      - name: test_render_map_flow_when_note_node
        case: 正常
        summary: 説明と用語を持つノードの中に、フォーカスできる要素を入れ子にしない
        condition: '`notes` が `{ data: "検査した補足" }`、`terms` が `{ 補足: "意味" }` の Default'
        mock: なし
        expected: '`data` のノードの `div` が `tabindex`・`role` を持たず、先頭の子の `span.mdmark-diagram-node-hit` が `role="button"`・`tabindex="0"`・`aria-roledescription="ノード"`・`aria-label` を持つ。`button.mdmark-diagram-info` と名前の中の `span.mdmark-term` は `span.mdmark-diagram-node-hit` の中に無い。どの `span.mdmark-diagram-node-hit` も、中に `button`・`a`・`[tabindex]` の要素を持たない'
      - name: test_render_map_flow_when_entered
        case: 正常
        summary: 中へ入った
        condition: '`entered: read`'
        mock: なし
        expected: '`read` の外の要素が `map-faded` を持ち、`read` のタイトルが `button` でない'
      - name: test_render_map_flow_when_packets
        case: 正常
        summary: データの印
        condition: '`mount->marker` に `{ direction: both, color: orange, shape: square }`、`marker->data` に `{ direction: forward }` の印'
        mock: なし
        expected: '`mount->marker` の印は四角でオレンジの塗りを持ち、逆向き（`keyPoints="1;0"`）を含む両方向へ流れる。`marker->data` の印は丸で線の色、逆向きを含まない。どの印も `animateMotion` を `repeatCount="indefinite"` で持つ'
      - name: test_render_map_flow_when_unknown_color
        case: 異常
        summary: 知らない色の名前
        condition: '印の `color` が `red;x:y`、グループの色が `blue;x`'
        mock: なし
        expected: 印が線の色で塗られ、グループが色を持たず、出力に `;x:y` と `;x` が無い
      - name: test_render_map_flow_when_terms
        case: 正常
        summary: 用語の下線
        condition: '`terms` が `{"補足": "意味"}` で、ノード `data` の名前が `<b>補足</b>の検査`'
        mock: なし
        expected: ノード `data` の `.mdmark-diagram-node-name` の中に `span.mdmark-term` が 1 つで文字が `補足`、`<b>` は逃がした文字で、`tips` に意味のツールチップと、`notes` の説明のツールチップがある。グループのタイトルに `mdmark-term` が無い
      - name: test_render_map_flow_when_note_terms
        case: 正常
        summary: 説明の中の用語
        condition: '`terms` が `{"補足": "意味"}` で、ノード `layout` と線 `mount->marker` の `notes` が「補足を当てる」'
        mock: なし
        expected: '`tips` の 2 つの説明のツールチップのそれぞれに、`tabindex` を持たない `<span class="mdmark-term">補足</span>` と、末尾の「補足：意味」の行がある'
      - name: test_render_map_flow_when_collapsed_count
        case: 正常
        summary: 閉じたグループのノードの数
        condition: '`collapsed: ["read"]`'
        mock: なし
        expected: '`.map-closed-group[data-group="read"]` の中に「ノード 3 件」がある'
      - name: test_render_map_flow_when_annotations
        case: 正常
        summary: 注記だけを持つ線と、説明と注記を持つノードに持ち主とツールチップの注記の区分を付ける
        condition: '`notes` がノード `judge` の説明だけ、`annotations` がノード `judge` と線 `e1` に注記 1'
        mock: なし
        expected: 'ノード `judge` のマーカーのボタンと線 `e1` の押せる帯が `id="mdmark-note-owner-{図の通し番号}-judge"`・`…-e1` を持ち、`tips` のどちらのツールチップにも見出し `注記 1` の区分がある'
