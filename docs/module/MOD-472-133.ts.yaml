    description: |-
      行が増える関連ごとに `button.map-er-fanout`（「×n」）と、その説明のツールチップを描く。
      置き場所は、両端を除いた区間を長い順に、区間の中ほど → 4 分の 1 → 4 分の 3 の位置で、ラベルの反対側 → ラベルの側の順に試し、どのノードの矩形（`MAP_ER.aside` を含む）とも、`renderMapErMarks` と同じ手順で配置する多重度・ラベルの文字の矩形とも重ならない最初の場所
    scope: public
