  - name: renderMapMindmap
    title: mapのマインドマップのHTML
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapのマインドマップ』の HTML を返却する
    description: |-
      項目を構成図のノードと同じ `div.mdmark-diagram-node` で描き、押せる要素 `span.mdmark-diagram-node-hit`・名前・説明のマーカーを兄弟に並べる。

      | 項目の class・属性 | 付ける項目 |
      | --- | --- |
      | `map-mindmap-item`・`data-node`（`stateKey`）・`data-shape`・`data-side` | 全ての項目 |
      | `map-mindmap-root` | 今の図の根 |
      | `map-mindmap-filled` | `filled` の項目 |

      子を持つ項目には子の側の辺に持ち手 `div.map-mindmap-grip`（開閉の `button[data-mindmap-toggle]` と中へ入る `button[data-mindmap-enter]`）を付ける。
      枝の曲線を SVG の `path.map-mindmap-branch`（`aria-hidden`・`data-branch` に `{親}->{子}`）で描く。
      中へ入ったときは図の上端に根からの道筋 `nav.map-mindmap-trail` を出す。
      選択と案内の強調で残さない項目と曲線に `map-dim` を付ける。

      色は色の名前の文字の色（`colorVar`）を項目と曲線の `--map-mindmap-color` に、`filled` の項目はその色の面の色を `--map-mindmap-fill` に入れ、形状・下線・持ち手・道筋の外観は CSS（`src/index.css`。モックの `docs/mock/refs/649/assets/mindmap.css`）で決める
    scope: public
    args:
      - name: args
        type: MapMindmapArgs
        required: true
        description: 部品の引数
    returns:
      type: MapPart
      description: 図の中身とツールチップの HTML
    process: |-
      1. 項目の押せる要素は `role="button"`・`tabindex="0"`・`aria-roledescription="項目"` と、名前のスクリーンリーダー向けの名前（選んだ項目は末尾に `（選択中）`）を持つ。選んだ項目は `data-selected` を持つ
      2. 開閉のボタンは `aria-expanded` と、「{名前}の子孫を閉じる」・「{名前}の子孫 {数} 件を開く」の名前を持ち、閉じた項目では子孫の数を出す。中へ入るボタンは「{名前}の中へ入る」の名前を持つ
      3. 道筋は `aria-label="根からの道筋"` を持ち、区切りの `›` は `aria-hidden`
      4. 選んだ項目があれば、全体の根からその項目までの項目と曲線、その項目の子孫を残す。選んでおらず `focus` があれば、強調する項目と根からその項目までの項目と曲線を残す
      5. `hints` が `false` のときは、説明のマーカーとツールチップを作らず、注記を持つ項目の押せる要素に持ち主の `id` を付ける
    unit_tests:
      - name: test_render_map_mindmap
        case: 正常
        summary: 項目・持ち手・曲線
        condition: 部品の Default の引数（モックの `MINDMAP`・`MINDMAP_DATA` を全ての項目の大きさ 100 × 40 で配置）
        mock: なし
        expected: '`div.map-mindmap-item` が 14 で、それぞれ `tabindex` を持たず、先頭の子の `span.mdmark-diagram-node-hit` が `role="button"`・`tabindex="0"`・`aria-roledescription="項目"` を持つ。説明のマーカーが 2 つで押せる要素の中に無い。持ち手が 6 つ（根は持たない）で、「体制」の開閉のボタンが `aria-expanded="true"`・名前「体制の子孫を閉じる」、中へ入るボタンが「体制の中へ入る」。`path.map-mindmap-branch` が 13 で `aria-hidden` を持つ'
      - name: test_render_map_mindmap_when_collapsed
        case: 正常
        summary: 閉じた項目
        condition: '`collapsed` が `["体制"]` で配置した引数'
        mock: なし
        expected: 「体制」の開閉のボタンが `aria-expanded="false"`・文字 `3`・名前「体制の子孫 3 件を開く」で、「人手が足りない」が無い
      - name: test_render_map_mindmap_when_entered
        case: 正常
        summary: 枝の中の道筋
        condition: '`entered` が「体制」で配置した引数'
        mock: なし
        expected: '`div.map-mindmap-trail` が `aria-label="根からの道筋"` を持ち、文字が「企画の論点 › 体制」で `›` が `aria-hidden`。「体制」は持ち手を持たない'
      - name: test_render_map_mindmap_when_selected
        case: 正常
        summary: 選んだ項目の道筋と子孫を残す
        condition: '`selected` が「体制」の Default の引数'
        mock: なし
        expected: 「体制」が `data-selected` を持ち、押せる要素の名前が「体制（選択中）」。根・「人手が足りない」は `map-dim` を持たず、「目的」と根（ID `root`）から「目的」への曲線（`data-branch` が `root->a1`）は `map-dim` を持つ
      - name: test_render_map_mindmap_when_hints_off
        case: 正常
        summary: ヒントがオフなら説明のマーカーを作らず、注記の持ち主の id だけを残す
        condition: Default の引数で、`annotations` が「目的」に注記 1、`hints` が `false`
        mock: なし
        expected: '`.mdmark-diagram-info` が無く、`tips` に `role="tooltip"` が無い。「目的」の押せる要素が `id="mdmark-note-owner-1-a1"` を持つ'
      - name: test_render_map_mindmap_when_terms
        case: 正常
        summary: 名前の用語を押せる要素の中に入れない
        condition: 'Default の引数に、`terms` が `{"体制": "意味"}`'
        mock: なし
        expected: 「体制」の名前の中に `span.mdmark-term` があり、`span.mdmark-diagram-node-hit` の中に無い
    refs:
      - IF-472-35#constraints[map のマインドマップ]
  - name: renderMapAxisGrid
    title: mapの軸と格子の配置の図のHTML
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '部品設計『mapの軸と格子の配置の図』。項目・軸・section・線を描き、開閉と選択のボタンを付ける'
    description: |-
      項目を構成図のノードと同じ `div.mdmark-diagram-node`（`map-axis-item`・`data-node` に `stateKey`・`data-shape`）で描き、押せる要素 `span.mdmark-diagram-node-hit`・名前・説明のマーカーを兄弟に並べる。
      軸の目盛り・section の見出しと枠・ブランチの線とブランチ名のボタン・つながりの線・今日の線を SVG と `div` で重ね、section と入れ子のブロックに開閉の `button[data-map-section-toggle]` と中へ入る `button[data-map-section-enter]` を付け、ブロック図の入れ子のブロックの名前を選ぶ `button[data-map-section-select]`（`aria-pressed`）にする。
      中へ入ったときは図の上端に「全体 › {名前}」の `nav.map-axis-trail` を出す。
      選択と強調で残さないものに `map-dim` を付ける。
      形状・棒・顔のマーカー・格子の外観は CSS（`src/index.css`。モックの `docs/mock/refs/653/assets/axis-grid.css`）で決める
    scope: public
    args:
      - name: args
        type: MapAxisGridArgs
        required: true
        description: 部品の引数
    returns:
      type: MapPart
      description: 図の中身とツールチップの HTML
    process: |-
      1. 項目の押せる要素は `role="button"`・`tabindex="0"` と、名前（ガントチャートの棒はタスク名。選んだ項目は末尾に `（選択中）`）のスクリーンリーダー向けの名前を持つ。選んだ項目は `data-selected` を持つ
      2. Git グラフのブランチ名とジャーニーの凡例（図の枠の凡例の行）は `button` で `aria-pressed` と、ブランチ名は `data-map-branch`、凡例は `data-map-actor` にその名前を持つ
      3. 開閉のボタンは `aria-expanded` と「{名前}を開く」「{名前}を閉じる」の名前、中へ入るボタンは「{名前}の中へ入る」の名前を持つ。閉じた項目は 1 行目に名前、2 行目に「（{種類} {数} 件）」を出す
      4. 軸の目盛り・つながりの線・今日の線（`map-axis-today`）・道筋の区切りの `›` は `aria-hidden`、道筋は `aria-label="全体からの道筋"` を持つ
      5. 選んだものがあれば、項目は種類ごとのつながり（ガントチャートの `after` の前後・タイムラインの期間と出来事・Git グラフの祖先・ジャーニーの人の丸・ブロック図の矢印の相手）、ブランチはそのブランチと入った commit、人はその人のタスクを残す。選んでおらず `focus` があれば、強調する項目だけを残す
      6. `hints` が `false` のときは、説明のマーカーとツールチップを作らず、注記を持つ項目の押せる要素に持ち主の `id` を付ける
    unit_tests:
      - name: test_render_map_axis_grid
        case: 正常
        summary: 5 種類の項目と押せる要素
        condition: 部品の Gantt・Timeline・GitGraph・Journey・Block の引数
        mock: なし
        expected: '`div.map-axis-item` がそれぞれ 8・15・10・7・7 で、先頭の子の押せる要素が `role="button"`・`tabindex="0"` を持つ。Git グラフのブランチ名のボタンが 3 つで `aria-pressed="false"`、ガントチャートに今日の線が `aria-hidden` である'
      - name: test_render_map_axis_grid_when_collapsed
        case: 正常
        summary: 閉じた section
        condition: 部品の GanttCollapsed・BlockCollapsed の引数
        mock: なし
        expected: 「開発（タスク 2 件）」と「core（ブロック 2 件）」があり、その開閉のボタンが `aria-expanded="false"`
      - name: test_render_map_axis_grid_when_entered
        case: 正常
        summary: 中へ入ったときの道筋
        condition: 部品の GanttEntered の引数
        mock: なし
        expected: '`nav.map-axis-trail` が `aria-label="全体からの道筋"` を持ち、文字が「全体 › 準備」'
      - name: test_render_map_axis_grid_when_selected
        case: 正常
        summary: 選んだもののつながりを残す
        condition: 部品の GanttSelected・GitBranchSelected・JourneyActorSelected の引数
        mock: なし
        expected: 「設計する」と `after` の前後の 3 つ、feat の commit 2 つ、AI のタスク 3 つのほかの項目が `map-dim` を持ち、「設計する」の押せる要素の名前が「設計する（選択中）」
    refs:
      - IF-472-35#constraints[map のガントチャート]
      - IF-472-35#constraints[map の section の開閉と中へ入る]
  - name: renderMapAxisGridLegend
    title: ジャーニーの人の凡例のHTML
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapの軸と格子の配置の図』のジャーニーの人の凡例を、図の枠の凡例の行に入れる `li` の並びにする。人ごとに `button[data-map-actor]`（`aria-pressed`、人の色の丸と名前）
    scope: public
    args:
      - name: args
        type: '{ grid: AxisGrid; selected: AxisGridSelection | undefined }'
        required: true
        description: 読み取り結果と選んだもの
    returns:
      type: string
      description: 凡例の `li` の HTML
    refs:
      - IF-472-35#constraints[map のジャーニー]
  - name: mapClassTextWidth
    title: クラス図の文字の幅
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: メンバーの等幅の文字の幅を、全角の文字を `MAP_CLASS.charWide`、半角の文字を `MAP_CLASS.charNarrow` として見積もる（DOM を使用しない）
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: メンバーの文字（可視性を除く）
    returns:
      type: number
      description: 見積もった幅（px）
    unit_tests:
      - name: test_map_class_text_width
        case: 正常
        summary: 全角と半角
        condition: '`検索(a)`'
        mock: なし
        expected: '`charWide × 2 + charNarrow × 3`'
  - name: mapClassMemberLines
    title: クラス図のメンバーの行の数
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: メンバーの文字を、クラスの幅から可視性・説明のボタンの列と左右の余白（`MAP_CLASS.memberInset`）を除いた幅で折り返した行の数を、`mapClassTextWidth` の見積もりで求める
    scope: public
    args:
      - name: member
        type: '{ text: string; width: number }'
        required: true
        description: メンバーの文字とクラスの幅
    returns:
      type: number
      description: 行の数（1 以上）
    unit_tests:
      - name: test_map_class_member_lines
        case: 正常
        summary: 収まる行と折り返す行
        condition: '幅 220 で `数: int` と `検索(絞り込み条件, 期間, 件数, 詳細度, 件数のみ) dict`'
        mock: なし
        expected: 1 と、2 以上
  - name: mapClassNodeSize
    title: クラス図のクラスの大きさ
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: クラスのノードの幅と高さ。高さは、メンバーを閉じたクラスとメンバーを持たないクラスは `MAP_CLASS.head`、それ以外は `head` と、メンバーごとの `row + (lines - 1) × line` の和と、区切り線 2 本と `foot`
    scope: public
    args:
      - name: args
        type: '{ width: number; lines: number[]; collapsed: boolean }'
        required: true
        description: クラスの幅、メンバーごとの行の数（属性とメソッドの並び）、メンバーを閉じているか
    returns:
      type: '{ w: number; h: number }'
      description: ノードの大きさ
    unit_tests:
      - name: test_map_class_node_size
        case: 正常
        summary: 折り返した行の高さ
        condition: '`lines` が `[1, 3]` と `[1, 1]`、幅 220'
        mock: なし
        expected: '`[1, 3]` の高さが `[1, 1]` より `MAP_CLASS.line × 2` 大きく、幅がどちらも 220。`collapsed` が `true` なら高さが `MAP_CLASS.head`'
