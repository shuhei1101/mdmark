id: MOD-472-133
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / map.ts
test_files:
  - tests/unit/src/parts/map.test.ts
data_models:
  - name: MapFlowArgs
    title: mapの構成図の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapの構成図』の引数（`layout`・`notes`・`links`・`collapsed`・`entered`・`selected`・`focus`・`packets`・`dragging`）
    properties:
      - name: layout
        type: MapLayout
        description: 配置の結果
      - name: notes
        type: Record<string, string> | undefined
        description: 補足の `notes` の ID ごとの説明（ノード・グループ・線）
      - name: links
        type: Record<string, string> | undefined
        description: '`mapLinkProblems` が許したノードのリンク先'
      - name: collapsed
        type: string[]
        description: 閉じたグループ
      - name: entered
        type: string | undefined
        description: 中へ入ったグループ
      - name: selected
        type: string[]
        description: 選んだノード
      - name: focus
        type: '{ nodes: string[]; wires: string[] } | undefined'
        description: 強調
      - name: packets
        type: MapPacket[]
        description: データの印
      - name: dragging
        type: string | undefined
        description: 動かしている要素
      - name: shapes
        type: Record<string, MapStateShape> | undefined
        description: ノードの ID ごとの状態遷移図の形状。`start`・`end`・`choice` は `data-shape` をその値にし、名前と種類の行を出さず、`role="img"` と `aria-label`（開始・終了・分岐）を持ちフォーカスを持たない。`note` は種類の行「注記」
      - name: keep
        type: '{ nodes: string[]; wires: string[] } | undefined'
        description: 選択と強調の代わりに残すノードと線（ほかを薄くする）
      - name: nodeParts
        type: 'Record<string, { head: string; body: string; tips: string }> | undefined'
        description: ノードの ID ごとに、種類の行の末尾（`head`）とノードの末尾（`body`）へ入れる HTML と、そのツールチップ（ER 図の列の開閉のボタンと列の行）
  - name: MapSequenceArgs
    title: mapのシーケンス図の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapのシーケンス図』の引数
    properties:
      - name: sequence
        type: Sequence
        description: 読み取り結果
      - name: rows
        type: SequenceRow[]
        description: '`sequenceRows` の行'
      - name: participants
        type: string[]
        description: 表示する参加者の順
      - name: collapsed
        type: number[]
        description: 閉じたブロック
      - name: entered
        type: number | undefined
        description: 中だけを描くブロック
      - name: selected
        type: string[]
        description: 選んだ参加者
      - name: focus
        type: '{ message: number } | undefined'
        description: 再生の強調
  - name: MapBandArgs
    title: 案内の帯の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『案内の帯』の引数
    properties:
      - name: mode
        type: '"walkthrough" | "playback"'
        description: モード
      - name: unit
        type: '"message" | "transition" | undefined'
        description: 再生で進める単位（既定 `message`）。`transition` では再生のボタンの名前を `前の遷移`・`次の遷移` にする
      - name: total
        type: number
        description: 手順の数
      - name: index
        type: number | undefined
        description: 今の番号
      - name: title
        type: string
        description: タイトル
      - name: text
        type: string
        description: 説明の文
      - name: auto
        type: boolean
        description: 自動で進めているか
      - name: label
        type: string
        description: 帯の名前
functions:
  - name: renderMapFlow
    title: mapの構成図のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapの構成図』の HTML。ノードと線（`notes` の説明を `hint`、`links` のリンク先を `href` にする）を `renderFlow` で描き、グループの面とタイトルの行・開閉と中へ入るボタン・閉じたグループを重ねる。`notes` に説明を持つグループ（閉じたグループのノードを含む）は、タイトルの右にノードと同じマーカー（`button.mdmark-diagram-info.mdmark-diagram-group-info`。`aria-label` は `「{タイトル}」の説明`。タイトルのボタンの外）とツールチップの中身を配置する。ノードと線を押す場所はフォーカスできるボタンにし、中へ入ったグループと薄く残したグループのほかは、タイトルの行に動かす帯（`.map-group-bar`）を置く
    scope: public
    callees:
      - MOD-472-172#functions[renderFlow]
    args:
      - name: args
        type: MapFlowArgs
        required: true
        description: 部品の引数
    returns:
      type: '{ html: string; tips: string }'
      description: 図の HTML（`html`）と、ノードの説明と用語のツールチップの HTML（`tips`。図の枠の `.mdmark-diagram-box` に配置する）
    unit_tests:
      - name: test_render_map_flow
        case: 正常
        summary: グループとノード
        condition: 部品の Default の引数
        mock: なし
        expected: '`[data-group]` が 4 つ、`[data-node]` が 10 で、凡例が無い'
      - name: test_render_map_flow_when_keyboard
        case: 正常
        summary: キーで操作する場所
        condition: '`entered: read` と、`entered` なし'
        mock: なし
        expected: '配置した全てのノードと線を押す場所が `tabindex="0"`・`role="button"` を持ち、`read` の `.map-group-bar` が `entered: read` では無く、`entered` なしではある'
      - name: test_render_map_flow_when_entered
        case: 正常
        summary: 中へ入った
        condition: '`entered: read`'
        mock: なし
        expected: '`read` の外の要素が `map-faded` を持ち、`read` のタイトルが `button` でない'
      - name: test_render_map_flow_when_packets
        case: 正常
        summary: データの印
        condition: '`mount->marker` に `{ direction: both, color: orange, shape: square }`、`marker->data` に `{ direction: forward }` の印'
        mock: なし
        expected: '`mount->marker` の印は四角でオレンジの塗りを持ち、逆向き（`keyPoints="1;0"`）を含む両方向へ流れる。`marker->data` の印は丸で線の色、逆向きを含まない。どの印も `animateMotion` を `repeatCount="indefinite"` で持つ'
      - name: test_render_map_flow_when_unknown_color
        case: 異常
        summary: 知らない色の名前
        condition: '印の `color` が `red;x:y`、グループの色が `blue;x`'
        mock: なし
        expected: 印が線の色で塗られ、グループが色を持たず、出力に `;x:y` と `;x` が無い
      - name: test_render_map_flow_when_terms
        case: 正常
        summary: 用語の下線
        condition: '`terms` が `{"補足": "意味"}` で、ノード `data` の名前が `<b>補足</b>の検査`'
        mock: なし
        expected: ノード `data` の `.mdmark-diagram-node-name` の中に `span.mdmark-term` が 1 つで文字が `補足`、`<b>` は逃がした文字で、`tips` に意味のツールチップと、`notes` の説明のツールチップがある。グループのタイトルに `mdmark-term` が無い
      - name: test_render_map_flow_when_note_terms
        case: 正常
        summary: 説明の中の用語
        condition: '`terms` が `{"補足": "意味"}` で、ノード `layout` と線 `mount->marker` の `notes` が「補足を当てる」'
        mock: なし
        expected: '`tips` の 2 つの説明のツールチップのそれぞれに、`tabindex` を持たない `<span class="mdmark-term">補足</span>` と、末尾の「補足：意味」の行がある'
      - name: test_render_map_flow_when_collapsed_count
        case: 正常
        summary: 閉じたグループのノードの数
        condition: '`collapsed: ["read"]`'
        mock: なし
        expected: '`.map-closed-group[data-group="read"]` の中に「ノード 3 件」がある'
      - name: test_render_map_flow_when_merged_notes
        case: 正常
        summary: まとめた線の説明
        condition: '`collapsed: ["read"]` で、`notes` が `{"data->layout": "上書きを当てる"}`'
        mock: なし
        expected: '`read->layout` のツールチップが「補足の検査 → 入れ子のグループの自動配置：上書きを当てる」だけを持ち、説明を持たない元の線（`mermaid->layout`）を含まない。`notes` が空なら `read->layout` の押せる帯は `data-tip-owner` を持たない'
      - name: test_render_map_flow_when_links
        case: 正常
        summary: リンク先を持つノードをリンクにし、説明のマーカーをリンクの外に配置する
        condition: '`links` が `{ mount: "https://example.com/spec" }`、`notes` が `{ mount: "文書を描く公開関数" }` の Default'
        mock: なし
        expected: '`mount` のノードが `has-link` と `a.mdmark-diagram-node-link[href="https://example.com/spec"]` を持ち、ノードの `div` は `tabindex` を持たず、`a` が `aria-roledescription="ノード"` と `aria-label="mount"` を持つ。説明のマーカーが `a` の後ろにある。ほかのノードは `a` を持たない'
      - name: test_render_map_flow_when_group_note
        case: 正常
        summary: 説明を持つグループのタイトルの右にマーカーを配置する
        condition: '`notes` が `{ read: "記法を読み取る部分" }` の Default と、`read` を閉じた同じ図'
        mock: なし
        expected: どちらも `read` のタイトルの行に `button.mdmark-diagram-group-info`（`aria-label="「記法の読み取り」の説明"`）があり、`aria-describedby` が指すツールチップの文字が `記法を読み取る部分`。マーカーはタイトルのボタンの中に無く、説明を持たないグループには無い
  - name: renderMapSequence
    title: mapのシーケンス図のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapのシーケンス図』の HTML。参加者の箱・ライフライン・メッセージの線とラベルを `mdmark-diagram-seq-*` の class で描き、ブロックの枠とタブの開閉と名前のボタン・区間・注記・活性化の帯・参加者の選択を重ねる
    description: 寸法は `MAP_SEQ` で決める
    scope: public
    args:
      - name: args
        type: MapSequenceArgs
        required: true
        description: 部品の引数
    returns:
      type: '{ html: string; tips: string }'
      description: 図の HTML（`html`）と、用語のツールチップの HTML（`tips`）
    unit_tests:
      - name: test_render_map_sequence
        case: 正常
        summary: 全ての記法
        condition: 部品の Default の引数
        mock: なし
        expected: ブロックのタブが 3 つで、それぞれ開閉と名前のボタンを持つ
      - name: test_render_map_sequence_when_terms
        case: 正常
        summary: 用語の下線
        condition: '`terms` が `{"補足": "意味"}` で、メッセージの文の 1 つが「補足を読む」'
        mock: なし
        expected: そのメッセージのラベルの中に `span.mdmark-term` があり、`tips` に意味のツールチップがある
      - name: test_render_map_sequence_when_notes
        case: 正常
        summary: メッセージの説明
        condition: '`notes` が `{"2": "補足を渡す"}`、`terms` が `{"補足": "意味"}`'
        mock: なし
        expected: 2 つ目のメッセージ（`data-message="1"`）の `.map-wire-hit` だけが `data-tip-owner` を持ち、`tips` にその持ち主のツールチップがあり、説明の中の `補足` が `tabindex` を持たない `span.mdmark-term` で、末尾に「補足：意味」の行がある
  - name: renderMapErDiagram
    title: mapのER図のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapのER図』。`renderMapFlow` のテーブルのノードに `renderMapEr` の列の行と開閉のボタンを入れ、`renderMapErMarks` の多重度とラベル、`renderMapErFanouts` の行が増える関連のマーカーを重ねる。関連の線は設定の線の種類によらず矢じりを持たず（`..` は破線）、テーブルを 1 つ選んだときはその関連と相手のテーブルを `keep` で残す
    scope: public
    args:
      - name: args
        type: 'MapFlowArgs & { tables: Array<{ name: string; columns: ErColumn[]; notes: Record<string, string> }>; relations: MapErRelation[]; fanouts: MapErFanout[] }'
        required: true
        description: '構成図の部品の引数（`layout` の関連の線は `rewireMapEr` で付け替えた線）と、テーブル・関連・行が増える関連（`{ wire, from, to }`）'
    returns:
      type: MapPart
      description: 図の中身とツールチップの HTML
    unit_tests:
      - name: test_render_map_er_diagram
        case: 正常
        summary: ER 図の部品
        condition: モックの `ER` を配置して `rewireMapEr` で付け替え、「注文」の列 `状態` に説明、`fanouts` に `r1`・`r2`・`r3` を指定する
        mock: なし
        expected: 「注文」のノードに開閉のボタンと列の行があり、`map-er-cardinality` が関連の数の 2 倍、`map-er-label` がラベルを持つ関連の数だけあり、`map-er-fanout` のボタンが 3 つあり、どのボタンの矩形もノードの矩形（`MAP_ER.aside` を含む）と重ならず、ツールチップに列の説明と「行が増える関連」がある
  - name: rewireMapEr
    title: ER図の関連の端の付け替え
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 関連の線の両端を、つなぐ列の行の縦の中ほど（ノードの上端 + `MAP_ER.head` + 行の番号 × `MAP_ER.row` + `MAP_ER.row` の半分）の左右の辺へ付け替える。列を閉じたテーブルと列の無い端は、ノードの縦の中ほどにつなぐ
    scope: public
    args:
      - name: args
        type: '{ layout: MapLayout; tables: Array<{ name: string; columns: Array<{ name: string }> }>; relations: MapErRelation[]; collapsed: string[]; ends?: Record<string, { from?: string; to?: string }> }'
        required: true
        description: 配置の結果・テーブルの列・関連・列を閉じたテーブル・補足の `layout` の `{関連}.ends`
    returns:
      type: MapLayout["wires"]
      description: 付け替えた線
    process: |-
      1. 辺を、補足の `ends` → 元の辺（同じ高さの隣のノードまでの空きが `MAP_ER.crowd` 以上のとき）→ 空きが広い側 → 次の点がある側の順に選ぶ
      2. 同じ列の行から同じ辺へ出る 2 本目からの端は `MAP_ER.shift` ずつ下へずらし、辺から `MAP_ER.endOut`（同じ辺から出る 2 本目からは `MAP_ER.step`（構成図の線どうしの間隔 `MAP_LAYOUT.clearance`）ずつ延ばす）出て元の経路へ戻す。元の辺と反対の辺から出すときは、ノードの上を回って戻す
    unit_tests:
      - name: test_rewire_map_er
        case: 正常
        summary: 関連の端を列の行へ付け替える
        condition: モックの `ER` を配置する
        mock: なし
        expected: '`r1` の「注文」の側の端の y が列 `顧客ID` の行の縦の中ほどで、x が「注文」の左右の辺'
  - name: renderMapErMarks
    title: ER図の多重度とラベルのHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 関連の両端の多重度と、両端を除いた最も長い区間の中ほどのラベルの `svg.map-er-marks`。文字は `data-wire-mark` に関連の ID を持ち、先に配置した多重度と重なる多重度はノードから離れる向きへ、先に配置したラベルと重なるラベルは 1 行分ずつ下へずらす
    scope: public
    args:
      - name: args
        type: '{ layout: MapLayout; relations: MapErRelation[]; dim: ReadonlySet<string> }'
        required: true
        description: 配置の結果・関連・薄くする関連の ID
    returns:
      type: string
      description: SVG の HTML
  - name: renderMapErFanouts
    title: 行が増える関連のマーカーのHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 行が増える関連ごとに `button.map-er-fanout`（「×n」）と、その説明のツールチップを描く。置き場所は、両端を除いた区間を長い順に、区間の中ほど → 4 分の 1 → 4 分の 3 の位置で、ラベルの反対側 → ラベルの側の順に試し、どのノードの矩形（`MAP_ER.aside` を含む）とも重ならない最初の場所
    scope: public
    args:
      - name: args
        type: '{ layout: MapLayout; fanouts: MapErFanout[]; id: string }'
        required: true
        description: 配置の結果・行が増える関連・ツールチップの id の頭
    returns:
      type: MapPart
      description: マーカーとツールチップの HTML
  - name: renderMapStateDiagram
    title: mapの状態遷移図のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapの状態遷移図』。`shapes` を指定した `renderMapFlow` に、`renderMapStateLoops` の同じ状態への遷移を重ねる
    scope: public
    args:
      - name: args
        type: 'MapFlowArgs & { shapes: Record<string, MapStateShape>; loops: MapStateLoop[] }'
        required: true
        description: 構成図の部品の引数と、形状・同じ状態への遷移（`{ wire, node, label }`）
    returns:
      type: MapPart
      description: 図の中身とツールチップの HTML
    unit_tests:
      - name: test_render_map_state_diagram
        case: 正常
        summary: 状態遷移図の部品
        condition: モックの `STATE` を `statePartInputs` の上書きで配置する
        mock: なし
        expected: '`start_root` が `data-shape="start"` と `aria-label="開始"` を持ち `tabindex` を持たず、`data-shape="choice"` のノードがあり、注記のノードの種類の行が「注記」で、同じ状態への遷移の `g` が `loops` の数だけある'
  - name: renderMapStateLoops
    title: 同じ状態への遷移の層のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 同じ状態への遷移ごとの `renderMapState` を並べた `svg.map-state-loops`
    scope: public
    args:
      - name: args
        type: '{ layout: MapLayout; loops: MapStateLoop[]; active: ReadonlySet<string>; dim: ReadonlySet<string> }'
        required: true
        description: 配置の結果・同じ状態への遷移・再生で今の遷移・薄くする遷移
    returns:
      type: string
      description: SVG の HTML
  - name: renderMapEr
    title: mapのER図の列の行のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapのER図』のテーブルのノードの中身。列ごとにキー・名前・型・説明のボタンの行（テーブル名の行の下 `MAP_ER.head` から `MAP_ER.row` の高さで並べる）と、テーブル名の行の列の開閉のボタン（`data-node-toggle`）を描く
    scope: public
    args:
      - name: table
        type: '{ name: string; columns: ErColumn[]; notes: Record<string, string>; collapsed: boolean }'
        required: true
        description: テーブルと、列ごとの説明（補足の `{テーブル}.{列}` かコメント）と、列を閉じているか
    returns:
      type: '{ toggle: string; columns: string; tips: string }'
      description: 開閉のボタン・列の行・説明のツールチップの HTML
    unit_tests:
      - name: test_render_map_er
        case: 正常
        summary: 列の行
        condition: 部品の Default の「注文」
        mock: なし
        expected: '`div.map-er-column` が 8 つで、`状態` の行に説明のボタンがあり、開閉のボタンが `aria-expanded="true"`'
      - name: test_render_map_er_when_collapsed
        case: 正常
        summary: 列を閉じた
