  - name: rewireMapArchitecture
    title: アーキテクチャ図の線の再計算
    kind: 関数
    container: src/map/map.part.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 線を、指定の辺の中ほどから `MAP_ARCH.endOut`（16px）外へ出た 2 点を直角につなぐ経路に再計算する。2 点は、出る辺と入る辺がどちらも左右なら中ほどの縦の区間で、どちらも上下なら中ほどの横の区間で、左右と上下の組なら 1 回だけ折れてつなぐ（折れる点の 2 つの候補のうち、両端の矩形の中を通らない方）
    scope: public
    args:
      - name: args
        type: '{ layout: MapLayout; edges: ArchEdge[]; collapsed: string[]; ends?: Record<string, { from?: string; to?: string }> }'
        required: true
        description: 配置の結果・線の辺の指定・閉じた group・補足の `layout` の `{線}.ends`
    returns:
      type: MapLayout["wires"]
      description: 再計算した線
    process: |-
      1. 辺を、補足の `ends` → Mermaid の辺の指定の順に選ぶ
      2. `{group}` を持つ端は、その service を含む group の枠を、閉じた group の中の service の端と閉じた group を指す端は、閉じたノードを端の矩形にする
    unit_tests:
      - name: test_rewire_map_architecture
        case: 正常
        summary: 辺の指定と group の端
        condition: モックの `ARCH` を配置する
        mock: なし
        expected: '`r3` の始点が `api` の下の辺の中ほど、終点が `worker` の上の辺の中ほどで、点が全て縦か横の区間でつながる。`r4` の始点が `app` の枠の右の辺の中ほどで、`ends` で上の辺へ入る `r2` の終点が `api` の上の辺の中ほどで、`r2` のどの区間も `api` の矩形の中を通らない'
