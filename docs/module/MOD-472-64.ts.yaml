id: MOD-472-64
visibility: internal
title: VS Code 拡張機能 / Webview / use-document-view.ts
test_files:
  - tests/unit/vscode/src/webview/features/preview/panel/hooks/use-document-view.browser.test.tsx
functions:
  - name: useDocumentView
    title: 描いた文書を持つ
    kind: フック
    container: vscode/src/webview/features/preview/panel/hooks/use-document-view.ts
    usecase: 共通
    summary: '`useState` の初期化で `createDocumentView` と、描く先の要素の ref のコールバック（`attach`・後始末で `detach`）を 1 回だけ作る。ref のコールバックは描画をまたいで同じ関数で、再描画で `detach` が走らない（React Compiler のメモ化に頼らない）'
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; savedLine?: number }'
        required: true
        description: 描く先を包む要素と保存した行
    returns:
      type: '{ view: DocumentView; documentRef: RefCallback<HTMLDivElement> }'
      description: 描いた文書と、描く先の要素に指定する ref
    unit_tests:
      - name: test_use_document_view
        case: 正常
        summary: 再描画しても同じ view で文書を残し、削除すると detach する
        condition: '`documentRef` を描く先の要素に指定する部品で描き、2 回再描画した後に文書を描き、さらに 2 回再描画してから `unmount`'
        mock: なし
        expected: '`view` が同じ値で、文書を描いた後の再描画では `destroy` されず、`unmount` の後に 1 回だけ `destroy` される'
    callees:
      - 'MOD-472-59#classes[DocumentView]'
    status: planned
