id: MOD-472-297
visibility: internal
title: ライブラリ本体 / 記法 / details.ts
test_files:
  - tests/unit/src/render/syntax/details.test.ts
functions:
  - name: buildDetailsRanges
    title: details の範囲にする
    container: src/render/syntax/details.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。`details` がオンなら、`<!-- details: {"title": "…"} -->` 〜 `<!-- /details -->` を `readDetailsOptions` のタイトルと開閉で部品『details の範囲』にする。閉じのマーカーが無いときは警告を差し込んで囲まない。`summary` は見出しのトークンにしない'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readDetailsOptions]'
      - MOD-472-325#functions[renderCollapsible]
    unit_tests:
      - name: test_build_details_ranges
        case: 正常
        condition: '`<!-- details: {"title": "補足"} -->` と `<!-- details: {"title": "実行の例", "open": true} -->` の範囲'
        expected: '`<details class="mdmark-collapsible"><summary>補足</summary>` と、`open` を持つ `実行の例` の `details`'
        mock: なし
        summary: タイトルと開閉を適用する
      - name: test_build_details_ranges_when_unclosed
        case: 異常
        condition: '閉じのマーカーの無い `<!-- details: {"title": "補足"} -->`'
        expected: '`details` が無く、`<!-- /details -->` を含む記載の警告がある'
        mock: なし
        summary: 閉じのマーカーが無いと囲まずに警告する
  - name: readDetailsOptions
    title: details のマーカーを読み込む
    container: src/render/syntax/details.ts
    kind: 関数
    scope: internal
    summary: マーカーの設定の `title`（空の文字か省くと `詳細`）と `open`（省くと `false`）を読み込む
    args:
      - name: options
        type: MarkOptions
        required: true
        description: マーカーの設定（`validateMarkOptions` を経た値）
    returns:
      type: '{ title: string; open: boolean }'
      description: タイトルと開閉
    unit_tests:
      - name: test_read_details_options
        case: 正常
        condition: '`{"title": "補足"}`・`{"title": "実行の例", "open": true}`・`{}`'
        expected: '`{ title: "補足", open: false }`・`{ title: "実行の例", open: true }`・`{ title: "詳細", open: false }`'
        mock: なし
        summary: タイトルと開閉を読み込む
