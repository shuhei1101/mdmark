id: MOD-472-66
visibility: internal
title: VS Code 拡張機能 / Webview / use-scroll-sync.ts
test_files:
  - tests/unit/vscode/src/webview/features/preview/panel/hooks/use-scroll-sync.browser.test.tsx
functions:
  - name: useScrollSync
    title: スクロールを通知する
    kind: フック
    container: vscode/src/webview/features/preview/panel/hooks/use-scroll-sync.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: '`window` の `scroll` を `requestAnimationFrame` ごとに 1 回にまとめ、`view.takeScroll()` が行を返却したときだけ `revealLine` を送信し、続けて `currentPosition()` が数なら `setState({ line })` で保存する'
    description: 自分が発生させたスクロールでも保存する。最初の `render` で保存した行へ戻すまでは `currentPosition()` が `undefined` のため保存しない
    scope: public
    args:
      - name: options
        type: '{ view: DocumentView; api: VsCodeApi }'
        required: true
        description: 描いた文書と API
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_use_scroll_sync
        case: 正常
        summary: スクロールするたびに見えている先頭の行を送信して保存し、描く前は保存しない
        condition: '`render` の前に `scroll` を発火し、`render` の後に元の行番号 30 の見出しが先頭に来るまでスクロールして次のフレームまで待つ'
        mock: '`api` を `postMessage`・`setState` を記録する代役にする。mdmark を代役にする'
        expected: '`render` の前の `scroll` では `setState` が呼ばれない。`revealLine` が 30 で送信され、最後の `setState` の `line` が 30 との差が 0.05 未満'
    refs:
      - IF-472-17#constraints[通知の間引き]
    status: planned
