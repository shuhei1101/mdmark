id: MOD-472-237
visibility: internal
title: ライブラリ本体 / 操作 / code-fold-logic.ts
test_files:
  - tests/unit/src/code-fold-logic.test.ts
functions:
  - name: measureIndents
    title: 行のインデントのレベルを決める
    container: src/code-fold-logic.ts
    kind: 関数
    scope: internal
    summary: 行の頭の空白から、コードブロックの中で最も小さいインデントの幅（空白の数）を 1 レベル、タブを 1 レベルとしてレベルを決める。空白だけの行と空行は `undefined`
    args:
      - name: texts
        type: string[]
        required: true
        description: 行の文字
    returns:
      type: Array<number | undefined>
      description: 行ごとのレベル（インデントの無い行は 0）
    unit_tests:
      - name: test_measure_indents
        case: 正常
        summary: 最も小さい幅を 1 レベルにする
        condition: '`a:`・`  b:`・`    c: 1`・空行・`\td`'
        mock: なし
        expected: '`[0, 1, 2, undefined, 1]`'
      - name: test_measure_indents_when_four_spaces
        case: 正常
        summary: 4 つの空白を 1 レベルにする
        condition: '`{`・`    a`・`        b`・`}`'
        mock: なし
        expected: '`[0, 1, 2, 0]`'
    status: planned
    introduced:
      pr: 275
  - name: foldLinesOf
    title: 畳む行の数を決める
    container: src/code-fold-logic.ts
    kind: 関数
    scope: internal
    summary: 次の空でない行がより深い行を畳める行とし、その後ろの、次の同じ深さ以下の行の手前までの行の数を返却する（範囲の末尾の空行は含めない）
    args:
      - name: indents
        type: Array<number | undefined>
        required: true
        description: '`measureIndents` のレベル'
    returns:
      type: Array<number | undefined>
      description: 行ごとの畳む行の数。畳めない行は `undefined`
    unit_tests:
      - name: test_fold_lines_of
        case: 正常
        summary: 入れ子の畳む行の数を決め、閉じ括弧の行を含めない
        condition: '`[0, 1, 2, 1, 0]`'
        mock: なし
        expected: '`[3, 1, undefined, undefined, undefined]`'
      - name: test_fold_lines_of_when_trailing_blank
        case: 正常
        summary: 範囲の末尾の空行を含めない
        condition: '`[0, 1, undefined, 0]`'
        mock: なし
        expected: '`[1, undefined, undefined, undefined]`'
    status: planned
    introduced:
      pr: 275
  - name: hiddenLinesOf
    title: 隠す行を決める
    container: src/code-fold-logic.ts
    kind: 関数
    scope: internal
    summary: 畳んだ行の後ろの畳む行の数の行を、隠す行にする。内側の畳んだ状態は外側を開いても残る
    args:
      - name: options
        type: '{ foldLines: Array<number | undefined>; folded: boolean[] }'
        required: true
        description: 行ごとの畳む行の数と、畳んでいるか
    returns:
      type: Set<number>
      description: 隠す行の位置（0 から）
    unit_tests:
      - name: test_hidden_lines_of
        case: 正常
        summary: 外側を開いても内側の畳んだ行を隠す
        condition: '`foldLines` が `[3, 1, undefined, undefined]`、`folded` が `[false, true, false, false]`'
        mock: なし
        expected: '`{2}`'
      - name: test_hidden_lines_of_when_outer_folded
        case: 正常
        summary: 外側を畳むと範囲の行を全て隠す
        condition: 同じ `foldLines` と `folded` が `[true, true, false, false]`
        mock: なし
        expected: '`{1, 2, 3}`'
    status: planned
    introduced:
      pr: 275
  - name: guideRangeOf
    title: 縦線を濃くする範囲を決める
    container: src/code-fold-logic.ts
    kind: 関数
    scope: internal
    summary: 行を含む最も内側の畳める範囲（畳める行の後ろの畳む行の数の行）を返却する。深さは範囲の畳める行の `indents` のレベルに 1 を追加した値
    args:
      - name: options
        type: '{ indents: Array<number | undefined>; foldLines: Array<number | undefined>; index: number }'
        required: true
        description: 行ごとの `measureIndents` のレベルと畳む行の数、ポインターを乗せた行の位置（0 から）
    returns:
      type: '{ from: number; to: number; depth: number } | undefined'
      description: 範囲の最初と最後の行の位置と深さ。含む範囲が無ければ `undefined`
    unit_tests:
      - name: test_guide_range_of
        case: 正常
        summary: 最も内側の範囲を返却する
        condition: '`indents` が `[0, 1, 2, 1]`、`foldLines` が `[3, 1, undefined, undefined]` で `index` が 2'
        mock: なし
        expected: '`{ from: 2, to: 2, depth: 2 }`'
      - name: test_guide_range_of_when_level_skipped
        case: 正常
        summary: レベルを飛ばしたインデントでも深さをレベルから決める
        condition: '`indents` が `[0, 2, 2]`、`foldLines` が `[2, undefined, undefined]` で `index` が 1'
        mock: なし
        expected: '`{ from: 1, to: 2, depth: 1 }`'
      - name: test_guide_range_of_when_outside
        case: 正常
        summary: 範囲の外の行は undefined
        condition: 同じ `indents`・`foldLines` で `index` が 0
        mock: なし
        expected: '`undefined`'
    status: planned
    introduced:
      pr: 275
