id: MOD-472-195
visibility: internal
title: ライブラリ本体 / 差分 / revision-picker.ts
test_files:
  - tests/unit/src/parts/revision-picker.test.ts
functions:
  - name: renderRevisionPicker
    title: リビジョンの選択を描く
    container: src/parts/revision-picker.ts
    summary: 部品設計『リビジョンの選択』の HTML を返却する。項目の文字は `Intl.DateTimeFormat`（`ja-JP`・`Asia/Tokyo`）の日時に `label` と `author` を続ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ revisions: DiffRevision[]; before: string; after: string; counts?: { del: number; add: number }; idPrefix: string }'
        required: true
        description: 部品設計の引数と、`label` と `select` を結ぶ `id` の頭
    returns:
      type: string
      description: 2 つの `select` と数の文（`role="status"`）の HTML。前の欄の一番新しい項目と、後の欄の `before` 以前の項目は `disabled`
    unit_tests:
      - name: test_render_revision_picker
        case: 正常
        summary: 選んだリビジョンと選べない項目を出す
        condition: 部品設計の状態 `Normal` の引数
        mock: なし
        expected: 前の欄で `r2`、後の欄で `r3` が選ばれ、前の欄の `r3` と後の欄の `r2`・`r1` が `disabled`。項目の文字が `2026/10/19 16:40 件数を修正する（鈴木）`。数の文が `削除した行 1・追加した行 8`
    refs:
      - CMP-472-32#
