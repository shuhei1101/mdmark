id: MOD-472-99
visibility: internal
title: VS Code 拡張機能 / 書き出し / export.ts
enums:
  - name: ExportMode
    title: 書き出しの使用方法
    container: vscode/src/export/export.ts
    usecase: HTMLに書き出す
    summary: 書き出した後に何をするか
    values:
      - value: export
        title: 書き出す
        description: 書き出した通知を出す（`mdmark.exportHtml`）
      - value: browser
        title: ブラウザで開く
        description: 通知を出さず `env.openExternal` で開く（`mdmark.openInBrowser`）
      - value: print
        title: PDF に印刷
        description: 印刷を待つ処理を追加して記載し、通知を出さずに開く（`mdmark.printToPdf`）
    status: planned
functions:
  - name: exportMarkdown
    title: Markdown を書き出す
    kind: 関数
    container: vscode/src/export/export.ts
    usecase: HTMLに書き出す
    summary: '`mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf` の本体。バージョンと設定を決めて HTML を書き込み、`mode` に合わせて通知するか開く'
    scope: public
    is_async: true
    side_effects: 書き出す先に `{Markdown の名前}.html` を書き込む（あれば上書きする）。`mdmark.version` が `latest` のときはタグ一覧を 1 回取り `mdmark.lastVersion` を書き換える
    args:
      - name: options
        type: '{ document: TextDocument; mode: ExportMode; deps: ExtensionDeps }'
        required: true
        description: 書き出す Markdown・使用方法・`PreviewManager` と同じ依存（`globalState` を持つ `ExtensionContext`・配布物の配信元・タグ一覧の取得先・ログの出力先）
    returns:
      type: Promise<Uri | undefined>
      description: 書き出した HTML。書き出せなかったときは `undefined`
    process: |-
      1. 読み込むバージョンを決める（読み込むバージョンを決める）
         - `undecidable` の場合、画面設計の「バージョンを決められない通知」を `showErrorMessage` で出し、`undefined` を返却する
         - `fetched` が `true` の場合、`mdmark.lastVersion` に記載する
      2. 設定ファイルを読み込み（設定ファイルを読み込む。`purpose: export`、`cwd` は Markdown のフォルダ、`baseDir` は Markdown を含むワークスペースのフォルダ、`env` は `process.env`、`home` は `os.homedir()`）、相対パスの `libraries`・`html-scripts.url`・`mermaid.url` を `getText()` の全文で判定して埋め（相対パスのライブラリを埋める。`bundle` は拡張をまとめる。まとめられないものは `[warn]` を出す）、相対パスの `syntax.url` の本体と使用する言語のモジュールを `getText()` の全文で判定してまとめ（相対パスの色分けのライブラリを埋める。まとめられないものは `[warn]` を出す。返却した `syntax` で書き出す `config.syntax` を置き換える）、`theme` の CSS を読み込んで `<style>` に、`extensions` を拡張をまとめる（拡張をまとめる）でまとめて、それぞれを描く前に登録するスクリプトとして埋める（まとめられない拡張は `[warn]` を出して飛ばす）。`problem` があるときはそのファイルを重ねずに書き出す。続けて `mdmark.colorTheme` で上書きする（テーマの設定で上書きする）。`aliasIssues` は 1 件ずつ、プレビューと同じくずれを 1 行にした値で出力チャネルに書き込む
         - `[warn]` 設定ファイルを読み込めないため設定なしで書き出す（パス・行・`message`）
         - `[warn]` エイリアスのずれ（`aliasIssues` の 1 件ずつ、ずれを 1 行にした値）
         - `[warn]` ライブラリをまとめられない（パス・誤り）
      3. 書き出す先を決め（書き出す先を決める）、`getText()` の全文で HTML を組み（書き出す HTML を組む。`print` は `mode` が `print` のとき、`importMap` は相対パスの色分けのライブラリを埋めるが返却した `imports`、`aliases` は設定ファイルを読み込むが返却した `aliases`）、記載する（一時ファイルから置き換える）
         - 記載できない場合、画面設計の「書き出せない通知」を `showErrorMessage` で出し、`undefined` を返却する
           - `[error]` HTML を書き出せない（パス・誤り）
         - `[info]` HTML を書き出した（パス・バージョン・`mode`）
      4. `mode` で分ける
         - `export` の場合、「書き出した通知」を出す（待たずに返却する）。「ブラウザで開く」が押されたら `env.openExternal` で開く
         - `browser`・`print` の場合、`env.openExternal` で開く
      5. 書き出した HTML の `Uri` を返却する
    callees:
      - MOD-472-22#functions[decideVersion]
      - MOD-472-104#functions[loadConfig]
      - MOD-472-92#functions[distUrl]
      - 'MOD-472-100#functions[resolveExportPath]'
      - 'MOD-472-100#functions[buildExportHtml]'
      - 'MOD-472-101#functions[writeFileAtomically]'
      - MOD-472-106#functions[bundleExtensions]
      - 'MOD-472-102#functions[embedLocalLibraries]'
      - MOD-472-102#functions[embedLocalSyntax]
    refs:
      - IF-472-15#
      - IF-472-15#constraints[エイリアス]
      - IF-472-18#
      - IF-472-16#
      - SCR-472-1#elements[書き出した通知]
      - SCR-472-1#elements[書き出せない通知]
      - SCR-472-1#elements[バージョンを決められない通知]
    status: planned
