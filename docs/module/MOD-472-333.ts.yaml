id: MOD-472-333
visibility: internal
title: ライブラリ本体 / 部品 / footnote.ts
test_files:
  - tests/unit/src/parts/footnote.test.ts
functions:
  - name: renderFootnoteRef
    title: 脚注の番号を描く
    container: src/parts/footnote.ts
    kind: 関数
    scope: internal
    summary: 部品設計『脚注の番号』の HTML を返却する。`bodies` のどれかが `<a ` を持つときはツールチップを `role="group"`・`aria-label="脚注 {number}"` にして番号のリンクから `aria-details` で指し、持たないときは `role="tooltip"` にして `aria-describedby` で指す。`bodies` は描いた HTML なのでエスケープしない
    args:
      - name: options
        type: '{ number: number; refIndex?: number; bodies: string[]; below?: boolean; kind?: "footnote" | "annotation"; afterRef?: boolean }'
        required: true
        description: 部品設計の引数（`refIndex` の既定は 0、`below`・`afterRef` の既定は `false`、`kind` の既定は `footnote`）
    returns:
      type: string
      description: '`<sup class="mdmark-fn-ref">` の HTML'
    unit_tests:
      - name: test_render_footnote_ref
        case: 正常
        summary: 番号のリンクと role tooltip のツールチップを組む
        condition: 部品設計の `Closed`
        mock: なし
        expected: '`a.mdmark-fn-link` が `id="mdmark-fnref-1-0"`・`href="#mdmark-fn-1"`・`aria-describedby="mdmark-fn-tip-1-0"` を持ち、中に視覚で隠す `脚注 ` と `1`。`span.mdmark-fn-tip` が `role="tooltip"` で、タイトル `脚注 1` と `span.mdmark-fn-tip-body` 1 つを持つ'
      - name: test_render_footnote_ref_when_link
        case: 正常
        summary: 中身がリンクを持つと role group にする
        condition: 部品設計の `WithLink`
        mock: なし
        expected: ツールチップが `role="group"`・`aria-label="脚注 1"` で、番号のリンクが `aria-details="mdmark-fn-tip-1-0"` を持ち `aria-describedby` を持たない
      - name: test_render_footnote_ref_when_below
        case: 正常
        summary: below で is-below を付け、refIndex を id に使用する
        condition: '`number: 12`・`refIndex: 1`・`below: true`'
        mock: なし
        expected: '`sup` が class `is-below` を持ち、`id="mdmark-fnref-12-1"`・`id="mdmark-fn-tip-12-1"`'
      - name: test_render_footnote_ref_when_annotation
        case: 正常
        summary: kind annotation で注記のマーカーにする
        condition: 部品設計の `Annotation`
        mock: なし
        expected: '`sup` が class `mdmark-note-ref` を持ち、リンクが `id="mdmark-noteref-1-0"`・`href="#mdmark-note-1"` で、中に視覚で隠す `注記 ` と `1`。ツールチップの `id` が `mdmark-note-tip-1-0` で、タイトルが `注記 1`'
      - name: test_render_footnote_ref_when_after_ref
        case: 正常
        summary: afterRef で is-after-ref を付ける
        condition: 部品設計の `AnnotationAfterRef`
        mock: なし
        expected: '`sup` が class `is-after-ref` を持つ'
  - name: renderFootnotes
    title: 脚注の一覧を描く
    container: src/parts/footnote.ts
    kind: 関数
    scope: internal
    summary: 部品設計『脚注の一覧』の HTML を返却する。`items` が空なら空文字。項目の最後の `</p>` の前（`p` が無ければ末尾）に、`refCount` の数の戻るリンクを配置する。`html` は描いた HTML なのでエスケープしない
    args:
      - name: options
        type: '{ items: Array<{ number: number; html: string; refCount: number; refs?: Array<{ href: string; owner?: string }> }>; open?: boolean; kind?: "footnote" | "annotation" }'
        required: true
        description: 部品設計の引数（`open` の既定は `false`、`kind` の既定は `footnote`。`refs` があれば `refCount` の代わりに戻るリンクの `href` にし、`owner` を持つ要素の戻るリンクには `data-note-owner` を付ける）
    returns:
      type: string
      description: '`<details class="mdmark-footnotes">` の HTML か空文字'
    unit_tests:
      - name: test_render_footnotes
        case: 正常
        summary: 件数の見出しで閉じた一覧を組む
        condition: 部品設計の `Closed`
        mock: なし
        expected: '`details` が `open` を持たず、`summary` が `脚注（2 件）`。`ol.mdmark-footnotes-list` に `li#mdmark-fn-1`・`li#mdmark-fn-2` が並び、それぞれ `</p>` の前に `href="#mdmark-fnref-{番号}-0"` の `a.mdmark-fn-back` を 1 つ持つ'
      - name: test_render_footnotes_when_referenced_twice
        case: 正常
        summary: 2 回参照した脚注に a・b の戻るリンクを配置する
        condition: 部品設計の `ReferencedTwice`
        mock: なし
        expected: 戻るリンクが 2 つで、`href` が `#mdmark-fnref-1-0`・`#mdmark-fnref-1-1`、文字に `a`・`b` を持つ
      - name: test_render_footnotes_when_annotation
        case: 正常
        summary: kind annotation と refs で注記の一覧を組む
        condition: 部品設計の `Annotations`
        mock: なし
        expected: '`details` が class `mdmark-notes` を持ち、`summary` が `注記（2 件）`、`li#mdmark-note-1` の戻るリンクが 2 つで `href` が `#mdmark-noteref-1-0`・`#mdmark-note-owner-1-judge`、文字が `a`・`b` で、2 つ目だけが `data-note-owner="mdmark-note-owner-1-judge"` を持つ'
      - name: test_render_footnotes_when_empty
        case: 正常
        summary: 項目が無ければ一覧を配置しない
        condition: '`items: []`'
        mock: なし
        expected: 空文字
