id: MOD-472-34
visibility: internal
title: "ライブラリ本体 / 図"
lead: 図の部品（フロー図・シーケンス図・グラフ・ER 図・操作できる部品）の定義の型と確認し、線の形状の計算、部品の HTML、記法のコアルール、`mount` が付ける拡大・縮小・移動・全画面・ツールチップ・写す操作。定義から HTML までは DOM を使用せず Node でも動き、操作はブラウザでだけ動く。
directory: |-
  ```tree
  src/
  ├── diagram/
  │   ├── definition.ts   # 定義の型・JSON の読み取り・構造の確認
  │   ├── check.ts        # フロー図の定義の配置の点検（重なり・はみ出し・線の横切り・ラベルの長さ）
  │   ├── layout.ts       # 座標を省いた判定フローチャートの自動の配置
  │   ├── er.ts           # ER 図のテーブルの種類・多重度・寸法と、テーブルの高さ・関係の線の経路
  │   └── geometry.ts     # 収まる倍率・line jump・重なる線のずらし・軸の刻み・積み上げ
  ├── parts/
  │   ├── icons.ts        # lucide のアイコンの svg
  │   ├── diagram.ts      # 図の枠・フロー図・シーケンス図・ER 図・図のツールチップ・凡例
  │   ├── chart.ts        # グラフの種類ごとの描き方と系列の外観の組
  │   ├── er.ts           # ER 図のテーブルと多重度の記号
  │   ├── param.ts        # 操作できる部品
  │   └── hint.ts         # 埋め込んだ HTML のヒントのマーカーと中身
  ├── render/syntax/
  │   └── diagrams.ts     # 図の部品のマーカーの範囲を部品の HTML にするコアルールと、点検が読み込む図の部品の範囲
  └── interact/
      ├── diagrams.ts     # 拡大・縮小・移動・全画面
      ├── zoom.ts         # 図とライトボックスが共有する拡大・縮小・移動
      ├── diagram-tips.ts # 図のツールチップ
      ├── diagram-resize.ts # 表示する枠の高さを変えるリサイズハンドルと高さの保持
      ├── diagram-touch.ts # 指で図を動かす操作中
      ├── er-folds.ts     # ER 図の列の開閉
      └── params.ts       # 操作できる部品の値と写す
  ```
notes:
  単体テストのファイル: 物理ファイルごとに `tests/unit/src/{同じパス}.test.ts`（`interact/` は `.browser.test.ts`）を配置し、単体テスト作成の工程で `test_files` に記載する
  他の分類への変更: 記法のコアルールの順では `buildDiagrams` を図表の番号の前に配置し、`fig` のマーカーが図の部品に番号を付けられるようにする。`mount` の `attachInteractions` は `diagrams` がオンなら `attachDiagrams`・`attachParams` を呼ぶ。印刷の前後の `attachPrint`（分類『描く』）は、列を畳んだ ER 図のテーブルを `setErTableFolded` で開き、印刷の後にもう一度畳む。描画の sanitize は `data-mdmark-own` を持つ要素にだけ図の部品の要素と属性（インターフェース定義『文書をHTML文字列にする』の `残す要素・属性`）を許す。svg の描画の属性は `d`・`viewBox`・`width`・`height`・`x`・`y`・`x1`・`y1`・`x2`・`y2`・`cx`・`cy`・`r`・`rx`・`ry`・`points`・`fill`・`stroke`・`stroke-width`・`stroke-dasharray`・`stroke-linecap`・`stroke-linejoin`・`marker-end`・`markerWidth`・`markerHeight`・`refX`・`refY`・`orient`・`transform`。ER 図の列のマーカーの `abbr` の `title` も、図の部品が出した要素だけに許す。記法の CSS のアイコン（`mask-image` の data URL）は lucide の構造に置き換え、構造が lucide@1.59.0 と一致することと、外部ライブラリ『lucide』の一覧のアイコンが使用する要素と属性が全て sanitize の許可にあることを `tests/unit/src/parts/icons.test.ts` で確認する。拡張のマーカーの `definition` は分類『拡張』の `MdmarkMarkArgs` に追加する
