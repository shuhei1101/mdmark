id: MOD-472-34
visibility: internal
title: "ライブラリ本体 / 図"
lead: 図の部品（グラフ・操作できる部品）の定義の型と確認し、廃止した `flow`・`sequence`・`er` の範囲の扱い、線の形状の計算、部品の HTML、記法のコアルール、`mount` が付ける拡大・縮小・移動・全画面・ツールチップ・写す操作。定義から HTML までは DOM を使用せず Node でも動き、操作はブラウザでだけ動く。
notes:
  単体テストのファイル: 物理ファイルごとに `tests/unit/src/{同じパス}.test.ts`（`*.interact.ts` は `.browser.test.ts`）を配置し、単体テスト作成の工程で `test_files` に記載する
  他の分類への変更: |-
    記法のコアルールの順では `buildDiagrams` を図表の番号の前に配置し、`fig` のマーカーが図の部品に番号を付けられるようにする。
    `mount` の `attachInteractions` は `diagrams` がオンなら `attachDiagrams`・`attachParams` を呼ぶ。
    描画の sanitize は `data-mdmark-own` を持つ要素にだけ図の部品の要素と属性（インターフェース定義『文書をHTML文字列にする』の `残す要素・属性`）を許可する。
    svg の描画の属性は `d`・`viewBox`・`width`・`height`・`x`・`y`・`x1`・`y1`・`x2`・`y2`・`cx`・`cy`・`r`・`rx`・`ry`・`points`・`fill`・`stroke`・`stroke-width`・`stroke-dasharray`・`stroke-linecap`・`stroke-linejoin`・`marker-end`・`markerWidth`・`markerHeight`・`refX`・`refY`・`orient`・`transform`。
    記法の CSS のアイコン（`mask-image` の data URL）は lucide の構造に置き換え、構造が lucide@1.59.0 と一致することと、外部ライブラリ『lucide』の一覧のアイコンが使用する要素と属性が全て sanitize の許可にあることを `tests/unit/src/shared/icons.part.test.ts` で確認する。
    拡張のマーカーの `definition` は分類『拡張』の `MdmarkMarkArgs` に追加する
  ディレクトリ: |-
    ```tree
    src/diagram/
    ├── diagram.syntax.ts          # 図の部品のマーカーの範囲を部品の HTML にし、廃止した図の範囲を記載の警告にするコアルールと、点検が読み込む図の部品の範囲
    ├── chart.part.ts              # グラフの種類ごとの描き方と系列の外観の組
    ├── diagram.part.ts            # 図の枠・map の構成図のノードと線・図のツールチップ・凡例
    ├── hint.part.ts               # 埋め込んだ HTML のヒントのマーカーと中身
    ├── mermaid.part.ts            # 部品『mermaid の図』の renderMermaidDiagram
    ├── param.part.ts              # 操作できる部品
    ├── {部品}.part.stories.ts       # 部品設計の states ごとのストーリー（上の部品ごとに 1 つ）
    ├── diagram-resize.interact.ts # 表示する枠の高さを変えるリサイズハンドルと高さの保持
    ├── diagram-tips.interact.ts   # 図のツールチップ
    ├── diagram.interact.ts        # 拡大・縮小・移動・全画面
    ├── param.interact.ts          # 操作できる部品の値と写す
    ├── definition.ts              # 定義の型・JSON の読み取り・構造の確認と、廃止した図の部品のマーカー
    └── geometry.ts                # 収まる倍率・line jump・重なる線のずらし・軸の刻み・積み上げ
    ```

    アイコン（`src/shared/icons.part.ts`）と、図とライトボックスが共有する拡大・縮小・移動（`src/shared/zoom.interact.ts`）は『記法の共通』に配置する。
