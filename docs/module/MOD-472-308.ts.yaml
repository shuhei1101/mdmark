id: MOD-472-308
visibility: internal
title: ライブラリ本体 / 部品 / card-grid.ts
test_files:
  - tests/unit/src/parts/card-grid.test.ts
data_models:
  - name: CardGridItem
    title: カードの格子の項目
    container: src/parts/card-grid.ts
    summary: カード 1 枚の中身
    properties:
      - name: title
        type: string
        description: タイトルの HTML
      - name: href
        type: string | undefined
        description: リンク先。無いときはリンクではないカード
      - name: icon
        type: string | undefined
        description: Lucide のアイコンの名前
      - name: description
        type: string | undefined
        description: 説明の HTML
    status: planned
functions:
  - name: renderCardGrid
    title: カードの格子を描く
    container: src/parts/card-grid.ts
    summary: 部品設計『カードの格子』の HTML を返却する。アイコンは `renderInlineIcon` の要素に class `mdmark-card-grid-icon` を追加して組み立てる
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ items: CardGridItem[]; icons?: Record<string, MdmarkIconNode> }'
        required: true
        description: 項目ごとのカードの中身と、まとめていない名前のアイコンの形状の表
    returns:
      type: string
      description: 部品の HTML
    unit_tests:
      - name: test_render_card_grid
        case: 正常
        condition: '`href` と `icon` と `description` を持つ項目と、`title` だけの項目'
        expected: '`ul.mdmark-card-grid` に `li` が 2 つで、1 つ目が `a.mdmark-card-grid-item`（`href` を持つ）の中に class `mdmark-card-grid-icon` と `data-icon` のアイコン・`span.mdmark-card-grid-title`・`p.mdmark-card-grid-desc`、2 つ目が `div.mdmark-card-grid-item` で `span.mdmark-card-grid-title` だけ'
        mock: なし
        summary: リンクの有無でカードの要素を分ける
      - name: test_render_card_grid_when_unsafe_href
        case: 異常
        condition: '`href` が `javascript:alert(1)` の項目'
        expected: '`href` を持たない `div.mdmark-card-grid-item` になる（`isAllowedUrl` で落とす）'
        mock: なし
        summary: 許さないリンク先はリンクにしない
    refs:
      - CMP-472-10#
    status: planned
