id: MOD-472-350
visibility: internal
title: ライブラリ本体 / CLI / traces.ts
test_files:
  - tests/unit/src/cli/traces.test.ts
constants:
  - name: TRACE_ALIAS
    title: mdmark の名前の別名
    container: src/cli/traces.ts
    usecase: 共通
    summary: 隠す書き出しで、単単語の一部として出る `mdmark` を置き換える別名
    value: zq
    refs:
      - IF-472-33#constraints[mdmark の痕跡]
    status: planned
  - name: HTML_SCRIPT_KEY_PREFIX
    title: 範囲のスクリプトの表の鍵の仮の文字列の頭
    container: src/cli/traces.ts
    usecase: 共通
    summary: '`createViewerEntry` が範囲のスクリプトの表の鍵の代わりに記載する文字列リテラルの頭。後ろに鍵の番号と `@@` を付ける'
    value: '@@html-script-key-'
    status: planned
functions:
  - name: hideNames
    title: mdmark の名前を別名へ置き換える
    container: src/cli/traces.ts
    usecase: 共通
    summary: 単単語の一部として出る `mdmark`（大文字・小文字を区別しない）を、大文字・小文字の構成を保って `TRACE_ALIAS` へ置き換える
    description: '`MDMARK` は `ZQ`、先頭だけ大文字の `Mdmark` は `Zq`、それ以外は `zq` にする。制約「mdmark の痕跡」の (2)'
    kind: 関数
    scope: internal
    args:
      - name: text
        type: string
        required: true
        description: CSS・スクリプト・HTML・JSON の文字列
    returns:
      type: string
      description: 置き換えた文字列
    unit_tests:
      - name: test_hide_names
        case: 正常
        summary: 大文字・小文字の構成を保って置き換える
        condition: '`.mdmark-table{} __mdmarkHtmlScript MDMARK Mdmark @layer mdmark`'
        mock: なし
        expected: '`.zq-table{} __zqHtmlScript ZQ Zq @layer zq`'
    status: planned
  - name: hidePayload
    title: 書き出しの中身の名前を隠す
    container: src/cli/traces.ts
    usecase: 共通
    summary: 利用者が記載した値を除く項目に `hideNames` を適用した書き出しの中身を返却する
    description: '`docs[]`（`title`・`path`・`docId`・`pureMarkdown`）・`index`・`references`・`aliases`・`entry`・`assets`（画像の `data:` URL）は置き換えず、`docs[].rendered.html` は `hideRenderedHtml` を適用し、それ以外（`config`・`icons`・`docs[].rendered` のほかの値）は `JSON.stringify` した文字に `hideNames` を適用して戻す'
    kind: 関数
    scope: internal
    args:
      - name: payload
        type: ExportPayload
        required: true
        description: 書き出しの中身
    returns:
      type: ExportPayload
      description: 隠した中身
    unit_tests:
      - name: test_hide_payload
        case: 正常
        summary: 設定の値だけを置き換え、利用者が記載した値を残す
        condition: '`config.mermaid.theme` が `mdmark`、`docs[0]` の `title` が `mdmark の紹介`・`path` が `mdmark-intro.md`、`index` の用語が `mdmark`'
        mock: なし
        expected: '`config.mermaid.theme` が `zq` で、`title`・`path`・`index` の用語は `mdmark` のまま'
      - name: test_hide_payload_with_rendered
        case: 正常
        summary: '`docs[].rendered.html` に `hideRenderedHtml` を適用し、`docs[].pureMarkdown` は置き換えない'
        condition: '`rendered.html` と `pureMarkdown` に `mdmark` を持つ中身'
        mock: なし
        expected: '`rendered.html` のタグの mdmark が別名、`pureMarkdown` は元のまま'
    status: planned
    callees:
      - '#functions[hideNames]'
      - '#functions[hideRenderedHtml]'
  - name: hideCss
    title: CSS の痕跡を隠す
    container: src/cli/traces.ts
    usecase: 共通
    summary: '`:root{--mdmark-version:"…"}` の宣言を削除し、`hideNames` を適用して返却する'
    kind: 関数
    scope: internal
    args:
      - name: css
        type: string
        required: true
        description: 配布物の CSS か利用側の CSS
    returns:
      type: string
      description: 隠した CSS
    unit_tests:
      - name: test_hide_css
        case: 正常
        summary: バージョンを削除し、名前を置き換える
        condition: '`:root{--mdmark-version:"v0.12.0"}` の行と `@layer mdmark{.mdmark{--mdmark-radius:3px}}`'
        mock: なし
        expected: '`v0.12.0` と `mdmark` が無く、`@layer zq{.zq{--zq-radius:3px}}` がある'
    status: planned
  - name: hideScript
    title: まとめたスクリプトの痕跡を隠す
    container: src/cli/traces.ts
    usecase: 共通
    summary: '`hideNames` を適用してから、範囲のスクリプトの表の鍵の仮の文字列を元の鍵に戻して返却する'
    description: 'まとめたスクリプトの `/*! … */` のライセンスの注釈（`dist/viewer.js`・`dist/view.js` が持つ第三者の `Bundled license information` と、利用者の拡張の注釈）は削除しない。仮の文字列（`HTML_SCRIPT_KEY_PREFIX` に番号と `@@` を付けたもの）は、囲むクオートごと `JSON.stringify(keys[番号])` に置き換える'
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ code: string; keys: string[] }'
        required: true
        description: esbuild がまとめたスクリプト（`</script`・`<!--` を替える前）と、範囲のスクリプトの表の鍵（`createViewerEntry` に指定した順）
    returns:
      type: string
      description: 隠したスクリプト
    unit_tests:
      - name: test_hide_script
        case: 正常
        summary: 鍵を残して名前を置き換える
        condition: '`window.__mdmarkHtmlScript=new Map([["@@html-script-key-0@@",f]])` と、鍵 `window.__mdmarkOpened = true`'
        mock: なし
        expected: '`window.__zqHtmlScript=new Map([["window.__mdmarkOpened = true",f]])`'
      - name: test_hide_script_when_license
        case: 正常
        summary: ライセンスの注釈をそのまま残す
        condition: '計画書の実測と同じ形の、`/*! greet-ext (c) user - MIT */` と、`is-plain-object/dist/is-plain-object.js:` のエントリーポイントの下に `(*! … *)` の注釈を持つ `/*! Bundled license information: … */` を含むコード'
        mock: なし
        expected: 2 つの `/*!` の注釈が元の文字のまま残る
    status: planned
  - name: hideRenderedHtml
    title: 埋める本文の HTML の痕跡を隠す
    container: src/cli/traces.ts
    kind: 関数
    scope: internal
    summary: 埋める本文の HTML の要素名・属性名・`class`・`id`・`data-*` の属性の値・`style` の属性の CSS 変数の名前・`mdmark-asset:` の `mdmark` を別名へ置き換え、HTML のコメントを削除する
    description: テキストのノードと `href`・`src`・`alt`・`title` の属性の値は置き換えない。DOM に頼らず、タグの字句を読み取って置き換える（書き出しは Node で動く）
    args:
      - name: html
        type: string
        required: true
        description: '`renderDocument` が返却した本文の HTML'
    returns:
      type: string
      description: 隠した HTML
    callees:
      - '#functions[hideNames]'
    unit_tests:
      - name: test_hide_rendered_html
        case: 正常
        summary: タグと属性の mdmark を置き換え、本文の文字とリンク先は残す
        condition: '`<mdmark-chart class="mdmark-x" data-mdmark-mermaid style="color:var(--mdmark-fg)"><a href="mdmark-intro.md">mdmark</a></mdmark-chart><!-- c --><img src="mdmark-asset:1">`'
        mock: なし
        expected: 要素名・`class`・属性名・CSS 変数・`mdmark-asset:` が別名になり、`href` とテキストの `mdmark` は残り、コメントが無い
refs:
  - IF-472-33#constraints[mdmark の痕跡]
lead: '書き出した HTML の mdmark の痕跡を隠す処理を受け持ち、書き出しで隠す範囲を変えるときに参照する。'
tags:
  - name: topic:cli
    main: true
  - name: tool:html
  - name: action:書き出し
