id: MOD-472-296
visibility: internal
title: ライブラリ本体 / 記法 / card-grid.ts
test_files:
  - tests/unit/src/render/syntax/card-grid.test.ts
functions:
  - name: buildCardGrid
    title: カードの格子にする
    container: src/render/syntax/card-grid.ts
    kind: 関数
    scope: internal
    summary: コアルール。`card-grid` がオンなら、`<!-- cards -->` 〜 `<!-- /cards -->` の中身のリスト 1 つを、項目ごとの最初のリンク・その前の `icon:名前` の行内のコード・残りの文字から部品『カードの格子』の HTML のトークンに置き換える。中身がリスト 1 つでないときは記載の警告を差し込んでマーカーだけを取り除く。オフのときはマーカーを取り除く
    description: 脚注の機能のオン・オフ（`collectFootnotes`）の後、行内のアイコン（`buildInlineIcons`）の直前に登録し、項目の `icon:` を行内のコードのまま読み込み、置き換えた範囲の中を行内のアイコンとリンクと添付のカード（`buildCards`）が触らないようにする。項目の最初のリンクが URL をそのまま記載したもの（`linkify`・`autolink`）なら、タイトルはスキームを除いた URL にする。リンクを持たない項目のタイトルは項目の最初の行の文字、説明は 2 行目以降の文字。リンクのカードの説明の中のリンクは文字だけにする。タイトルと説明は `SLOT_MARKER` で枠を作って `markOwn` を掛けた後に差し込む（notes「部品の差し込み方」）
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - MOD-472-308#functions[renderCardGrid]
    unit_tests:
      - name: test_build_card_grid
        case: 正常
        condition: '`` `icon:book` [使用方法](a.md) `` の次の行に `導入の手順`、`[参照](b.md) 名前の一覧`、`https://example.com/docs`、`準備中` の 4 項目のリストを囲んだ範囲'
        expected: '`renderCardGrid` に `[{ title: "使用方法", href: "a.md", icon: "book", description: "導入の手順" }, { title: "参照", href: "b.md", description: "名前の一覧" }, { title: "example.com/docs", href: "https://example.com/docs" }, { title: "準備中" }]` を指定した HTML になり、`mdmark-card` の class が無い'
        mock: なし
        summary: 項目をカードの引数に分ける
      - name: test_build_card_grid_when_not_list
        case: 異常
        condition: 段落 1 つとリストを囲んだ範囲
        expected: 範囲の前に記載の警告があり、段落とリストがそのまま残り、`mdmark-card-grid` が無い
        mock: なし
        summary: リスト 1 つでない範囲は囲まずに警告する
      - name: test_build_card_grid_when_disabled
        case: 正常
        condition: '`card-grid` がオフで、URL だけの項目を含むリストを囲んだ範囲'
        expected: マーカーが無く、リストがそのまま残る（URL だけの項目の段落は後の `buildCards` がカードにできる構造のまま）
        mock: なし
        summary: オフのときはマーカーだけを取り除く
      - name: test_build_card_grid_when_item_has_html
        case: 異常
        condition: '`[使用方法](a.md) <style>body{display:none}</style>説明` の項目を囲んだ範囲'
        expected: カードが 1 枚あり、`render` の結果に `style` の要素と `display:none` が無い
        mock: なし
        summary: 項目に記載した HTML は mdmark が出した要素にしない
      - name: test_build_card_grid_when_description_has_link
        case: 正常
        condition: '`[使用方法](a.md) 詳しくは [参照](b.md)` の項目を囲んだ範囲'
        expected: 説明が `詳しくは 参照` で、`href="b.md"` が無い
        mock: なし
        summary: リンクのカードの説明のリンクは文字だけにする
    refs:
      - IF-472-34#constraints[カードの格子]
    status: planned
