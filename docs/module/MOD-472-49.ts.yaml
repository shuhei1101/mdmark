id: MOD-472-49
visibility: internal
title: ClaudeCodeプラグイン / MCPサーバー / arguments.ts
test_files:
  - tests/unit/src/plugin/arguments.test.ts
data_models:
  - name: ToolInputSchema
    title: 引数の構造
    container: src/plugin/arguments.ts
    usecase: 共通
    role: DTO
    summary: ツールの引数の JSON Schema（2020-12）のうち、使用する範囲だけの型
    description: '最上位は `type: ''object''`・`properties`・`required`・`additionalProperties: false`。各引数は `type`（`string`・`integer`・`boolean`・`array`・`object`・`null` かその並び）・`items`（要素が `string` で、`enum` を持てる）・`enum`・`minItems`・`minLength`・`minimum`・`maximum`・`description`（任意）だけを持つ'
    properties:
      - name: type
        type: '''object'''
        description: 引数はオブジェクト
      - name: properties
        type: Record<string, ArgumentSchema>
        description: 引数ごとの構造
      - name: required
        type: string[]
        description: 必須の引数
      - name: additionalProperties
        type: 'false'
        description: 知らない引数を拒む
    status: planned
    introduced:
      pr: 72
constants:
  - name: ACCEPT_ALL_VALIDATOR
    title: 素通しの検証器
    container: src/plugin/arguments.ts
    usecase: 共通
    summary: SDK の `fromJsonSchema` に指定する、どの入力も経由する `jsonSchemaValidator`
    description: 'SDK の検査は英語の文を頭に付けるため、SDK では検査せず、ツールを呼ぶときに引数を検査する。`getValidator` は入力をそのまま `{ valid: true, data }` で返却する関数を返却する'
    refs:
      - LIB-472-2#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
functions:
  - name: checkArguments
    title: 引数を検査する
    kind: 関数
    container: src/plugin/arguments.ts
    usecase: 共通
    role: 検査
    summary: 引数をツールの引数の構造で検査し、最初に合わないところを何が合わないかと修正方法の日本語の 1 文で返却する
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ schema: ToolInputSchema; args: unknown }'
        required: true
        description: 引数の構造と指定された引数
    returns:
      type: string | undefined
      description: 合わないときの 1 文。合えば `undefined`
    process: |-
      1. 引数がオブジェクトでなければ「引数はオブジェクトで指定してください。」
      2. `required` の順に、無い引数があれば「引数 {名前} がありません。{名前} を指定してください。」
      3. `properties` に無い引数があれば「引数 {名前} は使用できません。使用できる引数は {引数の並び} です。」
      4. 引数ごとに、型（`string`・`integer`・`boolean`・`array`・`object`・`null`）・要素の型と要素の `enum`・`enum`・`minItems`・`minLength`・`minimum`・`maximum` に合わなければ「引数 {名前} は {合う値の説明} で指定してください。」（説明は「文字列」「文字列の配列」「オブジェクトか null」「{値} か {値}」「1 件以上の配列」「空でない文字列」「真偽値」「{最小} 以上 {最大} 以下の整数」「{値} か {値} の配列」など）
    unit_tests:
      - name: test_check_arguments
        case: 正常
        summary: 合う引数は undefined
        condition: '`export_html` の構造に `{ file: "a.md", out: "a.html" }`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_required_missing
        case: 正常
        summary: 必須の引数が無い
        condition: '`export_html` の構造に `{}`'
        mock: なし
        expected: '`file` を含む文'
      - name: test_check_arguments_when_unknown_key
        case: 正常
        summary: 知らない引数
        condition: '`check` の構造に `{ path: "a" }`'
        mock: なし
        expected: '`path` と `config` を含む文'
      - name: test_check_arguments_when_type_mismatch
        case: 正常
        summary: 型の違う引数
        condition: 'テストの構造（`names` が文字列の配列）に `{ names: "notation" }`'
        mock: なし
        expected: '`names` と `文字列の配列` を含む文'
      - name: test_check_arguments_when_empty_array
        case: 正常
        summary: 空の配列
        condition: 'テストの構造（`names` が `minItems: 1` の文字列の配列）に `{ names: [] }`'
        mock: なし
        expected: '`names` と `1 件以上` を含む文'
      - name: test_check_arguments_when_enum_mismatch
        case: 正常
        summary: 選べない値
        condition: 'テストの構造（`kind` が `enum: ["doc", "term"]` の文字列）に `kind: "docs"`'
        mock: なし
        expected: '`kind` と `doc か term` を含む文'
      - name: test_check_arguments_when_null_allowed
        case: 正常
        summary: null を許す引数
        condition: 'テストの構造（`item` が `type: ["object", "null"]`）に `item: null`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_not_object
        case: 正常
        summary: 引数がオブジェクトでない
        condition: 引数が配列
        mock: なし
        expected: '`オブジェクト` を含む文'
      - name: test_check_arguments_when_integer_out_of_range
        case: 正常
        summary: 範囲の外か整数でない数
        condition: 'テストの構造（`limit` が `minimum: 1`・`maximum: 100` の整数）に `limit: 101`、続けて `limit: 1.5`'
        mock: なし
        expected: どちらも `limit` と `1 以上 100 以下の整数` を含む文
      - name: test_check_arguments_when_boolean_mismatch
        case: 正常
        summary: 真偽値でない値
        condition: 'テストの構造（`flag` が真偽値）に `flag: "true"`'
        mock: なし
        expected: '`flag` と `真偽値` を含む文'
      - name: test_check_arguments_when_item_enum_mismatch
        case: 正常
        summary: 配列の要素が選べない値
        condition: 'テストの構造（`fields` が要素の `enum: ["path", "aliases"]` の配列）に `fields: ["body"]`'
        mock: なし
        expected: '`fields` と `path か aliases の配列` を含む文'
    refs:
      - LIB-472-2#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
