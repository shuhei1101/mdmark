id: MOD-472-265
visibility: internal
title: ライブラリ本体 / 索引と用語 / backlinks.ts
test_files:
  - tests/unit/src/parts/backlinks.test.ts
functions:
  - name: renderBacklinks
    title: 関連文書の一覧の HTML を返却する
    container: src/parts/backlinks.ts
    kind: 関数
    scope: internal
    summary: タイトルの要素の `id` と文書のタイトル・リンク先の並びから、部品設計『関連文書の一覧』の HTML を返却する。`docs` が空なら空文字
    args:
      - name: props
        type: '{ id: string; docs: { title: string; href: string }[] }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: 一覧の HTML
    unit_tests:
      - name: test_render_backlinks
        case: 正常
        summary: タイトル `関連文書` と項目を並びのとおりに返却する
        condition: 部品設計『関連文書の一覧』の `Two` の引数
        mock: なし
        expected: タイトルが `関連文書` で `id` が `backlinks-two`、`nav` の `aria-labelledby` が `backlinks-two` を指し、リンクが 2 つで並びが引数のとおり
      - name: test_render_backlinks_when_empty
        case: 正常
        summary: 文書が無ければ空文字を返却する
        condition: '`docs` が `[]`'
        mock: なし
        expected: '`""`'
    refs:
      - CMP-472-66#
