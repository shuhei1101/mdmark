id: MOD-472-159
visibility: internal
title: ライブラリ本体 / ビューとコメント / part-modules.ts
test_files:
  - tests/unit/src/part-modules.test.ts
constants:
  - name: PART_MODULE_FILES
    title: 部品のモジュールのファイル名
    container: src/part-modules.ts
    summary: 部品の名前から、`dist/index.js` の隣に配置する配布ファイルの名前を参照する
    value: '{ view: "view.js", comments: "comments.js", map: "map.js" }'
  - name: partModuleLoaders
    title: 部品のモジュールの読み込みの差し替え
    container: src/part-modules.ts
    summary: '`setPartModuleLoader` で、部品と mermaid のモジュールを返却する関数を入れる（書き出した HTML の起動の処理と利用側のページが呼ぶ）。無い部品の名前は `PART_MODULE_FILES` を `import.meta.url` から解決して読み込む。無い `mermaid` は mermaid.ts がまとめた mermaid か `mermaid.url` から読み込む'
    value: 'new Map<PartLoaderName, () => Promise<Record<string, unknown>>>()'
    status: implemented
  - name: partModules
    title: 読み込んだ部品のモジュール
    container: src/part-modules.ts
    summary: 部品の名前から読み込みの Promise を参照する。ページの中で 1 回だけ読み込む（失敗も記録し、再読み込みしない）
    value: new Map<PartName, Promise<unknown>>()
  - name: PART_LOADER_NAMES
    title: 読み込みを差し替えられる名前
    container: src/part-modules.ts
    summary: '`setPartModuleLoader` が受け付ける名前。`PART_MODULE_FILES` のキーと `mermaid`（`PartLoaderName` は `PartName | "mermaid"`）'
    value: '["view", "comments", "map", "mermaid"] as const'
  - name: mermaidByLoader
    title: 関数で読み込んだ mermaid
    container: src/part-modules.ts
    summary: '`mermaid` の `loader` を呼んだ Promise。ページの中で 1 回だけ呼ぶ（失敗も記録し、呼び直さない）。`mount` ごとに記録する URL の mermaid と分けて持つ'
    value: 'let mermaidByLoader: Promise<Record<string, unknown>> | undefined'
functions:
  - name: loadPartModule
    title: 部品のモジュールを読み込む
    container: src/part-modules.ts
    summary: 部品の配布ファイルをページの中で 1 回だけ `import()` し、export の構造を確認して返却する
    kind: 関数
    scope: internal
    args:
      - name: name
        type: PartName
        required: true
        description: '`"view"`・`"comments"`・`"map"`'
      - name: importModule
        type: '(url: string) => Promise<Record<string, unknown>>'
        required: false
        default: 動的 `import()`
        passing: injected
        description: モジュールを読み込む関数（単体テストで差し替える）
      - name: baseUrl
        type: string
        required: false
        default: '`import.meta.url`'
        passing: injected
        description: 隣の配布ファイルの URL を解決する基準（単体テストで差し替える）
    returns:
      type: 'Promise<{ url: string; module: ViewPartModule | CommentsPartModule | MapPartModule }>'
      description: 読み込んだ URL とモジュール。読み込めない・構造が合わない・隣の URL を作れないときは元のエラーで reject し、エラーの `cause` に URL（作れないときは配布ファイルの名前）を持たせる。同期では投げない
    process: |-
      1. `partModules` に名前があればその Promise を返却する
      2. `partModuleLoaders` に名前があれば、URL を `PART_MODULE_FILES[name]` にしてその関数を待つ。無ければ Promise の中で URL を `new URL("./" + PART_MODULE_FILES[name], baseUrl).href` にして `importModule(url)` を待つ。URL を作れないときはそのエラーに `cause` として `PART_MODULE_FILES[name]` を持たせて reject する
      3. 読み込んだモジュールで、`view` は `drawView`・`attachView`、`comments` は `attachComments`、`map` は `attachMap` が関数かを確認する。合わなければ `Error`（モジュールが {名前} を export していない）を投げる
      4. 手順 2〜3 の Promise を `partModules` に記録して返却する
    unit_tests:
      - name: test_load_part_module
        case: 正常
        summary: 隣の配布ファイルを読み込み、同じ名前は 1 回だけ読み込む
        condition: '`view` を 2 回読む'
        mock: '`importModule` は呼ばれた URL を記録し、2 つの関数を持つオブジェクトを返却する'
        expected: '`importModule` が 1 回だけ、`view.js` で終わる URL で呼ばれる。2 回とも同じモジュール'
      - name: test_load_part_module_when_loader
        case: 正常
        summary: 差し替えた関数で読み込み、URL を読み込まない
        condition: '`setPartModuleLoader("view", 関数)` の後に `view` を読み込む。関数は 2 つの関数を持つオブジェクトを返却する'
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれず、関数が返却したモジュールと `url` の `view.js` を返却する'
      - name: test_load_part_module_when_shape_mismatch
        case: 異常
        summary: 関数を export しないモジュールを拒む
        condition: '`comments` を読み込む'
        mock: '`importModule` は `{}` を返却する'
        expected: '`attachComments` を含むメッセージの Error で reject し、`cause` に URL'
      - name: test_load_part_module_when_rejected
        case: 異常
        summary: 読み込めないモジュールは元のエラーで reject し、次も再読み込みしない
        condition: '`view` を 2 回読む'
        mock: '`importModule` は reject する'
        expected: 2 回とも同じエラーで reject し、`importModule` は 1 回だけ呼ばれる
      - name: test_load_part_module_when_url_unresolvable
        case: 異常
        summary: 隣の URL を作れないとき、同期で投げずに reject する
        condition: '`baseUrl` に `blob:null/0` のように階層を持たない URL を指定して `map` を読み込む'
        mock: '`importModule` を見張る'
        expected: '`loadPartModule` は例外を投げずに Promise を返却し、`TypeError` で reject する。`cause` が `map.js` で、`importModule` は呼ばれない'
    refs:
      - IF-472-30#constraints[部品のモジュールの読み込み]
      - IF-472-27#constraints[部品のモジュールの読み込み]
      - IF-655-1#flows[異常系（指定しない部品の URL を作れない・console.error）]
  - name: setPartModuleLoader
    title: 部品のモジュールの読み込みを差し替える
    container: src/part-modules.ts
    summary: 引数を検め、`partModuleLoaders` に部品か `mermaid` の名前とモジュールを返却する関数を入れる。`dist/index.js` の公開関数で、書き出した HTML の起動の処理も呼ぶ
    kind: 関数
    scope: public
    args:
      - name: name
        type: PartLoaderName
        required: true
        description: 部品の名前か `mermaid`。`PART_LOADER_NAMES` のどれか
      - name: loader
        type: () => Promise<Record<string, unknown>>
        required: true
        description: 部品か mermaid のモジュールを返却する関数。書き出した HTML の起動の処理は、埋めなかった部品に拒否する関数を入れる（`mermaid` は入れない）
    returns:
      type: void
      description: '-'
    exceptions:
      - name: TypeError
        condition: '`name` が `PART_LOADER_NAMES` に無いか、`loader` が関数でない。メッセージに誤った引数の名前（`name`・`loader`）を含め、`partModuleLoaders` を変えない'
    process: |-
      1. `name` が `PART_LOADER_NAMES` のどれかか、`loader` が関数かを確認し、合わなければ `TypeError` を投げる
      2. `partModuleLoaders` に `name` → `loader` を入れる（既にあれば置き換える。`partModules`・`mermaidByLoader` に記録済みの名前は、読み込み済みの Promise を使用し続ける）
    unit_tests:
      - name: test_set_part_module_loader_when_args_invalid
        case: 異常
        summary: 知らない名前と関数でない loader を拒む
        condition: '`setPartModuleLoader("chart", 関数)` と `setPartModuleLoader("map", "map.js")` を呼ぶ'
        mock: なし
        expected: どちらも `TypeError` を投げ、メッセージが `name`・`loader` を含む。`partModuleLoaders` が空のまま
      - name: test_set_part_module_loader_when_replaced
        case: 正常
        summary: 同じ名前の 2 回目は後の関数で置き換える
        condition: '`map` に関数 A、次に関数 B を指定してから `map` を読み込む'
        mock: A・B は呼ばれた回数を数え、`attachMap` を持つオブジェクトを返却する
        expected: B が 1 回呼ばれ、A は呼ばれない
      - name: test_set_part_module_loader_when_mermaid
        case: 正常
        summary: '`mermaid` の名前を受け付ける'
        condition: '`setPartModuleLoader("mermaid", 関数)` を呼ぶ'
        mock: '関数は `{ default: {} }` を返却する'
        expected: 例外を投げず、`partModuleLoaders` に `mermaid` が入る
    refs:
      - IF-655-1#
  - name: loadMermaidByLoader
    title: 関数で mermaid を読み込む
    container: src/part-modules.ts
    summary: '`setPartModuleLoader` で `mermaid` に指定した関数をページの中で 1 回だけ呼び、その Promise を返却する。指定が無ければ `undefined` を返却する'
    kind: 関数
    scope: internal
    args: []
    returns:
      type: Promise<Record<string, unknown>> | undefined
      description: 関数が返却したモジュールを待つ Promise。関数が拒否するか同期で投げたときは元のエラーで reject する。構造の確認は呼ぶ側（mermaid.ts）がする
    process: |-
      1. `mermaidByLoader` があればそれを返却する
      2. `partModuleLoaders` に `mermaid` が無ければ `undefined` を返却する（記録しない）
      3. その関数を Promise の中で呼ぶ（同期で投げた例外も reject にする）。その Promise を `mermaidByLoader` に記録して返却する
    unit_tests:
      - name: test_load_mermaid_by_loader
        case: 正常
        summary: 指定した関数を 1 回だけ呼ぶ
        condition: '`setPartModuleLoader("mermaid", 関数)` の後に 2 回呼ぶ'
        mock: '関数は呼ばれた回数を数え、`{ default: {} }` を返却する'
        expected: '関数が 1 回だけ呼ばれ、2 回とも同じ Promise が `{ default: {} }` で解決する'
      - name: test_load_mermaid_by_loader_when_not_set
        case: 正常
        summary: 指定が無ければ undefined を返却する
        condition: '`mermaid` を指定せずに呼ぶ。その後 `setPartModuleLoader("mermaid", 関数)` してもう一度呼ぶ'
        mock: '関数は `{ default: {} }` を返却する'
        expected: 1 回目は `undefined`、2 回目は関数の Promise を返却する
      - name: test_load_mermaid_by_loader_when_rejected
        case: 異常
        summary: 拒否した関数は元のエラーで reject し、呼び直さない
        condition: 拒否する関数と、同期で投げる関数をそれぞれ指定して 2 回ずつ呼ぶ
        mock: 関数は呼ばれた回数を数え、`Error("missing")` で拒否するか投げる
        expected: どちらも例外を投げずに Promise を返却し、2 回とも `missing` のエラーで reject する。関数は 1 回だけ呼ばれる
    refs:
      - IF-655-1#flows[正常系（mermaid のモジュールを指定する）]
      - IF-655-1#flows[異常系（mermaid のモジュールを読み込めない・console.error）]
lead: '部品のモジュールのファイル名・URL の差し替え・読み込みと、関数で指定した mermaid の読み込みを受け持ち、部品のモジュールの読み込み方を変えるときに参照する。'
tags:
  - name: topic:ビュー
    main: true
  - name: topic:コメント
  - name: action:読み込み
