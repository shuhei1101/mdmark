id: MOD-472-234
visibility: internal
title: ライブラリ本体 / 記法の共通 / scroller.interact.ts
test_files:
  - tests/unit/src/shared/scroller.interact.browser.test.ts
functions:
  - name: findScrollContainer
    title: スクロールする場所を見つける
    container: src/shared/scroller.interact.ts
    summary: '要素を縦にスクロールする一番近い祖先の要素を返却する'
    description: |-
      要素の祖先を `document.body` の手前までたどり、`overflow-y` が `auto` か `scroll` で `scrollHeight` が `clientHeight` より大きい一番近い要素を返却する。
      無ければ `document.scrollingElement`（無ければ `document.documentElement`）を返却し、`page` を `true` にする
    kind: 関数
    scope: internal
    args:
      - name: from
        type: HTMLElement
        required: true
        description: たどり始める要素（この要素自身は見ない）
    returns:
      type: '{ target: HTMLElement; page: boolean }'
      description: スクロールする要素と、それが画面全体か
    unit_tests:
      - name: test_find_scroll_container
        case: 正常
        summary: 中身がはみ出す一番近いスクロールする祖先の要素を返却する
        condition: '高さ 600px・`overflow-y: auto` の `div` の中に、高さ 2000px の要素を入れ、その中の要素から探す'
        mock: なし
        expected: '`target` が `div`、`page` が `false`'
      - name: test_find_scroll_container_when_not_overflowing
        case: 正常
        summary: 中身がはみ出さない祖先の要素は飛ばして画面全体を返却する
        condition: '高さ 600px・`overflow-y: auto` の `div` の中に、高さ 100px の要素を入れ、その中の要素から探す'
        mock: なし
        expected: '`target` が `document.scrollingElement`、`page` が `true`'
    status: planned
lead: '要素をスクロールする一番近い祖先の要素の探索を受け持ち、スクロールする場所の決め方を変えるときに参照する。'
tags:
  - name: action:操作
    main: true
  - name: topic:dom
  - name: topic:イベント
  - name: topic:部品
