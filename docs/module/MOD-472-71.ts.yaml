id: MOD-472-71
visibility: internal
title: VS Code 拡張機能 / Webview / media-error.ts
test_files:
  - tests/unit/vscode/src/webview/shared/lib/media-error.test.ts
functions:
  - name: renderMediaError
    title: 再生できない動画・音声の通知を描く
    kind: 関数
    container: vscode/src/webview/shared/lib/media-error.ts
    usecase: プレビューのリンクと画像を開く
    summary: 部品設計『再生できない動画・音声の通知』の HTML を返却する。「既定のアプリで開く」の `a` に `data-action="openAsset"` と `data-path` を付け、`useLinkClicks` が `#` のリンクと見分けられるようにする
    scope: public
    args:
      - name: options
        type: '{ kind: "video" | "audio"; format: string; path: string }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: 通知ブロックの HTML
    refs:
      - CMP-472-35#
    unit_tests:
      - name: test_render_media_error
        case: 正常
        summary: 形式とパスをエスケープして出す
        condition: '`kind: audio`、`format: m4a`、`path: "media/<voice>.m4a"`'
        mock: なし
        expected: 本文に `<code>m4a</code>` と `<code>media/&lt;voice&gt;.m4a</code>`、`data-action="openAsset"`・`data-path="media/&lt;voice&gt;.m4a"` の `a`
    status: planned
    introduced:
      pr: 263
