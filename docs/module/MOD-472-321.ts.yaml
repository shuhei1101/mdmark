id: MOD-472-321
visibility: internal
title: ライブラリ本体 / 部品 / row-detail.ts
test_files:
  - tests/unit/src/parts/row-detail.test.ts
functions:
  - name: renderRowDetail
    title: 行の詳細を描く
    container: src/parts/row-detail.ts
    kind: 関数
    scope: internal
    summary: 部品設計『行の詳細』の詳細の行と、`toggle` のときは行の先頭のセルの開閉のボタンの HTML を返却する
    args:
      - name: options
        type: '{ id: string; row: number; columns: number; label: string; open?: boolean; toggle?: boolean; body: string }'
        required: true
        description: 部品設計の引数と中身の HTML（`SLOT_MARKER` を指定できる）
    returns:
      type: '{ row: string; toggle: string }'
      description: 詳細の行と、開閉のボタン（`toggle` が `false` なら空）
    unit_tests:
      - name: test_render_row_detail
        case: 正常
        summary: 閉じた詳細の行とボタンを返却する
        condition: '`row: 1`、`columns: 3`、`label: table`'
        mock: なし
        expected: '`row` が `<tr class="mdmark-row-detail" data-row="1" … hidden><td colspan="3">`、`toggle` が `aria-expanded="false"` と `aria-label="「table」の詳細"`'
