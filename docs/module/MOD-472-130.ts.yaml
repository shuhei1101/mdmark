id: MOD-472-130
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / flow-view.ts
test_files:
  - tests/unit/src/map/flow-view.browser.test.ts
data_models:
  - name: MapFlowHandle
    title: 構成図の操作のインターフェース
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachMapFlow` の戻り値'
    properties:
      - name: focus
        type: '(target: { nodes: string[]; wires: string[] }) => void'
        description: 案内を止めて、外から強調を適用する（シーケンス図の再生）
      - name: clearFocus
        type: () => void
        description: 外から適用した強調を解く
      - name: destroy
        type: () => void
        description: 操作と観察を解除する
      - name: follow
        type: '(nodes: string[]) => void'
        description: ノードを囲む矩形が収まる倍率と位置へ図を移す（シーケンス図の再生でメッセージへ移ったとき。`createFollow` の `reveal`）
      - name: resumeFollow
        type: () => void
        description: 読者が触って止めた移動を再開する（`createFollow` の `resume`）
  - name: MapFlowExtension
    title: 構成図の種類ごとの差し込み
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図が構成図の描画と操作に追加する処理（`attachMapFlow` の `extension`）
    properties:
      - name: chart
        type: Flowchart
        description: '`parseFlowchart` の代わりに配置するノード・グループ・線'
      - name: overrides
        type: '(view: { collapsed: ReadonlySet<string>; widths: Record<string, number>; measureText: (text: string) => number }) => Record<string, MapOverride>'
        description: 補足の `layout` の前に重ねる配置の上書き（ノードの幅・大きさ・上と左右に空ける幅）。配置するたびに、閉じた ID と、補足の `layout` の `width` を持つ ID から幅への対応と、`layoutMap` に指定するのと同じ名前の幅を測る関数で呼ぶ（クラス図は、補足の幅でメンバーの折り返しと高さを決め、名前とノートの文の幅を測る）
      - name: collapsibles
        type: string[]
        description: 全て閉じるで閉じる、グループのほかの ID（ER 図のテーブル）
      - name: walkthroughs
        type: MapStep[] | undefined
        description: 補足の `walkthroughs` の代わりに帯で進める手順（状態遷移図の遷移・C4Dynamic の関係の再生）
      - name: bandMode
        type: '"walkthrough" | "playback"'
        description: 帯のモード（既定 `walkthrough`）。`playback` ではボタンの名前と帯の `label` を再生のもの（`{図のタイトル}の再生`）にする
      - name: bandUnit
        type: '"message" | "transition" | "relation"'
        description: '`playback` で進める単位（部品設計『案内の帯』の `unit`。既定 `message`）'
      - name: rewire
        type: '(layout: MapLayout, view: { collapsed: string[] }) => MapLayout["wires"]'
        description: 自動配置の後に線の経路を再計算する（ER 図の関連の端の付け替え）
      - name: render
        type: '(args: MapFlowArgs) => MapPart'
        description: '`renderMapFlow` の代わりに図の中身を描く部品（`renderMapErDiagram`・`renderMapStateDiagram`）'
      - name: afterRender
        type: '(figure: HTMLElement, layout: MapLayout, view: { selected: Set<string>; step: number | undefined }) => void'
        description: 強調を適用した後に呼ぶ（行が増える関連のマーカー・同じ状態への遷移を、選択と再生の手順に合わせて再描画する）
      - name: selectionOf
        type: '(selected: Set<string>) => { nodes: Set<string>; wires: Set<string> } | undefined'
        description: 選んだノードから残すノードと線を決める。無しを返却すれば構成図の選び方
      - name: collapsedTag
        type: '(groupId: string) => string'
        description: 閉じたグループの名前の後ろの文字（既定は「ノード {数} 件」）
      - name: kinds
        type: Record<string, MapKind> | undefined
        description: 設定の `map.kinds` に重ねるノードの種類（クラス図・アーキテクチャ図・C4 図の種類の行・アイコン・形状・色）
      - name: lines
        type: Record<string, MapLine> | undefined
        description: 設定の `map.lines` に重ねる線の種類（クラス図の矢じりを持たない線）
      - name: title
        type: string | undefined
        description: 印に `title` が無いときの図の枠のタイトル（C4 図の `title` の行）
      - name: selectable
        type: '((id: string) => boolean) | undefined'
        description: 選べるノードか（クラス図のノート・アーキテクチャ図の junction を選ばない）。無ければ全てのノードを選べる。選べないノードを押しても選択を変えない
      - name: packetDirection
        type: '((wireId: string) => "forward" | "backward") | undefined'
        description: 線ごとのデータの印の向き（ER 図は関連の両端の多重度で決める）。無ければ線の元から先（`both` の線は両向き）
constants:
  - name: DIM_SELECTOR
    title: 薄くする対象
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 強調するときに `map-dim` を付ける要素のセレクター（ノード・線・ラベル・ライフライン）
functions:
  - name: neighborKept
    title: 1つのノードの線と相手
    kind: 関数
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 1 つのノードと、そのノードの線と相手のノードを返却する。クラス図・アーキテクチャ図・C4 図の `extension.selectionOf` が 1 つ選んだときに使用する
    scope: public
    args:
      - name: edges
        type: 'Array<{ id: string; from: string; to: string }>'
        required: true
        description: 線（向きは見ない）
      - name: id
        type: string
        required: true
        description: 選んだノードの ID
    returns:
      type: '{ nodes: Set<string>; wires: Set<string> }'
      description: 残すノードと線
  - name: shortestPathKept
    title: 2つのノードの最短の経路
    kind: 関数
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 2 つのノードをつなぐ最短の経路に乗る全てのノードと線を返却する（つながらなければ 2 つのノードだけ）。クラス図・アーキテクチャ図・C4 図の `extension.selectionOf` が 2 つ選んだときに使用する
    scope: public
    args:
      - name: edges
        type: 'Array<{ id: string; from: string; to: string }>'
        required: true
        description: 線（向きは見ない）
      - name: ends
        type: '[string, string]'
        required: true
        description: 選んだ 2 つのノードの ID
    returns:
      type: '{ nodes: Set<string>; wires: Set<string> }'
      description: 残すノードと線
  - name: attachMapFlow
    title: 構成図を付ける
    kind: 関数
    container: src/map/flow-view.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 処理
    summary: 構成図を読み取り、状態を読み取って配置し、描いて測った大きさで再配置し、操作を付ける
    scope: public
    callees:
      - MOD-472-137#functions[parseFlowchart]
      - MOD-472-137#functions[mapLinkProblems]
      - MOD-472-141#functions[layoutMap]
      - MOD-472-129#functions[readMapState]
      - MOD-472-129#functions[writeMapState]
      - MOD-472-134#functions[startDrag]
      - MOD-472-132#functions[attachBand]
      - MOD-472-133#functions[renderMapFlow]
      - MOD-562-2#functions[readMapAnnotations]
      - MOD-562-2#functions[linkAnnotationOwners]
      - MOD-472-141#functions[separateWires]
      - MOD-472-177#functions[zoomControlOf]
    args:
      - name: range
        type: HTMLElement
        required: true
        description: '`div.mdmark-map`'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を適用した設定
      - name: options
        type: '{ args: MapArgs; onWalk?: () => void; extension?: MapFlowExtension; resolveIdLink?: ResolveIdLink }'
        required: true
        description: 印の引数と、案内の手順の通知・図の種類の差し込み
      - name: options.args
        type: MapArgs
        required: true
        description: 印の引数
      - name: options.onWalk
        type: () => void
        required: false
        description: 案内の手順を進めたときに呼ぶ関数
      - name: options.extension
        type: MapFlowExtension
        required: false
        description: ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図の差し込み。無ければ `flowchart` の構成図
    returns:
      type: MapFlowHandle
      description: 強調を外から適用する関数・表示する枠を外からスクロールする関数と片付ける関数
    process: |-
      1. `parseFlowchart`（`extension` があれば `extension.chart`）・`parseMapData` で読み取り、`extension.kinds`・`extension.lines` を設定の `map.kinds`・`map.lines` に重ね、印に `title` が無ければ `extension.title` を図の枠のタイトルにし、`readMapState`（印の `focus` と、補足の `layout` の `collapsed` が `true` の ID を指定する）で状態を読み取る
      2. 名前の幅を測る関数を作る。範囲の要素の計算値の `font-family` と `LABEL_METRICS.nameSize`・標準の太さ（400）のフォントで、canvas の 2D の文脈の `measureText` で 1 行の幅を測り、同じ文字の列の幅は覚えて再利用する。この関数を `layoutMap` の `measureText` と `extension.overrides` の `measureText` に指定する。`document.fonts` があれば、`document.fonts.ready` の後に覚えた文字の列の幅を再計測し、幅が 1 つでも変わっていれば測った大きさを捨てて「配置する」を再実行する（書体を読み込み終える前は代わりの書体で測るため。描く前に読み込み終えていれば幅は変わらず、再配置さない）。`destroy` の後に `ready` が解決したときは再配置さない。上書きには、ノードの種類（`classes` のうち重ねた `map.kinds` にある最初の種類）の形状が `pill` のノードに `padLeft`（`LABEL_METRICS.padPill`）を加える。`extension.overrides` に補足の `layout` と状態の `positions`・`attachments`（`ends` に重ねる）を重ねた上書きで、次の「配置する」をする。`layoutMap` で配置し、`extension.rewire` があれば線を再計算し、`spreadWireEnds` で同じ辺の線の端を並べ（全ての図の種類）、`separateWires` で同じ区間の線を並べる。`crowded` が 0 より大きければ、`spread` を `crowded` にして配置・再計算し・並べるを 1 回だけ再実行する（`crowded` は通り道に足りない幅なので、広げた通り道の中ほどに束が収まる）。この手順の開閉と手順 3 の「配置し直す」は、この「配置する」を再実行することを指す。`renderDiagramFrame`（種類 `map`・`wide`・`tools`）と `renderMapFlow`（`extension.render` があればそちら。補足の `notes` と、`parseFlowchart` の `links` を `mapLinkProblems`（`idLinks` は `resolve` と `resolveIdLink`）で確認した `allowed`、`readMapAnnotations` で読み込んだ要素ごとの注記の `annotations`、`hints` は `config.features.hints`）で描き、描くたびに `linkAnnotationOwners` で持ち主の `id` を一覧の戻るリンクに合わせる。再描画して図の中身の大きさが変わったら（グループに入る・出る、開閉、再計測し、書体の読み込み後の再配置し）、表示する枠の `zoomControlOf` の `resize` に大きさを指定し、倍率の文字を保つ。図のツールチップの操作は `attachDiagrams`（`placement` は `config.tooltips.diagramPlacement`）で付ける。`data-node-toggle` のボタンを押すと、その ID の `collapsed` を切り替え、測った大きさを捨てて再配置する
      3. ノードと閉じたグループ（`.map-closed-group[data-group]`）の中身を測り、中身が入る高さ（絶対配置でなく、`display` が `none` でない子要素の、最初の子要素の上端から `margin-top` を引いた位置から、最後の子要素の下端に `margin-bottom` を加えた位置までの高さに、上下の余白と上下の枠線を加えた高さ）が、ノードの高さを 1px より大きく越えるノードを、越えた分を高さに加えた `size` にして再配置する。中身を上寄せにするノードも上下の中央に配置するノードも、1 回の再計測で中身が上下の余白の内側に入る。以降はノードの大きさを `ResizeObserver` で見て同じく再配置する
      4. 補足の `walkthroughs`（`extension.walkthroughs` があればそちら）を `attachBand`（モードは `extension.bandMode`、無ければ `walkthrough`。単位は `extension.bandUnit`）の手順にする。手順へ移るたびに `onWalk` を呼び、`onStep` で `resumeFollow` と手順の `nodes` の `follow` を呼んで図を移し、停止で案内を始めたときに中へ入っていたグループと倍率に戻す。手順の `nodes` のうち閉じたグループの中のノードはそのグループに、`edges` のうち描いていない線（閉じたグループへの線にまとめた線）は、両端を同じく付け替えた描いた線に置き換えて、強調とデータの印を適用する
      5. 構成図の `styles`（線の番号は記載順の線の ID に置き換える）を `renderMapFlow` に指定し、`collapsed` を補足の `layout` の `collapsed` と同じく最初の閉じたグループに加える。範囲の外の map の図も範囲の中と同じく適用する
      6. データの印の向きは `extension.packetDirection` があればそれで決め、無ければ線の元から先（`both` の線は両向き）にする。グループの右下の角のボタンと左・右・下の縁の帯を描き、角のドラッグとキーは `startDrag`・`resizeByKey` に任せて `groupSizes` を変え、配置で `groupSizes` を下限の大きさとして重ねる
      7. `attachDiagrams` の `attachModal` に、全画面のモーダルに複製した図へ同じ読み取りの結果と `extension` で描画と操作（手順 2〜6）を付け直す関数を指定する。一覧の表示（`attachMapList`）と書き出すボタン（`attachMapExport`）もモーダルの図に付ける。モーダルの図は状態を sessionStorage から読み直し、`writeMapState` の `scope: modal` で保つ。モーダルの Esc はツールチップ・選択・中へ入った状態の順に解き、どれも無いときは `preventDefault` せずモーダルに任せる。閉じたら付けた操作を解除し、元の図の状態を sessionStorage から読み直して再配置する
      8. 開閉・中へ入る・選ぶ・線を指す・動かすの操作と、Esc（選択を解き、無ければ外へ戻る）、右上のボタンを付け、変わるたびに `writeMapState` で保つ。動かす操作は `startDrag` に任せ（`pointerType` が `touch` の押下ではノード・グループ・線の区間を動かさず、指の移動を表示する枠のスクロールに任せる）、`pointerup` か `pointercancel` で保つ（`pointercancel` では `startDrag` が戻した状態を保つ）
    unit_tests:
      - name: test_attach_map_flow_when_mermaid_styles
        case: 正常
        summary: 'Mermaid の色の指定と view: collapsed を図に適用する'
        condition: '`style A fill:#f9f`・`linkStyle 0 stroke:#d33`・`subgraph g` と `g@{ view: collapsed }` を持つ範囲の外の flowchart の範囲'
        mock: なし（jsdom）
        expected: ノード A の `--map-node-fill` が `#f9f`、1 本目の線の `stroke` が `#d33`、グループ `g` が閉じた状態で始まる
      - name: test_attach_map_flow_when_drag_cancelled
        case: 正常
        summary: 指の押下ではノードを動かさず、受け取りを残さない
        condition: ノードに `pointerType` が `touch` の `pointerdown` と、下へ 40px の `pointermove` を発火し、`pointercancel` を発火した後に、さらに下へ 40px の `pointermove` を発火する
        mock: '`writeMapState`'
        expected: 'ノードの位置が押す前と同じで、`writeMapState` が `positions` を変えず、どの `pointermove` でも再描画されない'
      - name: test_attach_map_flow_when_node_link
        case: 正常
        summary: リンク先を持つノードを動かしたときは開かず、動かさずに押すと開く
        condition: '`click mount "https://example.com/spec"` を持つ `FLOW` を描き、`mount` の種類の行を 40px ドラッグして離し、次に動かさずに押す'
        mock: '`window` の `click` のキャプチャを記録する受け取り'
        expected: ドラッグの後の `click` は `preventDefault` され、ノードの位置が変わる。動かさずに押したときの `click` は止められず、`a.mdmark-diagram-node-link` の `href` が `https://example.com/spec`
      - name: test_attach_map_flow_when_node_hit_keys
        case: 正常
        summary: リンク先を持たないノードは、ノードを覆う押せる要素でキー操作を受ける
        condition: '`notes` で `data` に説明を持つ `FLOW` を描き、`data` の `span.mdmark-diagram-node-hit` にフォーカスして Enter、Alt + ArrowRight の順に押す'
        mock: '`writeMapState`'
        expected: 'Enter で `data` のノードが `data-selected` を持ち、押せる要素の `aria-label` の末尾が `（選択中）` になる。Alt + ArrowRight で `data` のノードが右へ 8px 動き、再描画した後もフォーカスが `data` の `span.mdmark-diagram-node-hit` にある。説明のマーカーにフォーカスしたときは押せる要素とは別の要素で、ツールチップが開く'
      - name: test_attach_map_flow_when_toggle
        case: 正常
        summary: グループを閉じる
        condition: モックの `FLOW` を描き、`store` の開閉のボタンを押す
        mock: '`readMapState`・`writeMapState`'
        expected: '`store` が `map-closed-group` になり、`writeMapState` の `collapsed` が `[store]`'
      - name: test_attach_map_flow_when_select_wire
        case: 正常
        summary: 線を押す
        condition: '`mount`→`marker` の線を押す'
        mock: '`writeMapState`'
        expected: '`selected` が `[mount, marker]`。もう一度押すと空'
      - name: test_attach_map_flow_when_escape
        case: 正常
        summary: Esc
        condition: '`entered: read` で選択が無い'
        mock: なし
        expected: 外へ戻り、`entered` が `lib`
      - name: test_attach_map_flow_when_packets
        case: 正常
        summary: 選んだ線と指した線の印
        condition: '`mount` を押して選ぶ。選択を解いてから `marker->data` の線を指す'
        mock: なし
        expected: 選んでいる間は `mount` の線の上に `.map-packet` があり、選択を解くと無くなる。線を指している間は `marker->data` の上にだけ `.map-packet` があり、離すと無くなる
      - name: test_attach_map_flow_when_walk_leaves_group
        case: 正常
        summary: 中へ入る手順の後の手順
        condition: '手順 3 だけが `enter: place` の案内で、3 つ目の区切りを押してから左の矢印のボタンを押す'
        mock: なし（jsdom）
        expected: 手順 3 では `place` の中に入り、左の矢印のボタンで手順 2 に移ると、案内を始めた段（全体）の図に戻る（今入っているグループのタイトルが無い）
      - name: test_attach_map_flow_when_follow
        case: 正常
        summary: 外から図を移す
        condition: '`follow([mount, marker])` を呼ぶ。表示する枠でホイールを回してからもう一度呼ぶ。`resumeFollow` の後にもう一度呼ぶ'
        mock: 表示する枠の `zoomControlOf` の `centerRect`
        expected: '`centerRect` を 1 回目と 3 回目だけ呼ぶ'
      - name: test_attach_map_flow_when_crowded
        case: 正常
        summary: 並べた線が矩形に入るときは間を広げて再配置する
        condition: '`separateWires` が 1 回目に `crowded: 16`、2 回目に `crowded: 0` を返却する'
        mock: '`layoutMap`・`separateWires`'
        expected: '`layoutMap` を 2 回呼び、2 回目の `spread` が 16。描いた線が 2 回目の `separateWires` の `wires`'
      - name: test_attach_map_flow_when_closed_group_measured
        case: 正常
        summary: 閉じたグループの中身を測る
        condition: '`collapsed: [store]` で描き、`store` の `.map-closed-group` の中身が入る高さを、ノードの高さより 10 大きくする（最後の子要素の下端を、下の枠線と下の余白を除いた下端より 10 下にする）'
        mock: '`layoutMap`'
        expected: 2 回目の `layoutMap` の `overrides.store.size.h` が、1 回目の `store` の `h` + 10
      - name: test_attach_map_flow_when_walk_into_closed_group
        case: 正常
        summary: 閉じたグループの中のノードを指す手順
        condition: 'モックの `FLOW` を `collapsed: [store]` で描き、`store` の中のノードとそこへ入る線を `nodes`・`edges` に持つ手順だけの案内で、1 つ目の区切りを押す'
        mock: なし
        expected: '`store` の閉じたノードと、そこへ入るまとめた線が `map-dim` を持たず、その線の上に `.map-packet` がある'
      - name: test_attach_map_flow_when_content_in_bottom_padding
        case: 正常
        summary: 中身が下の余白にかかるノードを高くする
        condition: モックの `FLOW` を描き、`mount` の名前の要素（`.mdmark-diagram-node-name`）の下端を、下の枠線と下の余白を除いた下端より 6 下にし、`scrollHeight` を `clientHeight` と同じにする
        mock: '`layoutMap`'
        expected: 2 回目の `layoutMap` の `overrides.mount.size.h` が、1 回目の `mount` の `h` + 6
      - name: test_attach_map_flow_when_content_above_bottom_padding
        case: 正常
        summary: 中身が下の余白より上にあるノードは高くしない
        condition: モックの `FLOW` を描き、全てのノードの中身の下端を、下の枠線と下の余白を除いた下端より 2 上にする
        mock: '`layoutMap`'
        expected: '`layoutMap` を 1 回だけ呼ぶ'
      - name: test_attach_map_flow_when_centered_content_overflows
        case: 正常
        summary: 中身を上下の中央に配置するノードを 1 回で高くする
        condition: モックの `FLOW` を描き、種類を持たないノード `user` の名前の要素を、上端が上の枠線と上の余白を除いた上端より 10 上、下端が下の枠線と下の余白を除いた下端より 10 下にする（中央に配置して上下に 10 ずつはみ出す）
        mock: '`layoutMap`'
        expected: 2 回目の `layoutMap` の `overrides.user.size.h` が、1 回目の `user` の `h` + 20
      - name: test_attach_map_flow_when_kind_row_hidden
        case: 正常
        summary: 隠した種類の行を中身に数えない
        condition: '全てのノードの種類の行（`.mdmark-diagram-node-kind`）を `display: none` にしたモックの `FLOW` を描き、表示している中身の下端を、下の枠線と下の余白を除いた下端より 2 上にする'
        mock: '`layoutMap`'
        expected: '`layoutMap` を 1 回だけ呼ぶ（隠した種類の行の全て 0 の矩形を中身の上端にしない）'
      - name: test_attach_map_flow_when_measured_name
        case: 正常
        summary: 描くフォントで測った名前の幅で配置する
        condition: 「文書の Markdown」のノード（`:::step`）と、設定の `map.kinds` で形状が `pill` の種類の「利用側のページ」のノードを持つ範囲を描く
        mock: なし
        expected: どちらのノードも名前が 1 行（名前の文字の範囲の高さが 14px × 1.35 以下）で、ノードの幅が名前の文字の範囲の幅（名前の要素はノードの幅に伸びるため、文字の範囲で測る）に左右の余白（「文書の Markdown」は 10px・28px、「利用側のページ」は 16px・28px）と枠線 3px を加えた幅から 1px 以内
      - name: test_attach_map_flow_when_fonts_ready
        case: 正常
        summary: 書体を読み込み終えた後に再計測する
        condition: '`document.fonts.ready` を未解決の Promise に差し替えて範囲を描き、名前の幅を測る canvas の `measureText` が返却する幅を広げてから `ready` を解決する。別の範囲は `destroy` してから `ready` を解決する'
        mock: '`document.fonts.ready`・`CanvasRenderingContext2D.prototype.measureText`'
        expected: '`ready` の後に、ノードの幅が広げた幅で再配置した幅になる。`destroy` した範囲は再描画されない'
      - name: test_attach_map_flow_when_first_kind_not_pill
        case: 正常
        summary: 最初の種類が pill でないノードは pill の左の余白で見積もらない
        condition: 種類 `step`（形状 `rounded`）・`outside`（形状 `pill`）の順に持つ「利用側のページ」のノードを持つ範囲を描く
        mock: なし
        expected: ノードの幅が、名前の文字の範囲の幅に左の余白 10px・右の余白 28px・枠線 3px を加えた幅から 1px 以内
      - name: test_attach_map_flow_when_walk_keeps_zoom
        case: 正常
        summary: 案内でグループに入る・出るときも倍率の文字を保つ
        condition: 手順 1 がグループの外、手順 2 が `enter` でグループに入る案内を持つ構成図。倍率を 300% にして手順 1・2・1 と移る。続けて倍率を全体が収まる倍率に戻して同じように移る
        mock: なし
        expected: 300% のときはどの手順の後も倍率のボタンの文字が `300%`。全体が収まる倍率のときはどの手順の後も `100%` で、表示する枠が `data-at-fit` を持つ
      - name: test_attach_map_flow_when_changes
        case: 正常
        summary: 計画した変更を描く
        condition: 補足に `changes`（`added`・`removed`）と知らない値 `moved` を持つ構成図
        mock: なし（Chromium）
        expected: '`added`・`removed` のノードが変更の class とバッジを持ち、`moved` のノードは持たず、図の前の記載の警告に `map_invalid_value` が 1 件。`removed` のノードの名前の計算した `text-decoration-line` が `line-through`。`removed` の線は、辺から延ばす区間を含む経路の全ての `path` の計算した `stroke` が `--mdmark-color-diff-del-sign` の値で、`stroke-dasharray` が `none` でない'
      - name: test_attach_map_flow_when_list
        case: 正常
        summary: 一覧の表示のボタンと書き出すボタン
        condition: 構成図を描いてパネルを開く
        mock: なし（Chromium）
        expected: パネルに `[data-tool="list"]`（`aria-pressed="false"`）と `[data-tool="export"]`（`aria-expanded="false"`）があり、一覧の表示のボタンを押すと表示する枠に `role="tree"` の一覧がある
      - name: test_attach_map_flow_when_packet_style
        case: 正常
        summary: 設定の塗り方と色合い
        condition: '`config.map.packets` に `{ fill: "glow", palette: "vivid" }` を指定して描き、`mount` を押して選ぶ'
        mock: なし
        expected: 図の要素の `data-packet-palette` が `vivid` で、`.map-packet` の `data-fill` が `glow`
      - name: test_attach_map_flow_when_wire_moved_beyond_edge
        case: 正常
        summary: 区間をノードの端の外へ動かす
        condition: 部品設計『mapの構成図』の状態 `WireRouteAfterDrag` の L 字の線の縦の区間を、右上のノードの右端より右へマウスでドラッグする
        mock: なし
        expected: 線の端が右上のノードの右の辺にあり、表示する枠の `scrollLeft` が押す前と同じ
    notes:
      計画した変更・書き出し・一覧の表示: '補足の `changes`（`parseMapData` と `collectMapProblems` で使用できない値・種類・キーを除いたもの）を `renderMapFlow` の `changes` に指定する。ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図は `extension` を通して同じ経路を通る。`renderDiagramFrame` に `exportable: true`・`listable: true` を指定し、`attachMapList` を `flowListItems`（今の図・`notes`・`changes`・種類の名前）で付け、片付ける関数を `destroy` で呼ぶ。描き直しても一覧の表示の状態は保たない'
lead: 'map の構成図の描画と、選んだノードの線と経路の強調を受け持ち、構成図の描画と操作を変えるときに参照する。'
