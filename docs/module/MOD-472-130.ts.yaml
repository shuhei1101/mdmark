id: MOD-472-130
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / flow-view.ts
test_files:
  - tests/unit/src/map/flow-view.browser.test.ts
data_models:
  - name: MapFlowHandle
    title: 構成図の操作の口
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachMapFlow` の戻り値'
    properties:
      - name: focus
        type: '(target: { nodes: string[]; wires: string[] }) => void'
        description: 案内を止めて、外から強調を当てる（シーケンス図の再生）
      - name: clearFocus
        type: () => void
        description: 外から当てた強調を解く
      - name: destroy
        type: () => void
        description: 操作と観察を外す
      - name: follow
        type: '(nodes: string[]) => void'
        description: ノードの中心へ表示する枠をスクロールする（シーケンス図の再生を自動で進めている間。`createFollow` の `reveal`）
      - name: resumeFollow
        type: () => void
        description: 読者が触って止めたスクロールを再開する（`createFollow` の `resume`）
constants:
  - name: DIM_SELECTOR
    title: 薄くする対象
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 強調するときに `map-dim` を付ける要素のセレクター（ノード・線・ラベル・ライフライン）
functions:
  - name: attachMapFlow
    title: 構成図を付ける
    kind: 関数
    container: src/map/flow-view.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 処理
    summary: 構成図を読み取り、状態を読んで配置し、描いて測った大きさで配置し直し、操作を付ける
    scope: public
    callees:
      - MOD-472-137#functions[parseFlowchart]
      - MOD-472-141#functions[layoutMap]
      - MOD-472-129#functions[readMapState]
      - MOD-472-129#functions[writeMapState]
      - MOD-472-134#functions[startDrag]
      - MOD-472-132#functions[attachBand]
      - MOD-472-133#functions[renderMapFlow]
    args:
      - name: range
        type: HTMLElement
        required: true
        description: '`div.mdmark-map`'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を当てた設定
      - name: args
        type: MapArgs
        required: true
        description: 印の引数
      - name: onWalk
        type: () => void
        required: false
        description: 案内の手順を進めたときに呼ぶ関数
    returns:
      type: MapFlowHandle
      description: 強調を外から当てる関数・表示する枠を外からスクロールする関数と片付ける関数
    process: |-
      1. `parseFlowchart`・`parseMapData` で読み、`readMapState`（印の `focus` と、補足の `layout` の `collapsed` が `true` の ID を指定する）で状態を読む
      2. 補足の `layout` に状態の `positions`・`attachments`（`ends` に重ねる）を重ねた上書きで `layoutMap` を配置し、`renderDiagramFrame`（種類 `map`・`wide`・`tools`）と `renderMapFlow` で描く
      3. ノードの中身を測り、見積もりと違う大きさのノードを `size` にして配置し直す。以降はノードの大きさを `ResizeObserver` で見て同じく配置し直す
      4. 補足の `walkthroughs` を `attachBand`（モード `walkthrough`）の手順にする。手順を進めるたびに `onWalk` を呼び、停止で案内を始めたときに中へ入っていたグループに戻す
      4. 開閉・中へ入る・選ぶ・線を指す・動かすの操作と、Esc（選択を解き、無ければ外へ戻る）、右上のボタンを付け、変わるたびに `writeMapState` で保つ。動かす操作は `startDrag` に任せ、`pointerup` か `pointercancel` で保つ（`pointercancel` では `startDrag` が戻した状態を保つ）
      5. 補足に `walkthroughs` があれば `attachBand`（印の `interval`・`play`）で案内の帯を付ける
    unit_tests:
      - name: test_attach_map_flow_when_drag_cancelled
        case: 正常
        summary: 指のドラッグを pointercancel で止めたとき、動かす前の配置を保ち、受け取りを残さない
        condition: ノードに `pointerType` が `touch` の `pointerdown` と、下へ 40px の `pointermove` を発火し、`pointercancel` を発火した後に、さらに下へ 40px の `pointermove` を発火する
        mock: '`writeMapState`'
        expected: '`writeMapState` の最後の呼び出しの `positions` でノードの位置が押す前と同じで、最後の `pointermove` で描き直されない'
      - name: test_attach_map_flow_when_toggle
        case: 正常
        summary: グループを閉じる
        condition: モックの `FLOW` を描き、`store` の開閉のボタンを押す
        mock: '`readMapState`・`writeMapState`'
        expected: '`store` が `map-closed-group` になり、`writeMapState` の `collapsed` が `[store]`'
      - name: test_attach_map_flow_when_select_wire
        case: 正常
        summary: 線を押す
        condition: '`mount`→`marker` の線を押す'
        mock: '`writeMapState`'
        expected: '`selected` が `[mount, marker]`。もう一度押すと空'
      - name: test_attach_map_flow_when_escape
        case: 正常
        summary: Esc
        condition: '`entered: read` で選択が無い'
        mock: なし
        expected: 外へ戻り、`entered` が `lib`
      - name: test_attach_map_flow_when_packets
        case: 正常
        summary: 選んだ線と指した線の印
        condition: '`mount` を押して選ぶ。選択を解いてから `marker->data` の線を指す'
        mock: なし
        expected: 選んでいる間は `mount` の線の上に `.map-packet` があり、選択を解くと無くなる。線を指している間は `marker->data` の上にだけ `.map-packet` があり、離すと無くなる
      - name: test_attach_map_flow_when_walk_leaves_group
        case: 正常
        summary: 中へ入る手順の後の手順
        condition: '手順 3 だけが `enter: place` の案内で、次へを 3 回押してから前へを押す'
        mock: なし（jsdom）
        expected: 手順 3 では `place` の中に入り、前へで手順 2 に戻ると、案内を始めた段（全体）の図に戻る（今入っているグループのタイトルが無い）
      - name: test_attach_map_flow_when_follow
        case: 正常
        summary: 外からスクロールする
        condition: '`follow([mount, marker])` を呼ぶ。表示する枠でホイールを回してからもう一度呼ぶ。`resumeFollow` の後にもう一度呼ぶ'
        mock: 表示する枠の `scrollTo`
        expected: '`scrollTo` を 1 回目と 3 回目だけ呼ぶ'
