constants:
  - name: ALIAS_HEADINGS
    title: エイリアスの区分の見出し
    container: src/parts/term-tip.ts
    summary: '`renderTermTip` がエイリアスの種類ごとに配置する区分の見出し'
    value: '`{ term: "用語", doc: "文書", command: "コマンド", url: "URL", skill: "スキル", tool: "ツール", path: "パス" }`'
    refs:
      - CMP-472-53#args[alias]
