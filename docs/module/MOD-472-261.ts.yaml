functions:
  - name: renderTermTip
    title: 用語のツールチップの HTML を返却する
    container: src/parts/term-tip.ts
    kind: 関数
    scope: internal
    summary: 単語・`id`・意味・関連文書から、部品設計『用語のツールチップ』の単語とツールチップの組の HTML（`mdmark-term-wrap` の中に単語と、その直後のツールチップ）を返却する
    description: 意味だけのときは `role="tooltip"`、関連文書があるときは `role="group"` にする。区分には意味だけのときも見出し（`用語`・`関連文書`）を付ける（モック `docs/mock/components/term-tooltip/` のとおり）。`hidden` は付けず、開閉は CSS（`:hover`・`:focus-within`）と `attachTermTips` が付ける class が決める。`replacement` があるときは `meaning`・`docs` を使用せず、単語に class `mdmark-term mdmark-term-avoided` を付け、`role="tooltip"` のツールチップに見出し `代わりの用語` の区分だけを配置して `mdmark-term-tip-replacement`（代わりの用語の単語）と `mdmark-term-tip-meaning`（意味）を出し（`meaning` が無ければ意味を配置しない）、単語の `aria-describedby` でツールチップを指す。`alias` があるときは `meaning`・`docs` を使用せず、`ALIAS_HEADINGS` の見出しの区分 1 つに `mdmark-term-tip-name`（`name`）と、あれば `mdmark-term-tip-meaning`（`description`、`id` は `{id}-meaning`）を出す。`command` は `mdmark-term-tip-command` の中に `code` とコピーのボタン（`button.mdmark-term-tip-copy`、`type="button"`・`data-state` は `copy`（既定 `idle`）、中身は `renderTermTipCopy`）を並べ、`cwd` があれば `mdmark-term-tip-fields` にラベル `実行場所` と値を配置し、`role="status"` の `mdmark-visually-hidden mdmark-term-tip-status`（`copied`・`failed` のとき `コマンドを{文言}`、`idle` は空）を配置する。`url` は http・https の URL だけを `a.mdmark-term-tip-link`（`href` に URL）にし、ほかは `span.mdmark-term-tip-link` の文字にする。`skill`・`tool`・`path` は値を `code.mdmark-term-tip-code` に出す。コマンドとリンクにした URL を持つツールチップは `role="group"` と `aria-label`（`「{text}」のコマンド`・`「{text}」の URL`）にして単語の `aria-details` で指し、説明があれば単語の `aria-describedby` で説明の要素を指す。ほかの種類は `role="tooltip"` で単語の `aria-describedby` がツールチップを指す。`below` が `true` のときは `mdmark-term-wrap` に `is-below` を付ける（ストーリーが下に開いた外観を出すため。`render` は指定しない）。文字はエスケープする
    args:
      - name: props
        type: '{ text: string; id: string; meaning?: string; docs?: { title: string; href: string; description?: string }[]; replacement?: { term: string; meaning?: string }; alias?: MdmarkAlias; copy?: "idle" | "copied" | "failed"; below?: boolean }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: 単語とツールチップの組の HTML
    unit_tests:
      - name: test_render_term_tip
        case: 正常
        summary: 部品設計の状態ごとに HTML を返却する
        condition: 部品設計『用語のツールチップ』の `TermOnly`・`DocsOnly`・`Both` の引数
        mock: なし
        expected: '`role` が状態のとおりで、`TermOnly` は見出し `用語` だけ、`DocsOnly` は `関連文書` だけ、`Both` は `用語` → `関連文書` の順。どの状態も `hidden` を持たない'
      - name: test_render_term_tip_escapes
        case: 正常
        summary: 意味とタイトルをエスケープする
        condition: 意味に `<script>`
        mock: なし
        expected: '`&lt;script&gt;` になる'
      - name: test_render_term_tip_avoided
        case: 正常
        summary: '`replacement` を指定すると、やめた言い方のマーカーと代わりの用語のツールチップを返却する'
        condition: 部品設計『用語のツールチップ』の `Avoided` の引数に、`meaning`・`docs` も指定したもの
        mock: なし
        expected: 単語の class が `mdmark-term mdmark-term-avoided` で `aria-describedby` がツールチップの `id`、ツールチップが `role="tooltip"` で見出しが `代わりの用語` だけ、`ワークスペース` と意味が出て、指定した `meaning`・`docs` は出ない。`replacement` の単語と意味の `<script>` は `&lt;script&gt;` になる
      - name: test_render_term_tip_below
        case: 正常
        summary: '`below` を指定すると `is-below` を付ける'
        condition: 部品設計『用語のツールチップ』の `Below` と `TermOnly` の引数
        mock: なし
        expected: '`Below` の `mdmark-term-wrap` が `is-below` を持ち、`TermOnly` は持たない'
      - name: test_render_term_tip_alias
        case: 正常
        summary: エイリアスの種類ごとの区分と role を返却する
        condition: 部品設計『用語のツールチップ』の `AliasTerm`・`AliasDoc`・`AliasCommand`・`AliasUrl`・`AliasSkill`・`AliasTool`・`AliasPath` の引数に、`meaning`・`docs` も指定したもの
        mock: なし
        expected: 見出しが順に `用語`・`文書`・`コマンド`・`URL`・`スキル`・`ツール`・`パス` の 1 つだけで、指定した `meaning`・`docs` は出ない。`AliasCommand` と `AliasUrl` が `role="group"`、ほかは `role="tooltip"`。`AliasCommand` に `code` の `npm run test:unit`・`data-state="idle"` の `コピー` のボタン・`実行場所`・空の `role="status"` がある。`AliasSkill` は `mdmark-term-tip-meaning` を持たない
      - name: test_render_term_tip_alias_copy
        case: 正常
        summary: copy の状態をボタンとスクリーンリーダー向けの要素に出す
        condition: 部品設計『用語のツールチップ』の `AliasCommandCopied`・`AliasCommandFailed` の引数
        mock: なし
        expected: ボタンの `data-state` と文言が `copied` と `コピーしました`、`failed` と `コピーできませんでした` で、`role="status"` が `コマンドをコピーしました`・`コマンドをコピーできませんでした`
      - name: test_render_term_tip_alias_url_not_http
        case: 正常
        summary: http・https でない URL をリンクにしない
        condition: 部品設計『用語のツールチップ』の `AliasUrlNotHttp` の引数
        mock: なし
        expected: '`a` 要素が無く、`span.mdmark-term-tip-link` の文字が `javascript:alert(1)` で、`role="tooltip"`'
      - name: test_render_term_tip_alias_escapes
        case: 正常
        summary: エイリアスの値をエスケープする
        condition: '`command` のエイリアスの `name`・`description`・`command`・`cwd` と、`url` のエイリアスの `url` に `<script>` と `"`'
        mock: なし
        expected: 出力に `<script>` が無く `&lt;script&gt;` があり、`href` の `"` が `&quot;` になる
      - name: test_render_term_tip_avoided_without_meaning
        case: 正常
        summary: replacement の meaning が無ければ代わりの用語の単語だけを出す
        condition: 部品設計『用語のツールチップ』の `AliasAvoid` の引数
        mock: なし
        expected: 見出し `代わりの用語` と `ワークスペース` があり、`mdmark-term-tip-meaning` が無い
    refs:
      - CMP-472-53#
    callees:
      - '#functions[renderTermTipCopy]'
  - name: renderTermTipCopy
    title: コマンドのコピーのボタンの中身を返却する
    container: src/parts/term-tip.ts
    kind: 関数
    scope: internal
    summary: コピーのボタンの状態から、ボタンの中に配置するアイコンと文言の HTML を返却する
    description: '`COMMAND_COPY_STATES` の状態のアイコン（`iconSvg`）と文言を並べる。`renderTermTip` と、押した後に状態を変える `attachTermTips` が使用する'
    args:
      - name: state
        type: '"idle" | "copied" | "failed"'
        required: true
        description: ボタンの状態
    returns:
      type: string
      description: ボタンの中身の HTML
    unit_tests:
      - name: test_render_term_tip_copy
        case: 正常
        summary: 状態ごとのアイコンと文言を返却する
        condition: '`idle`・`copied`・`failed`'
        mock: なし
        expected: 文言が順に `コピー`・`コピーしました`・`コピーできませんでした` で、それぞれ `svg` を持つ
    status: planned
    introduced:
      pr: 176
