id: MOD-472-14
visibility: internal
title: ClaudeCodeプラグイン / プラグインのビルド / build-plugin.ts
lead: 配布物のビルド（`scripts/build.ts`）から呼ばれ、ガイドの索引を検査してから、フックをまとめ、まとめた依存のライセンスを `plugin/` に書き込む。MCP サーバーとガイドはまとめない。
test_files:
  - tests/unit/scripts/build-plugin.test.ts
directory: |-
  ```tree
  scripts/
  ├── build-plugin.ts   # プラグインのビルド
  └── licenses/         # まとめた依存の中に取り込まれたパッケージのライセンスの本文（{名前}.txt）
  guide/
  └── index.yaml        # ガイドの索引の原本
  .claude-plugin/
  └── marketplace.json  # マーケットプレイスの定義（plugin/ を記載する）
  plugin/
  ├── .claude-plugin/plugin.json  # 名前・説明（`version` を持たず、Claude Code が commit の短縮 SHA をバージョンにする）
  ├── .mcp.json         # type: http で http://127.0.0.1:${MDMARK_PORT:-8782}/mcp につなぐ
  ├── hooks/hooks.json  # `project_dir` を使用するツールの PreToolUse で scripts/pre-tool-use.js、`Write|Edit` の PreToolUse・UserPromptSubmit・PreCompact で scripts/guide-notice.js を実行する
  ├── scripts/          # まとめたフック（pre-tool-use.js・session-start.js・guide-notice.js。生成）
  └── THIRD_PARTY_LICENSES.txt  # まとめた依存のライセンス（生成）
  ```
constants:
  - name: PLUGIN_ENTRY_POINTS
    title: プラグインにまとめる入口
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: まとめるソースと記載する先
    entries:
      - key: src/plugin/pre-tool-use.ts
        value: plugin/scripts/pre-tool-use.js
        description: PreToolUse のフック
      - key: src/plugin/session-start.ts
        value: plugin/scripts/session-start.js
        description: SessionStart のフック
      - key: src/plugin/guide-notice.ts
        value: plugin/scripts/guide-notice.js
        description: '`Write|Edit` の PreToolUse・UserPromptSubmit・PreCompact のフック（記法のルールの参照の案内）'
      - key: src/plugin/setup/main.ts
        value: plugin/bin/setup.js
        description: '`global-setup`・`setup` のスキルが呼ぶスクリプト'
    status: planned
    introduced:
      pr: 72
  - name: PLUGIN_OUTPUTS
    title: ビルドが記載するプラグインの生成物
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: ビルドの最初と失敗したときに削除する、`plugin/` の中の生成物
    value: '["plugin/scripts", "plugin/bin", "plugin/templates", "plugin/THIRD_PARTY_LICENSES.txt"]'
    status: planned
    introduced:
      pr: 72
  - name: GUIDE_SOURCE
    title: ガイドの索引の原本
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: リポジトリの直下からのガイドの索引のパス
    value: guide/index.yaml
    refs:
      - ER-472-4#
    status: planned
    introduced:
      pr: 72
  - name: PLUGIN_MANIFEST
    title: プラグインの定義
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: バージョンを記載するプラグインの定義のパス
    value: plugin/.claude-plugin/plugin.json
    status: removed
    introduced:
      pr: 72
  - name: EMBEDDED_LICENSES_DIR
    title: 取り込まれたパッケージのライセンスの配置場所
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: まとめたパッケージの配布物の中に取り込まれ、`node_modules` に無いパッケージのライセンスの本文を配置するフォルダ。ファイル名は `{名前}.txt`（スコープの `/` は `__`）
    value: scripts/licenses
    reason: MCP の SDK の配布物は ajv などを取り込んでいるが、その著作権表示を含まない
    refs:
      - LIB-472-2#limitations[まとめたときのライセンスの表示]
    status: planned
    introduced:
      pr: 72
  - name: CONFIG_TEMPLATE
    title: プラグインに写す mdmark.config.yaml の雛形
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: '`setup` のスキルが使用する `templates/mdmark.config.yaml` を `plugin/templates/mdmark.config.yaml` へ写す'
    value: '{ from: "templates/mdmark.config.yaml", to: "plugin/templates/mdmark.config.yaml" }'
    status: planned
    introduced:
      pr: 354
functions:
  - name: checkGuideSource
    title: ガイドの索引を検査する
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: '`guide/index.yaml` を読み込み、構造と指すページの有無を検査する'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ root: string }'
        required: true
        description: 作業ツリーの場所
    returns:
      type: 'Promise<{ entries: GuideEntry[]; problems: string[] }>'
      description: 合う行と、標準エラーに出す問題の行
    process: |-
      1. `GUIDE_SOURCE` を YAML として読み込む。読み込めなければ「ガイドの索引を読み込めない: guide/index.yaml（{理由}）」を問題にして返却する
      2. ガイドの索引を検査し、合わないところを `guide/index.yaml:{場所}: {内容}` の行にする（ガイドの索引を検査する）
      3. 行ごとに `page` が作業ツリーにあるかを確認し、無ければ `guide/index.yaml:guides[{n}].page: {ページ} が無い` を問題にする
    unit_tests:
      - name: test_check_guide_source
        case: 正常
        summary: 合う索引は問題が無い
        condition: 2 行の索引と、指す 2 ページ
        mock: なし（一時フォルダ）
        expected: '`entries` が 2 行、`problems` が空'
      - name: test_check_guide_source_when_page_missing
        case: 正常
        summary: 無いページを指す
        condition: 2 行目のページが無い
        mock: なし（一時フォルダ）
        expected: '`problems` に `guides[1].page` を含む行'
      - name: test_check_guide_source_when_invalid
        case: 正常
        summary: 構造に合わない索引
        condition: 行に `when` が無い
        mock: なし（一時フォルダ）
        expected: '`problems` に `guide/index.yaml:guides[0].when` で始まる行'
      - name: test_check_guide_source_when_unreadable
        case: 正常
        summary: 索引が無い
        condition: '`guide/index.yaml` が無い'
        mock: なし（一時フォルダ）
        expected: '`problems` に `guide/index.yaml` を含む行'
    callees:
      - MOD-472-4#functions[parseGuideIndex]
    status: planned
    introduced:
      pr: 72
  - name: listEmbeddedPackages
    title: 取り込まれたパッケージを参照する
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: まとめた入力のソースマップの `sources` から、パッケージの配布物に取り込まれた別のパッケージの名前を参照する
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ metafile: Metafile; root: string }'
        required: true
        description: esbuild の出力と作業ツリーの場所
    returns:
      type: string[]
      description: 取り込まれたパッケージの名前（名前の順、重なりなし）。`node_modules` からまとめたパッケージ自身は含めない
    process: |-
      1. `node_modules/` の下の入力ごとに、同じパスに `.map` を追加したソースマップがあれば JSON として読み込む
      2. `sources` のうち `node_modules/` を含むパスの最後の `node_modules/` の後ろから `@scope/name` か `name` を取り出す
      3. 入力のパッケージ自身を除き、名前の順に返却する
    unit_tests:
      - name: test_list_embedded_packages
        case: 正常
        summary: ソースマップの sources から名前を参照する
        condition: 入力 `node_modules/pkg/dist/a.mjs` の `a.mjs.map` の `sources` に `../../node_modules/.pnpm/ajv@8.18.0/node_modules/ajv/dist/x.js` と `../src/y.ts`
        mock: なし（一時フォルダ）
        expected: '`["ajv"]`'
      - name: test_list_embedded_packages_when_no_map
        case: 正常
        summary: ソースマップが無い入力は飛ばす
        condition: '`.map` の無い入力だけ'
        mock: なし（一時フォルダ）
        expected: 空
    status: planned
    introduced:
      pr: 72
  - name: writePluginLicenses
    title: プラグインの依存のライセンスを記載する
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: まとめたパッケージと、その中に取り込まれたパッケージのライセンスの本文を `plugin/THIRD_PARTY_LICENSES.txt` に書き込む
    scope: public
    is_async: true
    side_effects: '`plugin/THIRD_PARTY_LICENSES.txt` を書き込む'
    args:
      - name: options
        type: '{ metafile: Metafile; root: string }'
        required: true
        description: esbuild の出力と作業ツリーの場所
    returns:
      type: Promise<void>
      description: なし
    process: |-
      1. まとめたパッケージごとに、`node_modules` のそのパッケージの `package.json` の名前・バージョン・ライセンスと、ライセンスのファイルの本文を並べる（`writeThirdPartyLicenses` と同じ記載方法）
      2. 取り込まれたパッケージごとに、`EMBEDDED_LICENSES_DIR` の本文を並べる（取り込まれたパッケージを参照する）
      3. 全てを空行でつないで記載する
    exceptions:
      - name: Error
        condition: 取り込まれたパッケージの本文が `EMBEDDED_LICENSES_DIR` に無い
        message: 'ライセンスの本文が無い: {名前}（scripts/licenses/{ファイル名} を配置する）'
      - name: Error
        condition: まとめたパッケージにライセンスのファイルが無い
        message: 'ライセンスの本文が無い: {名前}'
    unit_tests:
      - name: test_write_plugin_licenses
        case: 正常
        summary: まとめたパッケージと取り込まれたパッケージの本文を記載する
        condition: metafile の入力に `node_modules/pkg` があり、そのソースマップが `ajv` を指し、`scripts/licenses/ajv.txt` がある
        mock: なし（一時フォルダ）
        expected: '`plugin/THIRD_PARTY_LICENSES.txt` に `pkg` の名前・バージョン・本文と `ajv` の本文がある'
      - name: test_write_plugin_licenses_when_embedded_license_missing
        case: 異常
        summary: 取り込まれたパッケージの本文が無い
        condition: '`scripts/licenses/ajv.txt` が無い'
        mock: なし（一時フォルダ）
        expected: '`Error` を投げ、メッセージに `ajv` と `scripts/licenses/ajv.txt` が入る'
        exception: 取り込まれたパッケージの本文が `EMBEDDED_LICENSES_DIR` に無い
    callees:
      - '#functions[listEmbeddedPackages]'
    refs:
      - MOD-472-166#functions[writeThirdPartyLicenses]
    status: planned
    introduced:
      pr: 72
  - name: writePluginManifest
    title: プラグインのバージョンを記載する
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: '`PLUGIN_MANIFEST` の `version` を埋めるバージョンにし、他のキーと並びは保つ'
    description: Claude Code は `version` が変わったときだけプラグインを更新するため、hotfix の `--version` でも `dist/` と同じバージョンを書き込む
    scope: public
    is_async: true
    side_effects: '`PLUGIN_MANIFEST` を書き換える'
    args:
      - name: options
        type: '{ root: string; version: string }'
        required: true
        description: 作業ツリーの場所と埋めるバージョン（`v{MAJOR}.{MINOR}.{PATCH}`）
    returns:
      type: Promise<void>
      description: なし
    process: |-
      1. `PLUGIN_MANIFEST` を JSON として読み込み、`version` を置き換える
      2. 2 字下げと末尾の改行で記載する
    status: removed
    introduced:
      pr: 72
  - name: removePluginOutputs
    title: プラグインの生成物を削除する
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: '`PLUGIN_OUTPUTS` を削除する。無いものは飛ばす'
    scope: public
    is_async: false
    side_effects: '`PLUGIN_OUTPUTS` を削除する'
    args:
      - name: root
        type: string
        required: true
        description: 作業ツリーの場所
    returns:
      type: void
      description: なし
    process: 1. `PLUGIN_OUTPUTS` の各パスを、下のファイルごと削除する
    unit_tests:
      - name: test_remove_plugin_outputs
        case: 正常
        summary: 生成物だけを削除する
        condition: '`plugin/scripts/pre-tool-use.js` と `plugin/.mcp.json` がある'
        mock: なし（一時フォルダ）
        expected: '`plugin/scripts` が無く、`plugin/.mcp.json` が残る'
    status: planned
    introduced:
      pr: 72
  - name: buildPlugin
    title: プラグインをビルドする
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: ガイドの索引を検査し、合えばフックをまとめ、ライセンスを `plugin/` に書き込む
    description: '`dist/` を書き込んだ後に `main` が呼ぶ。`src/plugin/pre-tool-use.ts` が無ければ何もしない（ソースの一部だけを配置した単体テストのため）'
    scope: public
    is_async: true
    side_effects: '`PLUGIN_OUTPUTS` を記載する。`plugin/.claude-plugin/plugin.json` は書き換えない'
    args:
      - name: options
        type: '{ version: string; root: string }'
        required: true
        description: 埋めるバージョンと作業ツリーの場所
    returns:
      type: Promise<string[]>
      description: 問題の行。問題があれば `plugin/` に何も書き込まずに返却する
    process: |-
      1. `src/plugin/pre-tool-use.ts` が無ければ空を返却する
      2. ガイドの索引を検査し、問題があれば返却する（ガイドの索引を検査する）
      3. `PLUGIN_ENTRY_POINTS` を esbuild でまとめる。`platform: node`・target は CLI と同じ Node・先頭に CLI と同じ行・バージョンを `__MDMARK_VERSION__` に埋める・`metafile` を取る
      4. `CONFIG_TEMPLATE` をコピーし、ライセンスを記載して、空を返却する（プラグインの依存のライセンスを記載する）
    unit_tests:
      - name: test_build_plugin_when_source_missing
        case: 正常
        summary: プラグインのソースが無ければ何も書き込まない
        condition: '`src/plugin/pre-tool-use.ts` の無い一時フォルダ'
        mock: なし（一時フォルダ）
        expected: 空を返却し、`plugin/scripts` が無い
      - name: test_build_plugin_when_guide_invalid
        case: 正常
        summary: 索引に問題があれば記載せずに問題を返却する
        condition: '`src/plugin/pre-tool-use.ts` があり、`guide/index.yaml` のページが無い'
        mock: なし（一時フォルダ）
        expected: 問題の行を返却し、`plugin/scripts` が無い
    callees:
      - '#functions[checkGuideSource]'
      - '#functions[writePluginLicenses]'
    refs:
      - IF-472-41#
    status: planned
    introduced:
      pr: 72
