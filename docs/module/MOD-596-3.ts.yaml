lead: 'Mermaid の C4Context の読み取りと構成図の入力への変換を受け持ち、map の C4 図の読み取りを変えるときに参照する。'
tags:
  - name: topic:map
    main: true
  - name: topic:図
  - name: action:読み取り
  - name: action:変換
