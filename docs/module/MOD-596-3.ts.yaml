id: MOD-596-3
visibility: internal
title: ライブラリ本体 / map / 読み取り / c4.ts
test_files:
  - tests/unit/src/map/c4.test.ts
data_models:
  - name: C4Diagram
    title: C4図の読み取り結果
    container: src/map/c4.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`parseC4` の戻り値'
    properties:
      - name: kind
        type: '"C4Context" | "C4Container" | "C4Component" | "C4Dynamic" | "C4Deployment"'
        description: 1 行目の図の種類
      - name: title
        type: string | undefined
        description: '`title` の行'
      - name: boundaries
        type: C4Boundary[]
        description: 境界と配置先のノード（`id`・`label`・`kind`・`technology`・`parent`・`side`）。`kind` は `enterprise`・`system`・`container`・`boundary`・`deployment`。`technology` は配置先のノードの種類の引数。`side` は `Node_L` の `left`・`Node_R` の `right`
      - name: elements
        type: C4Element[]
        description: 要素（`id`・`label`・`description`・`technology`・`kind`・`external`・`parent`）。`kind` は `person`・`system`・`system_db`・`system_queue`・`container`・`container_db`・`container_queue`・`component`・`component_db`・`component_queue`
      - name: relations
        type: C4Relation[]
        description: 関係（`id`・`from`・`to`・`label`・`technology`・`both`・`direction`・`index`）。`id` は記載順の `r{番号}`（1 から）。`direction` は `Rel_U`・`Rel_D`・`Rel_L`・`Rel_R`（`Rel_Up` などの長い名前を含む）・`Rel_Back` の `up`・`down`・`left`・`right`・`back`。`index` は `C4Dynamic` の `Rel`・`RelIndex` の記載順の番号（1 から。`RelIndex` の第 1 引数は読まない）
      - name: problems
        type: MapProblem[]
        description: 読めない行と閉じの無い境界
constants:
  - name: MAP_C4_KINDS
    title: C4図のノードの種類
    container: src/map/c4.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 'C4 図の要素の種類と `_Ext` ごとの `MapKind`'
    description: |-
      要素の種類と `_Ext` ごとの `MapKind`（種類の行 `[Person]`・`[Software System]`・`[Container]`・`[Component]` と `External` を付けた行、人は `user`・`*Db` は `database` のアイコン、`*Queue` は形状 `pill`、`_Ext` は色 `gray`）。
      キーは `mdmark-c4-{種類}`・`mdmark-c4-{種類}-ext`。
      技術の引数を持つ要素の種類の行（`[Container: {技術}]`）は `c4ToFlowchart` がノードごとに作る
functions:
  - name: parseC4
    title: C4図を読む
    kind: 関数
    container: src/map/c4.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`C4Context`・`C4Container`・`C4Component`・`C4Dynamic`・`C4Deployment` の Mermaid を、種類・タイトル・境界と配置先のノード・要素・関係と読めない行の項目に読む'
    scope: public
    args:
      - name: source
        type: string
        required: true
        description: mermaid のブロックの中身
    returns:
      type: C4Diagram
      description: 読み取り結果
    process: |-
      1. 1 行目の図の種類を `kind` にし、行ごとに、`title {文}`・境界の関数（`Enterprise_Boundary`・`System_Boundary`・`Container_Boundary`・`Boundary`）と配置先のノードの関数（`Deployment_Node`・`Node`・`Node_L`・`Node_R`）と `{`・要素の関数（`Person`・`System`・`SystemDb`・`SystemQueue`・`Container`・`ContainerDb`・`ContainerQueue`・`Component`・`ComponentDb`・`ComponentQueue` とその `_Ext`）・関係の関数（`Rel`・`BiRel`・`RelIndex`・`Rel_U`・`Rel_D`・`Rel_L`・`Rel_R` と長い名前）・`}`・`%%`・空の行に分けて読む
      2. 関数の引数は `"…"` と識別子をカンマで分けて読み、要素は別名・名前・（コンテナ・コンポーネントは技術・）説明、配置先のノードは別名・名前・種類、関係は元・先・ラベル・技術の順にする。`RelIndex` は第 1 引数を捨てて残りを関係と同じに読む。`C4Dynamic` の関係に記載順の `index` を振る
         - 読めない行・閉じの無い境界と配置先のノード・その図の種類で使わない関数は `map_invalid` の項目にして読み飛ばす
    unit_tests:
      - name: test_parse_c4_context
        case: 正常
        summary: モックの C4 図
        condition: モックの `C4`（`docs/mock/refs/596/assets/samples.js`）
        mock: なし
        expected: '`kind` が `C4Context`、タイトル `注文のシステムの全体`・境界 2（`shop` の親が `company`、`kind` が `system`）・要素 7・関係 6（`r1`〜`r6`）で、`support` が外部の `person`、`events` が `system_queue`、`r1` の技術が `HTTPS`、`r3` の `direction` が `right`、`r4` の `both` が `true`'
      - name: test_parse_c4_context_when_unclosed
        case: 異常
        summary: 閉じの無い境界
        condition: '`System_Boundary(shop, "通販") {` の後に `}` が無い'
        mock: なし
        expected: '`map_invalid` が 1 件'
      - name: test_parse_c4_when_container
        case: 正常
        summary: コンテナ図
        condition: モックの `CONTAINER`（`docs/mock/refs/660/assets/samples.js`）
        mock: なし
        expected: '`kind` が `C4Container` で、`api` の `kind` が `container`・`technology` が `Node.js`、`db` が `container_db`、`mail` が外部の `container`、境界 `shop` の `kind` が `container`'
      - name: test_parse_c4_when_dynamic
        case: 正常
        summary: 動的図
        condition: モックの `DYNAMIC`
        mock: なし
        expected: 関係 4 つの `index` が 1〜4 で、3 つ目（`RelIndex(5, …)`）の `index` が 3
      - name: test_parse_c4_when_deployment
        case: 正常
        summary: 配置図
        condition: モックの `DEPLOYMENT`
        mock: なし
        expected: 配置先のノード 5 つの `kind` が `deployment`、`region` の親が `cloud`・`technology` が `ap-northeast-1`、`app` の `side` が `left`・`dbnode` が `right`
      - name: test_parse_c4_when_unreadable
        case: 異常
        summary: 読めない行
        condition: モックの `UNREADABLE`
        mock: なし
        expected: '`map_invalid` が 1 件で、要素 `customer`・`web` と関係 `r1` が読める'
  - name: c4ToFlowchart
    title: C4図を構成図の入力にする
    kind: 関数
    container: src/map/c4.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 要素をノード、境界をグループ、関係を線にした、上から下の `Flowchart` と、段と並びの上書きを作る
    scope: public
    args:
      - name: diagram
        type: C4Diagram
        required: true
        description: 読み取り結果
    returns:
      type: '{ chart: Flowchart; overrides: Record<string, MapOverride>; reversed: string[]; kinds: Record<string, MapKind> }'
      description: '両端が読めた要素か境界の関係だけを線にする（読めない行の要素を指す関係は描かない）。線の ID は `r{番号}`、ラベルは「{ラベル} [{技術}]」、`BiRel` は両向きの矢じり。`reversed` は矢じりを線の元の側に描く線（`Rel_U` と `Rel_Back`。`BiRel` を除く）。`Rel_U` は先を元にして引き、`Rel_L`・`Rel_R` は `rankless` にして先に `align`（同じ段）と、`Rel_R` なら元より後・`Rel_L` なら前の `order` を指定する。要素の大きさは、幅 `MAP_C4.width` と、名前の行に説明の行の数（`MAP_C4.descriptionChars` 文字ごとに 1 行）を足した高さの見積もり（描いた後に測り直す）。閉じた境界のノードは、種類を含むタイトルが収まる `mapClosedGroupSize` の大きさ。種類の行は技術の引数を持つ要素で `[Container: {技術}]` のようにし、その要素の種類を `kinds`（`mdmark-c4-{種類}--{別名}` から `MapKind`）に入れて返す。`C4Dynamic` の線のラベルは「{index}: {ラベル}」。配置先のノードのグループのタイトルは「{名前}［{種類}］」。`Node_L`・`Node_R` の兄弟は、`Node_L` が前・`Node_R` が後の `order` と同じ段の `align` にする'
    unit_tests:
      - name: test_c4_to_flowchart
        case: 正常
        summary: 段と並び
        condition: モックの `C4`
        mock: なし
        expected: '`r3` が `rankless` で、`stock` の上書きが `align: store` と `store` より大きい `order`、`r1` のラベルが `注文する [HTTPS]`、`r4` が両向き、境界 `shop` のタイトルが `通販`'
      - name: test_c4_to_flowchart_when_up_and_back
        case: 正常
        summary: 上向きと逆向きの関係の矢じり
        condition: '`Rel_U(a, b)` と `Rel_Back(a, c)`'
        mock: なし
        expected: '`r1` が `b` から `a` への線で、`reversed` が `r1`・`r2`、`r2` は `a` から `c` への線で `direction` が `back`'
      - name: test_c4_to_flowchart_when_dynamic
        case: 正常
        summary: 動的図の番号
        condition: モックの `DYNAMIC`
        mock: なし
        expected: '`r1` のラベルが `1: 注文を入力する`、`r3` のラベルが `3: 注文を保存する [SQL]`'
      - name: test_c4_to_flowchart_when_deployment
        case: 正常
        summary: 配置先のノードの並び
        condition: モックの `DEPLOYMENT`
        mock: なし
        expected: 'グループ `cloud` のタイトルが `クラウド［AWS］`、`dbnode` の上書きが `align: app` と `app` より大きい `order`'
      - name: test_c4_to_flowchart_when_unreadable
        case: 異常
        summary: 読めない行の要素を指す関係
        condition: モックの `UNREADABLE`
        mock: なし
        expected: 線が `r1` だけで、読めない行の `api` を指す `r2` が無い
