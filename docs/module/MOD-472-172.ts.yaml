    value: '0.1464'
functions:
  - name: renderDiagramFrame
    title: 図の枠を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図の枠』の HTML。タイトル・ボタンの帯（縮小・倍率・拡大・全画面。倍率のボタンは全体が収まる倍率を 100% とした等幅の数字の `{倍率}%` とスクリーンリーダー向けの名前 `倍率 {倍率}%。全体が収まる倍率に戻す`。`zoom` は定義の大きさを 1 とする倍率で、大きさのノードと中身の `scale()` に使用する。倍率のボタンの文字は `zoom / fit`、縮小の `disabled` と移動のボタンの有無は `zoom <= fit`、拡大の `disabled` は `zoom >= ZOOM.max` で決める。`fit` は省くと 1）・表示する枠・ツールチップの中身・凡例を並べ、表示する枠に `body` を差す。`resizable` が `true`（既定。`modal` のときは配置しない）なら表示するノードの右下に部品設計『図の枠』のリサイズハンドル（`div.mdmark-diagram-resize`。`aria-valuenow` などは `mount` が付ける）を配置し、`legend` が空なら凡例の `ul` に `hidden` を付ける。`stickyTitles` が `false` のときは `figure` に `data-sticky-titles="off"` を付ける。`scope`・`updated` を持たない（種類 `mermaid`）ときは、タイトルに範囲と更新日を出さない。`fitMin` を指定したときは `figure` に `data-fit-min` を付ける。`id` は `render` の中の通し番号で文書の中で一意にする
    args:
      - name: frame
        type: '{ kind; title; scope?; updated?; legend; zoom?; fit?; fitMin?: number; modal?; resizable?: boolean; stickyTitles?: boolean; wide?: boolean; touchActive?: boolean; tools?: Array<{ name: string; label: string; disabled?: boolean }>; id: string }'
        required: true
        description: 部品設計の引数（`touchActive` は表示するノードに `data-touch-active` を付ける。ストーリーの状態 `TouchActive` だけが指定する）と、開いたときの倍率の下限（`fitMin`。mermaid の図が指定する。map の図は `1`）と、タイトル・ツールチップに使用する `id` の頭。`wide` は本文の幅との切り替えのボタンを出さず、`tools` は右上の帯の先頭に並べるボタン。リサイズハンドルは表示する枠の下端（横のスクロールバーの下）の帯にし、アイコンを `iconSvg("equal")` にする
      - name: body
        type: '{ html: string; width: number; height: number; tips: string }'
        required: true
        description: 中の図の HTML と大きさ、ツールチップの中身の HTML
    returns:
      type: string
      description: '`figure.mdmark-diagram` の HTML'
    unit_tests:
      - name: test_render_diagram_frame
        case: 正常
        summary: タイトル・ボタンの帯・凡例をこの順に出す
        condition: '`kind` が `flow`、`legend` が 2 項目'
        mock: なし
        expected: '`figcaption`・`role="toolbar"`・`role="group"` の表示する枠・`aria-label="凡例"` の `ul` がこの順にあり、移動のボタンのまとまりが `hidden`'
      - name: test_render_diagram_frame_when_modal
        case: 正常
        summary: モーダルでは閉じるボタンを配置する
        condition: '`modal` が `true`'
        mock: なし
        expected: '`aria-label="全画面を閉じる"` のボタンがあり、全画面で開くボタンが無い'
      - name: test_render_diagram_frame_when_zoom_button
        case: 正常
        summary: 戻すのボタンを配置せず、倍率をボタンにする
        condition: '`zoom` が `0.6875`、`fit` が `0.55`'
        mock: なし
        expected: 帯のボタンが `縮小`・`倍率 125%。全体が収まる倍率に戻す`・`拡大`・`全画面で開く` の順で、倍率のボタンの文字が `125%`、`rotate-ccw` のアイコンが無い
      - name: test_render_diagram_frame_when_resizable
        case: 正常
        summary: 'リサイズハンドルを配置し、モーダルと `resizable: false` では配置しない'
        condition: '`resizable` を省いた枚、`resizable: false` の枚、`modal: true` の枚'
        mock: なし
        expected: 省いた枚だけ `div.mdmark-diagram-resize` があり、`role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"`・`aria-label="「{題名}」の表示の高さ"`・`equal` のアイコンを持つ
      - name: test_render_diagram_frame_when_no_legend
        case: 正常
        summary: 凡例の項目が空なら凡例を隠し、タイトルを留めない図にマーカーを付ける
        condition: '`legend: []`、`stickyTitles: false`'
        mock: なし
        expected: '`aria-label="凡例"` の `ul` が `hidden` を持ち、`figure` が `data-sticky-titles="off"` を持つ'
      - name: test_render_diagram_frame_when_mermaid
        case: 正常
        summary: 種類 mermaid は範囲と更新日を出さず、倍率の下限を付ける
        condition: '`kind` が `mermaid`、`title` が `問い合わせの受付`、`scope`・`updated` を省き、`legend: []`、`fitMin: 0.75`'
        mock: なし
        expected: '`figure` が `data-diagram="mermaid"`・`data-fit-min="0.75"` を持ち、`figcaption` の文字が `問い合わせの受付` だけで `time` 要素が無い'
      - name: test_render_diagram_frame_when_map
        case: 正常
        summary: 種類 map の枠
        condition: '`kind: map`・`wide: true`・`legend: []`・`tools` に 4 つ'
        mock: なし
        expected: 範囲と更新日と凡例と本文の幅との切り替えのボタンが無く、右上の帯の先頭に 4 つのボタンが記載の順に並ぶ
      - name: test_render_diagram_frame_when_resize_strip
        case: 正常
        summary: リサイズハンドルの帯
        condition: '`resizable: true`'
        mock: なし
        expected: リサイズハンドルが表示する枠の後ろにあり、`equal` のアイコンを持つ
  - name: renderFlow
    title: フロー図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 定義の座標に枠・層・ノードを配置し、`jumpPaths` のパスで線を svg に描く。判定フローチャートのノードは `data-kind` で CSS が構造（開始は円・アクションは角の丸くない四角・結果は両端の丸い形状）を当て、質問のノードにはノードの幅と高さを `viewBox` にした菱形の `polygon` の svg（`aria-hidden`）を配置する。名前は構造に内接する四角に配置し、質問は上下に高さの 1/4・左右に幅の 1/4、開始は幅 × `CIRCLE_INSET` の余白を `style` に適用する。ノードの種類のアイコン・`io` か `hint` を持つノードの右上のマーカー・`hint` を持つ枠と層のタイトルの右のマーカー（`button.mdmark-diagram-info.mdmark-diagram-group-info`。`aria-label` は `「{タイトル}」の説明`）・線のラベルを配置し、`href` を持つノードには class `has-link` と、名前の後ろ・右上のマーカーの前にノードの全体を覆う `<a class="mdmark-diagram-node-link" href="{href}" aria-label="{name}">` を配置する、枠と層のタイトルにはグループの上端と下端の `data-sticky-top`・`data-sticky-bottom` を付け（`hints` がオフならマーカーとツールチップの中身を配置しない）、`{{単語}}` は用語の照合に回す
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: 読み込めた定義
      - name: id
        type: string
        required: true
        description: ツールチップと矢じりの `id` の頭
      - name: hints
        type: boolean
        required: true
        description: 機能 `hints` がオンか
      - name: lookup
        type: TermLookup
        required: false
        description: ノードの中の `{{単語}}` の意味を参照する関数。省くと単語だけを出す
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_flow
        case: 正常
        summary: 枠・層・ノード・線・ツールチップを出す
        condition: '`inquiry` の定義'
        mock: なし
        expected: 層が 3 つ、ノードが 9 つ、線が 10 本、`role="tooltip"` が `tip` の線と `io` のノードの数だけあり、`loop` の線が `stroke-dasharray="8 4"` を持つ
      - name: test_render_flow_when_text_escaped
        case: 異常
        summary: 定義の文字の HTML を文字にする
        condition: ノードの `name` が `<img src=x onerror=alert(1)>`
        mock: なし
        expected: 出力に `<img` が無く、`&lt;img` がある
      - name: test_render_flow_when_hint
        case: 正常
        summary: hint だけを持つノードにもマーカーを配置し、hints がオフならマーカーもツールチップも配置しない
        condition: '`inquiry-hint` の定義を `hints` が `true` と `false` で描く'
        mock: なし
        expected: '`true` でノード `mcp` のマーカーが `aria-label="「窓口の MCP」の説明"` を持ち、`false` で `role="tooltip"` とノードのマーカーが無く、線のラベルとノードの名前はある'
      - name: test_render_flow_when_judgement
        case: 正常
        summary: 判定フローチャートのノードを種類ごとの構造と余白で描く
        condition: モックの `judgement` の定義
        mock: なし
        expected: '`data-kind` が `start`・`question`・`action`・`result` のノードが 1・2・1・2 つあり、質問のノードだけが `viewBox="0 0 280 136"` と `points="140,0 280,68 140,136 0,68"` の `aria-hidden="true"` の svg を持ち、質問のノードの `style` が `padding:34px 70px`、開始のノードの `style` が `padding:14.6px`、線のラベルに `YES`・`NO` がある'
      - name: test_render_flow_when_node_link
        case: 正常
        summary: href を持つノードをリンクにし、マーカーをリンクの外に配置する
        condition: モックの `linked` の定義を `hints` が `true` で描く
        mock: なし
        expected: '`href` を持つ 2 つのノードが `has-link` と `a.mdmark-diagram-node-link`（`aria-label` がノードの名前）を持ち、`io` のマーカーは `a` の後ろにあって `a` の中に無い。`href` を持たないノードは `a` を持たない'
      - name: test_render_flow_when_group_hint
        case: 正常
        summary: 枠と層の `hint` のマーカーと留める範囲を配置する
        condition: モックの `inquiry-groups` の定義を `hints` が `true` と `false` で描く
        mock: なし
        expected: '`true` で枠と LLM の層のタイトルに `aria-label="「{タイトル}」の説明"` のマーカーがあり、`hint` を持たない層には無い。枠のタイトルが `data-sticky-top` と `data-sticky-bottom`（枠の `y` と `y + h`）を持つ。`false` でタイトルのマーカーが無い'
  - name: renderSequence
    title: シーケンス図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: '相手を左から右に等間隔で、メッセージを上から下に等間隔で配置し、`reply` は破線と開いた矢じり、`loop` は右の帯を通る破線と戻り先のラベルにする。相手の行は別の層にし、表示する枠の縦のスクロールの量を倍率で割った分だけ `translateY` で下げて上端に留める（`attachDiagrams` が動かす）'
    args:
      - name: definition
        type: MdmarkSequenceDefinition
        required: true
        description: 読み込めた定義
      - name: id
        type: string
        required: true
        description: '`id` の頭'
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_sequence
        case: 正常
        summary: 相手とメッセージを順に配置する
        condition: '`inquiry-seq` の定義'
        mock: なし
        expected: 相手のノードの x が定義の順に増え、メッセージの y が順に増え、`reply` の線と戻りの線が破線で、戻り先のラベルがある
  - name: legendFor
    title: 凡例の項目
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 'フロー図とシーケンス図は、定義に 2 種類以上あるノード（シーケンス図は相手）の種類（名前は `KIND_STYLES` の `legend`）と線の種類だけを並べ、枠・層・交差・マーカー・下線は記載しない（1 種類だけのものは記載せず、どちらも 1 種類なら空を返却する）。グラフは系列（円とドーナツは項目）を並べる。外部のシステムに `（枠の外）` を添えるのは枠を持つ図だけ。`combo` で `y2` を持つ図は系列の名前に `（左の軸）`・`（右の軸）` を添え、`bubble` は `円の面積: {size.label}` の項目を加え、`donut` は `pie` と同じく項目の名前と値を並べる。ER 図は図にあるテーブルの種類の札（名前は `{札}のテーブル`）・列のマーカー（`ER_COLUMN_KEYS` の `title`）・多重度の記号（`ER_CARDINALITIES` の名前）だけを並べる'
    args:
      - name: definition
        type: MdmarkFlowDefinition | MdmarkSequenceDefinition | MdmarkChartDefinition | MdmarkErDefinition
        required: true
        description: 読み込めた定義
    returns:
      type: '{ sample: string; label: string }[]'
      description: 凡例の項目
    unit_tests:
      - name: test_legend_for
        case: 正常
        summary: 出るものだけを記載する
        condition: '`flow` と `read` の線だけを持ち、枠も交差も無いフロー図'
        mock: なし
        expected: 線の項目が `処理の流れ`・`読み込む` の 2 つで、枠・交差の項目が無く、外部のシステムに `（枠の外）` が付かない
      - name: test_legend_for_when_judgement
        case: 正常
        summary: 判定フローチャートは追加した種類だけを凡例に出す
        condition: モックの `judgement` の定義
        mock: なし
        expected: 種類の項目が `開始`・`質問`・`アクション`・`結果` の 4 つで、`意思決定モデル`・`データ（下の角が丸いノード）` が無い
      - name: test_legend_for_when_chart_types_added
        case: 正常
        summary: 組み合わせ・バブル・ドーナツの凡例を出す
        condition: '`y2` を持つ `combo`、`size.label` が `件数` の `bubble`、`unit` が ` 件` の `donut`'
        mock: なし
        expected: '`combo` の項目が `{系列名}（左の軸）`・`{系列名}（右の軸）`、`bubble` に `円の面積: 件数` の項目、`donut` の項目が `{名前}: {値} 件`'
      - name: test_legend_for_when_er
        case: 正常
        summary: ER 図は図にある種類・マーカー・多重度だけを凡例に出す
        condition: マスターのテーブルだけを持ち、列が `pk`・`nn` だけで、多重度が `1` と `0..n` だけの定義
        mock: なし
        expected: 項目が `マスターのテーブル`・`主キー`・`NOT NULL`・`1 つ`・`0 以上` の 5 つで、説明のボタンと用語の下線の項目が無い
      - name: test_legend_for_when_single_kinds
        case: 正常
        summary: 1 種類だけのノードと線を記載しない
        condition: モックの `single-kinds`（同じ種類のノード 3 つと同じ種類の線 2 本）と、ノードは 2 種類で線は `flow` だけの定義
        mock: なし
        expected: 前者は空の配列。後者はノードの種類の 2 項目だけで、線・枠・層・交差・マーカー・下線の項目が無い
  - name: renderDiagramTip
    title: 図のツールチップを描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図のツールチップ』の中身。`role="tooltip"` と `hidden` を持つ
    args:
      - name: tip
        type: '{ id: string; kind: "wire" | "io" | "hint" | "table" | "item"; label: string; value?: string; tip?: string; io?: { in: string; do: string; out: string }; hint?: string; table?: MdmarkErTable }'
        required: true
        description: 部品設計の引数。`item` は見出しに `label`、本文に `value` を出す。`io` と `hint` を両方持つときは入力・処理・出力の後に `hint` を出す。`table` はタイトルを `{論理名}（{物理名}）`（どちらも `{{`・`}}` を除いた文字）にし、概要と、`desc` を持つ列の名前と説明を並べる
    returns:
      type: string
      description: ツールチップの HTML
    unit_tests:
      - name: test_render_diagram_tip
        case: 正常
        summary: 入力・処理・出力を 3 行に出す
        condition: '`kind` が `io`'
        mock: なし
        expected: '`入力`・`処理`・`出力` の見出しと値がこの順にあり、`hidden` を持つ'
      - name: test_render_diagram_tip_when_hint
        case: 正常
        summary: hint だけを文として出す
        condition: '`kind` が `hint`、`hint` が `<b>太字</b>`'
        mock: なし
        expected: 見出しを持たず、文字が `&lt;b&gt;太字&lt;/b&gt;` で `hidden` を持つ
      - name: test_render_diagram_tip_when_table
        case: 正常
        summary: テーブルの概要と列の説明を出す
        condition: '`kind` が `table`、`desc` を持つ列が 2 つと持たない列が 1 つのテーブル'
        mock: なし
        expected: タイトルが `{論理名}（{物理名}）`、概要の後に `desc` を持つ 2 つの列の名前と説明だけが並び、`hidden` を持つ
      - name: test_render_diagram_tip_when_item
        case: 正常
        summary: グラフの項目の名前と値を出す
        condition: '`kind` が `item`、`label` が `担当者`、`value` が `2月: 38`'
        mock: なし
        expected: '見出しが `担当者`、本文が `2月: 38` で `hidden` を持つ'
  - name: renderEr
