id: MOD-472-172
visibility: internal
title: ライブラリ本体 / 図 / diagram.ts
test_files:
  - tests/unit/src/parts/diagram.test.ts
functions:
  - name: renderDiagramFrame
    title: 図の枠を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図の枠』の HTML。タイトル・ボタンの帯（縮小・倍率・拡大・全画面。倍率のボタンは全体が収まる倍率を 100% とした等幅の数字の `{倍率}%` とスクリーンリーダー向けの名前 `倍率 {倍率}%。全体が収まる倍率に戻す`。`zoom` は定義の大きさを 1 とする倍率で、大きさのノードと中身の `scale()` に使用する。倍率のボタンの文字は `zoom / fit`、縮小の `disabled` と移動のボタンの有無は `zoom <= fit`、拡大の `disabled` は `zoom >= ZOOM.max` で決める。`fit` は省くと 1）・表示する枠・ツールチップの中身・凡例を並べ、表示する枠に `body` を差す。`resizable` が `true`（既定。`modal` のときは配置しない）なら表示するノードの右下に部品設計『図の枠』のリサイズハンドル（`div.mdmark-diagram-resize`。`aria-valuenow` などは `mount` が付ける）を配置し、`legend` が空なら凡例の `ul` に `hidden` を付ける。`scope`・`updated` を持たない（種類 `mermaid`）ときは、タイトルに範囲と更新日を出さない。`fitMin` を指定したときは `figure` に `data-fit-min` を付ける。`id` は `render` の中の通し番号で文書の中で一意にする
    args:
      - name: frame
        type: '{ kind; title; scope?; updated?; legend; zoom?; fit?; fitMin?: number; modal?; resizable?: boolean; wide?: boolean; touchActive?: boolean; tools?: Array<{ name: string; label: string; disabled?: boolean }>; id: string }'
        required: true
        description: 部品設計の引数（`touchActive` は表示するノードに `data-touch-active` を付ける。ストーリーの状態 `TouchActive` だけが指定する）と、開いたときの倍率の下限（`fitMin`。mermaid の図が指定する。map の図は `1`）と、タイトル・ツールチップに使用する `id` の頭。`wide` は本文の幅との切り替えのボタンを出さず、`tools` は右上の帯の先頭に並べるボタン。リサイズハンドルは表示する枠の下端（横のスクロールバーの下）の帯にし、アイコンを `iconSvg("equal")` にする
      - name: body
        type: '{ html: string; width: number; height: number; tips: string }'
        required: true
        description: 中の図の HTML と大きさ、ツールチップの中身の HTML
    returns:
      type: string
      description: '`figure.mdmark-diagram` の HTML'
    unit_tests:
      - name: test_render_diagram_frame
        case: 正常
        summary: タイトル・ボタンの帯・凡例をこの順に出す
        condition: '`kind` が `er`、`legend` が 2 項目'
        mock: なし
        expected: '`figcaption`・`role="toolbar"`・`role="group"` の表示する枠・`aria-label="凡例"` の `ul` がこの順にあり、移動のボタンのまとまりが `hidden`'
      - name: test_render_diagram_frame_when_modal
        case: 正常
        summary: モーダルでは閉じるボタンを配置する
        condition: '`modal` が `true`'
        mock: なし
        expected: '`aria-label="全画面を閉じる"` のボタンがあり、全画面で開くボタンが無い'
      - name: test_render_diagram_frame_when_zoom_button
        case: 正常
        summary: 戻すのボタンを配置せず、倍率をボタンにする
        condition: '`zoom` が `0.6875`、`fit` が `0.55`'
        mock: なし
        expected: 帯のボタンが `縮小`・`倍率 125%。全体が収まる倍率に戻す`・`拡大`・`全画面で開く` の順で、倍率のボタンの文字が `125%`、`rotate-ccw` のアイコンが無い
      - name: test_render_diagram_frame_when_resizable
        case: 正常
        summary: 'リサイズハンドルを配置し、モーダルと `resizable: false` では配置しない'
        condition: '`resizable` を省いた枚、`resizable: false` の枚、`modal: true` の枚'
        mock: なし
        expected: 省いた枚だけ `div.mdmark-diagram-resize` があり、`role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"`・`aria-label="「{題名}」の表示の高さ"`・`equal` のアイコンを持つ
      - name: test_render_diagram_frame_when_no_legend
        case: 正常
        summary: 凡例の項目が空なら凡例を隠す
        condition: '`legend: []`'
        mock: なし
        expected: '`aria-label="凡例"` の `ul` が `hidden` を持つ'
      - name: test_render_diagram_frame_when_mermaid
        case: 正常
        summary: 種類 mermaid は範囲と更新日を出さず、倍率の下限を付ける
        condition: '`kind` が `mermaid`、`title` が `問い合わせの受付`、`scope`・`updated` を省き、`legend: []`、`fitMin: 0.75`'
        mock: なし
        expected: '`figure` が `data-diagram="mermaid"`・`data-fit-min="0.75"` を持ち、`figcaption` の文字が `問い合わせの受付` だけで `time` 要素が無い'
      - name: test_render_diagram_frame_when_map
        case: 正常
        summary: 種類 map の枠
        condition: '`kind: map`・`wide: true`・`legend: []`・`tools` に 4 つ'
        mock: なし
        expected: 範囲と更新日と凡例と本文の幅との切り替えのボタンが無く、右上の帯の先頭に 4 つのボタンが記載の順に並ぶ
      - name: test_render_diagram_frame_when_resize_strip
        case: 正常
        summary: リサイズハンドルの帯
        condition: '`resizable: true`'
        mock: なし
        expected: リサイズハンドルが表示する枠の後ろにあり、`equal` のアイコンを持つ
  - name: renderFlow
    title: map の構成図のノードと線を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『mapの構成図』が自動配置の結果から作ったノードと線を描く。ノードは座標に配置し、`style`（設定の `map.kinds` の値）の種類の行（アイコンと名前）・形・色で描き、`hint` を持つノードの右上にマーカーとツールチップの中身（`hints` がオフなら配置しない）、`href` を持つノードに class `has-link` と、名前の後ろ・右上のマーカーの前にノードの全体を覆う `<a class="mdmark-diagram-node-link" href="{href}" aria-label="{name}">` を配置する。線は `jumpPaths` のパスで svg に描き、`style`（設定の `map.lines` の値）の模様・太さ・矢じり・色を当て、線のラベルを配置する。ノードの中の名前は `renderText` に経由する
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: map の構成図のノードと線
      - name: id
        type: string
        required: true
        description: ツールチップと矢じりの `id` の頭
      - name: hints
        type: boolean
        required: true
        description: 機能 `hints` がオンか
      - name: lookup
        type: TermLookup
        required: false
        description: ノードの名前の中の用語の意味を参照する関数。省くと単語だけを出す
      - name: annotations
        type: '{ items: Record<string, Array<{ number: number; html: string }>>; ownerPrefix: string }'
        required: false
        description: 'ノード・線の ID ごとの注記と、持ち主の `id` の頭。注記を持つノード・線は、`hint`・`tip` が無くても右上のマーカー・押せる帯を持ち、ツールチップの `annotations` に注記を指定する。マーカーと押せる帯に `id="{ownerPrefix}{要素の ID}"`（要素の ID の英数字・`-`・`_` 以外の文字は `_`）を付ける。マーカーの `aria-label` は、注記だけなら `「{名前}」の注記`、説明と注記なら `「{名前}」の説明と注記`。`hints` がオフなら付けない'
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_flow
        case: 正常
        summary: ノード・線・ツールチップを出す
        condition: 部品設計『mapの構成図』の Default の自動配置の結果から作ったノードと線
        mock: なし
        expected: ノードと線が定義の数だけあり、`role="tooltip"` が `hint` を持つノードの数だけあり、交わる横の線のパスが飛び越えの弧を持つ
      - name: test_render_flow_when_text_escaped
        case: 異常
        summary: 定義の文字の HTML を文字にする
        condition: ノードの `name` が `<img src=x onerror=alert(1)>`
        mock: なし
        expected: 出力に `<img` が無く、`&lt;img` がある
      - name: test_render_flow_when_hint
        case: 正常
        summary: hint を持つノードにマーカーを配置し、hints がオフならマーカーもツールチップも配置しない
        condition: '`hint` を持つノード 1 つと持たないノード 1 つを、`hints` が `true` と `false` で描く'
        mock: なし
        expected: '`true` で `hint` を持つノードにだけマーカーがあり、`false` で `role="tooltip"` とマーカーが無く、ノードの名前はある'
      - name: test_render_flow_when_node_link
        case: 正常
        summary: href を持つノードをリンクにし、マーカーをリンクの外に配置する
        condition: '`href` と `hint` を持つノード、`href` だけを持つノード、どちらも持たないノード'
        mock: なし
        expected: '`href` を持つ 2 つのノードが `has-link` と `a.mdmark-diagram-node-link`（`aria-label` がノードの名前）を持ち、`hint` のマーカーは `a` の後ろにあって `a` の中に無い。`href` を持たないノードは `a` を持たない'
  - name: legendFor
    title: 凡例の項目
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 'グラフは系列（円とドーナツは項目）を並べる。`combo` で `y2` を持つ図は系列の名前に `（左の軸）`・`（右の軸）` を添え、`bubble` は `円の面積: {size.label}` の項目を加え、`donut` は `pie` と同じく項目の名前と値を並べる。ER 図は図にあるテーブルの種類の札（名前は `{札}のテーブル`）・列のマーカー（`ER_COLUMN_KEYS` の `title`）・多重度の記号（`ER_CARDINALITIES` の名前）だけを並べる'
    args:
      - name: definition
        type: MdmarkChartDefinition | MdmarkErDefinition
        required: true
        description: 読み込めた定義
    returns:
      type: '{ sample: string; label: string }[]'
      description: 凡例の項目
    unit_tests:
      - name: test_legend_for_when_chart_types_added
        case: 正常
        summary: 組み合わせ・バブル・ドーナツの凡例を出す
        condition: '`y2` を持つ `combo`、`size.label` が `件数` の `bubble`、`unit` が ` 件` の `donut`'
        mock: なし
        expected: '`combo` の項目が `{系列名}（左の軸）`・`{系列名}（右の軸）`、`bubble` に `円の面積: 件数` の項目、`donut` の項目が `{名前}: {値} 件`'
      - name: test_legend_for_when_er
        case: 正常
        summary: ER 図は図にある種類・マーカー・多重度だけを凡例に出す
        condition: マスターのテーブルだけを持ち、列が `pk`・`nn` だけで、多重度が `1` と `0..n` だけの定義
        mock: なし
        expected: 項目が `マスターのテーブル`・`主キー`・`NOT NULL`・`1 つ`・`0 以上` の 5 つで、説明のボタンと用語の下線の項目が無い
  - name: renderDiagramTip
    title: 図のツールチップを描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図のツールチップ』の中身。`role="tooltip"` と `hidden` を持つ
    args:
      - name: tip
        type: '{ id: string; kind: "wire" | "hint" | "table" | "item" | "merged"; label: string; value?: string; tip?: string; hint?: string; table?: MdmarkErTable; annotations?: Array<{ number: number; html: string }> }'
        required: true
        description: 部品設計の引数。`item` は見出しに `label`、本文に `value` を出す。`table` はタイトルを `{論理名}（{物理名}）`（どちらも `{{`・`}}` を除いた文字）にし、概要と、`desc` を持つ列の名前と説明を並べる。`annotations` があれば、どの `kind` でも末尾に注記ごとの `span.mdmark-term-tip-section`（見出し `span.mdmark-term-tip-heading.mdmark-note-tip-heading` の `注記 {number}` と本文。`html` は描いた HTML なのでエスケープしない）を追加する
    returns:
      type: string
      description: ツールチップの HTML
    unit_tests:
      - name: test_render_diagram_tip
        case: 正常
        summary: 線の説明を見出しと文で出す
        condition: '`kind` が `wire`、`label` が `補足を渡す`、`tip` が `検査した補足`'
        mock: なし
        expected: 見出しが `補足を渡す`、本文が `検査した補足` で、`hidden` を持つ
      - name: test_render_diagram_tip_when_hint
        case: 正常
        summary: hint だけを文として出す
        condition: '`kind` が `hint`、`hint` が `<b>太字</b>`'
        mock: なし
        expected: 見出しを持たず、文字が `&lt;b&gt;太字&lt;/b&gt;` で `hidden` を持つ
      - name: test_render_diagram_tip_when_annotations
        case: 正常
        summary: 説明の後ろに注記の区分を追加する
        condition: 部品設計『図のツールチップ』の `Annotation`
        mock: なし
        expected: 区分が 2 つで、2 つ目の見出しが class `mdmark-note-tip-heading` の `注記 1`、本文が `条件を満たさないときは次の工程へ進む。`
      - name: test_render_diagram_tip_when_table
        case: 正常
        summary: テーブルの概要と列の説明を出す
        condition: '`kind` が `table`、`desc` を持つ列が 2 つと持たない列が 1 つのテーブル'
        mock: なし
        expected: タイトルが `{論理名}（{物理名}）`、概要の後に `desc` を持つ 2 つの列の名前と説明だけが並び、`hidden` を持つ
      - name: test_render_diagram_tip_when_item
        case: 正常
        summary: グラフの項目の名前と値を出す
        condition: '`kind` が `item`、`label` が `担当者`、`value` が `2月: 38`'
        mock: なし
        expected: '見出しが `担当者`、本文が `2月: 38` で `hidden` を持つ'
  - name: renderEr
    title: ER 図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: '`renderErTable` でテーブルを配置し（定義の文字は `renderText` に経由し、`{{単語}}` を意味のある用語なら下線とツールチップの持ち主にする）、`erRelationRoute` の経路で関係の線（`data-line="er"`）と `erEndSvg` の両端の記号を svg に描き、ラベルを縦の線の中ほどに配置する。関係ごとの `g` は `data-er-from`・`data-er-from-column`・`data-er-to`・`data-er-to-column` を持ち、ラベル（`renderText` に経由する）は同じ関係の番号の `data-er-relation` を持つ（`attachErFolds` がもう一度結ぶ）。図の高さは `erTableHeight` で求めたテーブルの下端の最大に下の余白を加算する。`hints` がオンなら、`desc` を持つテーブルと `desc` を持つ列のあるテーブルの `renderDiagramTip` の `kind: table` の中身を返却する'
    args:
      - name: definition
        type: MdmarkErDefinition
        required: true
        description: 読み込めた定義
      - name: id
        type: string
        required: true
        description: '`id` の頭'
      - name: hints
        type: boolean
        required: true
        description: '`hints` がオンか'
      - name: lookup
        type: TermLookup | undefined
        required: false
        description: 用語から意味を参照する関数（`renderFlow` と同じ）
    returns:
      type: '{ html: string; width: number; height: number; tips: string; jumps: boolean; terms: boolean }'
      description: 図の中身と、用語の下線を付けた文字があるか（`terms`。`jumps` は常に `false`）
    callees:
      - 'MOD-472-187#functions[renderErTable]'
      - 'MOD-472-176#functions[erRelationRoute]'
      - 'MOD-472-187#functions[erEndSvg]'
      - 'MOD-472-176#functions[erTableHeight]'
      - '#functions[renderDiagramTip]'
    unit_tests:
      - name: test_render_er
        case: 正常
        summary: テーブル・関係の線・多重度・ラベルを描く
        condition: モックの `shop-er` の定義、`hints` がオン
        mock: なし
        expected: テーブルが定義の数だけ、関係の `path[data-line="er"]` が関係の数だけあり、両端に多重度の記号とラベルがあり、`tips` に注文のテーブルの `{論理名}（orders）` がある
      - name: test_render_er_when_hints_off
        case: 正常
        summary: '`hints` がオフなら説明のボタンとツールチップを配置しない'
        condition: モックの `shop-er` の定義、`hints` がオフ
        mock: なし
        expected: '`button.mdmark-diagram-info` が無く、`tips` が空'
      - name: test_render_er_when_terms
        case: 正常
        summary: 定義の文字の `{{単語}}` を用語の下線にする
        condition: テーブルの論理名が `{{顧客}}`、関係のラベルが `{{注文}}する` の定義と、`顧客`・`注文` の意味を返却する `lookup`。`hints` がオン
        mock: なし
        expected: 論理名とラベルの `{{顧客}}`・`{{注文}}` が `mdmark-term` の下線になり、`{{`・`}}` が文字に残らず、`tips` に `顧客` の意味があり、`tips` に `{{` が残らず、`terms` が `true`。説明のボタン・開閉のボタンのスクリーンリーダー向けの名前が `「顧客」の…`
    status: planned
    introduced:
      pr: 298
