id: MOD-472-172
visibility: internal
title: ライブラリ本体 / 図 / diagram.part.ts
test_files:
  - tests/unit/src/diagram/diagram.part.test.ts
functions:
  - name: renderDiagramFrame
    title: 図の枠を描く
    container: src/diagram/diagram.part.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図の枠』の HTML を返却する
    description: |-
      タイトル・表示するノード（パネルと表示する枠）・ツールチップの中身・凡例を並べ、表示する枠に `body` を差す。
      パネル（`div.mdmark-diagram-tools`。`role="toolbar"`）は表示するノードの中の表示する枠の前に配置し、`tools`（`data-group="map"`）・縮小・倍率・拡大（`data-group="zoom"`）・全画面（`data-group="screen"`）・開閉のボタン（`data-group="more"` の中の `button[data-tool="more"]`。`aria-expanded`・`iconSvg("ellipsis")`）をこの順に並べる。
      `panelOpen` が `true` のときだけパネルに `data-open` を付け、開閉のボタンを `aria-expanded="true"`・`aria-label="表示の操作を閉じる"` にする（省くと `false`・`表示の操作を開く`）。移動のボタンは持たない。

      `zoom` は定義の大きさを 1 とする倍率で、大きさのノードと中身の `scale()` に使用する。
      `fit` は省くと 1。

      | パネルと表示する枠の値 | 決め方 |
      | --- | --- |
      | 倍率のボタンの文字 | `zoom / fit` を、全体が収まる倍率を 100% とした等幅の数字の `{倍率}%` にする |
      | 倍率のボタンのスクリーンリーダー向けの名前 | `倍率 {倍率}%。全体が収まる倍率に戻す` |
      | 縮小の `disabled` | `zoom <= fit × ZOOM.minRatio` |
      | 拡大の `disabled` | `zoom >= fit × ZOOM.maxRatio` |
      | 表示する枠の `data-at-fit` | `zoom <= fit` |

      `resizable` が `true`（既定。`modal` のときは配置しない）なら、表示するノードの右下に部品設計『図の枠』のリサイズハンドル（`div.mdmark-diagram-resize`）を配置する。
      リサイズハンドルは次の初めの値を持ち、`mount` が表示する枠の高さを測って書き換える。

      | 属性 | 初めの値 |
      | --- | --- |
      | `aria-valuenow`・`aria-valuemax` | 図の全体が収まる高さ（`body.height × zoom` を `RESIZE.min` 以上にして丸めた値） |
      | `aria-valuemin` | `RESIZE.min` |
      | `aria-valuetext` | `{aria-valuenow}px` |

      `legend` が空なら凡例の `ul` に `hidden` を付ける。
      `scope`・`updated` を持たない（種類 `mermaid`）ときは、タイトルに範囲と更新日を出さない。
      `fitMin` を指定したときは `figure` に `data-fit-min` を付ける。
      `id` は `render` の中の通し番号で文書の中で一意にする
    args:
      - name: frame
        type: '{ kind; title; scope?; updated?; legend; zoom?; fit?; fitMin?: number; modal?; resizable?: boolean; wide?: boolean; panelOpen?: boolean; tools?: Array<{ name: string; label: string; disabled?: boolean }>; exportable?: boolean; exportOpen?: boolean; listable?: boolean; listView?: boolean; id: string }'
        required: true
        description: 部品設計の引数（`panelOpen` はパネルを開いた状態で描く。ストーリーの状態が指定する）と、開いたときの倍率の下限（`fitMin`。mermaid の図が指定する。map の図は `1`）と、タイトル・ツールチップに使用する `id` の頭。`wide` は本文の幅との切り替えのボタンを出さず、`tools` はパネルの先頭に並べるボタン（外へ戻るは `data-tool="back"`）。リサイズハンドルは表示する枠の下端（横のスクロールバーの下）の帯にし、アイコンを `iconSvg("equal")` にする
      - name: body
        type: '{ html: string; width: number; height: number; tips: string }'
        required: true
        description: 中の図の HTML と大きさ、ツールチップの中身の HTML
    returns:
      type: string
      description: '`figure.mdmark-diagram` の HTML'
    unit_tests:
      - name: test_render_diagram_frame
        case: 正常
        summary: タイトル・パネル・凡例をこの順に出す
        condition: '`kind` が `chart`、`legend` が 2 項目'
        mock: なし
        expected: '`figcaption`・`role="toolbar"`・`role="group"` の表示する枠・`aria-label="凡例"` の `ul` がこの順にあり、`role="toolbar"` は `.mdmark-diagram-box` の中にある。移動のボタンのまとまりが無く、開閉のボタンが `aria-expanded="false"`・`aria-label="表示の操作を開く"` で、パネルが `data-open` を持たず、表示する枠が `data-at-fit` を持つ'
      - name: test_render_diagram_frame_when_modal
        case: 正常
        summary: モーダルでは閉じるボタンを配置する
        condition: '`modal` が `true`'
        mock: なし
        expected: '`aria-label="全画面を閉じる"` のボタンがあり、全画面で開くボタンが無い'
      - name: test_render_diagram_frame_when_zoom_button
        case: 正常
        summary: 戻すのボタンを配置せず、倍率をボタンにする
        condition: '`zoom` が `0.6875`、`fit` が `0.55`'
        mock: なし
        expected: パネルのボタンが `縮小`・`倍率 125%。全体が収まる倍率に戻す`・`拡大`・`全画面で開く`・`表示の操作を開く` の順で、倍率のボタンの文字が `125%`、`rotate-ccw` のアイコンが無い
      - name: test_render_diagram_frame_when_resizable
        case: 正常
        summary: 'リサイズハンドルを配置し、モーダルと `resizable: false` では配置しない'
        condition: '`resizable` を省いた枚、`resizable: false` の枚、`modal: true` の枚'
        mock: なし
        expected: 省いた枚だけ `div.mdmark-diagram-resize` があり、`role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"`・`aria-label="「{題名}」の表示の高さ"`・`equal` のアイコンを持つ。`aria-valuenow`・`aria-valuemax` が `body.height × zoom` を丸めた値（`RESIZE.min` より低い本体では `RESIZE.min`）、`aria-valuemin` が `RESIZE.min`、`aria-valuetext` が `{aria-valuenow}px`
      - name: test_render_diagram_frame_when_no_legend
        case: 正常
        summary: 凡例の項目が空なら凡例を隠す
        condition: '`legend: []`'
        mock: なし
        expected: '`aria-label="凡例"` の `ul` が `hidden` を持つ'
      - name: test_render_diagram_frame_when_mermaid
        case: 正常
        summary: 種類 mermaid は範囲と更新日を出さず、倍率の下限を付ける
        condition: '`kind` が `mermaid`、`title` が `問い合わせの受付`、`scope`・`updated` を省き、`legend: []`、`fitMin: 0.75`'
        mock: なし
        expected: '`figure` が `data-diagram="mermaid"`・`data-fit-min="0.75"` を持ち、`figcaption` の文字が `問い合わせの受付` だけで `time` 要素が無い'
      - name: test_render_diagram_frame_when_map
        case: 正常
        summary: 種類 map の枠
        condition: '`kind: map`・`wide: true`・`legend: []`・`tools` に 4 つ'
        mock: なし
        expected: 範囲と更新日と凡例と本文の幅との切り替えのボタンが無く、パネルの先頭の `data-group="map"` に 4 つのボタンが記載の順に並ぶ
      - name: test_render_diagram_frame_when_resize_strip
        case: 正常
        summary: リサイズハンドルの帯
        condition: '`resizable: true`'
        mock: なし
        expected: リサイズハンドルが表示する枠の後ろにあり、`equal` のアイコンを持つ
      - name: test_render_diagram_frame_when_panel_open
        case: 正常
        summary: パネルを開いた状態で描く
        condition: '`panelOpen: true`'
        mock: なし
        expected: パネルが `data-open` を持ち、開閉のボタンが `aria-expanded="true"`・`aria-label="表示の操作を閉じる"`
      - name: test_render_diagram_frame_when_bounds
        case: 正常
        summary: 下限と上限で端のボタンを押せなくし、全体が収まる倍率より拡大したときだけ `data-at-fit` を解除する
        condition: '`fit: 1` で `zoom` が `0.25`・`1.25`・`5` の枚'
        mock: なし
        expected: '`0.25` は縮小が `disabled` で表示する枠が `data-at-fit` を持ち、`1.25` はどちらも押せて `data-at-fit` を持たず、`5` は拡大が `disabled`'
      - name: test_render_diagram_frame_when_exportable
        case: 正常
        summary: 書き出すボタン
        condition: '`kind: map`・`exportable: true`・`exportOpen: false`'
        mock: なし
        expected: 全画面のボタンの隣に `data-tool="export"` のボタン（`aria-expanded="false"`・`aria-controls` が要素の `id`・`aria-haspopup` 無し）があり、`div.mdmark-diagram-export` が `hidden` で `popover` 属性を持たない
      - name: test_render_diagram_frame_when_listable
        case: 正常
        summary: 一覧の表示のボタン
        condition: '`kind: map`・`listable: true`・`listView: true`・`panelOpen: true`'
        mock: なし
        expected: 'map のグループの先頭に `data-tool="list"`（`aria-pressed="true"`）のボタンがあり、図の要素が `hidden`。`listable: false` ではボタンが無い'
    notes:
      書き出すボタンと一覧の表示のボタン: '`exportable` のとき、画面のグループ（`data-group="screen"`）の全画面のボタンの隣に `button[data-tool="export"]`（`iconSvg("download")`、`aria-label="図を書き出す"`、`aria-expanded`、`aria-controls`）と、表示する枠の中に絶対配置する `div.mdmark-diagram-export`（`exportOpen` でなければ `hidden`。`button[data-export="svg"]`・`button[data-export="png"]` と空の `p[role="status"]`）を配置する。`listable` のとき、map のグループの先頭に `button[data-tool="list"]`（`iconSvg("list-tree")`、`aria-label="一覧で表示"`、`aria-pressed`）を配置し、`listView` のときは図を `hidden` にする。一覧は呼び出し側が入れる'
  - name: renderFlow
    title: map の構成図のノードと線を描く
    container: src/diagram/diagram.part.ts
    kind: 関数
    scope: internal
    summary: '部品設計『mapの構成図』の自動配置の結果から、ノードと線を描く'
    description: |-
      部品設計『mapの構成図』が自動配置の結果から作ったノードと線を描く。
      ノードは座標に配置し、`style`（設定の `map.kinds` の値）の種類の行（アイコンと名前）・形・色で描き、`hint` を持つノードの右上にマーカーとツールチップの中身（`hints` がオフなら配置しない）、`href` を持つノードに class `has-link` と、名前の後ろ・右上のマーカーの前にノードの全体を覆う `<a class="mdmark-diagram-node-link" href="{href}" aria-label="{name}">` を配置する。
      線は `jumpPaths` のパスで svg に描き、`style`（設定の `map.lines` の値）の模様・太さ・矢じり・色を適用し、線のラベルを配置する。
      ノードの中の名前は `renderText` に経由する
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: map の構成図のノードと線
      - name: id
        type: string
        required: true
        description: ツールチップと矢じりの `id` の頭
      - name: options
        type: '{ hints: boolean; lookup?: TermLookup; annotations?: DiagramAnnotations }'
        required: true
        description: 機能のオン・オフと、名前の中の用語・注記を描く値
      - name: options.hints
        type: boolean
        required: true
        description: 機能 `hints` がオンか
      - name: options.lookup
        type: TermLookup
        required: false
        description: ノードの名前の中の用語の意味を参照する関数。省くと単語だけを出す
      - name: options.annotations
        type: '{ items: Record<string, Array<{ number: number; html: string }>>; ownerPrefix: string }'
        required: false
        description: 'ノード・線の ID ごとの注記と、持ち主の `id` の頭。注記を持つノード・線は、`hint`・`tip` が無くても右上のマーカー・押せる帯を持ち、ツールチップの `annotations` に注記を指定する。マーカーと押せる帯に `id="{ownerPrefix}{要素の ID}"`（要素の ID の空白は `_`）を付ける。マーカーの `aria-label` は、注記だけなら `「{名前}」の注記`、説明と注記なら `「{名前}」の説明と注記`。`hints` がオフなら付けない'
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_flow
        case: 正常
        summary: ノード・線・ツールチップを出す
        condition: 部品設計『mapの構成図』の Default の自動配置の結果から作ったノードと線
        mock: なし
        expected: ノードと線が定義の数だけあり、`role="tooltip"` が `hint` を持つノードの数だけあり、交わる横の線のパスが飛び越えの弧を持つ
      - name: test_render_flow_when_text_escaped
        case: 異常
        summary: 定義の文字の HTML を文字にする
        condition: ノードの `name` が `<img src=x onerror=alert(1)>`
        mock: なし
        expected: 出力に `<img` が無く、`&lt;img` がある
      - name: test_render_flow_when_hint
        case: 正常
        summary: hint を持つノードにマーカーを配置し、hints がオフならマーカーもツールチップも配置しない
        condition: '`hint` を持つノード 1 つと持たないノード 1 つを、`hints` が `true` と `false` で描く'
        mock: なし
        expected: '`true` で `hint` を持つノードにだけマーカーがあり、`false` で `role="tooltip"` とマーカーが無く、ノードの名前はある'
      - name: test_render_flow_when_node_link
        case: 正常
        summary: href を持つノードをリンクにし、マーカーをリンクの外に配置する
        condition: '`href` と `hint` を持つノード、`href` だけを持つノード、どちらも持たないノード'
        mock: なし
        expected: '`href` を持つ 2 つのノードが `has-link` と `a.mdmark-diagram-node-link`（`aria-label` がノードの名前）を持ち、`hint` のマーカーは `a` の後ろにあって `a` の中に無い。`href` を持たないノードは `a` を持たない'
  - name: legendFor
    title: 凡例の項目
    container: src/diagram/diagram.part.ts
    kind: 関数
    scope: internal
    summary: 'グラフは系列（円とドーナツは項目）を並べる。`combo` で `y2` を持つ図は系列の名前に `（左の軸）`・`（右の軸）` を添え、`bubble` は `円の面積: {size.label}` の項目を加え、`donut` は `pie` と同じく項目の名前と値を並べる'
    args:
      - name: definition
        type: MdmarkChartDefinition
        required: true
        description: 読み込めた定義
    returns:
      type: '{ sample: string; label: string }[]'
      description: 凡例の項目
    unit_tests:
      - name: test_legend_for_when_chart_types_added
        case: 正常
        summary: 組み合わせ・バブル・ドーナツの凡例を出す
        condition: '`y2` を持つ `combo`、`size.label` が `件数` の `bubble`、`unit` が ` 件` の `donut`'
        mock: なし
        expected: '`combo` の項目が `{系列名}（左の軸）`・`{系列名}（右の軸）`、`bubble` に `円の面積: 件数` の項目、`donut` の項目が `{名前}: {値} 件`'
  - name: renderDiagramTip
    title: 図のツールチップを描く
    container: src/diagram/diagram.part.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図のツールチップ』の中身。`role="tooltip"` と `hidden` を持つ
    args:
      - name: tip
        type: '{ id: string; kind: "wire" | "hint" | "item" | "merged"; label: string; value?: string; tip?: string; hint?: string; annotations?: Array<{ number: number; html: string }> }'
        required: true
        description: 部品設計の引数。`item` は見出しに `label`、本文に `value` を出す。`annotations` があれば、どの `kind` でも末尾に注記ごとの `span.mdmark-term-tip-section`（見出し `span.mdmark-term-tip-heading.mdmark-note-tip-heading` の `注記 {number}` と本文。`html` は描いた HTML なのでエスケープしない）を追加する
    returns:
      type: string
      description: ツールチップの HTML
    unit_tests:
      - name: test_render_diagram_tip
        case: 正常
        summary: 線の説明を見出しと文で出す
        condition: '`kind` が `wire`、`label` が `補足を渡す`、`tip` が `検査した補足`'
        mock: なし
        expected: 見出しが `補足を渡す`、本文が `検査した補足` で、`hidden` を持つ
      - name: test_render_diagram_tip_when_hint
        case: 正常
        summary: hint だけを文として出す
        condition: '`kind` が `hint`、`hint` が `<b>太字</b>`'
        mock: なし
        expected: 見出しを持たず、文字が `&lt;b&gt;太字&lt;/b&gt;` で `hidden` を持つ
      - name: test_render_diagram_tip_when_annotations
        case: 正常
        summary: 説明の後ろに注記の区分を追加する
        condition: 部品設計『図のツールチップ』の `Annotation`
        mock: なし
        expected: 区分が 2 つで、2 つ目の見出しが class `mdmark-note-tip-heading` の `注記 1`、本文が `条件を満たさないときは次の工程へ進む。`
      - name: test_render_diagram_tip_when_item
        case: 正常
        summary: グラフの項目の名前と値を出す
        condition: '`kind` が `item`、`label` が `担当者`、`value` が `2月: 38`'
        mock: なし
        expected: '見出しが `担当者`、本文が `2月: 38` で `hidden` を持つ'
lead: '図の表示ブロック・構成図のノードと線・グラフ・図のツールチップ・凡例の描画を受け持ち、図の部品の描き方を変えるときに参照する。'
tags:
  - name: topic:図
    main: true
  - name: tool:svg
  - name: action:描画
