id: MOD-472-184
visibility: internal
title: ライブラリ本体 / 図 / diagram-tips.ts
test_files:
  - tests/unit/src/interact/diagram-tips.browser.test.ts
functions:
  - name: attachDiagramTips
    title: 図のツールチップを付ける
    container: src/interact/diagram-tips.ts
    kind: 関数
    scope: internal
    summary: ツールチップの持ち主（線のラベル・ノードの右上のマーカー・グループのタイトルのマーカー・`data-tip-owner` を持つグラフの項目。ノードそのものは持ち主にしない）に `pointerenter`・`focus` で開き、持ち主とツールチップの両方から削除されたら閉じ、開いている間だけ `document` の `keydown`（Esc）・`pointerdown` と `window` の `scroll`・`resize` を受け取って持ち主に付いて動かす。`pointerType` が `touch` のときは `pointerenter` で開かず、持ち主の `pointerdown` で開閉を切り替え、タッチで開いている間は `pointerleave`・`blur` では閉じず、`document` の `pointerdown` の対象が開いている持ち主とツールチップの外なら閉じる（iOS の Safari はタップした持ち主に `:hover` を残すため、`pointerleave`・`blur` だけでは閉じない）。同時に開くのは 1 つ。配置する側は `chooseTipSide`（持ち主の上端・下端、ノードのマーカーはノードの上端・下端。`gap` は `TIP_GAP_PX`）で決め、横は持ち主の左端に合わせて画面の端から `VIEWPORT_MARGIN_PX` の内に収める。`beforeprint` で閉じる。埋め込んだ HTML のヒント（`mdmark-hint-mark` と `mdmark-hint-inline`）にも同じ操作を付けるため、引数に `div.mdmark-html` も受ける。`div.mdmark-html` を受けたときは、`render` が振った `mdmark-hint-{n}` とそれを指す `aria-describedby` を、モジュールの通し番号でページの中で一意な値にもう一度振る（用語と図の `renumberIds` と同じ作り）
    args:
      - name: options
        type: '{ figure: HTMLElement; placement: TooltipPlacement }'
        required: true
        description: 図か、埋め込んだ HTML の `div.mdmark-html` と、ツールチップを先に出す側
    returns:
      type: '{ closeOpen: () => boolean; detach: () => void }'
      description: 開いているツールチップを閉じて閉じたかを返却する関数と、操作を削除する関数
    unit_tests:
      - name: test_attach_diagram_tips
        case: 正常
        summary: フォーカスで開き Esc で閉じる
        condition: '`tip` を持つ線のラベルにフォーカスし、`Escape` を送信する'
        mock: なし
        expected: フォーカスでツールチップが `hidden` を持たず、Esc の後に `hidden` を持ち、フォーカスがラベルに残る
      - name: test_attach_diagram_tips_when_hovered
        case: 正常
        summary: ツールチップの上では閉じない
        condition: 持ち主からツールチップへ `pointerleave`・`pointerenter` を送信する
        mock: タイマーを `vi.useFakeTimers` で進める
        expected: ツールチップが `hidden` を持たない
      - name: test_attach_diagram_tips_when_box_hovered
        case: 正常
        summary: ノードのマーカーの外では開かない
        condition: '`hint` を持つノードの名前に `pointerenter` を送信し、次にマーカーに送信する'
        mock: なし
        expected: 名前ではツールチップが `hidden` を持ち、マーカーでは持たない
      - name: test_attach_diagram_tips_when_embedded_hint
        case: 正常
        summary: 埋め込んだ HTML のヒントを開く
        condition: '`div.mdmark-html` にブロックと行内のヒント。ブロックの要素の文字、マーカー、行内の要素の順に `pointerenter`'
        mock: なし
        expected: 文字では開かず、マーカーと行内の要素でそれぞれのツールチップが開き、同時に開いているのは 1 つ
      - name: test_attach_diagram_tips_when_embedded_unique_ids
        case: 正常
        summary: 同じページに 2 回描いてもヒントの id が重ならない
        condition: ヒントを持つ同じ `div.mdmark-html` を 2 つの要素に入れ、両方に付ける
        mock: なし（Chromium）
        expected: ページの `id` が全て一意で、各印の `aria-describedby` が同じ要素の中のツールチップを指す
      - name: test_attach_diagram_tips_when_placed
        case: 正常
        summary: 上に収まれば持ち主の上、`bottom` では下に配置する
        condition: '`tip` を持つ線のラベルを画面の中ほどに配置した図と、ブロックのヒントを持つ `div.mdmark-html` に、`placement` を `top` と `bottom` にしてそれぞれ付け、持ち主にフォーカスする'
        mock: なし（Chromium）
        expected: '`top` ではツールチップの `bottom` が持ち主の `top` 以下、`bottom` ではツールチップの `top` が持ち主の `bottom` 以上'
      - name: test_attach_diagram_tips_when_touch_tapped
        case: 正常
        summary: タッチの 1 回のタップで開き、もう一度のタップで閉じる
        condition: 閉じたノードのマーカーに `pointerType` が `touch` の `pointerenter`・`pointerdown`・`pointerup`・`pointerleave` をこの順に送信してマーカーの `focus()` を呼び、続けて同じ 4 つをもう一度送って `focus()` を呼ぶ（既にフォーカスを持つマーカーでは `focus` は発火しない）
        mock: タイマーを `vi.useFakeTimers` で進める
        expected: 1 回目の後にツールチップが `hidden` を持たず、2 回目の後に `hidden` を持つ
      - name: test_attach_diagram_tips_when_touch_outside
        case: 正常
        summary: タッチで開いた後、外の `pointerdown` だけで閉じ、ツールチップの中では閉じない
        condition: ノードのマーカーをタッチでタップして開き、ツールチップの中に `pointerdown` を送信し、次に図の外の要素に `pointerType` が `touch` の `pointerdown` だけを送信する（`pointerleave`・`blur` は送信しない）
        mock: なし
        expected: ツールチップの中の後は `hidden` を持たず、外の後は `hidden` を持つ
      - name: test_attach_diagram_tips_when_touch_tip_tapped
        case: 正常
        summary: タッチで開いた後、ツールチップの中のタップでは閉じない
        condition: ノードのマーカーをタッチでタップして開き、ツールチップに `pointerType` が `touch` の `pointerdown`・`pointerup`・`pointerleave` を送信してマーカーの `blur()` を呼ぶ
        mock: タイマーを `vi.useFakeTimers` で進める
        expected: ツールチップが `hidden` を持たない
      - name: test_attach_diagram_tips_when_touch_embedded_hint
        case: 正常
        summary: 埋め込んだ HTML のヒントもタッチで開閉する
        condition: '`div.mdmark-html` のブロックのヒントのマーカーに、test_attach_diagram_tips_when_touch_tapped と同じ手順（2 回目は `focus` を発火しない）でタップを 2 回送り、もう一度タップして開いてから外に `pointerdown` だけを送信する'
        mock: タイマーを `vi.useFakeTimers` で進める
        expected: 1 回目で開き、2 回目で閉じ、外の `pointerdown` で閉じる
      - name: test_attach_diagram_tips_when_mouse_pressed
        case: 正常
        summary: マウスの `pointerdown` では開閉を切り替えない
        condition: ノードのマーカーに `pointerType` が `mouse` の `pointerenter` で開き、同じマーカーに `pointerType` が `mouse` の `pointerdown` を送信する
        mock: なし
        expected: ツールチップが `hidden` を持たない
      - name: test_attach_diagram_tips_when_chart_item
        case: 正常
        summary: グラフの項目とテーブルの説明のボタンで開き、`bottom` で下に配置する
        condition: 折れ線のグラフのクリックを受ける円にフォーカスし、次に ER 図のテーブルの説明のボタンに `pointerenter`。`placement` は `bottom`
        mock: なし（Chromium）
        expected: それぞれの `aria-describedby` が指すツールチップが `hidden` を持たず、`top` が持ち主の `bottom` 以上。同時に開いているのは 1 つ
