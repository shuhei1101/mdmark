id: MOD-472-183
visibility: internal
title: ライブラリ本体 / 図 / diagram.interact.ts
test_files:
  - tests/unit/src/diagram/diagram.interact.browser.test.ts
functions:
  - name: attachDiagrams
    title: 図の拡大・縮小・移動・全画面を付ける
    container: src/diagram/diagram.interact.ts
    kind: 関数
    scope: internal
    summary: '`root` の中の図ごとに、拡大・縮小・移動・全画面の操作を付ける'
    description: |-
      `root` の中の `figure.mdmark-diagram` ごとに、`fitScale` で開いたときの倍率を適用する（`data-fit-min` を持つ図は、その値より小さくしない）。
      縮小・拡大・倍率のボタン・`+`・`-`・`0`・矢印キー・余白のドラッグ・全画面のボタンを付ける。
      倍率のボタンは `0` と同じく開いたときの倍率と位置に戻し、倍率が変わるたびに文字とスクリーンリーダー向けの名前を書き換える。
      倍率は図の中身に `transform: scale()` を掛け、大きさのノードを倍率を掛けた大きさにしてスクロールさせる。
      倍率と移動の操作（ボタン・`+`・`-`・`0`・矢印キー・ドラッグ・ピンチ・ホイール）は `attachZoom` に `percentBase: "fit"`・`touchPan: "native"`・`wheelToScroller: true` で任せ、表示する枠の高さの付け替えだけをこの関数が持つ。
      `attachZoom` の `dragOwner` は `[data-drag-owner]` にし、map のノード・グループのタイトルの行と縁・線の押せる帯・グループの角（map の部品が `data-drag-owner` を付ける）の上では図の移動を始めない。
      ホイールで倍率は変えず、拡大して縦にスクロールできる間だけ文書かスクロールする祖先へ指定する。
      開閉のボタン（`data-tool="more"`）を押すたびに、パネル（`.mdmark-diagram-tools`）の `data-open` と、開閉のボタンの `aria-expanded`・スクリーンリーダー向けの名前（`表示の操作を開く`・`表示の操作を閉じる`）を切り替える。

      表示する枠の高さは次のように決める。

      | 場面 | 高さ |
      | --- | --- |
      | 文書の中の表示する枠を開いたときと、開いたときの倍率に戻したとき | `style.height` を、定義の高さ × 全体が収まる倍率と `--mdmark-diagram-max-height` の計算値（`style.maxHeight` を削除して読み込む `getComputedStyle` の `maxHeight`）の小さいほうにする |
      | 倍率を適用するたび | `style.maxHeight` を定義の高さ × 今の倍率にする（利用側が高さを変えたとき、36rem で止めず図の全体が収まる高さまで広げられる） |
      | 全画面に写す枠 | `style.height` と `style.maxHeight` を削除する |
      | 印刷 | CSS（`@media print .mdmark`）がインラインの高さと上限を削除する |

      表示する枠の大きさを `ResizeObserver` で確認して、開いたときの倍率のままならもう一度求める。
      `fitHeight` は関数で指定し、リサイズハンドルで高さを変えた後だけ `true` を返却する。

      全画面のボタンでは `openDiagramDialog` に `attachModal` を指定する（map の図が全画面のモーダルの図に操作を付け直す）。
      図ごとに `attachDiagramTips` を付け、`attachZoom` の `onPanStart` でその `closeOpen` を呼ぶ。
      `div.mdmark-diagram-resize` を持つ図には `attachDiagramResize` を付け、高さを変えたら `attachZoom` の `refit()` を呼ぶ。
      `attachDiagramResize` のキーは `diagramHeightKey` に `location.pathname`・`root` の中の `figure.mdmark-diagram` の順・題名を指定する。
      保った高さがあればその高さで開く。

      シーケンス図の参加者の行（`.mdmark-diagram-seq-heads`）は、表示する枠の `scroll` と、文書の中の図では表示する枠をスクロールさせる場所（`scrollParent`）の `scroll` で位置を決める。
      表示する枠の上端からの下げ幅は、次の 2 つの大きいほうにする（表示する枠の下端から参加者の行の高さを引いた位置を上限にする）。

      - 表示する枠の `scrollTop`
      - スクロールする場所の上端に `--mdmark-sticky-top` の計算値を加算した位置から、表示する枠の上端までの距離

      下げ幅は図の座標に換算して `transform` に入れ、下げたときは `is-stuck` を付ける。
      全画面のモーダルの中は表示する枠の `scrollTop` だけで決める。

      ドラッグを始めない要素は、map の図の文字と、mermaid の図の SVG の文字（`text`・`tspan`・`foreignObject` の中の要素）にする
    args:
      - name: options
        type: '{ root: HTMLElement; placement: TooltipPlacement; storage?: Storage | null; figures?: HTMLElement[]; attachModal?: (modal: HTMLElement, source: HTMLElement) => (() => void) }'
        required: true
        description: 描いた要素と、図のツールチップを先に出す側（設定の `tooltips.diagramPlacement`。`attachDiagramTips` と `openDiagramDialog` へ指定する）と、高さを保つ先（既定は `sessionStorage`。読み込めないときは `null`。単体テストで差し替える）と、付ける図（省くと `root` の中の全ての `figure.mdmark-diagram`。mermaid の図は描いた後に指定する。高さのキーの通し番号は `figures` を指定しても `root` の中の順）と、全画面のモーダルに複製した図へ部品の操作を付け直す関数（`openDiagramDialog` へ指定する）
    returns:
      type: () => void
      description: 付けた操作と監視を解除し、開いている全画面を閉じる関数
    callees:
      - 'MOD-472-173#functions[fitScale]'
      - '#functions[openDiagramDialog]'
      - 'MOD-472-177#functions[attachZoom]'
    unit_tests:
      - name: test_attach_diagrams
        case: 正常
        summary: 収まる倍率で開き、拡大と戻す
        condition: 幅 600px の要素に幅 1100 の mermaid の図
        mock: なし
        expected: 倍率の表示が `100%` で縮小が `disabled` を持たず、拡大の後に `125%`、`0` の後に `100%`
      - name: test_attach_diagrams_when_max
        case: 正常
        summary: 上限で拡大を押せなくする
        condition: 拡大を 10 回押す
        mock: なし
        expected: 倍率の表示が `500%`（全体が収まる倍率の 5 倍）で拡大が `disabled`
      - name: test_attach_diagrams_when_panned
        case: 正常
        summary: 拡大した間だけ表示する枠の `data-at-fit` を解除し、矢印キーで動かす
        condition: 拡大を 2 回押して表示する枠で `ArrowRight`
        mock: なし
        expected: 表示する枠が `data-at-fit` を持たず、移動のボタンのまとまりが無く、`scrollLeft` が 80 増える
      - name: test_attach_diagrams_when_wheel
        case: 正常
        summary: ホイールで倍率を変えず、開いたときの倍率では受け取らない
        condition: 開いた直後の表示する枠に `wheel`
        mock: なし
        expected: 倍率が変わらず `defaultPrevented` が `false`
      - name: test_attach_diagrams_when_cleaned_up
        case: 正常
        summary: 削除すると監視も削除される
        condition: 戻り値を呼ぶ
        mock: '`ResizeObserver.prototype.disconnect` を呼ばれた回数を数える関数で包む'
        expected: '`disconnect` が図の数だけ呼ばれ、拡大を押しても倍率が変わらない'
      - name: test_attach_diagrams_when_zoom_button
        case: 正常
        summary: 倍率のボタンで開いたときの倍率と位置に戻す
        condition: 幅 600px の要素に幅 1100 の mermaid の図。拡大を 2 回押して表示する枠を `ArrowRight` で動かし、倍率のボタンを押す
        mock: なし
        expected: 押す前のスクリーンリーダー向けの名前が `倍率 156%。全体が収まる倍率に戻す`、押した後に文字が `100%` で `scrollLeft` が 0、開いたときの倍率で押しても倍率が変わらない
      - name: test_attach_diagrams_when_tall
        case: 正常
        summary: 開いたときの高さを `--mdmark-diagram-max-height` で抑え、上限を図の全体が収まる高さにする
        condition: 幅 600px の要素に幅 600・高さ 1200 の mermaid の図（`--mdmark-diagram-max-height` は既定の 36rem = 576px）
        mock: なし
        expected: 表示する枠の `clientHeight` が 576 で、`style.maxHeight` が `1200px`
      - name: test_attach_diagrams_when_resized
        case: 正常
        summary: 利用側が高さを変えると、36rem を超えて図の全体が収まる高さまで広がり、倍率に合わせて上限を付け替える
        condition: 幅 600px の要素に幅 600・高さ 1200 の mermaid の図。表示する枠の `style.height` を `1000px`、`1500px` の順にし、拡大を 1 回押し、`0` を押す
        mock: なし
        expected: '`clientHeight` が 1000、1200（上限で止まる）の順になり、拡大の後に `style.maxHeight` が `1500px`、`0` の後に `clientHeight` が 576 で `style.maxHeight` が `1200px`'
      - name: test_attach_diagrams_when_handle_resized
        case: 正常
        summary: リサイズハンドルで高さを変えると、全体が収まる倍率を幅と高さでもう一度求め、もう一度付けても保つ
        condition: 幅 600px の要素に幅 500・高さ 1600 の mermaid の図。リサイズハンドルを 200px 下へドラッグし、`0` を押し、削除して同じ要素にもう一度付ける
        mock: '`storage` に `Map` で包んだ `Storage` の構造のオブジェクトを指定する'
        expected: ドラッグの後に `clientHeight` が 776 で倍率が変わらず、`0` の後の倍率が `776 / 1600` で、もう一度付けた後の `clientHeight` が 776
      - name: test_attach_diagrams_when_figures_given
        case: 正常
        summary: 指定した図だけに付け、倍率の下限を守る
        condition: 幅 300px の要素に、幅 1100 の mermaid の図と、`data-fit-min="0.75"` を持つ幅 1100 の図。`figures` に後者だけを指定する
        mock: なし
        expected: 後者の中身の `transform` が `scale(0.75)` で、拡大のボタンで倍率が変わる。前者の拡大のボタンを押しても倍率が変わらない
      - name: test_attach_diagrams_when_page_scrolled
        case: 正常
        summary: 文書をスクロールすると参加者の行を画面の上端に留め、下端で押し上げる
        condition: 高さ 600px のスクロールする場所に、高さ 400px の表示する枠の map のシーケンス図（参加者の行の高さ 60px）。`--mdmark-sticky-top` を `48px` にし、表示する枠の上端がスクロールする場所の上端より 100px 上に出るまでスクロールし、次に表示する枠の下端がスクロールする場所の上端から 80px の位置になるまでスクロールする
        mock: なし
        expected: 最初のスクロールの後に参加者の行の `transform` が `translateY(148px)` で `is-stuck` を持ち、次のスクロールの後に `translateY(340px)`（表示する枠の高さ − 参加者の行の高さ）
      - name: test_attach_diagrams_when_modal_heads
        case: 正常
        summary: 全画面の中は表示する枠の上端だけに留める
        condition: map のシーケンス図を全画面で開き、拡大を 2 回押して、モーダルの表示する枠を 120px 縦に動かす（全体が収まる倍率では縦に動かせない）
        mock: なし
        expected: モーダルの中の参加者の行の `transform` が 図の座標に換算した 120px（`120 / 今の倍率`）の `translateY`
      - name: test_attach_diagrams_when_mermaid_text_drag
        case: 正常
        summary: mermaid の図の文字の上のドラッグは図を動かさない
        condition: 拡大を 2 回押した mermaid の図で、ノードの `text` の上と、文字の無い余白の上から、それぞれ横に 80px ドラッグする
        mock: なし
        expected: 文字の上のドラッグでは `scrollLeft` が変わらず、余白のドラッグでは 80 変わる
      - name: test_attach_diagrams_when_panel_toggled
        case: 正常
        summary: 開閉のボタンでパネルを開き、もう一度押すと畳む
        condition: 幅 600px の要素に幅 1100 の mermaid の図。開閉のボタンを 2 回押す
        mock: なし
        expected: 1 回目の後にパネルが `data-open` を持ち、開閉のボタンが `aria-expanded="true"`・`aria-label="表示の操作を閉じる"`。2 回目の後に `data-open` を持たず、`aria-expanded="false"`・`aria-label="表示の操作を開く"`
    refs:
      - IF-472-35#constraints[シーケンス図の参加者の行を留める]
  - name: openDiagramDialog
    title: 図を全画面で開く
    container: src/diagram/diagram.interact.ts
    kind: 関数
    scope: internal
    summary: '図を全画面の `dialog` で開き、閉じたらフォーカスを全画面のボタンへ戻す'
    description: |-
      図のタイトル・中身・凡例をコピーした `modal` の枠を `dialog` に入れて `root` の中に配置し、`showModal()` で開き、拡大・縮小とツールチップを付ける。
      `attachModal` があれば、複製した図と元の図を指定して呼び、部品の操作（種類 `map` の図の操作）を付け直す。閉じたときに返された解除の関数を呼ぶ。モーダルの図の `DIAGRAM_REDRAW_EVENT` でツールチップを付け直す（部品が中身を描き直したとき）。
      ツールチップを開いている間は、`dialog` の中の `keydown` の Esc を `preventDefault` してツールチップだけを閉じる（close request を発生させない。`cancel` を取り消す作りは、history-action activation を使用し切ると 2 回目から取り消せないため使用しない）。
      閉じるボタンか Esc で閉じたら、`close` で付けた操作と監視を解除して `dialog` を削除し、フォーカスを全画面のボタンへ戻す
    args:
      - name: options
        type: '{ figure: HTMLElement; opener: HTMLButtonElement; placement: TooltipPlacement; attachModal?: (modal: HTMLElement, source: HTMLElement) => (() => void) }'
        required: true
        description: 開く図・全画面のボタン・モーダルの中のツールチップを先に出す側・複製した図に部品の操作を付け直して解除の関数を返す関数
    returns:
      type: () => void
      description: 開いた全画面を閉じる関数
    callees:
      - 'MOD-472-184#functions[attachDiagramTips]'
    unit_tests:
      - name: test_open_diagram_dialog
        case: 正常
        summary: 開いて Esc で閉じ、フォーカスを戻す
        condition: 全画面のボタンを押し、ツールチップを開かずに Esc を押す（Playwright のキー操作）
        mock: なし
        expected: 押した後に `dialog[open]` が 1 つあり、Esc の後に `dialog` が無く、フォーカスが全画面のボタン
      - name: test_open_diagram_dialog_when_attach_modal
        case: 正常
        summary: 複製した図に部品の操作を付け直し、閉じたら解除する
        condition: '`attachModal` を記録する関数にして全画面のボタンを押し、閉じるボタンを押す'
        mock: '`attachModal`（呼び出しと、返す解除の関数の呼び出しを記録）'
        expected: '`attachModal` がモーダルの中の図と元の図で 1 回呼ばれ、閉じた後に解除の関数が 1 回呼ばれる'
      - name: test_open_diagram_dialog_when_tip_open
        case: 正常
        summary: ツールチップを開いている間の Esc は何度でもツールチップだけを閉じる
        condition: モーダルの中でツールチップ A にポインターを乗せて Esc、ツールチップ B にポインターを乗せて Esc（Playwright のキー操作）
        mock: なし
        expected: どちらの Esc の後もツールチップが `hidden` を持ち、`dialog` が `open` のまま
  - name: renumberIds
    title: 図のidを付け替える
    kind: 関数
    scope: public
    container: src/diagram/diagram.interact.ts
    summary: 図の `id` の頭を付け替え、それを指す属性も合わせて付け替える
    description: 全画面のモーダルに複製した図と、同じページに並べた図の `id` が重ならないよう、`id` の頭 `from` を `to` に付け替える。
    args:
      - name: scope
        type: HTMLElement
        required: true
        description: 付け替える図の要素
      - name: from
        type: string
        required: true
        description: 付け替える前の `id` の頭（空なら何もしない）
      - name: to
        type: string
        required: true
        description: 付け替えた後の `id` の頭
    returns:
      type: void
      description: なし
    process: |-
      1. `scope` と中の要素の `id` のうち `{from}-` で始まるものを `{to}-` で始まる値にする
      2. `aria-describedby`・`aria-labelledby`・`aria-controls`・`for` の値の中の同じ頭の `id` を付け替える
      3. 線の矢じりと端の記号の参照（`marker-start`・`marker-end`）と塗りの模様の参照（`fill`）の `url(#{from}-…)` を `url(#{to}-…)` にする
    unit_tests:
      - name: test_renumber_ids
        case: 正常
        summary: id と、それを指す属性・矢じりと端の記号の参照を付け替える
        condition: '`id` が `map-1-head-0`・`map-1-head-0-from-circle` の `marker` と、`marker-start` に `url(#map-1-head-0-from-circle)`・`marker-end` に `url(#map-1-head-0)` を持つ `path`、`aria-describedby` に `map-1-tip-0` を持つ要素を持つ図を、`from` が `map-1`・`to` が `map-1-modal` で付け替える'
        mock: なし
        expected: '`marker` の `id` が `map-1-modal-head-0`・`map-1-modal-head-0-from-circle`、`path` の `marker-start` が `url(#map-1-modal-head-0-from-circle)`・`marker-end` が `url(#map-1-modal-head-0)`、`aria-describedby` が `map-1-modal-tip-0`'
lead: '図の拡大・縮小・移動・全画面の操作の付与を受け持ち、図の表示の操作を変えるときに参照する。'
tags:
