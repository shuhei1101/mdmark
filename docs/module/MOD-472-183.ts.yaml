id: MOD-472-183
visibility: internal
title: ライブラリ本体 / 図 / diagrams.ts
test_files:
  - tests/unit/src/interact/diagrams.browser.test.ts
functions:
  - name: attachDiagrams
    title: 図の拡大・縮小・移動・全画面を付ける
    container: src/interact/diagrams.ts
    kind: 関数
    scope: internal
    summary: '`root` の中の `figure.mdmark-diagram` ごとに、`fitScale` で開いたときの倍率を当て（`data-fit-min` を持つ図は、その値より小さくしない）、縮小・拡大・倍率のボタン（倍率のボタンは `0` と同じく開いたときの倍率と位置に戻し、倍率が変わるたびに文字とスクリーンリーダー向けの名前を書き換える）・`+`・`-`・`0`・矢印キー・余白のドラッグ・全画面のボタンを付ける。倍率は図の中身に `transform: scale()` を掛け、大きさのノードを倍率を掛けた大きさにしてスクロールさせる。文書の中の表示する枠は、開いたときと開いたときの倍率に戻したときに `style.height` を定義の高さ × 全体が収まる倍率と `--mdmark-diagram-max-height` の計算値（`style.maxHeight` を削除して読み込む `getComputedStyle` の `maxHeight`）の小さいほうにし、倍率を適用するたびに `style.maxHeight` を定義の高さ × 今の倍率にする（利用側が高さを変えたとき、36rem で止めず図の全体が収まる高さまで広げられる）。全画面に写す枠は `style.height` と `style.maxHeight` を削除する。印刷では CSS（`@media print .mdmark`）がインラインの高さと上限を削除する。表示する枠の大きさを `ResizeObserver` で確認して、開いたときの倍率のままならもう一度求める。ER 図の図には `attachErFolds` を付ける。ホイールは受け取らない。倍率と移動の操作（ボタン・`+`・`-`・`0`・矢印キー・ドラッグ）は `attachZoom` に `percentBase: "fit"` で任せ、表示する枠の高さの付け替えだけをこの関数が持つ。`fitHeight` は関数で指定し、リサイズハンドルで高さを変えた後だけ `true` を返却する。図ごとに `attachDiagramTips` と `attachDiagramTouch` を付け、`attachZoom` の `onPanStart` でその `closeOpen` を呼ぶ。`div.mdmark-diagram-resize` を持つ図には `attachDiagramResize` を付け（キーは `diagramHeightKey` に `location.pathname`・`root` の中の `figure.mdmark-diagram` の順・題名を指定する。保った高さがあればその高さで開く）、高さを変えたら `attachZoom` の `refit()` を呼ぶ'
    args:
      - name: options
        type: '{ root: HTMLElement; placement: TooltipPlacement; storage?: Storage | null; figures?: HTMLElement[]; partStates?: PartStates }'
        required: true
        description: 描いた要素と、図のツールチップを先に出す側（設定の `tooltips.diagramPlacement`。`attachDiagramTips` と `openDiagramDialog` へ指定する）と、高さを保つ先（既定は `sessionStorage`。読み込めないときは `null`。単体テストで差し替える）と、付ける図（省くと `root` の中の全ての `figure.mdmark-diagram`。mermaid の図は描いた後に指定する。高さのキーの通し番号は `figures` を指定しても `root` の中の順）。`partStates` は文書の中の ER 図の `attachErFolds` に `states` として指定する部品の開閉の記録（全画面の枠には指定しない）
    returns:
      type: () => void
      description: 付けた操作と監視を解除し、開いている全画面を閉じる関数
    callees:
      - 'MOD-472-173#functions[fitScale]'
      - '#functions[openDiagramDialog]'
      - 'MOD-472-177#functions[attachZoom]'
      - 'MOD-472-188#functions[attachErFolds]'
      - 'MOD-472-346#functions[attachDiagramTouch]'
    unit_tests:
      - name: test_attach_diagrams
        case: 正常
        summary: 収まる倍率で開き、拡大と戻す
        condition: 幅 600px の要素に幅 1100 の ER 図
        mock: なし
        expected: 倍率の表示が `100%` で縮小が `disabled`、拡大の後に `125%`、`0` の後に `100%`
      - name: test_attach_diagrams_when_max
        case: 正常
        summary: 上限で拡大を押せなくする
        condition: 拡大を 10 回押す
        mock: なし
        expected: 倍率の表示が `550%`（定義の大きさの 3 倍）で拡大が `disabled`
      - name: test_attach_diagrams_when_panned
        case: 正常
        summary: 拡大した間だけ移動のボタンを出し、矢印キーで動かす
        condition: 拡大を 2 回押して表示する枠で `ArrowRight`
        mock: なし
        expected: 移動のボタンのまとまりが `hidden` を持たず、`scrollLeft` が 80 増える
      - name: test_attach_diagrams_when_wheel
        case: 正常
        summary: ホイールで倍率を変えない
        condition: 表示する枠に `wheel`
        mock: なし
        expected: 倍率が変わらず `defaultPrevented` が `false`
      - name: test_attach_diagrams_when_cleaned_up
        case: 正常
        summary: 削除すると監視も削除される
        condition: 戻り値を呼ぶ
        mock: '`ResizeObserver.prototype.disconnect` を呼ばれた回数を数える関数で包む'
        expected: '`disconnect` が図の数だけ呼ばれ、拡大を押しても倍率が変わらない'
      - name: test_attach_diagrams_when_zoom_button
        case: 正常
        summary: 倍率のボタンで開いたときの倍率と位置に戻す
        condition: 幅 600px の要素に幅 1100 の ER 図。拡大を 2 回押して表示する枠を `ArrowRight` で動かし、倍率のボタンを押す
        mock: なし
        expected: 押す前のスクリーンリーダー向けの名前が `倍率 156%。全体が収まる倍率に戻す`、押した後に文字が `100%` で `scrollLeft` が 0、開いたときの倍率で押しても倍率が変わらない
      - name: test_attach_diagrams_when_tall
        case: 正常
        summary: 開いたときの高さを `--mdmark-diagram-max-height` で抑え、上限を図の全体が収まる高さにする
        condition: 幅 600px の要素に幅 600・高さ 1200 の ER 図（`--mdmark-diagram-max-height` は既定の 36rem = 576px）
        mock: なし
        expected: 表示する枠の `clientHeight` が 576 で、`style.maxHeight` が `1200px`
      - name: test_attach_diagrams_when_resized
        case: 正常
        summary: 利用側が高さを変えると、36rem を超えて図の全体が収まる高さまで広がり、倍率に合わせて上限を付け替える
        condition: 幅 600px の要素に幅 600・高さ 1200 の ER 図。表示する枠の `style.height` を `1000px`、`1500px` の順にし、拡大を 1 回押し、`0` を押す
        mock: なし
        expected: '`clientHeight` が 1000、1200（上限で止まる）の順になり、拡大の後に `style.maxHeight` が `1500px`、`0` の後に `clientHeight` が 576 で `style.maxHeight` が `1200px`'
      - name: test_attach_diagrams_when_handle_resized
        case: 正常
        summary: リサイズハンドルで高さを変えると、全体が収まる倍率を幅と高さでもう一度求め、もう一度付けても保つ
        condition: 幅 600px の要素に幅 500・高さ 1600 の ER 図。リサイズハンドルを 200px 下へドラッグし、`0` を押し、削除して同じ要素にもう一度付ける
        mock: '`storage` に `Map` で包んだ `Storage` の構造のオブジェクトを指定する'
        expected: ドラッグの後に `clientHeight` が 776 で倍率が変わらず、`0` の後の倍率が `776 / 1600` で、もう一度付けた後の `clientHeight` が 776
      - name: test_attach_diagrams_when_figures_given
        case: 正常
        summary: 指定した図だけに付け、倍率の下限を守る
        condition: 幅 300px の要素に、幅 1100 の ER 図と、`data-fit-min="0.75"` を持つ幅 1100 の図。`figures` に後者だけを指定する
        mock: なし
        expected: 後者の中身の `transform` が `scale(0.75)` で、拡大のボタンで倍率が変わる。前者の拡大のボタンを押しても倍率が変わらない
  - name: openDiagramDialog
    title: 図を全画面で開く
    container: src/interact/diagrams.ts
    kind: 関数
    scope: internal
    summary: 図のタイトル・中身・凡例をコピーした `modal` の枠を `dialog` に入れて `root` の中に配置し、`showModal()` で開き、拡大・縮小とツールチップ（ER 図は `attachErFolds` も。コピーした枠は開いたときの列の開閉の状態のまま）を付ける。ツールチップを開いている間は、`dialog` の中の `keydown` の Esc を `preventDefault` してツールチップだけを閉じる（close request を発生させない。`cancel` を取り消す作りは、history-action activation を使用し切ると 2 回目から取り消せないため使用しない）。閉じるボタンか Esc で閉じたら、`close` で付けた操作と監視を解除して `dialog` を削除し、フォーカスを全画面のボタンへ戻す
    args:
      - name: options
        type: '{ figure: HTMLElement; opener: HTMLButtonElement; placement: TooltipPlacement }'
        required: true
        description: 開く図・全画面のボタン・モーダルの中のツールチップを先に出す側
    returns:
      type: () => void
      description: 開いた全画面を閉じる関数
    callees:
      - 'MOD-472-184#functions[attachDiagramTips]'
    unit_tests:
      - name: test_open_diagram_dialog
        case: 正常
        summary: 開いて Esc で閉じ、フォーカスを戻す
        condition: 全画面のボタンを押し、ツールチップを開かずに Esc を押す（Playwright のキー操作）
        mock: なし
        expected: 押した後に `dialog[open]` が 1 つあり、Esc の後に `dialog` が無く、フォーカスが全画面のボタン
      - name: test_open_diagram_dialog_when_tip_open
        case: 正常
        summary: ツールチップを開いている間の Esc は何度でもツールチップだけを閉じる
        condition: モーダルの中でツールチップ A にポインターを乗せて Esc、ツールチップ B にポインターを乗せて Esc（Playwright のキー操作）
        mock: なし
        expected: どちらの Esc の後もツールチップが `hidden` を持ち、`dialog` が `open` のまま
