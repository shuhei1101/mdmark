id: MOD-472-314
visibility: internal
title: ライブラリ本体 / 部品 / syntax-warning.ts
test_files:
  - tests/unit/src/parts/syntax-warning.test.ts
functions:
  - name: renderSyntaxWarning
    title: 記載の警告を描く
    container: src/parts/syntax-warning.ts
    kind: 関数
    scope: internal
    summary: 部品設計『記載の警告』の HTML を返却する。`message`・項目の `` ` `` で囲んだ箇所を `code` にし、それ以外はエスケープする
    args:
      - name: options
        type: '{ mark?: string; message: string; items?: WarningItem[] }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<div class="mdmark-syntax-warning" role="note">` で始まる HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_syntax_warning
        case: 正常
        summary: タイトル・マーカー・本文・項目を出し、マーカーをエスケープする
        condition: '`mark` が `<!-- table: data +x -->`、項目が 1 つ'
        mock: なし
        expected: 'タイトル `記載の警告`、`<code>&lt;!-- table: data +x --&gt;</code>`、`<ul>` に 1 項目'
      - name: test_render_syntax_warning_without_mark
        case: 正常
        summary: マーカーと項目が無ければ本文だけ
        condition: '`message` だけ'
        mock: なし
        expected: '`<code>` で始まらず、`<ul>` が無い'
