id: MOD-472-372
visibility: internal
title: ライブラリ本体 / 差分 / diff-side-by-side.part.ts
test_files:
  - tests/unit/src/diff/diff-side-by-side.part.test.ts
functions:
  - name: renderDiffSideBySide
    title: 左右に並べる差分を描く
    container: src/diff/diff-side-by-side.part.ts
    summary: 部品設計『左右に並べる差分』の HTML 文字列を返却する。広い幅の 2 列と狭い幅の 1 列の 2 つの並びを描き、CSS がどちらかを隠す
    description: |-
      広い幅は `div.mdmark-diff-side` の中に `section.mdmark-diff-side-col` を前・後の順に 2 つ配置し、それぞれの先頭に列の見出し（`id` は `{idPrefix}-before`・`{idPrefix}-after`）、続けて `rows` の順に行のセル（`div.mdmark-diff-side-cell`）を並べる。
      セルの中身は、`same` は `before`・`after` をそのまま、`change` は前の列に `renderDiffBlock({ kind: "del", unit: "block", html: before })`・後の列に `renderDiffBlock({ kind: "add", unit: "block", html: after })`、`add` は前の列に `div.mdmark-diff-side-gap`（`aria-hidden="true"`）・後の列に追加のブロック、`del` は前の列に削除のブロック・後の列に空きにする。
      列の `section` には `style="--mdmark-diff-side-rows: {行の数 + 1}"` を付け、CSS が subgrid の行の数に使用する。
      狭い幅は `div.mdmark-diff-side-stacked` の中に `rows` の順に、`same` は `after` を 1 回、`change` は `前: {before.label}` の小さい見出し（`p.mdmark-diff-side-label`）と削除のブロック、`後: {after.label}` の小さい見出しと追加のブロック、`add` は `後:` の見出しと追加のブロック、`del` は `前:` の見出しと削除のブロックを並べる。
      狭い幅の並びの中のブロックの `id` は、`scopeIds` と同じ書き方で `{idPrefix}-stacked-` を頭に付ける（呼ぶ側の `attachDiff` が付ける）。
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ before: { label: string }; after: { label: string }; rows: SideBySideRow[]; idPrefix: string }'
        required: true
        description: 部品設計の引数と、列の見出しの `id` の頭（差分の場所の `id`）
    returns:
      type: string
      description: 広い幅と狭い幅の 2 つの並びを持つ HTML 文字列
    unit_tests:
      - name: test_render_diff_side_by_side
        case: 正常
        summary: 広い幅の 2 列に、行の種類ごとのセルを並べる
        condition: '`same`・`change`・`add`・`del` の 4 行'
        mock: なし
        expected: '2 つの `section` が `aria-labelledby` で `前: `・`後: ` の見出しを指し、前の列は `same`・削除の色・空き・削除の色、後の列は `same`・追加の色・追加の色・空きの順で、空きが `aria-hidden="true"`'
      - name: test_render_diff_side_by_side_when_stacked
        case: 正常
        summary: 狭い幅の 1 列は、変えた行ごとに前の下に後を並べる
        condition: '`test_render_diff_side_by_side` と同じ 4 行'
        mock: なし
        expected: '`div.mdmark-diff-side-stacked` の子が、変えていないブロック、`前:`・削除の色・`後:`・追加の色、`後:`・追加の色、`前:`・削除の色の順'
    callees:
      - 'MOD-472-200#functions[renderDiffBlock]'
    refs:
      - CMP-472-67#
      - IF-472-35#constraints[左右に並べる差分]
    status: planned
data_models:
  - name: SideBySideRow
    title: 向かい合う 1 組のブロック
    container: src/diff/diff-side-by-side.part.ts
    role: DTO
    summary: 左右に並べる差分の 1 行
    description: '`{ kind: "same" | "change" | "add" | "del"; before?: string; after?: string }`。`before`・`after` はブロックを描いた HTML'
    status: planned
lead: '前と後のリビジョンを左右に並べる差分の HTML を受け持ち、左右に並べる差分の見た目を変えるときに参照する。'
tags:
  - name: topic:差分
    main: true
  - name: action:描画
