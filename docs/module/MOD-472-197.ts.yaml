id: MOD-472-197
visibility: internal
title: ライブラリ本体 / 差分 / diff-html.ts
test_files:
  - tests/unit/src/parts/diff-html.test.ts
functions:
  - name: renderDiffHtml
    title: 埋め込んだ HTML の差分を描く
    container: src/parts/diff-html.ts
    summary: 部品設計『埋め込んだHTMLの差分』の HTML を返却する。プレビューの前と後は、指定された安全な HTML を `renderEmbeddedHtml` の範囲で包む
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ changed: boolean; view?: "source" | "rendered"; sides?: "side" | "stack"; lines: string; before?: { label: string; html: string } | null; after?: { label: string; html: string } | null }'
        required: true
        description: 部品設計の引数。`lines` は描いた行の HTML
    returns:
      type: string
      description: 右端に `HTML` のラベルを持つ見出しと、変えた範囲なら見方のボタン（`role="group"`・`aria-label="HTML の見方"`）と 2 つの見方の中身
    unit_tests:
      - name: test_render_diff_html
        case: 正常
        summary: 変えた範囲に見方のボタンを付け、既定でソースを出す
        condition: '`changed: true`'
        mock: なし
        expected: 「ソース」が `aria-pressed="true"`、プレビューの中身が `hidden`
      - name: test_render_diff_html_when_unchanged
        case: 正常
        summary: 変えていない範囲はラベルだけの見出しにする
        condition: '`changed: false`'
        mock: なし
        expected: '`HTML` のラベルがあり、見方のボタンが無い'
      - name: test_render_diff_html_when_one_side
        case: 正常
        summary: 片側にしか無い範囲は無い側にそのことを出す
        condition: '`view: "rendered"`・`before: null`'
        mock: なし
        expected: 前の側が `前のリビジョンには、この範囲がありません`
    refs:
      - CMP-472-42#
