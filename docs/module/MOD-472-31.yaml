id: MOD-472-31
visibility: internal
title: "ライブラリ本体 / ビューとコメント"
lead: ビューとコメントの部品を `dist/index.js` と別の配布ファイル（`dist/view.js`・`dist/comments.js`）に分け、マーカーのある文書と `mountView`・`mountComments` を呼んだときにだけ読み込む処理と、その部品の HTML。ブラウザでだけ動く（部品の HTML と箇所の探し方は Node でも動く）。
diagrams:
  - name: 全体
    diagram: |-
      <!-- map -->

      ```mermaid
      flowchart LR
        n1["ビューを描く公開関数"]
        n2["ビューの引数を検める"]
        n3["部品のモジュールを読み込む"]
        n4["コメントを付ける公開関数"]
        n5["コメントの引数を検める"]
        n6["描いた文書に部品を付ける"]
        n7["ビューを描く"]
        n8["マーカーのビューに付ける"]
        n9["コメントを付ける"]
        n10["コメントの箇所を探す"]
        n11["選んだ範囲から下書きを作る"]
        n12["コメントを修正・削除する"]
        n13["部品のHTML"]
        n1 -.->|同期で検める| n2
        n1 -.->|view| n3
        n4 -.->|同期で検める| n5
        n4 -.->|comments| n3
        n6 -.->|マーカーと機能があるときだけ| n3
