id: MOD-472-219
visibility: internal
title: ライブラリ本体 / 操作 / side-toc.ts
test_files:
  - tests/unit/src/interact/side-toc.browser.test.ts
data_models:
  - name: SideTocState
    title: 右側の目次の状態
    container: src/interact/side-toc.ts
    summary: '`mount` ごとに 1 つ作り、`update` で再描画しても保つ右側の目次の状態。`attachSideToc` が読み込んで描き、押されるたびに書き換える'
    properties:
      - name: open
        type: boolean
        description: 目次を出すボタンで目次を出しているか
      - name: pinned
        type: boolean
        description: ピン止めしているか
    status: planned
    introduced:
      pr: 166
constants:
  - name: CURRENT_LINE_RATIO
    title: 今いるセクションを決める線の位置
    container: src/interact/side-toc.ts
    summary: 画面の上端から、今いるセクションを決める線までの高さの、画面の高さに対する割合
    value: '0.25'
    status: planned
    introduced:
      pr: 166
  - name: NARROW_WIDTH_REM
    title: 狭い幅の境目
    container: src/interact/side-toc.ts
    summary: 描く先の要素の幅がこの値（rem）未満のとき、右側の目次を狭い幅の帯で出す。CSS のコンテナクエリと同じ値で、項目を押した後にパネルを隠すかを決めるのに使用する
    value: '48'
    status: planned
    introduced:
      pr: 166
  - name: SIDE_TOC_HEADING_SELECTOR
    title: 右側の目次に並べる見出し
    container: src/interact/side-toc.ts
    summary: 右側の目次に並べる見出しのセレクタ。埋め込んだ HTML（`.mdmark-html`）の中の見出しは除く
    value: '"h1[id], h2[id], h3[id]"'
    status: planned
    introduced:
      pr: 166
  - name: SIDE_TOC_RAIL_COVER_REM
    title: 右端の線を枠で覆う高さ
    container: src/interact/side-toc.ts
    summary: hover で開く目次の枠が、右端の線の上端から届かせる高さ（rem）。線 3 本分で、線から枠へポインターを動かしても右側の目次の外を通らず hover が切れない
    value: '2'
    introduced:
      pr: 320
  - name: SIDE_TOC_EDGE_GAP_REM
    title: スクロールする場所の右端と右側の目次の間
    container: src/interact/side-toc.ts
    summary: hover でピン止めしていない右端の線と目次の枠の右端の、スクロールする場所の右端からの間（rem）。先頭へ戻るボタンの `--mdmark-back-to-top-gap` の既定と同じ
    value: '1'
    refs:
      - IF-472-35#constraints[右側の目次の重なりと留める位置]
    status: planned
    introduced:
      pr: 323
  - name: SIDE_TOC_AVOID_GAP_PX
    title: 差分のミニマップと右側の目次の間
    container: src/interact/side-toc.ts
    summary: 差分のミニマップの帯と横の範囲が重なるとき、帯の左端から右端の線と目次の枠の右端までに空ける幅（px）。`BACK_TO_TOP_AVOID_GAP_PX` と同じ値
    value: '8'
    refs:
      - IF-472-35#constraints[右側の目次の重なりと留める位置]
    status: planned
    introduced:
      pr: 323
functions:
  - name: collectSideTocHeadings
    title: 右側の目次の見出しを集める
    container: src/interact/side-toc.ts
    summary: '本文の中の `SIDE_TOC_HEADING_SELECTOR` に該当する見出しを文書の順に集め、レベル・ID・表示する文字（`visibleText`。開閉のボタンとアンカーを除いた見出しの文字）と、`findChangedHeadings` が返却した ID の見出しに `changed: true` を返却する。`.mdmark-html` の中の見出しは除く'
    kind: 関数
    scope: internal
    args:
      - name: content
        type: HTMLElement
        required: true
        description: 本文の列（`div.mdmark-content`）
    returns:
      type: SideTocHeading[]
      description: 見出しの並び。無ければ空の配列
    callees:
      - '#functions[findChangedHeadings]'
    unit_tests:
      - name: test_collect_side_toc_headings
        case: 正常
        summary: h1〜h3 を文書の順に集め、h4 と埋め込んだ HTML の中の見出しを除く
        condition: '`# 手引き`・`## 導入`・`### 注意`・`#### 細目` と、`.mdmark-html` の中の `h2` を持つ本文を `attachSections` で開閉にしてから指定する'
        mock: なし
        expected: '`[{level: 1, id: "手引き", text: "手引き"}, {level: 2, id: "導入", text: "導入"}, {level: 3, id: "注意", text: "注意"}]`'
      - name: test_collect_side_toc_headings_when_changed
        case: 正常
        summary: 色分けしたブロックを持つセクションの見出しに changed を付ける
        condition: '`# 手引き`・`## 導入`（段落）・`## 使用方法`（`data-kind="add"` の段落）の本文'
        mock: なし
        expected: '`手引き`・`使用方法` が `changed: true` を持ち、`導入` は `changed` を持たない'
    status: planned
    introduced:
      pr: 166
  - name: findChangedHeadings
    title: 変わったセクションの見出しを集める
    container: src/interact/side-toc.ts
    summary: 本文の中の `.mdmark-diff-block` ごとに、そのブロックが含む h1〜h3 の見出しか、無ければ文書の順でそのブロックの前にある最後の h1〜h3 の見出しを起点にし、起点とそれより浅いレベルの前にある見出しを順に祖先として集めて、ID を持つ見出しの ID を返却する。数える見出しは本文の中の全ての h1〜h3（削除のブロックの中の `id` を持たない見出しを含む。`.mdmark-html` の中の見出しは除く）で、`id` を持たない見出しは ID を返却せず祖先だけを集める
    kind: 関数
    scope: internal
    args:
      - name: content
        type: HTMLElement
        required: true
        description: 本文の列（`div.mdmark-content`）
    returns:
      type: Set<string>
      description: 変わったセクションの見出しの ID。色分けしたブロックが無ければ空
    unit_tests:
      - name: test_find_changed_headings
        case: 正常
        summary: 色分けしたブロックを持つセクションと、その祖先の見出しを集める
        condition: '`# 文書`・`## A`（段落）・`## B`（`data-kind="add"` の段落）・`### B1`（段落）の本文'
        mock: なし
        expected: '`文書`・`B` だけを持つ'
      - name: test_find_changed_headings_when_section_deleted
        case: 正常
        summary: 見出しごと削除したセクションは祖先にだけ付け、前のセクションに付けない
        condition: '`# 文書`・`## A`・`### A1`（段落）の後ろに、`id` を持たない `## E` と段落を包んだ `data-kind="del"` のブロック 2 つ、続けて `## C`（段落）を持つ本文'
        mock: なし
        expected: '`文書` だけを持ち、`A`・`A1`・`C` を持たない'
      - name: test_find_changed_headings_when_heading_rewritten
        case: 正常
        summary: 見出しの文字を書き換えたときは新しい見出しに付ける
        condition: '`# 文書` の後ろに、`id` を持たない `## 古い名前` の `data-kind="del"` のブロックと、`## 新しい名前` の `data-kind="add"` のブロックを持つ本文'
        mock: なし
        expected: '`文書`・`新しい名前` を持つ'
      - name: test_find_changed_headings_when_no_diff
        case: 正常
        summary: 色分けしたブロックが無ければ何も集めない
        condition: '`.mdmark-diff-block` を持たない本文'
        mock: なし
        expected: 空の集まり
    status: planned
    introduced:
      pr: 550
  - name: pickCurrentHeading
    title: 今いるセクションの見出しを決める
    container: src/interact/side-toc.ts
    summary: 画面に出ている見出しの位置から今いるセクションの見出しを決める。上端が線（`line`）以下の見出しのうち最後のものを返却し、無ければ画面の中にある最初の見出しを返却する。どちらも無ければ `undefined`
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ headings: { id: string; top: number }[]; line: number; viewportHeight: number }'
        required: true
        description: 閉じたセクションと選ばれていないタブの中に無い見出しの ID と、画面の上端からの位置（文書の順）、線の位置、画面の高さ
    returns:
      type: string | undefined
      description: 今いるセクションの見出しの ID
    unit_tests:
      - name: test_pick_current_heading
        case: 正常
        summary: 線より上にある最後の見出しを選ぶ
        condition: '`[{id: "a", top: -300}, {id: "b", top: 100}, {id: "c", top: 400}]`、`line: 200`、`viewportHeight: 800`'
        mock: なし
        expected: '`"b"`'
      - name: test_pick_current_heading_when_below_line
        case: 正常
        summary: 線より上に見出しが無ければ画面の中の最初の見出しを選ぶ
        condition: '`[{id: "a", top: 300}, {id: "b", top: 600}]`、`line: 200`、`viewportHeight: 800`'
        mock: なし
        expected: '`"a"`'
      - name: test_pick_current_heading_when_none
        case: 正常
        summary: 線より上にも画面の中にも見出しが無ければ選ばない
        condition: '`[{id: "a", top: 900}]`、`line: 200`、`viewportHeight: 800`'
        mock: なし
        expected: '`undefined`'
    status: planned
    introduced:
      pr: 166
  - name: attachSideToc
    title: 右側の目次を付ける
    container: src/interact/side-toc.ts
    summary: 描く先の要素の子を本文の列（`div.mdmark-content`）に包み、その後ろに `renderSideToc` の右側の目次を配置して操作を付ける。見出しが無ければ何も配置せず `content` に `el` を返却する。目次を出すボタンで `data-open` と `aria-expanded`、ピン止めで `data-pinned` と `aria-pressed` を切り替えて `state` に記録する。出したパネルで Esc を押すとパネルを隠して目次を出すボタンへフォーカスを戻す。すべて展開・すべて折りたたみで `foldAllSections` を呼ぶ。項目を押すと、リンクの `data-heading-id` の ID の見出しを `revealTarget` で開いて移り（`href` は読み込まない。まとめた HTML は `rewriteLinks` で `href` を書き換える）（既定の動きは止めない）、`el` の幅が `NARROW_WIDTH_REM` 未満ならパネルを隠す。IntersectionObserver・`hashchange`・本文の列の `click` と `keyup`・すべて展開とすべて折りたたむの押下を受けて、次の描画のタイミングに今いるセクションをもう一度決める。もう一度決めるときは、祖先に `hidden` を持つ見出し（閉じたセクションの中身と選ばれていないタブの中身の中の見出し）を除いて `pickCurrentHeading` に指定し、決まった見出しの項目に `aria-current="location"`、右端の線のその見出しの線に `data-current` を付け、目次を出すボタンの `mdmark-side-toc-current`（狭い幅の帯に出る文字）に見出しの文字を配置する。hover の出し方では、付けたときと、`findScrollContainer` のスクロールする場所と画面の `scroll`・`resize` と、`document.body` の子の追加・削除（`MutationObserver`。差分のミニマップの帯の出し入れ）のたびに、hover で開く目次の枠の位置を aside の `--mdmark-side-toc-panel-top`（見えている枠の上端 = スクロールする場所が画面全体なら 0、要素ならその上端に、`--mdmark-sticky-top` と `--mdmark-space` を加算した位置）・`--mdmark-side-toc-panel-end`（右端の線と枠の右端。画面の右端から、スクロールする場所のスクロールバーを除いた右端（画面全体なら `document.documentElement.clientWidth`、要素ならその左端に `clientLeft` と `clientWidth` を加算した位置。画面からはみ出す分は画面の端）までの幅に `SIDE_TOC_EDGE_GAP_REM` を追加した値。`document.body` の子の `.mdmark-diff-minimap` のうち、幅が 0 でなく、その右端から左へパネルの幅までの横の範囲と重なるものがあれば、画面の右端からその左端までの幅に `SIDE_TOC_AVOID_GAP_PX` を追加した値。描く先の要素の位置は使用しない。aside は CSS の `min-width` で線の幅を取ったままにし、ピン止めの有無で本文の列の幅を変えない）・`--mdmark-side-toc-panel-min-height`（右端の線の上端に `SIDE_TOC_RAIL_COVER_REM` を追加した位置までの高さ。0 未満は 0）と、右端の線の位置を `--mdmark-side-toc-rail-top`（aside の上端と `--mdmark-side-toc-panel-top` の大きい方。右端の線の上端はこの値で決める）・`--mdmark-side-toc-rail-height`（画面の下端・スクロールする要素の下端・描く先の要素の下端のうち最も小さい位置から、`--mdmark-side-toc-rail-top` と `--mdmark-space` を減算した高さ。0 未満は 0）に px で入れる。その高さが 0 のとき（描く先の要素の下端が線の上端より上にある）は aside に `data-rail-outside` を付け、それ以外は削除する。削除する関数は包む前の子の並びへ戻し、位置を決める受け取りを解除する
    kind: 関数
    scope: internal
    side_effects: '`el` の子を本文の列へ移し、右側の目次の要素を追加し、`state` を書き換える'
    args:
      - name: options
        type: '{ el: HTMLElement; mode: SideTocMode; sections: boolean; state: SideTocState }'
        required: true
        description: 描く先の要素・出し方・すべて展開とすべて折りたたみを出すか（`features.sections`）・`mount` が保つ状態
    returns:
      type: '{ content: HTMLElement; aside?: HTMLElement; detach: () => void }'
      description: 本文の列（見出しが無ければ `el`）・右側の目次の要素・削除する関数
    callees:
      - '#functions[collectSideTocHeadings]'
      - '#functions[pickCurrentHeading]'
      - 'MOD-472-222#functions[revealTarget]'
      - 'MOD-472-222#functions[foldAllSections]'
      - 'MOD-472-234#functions[findScrollContainer]'
    unit_tests:
      - name: test_attach_side_toc
        case: 正常
        summary: 本文を列に包み、見出しを入れ子にした右側の目次を配置する
        condition: '`# 手引き`・`## 導入`・`### 注意` を描いた要素に `mode: "hover"` で付ける'
        mock: なし
        expected: '`el` の子が `div.mdmark-content` と `aside.mdmark-side-toc` の 2 つ。目次の項目が `#手引き`・`#導入`・`#注意` へのリンクで、`aside` が `data-mode="hover"`'
      - name: test_attach_side_toc_when_no_headings
        case: 正常
        summary: 見出しが無ければ何も配置しない
        condition: 段落だけを描いた要素に付ける
        mock: なし
        expected: '`content` が `el`、`aside` が `undefined` で、`el` の子は変わらない'
      - name: test_attach_side_toc_when_toggled
        case: 正常
        summary: 目次を出すボタン・ピン止め・Esc で状態を切り替えて記録する
        condition: 目次を出すボタンを押し、ピン止めを押し、パネルで Esc を押す
        mock: なし
        expected: '押した後に `data-open` と `aria-expanded="true"`、ピン止めの後に `data-pinned` と `aria-pressed="true"`、Esc の後に `data-open` が無くフォーカスが目次を出すボタン。`state` が `{open: false, pinned: true}`'
      - name: test_attach_side_toc_when_state_kept
        case: 正常
        summary: 保った状態でもう一度付けると同じ出し方で出す
        condition: '`state` を `{open: true, pinned: true}` にして付ける'
        mock: なし
        expected: '`aside` が `data-open` と `data-pinned` を持つ'
      - name: test_attach_side_toc_when_link_into_closed_section
        case: 正常
        summary: 閉じたセクションの中の見出しの項目を押すとセクションを開いて移る
        condition: '`attachSections` で閉じた `## 導入` の中の `### 注意` の項目を押す'
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`導入` の中身が `hidden` を持たず、`注意` で `scrollIntoView` が呼ばれ、`click` の `defaultPrevented` が `false`'
      - name: test_attach_side_toc_when_fold_all
        case: 正常
        summary: すべて折りたたみ・すべて展開でセクションをまとめて開閉する
        condition: '`sections: true` で付け、すべて折りたたみを押してからすべて展開を押す'
        mock: なし
        expected: 折りたたみの後は H1 のセクションだけが開き、展開の後は全てのセクションが開く
      - name: test_attach_side_toc_when_sections_off
        case: 正常
        summary: セクションの開閉がオフならすべて展開・すべて折りたたみを配置しない
        condition: '`sections: false` で付ける'
        mock: なし
        expected: '`aside` の中にすべて展開・すべて折りたたみのボタンが無い'
      - name: test_attach_side_toc_when_scrolled
        case: 正常
        summary: スクロールすると今いるセクションの項目を付け替える
        condition: 見出しが 3 つある長い本文で、2 つ目の見出しを線より上へスクロールして次の描画を待つ
        mock: なし
        expected: 2 つ目の項目だけが `aria-current="location"`、右端の線の 2 本目だけが `data-current` を持ち、目次を出すボタンに 2 つ目の見出しの文字が出る
      - name: test_attach_side_toc_when_detached
        case: 正常
        summary: 削除すると包む前の子の並びへ戻す
        condition: 付けてから除外する
        mock: なし
        expected: '`el` の子が付ける前と同じ並びで、`aside` が無い'
      - name: test_attach_side_toc_when_heading_in_unselected_tab
        case: 正常
        summary: 選ばれていないタブの中の見出しを今いるセクションに数えない
        condition: '`## 導入` の後に、タブ名を `## macOS`・`## Windows`、中身を `### macOS の手順`・`### Windows の手順` にして `tabs` のマーカーで囲んだ長い本文を `attachInteractions` で操作にしてから付け、`macOS` のタブが選ばれたまま `macOS の手順` の見出しを線より上へスクロールして次の描画を待つ'
        mock: なし
        expected: '`macOS の手順` の項目だけが `aria-current="location"` で、`Windows の手順` の項目は持たない'
      - name: test_attach_side_toc_when_fold_all_moves_current
        case: 正常
        summary: すべて折りたたむと、閉じたセクションに入った見出しから今いるセクションをもう一度決める
        condition: '`# 手引き`・`## 導入`・`### 前提` の長い本文で `前提` を今いるセクションにした後、すべて折りたたむを押して次の描画を待つ'
        mock: なし
        expected: '`#前提` の項目が `aria-current` を持たず、閉じていないセクションの見出しの項目が `aria-current="location"` を持つ'
      - name: test_attach_side_toc_when_href_rewritten
        case: 正常
        summary: 項目の href を書き換えても、data-heading-id の見出しへセクションを開いて移る
        condition: '`attachSections` で閉じた `## 導入` の中の `### 注意` の項目の `href` を `#/a.md#注意` に書き換えてから押す'
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`導入` の中身が `hidden` を持たず、`注意` で `scrollIntoView` が呼ばれる'
      - name: test_attach_side_toc_when_hover_panel_placed
        summary: hover で開く目次の枠の位置を、見えている枠の上端と右端の線から決める
        case: 正常
        condition: '上端が画面の 100px の位置にある高さ 400px の縦にスクロールする要素の中に、見出しが 3 つの長い本文を描いた要素を配置し、`--mdmark-sticky-top: 8px` で `mode: "hover"` で付け、要素を下へスクロールして次の描画を待つ'
        expected: aside の `--mdmark-side-toc-panel-top` が、スクロールの前と後のどちらも `100 + 8 + --mdmark-space`（px）で、`--mdmark-side-toc-panel-end` が、画面の右端からスクロールする要素の左端に `clientLeft` と `clientWidth` を加算した位置までの幅に `SIDE_TOC_EDGE_GAP_REM`（rem）を px にして追加した値で、aside の右端の位置によらない（スクロールする要素より描く先の要素を狭くして左に配置する）。削除した後にスクロールしても値が変わらない
        mock: なし
