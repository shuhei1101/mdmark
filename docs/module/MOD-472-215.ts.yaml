id: MOD-472-215
visibility: internal
title: ライブラリ本体 / 描画 / page.ts
test_files:
  - tests/unit/src/render/page.test.ts
functions:
  - name: readPageSettings
    title: ページの設定のマーカーを読み込む
    container: src/render/page.ts
    kind: 関数
    scope: internal
    summary: page のマーカーの JSON のオブジェクト（マーカーの JSON Schema に通した後のもの）を記載した順に重ね、`PageSettings` にする
    description: 'page のマーカーを複数記載したときと同じキーが何度も出たときは、後に記載した値を使用する。`scheme`・`theme`・`toc.mode` の選べる値に無い値と知らないキーは、`validateMarkOptions` が `problems`・`unknownKeys` に分けて取り除いた後のため、ここでは扱わない'
    args:
      - name: options
        type: MarkOptions[]
        required: true
        description: 文書の先頭の page のマーカーの `options` を記載した順に並べたもの
    returns:
      type: PageSettings
      description: '`{ scheme?, theme?, toc? }`（`toc` は `toc.mode` の値）'
    unit_tests:
      - name: test_read_page_settings
        case: 正常
        summary: 記載できるキーと値を読み込む
        condition: '`[{ scheme: "dark", theme: "theme-slate", toc: { mode: "fixed" } }]`'
        mock: なし
        expected: '`{ scheme: "dark", theme: "theme-slate", toc: "fixed" }`'
      - name: test_read_page_settings_when_repeated
        case: 正常
        summary: 後に記載した値を使用する
        condition: '`[{ scheme: "dark", toc: { mode: "fixed" } }, { toc: { mode: "hover" } }]`'
        mock: なし
        expected: '`{ scheme: "dark", toc: "hover" }`'
    refs:
      - IF-472-35#constraints[ページの設定のマーカー]
    status: planned
