id: MOD-472-41
visibility: internal
title: ライブラリ本体 / 検査
lead: ESLint の道具と設定（`tools/eslint/`）・検査の npm scripts と、テストの起動で Git のリポジトリの場所を指す環境変数を削除する処理。配布物には入らない。
directory: |-
  ```tree
  {リポジトリの直下}/
  ├── tools/
  │   └── eslint/
  │       ├── package.json       # ESLint 9・TypeScript 6.0・typescript-eslint・plugin だけを持つ package
  │       ├── package-lock.json
  │       └── eslint.config.js   # VS Code 拡張機能の Webview（vscode/src/webview/）に適用する ESLint の Flat Config
  ├── scripts/
  │   └── eslint.ts              # tools/eslint/ の ESLint が無ければ入れてから起動する
  ├── tests/
  │   └── git-env.ts             # Git のリポジトリの場所を指す環境変数を削除する
  ├── vitest.config.ts           # 読み込んだ時点で git-env.ts の処理を呼ぶ
  └── package.json               # 検査の npm scripts（lint:eslint・typecheck:vscode・check）
  ```

  整形とリポジトリ全体の lint は今と同じ Biome（`biome check .`）が受け持ち、ESLint は Biome に無い React・アクセシビリティ・import の向き・Tailwind・複雑さの規則だけを Webview に適用する。
  配布物の対応ブラウザの下限の確認（`eslint-plugin-compat`）は今と同じく `scripts/baseline.ts` が ESLint の `Linter` を直接呼ぶ（この設定を読み込まない）。
notes:
  道具を分ける理由: 直下の `typescript` 7.0 は JavaScript の API（`createProgram` など）を持たず、typescript-eslint 8 は TypeScript 6.1 未満だけに対応する。`eslint-plugin-jsx-a11y` 6.10 は ESLint 9 までに対応する。このため ESLint の実行に要るものを `tools/eslint/` に分け、直下の型検査・`scripts/baseline.ts` の ESLint 10 には手を入れない
  適用の範囲: 複雑さの規則を含む ESLint の規則は Webview（`vscode/src/webview/`）だけに適用する（要件.md の未確定「複雑さの lint を error にする範囲」の案 A）。リポジトリの他の TypeScript へ広げるのは別の Issue で扱う
  閾値: knowledge の規約『設計原則』が上限の値を持たないため、`sonarjs/cognitive-complexity` は規則の既定（15）、`max-depth` は ESLint の既定（4）、`max-params` は 3（オブジェクトの引数にまとめる今の記載方法に合わせる）、`complexity` は 10 にする
  テストの環境変数: 削除する変数は Git が返却する一覧に任せ、名前を列挙しない。削除するのはテストの起動（`vitest.config.ts`）にし、Vitest の呼び出し元を問わず守る
  開発用の処理の配置場所: npm は GitHub の参照から入れるとき、バージョンのタグの中身で `prepare` を実行するため、`tools/eslint/` の依存の導入を `prepare` に配置しない。`tools/eslint/` の依存は `runEslint` が起動で無いときだけ入れる。`tools/eslint/package-lock.json` が変わった取り込みの後は、開発コマンドの取り込み後の追従でもう一度入れる
