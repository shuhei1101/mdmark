id: MOD-472-285
visibility: internal
title: ライブラリ本体 / ファイルツリー / tree.syntax.ts
test_files:
  - tests/unit/src/tree/tree.syntax.test.ts
functions:
  - name: parseTree
    title: 罫線のツリーを読み込む
    container: src/tree/tree.syntax.ts
    kind: 関数
    scope: internal
    summary: 罫線（`├── `・`└── `・`│   `）と ASCII の罫線（`|-- `・`` `-- ``・`|   `）と字下げで記載した行を `TreeNode` の入れ子にする（1 つのツリーで 2 種類の罫線を混ぜてよい）。項目は、前に空白がある最初の `#` で名前と注釈に分け、注釈を `renderNote` で HTML にする。上の行より 2 段以上深い行があれば、その行番号と階層の差を返却する
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身
      - name: renderNote
        type: '(markdown: string) => string'
        required: false
        default: 注釈の文字をエスケープしたものを返却する関数
        description: 注釈の Markdown を HTML にする関数
    returns:
      type: '{ nodes: TreeNode[] } | { line: number; depth: number }'
      description: 読み込めた項目か、読み込めない行
    unit_tests:
      - name: test_parse_tree
        case: 正常
        summary: 入れ子を読み込む
        condition: '`mdmark/`・`├── src/`・`│   └── index.ts`・`└── package.json`'
        mock: なし
        expected: '`[{ name: "mdmark/", children: [{ name: "src/", children: [{ name: "index.ts" }] }, { name: "package.json" }] }]`'
      - name: test_parse_tree_when_too_deep
        case: 異常
        summary: 2 階層深い行を返却する
        condition: 3 行目が上の行より 2 階層深い
        mock: なし
        expected: '`{ line: 3, depth: 2 }`'
      - name: test_parse_tree_when_notes
        case: 正常
        summary: '前に空白がある最初の # で名前と注釈に分ける'
        condition: '`mdmark/`・`├── src/ #ソース`・`│   └── index.ts # 入口 # 中の #`・`├── C#/`・`└── #notes.md` を、`renderNote` に文字を `<em>` で囲む関数を指定して読み込む'
        mock: なし
        expected: '`src/` の `note` が `<em>ソース</em>`、`index.ts` の `note` が `<em>入口 # 中の #</em>`、`C#/` と `#notes.md` がその名前のまま `note` を持たない'
      - name: test_parse_tree_when_ascii
        case: 正常
        summary: ASCII の罫線を今の罫線と同じ階層の数え方で読み込む
        condition: '`src/`・`|-- index.ts`・`` `-- parts/ ``・`    ├── tree.ts`・``    `-- ... ``'
        mock: なし
        expected: '`[{ name: "src/", children: [{ name: "index.ts" }, { name: "parts/", children: [{ name: "tree.ts" }, { name: "..." }] }] }]`'
  - name: buildFileTrees
    title: ファイルツリーにする
    container: src/tree/tree.syntax.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。言語 `tree` のコードブロックを部品『ファイルツリー』にする'
    description: |-
      `tree` がオンなら、言語 `tree` のコードブロックを、注釈を `state.md.renderInline` で描く `parseTree` で読み込み、部品『ファイルツリー』（`source` は末尾の改行を除いたコードブロックの中身）にする。
      直前に `tree` のマーカーがあれば `readTreeOptions` で読み込み、`open` と `wrap` を部品へ指定する。
      罫線を読み込めなければ警告を差し込み、コードブロックのままにする
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[parseTree]'
      - 'MOD-472-213#functions[pushWarning]'
      - MOD-472-269#functions[renderTree]
      - '#functions[readTreeOptions]'
    unit_tests:
      - name: test_build_file_trees
        case: 正常
        summary: 読み込めるツリーを部品にし、読み込めないツリーは警告とコードブロックにする
        condition: 読み込める `tree` のコードブロックと、3 行目が 2 階層深いもの
        mock: なし
        expected: 1 つ目が `<div class="mdmark-tree"` で `data-source` にコードブロックの中身を持ち、2 つ目の前に警告（本文に `3 行目`）と `<pre`
      - name: test_build_file_trees_when_mark
        case: 正常
        summary: マーカーの depth を部品へ指定し、注釈のインラインを描く
        condition: '`<!-- tree: {"depth": 2} -->` の後ろに、`src/ # **ソース**` とその下の `` index.ts # `badge:新規` `` を記載した言語 `tree` のコードブロック'
        mock: なし
        expected: '`<div class="mdmark-tree" data-open="2"` があり、`mdmark-tree-note` に `<strong>ソース</strong>` と `<span class="mdmark-badge">新規</span>` がある。記載の警告と `<!-- tree` が無い'
      - name: test_build_file_trees_when_mark_unreadable
        case: 異常
        summary: 読み込めない depth は警告にして既定の開き方のツリーにする
        condition: '`<!-- tree: {"depth": "deep"} -->` の後ろの読み込める `tree` のコードブロック'
        mock: なし
        expected: ツリーの前に `depth` の記載の警告（`all` と階層の数を記載）があり、`<div class="mdmark-tree"` が `data-open` を持たない
  - name: readTreeOptions
    title: ファイルツリーのマーカーの指定を読み込む
    container: src/tree/tree.syntax.ts
    summary: ファイルツリーのマーカーの設定（`validateMarkOptions` が `"all"` か 1 以上の整数に照らしてある）から `depth` と `wrap` を読み込む
    description: '`depth` を省いたときは `open` を入れず、部品『ファイルツリー』の既定の開き方にする'
    kind: 関数
    scope: internal
    args:
      - name: mark
        type: Mark
        required: true
        description: ファイルツリーのマーカー
    returns:
      type: '{ open?: string; wrap: boolean }'
      description: 開く階層（`all` か階層の数の文字）と、折り返すか
    unit_tests:
      - name: test_read_tree_options
        case: 正常
        summary: all と階層の数を読み込む
        condition: '`<!-- tree: {"depth": "all"} -->` と `<!-- tree: {"depth": 2, "wrap": true} -->` をそれぞれ読み込む'
        mock: なし
        expected: '`open` が `all`・`2`、`wrap` が `false`・`true`'
      - name: test_read_tree_options_when_none
        case: 正常
        summary: depth を省けば開く階層を入れない
        condition: '`<!-- tree -->`'
        mock: なし
        expected: '`open` が無く、`wrap` が `false`'
    status: planned
  - name: countTreeLines
    title: 罫線のフォルダ構成の行を数える
    container: src/tree/tree.syntax.ts
    kind: 関数
    scope: public
    summary: コードブロックの中身を行に分け、`TREE_LINE_PATTERN` に該当する行の数を返却する
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身
    returns:
      type: number
      description: 罫線のフォルダ構成の行の数
    unit_tests:
      - name: test_count_tree_lines
        case: 正常
        summary: 今の罫線と ASCII の罫線と縦線の後ろの罫線を数える
        condition: '`mdmark/`・`├── src/`・`│   └── index.ts`・`└── README.md`・`|-- a`・`` `-- b ``・`|   |-- c`・`tree` コマンドの出力の `│` の後ろが NBSP 2 つと空白 1 つの `│   └── b`'
        mock: なし
        expected: '`7`'
      - name: test_count_tree_lines_when_not_tree
        case: 正常
        summary: 行の途中の罫線と、罫線の後ろに空白の無い行は数えない
        condition: '`a ├── b`・`├──b`・`-- コメント`・`const a = b || c;`'
        mock: なし
        expected: '`0`'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成のファイルツリー]
    status: planned
  - name: buildPlainFileTrees
    title: 言語が tree でない罫線のコードブロックをファイルツリーにする
    container: src/tree/tree.syntax.ts
    kind: 関数
    scope: internal
    summary: コアルール。`code` と `tree` がオンのとき、罫線の行を `PLAIN_TREE_MIN_LINES` 以上持つ言語が `tree` でない `fence` を部品『ファイルツリー』にする
    description: |-
      map の範囲の組み立ての後、コードブロックの飾りの前に配置する（`mdmark_build_plain_file_trees`）。
      残っている `fence` のうち、次の全てに当てはまるものを対象にする。

      - 情報文字列の最初の単語が `PLAIN_TREE_EXCLUDED_LANGUAGES` に無い（`ts:app.ts` は `:` の前の `ts` で照らす）
      - `MAP_SOURCE_META` を持たない
      - `countTreeLines` が `PLAIN_TREE_MIN_LINES` 以上
      - 直前のトークンが `code` のマーカーなら、`readCodeSpec` の `treeWarning` が `true`

      対象を `parseTree` で読み込み、読み込めれば部品『ファイルツリー』（`source` は末尾の改行を除いた中身、`language` は `splitInfoString` の言語）の `ownBlock` に置き換える。
      直前の `code` のマーカーのトークンは削除する（`tree_warning` のほかのキーはファイルツリーに当てない）。
      読み込めなければ、`buildFileTrees` と同じ文言の警告を 1 つだけ前に差し込み、`fence` のまま残す（後の `buildCodeBlocks` が記載した言語のコードブロックにする）
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[countTreeLines]'
      - '#functions[parseTree]'
      - MOD-472-276#functions[readCodeSpec]
      - MOD-472-276#functions[splitInfoString]
      - MOD-472-213#functions[pushWarning]
      - MOD-472-269#functions[renderTree]
    unit_tests:
      - name: test_build_plain_file_trees
        case: 正常
        summary: 罫線の行が 2 行以上の言語 text と言語なしのコードブロックをファイルツリーにする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（罫線のフォルダ構成の言語が tree でないコードブロック）」の文書
        mock: なし
        expected: 1 つ目（言語 `text`）が `data-tree-language="text"`、2 つ目（言語なし）が `data-tree-language=""` の `<div class="mdmark-tree"`。3 つ目（1 行だけ）・4 つ目（`tree_warning` が `false`）は `fence` のまま。罫線の記載の警告と、4 つ目の前の `code` のマーカーの警告が無い
      - name: test_build_plain_file_trees_when_unreadable
        case: 異常
        summary: 罫線を読み込めない行を持つ言語 text のコードブロック
        condition: 3 行目が 2 階層深い言語 `text` の罫線のコードブロック
        mock: なし
        expected: 前に `3 行目` を含む警告が 1 つだけあり、`fence` のまま
      - name: test_build_plain_file_trees_when_excluded
        case: 正常
        summary: mermaid・csv・map の範囲・code がオフの文書はファイルツリーにしない
        condition: '罫線の行を 3 行持つ言語 `mermaid`・`csv` のコードブロックと、`MAP_SOURCE_META` を持つ `fence`、`<!-- features: {"code": false} -->` の文書の言語 `text` のコードブロック'
        mock: なし
        expected: どれも `fence` のままで、前に警告が無い
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成のファイルツリー]
    status: planned
lead: '罫線のツリーの読み取りとファイルツリーのマーカーを受け持ち、ファイルツリーの記法を変えるときに参照する。'
tags:
  - name: topic:ツリー
    main: true
  - name: topic:markdown
  - name: topic:構文
  - name: tool:markdown-it
  - name: action:読み取り
constants:
  - name: TREE_LINE_PATTERN
    title: 罫線のフォルダ構成の行
    container: src/tree/tree.syntax.ts
    summary: 罫線でフォルダ構成を記載した行に該当する正規表現。行頭の空白（タブ・空白・`tree` コマンドが縦線の後ろに出す NBSP の U+00A0）と縦線（`│`・`|`）の後に `├── `・`└── `・`|-- `・`` `-- `` が続く行
    value: /^[\t  │|]*(?:├── |└── |\|-- |`-- )/u
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成のファイルツリー]
    status: planned
  - name: PLAIN_TREE_MIN_LINES
    title: ファイルツリーにする罫線の行の数
    container: src/tree/tree.syntax.ts
    summary: '`TREE_LINE_PATTERN` に該当する行がこの数以上ある言語が `tree` でないコードブロックをファイルツリーにする。1 行だけの罫線は説明の中の例としてコードブロックのまま描く'
    value: '2'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成のファイルツリー]
    status: planned
  - name: PLAIN_TREE_EXCLUDED_LANGUAGES
    title: 罫線をファイルツリーにしない言語
    container: src/tree/tree.syntax.ts
    summary: 罫線の行を持ってもファイルツリーにしないコードブロックの言語（情報文字列の最初の単語）。`mermaid`・`csv`。言語 `tree`・図の部品・埋め込んだ HTML・map の範囲のコードブロックは、先のコアルールが `fence` でなくしているか `MAP_SOURCE_META` を付けているため、ここに並べない
    value: '["mermaid", "csv"]'
    refs:
      - IF-472-34#constraints[罫線のフォルダ構成のファイルツリー]
    status: planned
