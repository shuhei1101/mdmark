        condition: '`process.cwd()` と別の一時フォルダを `projectDir` にし、設定の `build.out` が相対パス'
        mock: なし（一時フォルダ）
        expected: '`json.out` が `{projectDir}/{build.out}` で、そのファイルがある'
      - name: test_run_build_site_when_keep_traces
        case: 正常
