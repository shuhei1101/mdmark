      1. `cwd` を `projectDir`、`distDir` を `context.distDir` にしてまとめる（複数の文書を 1 枚にまとめて結果を返却する）。相対パスの `config` と設定の `build.out` は `projectDir` を基準にする。`keep_traces` は `keepTraces` にして指定する
      2. `out`（絶対パス）・`docs`・`warnings` を返却する
