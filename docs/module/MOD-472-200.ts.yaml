id: MOD-472-200
visibility: internal
title: ライブラリ本体 / 差分 / diff-blocks.ts
test_files:
  - tests/unit/src/parts/diff-blocks.test.ts
functions:
  - name: renderDiffBlock
    title: 差分のブロックを描く
    container: src/parts/diff-blocks.ts
    summary: 部品設計『差分のブロック』の HTML を返却する
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ kind: "add" | "del"; unit: "block" | "item" | "row"; html: string }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`block` は `html` を `div.mdmark-diff-block` で包んだ HTML、`item`・`row` は `html` の `li`・`tr` に class `mdmark-diff-block` を追加した HTML。どれも `data-kind` を持ち、先頭（`row` は 1 つ目のセルの先頭）に見えない `追加:`・`削除:` と `aria-hidden` の `+`・`−` を配置する。`del` は中の要素の `data-source-line` と `id` を削除する'
    unit_tests:
      - name: test_render_diff_block
        case: 正常
        summary: 本文のブロックを包み、記号とスクリーンリーダーの文字を配置する
        condition: 部品設計の状態 `AddParagraph` の引数
        mock: なし
        expected: '`div.mdmark-diff-block[data-kind="add"]` の中に `追加:` と `aria-hidden` の `+` と元の `p` がある'
      - name: test_render_diff_block_when_deleted
        case: 正常
        summary: 削除したブロックから行番号と id を削除する
        condition: 状態 `DelParagraph` の引数に、`id` を持つ見出しを追加した `html`
        mock: なし
        expected: '`data-kind="del"`、`削除:` と `−` を持ち、中に `data-source-line` と `id` が無い'
      - name: test_render_diff_block_when_row
        case: 正常
        summary: 表の行は tr に class を付け、1 つ目のセルに記号を配置する
        condition: 状態 `TableRowDel` の引数
        mock: なし
        expected: 一番外が `tr.mdmark-diff-block[data-kind="del"]` で、包む `div` が無く、1 つ目の `td` の先頭に `削除:` と `−` がある
    refs:
      - CMP-472-43#
    status: planned
    introduced:
      pr: 196
