id: MOD-472-43
visibility: internal
title: ライブラリ本体 / 記法
lead: マーカーと記法を HTML にする markdown-it のコアルール。記法ごとに 1 ファイルで、トークンの並びを書き換え、部品の HTML を差し込む。機能がオフの記法は何もしない。読み込めない指定は記載の警告を差し込み、読み込めた指定で描く。
directory: |-
  ```tree
  src/render/syntax/
  ├── frontmatter.ts  # 文書の先頭のフロントマターの表示を差し込むコアルール
  ├── headings.ts     # 見出しの ID とアンカー
  ├── sections.ts     # セクションの囲み
  ├── tables.ts       # 表の種類・機能・絞り込みと、表の属性・列と行の色・多段の見出しと行見出しとセルの結合
  ├── table-cells.ts  # 表の `^^`・`<<` のセルの結合の計画（トークンを使用しない）
  ├── table-tree.ts   # `tree=` の表の階層の行・型・必須・既定のセルと、`example=` の見本を表の下へ移す処理
  ├── collapse.ts     # 表・タブ・ステップの折り畳みの指定（closed・open・title=）の読み取り
  ├── views.ts        # ビューのマーカーの囲み
  ├── row-details.ts  # 行の詳細
  ├── tabs.ts         # タブと、入れ子のタブの開きと閉じの対応
  ├── steps.ts        # ステップ
  ├── callouts.ts     # 注意書きと、注意書きのタイトル・開閉・入れ子
  ├── footnotes.ts    # 脚注の定義・参照・行内の脚注の読み取りと、末尾の一覧・機能のオフの文字への戻し
  ├── tree.ts         # ファイルツリー
  ├── badges.ts       # バッジとバッジの色
  ├── inline-icons.ts # 行内のアイコン
  ├── kbd.ts          # キー
  ├── highlight.ts    # 蛍光ペン
  ├── layout-columns.ts # 段組み
  ├── card-grid.ts    # カードの格子
  ├── details.ts      # details の範囲
  ├── pagebreak.ts    # 改ページ
  ├── includes.ts     # 取り込みのパスの解き方・取り込む範囲の選び方・トークンの差し込み
  ├── wide.ts         # wide の範囲
  ├── csv.ts          # CSV の読み取りと CSV の表
  ├── text-color.ts   # 本文の文字の色
  ├── images.ts       # 画像の属性の読み取り・動画と音声と GIF の見分け・画像と動画と音声の図
  ├── gallery.ts      # ギャラリー
  ├── cards.ts        # リンクと添付のカード
  ├── figures.ts      # 図表の番号と参照
  ├── toc.ts          # 目次
  ├── html.ts         # 埋め込んだ HTML と、範囲の css・ts・js
  ├── code-blocks.ts  # コードブロックのタイトル・行番号・行の強調とコードの行のマーカー・畳む行・色分けの対象の言語
  ├── warnings.ts     # 記載の警告を差し込む助け
  └── tokens.ts       # 記法のコアルールが共有するトークンの助け（マーカーの読み取り・閉じのマーカーの探索・機能の判定）
  ```
notes:
  コアルールの順: 描画の `createParser` が登録する。マーカー → 機能の重ね合わせ → ページの設定 → 取り込み → 蛍光ペン → 脚注の機能のオン・オフ → カードの格子 → 行内のアイコン → 見出し → 用語集の表 → 行の詳細 → ビュー → CSV の表 → 表 → タブ → ステップ → 注意書き → ファイルツリー → バッジ → キー → 本文の文字の色 → 図の部品 → 埋め込んだ HTML → コードブロック → 表の見本の移動 → 画像の属性と種類 → 図表の番号 → ギャラリー → 画像と動画と音声の図 → カード → 段組み → details の範囲 → wide の範囲 → 改ページ → 用語の下線 → セクション → 目次 → 脚注の一覧 → 関連文書の一覧 → タスクリスト → www の自動リンク → 残ったマーカーを取り除く → 元の行番号 → 脚注の定義の取り出し → 記載の警告を集める。行の詳細は表の囲みより前、セクションは記法の警告を差し込んだ後、目次は見出しの ID を付けた後。埋め込んだ HTML は用語の下線より前に配置し、`html_block` にした中身を用語の下線が重ねて照合しないようにする。画像の属性は図表の番号より前に読み込み、図表の番号がギャラリーに番号を指定してからギャラリーを囲む。残った画像だけの段落は、その後に図にする
  部品の差し込み方: 中身を持つ部品（セクション・タブ・注意書き・行の詳細・図表の番号・表）は、中身の代わりに `SLOT_MARKER` を指定して HTML を作り、`markOwn` を掛けてから `SLOT_MARKER` の前後で分け、開きと閉じの `html_block` のトークンで中身のトークンを挟む。中身の HTML には `markOwn` を掛けない。見出し・表など Markdown から作ったトークンに付ける記法の属性は、同じトークンに `data-mdmark-own` も付ける。埋め込んだ HTML は例外で、`sanitizeEmbedded` で先に落とした中身にも `markOwn` を掛ける
