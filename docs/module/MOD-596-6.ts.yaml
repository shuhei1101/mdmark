id: MOD-596-6
visibility: internal
title: ライブラリ本体 / map / 描画と操作 / c4-view.ts
test_files:
  - tests/unit/src/map/c4-view.browser.test.ts
functions:
  - name: attachMapC4
    title: C4図を付ける
    kind: 関数
    container: src/map/c4-view.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 'C4 の 5 種類の図を読み取って構成図の入力にし、構成図と同じ配置・開閉・中へ入る・選択・案内・強調を付けたうえで、要素の説明・境界の破線と配置先のノードの実線の枠と種類・外部の要素の描き分けと、`C4Dynamic` の関係の再生を追加する'
    scope: public
    callees:
      - MOD-596-3#functions[parseC4]
      - MOD-596-3#functions[c4ToFlowchart]
      - MOD-472-130#functions[attachMapFlow]
      - MOD-472-130#functions[neighborKept]
      - MOD-472-130#functions[shortestPathKept]
      - MOD-472-133#functions[renderMapC4Diagram]
      - MOD-472-139#functions[parseMapData]
    args:
      - name: range
        type: HTMLElement
        required: true
        description: '`div.mdmark-map`（`data-map-kind` が `C4Context`・`C4Container`・`C4Component`・`C4Dynamic`・`C4Deployment`）'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を適用した設定
      - name: options
        type: '{ args: MapArgs; resolveIdLink?: ResolveIdLink }'
        required: true
        description: '`args` は `parseMapArgs` の結果、`resolveIdLink` は `attachMap` の `hooks.resolveIdLink`'
    returns:
      type: MapFlowHandle
      description: 構成図と同じ操作のインターフェース
    process: |-
      1. `parseC4` と `c4ToFlowchart` で `Flowchart` と上書きを作り、`attachMapFlow` に `extension` と `options.resolveIdLink` と一緒に指定する
      2. `extension.title` に `title` の行、`extension.kinds` に `MAP_C4_KINDS`、`extension.overrides` に `c4ToFlowchart` の上書きを指定する
      3. `extension.render` に要素の説明・外部の要素・境界の種類・`reversed` を指定した `renderMapC4Diagram`（配置先のノードは `c4Boundary` が `deployment`、要素は `technology`）を指定する
      4. `extension.selectionOf` で、要素を 1 つ選べば `neighborKept` の関係と相手、2 つ選べば `shortestPathKept` の経路を残す
      5. `extension.collapsedTag` で、閉じた境界と配置先のノードに、中（入れ子の配置先のノードの中を含む）の要素の数の「要素 {数} 件」を返却する
      6. 図が `C4Dynamic` で、`parseMapData` で読み取った補足が `walkthroughs` を持たなければ、線にした関係を番号の順の手順（`title` は「{番号}: {元の要素} → {先の要素}：{ラベル}」で `BiRel` は `↔`、`text` は補足の `r{番号}` の説明、`nodes` は元と先の要素、`edges` はその関係）にして `extension.walkthroughs` に指定し、`bandMode` を `playback`、`bandUnit` を `relation` にする。`walkthroughs` を持つ図とほかの種類の図は、手順を指定しない
      7. `extension.afterRender` で、再生している関係の線のラベルの要素（`.mdmark-diagram-label[data-wire]`）が無ければ（閉じた境界への線にまとめてラベルを描いていない）、描いた線の中ほどにその関係のラベル（`c4ToFlowchart` の線の `label`）を出し、その矩形と重なる `map-dim` のラベルを隠す。手順を止めたら、出したラベルを解除して隠したラベルを戻す
    unit_tests:
      - name: test_attach_map_c4
        case: 正常
        summary: 要素と境界
        condition: モックの `C4`・`C4_DATA` の範囲を、引数なしのマーカーで描く
        mock: なし
        expected: 図の枠のタイトルが `注文のシステムの全体` で、`support` のノードの種類の行が `[External Person]`、`shop` のタイトルが `通販［Software System］`、`company` のタイトルが `自社［Enterprise］`、`stock` のノードが `store` と同じ段の右にあり、`r1` のラベルが `注文する [HTTPS]`
      - name: test_attach_map_c4_when_title
        case: 正常
        summary: マーカーのタイトルを優先する
        condition: マーカーの `title` が `全体`
        mock: なし
        expected: 図の枠のタイトルが `全体`
      - name: test_attach_map_c4_when_up
        case: 正常
        summary: 上向きの関係
        condition: '`Rel_U(a, b)` だけの範囲'
        mock: なし
        expected: '`b` が `a` より上にあり、`r1` の線の終点（矢じり）が `b` の下の辺'
      - name: test_attach_map_c4_when_kinds
        case: 正常
        summary: 4 種類
        condition: モックの `CONTAINER`・`COMPONENT`・`DYNAMIC`・`DEPLOYMENT` の範囲を、引数なしのマーカーで描く
        mock: なし
        expected: '`api` の種類の行が `[Container: Node.js]`、`shop` のタイトルが `注文のシステム［Container］`、動的図の `r3` のラベルが `3: 注文を保存する [SQL]`、配置図の `cloud` のグループが `.map-c4-deployment` を持ち、`app` が `dbnode` の左にある'
      - name: test_attach_map_c4_when_deployment_collapsed
        case: 正常
        summary: 配置先のノードを閉じる
        condition: 配置図の `region` の開閉のボタンを押す
        mock: なし
        expected: '`region` の閉じたノードの名前の下の行が `要素 2 件` で、`cloud` は開いたまま'
      - name: test_attach_map_c4_when_dynamic_played
        case: 正常
        summary: C4Dynamic の関係の再生
        condition: モック `docs/mock/refs/677/assets/c4-dynamic-play.js` の `DYNAMIC` と、`notes` のキーを `r2` にした `DYNAMIC_DATA` の範囲を描き、帯の手順のバーの 2 つ目の区切りを押す
        mock: なし
        expected: '帯の `data-mode` が `playback` で、区切りが 5 つ、左右の矢印のボタンの名前が `前の関係`・`次の関係`。帯のタイトルが `2: 注文の画面 → 注文の API：注文を送る`、文が `画面の入力を JSON にして API へ送る`。`web`・`api` のノードと `r2` の線のほかが `map-dim` を持ち、`r3` の線も `map-dim` を持つ。`r2` の線の上にだけ `.map-packet` がある'
      - name: test_attach_map_c4_when_dynamic_boundary
        case: 正常
        summary: 閉じた境界の中の要素への関係
        condition: test_attach_map_c4_when_dynamic_played と同じ範囲を描き、4 つ目の区切りを押す
        mock: なし
        expected: '閉じた `store` のノードと `api` のノードが `map-dim` を持たず、`api->store` の線のラベルの要素の文字が `4: ` で始まる。手順を止めると、そのラベルの要素が無くなる'
      - name: test_attach_map_c4_when_dynamic_both
        case: 正常
        summary: 両向きの関係
        condition: test_attach_map_c4_when_dynamic_played と同じ範囲を描き、5 つ目の区切りを押す
        mock: なし
        expected: '帯のタイトルが `5: 注文の画面 ↔ 顧客：結果を確かめる` で、`r5` の線の `.map-packet` が両方へ流れる印を持つ'
      - name: test_attach_map_c4_when_dynamic_walkthroughs
        case: 正常
        summary: 案内の手順を持つ C4Dynamic
        condition: 同じモックの `DYNAMIC` と `DYNAMIC_WALK_DATA` の範囲を描く
        mock: なし
        expected: 帯の `data-mode` が `walkthrough` で、区切りが 2 つ
      - name: test_attach_map_c4_when_container_no_playback
        case: 正常
        summary: ほかの種類の図は再生しない
        condition: モック `docs/mock/refs/660/assets/samples.js` の `CONTAINER` と `CONTAINER_DATA` の範囲を描く
        mock: なし
        expected: 帯の `data-mode` が `playback` でない
