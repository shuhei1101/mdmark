id: MOD-472-102
visibility: internal
title: VS Code 拡張機能 / 書き出し / embed.ts
test_files:
  - tests/unit/vscode/src/export/embed.test.ts
functions:
  - name: embedLocalLibraries
    title: 相対パスのライブラリを埋める
    kind: 関数
    container: vscode/src/export/embed.ts
    usecase: HTMLに書き出す
    summary: '`http:`・`https:` でない `libraries` の値のうちライブラリ本体の `usedLibraryMarks` が返却する名前と、ライブラリ本体の `collectRangeScripts` が 1 件以上返すときの `html-scripts.url` と、ライブラリ本体の `usesMermaid` が `true` を返却するときの `mermaid.url` を `bundle` でまとめ、`moduleDataUrl` の URL に替えて返却する'
    description: 取得しなかった・まとめられなかった相対パスの `libraries` の値は返却する `libraries` から除外し、`html-scripts.url` は返却する `htmlScripts` から、`mermaid.url` は返却する `mermaid` から `url` を削除する（`url` を削除した mermaid のコードブロックは、開いたときに既定の jsDelivr の URL から読み込む）。`bundle` は mermaid が中で読み込む chunk の動的 `import()` を同じモジュールに取り込む。`http:`・`https:` の値と文字列でない値はそのまま返却する。同じパスは 1 回だけまとめる
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ markdown: string; libraries: Record<string, unknown> | undefined; htmlScripts: Record<string, unknown> | undefined; mermaid: Record<string, unknown> | undefined; config: MdmarkConfig; bundle: (paths: string[]) => Promise<Array<{ path: string; code: string } | { path: string; error: string }>> }'
        required: true
        description: 書き出す全文・重ねた設定の `libraries`・`html-scripts`・`mermaid`（相対パスは設定を重ねる処理が絶対パスにした値）・`collectRangeScripts` に指定する重ねた設定・絶対パスを ES モジュールにまとめる関数（拡張機能では `bundleExtensions`）
    returns:
      type: 'Promise<{ libraries: Record<string, unknown> | undefined; htmlScripts: Record<string, unknown> | undefined; mermaid: Record<string, unknown> | undefined; failures: Array<{ path: string; error: string }> }>'
      description: 埋めた値に替えた `libraries`・`html-scripts`・`mermaid` と、まとめられなかったパスと誤り
    unit_tests:
      - name: test_embed_local_libraries
        case: 正常
        summary: 'マーカーがある相対パスのライブラリと変換のライブラリだけを data: の URL に替える'
        condition: '`libraries` が `test-lib: /ws/libs/test.js`・`unused-lib: /ws/libs/unused.js`・`cdn-lib: https://example.com/a.js`、`html-scripts.url` が `/ws/libs/babel.js`、文書は `test-lib`・`cdn-lib` のマーカーと `ts` の範囲を持ち `config.features` が `{ "html-scripts": true }`'
        mock: '`bundle` はパスごとに `export default "{パス}"` を返却し、指定されたパスを記録する'
        expected: '`libraries` が `test-lib`（`moduleDataUrl` の値）と `cdn-lib`（そのまま）だけを持ち、`htmlScripts.url` が `moduleDataUrl` の値。`bundle` に渡ったパスが `/ws/libs/test.js` と `/ws/libs/babel.js` だけで、`failures` が空'
      - name: test_embed_local_libraries_when_bundle_fails
        case: 異常
        summary: まとめられないものは削除して誤りを返却し、範囲が無ければ変換のライブラリをまとめない
        condition: '`test-lib` のマーカーを持ち範囲を持たない文書、`html-scripts.url` が絶対パス'
        mock: '`bundle` は `/ws/libs/test.js` に `{ path, error: "読み込めない" }` を返却する'
        expected: '`libraries` に `test-lib` が無く、`htmlScripts` が `url` を持たず、`failures` が `/ws/libs/test.js` と誤りの 1 件。`bundle` に `html-scripts.url` のパスが渡らない'
        exception: まとめられない
      - name: test_embed_local_libraries_when_mermaid
        case: 正常
        summary: mermaid のコードブロックがある文書のときだけ、相対パスの mermaid.url を data の URL に替える
        condition: '`mermaid` が `{ url: "/ws/libs/mermaid.mjs", theme: "neutral" }`。文書が `mermaid` のコードブロックを持つときと持たないとき'
        mock: '`bundle` はパスごとに `export default "{パス}"` を返却し、指定されたパスを記録する'
        expected: '前者の `mermaid` が `{ url: moduleDataUrl の値, theme: "neutral" }` で、`bundle` に `/ws/libs/mermaid.mjs` が渡る。後者は `bundle` に渡らず、`mermaid` が指定した値のまま'
    callees:
      - 'MOD-472-100#functions[moduleDataUrl]'
      - MOD-472-118#functions[usedLibraryMarks]
      - MOD-472-118#functions[collectRangeScripts]
      - MOD-472-118#functions[usesMermaid]
    refs:
      - IF-472-15#constraints[埋めるライブラリ]
      - IF-472-15#constraints[設定と相対パス]
    status: planned
  - name: embedLocalSyntax
    title: 相対パスの色分けのライブラリを埋める
    kind: 関数
    container: vscode/src/export/embed.ts
    usecase: HTMLに書き出す
    summary: 相対パスの `syntax.url` のフォルダの `core.min.js` と、ライブラリ本体の `usedSyntaxLanguages` が返却する言語の `languages/{言語}.min.js` を `bundle` でまとめ、import map の `imports`（フォルダの `file:` の URL に続くパス → `moduleDataUrl` の URL）と、`url` をフォルダの `file:` の URL に替えた `syntax` を返却する
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ markdown: string; syntax: Record<string, unknown> | undefined; config: MdmarkConfig; bundle: BundleModules }'
        required: true
        description: 書き出す全文・重ねた設定の `syntax`（相対パスは設定を重ねる処理が絶対パスにした値）・`usedSyntaxLanguages` に指定する重ねた設定・絶対パスを ES モジュールにまとめる関数（拡張機能では `bundleExtensions`）
    returns:
      type: 'Promise<{ syntax: Record<string, unknown> | undefined; imports: Record<string, string>; failures: Array<{ path: string; error: string }> }>'
      description: 埋めた値に替えた `syntax`、import map の `imports`、まとめられなかったパスと誤り
    process: |-
      1. `syntax` が無いか、`syntax.url` が文字列でないか `http:`・`https:` の URL の場合、`syntax` をそのまま、`imports` を空で返却する
      2. 使用する言語を求める（`usedSyntaxLanguages`。`markdowns` は `[markdown]`）
         - 無い場合、`url` を削除した `syntax`（ほかのキーが無ければ `undefined`）を、`imports` を空で返却する
      3. `url` のフォルダの `file:` の URL（`pathToFileURL`。末尾に `/`）を作る
      4. `{url}/core.min.js` と `{url}/languages/{言語}.min.js` を `bundle` でまとめる
      5. まとめられたモジュールごとに、`{フォルダの file: の URL}{core.min.js か languages/{言語}.min.js}` から `moduleDataUrl` の URL を参照する行を `imports` に入れ、まとめられないパスを `failures` に入れる
      6. `url` をフォルダの `file:` の URL に替えた `syntax` を返却する
    unit_tests:
      - name: test_embed_local_syntax
        case: 正常
        summary: 文書が使用する言語と本体だけをまとめ、import map で割り当てる
        condition: '`syntax` が `{ url: "/ws/hljs" }`、文書は `ts` のコードブロックを 1 つ持つ'
        mock: '`bundle` はパスごとに `export default "{パス}"` を返却し、指定されたパスを記録する'
        expected: '`syntax` が `{ url: "file:///ws/hljs/" }`、`imports` が `file:///ws/hljs/core.min.js` と `file:///ws/hljs/languages/typescript.min.js` の 2 つのキーだけを持ち、値が `moduleDataUrl` の値。`bundle` に渡ったパスが `/ws/hljs/core.min.js` と `/ws/hljs/languages/typescript.min.js` だけで、`failures` が空'
      - name: test_embed_local_syntax_when_not_local
        case: 正常
        summary: http・https の url と syntax が無いときはそのまま返却する
        condition: '`syntax` が `{ url: "https://cdn.example.com/es/" }` のときと `undefined` のとき。文書は `ts` のコードブロックを持つ'
        mock: '`test_embed_local_syntax` と同じ'
        expected: '`syntax` が指定した値のまま、`imports` が空で、`bundle` に渡らない'
      - name: test_embed_local_syntax_when_unused
        case: 正常
        summary: 色分けの対象が無い文書では url を削除してまとめない
        condition: '`syntax` が `{ url: "/ws/hljs" }`、文書はコードブロックを持たない'
        mock: '`test_embed_local_syntax` と同じ'
        expected: '`syntax` が `undefined`、`imports` が空で、`bundle` に渡らない'
      - name: test_embed_local_syntax_when_bundle_fails
        case: 異常
        summary: まとめられないモジュールは割り当てず誤りを返却する
        condition: '`test_embed_local_syntax` と同じ入力'
        mock: '`bundle` は `/ws/hljs/languages/typescript.min.js` に `{ path, error: "読み込めない" }` を返却する'
        expected: '`imports` が `file:///ws/hljs/core.min.js` だけを持ち、`failures` が `/ws/hljs/languages/typescript.min.js` と誤りの 1 件'
        exception: まとめられない
    callees:
      - MOD-472-100#functions[moduleDataUrl]
      - MOD-472-118#functions[usedSyntaxLanguages]
    refs:
      - IF-472-15#constraints[埋める色分けのライブラリ]
    status: planned
    introduced:
      pr: 484
