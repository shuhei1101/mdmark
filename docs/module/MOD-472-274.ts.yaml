id: MOD-472-274
visibility: internal
title: ライブラリ本体 / 記法 / footnotes.ts
test_files:
  - tests/unit/src/render/syntax/footnotes.test.ts
data_models:
  - name: FootnoteState
    title: 脚注の状態
    container: src/render/syntax/footnotes.ts
    summary: 1 回の解析で読み込んだ脚注の定義と参照。`RenderEnv` の `mdmarkFootnotes` に入れ、描くごとに再作成する
    properties:
      - name: definitions
        type: Map<string, Token[] | null>
        description: 正規化したラベルごとの定義のブロックのトークン。block の工程でキーだけを `null` で入れ、`collectFootnotes` が最初の定義のトークンを入れる
      - name: notes
        type: 'Array<{ key: string | null; inline: Token[] | null; refCount: number }>'
        description: 参照した順の脚注。位置 + 1 が番号。行内の脚注は `collectFootnotes` が定義の囲みにするまで `key` が `null` で `inline` に中身のトークンを持つ
      - name: numbers
        type: Map<string, number>
        description: ラベルごとの `notes` の位置
functions:
  - name: useFootnotes
    title: 脚注のルールを登録する
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: 解析器に、block の `mdmark_footnote_def`（`reference` の前。`alt` は `paragraph`・`reference`）、inline の `mdmark_footnote_inline`（`image` の後）と `mdmark_footnote_ref`（その後。`link` より後なので `[^x](url)` はリンクを優先する）を登録し、`mdmark_footnote_ref`（番号とツールチップ）と `mdmark_footnote_list`（末尾の一覧）のトークンの描き方を `renderer.rules` に配置する。どちらも全てのコアルールの後に、`footnoteBodies` で描いた中身の外にだけ `markOwn` を掛けて描く。コアルールの `collectFootnotes`（文書の機能の後）・`buildFootnoteList`（関連文書の一覧の前）・`takeFootnoteDefinitions`（最後）は `createParser` が登録する
    args:
      - name: parser
        type: MarkdownIt
        required: true
        description: '`createParser` が作った解析器'
    side_effects: 解析器のルールと `renderer.rules` に追加する
    callees:
      - '#functions[readFootnoteDefinition]'
      - '#functions[readFootnoteReference]'
      - '#functions[readInlineFootnote]'
      - '#functions[footnoteBodies]'
      - MOD-472-333#functions[renderFootnoteRef]
      - MOD-472-311#functions[markOwn]
    unit_tests:
      - name: test_use_footnotes
        case: 正常
        summary: 参照・定義・行内の脚注を番号とツールチップにする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（脚注）」の文書
        mock: なし
        expected: '`mdmark-fnref-1-0`・`mdmark-fnref-2-0` の番号があり、脚注 1 のツールチップが `role="group"`、脚注 2 が `role="tooltip"` で、`[^`・`^[` が残らない'
      - name: test_use_footnotes_when_link_label
        case: 正常
        summary: リンクと重なる参照はリンクを優先する
        condition: '`[^x](https://example.com)` と定義 `[^x]: 補足`'
        mock: なし
        expected: 文字 `^x` の `https://example.com` へのリンクで、番号と一覧が無い
  - name: readFootnoteDefinition
    title: 脚注の定義を読み込む
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: 'block のルール。行頭（字下げ 3 まで）の `[^ラベル]:`（ラベルは空白を含まない。`normalizeReference` で正規化する）を読み込み、`:` の後ろから字下げ 4 で続く行までを `blkIndent` を 4 増やして `state.md.block.tokenize` で解析し、`mdmark_footnote_def_open`（`meta.key`・`meta.first`・`meta.source`）と `mdmark_footnote_def_close` で囲む。最初に出たラベルだけ `FootnoteState.definitions` にキーを入れる。書き換えた `bMarks`・`tShift`・`sCount`・`blkIndent`・`parentType` は戻す。`meta.source` は行頭の `[^ラベル]: ` の文字（機能のオフで記載した文字に戻すため）'
    args:
      - name: state
        type: StateBlock
        required: true
        description: markdown-it の状態
      - name: startLine
        type: number
        required: true
        description: 読み込み始める行
      - name: endLine
        type: number
        required: true
        description: 読み込める最後の行
      - name: silent
        type: boolean
        required: true
        description: 該当するかだけを返却するか
    returns:
      type: boolean
      description: 定義として読み込んだか
    side_effects: '`state.tokens` に追加し、`env.mdmarkFootnotes` を作る'
    unit_tests:
      - name: test_read_footnote_definition
        case: 正常
        summary: 字下げ 4 で続く段落を定義に含める
        condition: '`[^long]: 1 段落目` 、空行、`    2 段落目`、空行、`終わり` と、本文の `[^long]`'
        mock: なし
        expected: 脚注 1 の中身が 2 つの段落で、`終わり` は本文の段落
      - name: test_read_footnote_definition_when_case_and_duplicate
        case: 正常
        summary: 大文字小文字を区別せず、最初の定義を採る
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（脚注の照合）」の文書
        mock: なし
        expected: '`[^Note]`・`[^note]` が脚注 1、中身が `1 つ目`、`2 つ目` と `使用しない` が出力に無い'
      - name: test_read_footnote_definition_when_indented_code
        case: 正常
        summary: 字下げ 4 以上の `[^x]:` は定義にしない
        condition: '`    [^x]: コード` の行だけの文書'
        mock: なし
        expected: コードブロックになり、脚注の一覧が無い
  - name: readFootnoteReference
    title: 脚注の参照を読み込む
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: inline のルール。`[^ラベル]` のラベルを正規化し、`FootnoteState.definitions` にあるときだけ `mdmark_footnote_ref` のトークン（`meta.id`・`meta.refIndex`・`meta.source`）にする。初めてのラベルは `notes` の末尾に追加して番号を振り、同じラベルは同じ番号で `refCount` を増やす。定義の無いラベルは当てず、記載した文字のまま残す
    args:
      - name: state
        type: StateInline
        required: true
        description: markdown-it の状態
      - name: silent
        type: boolean
        required: true
        description: 該当するかだけを返却するか
    returns:
      type: boolean
      description: 参照として読み込んだか
    side_effects: '`state.tokens` と `env.mdmarkFootnotes` に追加する'
    unit_tests:
      - name: test_read_footnote_reference_when_missing
        case: 正常
        summary: 定義の無い参照は文字のまま
        condition: '`定義の無い参照[^missing]。`'
        mock: なし
        expected: '`[^missing]` が文字で残り、脚注の一覧が無い'
      - name: test_read_footnote_reference_when_twice
        case: 正常
        summary: 同じラベルの 2 回目は同じ番号で通し番号を増やす
        condition: '2 つの段落の `[^note]` と定義 `[^note]: 共通の補足`'
        mock: なし
        expected: '`mdmark-fnref-1-0` と `mdmark-fnref-1-1` があり、一覧の項目は 1 つで戻るリンクが 2 つ'
  - name: readInlineFootnote
    title: 行内の脚注を読み込む
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: inline のルール。`^[中身]` を `md.helpers.parseLinkLabel` で閉じまで読み込み、中身を `md.inline.parse` したトークンを `notes` に追加して番号を振り、`mdmark_footnote_ref` のトークン（`meta.source` は `^[中身]`）にする
    args:
      - name: state
        type: StateInline
        required: true
        description: markdown-it の状態
      - name: silent
        type: boolean
        required: true
        description: 該当するかだけを返却するか
    returns:
      type: boolean
      description: 行内の脚注として読み込んだか
    side_effects: '`state.tokens` と `env.mdmarkFootnotes` に追加する'
    unit_tests:
      - name: test_read_inline_footnote
        case: 正常
        summary: 行内の脚注に参照の順で番号を振る
        condition: '`先[^a] と ^[行内の *補足*]` と定義 `[^a]: A`'
        mock: なし
        expected: '`[^a]` が 1、行内の脚注が 2 で、脚注 2 の中身が `行内の <em>補足</em>`'
  - name: collectFootnotes
    title: 脚注の定義を集める
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: コアルール（文書の機能 `resolveDocumentFeatures` の直後、見出し `assignHeadingIds` の前）。`env.features.footnotes` で脚注の機能を判定し、マーカーは読み込まない。オンなら、定義は本文に残したまま後のコアルールを本文と同じく経由し、行内の脚注の中身を 1 段落の定義の囲み（キーは制御文字で始める `\u0000inline:{位置}`）にして文書の末尾に追加し、脚注の `key` をそのキーにする。オフなら、`mdmark_footnote_ref` を `meta.source` の `text` のトークンに戻し、定義の囲みを削除して最初の段落の頭に `meta.source` を戻し、記載した位置に残し、`env.mdmarkFootnotes` を削除する
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` と `env.mdmarkFootnotes` を書き換える'
    unit_tests:
      - name: test_collect_footnotes_when_disabled_by_mark
        case: 正常
        summary: 文書のマーカーで削除すると記載した文字のまま記載した位置に残す
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（脚注の機能を解除する）」の文書
        mock: なし
        expected: '`[^src]`・`^[補足]` が文字のままでリンクでなく、`<p>[^src]: 出典の説明</p>` が `終わり` の前にあり、`mdmark-fn-` の要素が無い'
      - name: test_collect_footnotes_when_disabled_by_config
        case: 正常
        summary: 設定で削除した脚注も文字のままにする
        condition: '`features.footnotes: false` と、マーカーの無い脚注の文書'
        mock: なし
        expected: 参照と定義が文字のまま
      - name: test_collect_footnotes_when_mark_in_code
        case: 正常
        summary: コードブロックの中のマーカーは数えない
        condition: '`md` のコードブロックの中に `<!-- features: -footnotes -->` を持ち、本文に脚注を持つ文書'
        mock: なし
        expected: 脚注が番号になる
      - name: test_collect_footnotes_when_terms
        case: 正常
        summary: 脚注の中身には用語の下線を付けない
        condition: '用語 `ワークスペース` を持つ索引と、定義 `[^1]: ワークスペースの説明` を持つ文書'
        mock: なし
        expected: ツールチップと一覧の中の `ワークスペース` に `mdmark-term` が無い
  - name: footnoteBodies
    title: 脚注の中身を段落ごとに描く
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: 脚注 1 つの中身を、部品『脚注の番号』のツールチップに入れる段落ごとの行内の HTML（`p` を削除したもの）と、一覧に入れるブロックの HTML にして返却する。段落の `inline` は `renderer.renderInline`、段落でないブロックは描いた HTML から要素を除いた文字を 1 段落にする。中身は `takeFootnoteDefinitions` が記録した定義のトークン（行内の脚注も同じ）
    args:
      - name: options
        type: '{ md: MarkdownIt; env: RenderEnv; note: FootnoteState["notes"][number] }'
        required: true
        description: 解析器・解析の環境・脚注 1 つ
    returns:
      type: '{ bodies: string[]; html: string }'
      description: ツールチップの段落と一覧の HTML
    callees:
      - MOD-472-313#functions[escapeHtml]
    unit_tests:
      - name: test_footnote_bodies_when_list
        case: 正常
        summary: 段落でないブロックは文字の段落にする
        condition: 定義が 1 段落と字下げ 4 のリスト `- a` `- b` を持つ脚注
        mock: なし
        expected: '`bodies` が 2 つで、`<p>` と `<ul>` を含まず、2 つ目に `a` と `b` の文字がある。`html` は `<p>` と `<ul>` を持つ'
  - name: buildFootnoteList
    title: 脚注の一覧を配置する
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: コアルール（セクション・目次の後、関連文書の一覧の前）。`env.mdmarkFootnotes` の `notes` が 1 つ以上あれば、`mdmark_footnote_list` のトークンを末尾に追加する（セクションの外に配置され、関連文書の一覧はその後ろに追加される）。中身は描くときに、部品『脚注の一覧』に中身を差し込みインターフェース（`SLOT_MARKER`。最後の段落の閉じの前後）で指定して描く
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` に追加する'
    callees:
      - '#functions[footnoteBodies]'
      - MOD-472-333#functions[renderFootnotes]
      - MOD-472-311#functions[markOwn]
    unit_tests:
      - name: test_build_footnote_list
        case: 正常
        summary: 本文のセクションの後ろ・関連文書の一覧の前に閉じた一覧を配置する
        condition: '`## セクション` の段落に `[^1]`、定義 `[^1]: 補足`、参照の表で被参照を持つ文書'
        mock: なし
        expected: '`details.mdmark-footnotes` が `section` の外、`nav.mdmark-backlinks` の前にあり、`summary` が `脚注（1 件）`。`data-mdmark-own` は sanitize の後に残らず、`id`・`href` が残る'
  - name: takeFootnoteDefinitions
    title: 脚注の定義を取り出す
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: コアルール（全てのコアルールの後）。本文と同じコアルールを経由した `mdmark_footnote_def_open`〜`close` を本文から取り除き、`meta.first` の定義の中身だけを `definitions` に入れる
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` と `env.mdmarkFootnotes.definitions` を書き換える'
    unit_tests:
      - name: test_take_footnote_definitions_when_syntax
        case: 正常
        summary: 定義と行内の脚注の中身にも、本文と同じ記法とリンクの扱いを適用する
        condition: 本文・定義・行内の脚注のそれぞれに `README.md`・`example.com`・バッジ `badge:新規` を持つ文書
        mock: なし
        expected: 本文・ツールチップ・一覧のどれでも `README.md` がリンクにならず、バッジが `span.mdmark-badge` になる
      - name: test_take_footnote_definitions_when_heading
        case: 正常
        summary: 定義の中の見出しでセクションを作らず ID を振らず、一覧はセクションの外に配置する
        condition: '`<!-- toc -->` と `## セクション` の段落に `[^a]` と、定義 `[^a]: 補足` と字下げ 4 の `### 定義の見出し`'
        mock: なし
        expected: '`div.mdmark-section-body` が 1 つだけで、一覧がその後ろにあり、一覧の項目に `定義の見出し` があり、`id="定義の見出し"` が無く、`nav.mdmark-toc` に `定義の見出し` が無い'
  - name: outsideFootnoteDefinitions
    title: 脚注の定義の外のトークンを返却する
    container: src/render/syntax/footnotes.ts
    kind: 関数
    scope: internal
    summary: '`mdmark_footnote_def_open`〜`close` の囲みを除いたトークンの並びを返却する（用語の下線を脚注の中身に付けないために `termsRule` が、定義の中の見出しに ID を振らないために `assignHeadingIds` が使用する）'
    args:
      - name: tokens
        type: Token[]
        required: true
        description: トークンの並び
    returns:
      type: Token[]
      description: 定義の囲みの外のトークン（同じトークンを指す）
