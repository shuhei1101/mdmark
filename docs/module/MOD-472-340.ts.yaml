id: MOD-472-340
visibility: internal
title: ライブラリ本体 / 部品の描画 / storybook-render.ts
test_files:
  - tests/unit/scripts/storybook-render.test.ts
constants:
  - name: RENDER_HOST
    title: 描画のインターフェースの待受アドレス
    container: scripts/storybook-render.ts
    summary: 描画のインターフェースを外へ出さないための待受アドレス
    value: '"127.0.0.1"'
functions:
  - name: renderPart
    title: 部品の HTML を返却する
    container: scripts/storybook-render.ts
    kind: 関数
    scope: internal
    summary: ストーリーの `server.id` の部品を、問い合わせの引数で描き、描く先の要素（class `mdmark`）で包んで返却する
    description: '部品の id から部品の関数を参照する表（`notice`・`embed`・`syntax-warning`・`table`・`callout`・`tabs`・`steps`・`tree`・`badge`・`footnote-ref`・`footnotes`・`toc`・`section`・`row-detail`・`figure`・`doc-list`・`text-color`・`image-figure`・`gallery`・`lightbox`・`media`・`gif`・`card`と、VS Code 拡張機能の `media-error`）で描く。ストーリーの引数は問い合わせの文字列で届くため戻す: `notice` の `figure` は `"false"` のときだけ `false`。それ以外の部品（`embed` の `options` を含む）は、JSON として読み込める値（配列・オブジェクト・数・真偽値）は JSON として読み込み、読み込めなければ文字列のまま指定する。`code-block` の `highlight` が `true` のときは、npm の `highlight.js/lib/core` に `language` の言語（`syntaxLanguageOf` で参照した `highlight.js/lib/languages/{モジュール名}`）を登録し、`highlightLines` の行ごとの HTML で、部品の HTML の `mdmark-code-text` の中身（行に分けないときは `code` の中身）を順に置き換える。中身を持つ部品には部品ごとの見本の HTML を中身として指定する（ストーリーの引数 `body` があれば、見本の代わりにそれを指定する）。ストーリーの引数 `scheme` が `dark` のときは描く先の要素に class `mdmark-theme-dark` を加え、`frameWidth` があるときは部品の HTML をその幅の `div` で包む（`max-width: 100%` を付け、描く先の要素の幅を超えない）。`comment-button`・`comment-form`・`comment-bubble` は、`document.body` に `position: fixed` で配置する部品を描く先の要素の中に描くため、部品の HTML の前に `.mdmark-comment-add,.mdmark-comment-popover{position:static;max-width:100%}` の `style` を付ける（`max-width` は、描く先の要素の `padding` の内側に枠の幅を収める）。画像・動画・音声の部品の `src` と `poster` に記載した見本のファイル名は、`docs/mock/refs/263/assets/media/` のファイルを読み込んだ `data:` URL にする（見本に無い名前はそのまま指定する）。`mermaid-diagram` の `svg`・`printSvg` に記載した名前は `tests/fixtures/mermaid-svg/{名前}.svg` の中身にし（無い名前は 404 と同じく返却しない）、`renderMermaidDiagram` の HTML を `renderDiagramFrame`（`kind: "mermaid"`・ストーリーの引数 `title`・`legend: []`・`fitMin: 0.75`）で包む'
    args:
      - name: options
        type: '{ component: string; params: URLSearchParams }'
        required: true
        description: '`component` は部品の id、`params` は問い合わせの引数'
    returns:
      type: string | undefined
      description: '`<div class="mdmark">{部品の HTML}</div>`。知らない部品は `undefined`'
    callees:
      - MOD-472-310#functions[renderNotice]
      - MOD-472-309#functions[renderEmbed]
      - MOD-472-314#functions[renderSyntaxWarning]
      - MOD-472-315#functions[renderTable]
      - MOD-472-275#functions[renderCallout]
      - MOD-472-316#functions[renderTabs]
      - MOD-472-317#functions[renderSteps]
      - MOD-472-269#functions[renderTree]
      - MOD-472-318#functions[renderBadge]
      - MOD-472-319#functions[renderToc]
      - MOD-472-320#functions[renderSection]
      - MOD-472-321#functions[renderRowDetail]
      - MOD-472-322#functions[renderFigure]
      - MOD-472-323#functions[renderDocList]
      - MOD-472-326#functions[renderTextColor]
      - MOD-472-327#functions[renderImageFigure]
      - MOD-472-328#functions[renderGallery]
      - MOD-472-329#functions[renderLightbox]
      - MOD-472-330#functions[renderMedia]
      - MOD-472-331#functions[renderGif]
      - MOD-472-332#functions[renderCard]
      - MOD-472-71#functions[renderMediaError]
      - MOD-472-209#functions[highlightLines]
      - MOD-472-333#functions[renderFootnoteRef]
      - MOD-472-333#functions[renderFootnotes]
      - MOD-472-145#functions[renderMermaidDiagram]
    unit_tests:
      - name: test_render_part_when_notice
        case: 正常
        summary: 通知ブロックを引数どおりに描く
        condition: '`component` が `notice`、`params` が `name=tabs&figure=false`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderNotice({ name: "tabs", figure: false })`'
      - name: test_render_part_when_embed
        case: 正常
        summary: JSON の引数を戻して読み込み中のブロックを描く
        condition: '`component` が `embed`、`params` が `name=chart&options={"items":["a","b"]}`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderEmbed({ name: "chart", options: { items: ["a", "b"] } })`'
      - name: test_render_part_when_unknown
        case: 正常
        summary: 知らない部品は返却しない
        condition: '`component` が `missing`'
        mock: なし
        expected: '`undefined`'
      - name: test_render_part_when_json_args
        case: 正常
        summary: JSON の引数を戻して表を描く
        condition: '`component` が `table`、`params` の `features` が `["sort"]`、`columns` が `["A"]`、`rows` が `[["1"]]`、`sort` が `{"column":0,"direction":"ascending"}`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderTable({ features: ["sort"], columns: ["A"], rows: [["1"]], sort: { column: 0, direction: "ascending" } })`'
      - name: test_render_part_when_doc_list
        case: 正常
        summary: JSON の引数を戻して文書の一覧を描く
        condition: '`component` が `doc-list`、`params` の `docs` が `[{"path":"README.md","title":"入口"},{"path":"使い方/guide.md","title":"使用方法"}]`、`current` が `使い方/guide.md`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderDocList({ docs, current: "使い方/guide.md" })`'
      - name: test_render_part_when_vscode_part
        case: 正常
        summary: 拡張機能の再生できない動画・音声の通知を引数どおりに描く
        condition: '`component` が `media-error`、`params` が `kind=video&format=webm&path=media/demo.webm`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderMediaError({ kind: "video", format: "webm", path: "media/demo.webm" })`'
      - name: test_render_part_when_code_block_highlighted
        case: 正常
        summary: '`highlight` が `true` のコードブロックを色分けして返却する'
        condition: '`component` が `code-block`、`params` が `language=ts&title=&lineNumbers=true&highlight=true&lines=[{"text":"const a = 1;"},{"text":"// b"}]`'
        mock: なし
        expected: 2 つの `mdmark-code-text` の中に `hljs-keyword` と `hljs-comment` の `span` があり、タグを削除した文字が元の行と同じ
      - name: test_render_part_when_comment_popover
        case: 正常
        summary: コメントの吹き出しを、描く先の要素の内側に収める `style` を付けて描く
        condition: '`component` が `comment-bubble`、`params` が `quote=テーマの変数&bodies=["本文"]`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ、`<style>.mdmark-comment-add,.mdmark-comment-popover{position:static;max-width:100%}</style>` に続く `renderCommentBubble({ quote: "テーマの変数", bodies: ["本文"] })`'
      - name: test_render_part_when_mermaid_diagram
        case: 正常
        summary: 見本の SVG のファイルを読み込み、図の枠で包んで描く
        condition: '`component` が `mermaid-diagram`、`params` が `svg=flowchart&title=問い合わせの受付`。もう 1 つは `svg=missing`'
        mock: なし
        expected: '前者が `figure.mdmark-diagram[data-diagram="mermaid"]` の中に `tests/fixtures/mermaid-svg/flowchart.svg` の `svg` を持つ HTML。後者は `undefined`'
      - name: test_render_part_when_frame_width
        case: 正常
        summary: '`frameWidth` の幅の枠を、描く先の要素の幅で頭打ちにして包む'
        condition: '`component` が `badge`、`params` が `label=v1&frameWidth=390px`'
        mock: なし
        expected: '`<div class="mdmark">` の中を `<div style="width: 390px; max-width: 100%">` で包んだ `renderBadge({ label: "v1" })`'
  - name: createRenderServer
    title: 描画のインターフェースを作る
    container: scripts/storybook-render.ts
    kind: 関数
    scope: internal
    summary: '`GET /render/index.css` に `src/index.css` を、`GET /render/{部品の id}` に部品の HTML を返却する HTTP サーバーを作る（待ち受けは呼び出し側）'
    args:
      - name: options
        type: '{ root: string }'
        required: true
        description: 作業ツリーの場所（`src/index.css` を読み込む）
    returns:
      type: http.Server
      description: 待ち受けていないサーバー
    process: |-
      1. `/render/index.css` は、`src/index.css` を読み込んで `text/css; charset=utf-8` の 200 で返却する。`/render/diagram.js`・`/render/sticky.js` は、`src/interact/diagrams.ts`・`src/interact/sticky.ts` を esbuild でまとめた ES モジュールを `text/javascript; charset=utf-8` の 200 で返却する（まとめられなければ 500）
      2. `/render/{部品の id}` は、部品の HTML を返却する（部品の HTML を返却する）
         - HTML があれば `text/html; charset=utf-8` の 200 で返却する
         - 無ければ `知らない部品: {部品の id}` を 404 で返却する
      3. それ以外のパスは 404 で返却する
    callees:
      - '#functions[renderPart]'
    unit_tests:
      - name: test_create_render_server
        case: 正常
        summary: 部品の HTML を 200 で返却する
        condition: '`GET /render/notice?name=chart&figure=true`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 200、`Content-Type` が `text/html; charset=utf-8`、本文に `この図を表示できません`
      - name: test_create_render_server_when_css
        case: 正常
        summary: 本文の CSS を返却する
        condition: '`GET /render/index.css`'
        mock: 一時フォルダに `src/index.css` を配置する
        expected: 200、`Content-Type` が `text/css; charset=utf-8`、本文が配置した CSS
      - name: test_create_render_server_when_unknown_part
        case: 正常
        summary: 知らない部品は 404 を返却する
        condition: '`GET /render/missing`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 404、本文に `missing`
      - name: test_create_render_server_when_sticky_script
        case: 正常
        summary: 見出し行と集計の行を留める処理をまとめて返却する
        condition: '`GET /render/sticky.js`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 200、`Content-Type` が `text/javascript; charset=utf-8`、本文に `attachStickyRows`
  - name: main
    title: 描画のインターフェースを起動する
    container: scripts/storybook-render.ts
    kind: 関数
    scope: public
    summary: 環境変数 `RENDER_PORT` のポートで、`RENDER_HOST` に描画のインターフェースを待ち受ける
    description: ファイルの末尾で、`import.meta.main` が `true` のときだけ呼ぶ
    process: |-
      1. `RENDER_PORT` が 1〜65535 の整数でなければ、標準エラーに理由を出し、`process.exitCode` を 1 にして終わる
      2. リポジトリの直下で描画のインターフェースを作り（描画のインターフェースを作る）、`RENDER_HOST` の `RENDER_PORT` で待ち受ける
    callees:
      - '#functions[createRenderServer]'
    unit_tests:
      - name: test_main_when_port_missing
        case: 異常
        summary: ポートが無ければ待ち受けずに終わる
        condition: '`RENDER_PORT` が無い'
        mock: '`process.env` から `RENDER_PORT` を削除する'
        expected: '`process.exitCode` が 1、標準エラーに `RENDER_PORT` が出る'
