id: MOD-472-113
visibility: internal
title: ライブラリ本体 / CLI / assets.ts
test_files:
  - tests/unit/src/cli/assets.test.ts
data_models:
  - name: AssetRef
    title: ファイルの参照
    container: src/cli/assets.ts
    usecase: 共通
    summary: 文書が相対パスで指す画像・動画・音声・`poster`・添付のファイル 1 つ
    properties:
      - name: src
        type: string
        description: 記載したパス（クエリとフラグメントを含む）
      - name: kind
        type: "'image' | 'video' | 'audio' | 'poster' | 'attachment'"
        description: 種類。`mediaKindOf` と `ATTACHMENT_KINDS` で見分ける（GIF は `image`）
      - name: line
        type: number
        description: 記載した行の番号（1 から）
    status: planned
    introduced:
      pr: 263
functions:
  - name: collectAssetRefs
    title: ファイルの参照を取得する
    container: src/cli/assets.ts
    usecase: 共通
    kind: 関数
    scope: internal
    summary: markdown-it のトークン（`image`・`link_open` と `html_inline`・`html_block` の `img` の `src`）と画像の属性の `poster=` から、相対パスの参照を `AssetRef` で返却する。絶対 URL・`data:`・`#` で始まるもの、コードブロックとインラインコードの中は取得しない。リンクは拡張子が `ATTACHMENT_KINDS` にあるものだけを `attachment` で取得する
    args:
      - name: markdown
        type: string
        required: true
        description: 文書の Markdown
    returns:
      type: AssetRef[]
      description: 記載した順の参照
    callees:
      - MOD-472-271#functions[mediaKindOf]
    unit_tests:
      - name: test_collect_asset_refs
        case: 正常
        summary: 画像・動画・poster・添付を取得する
        condition: 1 行目 `![図](a.png#only-dark)`、2 行目 `![操作](demo.mp4){poster=demo.png}`、3 行目 `[仕様](spec.pdf)`、4 行目 `[外](https://example.com/b.png)`
        mock: なし
        expected: '`a.png#only-dark`（image, 1）・`demo.mp4`（video, 2）・`demo.png`（poster, 2）・`spec.pdf`（attachment, 3）の 4 件'
      - name: test_collect_asset_refs_when_code
        case: 正常
        summary: コードの中は取得しない
        condition: コードブロックの中の `![図](a.png)` とインラインコードの `` `![図](b.png)` ``
        mock: なし
        expected: 空
    status: planned
    introduced:
      pr: 263
  - name: resolveAssetFile
    title: アセットのルートでファイルを探す
    container: src/cli/assets.ts
    usecase: 共通
    kind: 関数
    scope: internal
    summary: 記載したパスからクエリとフラグメントを削除し、文書のフォルダを基準に探して、無ければ `assetsRoot` を基準に同じ相対パスで探す。見つかったファイルの絶対パスを返却する
    is_async: true
    args:
      - name: src
        type: string
        required: true
        description: 記載したパス
      - name: options
        type: '{ docDir: string; assetsRoot?: string }'
        required: true
        description: 文書のフォルダと、設定ファイルのフォルダから解決した `assets.root` の絶対パス
    returns:
      type: Promise<string | undefined>
      description: 見つかったファイルの絶対パス。どちらにも無ければ `undefined`
    refs:
      - IF-472-33#constraints[アセットのルート]
    unit_tests:
      - name: test_resolve_asset_file
        case: 正常
        summary: 文書のフォルダを先に、無ければアセットのルートで探す
        condition: '`docs/a.png` と `assets/a.png` と `assets/b.png` があり、`docDir` が `docs`、`assetsRoot` が `assets` で `a.png?v=1#x` と `b.png` と `c.png`'
        mock: 一時フォルダ
        expected: '`docs/a.png`・`assets/b.png`・`undefined`'
    status: planned
    introduced:
      pr: 263
  - name: copyMedia
    title: 動画と音声をコピーする
    container: src/cli/assets.ts
    usecase: 共通
    kind: 関数
    scope: internal
    summary: '`collectAssetRefs` の `video`・`audio` を `resolveAssetFile` で探し、`{出力のファイル名から拡張子を除いた名前}_files/` の下へコピーして、Markdown の `src` を HTML からの相対パス（クエリとフラグメントは残す）に替える。コピー先の中のパスは `baseDir` からの相対パスにし、`baseDir` の外のファイルは `external/{ファイル名}`（重なれば `-1`・`-2`）にする。`copied` に入っているファイルはコピーせず同じパスを使用する。見つからないものは記載したまま残して警告にする'
    is_async: true
    side_effects: '`_files/` を作り、ファイルをコピーする'
    args:
      - name: options
        type: '{ markdown: string; docFile: string; assetsRoot?: string; baseDir: string; out: string; copied: Map<string, string> }'
        required: true
        description: 文書の Markdown・文書の絶対パス・`assets.root`・設定ファイルのフォルダ（無ければ文書のフォルダ）・出力の HTML の絶対パス・この書き出しでコピーしたファイルからコピー先を参照する表（文書をまたいで共有する）
    returns:
      type: 'Promise<{ markdown: string; warnings: string[] }>'
      description: '`src` を替えた Markdown と警告'
    exceptions:
      - name: CliError
        condition: '`_files/` を作れない・記載できない'
        message: '`{出力のフォルダ}/{名前}_files に書き込めません（{理由}）。出力先のフォルダを確認してください。`'
    callees:
      - '#functions[collectAssetRefs]'
      - '#functions[resolveAssetFile]'
    refs:
      - IF-472-33#constraints[コピーする動画と音声]
    unit_tests:
      - name: test_copy_media
        case: 正常
        summary: 動画をコピーして src を替え、同じファイルは 1 回だけコピーする
        condition: '`docs/guide.md` の `![操作](media/demo.mp4#t=3)` と `![操作](media/demo.mp4)`、`out` が `out/guide.html`'
        mock: 一時フォルダ
        expected: '`out/guide_files/docs/media/demo.mp4` が 1 つあり、`markdown` の `src` が `guide_files/docs/media/demo.mp4#t=3` と `guide_files/docs/media/demo.mp4`、`copied` が 1 件'
      - name: test_copy_media_when_outside
        case: 正常
        summary: 基準の外のファイルは external に名前を重ねずに配置する
        condition: '`baseDir` の外の `x/demo.mp4` と `y/demo.mp4` を指す文書'
        mock: 一時フォルダ
        expected: '`_files/external/demo.mp4` と `_files/external/demo-1.mp4`'
      - name: test_copy_media_when_missing
        case: 正常
        summary: 見つからない動画は残して警告にする
        condition: '`![操作](none.mp4)` でファイルが無い'
        mock: 一時フォルダ
        expected: '`markdown` が元のままで `warnings` に `none.mp4` が入り、`_files/` が無い'
      - name: test_copy_media_when_unwritable
        case: 異常
        summary: コピー先を作れなければ CliError
        condition: '`out/guide_files` という名前のファイルがある'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `guide_files` が入る'
        exception: '`_files/` を作れない・記載できない'
    status: planned
    introduced:
      pr: 263
  - name: checkMissingFiles
    title: 見つからないファイルを点検する
    container: src/cli/assets.ts
    usecase: 設定と索引を点検する
    kind: 関数
    scope: internal
    summary: '`collectAssetRefs` の参照ごとに `resolveAssetFile` で探し、見つからないものを 1 つにつき 1 件の `missing_file` のずれにする（`where` は行の番号、`message` は記載したパスと種類（画像・動画・音声・添付）と修正方法の 1 文）'
    is_async: true
    args:
      - name: options
        type: '{ markdown: string; docFile: string; file: string; assetsRoot?: string }'
        required: true
        description: 文書の Markdown・絶対パス・ずれに出す相対パスと `assets.root`
    returns:
      type: Promise<CheckIssue[]>
      description: ずれの並び
    callees:
      - '#functions[collectAssetRefs]'
      - '#functions[resolveAssetFile]'
    refs:
      - IF-472-39#constraints[見つからないファイルの点検]
    unit_tests:
      - name: test_check_missing_files
        case: 正常
        summary: 見つからない画像と添付をずれにする
        condition: 3 行目に `![図](none.png)`、5 行目に `[仕様](none.pdf)`、`a.png` だけがある文書で `![図](a.png)`
        mock: 一時フォルダ
        expected: '`missing_file` が 2 件で、`where` が `3`・`5`、`message` に `none.png` と `画像`、`none.pdf` と `添付` が入る'
    status: planned
    introduced:
      pr: 263
