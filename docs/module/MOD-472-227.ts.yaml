id: MOD-472-227
visibility: internal
title: ライブラリ本体 / 描く / interact.ts
test_files:
  - tests/unit/src/interact.browser.test.ts
functions:
  - name: attachInteractions
    title: 記法の操作を付ける
    container: src/interact.ts
    kind: 関数
    scope: internal
    summary: 機能がオンの記法の操作を付け、まとめて削除する関数を返却する
    description: |-
      機能がオンの記法だけ、次の関数を呼ぶ。`attachStickyRows` だけは機能のオン・オフによらず呼ぶ（全ての表の見出し行を留めるため）。

      | 機能 | 呼ぶ関数 |
      | --- | --- |
      | 記法の機能 | `attachSections`・`attachTables`・`attachTabs` の順 |
      | `table` | `attachTables`。`attachStickyRows` は `table` のオン・オフによらず、`attachTables` の後（オフなら `attachTables` を呼ばずに）呼ぶ |
      | `code` | `attachCodeCopy` と `attachCodeFolds` |
      | `tree` | `attachFileTrees` |
      | `footnotes` か `annotations` | `attachFootnotes` |
      | `glossary` か `backlinks` | `attachTermTips` |
      | `html` | `attachEmbeddedHtml`。さらに `hints` がオンなら `div.mdmark-html` ごとに `attachDiagramTips` |
      | `lightbox` | `attachLightbox` |
      | `gif` | `attachLightbox` の後に `attachGifs`（GIF の包みが拡大のボタンを含むため） |
      | `media` | `attachMediaModal` |
      | `media` と `media-resize` | `attachMediaResizes`（`storage` は `sessionStorage`。参照で例外になるときは `null`） |

      `attachSections`・`attachTables`・`attachTabs` をこの順にするのは、付けたときも `hashchange` も、`attachTables` が行へ送信する前に `attachSections` が URL の `#ID` の指す閉じたセクションを開くため。

      `attachTermTips`・`attachFootnotes` には `placement` を、`attachDiagrams` と `div.mdmark-html` の `attachDiagramTips` には `diagramPlacement` を指定する。
      `partStates` を指定したときは、`attachSections`・`attachTables`・`attachCodeFolds`・`attachFileTrees`・`attachDiagrams` にも指定し、`attachDetailsStates` を呼ぶ
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; placement: TooltipPlacement; diagramPlacement: TooltipPlacement; pinMode?: TablePinMode; pinDefault?: boolean; longColumnMin?: number; onColumnsChange?: (event: MdmarkColumnsChange) => void; sectionStates?: SectionStates; partStates?: PartStates; revealHash?: boolean; followHash?: boolean }'
        required: true
        description: 描いた要素と文書で決定した機能のオン・オフと、既定を適用した設定のツールチップを出す場所（本文の `placement` と図の `diagramPlacement`）と、`attachTables` に指定する表のピン止めの動き（既定を適用した設定の `table.pin`。既定 `each`）と描いた直後に既定の列を留めるか（既定を適用した設定の `table.pinDefault`。既定 `false`）と長文の列の最小の幅（既定を適用した設定の `table.longColumnMin`）と列の表示の通知（`mount` の `opts.onColumnsChange`。`MdmarkColumnsChange` は `src/mount.ts` から型だけを読み込む）と、`attachSections` に `states` として指定するセクションの開閉の記録（`SectionStates` は `src/section/section.interact.ts` から型だけを読み込む）と、部品の開閉の記録（`partStates`。`PartStates` は `src/shared/part-states.interact.ts` から型だけを読み込む。省くと記録しない）と、付けたときに URL の `#ID` で開くか（`revealHash`。既定 `true`）と、URL の `#ID` を追うか（`followHash`。`attachSections`・`attachTables`・`attachTabs` に指定する。既定 `true`）
    returns:
      type: () => void
      description: 付けた操作を削除する関数
    callees:
      - 'MOD-472-228#functions[attachTables]'
      - 'MOD-472-220#functions[attachTabs]'
      - 'MOD-472-222#functions[attachSections]'
      - MOD-472-266#functions[attachTermTips]
      - 'MOD-472-221#functions[attachStickyRows]'
      - 'MOD-472-233#functions[attachCodeCopy]'
      - 'MOD-472-235#functions[attachFileTrees]'
      - 'MOD-472-224#functions[attachLightbox]'
      - 'MOD-472-236#functions[attachGifs]'
      - 'MOD-472-225#functions[attachCodeFolds]'
      - 'MOD-472-238#functions[attachFootnotes]'
      - MOD-472-348#functions[attachDetailsStates]
      - MOD-801-2#functions[attachMediaModal]
      - MOD-805-2#functions[attachMediaResizes]
    unit_tests:
      - name: test_attach_interactions
        case: 正常
        summary: オフの記法には操作を付けない
        condition: タブと表を描いた要素、`features` の `tabs` が `false`
        mock: なし
        expected: '`role="tablist"` が無く、表の見出しにボタンがある'
      - name: test_attach_interactions_when_hints_off
        case: 正常
        summary: hints がオフなら埋め込んだ HTML にツールチップの操作を付けない
        condition: ヒントを持つ `div.mdmark-html` を描いた要素と、`features` の `hints` が `false`
        mock: なし
        expected: マーカーにフォーカスしても `role="tooltip"` の要素が `hidden` を持ったまま
      - name: test_attach_interactions_when_row_in_closed_section
        case: 正常
        summary: 閉じたセクションの中の行へは、セクションを開いてから送信する
        condition: '`data-section="closed"` のセクションの中に `rowlink` の表（`id` `もも` の行）を描いた要素で、`location.hash` を `#もも` にして付け、次に `#/a.md#もも` にして `hashchange` を送信する'
        mock: '`Element.prototype.scrollIntoView` を、呼ばれたときにセクションの中身の `hidden` を記録する関数に差し替える'
        expected: どちらも、`もも` の行の `scrollIntoView` が呼ばれたときにセクションの中身が `hidden` を持たず、行が `data-target` を持つ
      - name: test_attach_interactions_when_code_off
        case: 正常
        summary: code がオフならコードブロックにコピーのボタンを付けず、table がオフでも行を留める
        condition: 帯を持つコードブロックと表を描いた要素、`features` の `code` と `table` が `false`
        mock: なし
        expected: '`mdmark-code-copy` が無く、`table` が `data-mdmark-sticky` を持つ'
      - name: test_attach_interactions_when_tree_off
        case: 正常
        summary: tree がオフならファイルツリーに開閉とコピーを付けない
        condition: ファイルツリーを描いた要素と、`features` の `tree` が `false`
        mock: なし
        expected: '`mdmark-tree-bar` と `mdmark-tree-toggle` が無い'
      - name: test_attach_interactions_when_lightbox_off
        case: 正常
        summary: lightbox がオフなら画像を包まず、gif がオフならボタンを付けない
        condition: 画像と GIF を描いた要素と、`features` の `lightbox` と `gif` が `false`
        mock: なし
        expected: '`button.mdmark-image-open` と `button.mdmark-gif-toggle` が無い'
      - name: test_attach_interactions_when_part_states
        case: 正常
        summary: 部品の開閉の記録を各部品の操作へ指定する
        condition: 行の詳細を持つ表・ファイルツリー・閉じた details の範囲を描いた要素に空の `partStates` を指定して付け、行の詳細・フォルダ・details の開閉を押してから削除し、同じ HTML を再描画した要素に同じ `partStates` でもう一度付ける
        mock: なし
        expected: 2 回目に付けた後、行の詳細・フォルダ・details が押した後の開閉になっている
      - name: test_attach_interactions_when_media_off
        case: 正常
        summary: media がオフなら再生のダイアログを開かない
        condition: '`button.mdmark-media-open` を描いた要素と、`features` の `media` が `false` でボタンを押す'
        mock: なし
        expected: '`dialog.mdmark-media-modal` が無い'
lead: '描いた文書への記法の操作の付与を受け持ち、描いた文書での読者の操作を追加・変更するときに参照する。'
tags:
  - name: action:操作
    main: true
  - name: topic:dom
  - name: topic:イベント
  - name: topic:部品
  - name: action:付与
