id: MOD-472-23
visibility: internal
title: "ライブラリ本体 / CLI"
lead: '`dist/cli.js` にまとめる Node の CLI。引数を読み込んでコマンドを振り分け、設定と索引と文書を読み込み、`render`・`checkIndex`・`collectReferences` を同じソースから呼んで、雛形の配置・点検・書き出しをする。ファイル・YAML・glob・esbuild を使用するのはこの分類だけにする。'
directory: |-
  ```tree
  src/cli/
  ├── main.ts       # 引数の読み取りとコマンドの振り分け
  ├── errors.ts     # CLI の誤りと入出力の型
  ├── issues.ts     # 点検のずれを 1 行にする
  ├── config.ts     # 設定ファイルの探索・読み取り・構造の検査
  ├── alias-schema.ts # 設定の aliases の行の JSON Schema での検査
  ├── aliases.ts    # aliases の行の paths の YAML の読み取りとエイリアスの組み立て
  ├── documents.ts  # build の対象の文書・索引と索引の文書の読み取り・文書のタイトル
  ├── embed.ts      # 外部ライブラリと拡張のまとめ・起動の処理と埋めるモジュールの 1 つのスクリプトへのまとめ・色分けの言語の抽出・画像の埋め込み・1 枚に含まれない文書へのリンク
  ├── assets.ts     # 画像・動画・音声・添付の参照の抽出・アセットのルートでの探索・動画と音声のコピー・見つからないファイルの点検
  ├── includes.ts   # 取り込む文書の表の組み立てと、取り込めない問題の抽出
  ├── icons.ts      # まとめていない名前のアイコンの形状の取り出し
  ├── html.ts       # 書き出す HTML の組み立て
  ├── init.ts       # mdmark init
  ├── check.ts      # mdmark check
  ├── markdown-check.ts # Markdown の文字列・YAML のキーの値の記法の点検
  ├── git.ts        # 比べる基準から変わったファイルの引き出し
  ├── export.ts     # mdmark export
  └── build.ts      # mdmark build
  templates/        # init が配置する雛形の原本
  schemas/alias-inject/v0.3.0/aliases.schema.json # 取り込んだ alias-inject の行の Schema
  src/bundle-module.ts # URL かファイルのモジュールを、指定した esbuild の build で 1 つの ES モジュールにまとめる（CLI と VS Code 拡張機能が使用する）
  ```
