id: MOD-472-80
visibility: internal
title: VS Code 拡張機能 / Webview / panel.css
styles:
  - name: panel
    title: パネルの CSS
    container: vscode/src/webview/shared/styles/panel.css
    summary: Tailwind の theme と utilities の層、トークンの 3 ティア、`@theme inline` の割り当てと、パネルの部品の下地
    description: '冒頭で `@layer theme, base, components, utilities;` と Tailwind の既定の層の順を宣言し、`tailwindcss/theme.css`（`layer(theme)`）と `tailwindcss/utilities.css`（`layer(utilities)`）だけを読み込む。Preflight（`tailwindcss/preflight.css`）は読み込まない（描いた文書の要素の既定を mdmark の `@layer mdmark` から変えない）。独自の層は追加しない。トークンは `:root` に配置する: プリミティブは VS Code が `html` に指定する `--vscode-*`、セマンティックは shadcn/ui の名前（`--background`・`--foreground`・`--card`・`--card-foreground`・`--muted-foreground`・`--primary`・`--primary-foreground`・`--secondary`・`--border`・`--ring`・`--radius`）と警告の `--warning-border` を `--vscode-*` に割り当て、派生は `--primary-hover`・`--secondary-hover`（`color-mix(in oklab, …)`）。`@theme inline` で `--color-*: initial` の後にトークンを `--color-*`・`--radius-*` へ割り当てる'
    values:
      - class_name: .mdmark-panel-part
        target: 状態の表示と帯の外側（`base` の層）
        value: '`font-family: var(--vscode-font-family)`・`line-height: 1.6`・`overflow-wrap: anywhere`・子の `box-sizing: border-box`'
      - class_name: .mdmark-preview-status
        target: 状態の表示の外側
        value: Tailwind のクラスで `grid justify-items-center`・上の余白 `25dvh`（`pt-[25dvh]` の任意値は使用せず、`@theme` の `--spacing-panel-state` を割り当てたクラス）
    refs:
      - CMP-472-29#
      - CMP-472-63#
      - LIB-472-26#
    status: planned
