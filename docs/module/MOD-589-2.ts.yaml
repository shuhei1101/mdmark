id: MOD-589-2
visibility: internal
title: ライブラリ本体 / 埋め込んだHTML / embedded-html.part.ts
lead: 許可の検査にかけた後の埋め込んだ HTML を包む枠の HTML を返却する部品。
functions:
  - name: renderEmbeddedHtml
    title: 埋め込んだHTMLの枠を描く
    kind: 関数
    container: src/embedded-html/embedded-html.part.ts
    role: 部品
    scope: public
    summary: 部品設計『埋め込んだHTML』の HTML。描いた HTML を `div.mdmark-html` で包み、列より広いときだけ class `is-wide` と `tabindex="0"` を付けて中で横にスクロールさせる
    args:
      - name: props.html
        type: string
        required: true
        description: 許可の検査にかけた後の HTML
      - name: props.wide
        type: boolean
        required: false
        default: 'false'
        description: 列より広いか
    returns:
      type: string
      description: '`div.mdmark-html`（`wide` のときは `div.mdmark-html.is-wide[tabindex="0"]`）で包んだ HTML'
    refs:
      - CMP-472-41#
tags:
  - name: topic:部品
    main: true
  - name: tool:html
  - name: action:検査
