functions:
  - name: resolveConfig
    title: 設定に既定を適用する
    container: src/config.ts
    kind: 関数
    scope: public
    summary: 利用側の設定に既定を当て、型の合わない値を落とした `ResolvedConfig` を返却する
    description: '`features` は `DEFAULT_FEATURES` のキーのうち、設定に真偽値があるものだけを置き換える。`libraries` は `MARK_NAME_PATTERN` に合うキーと文字列の値だけを取り、既定にある名前は `url` だけを置き換え、無い名前は `figure: true` で追加する。`tooltips.placement` は `bottom` のときだけ `bottom` にし、無い値・他の値は `top` にする。`tooltips.diagramPlacement` は `top` のときだけ `top` にし、無い値・他の値は `bottom` にする。`syntax.url` は文字列のときだけ取り、無い値・他の型は `DEFAULT_SYNTAX_URL` にする。`html-scripts.url` は文字列のときだけ取って `htmlScripts.url` に入れ、無い値・他の型は `DEFAULT_HTML_SCRIPTS_URL` にする。`side-toc.mode` は `fixed` のときだけ `fixed` にし、無い値・他の値は `hover` にする。`table.pin` は `through` のときだけ `through` にし、無い値・他の値は `each` にする。`colorTheme` は `COLOR_THEMES` にあるときだけ取り、無い値・他の値・文字列でない値は `DEFAULT_COLOR_THEME` にする（例外を投げない）。`colorScheme` は `COLOR_SCHEMES` にあるときだけ取り、無い値・他の値・文字列でない値は `DEFAULT_COLOR_SCHEME` にする。`labels.paramCopy` は空でない文字列のときだけ取り、無い値・空文字・他の型は `DEFAULT_LABELS.paramCopy` にする。`mermaid.url` は文字列のときだけ取り、無い値・他の型は `DEFAULT_MERMAID_URL` にする。`mermaid.theme` は `MERMAID_THEMES` にあるときだけ取り、無い値・他の値は `mdmark` にする。`mermaid.themeVariables` はマップのときだけ、値が文字列のキーを取り、`useGradient`・`dropShadow` は取らない。指定されたオブジェクトは書き換えない'
    args:
      - name: options
        type: '{ config?: MdmarkConfig; defaultLibraries?: Record<string, LibraryEntry> }'
        required: true
        description: '`config` は利用側の設定、`defaultLibraries` は既定の対応表（既定 `DEFAULT_LIBRARIES`。単体テストで差し替える）'
    returns:
      type: ResolvedConfig
      description: 既定を適用した設定
    unit_tests:
      - name: test_resolve_config
        case: 正常
        summary: 設定が無ければ既定を返却する
        condition: '`config` が `undefined`'
        mock: なし
        expected: '`{ features: DEFAULT_FEATURES, libraries: {}, tooltips: { placement: "top", diagramPlacement: "bottom" }, syntax: { url: DEFAULT_SYNTAX_URL }, htmlScripts: { url: DEFAULT_HTML_SCRIPTS_URL }, mermaid: { url: DEFAULT_MERMAID_URL, theme: "mdmark", themeVariables: {} }, sideToc: { mode: "hover" }, colorTheme: "dev-swiss", colorScheme: "auto", labels: { paramCopy: "今の値を写す" } }`（`comments`・`html-scripts` を除く全ての機能が `true`）'
      - name: test_resolve_config_when_features_given
        case: 正常
        summary: 知っている機能の真偽値だけを置き換える
        condition: '`{ features: { print: false, unknown: true, other: "yes" } }`'
        mock: なし
        expected: '`features` が `DEFAULT_FEATURES` の `print` だけを `false` にした値'
      - name: test_resolve_config_when_libraries_given
        case: 正常
        summary: 書式に合う名前と文字列の URL だけを追加する
        condition: '`{ libraries: { "test-lib": "/fixtures/test-lib.js", "Bad Name": "/x.js", "num": 1 } }`'
        mock: なし
        expected: '`libraries` が `{ "test-lib": { url: "/fixtures/test-lib.js", figure: true } }`'
      - name: test_resolve_config_when_default_library_overridden
        case: 正常
        summary: 既定の行は URL だけを置き換え、`figure` は既定のまま
        condition: '`defaultLibraries` が `{ block: { url: "https://a/x.js", figure: false } }`、`config` が `{ libraries: { block: "/y.js" } }`'
        mock: なし
        expected: '`libraries.block` が `{ url: "/y.js", figure: false }`'
      - name: test_resolve_config_when_tooltip_placement_given
        case: 正常
        summary: '`bottom` だけを受け、他の値は `top` にする'
        condition: '`{ tooltips: { placement: "bottom" } }` と `{ tooltips: { placement: "left" } }`'
        mock: なし
        expected: 前者の `tooltips.placement` が `bottom`、後者は `top`
      - name: test_resolve_config_when_syntax_url_given
        case: 正常
        summary: 文字列の `syntax.url` だけを受け、他の型は既定にする
        condition: '`{ syntax: { url: "/vendor/highlightjs/es/" } }` と `{ syntax: { url: 1 } }`'
        mock: なし
        expected: 前者の `syntax.url` が `/vendor/highlightjs/es/`、後者は `DEFAULT_SYNTAX_URL`
      - name: test_resolve_config_when_side_toc_mode_given
        case: 正常
        summary: '`fixed` だけを受け、他の値と無いときは `hover` にする'
        condition: '`{ "side-toc": { mode: "fixed" } }`、`{ "side-toc": { mode: "left" } }`、`{}`'
        mock: なし
        expected: 1 つ目の `sideToc.mode` が `fixed`、残りは `hover`。`{}` の `features["side-toc"]` と `features["back-to-top"]` が `true`
      - name: test_resolve_config_when_color_theme_given
        case: 正常
        summary: '`COLOR_THEMES` の名前だけを受け、他の値と無いときは `dev-swiss` にする'
        condition: '`{ colorTheme: "theme-slate" }`、`{ colorTheme: "sepia" }`、`{ colorTheme: 1 }`、`{}`'
        mock: なし
        expected: 1 つ目の `colorTheme` が `theme-slate`、残りは `dev-swiss`。例外を投げない
      - name: test_resolve_config_when_color_scheme_given
        case: 正常
        summary: '`COLOR_SCHEMES` の値だけを受け、他の値と無いときは `auto` にする'
        condition: '`{ colorScheme: "dark" }`、`{ colorScheme: "sepia" }`、`{ colorScheme: 1 }`、`{}`'
        mock: なし
        expected: 1 つ目の `colorScheme` が `dark`、残りは `auto`。`{}` の `features["card-grid"]` が `true`。例外を投げない
      - name: test_resolve_config_when_labels_given
        case: 正常
        summary: 空でない文字列の `labels.paramCopy` だけを受け、空文字・他の型・無いときは既定にする
        condition: '`{ labels: { paramCopy: "コピー" } }`、`{ labels: { paramCopy: "" } }`、`{ labels: { paramCopy: 1 } }`、`{ labels: { other: "x" } }`'
        mock: なし
        expected: '1 つ目の `labels` が `{ paramCopy: "コピー" }`、残りは `{ paramCopy: "今の値を写す" }`（知らないキー `other` を持たない）。例外を投げない'
      - name: test_resolve_config_when_html_scripts_url_given
        case: 正常
        summary: 文字列の `html-scripts.url` だけを受け、他の型と無いときは既定にする
        condition: '`{ "html-scripts": { url: "/vendor/babel.mjs" } }`・`{ "html-scripts": { url: 1 } }`・`{}`'
        mock: なし
        expected: 1 つ目の `htmlScripts.url` が `/vendor/babel.mjs`、残りは `DEFAULT_HTML_SCRIPTS_URL`。`{}` の `features["html-scripts"]` が `false`
      - name: test_resolve_config_when_mermaid_given
        case: 正常
        summary: mermaid の url・theme・themeVariables の型の合う値だけを受ける
        condition: '`{ mermaid: { url: "/vendor/mermaid.mjs", theme: "neutral", themeVariables: { primaryColor: "#e0f2f1", useGradient: "true", dropShadow: "x", fontSize: 14 } } }`・`{ mermaid: { url: 1, theme: "no-such-theme", themeVariables: "x" } }`・`{}`'
        mock: なし
        expected: '1 つ目の `mermaid` が `{ url: "/vendor/mermaid.mjs", theme: "neutral", themeVariables: { primaryColor: "#e0f2f1" } }`、残りは `{ url: DEFAULT_MERMAID_URL, theme: "mdmark", themeVariables: {} }`。`{}` の `features.mermaid` が `true`。例外を投げない'
      - name: test_resolve_config_when_diagram_placement_given
        case: 正常
        summary: '`top` だけを受け、他の値と無いときは `bottom` にする'
        condition: '`{ tooltips: { diagramPlacement: "top" } }`、`{ tooltips: { diagramPlacement: "left" } }`、`{ tooltips: { placement: "bottom" } }`'
        mock: なし
        expected: '`tooltips.diagramPlacement` が順に `top`・`bottom`・`bottom`。3 つ目の `tooltips.placement` は `bottom`'
      - name: test_resolve_config_when_table_pin_given
        case: 正常
        summary: '`through` だけを受け、他の値と無いときは `each` にする'
        condition: '`{ table: { pin: "through" } }`、`{ table: { pin: "left" } }`、`{ table: { pin: 1 } }`、`{}`'
        mock: なし
        expected: 1 つ目の `table.pin` が `through`、残りは `each`
      - name: test_resolve_config_when_long_column_min_given
        case: 正常
        summary: 0 より大きい数だけを長文の列の最小の幅にし、ほかは既定の 45 にする
        condition: '`{ table: { long_column_min: 30 } }`、`{ table: { long_column_min: 0 } }`、`{ table: { long_column_min: "wide" } }`、`{ table: { long_column_min: -5 } }`、`{}`'
        mock: なし
        expected: '`table.longColumnMin` が順に `30`・`45`・`45`・`45`・`45`'
  - name: applyPageSettings
    title: ページの設定を重ねる
    container: src/config.ts
    kind: 関数
    scope: internal
    summary: 既定を適用した設定に、文書の page のマーカーの値を重ねた設定を返却する
    description: '`page.scheme` があれば `colorScheme`、`page.theme` があれば `colorTheme`、`page.toc` があれば `sideToc.mode` を置き換える。無いキーは設定の値のまま。指定されたオブジェクトは書き換えない'
    args:
      - name: options
        type: '{ config: ResolvedConfig; page: PageSettings }'
        required: true
        description: 既定を適用した設定と、`renderDocument` が返却したページの設定
    returns:
      type: ResolvedConfig
      description: '`mount` が描くのに使用する設定'
    unit_tests:
      - name: test_apply_page_settings
        case: 正常
        summary: マーカーに記載したキーだけを置き換える
        condition: '`colorScheme: "dark"`・`colorTheme: "theme-paper"`・`sideToc.mode: "hover"` の設定に、`{ scheme: "light", toc: "fixed" }` を重ねる。別に `{}` を重ねる'
        mock: なし
        expected: 1 つ目は `colorScheme` が `light`・`colorTheme` が `theme-paper`・`sideToc.mode` が `fixed`。2 つ目は設定と同じ値。指定した設定は変わらない
    refs:
      - IF-472-35#constraints[ページの設定のマーカー]
    status: planned
  - name: resolveMapConfig
    title: mapの設定に既定を当てる
    kind: 関数
    container: src/config.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 設定の `map` に既定を当て、知らない値を既定にした `ResolvedConfig["map"]` を返す。`resolveConfig` が呼ぶ
    scope: internal
    args:
      - name: value
        type: unknown
        required: true
        description: 利用側の `config.map`
    returns:
      type: '{ node_fit: "height" | "width"; url_state: boolean; kinds: Record<string, MapKind>; lines: Record<string, MapLine> }'
      description: 既定を当てた設定
    process: |-
      1. `node_fit` が `height`・`width` でなければ `height`、`url_state` が真偽値でなければ `true` にする
      2. `kinds`・`lines` のオブジェクトの値ごとに、`MAP_SHAPES`・`MAP_DASHES`・`MAP_WIDTHS`・`MAP_HEADS`・色の名前に無い値のキーを捨てる（`icon` は文字列ならそのまま残し、描くときに無い名前を捨てる）
    unit_tests:
      - name: test_resolve_map_config
        case: 正常
        summary: 既定
        condition: '`undefined`'
        mock: なし
        expected: '`{ node_fit: height, url_state: true, kinds: {}, lines: {} }`'
      - name: test_resolve_map_config_when_unknown_values
        case: 正常
        summary: 知らない値
        condition: '`node_fit: tall`・`url_state: "no"`・`kinds.a.shape: hexagon`'
        mock: なし
        expected: '`node_fit` が `height`、`url_state` が `true`、`kinds.a` に `shape` が無い'
