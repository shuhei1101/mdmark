id: MOD-472-142
visibility: internal
title: ライブラリ本体 / map / 配置 / sequence-rows.ts
test_files:
  - tests/unit/src/map/sequence-rows.test.ts
functions:
  - name: sequenceRows
    title: シーケンス図の行を決める
    kind: 関数
    container: src/map/sequence-rows.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 処理
    summary: 並び順・閉じたブロック・中だけを描くブロックから、表示する参加者と行（メッセージ・閉じたブロック・区切り・ノート・空き）を返す
    scope: public
    args:
      - name: sequence
        type: Sequence
        required: true
        description: 読み取ったシーケンス図
      - name: view
        type: '{ order: string[]; collapsed: number[]; entered: number | undefined }'
        required: true
        description: 見せ方
    returns:
      type: '{ participants: string[]; rows: SequenceRow[]; headRows: number }'
      description: 表示する参加者・行・一番高い参加者の箱の下まで空ける行の数
    process: |-
      1. 中だけを描くブロックがあれば、その中のメッセージと、それに関わる参加者だけにする
      2. 閉じたブロックの中のメッセージを、種類・名前・件数の 1 行にまとめる（入れ子は外側の閉じたブロックにまとめる）
      3. ノートとブロックの見出しの行を、メッセージのラベルと重ならないように空きの行で挟む
    unit_tests:
      - name: test_sequence_rows
        case: 正常
        summary: 全体
        condition: モックの `SEQUENCE` と空の見せ方
        mock: なし
        expected: メッセージの行が 7 で、参加者が記載の順
      - name: test_sequence_rows_when_collapsed
        case: 正常
        summary: 閉じたブロック
        condition: '`collapsed: [2]`'
        mock: なし
        expected: '`alt` の中の 4 件が 1 行になる'
      - name: test_sequence_rows_when_entered
        case: 正常
        summary: 中だけを描く
        condition: '`entered: 1`'
        mock: なし
        expected: '`loop` の中のメッセージと関わる参加者だけ'
      - name: test_sequence_rows_when_reordered
        case: 正常
        summary: 並び順
        condition: '`order` で 5 人目を 2 人目にした'
        mock: なし
        expected: '`participants` がその順'
