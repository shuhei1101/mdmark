id: MOD-472-3
visibility: internal
title: ClaudeCodeプラグイン / SessionStartのフック / session-start.ts
lead: プラグインの `hooks/hooks.json` の SessionStart が `node` で起動する処理。常駐サーバーが待ち受けていないときだけ、そのことを 1 行で指定する。
test_files:
  - tests/unit/src/plugin/session-start.test.ts
constants:
  - name: PROMPT_NOT_LISTENING
    title: 待ち受けていないときの文のプロンプト
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    summary: 'プロンプトファイル `plugin/content/prompts/hooks/session-start-not-listening.yaml`（`kind: hook`、変数 `port`）の ID。文は今の `NOT_LISTENING_CONTEXT` のまま移す'
    value: hooks/session-start-not-listening
    refs:
      - IF-472-6#constraints[出す文]
    status: planned
  - name: PROMPT_PORT_INVALID
    title: ポートが使用できない値のときの文のプロンプト
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    summary: 'プロンプトファイル `plugin/content/prompts/hooks/session-start-port-invalid.yaml`（`kind: hook`、変数 `value`）の ID。文は今の `PORT_INVALID_CONTEXT` のまま移す'
    value: hooks/session-start-port-invalid
    refs:
      - IF-472-6#constraints[終了コード]
    status: planned
functions:
  - name: runSessionStart
    title: 常駐サーバーの状態を伝える
    kind: 関数
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    role: エントリーポイント
    summary: ポートが待ち受けていなければ、`additionalContext` に 1 行を記載する
    description: まとめた `plugin/scripts/session-start.js` をエントリーポイントとして実行したときだけ実行し、戻り値を終了コードにする（`import.meta.main`）。標準入力は読み込まない
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; stdout: (line: string) => void; root: string }'
        required: true
        description: 環境変数・標準出力へ 1 行書く関数・プラグインのルート（エントリーポイントでは `scripts/` の 1 つ上のフォルダ。`import.meta.url` から求める）
    returns:
      type: Promise<0>
      description: 常に 0
    process: |-
      1. `readPort` でポートを読み込む。使用できない値なら `PROMPT_PORT_INVALID` を `value` で描いた文を `additionalContext` に記載して 0 を返却する（プロンプトファイルを読み込む・プロンプトを描く）
      2. `isPortListening`（モジュール構成『ポート』の `CONNECT_TIMEOUT_MS`）が真なら何も書き込まずに 0 を返却する
      3. `{ hookSpecificOutput: { hookEventName: "SessionStart", additionalContext: PROMPT_NOT_LISTENING を port で描いた文 } }` を JSON の 1 行で標準出力に書き込んで 0 を返却する
      4. プロンプトファイルを読み込めない・描けない場合、何も書き込まずに 0 を返却する
    callees:
      - MOD-472-15#functions[readPort]
      - MOD-472-15#functions[isPortListening]
      - MOD-775-1#functions[loadPrompt]
      - MOD-775-1#functions[renderPrompt]
    unit_tests:
      - name: test_run_session_start
        case: 正常
        summary: 待ち受けていれば何も書き込まない
        condition: テストが待ち受けるポートを `MDMARK_PORT` に
        mock: 行を配列に貯める `stdout`
        expected: 0 を返却し、`stdout` が空
      - name: test_run_session_start_when_not_listening
        case: 正常
        summary: 待ち受けていなければ 1 行を記載する
        condition: 待ち受けるプロセスの無いポート
        mock: 行を配列に貯める `stdout`
        expected: 0 を返却し、JSON の `hookEventName` が `SessionStart`、`additionalContext` が改行を含まず、`127.0.0.1:{ポート}` と `/mdmark:global-setup` を含む
      - name: test_run_session_start_when_port_invalid
        case: 正常
        summary: 使用できないポートでも 0
        condition: '`MDMARK_PORT=abc`'
        mock: 行を配列に貯める `stdout`
        expected: 0 を返却し、`additionalContext` に `abc` を含む
      - name: test_run_session_start_when_hooks_json
        case: 正常
        summary: hooks.json の SessionStart の行
        condition: '`plugin/hooks/hooks.json` を読み込む'
        mock: なし
        expected: '`SessionStart` の行が 1 つあり、`matcher` を持たず、コマンドが `node` で引数が `${CLAUDE_PLUGIN_ROOT}/scripts/session-start.js`'
      - name: test_run_session_start_when_prompt_files
        case: 正常
        summary: 注入する文をプロンプトファイルから描く
        condition: '`root` が `plugin/`、待ち受けるプロセスの無いポート 8782'
        mock: 行を配列に貯める `stdout`
        expected: '`additionalContext` が変更前の `NOT_LISTENING_CONTEXT` の `{port}` を 8782 にした文と同じ'
      - name: test_run_session_start_when_prompt_missing
        case: 異常
        summary: プロンプトファイルが無い
        condition: '`root` が空の一時フォルダ'
        mock: 行を配列に貯める `stdout`
        expected: 0 を返却し、`stdout` が空
    refs:
      - IF-472-6#
    status: planned
tags:
  - name: topic:フック
    main: true
  - name: tool:claude-code
  - name: topic:サーバー
  - name: action:起動
  - name: action:待ち受け
