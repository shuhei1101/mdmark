id: MOD-472-213
visibility: internal
title: ライブラリ本体 / 描画 / warnings.ts
test_files:
  - tests/unit/src/render/syntax/warnings.test.ts
data_models:
  - name: CollectedWarning
    title: 集めた記載の警告
    container: src/render/syntax/warnings.ts
    summary: 記載の警告 1 つの場所・種類・文
    properties:
      - name: line
        type: number
        description: 警告の元になったマーカー（範囲なら開きのマーカー）の元の行番号（1 から）。マーカーを持たない警告は、警告のトークンの後ろで最初に `map` を持つトークンの開始の行（無ければ前で最後に `map` を持つトークンの終わりの行）
      - name: kind
        type: '"diagram_invalid" | "syntax_warning" | MarkNote["kind"] | MapProblem["kind"]'
        description: map の書き方の警告は項目ごとに 1 件で、項目の `kind`（`line` は範囲の開きのマーカーの行に項目の `line` を足した行）。図の部品の定義の警告は `diagram_invalid`、画面には出さない記法のマーカーの注記は `MarkNote` の `kind`（`unknown_mark_arg`・`legacy_mark`・`mark_option_unapplied`）、ほかは `syntax_warning`（`render` は知らないマーカーに警告を配置しない）
      - name: message
        type: string
        description: 警告の本文と項目を、HTML のタグを除いた文字にして空白 1 つでつないだもの（画面で読み込む文と同じ順）
  - name: MarkNote
    title: マーカーの注記
    container: src/render/syntax/warnings.ts
    summary: 描くときは画面に出さず、点検だけがずれにする記法のマーカーの注記 1 つ
    properties:
      - name: kind
        type: '"unknown_mark_arg" | "legacy_mark" | "mark_option_unapplied"'
        description: '知らないキー（`validateMarkOptions` の `unknownKeys`）・今の書き方の引数（`Mark.source` が `legacy`）・`enabled` を `false` にした機能の列の設定'
      - name: message
        type: string
        description: 'インターフェース定義『設定と索引を点検する』の制約「マーカーの設定の点検」の内容の文（HTML のタグと `` ` `` を除いた文字）'
functions:
  - name: pushWarning
    title: 記載の警告を差し込む
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: 部品『記載の警告』の HTML に `markOwn` を掛けて `html_block` のトークンにし、トークンの `meta.warning` に警告の種類（図の部品の定義は `diagram_invalid`、ほかは `syntax_warning`）・文・警告の元になったマーカーのトークン（範囲なら開きのマーカー）の `map` の開始の行を入れて、指定の位置に差し込む。記載の警告を配置する処理は全て `pushWarning` か `warningBlock` を経由する（今 `renderSyntaxWarning` を直に呼ぶ `src/render/marks.ts`・`src/render/syntax/html.ts` も置き換える。埋め込んだ HTML の中の図の部品の警告は、`warningBlock` が作ったトークンの HTML を範囲の HTML に入れ、その `meta.warning` を範囲の `html_block` の `meta.warnings` に範囲の開きのマーカーの行で並べる。`mount` が拡張を読み込んだ後にブラウザで配置する `src/libraries.ts` の警告はトークンを作らないため対象外）
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: index
        type: number
        required: true
        description: 差し込むトークンの位置
      - name: warning
        type: '{ mark?: string; message: string; items?: WarningItem[]; kind?: "diagram_invalid" | "syntax_warning" | "map"; problems?: MapProblem[]; line?: number }'
        required: true
        description: 部品へ指定する値（文言は画面設計『文書』の記載の警告）。`kind` は省くと `syntax_warning`、`line` は警告の元のマーカーのトークンの `map[0]`（マーカーのトークンを持たない警告は省く）
      - name: source
        type: Token | undefined
        required: false
        description: 警告の元になったマーカーのトークン（範囲なら開きのマーカー）。`warning.line` が無ければ、その `map[0]` を警告の行にする。マーカーを持つ警告は全て指定する（`warningBlock` も同じ）
    side_effects: '`state.tokens` に追加する'
    callees:
      - MOD-472-314#functions[renderSyntaxWarning]
      - MOD-472-311#functions[markOwn]
  - name: collectWarningsRule
    title: 記載の警告を集める
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: markdown-it のコアルール（最後に走る）。`meta.warning` を持つトークン（埋め込んだ HTML の範囲の `html_block` は `meta.warnings` の並び）ごとに、`meta.warning.line`（マーカーの行）を、無ければ後ろで最初に `map` を持つトークンの開始の行（それも無ければ前で最後に `map` を持つトークンの終わりの行）を 1 からの行番号にし、`env.warnings` に `CollectedWarning` を追加する。続けて `env.markNotes` の注記を `CollectedWarning` にし、同じ行は警告の後ろになるよう行の順に合わせる
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it のコアの状態
    returns:
      type: void
      description: '`env.warnings` を書き換える'
    refs:
      - IF-472-39#constraints[記法の点検の場所]
    unit_tests:
      - name: test_collect_warnings_rule
        case: 正常
        summary: マーカーの行を場所にし、マーカーを持たない警告は後ろのブロックの行にする
        condition: '3 行目の `<!-- code: {"highlight": [9]} -->` と直後のコードブロック、10 行目の開きのマーカーから続く読み込めない `<!-- chart -->` の範囲、20 行目の、上の行より 2 階層深い行を持つ `tree` のコードブロック（マーカーを持たない警告）'
        mock: なし
        expected: '`env.warnings` が 3 件で、`line` が `3`・`10`・`20`、`kind` が `syntax_warning`・`diagram_invalid`・`syntax_warning`'
      - name: test_collect_warnings_rule_when_marks
        case: 正常
        summary: 表・ファイルツリー・タブのマーカーの警告を、マーカーの行にする
        condition: '3 行目 `<!-- table: {"kind": "foo"} -->` と表と閉じのマーカー、11 行目 `<!-- tree: {"wrap": 1} -->` と `tree` のコードブロック、20 行目 `<!-- tabs: {"collapse": 1} -->` の範囲'
        mock: なし
        expected: '`env.warnings` の `line` が `3`・`11`・`20`'
      - name: test_collect_warnings_rule_when_mark_notes
        case: 正常
        summary: マーカーの注記を、マーカーの行でその種類にして集める
        condition: '5 行目の `<!-- tabs: {"grop": "os"} -->` と `### macOS`・`### Windows` の範囲、17 行目の今の書き方の `<!-- section: closed -->`'
        mock: なし
        expected: '`env.warnings` が `{ line: 5, kind: "unknown_mark_arg" }`（`message` に `grop` と `group`・`collapse` を含む）と `{ line: 17, kind: "legacy_mark" }` の 2 件'
    status: planned
    introduced:
      pr: 328
  - name: recordMarkNotes
    title: マーカーの注記を記録する
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: 注記を、マーカーの行（1 から）と一緒に `env.markNotes` に記載した順に追加する。トークンは差し込まない（マーカーと直後のブロックの並びを変えない）。`collectWarningsRule` が `env.warnings` に行の順で合わせ、`mdmark check` がずれにする
    args:
      - name: env
        type: RenderEnv
        required: true
        description: 描くときの環境
      - name: options
        type: '{ notes: MarkNote[]; line: number }'
        required: true
        description: '`notes` は追加する注記（空なら何もしない）、`line` はマーカーのトークン（範囲なら開きのマーカー）の `map[0]` に 1 を足した行'
    side_effects: '`env.markNotes` に追加する'
    unit_tests:
      - name: test_record_mark_notes
        case: 正常
        summary: 注記を記録し、画面には出さない
        condition: '3 行目の `<!-- table: {"kind": "data", "features": {"foo": {}}, "size": 2} -->` と表と閉じのマーカーを `renderDocument` に経由する'
        mock: なし
        expected: HTML に `mdmark-syntax-warning`・`foo`・`size` が無く、`warnings` が `kind` が `unknown_mark_arg`・`line` が `3` の 2 件で、`message` が `features.foo`・`size` とその場所で使用できるキーを含む
    callees:
      - '#functions[collectWarningsRule]'
    refs:
      - IF-472-39#constraints[マーカーの設定の点検]
    status: planned
