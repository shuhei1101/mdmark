id: MOD-472-213
visibility: internal
title: ライブラリ本体 / 描画 / warnings.ts
test_files:
  - tests/unit/src/render/syntax/warnings.test.ts
data_models:
  - name: CollectedWarning
    title: 集めた記載の警告
    container: src/render/syntax/warnings.ts
    summary: 記載の警告 1 つの場所・種類・文
    properties:
      - name: line
        type: number
        description: 警告の元になったマーカー（範囲なら開きのマーカー）の元の行番号（1 から）。マーカーを持たない警告は、警告のトークンの後ろで最初に `map` を持つトークンの開始の行（無ければ前で最後に `map` を持つトークンの終わりの行）
      - name: kind
        type: '"diagram_invalid" | "syntax_warning" | "unknown_mark_arg" | MapProblem["kind"]'
        description: map の書き方の警告は項目ごとに 1 件で、項目の `kind`（`line` は範囲の開きのマーカーの行に項目の `line` を足した行）。図の部品の定義の警告は `diagram_invalid`、スキップした記法のマーカーの引数（画面には出さない）は `unknown_mark_arg`、ほかは `syntax_warning`（`render` は知らないマーカーに警告を配置しない）
      - name: message
        type: string
        description: 警告の本文と項目を、HTML のタグを除いた文字にして空白 1 つでつないだもの（画面で読み込む文と同じ順）
  - name: SkippedArg
    title: スキップした引数
    container: src/render/syntax/warnings.ts
    summary: 記法のマーカーの知らない種類・`+機能`・`-機能`・キー・指定の単語 1 つと、そのマーカーで使用できるもの
    properties:
      - name: arg
        type: string
        description: 記載した引数の文字（`+foo`・`size=`・`fold`）。キーは `{キー}=`
      - name: usable
        type: string
        description: そのマーカーで使用できる種類・機能・キー・指定を行内のコードにして `・` でつないだ文字（今の警告の「使用できる…は」の並び）
    status: planned
functions:
  - name: pushWarning
    title: 記載の警告を差し込む
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: 部品『記載の警告』の HTML に `markOwn` を掛けて `html_block` のトークンにし、トークンの `meta.warning` に警告の種類（図の部品の定義は `diagram_invalid`、ほかは `syntax_warning`）・文・警告の元になったマーカーのトークン（範囲なら開きのマーカー）の `map` の開始の行を入れて、指定の位置に差し込む。記載の警告を配置する処理は全て `pushWarning` か `warningBlock` を経由する（今 `renderSyntaxWarning` を直に呼ぶ `src/render/marks.ts`・`src/render/syntax/html.ts` も置き換える。埋め込んだ HTML の中の図の部品の警告は、`warningBlock` が作ったトークンの HTML を範囲の HTML に入れ、その `meta.warning` を範囲の `html_block` の `meta.warnings` に範囲の開きのマーカーの行で並べる。`mount` が拡張を読み込んだ後にブラウザで配置する `src/libraries.ts` の警告はトークンを作らないため対象外）
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: index
        type: number
        required: true
        description: 差し込むトークンの位置
      - name: warning
        type: '{ mark?: string; message: string; items?: WarningItem[]; kind?: "diagram_invalid" | "syntax_warning" | "map"; problems?: MapProblem[]; line?: number }'
        required: true
        description: 部品へ指定する値（文言は画面設計『文書』の記載の警告）。`kind` は省くと `syntax_warning`、`line` は警告の元のマーカーのトークンの `map[0]`（マーカーのトークンを持たない警告は省く）
      - name: source
        type: Token | undefined
        required: false
        description: 警告の元になったマーカーのトークン（範囲なら開きのマーカー）。`warning.line` が無ければ、その `map[0]` を警告の行にする。マーカーを持つ警告は全て指定する（`warningBlock` も同じ）
    side_effects: '`state.tokens` に追加する'
    callees:
      - MOD-472-314#functions[renderSyntaxWarning]
      - MOD-472-311#functions[markOwn]
  - name: collectWarningsRule
    title: 記載の警告を集める
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: markdown-it のコアルール（最後に走る）。`meta.warning` を持つトークン（埋め込んだ HTML の範囲の `html_block` は `meta.warnings` の並び）ごとに、`meta.warning.line`（マーカーの行）を、無ければ後ろで最初に `map` を持つトークンの開始の行（それも無ければ前で最後に `map` を持つトークンの終わりの行）を 1 からの行番号にし、`env.warnings` に `CollectedWarning` を追加する
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it のコアの状態
    returns:
      type: void
      description: '`env.warnings` を書き換える'
    refs:
      - IF-472-39#constraints[記法の点検の場所]
    unit_tests:
      - name: test_collect_warnings_rule
        case: 正常
        summary: マーカーの行を場所にし、マーカーを持たない警告は後ろのブロックの行にする
        condition: '3 行目の `<!-- code: highlight=9 -->` と直後のコードブロック、10 行目の開きのマーカーから続く読み込めない `<!-- flow -->` の範囲、20 行目の、上の行より 2 階層深い行を持つ `tree` のコードブロック（マーカーを持たない警告）'
        mock: なし
        expected: '`env.warnings` が 3 件で、`line` が `3`・`10`・`20`、`kind` が `syntax_warning`・`diagram_invalid`・`syntax_warning`'
      - name: test_collect_warnings_rule_when_marks
        case: 正常
        summary: 表・ファイルツリー・タブのマーカーの警告を、マーカーの行にする
        condition: '3 行目 `<!-- table: foo -->` と表と閉じのマーカー、11 行目 `<!-- tree: wrap=1 -->` と `tree` のコードブロック、20 行目 `<!-- tabs: x=1 -->` の範囲'
        mock: なし
        expected: '`env.warnings` の `line` が `3`・`11`・`20`'
      - name: test_collect_warnings_rule_when_skipped_args
        case: 正常
        summary: スキップした引数を、マーカーの行で unknown_mark_arg にして集める
        condition: '5 行目の `<!-- tabs: grop=os -->` と `### macOS`・`### Windows` の範囲'
        mock: なし
        expected: '`env.warnings` が `{ line: 5, kind: "unknown_mark_arg" }` の 1 件で、`message` に `grop=` と `group=`・`title=` を含む'
    status: planned
    introduced:
      pr: 328
  - name: pushSkippedArgs
    title: スキップした引数を差し込む
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: スキップした引数 1 つにつき、中身が空の `html_block` のトークン（画面には何も出さない）を作り、`meta.warning` に種類 `unknown_mark_arg`・文・`source` の `map[0]` を入れて、指定の位置に記載した順に差し込む。文は `{mark} の {arg} はこのバージョンの mdmark が知らない指定で、描くときはスキップしています。使用できるのは {usable} です。誤記なら名前を修正し、新しいバージョンの指定なら mdmark のバージョンを上げてください。`（HTML のタグと `` ` `` を除いた文字）。`collectWarningsRule` が `env.warnings` に集め、`mdmark check` の `--text`・`--file` だけがずれにする
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: index
        type: number
        required: true
        description: 差し込むトークンの位置
      - name: options
        type: '{ mark: string; skipped: SkippedArg[] }'
        required: true
        description: '`mark` はマーカーの文字、`skipped` はスキップした引数（空なら何も差し込まない）'
      - name: source
        type: Token | undefined
        required: false
        description: マーカーのトークン（範囲なら開きのマーカー）。その `map[0]` を場所にする
    side_effects: '`state.tokens` に追加する'
    unit_tests:
      - name: test_push_skipped_args
        case: 正常
        summary: スキップした引数ごとに中身の空のトークンを差し込み、画面には出さない
        condition: '3 行目の `<!-- table: data +foo size=2 -->` と表と閉じのマーカーを `renderDocument` に経由する'
        mock: なし
        expected: HTML に `mdmark-syntax-warning`・`+foo`・`size=` が無く、`warnings` が `kind` が `unknown_mark_arg`・`line` が `3` の 2 件で、`message` が `+foo`・`size=` と使用できる機能・キーを含む
    callees:
      - '#functions[collectWarningsRule]'
    refs:
      - IF-472-39#constraints[記法の点検]
    status: planned
  - name: skippedArgBlocks
    title: スキップした引数のトークンを作る
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: '`pushSkippedArgs` と同じトークンを、差し込まずに記載した順の並びで返却する（トークンの並びを再作成するコアルールが、警告の `warningBlock` と同じく差し込む位置を決めるときに使用する）。`pushSkippedArgs` はこの並びを `index` の位置に差し込む'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: options
        type: '{ mark: string; skipped: SkippedArg[] }'
        required: true
        description: '`pushSkippedArgs` と同じ'
      - name: source
        type: Token | undefined
        required: false
        description: '`pushSkippedArgs` と同じ'
    returns:
      type: Token[]
      description: スキップした引数 1 つにつき 1 つのトークン
    callees:
      - '#functions[collectWarningsRule]'
    status: planned
