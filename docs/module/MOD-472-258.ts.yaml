id: MOD-472-258
visibility: internal
title: ライブラリ本体 / 索引と用語 / matches.ts
test_files:
  - tests/unit/src/knowledge/matches.test.ts
data_models:
  - name: MdmarkMatchTarget
    title: 参照先
    container: src/knowledge/matches.ts
    role: DTO
    summary: '`collectMatches` が返却する参照先 1 つ（公開の型）'
    properties:
      - name: kind
        type: '"term" | "glossary" | "doc" | "alias"'
        description: 参照先の種類。`term` は索引の用語、`glossary` は用語集の表の用語、`doc` は別名が一致した文書、`alias` は指定したエイリアス
      - name: id
        type: string
        description: '`term` は `terms[].id`、`glossary` は `glossary:{表を持つ文書の id}:{用語}`、`doc` は `docs[].id`、`alias` はエイリアスの `id`'
      - name: title
        type: string
        description: '`term` は `terms[].term`、`glossary` は用語の列、`doc` は `docs[].title`、`alias` はエイリアスの `name`'
      - name: description
        type: string | undefined
        description: '`term` は `terms[].meaning`、`glossary` は意味の列、`doc` は `docs[].description`、`alias` はエイリアスの `description`。無いときはキーを持たない'
      - name: aliasType
        type: Exclude<MdmarkAliasType, "avoid"> | undefined
        description: エイリアスの `alias_type`。`kind` が `alias` のときだけ持つ
  - name: MdmarkMatch
    title: 本文の一致
    container: src/knowledge/matches.ts
    role: DTO
    summary: 本文の 1 つの一致とその参照先（公開の型）
    inherits: MdmarkMatchTarget
    properties:
      - name: text
        type: string
        description: 一致した辞書の単語。索引・用語集の表に記載した表記で、本文の表記とは限らない（本文の表記は `line`・`start`・`end` で参照する）
      - name: line
        type: number
        description: 本文の Markdown の行（1 から）
      - name: start
        type: number
        description: その行の中の始まり（0 から数える UTF-16 の位置）
      - name: end
        type: number
        description: その行の中の終わり（含まない）。実体参照やエスケープで記載した文字は、本文に記載したままの範囲を指す
  - name: MdmarkMatches
    title: 本文の参照
    container: src/knowledge/matches.ts
    role: DTO
    summary: '`collectMatches` の戻り値（公開の型）'
    properties:
      - name: byDocument
        type: Record<string, MdmarkMatch[]>
        description: 文書の `id` から、本文の一致を本文の頭からの順（行の順、同じ行は `start` の順）に並べたもの。本文のある索引の文書だけをキーに持つ
      - name: targets
        type: MdmarkMatchTarget[]
        description: 全ての文書の参照先を `kind` と `id` の組で重なりを除いたもの。索引の `docs` の順に文書を確認して、文書の中の初出の順
      - name: avoided
        type: Record<string, MdmarkAvoidedMatch[]>
        description: 文書の `id` から、本文に出たやめた言い方を本文の頭からの順に並べたもの。キーは `byDocument` と同じで、やめた言い方が無い文書と `glossary` がオフの文書は空の並び
  - name: MdmarkAvoidedMatch
    title: やめた言い方の一致
    container: src/knowledge/matches.ts
    role: DTO
    summary: 本文に出たやめた言い方 1 つと代わりの用語（公開の型）
    properties:
      - name: kind
        type: '"term" | "glossary" | "alias"'
        description: 代わりの用語の種類。`MdmarkMatchTarget` の `term`・`glossary` と同じ。`alias` は `term` の種類のエイリアスの `avoid` か `avoid` の種類のエイリアスで、`avoid` の種類は `title` を `replacement` にし `description` を持たない
      - name: id
        type: string
        description: 代わりの用語の ID。`MdmarkMatchTarget` の `id` と同じ記載方法
      - name: title
        type: string
        description: 代わりの用語のタイトル。`MdmarkMatchTarget` の `title` と同じ記載方法
      - name: description
        type: string | undefined
        description: 代わりの用語の意味。`MdmarkMatchTarget` の `description` と同じ記載方法。無いときはキーを持たない
      - name: text
        type: string
        description: 一致したやめた言い方。`MdmarkMatch` の `text` と同じく記載した表記
      - name: line
        type: number
        description: '`MdmarkMatch` の `line` と同じ'
      - name: start
        type: number
        description: '`MdmarkMatch` の `start` と同じ'
      - name: end
        type: number
        description: '`MdmarkMatch` の `end` と同じ'
      - name: aliasType
        type: '"term" | "avoid" | undefined'
        description: エイリアスの `alias_type`。`kind` が `alias` のときだけ持つ
functions:
  - name: collectMatches
    title: 本文の参照を取り出す
    container: src/knowledge/matches.ts
    kind: 関数
    scope: public
    summary: 索引と文書の本文から、文書ごとの本文の一致と、重なりを除いた参照先を返却する
    description: '`normalizeIndex` で合う文書・用語だけを使用する。本文のある索引の文書を `parseDocument` で 1 回ずつ読み込み、`glossary` がオンの文書の用語集の表の用語を集めて（`collectReferences` の `glossary` と同じ並び）、文書ごとに `buildDictionary`（`docId` に照合する文書、`ownGlossary` にその文書の表、`aliases` に `input.aliases`、`features` に文書のマーカーを重ねた機能）で辞書を作る。辞書の用語が `alias` を持つ一致は、参照先を `kind` `alias`・`aliasType` にその `alias_type`・`id` にエイリアスの `id`・`title` に `name`・`description` に `description`（無ければキーを持たない）にする。`avoided` の代わりの用語が `alias` を持つときは、`kind` `alias`・`aliasType` にその `alias_type`・`id` にエイリアスの `id`・`title` に代わりの用語の単語・`description` に意味（`avoid` の種類はキーを持たない）にする。地の文は `forEachInline`・`matchableChildren` の `text` の子を `findWords` で照合して `inlineOffsets` で本文の位置へ戻し、`html` がオンなら `embeddedHtmlMatches`、`diagrams` がオンなら `diagramTermMatches`、`map` がオンなら `mapTermMatches` の一致を追加する。辞書の `avoided` が空でない文書は、`words` に `avoided` の単語を加えた辞書で地の文と（`html` がオンなら）埋め込んだ HTML をもう 1 度照合し、`avoided` の単語の一致だけを、`avoided` の用語の `id` で参照した参照先と位置つきで `avoided` に入れる（`byDocument`・`targets` には入れない）。`collectReferences` を呼ばず、本文を 2 回解析しない。一致の `text` は、一致した単語を辞書の `written` で参照した索引・用語集の表に記載した表記'
    args:
      - name: input
        type: '{ index: MdmarkIndex; documents: Record<string, string>; config?: MdmarkConfig; aliases?: MdmarkAlias[] }'
        required: true
        description: 索引・文書のパスから本文を参照する表・設定・エイリアス
    returns:
      type: MdmarkMatches
      description: 文書ごとの一致と、まとめた参照先
    callees:
      - 'MOD-472-254#functions[normalizeIndex]'
      - 'MOD-472-257#functions[buildDictionary]'
      - 'MOD-472-257#functions[findWords]'
      - 'MOD-472-267#functions[inlineOffsets]'
      - '#functions[embeddedHtmlMatches]'
      - '#functions[diagramTermMatches]'
      - '#functions[mapTermMatches]'
    unit_tests:
      - name: test_collect_matches
        case: 正常
        summary: 索引の用語・別名と文書の別名の一致を、参照先と位置つきで返却する
        condition: インターフェース定義『本文の参照を取り出す』のリクエスト例
        mock: なし
        expected: レスポンス例と等しく、引数が書き換わっていない
      - name: test_collect_matches_lists_every_occurrence
        case: 正常
        summary: 同じセクションに同じ用語が何度出ても全ての出現を並べ、`targets` には 1 回だけ入れる
        condition: 1 つの段落に `ワークスペース` を 2 回と `WS` を記載した本文
        mock: なし
        expected: '`byDocument.guide` が 3 件、`targets` が `ws` の 1 件'
      - name: test_collect_matches_ignores_code_links_and_headings
        case: 正常
        summary: コード・リンクの文字・見出し・用語集の表の中の単語と、文書自身の別名を一致にしない
        condition: 見出し・行内のコード・リンクの文字に `ワークスペース` を記載し、`api` の本文に自身の別名 `公開関数` を記載する
        mock: なし
        expected: どの箇所も一致に入らない
      - name: test_collect_matches_when_glossary_table
        case: 正常
        summary: ほかの文書の用語集の表の用語を `glossary` の参照先として返却する
        condition: '`用語集.md` の表に用語 `マーカー`、`guide` の本文に `マーカー` と `印刷`'
        mock: なし
        expected: '`guide` が `glossary:glossary:マーカー` の 1 件だけを持ち、`用語集.md` の表の中の `マーカー` は入らない'
      - name: test_collect_matches_when_disabled
        case: 正常
        summary: 文書のマーカーでオフにした機能の種類の一致を返却しない
        condition: '`guide` に `<!-- features: {"glossary": false} -->`、`memo` に `<!-- features: {"glossary": false, "backlinks": false} -->`'
        mock: なし
        expected: '`guide` は `doc` の要素だけ、`memo` は空'
      - name: test_collect_matches_when_invalid_index
        case: 正常
        summary: Schema に合わない用語・文書を除いて照合し、例外を投げない
        condition: '`meaning` を持たない用語と `path` を持たない文書を持つ索引'
        mock: なし
        expected: 例外を投げず、合わない用語と文書の一致が入らない
      - name: test_collect_matches_when_diagram_term_is_alias
        case: 正常
        summary: 図の部品の `{{単語}}` は、単語が文書の別名でもあるときも用語の参照先だけを返却する
        condition: 索引に用語 `公開関数`（`fn`）と、別名 `公開関数` を持つ文書 `api`。`guide` の `<!-- er -->` の定義のテーブルの `label` に `{{公開関数}}`
        mock: なし
        expected: '`{{公開関数}}` の位置は `term` の `fn` の 1 件だけで、`targets` に `api` が入らない'
      - name: test_collect_matches_ignores_avoided_terms
        case: 正常
        summary: 本文に出たやめた言い方を一致にも参照先にも入れない
        condition: 用語 `ワークスペース`（`ws`、`avoid` に `作業場`）と、`guide` の本文に `ワークスペース` と `作業場`
        mock: なし
        expected: '`byDocument.guide` が `ワークスペース` の 1 件だけで、`作業場` の位置が無い'
      - name: test_collect_matches_returns_avoided_terms
        case: 正常
        summary: 本文に出たやめた言い方の全ての出現を、代わりの用語と位置つきで `avoided` に返却する
        condition: 用語 `ワークスペース`（`ws`、`avoid` に `作業場`）と、`guide` の 1 つの段落に `作業場` を 2 回、見出しと行内のコードに `作業場`、`api` の本文に `ワークスペース`
        mock: なし
        expected: '`avoided.guide` が段落の 2 件だけを持ち、各要素が `kind` `term`・`id` `ws`・`text` `作業場` で、位置で切り出した本文が `作業場`。`avoided.api` が空の並び'
      - name: test_collect_matches_when_avoided_contains_term
        case: 正常
        summary: 用語を含む長いやめた言い方が出ても、`byDocument` はやめた言い方を加えない照合のまま変えない
        condition: 用語 `ワークスペース`（`ws`、`avoid` に `共有ワークスペース`）と、`guide` の本文に `共有ワークスペース`
        mock: なし
        expected: '`byDocument.guide` が `共有ワークスペース` の中の `ワークスペース` の 1 件を持ち、`avoided.guide` が `共有ワークスペース` の 1 件を持つ'
      - name: test_collect_matches_when_avoided_and_glossary_disabled
        case: 正常
        summary: '`glossary` がオフの文書はやめた言い方を返却しない'
        condition: '用語 `ワークスペース`（`ws`、`avoid` に `作業場`）と、頭に `<!-- features: {"glossary": false} -->` を記載し段落に `作業場` を記載した `guide` の本文'
        mock: なし
        expected: '`avoided.guide` が空の並び'
      - name: test_collect_matches_when_notation_differs
        case: 正常
        summary: 表記の違う単語の一致を、本文の位置と記載した表記の `text` で返却する
        condition: インターフェース定義『本文の参照を取り出す』の「正常系（表記の違う単語）」の索引と文書
        mock: なし
        expected: '`byDocument`・`targets`・`avoided` がそのフローの期待値と等しい'
      - name: test_collect_matches_when_aliases
        case: 正常
        summary: 指定したエイリアスの一致を alias の参照先として返却し、avoid の種類を avoided に返却する
        condition: インターフェース定義『本文の参照を取り出す』の「正常系（エイリアス）」の索引・エイリアス・本文
        mock: なし
        expected: '`byDocument`・`targets`・`avoided` がそのフローの期待値と等しく、引数が書き換わっていない'
      - name: test_collect_matches_when_diagram_term_is_alias_word
        case: 正常
        summary: 図の部品の `{{単語}}` はエイリアスを参照しない
        condition: '`aliases` に `term` の `公開関数`（`fn`）だけを指定し、索引に用語が無い。`guide` の `<!-- er -->` の定義のテーブルの `label` に `{{公開関数}}`、段落に `公開関数`'
        mock: なし
        expected: '`byDocument.guide` が段落の `公開関数` の 1 件だけで、`{{公開関数}}` の位置が無い'
    refs:
      - IF-472-36#
  - name: embeddedHtmlMatches
    title: 埋め込んだ HTML の文字を照合する
    container: src/knowledge/matches.ts
    kind: 関数
    scope: internal
    summary: '`<!-- html -->` の範囲の `html` のコードブロックの文字を、描くときと同じ範囲で照合し、本文の位置を返却する'
    description: 範囲の見つけ方は `buildEmbeddedHtml` と同じ。図の部品の custom element を除いた HTML を `sanitizeEmbedded` に経由し、文字を受け取る関数で受けた文字（`termsFilter` と同じく、`a`・`code`・`pre`・`button`・見出しが直接持つ文字を除き、逃がした文字を戻す）のうち、`sanitizeEmbedded` の出力に残ったもの（要素ごと落ちる要素の文字を除く）を `findWords` で照合する。位置は、コードブロックの中身を `maskEmbeddedHtml` で伏せた本文へ、中身の頭から順に `alignText` で適用して戻す。伏せた文字はどの文字にも該当しないため、属性の値・中身ごと落ちる要素・照合しない要素の中の同じ綴りを取り違えない
    args:
      - name: options
        type: '{ body: string; tokens: Token[]; dictionary: Dictionary }'
        required: true
        description: 本文・本文のトークン・辞書
    returns:
      type: 'Array<{ word: string; offset: number; end: number }>'
      description: 一致した単語と、本文の頭からの始まりと終わり
    callees:
      - 'MOD-472-257#functions[findWords]'
      - 'MOD-472-267#functions[maskEmbeddedHtml]'
      - 'MOD-472-267#functions[alignText]'
    unit_tests:
      - name: test_embedded_html_matches
        case: 正常
        summary: HTML の文字の用語の位置だけを返却し、属性の値・落ちる要素・照合しない要素が直接持つ同じ綴りは返却せず、その要素の中の入れ子の文字は返却する
        condition: '`<!-- html -->` の範囲に、`<p>&amp;&lt;b&gt; の後ろのワークスペース</p>`・`<span title="ワークスペース">ワークスペース</span>`・`<script>ワークスペース</script>WS`・`<code>ワークスペース</code> とワークスペース`・`<a href="#">ワークスペース</a>`・`<a href="#"><span>ワークスペース</span></a>` の行'
        mock: なし
        expected: '`p` の文字・`span` の要素の文字・`script` の後ろの `WS`・`code` の後ろの文字・`a` の中の `span` の文字の 5 件だけで、本文の行を切り出した文字が一致した文字と同じ'
  - name: diagramTermMatches
    title: 図の部品の用語を照合する
    container: src/knowledge/matches.ts
    kind: 関数
    scope: internal
    summary: 図の部品（`chart`・`param`・`er`）の範囲の定義と、埋め込んだ HTML の中の custom element（`<mdmark-chart>`・`<mdmark-param>`）の定義の `{{単語}}` のうち、意味のある用語の位置を返却する。廃止した `flow`・`sequence` の範囲と `<mdmark-flow>`・`<mdmark-sequence>` は照合しない
    description: 範囲の見つけ方は `buildDiagrams`（マーカーの範囲の `json` のコードブロック）と `takeParts`（`PART_PATTERN`）と同じ。定義の JSON の文字列を戻して `{{単語}}` を探し、単語を `dictionary.term` で正規化して参照した用語の意味が空でないものだけを返却する（`lookup` と同じ。文書の別名は参照しない）。位置は JSON のエスケープ（`\"`・`ア`）を数えて本文の位置へ戻す
    args:
      - name: options
        type: '{ body: string; tokens: Token[]; dictionary: Dictionary; html: boolean }'
        required: true
        description: 本文・本文のトークン・辞書・埋め込んだ HTML の機能がオンか
    returns:
      type: 'Array<{ word: string; offset: number; end: number }>'
      description: 一致した単語と、本文の頭からの始まりと終わり
    unit_tests:
      - name: test_diagram_term_matches
        case: 正常
        summary: 定義の `{{単語}}` の用語の位置を返却し、用語でない単語は返却しない
        condition: '`<!-- er -->` の定義のテーブルの `label` に JSON のエスケープの後ろの `{{ワークスペース}}` と `{{公開関数}}`、`<!-- html -->` の中の `<mdmark-chart>` の系列の名前に `{{ワークスペース}}`、`<!-- flow -->` の範囲のノードの `name` に `{{ワークスペース}}`'
        mock: なし
        expected: '`ワークスペース` の 2 件だけ（`flow` の範囲の 1 件は入らない）で、本文の行を切り出した文字が `ワークスペース`'
      - name: test_diagram_term_matches_when_notation_differs
        case: 正常
        summary: 表記の違う `{{単語}}` も用語の位置として返却する
        condition: 索引の用語 `MCP`。`<!-- er -->` の定義のテーブルの `label` に `{{ｍｃｐ}}`
        mock: なし
        expected: 1 件で、本文の行を切り出した文字が `ｍｃｐ`
  - name: mapTermMatches
    title: map の範囲の用語を照合する
    container: src/knowledge/matches.ts
    kind: 関数
    scope: internal
    summary: map の範囲の `mermaid` のブロックの、ノード・参加者の名前とメッセージ・ノートの文のうち、意味のある用語の位置を返却する
    description: 範囲の見つけ方は `buildMapRanges`（`map` のマーカーの範囲の情報文字列が `mermaid` のコードブロック）と同じ。Mermaid を図の読み取り（`dist/map.js`）に頼らず、行ごとの字句で照合する文字を取る。`flowchart`（`graph`）は角括弧・丸括弧・波括弧・`|` で囲んだラベルと `"` で囲んだ文字、`sequenceDiagram` は `participant`・`actor` の `as` の後ろと、メッセージ・`Note` の行の `:` の後ろ。取った文字を `findWords` で照合し、`dictionary.term` で参照した用語の意味が空でないものだけを返却する（`data-map-terms` と同じく、エイリアスと文書の別名は参照しない）。位置はコードブロックの中身の行と列から本文の位置へ戻す
    args:
      - name: options
        type: '{ body: string; tokens: Token[]; dictionary: Dictionary }'
        required: true
        description: 本文・本文のトークン・辞書
    returns:
      type: 'Array<{ word: string; offset: number; end: number }>'
      description: 一致した単語と、本文の頭からの始まりと終わり
    callees:
      - MOD-472-257#functions[findWords]
    refs:
      - IF-472-36#constraints[照合する範囲]
    unit_tests:
      - name: test_map_term_matches
        case: 正常
        summary: ノードの名前の用語の位置を返却し、ID・文書の別名・範囲の外は返却しない
