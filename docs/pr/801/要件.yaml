use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-67.yaml
    impact: changed
    detail: 表のセルの中の動画と、モーダルで再生する属性を記載した段落の動画を、その場に再生バーを出さずに描くシナリオを追加する。属性を記載しない段落の動画は今までどおり
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-66.yaml
    impact: run_only
    detail: 動画・音声のモーダルが画像のライトボックスのダイアログと開き方・閉じ方を共有するため、画像の拡大と切り替えを壊しうる
    depends_on:
      - docs/scenario/SC-472-67.yaml
  - kind: single
    scenario: docs/scenario/SC-801-1.yaml
    impact: new
    detail: 読者が再生のボタンを押して動画・音声を全画面のダイアログで再生し、閉じると再生が止まって押したボタンへ戻る。画像の切り替えの並びに動画を含めない
    depends_on:
      - docs/scenario/SC-472-67.yaml
  - kind: single
    scenario: docs/scenario/SC-472-58.yaml
    impact: changed
    detail: モーダルにした動画を印刷すると、その場所にラベルが文字で出て、再生バーとダイアログが出ないシナリオを追加する
    depends_on:
      - docs/scenario/SC-472-67.yaml
  - kind: single
    scenario: docs/scenario/SC-472-31.yaml
    impact: changed
    detail: プレビューで表のセルの中の相対パスの動画をモーダルで開き、再生できるシナリオを追加する
    depends_on:
      - docs/scenario/SC-472-67.yaml
