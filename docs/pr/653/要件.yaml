use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: 'map の範囲に gantt・timeline・gitGraph・journey・block-beta の Mermaid と補足を記載すると、日付・記載順の軸か columns の格子に沿って描き、補足の説明を当てる。項目の選択でつながりを強調し、読めない行を書き方の警告にし、描けない種類の案内の文言に 5 種類を加える。flowchart の click の id: のリンク先を、決めた方法でノードのリンクにする'
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: gantt・timeline・journey の section と、ブロック図の入れ子のブロックを開閉し、中へ入ってその中だけを読み、戻る
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: ガントチャート・タイムライン・Git グラフ・ジャーニーを、記載順に 1 歩ずつ再生して項目を強調する
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: changed
    detail: map の範囲の外の 5 種類のコードブロックを、補足の無い map の図にする。5 種類だけの文書では mermaid のライブラリを読み込まない。mermaid の読み込み・テーマ・設定を確かめる題材を gantt から pie に替える
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: '5 種類の map の補足が無い項目を指すとき・キーで指せない項目があるときを点検のずれにし、flowchart の click の id: のリンク先を決めた方法で点検する'
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: run_only
    detail: ツールチップの記述は変わらないが、5 種類の項目にも補足の説明を出すため壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: map が描けない種類の拡大・リサイズ・全画面の題材を、map で描くようになる gantt から xychart-beta に替える。軸と格子の配置の図にも同じ操作を付ける
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: run_only
    detail: シーケンス図の参加者の選択の記述は変わらないが、選択と強調・再生の処理を種類で共通にしているため壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図の種類に依らない流れで記述は変わらないが、map の読み取り・配置・操作とノードのリンクを広げるため壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-6.yaml
    impact: changed
    detail: mermaid の手元のコピーを読み込む題材を、map で描くようになる gantt から map が描かない pie に替える
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-26.yaml
    impact: changed
    detail: テーマの配色を確かめる mermaid の図の題材を、gantt から pie に替える
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-56.yaml
    impact: changed
    detail: HTML に書き出す mermaid の図の題材を、gantt から pie に替える
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-10.yaml
    impact: changed
    detail: プレビューで mermaid を設定の配信から読み込む題材を、gantt から pie に替える
    depends_on:
      - docs/scenario/SC-472-8.yaml
