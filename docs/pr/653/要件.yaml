scope_out:
  - item: 案内の帯の手順のバー・手順ごとの再生と速度・なめらかな移動
    reason: 再生の帯そのものの機能の追加で、5 種類の再生は今の帯の操作で足りる
    plan: '#603'
  - item: map のクラス図の click {クラス} href "{URL}" のリンク
    reason: 'クラス図のリンクの退行で、flowchart の id: のリンク先と事象が別'
    plan: '#650'
  - item: map を Markdown へ書き出すときの 5 種類の扱い
    reason: '[mdmark の文書を、MCP と CLI で純粋な Markdown（GFM と Mermaid）に書き出す](https://github.com/shuhei1101/mdmark/issues/313) は Mermaid のブロックを残して補足を削除する方式で、種類が増えても変わらない'
    plan: '#313'
