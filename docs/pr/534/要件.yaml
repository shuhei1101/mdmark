scope_out:
  - item: 既存の文書（mdmark の使い方集のほか、mdmark を使う各リポジトリ）の flow・sequence を、用意した変換で map へ書き換える移行
    reason: 変換を使う側の作業で、この Issue では変換と廃止までを扱う。ただし、このリポジトリの使い方集・見本・設計書の図は、廃止で描けなくなるためこの PR で書き換える（更新ドキュメント）
    plan: '#290'
  - item: 今の flow・sequence を純粋な Markdown の Mermaid へ書き出す機能
    reason: 'この PR で flow・sequence を廃止するため、書き出す元が無くなる。map の書き出しは #313 で扱う'
    plan: '#313'
  - item: map 以外の部品に残る分野に寄った固定の語の洗い出しと、使う側の設定で作る形への置き換え
    reason: flow・sequence（判定フローチャートを含む）の固定のノードの種類・線の名前は、変換で設定の `map.kinds`・`map.lines` に移り廃止で消える。残る部品の洗い出しは別の題材
    plan: '#470'
  - item: map が描く見た目に使っている今のフロー図・シーケンス図の部品（ノード・線の交差の飛び越え・ツールチップ）の削除
    reason: map の描画が使い続けるため残す。部品設計でフロー図・シーケンス図の部品（CMP-472-28・19）を削除し、モジュール構成設計で `renderFlow` を map の構成図のノードと線を描く処理に絞った（枠・層・判定フローチャートの形・`renderSequence` は削除する）
    plan: none
  - item: 変換で座標（`x`・`y`・`col`・`row` など）を補足の `layout` の座標の固定へ写して元の配置を再現すること
    reason: map は自動配置を既定にし、座標の固定は配置を上書きしたいときだけ使う。変換は座標と大きさを写さず、報告にも挙げない（単一ユースケース設計のレビューで合格）
    plan: none
  - item: 今のフロー図のグループのタイトルを留める機能（`stickyTitles`）を map に移すこと
    reason: ユーザーの判断で map に移さず廃止する（確認ログ）。map は中へ入る・開閉でグループを辿る。変換では落として変換の報告に挙げる
    plan: none
  - item: 変換で、今の図の題の行の範囲・更新日を map へ写すこと
    reason: '#445 の資料 A-38 で、map の図の題の行には題だけを出し、凡例は出さないと決めている。写す先が無い値として落とし、変換の報告に挙げる（凡例は定義の値ではなく、描くときに種類から作るため報告に挙げない）'
    plan: none
  - item: map の図の説明のツールチップに、設定の `features.hints`（まとめて削除する）と `tooltips.diagramPlacement`（上を先にする）を当てること
    reason: ユーザーの判断で、この PR では適用せず別の Issue にする（確認ログ）。今の map はどちらの設定も参照せず、説明を常に下を先に出す
