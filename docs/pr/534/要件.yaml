use_cases:
  - kind: composite
    scenario: docs/scenario/SC-472-93.yaml
    impact: changed
    detail: 見本の図の文書のフロー図を map の構成図に置き換え、描いた図を確かめる流れを map の見た目で確かめる形にする
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-89.yaml
    impact: changed
    detail: チャートと並べて置く `<!-- flow -->` のフロー図を map の構成図に置き換える
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-88.yaml
    impact: changed
    detail: プレビューと書き出した HTML で確かめるフロー図を map の構成図に置き換える
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: map の図を辿る流れは変えないが、map が使う今のフロー図・シーケンス図の見た目の部品を残す範囲を誤ると壊れる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-43.yaml
    impact: changed
    detail: 座標で記載するフロー図・シーケンス図を描く流れを削除し、`flow`・`sequence` の範囲には描かずに map へ変換できる旨の書き方の警告を出す流れにする。グラフ・操作できる部品・ER 図の流れは残す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-27.yaml
    impact: changed
    detail: バージョンを上げると、文書の `flow`・`sequence` の定義が map の範囲（Mermaid と補足）へ書き換わり、設定に種類が加わる流れを追加する。座標の重なるフロー図を使う流れは map の図に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: フロー図の定義の誤り・配置のずれ・`frame.hint` の型の点検の流れを削除し、`flow`・`sequence` を記載した文書に map へ変換できる旨を知らせる流れにする
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-52.yaml
    impact: changed
    detail: 文字列の中のフロー図の定義の点検を、map の範囲か `flow`・`sequence` の廃止の警告の点検に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: changed
    detail: ツールチップを確かめる図をフロー図から map の構成図（補足の `notes` の線・ノード・グループの説明）に置き換える。グループの説明のマーカーを追加する。`features.hints` と `tooltips.diagramPlacement` を確かめる流れは ER 図と `data-hint` に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 拡大・縮小の正常シナリオとリサイズハンドルを map の構成図（等倍より縮めず、動かす矢印のボタンを持たない）に、ドラッグと文字の選択・矢印キーとボタンを ER 図に置き換える。グループのタイトルを留める・留めないと、リンク先を持つノードの上のドラッグのシナリオを削除する（リンク先を持つノードのドラッグは SC-472-8）
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-44.yaml
    impact: changed
    detail: 固有の部品と並べて置くフロー図を map の構成図に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-25.yaml
    impact: changed
    detail: テーマの上書きを確かめるフロー図を map の構成図に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-62.yaml
    impact: changed
    detail: リサイズハンドルの機能を解除して確かめるフロー図を map の構成図に置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-13.yaml
    impact: changed
    detail: まとめた HTML でリンク先を持つフロー図のノードから文書を移る流れを、map のノードのリンクに置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-31.yaml
    impact: changed
    detail: プレビューでリンク先を持つフロー図のノードを開く流れを、map のノードのリンクに置き換える
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-60.yaml
    impact: changed
    detail: HTML の中の `<mdmark-flow>` と `flow` の図の `{{単語}}` の取り出しを削除し、map の範囲のノードの名前の用語を辞書の照合で参照にする流れにする
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-10.yaml
    impact: following
    detail: プレビューに描く文書のフロー図を map の構成図に置き換える記述に追随する
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-6.yaml
    impact: following
    detail: 書き出した HTML に描かれるフロー図を map の構成図に置き換える記述に追随する
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-77.yaml
    impact: following
    detail: プレビューに描かれるフロー図を map の構成図に置き換える記述に追随する
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: map の構成図のノードが Mermaid の `click` のリンク先を持ち、押すとリンク先へ移る流れ（正常シナリオ（リンク先を持つノード））と、許可しないリンク先を開かない流れ（異常シナリオ（ノードのリンク先を許可しない））を追加する。「今のフロー図と同じ部品で描く」の記述を、廃止の後に残す見た目の部品の呼び名に追随させる
    depends_on:
      - docs/scenario/SC-472-43.yaml
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: run_only
    detail: map のシーケンスの再生は変えないが、今のシーケンス図の部品を削る範囲を誤ると壊れる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: run_only
    detail: map のシーケンス図の参加者の強調は変えないが、今のシーケンス図の部品を削る範囲を誤ると壊れる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: run_only
    detail: map のグループとブロックの開閉は変えないが、今の図の部品を削る範囲を誤ると壊れる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-477-2.yaml
    impact: new
    detail: 座標で書いたフロー図とシーケンス図を、描いた文書の警告と点検の案内から移行の手順で map へ書き換え、移せなかった図を手で記載し直して map の図で描く
    depends_on: []
