use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-67.yaml
    impact: changed
    detail: 文書の作成者が、設定の既定の幅（本文の幅に対する %）で動画をまとめて小さく描ける。動画ごとの {width=…} を優先する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-801-1.yaml
    impact: run_only
    detail: 再生のボタンで再生する動画にはリサイズハンドルを付けないため記述は変わらないが、同じ部品を変えるため再生のダイアログの開閉を確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-82.yaml
    impact: changed
    detail: 配布ファイルの上限を超える変更が、作業 PR で実行する結合テストで分かる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-805-1.yaml
    impact: new
    detail: 読者が段落の動画の大きさを、縦横の比率を保ったまま変えて元に戻す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-805-2.yaml
    impact: new
    detail: develop の配布物の再作成で @develop のキャッシュを削除し、失敗したら対応を依頼する Issue を起票し、手動でも再作成できる
    depends_on: []
