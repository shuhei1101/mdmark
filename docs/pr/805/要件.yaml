scope_out:
  - item: 配布ファイル 1 つの上限（NFR-1 の 1024KB）の値の変更と、dist/index.js を小さくする作業
    reason: '要望は上限の超過をマージの前に分かるようにすることで、値は #802 の中で利用者が上げたため'
    plan: none
  - item: 音声と、再生のボタン（表のセルの中・modal・thumbnail）で出す動画のリサイズハンドル
    reason: 要望は段落に埋め込んだ動画が本文の幅いっぱいに出ることで、音声は縦横の比率を持たず、再生のボタンは全画面のダイアログで再生するため
    plan: none
  - item: 図の枠のリサイズハンドルの押せる範囲（24px に足りない）と、ドラッグの代替のタップ・クリックの手段
    reason: 規約『レイアウト』のタップ領域と規約『操作とアクセシビリティ』の 2.5.7 から外れているが、要望は動画のリサイズハンドルで、図の枠は含まれない
    plan: '#806'
  - item: 部品『media』のモックで refs/263/assets/media.js がライトボックスに無いボタンを探して出るスクリプトのエラー
    reason: この PR の変更より前から起きる不具合で、要望に含まれない
    plan: '#807'
