    plan: none
  - item: スキーマ `schemas/scenario.schema.yaml`・`schemas/test-procedure.schema.yaml` の E2E の記述
    reason: E2E を作り直すときにも使用する型で、スキーマを変えると移行の手順が要る
    plan: none
