  - item: E2E を確かめる手段として挙げる記述（非機能要件 NFR-472-1 の測定方法、アーキテクチャ図 ARCH-472-1 の `tests/` の説明と dev-docs の確認、IF-472-41・LIB-472-1・LIB-472-8・LIB-472-33 の「E2E で確認する」、`docs/scenario/README.md`・`docs/index.yaml` の「E2E テストの元」）
