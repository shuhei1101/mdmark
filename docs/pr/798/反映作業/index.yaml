端末の設定の直コミットできる種類の登録:
  説明: project-index の端末の設定（~/.config/project-index/settings.yaml）の配信元 mdmark の行に、書き込みの API から直コミットできる種類（sources[].direct_commit.write_api_kinds。配信元の設定の direct_commit.kinds の全ての種類）を、端末の設定の API（PATCH /settings/sources/mdmark）で送信して登録し、配信元を再読み込みさせる。実行は送信の前の write_api_kinds を ~/.config/project-index/mdmark-write_api_kinds.bak-{日時}.json に記録し、切り戻しは最新の記録の値を送信する
  タグ: [端末の設定, 直コミット]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 端末の設定の直コミットできる種類の登録/疎通確認.py
  実行: 端末の設定の直コミットできる種類の登録/実行.py
  確認: 端末の設定の直コミットできる種類の登録/確認.py
  切り戻し: 端末の設定の直コミットできる種類の登録/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 端末の設定の API（GET /settings/sources）の配信元 mdmark の行の directCommit.writeApiKinds が、配信元の設定の direct_commit.kinds の全ての種類を持つ
  状態: skipped
