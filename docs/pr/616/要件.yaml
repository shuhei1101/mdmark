scope_out:
  - item: mdmark を使用する各リポジトリ（dev-docs など）の `er` の図を、用意した変換で map へ書き換える移行
    reason: 変換を使用する側の作業で、この Issue では変換と廃止までを扱う。このリポジトリの使い方集・設計書の図は、廃止で描けなくなるためこの PR で書き換える（更新ドキュメント）。dev-docs の map への移行は dev-docs#201 で扱う
    plan: none
  - item: 今の図の部品の固定のノードの種類・線の名前・構成図の 3 層を、使う側の設定で作る形にすること（`src/diagram/er.ts` の `ER_TABLE_KINDS` を含む）
    reason: 'この Issue の結論で #470 の範囲が決まる（統合する場合は `ER_TABLE_KINDS` が廃止で消える）。別の題材'
    plan: '#470'
  - item: 変換で座標（テーブルの `x`・`y` と図の `width`）を補足の `layout` の座標の固定へ写して元の配置を再現すること
    reason: map は自動配置を既定にし、座標の固定は配置を上書きしたいときだけ使う（#534 の変換と同じ扱い）
    plan: none
