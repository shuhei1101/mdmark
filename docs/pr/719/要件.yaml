use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: none
    detail: map の構成図・状態遷移図を描く流れと期待結果は変わらない。折り返したノードの名前がノードに収まるようになるだけ
    depends_on: []
scope_out:
  - item: 'map のノードの右の余白（src/index.css の padding-right: 28px）そのものを変えること'
    reason: 要望は見積もりを描画に合わせることで、右上の i と開閉の山形の置き場所は変えない
    plan: none
  - item: ノードの名前の幅の見積もり（textWidth）が実際のフォントの幅と合わないことと、pill の形状のノードの左の余白（16px）を見積もらないこと（半角の文字を文字の大きさの 0.6 倍とみなすため「文書の Markdown」は見積もり 117.6px・ Chromium の描画 129px。「利用側のページ」は pill で文字の列の幅が 93px。フォントによっては見積もりより狭く描かれ、Windows の Edge では「注文の明細を月ごとに集計する」が幅 220px で 1 行に収まり、measure を通らないストーリーでは 2 行を見込んだ高さ 83px の下が空く）
    reason: 要望は名前の最後の行が下の余白に食い込まないことで、見積もりより多く折り返したノードも measure が中身の入る高さにする。文字の幅と形状ごとの余白の見積もりの精度は、この作業 PR がマージされなくても同じ内容で成り立つ
    plan: '#720'
