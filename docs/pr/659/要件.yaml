use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: スマホで、開いたときの倍率より拡大した図を指 1 本で縦にも横にも動かし、開いたときの倍率の図の上ではページをスクロールし、ピンチで図を拡大・縮小する。拡大・縮小・全画面のボタンを、図の上の別の行から図の右上に重ねる小さいパネルへ移す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-66.yaml
    impact: changed
    detail: ライトボックスの画像も、図と同じ倍率の範囲でピンチで拡大・縮小する。上のバーのボタンの配置は変えない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: run_only
    detail: シーケンス図の参加者の箱を指でドラッグする操作が、図を指で動かす操作の変更で妨げられないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-89.yaml
    impact: run_only
    detail: 埋め込んだ HTML のチャートの拡大・縮小・移動が、図と同じ操作の変更で壊れないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-93.yaml
    impact: run_only
    detail: 共通の図の部品の操作の確認が、ボタンの配置の変更で壊れないかを確かめる
    depends_on: []
