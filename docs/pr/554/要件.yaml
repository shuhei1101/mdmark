scope_out:
  - item: 元の Markdown を書き出した HTML に埋め込まず、書き出すときに描画した HTML から起動する（D-453 No 5）
    reason: 起動の経路の変更で、受付判断で別の Issue に分けた
    plan: '#532'
  - item: 純粋な Markdown への書き出しでマーカーを含む HTML のコメントを削除する
    reason: 受付判断で純粋な Markdown への書き出しの Issue へ移した
    plan: '#313'
  - item: MindStella と dev-docs の画面が読み込む配布物と、VS Code 拡張機能の書き出し（`mdmark.exportHtml`・`mdmark.printToPdf`）で mdmark を隠す
    reason: D-453 No 7 で対象を `export_html`・`build_site`（CLI の `export`・`build`）の書き出しに限った。VS Code 拡張機能の書き出しは jsDelivr の配布物を読み込むため、URL に mdmark が出る。含めるかはレビューで確定する
    plan: none
  - item: 同梱する第三者のライブラリ（Mermaid・Lucide など）のライセンスの表記の削除
    reason: D-453 No 4 で、条件で削除できないため残すと決めた
    plan: none
  - item: 見た目・操作の特徴と、名前を置き換えた後の構造からの推測を防ぐ
    reason: D-453 No 6 で、mdmark を知っている人が推測できることは受け入れると決めた
    plan: none
