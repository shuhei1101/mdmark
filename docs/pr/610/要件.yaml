scope_out:
  - item: docs/mock/ のモック HTML
    reason: 画面のモックで、人が読む文書ではない
    plan: none
  - item: src/・tests/・vscode/ のコードのコメントと UI の文言の避ける単語
    reason: '#289 の範囲（ユーザーが案 C で決めた）。この作業では文書だけを扱う'
    plan: none
  - item: migrations/ の移行の手順の Mermaid（v0.13.0/retired-diagrams.js）
    reason: 利用側の文書を書き換えるスクリプトの文字列で、文書ではない
    plan: none
  - item: Mermaid の記法そのものを説明するガイド（図を描く-mermaidの図を描く・図を描く-Mermaidと補足で図を描く・記法）の Mermaid の見本
    reason: mdmark が Mermaid を描く機能の使い方で、見本の Mermaid は説明の対象そのもの。判断はレビューで確定する
    plan: none
  - item: docs/rules.yaml から古い規約（『markdown マーメイド』『判定フローチャート』）の ID を除く
    reason: 'origin/develop の rules.yaml は rules: [] で、古い規約を指していない'
    plan: none
  - item: ER 図（docs/er/）を knowledge の Schema へ切り替える
    reason: '#587 の反映作業『配布先のデータの設計書の作成』が docs/data/ を作り、ER 図の source を埋めて切り替える。管理用の YAML の Schema・index.schema.yaml・フォルダ構成の設計書の schemas/ のエントリも #587 に残す'
    plan: '#587'
  - item: '複合ユースケースの flow の click が持つ id: のリンク先（151 件）を map でリンクにする'
    reason: 'map は click のリンク先を http・https・mailto と相対パスに限り、id: を受け付けない（ノードはリンクにせずに描く）。knowledge の Schema は click で単一ユースケースへリンクするよう求めるため、直すのは map の側で、今回の変更がマージされなくても成り立つ'
    plan: '#611'
  - item: ブラウザの単体テストのファイルを持つモジュール構成 5 件の test_files
    reason: 'knowledge の module.schema.yaml の test_files は maxItems: 1 で、Node とブラウザの 2 つのテストファイルを持てない。今回は 2 つ目を補足へ移し、検証が 4 件のモジュール（MOD-472-161・162・203・246）で『テスト関数がありません』を 12 件出す。Schema を広げるかは knowledge で決める'
    plan: shuhei1101/knowledge#426
  - item: モジュール構成の functions[].summary のうち、1 行の概要に詳細が入った 28 項目の書き分け
    reason: Schema の summary は 1 行の決まりで改行を入れられない。詳細を description などへ移すかは項目ごとに書き分けが要り、文の表し方の移行（改行と表）の範囲を超える
    plan: '#614'
  - item: 工程 4「文を削り、AI slop を修正する」と改善「エイリアスと用語」
    reason: 文書ごとに文を読んで判断する作業で、レビューも文書ごとになるため、ユーザーの判断（推奨案 B）で別の Issue に切り出した
    plan: '#612'
  - item: map の構成図で、複数のノードから出る線が同じ通り道に重なる（MOD-472-1 の図の確認で見つかった）
    reason: 図の中身ではなく map の線の経路の決め方の問題で、この PR はコードを変えない
    plan: '#613'
