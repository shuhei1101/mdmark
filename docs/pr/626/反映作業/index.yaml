  確認: project-indexの端末の設定の付け替え/確認.py
  切り戻し: project-indexの端末の設定の付け替え/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: project-index の MCP の describe（source が mdmark）が、警告なしで mdmark の種類の一覧を返す
  状態: "-"
alias-injectの端末の設定の付け替え:
  説明: alias-inject の端末の設定（~/.config/alias-inject/settings.yaml）の repositories の mdmark の行の config を、develop の worktree の dev-docs.yaml から project-index.yaml へ書き換える。書き換える前に同じ場所へバックアップを取る
  タグ: [端末の設定]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: alias-injectの端末の設定の付け替え/疎通確認.py
  実行: alias-injectの端末の設定の付け替え/実行.py
  確認: alias-injectの端末の設定の付け替え/確認.py
  切り戻し: alias-injectの端末の設定の付け替え/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 'mdmark の用語（例 配信元）を含む発言に、alias-inject が mdmark の用語の文脈を付ける'
  状態: "-"
