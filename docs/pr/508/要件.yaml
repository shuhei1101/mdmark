use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 読者が図をタップしてから、スマホの指のドラッグで図を縦にも動かせる。タップする前の縦のドラッグは文書のスクロールにする（#357。共通の図の枠のため、map・フロー図・シーケンス図・グラフ・ER 図・mermaid の図・埋め込んだ HTML のチャートの全てに当たる）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-20.yaml
    impact: changed
    detail: 文書の作成者が罫線でフォルダ構成を記載したのに言語が tree でないコードブロックに、言語を tree にする書き方の警告を受け取り、罫線の例をそのまま見せたいときは警告を止められる（#466）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-3.yaml
    impact: run_only
    detail: MCP の check・export_html は、mdmark check と描画と同じ処理で罫線のコードブロックの警告を返す。シナリオの記述は変わらないが、警告の追加が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-15.yaml
    impact: changed
    detail: フォルダ構成を記載しようとした Claude Code が、ガイドの索引からファイルツリーの記載方法のページに行き着く（#466）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: run_only
    detail: map の構成図の描き方は変えないが、図の枠のタッチの扱いの変更が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-56.yaml
    impact: run_only
    detail: 書き出しは変えないが、書き方の警告の追加が書き出した HTML の警告に出る
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 流れは変わらないが、図の枠のタッチの変更が壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-85.yaml
    impact: run_only
    detail: 流れは変わらないが、ガイドの索引と点検の項目の変更が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-52.yaml
    impact: changed
    detail: mdmark check に Markdown の文字列かファイルを指定すると、罫線の行を持つ言語が tree でないコードブロックをずれに挙げる（#466）
    depends_on:
      - docs/scenario/SC-472-20.yaml
