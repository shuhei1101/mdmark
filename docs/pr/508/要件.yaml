scope_out:
  - item: 今の flow（座標の JSON のフロー図）の箱の種類 dm の表示名「意思決定モデル」
    reason: 'map は固定のノードの種類を持たず、表示名は使う側の設定 map.kinds の label で決まるため、#464 の #333 の要件は develop で満たされている。今の flow の固定の種類を設定で作る形にするのは #470 が扱う'
    plan: '#470'
  - item: map・今の sequence のシーケンス図での参加者の表示と非表示（#404 の残り）
    reason: ユーザーが参加者の非表示の機能は不要と判断した（https://github.com/shuhei1101/mdmark/pull/508#discussion_r4555259514 ）。図の枠のタッチでのドラッグは、図の枠が共通の部品のため今の図にも当て、この PR に含める
    plan: none
  - item: mdmark check を引数なしで実行するフォルダの点検での、罫線のコードブロックの警告
    reason: フォルダの点検は描いたときの記載の警告を集めず（知らないマーカー・図の定義・map の補足などだけ）、記載した後の点検は --text・--file（MCP の check）で行うため。記載の警告をフォルダの点検へ広げるのは警告全体に関わる別の題材
    plan: none
  - item: 図の枠のリサイズハンドル（`src/parts/diagram.ts` の `renderDiagramFrame`）が、描いた直後に aria-valuenow などの必須の ARIA 属性を持たず、axe の aria-required-attr が出る
    reason: reviewer の対象外の逸脱の報告（https://github.com/shuhei1101/mdmark/pull/508#discussion_r4556332375 ）。WAI-ARIA のフォーカスできる separator の必須の属性と部品設計『図の枠』の accessibility から外れている。develop の既存の描画で、今回の要望に含まれない
    plan: '#514'
