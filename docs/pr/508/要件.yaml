scope_out:
  - item: 今の flow（座標の JSON のフロー図）の箱の種類 dm の表示名「意思決定モデル」
    reason: 'map は固定のノードの種類を持たず、表示名は使う側の設定 map.kinds の label で決まるため、#464 の #333 の要件は develop で満たされている。今の flow の固定の種類を設定で作る形にするのは #470 が扱う'
    plan: '#470'
  - item: 今の sequence（座標の JSON のシーケンス図）での参加者の表示と非表示
    reason: '#464 は map への追加で、今の sequence は map へ移してから廃止する（#467）。図の枠のタッチでのドラッグは、図の枠が共通の部品のため今の図にも当て、この PR に含める'
    plan: '#467'
  - item: mdmark check を引数なしで実行するフォルダの点検での、罫線のコードブロックの警告
    reason: フォルダの点検は描いたときの記載の警告を集めず（知らないマーカー・図の定義・map の補足などだけ）、記載した後の点検は --text・--file（MCP の check）で行うため。記載の警告をフォルダの点検へ広げるのは警告全体に関わる別の題材
    plan: none
