use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: changed
    detail: 読者が map のシーケンス図の参加者の表示と非表示を切り替え、非表示にした参加者だけに関わるメッセージを隠す（#404 の残り）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 読者がスマホの指のドラッグで map の図を縦にも動かせる（#357）。ページのスクロールとの分け方を決める
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-20.yaml
    impact: changed
    detail: 文書の作成者が罫線でフォルダ構成を記載したのに言語が tree でないコードブロックに、言語を tree にする書き方の警告を受け取り、罫線の例をそのまま見せたいときは警告を止められる（#466）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: mdmark check が、罫線の行を持つ言語が tree でないコードブロックを点検の結果に挙げる（#466）
    depends_on:
      - docs/scenario/SC-472-20.yaml
  - kind: single
    scenario: docs/scenario/SC-472-3.yaml
    impact: following
    detail: Claude Code が MCP の check・export_html で、罫線のコードブロックの警告を受け取る（#466）
    depends_on:
      - docs/scenario/SC-472-78.yaml
  - kind: single
    scenario: docs/scenario/SC-472-15.yaml
    impact: changed
    detail: フォルダ構成を記載しようとした Claude Code が、ガイドの索引からファイルツリーの記載方法のページに行き着く（#466）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-22.yaml
    impact: run_only
    detail: SessionStart の案内に文を加えるかは設計で決める。加えない場合もプラグインのビルドで生成し直すため回帰を確かめる（#466）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: run_only
    detail: map の構成図の描き方は変えないが、図の枠のタッチの扱いの変更が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-56.yaml
    impact: run_only
    detail: 書き出しは変えないが、書き方の警告の追加が書き出した HTML の警告に出る
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 流れは変わらないが、シーケンス図の参加者の操作と図の枠のタッチの変更が壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-85.yaml
    impact: run_only
    detail: 流れは変わらないが、ガイドの索引と点検の項目の変更が壊しうる
    depends_on: []
