scope_out:
  - item: mdmark-style（Claude Code の返答と発言の描き換え）のコードブロックで、言語が markdown のときにソースと描いた結果を切り替える
    reason: '#697 の要望は mdmark の文書の中のコードブロックが対象。mdmark-style は部品の木へ描き換える別のサブシステムで、含めるかは部品設計のレビューで確定する（今の判断は含めない）'
    plan: none
  - item: 手順の再生を止めたときに、始めたときの倍率と位置へ戻す動き（stop の focusRect）の変更
    reason: 倍率を変えない動きにすると、戻すのは中央へ移した位置だけになる。位置を戻すかを変えることは要望に含まれないため、今のとおり止めたときは始めたときの位置へ戻す（インターフェース定義設計のレビューで確定する）
    plan: none
