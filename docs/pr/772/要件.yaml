use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: 同じノードの同じ辺から出る線の出る位置がずれ、並んで走る線の間隔が取られる。ノードの名前・種類の行・線のラベルとマインドマップの項目の文字が細めで小さめになり、マインドマップの項目が枠を持ち短い名前を折り返さない。線の押せる範囲を変えても、ポインターを重ねたときの強調とドラッグで区間を動かす操作は今と同じ。「ポインターを適用する」を「ポインターを重ねる」にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: changed
    detail: ER 図・クラス図のノートのマーカーを含め、ツールチップを持つ要素にポインターを重ねてもカーソルが help にならない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-6.yaml
    impact: changed
    detail: VS Code 拡張機能が書き出す HTML に元の Markdown を埋めず、書き出すときに描いた HTML と純粋な Markdown を埋め、開いたときはそれを描く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-9.yaml
    impact: following
    detail: 印刷する HTML も、書き出しと同じく描いた HTML から起動する
    depends_on:
      - docs/scenario/SC-472-6.yaml
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: changed
    detail: 「ポインターを適用する」を「ポインターを重ねる」にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: 「ポインターを適用する」を「ポインターを重ねる」にする。まとめた線にポインターを重ねたときの強調は今と同じ
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 「ポインターを適用する」を「ポインターを重ねる」にする。全画面の構成図で線にポインターを重ねたときの強調は今と同じ
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-73.yaml
    impact: changed
    detail: 「フォーカスを適用したとき」を、ほかの文書と同じ言い方にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: run_only
    detail: map で描く mermaid のコードブロックの図も、文字の見た目と線の出る位置の変更が及ぶ
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: run_only
    detail: 案内で強調する線とノードの見た目が、線の押せる範囲と文字の見た目の変更で壊れないか
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図を辿って読む流れが、線と文字の見た目の変更で壊れないか
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-88.yaml
    impact: run_only
    detail: VS Code で書き出して PDF にする流れが、書き出す中身の変更で壊れないか
    depends_on: []
