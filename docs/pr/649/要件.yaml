use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: map の範囲に mindmap の Mermaid と補足を記載すると、根を中央に置いて枝を外へ広げる木の配置で描き、項目の形を描き分け、補足の説明を当てる。項目の選択で根からの道筋と子孫を強調し、読めない行を書き方の警告にし、描けない種類の案内の文言に mindmap を加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: マインドマップの枝を開閉し、枝の中へ入ってその項目から下だけを読み、戻る
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: マインドマップでも補足の巡回の手順を前へ・次へで進め、枝の中へ入って項目を強調する
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: changed
    detail: map の範囲の外の mindmap のコードブロックを、補足の無い map の図にする。mindmap だけの文書では mermaid のライブラリを読み込まない
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: マインドマップの map の補足が無い項目を指すとき・キーで指せない項目があるとき、点検のずれにする
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: run_only
    detail: ツールチップの記述は変わらないが、マインドマップの項目にも補足の説明を出すため壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: run_only
    detail: 拡大・縮小・移動の記述は変わらないが、木の配置の図にも同じ操作を付けるため壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: run_only
    detail: シーケンス図の参加者の選択の記述は変わらないが、選択と強調の処理を種類で共通にしているため壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図の種類に依らない流れで記述は変わらないが、map の読み取り・配置・操作を広げるため壊しうる
    depends_on: []
