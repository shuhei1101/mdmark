scope_out:
  - item: フォルダ構成の設計書（layout）の作成
    reason: 移した後の構成を前提に書く後続の作業で、要望に含まれない
    plan: '#361'
  - item: 'dev/mock/files.yaml の #263 のバイナリの素材 4 行を dev-docs が配信から除いている問題'
    reason: 置き場所を移しても同じ内容で成り立つ別の不具合で、要望に含まれない（行はそのまま docs/mock/files.yaml へ移す）
    plan: '#341'
  - item: 既存の文書の中身の表し方の移行
    reason: 置き場所だけを移し、文書の中身は変えない
    plan: '#290'
  - item: docs/_theme/ を AI Monitor の develop の公開ドキュメントの部品（上タブの pages の対応表・分類のトップページの permalink を読むレイアウト）へ取り込むことと、docs/_config.yml へレイアウトとプラグインの設定を足すこと
    reason: docs/_theme/ は AI Monitor の配布物で、取り込みは版上げの追従の作業になる。この PR は _config.yml に exclude だけを置き、今の Pages の描き方（Jekyll の既定）を変えない
    plan: to_file
  - item: '#394 で Schema の説明文に当てた用語の言い換え（書く → 記載する 等）'
    reason: 設計書の Schema は AI Monitor の配布物で、AI Monitor の develop の Schema に揃えると上書きされる。次の版上げの追従でも同じく上書きされるため、mdmark の側では当て直さない
    plan: none
  - item: VS Code 拡張機能の結合テスト『プレビューを再描画する』の test_normal が、stable の VS Code で時間の比較（「最後の書き換えから -1254 ms」）でときどき fail する
    reason: 同じ commit で次の実行は全 pass し、失敗は文書のパスでなく時間の比較で起きた。置き場所の移行と無関係で、この PR がマージされなくても成り立つ
    plan: to_file
