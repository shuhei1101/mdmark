  - page: dev/テンプレート/files.schema.yaml
    new: false
    change: dev/テンプレート/*.schema.yaml を schemas/{kind}.schema.yaml へ移し、visibility と分類のキーを持たせる
    status: todo
  - page: tmp/.gitignore
    new: true
    change: 中身が * だけの .gitignore を置き、develop に入った tmp/screenshots/ の PNG 43 件を削除する
    status: todo
scope_out:
