use_cases:
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/ClaudeCodeでガイドを参照して記載し点検する.yaml
    impact: run_only
    detail: ガイドのページの置き場所が docs/guide/ へ変わるため、記載の前にガイドを参照できることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/ガイドを参照する.yaml
    impact: run_only
    detail: ガイドの索引が指すページの置き場所が docs/guide/ へ変わるため、タグで絞ってガイドを参照できることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/VSCodeでプレビューを開く.yaml
    impact: run_only
    detail: プレビューの確認に使う文書の置き場所が変わるため、プレビューを開けることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/バージョンを上げる.yaml
    impact: run_only
    detail: 変更履歴のページの置き場所が docs/guide/ へ変わるため、上げる版の変更を示して版を上げられることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/端末にmdmarkをセットアップする.yaml
    impact: run_only
    detail: 変更履歴のページの置き場所が docs/guide/ へ変わるため、端末の設定を用意できることを確かめる
    depends_on: []
