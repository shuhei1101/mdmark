  - page: dev/設計書/アーキテクチャ図/アーキテクチャ図.yaml
    new: false
    change: docs/architecture/ へ移し、repository.layout の dev/ と dev/テンプレート/files.schema.yaml の記載を移した後の置き場所に合わせる
