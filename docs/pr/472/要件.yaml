    status: todo
  - page: README.md
    new: false
    change: dev/ と旧 docs/ を指すリンクを、移した後の置き場所に合わせる
    status: todo
  - page: dev-docs.yaml
    new: false
    change: 設計書の種類ごとの行と各 files.yaml の行を、docs/ の種類のフォルダと schemas/ に合わせる
    status: todo
  - page: docs/rules.yaml
    new: false
    change: ルールを当てるパスを、移した後の置き場所に合わせる
    status: todo
  - page: docs/index.yaml
    new: false
