scope_out:
  - item: 出したバージョンの移行の手順の配布物（`migrations/v0.13.0/`・`migrations/v0.14.0/`）の書き換え
    reason: 'v0.13.0・v0.14.0 はタグを打った後で中身を変えない。推奨の直し方は upgrade を実行する CLI の点検の側を直すため、配布物を書き換えずに直る。配布物の作り直しが出したバージョンを書き換える不具合は #639 が扱う'
    plan: '#639'
  - item: upgrade が点検のずれで戻す単位を、全ての変更からずれを持つ範囲だけにする変更
    reason: 点検に合格してから版を書き換え、合格しなければコピーから全て戻すのはインターフェース定義『バージョンを上げる』の設計どおり。本件の原因は変換の出力と点検の食い違いで、それを直せば変換がずれを出さず、ほかの範囲の変換も戻らない。含めるかは後段のレビューで確定する
    plan: none
