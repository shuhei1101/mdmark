use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: map の範囲に classDiagram・mindmap・gantt・timeline・gitGraph・journey・block-beta・architecture-beta・C4Context の Mermaid と補足を記載すると、自動配置した図として描き、補足の説明・layout を当てる。種類ごとの選択と強調を足し、描けない種類の案内の文言を変える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: クラス図の namespace とクラスのメンバー、マインドマップの枝、ガントチャートの section、ブロック図・アーキテクチャ図・C4 図の入れ子の枠を、構成図のグループと同じ操作で開閉し、中へ入る
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: 追加した種類でも補足の巡回の手順を前へ・次へで進める。時系列を持つ種類（ガントチャート・タイムライン・Git グラフ・ジャーニー）は記載順に 1 歩ずつ進める再生を持つかを設計で決める
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: run_only
    detail: シーケンス図の参加者の選択の記述は変わらないが、選択と強調の処理を種類で共通にするため壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: run_only
    detail: map の範囲の外の classDiagram・mindmap・gantt などのコードブロックは、今までどおり mermaid で描く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: run_only
    detail: シーケンス図の再生の操作は変わらないが、再生と巡回の帯を追加した種類と共通にするため壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図の種類に依らない流れで記述は変わらないが、map の読み取り・配置・操作を広げるため壊しうる
    depends_on: []
