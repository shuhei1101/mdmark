scope_out:
  - item: pie・xychart-beta・quadrantChart・sankey-beta を map で描く
    reason: '今の部品 chart と重なる（[map で erDiagram・stateDiagram-v2 の Mermaid を、flowchart・シーケンス図と同じ記載方法と操作で描く](https://github.com/shuhei1101/mdmark/pull/531) のスコープ外の判断と Issue の補足のとおり）'
    plan: none
  - item: map を Markdown へ書き出すときの種類ごとの扱い
    reason: '[mdmark の文書を、MCP と CLI で純粋な Markdown（GFM と Mermaid）に書き出す](https://github.com/shuhei1101/mdmark/issues/313) は Mermaid のブロックを残して補足を削除する方式で、種類が増えても変わらない'
    plan: '#313'
  - item: C4Container・C4Component・C4Dynamic・C4Deployment を map で描く
    reason: Issue の対象は C4Context だけ。書き方は C4Context と共通で、この PR で作る C4 図の読み取りと描画を前提に要素の種類を足す後続になる
    plan: '#607'
  - item: mindmap を map で描く（木の配置）
    reason: 今の入れ子の自動配置に無い木の配置を新規作成するため、配置の処理ごとに切り出した（単一ユースケース設計のレビュー）
    plan: '#597'
  - item: gantt・timeline・gitGraph・journey を map で描く（軸に沿った配置と再生）
    reason: 今の入れ子の自動配置に無い軸に沿った配置と再生を新規作成するため、配置の処理ごとに切り出した（単一ユースケース設計のレビュー）
    plan: '#598'
  - item: block-beta を map で描く（columns の格子の配置）
    reason: 今の入れ子の自動配置に無い格子の配置を新規作成するため、配置の処理ごとに切り出した（単一ユースケース設計のレビュー）
    plan: '#599'
  - item: map のノードの説明のマーカー（`src/parts/map.ts` の `.mdmark-diagram-info`）が、axe の `target-size`（serious。押せる要素は 24px 以上か、間を空ける）に当たる
    reason: この PR が触る前からある事象（base の `Parts/MapState` の Collapsed でも同じ検出が出る）で、今回の要望（3 種類の図を描く）に含まれない
    plan: '#609'
  - item: map の閉じたグループのノードで、「{数} 件」（`.map-closed-count`）が絶対位置のタイトルの行（`.map-group-head`）に重なる（`src/index.css`）
    reason: この PR が触る前からある事象（base のストーリー `Parts/MapFlow` の Collapsed でも「ノード 3 件」がタイトルに重なる）で、今回の要望（3 種類の図を描く）に含まれない
    plan: '#608'
