use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: changed
    detail: map の範囲の外の言語 mermaid のコードブロックを、map が描ける種類は補足の無い map の図に、描けない種類は今の mermaid の図にする。title の無い図は図の種類の名前をタイトルにし、`actor` は既定で人のアイコンを持つ。参加者の行を文書のスクロールでも留め、枠線を欠かさないことは、図の枠の共通の振る舞いのため、純粋な Mermaid と map の範囲のシーケンス図を並べたこの UC のシナリオ 1 つで確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: map が描けない種類（gantt）の mermaid の図で拡大・移動し、純粋な Mermaid の図の文字の上のドラッグを、図の移動ではなく文字の選択にする
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: changed
    detail: 純粋な Mermaid のシーケンス図でも、参加者を選んで強調し、並び順を変え、再生できる。`actor` は、map の範囲でも既定で人のアイコンを持つ
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: 種類を持たないノードは、名前をノードの上下の中央に描く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: run_only
    detail: 図の中の文字の選択を足しても、ノードの上のツールチップが今のとおり出ることを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: map の図を辿って読む流れが、純粋な Mermaid への操作の追加で変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-10.yaml
    impact: changed
    detail: プレビューで mermaid を読み込む確認を、map が描けない種類（gantt）のコードブロックで行う
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-56.yaml
    impact: changed
    detail: mermaid を埋めた書き出しを、map が描けない種類（gantt）のコードブロックで確かめる
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-6.yaml
    impact: changed
    detail: 相対パスの mermaid の読み込みを、map が描けない種類（gantt）のコードブロックで確かめる
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-26.yaml
    impact: changed
    detail: 選んだテーマの mermaid の図の配色を、map が描けない種類（gantt）のタスクの棒で確かめる
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-62.yaml
    impact: changed
    detail: map の機能をオフにした文書では、範囲の外の map が描ける種類の mermaid のコードブロックも mermaid の図で描く
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-46.yaml
    impact: run_only
    detail: シナリオは mermaid を使用しない文書で mermaid への要求が 0 件のまま。mermaid を読み込む条件の変更は『mermaidの図を描く』が持ち、外部ライブラリの読み込みが変わらないことを確かめる
    depends_on: []
