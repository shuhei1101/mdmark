scope_out:
  - item: mermaid の図の要素への用語の下線・ツールチップ
    reason: 別の要望で、本 PR で描き方を揃えた後に着手する計画のため
    plan: '#391'
  - item: map の操作のうち、補足（map-data）か map の引数を記載しないと成り立たないもの（案内の手順・ノードの説明・種類の表示名 など）
    reason: 記法を記載した文書だけが持つ情報を元にする操作で、純粋な Mermaid には元になる情報が無いため
    plan: none
  - item: 図以外の記法（表・コードブロック など）で、記法が無くても付けられる操作の洗い出しと追加
    reason: 純粋な Mermaid への操作の追加とは対象の記法が別で、本 PR がマージされなくても同じ内容で成り立つため
    plan: '#632'
  - item: map のクラス図の説明のマーカー（`.mdmark-diagram-info`）のタップ領域が axe の `target-size` に当たる
    reason: 既存のストーリー `parts-mapclass--default` でも出る、本 PR の変更と関係しない事象のため（reviewer の対象外の逸脱の報告）
    plan: none
  - item: '`MOD-472-203` の単体テストの行のうち、2 つ目のテストファイル（`mount-view.browser.test.ts`）にあるテスト 2 件が、設計書の検証で「テスト関数がありません」と出る'
    reason: '対応テストファイルの項目に 1 ファイルしか記載できないスキーマによる #472 からのずれで、本 PR の変更が起こしたものではなく、テストのファイルの組み替えが要るため'
    plan: '#640'
