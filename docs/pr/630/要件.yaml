    new: false
    change: 記法を記載しなくても純粋な Mermaid の図に付く操作（参加者の行の固定・文字の選択とコピー など）を追記する
    status: todo
  - page: docs/guide/図を描く-Mermaidと補足で図を描く.md
    new: false
    change: map の操作のうち、補足や map の範囲が無くても付くものと、map の範囲で囲むと増えるものの違いを追記する
    status: todo
  - page: docs/guide/記法.mark.md
    new: false
    change: '`## mermaid のコードブロック` の節と一覧の行に、map の範囲が無くても付く操作を足す'
    status: todo
scope_out:
  - item: mermaid の図の要素への用語の下線・ツールチップ
    reason: 別の要望で、本 PR で描き方を揃えた後に着手する計画のため
    plan: '#391'
  - item: map の操作のうち、補足（map-data）か map の引数を記載しないと成り立たないもの（案内の手順・ノードの説明・種類の表示名 など）
    reason: 記法を記載した文書だけが持つ情報を元にする操作で、純粋な Mermaid には元になる情報が無いため
    plan: none
  - item: 図以外の記法（表・コードブロック など）で、記法が無くても付けられる操作の洗い出しと追加
    reason: 純粋な Mermaid への操作の追加とは対象の記法が別で、本 PR がマージされなくても同じ内容で成り立つため
    plan: '#632'
