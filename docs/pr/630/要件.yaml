use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: changed
    detail: map の範囲の外の言語 mermaid のコードブロックを、map が描ける種類は補足の無い map の図に、描けない種類は今の mermaid の図にする。map が描ける種類だけの文書では mermaid を読み込まない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: map が描けない種類（gantt）の mermaid の図で拡大・移動し、純粋な Mermaid の図の文字の上のドラッグを、図の移動ではなく文字の選択にする
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: changed
    detail: 純粋な Mermaid のシーケンス図でも、参加者を選んで強調し、並び順を変えられる
    depends_on:
      - docs/scenario/SC-472-11.yaml
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: run_only
    detail: map の描画と操作の処理を純粋な Mermaid と共有するため、map の図の描画が変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: run_only
    detail: 図の中の文字の選択を足しても、ノードの上のツールチップが今のとおり出ることを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: map の図を辿って読む流れが、純粋な Mermaid への操作の追加で変わらないことを確かめる
    depends_on: []
