use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-4.yaml
    impact: changed
    detail: マーケットプレイスに mdmark-style が加わり、文書の作成者が mdmark と別に mdmark-style を選んで入れられるようになる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-97.yaml
    impact: new
    detail: （返答を共通スタイルで描く）Claude Code の画面で、アシスタントの返答の表・見出し・注意書き・コードを mdmark の共通スタイルの部品で描き、返答に書かれた mdmark のマーカーは描き方に使って画面に出さない。部品ごとと描き換える場所（返答・発言）ごとに設定でオン・オフする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-98.yaml
    impact: new
    detail: （発言と返答の用語に印を付ける）利用者の発言とアシスタントの返答に出た用語・エイリアスに下線を付け、ポインターを乗せると意味のカードを開き、マウスを使えないときのために脚注も出す。用語は設定で指定した mdmark.config.yaml の索引・aliases・用語集の表から取る
    depends_on:
      - docs/scenario/SC-472-97.yaml
  - kind: single
    scenario: docs/scenario/SC-472-99.yaml
    impact: new
    detail: （セッションの開始でマーカーの書き方を受け取る）セッションの開始で、モデルが返答に mdmark のマーカーを書けるよう、マーカーの書き方の短い説明を 1 セッション 1 回だけ受け取る。設定で止められる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-25.yaml
    impact: run_only
    detail: 共通スタイルの値の定義を Web と mod の両方から読む形に移すため、既定の外観と利用側の上書きが変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-64.yaml
    impact: run_only
    detail: 注意書きの種類・色の定義を共通にするため、Web の注意書きの見た目が変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-65.yaml
    impact: run_only
    detail: 用語の取り出しを mdmark-style と共通に使うため、Web の用語のツールチップが変わらないことを確かめる
    depends_on: []
