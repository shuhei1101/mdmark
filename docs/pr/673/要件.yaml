use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-73.yaml
    impact: changed
    detail: 表のマーカーを記載していない表でも、記法が無くても付けられると一覧で決めた操作（並べ替え など）を読者が使用できる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-17.yaml
    impact: changed
    detail: マーカーを記載していないコードブロックに付く操作と、マーカーで付く操作を分けて確かめる。記法が無くても付けられるのに付いていない操作があれば付ける（洗い出しの結果で影響を確定する）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-21.yaml
    impact: run_only
    detail: 見出しのセクションの開閉は記法が無くても付く。操作の一覧の追加で変わらないことを確かめる（洗い出しで付ける操作が見つかれば changed にする）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-66.yaml
    impact: run_only
    detail: 画像のライトボックスは記法が無くても付く。操作の一覧の追加で変わらないことを確かめる（洗い出しで付ける操作が見つかれば changed にする）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-71.yaml
    impact: run_only
    detail: 脚注のツールチップと一覧への移動は GitHub と同じ記法で付く。操作の一覧の追加で変わらないことを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-29.yaml
    impact: run_only
    detail: ビューの表形式は表の部品で描く。既定の種類の表に操作を加えても、ビューの表形式の操作が変わらないことを確かめる
    depends_on:
      - docs/scenario/SC-472-73.yaml
  - kind: single
    scenario: docs/scenario/SC-472-58.yaml
    impact: run_only
    detail: 既定の種類の表に増えたボタンが、印刷では出ないことを確かめる
    depends_on:
      - docs/scenario/SC-472-73.yaml
docs:
