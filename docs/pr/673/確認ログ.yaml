    decision: PC の幅では、押していないピン止めのボタンを見出しにポインターが乗ったときかフォーカスが当たったときだけ出し、スマホの幅では常に出す。列の幅のつまみで狭めるときも、列名・並べ替え・ピン止め・絞り込みのアイコンが収まる幅を最小の幅にする。モックは直さず、ユーザーへの再確認もしない
