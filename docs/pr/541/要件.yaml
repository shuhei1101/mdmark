scope_out:
  - item: 既存の文書（mdmark・knowledge・ai-monitor・MindStella の資料）の拡張子の `.mark.md` への移行
    reason: 起点 Issue の後続で、リポジトリごとに移行の時機を決める。この PR は提案を止める設定を持たせる
    plan: to_file
  - item: VS Code 拡張機能の有効になる対象の変更
    reason: '`.mark.md` は末尾が `.md` で、言語が `markdown` のまま拡張機能が有効になるため変更しない'
    plan: none
  - item: 純粋な Markdown への書き出し（書き出した文書の拡張子は `.md`）
    reason: 起点 Issue の「関係」で、別の Issue が扱う
    plan: '#313'
  - item: 純粋な Markdown・Mermaid だけの文書でのビュワーの操作
    reason: 別の題材で、別の Issue が扱う
    plan: '#500'
