use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: 拡張子が純粋な `.md` の文書が mdmark の記法を含むとき、拡張子を `.mark.md` に変えるよう提案するずれを出すシナリオと、設定で止めたときに出さないシナリオを追加する。記法を含まない `.md` と `.mark.md` には出さない。既存のシナリオが元にする正常シナリオのフォルダの文書を `.mark.md` にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-3.yaml
    impact: changed
    detail: Claude Code から呼んだ点検でも、記法を含む純粋な `.md` の拡張子の提案が返ることを加える。正常シナリオのフォルダの文書を `.mark.md` にする
    depends_on:
      - docs/scenario/SC-472-78.yaml
      - docs/scenario/SC-472-85.yaml
  - kind: single
    scenario: docs/scenario/SC-472-15.yaml
    impact: changed
    detail: '`.mark.md` の文書を記載するときと、利用者が mdmark で記載するよう指示したときに、記法のルールを MCP で参照するよう 1 セッションに 1 回案内されるシナリオを加える。純粋な `.md` には利用者の指示が無い限り記法を使用しないことが伝わる'
    depends_on:
      - docs/scenario/SC-472-85.yaml
  - kind: single
    scenario: docs/scenario/SC-472-4.yaml
    impact: changed
    detail: プラグインを入れた後のフックに、文書の記載と利用者の発言での案内が加わる
    depends_on:
      - docs/scenario/SC-472-15.yaml
  - kind: composite
    scenario: docs/scenario/SC-472-85.yaml
    impact: changed
    detail: '`.mark.md` の文書を記載するときに案内を受けてガイドを参照し、記載した後に点検する流れにする。記法を含む純粋な `.md` の拡張子の提案を点検で受ける'
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-76.yaml
    impact: following
    detail: '`.mark.md` の文書も、純粋な `.md` と同じく 1 枚の HTML にまとめる対象になることを記載する'
    depends_on:
      - docs/scenario/SC-472-78.yaml
  - kind: single
    scenario: docs/scenario/SC-472-10.yaml
    impact: run_only
    detail: '`.mark.md` の文書も VS Code のプレビューで開けることを、変更の後も確かめる'
    depends_on: []
