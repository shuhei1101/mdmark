scope_out:
  - item: mdmark を参照するほかのリポジトリの参照の切り替え（ai-monitor・dev-docs・knowledge・gui-support・rule-inject・project-index・mindstella）
    reason: 各リポジトリで起票済みの後続（shuhei1101/ai-monitor#3531 など）で、本件は mdmark の側だけを整える
    plan: none
  - item: VS Code 拡張機能の設定 mdmark.version（既定 latest はタグ一覧の最新）で develop の最新を選べるようにするか
    reason: Issue が挙げる参照のしかた（jsDelivr・npx・mdmark.config.yaml の version）に含まれない。ただし拡張機能も jsDelivr から配布物を読むため、含めるかを単一 UC 設計のレビューで確定する。今の判断は含めない
    plan: '#638'
  - item: '#571（develop に次のタグを打つ）を打つか'
    reason: '本件で develop を参照できても #571 の報告そのものは直らず、打つかは本件の後にユーザーが決める'
    plan: '#571'
  - item: dist/index.js が配布ファイルの上限（688128 バイト）を超えてビルドが失敗する不具合の解決（この PR のマージの前提）
    reason: '上限の値を見直すかは #601 で決める論点で、この PR では扱わない。#601 が解決するまでは develop-dist.yml のビルドが終了コード 1 になり develop の配布物が再作成されないため、#601 の解決後にマージする'
    plan: '#601'
