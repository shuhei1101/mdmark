use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-67.yaml
    impact: changed
    detail: 埋め込んだ音声の再生バーを、見切れずに全体を出す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-17.yaml
    impact: changed
    detail: 読者がコードブロックごとに、画面の端で折り返すか折り返さないかを 1 回の操作で切り替える。既定は記載した wrap の有り無し、無ければ設定の既定に従う。コピーと折り返しのボタンはアイコンだけにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: 構成図のノード・グループ・線の区間の移動と、グループの大きさの変更を、ドラッグしないでも行える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: changed
    detail: シーケンス図の参加者の並べ替えを、ドラッグしないでも行える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 拡大した図は、ドラッグしないでも表示する枠のスクロールバーで動かせる。表示する枠の高さも、リサイズハンドルを動かさずに押して開く大きさのメニューで変えられる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-55.yaml
    impact: run_only
    detail: ミニマップは位置を押すだけで差分をスクロールでき、ドラッグしない操作があるためシナリオは変えない。代わりの操作の追加で壊れうるため E2E の対象にする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-805-1.yaml
    impact: run_only
    detail: 音声の外観の修正で、動画の大きさを変える操作を落とさない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-801-1.yaml
    impact: run_only
    detail: 音声の外観の修正で、動画・音声のモーダルの再生を落とさない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-66.yaml
    impact: changed
    detail: ライトボックスで拡大した画像を、ドラッグしないでも移動のメニューで動かせる。スマホの指ではスクロールで動かせないため
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-20.yaml
    impact: changed
    detail: 読者がファイルツリーごとに折り返しを切り替える。折り返したときに注釈を持つフォルダの名前が縦に折れない（#822）
