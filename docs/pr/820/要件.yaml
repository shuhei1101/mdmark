scope_out:
  - item: 音声の見切れの原因が MindStella 側の CSS だった場合の MindStella の修正
    reason: mdmark のリポジトリの外の変更。mdmark だけで描いた音声は再生バーの全体を出すことを確認し、shuhei1101/mindstella#720 に起票した
    plan: to_file
  - item: コードブロックの折り返しを切り替えた状態をページを開き直した後も保つこと
    reason: 要望は 1 回の操作での切り替えで、保存は要望に含まない（同じタブの中で保つかは部品設計で決める）
    plan: none
  - item: 表の部品と、動画のリサイズハンドルのドラッグの代わりの操作
    reason: '#810・#803 で扱い済み（表の列の移動のメニュー、動画の大きさのメニュー）。この作業では実装の差を点検するだけにする。図の枠のリサイズハンドルは点検で代わりの操作が無いと分かったため、この作業で大きさのメニューを追加する'
    plan: none
