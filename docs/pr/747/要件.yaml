  - item: map のマインドマップの項目の枠線・短い名前の折り返し・文字の大きさと太さ・フォーカスの操作
    reason: モックの確認で利用者が出した新しい要望で、マインドマップの描き方の改善。今回の作業 PR がマージされなくても成り立つ（利用者が別の Issue への切り出しを許可）
