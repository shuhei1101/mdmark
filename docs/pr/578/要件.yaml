scope_out:
  - item: AI Monitor の設計書の Markdown の生成が出力する docs/README.md と設計書のフォルダの README.md（component・er・interface・library・module・scenario）の表のマーカー
    reason: '生成し直すと今の書き方に戻る。生成を JSON の記載にする対応は [文書のマーカーを mdmark の JSON の記載へ移す](https://github.com/shuhei1101/ai-monitor/issues/3418) が持ち、終わりの条件の範囲から除く（[mdmark のリポジトリのほかの文書（docs/mock など）のマーカーを JSON の記載へ移す](https://github.com/shuhei1101/mdmark/issues/481) の task-planner の扱いの判断）'
    plan: shuhei1101/ai-monitor#3418
  - item: 'この PR のマージ後に他の作業 PR が足す PR ドキュメントの今の書き方のマーカー（AI Monitor のテンプレートの <!-- table: data --> を写した記載）'
    reason: 'テンプレートは AI Monitor の文書で、JSON の記載への移行は [文書のマーカーを mdmark の JSON の記載へ移す](https://github.com/shuhei1101/ai-monitor/issues/3418) が持つ'
    plan: shuhei1101/ai-monitor#3418
  - item: tests/ のテストの入力に使う今の書き方のマーカー
    reason: '今の書き方を読む処理・移行の手順を確かめる入力で、文書ではない。読む処理の削除に合わせて [マーカーの今の書き方を読む処理を削除する（次のマイナーバージョンの破壊的変更）](https://github.com/shuhei1101/mdmark/issues/479) が扱う'
    plan: '#479'
  - item: docs/mock/pages/ui-canvas/80/side-by-side/index.html の <script type="text/markdown"> の中のマーカー（16 箇所）
    reason: '[mdmark の見た目を洗い出し、mindstella のデザイントークンに揃える](https://github.com/shuhei1101/mdmark/pull/80) の当時の版に固定した docs/mock/refs/80/assets/mdmark/ の mount で描くモックで、その版は JSON のマーカーを読めない。今の書き方のまま残すと、[マーカーの今の書き方を読む処理を削除する（次のマイナーバージョンの破壊的変更）](https://github.com/shuhei1101/mdmark/issues/479) で今の書き方を参照する処理を削除した後も固定した版で描けるため、終わりの条件の範囲から除く'
    plan: none
