use_cases:
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/プラグインを入れて端末と文書のフォルダをセットアップする.yaml
    impact: following
    detail: 端末をセットアップした後に常駐サーバーが動いている場所を、起動の方法に合わせて確かめる
    depends_on:
      - dev/設計書/シナリオ/単一ユースケース/端末にmdmarkをセットアップする.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/端末にmdmarkをセットアップする.yaml
    impact: changed
    detail: 常駐サーバーを systemd --user の unit で起動し、端末の起動時にも自動で起動する流れと、tmux から unit へ移す流れを加える
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/セッションの開始で常駐サーバーの状態を受け取る.yaml
    impact: changed
    detail: 常駐サーバーが unit と tmux のどちらで動いているかと、ログの見方・止め方を受け取る
    depends_on:
      - dev/設計書/シナリオ/単一ユースケース/端末にmdmarkをセットアップする.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/文書のフォルダに設定を作る.yaml
    impact: run_only
    detail: 端末の設定のキーの一覧が増えるため、文書のフォルダの設定の確認が壊れないかを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/MCPサーバーを起動・停止する.yaml
    impact: run_only
    detail: unit から起動した常駐サーバーでも、起動・停止とポートの確かめ方が変わらないかを確かめる
    depends_on: []
