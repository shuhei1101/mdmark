scope_out:
  - item: macOS の launchd で常駐サーバーを起動する
    reason: 要望は規約『ローカルサーバーの立て方』の systemd --user に合わせることで、systemd の無い端末は今の tmux で起動できる
    plan: none
  - item: Claude Code のセッションの開始で、止まった常駐サーバーを SessionStart のフックから起動し直す
    reason: 要望に含まれない。#293 で mdmark を使わないセッションにも毎回入るため外し、今は待ち受けていないときだけ global-setup を案内する形にしている
    plan: none
