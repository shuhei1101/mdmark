use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: ER 図・クラス図のテーブルの開閉のボタンをほかの開閉と同じ見た目にし、閉じたときは閉じたことを示すアイコンだけにする。ER 図の関連の線で 1 対多の向き（どちらが多い側か）が分かるようにする。グループの角をドラッグして大きさを変えられるようにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 全画面で開いた map の図でも、線にポインターを重ねたときの動き（データの印など）が通常の表示と同じに出る
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: following
    detail: 図を辿って読む流れは変わらず、単一 UC『Mermaidと補足で図を描く』の変更に記述だけ追随する
    depends_on:
      - docs/scenario/SC-472-8.yaml
