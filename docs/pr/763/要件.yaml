scope_out:
  - item: map の図のグループ以外（ノード・ER 図のテーブル）の大きさをドラッグで変える操作
    reason: 要望はグループの角のドラッグだけで、ノードの大きさの変更を含まない
    plan: none
  - item: map 以外の図（グラフ・mermaid の図）の全画面での動き
    reason: 要望は map の図の線の動きで、他の図の全画面での動きの不具合は報告されていない。再現の確認で同じ原因が他の図に及ぶと分かったら、設計の段でスコープに含めるかを確定する
    plan: none
  - item: マインドマップの枝・軸と格子の配置の図の section と入れ子のブロック・シーケンス図のブロックの大きさを角のドラッグで変える操作
    reason: これらの図は入れ子の自動配置を使わず、木・軸・格子・記載順で位置と大きさが決まり、項目をドラッグしても動かない（SC-472-8 のマインドマップ・軸と格子の配置の図の正常シナリオ）。角を出すのは、ノードの移動が構成図と同じ規則の図のグループに限る
    plan: none
  - item: map の図の線の押せる範囲（`.map-wire-hit` の path）を、axe の target-size が実際の押せる範囲どおりに判定できる作りにする
    reason: axe が線を囲む矩形で判定し、矩形の中のノード・ボタンが target-size に当たる既存の問題で、今回の要望（#755〜#758）に含まれず、map の図の全ての線の作りに及ぶ。今回の作業 PR がマージされなくても同じ内容で成り立つ
    plan: '#764'
