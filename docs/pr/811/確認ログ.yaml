confirmations:
  - topic: 列の幅を、ドラッグをせずに変える操作の構造
    decision: 幅を広げる・狭めるのボタンやメニューは追加せず、今のドラッグ・←→ キー・ダブルクリック・ダブルタップ・Enter のままにする（案 A・B・C のどれでもない）
    decided_by: reply
    approver: shuhei1101
    thread: https://github.com/shuhei1101/mdmark/pull/811#discussion_r4709824242
  - topic: 列の並べ替えを、ドラッグをせずに変える操作の構造
    decision: テーブル設定の列名の行のつまみを 1 回押すと「前へ移す」「後ろへ移す」のメニューが開く（推奨案 B）
    decided_by: reply
    approver: shuhei1101
    thread: https://github.com/shuhei1101/mdmark/pull/811#discussion_r4709825588
  - topic: 表の操作のバーの置き場所
    decision: 見出し行の右上（最後の列のつまみの左）に「表のメニュー」のボタンを置き、件数・テーブル設定・集計・コピー・元の CSV の切り替えを入れる。元の CSV の表示ではコードブロックの右上に「表で表示」のボタンを重ねる（推奨案 B）
    decided_by: thumbs_up
    approver: shuhei1101
    commit: 269a0b9f
    thread: https://github.com/shuhei1101/mdmark/pull/811#discussion_r4710307740
