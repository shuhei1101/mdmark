use_cases:
  - kind: composite
    scenario: docs/scenario/SC-472-92.yaml
    impact: changed
    detail: 比べる前と後のリビジョンを左右に並べて読む流れと、利用側が比べる時点を選ぶときに変更表示のボタンとリビジョンの欄を出さない流れを加える（#783・#784）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-47.yaml
    impact: changed
    detail: 取り出し元を指定したとき、変更表示のボタンとリビジョンを選ぶ欄を出さずに一番新しいリビジョンとその 1 つ前の差分を出す指定の流れを加える（#784）
    depends_on:
      - docs/scenario/SC-472-92.yaml
  - kind: single
    scenario: docs/scenario/SC-472-55.yaml
    impact: changed
    detail: 前のリビジョンを左・後のリビジョンを右に描き、変えていないブロックを同じ高さで向かい合わせ、追加・削除・変更したブロックを差分のブロックの色で示す見せ方を加える（#783）
    depends_on:
      - docs/scenario/SC-472-92.yaml
  - kind: single
    scenario: docs/scenario/SC-472-63.yaml
    impact: run_only
    detail: 追加・削除した箇条書きの項目の記号を項目の 1 行目の高さに描く修正（#786）で、比較元を指定した強調が壊れないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-48.yaml
    impact: run_only
    detail: 差分のブロックの箇条書きの記号の位置の修正（#786）で、VS Code の差分のプレビューの色分けが壊れないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: 手順のバーで選んだ区切りを、少しずつ塗らずにすぐ全体を緑にする（#787）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: run_only
    detail: 再生の手順のバーの区切りの描き分けは『図を巡回する』と同じと記載しており、記述は変わらない。区切りの塗りの変更（#787）で再生が壊れないかを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: changed
    detail: map の図の線の補足を、線そのものの上では出さず、線のラベルにポインターを乗せたとき・フォーカスしたときだけ出す（#785）
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 手順のバーと線のツールチップの変更（#785・#787）で、図を辿って読む流れが壊れないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: スマートフォンで、図の中を指で縦にも動かせるようにする（#788）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-73.yaml
    impact: changed
    detail: 見出し行を留める位置を px 以外の長さの指定でも同じにし（#789）、iPad の Safari と iPhone の幅でも表の上端が留める位置に達した時にだけその位置に留める（#790）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-68.yaml
    impact: changed
    detail: 狭い幅の右側の目次の帯の固定の見せ方を、利用者が選んだ案に変える（#790）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-54.yaml
    impact: run_only
    detail: 留める位置の長さの読み方の修正（#789）で、先頭へ戻るボタンの出し分けが壊れないかを確かめる
    depends_on: []
