use_cases:
  - kind: composite
    scenario: docs/scenario/SC-477-1.yaml
    impact: changed
    detail: 今の書き方の文書は書き換える前に表・範囲の指定が描かれず記載の警告が出るため、書き換える前後の描画が同じである流れを、書き換えると描画が戻る流れに変える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-59.yaml
    impact: changed
    detail: 今の書き方のマーカーを描く正常シナリオを、指定を適用せずに記載の警告で移行を案内するシナリオに変える
    depends_on:
      - docs/scenario/SC-477-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-52.yaml
    impact: changed
    detail: 今の書き方のマーカーを持つ文字列を描くと指定のとおりに描かれる前提を、記載の警告が出る前提に変え、点検の扱いを合わせる
    depends_on:
      - docs/scenario/SC-477-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: changed
    detail: 今の書き方のマーカーを持つフォルダの点検の結果を、決めた扱いに合わせる
    depends_on:
      - docs/scenario/SC-477-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-27.yaml
    impact: following
    detail: 今の書き方の文書を書き換える移行は残るが、移行の前の文書の描画の記述を追随させる
    depends_on:
      - docs/scenario/SC-477-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-82.yaml
    impact: following
    detail: 今の書き方の変換のソースが無くなり、出していないバージョンのフォルダへ変換を出力しなくなる流れに追随する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-46.yaml
    impact: run_only
    detail: 今の書き方の外部ライブラリのマーカーを描かずに記載の警告を出す流れは変わらないが、引数の見分けの変更が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-49.yaml
    impact: run_only
    detail: 今の書き方の拡張のマーカーを描かずに記載の警告を出す流れは変わらないが、引数の見分けの変更が壊しうる
    depends_on: []
