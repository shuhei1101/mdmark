use_cases:
  - kind: composite
    scenario: docs/scenario/SC-793-1.yaml
    impact: new
    detail: アプリの画面が配布物を読み込んで表のカスタム要素に一覧のデータを指定し、利用者が表を並べ替え・絞り込みして行を開き、セルを編集して保存する流れを新規に作る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-793-2.yaml
    impact: new
    detail: アプリの画面が列の定義と行のデータを指定して表を描き、行の押下・セルの編集・行の追加をイベントで受け取る単一 UC を新規に作る
    depends_on:
      - docs/scenario/SC-793-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-28.yaml
    impact: changed
    detail: メジャーバージョンの範囲（@0）を指定した URL で配布物を読み込み、更新に追従する場合を追加する
    depends_on:
      - docs/scenario/SC-793-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-73.yaml
    impact: run_only
    detail: 表の操作の処理をカスタム要素と共有するため、文書の表の操作が変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-81.yaml
    impact: run_only
    detail: 公開関数の並びにカスタム要素の登録を追加するため、ビューとコメントを JavaScript から描く操作が変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-24.yaml
    impact: run_only
    detail: カスタム要素の登録の処理を共通にする場合に、埋め込んだ HTML のチャートが変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-82.yaml
    impact: following
    detail: 配布ファイルを分ける場合に、ビルドで得る配布物の一覧に追随する
    depends_on:
      - docs/scenario/SC-793-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-15.yaml
    impact: run_only
    detail: ガイドの索引に行を追加するため、ガイドを参照できることを確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-90.yaml
    impact: run_only
    detail: 利用側の JavaScript から描いたビューの表の操作が変わらないことを確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-85.yaml
    impact: run_only
    detail: 追加したガイドのページを参照して記載する流れが変わらないことを確認する
    depends_on: []
