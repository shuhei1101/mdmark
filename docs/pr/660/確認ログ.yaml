confirmations:
  - topic: 案内・再生の帯をバーだけにするか
    decision: 前へ・次へ・番号・停止と再生のボタン・速度を無くし、手順のバーとタイトル・説明の文だけにする。区切りを押すとその手順を 1 回再生、もう一度押すと再生し直し、バー以外を押すと停止。全ての手順の連続再生は廃止。キーボードは← → で移って再生、Esc で停止（推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/mdmark/pull/660#discussion_r4607215782
  - topic: 連続再生の廃止に、今ある自動で進める機能とマーカーの引数 play・interval を含めるか
    decision: 自動で進める機能とマーカーの引数 play・interval も廃止する。既存の文書の引数は書き方の警告にし、移行の手順で引数を削除する（別案 A）
    decided_by: reply
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/mdmark/pull/660#discussion_r4607216871
  - topic: 「バー以外をタップで停止」の範囲
    decision: 帯の中のバー以外の場所と、図の枠の中のノード・線・ボタン以外の空いた場所（ 4px 以上動かしたらドラッグとして止めない）（推奨案 A と B）
    decided_by: thumbs_up
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/mdmark/pull/660#discussion_r4607217717
