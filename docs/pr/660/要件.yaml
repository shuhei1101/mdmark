use_cases:
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図を辿って読む流れの記述は変わらないが、再生の帯の操作と C4 図の描画が変わるため E2E で流す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: 案内で、手順の全体と今の位置が分かり、離れた手順へ 1 回の操作で移り、この手順だけの再生・全ての再生・速度を選べ、手順を進めたときに関係するノードが収まる位置へなめらかに移る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: changed
    detail: シーケンスの再生で、手順の全体と今の位置・離れたメッセージへの移動・この手順だけの再生・全ての再生・速度・なめらかな移動を使える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: C4Container・C4Component・C4Dynamic・C4Deployment を C4Context と同じ記載方法で描く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: C4 の 4 種類の境界（Container_Boundary や配置先のノード）の中へ入る・開閉する
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: run_only
    detail: なめらかな移動が図の倍率と表示する枠の位置を動かすため、読者の拡大・縮小・移動の操作が壊れていないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: changed
    detail: map の範囲の外の C4 の 4 種類の mermaid のコードブロックも、C4Context と同じく補足の無い map の図で描く
    depends_on:
      - docs/scenario/SC-472-8.yaml
