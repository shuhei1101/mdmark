<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdmark for VS Code のアイコンの案</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f4f5; color: #18181b; }
  h1 { font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 32px; }
  figure { margin: 0; padding: 16px; border-radius: 8px; }
  .light { background: #ffffff; }
  .dark { background: #1e1e1e; color: #ededef; }
  .sizes { display: flex; align-items: end; gap: 16px; }
  figcaption { margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<h1>mdmark for VS Code のアイコンの案（256px・128px・42px・32px）</h1>
<section id="case-A">
  <h2>案 A: 頭文字「m」にマーカーの線を重ねる</h2>
  <div class="row">
    <figure class="light"><div class="sizes"><img src="A.svg" width="256" height="256" alt="案 A"><img src="A.svg" width="128" height="128" alt="案 A 128px"><img src="A.svg" width="42" height="42" alt="案 A 42px"><img src="A.svg" width="32" height="32" alt="案 A 32px"></div><figcaption>明るい背景</figcaption></figure>
    <figure class="dark"><div class="sizes"><img src="A.svg" width="128" height="128" alt="案 A 暗い背景"><img src="A.svg" width="42" height="42" alt="案 A 暗い背景 42px"></div><figcaption>暗い背景</figcaption></figure>
  </div>
</section>
<section id="case-B">
  <h2>案 B: Markdown の「M↓」にマーカーの線を重ねる</h2>
  <div class="row">
    <figure class="light"><div class="sizes"><img src="B.svg" width="256" height="256" alt="案 B"><img src="B.svg" width="128" height="128" alt="案 B 128px"><img src="B.svg" width="42" height="42" alt="案 B 42px"><img src="B.svg" width="32" height="32" alt="案 B 32px"></div><figcaption>明るい背景</figcaption></figure>
    <figure class="dark"><div class="sizes"><img src="B.svg" width="128" height="128" alt="案 B 暗い背景"><img src="B.svg" width="42" height="42" alt="案 B 暗い背景 42px"></div><figcaption>暗い背景</figcaption></figure>
  </div>
</section>
<section id="case-C">
  <h2>案 C: 文書の紙の上に図と表を置く</h2>
  <div class="row">
    <figure class="light"><div class="sizes"><img src="C.svg" width="256" height="256" alt="案 C"><img src="C.svg" width="128" height="128" alt="案 C 128px"><img src="C.svg" width="42" height="42" alt="案 C 42px"><img src="C.svg" width="32" height="32" alt="案 C 32px"></div><figcaption>明るい背景</figcaption></figure>
    <figure class="dark"><div class="sizes"><img src="C.svg" width="128" height="128" alt="案 C 暗い背景"><img src="C.svg" width="42" height="42" alt="案 C 暗い背景 42px"></div><figcaption>暗い背景</figcaption></figure>
  </div>
</section>
</body>
</html>
