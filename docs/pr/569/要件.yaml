  - page: docs/library/LIB-472-12.yaml
    new: false
    change: コマンドの `purpose`・`description`（Webview の TypeScript だけ・Webview の外を `ignores` で削除する）と導入の説明を、複雑さの規則を `src/`・`scripts/`・`vscode/src/` に適用する範囲に合わせる
    status: done
    updated_by: planner
    updated_at: '2026-11-14T10:34:44.428273+00:00'
  - page: docs/library/README.md
