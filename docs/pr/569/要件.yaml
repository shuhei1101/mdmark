scope_out:
  - item: '`tests/` の TypeScript（418 ファイル）への複雑さの規則の適用'
    reason: Issue の「やること」は `src/`・`scripts/`・`vscode/src/` の Webview 以外・`plugin/` に限り、テストコードを含めない。含めるかは判断が分かれるため、レビューで確定する
    plan: to_file
  - item: Webview 以外への React・アクセシビリティ・import の向き・Tailwind・記載方法（`func-style`・enum の禁止・`no-default-export`）・型の情報を使う規則の適用
    reason: Issue が広げるのは複雑さの 4 規則だけで、他の規則は Webview の React の規約に従うもの
    plan: none
