use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-42.yaml
    impact: changed
    detail: 拡大した図で、全体の中の今見えている範囲をミニマップで確かめ、ミニマップを押して表示する位置を移す。ミニマップの表示は図のパネルのボタンで切り替える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: run_only
    detail: C4Dynamic を描く記載方法と見た目は変わらないが、C4 図の描画と操作に再生の帯を加えるため壊していないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: C4Dynamic の図の下に再生の帯を出し、番号つきの関係を番号の順に 1 本ずつ選んで繰り返し再生する。手順ごとにその関係と両端の要素のほかを薄くし、データの印を流す。補足に案内の手順があるときは、状態遷移図と同じく案内を進める
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: run_only
    detail: シーケンス図の再生は変わらないが、同じ再生の帯を C4Dynamic と共用するため壊していないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図を辿って読む流れは変わらないが、図の枠と再生の帯を変えるため壊していないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-89.yaml
    impact: run_only
    detail: 埋め込んだ HTML のチャートの拡大・縮小・移動は変わらないが、図の枠にミニマップを加えるため壊していないかを確かめる
    depends_on: []
