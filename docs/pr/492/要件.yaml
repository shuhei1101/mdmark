use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-50.yaml
    impact: changed
    detail: 拡張機能の配布物を作るタグを、master の commit ではなくスプリントの区切りに develop の commit へ打つ
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-4.yaml
    impact: changed
    detail: プラグインのバージョンを固定せず、develop へ入った変更がプラグインの更新で届く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-69.yaml
    impact: following
    detail: 端末の設定の移行の目標のバージョンを、プラグインの定義ではなくビルドで埋めた mdmark のバージョンとして読む
    depends_on:
      - docs/scenario/SC-472-4.yaml
  - kind: single
    scenario: docs/scenario/SC-472-82.yaml
    impact: run_only
    detail: ビルドがプラグインの定義にバージョンを書かなくなる。配布物のバージョンの埋め方は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-28.yaml
    impact: none
    detail: バージョンのタグを固定した URL は変わらない（タグを打つブランチだけが変わる）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-10.yaml
    impact: none
    detail: 拡張機能が読むバージョンをタグの一覧から選ぶ方法は変わらない
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-91.yaml
    impact: run_only
    detail: プラグインを入れてセットアップする流れは変わらないが、プラグインの定義の変更が入れ方を壊しうる
    depends_on: []
