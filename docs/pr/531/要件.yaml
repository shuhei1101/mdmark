use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: map の範囲に erDiagram・stateDiagram-v2 の Mermaid と補足を記載すると、テーブルと関連・状態と遷移を自動配置した図として描き、補足の説明と layout を当てる。描けない種類の案内の文言を変える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-39.yaml
    impact: changed
    detail: ER 図のテーブルの列と分類の箱、状態遷移図の入れ子の状態を、構成図のグループと同じ操作で開閉し、中へ入る
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-41.yaml
    impact: changed
    detail: ER 図・状態遷移図でも補足の巡回の手順を前へ・次へで進める。状態遷移図は遷移を 1 歩ずつ進める再生を持つ
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-19.yaml
    impact: following
    detail: 要素を選んで関わるものだけを強調する操作を、ER 図のテーブル（関連するテーブル）と状態遷移図の状態（入る遷移と出る遷移）にも広げるのに合わせて、選択と強調の記述を種類に依らない形に揃える
    depends_on:
      - docs/scenario/SC-472-8.yaml
  - kind: single
    scenario: docs/scenario/SC-472-11.yaml
    impact: run_only
    detail: map の範囲の外の erDiagram・stateDiagram-v2 のコードブロックは、今までどおり mermaid で描く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-18.yaml
    impact: run_only
    detail: シーケンス図の再生の操作は変わらないが、再生と巡回の帯を状態遷移図と共通にするため壊しうる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 図の種類に依らない流れで記述は変わらないが、map の読み取り・配置・操作を広げるため壊しうる
    depends_on: []
