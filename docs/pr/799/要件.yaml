use_cases:
  - kind: composite
    scenario: docs/scenario/SC-797-1.yaml
    impact: new
    detail: アプリの画面が配布物を読み込み、ビュー・コメント・グラフ・操作できる部品・map の図のカスタム要素にアプリのデータを指定して描き、利用者の操作をイベントで受け取って保存・詳細を開く流れを新規に作る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-797-2.yaml
    impact: new
    detail: アプリの画面が部品のカスタム要素を配置し、JavaScript のプロパティでデータを指定して描き、操作をイベントで受け取る単一 UC を新規に作る（部品ごとにシナリオを分ける）
    depends_on:
      - docs/scenario/SC-797-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-81.yaml
    impact: run_only
    detail: ビューを描く関数・コメントを付ける関数の処理をカスタム要素と共有するため、JavaScript から描くビューとコメントが変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-24.yaml
    impact: run_only
    detail: 図の部品をカスタム要素で配ると埋め込んだ HTML のチャートと同じ部品の名前を扱うため、文書のチャートの描き方が変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-793-2.yaml
    impact: run_only
    detail: カスタム要素の登録の並びに部品を追加するため、表のカスタム要素が変わらないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-82.yaml
    impact: following
    detail: 部品のカスタム要素を別の配布ファイルに分ける場合に、ビルドで得る配布物の一覧に追随する
    depends_on:
      - docs/scenario/SC-797-1.yaml
  - kind: single
    scenario: docs/scenario/SC-472-15.yaml
    impact: run_only
    detail: ガイドの索引に行を追加するため、ガイドを参照できることを確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-90.yaml
    impact: run_only
    detail: 利用側の JavaScript から描いたビューの操作が変わらないことを確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-793-1.yaml
    impact: run_only
    detail: アプリの一覧を表のカスタム要素で探して編集する流れが変わらないことを確認する
    depends_on: []
