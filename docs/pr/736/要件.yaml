scope_out:
  - item: フロントマターの related を索引の関連として参照すること
    reason: 要望はタイトル・タグなどのメタデータで、関連は相手の id を要し索引に残す推奨のため。参照するキーの決定で入れるときはスコープに戻す
    plan: none
  - item: VS Code 拡張機能のプレビューのタブの名前をフロントマターの title にすること
    reason: 要望の「文書のタイトル」に含めるか判断が分かれる。今の判断は、プレビューのタブは開いているファイルを示す VS Code の UI で、文書のタイトルではないため含めない。レビューで確定する
    plan: none
