use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-76.yaml
    impact: changed
    detail: まとめた文書の一覧と開いている文書のタイトルに、文書の先頭のフロントマターのタイトルを使用する。索引に無い文書もフロントマターのメタデータで参照・被参照に入る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-56.yaml
    impact: changed
    detail: 書き出した HTML のページのタイトルに、フロントマターのタイトルを使用する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-75.yaml
    impact: changed
    detail: 関連文書の一覧のタイトルと、本文の単語に一致する文書の別名に、フロントマターの値を使用する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-70.yaml
    impact: changed
    detail: 索引とフロントマターの両方に違う値があるとき、ずれとして通知する（優先の決定による）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-78.yaml
    impact: following
    detail: 索引と文書のずれを点検するの変更に追随し、mdmark check が同じずれを返却する
    depends_on:
      - docs/scenario/SC-472-70.yaml
  - kind: single
    scenario: docs/scenario/SC-472-6.yaml
    impact: changed
    detail: VS Code から書き出した HTML のページのタイトルに、フロントマターのタイトルを使用する（今はファイル名）
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-95.yaml
    impact: changed
    detail: 文書の作成者が、索引の代わりに文書の先頭のフロントマターにタイトル・タグを記載しても、点検に合格して 1 枚の HTML の文書の一覧に出る流れを加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-13.yaml
    impact: run_only
    detail: 文書の一覧と帯のタイトルの元が変わるため、文書の行き来が壊れていないことを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-59.yaml
    impact: run_only
    detail: フロントマターの解析が加わっても、文書の描き方が変わらないことを確認する
    depends_on: []
