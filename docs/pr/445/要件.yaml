use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/mermaidの図を描く.yaml
    impact: changed
    detail: map のマーカーの範囲の中の mermaid のブロックは、mermaid のライブラリで描く図にしない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/設定と索引を点検する.yaml
    impact: changed
    detail: map の補足の書き間違い・指すノードの無い参照・補足の値の -- を、点検で知らせる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/文字列とYAMLのキーの記法を点検する.yaml
    impact: changed
    detail: 描いたときの map の書き方の警告を、文字列の点検でも同じく受け取る
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/機能のオン・オフを文書で上書きする.yaml
    impact: changed
    detail: 設定と文書の印で、map の図をオン・オフする
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/図を描く.yaml
    impact: run_only
    detail: 座標で書いたフロー図・シーケンス図は変わらないが、図の枠と凡例を map と共通にし、シーケンス図の部品に複合フラグメント・注記・活性化・矢印の種類・まとまりの描き方を追加するため壊しうる。図の枠のリサイズハンドルが、枠線の無い下端の帯と横の 2 本線のアイコンに変わる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/図を拡大・縮小・移動する.yaml
    impact: changed
    detail: 全ての図で、リサイズハンドルを枠線の無い下端の帯と横の 2 本線のアイコンにし、高さの上限を外し、ダブルクリックで倍率を変えずに図の全体が収まる高さに合わせる（今は定義から決まる高さに戻し、倍率も変わる）
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/図の要素のツールチップを確認する.yaml
    impact: run_only
    detail: 図のツールチップを map の補足の説明でも使うため壊しうる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/用語の意味をツールチップで確認する.yaml
    impact: run_only
    detail: 用語の下線を map のラベルと説明にも付けるため壊しうる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す.yaml
    impact: run_only
    detail: 書き出した 1 枚の HTML でも map を描くため壊しうる
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/固有の部品で図の文書を描いて確認する.yaml
    impact: run_only
    detail: 図の文書の描き方と操作を map と共通にするため壊しうる
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
    impact: new
    detail: 文書の作成者が Mermaid と補足で図を記載して点検し、読者が描いた図をグループの中へ入る・開閉・巡回・シーケンスの再生で辿る
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/Mermaidと補足で図を描く.yaml
    impact: new
    detail: map の範囲の Mermaid と補足を、入れ子のグループを自動配置した図に描き、補足の layout で配置と見た目を上書きする。構成図の 3 層とシーケンス図も描く。印の引数と補足は A-128 の構成の JSON のオブジェクトで、知らないキーは無視して点検が通知する
    depends_on:
      - dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/図のグループの中へ入る・開閉する.yaml
    impact: new
    detail: 読者がグループの中へ入って戻るボタンか Esc で戻り、グループを閉じて中への線をまとめた件数とツールチップの元の線で見る。開閉と中へ入った状態は描き直しても保つ
    depends_on:
      - dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/図を巡回する.yaml
    impact: new
    detail: 読者が案内の手順を前へ・次へで進め、手順ごとのグループ・強調と説明を読む
    depends_on:
      - dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/シーケンスを構成図の上で再生する.yaml
    impact: new
    detail: 読者がシーケンス図を、同じノードを持つ構成図の上で 1 通ずつ、手で、または選んだ間隔で自動で進めて読む。今のメッセージの線の印は再生している間繰り返し動き、動きを減らす設定では強調と文だけを出す
    depends_on:
      - dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/シーケンス図の参加者を選んで強調する.yaml
    impact: new
    detail: 読者が map のシーケンス図の参加者を選んでメッセージとライフラインを強調し、参加者の表示と非表示・並び順を変える（#404 を取り込む）
    depends_on:
      - dev/設計書/シナリオ/複合ユースケース/Mermaidと補足で書いた図を辿って読む.yaml
