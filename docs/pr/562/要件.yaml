use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-71.yaml
    impact: changed
    detail: 脚注の参照の番号のツールチップと末尾の閉じた一覧を、ID で定義した注釈と共用する。注釈の定義・本文と表のセルからの参照・マーカーのツールチップ・末尾の注釈の一覧を読む流れを、このシナリオに足すか新しい単一ユースケースに分けるかは単一ユースケース設計で決める
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: changed
    detail: map の図のノードと線から注釈を参照し、図のツールチップで注釈の本文を読む（ノードの説明とは別に出す）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-52.yaml
    impact: changed
    detail: 記法の点検で、定義の無い注釈の ID の参照と、参照されていない注釈の定義を警告として受け取る
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: following
    detail: map の補足でノードと線から注釈を参照できるようになることに、補足の記載と読み込みの流れを追随させる
    depends_on:
      - docs/scenario/SC-472-40.yaml
  - kind: single
    scenario: docs/scenario/SC-472-58.yaml
    impact: run_only
    detail: 印刷で末尾の注釈の一覧を開いて出す。脚注の一覧の印刷を壊さないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-76.yaml
    impact: run_only
    detail: 1 枚にまとめた HTML でも注釈のマーカーとツールチップが働くかを確かめる
    depends_on: []
