use_cases:
  - kind: single
    scenario: docs/scenario/SC-472-71.yaml
    impact: run_only
    detail: 脚注の番号・ツールチップ・末尾の一覧の部品を注記と共用するため、脚注の表示と操作を壊さないかを確かめる。注記の流れは SC-472-96 に分けた
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-40.yaml
    impact: changed
    detail: map の図のノードと線から注記を参照し、図のツールチップで注記の本文を読む（ノードの説明とは別に出す）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-52.yaml
    impact: changed
    detail: 記法の点検で、定義の無い注記の ID の参照・参照されていない注記の定義・同じ ID の 2 つ目の定義を警告として受け取る
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-472-87.yaml
    impact: run_only
    detail: 補足に注記の参照のキーが増えても、補足で書いた図を辿って読む流れが壊れないかを確かめる。複合ユースケースの流れは変えない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-58.yaml
    impact: changed
    detail: 注記を持つ文書の印刷で、末尾の注記の一覧を開いて出し、印刷の後に閉じるシナリオを足す。脚注の一覧の印刷は変えない
    depends_on:
      - docs/scenario/SC-472-96.yaml
  - kind: single
    scenario: docs/scenario/SC-472-76.yaml
    impact: changed
    detail: 1 枚にまとめた HTML で、文書ごとの注記のマーカーのツールチップと末尾の一覧の戻るリンクが、同じ ID でも文書を取り違えずに働くシナリオを足す
    depends_on:
      - docs/scenario/SC-472-96.yaml
  - kind: single
    scenario: docs/scenario/SC-472-96.yaml
    impact: new
    detail: ID つきで定義した注記を本文・表のセルの複数の場所から参照し、マーカーのツールチップと末尾の閉じた一覧で確認する。定義の無い参照・参照されていない定義・同じ ID の 2 つ目の定義に記載の警告を出す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-472-8.yaml
    impact: changed
    detail: map のシーケンス図・状態遷移図の Mermaid の `note` の呼び名を「注記」から「ノート」に改める（状態遷移図の種類の行の表示を含む）。配置と操作は変えない
    depends_on: []
