    reason: '#532 の終了の条件が挙げる対象は export_html・build_site・CLI の export・build だけで、VS Code 拡張機能の書き出しは jsDelivr の配布物で mount に Markdown を指定する別の経路。今の判断はスコープ外だが、同じ「書き出した HTML から元の Markdown を参照できる」事象のため、含めるかをレビューで確定する'
    plan: to_file
