lead: 文書の作成者が、開いている Markdown の横の列か同じ列に、mdmark で描くプレビューのパネルを開く。拡張機能は読み込む mdmark のバージョンを決め、Webview に jsDelivr の配布物を読み込ませて描かせる。差分ビューから開いたときは、変更前と変更後の Markdown を読み込み、変更後の文書のブロックを色分けして描かせる。
idempotent: true
side_effects: Webview のパネルを開く。`mdmark.version` が `latest` のとき GitHub のタグ一覧を 1 回取り、選んだバージョンを拡張機能の `globalState` の `mdmark.lastVersion` に記載する。差分ビューのときは、変更前と変更後の文書を `workspace.openTextDocument` で読み込む。設定に `aliases` があるときは、その行の `paths` の YAML を読み込む。Markdown・設定ファイル・Git のリポジトリは書き換えない
callers:
  - SC-472-10#
  - SC-472-32#
  - SC-472-31#
exclusivity: 1 つの Markdown に 1 つのパネルと、変更前と変更後の URI の組ごとに 1 つの差分のパネル。同じ Markdown のパネルが開いていれば、新しく作らずにそのパネルを今の列のまま表に出す
request:
  - name: uri
    type: vscode.Uri
    required: false
    default: なし（アクティブなエディタの文書。mdmark のプレビューにフォーカスがあるときはそのプレビューの Markdown）
    location: argument
    description: プレビューを開く Markdown。エディタのタイトルのボタンから呼ぶと VS Code がそのエディタの文書を指定する
    constraints: '`languageId` が `markdown` の文書'
response:
  - name: '-'
    type: Promise<void>
    description: パネルを開き、Webview に描かせる HTML を入れたら解決する（描き終わりを待たない）
exceptions:
  - name: なし（正常終了）
    condition: パネルを開き、決めたバージョンの mdmark で文書を描く
  - name: なし（描けない理由・オフライン）
    condition: Webview が配布物を読み込めず、配布物の URL への確認の要求も応答が無いか 404 以外の失敗を返却する
    notes: 例外を投げず、パネルに描けない理由と「リロード」を出す
  - name: なし（描けない理由・指定したバージョンが無い）
    condition: 配布物の URL が 404 を返却する
    notes: 同上
  - name: なし（描けない理由・バージョンを決められない）
    condition: '`mdmark.version` が `latest` で、タグ一覧を取れず、`mdmark.lastVersion` も無い'
    notes: 配布物を要求せず、パネルに描けない理由と「リロード」を出す
  - name: なし（Markdown でない）
    condition: 対象の文書が Markdown でないか、対象の文書が無い
    notes: 何もしない。コマンドは `editorLangId == markdown` か mdmark のプレビューにフォーカスがあるときだけ、エディタのタイトル・ショートカット・コマンドパレットに出す（`package.json` の `when`）
  - name: なし（ワークスペースの外の画像）
    condition: 本文の画像が `localResourceRoots` の外を指す
    notes: Webview が読み込まず `alt` が出る。他の本文は描く
  - name: なし（aliases の YAML を使用できない）
    condition: '`aliases` の行の `paths` に該当するファイルが無い・YAML として読み込めない・行やレコードが `buildAliases` で使用できない'
    notes: 例外を投げず、使用できない行・レコードを除いたエイリアスで描き、出力チャネルに警告を記載する。`configError` は送信しない
  - name: なし（描けない理由・差分に対応しないバージョン）
    condition: 差分のパネルで、読み込んだ配布物が `diffModes` を持たないか `blocks` を含まない
    notes: 変更後の文書だけを描いた表示は出さない。Markdown と差分ビューは変えない
constraints:
  - item: 配布物の URL
    constraint: '`https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@{バージョン}/dist/index.js` と `.../dist/index.css`。バージョンなしの URL と `@latest` は使用しない'
    notes: docs/external-api/API-472-2
  - item: バージョンの決め方
    constraint: '`mdmark.version` が `latest` のときは GitHub の `GET /repos/shuhei1101/mdmark/tags?per_page=100` を header `Link` の `rel="next"` が無くなるまで辿って全てのページを読み込み、その名前から `^v\d+\.\d+\.\d+$` に合うものだけを取得し、数で比べて最大を選ぶ（`vscode-` で始まるタグは取得しない）。`latest` でないときは記載したバージョンをそのまま使用し、タグ一覧を取らない。タグ一覧はプレビューを開くときとリロードしたときだけ取り、再描画するたびには取らない'
    notes: docs/external-api/API-472-1
  - item: タグ一覧の待ち
    constraint: 待ちの上限は全てのページを読み込み終えるまでの合計にかけ、超えたら要求を打ち切る。上限を超えたとき・ネットワークのエラー・200 以外（上限を超えた 403・429 を含む）・合うタグが 0 件のときは、取れなかったものとして前回のバージョンを使用する。再試行しない
    decided_by: NFR-472-1#requirements[タグ一覧を取る待ちの上限]
  - item: 前回のバージョン
    constraint: タグ一覧から選んだバージョンを `globalState` の `mdmark.lastVersion` に記載し、取れないときに読み込む。`latest` でないバージョンを記載したときは書き換えない
  - item: パネル
    constraint: 'viewType `mdmark.preview`、タブのタイトル `プレビュー {ファイル名}`。`openPreviewToSide` は `ViewColumn.Beside`、`openPreview` は `ViewColumn.Active` に開く。`enableScripts: true`・`retainContextWhenHidden: false`。`localResourceRoots` は Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）と、拡張機能の `media/`'
    notes: 背面に回したパネルは Webview が再作成され、`ready` を受けて最後の全文をもう一度送信し、背面に回す前のスクロールの位置へ戻す（プレビューを再描画する.ts）
  - item: CSP
    constraint: "`default-src 'none'; script-src 'nonce-{nonce}' {配布物の origin} {libraries の origin} {html-scripts.url の origin} {mermaid.url の origin} {syntax.url の origin} {cspSource}; style-src {配布物の origin} {cspSource} 'unsafe-inline'; img-src {cspSource} https: data:; media-src {cspSource} https: data:; font-src {配布物の origin} {cspSource}; connect-src {配布物の origin}`。`{cspSource}` は `Webview.cspSource`、nonce は HTML を入れるたびに再作成する。`libraries`・`html-scripts.url`・`mermaid.url`・`syntax.url` の origin は設定ファイルの `http:`・`https:` の URL の origin だけ（`html-scripts.url`・`mermaid.url`・`syntax.url` を記載しないときは既定の jsDelivr の origin）。mermaid が図の SVG に入れるインラインの `style` は、今の `style-src 'unsafe-inline'` で受ける。範囲の `ts`・`js` は、`mount` がページの `script[nonce]` の nonce を付けた `script` 要素で動かすため、`blob:`・`'unsafe-inline'`・`'unsafe-eval'` を追加しない。まとめていない名前のアイコンを読み込む `https://cdn.jsdelivr.net` を `script-src` と `connect-src` に含める"
    notes: "図とヒントの部品が HTML に `style` 属性を記載するため `style-src` に `'unsafe-inline'` が要る（PoC #70）。スクリプトは nonce で絞る"
  - item: 相対パスの基準
    constraint: Webview の HTML に `<base href="{Markdown のフォルダの asWebviewUri}/">` を配置し、本文の相対パスの画像を Markdown のフォルダから読み込む。`localResourceRoots` の外の画像は Webview が読み込まず、`alt` が出る
  - item: Webview とのメッセージ
    constraint: '拡張機能 → Webview: `{ type: "render", markdown, previous?, config, theme, includes, aliases? }`（`aliases` は制約「エイリアス」のエイリアスの配列で、設定に `aliases` が無いときは持たない、`includes` は制約「取り込む文書」の取り込む文書の表、`previous` は差分のパネルだけが持つ変更前の Markdown、`config` は `{ features?, libraries?, "html-scripts"?, "side-toc"?, labels?, mermaid?, map?, tooltips?, syntax?, colorTheme?, colorScheme? }`、`theme` は `mdmark.preview.theme` の値）・`{ type: "scrollToLine", line }`・`{ type: "configError", path, line?, settingKey? }`（`line` と `settingKey` はどちらか一方）・`{ type: "configOk" }`・`{ type: "theme", href }`・`{ type: "assetsResolved", id, urls }`（`urls` は `paths` の各パスから Webview の URL か `null` を参照するオブジェクト）・`{ type: "inspect", id, selector }`・`{ type: "axe", id }`（どちらもテストのときだけ）。Webview → 拡張機能: `{ type: "ready" }`（配布物を読み込み終えた）・`{ type: "rendered" }`（`mount` か `update` を呼び終えた）・`{ type: "loadFailed", reason }`（`reason` は `offline`・`versionMissing`・`diffUnsupported`）・`{ type: "openLink", href }`・`{ type: "revealLine", line }`・`{ type: "reload" }`・`{ type: "openConfig" }`・`{ type: "resolveAssets", id, paths }`（制約「動画・音声とアセットのルートの解決」）・`{ type: "openAsset", path }`（制約「再生できない動画・音声」）・`{ type: "inspected", id, elements }`（テストのときだけ。`elements` は `selector` に該当する要素ごとの `{ tagName, className, attributes, text, naturalWidth?, top, height }`。`top` は見えている範囲の先頭からの位置、`height` は高さで、単位は px）・`{ type: "axed", id, violations }`（テストのときだけ。`violations` は axe-core の違反ごとの `{ id, impact, targets }`）。`render` は初回と `config` か `aliases` が変わったときは `mount`（前の描画は `destroy`）、それ以外は戻り値の `update` で描く'
    notes: '`line` は 0 始まりの元の行番号（文書をHTML文字列にする.ts の制約「元の行番号」）'
  - item: 描けない理由の見分け方
    constraint: Webview は `import()` が失敗したら、同じ `index.js` の URL を `fetch` の `HEAD` で確認する。404 なら `versionMissing`、それ以外（ネットワークのエラーを含む）は `offline` を拡張機能へ通知し、パネルに描けない理由を出す。バージョンを決められないときは、拡張機能が配布物を読み込まない HTML で理由を出す
  - item: 配色
    constraint: '`mdmark.preview.theme` が `light`・`dark` のときは、Webview の描く先の要素を包む要素に `mdmark-theme-light`・`mdmark-theme-dark` を付ける。`auto` のときは付けず、設定ファイルの `colorScheme` を `config` で指定し、無ければ VS Code が `body` に付ける class に任せる。`light`・`dark` のときは `config` から `colorScheme` を除く。明暗は、文書の page のマーカー → `mdmark.preview.theme`（`auto` 以外）→ 設定ファイルの `colorScheme` → VS Code のテーマの順に決まる（確認ログ）。設定を変えると開いているパネルへ `render` をもう一度送信する'
    notes: docs/interface/IF-472-35.ts の制約「配色の切り替え」
  - item: テストのときの差し替え
    constraint: '`ExtensionContext.extensionMode` が `ExtensionMode.Test` のときだけ、環境変数 `MDMARK_VSCODE_DIST_BASE`（配布物の配信元）と `MDMARK_VSCODE_TAGS_URL`（タグ一覧の取得先）を読み込む。CSP の配布物の origin も差し替えた配信元の origin にする。それ以外のモードでは読み込まない。`ExtensionMode.Test` のときだけ、Webview の HTML に `inspect` を受ける処理を入れ、`activate` は開いているパネルへ `inspect` を送信して `inspected` の `elements` を返却する `inspectPreview(selector)` を戻り値で返却する。同じく `axe` を送信して `axed` の `violations` を返却する `auditPreview()` も返却する。Webview はテストのビルドが配置した axe-core を `axe` を受けたときだけ読み込む。Webview はテストのときだけ `document` の `securitypolicyviolation` を数え、`html` 要素の `data-mdmark-csp-violations` に件数を持つ。結合テストは Webview の DOM の期待値・アクセシビリティの違反・CSP の違反の件数（`inspectPreview("html")` の属性）をこの戻り値で確認する'
    notes: docs/config/CFG-472-2
  - item: 対応する VS Code
    constraint: '`engines.vscode` の下限より古い VS Code には入らない'
    decided_by: NFR-472-1#requirements[対応する VS Code のバージョン]
  - item: 差分ビューの判定
    constraint: コマンドを呼んだとき、`window.tabGroups.activeTabGroup.activeTab` の入力が `TabInputTextDiff` で、コマンドに指定された `uri` がそのタブの `original` か `modified` と一致し（`uri` が無ければそのタブを使用する）、`original`・`modified` の文書の `languageId` がどちらも `markdown` なら差分ビューとして扱う。該当しないときは、今のとおり 1 つの Markdown のプレビューを開く。差分ビューの変更前の側にフォーカスがあるときも、変更後の側を対象にする。複数ファイルの差分エディター（`TabInputTextDiff` でない入力）は差分ビューとして扱わない
    notes: PoC で作業ツリー・ステージ・コミットの差分がどれも `TabInputTextDiff` で両側 `markdown` になることを確認した（計画書）。複数ファイルの差分エディターは要件のスコープ外。ボタンとショートカットは今の `editorLangId == markdown` のまま差分ビューの両側に出る
  - item: 差分のパネル
    constraint: viewType は `mdmark.preview` のままで、タブのタイトルは `差分プレビュー {変更後のファイル名}`。変更前と変更後の URI の組で持ち、同じ組のパネルが開いていれば作らずに表に出す。同じ変更後の URI の差分でないパネルとは別に持つ。`localResourceRoots`・相対パスの基準・設定ファイルの場所は、変更後の側が `file:` のときはそのファイル、`git:` のときはその URI の `path` のファイルを基準にする
    notes: タブのタイトルは確認ログの決定（A）
  - item: 差分の受け渡し
    constraint: 拡張機能は `original`・`modified` の URI を `workspace.openTextDocument` で読み込み、`render` の `markdown` に変更後、`previous` に変更前の全文を入れる。Webview は `previous` を持つ `render` を受けたら、`revisions` が `modified`・`original` の 2 つをこの順に返却し、`content` がそれぞれその時点の変更後・変更前の全文を返却する `DiffSource` を作り、`docId` を `diff`、`diffMode` を `blocks` にして `mount` に指定する。`update` で再描画するときは、取り出し元が返却する全文を先に書き換えてから `update` を呼ぶ
    notes: 拡張機能は Git を呼ばず、`git:` の URI も VS Code の Git の機能が返却する内容を使用する（計画書）。`revisions` の `at` は描くたびの時刻で、`blocks` では出さない
  - item: 差分に対応しないバージョン
    constraint: Webview は差分の `render` を受けたとき、読み込んだ配布物の `diffModes` が無いか `blocks` を含まなければ、`mount` を呼ばずに `loadFailed`（`diffUnsupported`）を通知し、描けない理由 `読み込んだ mdmark（{バージョン}）は差分の表示に対応していません。設定 mdmark.version を差分の表示に対応したバージョンか latest に変更してから、リロードしてください。` と「リロード」を出す
    notes: 判定はライブラリ本体の文書を描く.ts の制約「対応する差分の出し方」。文言は確認ログの決定（A）。記載方法（`code` の位置）は画面設計
  - item: 動画・音声とアセットのルートの解決
    constraint: '`mount` か `update` の後に、Webview は本文の `img` の `src`、`video`・`audio` の `src` と `poster` のうち相対パスのものを集め、`resolveAssets` で拡張機能に送信する。拡張機能は、Markdown のフォルダを基準にしたファイル、無ければ設定ファイルの `assets.root` を基準にしたファイルがワークスペースの中にあれば、その `asWebviewUri` の URL（クエリとフラグメントは残す）を、どちらにも無ければ `null` を返却する。Webview は URL を受け取った要素の属性を替え、`null` の要素は替えない。`localResourceRoots` に `assets.root` のフォルダを含める'
    decided_by: CFG-472-2#settings[assets.root]
  - item: 再生できない動画・音声
    constraint: '`video`・`audio` が `error` になったとき、要素を mdmark の通知ブロックの外観の枠に替え、プレビューで再生できないことと、`openAsset` を送信する「既定のアプリで開く」のリンクを出す。拡張機能は受け取ったパスを制約「動画・音声とアセットのルートの解決」と同じく解決し、ワークスペースの中のファイルだけを `vscode.env.openExternal` で開く'
    notes: PoC 結果で、プレビューの Webview は AAC の音声と webm を再生できない。mp4・mov は映像だけが再生される
  - item: 取り込む文書
    constraint: 開いている Markdown（差分のパネルは変更後の側）の include のマーカーの取り込み先を、インターフェース定義『文書をHTML文字列にする』の制約「取り込み」と同じパスの解き方で、Markdown のフォルダを基準に `workspace.fs` で読み込む（取り込んだ文書の中のマーカーもたどり、同じファイルは 1 回だけ読み込む）。開いているエディタの保存していない書き換えではなく、保存した中身を読み込む。設定ファイルのフォルダ（無ければ Markdown のフォルダ）の外のパス（書き出しと同じ範囲）と読み込めないファイルは表に入れず、そのマーカーの場所には mdmark が記載の警告を出す。読み込んだ表を `render` の `includes` に入れ、Webview は `mount` の `opts.includes`（`update` は `options.includes`）に指定する
    notes: プレビューでも取り込むことは確認ログの決定
  - item: エイリアス
    constraint: '重ねた設定に `aliases` があるとき、インターフェース定義『エイリアスを作る』の CLI と同じ読み込み方（`src/cli/aliases.ts` の `loadAliases`）で、各行の `paths` を値を記載した設定ファイルのフォルダから参照して YAML を読み込み、作ったエイリアスを `render` の `aliases` に入れる。`loadAliases` に指定する設定ファイルは、最も近い `mdmark.config.yaml`（`mdmark.configPath` を記載したときはそのファイル）で、無いときは端末の設定ファイルにする（CLI の `requireConfig` と同じく、重ねた設定のパスの値をそのファイルのフォルダからの相対パスに戻して指定する）。Webview は `mount` の `opts.aliases` に指定する。使用できない行・レコードは除き、ずれごとに CLI の `mdmark check` と同じ `{file}:{where}: {kind}: {message}`（`where` が空なら `{file}: {kind}: {message}`）の警告を出力チャネルに書き込む。エイリアスを作るのは設定を再読み込みしたときと、制約の YAML のファイルが変わったときだけで、Markdown の書き換えでは再作成しない'
    notes: 書き出す HTML も同じ読み込み方でエイリアスを埋める（HTMLに書き出す.ts の制約「エイリアス」）
