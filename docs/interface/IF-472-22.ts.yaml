        PV-->>W: 図の枠に入った mermaid の図
    expected:
      - パネルの mermaid のコードブロックの場所に `figure.mdmark-diagram[data-diagram="mermaid"]` があり、SVG を持ち、通知ブロックが無い
      - Webview の HTML の CSP の `script-src` に `mermaid.url` の origin があり、`blob:`・`'unsafe-inline'`・`'unsafe-eval'` が無い
