id: IF-472-22
visibility: internal
title: "プレビューを開く"
entry:
  kind: operation
  value: コマンド `mdmark.openPreviewToSide`・`mdmark.openPreview`（VS Code 拡張機能のコマンド）
flows:
  - name: 正常系
    summary: タグ一覧から最新のバージョンを選び、横の列のパネルに描かせる
    setup:
      - name: 見本のワークスペース
        description: 見出し・表・注意書き・map の構成図を持つ `guide.md` を配置したフォルダ。`mdmark.version` は既定の `latest`。`mdmark.lastVersion` は空
      - name: Mock
        description: '`MDMARK_VSCODE_DIST_BASE` に、このブランチでビルドした配布物を `@{バージョン}/dist/` の構造の URL で配る手元のサーバー。`MDMARK_VSCODE_TAGS_URL` に `v0.7.0`・`v0.10.0`・`v0.6.0`・`vscode-v0.11.0` を返却する代役'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as Webview
        participant CDN as jsDelivr
        U->>EX: mdmark.openPreviewToSide
        EX-->>GH: タグ一覧を取る
        GH-->>EX: v0.7.0・v0.10.0・v0.6.0・vscode-v0.11.0
        EX->>EX: v0.10.0 を選び mdmark.lastVersion に記載する
        EX->>PV: 横の列にパネルを開き HTML を入れる
        PV-->>CDN: v0.10.0 の index.js・index.css
        PV->>EX: ready
        EX->>PV: render（全文・設定・theme）
        PV->>EX: rendered
    expected:
      - パネルが `ViewColumn.Beside` に開き、タイトルが `プレビュー guide.md`
      - 配布物の要求が `@v0.10.0/dist/index.js`・`@v0.10.0/dist/index.css` と、map の構成図を描く `@v0.10.0/dist/map.js` だけで、`vscode-v0.11.0` を選んでいない（文字の並びでなく数で比べている）
      - '`mdmark.lastVersion` が `v0.10.0`'
      - '`rendered` を受けた後、Webview の本文に見出し・表・注意書き・map の構成図の要素がある'
      - Webview の HTML の CSP が制約「CSP」のとおりで、`script` 要素が全て nonce を持つ
      - '`auditPreview()` が返却するパネルの部品の axe の違反が 0 件'
    test: test_normal
  - name: 正常系（同じ列に開く）
    summary: '`mdmark.openPreview` は同じ列のタブに開く'
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreview
        EX->>PV: 同じ列にパネルを開く
        PV->>EX: rendered
    expected:
      - パネルが Markdown のエディタと同じ列に開き、`rendered` が届く
    test: test_normal_when_same_column
  - name: 正常系（開いているパネルを表に出す）
    summary: 同じ Markdown のパネルがあれば、作らずに表に出す
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系の後。パネルの列で別のタブを表にしておく
      - name: Mock
        description: 正常系と同じ。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: 開いているパネルを reveal
    expected:
      - mdmark のパネルが 1 つのままで、そのパネルが表にある
      - タグ一覧の代役が 2 回目に呼ばれていない
    test: test_normal_when_already_open
  - name: 正常系（バージョンを固定する）
    summary: '`mdmark.version` に記載したバージョンを、タグ一覧を取らずに読み込む'
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。ワークスペースの設定で `mdmark.version` を `v0.6.0` にする。`mdmark.lastVersion` は `v0.7.0`
      - name: Mock
        description: 正常系と同じ。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        participant CDN as jsDelivr
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: v0.6.0 で HTML を入れる
        PV-->>CDN: v0.6.0 の index.js・index.css・map.js
        PV->>EX: rendered
    expected:
      - 配布物の要求が `@v0.6.0/dist/` の `index.js`・`index.css`・`map.js` の 3 つ
      - タグ一覧の代役が 1 回も呼ばれない
      - '`mdmark.lastVersion` が `v0.7.0` のまま'
    test: test_normal_when_version_pinned
  - name: 正常系（タグ一覧を取れない）
    summary: タグ一覧が待ちの上限まで返らないとき、前回のバージョンで描く
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.lastVersion` は `v0.6.0`
      - name: Mock
        description: タグ一覧の代役は待ちの上限を超えても応えない。配布物は正常系と同じ
        notes: 403 を返却する代役でも同じ結果になることを同じテストで確認する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX-->>GH: タグ一覧を取る
        GH--xEX: 待ちの上限まで応答なし
        EX->>PV: 前回の v0.6.0 で HTML を入れる
        PV->>EX: rendered
    expected:
      - コマンドを呼んでから待ちの上限（3 秒）を少し過ぎたところで `@v0.6.0/dist/index.js` が要求される
      - 描けない理由を出さず、`rendered` が届く
      - '`mdmark.lastVersion` が `v0.6.0` のまま'
    test: test_normal_when_tags_unreachable
  - name: 正常系（配色を固定する）
    summary: '`mdmark.preview.theme` の `light`・`dark` を包む要素の class にし、`auto` に戻すと削除する'
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.preview.theme` を `light` にする
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: render（theme: light）
        PV->>EX: rendered
        U->>EX: mdmark.preview.theme を auto にする
        EX->>PV: render（theme: auto）
        PV->>EX: rendered
    expected:
      - '`light` の間、描く先を包む要素が class `mdmark-theme-light` を持ち、`mdmark-theme-dark` を持たない'
      - '`auto` にすると、パネルをもう一度開かずに包む要素が `mdmark-theme-*` を持たなくなる'
    test: test_normal_when_theme_fixed
    refs:
      - SC-472-32#scenarios[正常シナリオ（配色を固定する）]
  - name: 正常系（設定ファイルと文書のマーカーの明暗）
    summary: '`mdmark.preview.theme` が `auto` のときは設定ファイルの `colorScheme` を指定し、文書の page のマーカーはどの設定より優先する'
    setup:
      - name: 明暗を記載した設定ファイル
        description: '開いた Markdown のワークスペースの `mdmark.config.yaml` に `colorScheme: light` を記載する'
      - name: ダークのテーマ
        description: VS Code のテーマが Default Dark Modern で、`mdmark.preview.theme` は `auto`
      - name: Markdown
        description: 'マーカーを持たない `a.md` と、先頭の行に `<!-- page: {"scheme": "dark"} -->` を持つ `b.md`'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor U as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        U->>EX: a.md のプレビューを開く
        EX->>PV: render（config.colorScheme: light）
        U->>EX: mdmark.preview.theme を dark にする
        EX->>PV: render（colorScheme を除いた config・theme: dark）
        U->>EX: b.md のプレビューを開き、mdmark.preview.theme を light にする
        EX->>PV: render（colorScheme を除いた config・theme: light）
    expected:
      - a.md を開いた直後、`render` の `config.colorScheme` が `light` で、Webview の描く先の要素が class `mdmark-theme-light` を持つ
      - '`mdmark.preview.theme` を `dark` にした後、`render` の `config` が `colorScheme` を持たず、包む要素が class `mdmark-theme-dark` を持つ'
      - b.md のプレビューでは、`mdmark.preview.theme` が `light` でも、描く先の要素が class `mdmark-theme-dark` を持つ
    test: test_normal_when_color_scheme
    refs:
      - SC-472-32#scenarios[正常シナリオ（設定ファイルの明暗で描く）]
      - SC-472-32#scenarios[正常シナリオ（文書のマーカーで明暗を指定する）]
  - name: 正常系（相対パスの画像）
    summary: Markdown のフォルダからの相対パスの画像を読み込む
    setup:
      - name: 画像を持つワークスペース
        description: '`docs/guide.md` が `./images/figure.png` を持ち、`docs/images/figure.png` がワークスペースの中にある'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: base を docs/ の Webview の URL にした HTML
        PV->>EX: rendered
    expected:
      - Webview の `img` の `naturalWidth` が 0 より大きい
    test: test_normal_when_relative_image
    refs:
      - SC-472-31#scenarios[正常シナリオ（相対パスの画像）]
  - name: 異常系（ワークスペースの外の画像・代わりの文字）
    summary: ワークスペースの外の画像は読み込まず、他の本文は描く
    setup:
      - name: 外の画像を指すワークスペース
        description: '`guide.md` がワークスペースの外を指す `../../outside.png`（`alt` は `外の画像`）と見出しを持ち、`outside.png` は実際にある'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: HTML を入れる
        PV->>PV: localResourceRoots の外は読み込まない
        PV->>EX: rendered
    expected:
      - '`img` の `naturalWidth` が 0 で、`alt` が `外の画像`'
      - 見出しは描かれている
    test: test_error_when_image_outside_workspace
    refs:
      - SC-472-31#scenarios[異常シナリオ（ワークスペースの外の画像）]
  - name: 異常系（配布物を読み込めない・オフライン）
    summary: 配布物の配信元が応えないとき、オフラインの理由と「リロード」を出す
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ
      - name: Mock
        description: '`MDMARK_VSCODE_DIST_BASE` に、接続を受け付けないポートの URL。タグ一覧は正常系と同じ'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        participant CDN as jsDelivr
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: v0.10.0 で HTML を入れる
        PV--xCDN: index.js を読み込めない
        PV--xCDN: HEAD で確認しても応答なし
        PV->>EX: loadFailed（offline）
    expected:
      - '`loadFailed` の `reason` が `offline`'
      - パネルにオフラインの描けない理由と「リロード」のボタンがあり、本文は無い
      - Markdown と `mdmark.config.yaml` の中身が変わらない
      - 描けない理由を出したパネルの `auditPreview()` の axe の違反が 0 件
    test: test_error_when_distribution_unreachable
  - name: 異常系（指定したバージョンが無い）
    summary: 配布物の URL が 404 のとき、指定したバージョンが無い理由と「リロード」を出す
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.version` を `v9.9.9` にする
      - name: Mock
        description: 配布物を配る手元のサーバーは `@v9.9.9` に 404 を返却する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        participant CDN as jsDelivr
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: v9.9.9 で HTML を入れる
        PV-->>CDN: index.js
        CDN-->>PV: 404
        PV->>EX: loadFailed（versionMissing）
    expected:
      - '`loadFailed` の `reason` が `versionMissing`'
      - パネルに `v9.9.9` を含む描けない理由と「リロード」のボタンがある
    test: test_error_when_version_missing
  - name: 異常系（バージョンを決められない）
    summary: タグ一覧を取れず前回のバージョンも無いとき、配布物を要求せずに理由を出す
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.lastVersion` は空
      - name: Mock
        description: タグ一覧の代役は応えない。配布物のサーバーは要求を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant GH as GitHub のタグ一覧
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX-->>GH: タグ一覧を取る
        GH--xEX: 待ちの上限まで応答なし
        EX->>PV: 配布物を読み込まない HTML で理由を出す
    expected:
      - パネルにバージョンを決められない描けない理由と「リロード」のボタンがある
      - 配布物の要求が 0 件
    test: test_error_when_version_undecidable
  - name: 異常系（Markdown でない・何もしない）
    summary: Markdown でない文書でコマンドを呼んでもパネルを開かない
    setup:
      - name: Markdown でない文書
        description: '`notes.txt` をエディタで開いた状態'
      - name: Mock
        description: 正常系と同じ。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.openPreviewToSide（executeCommand）
        EX->>EX: Markdown でないので何もしない
    expected:
      - mdmark のパネルが 0 個で、タグ一覧の代役が 1 回も呼ばれない
      - '`package.json` の `contributes.menus`・`keybindings` の `when` に `editorLangId == markdown` がある'
    test: test_error_when_not_markdown
  - name: 正常系（差分ビューから開く）
    summary: 作業ツリーの差分ビューから開くと、変更後の文書のブロックを色分けした差分のパネルを開く
    setup:
      - name: 差分を持つワークスペース
        description: Git のリポジトリで、`guide.md` をコミットした後に段落を 1 つ追加・1 つ削除し、ソース管理の変更から差分ビューで開いた状態。変更後の側にフォーカスがある
        notes: 差分ビューのタブの入力は `TabInputTextDiff`（`original` は `git:` の URI、`modified` は `file:` の URI）
      - name: Mock
        description: 正常系と同じ。配布物を配る手元のサーバーは、このブランチでビルドした `diffModes` を持つ配布物を配る。拡張機能と Webview の間のメッセージを記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide（差分ビューの変更後の側）
        EX->>EX: TabInputTextDiff の original・modified を読み込む
        EX->>PV: 横の列に差分のパネルを開き HTML を入れる
        PV->>EX: ready
        EX->>PV: render（変更後の全文・previous に変更前の全文）
        PV->>PV: mount（diffSource・diffMode: blocks）
        PV->>EX: rendered
    expected:
      - パネルのタイトルが `差分プレビュー guide.md` で、`ViewColumn.Beside` に開く
      - '`render` の `markdown` が変更後の全文、`previous` がコミットした時点の全文'
      - Webview の本文で、追加した段落が `div.mdmark-diff-block[data-kind="add"]`、削除した段落が `div.mdmark-diff-block[data-kind="del"]` にあり、「変更表示」が無い
      - 同じ `guide.md` を差分でない普通のエディタから開いたプレビューとは別のパネルになる
    test: test_normal_when_opened_from_diff_view
    refs:
      - SC-472-48#scenarios[正常シナリオ]
  - name: 正常系（コミットの差分から開く）
    summary: 両側が `git:` の URI の差分ビューでも、両方の内容を読み込んで差分のパネルを開く
    setup:
      - name: コミットの差分を開いたワークスペース
        description: Git のリポジトリで `guide.md` を 2 回コミットし、タイムラインから 2 つのコミットの差分ビューを開いた状態
        notes: '`original`・`modified` のどちらも `git:` の URI'
      - name: Mock
        description: 正常系（差分ビューから開く）と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>EX: git: の original・modified を openTextDocument で読み込む
        EX->>PV: 差分のパネルを開く
        PV->>EX: ready
        EX->>PV: render（後のコミットの全文・previous に前のコミットの全文）
        PV->>EX: rendered
    expected:
      - パネルのタイトルが `差分プレビュー guide.md`
      - Webview の本文に 2 つのコミットの間で変えたブロックだけが `mdmark-diff-block` で出る
      - 拡張機能が Git のコマンドを実行していない（子プロセスを作らない）
    test: test_normal_when_commit_diff
    refs:
      - SC-472-48#scenarios[正常シナリオ（コミットの差分）]
  - name: 異常系（差分に対応しないバージョン）
    summary: 差分のパネルで読み込んだ配布物が `blocks` に対応しないとき、描けない理由と「リロード」を出す
    setup:
      - name: 差分を持つワークスペース
        description: 正常系（差分ビューから開く）と同じ。`mdmark.version` を `v0.8.0` にする
      - name: Mock
        description: 配布物を配る手元のサーバーは、`@v0.8.0` に `diffModes` を持たない配布物を配る
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide（差分ビュー）
        EX->>PV: v0.8.0 で差分のパネルを開く
        PV->>EX: ready
        EX->>PV: render（previous つき）
        PV->>PV: diffModes が無い
        PV->>EX: loadFailed（diffUnsupported）
    expected:
      - '`loadFailed` の `reason` が `diffUnsupported`'
      - パネルに `v0.8.0` を含む `差分の表示に対応していません` の理由と「リロード」のボタンがあり、文書の本文が無い
      - '`mount` が呼ばれていない（変更後の文書だけの表示を出さない）'
    test: test_error_when_version_without_diff
    refs:
      - SC-472-48#scenarios[異常シナリオ（差分に対応しないバージョン）]
  - name: 正常系（相対パスとアセットのルートの動画・音声）
    summary: 動画・音声のパスを拡張機能に問い合わせ、文書のフォルダかアセットのルートにあるファイルの Webview の URL に替えて再生する
    setup:
      - name: 動画・音声を持つワークスペース
        description: '`docs/guide.md` が相対パスで `media/demo.mp3`・`media/demo.mp4`・`media/intro.mp3` を指す。`demo.*` は `docs/media/` に、`intro.mp3` は `assets/media/` にだけある'
      - name: 設定ファイル
        description: ワークスペースの `mdmark.config.yaml` の `assets.root` が `assets`
      - name: Mock
        description: '正常系と同じ。音声と動画の再生は、`inspectPreview` に `play: true` を指定して、Webview の要素の `play()` を呼ばせる'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.openPreviewToSide
        EX->>PV: render
        PV->>EX: resolveAssets（media/demo.mp3・media/demo.mp4・media/intro.mp3）
        EX->>EX: 文書のフォルダ、無ければアセットのルートで探す
        EX-->>PV: assetsResolved（Webview の URL）
        PV->>PV: src を替える
    expected:
      - '`demo.mp3`・`demo.mp4` の要素の `src` が `docs/media/` の、`intro.mp3` の要素の `src` が `assets/media/intro.mp3` の `asWebviewUri` の URL'
      - '`play()` の 1 秒後に、`demo.mp4` の映像の `currentTime` が 0.5 秒以上進む。`demo.mp3` と `intro.mp3` は `readyState` が 4 で、再生できない動画・音声の通知に替わっていない（Webview は音声の `play()` に利用者の操作を求めるため、音声は読み込めたことで確認する）'
      - Webview の HTML の CSP が `media-src` を持つ
    test: test_normal_when_relative_media
    refs:
      - SC-472-31#scenarios[正常シナリオ（相対パスの動画・音声）]
      - SC-472-31#scenarios[正常シナリオ（アセットのルートの動画・音声）]
