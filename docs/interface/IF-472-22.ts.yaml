  - name: 正常系（ツールチップの位置と相対パスの色分けのライブラリ）
    summary: 設定の `tooltips` と、設定ファイルのフォルダから解決した `syntax.url` を `mount` に指定し、手元の色分けのライブラリで色分けして、ツールチップを参照の下に出す
    setup:
      - name: 見本のワークスペース
        description: '`ts` のコードブロックと脚注の参照を 1 つずつ持つ Markdown と、`tooltips.placement: bottom` と `syntax.url: ./hljs/` を記載した `mdmark.config.yaml` と、`@highlightjs/cdn-assets` の `es/` フォルダのコピーの `hljs/` を配置したフォルダ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: mdmark.openPreviewToSide
        EX->>EX: syntax.url を設定ファイルのフォルダから解決し、Webview の URL にする
        EX->>PV: render（config に tooltips と syntax）
        PV->>PV: hljs/ の core.min.js と languages/typescript.min.js を読み込み、mount で描く
        PV-->>W: 色分けしたコードブロック
