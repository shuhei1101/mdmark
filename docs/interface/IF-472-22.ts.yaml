  - name: 正常系（mermaid のコードブロック）
    summary: CSP を `mermaid.url` の配信元だけ広げ、mermaid の本体と chunk を読み込んで、プレビューで mermaid の図を描く
    setup:
      - name: 見本のワークスペース
        description: 言語 `mermaid` の flowchart のコードブロックを 1 つ持つ Markdown と、`mermaid.url` に手元の配信の URL を記載した設定ファイルを配置したフォルダ
      - name: Mock
