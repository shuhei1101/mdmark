    expected:
      - '`render` の `config.tooltips` が `{ placement: "bottom" }` で、`config.syntax.url` が `hljs/` フォルダを指す Webview の URL で `/` で終わる'
      - パネルの `ts` のコードブロックの中に class が `hljs-` で始まる要素があり、通知ブロックが無い
      - 脚注の参照にフォーカスを移すと、`role="tooltip"` のツールチップの上端が参照の下端より下にある
      - CSP の違反が 0 件（テストのときに Webview が数える `securitypolicyviolation` の件数）
    test: test_normal_when_tooltips_and_relative_syntax
    refs:
