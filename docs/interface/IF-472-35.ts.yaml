    flow: "sequenceDiagram\n  actor U as ユーザー\n  participant M as mdmark\n  U->>M: mount(el, { markdown, config })\n  M-->>U: 書き方の警告と、種類の行の無いノード・既定の線で描いた map の図"
    expected:
      - map の図の前に書き方の警告（`div.mdmark-syntax-warning`）が 1 つあり、`queue` と `map.kinds` に記載する修正方法、`back` と `map.lines` に記載する修正方法が並ぶ
      - '`:::queue` のノードの種類の行が空（高さ 24px）で、角の丸い四角'
      - '`line: back` の線が実線・太さ normal・塗りの矢じり'
      - ほかのノード・線は正常系（map の構成図を描く）と同じに描かれる
    test: test_normal_when_map_config_names_missing
  - name: 正常系（map の線と配置の上書き）
    summary: 補足の `layout` の `justify`・`ends`・`via`・`collapsed` を当てて描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 上書きを持つ map の Markdown
        description: '正常系（map の構成図を描く）の範囲の補足に、線 1 本への `ends`（`from: bottom`・`to: top`）と別の線 1 本への `via` 1 点、ノード 1 つへの `justify: start`、グループ 1 つへの `collapsed: true` を足した範囲'
