  - name: 正常系（タブの中の要素へ移る）
    summary: URL の ID が選ばれていないタブの中の見出しを指すとき、描いたときと hashchange で、残したタブ名より優先してそのタブを選び、セクションを開いてから移る
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: タブの中に見出しを持つ Markdown
        description: '長い段落の後に、`## 導入` とその直後の `<!-- section: {"open": false} -->` を持ち、そのセクションの中に `<!-- tabs: {"group": "os"} -->` 〜 `<!-- /tabs -->` で `### macOS`・`### Windows` を囲んだ文書'
        notes: '`macOS` の中身は `#### macOS の注意` と段落、`Windows` の中身は `#### Windows の注意` と段落'
      - name: 残したタブ名
        description: '`mount` の前に localStorage の `mdmark-tabs:os` を `macOS` にし、`location.hash` を `#windows-の注意` にする'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 導入のセクションを開き、Windows のタブを選んでから見出しへ移る
        P->>M: location.hash を #macos-の注意 にする
        M->>P: macOS のタブを選んでから見出しへ移る
        P->>M: location.hash を #/a.md#windows-の注意 にする
        M->>P: Windows のタブを選んでから見出しへ移る
    expected:
      - 描いた後、導入のセクションの中身が `hidden` を持たず、`Windows` のタブの `aria-selected` が `true` で、`Windows の注意` の見出しが画面の中にある
      - 描いた後も localStorage の `mdmark-tabs:os` は `macOS` のまま
      - '`#macos-の注意` にした後（`hashchange`）、`macOS` のタブの `aria-selected` が `true` で、`macOS の注意` の見出しが画面の中にある'
      - '`#/a.md#windows-の注意` にした後、`Windows` のタブの `aria-selected` が `true`（まとめた HTML の `#` の構造）'
      - どの時点も、選ばれたタブの中身だけが `hidden` を持たない
    test: test_normal_when_fragment_in_tab
  - name: 正常系（Dockerfile と diff を色分けする）
    summary: dockerfile・diff と別名のコードブロックを、言語ごとに 1 回読んだモジュールで色分けし、コードの行のマーカーと両立させる
    setup:
