        P->>M: 開いている div のマーカーに mouse の pointerdown を発火する
        M->>P: 出したままにする
        P->>M: ツールチップの中に pointerdown を発火する
        M->>P: 出したままにする
        P->>M: 図の外の段落に pointerdown だけを発火する
        M->>P: ツールチップを削除する
    expected:
