        description: 文書をHTML文字列にする.ts の正常系（map の範囲）の 1 つ目の範囲と同じ。クラス `:::step`・`:::store`・`:::outside` と、ラベルを持つ線・`<-->`・`-.->`・`==>` を持つ
      - name: 設定
        description: '`opts.config.map.kinds` に `step`（`label`・`icon: cog`）・`store`（`icon: database`・`shape: rect`・`color: purple`）・`outside`（`shape: pill`・`color: green`）、`opts.config.map.lines` に `-.->`（`dash: dashed`・`head: open`）・`==>`（`width: thick`・`color: orange`）'
        notes: モック `docs/mock/refs/445/assets/samples.js` の `CONFIG` と同じ
      - name: Mock
        description: 差し替える依存は無い。sessionStorage とクエリ文字列は描く前に空にする
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config })
        M->>M: Mermaid と補足を読み込み、内側のグループから配置して線の経路を決める
        M->>M: 描いたノードの中身を測り、大きさが変わったら配置し直す
        M-->>U: 図の枠に入れた map の構成図と、図の枠の下の案内の帯
    expected:
      - map の場所が `figure.mdmark-diagram[data-diagram="map"]` になり、タイトルが印の `title` の「全体の構成」で、範囲と更新日を出さない
      - 入れ子のグループが外のグループの中にあり、どの 2 つのノード・グループも重ならず、線が端点とその祖先以外の矩形を横切らない
      - クラスのノードの種類の行に設定のアイコンと `label` があり、形・色が設定のとおりで、種類を書かないノードにも高さ 24px の空の種類の行がある。凡例が無い
      - どのノードも名前の要素がノードの中に収まり（`scrollHeight` が `clientHeight` 以下）、種類の行がノードの左上にある
      - '`-.->` の線が破線で線の矢じり、`==>` の線が太い橙色で、どの線も矢じりの色が線の色と同じ。`<-->` の線は両端に矢じりを持つ'
      - 図の枠の幅が置き場所の幅いっぱいで、本文の幅との切り替えのボタンが無く、倍率が 1 より小さくならない
      - 右上のツールの先頭に、外へ戻る（押せない）・全て開く・全て閉じる・配置と選択を元に戻す（押せない）があり、図を動かす矢印のボタンが無い
      - 図の枠の下に案内の帯があり、1 行目に `–/4` と前へ・停止（押せない）・自動で進める・次への 4 つのボタンがある
      - 置き場所の無い線のラベルを出さず、その線にポインターを当てるとツールチップにラベルが出る
      - 線にポインターを当てると、線と両端のノードのほかが薄くなり、その線の上をデータの印が流れ、補足の `notes` を持つ線だけツールチップに説明が出る。離すと元に戻る
      - mermaid のライブラリへの要求が 0 件
    test: test_normal_when_map_flowchart_drawn
  - name: 正常系（map のグループの中へ入る・開閉する）
    summary: グループのタイトルで中へ入り、戻るボタンで外へ戻り、山形で開閉し、状態を sessionStorage とクエリ文字列に保つ
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: map の構成図を持つ Markdown
        description: 正常系（map の構成図を描く）と同じ
      - name: Mock
        description: 差し替える依存は無い。ページの再読み込みは、同じ要素へ `destroy` の後にもう一度 `mount` することで代える
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: 「記法の読み取り」のタイトルを押す
        M-->>U: グループの中だけを配置し直し、外を薄く残す
        U->>M: 戻るボタンを押す
        M-->>U: 外のグループの図に戻す
        U->>M: 「データ」の山形を押す
        M-->>U: 「データ」を 1 つのノードに閉じ、中への線をまとめる
        U->>M: destroy() の後に mount(el, { markdown, config })
        M-->>U: 閉じた状態のまま描く
    expected:
      - 中へ入ると、そのグループの中のノードだけが配置し直され、外のノードは薄く（`map-faded`）残り、入っているグループのタイトルがボタンでない文字になり、戻るボタンが押せる
      - 中へ入ると、クエリ文字列に `map-1=read` が入り、`history.length` が増えない。戻るボタンで全体に戻ると値が `lib` になり、もう一度戻るとキーが消える
      - 閉じたグループが、左上に開くボタンを持つ 1 つのノードになり、同じグループどうしの線が 1 本にまとまり、本数とラベルを出さない
      - Shift を押しながら山形を押すと、そのグループと中のグループが全て開閉する
      - もう一度 mount した後も、閉じた状態で描かれる。`map-1=read` を付けた URL で sessionStorage を空にして mount すると「記法の読み取り」の中から描かれ、無いグループの ID は無視される
      - 全て開く・全て閉じるで、中のグループが全て開く・閉じる。操作しても図の倍率と表示する枠の高さが変わらない
    test: test_normal_when_map_group_entered_and_collapsed
  - name: 正常系（map の案内を進める）
    summary: 案内の帯の前へ・次へ・自動で進める・停止で手順を進め、手順ごとに強調するノードのほかを薄くし、データの印を流す
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 案内を持つ map の Markdown
        description: '正常系（map の構成図を描く）の範囲。補足の `walkthroughs` は 4 手順（3 手順目は `enter: place`、2 手順目は説明の文が 3 行）、印の `{"interval": 3}`'
      - name: Mock
        description: 自動で進める間隔はテストの時計を進めて確かめる。`prefers-reduced-motion` は `no-preference`
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: 次へを押す
        M-->>U: 手順 1 のタイトルと説明、強調するノードのほかを薄くし、データの印を流す
        U->>M: 自動で進めるを押す
        M-->>U: 3 秒ごとに次の手順へ進め、強調するノードの中心へ図の枠の中をスクロールする
        U->>M: 停止を押す
        M-->>U: 強調を解き、始めた段の図に戻す
    expected:
      - 帯の 1 行目に番号（`1/4`）・手順のタイトル・4 つのボタン、2 行目から説明の文（改行はそのまま）があり、説明の行数によらずボタンの位置が変わらない
      - 強調するノードの表示は変わらず、ほかのノード・線・ラベルが薄くなり（`opacity` 0.25）、強調するノードどうしの線の上をデータの印（既定は線の色の丸）が流れ続ける
      - 手順 3 で「配置」のグループの中に入る
      - 次へ・前へは常に押せ、最後の次へで最初、始める前の前へで最後の手順へ回る。前へ・次へでは図の枠の中のスクロールの位置が変わらない
      - 自動で進めている間は 3 秒ごとに進み、強調するノードの中心へ図の枠の中がスクロールする。図の枠をホイールで動かした後は、自動で進め直すまでスクロールしない
      - 手順を進める間、両方の手順で残す線の `opacity` が 0 にならない
      - 停止で強調が解け、案内を始めた全体の図に戻り、帯が `–/4` に戻る
    test: test_normal_when_map_walkthrough_played
  - name: 正常系（map のシーケンス図を描いて再生する）
    summary: map の場所の `sequenceDiagram` を全ての記法で描き、再生の帯でメッセージを進め、`plays_over` で指した構成図の上でも強調する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 構成図とシーケンス図の map を持つ Markdown
        description: '正常系（map の構成図を描く）の範囲と、`autonumber`・`%% block:` を付けた `rect`・`loop` の中の `alt` / `else`・`Note over`・`->>+` と `-->>-`・`--x` を持つ `sequenceDiagram` の範囲（補足に `plays_over: 1`）'
        notes: モック `docs/mock/refs/445/assets/samples.js` の `SEQUENCE` と同じ
      - name: Mock
        description: 自動で進める間隔はテストの時計を進めて確かめる
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config })
        M-->>U: 構成図とシーケンス図と、それぞれの帯
        U->>M: シーケンス図の帯の次へを押す
        M-->>U: メッセージ 1 のほかを両方の図で薄くし、両方の線にデータの印を流す
        U->>M: シーケンス図の帯の自動で進めるを押す
        M-->>U: 次のメッセージへ進め、両方の図の枠の中を送り手と受け手の中心へスクロールする
    expected:
      - シーケンス図に、`loop` と `alt` の枠（枠線 1px・背景とのコントラスト比 3:1 以上）と左上のタブ、`else` の破線と `[ラベル]`、`Note over` の箱、活性化の帯があり、見出し・注記がメッセージのラベルと重ならない
      - 名前の無いブロック（`rect`）のタブに `%% block:` の名前が出る
      - 点線・× の矢じり・`autonumber` の番号があり、活性化の帯に出入りする線が帯の端で止まる
      - 参加者の箱が名前の行数に合わせて高くなり、最初の行が一番高い箱の下から始まる
      - 次への後、帯のタイトルがメッセージ 1 の文で、シーケンス図と構成図の両方でメッセージ 1 の線と送り手・受け手のほかが薄くなり、その線の上をデータの印が流れる
      - 構成図の案内を始めると、シーケンス図の強調が解ける
      - 自動で進めている間は、構成図の図の枠の中も送り手と受け手のノードの中心へスクロールする。構成図の図の枠をホイールで動かした後は、自動で進め直すまで構成図の図の枠の中をスクロールしない
    test: test_normal_when_map_sequence_played
