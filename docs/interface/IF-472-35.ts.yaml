        U->>M: 2 段目のグループの中のノードを下へ 40px ドラッグする
        M-->>U: ノードだけを動かし、グループを広げる
        U->>M: グループのタイトルの行を下へ 60px ドラッグする
        M-->>U: グループを中身ごと動かす
        U->>M: 線の真ん中の区間をノードの上まで動かす
        M-->>U: 区間を動かし、線をノードの上の辺へつなぎ替える
        U->>M: シーケンス図の 5 人目の参加者を 2 人目の位置へドラッグする
        M-->>U: 並び順を変えて描き直す
    expected:
      - ノードがポインターの動いた分だけ動き、そのノードを含むグループの大きさのほかは位置が変わらない。ほかのノード・グループとの間が 16px より狭くなる位置と、グループの左端・上端より外へは動かない。4px 未満の動きは押した扱い
      - グループのタイトルの行のドラッグで、グループと中のノード・グループが同じ並びのまま 60px 動く。グループの面のドラッグは、グループを動かさず図の枠の中をスクロールする
