      - '確認の「削除」を押すと `remove` が `{ docId: "guide", id: "c2" }` で 1 回呼ばれ、`CSS` のマーカーが削除されて本文の文字が元の並びに戻り、その段落が `tabindex="-1"` を持ってフォーカスを受ける'
