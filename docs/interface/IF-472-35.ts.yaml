        P->>M: ツールチップのコピーのボタンをタップする（touch の pointerdown を発火し、ボタンの focus() を呼ぶ）
        M->>P: 出したままにする
        P->>M: 開いている単語に mouse の pointerdown を発火する
        M->>P: 出したままにする
        P->>M: 同じ単語をタップする
        M->>P: ツールチップを削除する
        P->>M: 単語をタップする
        M->>P: ツールチップを出す
        P->>M: 2 つ目の段落に pointerdown だけを発火する
        M->>P: ツールチップを削除する
    expected:
      - 閉じた単語への 1 回のタップの後、単語の枠 `mdmark-term-wrap` が `is-open` を持つ
      - コピーのボタンのタップの後も、単語の枠が `is-open` を持つ
      - '`pointerType` が `mouse` の `pointerdown` を開いている単語に発火しても、単語の枠が `is-open` を持つ'
      - フォーカスがコピーのボタンにある状態で開いている単語をタップした後（単語の `focusin` が `pointerdown` の後に発火する）、単語の枠が `is-open` を持たない
      - 2 つ目の段落の `pointerdown` の後、単語の枠が `is-open` を持たず、単語にフォーカスが残ったままでもツールチップが表示されない（`display` が `none`）
