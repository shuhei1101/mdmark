      - 棒の上で系列の名前・横の目盛り・値、円の `A` の扇形の上で `A`・`50`・`50%`、散布図の点の上で系列の名前と x と y の値のツールチップが出る
      - 追加した 8 つの種類のグラフの項目にも、系列か項目の名前と値のツールチップが出る
      - ツールチップの `top` が項目の `bottom` 以上
      - フォーカスした点の `aria-describedby` が出たツールチップを指し、Esc の後にツールチップが `hidden` を持ち、フォーカスが点にある
    test: test_normal_when_chart_item_tooltip
  - name: 正常系（グラフの項目の上で動かす）
    summary: 拡大したグラフの項目の上で押し、動いた距離がしきい値より小さいうちは図を動かさずツールチップを出したままにし、越えたら図を動かしてツールチップを閉じる
    setup:
      - name: 拡大したグラフ
        description: 正常系（グラフの項目のツールチップ）の折れ線のグラフを、拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 差し替える依存は無い。ドラッグは Playwright のマウス操作で行う
    flow: |-
