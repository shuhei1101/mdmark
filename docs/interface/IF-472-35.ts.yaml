id: IF-472-35
visibility: internal
title: 文書を描く
entry:
  kind: operation
  value: '`mount(el, opts)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 要素の中に Markdown を HTML として描く
    setup:
      - name: 配布物を読み込んだページ
        description: ビルドした `dist/index.js` と `dist/index.css` を読み込み、描く先の `div` を 1 つ持つページ
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表（右寄せの列を持つ）・コードブロック（`ts`）・リンクを持つ文書
        notes: '`opts.config` は指定しない'
      - name: Mock
        description: 差し替える依存は無い（手元で配信した配布物をブラウザで読み込む）
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: Markdown を解析し、マーカーを取得する
        M->>M: 許可していない要素・属性・URL を落とす
        M->>P: el に class mdmark を付け、中に本文を描く
        M-->>P: { update, destroy }
    expected:
      - '`el` が class `mdmark` を持つ'
      - '`el` の中に `h1`・`p`・`ul`・`table`・`pre > code.language-ts`・`a` がある'
      - '`a` の `href` が Markdown に記載した URL'
      - 表の `td` が、同じ列の見出しの文言を `data-label` に持つ
      - 右寄せの列の `td` が class `mdmark-align-right` を持ち、`style` 属性を持たない
      - 戻り値が `update` と `destroy` の関数を持つ
    test: test_normal
  - name: 正常系（本文を差し替える）
    summary: '`update` で本文だけを再描画する'
    setup:
      - name: 文書を描いた要素
        description: 正常系の見本の Markdown を `mount` で描いた要素
      - name: 差し替える Markdown
        description: 見出しを 1 つだけ持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: update(markdown)
        M->>P: el の中を新しい本文に置き換える
    expected:
      - '`el` の中が、差し替えた Markdown の見出しだけになる'
      - '`el` が class `mdmark` を持ったまま'
    test: test_normal_when_updated
  - name: 正常系（片付ける）
    summary: '`destroy` で描いたものとイベントを片付ける'
    setup:
      - name: 文書を描いた要素
        description: 閉じた `details` を持つ文書を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い。印刷は `window` へ `beforeprint` のイベントを送信することで代える
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: destroy()
        M->>P: el の中を空にし、class mdmark を削除する
        M->>M: beforeprint・afterprint の受け取りを解除する
        P->>M: update(markdown)
        M-->>P: 何もしない
    expected:
      - '`el` の中が空で、class `mdmark` を持たない'
      - '`destroy` の後に `update` を呼んでも、`el` の中は空のまま'
      - '`destroy` の後に `beforeprint` を送信しても例外が出ない'
    test: test_normal_when_destroyed
  - name: 正常系（同じ要素へもう一度描く）
    summary: 描いた要素へ `mount` を呼ぶと、前の描画を片付けてから描く
    setup:
      - name: 文書を描いた要素
        description: 段落 A を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown: 段落 B })
        M->>M: 前の mount の destroy をする
        M->>P: el の中に段落 B を描く
        P->>M: 前の戻り値の update(段落 C)
        M-->>P: 何もしない
    expected:
      - '`el` の中が段落 B だけ'
      - 前の `mount` の戻り値で `update` を呼んでも、`el` の中は段落 B のまま
    test: test_normal_when_mounted_twice
  - name: 正常系（未知のマーカー）
    summary: 対応表にも機能のマーカーにも無いマーカーを無視して描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 未知のマーカーを持つ Markdown
        description: '段落の間に `<!-- unknown: {"size": 1} -->` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: 未知のマーカーを取り除く
        M->>P: el の中に本文を描く
    expected:
      - マーカーの前後の段落がある
      - '`el` の `innerHTML` に `<!--` と `unknown` が無い'
    test: test_normal_when_unknown_mark
  - name: 正常系（廃止した図の範囲）
    summary: 廃止した `flow`・`sequence` の範囲は図を描かずに、map へ変換できる旨の書き方の警告を範囲ごとに出し、ほかの本文と図を描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 廃止した図の範囲を持つ Markdown
        description: '`<!-- flow -->` 〜 `<!-- /flow -->` と `<!-- sequence -->` 〜 `<!-- /sequence -->` の範囲に、廃止の前のバージョンで描けた部品の定義（`json` のコードブロック）を 1 つずつ配置し、その間と後に段落とグラフの定義 1 つを持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: flow・sequence の範囲を、廃止した記載方法として読む
        M->>P: 範囲ごとに書き方の警告を描き、本文とグラフを描く
    expected:
      - '`flow`・`sequence` の範囲の場所に、書き方の警告（`.mdmark-syntax-warning`）が 1 つずつあり、図の枠（`figure.mdmark-diagram`）が無い'
      - 警告の文言に、廃止した記載方法であることと、`mdmark upgrade` で map の範囲へ変換できることが記載されている
      - 範囲の中の `json` のコードブロックが、`pre` としても段落としても描かれていない
      - 段落とグラフの図の枠が描かれている
    test: test_normal_when_retired_diagram
    refs:
      - SC-472-43#scenarios[正常シナリオ（座標で書いた図の範囲）]
  - name: 正常系（スクリプトを落とす）
    summary: 文書に記載したスクリプトを落として描き、実行しない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ。スクリプトが実行されたら `window.__ran` が `true` になる
      - name: スクリプトを記載した Markdown
        description: '`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・`style` 属性を持つ段落・閉じた `details` を持つ文書'
        notes: どのスクリプトも、実行されたら `window.__ran = true` にする
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: script 要素・on で始まる属性・javascript: の URL・style 属性を落とす
        M->>P: el の中に本文を描く
        P->>P: リンクを押す
    expected:
      - '`el` の中に `script` 要素・`on` で始まる属性・`style` 属性が無い'
      - '`javascript:` の URL を持つ `href` が無い'
      - リンクを押した後も `window.__ran` が `true` でない
      - '`details` と `summary` がある'
    test: test_normal_when_script_in_markdown
  - name: 正常系（外部ライブラリのマーカー）
    summary: 文書に外部ライブラリのマーカーがあるときだけ、そのモジュールを読み込んでマーカーの場所に描かせる
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 外部ライブラリのマーカーを持つ Markdown
        description: '段落の間に `<!-- test-lib: {"items": ["a", "b"]} -->` を持つ文書'
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/test-lib.js" }`'
        notes: ページの URL を基準にした相対 URL
      - name: Mock
        description: 外部ライブラリの代役として、`draw(slot, options)` で `slot` の文字を `drawn:` と `options.items` を `,` で結んだものにするモジュールを、手元の開発サーバーが `/fixtures/test-lib.js` で配る。要求の件数は `performance.getEntriesByType("resource")` で数える
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>P: マーカーの場所に読み込み中のブロックを描く
        M->>X: import(URL)
        X-->>M: モジュール
        M->>X: draw(マーカーの場所の要素, {items: ["a", "b"]})
        X->>P: マーカーの場所に描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 1 件'
      - 描いた直後、マーカーの場所の要素が class `mdmark-embed` と `role="status"` を持ち、文字が `図を読み込んでいます`
      - 読み込んだ後、マーカーの場所の要素の文字が `drawn:a,b`
      - マーカーの前後の段落がある
    test: test_normal_when_library_mark
  - name: 正常系（今の書き方の外部ライブラリのマーカー）
    summary: 引数が JSON のオブジェクトでない外部ライブラリのマーカーは、モジュールを読み込まずに記載の警告を描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 今の書き方の外部ライブラリのマーカーを持つ Markdown
        description: '段落の間に `<!-- test-lib: a b -->` を持つ文書'
      - name: 設定
        description: 正常系（外部ライブラリのマーカー）と同じ
      - name: Mock
        description: 正常系（外部ライブラリのマーカー）と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: マーカーの引数が JSON のオブジェクトでない
        M->>P: マーカーの場所に記載の警告を描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 0 件'
      - マーカーの場所に記載の警告があり、本文に、引数を JSON のオブジェクトで記載することと `mdmark upgrade` がある
      - マーカーの前後の段落がある
    test: test_normal_when_legacy_library_args
    refs:
      - SC-472-46#scenarios[異常シナリオ（今の書き方の外部ライブラリのマーカー）]
  - name: 正常系（外部ライブラリのマーカーが無い）
    summary: マーカーの無い文書では外部ライブラリを読み込まない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: マーカーの無い Markdown
        description: 段落だけを持つ文書
      - name: 設定
        description: 外部ライブラリのマーカーの正常系と同じ
      - name: Mock
        description: 外部ライブラリのマーカーの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>P: el の中に本文を描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 0 件'
      - 段落がある
    test: test_normal_when_no_library_mark
  - name: 正常系（印刷の前に折り畳みを開く）
    summary: 印刷の機能がオンのとき、印刷の前に閉じた折り畳みを開き、印刷の後に戻す
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 折り畳みを持つ Markdown
        description: 閉じた `details` と、開いた `details` を 1 つずつ持つ文書
        notes: '`opts.config` は指定しない（`features.print` の既定は `true`）'
      - name: Mock
        description: 印刷は `window` へ `beforeprint`・`afterprint` のイベントを送信することで代える
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        P->>M: beforeprint
        M->>P: 閉じた details を開く
        P->>M: afterprint
        M->>P: 開いた details だけをもう一度閉じる
    expected:
      - '`beforeprint` の後、2 つの `details` が `open` を持つ'
      - '`afterprint` の後、初めに閉じていた `details` だけが `open` を持たない'
    test: test_normal_when_printed
  - name: 正常系（文書のマーカーで機能を解除する）
    summary: 設定でオンの機能を、文書のマーカーでその文書だけオフにする
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 機能を解除する Markdown
        description: '先頭に `<!-- features: {"print": false} -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: true }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書のマーカーを重ねる
        P->>M: beforeprint
        M-->>P: 何もしない
    expected:
      - '`beforeprint` の後も、`details` が `open` を持たない'
      - '`el` の中にマーカーの文字が無い'
    test: test_normal_when_feature_disabled_by_mark
  - name: 正常系（文書のマーカーで機能を追加する）
    summary: 設定でオフの機能を、文書のマーカーでその文書だけオンにする。知らない機能名は無視する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 機能を追加する Markdown
        description: '先頭に `<!-- features: {"print": true, "unknown": true} -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: false }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書のマーカーを重ね、unknown を無視する
        P->>M: beforeprint
        M->>P: 閉じた details を開く
    expected:
      - '`beforeprint` の後、`details` が `open` を持つ'
      - '`el` の中にマーカーの文字が無い'
    test: test_normal_when_feature_enabled_by_mark
  - name: 正常系（層の外の CSS で上書きする）
    summary: 利用側のページが層の外に記載した CSS と変数の上書きが、mdmark の CSS に勝つ
    setup:
      - name: 配布物を読み込んだページ
        description: '正常系と同じ。加えて、層の外に `a { text-decoration-line: none }` と `.mdmark { --mdmark-color-link: rgb(4, 5, 6) }` を記載した `style` 要素を持つ'
        notes: 層の外の `a`（詳細度 0,0,1）を、層の中の `.mdmark a`（詳細度 0,1,1）の下線と競わせる
      - name: リンクを持つ Markdown
        description: リンクを持つ段落を持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: el の中に本文を描く
        P->>P: 層の外の規則が層の中の規則に勝つ
    expected:
      - '`a` の `text-decoration-line` の計算値が `none`（詳細度の低い層の外の規則が勝つ）'
      - '`a` の `color` の計算値が `rgb(4, 5, 6)`（変数の上書きが該当する）'
    test: test_normal_when_theme_overridden
  - name: 異常系（外部ライブラリを読み込めない・通知ブロック）
    summary: 外部ライブラリを読み込めないマーカーの場所だけを通知ブロックにし、ほかは描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 外部ライブラリのマーカーを持つ Markdown
        description: 外部ライブラリのマーカーの正常系と同じ文書
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/missing.js" }`'
      - name: Mock
        description: '`/fixtures/missing.js` は手元の開発サーバーが 404 を返却する'
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>X: import(URL)
        X-->>M: 404
        M->>P: マーカーの場所を通知ブロックに替える
    expected:
      - マーカーの場所の要素が class `mdmark-notice` と `role="status"` を持つ
      - 通知ブロックのタイトルが `この図を表示できません`
      - 通知ブロックの本文が `表示に使用するライブラリ（test-lib）を読み込めませんでした。ネットワークにつながっているかを確認して、ページを再読み込みしてください。`
      - マーカーの前後の段落がある
      - '`mount` が例外を投げない'
      - '`console.error` が 1 回呼ばれ、引数にマーカーの名前 `test-lib`・URL・元のエラーを含む'
    test: test_error_when_library_not_found
  - name: 正常系（表を並べ替えて絞り込む）
    summary: 表の見出しで並べ替えを 3 状態で切り替え、絞り込みのドロワーで絞って除外する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 表を持つ Markdown
        description: '`<!-- table: {"kind": "data", "columns": {"名前": {"filter": {}}}} -->` 〜 `<!-- /table -->` で、列 `名前`・`値` に `りんご`/`10`・`みかん`/`2`・`りんご飴`/`33` の 3 行を持つ表を囲んだ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 並べ替えと絞り込みのボタンを付けた表を描く
        P->>M: 値の列の見出しを 3 回押す
        M->>P: 降順・昇順・元の並びに並べ替える
        P->>M: 名前の列の絞り込みのボタンを押し、りんごを選ぶ
        M->>P: りんごの行だけを出す
        P->>M: 絞り込みを解除を押す
        M->>P: 3 行を出す
    expected:
      - 1 回目の後、値の列が上から `33`・`10`・`2` で、値の列の `th` の `aria-sort` が `descending`
      - 2 回目の後、値の列が上から `2`・`10`・`33` で、`aria-sort` が `ascending`
      - 3 回目の後、値の列が上から `10`・`2`・`33` で、`th` が `aria-sort` を持たない
      - 絞り込みのボタンは名前の列の見出しにだけある
      - ボタンを押した後、ボタンの `aria-expanded` が `true` で、ドロワーが `hidden` を持たず、候補の検索欄にフォーカスがある
      - '`りんご` を選んだ後、表に出ている行が `りんご` の 1 行だけ'
      - 「絞り込みを解除」を押した後、チェックボックスが全て解除され、表に 3 行とも出ている
      - ドロワーの外を押した後、ドロワーが `hidden` を持ち、ボタンの `aria-expanded` が `false`
    test: test_normal_when_table_sorted_and_filtered
