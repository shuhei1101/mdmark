        notes: 描く先の要素の幅は 1280px。`opts.config` は指定しない（出し方は既定の `hover`）
      - name: 見出しを持つ Markdown
        description: '`# 手引き`・`## 導入`・`### 前提`・`## 使用方法` と、それぞれ画面の高さより長い段落を持つ文書'
