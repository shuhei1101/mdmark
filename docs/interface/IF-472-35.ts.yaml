    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 集計の行を配置する
        P->>M: 名前の列を「りんご」で絞り込む
        M->>P: 集計をもう一度計算する
        P->>M: 数量の列の見出しを押す
        M->>P: 本文の行だけを並べ替える
        P->>M: テーブル設定の単価の目のアイコンで単価を隠す
        M->>P: 単価の列と集計のセルを隠す
      ```

      <!-- /map -->
    expected:
      - 描いた直後、`tfoot` に `data-total-kind` が上から `sum`・`avg`・`count` の 3 行があり、先頭のセルの計算の名前が `合計`・`平均`・`件数`
      - 描いた直後、合計の行の数量のセルが `45`（空のセルを除いた合計）、平均の行の単価のセルが `250`、件数の行の先頭のセルの値が計算の名前と分かれた `4` で、各行のほかの列のセルは空
      - 「りんご」で絞り込んだ後、合計が `43`、平均が `200`、件数が `2`
      - 一致する行が無い絞り込みでは、合計が `0`、平均が `—`、件数が `0`
      - 並べ替えた後も、集計の 3 行は `tfoot` にあり、`tbody` の行に入っていない
      - 単価を隠した後、単価の列の `th`・`td` と 3 行の `tfoot` の単価のセルが `hidden` を持つ
      - 記載の警告が無い（空のセルは数として読み込めないセルに数えない）
