  - name: 正常系（図を拡大・縮小する）
    summary: 図を収まる倍率で描き、右上に重ねたパネルを開いてボタンとキーで拡大・縮小・戻す。倍率は収まる倍率の 0.25 倍から 5 倍まで。ホイールは文書のスクロールにする
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ。描く先の `div` の幅は 600px
      - name: 横に広い図を持つ Markdown
        description: ノード 12 個を横につなぎ、描くと幅が 1100px を超える `flowchart LR` の mermaid のコードブロックを配置した文書。描いた後に、描く先の `div` の幅を図の幅の 0.85 倍にする
      - name: Mock
        description: 差し替える依存は無い。ホイールは図の表示する枠へ `wheel` のイベントを送信することで代える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 収まる倍率で図を描き、右上に倍率のボタンと開閉のボタンだけのパネルを重ねる
        P->>M: 開閉のボタンを押す
        M->>P: パネルに縮小・拡大・全画面のボタンを並べる
        P->>M: 拡大のボタンを押す・+ を押す
        M->>P: 倍率を上げる
        P->>M: ホイールを送信する
        M->>P: 倍率を変えず、文書をスクロールする
        P->>M: 0 を押す
        M->>P: 収まる倍率と位置に戻す
        P->>M: 拡大のボタンを押してから倍率のボタンを押す
        M->>P: 収まる倍率と位置に戻す
        P->>M: 縮小のボタン・拡大のボタンをそれぞれ押せなくなるまで押す
        M->>P: 収まる倍率の 0.25 倍と 5 倍で止める
        P->>M: 開閉のボタンをもう一度押す
        M->>P: パネルを畳む
      ```

      <!-- /map -->
    expected:
      - 描いた直後、図の倍率が 1 未満で、倍率のボタンの文字が `100%`（全体が収まる倍率を 100% とする）で、図の幅が表示する枠の幅を超えない
      - 描いた直後、表示する枠の右上に重ねた `role="toolbar"` のパネル（`.mdmark-diagram-tools`）があり、表示する枠の上端とパネルの上端の差が 8px 以内（表示する枠の上に別の行を作らない）。見えるボタンは倍率のボタンと開閉のボタン（`data-tool="more"`）の 2 つで、開閉のボタンのスクリーンリーダー向けの名前が `表示の操作を開く`、`aria-expanded` が `false`
      - 開閉のボタンの後、見えるボタンが縮小・倍率・拡大・全画面・開閉のボタンの順に 1 行で並び（ボタンの上端がどれも同じ）、開閉のボタンの名前が `表示の操作を閉じる`、`aria-expanded` が `true`、開閉のボタンの位置が押す前と同じ。移動のボタン（`data-group="pan"`）と戻すのボタンは無く、どのボタンもスクリーンリーダー向けの名前を持つ。もう一度押すと描いた直後と同じ 2 つに戻る
      - '倍率のボタンのスクリーンリーダー向けの名前が `倍率 {今の倍率}。全体が収まる倍率に戻す` で、`getByRole("button", { name: "全体が収まる倍率に戻す" })` で見つかる'
      - 拡大のボタンの後と、表示する枠にフォーカスして `+` を押した後に、それぞれ倍率が 1.25 倍になり、倍率のボタンの文字とスクリーンリーダー向けの名前が変わる
      - 縮小のボタンは倍率が収まる倍率の 0.25 倍になったところで、拡大のボタンは 5 倍になったところで `disabled` を持ち、倍率のボタンの文字がそれぞれ `25%`・`500%`
      - 収まる倍率のときの `wheel` の後、倍率が変わらず、イベントの `defaultPrevented` が `false`
      - 拡大して図が表示する枠から縦にはみ出しているときの、`ctrlKey` を持たない縦の `wheel` の後、倍率と表示する枠の `scrollTop` が変わらず、イベントの `defaultPrevented` が `true` で、文書の `scrollY` が `deltaY`（`deltaMode` が行のときは 1 行 16px、ページのときは画面の高さで換算した値）だけ変わる
      - '`0` の後と、拡大してから倍率のボタンを押した後に、倍率と表示する枠のスクロールの位置が描いた直後と同じ'
    test: test_normal_when_diagram_zoomed
