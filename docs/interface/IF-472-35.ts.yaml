        M->>P: mermaid のコードブロックを隠し、その場所に読み込み中のブロックを描く
        M->>X: import(mermaid.url)
        X-->>M: モジュール
        M->>M: 描く先の要素の CSS 変数から base テーマの変数を作る
        M->>X: render(ソース) をコードブロックの順に呼ぶ
        X-->>M: SVG
