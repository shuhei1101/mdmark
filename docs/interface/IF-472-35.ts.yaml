      - 中へ入ると、そのグループの中のノードだけが配置し直され、外のノードは薄く（`map-faded`）残り、入っているグループのタイトルがボタンでない文字になり、戻るボタンが押せる
      - 中へ入ると、クエリ文字列に `map-1=read` が入り、`history.length` が増えない。戻るボタンで全体に戻ると値が `lib` になり、もう一度戻るとキーが消える
      - 閉じたグループが、左上に開くボタンを持つ 1 つのノードになり、名前の行の下に「ノード 2 件」の行があって 2 つの行の矩形が重ならず、同じグループどうしの線が 1 本にまとまり、本数とラベルを出さない
      - Shift を押しながら山形を押すと、そのグループと中のグループが全て開閉する
      - もう一度 mount した後も、閉じた状態で描かれる。`map-1=read` を付けた URL で sessionStorage を空にして mount すると「記法の読み取り」の中から描かれ、無いグループの ID は無視される
      - 全て開く・全て閉じるで、中のグループが全て開く・閉じる。操作しても図の倍率と表示する枠の高さが変わらない
      - パネルを畳んだまま、全体の図では戻るボタンが見えず、グループの中へ入ると畳んだパネルに戻るボタンが倍率のボタンの前に出る。全て開く・全て閉じるは畳んだパネルには出ない
    test: test_normal_when_map_group_entered_and_collapsed
  - name: 正常系（map の案内を進める）
    summary: 案内の帯の手順のバーの区切りと左右の矢印で手順を選んで繰り返し再生し、手順ごとに強調するノードのほかを薄くしてデータの印を流し、ノードが収まる位置と倍率へ図をなめらかに移し、帯のバー以外と図の空いた場所で停止する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 案内を持つ map の Markdown
        description: '正常系（map の構成図を描く）の範囲。補足の `walkthroughs` は 4 手順（3 手順目は `enter: place`、2 手順目は説明の文が 3 行）'
      - name: Mock
        description: 1 周の時間となめらかな移動はテストの時計を進めて確かめる。`prefers-reduced-motion` は `no-preference` と `reduce` の 2 通り
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: 手順のバーの 1 つ目の区切りを押す
        M-->>U: 手順 1 のタイトルと説明を出し、強調するノードのほかを薄くしてデータの印を流し、停止するまで手順 1 を繰り返す
        U->>M: 右の矢印のボタンを押す
        M-->>U: 手順 2 へ移り、強調するノードが収まる位置と倍率へ図をなめらかに移して繰り返す
        U->>M: 2 つ目の区切りをもう一度押す
        M-->>U: 手順 2 を最初から再生し直す
        U->>M: 図の枠の空いた場所を押す
        M-->>U: 強調を解き、始めた段と倍率の図に戻す
      ```

      <!-- /map -->
    expected:
      - 始める前は帯の枠線と面が無く、手順のバーと左右の矢印のボタンだけがある。始めると帯の枠線と面が出て、バーの下に手順のタイトルと説明の文（改行はそのまま）が出て、説明の行数によらずバーと矢印のボタンの位置が変わらない
      - 手順のバーは 4 つの区切りを持つスライダー（`aria-valuemin` 0・`aria-valuemax` 4・`aria-valuenow` が今の手順の番号・`aria-valuetext` が「手順 {番号}/4 {タイトル}」。始める前は `aria-valuenow` 0）で、済んだ手順・今の手順・残りの手順の区切りが描き分けられる
      - 区切りを押すと、その手順へ移り、停止するまでその手順を繰り返す。今の手順の区切りが 1 周の時間に合わせて塗られ、塗り終えると最初から塗り直し、次の手順へは進まない。同じ区切りをもう一度押すと、その手順の最初から塗り直す
      - 左右の矢印のボタンは前・次の手順へ移って繰り返し、最後の次で最初、最初の前で最後の手順へ回る。始める前の左の矢印は最後の手順、右の矢印は最初の手順。押した後はフォーカスがそのボタンに残る
      - 強調するノードの表示は変わらず、ほかのノード・線・ラベルが薄くなり（`opacity` 0.25）、強調するノードどうしの線の上をデータの印（既定は線の色の丸）が流れ続ける
      - 手順 3 で「配置」のグループの中に入る
      - 手順を移すたびに、強調するノードを囲む矩形と周りの余白が表示する枠に収まる位置と倍率へ、図の枠の中が時間をかけて移る。倍率は図の枠に合わせた倍率以上・読者の拡大の上限（図の枠に合わせた倍率の `ZOOM.maxRatio` 倍）以下で、文書のスクロールの位置は変わらない。図の枠をホイール・ドラッグ・キーで動かした後は、次にバーか矢印のボタンを押すまで移さない
      - '`prefers-reduced-motion: reduce` では、図の枠の中の位置と倍率を時間をかけずに移し、データの印は流す'
      - 手順を移す間、両方の手順で残す線の `opacity` が 0 にならない
      - 帯の中のバーと矢印のボタンの外を押すか、図の枠の中のノード・線・ボタンの外を押して 4px 未満で離すと停止し、強調が解け、案内を始めた全体の図と倍率・スクロールの位置に戻り、帯がバーと矢印のボタンだけに戻る。図の枠の空いた場所で 4px 以上動かした操作は停止しない
      - バーにフォーカスがあるときの ← → で前後の手順へ移って繰り返し、Esc で停止する
    test: test_normal_when_map_walkthrough_played
  - name: 正常系（map の案内の手順が多い）
    summary: 手順の数が多く区切りが細くなる幅では、手順のバーを 1 行のまま今の区切りだけを広げる
    setup:
