      - 末尾のタブの `長文` を押した前後で、押したボタンの `getBoundingClientRect().top` の差が 1px 以内
    test: test_normal_when_tab_position_kept
lead: 利用側のページが、要素と Markdown と設定を指定し、要素の中に文書を描く。戻り値で本文の差し替えと片付けができる。
