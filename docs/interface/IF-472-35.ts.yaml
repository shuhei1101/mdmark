    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: r1 の本文を返却できない取り出し元
        description: 正常系（差分を開く）の取り出し元で、`content` が `r1` のときだけ reject する
      - name: Mock
        description: 取り出し元はページの中で reject する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant S as 取り出し元
        P->>M: 前の選ぶ欄で r1 を選ぶ
        M->>S: content を r1 で
        S-->>M: reject
        M->>P: 差分の行の場所を通知ブロックにする
        P->>M: 前の選ぶ欄で r2 をもう一度選ぶ
        M->>S: content を r2 で
        S-->>M: Markdown
        M->>P: r2 と r3 の差分を出す
      ```

      <!-- /map -->
    expected:
      - タイトルが `このリビジョンの本文を表示できません`、本文が `r1` のリビジョンの説明を `「」` で囲んだ `…の本文を取り出せませんでした。別のリビジョンを選んでください。`
      - 選ぶ欄が残り、ミニマップと `削除した行・追加した行` の数が無い
      - '`r2` をもう一度選ぶと、通知ブロックが消えて `r2` と `r3` の差分が出る'
      - '`console.error` が引数に `content`・`guide`・`r1`・元のエラーを含む'
