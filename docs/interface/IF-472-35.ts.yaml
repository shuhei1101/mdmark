      - シーケンス図の参加者は、並べ替えのアイコンを持たず、名前の文字の外のドラッグで列を移り、移す先に縦の線が出る。Alt + 左右の矢印でも 1 列ずつ動く
      - もう一度 mount しても、動かした位置と並び順のまま描かれ、Markdown は変わらない。「配置と選択を元に戻す」で自動配置に戻る
