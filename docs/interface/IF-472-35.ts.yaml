    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 件数とテーブル設定のボタンの帯を配置し、説明の列を隠す
        P->>M: 名前の列を「りんご」で絞り込む
        M->>P: 件数を書き換える
        P->>M: テーブル設定を押し、説明の目のアイコンで表示して更新日の目のアイコンで隠す
        M->>P: 列の表示を切り替える
        P->>M: Esc を押す
        M->>P: パネルを閉じる
      ```

      <!-- /map -->
    expected:
      - 描いた直後、件数の要素が `aria-live="polite"` を持ち、文字が `3 / 3 件`、説明の列の `th` と `td` が `hidden` を持ち、テーブル設定のボタンが隠した列の数 `1` のバッジと `aria-label` の `テーブル設定（1 列を非表示）` を持つ
      - 「りんご」で絞り込んだ後、件数の文字が `2 / 3 件` で、スクリーンリーダーの文字が `3 件中 2 件を表示`
      - パネルを開いた後、ボタンの `aria-expanded` が `true` で、パネルのタイトルが `表示と並び順`、名前の目のアイコンが `disabled`、案内に `先頭の列は隠せません` がある
      - 説明を表示して更新日を隠した後、説明の列が `hidden` を持たず、更新日の列の `th` と `td` が `hidden` を持つ
      - 説明を表示して更新日を隠した後、更新日の目のアイコンの `aria-label` が `「更新日」を表示`、ボタンのバッジが `1` のまま
      - Esc でパネルが `hidden` を持ち、テーブル設定のボタンにフォーカスがある
      - テーブル設定のボタンが見えている文字を持たず、`title` が `テーブル設定` で、描いた直後に隠した列の数 `1` のバッジを持ち、`aria-label` が `テーブル設定（1 列を非表示）`
