  - name: 正常系（map のシーケンス図を描いて再生する）
    summary: map の場所の `sequenceDiagram` を全ての記法で描き、再生の帯でメッセージを選んで繰り返し再生し、`plays_over` で指した構成図の上でも強調する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 構成図とシーケンス図の map を持つ Markdown
        description: '正常系（map の構成図を描く）の範囲と、`autonumber`・`%% block:` を付けた `rect`・`loop` の中の `alt` / `else`・`Note over`・`->>+` と `-->>-`・`--x` を持つ `sequenceDiagram` の範囲（補足に `plays_over: 1`）'
        notes: モック `docs/mock/refs/445/assets/samples.js` の `SEQUENCE` と同じ
      - name: Mock
        description: 1 周の時間となめらかな移動はテストの時計を進めて確かめる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config })
        M-->>U: 構成図とシーケンス図と、それぞれの帯
        U->>M: シーケンス図の手順のバーの 1 つ目の区切りを押す
        M-->>U: メッセージ 1 のほかを両方の図で薄くし、両方の線にデータの印を流す
        U->>M: シーケンス図の右の矢印のボタンを押す
        M-->>U: メッセージ 2 へ移って繰り返し、両方の図の枠の中を送り手と受け手が収まる位置と倍率へ移す
      ```

      <!-- /map -->
    expected:
      - シーケンス図に、`loop` と `alt` の枠（枠線 1px・背景とのコントラスト比 3:1 以上）と左上のタブ、`else` の破線と `[ラベル]`、`Note over` の箱、活性化の帯があり、見出し・ノートがメッセージのラベルと重ならない
      - 名前の無いブロック（`rect`）のタブに `%% block:` の名前が出る
      - 点線・× の矢じり・`autonumber` の番号があり、活性化の帯に出入りする線が帯の端で止まる
      - 参加者の箱が名前の行数に合わせて高くなり、最初の行が一番高い箱の下から始まる
      - 1 つ目の区切りの後、帯のタイトルがメッセージ 1 の文で、シーケンス図と構成図の両方でメッセージ 1 の線と送り手・受け手のほかが薄くなり、その線の上をデータの印が停止するまで繰り返し流れる。次のメッセージへは進まない
      - 構成図の案内を始めると、シーケンス図の強調が解ける
      - メッセージを移すたびに、構成図の図の枠の中は送り手と受け手のノードが、シーケンス図の図の枠の中は今のメッセージの線が収まる位置と倍率へ移る（正常系（map の案内を進める）と同じ）。構成図の図の枠を触った後は、次にバーか矢印のボタンを押すまで構成図の図の枠の中を移さない
    test: test_normal_when_map_sequence_played
  - name: 正常系（map のノード・参加者・線を選ぶ）
