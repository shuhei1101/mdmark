exclusivity: 同じ要素へ 2 回目の `mount` を呼ぶと、前の `mount` の `destroy` を先に行う。`update`・`destroy` の後に、前の描画で始めた外部ライブラリの読み込みが終わっても、その結果は描かない
request:
  - name: el
    type: HTMLElement
    required: true
    location: argument
    description: 描く先の要素
  - name: opts.markdown
    type: string
    required: true
    location: argument
    description: 描く Markdown
  - name: opts.config
    type: MdmarkConfig
    required: false
    default: なし（全てのキーに既定を適用する）
    location: argument
    description: 利用側のサーバーが `mdmark.config.yaml` を読み込んだオブジェクト。省いたキーには既定を適用する
  - name: opts.config.features
    type: Record<string, boolean>
    required: false
    default: '`comments`・`html-scripts`・`frontmatter` を除く全ての機能が `true`'
    location: argument
    description: '機能のオン・オフの既定。文書の `<!-- features: {"機能": false} -->` がその文書だけ上書きする'
    notes: 知らない機能名は無視する。機能は `print`（印刷の前に折り畳みと記法を開く）と、記法ごとの `table`・`callout`・`tabs`・`steps`・`tree`・`badge`・`code`・`toc`・`side-toc`（右側の目次）・`anchors`・`sections`・`row-details`・`figures`、先頭へ戻るボタンの `back-to-top`、図の部品の `diagrams`、図の表示する枠の高さを変えるリサイズハンドルの `diagram-resize`、埋め込んだ HTML の `html`、埋め込んだ HTML と図のヒント（`data-hint`・ER 図のテーブルと列の説明）のツールチップの `hints`、用語のツールチップの `glossary`、被参照の一覧と文書の別名の `backlinks`、ビューのマーカーの `views`、脚注の `footnotes`、選んだ箇所へのコメントの `comments`、埋め込んだ HTML の範囲の `css`・`ts`・`js` の `html-scripts`、文書の先頭のフロントマターの表示の `frontmatter`（`comments`・`html-scripts`・`frontmatter` だけ既定は `false`）、アイコンの `icon`・段組みの `columns`・蛍光ペンの `highlight`・キーの `kbd`・details の範囲の `details`・改ページの `pagebreak`・取り込みの `include`・wide の範囲の `wide`・CSV の表の `csv`・カードの格子の `card-grid`・mermaid のコードブロックを図にする `mermaid`
  - name: opts.config.libraries
    type: Record<string, string>
    required: false
    default: '`{}`'
    location: argument
    description: マーカーの名前から外部ライブラリのモジュールの URL を参照する対応表。mdmark が持つ既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は追加する
    constraints: URL はページの `document.baseURI` を基準に解決する
    example: '{ "test-lib": "/fixtures/test-lib.js" }'
    notes: '無い名前を追加できることは確認ログの決定（推奨案 A）。#6 の `registerComponent()` との棲み分けは #6 が決める'
  - name: opts.index
    type: MdmarkIndex
    required: false
    default: なし（描く文書の用語集の表だけで用語を照合し、被参照を出さない）
    location: argument
    description: 利用側のサーバーが、設定の `index` のパスの索引の YAML を読み込んだオブジェクト。構造は ER 図『索引』
    notes: Schema に合わない文書・用語の項目は除いて使用し、例外を投げない
  - name: opts.docId
    type: string
    required: false
    default: なし（被参照の一覧を出さず、関連文書のリンクは索引の `path` のままにする）
    location: argument
    description: 描く文書の索引の `id`。被参照の一覧を引き、関連文書から自分を除き、リンクの相対パスを求めるのに使用する
    example: arch
    notes: 索引に無い `id` は指定しないときと同じに扱う
  - name: opts.references
    type: MdmarkReferences
    required: false
    default: なし（被参照は索引の `related` だけから出し、ほかの文書の用語集の表の用語を照合しない）
    location: argument
    description: '`collectReferences` が返却した参照の表。被参照の一覧と、ほかの文書の用語集の表の用語に使用する'
    notes: 構造はインターフェース定義『参照の表を作る』のレスポンス。`glossary[].avoid` が無い用語は、やめた言い方を持たない用語として扱う
  - name: opts.diffSource
    type: DiffSource
    required: false
    default: なし（差分を開く UI を付けない）
    location: argument
    description: 文書のリビジョンの一覧と、リビジョンごとの本文を返却する取り出し元。指定すると、描いた文書に差分を開く UI が付く
    constraints: '`opts.docId` と一緒に指定する'
    notes: 構造は制約の「差分の取り出し元」。Git・YAML の読み込み方は mdmark が持たず、利用側が記載する
  - name: opts.commentStore
    type: MdmarkCommentStore
    required: false
    default: なし（コメントを付けられない）
    location: argument
    description: コメントを読み込み、保存する関数。`comments` がオンのときだけ使用する
    constraints: '`opts.docId` と一緒に指定する'
    notes: 構造は制約の「コメントの読み込みと保存の関数」。保存先は mdmark が持たず、利用側が記載する
  - name: opts.baseMarkdown
    type: string | null
    required: false
    default: なし（比較元で強調しない）
    location: argument
    description: 比較元の Markdown。指定すると、本文の中で比較元から追加・変更したブロックと削除したブロックを、`opts.diffMode` が `blocks` のときと同じ色で塗り分ける
    constraints: 文字列か `null`。それ以外は `TypeError`
    notes: '`opts.diffSource` は要らない。`null` は省いたときと同じ。`update` の第 2 引数で差し替える'
  - name: opts.onColumnsChange
    type: '(event: MdmarkColumnsChange) => void'
    required: false
    default: なし（通知しない）
    location: argument
    description: '列の表示・非表示の機能（`features.columns` か `columns.{列名}.hidden`）を持つ表で列の表示を切り替えるたびに呼ぶ関数。`MdmarkColumnsChange` は `tableIndex`（本文の中のその機能を持つ表の出現順の番号。0 から）と `hidden`（隠している列の見出しの文字の並び。表の列の順）'
    constraints: 関数。それ以外は `TypeError`
    notes: 描いた直後の `columns.{列名}.hidden` の状態と、`update` で再描画したときは呼ばない
  - name: opts.config.tooltips.placement
    type: '"top" | "bottom"'
    required: false
    default: '`top`'
    location: argument
    description: 本文の用語・文書の別名・脚注のツールチップを、持ち主の上と下のどちらに先に出すか
    notes: '`top` は上に出し、上に収まらないときだけ下に出す。`bottom` は下に出し、下に収まらず上に収まるときだけ上に出す。他の値は無視して `top` にする。図の部品の中の用語もこの値に従う。図・ヒント・グラフの項目のツールチップは `tooltips.diagramPlacement` に従い、この値に影響されない'
  - name: opts.config.syntax.url
    type: string
    required: false
    default: '`https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/`'
    location: argument
    description: 色分けのライブラリ（highlight.js）の `es/` フォルダの URL。本体を `{url}core.min.js`、言語を `{url}languages/{言語}.min.js` から読み込む
    constraints: 末尾は `/`。URL はページの `document.baseURI` を基準に解決する。文字列でない値は無視して既定を適用する
    example: '"/vendor/highlightjs/es/"'
    notes: マーカーの名前の対応表 `libraries` とは分け、文書に `<!-- syntax -->` のようなマーカーを記載させない
  - name: opts.config.side-toc.mode
    type: '"hover" | "fixed"'
    required: false
    default: '`hover`'
    location: argument
    description: 右側の目次の出し方。`hover` は右端にポインターかフォーカスがある間だけ出し、`fixed` は目次を出すボタンで出し続ける
    notes: 他の値は無視して `hover` にする。`side-toc` がオフのときは使用しない
  - name: opts.aliases
    type: MdmarkAlias[]
    required: false
    default: なし（エイリアスを照合しない）
    location: argument
    description: 利用側が `buildAliases` で作ったエイリアスの並び。構造は ER 図『エイリアス』
    notes: 使用できないエイリアスは除いて使用し、例外を投げない。`update` は描いたときのエイリアスを使用する
    status: planned
  - name: opts.config.colorTheme
    type: '"dev-swiss" | "theme-paper" | "theme-slate" | "theme-contrast"'
    required: false
    default: '`dev-swiss`'
    location: argument
    description: 描いた文書の配色の値の組を選ぶテーマの名前。明暗は制約「配色の切り替え」のまま、選んだテーマの中で選ぶ
    notes: 知らない名前と文字列でない値は無視して `dev-swiss` で描く（例外を出さない）。利用側の CSS のパスの `theme` とは別のキー
    status: planned
  - name: opts.config.colorScheme
    type: '"light" | "dark" | "auto"'
    required: false
    default: '`auto`'
    location: argument
    description: 描いた文書の配色の明暗。`light`・`dark` は描く先の祖先の class と OS の配色より優先し、`auto` は制約「配色の切り替え」の class と OS の配色に任せる
    notes: 知らない値と文字列でない値は `auto` にする（例外を出さない）。文書の page のマーカーの `scheme` がこの値より優先する
    status: planned
  - name: opts.diffMode
    type: '"button" | "open" | "blocks"'
    required: false
    default: '`button`'
    location: argument
    description: 差分の出し方。`button` は読者が「変更表示」を押してから差分の行を出し、`open` は描いた時点で押した状態にして差分の行を出す。`blocks` は「変更表示」と差分の場所を配置せず、描いた文書のブロックを追加と削除の色で塗り分ける
    notes: '`opts.diffSource` を指定しないときは使用しない。他の値は無視して `button` にする（制約「差分の出し方」）'
    status: planned
  - name: opts.config.labels.paramCopy
    type: string
    required: false
    default: '`今の値をコピーする`'
    location: argument
    description: 操作できる部品の今の値をコピーするボタンの、アイコンの後ろに描く文言。ボタンのスクリーンリーダー向けの名前もこの文言になる
    example: '"コピー"'
    notes: 空でない文字列だけを受け、省いたとき・空文字・文字列でない値は既定の文言で描く（例外を出さない）。`labels` の知らないキーは読み込まない。`update` で再描画したときも `mount` に指定した文言のまま描く
    status: implemented
  - name: opts.config.html-scripts.url
    type: string
    required: false
    default: '`https://cdn.jsdelivr.net/npm/@babel/standalone@8.1.1/+esm`'
    location: argument
    description: 範囲の `ts`・`js` を CommonJS に変える変換のライブラリ（@babel/standalone）の ES モジュールの URL
    constraints: URL はページの `document.baseURI` を基準に解決する。文字列でない値は無視して既定を適用する
    example: '"/vendor/babel-standalone/standalone.mjs"'
    notes: '`syntax.url` と同じく、マーカーの名前の対応表 `libraries` とは分ける。`html-scripts` がオフのときと、範囲に `ts`・`js` が無いときは使用しない'
  - name: opts.config.mermaid.url
    type: string
    required: false
    default: '`https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs`'
    location: argument
    description: mermaid の ES モジュールの URL。mermaid のコードブロックがある文書でだけ `import()` で読み込む
    constraints: URL はページの `document.baseURI` を基準に解決する。文字列でない値は無視して既定を適用する
    example: '"/vendor/mermaid/mermaid.esm.min.mjs"'
    notes: '`syntax.url`・`html-scripts.url` と同じく、マーカーの名前の対応表 `libraries` とは分ける。機能 `mermaid` がオフのときと、mermaid のコードブロックが無いときは使用しない'
  - name: opts.config.mermaid.theme
    type: '"mdmark" | "default" | "neutral" | "dark" | "forest" | "base"'
    required: false
    default: '`mdmark`'
    location: argument
    description: mermaid の図のテーマ。`mdmark` は描く先の要素の CSS 変数から作る mdmark の外観のテーマ（制約「mermaid のテーマ」）、ほかは mermaid のテーマの名前をそのまま使用する
    constraints: 知らない値は無視して `mdmark` にする
    example: '"neutral"'
  - name: opts.config.mermaid.themeVariables
    type: Record<string, string>
    required: false
    location: argument
    description: mermaid のテーマの変数（`primaryColor` など）を上書きする値。`theme` で選んだテーマの変数に重ねる
    constraints: 値が文字列のキーだけを受け、ほかは無視する。`useGradient`・`dropShadow` は上書きできない（制約「mermaid のテーマ」）
    example: '{ "primaryColor": "#e0f2f1" }'
    notes: mermaid の初期化の設定のうち、テーマ以外（`securityLevel`・`startOnLoad` など）は利用側に開けない（要件.md の推奨案 A）
  - name: opts.includes
    type: Record<string, string>
    required: false
    location: argument
    default: なし（include のマーカーを全て取り込み先が無い記載の警告にする）
    description: '`render` の `opts.includes` と同じ。`update` の `options.includes` で差し替える'
    notes: 構造とパスの基準はインターフェース定義『文書をHTML文字列にする』の制約「取り込み」
  - name: opts.icons
    type: Record<string, MdmarkIconNode>
    required: false
    location: argument
    default: なし（まとめていない名前は jsDelivr から読み込む）
    description: '`render` の `opts.icons` と同じ。表にある名前は読み込まずにこの構造で描く'
    notes: 書き出した HTML は、使用する名前の構造を埋めて指定し、外へ要求しない
  - name: opts.config.tooltips.diagramPlacement
    type: '"top" | "bottom"'
    required: false
    default: '`bottom`'
    location: argument
    description: 図の線・ノード・グループのタイトル・グラフの項目・ER 図のテーブルと、埋め込んだ HTML のヒントのツールチップを、持ち主の上と下のどちらに先に出すか
    notes: '`bottom` は下に出し、下に収まらず上に収まるときだけ上に出す。`top` は上に出し、上に収まらないときだけ下に出す。他の値は無視して `bottom` にする。本文と図の部品の中の用語のツールチップは `tooltips.placement` に従う'
  - name: opts.config.table.pin
    type: '"each" | "through"'
    required: false
    default: '`each`'
    location: argument
    description: 表のピン止めの動き。`each` は押した列だけを留め、留めた列より左を表示している間は右端に、過ぎた後は左端に留める。`through` は押した列までを左端に留める。どちらも、表の見えている幅に収まらない右側の列は留めない
    notes: 他の値は無視して `each` にする。`table` がオフのときは使用しない
  - name: opts.config.table.long_column_min
    type: number
    required: false
    default: '`45`'
    location: argument
    description: 長文の列（`data-long` の列）の最小の幅の em の数。列の最も長い行の幅の方が狭ければ、その幅を最小の幅にする
    constraints: 0 より大きい数だけを受け付け、ほかの値は無視して `45` にする。列ごとの `width.min` があればそちらを優先する
    example: '30'
    notes: '`mdmark.config.yaml` の `table.long_column_min` と同じ値。`table` がオフのときは使用しない'
  - name: opts.config.map.node_fit
    type: '"height" | "width"'
    required: false
    default: '`height`'
    location: argument
    description: map の構成図の、名前が長いノードの広げ方。`height` は幅を上限 220px のまま折り返して高さを増やし、`width` は幅を上限 360px まで広げてから折り返す
    constraints: 知らない値は無視して `height` にする
    example: '"width"'
    notes: 既定は確認ログで決定した。`mdmark.config.yaml` の `map.node_fit` と同じ値
  - name: opts.config.map.url_state
    type: boolean
    required: false
    default: '`true`'
    location: argument
    description: map の中へ入ったグループと、シーケンス図の中だけを描くブロックを、URL のクエリ文字列（`map-{図の番号}`）に保つか。`false` ではクエリ文字列を読みも書きもしない
    constraints: 真偽値でない値は無視して `true` にする
    example: 'false'
    notes: 使う側のルーターがクエリ文字列を使うページ向け。sessionStorage には設定によらず保つ
  - name: opts.config.map.kinds
    type: 'Record<string, { label?: string; icon?: string; shape?: "rounded" | "rect" | "pill" | "double"; color?: string }>'
    required: false
    default: なし（種類の行を空にし、角の丸い四角で描く）
    location: argument
    description: Mermaid のクラス名（`:::名前`）ごとのノードの種類。`label` は種類の行の名前、`icon` は Lucide のアイコンの名前、`shape` は形（既定 `rounded`）、`color` は色の名前
    constraints: 知らない形・色の名前・Lucide に無いアイコンの名前は無視して既定にする。Mermaid のクラスが `map.kinds` に無いノードは、種類の行を空にして角の丸い四角で描き、図の前の書き方の警告に記載する。mdmark は種類を持たない（プリセットも持たない。確認ログ）
    example: '{ "store": { "label": "保存先", "icon": "database", "shape": "rect", "color": "purple" } }'
  - name: opts.config.map.lines
    type: 'Record<string, { dash?: "solid" | "dashed" | "dotted" | "dash-dot" | "long-dash"; width?: "thin" | "normal" | "thick"; head?: "filled" | "open" | "none"; color?: string }>'
    required: false
    default: なし（実線・太さ normal・塗りの矢じりで描く）
    location: argument
    description: Mermaid の矢印（`-->`・`-.->`・`==>`）ごとと、補足の `layout` の `line` で指す名前ごとの線の種類
    constraints: 知らない模様・太さ・矢じり・色の名前は無視して既定にする。補足の `layout` の `line` の名前が `map.lines` に無い線は既定の線で描き、図の前の書き方の警告に記載する。凡例は出さない
    example: '{ "-.->": { "dash": "dashed", "head": "open" }, "back": { "dash": "dotted" } }'
request_example: |-
  ```json
  {
    "markdown": "# 見出し\n\n<!-- features: {"print": false} -->\n\n本文",
    "config": {
      "features": { "print": true },
      "libraries": { "test-lib": "/fixtures/test-lib.js" }
    }
  }
  ```
response:
  - name: update
    type: '(markdown: string, options?: { baseMarkdown?: string | null; includes?: Record<string, string> }) => void'
    description: 本文だけを再描画し、記法の操作をもう一度付ける。設定は `mount` に指定したものを使用する
    notes: '`destroy` の後は何もしない。`options.baseMarkdown` を指定すると比較元を差し替え、`null` で比較元を解除する。`options` か `options.baseMarkdown` を省くと前の比較元のまま描く。`options.includes` を指定すると取り込む文書の表を差し替え、省くと前の表のまま描く'
  - name: reloadComments
    type: () => Promise<void>
    description: 本文を再描画せずに `opts.commentStore.load` をもう一度呼び、コメントのマーカーをもう一度付ける
    notes: '`comments` がオフ・`opts.commentStore` が無い・コメントの部品のモジュールを読み込めないとき、`destroy` の後は、`load` を呼ばずに解決する'
  - name: focusComment
    type: '(id: string) => void'
    description: その `id` のコメントのマーカーを画面に入れてフォーカスを移し、強調する
    notes: マーカーが無い `id`（箇所が見つからないコメントと、`load` を待っている間を含む）と `destroy` の後は何もしない
  - name: destroy
    type: () => void
    description: '`el` の中を空にして class `mdmark` を削除し、記法の操作と `beforeprint`・`afterprint`・`hashchange`・`document` の受け取りを解除する'
    notes: 2 回目以降は何もしない
exceptions:
  - name: なし（正常終了）
    condition: Markdown を描き、戻り値を返却する
  - name: なし（通知ブロック）
    condition: 外部ライブラリのモジュールを読み込めない、またはモジュールの `draw` が例外を投げる
    notes: 例外を投げず、そのマーカーの場所だけを通知ブロックに替える。マーカーの名前・URL・元のエラーを `console.error` に出す
  - name: TypeError
    condition: '`opts.diffSource` を指定し、`opts.docId` を指定しない'
    notes: 何も描かずに投げる。取り出し元に指定する文書の `id` が無く、利用側の誤りのため
  - name: なし（差分の通知ブロック）
    condition: 取り出し元の `revisions`・`content` が reject するか、返却した値が制約の「差分の取り出し元」の構造に合わない
    notes: 例外を投げず、差分の場所を通知ブロックに替え、文書の本文は描いたまま残す。取り出し元の関数の名前・文書の `id`・リビジョンの `id`・元のエラーか合わなかった値を `console.error` に出す
  - name: TypeError（コメント）
    condition: '`opts.commentStore` を指定し、`opts.docId` を指定しないか、`opts.commentStore` が `load`・`save` の関数を持たないか、`update`・`remove` を関数でない値で持つ'
    notes: 何も描かずに投げる。メッセージに `docId` か `commentStore` を含める
  - name: なし（コメントを保存できない）
    condition: '`save` が reject するか、返却した値が制約の「コメントの読み込みと保存の関数」の構造に合わない'
    notes: 例外を投げず、入力欄に記載した本文を残して `role="alert"` の通知を出し、マーカーを付けない。`save`・文書の `id`・元のエラーを `console.error` に出す
  - name: TypeError（比較元）
    condition: '`opts.baseMarkdown` か `update` の `options.baseMarkdown` が、文字列でも `null` でもない'
    notes: '`mount` は何も描かずに、`update` は前の本文を残して投げる。メッセージに `baseMarkdown` を含める'
  - name: TypeError（列の表示の通知）
    condition: '`opts.onColumnsChange` を関数でない値で指定する'
    notes: 何も描かずに投げる。メッセージに `onColumnsChange` を含める
  - name: なし（列の表示の通知が例外を投げる）
    condition: '`opts.onColumnsChange` が例外を投げる'
    notes: 列の表示の切り替えは済ませ、`onColumnsChange` と元のエラーを `console.error` に出す
  - name: なし（コメントを修正・削除できない）
    condition: '`update`・`remove` が reject する'
    notes: 例外を投げない。修正は入力欄と書き換えた本文を残し、削除はコメントとマーカーを残して削除の確認を開いたまま、`role="alert"` の通知を出す。関数の名前・文書の `id`・コメントの `id`・元のエラーを `console.error` に出す
  - name: reject（コメントを再読み込みできない）
    condition: '`reloadComments` の `load` が reject するか、返却した値が制約の「コメントの読み込みと保存の関数」の構造に合わない'
    notes: '`reloadComments` の Promise を元のエラーで reject し、今のマーカーを残す。`load`・文書の `id`・元のエラーか合わなかった値を `console.error` に出す'
  - name: なし（コメントの読み込みと保存の関数が無い）
    condition: '`comments` がオンで `opts.commentStore` を指定しない'
    notes: 例外を投げず、コメントのボタンを出さない。コメントの機能に読み込みと保存の関数が要ることを `mount` ごとに 1 回だけ `console.error` に出す
  - name: なし（ビュー・コメントの部品のモジュールを読み込めない）
    condition: ビューの部品かコメントの部品のモジュールを読み込めない
    notes: 例外を投げない。ビューのマーカーの場所は `render` が出した表のまま残し（切り替えとボードは配置せず、表は読み込めるため通知ブロックに替えない）、コメントはボタンを出さず `load` も呼ばない。読み込めなかった部品の名前（`view` か `comments`）・モジュールの URL・元のエラーを `console.error` に出す。文書の残りは描く
  - name: なし（色分けなし）
    condition: 色分けのライブラリの本体か言語のモジュールを読み込めない
    notes: 例外を投げず、読み込めなかった分のコードブロックを色分けせずに残す。URL と元のエラーを `console.error` に出す
  - name: なし（既定の出し方）
    condition: '`opts.config.side-toc.mode` が `hover`・`fixed` のどちらでもない'
    notes: 例外を投げず、`hover` として描く
  - name: なし（知らない差分の出し方）
    condition: '`opts.diffMode` が `button`・`open`・`blocks` のどれでもない'
    notes: 例外を投げず、`button` として描く
  - name: なし（ブロックの色分けを出せない）
    condition: '`opts.diffMode` が `blocks` で、取り出し元の `revisions`・`content` が reject するか、返却した値が制約「差分の取り出し元」の構造に合わない'
    notes: 例外を投げず、`opts.markdown` を色を当てずに描いた本文を残し、本文の先頭に通知ブロック（タイトル `変更を表示できません`・本文 `比べるリビジョンの本文を取り出せませんでした。色分けせずに表示しています。`）を配置する。`console.error` は差分の通知ブロックと同じ。文言は一覧と本文のどちらの失敗でも同じ（確認ログの決定）
  - name: なし（範囲のスクリプトを動かせない）
    condition: 範囲の `ts`・`js` の既定のエクスポートが関数でないか、評価か関数の呼び出しが例外を投げるか、構文エラー（`transform` の例外か、`script` 要素からの登録が無い）
    notes: 例外を投げず、その範囲の前に記載の警告を配置し、範囲の `html`・`css` とほかの範囲・本文は描いたまま残す。範囲の通し番号と元のエラーを `console.error` に出す
  - name: なし（変換のライブラリを読み込めない）
    condition: '`html-scripts.url` のモジュールを読み込めないか、`transform` を持たない'
    notes: 例外を投げず、`ts`・`js` の範囲の前に通知ブロックを配置し、範囲の `html`・`css` は描いたまま残す。URL と元のエラーを `console.error` に出す
  - name: なし（mermaid を読み込めない）
    condition: '`mermaid.url` のモジュールを読み込めないか、`render` を持たない'
    notes: 例外を投げず、mermaid のコードブロックごとに読み込み中のブロックを通知ブロックに替え、コードブロックを出して残す。URL と元のエラーを `console.error` に出す
  - name: なし（mermaid の記法を解釈できない）
    condition: mermaid の `render` がそのソースで例外を投げる
    notes: 例外を投げず、そのコードブロックの読み込み中のブロックを記載の警告（mermaid のエラーの 1 行目）に替え、コードブロックを出して残す。mermaid が文書に出すエラーの図は削除する。ほかの mermaid のコードブロックは描く
  - name: なし（Lucide に無いアイコンの名前）
    condition: まとめていない名前のアイコンのモジュールを読み込めず、同じ URL の `HEAD` が 404 を返却する
    notes: 例外を投げず、その名前の場所を記載したとおりの行内のコードに戻し、段落の前に記載の警告（Lucide に無い名前であること）を配置する
  - name: なし（Lucide のアイコンを読み込めない）
    condition: まとめていない名前のアイコンのモジュールを読み込めず、同じ URL の `HEAD` も失敗する（404 以外の状態を含む）
    notes: 例外を投げず、読み込めなかった名前の場所を記載したとおりの行内のコードに戻し、文書の先頭に通知ブロックを 1 つだけ配置する。URL と元のエラーを `console.error` に出す
constraints:
  - item: 描く本文
    constraint: '`render(markdown, { config })` が返却する HTML 文字列と同じ'
    notes: docs/interface/IF-472-34.ts
  - item: 外部ライブラリのモジュールの構造
    constraint: '`draw(slot: HTMLElement, options: Record<string, unknown>): void | Promise<void>` を名前付きで export する。`slot` はマーカーの場所の要素、`options` はマーカーの引数の JSON のオブジェクト（引数の無いマーカーは `{}`）。引数が JSON のオブジェクトでない（今の書き方の）マーカーは読み込まず、`render` と同じ記載の警告をその場所に描く'
  - item: 外部ライブラリの読み込み
    constraint: 対応表の URL を `import()` に指定する。import map は使用しない。同じ文書の同じ名前のマーカーは 1 回だけ読み込む
  - item: 外部ライブラリのマーカーの場所
    constraint: 読み込みの間は、class `mdmark-embed`・`role="status"`・文字 `図を読み込んでいます` の要素を配置する
    notes: 高さは本文の CSS が先に取る（モジュール構成設計）
  - item: 通知ブロック
    constraint: class `mdmark-notice`・`role="status"` の要素に、タイトル（class `mdmark-notice-title` の `strong`）と本文（`p`）を配置する。タイトルは図のマーカーなら `この図を表示できません`、図でないマーカーなら `この箇所を表示できません`。本文は `表示に使用するライブラリ（{マーカーの名前}）を読み込めませんでした。ネットワークにつながっているかを確認して、ページを再読み込みしてください。`
    notes: マーカーの名前は `code` 要素で囲む。設定の `libraries` で追加したマーカーは図のマーカーとして扱う
  - item: テーマ
    constraint: mdmark の CSS は `@layer mdmark` に入る。利用側は層の外の CSS と `--mdmark-` の変数で上書きする。mdmark は利用側の `theme.css` を読み込まない（利用側のページが `<link>` で読み込む）
    notes: 層の外で読み込むことが上書きの条件で、ページの `<link>` なら利用側がその条件を直に満たせ、`render` の出力にも同じ記載方法で該当する
  - item: 対応ブラウザ
    constraint: Chrome 99・Firefox 98・Safari 16.4 以上
    decided_by: NFR-472-1#
  - item: 表の操作
    constraint: '`data-features` の機能だけを付ける。並べ替えは各列の見出しをボタンにし、押すたびに降順 → 昇順 → 元の並びを繰り返す（数値だけの列は数の大きさ、それ以外は文字の順）。並べた列の `th` に `aria-sort` を付ける。ピン止めは、表が幅からはみ出すときだけ各列の見出しに `aria-pressed` を持つボタンを出す。`opts.config.table.pin` が `each` のときは、押した列だけを留め（ボタンの `aria-label` は `「{列名}」の列をピン止め`）、もう一度押すとその列だけを解除する。留めた列のセルは `position: sticky` にし、それより左で留めた列の幅の合計を `left`、右で留めた列の幅の合計を `right` に入れて、その列より左を表示している間は表の右端に、過ぎた後は左端に留める（幅はセルの `offsetWidth` の整数で足し合わせ、留めた列の間に隙間を出さない）。境の線は、左端に留まった最も右の列の右と、右端に留まった最も左の列の左にだけ引く。選んだ列（`through` は押した列までの列）は左から順に幅を足し、表の見えている幅（スクロールする要素の `clientWidth`）を超える列から右は留めずにスクロールに任せる。留まっていない列のボタンは `aria-pressed` を `true` のままにし、`is-unpinned` を付けて、`aria-label` と `title` に `（表の幅に収まらないため留まっていません）` を付ける（`through` は押した列のボタン）。表の幅・列の幅・選んだ列・列の表示と並びが変わるたびに選び直し、収まるようになった列は再び留める。描いた直後は `data-pin` の全ての列（無ければ `th scope="row"` の行見出しの全ての列、行見出しも無ければ先頭の列）を留め、留めた列のボタンの `aria-pressed` を `true` にする。`through` のときは、押した列までを左端に留め（ボタンの `aria-label` は `「{列名}」の列までピン止め`）、もう一度押すと解除する。描いた直後は `data-pin` の最も右の列（無ければ行見出しの最後の列、行見出しも無ければ先頭の列）までを留め、その列のボタンの `aria-pressed` を `true` にする。結合した見出しのセルは、またぐ列が全て留まっているときだけ留める。留める列は表がはみ出す間だけ当て、はみ出さない間は留めない。`data-check` の列は、並べ替え・絞り込み（候補を含む）・コピー・集計でセルの `data-value`（無いセルは文字）を値にする。絞り込みは `data-filter` の列の見出しにだけ `aria-expanded`・`aria-controls` を持つボタンを出し、`hidden` で開閉するドロワー（`select` は値のチェックボックスと候補の検索欄、`text` はキーワードの欄、`date` は開始日と終了日の欄と、どれも「絞り込みを解除」）を開く。ドロワーは同時に 1 つだけ開き、開いたら最初の入力欄へフォーカスを移し、外を押すか Esc で閉じる（Esc はボタンへフォーカスを戻す）。列ごとの絞り込みは重ねて当て、一致する行が無いときは「一致する行がありません」の行を出す。並べ替え・絞り込みで行の詳細はその行に付いて動く。`count`・`columns`・`reorder`・`total`・`copy` の表は、表の上に `mdmark-table-bar` の帯を配置する。件数は `aria-live="polite"` の要素に `{表示している行の数} / {全ての行の数} 件`（スクリーンリーダーは `{全ての行の数} 件中 {表示している行の数} 件を表示`）を出し、絞り込みのたびに書き換える。列の表示と並び順は、`columns`・`reorder` のどちらかを持つ表の帯に配置するアイコンだけのボタン（`aria-label` とツールチップが `テーブル設定`。`aria-expanded`・`aria-controls` を持つ）で、`role="dialog"` のテーブル設定のパネル（絞り込みのドロワーと同じ開閉の作法）を開く。パネルは、タイトル（`columns` があれば `表示と並び順`、`reorder` だけなら `並び順`）・列名の一覧・操作の案内を持つ。一覧の各行は、`reorder` の表では並べ替えのつまみ（`aria-label` が `「{列名}」の列を並べ替える`）を、`columns` の表では表示・非表示の目のアイコン（`aria-pressed` を持ち、`aria-label` が `「{列名}」を隠す`・隠した後は `「{列名}」を表示`）を持つ。描いた直後は `data-hide` の列の見出しとセルを `hidden` にし、Markdown に記載した先頭の列の目のアイコンは並べ替えた後も `disabled` にして、案内に `先頭の列は隠せません` を出す。隠した列があるときは、ボタンに隠した列の数のバッジを出し、`aria-label` を `テーブル設定（{隠した列の数} 列を非表示）` にする。`total` の表は、`data-total` に記載した計算ごとに 1 行ずつ、`合計`（`sum`）・`平均`（`avg`）・`件数`（`count`）の順に `tfoot` の行（`data-total-kind="{計算}"`）を配置する。各行の先頭のセルに計算の名前を、その計算を持つ列のセルに表示している行で集計した値を出し、ほかのセルは空にする（先頭の列を集計する行は、名前を左、値をセルの末尾に配置する）。絞り込みのたびにもう一度計算する。`sum`・`avg` は空のセルを除いて計算し、桁区切りを付けて小数は 2 桁までに丸める（平均する値が無いときは `—`）。`count` は空でないセルの数。`sum`・`avg` の列の本文の行（絞り込みに関わらず全ての行）に数として読み込めないセル（空のセルは数えない）が 1 つでもあれば、その列のその計算のセルを空にする（警告は `render` が表の上に配置する）。帯に `aria-expanded`・`aria-controls` を持つ `集計` のボタンを配置し、`表示する集計` のメニュー（`data-total` に記載した計算の名前のチェックボックス。開閉の作法はテーブル設定のパネルと同じ）で出す行を選ばせる。描いたときは全ての計算にチェックを入れ、チェックを解除した計算の行を `hidden` にし、出したこと・隠したことをスクリーンリーダーで通知する。選択は覚えず、再描画すると全ての計算に戻す。列を隠すと、その列の `tfoot` のセルも `hidden` にする。並べ替えで `tfoot` は動かない。`copy` の帯の `表をコピー` のボタンは lucide の `copy` のアイコンだけで文字を持たず、ツールチップ（`title`）とスクリーンリーダー向けの名前を `表をコピー` にし、`aria-expanded`・`aria-controls` を持ち、`コピーの形式` のメニュー（`Markdown の表`・`TSV` のボタン。開閉の作法はテーブル設定のパネルと同じ）を開く。形式を押すとメニューを閉じてフォーカスを `表をコピー` に戻し、見出しの行と表示している行の、表示している列のセルの文字を、選んだ形式で `navigator.clipboard.writeText` に書き込む（集計の行・行の詳細は含めない）。Markdown の表は見出しの行・`| --- |` の区切りの行・本文の行を `| セル | セル |` の構造で改行で並べ、セルの中の `|` を `\|` にする。TSV はセルをタブで、行を改行で区切る。書き込めたらボタンのツールチップとスクリーンリーダー向けの名前を `コピーしました` にして 2 秒で戻し、コピーした形式をスクリーンリーダーで通知する。記載できないとき（`navigator.clipboard` が無いか拒まれた）は、帯の直後に `role="group"` のパネル（タイトル・手動でコピーする案内・コピーする中身を入れた読み取り専用の `textarea`・閉じるボタン）を出し、`textarea` へフォーカスを移して中身を全て選択し、書き込めなかったことと手動でコピーできることをスクリーンリーダーで通知する。パネルは閉じるボタンか、パネルの中にフォーカスがある間の Esc で閉じ、フォーカスを `表をコピー` に戻す。もう一度コピーするときは前のパネルを閉じてから記載する。どちらも例外を外へ出さない。`rowlink` の表は、URL の `#` の後ろ（`#` が 2 つあれば最後の `#` の後ろ）を `decodeURIComponent` したもの（読み込めないときはそのまま）が行の `id` を指すとき（描いたときと `hashchange`）、その行を囲む閉じた表・閉じたセクションを開き、行が絞り込みで隠れていればその表の絞り込みを解除してから行へ移り、その行だけに `data-target` を付けて強調する。行へのリンクのマーカーは、行を指したとき・フォーカスしたとき・`data-target` の行で出し、指せない端末では常に薄く出す。マーカーを押すと、移る動き（アドレスバーの URL を行を指す URL にする）はそのままに、マーカーの解決済みの `href`（`rewriteLinks` が書き換えた後の値をページの URL で解決した絶対 URL）を `navigator.clipboard.writeText` に書き込み、描くときにマーカーの横へ配置しておいた空の `role="status"` の要素の文字を、書き込めたら `リンクをコピーしました`、書き込めなければ
      `リンクをコピーできませんでした` に書き換え、2 秒後に空に戻す（例外を外へ出さない）。印刷では表の上のボタンと行へのリンクのマーカーを出さず、件数と出している集計の行を出し、隠した列は隠したままにする。`thead` が複数の行を持つ表は、並べ替え・ピン止め・絞り込みのボタンを、列ごとにその列だけを覆う最下段の見出しのセル（上の行から縦に結合したセルを含む）に配置する。`data-merge-columns` の表は、並べ替え・絞り込みのたびにその列の結合を解き、表示している行の隣り合う同じ値のセルをもう一度結合する（始まりのセルに `rowspan`、続くセルに `hidden`）。並べ替え・絞り込み・コピー・集計は、`data-merge` のセルも値を持つセルとして扱う'
  - item: タブの操作
    constraint: '`mdmark-tabs` の頭に `role="tablist"` の並びを配置し、各 `mdmark-tab-panel` のタブ名を `role="tab"` のボタンにする。中身は `role="tabpanel"` にし、選んだタブの中身だけを出してほかは `hidden` にする。左右の矢印・Home・End でタブを移って選ぶ（WAI-ARIA のタブの作法）。描いた直後は最初のタブを選ぶ。`data-group` を持つ `mdmark-tabs` は、描いたときに localStorage のキー `mdmark-tabs:{group}` に残したタブ名のタブを選び、残していないかそのタブ名が無ければ最初のタブを選ぶ。読者が押すかキーでタブを選ぶと、ページの `data-group` が同じ `mdmark-tabs` のうち同じタブ名を持つものをそのタブ名へ切り替え（フォーカスは動かさない）、選んだタブ名を `mdmark-tabs:{group}` に残す。読者が押すかキーでタブを選ぶと、選ぶ前と後で押したタブのボタンの画面の上端からの位置が同じになるように、スクロールする場所（`el` に最も近いスクロールする祖先の要素、無ければ画面全体）のスクロール位置を差の分だけ戻す。同じ `group` のほかの `mdmark-tabs` の切り替えで高さが変わったときも同じ差で戻す。文書が縮んで戻しきれないときはスクロール位置の上限まで戻す。描いたときの選択と、URL の `#ID` へ移るときの選択では戻さない。描いたときの選択と統一して切り替わった選択は残さない。localStorage を取り出す・読み込みと保存をするときに例外が出たら、`console.warn` に出して残さず・読み込まずに統一する動きと切り替えを続ける。入れ子の `mdmark-tabs` はそれぞれ別の `tablist` にし、矢印・Home・End はフォーカスのある並びの中だけで移る。内側のタブを選んでも外側の選択は変えない。タブ名の `strong` はボタンの中に残す'
  - item: セクションと行の詳細の開閉
    constraint: セクションは見出しの文字を `aria-expanded`・`aria-controls` を持つボタンにし、閉じたセクションの `mdmark-section-body` を `hidden="until-found"` にする（`data-section="closed"` は閉じた状態で始める）。URL の `#ID` が閉じたセクションの中を指すとき（`mount` で描いたときと `hashchange`）と、ページ内検索が閉じたセクションの中に該当したときは、そのセクションを開く。`#ID` が見出しを指すときは、見出し自身の閉じたセクションも開く（表の行・コメントのマーカーなど見出しでない先へ移るときは、囲むセクションだけを開く）。読者が開閉したセクション（開閉のボタン・Shift での入れ子の開閉・すべて展開・すべて折りたたむ・URL の `#ID`・右側の目次から移る・コメントの箇所へ移る・ページ内検索で開いたもの）の開閉は `mount` ごとに覚え、`update` で描き直すと `mdmark-section-body` の `id` が同じセクションをその開閉で描く。覚えていないセクションと、`data-section` が覚えたときと変わったセクションはマーカーのとおりの開閉で描く。`update` では URL の `#ID` のセクションを開き直さない。印刷の前後の開閉は覚えず、同じ要素への 2 回目の `mount` と `destroy` で覚えた開閉を捨てる。行の詳細は、詳細を持つ行の先頭のセルに `aria-expanded`・`aria-controls` を持つボタンを配置し、`mdmark-row-detail` の行を `hidden` で開閉する（描いた直後は閉じる）
  - item: 描き直しで部品の開閉を保つ
    constraint: '読者が手で開閉した行の詳細・details の範囲（`collapse` で折りたたみに入れたタブ・ステップを含み、同じ種類として数える）・折りたたみの注意書き・ER 図の列・ファイルツリーのフォルダ・コードの折りたたみ・階層の表の行の開閉を `mount` ごとに覚え、`update` で描き直すと同じ要素をその開閉で描く。同じ部品は、囲む最も内側の見出しのセクションの `mdmark-section-body` の `id`（見出しより前の部品は文書の先頭として扱う）と、そのセクションの中で同じ種類の部品の何番目か（入れ子のセクションの中の部品は数えない）で対応を取り、部品の中の要素は鍵で対応を取る（行の詳細はマーカーの `at` の行の位置（並べ替え・絞り込みに左右されない）、ER 図はテーブルの名前 `data-node`、ファイルツリーはフォルダのパス、コードの折りたたみは行番号、階層の表は行の `data-path`。details の範囲と注意書きは部品そのものが要素）。押した回数によらず最後の開閉を覚える。覚えていない要素と、開閉のマーカー（details の `open`・注意書きの `+`/`-`・ER 図の `folded`・ファイルツリーの `data-open`・コードの `data-folded`）の指定が覚えたときと変わった要素は、マーカーのとおりの開閉で描く。印刷の前後の開閉は覚えず、同じ要素への 2 回目の `mount` と `destroy` で覚えた開閉を捨てる'
  - item: 印刷で記法を開く
    constraint: '`print` がオンのとき、`beforeprint` で閉じた `details`（閉じた表・閉じた注意書きと入れ子の注意書きを含む）・閉じたセクション・行の詳細・閉じたツリーのフォルダ・畳んだコードの行・列を畳んだ ER 図のテーブル（全ての列を出し、関係の線をもう一度結ぶ）・閉じた脚注の一覧・畳んだ階層の表の行・隠した YAML の見本を開き、タブの全ての中身をタブ名をタイトルにして縦に並べる。`afterprint` で、開いたものだけをもう一度閉じ、印刷の前に選んでいたタブだけを出す'
  - item: 拡張のマーカー
    constraint: 登録した拡張のマーカーの場所は、拡張の `schema` で `{ options, definition }`（`options` はマーカーの引数の JSON のオブジェクト、`definition` は範囲の中の部品の定義）を検査し、合えば `load` で読み込んだモジュールの `draw` に同じ値で描かせる。引数が JSON のオブジェクトでない（今の書き方の）拡張のマーカーは `schema` も `load` も呼ばず、`render` と同じ記載の警告をその場所に描く。合わなければ記載の警告、読み込めなければ通知ブロックに替える
    notes: docs/interface/IF-472-32.ts
  - item: 用語と文書の別名の下線
    constraint: 本文の文字を `Intl.Segmenter`（`ja`・`word`）で区切り（`Intl.Segmenter` を持たない環境では、英数字の連なりを 1 単語とし、それ以外の文字を 1 文字ずつ区切る）、始まりと終わりが区切りに一致する用語の単語・別名と文書の `aliases` を、長い単語を先に照合する。照合の前に、単語と本文の文字の両方を NFKC・英字の小文字化・前後の空白の除去で正規化し、下線は本文に記載したままの文字に付ける。図の部品の `{{単語}}` も同じ正規化で用語を参照する。用語は用語の `id`、文書の別名は文書の `id` ごとに、セクション（h2〜h4）ごとに最初に出たところだけを class `mdmark-term` の要素にし、破線の下線を付ける。コード・リンク・見出し・用語集の表の中は照合しない。正規化した後に同じになる単語が複数の用語に該当するときは、索引の `terms`・`opts.aliases`（並びの順）・描く文書の表・ほかの文書の表（索引の `docs` の順）の順で 1 つを選ぶ
    notes: 下線の要素の構造は部品設計で決める
  - item: ツールチップの操作
    constraint: 下線の要素にポインターを乗せたときとフォーカスしたときにツールチップを出し（ポインターの形状は変えない）、ツールチップの上へポインターを移しても出したままにし、Esc で削除してフォーカスを単語に残す（WCAG 1.4.13）。`pointerType` が `touch` のときは `pointerenter`・`pointerleave` で開閉せず、単語の `pointerdown` で開閉を切り替え、開いている間はツールチップと単語の外の `pointerdown` で閉じる（ツールチップの中のリンクとボタンの `pointerdown` では閉じない）。関連文書・エイリアスのリンク・コマンドのコピーのボタンを持つツールチップは、単語から Tab で中のリンクとボタンへ移れ、中にフォーカスがある間は出したままにする。表やタブの枠で切れないよう画面に対して配置し、`opts.config.tooltips.placement` が `top`（既定）なら単語の上に開いて上に収まらなければ下に、`bottom` なら単語の下に開いて下に収まらず上に収まれば上に開く。`update` でもう一度付け、`destroy` で削除する
    notes: WAI-ARIA の役割とフォーカスの出入りは部品設計で決める
  - item: 関連文書と被参照の一覧
    constraint: ツールチップの「関連文書」には、単語に `aliases` が一致した文書（描く文書自身を除く）のタイトル・リンク・`description` を出す。文書の末尾には、`opts.references.backlinks[opts.docId]`（無ければ、索引の `related` の要素の相手（オブジェクトは `to`、文字列はその値）に描く文書を持つ文書）を「関連文書」のタイトルの一覧にして配置し、空なら配置しない。リンクの `href` は描く文書の `path` を基準にした参照先の相対パスにする。`backlinks` がオフのときは、文書の別名の照合と末尾の一覧をしない
  - item: 索引の値の出し方
    constraint: 索引のタイトル・意味・`description` は Markdown として解析せず、文字として出す。リンクの `href` は本文のリンクと同じ許可の検査にかける
  - item: 用語と関連文書の一覧の id
    constraint: 1 つのページに文書を 2 つ以上描いても重ならないよう、`mount` は用語の下線のツールチップと関連文書の一覧のタイトルの `id` を、モジュールの通し番号でページの中で一意な値にもう一度振り、それを指す `aria-describedby`・`aria-details`・`aria-labelledby` も修正する。`update` でもう一度振る。`render` の出力の `id` は文書の中で一意なまま
    notes: タブの `mdmark-tabs-{n}`（`src/interact/tabs.ts` の `tabsCounter`）と同じ作り
  - item: 図の拡大・縮小
    constraint: 図の部品の右上に、縮小・倍率・拡大・全画面のボタンをこの順に配置する（アイコンは lucide の `minus`・`plus`・`expand`。倍率のボタンは今の倍率を `125%` の構造の文字で出す）。描いたときは図の全体が表示する枠の幅と高さに収まる倍率（100% を超えない）で出し、この倍率を下限、300% を上限にする。拡大・縮小は 1 回 1.25 倍。倍率のボタンを押すと、描いたときの倍率と位置に戻す（描いたときの倍率と位置のときも押せ、何も変わらない）。倍率のボタンのスクリーンリーダー向けの名前は `倍率 {今の倍率}。全体が収まる倍率に戻す` にし、倍率が変わるたびに書き換える。図の中にフォーカスがある間だけ、キーの `+`・`-`・`0` で拡大・縮小・戻すをする。下限・上限ではその向きのボタンを押せなくする。ホイールは受け取らず、文書のスクロールと Shift との横のスクロールに任せる。表示する枠の幅が変わったとき、描いたときの倍率のままなら収まる倍率をもう一度求める。埋め込んだ HTML の中の図の部品にも同じボタンと操作を付け、部品でない HTML には付けない
    notes: 'D-43 は部品でない普通の HTML に限る（確認ログ）。戻すのボタンを倍率のボタンにまとめ、今のスクリーンリーダー向けの名前 `全体が収まる倍率に戻す` を残すのは #6 の確認ログの決定。ほかのボタンのスクリーンリーダー向けの名前は部品設計'
  - item: 図の移動
    constraint: 図の文字の上ではカーソルを `text` にして文字を選ばせ、それ以外の上では `grab` にして、ドラッグした分だけ図を動かす（ドラッグの間は `grabbing` で、文字を選ばせない）。map の構成図のリンク先を持つノード（`a.mdmark-diagram-node-link`）の上は、名前の文字の上も含めてカーソルを `pointer` にし、文字を選ばせない。その上で押したまま 4px を超えて動かしたときはノードを動かし、離した後の `click` を `window` のキャプチャで止め（`preventDefault` と `stopPropagation`）、利用側が `document` で `click` を受けてもリンク先を開かない。この `window` の受け取りは、動かした後の 1 回の `click` を止めたら解除し、`update`・`destroy` でも解除する。動かさずに押して離したときと Enter は、リンクとして開く。タッチ（`pointerType` が `touch`）では、図の表示する枠の余白（ノード・線・グラフの項目・ボタン・リンクの外）をタップするまでは、横のドラッグだけを図の移動にし、縦のドラッグは文書のスクロールにする（`touch-action` は `pan-y`）。余白をタップした後は、図の外をタップするまで `.mdmark-diagram-box` に `data-touch-active` を付けて枠線をリンクの色の 2px にし、縦と横のドラッグを図の移動にする（`touch-action` は `none`）。図の枠を共有する全ての図（map・グラフ・ER 図・mermaid の図・埋め込んだ HTML の中のチャート）に当てる。図の表示する枠は `tabindex="0"` を持ち、フォーカスの間は矢印キーで押した向きの先が見えるよう 80px ずつ動かす（動かせる向きがあるときだけ文書のスクロールを止める）。図が表示する枠に収まらない間だけ、右上の帯に移動のボタン（上・下・左・右）を出し、矢印キーと同じだけ動かす（map の図は移動のボタンを出さない）。ポインターを押してから動いた距離がしきい値より小さい間は図を動かさず、グラフの項目のツールチップを出したままにし、しきい値を越えたら動かし始めて出しているツールチップを閉じる
    notes: モックの「移動のボタンは全体が見えている間は出さない」（確認ログ）。動かし始めるしきい値の距離はモジュール構成設計。指で動かす操作中の見せ方は確認ログ『図の枠を指で動かすときの操作中の見せ方』、外観はモック `docs/mock/components/diagram-frame-touch/`
  - item: 図の全画面
    constraint: 全画面のボタンで、タイトル・図・凡例を `<dialog>` のモーダル（`showModal()`）に出し、モーダルの中の図をモーダルの幅と高さに収まる倍率で開く。モーダルの右上の帯は文書の中と同じボタンで、全画面のボタンの位置に閉じるボタン（lucide の `x`）を配置する。閉じるボタンか Esc で閉じ、フォーカスを全画面のボタンへ戻す。ツールチップを開いている間の Esc はツールチップだけを閉じる。閉じたときに、モーダルのために付けた受け取りと大きさの監視を解除する
    notes: 全画面のモーダルは確認ログの決定（要件.md の `拡大・縮小`）
  - item: 図のツールチップ
    constraint: 'map の補足の `notes` で説明を持つ線の押せる帯とノードの右上のマーカーとグループのタイトルの右のマーカーと、グラフの項目（点・棒・扇形など）と、ER 図のテーブルの見出しの説明のボタンを、`aria-describedby` でそのツールチップを指すフォーカスできる要素にする。ポインターを乗せたときとフォーカスしたときに出し、ツールチップの上へポインターを移しても出したままにし、Esc で削除してフォーカスを持ち主に残す（WCAG 1.4.13）。`pointerType` が `touch` のときは `pointerenter` で開かず、持ち主の `pointerdown` で開閉を切り替え、開いている間はツールチップと持ち主の外の `pointerdown` で閉じる。同時に出すのは 1 つだけ。出す場所は `opts.config.tooltips.diagramPlacement` に従い（map の図は常に `bottom`）、`bottom`（既定）なら持ち主の下に開いて下に収まらず上に収まれば上に、`top` なら上に開いて上に収まらなければ下に開く。ノードのマーカーのツールチップはノードの下（上）、テーブルの説明のボタンのツールチップはテーブルの下（上）に配置する。グラフの項目のツールチップは系列か項目の名前と値を出し、点は外観の点より広いクリックを受ける範囲で開く（種類ごとの中身は部品設計）。ノードのマーカーの外では開かず、リンク先を持つノードのマーカーはリンクと別にフォーカスでき（Tab の順はリンク、マーカー）、マーカーを押してもリンク先を開かない。線とマーカーの上でポインターの形状を変えない。図を動かしたときと文書をスクロールしたときは持ち主に付いて動かし、`beforeprint` で閉じる。ノードの中の用語は、本文の用語と同じ下線の要素とツールチップの操作（制約の「用語と文書の別名の下線」「ツールチップの操作」）にする'
    notes: WAI-ARIA の役割とフォーカスの出入りは部品設計で決める
  - item: ER 図の列の開閉
    constraint: ER 図のテーブルの列の開閉のボタンを押すと（Enter・Space を含む）、全ての列を出しているテーブルは主キーと外部キーの列だけを出して `非表示 {数} 列` の行を配置し、畳んでいるテーブルは全ての列を出す。ボタンの `aria-expanded` とアイコン（lucide の `chevrons-down-up`・`chevrons-up-down`）を切り替え、関係の線・多重度の記号・ラベルを今の列の行の位置へもう一度結び、図の倍率を保ち、フォーカスをボタンに残す。全画面のモーダルは開いたときの開閉の状態で描く。`update` では制約「描き直しで部品の開閉を保つ」のとおりに描く
    notes: 列の行と線の結び方は docs/interface/IF-472-34.ts の制約『ER 図』。モックの「列を畳んだ」（確認ログ）
  - item: 操作できる部品の操作
    constraint: 'スライダーの `input` のたびに、今の値を `output` に出し、定義の `table` のその値の点でグラフの今の値の系列を再描画する（タイトル・凡例・倍率は保つ）。今の値を写すボタンは、アイコンの後ろに `opts.config.labels.paramCopy` の文言（既定は `今の値をコピーする`）を描き、`aria-label` を付けずにその文字をスクリーンリーダー向けの名前にする。押すと `{"{key}": {"name": "{label}", "value": {今の値}}}` を 2 字下げの JSON にして `navigator.clipboard.writeText` で書き込み、ボタンのそばの `role="status"` にコピーしたことを出す。書き込みが拒まれたときは、書き込めなかったことを出し、写すはずだった JSON をフォーカスできる `pre` に出して選んで写せるようにする'
    notes: 通知の文言は画面設計『文書』
  - item: 埋め込んだ HTML の操作
    constraint: '`mdmark-html` の幅が本文の列より広い間だけ、class `is-wide` と `tabindex="0"` を付け、その中で横にスクロールさせる（幅が変わるたびにもう一度判定する）。埋め込んだ HTML の中の文字にも、本文と同じ用語と文書の別名の下線・やめた言い方のマーカーとツールチップを付ける（下線は範囲ごとに単語の最初の 1 回だけで、本文のセクションとは別に数える）（図の部品の中の文字は制約の「図のツールチップ」のとおり）'
    notes: 文書に記載したスクリプトは動かさず、動くのは mdmark が付ける操作と、`html-scripts` がオンの文書の範囲の `ts`・`js`（制約「範囲のスクリプト」）だけ（D-22）
  - item: ヒントの操作
    constraint: '`data-hint` のブロックの要素は右上の `mdmark-hint-mark` のボタンだけ、行内の要素は要素そのものが、ポインターとフォーカスを受けてツールチップを開く。ブロックの要素のマーカーの外では開かず、要素にフォーカスも移さない。開き方・タッチでの開閉・出す場所・開いたままにする条件・同時に 1 つだけ・スクロールで付いて動く・`beforeprint` で閉じる・Esc で削除してフォーカスを持ち主に残すのは、制約の「図のツールチップ」と同じ。ポインターの形状は変えない。`hints` がオフのときは `render` がマーカーと中身を出さないため、何も付けない。`update` でもう一度付け、`destroy` で削除する。ツールチップの `id` は制約の「用語と関連文書の一覧の id」と同じくページの中で一意な値にもう一度振る'
    notes: マーカーだけで開くのとポインターの形状は確認ログの決定
  - item: 差分の取り出し元
    constraint: '`revisions(docId: string): Promise<DiffRevision[]>` と `content({ docId, revisionId }: { docId: string; revisionId: string }): Promise<string>` を持つ。`revisions` はリビジョンを新しい順に返却し、mdmark は並べ替えない。`DiffRevision` は `id`（空でない文字列・必須）・`at`（ISO 8601 の日時の文字列・必須）・`label`（文字列・任意）・`author`（文字列・任意）。`content` は Markdown の文字列を返却する。`revisions` が配列でない・`id` か `at` が無いか構造が合わない・`id` が重なる・`content` が文字列でないときは、reject と同じに扱う'
    notes: '`content` は ID が 2 つ並ぶためオブジェクトで受ける（外部規約『関数とオブジェクト引数』）。構造が合わないのは利用側の開発者の誤りで、読者の操作では起きない（計画書）'
  - item: 差分を開く UI
    constraint: '`opts.diffSource` を指定したとき、本文（右側の目次を配置するときは本文の列、配置しないときは `el`）の直下の最初の `h1` を文書のタイトルにし、タイトルの直後（`h1` が無ければ本文の先頭）に、`aria-expanded`・`aria-controls` を持つ「変更表示」のボタンと差分の場所を配置する。タイトルがセクションのときはタイトルとそのセクションの中身の間に配置し、H1 のセクションを閉じてもボタンは隠れない。押すと、本文の直下のうちタイトル・ボタン・差分の場所を除く要素と、右側の目次を隠し、差分の場所に差分を出す。差分を開いている間は、セクションの開閉（開閉のボタン・`hashchange`）でセクションの状態が変わっても隠した要素を出さない。もう一度押すと差分を片付け、隠した要素と右側の目次を出し（セクションは今の開閉の状態で出す）、フォーカスはボタンに残す。`update` は差分を閉じて本文を再描画し、`destroy` は差分と取り出し元の待ちを片付ける'
    notes: 配置方法は確認ログのモックへの合意。外観は画面設計『文書』。差分の場所は本文の見出しを持たないため、差分を開いている間は右側の目次（項目・今いるセクション・すべて展開とすべて折りたたむ）を出さない（レビューの指摘で案 A）
  - item: 比べる 2 つのリビジョン
    constraint: 差分を開くたびに `revisions` を 1 回呼ぶ。2 つ以上あれば、前に 2 番目・後に 1 番目のリビジョンを選び、`content` を前と後に 1 回ずつ呼ぶ。前と後の選ぶ欄の項目は、日時（JST）と `label`・`author` を並べる。前の欄では一番新しいリビジョンを、後の欄では前に選んだもの以前のリビジョンを選べなくし、前をもう一度選んで後が前以前になったら、後を前の 1 つ新しいリビジョンに移す。もう一度選ぶたびに選んだ 2 つの `content` をもう一度呼ぶ。リビジョンが 1 つなら `content` を呼ばず、`この文書のリビジョンは 1 つだけのため、比較対象のリビジョンがありません。` を出す
    notes: 文面は確認ログの決定
  - item: 差分の待ち
    constraint: 取り出し元の待ちが 1 秒を過ぎたら差分の場所に `変更を読み込んでいます` の枠を出し、2 秒を過ぎたら回る表示を追加する。待つ間にもう一度選ぶ・閉じる・`update`・`destroy` があったら、前の待ちの結果は描かない。mdmark は待ちを時間で打ち切らず、打ち切るときは取り出し元が reject で返却する
    notes: 古い結果を捨てるのは、本文の再描画の世代の番号と同じ作り
  - item: 差分の計算
    constraint: 2 つの Markdown のソースを、空白だけの行を除いて行ごとに比べる（空白だけの行どうしの一致を、変えていない行の手がかりにしない。最後の行の改行の有無は比べない）。除いた空白だけの行は、前と後のそれぞれで直前の空白でない行（無ければソースの先頭）に付ける。付けた先が同じ行かソースの先頭なら、前と後の空白だけの行を前から順に対にし、文字が同じ対を同じ行、文字が違う対を削除した行と追加した行、対にならない行を削除した行か追加した行にする。付けた先が削除した行・追加した行なら、その行と同じにする。変えた塊の中で、削除した行と追加した行を前から順に対にし、対の行を単語ごとに比べる。単語の区切りは `Intl.Segmenter`（`ja`・`word`）で、持たないブラウザでは 1 文字ずつ比べる
    notes: 比べるライブラリ（jsdiff）はモジュール構成設計で差分の計算の関数型の後ろに配置する
  - item: 差分の行
    constraint: 'ソースの行を、文字のまま 1 行ずつ出す。前にだけある行は class `mdmark-diff-line`・`data-kind="del"`、後にだけある行は `data-kind="add"`、同じ行は `data-kind="same"` を持つ。削除した行・追加した行は行頭に `-`・`+` のマーカー（`aria-hidden`）と、スクリーンリーダー向けの名前 `削除した行: `・`追加した行: `（見えない文字）を持つ。対の行で変わった単語は、削除した側を `del`、追加した側を `ins` で囲む。選ぶ欄の下の `role="status"` に `削除した行 {数}・追加した行 {数}` を出す。2 つの本文が同じなら行を出さず、`選んだ 2 つのリビジョンの本文に、変更はありません。` を出す'
    notes: 色は `--mdmark-color-diff-*` の CSS 変数（モジュール構成設計）
  - item: 埋め込んだ HTML の差分
    constraint: 差分の中の `<!-- html -->` 〜 `<!-- /html -->` の範囲は、範囲の見出しの右端に `HTML` のラベルを配置する。前か後で変えた範囲だけ、見出しに `role="group"`・`aria-label="HTML の見方"` の中に `aria-pressed` を持つ「ソース」「プレビュー」のボタンを配置する。既定はソースの行の色分けで、「プレビュー」を押すと、範囲の前と後の HTML を今の埋め込んだ HTML の描画（スクリプトとイベントの属性を落とす）で並べる。片側にしか無い範囲は、無い側に `{前か後}のリビジョンには、この範囲がありません` を出す
    notes: D-48・確認ログの語彙
  - item: 差分の通知ブロック
    constraint: 通知ブロックと同じ要素に配置する。`revisions` を取り出せないときは、タイトル `変更の履歴を表示できません`・本文 `リビジョンの一覧を取り出せませんでした。時間をおいて、変更をもう一度開いてください。` を差分の場所に出す。`content` を取り出せないときは、選ぶ欄を残し、タイトル `このリビジョンの本文を表示できません`・本文 `「{リビジョンの説明}」の本文を取り出せませんでした。別のリビジョンを選んでください。`（2 つとも取り出せなければ `「…」と「…」`）を差分の行の場所に出し、もう一度選べば差分を再描画する
    notes: 文面は確認ログの決定
  - item: ミニマップ
    constraint: 差分の行を出している間、スクロール先のスクロールの右端に、その高さいっぱいの帯（`aria-hidden`）を貼り付ける。スクロール先は差分の行の一番近いスクロールする祖先で、無ければ画面。帯はスクロール先の全体を表し、削除した行は左半分の赤・追加した行は右半分の緑のマーカー（続いた同じ種類の行は 1 つのマーカーにまとめ、プレビューに切り替えた範囲は範囲ごと 1 つのマーカー）にし、今見えている範囲を枠で示す。帯を押すとその位置がスクロール先の中ほどに来るようスクロールし、押したまま上下に動かすとそれに合わせてスクロールする。差分を閉じる・もう一度選ぶ・`destroy` で帯と受け取りを解除する
    notes: '確認ログのモックへの合意（画面の右端）。帯の本数と `position: fixed` の基準は部品設計とモジュール構成設計（計画書）'
  - item: ビューのマーカー
    constraint: '`<!-- view: {JSON のオブジェクト} -->` 〜 `<!-- /view -->` の範囲の最初の表を項目にする（見出しの行が列名、本文の行が項目、セルの文字が値）。キーは ER 図『ビューのマーカーの設定』に従い、`board.group.column`（ボードで分ける列）・`initial`（描いた直後のビュー `board`・`table`。既定は `board` があれば `board`）・`columns.{列名}.filter`（記法の表と同じ記載方法）・`board.values.{値}.icon`。`render` は範囲を class `mdmark-view` の要素にし、中に表を残す（ビューの機能がオフのときは表だけを出す）。記載方法の誤り（範囲に表が無い・`board.group.column`・`columns.{列名}` の列が表に無い・`board.values.{値}` の値が列に無い・選べる値に無い絞り込みの種類・使用できないアイコンの名前・閉じのマーカーが無い）は、範囲の上に記載の警告を出し、読み込めた指定だけを適用する。知らないキーは警告を出さずに無視する。`board.group.column` が該当しないときはボードを押せなくし、表が無いときは範囲の中身をそのまま描く'
    notes: マーカーの名前 `view` は記法のマーカーとして予約する（インターフェース定義『拡張を登録する』）。警告の文言は画面設計『文書』
  - item: ビューの操作
    constraint: '`mdmark-view` の頭に、`role="group"`・`aria-label="ビューの表示"` の中に `aria-pressed` を持つ「ボード」「表」のボタンを配置する（`board` が無いときは配置しない）。ボードは `board.group.column` の列の値ごとの列を表に出た順に横に並べ、列の見出しにアイコン・値・項目の数を出し、項目は表の行の順に、先頭の列の値をタイトルに、`board.group.column` の列を除く残りの列を列名と値の組で出す。描く先の幅に収まらない列はボードの中で横にスクロールさせる。表形式は範囲の表をそのまま使用し、記法の表の並べ替えと、`columns.{列名}.filter` の列にだけ記法の表と同じ絞り込みを付ける（制約の「表の操作」）。絞り込みは表形式にだけ当て、ボードは常に全ての項目を出し、表形式に戻すと絞り込みは残っている。ビューの上に検索欄と件数は配置しない。印刷では今のビューを出し、切り替えと絞り込みのボタンは出さない。`update` でもう一度付け、`destroy` で削除する'
    notes: 検索欄を持たず、絞り込みを表形式だけに適用するのは確認ログの決定。外観は部品設計と画面設計『文書』
  - item: ボードの列の見出しのアイコン
    constraint: 列の値から lucide のアイコンを参照する。既定の対応は `未着手` → `circle-dashed`・`進行中` → `circle-dot`・`保留` → `circle-pause`・`完了` → `circle-check`・`中止` → `circle-x` で、対応に無い値は `circle`。マーカーの `board.values.{値}.icon` は既定の対応に重ねて値ごとに上書きする。使用できるアイコンは mdmark がまとめるものに限り、既定の 6 つと `inbox`・`archive`・`clock`・`flag`・`star`・`bug`・`eye`・`lock`・`zap`・`ban`。アイコンは `aria-hidden` を持ち、列の見出しのスクリーンリーダーは値と項目の数だけにする
    notes: 既定の対応とアイコンを値ごとに上書きする指定は確認ログの決定。lucide の全てのアイコンをまとめると配布ファイルのサイズの上限を超えるため、使用できるアイコンを限る
  - item: コメントの読み込みと保存の関数
    constraint: '`load({ docId }: { docId: string }): Promise<MdmarkComment[]>` と `save({ docId, comment }: { docId: string; comment: MdmarkCommentDraft }): Promise<MdmarkComment>` を持つ。`MdmarkCommentDraft` は `quote`（選んだ文字）・`prefix`（選んだ文字の前の最大 32 文字）・`suffix`（後の最大 32 文字）・`body`（コメントの本文）の文字列。`MdmarkComment` はそれに `id`（空でない文字列）を追加したもの。`load` が配列でない・要素の構造が合わない、`save` が構造の合わない値を返却するときは reject と同じに扱う。mdmark はコメントを保存せず、利用側の保存先に任せる'
    notes: 差分の取り出し元と同じく、読み込みと保存は利用側の関数に任せる（D-17・要件『コメントの保存』）
  - item: コメントの操作
    constraint: '`comments` がオンで `opts.commentStore` を指定したときだけ付ける。本文の文字を 1 つのブロック（段落・リストの項目・表のセル・見出し・引用）の中で選ぶと、選んだ文字の終わりの下（収まらなければ上）に「コメント」のボタンを出し、DOM はそのブロックの直後に配置して Tab で届くようにする。入力欄・ビューの操作・コード・既にあるマーカーの中の選びには出さない。ボタンを押すと、選んだ文字の下に `role="dialog"` の入力欄（タイトル `「{選んだ文字}」へのコメント`・本文の欄・「キャンセル」「コメントを保存」）を開き、本文の欄へフォーカスを移す。Custom Highlight API があるブラウザでだけ、開いている間の選んだ文字に色を残す。本文が空のまま保存すると入力欄のそばに `コメントを記載してから保存してください。` を出す。保存を待つ間は保存のボタンを押せなくし、`保存しています…` にする。保存できたら入力欄を閉じ、選んだ文字をマーカーで包んでマーカーへフォーカスを移す。保存できないときは入力欄と本文を残し、`role="alert"` で `コメントを保存できませんでした。記載したコメントは残っています。もう一度「コメントを保存」を押してください。` を出す。入力欄はキャンセルか Esc で閉じ（本文があるときは捨ててよいかを確認する）、外側の押下では閉じない。マーカーは `tabindex="0"`・`role="button"`・`aria-haspopup="dialog"`・`aria-expanded` を持ち、押下・Enter・Space で、付いたコメントの本文を並べた吹き出しを開く。吹き出しは閉じるボタン・外側の押下・Esc で閉じ、フォーカスをマーカーへ戻す。選んだ文字とコメントの本文は文字として出し、HTML として解釈しない。印刷ではマーカーの地の色を削除して下線だけを残し、ボタン・入力欄・吹き出しを出さない'
    notes: 入力欄の捨てる確認方法と外観は部品設計。Custom Highlight API の確認はモックの指摘（対応ブラウザの下限で入力欄が閉じられなくなる）から引き継ぐ
  - item: コメントの箇所
    constraint: 描くたび（`mount`・`update`）に `load` を 1 回呼び、コメントごとに、本文の文字の中で `prefix + quote + suffix` が一致する箇所、無ければ `quote` が 1 か所だけ一致する箇所の `quote` をマーカーで包む。同じ箇所のコメントは 1 つのマーカーにまとめ、吹き出しに並べる。箇所が見つからないコメントは、文書の末尾の「箇所が見つからないコメント」の一覧（選んだ文字と本文）に出し、空なら配置しない。`load` を読み込めないときはマーカーを付けず、新しいコメントは付けられる。マーカーは本文の文字を変えず、`destroy` で削除する
    notes: 一覧のタイトルと文言は画面設計『文書』
  - item: コメントの修正と削除
    constraint: '`opts.commentStore` が `update({ docId, id, body }: { docId: string; id: string; body: string }): Promise<void>` と `remove({ docId, id }: { docId: string; id: string }): Promise<void>` のうち持っている関数ごとに、吹き出しのコメントごとの本文の右上へ、`update` なら `aria-label`・`title` が `編集`、`remove` なら `削除` のアイコンのボタンを配置する。「編集」は、そのコメントの場所を本文を入れた入力欄（「キャンセル」「保存」）に替えて入力欄へフォーカスを移し、本文が空のまま保存すると `コメントを記載してから保存してください。` を出す。保存を待つ間は保存のボタンを押せなくして `保存しています…` にし、解決したら書き換えた本文を出してそのコメントの「編集」へフォーカスを移す。reject したら入力欄と本文を残し、`role="alert"` で `コメントを保存できませんでした。記載したコメントは残っています。もう一度「保存」を押してください。` を出す。キャンセルと Esc で入力欄を閉じ、書き換える前の本文に戻して「編集」へフォーカスを移す。入力欄と削除の確認を開いている間の Esc は、それだけを閉じて吹き出しは開いたままにする。「削除」は、そのコメントの下に `このコメントを削除しますか? 削除すると元に戻せません。` と「キャンセル」「削除」を出してキャンセルへフォーカスを移す。確認のキャンセルと Esc は、`remove` を呼ばずに確認を閉じ、そのコメントの「削除」へフォーカスを移す。確認の「削除」で `remove` を呼び、待つ間は押せなくして `削除しています…` にする。解決したらコメントを吹き出しから除き、同じマーカーにコメントが残れば次のコメント（無ければ前のコメント）の最初のボタンへフォーカスを移し、残らなければマーカーを削除して吹き出しを閉じ、マーカーを含んでいたブロックに `tabindex="-1"` を付けてフォーカスを移す（スクロールしない）。reject したらコメントとマーカーを残し、削除の確認を開いたまま `role="alert"` で `コメントを削除できませんでした。もう一度「削除」を押してください。` を出す。修正・削除を待つ間に再描画するか `destroy` したときは、その結果を描かない'
    notes: 修正・削除のボタンの配置方法と削除の確認は確認ログの決定。外観は部品設計『コメントの吹き出し』
  - item: コメントの再読み込み
    constraint: '`reloadComments` は `load` を 1 回呼び、解決したら今のマーカーを削除してから制約「コメントの箇所」のとおりマーカーと「箇所が見つからないコメント」の一覧をもう一度付け、その後に Promise を解決する。本文の HTML と記法の操作の状態（並べ替え・絞り込み・開閉）は変えない。開いている吹き出しは閉じ、記載している入力欄は残す。待つ間に `update`・`destroy`・次の `reloadComments` があったときは、その結果を描かずに解決する'
  - item: コメントの箇所へ移る
    constraint: '`focusComment(id)` は、その `id` のコメントを持つマーカーを、閉じたセクション・閉じた表の行の詳細の中なら開いてから `scrollIntoView({ block: "nearest" })` で画面に入れ、フォーカスを移して `data-focused` を付ける。ほかのマーカーの `data-focused` は削除する。吹き出しは開かない。`data-focused` は次の `focusComment` と、マーカーをもう一度付ける（再描画し・再読み込み）まで残す'
    notes: 強調の外観（背景を濃くし、2px の線で全周を囲む）は部品設計『コメントのマーカー』とモックの合意
  - item: 余白のマーカー
    constraint: '`comments` がオンで `opts.commentStore` を指定したとき、`el` の中を `div.mdmark-content` とその右の余白の列 `div.mdmark-comment-margin`（幅 `--mdmark-comment-margin-width`）に分け、右側の目次があるときは余白の列を `aside.mdmark-side-toc` の前に配置する。マーカーごとに、マーカーのある行の縦の中ほどへ余白のマーカー（`button.mdmark-comment-marker`）を配置する。行の上端の差が 4px 以内のマーカーは 1 つのマーカーにまとめて箇所の数を添え、押すと行の最初のマーカーへ移る。閉じたセクション・選ばれていないタブ・閉じた行の詳細の中のマーカーは、いちばん外側の閉じた要素を `aria-controls` で指す開くボタンの行に、`data-closed`（`section`・`tab`・`row`）を持つマーカーを配置する。上のマーカーと重なるときは重ならない位置まで下げる。箇所が見つからないコメントにはマーカーを配置しない。`mountComments` は余白の列を配置しない'
    notes: 配置場所・同じ行の箇所・閉じた中の箇所はモック作成で案 A に決定（確認ログ）。スクリーンリーダー向けの名前・アイコン・色は部品設計
  - item: 余白のマーカーから移る
    constraint: マーカーを押すか、フォーカスして Enter・Space を押すと、マーカーを包む閉じた要素を外側から開き、マーカーが画面の中ほどに入るまでスクロールして、そのマーカーの吹き出しを開く（マーカーの押下と同じ処理）。吹き出しを開いているマーカーのマーカーは `data-current` を持つ
  - item: 余白のマーカーの再配置
    constraint: マーカーのもう一度付け（描くたびの `load`・保存）・描く先の要素の大きさの変化・セクションと行の詳細の開閉・タブの切り替え・吹き出しの開閉で、`requestAnimationFrame` で 1 フレームに 1 回にまとめてもう一度配置する。印刷では余白の列を出さない。`destroy` で余白の列と受け取りを解除する
  - item: 配色の切り替え
    constraint: '描く先の要素かその祖先が持つ class で、画面の配色を次の優先順に決める（描く先の要素に mount が付ける class は制約「明暗の当て方」）。(1) `mdmark-theme-dark` はダーク、`mdmark-theme-light` はライト (2) `vscode-high-contrast-light`・`vscode-light` はライト、`vscode-dark` と、`vscode-high-contrast-light` を一緒に持たない `vscode-high-contrast` はダーク (3) どれも無ければ `prefers-color-scheme`。同じ優先度の class が両方あるときは、描く先に近い祖先の class に従う。ダークの値は `prefers-color-scheme: dark` のときと同じ変数の値で、差分のミニマップの色も同じ規則で決める。印刷では class によらず明るい配色にする'
    notes: '`vscode-*` は VS Code が Webview の `body` に付ける class。`mdmark-theme-*` は、利用側が OS やホストの配色によらず固定するときに付ける（VS Code 拡張機能の `mdmark.preview.theme` が `light`・`dark` のとき）。利用側が層の外で上書きした変数は、どの配色でも層の中の値に勝つ'
  - item: やめた言い方のマーカー
    constraint: '`glossary` がオンのとき、索引の `terms[].avoid` の単語と、`opts.aliases` の `avoid` の種類の `name`・`aliases` と `term` の種類の `avoid` の単語と、描く文書の用語集の表と `opts.references` の `glossary` のやめた言い方の列の単語も制約の「用語と文書の別名の下線」と同じ区切り・同じ正規化・同じ範囲で照合し、同じ位置で用語の単語・別名にも該当するときは用語を選ぶ。文書の別名と同じ単語は、関連文書を出さずにやめた言い方にする（点検の `avoided_term` と同じ）。該当した単語は、セクション（h2〜h4）ごとにやめた言い方ごとの最初の 1 回だけを class `mdmark-term mdmark-term-avoided` の要素にして波線の下線を付け、「代わりの用語」のツールチップに代わりの用語の単語と意味を出す（用語の下線とは別に数える）。用語集の表のやめた言い方は、その行の用語の列と意味の列の文字を代わりの用語にする。同じやめた言い方を複数の用語が持つときは、索引の `terms`、`opts.aliases` の並び、索引の `docs` の順の文書の表の順で先の用語を代わりの用語にする（描く文書が索引の `docs` に無いときは、描く文書の表をほかの文書の表より先にする）。開閉は制約の「ツールチップの操作」のとおりで、印刷ではマーカーとツールチップを削除する。図のノードの中の `{{単語}}` は照合しない'
    notes: マーカーとツールチップの要素の構造は部品設計で決める。やめた言い方は参照先を持たないため、`collectReferences` の `backlinks`・`collectMatches` の結果と関連文書の一覧は変わらない
  - item: 色分けの対象
    constraint: 機能 `syntax` がオンの文書で、情報文字列の最初の単語の言語（`言語:ファイル名` の構造なら `:` の前）が色分けの言語の対応表にある、フェンスのコードブロックの `pre > code`。文書に記載した生の HTML の `pre > code` は、`language-*` の class を持っていても該当しない。記法が描いたもの（ファイルツリー・図の部品の定義・埋め込んだ HTML）は `pre > code` でないため該当せず、記法がコードブロックのまま残したものは該当する
    notes: '対応表（情報文字列の単語 → 言語のモジュール）: `typescript`・`ts`・`tsx` → typescript／`javascript`・`js`・`jsx`・`mjs`・`cjs` → javascript／`json` → json／`yaml`・`yml` → yaml／`python`・`py` → python／`bash`・`sh`・`shell`・`zsh` → bash／`html`・`xml` → xml／`css` → css／`markdown`・`md` → markdown／`sql` → sql／`dockerfile`・`docker` → dockerfile／`diff`・`patch` → diff。単語は大文字と小文字を区別しない'
  - item: 色分けの読み込み
    constraint: 描いた後に、色分けの対象が 1 つ以上あるときだけ、`syntax.url` の本体と文書が使用する言語のモジュールを `import()` で読み込む。言語のモジュールは並べて読み込み、読み込めたものだけを登録する。同じ `mount` の中で同じモジュールは 1 回だけ読み込む。読み込み終わる前に `update`・`destroy` したときは、前の描画に色を適用しない。読み込みの完了は待たずに `mount` を返却する
    decided_by: NFR-472-1#
    notes: 配布物 `dist/index.js` に色分けのライブラリをまとめない（非機能要件『配布ファイル 1 つのサイズ』）
  - item: 色分けの当て方
    constraint: 行に分けたコードブロック（`mdmark-code-line` を持つ）は各 `mdmark-code-text` の中を、分けないものは `code` の中を、highlight.js の `highlight` が返却する HTML に置き換える。行をまたいで開いている `span` は行末で閉じ、次の行の頭でもう一度開く。`pre`・`code`・`mdmark-code-line` の属性と `code` の `textContent` は変えない。色は `hljs-*` の class に CSS 変数 `--mdmark-color-syntax-{keyword,string,number,type,name,comment}` を適用する。`diff` の `hljs-addition`・`hljs-deletion` には、差分の行と同じ `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` を適用する。`[!code ++]`・`[!code --]` の行は、行の地の色と行頭の `+`・`-` を保ったまま行の中の文字を色分けする
    notes: 色分けの HTML は sanitize を経由しない（`hljs-*` は sanitize の許可に無い）。highlight.js はコードの文字をエスケープしてから `span` を付ける。種類ごとの class の当て方はモック `docs/mock/refs/97/assets/syntax-highlight.css` のとおり
  - item: 色分けを読み込めないとき
    constraint: 本体を読み込めないときは全てのコードブロックを、言語のモジュールを読み込めないときはその言語のコードブロックを、色分けせずに描いたまま残す。例外を投げず、通知ブロックも出さない。読み込めなかった URL と元のエラーを `console.error` に出す
    notes: コードは色分けが無くても欠けずに読み込めるため、外部ライブラリのマーカーと違って本文を枠で置き換えない
  - item: 見出し行と集計の行を留める
    constraint: 表は縦の高さの上限を持たず、列の幅は制約「列の幅」で決める。列の幅の合計が本文の幅に収まる表は本文の幅まで広げず、長文の列が折り返す表は本文の幅いっぱいまで広げる。全ての列の最小の幅の合計が本文の幅に収まらないときだけ表の中で横にスクロールし、続きがある側の端に影を出す（横にスクロールさせる要素の構造はモジュール構成設計）。表が画面に残っている間、見出し行のセルを、ページのスクロールで画面の上端から `--mdmark-sticky-top` だけ下の位置まで（本文の最後の行を越えない範囲で）下げ、集計の行のセルを画面の下端まで（本文の最初の行を越えない範囲で）上げる。ずらすのは元の見出し行と集計の行のセル（`transform`）で複製を作らず、横のスクロール・列の幅・ピン止め・並べ替え・絞り込みのボタンと状態・フォーカス・スクリーンリーダーは 1 組のまま一致する。ずらしたセルは背景を持ち、本文の行より手前に描く。`animation-timeline` と `animation-range` を持つブラウザでは、ずらす量を `view-timeline` と CSS のアニメーションでスクロールの位置から決め、表の大きさが変わったとき（`ResizeObserver`）だけ動く範囲の CSS 変数をもう一度入れる。持たないブラウザでは、`window` と文書の中の `scroll`・`window` の `resize`・表の大きさの変化のたびに、ずらす量を JS でもう一度入れる。表が画面の外に出ると、見出し行と集計の行も一緒に画面の外に出る。印刷ではずらさない。`update` でもう一度付け、`destroy` で受け取りと監視を解除する
    notes: PoC 検証で `animation-timeline` を持つブラウザは案 D、持たないブラウザは案 C に決定（計画書の `## PoC 結果`・確認ログ）。動く範囲の変数の名前はモジュール構成設計
  - item: コードブロックのコピー
    constraint: '`render` が帯（`mdmark-code-bar`）を付けたコードブロックの帯の右端に、`コピー` のボタン（`type="button"`）と `role="status"` の要素を配置する。押すと、行に分けたコードブロックは `data-kind="del"` の行を除く各行の `mdmark-code-text` の文字を改行でつないだもの、分けないものは `code` の文字から末尾の改行を 1 つ除いたものを `navigator.clipboard.writeText` に書き込む（行のマーカーとマーカーだけを持つ行コメントの頭は `render` が削除してあり、行番号と行頭の `+`・`-` は文字に入っていない）。書き込めたらボタンを `コピーしました` にして 2 秒で戻し、書き込めないとき（`navigator.clipboard` が無いか拒まれた）は `コピーできませんでした` にして次に押すまで残す。どちらも `role="status"` でスクリーンリーダーに伝えて通知し、例外を外へ出さない。畳んだコードの行もコピーに含める。印刷ではボタンを出さない。`update` でもう一度付ける'
  - item: コードの折りたたみ
    constraint: '`data-fold-lines` を持つ行の行番号の右（行番号を持たないときは行の頭）に、`aria-expanded`・`aria-controls` を持つ開閉のボタン（`type="button"`）を配置する（`data-folded` の行は `false`、ほかは `true`）。押すと（Enter・Space を含む）、その行の後ろの `data-fold-lines` の数の行を `hidden` にし、行の末尾に `type="button"` の `⋯` のボタン（スクリーンリーダー向けの名前は開く行の数を含む）を配置する。`⋯` か開閉のボタンを押すと開き、畳む前に畳んでいた内側の行は畳んだまま残す。Shift を押しながらの開閉（制約「入れ子をまとめて開閉」と同じ受け方）は、範囲の中の畳める行も同じ状態にする。畳んだ状態は再読み込みでは覚えず `data-folded` のとおりに戻し、`update` では制約「描き直しで部品の開閉を保つ」のとおりに描く。開閉のボタンは、ポインターがその行に乗ったとき、ポインターが開閉のボタンの列（行番号の右の、開閉のボタンを置く幅。行番号を持たないときは行の頭の同じ幅）のどこかに乗ったとき（そのコードブロックの全てのボタン）、フォーカスしたとき、畳んだ行のときに出し、ほかは透明にして押せる場所は残す。ポインターで乗せられない画面では常に出す。印刷では開閉のボタンと `⋯` を出さない'
  - item: インデントの縦線
    constraint: '`data-indent` の行に、レベルごとに縦線を CSS で描く（文字に入れず、選んで写す中身に入らない）。ポインターを乗せた行を含む最も内側の畳める範囲（畳める行の後ろの `data-fold-lines` の数の行）に `data-guide-active` を付け、その範囲の深さの縦線だけを濃くする。ポインターが行の外に出ると削除する'
    notes: 帯を付けるコードブロックは docs/interface/IF-472-34.ts の制約『コードブロック』
  - item: 本文の幅と見出し行を留める位置
    constraint: '`--mdmark-content-width` の既定は `none` で、本文の幅に上限を持たず描く先の要素の幅を使用する。利用側が長さを指定すると、本文の幅をその値までにする。`--mdmark-sticky-top` は見出し行を留める位置の画面の上端からのずれで、既定は `0px`。長さ（`px`・`rem` など）を受ける。`--mdmark-table-max-height` は廃止し、指定しても表の高さを抑えない'
    notes: 本文の幅はモック作成で案 A に決定（確認ログ）。`--mdmark-table-max-height` は設定と索引の Schema（`schemas/`）の項目でないため移行の手順を配置せず、変更履歴で廃止を通知する
  - item: URL の ID でタブの中へ移る
    constraint: URL の `#` の後ろ（`#` が 2 つあれば最後の `#` の後ろ）を `decodeURIComponent` した ID（読み込めないときはそのまま）が、選ばれていないタブの中身（入れ子のタブを含む）の中の要素を指すとき（描いたときと `hashchange`）、外側のタブから順にその要素を含むタブを選び、外側の閉じたセクションを開いてから要素へスクロールする。見出し・表の行を含め、`id` を持つ全ての要素に適用する。描いたときは localStorage に残したタブ名より URL の ID を優先する。URL の ID で選んだタブは localStorage に残さず、同じ `group` のほかのタブ群も切り替えない
    notes: '`src/interact/sections.ts` の `revealHashTarget` は、タブの中の要素の処理をタブの操作に任せる（受付判断のレビュー）'
  - item: 右側の目次
    constraint: '`side-toc` がオンで、文書に h1〜h3 の見出しが 1 つ以上あるとき、`el` の中を、本文（`render` の HTML）を入れた `div.mdmark-content` と、その右の `aside.mdmark-side-toc` に分ける。`aside` には、右端の線（見出しごとの短い線。`aria-hidden`）・目次を出すボタン・パネル（`nav`。タイトル `目次`・ピン止めのボタン・すべて展開とすべて折りたたむのボタン・項目の一覧）を配置する。項目は h1〜h3 の見出しを階層どおりに入れ子にした `ul` の、各見出しの `#{ID}` へのリンクで、閉じたセクションと選ばれていないタブの中の見出しも記載する。見出しが無いか `side-toc` がオフのときは分けず、`el` の中は本文だけにする（余白の列を配置するときを除く。制約「余白のマーカー」）。`--mdmark-content-width` は本文の列に適用する。差分を開いている間は `aside` を隠す（制約「差分を開く UI」）。印刷では `aside` を出さず、本文の列を紙の幅いっぱいに出す'
    notes: スクリーンリーダー向けの名前・ボタンの文言・アイコンは画面設計『文書』と部品設計。パネルの `nav` は `aria-label="右側の目次"` で、本文の中の目次（`<!-- toc -->`）とスクリーンリーダー向けの名前を分ける
  - item: 右側の目次の出し方
    constraint: '`side-toc.mode` が `hover` のとき、パネルは隠して配置し（透明にしてポインターを受けない。Tab では項目へ移れる）、右端の線にポインターを乗せている間と、パネルの中にフォーカスがある間だけ出す。ピン止めのボタン（`aria-pressed`）を押すと、ポインターとフォーカスが離れても出し続け、パネルを本文に重ねず右の列に配置する。もう一度押すと解除する。ポインターを乗せられない端末（`hover: none`）では、右端の線の代わりに目次を出すボタンを配置する。`fixed` のときは右端の線を配置せず、目次を出すボタン（三点リーダーのアイコン・`aria-expanded`・`aria-controls`）を押すとパネルを右の列に出し続け、もう一度押すと隠す。目次を出すボタンで出したパネルの中にフォーカスがある間の Esc は、パネルを隠してフォーカスを目次を出すボタンへ戻す。ピン止めと目次を出すボタンの状態は保存せず、`mount` のたびに解除した状態で始め、`update` では保つ。`update` で page のマーカーにより出し方（`hover`・`fixed`）が変わったときは、ピン止めと目次を出すボタンを解除した状態から始める'
    notes: ピン止めで右の列に配置するのと、ポインターを乗せられない端末のボタンは、モック作成で案 A に決定（確認ログ）
  - item: 狭い幅の右側の目次
    constraint: 描く先の要素の幅が 48rem 未満のとき、出し方によらず右端の線を配置せず、本文の上端の `--mdmark-sticky-top` の位置に留める帯に、今いるセクションの見出しの文字と目次を出すボタンを配置する。目次を出すボタンを押すと、パネルを帯の下に本文へ重ねて開き、幅は描く先の要素に収める。パネルの項目を押すとパネルを隠す。見出しへ移ったときは、見出しが帯に覆われない位置までスクロールする
    notes: 境目と出し方はモック作成で案 A に決定（確認ログ）。幅はコンテナクエリで判定するため、コンテナクエリを持たないブラウザ（Chrome 105・Firefox 110 未満。対応ブラウザの下限は Chrome 99・Firefox 98）では帯を出さず、広い幅の出し方になることを許す
  - item: 今いるセクション
    constraint: 画面の上端から高さの 25% の線より上にある最後の h1〜h3 の見出し（線より上に無いときは画面にある最初の h1〜h3 の見出し）を今いるセクションにし（h4〜h6 は数えず、h4 の下を読み込んでいる間はその上の h3 を今いるセクションにする）、その項目のリンクに `aria-current="location"`、右端の線のその見出しの線に `data-current` を付け、狭い幅の帯にその見出しの文字を出す。閉じたセクションと選ばれていないタブの中の見出しは数えない。見出しが線を越えたとき（`IntersectionObserver`）・セクションの開閉・タブの切り替え・`hashchange` のたびにもう一度決め、スクロールのたびに全ての見出しを測らない
  - item: 右側の目次から移る
    constraint: 項目を押すと、URL の `#ID` で移るとき（制約の「セクションと行の詳細の開閉」「URL の ID でタブの中へ移る」）と同じく、外側の閉じたセクションと見出し自身の閉じたセクションを開き、選ばれていないタブを選んでから見出しへ移り、URL の `#` の後ろを見出しの ID にする。URL がすでにその ID のとき（`hashchange` が起きない）も、同じく開いてから移る
  - item: すべて展開・すべて折りたたむ
    constraint: '`sections` がオンで文書にセクションが 1 つ以上あるとき、右側の目次のパネルの上部に、文字を持たずアイコンと `aria-label`・`title` を持つ、すべて展開とすべて折りたたむのボタンを配置する。すべて展開は文書の全てのセクション（h1〜h4）を開き、すべて折りたたむは h1 のセクションを開いて h2〜h4 の全てのセクションを閉じる。開閉のボタンの `aria-expanded` を合わせ、フォーカスは押したボタンに残す'
    notes: アイコンだけにするのと H1 のセクションを閉じないのは確認ログの決定
  - item: 入れ子をまとめて開閉
    constraint: Shift を押しながらセクションの開閉のボタンを押したとき（`click` の `shiftKey`）と、ボタンにフォーカスして Shift を押しながら Enter・Space を押したとき（ボタンの `keydown` の `shiftKey`。既定の動きを止め、`click` を発生させない）、そのセクションを今と逆の状態にし、中の入れ子の全てのセクションを同じ状態にする。外側のセクションとほかのセクションは変えない
    notes: Firefox ではキーで押した `click` の `shiftKey` が立たないため、キーは `keydown` で受ける（計画書）
  - item: エイリアスの照合
    constraint: '`glossary` がオンのとき、`opts.aliases` のエイリアスの `name` と `aliases` を、制約の「用語と文書の別名の下線」と同じ区切り・正規化・範囲で照合し、エイリアスの `id` ごとにセクション（h2〜h4）ごとに最初に出たところだけに下線を付ける（`avoid` の種類は制約の「やめた言い方のマーカー」）。`alias_type` が `env` のもの・`term`・`doc`・`command`・`url`・`skill`・`tool`・`path`・`avoid` に無いもの・種類の必須のキーが空のもの・`id` が前のエイリアスと同じものは照合せず、通知ブロックも出さない。図の部品の `{{単語}}` はエイリアスを参照しない'
    notes: '`env` は値にシークレットキーを含みうるため、`buildAliases` を経由せずに指定されても照合しない。種類ごとの必須のキーは ER 図『エイリアス』の補足'
  - item: エイリアスのツールチップ
    constraint: 種類ごとの区分の見出し（`term` は「用語」、`doc` は「文書」、`command` は「コマンド」、`url` は「URL」、`skill` は「スキル」、`tool` は「ツール」、`path` は「パス」）の下に名前と `description` を出す。`command` はコマンドをコードで出してコピーのボタンを配置し、`cwd` があれば実行場所を出す。`url` は URL の文字列にリンクを埋め、長い URL は 1 行に収めて末尾を「...」で省略する。`skill`・`tool`・`path` はスキル名・ツール名・パスをコードで出す。`avoid` は「代わりの用語」に `replacement` を、`term` の `avoid` は「代わりの用語」にそのエイリアスの名前と `description` を出す。値は制約の「索引の値の出し方」と同じく文字として出す
    notes: 区分と要素の構造は部品設計で決める
  - item: エイリアスの URL
    constraint: '`url` の URL は http・https のものだけをリンクにし、ほかの URL（`javascript:` など）は `a` 要素にせず文字で出す'
  - item: コマンドのコピー
    constraint: '`command` のツールチップの `コピー` のボタン（`type="button"`）を押すと、`command` の文字を `navigator.clipboard.writeText` に書き込む。書き込めたらボタンを `コピーしました` にして 2 秒で戻し、書き込めないとき（`navigator.clipboard` が無いか拒まれた）は `コピーできませんでした` にして次に押すまで残す。どちらも `role="status"` でスクリーンリーダーに伝えて通知し、例外を外へ出さない。押した後もツールチップは出したままにする'
    notes: 通知方法は制約の「コードブロックのコピー」と同じ
  - item: 選んだテーマ
    constraint: '`opts.config.colorTheme` のテーマの `--mdmark-color-*` の値の組を、ページ全体（`:root`）に適用する。同じページに別のテーマの文書を並べたときは、`theme-paper`・`theme-slate`・`theme-contrast` の並びで後のテーマが全ての文書に該当する（`dev-swiss` は他のテーマに負ける）。値の組はテーマごとに明るい配色と暗い配色を持ち、どちらを使用するかは制約「配色の切り替え」で決める。印刷では選んだテーマの明るい配色にする。値の組は `@layer mdmark` の中に配置し、利用側が層の外で上書きした変数は選んだテーマに勝つ。`destroy` で適用したテーマを解除する。`update` は差し替えた本文の page のマーカーの `theme` でもう一度決め、マーカーが無ければ `mount` に指定したテーマで描く'
    notes: テーマの値はデザイン方針の `## 採用スタイル`。描く先に属性 `data-mdmark-color-theme` を付け、`:root:has()` で適用する（モジュール構成『描く』の `COLOR_THEME_ATTRIBUTE`）
  - item: ページの設定のマーカー
    constraint: '文書の先頭（最初の見出し・段落・表・リスト・コードブロック・HTML のブロックより前。空の行とほかのマーカーは前にあってよい）の `<!-- page: {JSON のオブジェクト} -->` を読み込み、`scheme` を `opts.config.colorScheme`、`theme` を `opts.config.colorTheme`、`toc.mode` を `opts.config.side-toc.mode` より優先して適用する（制約「配色の切り替え」「選んだテーマ」と右側の目次の出し方）。記載できるのは `scheme`（`light`・`dark`・`auto`）・`theme`（`opts.config.colorTheme` と同じ名前）・`toc.mode`（`hover`・`fixed`）で、page のマーカーを複数記載したときと同じキーが何度も出たときは後に記載した値を使用する。記載できるキーの選べる値に無い値は使用せず、それらを並べた記載の警告を文書の先頭に 1 つ配置する。知らないキーは無視し、警告も配置しない。先頭に無い page のマーカーは使用せず、その場所に記載の警告を配置する。マーカーは本文に出さない。`update` は差し替えた本文のマーカーでもう一度決める'
    notes: '機能のオン・オフは page のマーカーに記載せず `<!-- features: {JSON のオブジェクト} -->` で記載する（確認ログ）。`render` も同じマーカーを本文に出さず、同じ記載の警告を出す'
  - item: 明暗の当て方
    constraint: page のマーカーの `scheme`、無ければ `opts.config.colorScheme` が `light`・`dark` のとき、描く先の要素に class `mdmark-theme-light`・`mdmark-theme-dark` を付ける（制約「配色の切り替え」で最も近い class として祖先の class に勝つ）。`auto` のときと、どちらも無いときは付けない。`update` でもう一度付け、`destroy` で mount が付けた class だけを削除する
  - item: カードの格子
    constraint: 機能 `card-grid` がオンの文書で、`<!-- cards -->` 〜 `<!-- /cards -->` の中身がリスト 1 つのとき、`ul.mdmark-card-grid` にして項目ごとに 1 枚のカードを描く。項目の最初のリンクがカードのリンク（`a.mdmark-card-grid-item`）とタイトル、その前の行内の `icon:名前` がアイコン（`icon` の機能と同じ要素と読み込みに class `mdmark-card-grid-icon` を追加したもの）、残りの文字が説明になる。URL をそのまま記載したリンクのタイトルはスキームを除いた URL。リンクを持たない項目は `div.mdmark-card-grid-item` にする。範囲の中のリンクはリンクと添付のカード（`cards`）にしない。中身がリスト 1 つでないときは範囲の上に記載の警告を配置し、中身を記載したとおりに描く。`card-grid` がオフのときはマーカーを出さずに中身を記載したとおりに描く
    notes: class は `.mdmark-card`（リンクと添付のカード）・`.mdmark-view-cards`（ビューのボード）と別の名前。外観はモック `docs/mock/components/card-grid/`（確認ログ）
  - item: 差分の出し方
    constraint: '`opts.diffMode` が `button` のときは制約「差分を開く UI」のとおり。`open` のときは、描いた時点で「変更表示」を押した状態（`aria-expanded="true"`・本文を隠す）にし、制約「比べる 2 つのリビジョン」のとおり取り出し元を呼んで差分の行を出す。もう一度押すと閉じ、`update` の後は開いた状態で再描画して取り出し元をもう一度呼ぶ。`blocks` のときは「変更表示」と差分の場所・ミニマップを配置せず、本文を描いた後に `revisions` を 1 回呼び、2 つ以上あれば 2 番目（前）と 1 番目（後）の `content` を 1 回ずつ呼び、制約「描いた文書のブロックの色分け」で本文を再描画する。取り出し元を待つ間・リビジョンが 1 つのとき・2 つの本文が同じときは、`opts.markdown` を色を当てずに描いた本文のまま出す。`update` のたびに取り出し元をもう一度呼び、制約「差分の待ち」と同じく古い結果は描かない'
    notes: '`blocks` は確認ログのモックへの合意（差分のプレビューは文書を色分けして出し、ボタンと選ぶ欄を持たない）。VS Code 拡張機能が `blocks` で描く'
  - item: 対応する差分の出し方
    constraint: 配布物の `dist/index.js` は `diffModes`（`readonly ["button", "open", "blocks"]`）を名前付きで公開する。利用側は、読み込んだ配布物が `diffModes` を持たないか目的の出し方を含まないとき、その出し方に対応しないバージョンと見なす
    notes: '`opts.diffMode` を知らない前のバージョンの `mount` は指定を黙って無視するため、利用側が描く前に見分けられるようにする（VS Code 拡張機能の差分に対応しないバージョンの理由）'
  - item: 型の配布
    constraint: '`opts.baseMarkdown`・`opts.onColumnsChange`・`update` の第 2 引数・`reloadComments`・`focusComment` を `dist/mount.d.ts` の `MountOptions`・`MountHandle` に入れ、`MdmarkColumnsChange` を `dist/mount.d.ts` に書き出して `dist/index.d.ts` から名前付きで公開する'
  - item: 描いた文書のブロックの色分け
    constraint: 前と後の Markdown をそれぞれ今の描き方で描き、ブロックに分ける。ブロックは、本文の直下かセクションの中身（`div.mdmark-section-body`）の直下の要素のうち `mdmark-section-body` を除くもの（見出し・段落・リスト・表・コードブロック・注意書き・埋め込んだ HTML の範囲 等）で、セクションの中身はその中のブロックに分ける。リストはいちばん外の項目（`li`）、表は `tbody` の行（`tr`）を 1 つのブロックにする。ブロックの行の範囲は `data-source-line` から次のブロックの `data-source-line` の前まで。制約「差分の計算」の行の比べで、後のブロックの範囲に空白だけでない追加した行があるか、同じ行のブロックの境目が動いた（前の 1 つのブロックの途中の行が後のブロックの開始の行になった・前のブロックの開始の行が後のブロックの途中の行になった。空行で段落を分けた・つないだ）ときは、境目が動いた後のブロックに追加の色を適用する。前のブロックで範囲の空白だけでない行が全て削除した行のものは削除の候補にし、制約「書き換えと入れ替えの見分け」で削除したブロックを決める
    notes: 確認ログの色分けの描き方（B）とリストと表の単位（A）。`sections` は既定でオンで、見出しの後ろは `mdmark-section-body` に入る（`src/render/syntax/sections.ts` の `wrapSections`）。セクションの開閉・右側の目次・アンカーは普通の描き方のまま使用する
  - item: 比較元の Markdown
    constraint: '`opts.baseMarkdown` が文字列のとき、取り出し元を呼ばずに、前を `opts.baseMarkdown`、後を `opts.markdown` として制約「描いた文書のブロックの色分け」のとおり本文を描く。`opts.diffSource` も指定したときは、本文の中の色分けに比較元を使用し、取り出し元は差分を開く UI（`opts.diffMode` が `button`・`open`）にだけ使用する。`opts.diffMode` が `blocks` のときは取り出し元の `revisions`・`content` を呼ばない。`update` で比較元を差し替えたときと、比較元のまま本文を差し替えたときは、色分けをもう一度計算する'
    notes: 取り出し元との優先はシナリオ『比較元のMarkdownを指定して変更を強調する』の決定。比較元で色を適用した本文は、制約「描く本文」の `render` の出力と同じではない
  - item: 列の表示の通知
    constraint: '列の表示・非表示の機能を持つ表のテーブル設定の目のアイコンを押したときに、表示を切り替えた後で `opts.onColumnsChange({ tableIndex, hidden })` を 1 回呼ぶ。`tableIndex` は本文の中の列の表示・非表示の機能を持つ表の出現順（削除したブロックの中の表は数えない）。`hidden` は `hidden` にした列の見出しの文字（`textContent` の前後の空白を除いたもの）を表の列の順に並べた新しい配列'
  - item: 書き換えと入れ替えの見分け
    constraint: 同じ変えた塊の中で、削除の候補と追加の色を適用した後のブロックを前から順に対にし、対のブロックの文字を単語ごとに比べる。同じ文字の数が長い方の文字の数の半分以上なら書き換えとして削除を出さず、半分未満なら入れ替えとして削除と追加の両方を出す。対にならない削除の候補は削除したブロックにする
    notes: 確認ログのモックへの合意（単語を書き換えた段落は追加だけ、別の段落に入れ替えたときは削除と追加が並ぶ）
  - item: 色を適用したブロックの要素
    constraint: 本文の直下とセクションの中身の直下のブロックは、その親の中で `div.mdmark-diff-block` で包み、リストの項目と表の行はその要素に class `mdmark-diff-block` を付ける。どちらも `data-kind`（`add` か `del`）を持ち、先頭（表の行は 1 つ目のセルの先頭）にスクリーンリーダーにだけ出す `追加:`・`削除:` と、`aria-hidden` の `+`・`−` を配置する。削除したブロックは、前の文書で直前にあった変えていないブロックと同じ親のその後ろに、同じセクションに直前のブロックが無ければ、前の文書で属していたセクションの中身の先頭（セクションに属していなければ本文の先頭）に差し込む。見出しごと削除したセクションは、見出しとセクションの中身を 1 つの削除したブロックにして同じ決まりで差し込む。リストの項目と表の行は前の文書で直前にあった項目・行の後ろ（無ければ同じリスト・表の先頭）に差し込み、後の文書にそのリスト・表が無いときはリスト・表ごと削除したブロックにする。削除したブロックの中の要素は `data-source-line` と `id` を持たず、番号付きリストの削除した項目は番号を使用しない
    notes: 外観は確認ログのモックへの合意（左の余白の + / −）。色は `--mdmark-color-diff-add-bg`・`--mdmark-color-diff-del-bg`・`--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign`。削除したブロックはスクロールを合わせる先と見出しのアンカーにしない
  - item: ファイルツリーの開閉とコピー
    constraint: '`tree` がオンのとき、`div.mdmark-tree` の上に種類 `tree` とコピーボタンの帯を配置し、子を持つフォルダの名前とアイコンを `aria-expanded`・`aria-controls` を持つボタンにする。`data-open` が数ならルートの深さを 0 として深さがその数より浅いフォルダを開き、`all` か無ければ全てのフォルダを開き、閉じたフォルダの入れ子の `ul` を `hidden="until-found"` にする。Shift を押しながらの開閉は入れ子のフォルダも同じ状態にする。コピーは `data-source` を記載し、記載できないときは表のコピーと同じパネルを出す'
  - item: 色のプリセット
    constraint: 色の名前ごとに、面の薄い色 `--mdmark-color-accent-{色}-bg` と文字の色 `--mdmark-color-accent-{色}-text` の CSS 変数を、選べるテーマのそれぞれの明るい配色と暗い配色で持つ（色の名前は インターフェース定義『文書をHTML文字列にする』の制約「色の名前」）。`data-color` を持つ強調した列のセルと行は面の薄い色、バッジは面の薄い色と文字の色、本文の文字の色の `mdmark-color` は文字の色と太字にする。強調した列の見出しのセルに下端の線、色を付けた行に上下の線を付ける。どの組も、文字と面のコントラストを 4.5:1 以上にする。印刷では選んだテーマの明るい配色の値で色を残す
    notes: 値は docs/design-policy.md。利用側は層の外でこの変数を上書きできる（制約「テーマ」）
  - item: 不透明な地
    constraint: '`--mdmark-color-bg` は描く先の要素（`.mdmark`）とまとめた HTML（`.mdmark-bundle`）の地だけに使用し、浮く部品・覆い・留める見出しの地と、地の色を混ぜた塗り・地の色の線と文字は `--mdmark-color-bg-opaque` を使用する。`--mdmark-color-bg-opaque` の既定は `var(--mdmark-color-bg)` で、`:root` と `.mdmark` で宣言する'
    notes: 利用側が `--mdmark-color-bg` を透明にして周りの面になじませるときは、`--mdmark-color-bg-opaque` に周りの面の色を指定する（#167）。`.mdmark` で宣言するのは、`.mdmark` で上書きした `--mdmark-color-bg` を受けるため。`:root` で宣言するのは、body の直下のコメントの入力欄・吹き出しと、`.mdmark` の兄弟のまとめた HTML の帯・一覧のパネルが継承するため。配色の規則（親の class・選んだテーマ・OS のダーク・印刷）は `:root` の `--mdmark-color-bg` を替えるので、`:root` の `--mdmark-color-bg-opaque` も追従する
  - item: ライトボックス
    constraint: '`lightbox` がオンのとき、`figure.mdmark-image` の中の `img` のうち `data-nolightbox` を持たないものを、`<button class="mdmark-image-open" type="button" aria-label="画像を拡大: {alt}">` と右上の拡大のアイコン（`aria-hidden`）で包む（リンクの中の画像と、文の中の画像は包まない）。押すと、`<dialog class="mdmark-lightbox" aria-label="画像の拡大">` を `showModal()` で開き、押した画像と title のキャプションを出す。切り替えの並びは同じ文書の包んだ画像を文書の順に並べたもの（今の配色で隠れている `mdmark-only-*` の画像を除く）で、帯の左に前の画像・枚数（`{何枚目} / {全ての枚数}`）・次の画像のボタン、続けて図の全画面と同じ縮小・倍率・拡大と移動のボタン、右端に閉じるボタンを配置する。画像が 1 枚のときは前後のボタンを出さない。左右の矢印キーで前後に切り替え（拡大中は切り替えず、制約「図の移動」と同じく動かす）、端では切り替えない。閉じるボタン・Esc・ダイアログの外の背景（`::backdrop`）を押すと閉じ（`closedby="any"`。持たないブラウザは `dialog` 自身を押したときに閉じる）、フォーカスを押した画像のボタンへ戻し、文書のスクロールの位置を開く前のままにする。ダイアログの中で Tab のフォーカスを循環させる。閉じたときに、開いている間に付けた受け取りを解除する'
    notes: 操作は図の全画面と統一する（#199 の D-36）。帯の並びは確認ログのモックへの合意。ライトボックスの本体を配布物から分けて使用するときだけ読み込むかはモジュール構成設計
  - item: ライトボックスの拡大・縮小・移動
    constraint: 開いたときは画像の全体がダイアログに収まる倍率（100% を超えない）で出し、制約「図の拡大・縮小」と同じ刻み・上限・キー（`+`・`-`・`0`）・倍率のボタンのスクリーンリーダー向けの名前で拡大・縮小する。画像が収まらない間だけ移動のボタンを出し、ドラッグと矢印キーで制約「図の移動」と同じだけ動かす。前後に切り替えると、収まる倍率と位置に戻す
  - item: GIF の止める・再生する
    constraint: '`gif` がオンのとき、`data-gif` を持つ `img` を `<span class="mdmark-gif">` で包み、`img.decode()` の後に最初のフレームを同じ大きさの `canvas` に描いて `img` の後ろに `hidden` で配置し、`<button class="mdmark-gif-toggle" type="button" aria-pressed="false" aria-label="GIF を停止">` を付ける。押すと、止めるときは `canvas` を出して `img` を `visibility: hidden` にし、ボタンを `aria-pressed="true"`・`aria-label="GIF を再生"` にする。再生するときは逆にする。`prefers-reduced-motion: reduce` のときは止めた状態で始める。`decode()` が失敗した GIF にはボタンを付けない。`canvas[hidden]` は `display: none` にする'
    notes: 止め方は PoC 検証の案 A（止めると最初のフレームに戻る）
  - item: 印刷の画像と動画
    constraint: 印刷では、拡大のアイコンと GIF のボタンを出さず、`mdmark-only-light` の画像を出して `mdmark-only-dark` の画像を隠す。`video` と `audio` を出さず、`mdmark-media-print` の画像とキャプションを出す。リンクと添付のカードは、リンク先の URL を文字で出す
  - item: 先頭へ戻るボタン
    constraint: '`back-to-top` がオンのとき、`el` の子の末尾に `button.mdmark-back-to-top`（`type="button"`・`aria-label` と `title` は `先頭へ戻る`・lucide の `arrow-up-to-line` のアイコン）を配置し、`update` で本文を再描画しても残す。スクロールする場所は、`el` に最も近い、`overflow-y` が `auto` か `scroll` でスクロールできる祖先の要素とし、無ければ画面全体にする。スクロールする場所の上端から `el` の上端までのスクロールの量が、スクロールする場所の高さ（`clientHeight`）未満の間はボタンを `hidden` にする。出している間は、スクロールする場所の右端と下端（スクロールバーを除き、画面からはみ出す分は画面の端）から `--mdmark-back-to-top-gap`（既定 16px）の位置に固定する。差分のミニマップの帯か余白の列（`div.mdmark-comment-margin`）とボタンの横の範囲が重なるときは、ボタンの右端をその部品の左端から 8px 左へずらす（縦の位置とスクロールの位置では動かさない）。右側の目次のパネルは、ボタンを出している間はボタンの上端より上で終わるよう高さを縮める。押すと、スクロールする場所を `el` の上端（画面全体なら `--mdmark-sticky-top` を減算した位置）へスクロールし（`prefers-reduced-motion: reduce` なら `behavior: "auto"`、ほかは `smooth`）、`div.mdmark-content`（無ければ `el`）に `tabindex="-1"` を付けて `preventScroll` でフォーカスを移す。スクロールする場所は、本文を描いた後と `update` の後にもう一度決める。画面全体なら `window` の `scroll` を、祖先の要素なら `document` の `scroll` をキャプチャーフェーズで受け（祖先の要素の外の画面や祖先の枠のスクロールでも位置が変わるため）、`window` の `resize`、`document.body` の子の追加・削除（ミニマップの帯）と `el` の子の追加・削除（余白の列）とあわせて 1 フレームに 1 回もう一度配置する。ライトボックスと図の全画面のモーダルは top layer に出るため、開いている間はボタンがその後ろに隠れて操作できない。印刷では出さない。`destroy` でボタンと受け取りを解除する'
    notes: 出し始める量・回避するときの位置・祖先の要素の扱いはモックへの合意（docs/pr/287/確認ログ.md）。ボタンの外観と状態は部品設計
  - item: 脚注の操作
    constraint: 番号のリンクにポインターを乗せたときとフォーカスしたときにツールチップを出し、用語のツールチップと同じ作法（制約「ツールチップの操作」。上へ移しても出したまま・Esc で削除してフォーカスを番号に残す・中のリンクへ Tab で移れる・画面に対して配置する・`tooltips.placement`）で開閉する。`pointerType` が `touch` のときは `pointerenter`・`pointerleave` で開閉せず、閉じた番号の `pointerdown` で開き、そのタップに続く `click` では一覧へ移らない（既定の動作も止める）。開いた番号のタップでは、番号を押したときと同じく一覧へ移る。開いている間は、ツールチップと番号の外の `pointerdown` で閉じ、番号に残る `:hover`・`:focus-within` でツールチップを出し続けない（ツールチップの中のリンクの `pointerdown` では閉じない）。番号を押すと（Enter を含む）、ツールチップを閉じて、ポインターかフォーカスが番号を離れるまでもう一度開かず、閉じた末尾の一覧を開いて該当の項目を画面の中に入れ、項目に `tabindex="-1"` を付けてからフォーカスを項目へ移す（`render` の出力は `tabindex` を持たず、sanitize の許可を広げない）。一覧の戻るリンクを押すと、参照の番号を画面の中に入れ、フォーカスを番号へ移す。どちらも URL の `#` を書き換えず、`el` の中で `id` を参照する（まとめた HTML で `#` のリンクを書き換えても、開いている文書の中で移る）。用語のツールチップと同じく、1 つのページに文書を 2 つ以上描いても重ならないよう、脚注の番号・ツールチップ・一覧の項目の `id` をモジュールの通し番号でもう一度振り、それを指す `href`・`aria-describedby`・`aria-details` も修正する。`update` でもう一度付け、`destroy` で削除する。印刷ではツールチップと戻るリンクを出さず、番号は上付きのまま出す
    notes: 要素の構造は docs/interface/IF-472-34.ts の制約『脚注』。WAI-ARIA の役割は部品設計で決める
  - item: 右側の目次の重なりと留める位置
    constraint: 右側の目次（`aside`）は、出し方と幅によらず、本文の全ての要素（表の見出し行・集計の行・ピン止めした列のセルを含む）より手前に描く。広い幅の `hover` の右端の線は、本文の上端がその位置より上へスクロールした後、文書の末尾までのどこを表示していても、スクロールする場所の上端から `--mdmark-sticky-top` と `--mdmark-space` を加算した位置に留め、高さをスクロールする場所と描く先の要素の両方に収める（描く先の要素の下端で上端を押し上げず、線を短くする）。描く先の要素の下端がその位置より上へスクロールした後は、右端の線を出さない。hover で開くパネルの上端も同じ位置にする。広い幅の `hover` でピン止めしていない間は、右端の線と hover で開くパネルの右端を、描く先の要素の幅によらず、スクロールする場所の右端（スクロールバーを除き、画面からはみ出す分は画面の端）から 1rem の位置に配置する。ページの差分のミニマップの帯（`document.body` の `.mdmark-diff-minimap`）と横の範囲が重なるときは、その左端から 8px 左へずらす。右端の線とパネルの位置は、スクロールする場所と画面の `scroll`・`window` の `resize` に加え、`document.body` の子の追加・削除（ミニマップの帯の追加と削除）でももう一度決める。ピン止めしたときは、今までどおり描く先の要素の中の右の列に配置する
    notes: '#285。スクロールする場所は、描く先の要素に最も近い縦にスクロールする祖先の要素か、無ければ画面。重なりの順を CSS 変数で持つかと、右端の線の留め方はモジュール構成設計。横の位置は #270。右端からの間隔とミニマップの避け方は先頭へ戻るボタンと同じで、モックへの合意（docs/pr/323/確認ログ.md）'
  - item: 範囲のスクリプト
    constraint: '`html-scripts` がオンのとき、描いた後に `template.mdmark-html-script` を持つ範囲を文書の順に動かす。変換のライブラリの `transform` で、`ts` は preset `typescript`・plugin `transform-modules-commonjs`・`filename` `range.ts`、`js` は plugin `transform-modules-commonjs`・`filename` `range.js` で CommonJS に変える（`export`・`build` の esbuild と同じく、`import` と全ての `export` の文を変える）。変えたコードを `module`・`exports`・`require` を受け取る関数で包み、その関数を mdmark の受け取りの関数へ範囲の通し番号で登録させるコードを、ページの `script[nonce]` の `nonce`（無ければ付けない）を付けた `script` 要素で動かす。`transform` が例外を投げたときと、要素を削除した後に登録が無いときは構文エラーとして、その範囲の前に記載の警告を配置し、要素を配置している間に受けた `window` の `error` の内容か `transform` の例外を `console.error` に出す。登録された関数を呼んで得た既定のエクスポートの関数を、範囲の根の要素（`div.mdmark-html`）を引数に 1 回呼ぶ。`require` は呼ぶと例外を投げる関数にする。関数が関数を返却したときはそれを範囲の `destroy` として持ち、`update`・`destroy`・同じ要素への 2 回目の `mount` で再描画する前に 1 回呼ぶ（例外は `console.error` に出して続ける）。書き出した HTML の起動の処理が、範囲のコードの文字ごとに関数を指定したときは、変換も `script` 要素も使用せずにその関数を呼ぶ。差分の中の範囲は動かさない'
    notes: 実行の経路は PoC 検証（#306）で成立を確認した。変換のライブラリは外部ライブラリ『@babel/standalone』
  - item: 変換のライブラリの読み込み
    constraint: 描いた後に `ts`・`js` の範囲が 1 つ以上あるときだけ、`html-scripts.url` を `import()` で読み込み、既定のエクスポート（無ければモジュール）の `disableScriptTags` を呼んでから `transform` を使用する。同じ `mount` の中では 1 回だけ読み込む。読み込み終わる前に `update`・`destroy` したときは、前の描画の範囲を動かさない。読み込みの完了は待たずに `mount` を返却する。読み込めないときは `ts`・`js` の範囲の前に通知ブロック（本文の文言は画面設計『文書』）を配置する
    decided_by: LIB-472-6#
  - item: 列の並べ替え
    constraint: '`reorder` の表は、テーブル設定の一覧のつまみのドラッグ＆ドロップと、つまみにフォーカスした↑・↓ キー（1 つずつ動かし、フォーカスをつまみに残す）で列を動かし、一覧の順に見出しと全ての本文の行・集計の行のセルをもう一度並べる。一覧は結合した見出しの範囲（`data-group`）ごと・範囲の外の列に分け、同じ範囲の中だけで動かす。`table.pin` が `each` のときは、留めているかを列が持ったまま動かし、一覧を留めた列で分けない。`through` のときは、一覧の先頭に `pin=` で留めた列を分け（`pin=` が無い表の既定の先頭の列の留めでは分けない）、同じピン止めの側の中だけで動かす。範囲の外や `through` のピン止めの境をまたぐ位置にはドロップできる位置の線を出さず、どちらの向きにも動かせない列のつまみを `disabled` にする。見出しの並べ替え・ピン止め・絞り込みのボタンでは列を動かさない。行の並べ替え・絞り込み・再結合の後も動かした列の順を保ち、コピーは今の列の順で記載する。列の順は覚えず、再描画すると Markdown に記載した順に戻す'
  - item: 列の幅
    constraint: '表を描いたときに、`render` が写した `data-long`（長文の列）・`data-width`（`width.min`・`width.max`）と `mdmark-wide` の列から、列ごとの幅を決める。判定の順・長文の列とみなす文字数・残りの幅の分け方は部品設計『表』に従う。長文でない列と `mdmark-wide` の列は折り返さず、最も長い行（見出しとセルを `<br>`・リストの項目・段落で分けた行）の幅にする。長文の列と `data-width` の列（長文の列でなくても）は折り返し、最小の幅を `data-width` の最小の幅、無ければ `opts.config.table.long_column_min` の em（最も長い行の幅の方が狭ければその幅）にし、`data-width` の最大の幅があればそれを上限にする（最小の幅も最大の幅を超えない）。全ての列の最小の幅の合計が表の見える幅を超えるときは各列を最小の幅で描いて表の中で横にスクロールさせ、収まるときは残りの幅を長文の列へ分けて本文の幅まで広げ、長文の列が無いか全て折り返さずに収まるときは列の幅の合計で描く。決めた幅は各列の見出しのセルに入れ、絞り込み・並べ替え・列の表示の切り替えでは変えず、表の見える幅が変わったとき（`ResizeObserver`）だけ、つまみで幅を指定していない列を決め直す。印刷では決めた幅を当てない。`resize` の表は、最下段の各列の見出しのセルの右端に、列の幅を変えるつまみ（`span.mdmark-col-resize`。`role="separator"`・`aria-orientation="vertical"`・`tabindex="0"`、`aria-label` が `「{列名}」の列の幅`）を配置する。つまみは、ポインターを乗せたとき・フォーカスしたとき・ドラッグ中に見出しのセルの右端に線を出し、ポインターが粗い画面（`(pointer: coarse)`）では線を常に薄く出して押せる幅を 24px にし、見出しのセルの右の余白を 24px 広げて見出しのボタンと重ねない。つまみで始めたポインターのドラッグ（マウス・タッチ。`pointerdown` で既定の動作を止めてポインターを捕まえ、並べ替え・ピン止め・絞り込みのボタンの操作にしない）と、つまみにフォーカスした ←・→ キー（1 回 16px）で、つまみの左の列の幅だけを変え、ほかの列の幅は保つ。幅は列の見出しのセルに入れ、入れた後に測った外側の幅が指定した幅と違えば差を足して入れ直す。列の最小幅は、セルの `min-width`（6em）にする。幅を指定した列は、見出しのセルのインラインの `--mdmark-column-min-width`（絞り込み・並べ替えで列の幅が変わらないよう、描いたときの幅を入れた値）を指定した幅で上書きし、幅を戻したときは描いた直後の値を入れ直す。幅は、列の最小幅から、表の見えている幅からほかに実際に留まっている列（見えている幅に収まらず留まっていない列を除く）の幅の合計を引いた幅（表がはみ出さない間は表の見えている幅）までに収める。つまみの `aria-valuenow` と `aria-valuetext`（`{幅}px`）を今の幅、`aria-valuemin` を列の最小幅、`aria-valuemax` を上限にする（px の整数。最小は切り上げ、上限は切り捨て）。つまみのダブルクリック・ダブルタップ（`pointerType` が `touch` の 2 回のタップが 300ms 以内）・Enter で列の幅の指定を解除し、描いた直後の幅（`mdmark-wide` の列は `wide=` の幅）に戻す。幅を指定した `mdmark-wide` の列は折り返す。幅を変えるたびに留めた列の `left`・`right` と境の線を計算し直す。幅を指定した後に、ピン止めの変更や描く先の要素の幅の変化で上限が小さくなっても、指定した幅は収め直さず、留めた列の幅の合計が見えている幅を超えたときは、表の操作の制約のとおり収まらない列を留めない。幅は覚えず、再描画すると Markdown に記載したとおりに戻す'
  - item: 階層の表の操作
    constraint: '`data-tree` の表は、`has-children` の行のキーのすぐ左（縦線の後ろ）に開閉のボタン（lucide の `chevron-down`。`aria-expanded`、`aria-label` が `{パス} を畳む` / `{パス} を開く`）を配置し、描いた直後は全て開く。畳むと子孫の行を `hidden` にし、開くと子だけを出して子の開閉の状態を保つ。Shift を押しながら押すと子孫の開閉も同じにする（制約「コードの折りたたみ」と同じ作法）。`mdmark-tree-name` に `tabindex="0"` を付け、ポインターを乗せるかフォーカスすると全体のパスのツールチップを出す（制約「ツールチップの操作」の作法）。名前の後ろに全体のパスを `navigator.clipboard.writeText` に書き込むコピーのボタン（`aria-label` が `全体のパスをコピー`）を配置し、書き込めたら `コピーしました`、書き込めなければ `コピーできませんでした` を 2 秒出してスクリーンリーダーで通知する（例外を外へ出さない）。行を押すとその行を `aria-selected="true"` にし、同じ親を持つ行とその子孫の、その行の階層の `mdmark-tree-guide` に class `is-active` を付ける。別の行を押すと前の選択を解き、同じ行をもう一度押すと解く。開閉・コピーのボタンでは選ばない。`data-filter` のキーの列の絞り込みは、各行の末尾の名前で照合し、該当した行とその祖先の行を残し、該当した単語の部分を `mark.mdmark-tree-hit` で囲む。件数は `is-virtual` の行を数えない。絞り込みを解くと絞り込む前の開閉の状態に戻す。畳んだ行も表のコピーと集計に含める。表のコピーはキーの列を全体のパスで記載し、補った行（`is-virtual`）を含めない'
  - item: YAML の見本の操作
    constraint: '`mdmark-tree-layout` の表の上に、見本の表示を切り替えるボタン（`aria-expanded`・`aria-controls`。文言は表示中 `見本を隠す`、隠した後 `見本を表示`）を配置し、描いた直後は見本を表示する。表の行を選ぶと、開いているタブの見本の同じ `data-path` の行に class `is-linked` を付け（無ければどの行にも付けない）、タブを切り替えるともう一度付ける。見本の `data-path` の行を押すと、表の同じパスの行を選ぶ'
  - item: まとめていないアイコンの読み込み
    constraint: '`render` が中を空にした `span.mdmark-inline-icon` の名前ごとに、`https://cdn.jsdelivr.net/npm/lucide@{まとめた lucide のバージョン}/dist/esm/icons/{名前}.mjs` を 1 回だけ `import()` し、`export default` の IconNode から `svg` を作って同じ名前の全ての場所に入れる（要素・属性は `render` の制約「アイコン」の許すものだけ）。`opts.icons` にある名前は読み込まない。`import()` が失敗した名前だけ同じ URL へ `fetch(url, { method: "HEAD" })` を送信し、404 なら例外「なし（Lucide に無いアイコンの名前）」、それ以外は例外「なし（Lucide のアイコンを読み込めない）」にする。まとめていない名前の `icon:` を持たない文書では読み込まない。`update` は読み込んだ名前を再読み込みしない'
    notes: URL と失敗の見分け方は確認ログとライブラリ選定の決定。動作は外部ライブラリ『lucide』の `verification` で確認した
  - item: wide の幅の切り替え
    constraint: '`div.mdmark-wide-range` ごとに、直前に `<div class="mdmark-wide-bar">` を配置し、本文の幅の右端に `<button class="mdmark-wide-toggle" type="button" aria-label="広げて表示" aria-pressed="{広げていれば true}">` を配置する。ボタンはラベルを持たず、広げた状態では縮めるアイコン、本文の幅では広げるアイコンを出す（スクリーンリーダー向けの名前はどちらも `広げて表示`）。押すたびに範囲の `data-state` を `wide` と `narrow` で入れ替え、`aria-pressed` を合わせる。広げた幅と本文の幅が同じになる幅（広げられる幅が本文の幅以下）では帯を出さない。広げられる幅は、右側の目次を付けたときは描く先の要素の幅、付けないときは描く先の要素の親の幅（描く先の要素は `--mdmark-content-width` で本文の幅になるため）で、どちらも画面の幅までにし、右側の目次（`fixed`）とまとめた HTML の文書の一覧の列の内側に収め、広い幅の `hover` でピン止めしていない間は、範囲の右端を右端の線の左（スクロールする場所の右端から、制約「右側の目次の重なりと留める位置」の 1rem と線の幅と `--mdmark-space` を加算した位置）までに収め、本文の列の中央にそろえる。印刷の前は用紙の幅を越えない。切り替えた状態は `update` で再描画するとマーカーの状態に戻る'
    notes: 'アイコンは両端の縦線へ向かう横向きの矢印（広げるは `|←→|`、縮めるは `→|←`。確認ログ）で、Lucide に無い構造のため部品設計とモジュール構成で配置場所を決める。`hover` で開くパネル（枠）はポインターを配置した間だけ wide の範囲に重ねて出す。右端の線の位置は #323'
  - item: CSV の表と元の CSV の切り替え
    constraint: '`data-source="csv"` を持つ表の帯の右端に、`<button class="mdmark-raw-toggle" type="button" aria-label="元の CSV を表示" aria-pressed="false">`（コードのアイコン `code-xml`）を配置する。押すと表を隠して `pre.mdmark-raw` を出し、`aria-pressed` を `true` にする。もう一度押すと表に戻す。並べ替え・絞り込み・ピン止めの状態は切り替えで変えない。元の CSV のコードブロックにはコピーのボタンを付けない。押していない状態は控えめな色、押した状態は色のプリセットの青のアイコンと薄い青の面で出す'
    notes: 外観は確認ログの案 C。モック `docs/mock/components/csv-table/`
  - item: コードブロックとファイルツリーの折り返し
    constraint: '配布物の CSS は、コードブロック（`.mdmark-code` の中の `pre`）とファイルツリーのリストを既定で折り返さず（`white-space` が `pre`・`nowrap`）、枠の中で横にスクロールさせる。この既定は mdmark の層の外に `.mdmark .mdmark-code pre` 以上の詳細度で配置し、利用側の要素名だけ・クラス 1 つの `pre` への汎用の CSS（`white-space: pre-wrap` など）で変えない。`mdmark-code-wrap` の `pre` は行を枠の幅で折り返し、行番号と行頭の `+`・`-` は折り返した行の 1 行目にだけ出し、インデントの縦線と折りたたみのボタンをずらさない。コピーの文字に折り返しの改行を入れない。`mdmark-tree-wrap` のツリーは、長い名前をアイコンの右の名前の列の中で折り返し、注釈は名前の下の行に名前の頭から出す。罫線と入れ子の位置は `wrap` の無いツリーと同じにする'
    decided_by: SC-472-25#scenarios[正常シナリオ（利用側の pre への汎用の CSS）]
    notes: 優先のさせ方は確認ログの決定（層の外に詳細度の高いセレクタ、推奨案 A）。外観はモック `docs/mock/refs/328/assets/wrap.css`
  - item: 図の高さのリサイズハンドル
    constraint: '`diagram-resize` がオンのとき、文書の中の図の部品（埋め込んだ HTML の中のチャートを含む）の表示する枠の右下に、`role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"`・スクリーンリーダー向けの名前 `「{図の題名}」の表示の高さ` と、`aria-valuenow`・`aria-valuemin`・`aria-valuemax`（表示する枠の高さの px）を持つリサイズハンドルを配置する。ドラッグした分だけ表示する枠の高さを変え（幅は変えない）、フォーカスの間は `↑` で 32px 低く、`↓` で 32px 高くする。高さは 120px 以上、図の全体が今の倍率で収まる高さ以下にする。高さを変えたら今の倍率と位置は保ち、全体が収まる倍率（下限と倍率のボタンの戻し先）をもう一度求める。文書の中の図のこの倍率は、高さを変える前は幅だけ、変えた後は幅と変えた高さで決める。ダブルクリックで定義と `--mdmark-diagram-max-height` から決まる高さに戻す。変えた高さを図ごとのキーで sessionStorage に記載し、描くときに読み込んでその高さで開き、戻したらキーを削除する。sessionStorage を使用できないときは例外を外へ出さず、高さを保たない。全画面のモーダルの中と印刷では出さない。`update` でもう一度付け、`destroy` で受け取りを解除する'
    notes: '上限は #198 の修正（今の倍率の図の高さ）のまま。図ごとのキーの決め方はモジュール構成設計。1 回の量と下限はモックの値'
  - item: ブロックの間隔
    constraint: 本文の直下・セクションの中身（`.mdmark-section-body`）・タブの中身（`.mdmark-tab-panel`）のブロック同士の縦の間を `--mdmark-space`、リストの項目・引用・`details`・行の詳細（`.mdmark-row-detail > td`）の中のブロック同士の間を `calc(var(--mdmark-space) / 2)` にする。後のブロックがコードブロック（`.mdmark-code`）・ファイルツリー（`.mdmark-tree`）・記法の部品のときも同じ間を空ける。見出しは上の余白に、区切り線は上下の余白に、自分の規則の値を使用する。先頭のブロックの上には間を空けない
    notes: '#326'
  - item: mermaid の対象
    constraint: 機能 `mermaid` がオンの文書で、`render` が属性 `data-mdmark-mermaid` を付けた mermaid のコードブロック（文書をHTML文字列にする.ts の制約『mermaid のコードブロック』）
    notes: 文書に記載した生の HTML のこの属性は sanitize が落とす
  - item: mermaid の読み込み
    constraint: 描いた後に mermaid の対象が 1 つ以上あるときだけ、`mermaid.url` を `import()` で読み込み、既定のエクスポートの `initialize`・`render` を使用する。同じ `mount` の中では 1 回だけ読み込む。読み込んで描き終えるまで、各対象を隠し、その場所に読み込み中のブロック（部品設計『読み込み中のブロック』の名前 `mermaid`）を配置する。読み込み終わる前に `update`・`destroy` したときは、前の描画の対象を図にしない。読み込みの完了は待たずに `mount` を返却する。書き出した HTML の起動の処理が、まとめた mermaid のモジュールを指定したときは URL を読み込まない
    notes: 配布物 `dist/index.js` に mermaid をまとめない（非機能要件『配布ファイル 1 つのサイズ』）
  - item: mermaid の描き方
    constraint: '`initialize` には `startOnLoad: false`・`securityLevel: "strict"`・`theme`・`themeVariables` を指定し、利用側の設定でこの 2 つ（`startOnLoad`・`securityLevel`）を変えさせない。対象を文書の順に `render` し、返った SVG を図の枠（部品設計『図の枠』の種類 `mermaid`）の表示する枠に入れて、対象のコードブロックと置き換える。図の枠のタイトルは front matter の `title`、無ければ `accTitle`、どちらも無ければ図の種類の名前（`flowchart`・`graph` → フローチャート／`sequenceDiagram` → シーケンス図／`classDiagram` → クラス図／`stateDiagram`・`stateDiagram-v2` → 状態遷移図／`erDiagram` → ER 図／`gantt` → ガントチャート／`pie` → 円グラフ／ほか → 図）にし、front matter の `title` は図の中に重ねて描かない。範囲・更新日は出さない。シーケンス図の `actor` は lucide の人のアイコンに替え、本文の色の線で描く。開いたときの倍率は全体が収まる倍率で、0.75 より小さくしない（収まらない分は枠の中で動かす）。ガントチャートは描く先の幅と 720px の大きいほうの幅で描く'
    notes: 外観はモック `docs/mock/components/mermaid-diagram/`（確認ログ）。倍率の下限とガントチャートの幅はモックで描いて決めた
  - item: mermaid のテーマ
    constraint: '`theme` が `mdmark` のとき、描く先の要素の計算済みの CSS 変数（色は試しの要素の `color` で解決して sRGB の hex。`rgb()`・`rgba()` は値を読み込み、ほかの記載方法は canvas で変換する）から mermaid の `base` テーマの変数を作る。対応はモジュール構成で表にする。どのテーマでも `useGradient: false`・`dropShadow: "none"` にし、SVG の filter の影も削除する。描く先の配色の明暗（`colorScheme`・page のマーカー・祖先の class・OS の設定）が変わったら、変わった後の値で再描画する。印刷では明るい配色の図を出す。暗い配色で描くときは、明るい配色の CSS 変数（同じタスクの中で描く先の要素の明暗の class を一時的に `mdmark-theme-light` に替えて解決し、元に戻す。配色の値は描く先の明暗の class から `:root` に該当するため、描く先の中の要素の class では変わらない）から作ったテーマでも先に `render` し、2 つの SVG を表示する枠に並べて、画面では今の配色の SVG、`@media print` では明るい配色の SVG だけを出す。明るい配色で描くときは SVG を 1 つだけ配置する（制約「配色の切り替え」の印刷で明るい配色にするのと統一する。`render` は非同期で、`beforeprint` の中で再描画しても印刷のレイアウトに間に合わないため、印刷のきっかけを待たない）'
    notes: PoC #384 で、`color-mix()` を含む CSS 変数を hex にして `base` テーマへ指定できることを確認した。デザイン方針の「使用しないもの」（影・グラデーション）
  - item: mermaid を読み込めないとき
    constraint: mermaid を読み込めないときは、各 mermaid の対象の読み込み中のブロックを通知ブロック（本文の文言は画面設計『文書』）に替え、コードブロックを出して残す。解釈できないソースは読み込み中のブロックを記載の警告に替え、コードブロックを出して残す
  - item: フロントマター
    constraint: インターフェース定義『文書をHTML文字列にする』の制約「フロントマター」と同じく、文書の先頭のフロントマターを除外して描き、機能 `frontmatter` がオンのときだけ本文の先頭に閉じた折りたたみを描く。右側の目次・目次・セクションの開閉はフロントマターとその表示を対象にしない。折りたたみの開閉は、印刷の前に開く折り畳みに含める。`update` は差し替えた本文のフロントマターでもう一度決める
  - item: map の図
    constraint: '`div.mdmark-map`（文書をHTML文字列にする.ts の制約『map の範囲』）を、`flowchart` は入れ子のグループを内側から自動配置したフロー図、`sequenceDiagram` は全ての記法を描いたシーケンス図にして、`figure.mdmark-diagram[data-diagram="map"]` の図の枠に入れる。図の枠は置き場所の幅いっぱい（右側の目次をピン止めしていないときは右端の線の手前、ピン止めしたときはパネルの手前）に広げ、本文の幅との切り替えのボタン、凡例、範囲と更新日を出さない。倍率は 1 より小さくしない。ノードの大きさは描いた中身を測って決め、大きさが変わったら配置し直す'
    notes: 外観はモック `docs/mock/pages/document/445/a-map/` と `docs/mock/components/map-kinds/`（確認ログ）。配置の方式はライブラリ本体.md の `## PoC 結果`
  - item: map の強調
    constraint: 線のホバー・案内・再生・ノードと参加者の選択では、強調する要素の表示は変えず、ほかのノード・線・ラベル・ライフラインを `opacity` 0.25 にし、強調する線の上をデータの印が流れ続ける（両向きの線は両方へ）。選択の強調は案内・再生の強調より優先する。読者が始めたデータの印は `prefers-reduced-motion` でも流し、自動で始める再生は動きを減らす設定では止めて始める
  - item: map の状態の保存
    constraint: 開閉・中へ入ったグループ・動かしたノードとグループの位置・動かした線の区間・参加者の並び順は、図ごとの sessionStorage のキーに保ち、文書には書き戻さない。中へ入ったグループと中だけを描くブロックは、`map.url_state` が `false` でなければクエリ文字列の `map-{図の番号}` にも `history.replaceState` で書き（履歴を増やさない）、開いたときはクエリ文字列 → sessionStorage の順に読む。知らない ID・番号は無視する
    notes: まとめた HTML で文書を切り替えたときに `map-*` を消すのは、複数の文書を1枚のHTMLにまとめる.ts
  - item: map の操作の分け方
    constraint: 構成図のノードは名前の文字の外を押して選び、ドラッグで動かす（4px 未満は押した扱い）。グループはタイトルの行（上端から 36px。ボタンの外）のドラッグで動かし、グループの面と余白のドラッグは図の枠の中をスクロールする。線は 4px 未満で離すと両端の選択、4px 以上で区間の移動。シーケンス図の参加者は名前の文字の外を押して選び、ドラッグで並べ替える。名前の文字は選んでコピーでき、種類の行の文字は選べない。選択・移動・開閉・中へ入る・案内と再生はキーボードでも操作できる
    notes: キーは部品設計。確認ログ『map の構成図のグループをつかむ場所』
  - item: map の印の引数
    constraint: 印の引数は shuhei1101/mdmark#451 の資料 A-128 の構成の JSON のオブジェクトで、`title`（図の枠と折りたたみの見出し）・`focus`（最初に入るグループの ID）・`play`（`"autoplay"` で、図が画面に入ったら押さずに再生か案内を始める。動きを減らす設定では始めず止めた帯で出す）・`interval`（自動で進める間隔の秒。正の数。省くと 2）・`collapse`（A-128 の共通の折り畳み。`open`・`title`）だけを読む。知らないキーは無視し、型の合わない値は既定にする（どちらも点検が通知する。型の合わない値は書き方の警告にもする）。最初に入るグループは、クエリ文字列の `map-{図の番号}` → sessionStorage → `focus` の順で決める（無いグループの ID は飛ばす）
    notes: 記載の警告は文書をHTML文字列にする.ts の制約『map の書き方の誤り』
  - item: map の書き方の警告
    constraint: Mermaid の読めない行（行番号・行の文字・直し方）・閉じの無い `subgraph` と複合フラグメント・補足の JSON の読めない箇所（行と原因）・知らないキー・スキーマに合わない値・補足が指す Mermaid に無いノード・線・グループの ID・`--` を含む補足の文字・設定の `map.kinds` に無いクラス・`map.lines` に無い線の名前を、`dist/map.js` が集めて図の枠の前の書き方の警告にする。`render` が範囲の形の警告を配置していれば、その警告に項目を足す
    notes: '`render` が確かめる範囲の形は文書をHTML文字列にする.ts の制約『map の書き方の誤り』'
  - item: map の用語の下線
    constraint: 文書をHTML文字列にする.ts の制約『map の範囲』の `data-map-terms` の用語を、構成図のノードの名前と、シーケンス図の参加者の名前・メッセージの文・注記の文の中で見つけ、今の図のノードの用語と同じく `span.mdmark-term`（フォーカスでき、図のツールチップに意味を出す）にする。用語の文字は、文字を逃がした名前の中に置き、名前の文字の選択とコピーを妨げない。構成図のツールチップ（ノード・線・グループの補足の `notes` の説明）の文の中の用語は、フォーカスを持たない下線（`tabindex` とツールチップの持ち主を持たない `span.mdmark-term`）にし、そのツールチップの末尾に用語ごとに「{用語}：{意味}」の行を並べる。押せる要素の中の文字（グループのタイトルのボタン・ツールチップを持つ線のラベル）と、案内と再生の帯の文には付けない（今の図と同じく、押せる要素とツールチップの中に、フォーカスできる用語を入れ子にしない）。同じ図の構成図のノードの説明（補足の `notes`）のツールチップも、図の枠のツールチップの層に配置する
  - item: map のノードのリンク
    constraint: '構成図の Mermaid の `click {ID} "{リンク先}"` の行（`href` を省いた形と、`"{リンク先}" "{ツールチップ}"`・`_blank` などの後ろの値は読んで捨てる）を、そのノードのリンク先にする。リンク先を文書をHTML文字列にする.ts の制約「URL のスキーム」と同じ許可（`http`・`https`・`mailto` と相対 URL）で確認し、許すノードはノードの全体を覆う `<a class="mdmark-diagram-node-link" href="{リンク先}">`（スクリーンリーダー向けの名前はノードの名前。開く先は本文のリンクと同じく同じタブ）にし、ノードの要素に class `has-link` を付ける。説明のマーカーはリンクの中に入れず、リンクの後ろに配置する。許さないリンク先のノードはリンクにせず名前を描き、ノードの ID と記載したリンク先と使用できるリンク先を制約「map の書き方の警告」の項目に並べる。リンク先を持つノードの上で押したまま 4px を超えて動かしたときはノードを動かし、制約「図の移動」と同じくその後の `click` を止める。コールバックの関数を指す `click {ID} {関数名}` の形は読んで捨てる'
    decided_by: SC-472-8#scenarios[正常シナリオ（リンク先を持つノード）]
    notes: '`id:` などの参照は利用側が URL に変えてから記載する。確認ログ『map のノードのリンクをこの PR の要件に追加するか』'
  - item: map のグループの説明
    constraint: 補足の `notes` のキーが構成図の `subgraph` の ID のとき、そのグループのタイトルの右に、ノードの説明と同じマーカー（フォーカスでき、`aria-describedby` で説明のツールチップを指す）を配置し、ポインターを乗せるかフォーカスしたときに説明を図のツールチップで出す。閉じたグループのノードと、中へ入ったグループの押せないタイトルにも同じマーカーを配置する。マーカーはタイトルのボタンの外に置き、押してもグループの中へ入らない・開閉しない
    decided_by: SC-472-40#scenarios[正常シナリオ]
    notes: 確認ログ『map のグループの説明をこの PR の要件に追加するか』。マーカーの外観は部品設計『mapの構成図』
  - item: map のシーケンス図の説明のツールチップ
    constraint: シーケンス図の補足の `notes`（キーは記載の順に 1 からのメッセージの番号）に説明があるメッセージは、線の押せる帯（`.map-wire-hit[data-message]`）を持ち主にした図のツールチップを持ち、線にポインターを当てると「{送り手の名前} → {受け手の名前}」の見出しと説明を出す。説明の文の中の用語は、構成図の説明のツールチップと同じく、フォーカスを持たない下線と末尾の「{用語}：{意味}」の行にする。説明を持たないメッセージの線にはツールチップを付けない
  - item: map の閉じたグループのノードの数
    constraint: 閉じたグループのノードは、グループの名前の後ろに、そのグループの中（入れ子のグループの中を含む）の Mermaid のノードの数を「ノード {数} 件」で出す（シーケンス図の閉じたブロックの「メッセージ {数} 件」と同じ書き方）
  - item: map の構成図に無い再生の相手
    constraint: 補足の `plays_over` で構成図を指すシーケンス図に、その構成図のノードに無い ID の参加者があるとき、シーケンス図の図の枠の前の書き方の警告に、構成図に無い参加者の ID を並べた項目を 1 つ足す。その参加者が送り手か受け手のメッセージを再生するときは、構成図の強調を解き、構成図の図の枠の中をスクロールしない。帯はほかのメッセージと同じく出す
  - item: map の再生で構成図の枠の中をスクロールする
    constraint: シーケンス図の再生を自動で進めている間は、補足の `plays_over` で指した構成図の図の枠の中も、送り手と受け手のノードの中心へスクロールする（倍率と文書のスクロールは変えない）。読者が構成図の図の枠をホイール・ドラッグ・キーで触ったら、自動で進め直すまで構成図の図の枠の中をスクロールしない。前へ・次へで進めたときはスクロールしない
    notes: 確認ログ『map の案内・再生で図の枠の中をスクロールする場合』
