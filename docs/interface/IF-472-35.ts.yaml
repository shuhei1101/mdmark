  - name: 正常系（map の設定に無いクラスと線の名前）
    summary: '`map.kinds` に無い Mermaid のクラスと、`map.lines` に無い補足の `line` の名前を、図の前の書き方の警告にし、種類の行の無いノード・既定の線で描く'
    setup:
