  - name: 正常系（図の高さを変える）
    summary: 下端のリサイズハンドルのドラッグと上下キーで表示する枠の高さを変え、全体が収まる倍率をもう一度求め、変えた高さを sessionStorage に保ち、ダブルクリックで戻す
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ。描く先の `div` の幅は 600px
      - name: 縦に長い図を持つ Markdown
        description: テーブル 8 つを縦に並べ、描くと幅が 600px より狭く高さが 1600px を超える ER 図の定義を `<!-- er -->` 〜 `<!-- /er -->` に配置した文書
        notes: 描いたとき、表示する枠の高さは `--mdmark-diagram-max-height` で切られ、倍率は幅だけで決まる（幅が描く先より狭いため 1）
      - name: Mock
        description: 差し替える依存は無い。sessionStorage は描く前に空にする。ページの再読み込みは、同じ要素へ `destroy` の後に もう一度 `mount` することで代える
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 下端にリサイズハンドルを配置して図を描く
        P->>M: リサイズハンドルを 200px 下へドラッグする
        M->>P: 表示する枠を高くし、全体が収まる倍率をもう一度求める
        P->>M: 0 を押す
        M->>P: 変えた高さで全体が収まる倍率に戻す
        P->>M: リサイズハンドルにフォーカスして ↑ を押す
        M->>P: 表示する枠を 32px 低くする
        P->>M: destroy() の後に mount(el, { markdown })
        M->>P: 変えた高さで図を描く
        P->>M: リサイズハンドルをダブルクリックする
        M->>P: 倍率を変えずに、今の倍率の図の全体が収まる高さにする
        P->>M: 全画面のボタンを押す
        M->>P: リサイズハンドルの無い全画面を開く
    expected:
      - リサイズハンドルが `role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"`・スクリーンリーダー向けの名前を持ち、`aria-valuenow` が表示する枠の高さ
      - 200px のドラッグの後、表示する枠の高さが 200 増え、幅と倍率が変わらず、`aria-valuenow` が新しい高さ
      - '`0` の後の倍率が「表示する枠の幅 ÷ 図の幅」「表示する枠の高さ ÷ 図の高さ」、1 の最小で、図の全体が表示する枠に収まる'
      - '`↑` の後に表示する枠の高さが 32 減り、`↓` の後に 32 増える。高さは図の全体が今の倍率で収まる高さを超えない'
      - もう一度 mount した後、表示する枠の高さが変えた高さ
      - ダブルクリックの後、倍率が変わらず、表示する枠の中の高さが図の高さ × 今の倍率（図の全体が収まる高さ）で、もう一度 mount しても同じ
      - 全画面のモーダルの中にリサイズハンドルが無い
    test: test_normal_when_diagram_resized
