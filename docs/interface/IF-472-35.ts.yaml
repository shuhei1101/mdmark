        M->>P: 2 つのタブを短文へ切り替え、押したボタンの位置の差だけスクロール位置を戻す
        P->>M: 末尾のタブのボタンが上端から 400px の位置でスクロールを止め、短文を押す
        M->>P: 短文へ切り替え、スクロール位置を上限まで戻す
        P->>M: 末尾のタブの長文を押す
        M->>P: 長文へ切り替え、押したボタンの位置を保つ
    expected:
