        description: 差し替える依存は無い。タップは、単語に `pointerType` が `touch` の `pointerenter`・`pointerdown`・`pointerup`・`pointerleave` をこの順に発火し、単語の `focus()` を呼んで発生させる（既にフォーカスを持つ単語へのタップでは `focus` は発火しない）
        notes: iOS の Safari のタップの後に `:hover` が残る状態を、外のタップで `pointerleave`・`blur` を発火させず、`pointerdown` だけを発火して発生させる
    flow: |-
      sequenceDiagram
