      - 入れ子のグループが外のグループの中にあり、どの 2 つのノード・グループも重ならず、線が端点とその祖先以外の矩形を横切らない。同じグループの同じ列に並ぶ 3 つのノードから出る 3 本の線は、同じ向きの区間が同じ直線の上で重ならない
      - クラスのノードの種類の行に設定のアイコンと `label` があり、形・色が設定のとおりで、種類を書かないノードにも高さ 24px の空の種類の行がある。凡例が無い
