    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config })
        M->>M: dist/map.js で Mermaid と補足を読み、書き方の誤りを集める
        M-->>U: 書き方の警告と、読めた部分の map の図
    expected:
      - 図の枠の前に書き方の警告（`div.mdmark-syntax-warning`）が 1 つあり、読めない行の行番号と行の文字・`->` を `-->` にする直し方・閉じの無い `subgraph` の名前・知らないキー `layuot` と使用できるキーの一覧が並び、`mdoe` は並ばない
      - 読めた部分のノードと線で図が描かれる
      - '`render` の書き方の警告がある範囲では、その警告に項目を足し、警告を 2 つにしない'
    test: test_normal_when_map_warnings
  - name: 正常系（map の用語の下線）
    summary: map の構成図のノードの名前と、シーケンス図の参加者の名前・メッセージの文に、索引の用語の下線とツールチップを付ける
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 用語を持つ map の Markdown
        description: 構成図のノード `data` の名前が「補足の検査」で、補足の `notes` でノード `layout` に説明を持ち、シーケンス図のメッセージの文の 1 つが「補足を読む」の文書。`opts.index` に意味を持つ用語 `補足` を持つ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config, index })
        M->>M: map の範囲の用語を data-map-terms に入れる
        M-->>U: ノードの名前とメッセージの文の用語に下線を付けた map の図
    expected:
      - 構成図のノード `data` の名前の要素の中に `span.mdmark-term` が 1 つあり、文字が `補足` で、その前の文字と後ろの文字（`の検査`）が名前に残る
      - 用語にフォーカスすると、図の枠のツールチップに用語の意味が出る
      - シーケンス図の「補足を読む」のラベルの中に `span.mdmark-term` がある
      - ノード `layout` の右上のマーカーにフォーカスすると、図の枠のツールチップに説明が出る
      - グループのタイトルのボタンの中に `span.mdmark-term` が無い
      - ノード `layout` の説明に用語 `補足` を含むとき、説明のツールチップの中の `補足` が `tabindex` を持たない `span.mdmark-term` で、ツールチップの末尾に「補足：{意味}」の行がある
      - シーケンス図の 2 つ目のメッセージに補足の `notes` で説明「補足を渡す」を持つとき、その線の押せる帯にポインターを当てると、図の枠のツールチップに説明が出て、中の `補足` が `tabindex` を持たない `span.mdmark-term` で、末尾に「補足：{意味}」の行がある。説明を持たないメッセージの線の押せる帯はツールチップの持ち主でない
      - 「記法の読み取り」を閉じると、閉じたグループのノードに「ノード 3 件」が出る
      - 'シーケンス図に `plays_over: 1` と構成図に無い参加者 `ghost` を足すと、シーケンス図の前の書き方の警告に `ghost` が出て、`ghost` のメッセージを再生すると構成図に `map-dim` が無い'
    test: test_normal_when_map_terms
  - name: 正常系（描き直してもセクションの開閉を保つ）
    summary: 読者が開閉したセクションを、`update` の後も同じ開閉で描き、マーカーを変えたセクションと新しいセクションはマーカーのとおりに描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
        notes: URL は `#注意` を付けて開く
      - name: 開いたセクションと閉じたセクションを持つ Markdown
        description: '`## 概要` と段落、直後に `<!-- section: {"open": false} -->` を持つ `## 補足` と段落と `### 注意` と段落、`## 参考` と段落を持つ文書'
      - name: 描き直す Markdown
        description: '段落の文字を書き換え、`## 参考` の直後に `<!-- section: {"open": false} -->` を追加し、末尾に `## 付録` と段落を追加した文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: #注意 を囲む補足を開いて描く
        P->>M: 概要の開閉を押す
        M->>P: 概要を閉じる
        P->>M: 補足の開閉を押す
        M->>P: 補足を閉じる
        P->>M: 参考の開閉を 2 回押す
        M->>P: 参考を開いたままにする
        P->>M: update(描き直す Markdown)
        M->>P: 覚えた開閉で概要と補足を閉じ、参考と付録はマーカーのとおりに描く
    expected:
      - '`update` の後、`概要` と `補足` の中身が `hidden="until-found"` を持ち、開閉のボタンの `aria-expanded` が `false`'
      - '`update` の後、URL が `#注意` のままでも `補足` は閉じたまま'
      - '`update` の後、マーカーを追加した `参考` の中身が `hidden="until-found"` を持ち、追加した `付録` の中身は `hidden` を持たない'
      - もう一度 `mount` した後、`概要` は開き、`補足` は `#注意` で開いている
    test: test_normal_when_sections_kept_on_update
  - name: 正常系（描き直しても部品の開閉を保つ）
    summary: 読者が開閉した行の詳細・details の範囲・注意書き・ER 図の列・ファイルツリー・コードの折りたたみ・階層の表を、`update` の後も同じ開閉で描き、マーカーを変えた要素と新しい要素はマーカーのとおりに描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 開閉する部品を持つ Markdown
        description: '行の詳細を 2 行目に持つ表、`<!-- details: {"title": "手順"} -->` と `<!-- details: {"title": "注意"} -->` の範囲、`> [!NOTE]+ 詳細` の注意書き、列 12 個のテーブル `orders` の ER 図、`app/` の下に `src/`・`docs/` を持つファイルツリー、`<!-- code: {"fold": [2]} -->` の後ろの 2 行目と 6 行目が畳める言語 `yaml` のコードブロック、キーの列を階層で描く表（`aliases[]` が子を持つ）を持つ文書'
      - name: 描き直す Markdown
        description: '各部品の中の文字を書き換え、`注意` の範囲のマーカーに `"open": true` を加え、末尾に `<!-- details: {"title": "付録"} -->` の範囲を追加した文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: マーカーのとおりの開閉で描く
        P->>M: 行の詳細・手順・詳細・orders の列・src/・コードの 2 行目と 6 行目・aliases[] の開閉を押し、注意を 2 回押す
        M->>P: 押した部品の開閉を変える
        P->>M: update(描き直す Markdown)
        M->>P: 覚えた開閉で描き、マーカーを変えた注意と追加した付録はマーカーのとおりに描く
    expected:
      - '`update` の後、2 行目の行の詳細が出ていて、開閉のボタンの `aria-expanded` が `true`'
      - '`update` の後、`手順` の `details` が `open` を持ち、`詳細` の注意書きの `details` が `open` を持たない'
      - '`update` の後、`orders` の列の行が主キーと外部キーの 2 つと `非表示 10 列` の行で、`src/` の開閉のボタンの `aria-expanded` が `false`'
      - '`update` の後、コードブロックの 2 行目の開閉のボタンの `aria-expanded` が `true`、6 行目が `false`'
      - '`update` の後、`aliases[]` の子孫の行が `hidden` を持つ'
      - '`update` の後、マーカーを変えた `注意` の `details` が `open` を持ち、追加した `付録` の `details` が `open` を持たない'
      - もう一度 `mount` した後、全ての部品がマーカーのとおりの開閉で描かれる
    test: test_normal_when_parts_kept_on_update
  - name: 正常系（高さの違うタブへ切り替えても見出しの位置を保つ）
    summary: 読者がタブを選ぶと、押したタブのボタンの画面の位置が変わらないようにスクロール位置を戻し、戻しきれないときは上限まで戻す
    setup:
