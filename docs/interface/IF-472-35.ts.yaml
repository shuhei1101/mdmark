        M->>P: 出したままにする
        P->>M: 脚注を含まない段落に pointerdown だけを発火する
        M->>P: ツールチップを削除する
        P->>M: 番号 1 をタップする
        M->>P: 脚注 1 のツールチップを出す
        P->>M: 開いた番号 1 をタップする
