  - name: 正常系（map の書き方の警告を描く）
    summary: Mermaid の読めない行・閉じの無い `subgraph`・補足の知らないキーを、図の前の書き方の警告にし、読めた部分を図にする
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ
      - name: 書き方を誤った map の Markdown
        description: 文書をHTML文字列にする.ts の正常系（map の書き方の誤り）の 1 つ目の範囲（矢印を `->` と書いた行と `subgraph` の閉じの無い mermaid のブロック、補足に知らないキー `layuot`、印に知らないキー `mdoe`）を持つ文書
      - name: Mock
