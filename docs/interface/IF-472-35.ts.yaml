idempotent: false
side_effects: '条件ごとの副作用は次のとおり。


  <!-- table: {"kind": "data"} -->


  | 条件 | 副作用 |

  | --- | --- |

  | 常に | `el` の中身と class を書き換え、記法の操作のイベントを `el` の中に付ける。`window` の `beforeprint`・`afterprint`・`hashchange` を受け取る |

  | まとめていない名前の `icon:` があるとき | jsDelivr の Lucide のアイコンのモジュールを名前ごとに `import()` し、読み込めなかった名前だけ同じ URL へ `HEAD` の `fetch` を送信する |

  | `side-toc` がオンで見出しがあるとき | `el` の中を本文の列と右側の目次に分け、見出しの位置を `IntersectionObserver` で確認する。出し方が `hover` のときは、右端の線とパネルの位置を決めるため、`window` の `scroll`・`resize` と、`el` に最も近いスクロールする祖先の要素があればその `scroll` を受け取り、`document.body` の子の追加・削除を `MutationObserver` で確認する |

  | `back-to-top` がオンのとき | `el` の子に先頭へ戻るボタンを配置し、スクロールする場所が画面全体なら `window` の `scroll`、`el` に最も近いスクロールする祖先の要素なら `document` の `scroll`（キャプチャーフェーズ）と、`window` の `resize` を受け取り、`document.body` と `el` の子の追加・削除を `MutationObserver` で確認する |

  | 絞り込みのドロワーを開いている間 | `document` の `pointerdown`・`keydown` を受け取る |

  | 図の部品か埋め込んだ HTML があるとき | 図の表示する枠と埋め込んだ HTML の大きさを `ResizeObserver` で見、ツールチップを開いている間だけ `document` の `keydown`・`pointerdown` と `window` の `scroll`・`resize` を受け取り、全画面の間だけ `el` の中に `dialog` を配置する |

  | map の構成図のリンク先を持つノードを動かしたとき | 次の 1 回の `click` まで `window` の `click`（キャプチャーフェーズ）を受け取る |

  | `diagram-resize` がオンのとき | リサイズハンドルで変えた図の高さを sessionStorage に書き込み、描くたびに読み込む（ダブルクリックで今の倍率の図の全体が収まる高さを書き込む） |

  | 操作できる部品の写すボタン・表のコピー・行の URL のコピー・コードブロックのコピー・ファイルツリーのコピーを押したとき | クリップボードに書き込む |

  | 表があるとき | 表の大きさと描く先の要素の幅を `ResizeObserver` で見、`animation-timeline` を持たないブラウザでは `window` と文書の中の `scroll` と `window` の `resize` を受け取る |

  | `data-group` を持つタブがあるとき | localStorage の `mdmark-tabs:{group}` を描くたびに読み込み、読者がタブを選ぶと書き込む |

  | 読者がタブを選んだとき | 押したタブのボタンの画面の位置を保つようにスクロールする場所のスクロール位置を書き換え、ページの中の `el` の外にある同じ `group` のタブ群の選択も書き換える |

  | 文書に外部ライブラリか拡張のマーカーがあるとき | そのモジュールを読み込む |

  | 色分けの対象のコードブロックがあるとき | `syntax.url` の先の core と、使用する言語のモジュールを読み込む |

  | `mermaid` がオンの文書に mermaid のコードブロックがあるとき | `mermaid.url` の先のモジュールを読み込み、描く先の配色の明暗の変化を確認して再描画する |

  | `html-scripts` がオンの文書に範囲の `ts`・`js` があるとき | `html-scripts.url` の先の変換のライブラリを読み込み、範囲ごとに `document.head` へ `script` 要素を 1 つ配置してすぐ削除し、範囲の関数を呼ぶ |

  | `opts.diffSource` を指定したとき | 読者が差分を開くと（`opts.diffMode` が `open` なら描いた時点、`blocks` なら描くたびに）取り出し元の `revisions`・`content` を呼び、差分の行を出している間だけミニマップの帯を配置し、スクロール先のスクロールの `scroll` と `window` の `resize` を受け取る |

  | 文書にビューのマーカーがあるとき | ビューの部品のモジュールを読み込む |

  | `comments` がオンで `opts.commentStore` を指定したとき | コメントの部品のモジュールを読み込み、`load` を描くたびに 1 回呼び、保存で `save`、読み込みと保存の関数が持つときは吹き出しの修正で `update`・削除で `remove`、`reloadComments` で `load` を呼ぶ。その間は `document` の `selectionchange` を受け取り、コメントのボタン・入力欄・吹き出しを `document.body` に配置する。あわせて本文の列の右に余白の列を配置し、描く先の要素の大きさを `ResizeObserver`、描く先の要素の中の開閉・切り替えを `MutationObserver` で確認する |

  | map の範囲があるとき | 図ごとの開閉・中へ入ったグループ・動かした位置・参加者の並び順を sessionStorage に記載し、`map.url_state` が `false` でなければ中へ入ったグループと中だけを描くブロックを `history.replaceState` でクエリ文字列の `map-{図の番号}` に記載する。ノードの大きさの変化を `ResizeObserver` で確認し、map の部品のモジュール（`dist/map.js`）を読み込む |

  | map の帯で手順を再生しているとき | 停止するまで `requestAnimationFrame` で今の手順の区切りを塗る。手順へ図の枠の中を移す間は `requestAnimationFrame` で倍率とスクロールの位置を変える |


  <!-- /table -->'
