  - name: 正常系（図のツールチップをタッチで開閉する）
    summary: '`pointerType` が `touch` のとき、持ち主のタップで開閉を切り替え、ツールチップと持ち主の外の `pointerdown` で閉じる'
    setup:
      - name: 配布物を読み込んだページ
