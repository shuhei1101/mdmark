        description: '`<!-- table: {"kind": "data", "features": {"columns": {}}, "columns": {"数量": {"total": [{"calc": "sum"}]}, "単価": {"total": [{"calc": "avg"}]}, "名前": {"total": [{"calc": "count"}], "filter": {"type": "text"}}}} -->` 〜 `<!-- /table -->` で、列 `名前`・`数量`・`単価` の 4 行の表を囲んだ文書'
        notes: 名前は `りんご`・`みかん`・`りんご飴`・`ぶどう`、数量は `10`・`2`・`33`・空、単価は `100`・`200`・`300`・`400`
