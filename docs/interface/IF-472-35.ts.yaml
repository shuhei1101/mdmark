      - ツールチップの中の `pointerdown` の後も、ツールチップが `hidden` を持たない
      - 図の外の段落の `pointerdown` の後、ツールチップが `hidden` を持つ
      - '`pointerType` が `mouse` の `pointerdown` を開いているマーカーに発火しても、ツールチップは `hidden` を持たない'
