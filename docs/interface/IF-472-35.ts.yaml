      - シーケンス図の参加者の箱の名前の文字の外の `touch-action` の計算値が `pan-y` で、`pointerType` が `touch` のポインターで左右へ動かしても列を移る。構成図のノードは `pointerType` が `touch` のポインターで動かしても位置が変わらない
