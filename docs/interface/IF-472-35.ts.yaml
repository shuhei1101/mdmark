    expected:
      - '`ends` の線が元のノードの下の辺から出て、先のノードの上の辺に矢じりが付き、`via` の線が経由点を通る'
      - '`justify: start` のノードの左端が段の左端にあり、`collapsed: true` のグループが閉じて描かれる（sessionStorage が空のとき）'
      - どの 2 つのノード・グループも重ならない
    test: test_normal_when_map_overrides
  - name: 正常系（map の印の引数で最初の見せ方を決める）
    summary: 印の JSON のオブジェクトの `focus`・`play`・`interval`・`collapse` で、最初に入るグループ・画面に入ったときの自動の再生・自動で進める間隔・折りたたみを決める
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（map の構成図を描く）と同じ。sessionStorage とクエリ文字列は空。シーケンス図は描く先の要素の 2 画面目より下
      - name: 印の引数を持つ map の Markdown
        description: '正常系（map のシーケンス図を描いて再生する）の構成図の印に `{"title": "全体の構成", "focus": "read", "collapse": {"open": false}}`、シーケンス図の印に `{"play": "autoplay", "interval": 1}` を持つ文書'
      - name: Mock
        description: 自動で進める間隔はテストの時計を進めて確かめる。`prefers-reduced-motion` は `no-preference` と `reduce` の 2 通り
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant M as mdmark
        U->>M: mount(el, { markdown, config })
        M-->>U: 閉じた折りたたみの中に、read の中へ入った構成図と、止めたシーケンス図
        U->>M: 折りたたみを開き、シーケンス図を画面に入れる
        M-->>U: 押さずに 1 秒ごとにメッセージを進める
    expected:
      - 構成図が見出し「全体の構成」の閉じた折りたたみ（`details`）に入り、開くと「記法の読み取り」の中へ入った図と押せる戻るボタンがある
      - シーケンス図が画面に入るまで再生が始まらず、画面に入ると押さずに再生が始まり、1 秒ごとに次のメッセージへ進む
      - '`prefers-reduced-motion: reduce` では、画面に入っても自動で始めず、再生の帯を止めた状態（`–/7`）で出す。再生を押すとデータの印が流れる'
      - 別のグループの中へ入った状態を sessionStorage に保ってから、もう一度 mount すると、`focus` ではなく保ったグループの中から描く。クエリ文字列の `map-1` は sessionStorage より優先する
