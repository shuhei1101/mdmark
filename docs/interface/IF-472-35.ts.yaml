    summary: 描く先の要素が画面より狭いときも、ピン止めしていない右端の線と hover で開くパネルをスクロールする場所の右端から 1rem に配置し、差分のミニマップを回避する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系（右側の目次をホバーで出してピン止めする）と同じ
        notes: '画面は幅 1600px・高さ 800px。`el` は幅 992px で左端を画面の左端から 312px に配置する。ページ全体でスクロールする場合と、画面の左端に配置した幅 1200px・高さ 600px の `overflow-y: auto` の要素の中に幅 800px の `el` を左に詰めて配置する場合の 2 通り'
      - name: 見出しを持つ Markdown
        description: 正常系（右側の目次をホバーで出してピン止めする）と同じ文書
      - name: 差分を開いた別の文書
        description: 'ページ全体でスクロールする場合の続きで、同じページの別の要素に `diffSource` と `diffMode: "open"` を指定して `mount` し、画面の右端にミニマップの帯を出す'
      - name: Mock
        description: 差分の取り出し元は、決めた 2 つのリビジョンを返却する手元の関数にする
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 右端の線をスクロールする場所の右端から 1rem に配置する
        P->>M: スクロールする場所を文書の途中までスクロールし、右端の線にポインターを乗せる
        M->>P: 右端の線と同じ右端にパネルを出す
        P->>M: ピン止めのボタンを押す
        M->>P: パネルを el の中の右の列に出す
        P->>M: ピン止めを解除し、スクロールせずに別の要素で差分を開く
        M->>P: 右端の線とパネルをミニマップの左へずらす
        P->>M: スクロールせずに差分を閉じる
        M->>P: 右端の線とパネルを 1rem の位置に戻す
    expected:
      - 2 通りの配置方法のどちらでも、描いた直後とスクロールした後に、右端の線の `getBoundingClientRect().right` が `el` の右端より大きく、スクロールする場所のスクロールバーを除いた右端（ページ全体は `document.documentElement.clientWidth`、要素は左端に `clientLeft` と `clientWidth` を加算した位置）から 1rem を減算した値と 1px 以内で等しい
      - ポインターを乗せた後、パネルが不透明で、`getBoundingClientRect().right` が右端の線の右端と 1px 以内で等しい
      - ピン止めのボタンを押した後、パネルの `getBoundingClientRect().right` が `el` の右端以下で、本文の列の右端がパネルの左端より左
      - スクロールせずに別の要素で差分を開いた後、右端の線とパネルの `getBoundingClientRect().right` が、どちらもミニマップの帯の左端から 8px を減算した値と 1px 以内で等しい。スクロールせずに差分を閉じて帯が削除された後、右端の線の `getBoundingClientRect().right` が `document.documentElement.clientWidth` から 1rem を減算した値と 1px 以内で等しい
    test: test_normal_when_side_toc_at_scroll_edge
