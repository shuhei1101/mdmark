      - 線を押すと両端のノードが選ばれ、もう一度押すと両方の選択が解ける。片方だけ選んだ状態で押すと両方が選ばれる。線を 3px だけ動かして離しても押した扱いになる
      - ノードと参加者の名前の文字の上を押しても選択は変わらず、名前の文字を選んでコピーできる。種類の行の文字は選べない
      - シーケンス図のメッセージの線を押すと送り手と受け手が選ばれる
      - 右上の「配置と選択を元に戻す」（構成図）・「参加者の並び順と選択を元に戻す」（シーケンス図）が選んだときだけ押せ、押すか Esc で選択が解ける
