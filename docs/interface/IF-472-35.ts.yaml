        notes: Chromium（`animation-timeline` を持つ）と Firefox（持たない）の両方で走らせる
      - name: 留める位置のずれ
        description: '描く先の `div` に `--mdmark-sticky-top: 48px` を適用する'
      - name: 大きい表を持つ Markdown
        description: '長い段落の後に `<!-- table: {"kind": "data", "columns": {"数量": {"total": [{"calc": "sum"}]}}} -->` 〜 `<!-- /table -->` で 10 列 60 行の表を囲み、表の後に長い段落を持つ文書'
        notes: 1 列目は名前、2 列目は数量（全て数）
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 縦の高さに上限の無い表を描く
        P->>M: 2 列目のピン止めを押し、ページを表の途中までスクロールする
        M->>P: 見出し行を画面の上端から 48px、集計の行を画面の下端に留める
        P->>M: 表を横にスクロールし、留めた見出し行の数量の並べ替えを押す
        M->>P: 並べ替えた表
        P->>M: ページを表の後の段落までスクロールする
        M->>P: 見出し行と集計の行も画面から隠す
    expected:
      - 表の `mdmark-table` の `max-height` の計算値が `none` で、表の中で縦にスクロールしない
      - 表の途中までスクロールした後、見出し行の各 `th` の上端が画面の上端から 48px ±1px、集計の行の各セルの下端が画面の下端 ±1px
      - 表を横にスクロールした後も、見出し行と集計の行の各セルの左端と幅が同じ列の本文のセルと ±1px で一致し、1・2 列目のセルが表の左端にある
      - 留めた見出し行の並べ替えを押した後、数量の列が降順に並び、数量の `th` の `aria-sort` が `descending`
      - 表の後の段落までスクロールした後、見出し行と集計の行のセルが画面の外（下端が画面の上端より上）にある
      - 文書の中の `thead` は 1 つだけで、Tab で見出し行の各ボタンと列の幅のつまみへ 1 回ずつ移る
      - 印刷の媒体では、見出し行と集計の行のセルの `transform` の計算値が `none`
