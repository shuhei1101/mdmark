        description: 正常系と同じ
      - name: Dockerfile と diff のコードブロックを持つ Markdown
        description: 言語 `dockerfile`・`docker`・`patch` のコードブロックを 1 つずつと、`+` で始まる行・`-` で始まる行・行末に `# [!code ++]` を付けた行を持つ言語 `diff` のコードブロックを持つ文書
      - name: 設定
        description: 正常系（コードブロックを色分けする）と同じ
      - name: Mock
        description: 正常系（コードブロックを色分けする）と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: mount(el, { markdown, config })
        M->>P: コードブロックを色分けせずに描く
        M->>X: import(core.min.js)・import(languages/dockerfile.min.js)・import(languages/diff.min.js)
        X-->>M: モジュール
        M->>P: 4 つのコードブロックの中身を色分けした HTML に置き換える
    expected:
      - 色分けのライブラリへの要求が `core.min.js`・`languages/dockerfile.min.js`・`languages/diff.min.js` の 3 件
      - '`dockerfile` と `docker` の `code` の中に `hljs-keyword` の `span` がある'
      - '`diff` と `patch` の `code` の中に `hljs-addition` と `hljs-deletion` の `span` があり、その文字の色の計算値がそれぞれ `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` の値'
      - '`[!code ++]` を付けた行の `mdmark-code-line` が `data-kind="add"` を持ち、その `mdmark-code-text` の中に `hljs-` で始まる `span` がある'
    test: test_normal_when_dockerfile_and_diff_highlighted
  - name: 正常系（右側の目次をホバーで出してピン止めする）
    summary: 右端の線にポインターを乗せると右側の目次を出し、項目で見出しへ移り、ピン止めで出し続ける
    setup:
      - name: 配布物を読み込んだページ
