        P->>M: 「編集」を押し、本文を書き換えて保存する
        M->>S: update({ docId, id: c1, body })
        S-->>M: 解決
        M->>P: 書き換えた本文の吹き出し
        P->>M: CSS のマーカーの吹き出しの「削除」を押す
        M->>P: 削除の確認
        P->>M: 確認の「削除」を押す
