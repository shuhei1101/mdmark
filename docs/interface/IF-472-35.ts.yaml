      - 幅 390px（区切りが 12px より細い）では、手順のバーが `is-dense` を持ち、今の手順の区切りだけが 24px の幅になる
      - 幅 1280px（区切りが 12px 以上）では、手順のバーが `is-dense` を持たず、今の手順の区切りもほかと同じ幅
      - 右の矢印のボタンの後は、手順 21 の区切りが 24px になり、手順 20 の区切りはほかと同じ幅に戻る
    test: test_normal_when_map_walkthrough_dense
    refs:
