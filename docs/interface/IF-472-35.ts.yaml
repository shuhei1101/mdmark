        description: 1 つ目の段落に `単体テスト` が出て、2 つ目の段落に用語を含まない文が続く文書
      - name: Mock
        description: 差し替える依存は無い。タップは、単語に `pointerType` が `touch` の `pointerenter`・`pointerdown`・`pointerup`・`pointerleave` をこの順に発火し、単語の `focus()` を呼んで発生させる（既にフォーカスを持つ単語へのタップでは `focus` は発火しない）
        notes: iOS の Safari のタップの後に `:hover` が残る状態を、外のタップで `pointerleave`・`blur` を発火させず、`pointerdown` だけを発火して発生させる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, aliases })
        P->>M: 単体テストの単語をタップする
        M->>P: コマンドとコピーのボタンのツールチップを出す
        P->>M: ツールチップのコピーのボタンをタップする（touch の pointerdown を発火し、ボタンの focus() を呼ぶ）
        M->>P: 出したままにする
        P->>M: 開いている単語に mouse の pointerdown を発火する
        M->>P: 出したままにする
        P->>M: 同じ単語をタップする
        M->>P: ツールチップを削除する
        P->>M: 単語をタップする
        M->>P: ツールチップを出す
        P->>M: 2 つ目の段落に pointerdown だけを発火する
        M->>P: ツールチップを削除する
      ```

      <!-- /map -->
    expected:
      - 閉じた単語への 1 回のタップの後、単語の枠 `mdmark-term-wrap` が `is-open` を持つ
      - コピーのボタンのタップの後も、単語の枠が `is-open` を持つ
      - '`pointerType` が `mouse` の `pointerdown` を開いている単語に発火しても、単語の枠が `is-open` を持つ'
      - フォーカスがコピーのボタンにある状態で開いている単語をタップした後（単語の `focusin` が `pointerdown` の後に発火する）、単語の枠が `is-open` を持たない
      - 2 つ目の段落の `pointerdown` の後、単語の枠が `is-open` を持たず、単語にフォーカスが残ったままでもツールチップが表示されない（`display` が `none`）
