    test: test_normal_when_long_column_min_configured
    refs:
      - SC-472-73#scenarios[正常シナリオ（長文の列の最小の幅を設定で変える）]
  - name: 正常系（ブロックの間隔）
    summary: ブロックを 2 つずつ並べて描き、後のブロックがコードブロック・ファイルツリーのときも、ほかのブロックと同じ間を空ける
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ。`--mdmark-space` は既定（14px）
      - name: ブロックの組み合わせを持つ Markdown
        description: 段落・見出し・表・コードブロック・ファイルツリー・箇条書き・番号付きリスト・引用・注意書き・区切り線・タブ・ステップ・埋め込んだ HTML から、前のブロックと後のブロックを 1 組ずつ選んだ全ての組み合わせの文書。あわせて、見出しのセクションの中・タブの中・箇条書きの項目・引用・`details`・行の詳細の中で段落に続けてコードブロックとファイルツリーを配置した文書と、タイトルを持つコードブロック・タイトルを持たないコードブロック・ファイルツリーをそれぞれ先頭に配置した文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M-->>P: ブロック同士の間を本文の間隔で空けて描く
    expected:
      - 本文の直下の組で、前のブロックが区切り線でなく後のブロックが見出しと区切り線でないとき、後のブロックの `getBoundingClientRect().top` から前のブロックの `bottom` を減算した値が 14px（差が 1px 以内）
      - 後のブロックがコードブロック・ファイルツリーの組も 14px で、0px の組が無い
      - 後のブロックが見出しの組は見出しの上の余白の規則の値、前か後のブロックが区切り線の組は区切り線の余白の規則の値（どちらも差が 1px 以内）
      - 見出しのセクションの中とタブの中で、段落の `bottom` からコードブロックとファイルツリーの `top` までが 14px（差が 1px 以内）
      - 箇条書きの項目・引用・`details`・行の詳細の中で、段落の `bottom` からコードブロックとファイルツリーの `top` までが 7px（差が 1px 以内）
      - 先頭に配置したタイトルを持つコードブロック（`figure`）・タイトルを持たないコードブロック・ファイルツリーの `top` が、描く先の要素の内側の余白の内側の上端と同じ（差が 1px 以内）
    test: test_normal_when_block_spacing
  - name: 正常系（脚注のツールチップのタッチ）
    summary: タッチのタップで閉じた番号のツールチップを開き、開いた番号のタップで一覧へ移り、ツールチップと番号の外の `pointerdown` で閉じる
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 脚注を持つ Markdown
        description: 正常系（脚注のツールチップ）と同じ文書の後ろに、脚注を含まない段落を続けた文書
      - name: Mock
        description: 差し替える依存は無い。タップは、番号のリンクに `pointerType` が `touch` の `pointerenter`・`pointerdown`・`pointerup`・`pointerleave` をこの順に発火し、リンクの `focus()` を呼び、`click` を発火して発生させる（既にフォーカスを持つリンクへのタップでは `focus` は発火しない）
        notes: iOS の Safari のタップの後に `:hover` が残る状態を、外のタップで `pointerleave`・`blur` を発火させず、`pointerdown` だけを発火して発生させる
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 参照の場所に番号を配置し、末尾に閉じた脚注の一覧を配置して描く
        P->>M: 番号 1 をタップする
        M->>P: 脚注 1 のツールチップを出し、一覧へは移らない
        P->>M: ツールチップの中の詳しくのリンクに touch の pointerdown を発火する
        M->>P: 出したままにする
        P->>M: 脚注を含まない段落に pointerdown だけを発火する
        M->>P: ツールチップを削除する
        P->>M: 番号 1 をタップする
        M->>P: 脚注 1 のツールチップを出す
        P->>M: 開いた番号 1 をタップする
        M->>P: ツールチップを閉じ、閉じた一覧を開いて脚注 1 の項目へフォーカスを移す
    expected:
      - 閉じた番号 1 への 1 回のタップの後、`sup.mdmark-fn-ref` が `is-open` を持ち、`details.mdmark-footnotes` が `open` を持たず、`click` の既定の動作が止められている
      - ツールチップの中のリンクの `pointerdown` の後も、`sup.mdmark-fn-ref` が `is-open` を持つ
      - 脚注を含まない段落の `pointerdown` の後、`sup.mdmark-fn-ref` が `is-open` を持たず、番号にフォーカスが残ったままでもツールチップが表示されない（`display` が `none`）
      - 消えた後の番号 1 のタップで、`sup.mdmark-fn-ref` がもう一度 `is-open` を持つ
      - 開いた番号 1 のタップの後、`sup.mdmark-fn-ref` が `is-open` を持たず、`details.mdmark-footnotes` が `open` を持ち、脚注 1 の項目にフォーカスがあり、`location.hash` が変わっていない
    test: test_normal_when_footnote_touch
    refs:
      - SC-472-71#scenarios[正常シナリオ（タッチ）]
