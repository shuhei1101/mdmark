      - name: Mock
        description: 差し替える依存は無い。タップは、持ち主に `pointerType` が `touch` の `pointerenter`・`pointerdown`・`pointerup`・`pointerleave` をこの順に発火し、持ち主の `focus()` を呼んで発生させる（既にフォーカスを持つ持ち主へのタップでは `focus` は発火しない）
        notes: iOS の Safari のタップの後に `:hover` が残る状態を、外のタップで `pointerleave`・`blur` を発火させず、`pointerdown` だけを発火して発生させる
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        P->>M: 説明を持つノードのマーカーをタップする
