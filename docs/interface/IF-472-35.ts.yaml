        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 本文の列と、隠した右側の目次を配置する
        P->>M: 右端の線にポインターを乗せる
        M->>P: 右側の目次を出す
        P->>M: 「使用方法」の項目を押す
        M->>P: 「使用方法」の見出しへ移る
        P->>M: ピン止めのボタンを押し、ポインターを本文へ動かす
        M->>P: 右側の目次を出し続ける
        P->>M: ピン止めのボタンをもう一度押し、ポインターを本文へ動かす
        M->>P: 右側の目次を隠す
    expected:
      - 描いた直後、`el` の子が `mdmark-content`・`mdmark-side-toc`・`mdmark-back-to-top` で、右側の目次のパネルが透明でポインターを受けない
      - パネルの `nav` が、`手引き` の下に `導入`（その下に `前提`）と `使用方法` を入れ子にした項目を持ち、項目のリンクが `#手引き`・`#導入`・`#前提`・`#使い方` を指す
      - 目次を出すボタンが表示されていない
      - 右端の線にポインターを乗せた後、パネルが不透明で、上部にすべて展開・すべて折りたたむのボタンがある
      - '`使用方法` を押した後、`location.hash` が `#使い方` で、`使用方法` の見出しが画面に入っている'
      - ピン止めのボタンを押した後、`aria-pressed` が `true` で、ポインターを本文へ動かしてもパネルが不透明で、本文の列の右端がパネルの左端より左にある
      - ピン止めのボタンをもう一度押した後、`aria-pressed` が `false` で、ポインターを本文へ動かすとパネルが透明になる
