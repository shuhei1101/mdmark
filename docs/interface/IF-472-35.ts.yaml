  - name: 正常系（コードブロックをコピーする）
    summary: コピーボタンで、削除した行を含めない変更後のコードをクリップボードへ書き込み、ボタンで通知する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: コードの行のマーカーを持つ Markdown
        description: 行末に `// [!code --]` を付けた `const a = 1;`、行末に `// [!code ++]` を付けた `const a = 2;`、`count += 1; // 数える [!code highlight]`、マーカーの無い `return a;` の 4 行を持つ言語 `ts` のコードブロックと、言語の無い 1 行のコードブロックと、言語 `tree` のコードブロックを持つ文書
      - name: Mock
        description: '`navigator.clipboard.writeText` を、指定された文字を記録して解決する関数に差し替える。色分けは機能 `syntax` を解除して読み込ませない'
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: コードブロックの帯にコピーボタンを配置する
        P->>M: ts のコードブロックのコピーボタンを押す
        M->>M: 削除した行を除いたコードをクリップボードへ書き込む
        M->>P: ボタンで通知する
        P->>M: 言語の無いコードブロックのコピーボタンを押す
        M->>M: コードをクリップボードへ書き込む
    expected:
      - '`navigator.clipboard.writeText` の 1 回目が `const a = 2;\ncount += 1; // 数える\nreturn a;`（行番号と行頭の `+`・`-` を含まない）'
      - 2 回目が言語の無いコードブロックの 1 行で、末尾に改行が無い
      - 押した後、ボタンの文字が `コピーしました` で、`role="status"` の要素にコードをコピーしたことが出て、2 秒後にボタンの文字が `コピー` に戻る
      - コピーボタンは `type="button"` で、Tab でフォーカスして Enter で押せる
      - ファイルツリーに描いた `tree` のコードブロックにはコードブロックの帯とコピーボタンが無く、ツリーの帯の `mdmark-tree-copy` のボタンだけがある
      - 印刷の媒体では、コピーボタンが表示されていない
