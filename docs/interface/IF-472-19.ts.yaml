id: IF-472-19
visibility: internal
title: "プレビューのリンクを開く"
entry:
  kind: operation
  value: 'Webview の本文のリンクの押下からの `{ type: "openLink", href }`'
flows:
  - name: 正常系（外部の URL）
    summary: 外部の URL を既定のブラウザで開く
    setup:
      - name: リンクを持つ文書のプレビュー
        description: '`https://example.com/`・同じフォルダの `other.md`・同じ文書の見出しへの `#` のリンク（見出しは画面の外）を持つ `guide.md` のプレビューを開いた状態'
      - name: Mock
        description: '`env.openExternal` を、指定された URL を記録する代役に差し替える'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        participant EX as 拡張機能
        participant BR as 既定のブラウザ
        U->>PV: https://example.com/ を押す
        PV->>EX: openLink
        EX->>BR: env.openExternal
    expected:
      - 代役に `https://example.com/` が 1 回渡る
      - Webview の文書が再描画されず、スクロールの位置が変わらない
    test: test_normal_when_external_link
  - name: 正常系（Markdown へのリンク）
    summary: '`.md` へのリンクを VS Code のエディタで開く'
    setup:
      - name: リンクを持つ文書のプレビュー
        description: 正常系（外部の URL）と同じ
      - name: Mock
        description: 正常系（外部の URL）と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        participant EX as 拡張機能
        U->>PV: other.md を押す
        PV->>EX: openLink
        EX->>EX: showTextDocument（other.md）
    expected:
      - アクティブなエディタの文書が `other.md` で、`guide.md` のエディタと同じ列にある
      - '`env.openExternal` の代役は呼ばれない'
    test: test_normal_when_markdown_link
  - name: 正常系（ページの中へのリンク）
    summary: '`#` で始まるリンクはプレビューの中で移り、拡張機能へは送信しない'
    setup:
      - name: リンクを持つ文書のプレビュー
        description: 正常系（外部の URL）と同じ
      - name: Mock
        description: 正常系（外部の URL）と同じ。拡張機能が受けたメッセージを記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        U->>PV: # で始まるリンクを押す
        PV->>PV: 見出しへ scrollIntoView
    expected:
      - Webview の見えている範囲にリンク先の見出しが入る
      - 拡張機能が `openLink` を受けず、エディタがもう一度開かれない
    test: test_normal_when_anchor_link
  - name: 異常系（開けないリンク・何もしない）
    summary: 相対パスの先にファイルが無いときは何も開かない
    setup:
      - name: 無いファイルへのリンク
        description: '`./missing.md` へのリンクを持つ文書のプレビュー'
      - name: Mock
        description: 正常系（外部の URL）と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        participant EX as 拡張機能
        U->>PV: ./missing.md を押す
        PV->>EX: openLink
        EX->>EX: ファイルが無いので何もしない
    expected:
      - エディタの数が変わらず、`env.openExternal` の代役も呼ばれない
      - 拡張機能が例外を投げない
    test: test_error_when_link_target_missing
  - name: 正常系（右側の目次の項目）
    summary: 右側の目次の項目を押すと、囲む閉じたセクションと見出し自身の閉じたセクションを開いて見出しへ移り、拡張機能へは送信しない
    setup:
      - name: 閉じたセクションを持つ文書のプレビュー
        description: '`## 導入` を閉じた状態で描き、その中に閉じた状態の `### 注意` と段落を持つ `guide.md` のプレビューを開いた状態。右側の目次は既定の出し方'
      - name: Mock
        description: 正常系（外部の URL）と同じ。拡張機能が受けたメッセージを記録する
    flow: |
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        U->>PV: 右側の目次の「注意」を押す
        PV->>PV: 「導入」と「注意」のセクションを開いて見出しへ scrollIntoView
    expected:
      - '`導入` と `注意` のセクションが開き、Webview の見えている範囲に `注意` の見出しが入り、`注意` の段落が表示されている'
      - 拡張機能が `openLink` を受けず、エディタがもう一度開かれない
    test: test_normal_when_side_toc_link
  - name: 正常系（図のノードのリンク）
    summary: map の図のノードのリンクを、本文のリンクと同じ種類ごとの先で開く
    setup:
      - name: ノードのリンクを持つ文書のプレビュー
        description: 同じフォルダの `other.md` と `https://aka.ms/mdmark` を `click` の行で指すノードの map の構成図を持つ Markdown のプレビューを開いた状態
      - name: Mock
        description: 正常系（外部の URL）と同じ
    flow: |-
      sequenceDiagram
        participant PV as プレビュー（Webview）
        participant EX as 拡張機能
        participant ED as エディタ（VS Code）
        PV-->>EX: openLink（other.md）
        EX->>ED: other.md を開く
        PV-->>EX: openLink（https://aka.ms/mdmark）
        EX->>EX: env.openExternal
    expected:
      - '`other.md` を指すノードを押すと、`other.md` がエディタで開く'
      - '`https://aka.ms/mdmark` を指すノードを押すと、`env.openExternal` の代役にその URL が 1 回だけ渡る'
      - ノードを押してもプレビューの文書が変わらない。`https://aka.ms/mdmark` を指すノードの種類の行の上で押したまま 100px 動かして離したときは（ノードが動く）、`openLink` が送信されず、`env.openExternal` の代役が呼ばれない
    test: test_normal_when_map_node_link
lead: プレビューで押したリンクを、外部の URL は既定のブラウザ、Markdown へのリンクは VS Code のエディタ、`#` で始まるリンクはプレビューの中で開く。
idempotent: true
side_effects: 既定のブラウザか VS Code のエディタでリンク先を開く。プレビューの文書とスクロールの位置は変えない（`#` のリンクを除く）
callers:
  - SC-472-31#
request:
  - name: href
    type: string
    required: true
    location: argument
    description: 押したリンクの `a` 要素の `getAttribute("href")`（記載したままの値。`<base>` で解決する前）
exceptions:
  - name: なし（正常終了）
    condition: リンクの種類ごとに決めた先で開く
  - name: なし（開けないリンク）
    condition: '`http:`・`https:`・`mailto:` 以外のスキームか、相対パスの先にファイルが無い'
    notes: 何もしない。スキームは mdmark の sanitize が `http`・`https`・`mailto` と相対 URL だけを残すため、ほかのスキームは届かない
constraints:
  - item: リンクの見分け方
    constraint: Webview は本文の `a`（map の図のノードの `a.mdmark-diagram-node-link` を含む。ノードを動かした後の `click` は mdmark が `window` のキャプチャで止めるため、`document` まで届かず送信しない）の `click` を `document` のキャプチャで受け、`preventDefault` と `stopPropagation` を呼んで `openLink` を送信する（VS Code の Webview の外枠は `window` の `click` でリンクを開くため、伝えると 2 回開く）。`#` で始まるリンクだけは送信せず、Webview の中でその `id` の要素へ `scrollIntoView` する。右側の目次（`.mdmark-side-toc`）の中のリンクはキャプチャでは止めずに右側の目次へ届け（閉じたセクションを開いて移り、狭い幅ではパネルを隠す）、`document` のバブリングで `preventDefault` と `stopPropagation` を呼ぶ。拡張機能は `http:`・`https:`・`mailto:` を `env.openExternal` で開き、相対パスは Markdown のフォルダから解決して、`.md` は `window.showTextDocument`、それ以外のファイルは `vscode.open` で開く。相対パスの `#` 以降は使用しない
  - item: 開く列
    constraint: Markdown へのリンクは、元の Markdown のエディタと同じ列に開く。プレビューは閉じない
