id: IF-472-32
visibility: internal
title: "拡張を登録する"
entry:
  kind: operation
  value: '`registerExtension(extension)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 拡張を登録し、文書の拡張のマーカーの場所にモジュールで描かせる
    setup:
      - name: 配布物を読み込んだページ
        description: ビルドした `dist/index.js` と `dist/index.css` を読み込み、描く先の `div` を 1 つ持つページ
      - name: 拡張
        description: '`name` と `directive` が `greet`、`load` が `() => import("/fixtures/greet.js")` の拡張'
        notes: '`schema` は指定しない'
      - name: 拡張のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: {"target": "world", "lang": "ja"} -->` を 2 つ持つ文書'
      - name: Mock
        description: 拡張のモジュールの代役として、`draw(slot, value)` で `slot` の文字を `value` の JSON にするモジュールを、手元の開発サーバーが `/fixtures/greet.js` で配る。`load` は呼ばれた回数を数える関数で包む
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension({ name, directive, load })
        P->>M: mount(el, { markdown })
        M->>P: マーカーの場所に読み込み中のブロックを描く
        M->>X: load()
        X-->>M: モジュール
        M->>X: draw(マーカーの場所の要素, { options })
        X->>P: マーカーの場所に描く
    expected:
      - '`load` が 1 回だけ呼ばれる'
      - '2 つのマーカーの場所の文字がどちらも `{"options":{"target":"world","lang":"ja"}}`（範囲の無いマーカーは `definition` を持たない）'
      - マーカーの前後の段落がある
      - '`registerExtension` の戻り値が `undefined`'
    test: test_normal
  - name: 正常系（マーカーが無い）
    summary: 拡張のマーカーが無い文書では拡張のモジュールを読み込まない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 正常系と同じ
      - name: マーカーの無い Markdown
        description: 段落だけを持つ文書
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ name, directive, load })
        P->>M: mount(el, { markdown })
        M->>P: el の中に本文を描く
    expected:
      - '`load` が 1 回も呼ばれていない'
      - 段落がある
    test: test_normal_when_no_mark
  - name: 異常系（引数が Schema に合わない・記載の警告）
    summary: 引数が schema に合わないマーカーの場所だけを記載の警告にし、モジュールを読み込まない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 正常系の拡張に、`options.target` を英小文字の文字列だけで、`options.count` を数だけで許す `schema` を追加したもの
        notes: '`schema` は valibot 1.5.0 の `v.object({ options: v.object({ target: v.pipe(v.string(), v.regex(/^[a-z]+$/)), count: v.optional(v.number()) }) })`。valibot は結合テストの開発用の依存に入れる'
      - name: 合わない引数のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: {"target": "World", "count": "2"} -->` を持つ文書'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ name, directive, load, schema })
        P->>M: mount(el, { markdown })
        M->>M: schema["~standard"].validate({ options })
        M->>P: マーカーの場所を記載の警告に替える
    expected:
      - マーカーの場所の要素が class `mdmark-syntax-warning` を持ち、タイトルが `記載の警告`
      - '警告の本文にマーカーの記載と拡張の名前 `greet` があり、項目が 2 つで、`target:` と `count:` で始まる'
      - '`load` が 1 回も呼ばれていない'
      - マーカーの前後の段落があり、`mount` が例外を投げない
    test: test_error_when_args_invalid
  - name: 異常系（今の書き方の拡張のマーカー・記載の警告）
    summary: 引数が JSON のオブジェクトでない拡張のマーカーの場所を、移行を案内する記載の警告にし、検査もモジュールの読み込みもしない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 異常系（引数が Schema に合わない・記載の警告）と同じ
      - name: 今の書き方の拡張のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: world lang=ja -->` を持つ文書'
      - name: Mock
        description: 正常系と同じ。`schema` の `validate` は呼ばれた回数を数える関数で包む
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ name, directive, load, schema })
        P->>M: mount(el, { markdown })
        M->>M: マーカーの引数が JSON のオブジェクトでない
        M->>P: マーカーの場所を記載の警告に替える
    expected:
      - マーカーの場所の要素が class `mdmark-syntax-warning` を持ち、本文に、拡張の名前 `greet`・引数を JSON のオブジェクトで記載すること・`mdmark upgrade` の移行の報告で記載し直す箇所を確かめられることがある
      - '`validate` と `load` が 1 回も呼ばれていない'
      - マーカーの前後の段落があり、`mount` が例外を投げない
    test: test_error_when_legacy_args
    refs:
      - SC-472-49#scenarios[異常シナリオ（今の書き方の拡張のマーカー）]
  - name: 異常系（モジュールを読み込めない・通知ブロック）
    summary: 拡張のモジュールを読み込めないマーカーの場所だけを通知ブロックにし、ほかは描く
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: '`load` が `() => import("/fixtures/missing.js")` のほかは正常系と同じ'
      - name: 拡張のマーカーを持つ Markdown
        description: 正常系と同じ
      - name: Mock
        description: '`/fixtures/missing.js` は手元の開発サーバーが 404 を返却する。`console.error` を、呼ばれた引数を記録する関数で包む'
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension({ name, directive, load })
        P->>M: mount(el, { markdown })
        M->>X: load()
        X-->>M: 404
        M->>P: マーカーの場所を通知ブロックに替える
    expected:
      - マーカーの場所の要素が class `mdmark-notice` と `role="status"` を持ち、タイトルが `この図を表示できません`
      - 通知ブロックの本文が `表示に使用する拡張（greet）を読み込めませんでした。ネットワークにつながっているかを確認して、ページを再読み込みしてください。`
      - マーカーの前後の段落があり、`mount` が例外を投げない
      - '`console.error` が呼ばれ、引数に `greet` と元のエラーを含む'
    test: test_error_when_module_not_found
  - name: 異常系（検査が失敗する・通知ブロック）
    summary: '`schema` の `validate` が拒否されるマーカーの場所を通知ブロックにし、モジュールを読み込まない'
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 正常系の拡張に、`~standard.validate` が拒否される Promise を返却する `schema` を追加したもの
        notes: '`schema` は `{ "~standard": { version: 1, vendor: "test", validate: () => Promise.reject(new Error("boom")) } }`'
      - name: 拡張のマーカーを持つ Markdown
        description: 正常系と同じ
      - name: Mock
        description: '`console.error` を、呼ばれた引数を記録する関数で包む。ほかは正常系と同じ'
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ name, directive, load, schema })
        P->>M: mount(el, { markdown })
        M->>M: schema["~standard"].validate({ options })
        M-->>M: 拒否
        M->>P: マーカーの場所を通知ブロックに替える
    expected:
      - マーカーの場所の要素が class `mdmark-notice` と `role="status"` を持ち、本文に `greet` がある
      - '`load` が 1 回も呼ばれていない'
      - '`console.error` が呼ばれ、引数に `greet` と `boom` のエラーを含む'
      - マーカーの前後の段落があり、`mount` が例外を投げない
    test: test_error_when_validate_fails
  - name: 異常系（拡張の書式の誤り・TypeError）
    summary: 書式に合わない拡張は登録せずに TypeError を投げる
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 書式の誤った拡張
        description: '`directive` が `Greet!` の拡張と、`schema` が `{}` の拡張'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ directive: "Greet!", ... })
        M-->>P: TypeError
        P->>M: registerExtension({ schema: {}, ... })
        M-->>P: TypeError
    expected:
      - どちらの呼び出しも `TypeError` を投げ、メッセージに `directive`・`schema` を含む
      - 'その後 `<!-- greet: {"target": "world"} -->` を `mount` しても、マーカーの場所が配置されない（未知のマーカーとして取り除かれる）'
    test: test_error_when_extension_invalid
  - name: 異常系（名前の重なり・Error）
    summary: 記法のマーカーや登録済みの拡張と同じ directive は登録せずに Error を投げる
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ。正常系の拡張を登録済み
      - name: 名前の重なる拡張
        description: '`directive` が `table` の拡張と、`directive` が `greet` の 2 つ目の拡張'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ directive: "table", ... })
        M-->>P: Error
        P->>M: registerExtension({ directive: "greet", ... })
        M-->>P: Error
    expected:
      - どちらの呼び出しも `Error` を投げ、メッセージに重なった名前を含む
      - 'その後 `<!-- greet: {"target": "world"} -->` を `mount` すると、最初に登録した拡張の `load` が呼ばれる'
    test: test_error_when_directive_taken
  - name: 正常系（部品の定義を指定する）
    summary: 範囲で記載した拡張のマーカーの `json` のコードブロックを、`definition` として `schema` と `draw` へ指定する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 正常系の拡張に、`definition` が `title`（文字）と `items`（文字の配列）を持つことを確認する `schema` を追加したもの
        notes: '`schema` は valibot 1.5.0 の `v.object({ options: v.record(v.string(), v.unknown()), definition: v.object({ title: v.string(), items: v.array(v.string()) }) })`'
      - name: 部品の定義を持つマーカーの Markdown
        description: '`<!-- greet -->` 〜 `<!-- /greet -->` に `{"title": "段取り", "items": ["a", "b", "c"]}` の `json` のコードブロックを配置した文書'
      - name: Mock
        description: 拡張のモジュールの代役は、`draw(slot, value)` で `slot` の文字を `value.definition.title` と `value.definition.items` の数にする。ほかは正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension({ name, directive, load, schema })
        P->>M: mount(el, { markdown })
        M->>M: 範囲の json を読み込み、schema で確認する
        M->>X: load()
        M->>X: draw(マーカーの場所の要素, { options, definition })
        X->>P: マーカーの場所に描く
    expected:
      - マーカーの場所の文字が `段取り 3`
      - '`el` の中に定義の JSON の文字（`"items"`）が無い'
      - '`load` が 1 回だけ呼ばれる'
    test: test_normal_when_definition
  - name: 異常系（部品の定義を読み込めない・記載の警告）
    summary: JSON として読み込めない定義のマーカーの場所を記載の警告にし、モジュールを読み込まない
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: 正常系と同じ
      - name: 読み込めない定義を持つマーカーの Markdown
        description: '`<!-- greet -->` 〜 `<!-- /greet -->` に、閉じの `}` が無い `json` のコードブロックを配置し、前後に段落を持つ文書'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: registerExtension({ name, directive, load })
        P->>M: mount(el, { markdown })
        M->>M: 範囲の json を読み込めない
        M->>P: マーカーの場所を記載の警告に替える
    expected:
      - マーカーの場所の要素が class `mdmark-syntax-warning` を持ち、拡張の名前 `greet` と、読み込めなかった行・その行の読み込めた最後の部分・足りない記号がある
      - '`load` が 1 回も呼ばれていない'
      - マーカーの前後の段落があり、`mount` が例外を投げない
    test: test_error_when_definition_invalid
  - name: 正常系（図の部品と同じ名前）
    summary: 図の部品のマーカーと同じ `directive` の拡張を登録でき、そのマーカーを拡張に描かせる
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 拡張
        description: '`directive` が `chart` のほかは正常系と同じ拡張'
      - name: マーカーを持つ Markdown
        description: '段落の間に `<!-- chart: {"target": "world"} -->` を持つ文書'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant X as 拡張のモジュール
        P->>M: registerExtension({ directive: "chart", ... })
        P->>M: mount(el, { markdown })
        M->>X: load()
        M->>X: draw(マーカーの場所の要素, { options })
    expected:
      - '`registerExtension` が例外を投げない'
      - 'マーカーの場所の文字が `{"options":{"target":"world"}}` で、`figure.mdmark-diagram` が無い'
    test: test_normal_when_directive_is_diagram_name
lead: 利用側が、自分のマーカーの名前と、そのマーカーを描くモジュールの読み込み方を mdmark へ登録する。`mount` は文書にそのマーカーがあるときだけ、引数を検査してからモジュールを読み込んで描かせる。
test_file: tests/integration/lib/register-extension.browser.test.ts
idempotent: false
side_effects: mdmark の中の拡張の登録表に追加する。同じページの以降の `mount`・`update`・`render` に有効になる
callers:
  - SC-472-49#
  - SC-472-44#
exclusivity: 登録は同期で終わる。描いた後に登録したマーカーは、次の `mount`・`update` から有効になる
request:
  - name: extension.name
    type: string
    required: true
    location: argument
    description: 拡張の名前。通知ブロック・記載の警告・`console.error` に出す
    constraints: 空でない
    example: greet
  - name: extension.directive
    type: string
    required: true
    location: argument
    description: '拡張のマーカーの名前（`<!-- {directive}: {JSON のオブジェクト} -->`）'
    constraints: 英小文字で始まり、英小文字・数字・`-` だけ。`features` と記法のマーカー（`table`・`tabs`・`steps`・`section`・`row-detail`・`fig`・`toc`）と登録済みの拡張の `directive` は使用できない
    example: greet
    notes: 設定の `libraries` や図の部品のマーカー（`chart`・`param`・`er`）と、廃止した `flow`・`sequence` と同じ名前のときは、拡張を優先する。この名前で登録した拡張はそのまま動き、そのページではその名前の図の部品を描かず、廃止した図の範囲の警告も出さない
  - name: extension.load
    type: () => Promise<MdmarkExtensionModule>
    required: true
    location: argument
    description: 拡張のモジュールを読み込む関数。文書にマーカーがあるときだけ、`mount`・`update` が描くごとに 1 回呼ぶ
    example: () => import("/extensions/greet.js")
  - name: extension.schema
    type: StandardSchemaV1<MdmarkMarkArgs>
    required: false
    default: なし（引数を検査しない）
    location: argument
    description: '`{ options, definition }` を検査する Standard Schema。zod・valibot など、`~standard` を持つ検査ライブラリの schema をそのまま指定できる'
request_example: |-
  ```ts
  import { registerExtension } from "https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.2.0/dist/index.js";
  import * as v from "valibot";

  registerExtension({
    name: "greet",
    directive: "greet",
    load: () => import("/extensions/greet.js"),
    schema: v.object({
      options: v.object({ target: v.pipe(v.string(), v.regex(/^[a-z]+$/)) }),
    }),
  });
  ```
response:
  - name: '-'
    type: void
    description: 戻り値は無い
exceptions:
  - name: なし（正常終了）
    condition: 拡張を登録表に追加する
  - name: なし（記載の警告）
    condition: '`mount`・`update` で、マーカーの引数が JSON のオブジェクトでない、`schema` に合わない、または範囲の部品の定義を JSON として読み込めない'
    notes: 例外を投げず、そのマーカーの場所だけを記載の警告に替える
  - name: なし（通知ブロック）
    condition: '`mount`・`update` で、`load` が拒否されるか `draw` が例外を投げる'
    notes: 例外を投げず、そのマーカーの場所だけを通知ブロックに替える
  - name: なし（通知ブロック・検査の失敗）
    condition: '`mount`・`update` で、`schema` の `validate` が例外を投げるか拒否される'
    notes: 例外を投げず、`load` を呼ばずに、そのマーカーの場所だけを通知ブロックに替える
  - name: TypeError
    condition: '`name` が空、`directive` がマーカーの名前の書式に合わない、`load` が関数でない、または `schema` が `~standard` を持たない'
    notes: 登録しない。メッセージに合わない項目の名前を含める
  - name: Error（名前の重なり）
    condition: '`directive` が `features`・記法のマーカー、または登録済みの拡張の `directive` と同じ'
    notes: 登録しない。ビューのマーカー `view` も記法のマーカーとして予約する。メッセージに重なった名前を含める
constraints:
  - item: マーカーの引数の構造
    constraint: '`MdmarkMarkArgs` は `{ options: Record<string, unknown>; definition?: unknown }`。`options` はマーカーの名前の後ろの JSON のオブジェクト（真偽・数・配列・オブジェクトの型を保つ。引数の無いマーカーは `{}`）。引数が `{` で始まらない（今の書き方の）拡張のマーカーは `MdmarkMarkArgs` を作らず、記載の警告に替える（インターフェース定義『文書をHTML文字列にする』の制約「マーカーの場所の要素」）。マーカーを範囲（`<!-- {directive}: {JSON のオブジェクト} -->` 〜 `<!-- /{directive} -->`）で記載し、範囲に言語 `json` のコードブロックを 1 つ配置したときは、その JSON を読み込んだ値を `definition` に入れる（範囲が無いマーカーでは持たない）。`schema` の検査と `draw` は同じ値を受け取る'
  - item: 拡張のモジュールの構造
    constraint: '`draw(slot: HTMLElement, value: MdmarkMarkArgs): void | Promise<void>` を名前付きで export する。`slot` はマーカーの場所の要素'
  - item: 引数の検査
    constraint: '`schema` を持つ拡張のマーカーは、`mount`・`update` が `load` の前に `schema["~standard"].validate(value)` を呼んで待つ。結果が `issues` を持つときは `load` を呼ばず、マーカーの場所を記載の警告に替える。警告の項目は issue ごとに 1 つで、`path` の要素は `{ key }` のオブジェクトなら `key` を読み込む。`path` が `options` とキーまで届く issue は `options` の後ろのキーを `.`（配列の要素は `[位置]`）でつないだ `{キーのパス}: {message}`、`definition` の中まで届く issue は `definition.{キーのパス}: {message}`、`path` が無いか `options`・`definition` で止まる issue は `{message}` だけの項目にする。`validate` が例外を投げるか拒否されるときは、`load` を呼ばず、`load` の失敗と同じ通知ブロックに替え、`name` と元のエラーを `console.error` に出す。`render` は検査しない'
    notes: 警告の文言は画面設計『文書』
  - item: Standard Schema の確認
    constraint: zod 4.6.7 と valibot 1.5.0 の schema の `~standard.validate` が、合わない値に `issues`（`message` と `path`）を、合う値に `value` を返却することを確認した（2026-10-14）
    notes: 知らないキーを許さないときは、valibot の `strictObject`・zod の `z.strictObject` を使用する。仕様は https://standardschema.dev/
  - item: 読み込み
    constraint: 同じ文書の同じ拡張のマーカーは 1 回だけ `load` を呼ぶ。読み込みの間は外部ライブラリのマーカーと同じ読み込み中のマーカーの場所を配置する。通知ブロックはタイトル `この図を表示できません`、本文 `表示に使用する拡張（{name}）を読み込めませんでした。ネットワークにつながっているかを確認して、ページを再読み込みしてください。` で、`name` と元のエラーを `console.error` に出す
  - item: 型の配布
    constraint: '`registerExtension`・`MdmarkExtension`・`MdmarkExtensionModule`・`MdmarkMarkArgs`・`StandardSchemaV1` を `dist/index.d.ts` に書き出す。`StandardSchemaV1` は仕様の型を複製し、mdmark は検査ライブラリに依存しない'
  - item: 部品の定義の誤り
    constraint: 拡張のマーカーの範囲に `json` のコードブロックが 2 つ以上あるか、JSON として読み込めないときは、`schema` の検査も `load` も呼ばず、マーカーの場所を記載の警告に替える。警告には拡張の名前と、JSON として読み込めないときは読み込めなかった行と、2 つ以上あるときはコードブロックの数を記載する（文言は `{マーカー} の範囲に json のコードブロックが {数} つあります。部品の定義は 1 つだけ配置してください。拡張 {名前} の部品は描いていません。`）。定義の中身の構造は拡張の `schema` が確認する
    notes: 警告の文言は画面設計『文書』
  - item: 拡張のモジュールから使用する部品
    constraint: 拡張の `draw` は、配布物が出す `mountView`・`mountComments` を `slot` に対して呼んで、マーカーの場所に mdmark の部品を描ける。`draw` が部品の Promise を待つと、`mount` はその後にマーカーの場所を描き終えたものとして扱う。`update`・`destroy` でマーカーの場所を片付けるとき、その中の部品の `destroy` も行う
    notes: docs/interface/IF-472-30.ts・docs/interface/IF-472-27.ts
