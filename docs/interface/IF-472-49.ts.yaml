id: IF-472-49
visibility: internal
title: 文書をMarkdownに書き出す
lead: 文書の作成者が mdmark の文書を 1 つ、純粋な Markdown と、`chart`・`param`・埋め込んだ HTML ごとの SVG のファイルに書き出す。書き出したファイルはほかのファイル・URL を参照せず、mdmark の無い表示で読み取れる。
entry:
  kind: operation
  value: '`mdmark export-markdown {文書} [--out {フォルダ}] [--config {設定ファイル}]`（CLI。`npx github:shuhei1101/mdmark#v{バージョン} export-markdown` で呼ぶ）'
idempotent: true
side_effects: 出力のフォルダに Markdown と `images/` の SVG を書き込む（同じ名前のファイルは上書きし、`images/` は書き出した SVG だけにする）
callers:
  - SC-472-101#scenarios[正常シナリオ]
  - SC-472-103#scenarios[正常シナリオ（点検してから CLI で書き出す）]
request:
  - name: '{文書}'
    type: string
    required: true
    location: argument
    description: 書き出す Markdown のパス
  - name: --out
    type: string
    required: false
    location: argument
    default: なし（文書と同じフォルダの `{名前}-markdown/`。`{名前}` は文書のファイル名から `.mark.md`・`.md` を除いたもの）
    description: 書き出すフォルダのパス。無ければ作る
  - name: --config
    type: string
    required: false
    location: argument
    default: なし（`mdmark export` と同じく、端末の設定と文書のフォルダから上の `mdmark.config.yaml` を重ねる）
    description: 使用する設定ファイルのパス
response:
  - name: 標準出力
    type: string
    description: 書き出した Markdown のパスと SVG の数を 1 行
  - name: 標準エラー
    type: string
    description: 取り除いた中身の警告（`toPureMarkdown` の `warnings` と、読み込めない画像・拡張）を 1 件 1 行。終了コード 1 のときは原因と修正方法
  - name: 終了コード
    type: 0 | 1
    description: 書き出せたら 0、それ以外は 1
  - name: 出力の Markdown
    type: ファイル
    description: '`{出力のフォルダ}/{名前}.md`。`toPureMarkdown` の `markdown`'
  - name: 出力の SVG
    type: ファイル
    description: '`{出力のフォルダ}/images/figure-{番号}.svg`。番号は `figure.index`'
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
  - name: 設定ファイルの誤り（終了コード 1）
    condition: 設定ファイルが無い・読み込めない・Schema に合わない
    notes: '`mdmark export` と同じ文を標準エラーに出す'
  - name: 文書を読み込めない（終了コード 1）
    condition: '`{文書}` のファイルが無い・読み込めない'
  - name: 出力先へ書き込めない（終了コード 1）
    condition: 出力のフォルダのパスがファイルを指す、または作れない・書き込めない
    notes: 標準エラーに書き込めないパスと修正方法（`--out` で別のフォルダを指定する）を出す
constraints:
  - item: 変換
    constraint: '`toPureMarkdown` で変換し、`opts.figure` に SVG を作って画像のリンクを返却する関数を指定する。設定の `extensions` の拡張を登録してから変換する'
  - item: 図の場所の Markdown
    constraint: '`chart`・`param` は、タイトルの太字の行・画像のリンク・凡例の系列の名前の箇条書き（系列が 2 つ以上のとき）にする。埋め込んだ HTML は画像のリンクだけにする。画像のリンクは出力の Markdown からの相対パス `images/figure-{番号}.svg`、代替の文字はタイトル（無ければ `図 {番号}`）'
  - item: SVG の作り方
    constraint: '`figure.html` の図の部品の SVG を取り出し、埋め込んだ HTML は `foreignObject` に包む。配布物の CSS のうち図の中のクラスとタグに該当する規則だけを、明るい配色の値で SVG の `style` に埋め、不透明の背景を敷く'
    notes: PoC 検証の結果（docs/pr/700/ライブラリ本体.md の PoC 結果）
  - item: SVG の参照
    constraint: SVG の `href`・`src`・`url(` は `data:` と SVG の中の `#` で始まる参照だけにする。埋め込んだ HTML の相対パスの画像は `data:` の URL で埋め、`https` の画像は取り除いて警告に出す
  - item: 外部への要求
    constraint: 書き出しの間に外へネットワークの要求をしない
  - item: 書き込みの順
    constraint: 変換と SVG を全て作ってから書き込む。出力のフォルダへ書き込めないと分かったら、何も書き込まずに終了コード 1 で終える
  - item: 動く Node のバージョン
    constraint: '`mdmark export` と同じ'
flows:
  - name: 正常系
    summary: 記法を持つ文書を Markdown と SVG に書き出す
    setup:
      - name: 記法を持つ文書
        description: '`guide.mark.md`。『文書をMarkdownに書き出す』の正常シナリオと同じ記法と、`chart`・`param`・埋め込んだ HTML を 1 つずつ持つ'
      - name: Mock
        description: 差し替える依存は無い。外へのネットワークの要求を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力のフォルダ
        W->>C: export-markdown guide.mark.md
        C->>C: 純粋な Markdown と SVG を作る
        C->>F: guide.md と images/figure-1〜3.svg を書き込む
        C-->>W: 書き出したパス・終了コード 0
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0 で、`guide-markdown/guide.md` と `guide-markdown/images/figure-1.svg`〜`figure-3.svg` がある
      - '`guide.md` に `<!--` が 0 件で、画像のリンクが `images/figure-1.svg`〜`figure-3.svg` を指す'
      - '`chart` の場所が、タイトルの太字の行・画像のリンク・系列の名前の箇条書きになっている'
      - SVG の `href`・`src`・`url(` の値に、`data:` と `#` で始まる参照のほかが 0 件
      - 外へのネットワークの要求が 0 件
    test: test_normal
  - name: 正常系（書き出せない中身を持つ埋め込んだ HTML）
    summary: 範囲のスクリプトと https の画像を取り除き、相対パスの画像を埋めて警告を出す
    setup:
      - name: 書き出せない中身を持つ文書
        description: '`html-scripts` をオンにした文書に、範囲の `ts` を持つ埋め込んだ HTML と、`mdmark-chart`・相対パスの画像・`https` の画像を含む埋め込んだ HTML を 1 つずつ持つ'
      - name: Mock
        description: 差し替える依存は無い。外へのネットワークの要求を記録する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark CLI
        participant F as 出力のフォルダ
        W->>C: export-markdown
        C->>C: 範囲のスクリプトと https の画像を取り除き、相対パスの画像を埋める
        C->>F: Markdown と SVG を書き込む
        C-->>W: 警告・終了コード 0
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0 で、標準エラーに範囲のスクリプトを除いた場所と、取り除いた `https` の画像の URL が 1 件ずつ出る
      - '`mdmark-chart` を含む範囲の SVG は、グラフ・タイトル・凡例を描き、図のパネルのボタンと高さのハンドルを描かない'
      - 相対パスの画像が SVG の中に `data:` の URL で埋まっている
      - 外へのネットワークの要求が 0 件
    test: test_normal_when_unexportable_contents
  - name: 正常系（拡張のマーカー）
    summary: 設定の拡張の書き出しのフックを呼び、フックの無い拡張のマーカーを取り除く
    setup:
      - name: 拡張を記載した設定
        description: '`extensions` に、書き出しのフックを持つ拡張と持たない拡張を 1 つずつ記載した設定と、2 つのマーカーを持つ文書'
      - name: Mock
        description: 書き出しのフックは、マーカーの JSON のオブジェクトの `target` を太字にした行を返却する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark CLI
        participant X as 拡張の toMarkdown
        participant F as 出力のフォルダ
        W->>C: export-markdown
        C->>C: 設定の extensions の拡張を登録する
        C->>X: options・definition
        X-->>C: Markdown の文字列
        C->>F: Markdown を書き込む
        C-->>W: 終了コード 0
      ```

      <!-- /map -->
    expected:
      - フックを持つ拡張のマーカーの場所に、フックが返却した太字の行がある
      - フックを持たない拡張のマーカーと範囲の定義が残っていない
      - マーカーの前後の段落が残っている
    test: test_normal_when_extension_marks
  - name: 異常系（文書が無い・終了コード 1）
    summary: 無い文書は何も書き込まずに終了コード 1 で終える
    setup:
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark CLI
        W->>C: export-markdown missing.md
        C-->>W: 無いパス・終了コード 1
      ```

      <!-- /map -->
    expected:
      - 終了コードが 1 で、標準エラーに `missing.md` が出る
      - '`missing-markdown/` が作られていない'
    test: test_error_when_file_missing
  - name: 異常系（出力先へ書き込めない・終了コード 1）
    summary: 出力のフォルダのパスがファイルを指すとき、何も書き込まずに修正方法を出す
    setup:
      - name: 書き込めない出力先
        description: '`--out` が既にあるファイルを指す'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark CLI
        W->>C: export-markdown --out ファイル
        C-->>W: 書き込めないパスと修正方法・終了コード 1
      ```

      <!-- /map -->
    expected:
      - 終了コードが 1
      - 標準エラーに書き込めなかったパスと `--out` で別のフォルダを指定することが出る
      - Markdown と SVG のファイルがどこにも書き込まれていない
    test: test_error_when_output_unwritable
