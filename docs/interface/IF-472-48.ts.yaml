id: IF-472-48
visibility: internal
title: 文書を純粋なMarkdownにする
lead: 利用側（CLI・MCP の書き出しとビュワーのボタン）が、画面を持たずに mdmark の文書を純粋な Markdown（GFM と Mermaid）にする。`chart`・`param`・埋め込んだ HTML は、指定した関数が返す Markdown に置き換えるか取り除く。
entry:
  kind: operation
  value: '`toPureMarkdown(markdown, opts)`（配布物 `dist/index.js` の公開関数）'
idempotent: true
side_effects: なし（ファイル・画面・外部へ書き込まず、拡張のモジュール（`load`）も読み込まない）
callers:
  - SC-472-101#scenarios[正常シナリオ]
  - SC-472-102#scenarios[正常シナリオ（コピーする）]
request:
  - name: markdown
    type: string
    required: true
    location: argument
    description: 純粋な Markdown にする mdmark の文書
  - name: opts.config
    type: MdmarkConfig
    required: false
    location: argument
    default: なし（全ての機能をオンとして変換する）
    description: '`render` の `opts.config` と同じ。この操作が読み込むのは `features`。オフの機能の記法は変換せずに元の文字のまま残すが、マーカー（HTML のコメント）は取り除く'
  - name: opts.index
    type: MdmarkIndex
    required: false
    location: argument
    default: なし（文書間のリンクと用語を解かない）
    description: '`render` の `opts.index` と同じ'
  - name: opts.docId
    type: string
    required: false
    location: argument
    default: なし
    description: '`render` の `opts.docId` と同じ'
  - name: opts.includes
    type: Record<string, string>
    required: false
    location: argument
    default: なし（取り込みのマーカーを取り除く）
    description: '`render` の `opts.includes` と同じ。取り込む文書の本文を、取り込みのマーカーの場所へ純粋な Markdown にして入れる'
  - name: opts.figure
    type: '(figure: MdmarkFigure) => string | undefined | Promise<string | undefined>'
    required: false
    location: argument
    default: なし（`chart`・`param`・埋め込んだ HTML を取り除く）
    description: '`chart`・`param`・埋め込んだ HTML ごとに呼び、返した Markdown をその場所に入れる関数。`undefined` を返した図は取り除く'
    notes: CLI と MCP は SVG のファイルを書き込んで画像のリンクを返す関数を指定し、ビュワーのボタンは指定しない
  - name: figure.kind
    type: '"chart" | "param" | "html"'
    required: true
    location: argument
    description: '`opts.figure` が受ける図の種類（`html` は埋め込んだ HTML）'
  - name: figure.index
    type: number
    required: true
    location: argument
    description: '`opts.figure` が受ける、文書の中で何番目の図か（1 から）'
  - name: figure.html
    type: string
    required: true
    location: argument
    description: '`opts.figure` が受ける、`render` がその図に返す HTML 文字列。埋め込んだ HTML は、範囲のスクリプト（`ts`・`js`）を除いた HTML'
  - name: figure.title
    type: string | undefined
    required: false
    location: argument
    description: '`opts.figure` が受ける `chart`・`param` のタイトル'
  - name: figure.legend
    type: string[]
    required: false
    location: argument
    description: '`opts.figure` が受ける `chart`・`param` の凡例の系列の名前の並び（`param` は今の値と既定の値）'
request_example: |-
  ```js
  const { markdown, warnings } = await toPureMarkdown(source, {
    config,
    figure: async (f) => `![${f.title ?? "図"}](images/figure-${f.index}.svg)`,
  });
  ```
response:
  - name: markdown
    type: string
    description: 純粋な Markdown。HTML のコメントと生の HTML を含まない
  - name: warnings
    type: string[]
    description: 取り除いた中身（範囲のスクリプト・`https` の画像・書き出しのフックの無い拡張のマーカー）と場所（元の行番号）の文
response_notes: |-
  > [!NOTE]
  > 同じ `markdown`・`opts` では同じ `markdown` を返す。`opts.figure` は文書の中の順に 1 回ずつ呼ぶ。
exceptions:
  - name: なし（正常終了）
    condition: 変換できた
  - name: TypeError
    condition: '`markdown` が文字列でない、または `opts.figure` が関数でない'
  - name: なし（書き出しのフックが例外を送出する）
    condition: 拡張の `toMarkdown` が例外を送出するか、文字列でない値を返却する
    notes: そのマーカーを取り除き、`warnings` に拡張の名前と場所を入れる
constraints:
  - item: HTML のコメント
    constraint: マーカーを含め、HTML のコメントを全て取り除く。マーカーで囲んだ範囲の中身（表・タブ・ステップ・セクション・行の詳細・用語集の表・ビュー）は残す
  - item: 生の HTML
    constraint: 本文の生の HTML（ブロックと行内のタグ）を取り除く。タグの中の文字は残さない
  - item: 注意書き
    constraint: GitHub の注意書きの記法（`> [!NOTE]` など）のまま残す。タイトルを付けた注意書きは、タイトルを最初の行の太字にする
  - item: タブ
    constraint: タブ名の見出しと中身を残す
  - item: ファイルツリー
    constraint: 言語 `tree` のコードブロックのまま残し、言語を外す
  - item: バッジ
    constraint: 頭の `badge:` を取り除いた行内のコードにする
  - item: コードブロック
    constraint: 飾りのマーカーと行末の `[!code …]` を取り除き、タイトルを直前の太字の行にする
  - item: 図と表の番号
    constraint: 番号を出すリンクの文字を `図 1`・`表 1` にし、リンク先を図・表の見出しのアンカーにする
  - item: 目次
    constraint: 目次のマーカーを、h2〜h3 の見出しへのリンクの箇条書きにする。リンク先は GitHub の見出しのアンカーの付け方で作る
  - item: map の範囲
    constraint: Mermaid のコードブロックだけを残し、補足（`map-data` と注記）を取り除く
  - item: chart・param・埋め込んだ HTML
    constraint: '`opts.figure` が返す Markdown に置き換える。指定が無いか `undefined` を返したら取り除く。`chart`・`param` のタイトルと凡例は `opts.figure` の返す Markdown に含めず、呼ぶ側が決める'
  - item: 拡張のマーカー
    constraint: 登録した拡張が書き出しのフック（`registerExtension` の `toMarkdown`）を持てば、その戻り値をマーカーの場所に入れる。持たなければマーカーと範囲の定義を取り除き、`warnings` に入れる。拡張のモジュール（`load`）は読み込まない
    notes: フックの入出力はインターフェース定義『拡張を登録する』
  - item: そのほかの記法
    constraint: 色の名前・アイコン・キー・ルビ・蛍光ペン・脚注・注記・画像の属性・カードなど mdmark だけの書き方は、mdmark の無い表示で読める文字（ルビは親文字、キーはキーの名前の行内のコード、カードはリンク、画像は属性 `{…}` を除いた画像）だけを残す。注記は GFM の脚注（`[^note-{ID}]`）にし、GFM の脚注はそのまま、行内の脚注 `^[中身]` は `（中身）` にする
  - item: フロントマター
    constraint: そのまま残す
  - item: 動く環境
    constraint: ブラウザと Node の両方で動き、DOM を使用しない
flows:
  - name: 正常系
    summary: 記法を持つ文書を純粋な Markdown にし、図を取り除く
    setup:
      - name: 記法を持つ文書
        description: 『文書をMarkdownに書き出す』の正常シナリオと同じ記法と、`script`・`div` の生の HTML を持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as toPureMarkdown
        C->>IF: markdown
        IF-->>C: markdown・warnings
      ```

      <!-- /map -->
    expected:
      - '`markdown` に `<!--` が 0 件で、`script`・`div` のタグが残っていない'
      - 目次が見出しへのリンクの箇条書き、番号を出すリンクの文字が `表 1` になっている
      - map の範囲は Mermaid のコードブロックだけが残っている
      - '`chart`・`param`・埋め込んだ HTML の場所に、画像のリンクも定義の JSON も残っていない'
      - '`warnings` が空'
    test: test_normal
  - name: 正常系（図を置き換える関数を指定する）
    summary: '`opts.figure` が返す Markdown を図の場所に入れる'
    setup:
      - name: 図を持つ文書
        description: '`chart`・`param`・埋め込んだ HTML を 1 つずつ持つ文書'
      - name: Mock
        description: '`opts.figure` は、受けた `kind` と `index` を持つ画像のリンクを返す関数'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as toPureMarkdown
        C->>IF: markdown・opts.figure
        IF->>C: figure（chart・param・html の順）
        C-->>IF: 画像のリンク
        IF-->>C: markdown
      ```

      <!-- /map -->
    expected:
      - '`opts.figure` が 3 回、文書の順に `index` 1〜3 で呼ばれる'
      - '`chart`・`param` の呼び出しの `title`・`legend` が、定義のタイトルと系列の名前（`param` は今の値と既定の値）'
      - '`markdown` の図の場所に、関数が返した画像のリンクがある'
    test: test_normal_when_figure_given
  - name: 正常系（拡張のマーカー）
    summary: 書き出しのフックを持つ拡張はその戻り値に、持たない拡張は取り除く
    setup:
      - name: 拡張
        description: 書き出しのフックを指定した拡張と指定しない拡張を `registerExtension` で登録する。どちらの `load` も呼ばれたら記録する
      - name: Mock
        description: 書き出しのフックは、マーカーの JSON のオブジェクトの `target` を太字にした行を返す
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as toPureMarkdown
        participant X as 拡張の toMarkdown
        C->>IF: markdown
        IF->>X: options・definition
        X-->>IF: Markdown の文字列
        IF-->>C: markdown・warnings
      ```

      <!-- /map -->
    expected:
      - フックを持つ拡張のマーカーの場所に、フックが返した太字の行がある
      - フックを持たない拡張のマーカーと範囲の定義が残っていない
      - '`warnings` に、フックを持たない拡張の名前とマーカーの行番号が 1 件ある'
      - どちらの拡張の `load` も呼ばれていない
    test: test_normal_when_extension_marks
  - name: 正常系（書き出せない中身を持つ埋め込んだ HTML）
    summary: 範囲のスクリプトを除いた HTML を `opts.figure` に渡し、取り除いたことを警告に入れる
    setup:
      - name: 範囲のスクリプトを持つ文書
        description: '`html-scripts` をオンにし、範囲の `ts` を持つ埋め込んだ HTML を 1 つ持つ文書'
      - name: Mock
        description: '`opts.figure` は受けた `html` を記録する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as toPureMarkdown
        C->>IF: markdown・opts.figure
        IF->>C: figure（スクリプトを除いた html）
        IF-->>C: markdown・warnings
      ```

      <!-- /map -->
    expected:
      - 記録した `html` に `script` 要素と範囲の `ts` の中身が無い
      - '`warnings` に範囲のスクリプトを除いた場所が 1 件ある'
    test: test_normal_when_unexportable_contents
  - name: 異常系（文字列でない文書・TypeError）
    summary: '`markdown` が文字列でなければ変換せずに TypeError を送出する'
    setup:
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as toPureMarkdown
        C->>IF: markdown（null）
        IF-->>C: TypeError
      ```

      <!-- /map -->
    expected:
      - 返した Promise が `TypeError` で reject される
    test: test_error_when_markdown_not_string
refs:
  - IF-472-34#
  - IF-472-32#
