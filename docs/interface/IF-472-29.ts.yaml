id: IF-472-29
visibility: internal
title: "バージョンを返却する"
entry:
  kind: operation
  value: '`version()`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 配布物を読み込んだページで公開関数を呼び、埋めたバージョンと CSS 変数が一致する
    setup:
      - name: バージョンを埋めてビルドした配布物
        description: '`v0.0.1` を埋めてビルドした `dist/index.js` と `dist/index.css`'
      - name: Mock
        description: 差し替える依存は無い（手元で配信した配布物をブラウザで読み込む）
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant L as ライブラリ本体
        P->>L: version()
        L-->>P: "v0.0.1"
    expected:
      - 戻り値が `v0.0.1`
      - ルート要素の `--mdmark-version` の計算値が `"v0.0.1"`
    test: test_normal
lead: 利用側のページが、読み込んだ配布物のバージョンを取る。配布物の CSS は同じバージョンを `--mdmark-version` で持つ。
idempotent: true
side_effects: なし
callers:
  - SC-472-28#
response:
  - name: '-'
    type: string
    description: ビルドで埋めたバージョン
    format: '`v{MAJOR}.{MINOR}.{PATCH}`'
    example: v0.0.1
exceptions:
  - name: なし（正常終了）
    condition: 常に埋めたバージョンを返却する
test_file: tests/integration/lib/version.browser.test.ts
