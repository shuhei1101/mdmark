id: IF-472-50
visibility: internal
title: 文書をMarkdownに書き出す
lead: '`mdmark export-markdown` と同じ処理で、mdmark の文書を 1 つ、純粋な Markdown と SVG のファイルに書き出し、書き出したパスを返却する。'
entry:
  kind: mcp_tool
  value: export_markdown
idempotent: true
side_effects: 出力のフォルダに Markdown と `images/` の SVG を書き込む（`mdmark export-markdown` と同じ）
callers:
  - SC-472-3#scenarios[正常シナリオ（Markdown に書き出す）]
request:
  - name: file
    type: string
    required: true
    location: argument
    description: 書き出す Markdown のパス（`project_dir` からの相対パスか絶対パス）
  - name: out
    type: string
    required: false
    location: argument
    default: なし（`mdmark export-markdown` と同じく、文書と同じフォルダの `{名前}-markdown/`）
    description: 書き出すフォルダのパス
  - name: config
    type: string
    required: false
    location: argument
    default: なし（`export_html` と同じく重ねた設定）
    description: 使用する設定ファイルのパス
  - name: project_dir
    type: string
    required: true
    location: argument
    description: 作業のフォルダの絶対パス。プラグインの PreToolUse のフックが `CLAUDE_PROJECT_DIR` の値を入れる
    constraints: 絶対パスで、そのフォルダがある
    notes: '`tools/list` の `inputSchema` には出さず、サーバーの引数の検査だけが必須にする'
request_example: |-
  ```json
  {"file": "docs/guide.mark.md"}
  ```
response:
  - name: out
    type: string
    description: 書き出した Markdown の絶対パス
  - name: images
    type: string[]
    description: 書き出した SVG の絶対パスの並び（文書の中の順）
  - name: warnings
    type: string[]
    description: '`mdmark export-markdown` が標準エラーに出す警告の文'
response_example: |-
  ```json
  {"out": "/home/user/docs/guide-markdown/guide.md", "images": ["/home/user/docs/guide-markdown/images/figure-1.svg"], "warnings": []}
  ```
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
  - name: ツールのエラー（文書が無い）
    condition: '`file` のファイルが無い'
    notes: 設定ファイルの誤りと出力先へ書き込めないときも、`mdmark export-markdown` が終了コード 1 で終わるときと同じ文でエラーにする
  - name: ツールのエラー（作業のフォルダが無い）
    condition: '`project_dir` が無い、絶対パスでない、またはそのフォルダが無い'
    notes: '`export_html` と同じ文でエラーにする'
error_format: 'ツールの結果を `isError: true` にし、内容のテキストに `mdmark export-markdown` が標準エラーに出すのと同じ文を書き込む。'
constraints:
  - item: CLI との一致
    constraint: 同じ文書・設定では、`mdmark export-markdown` と同じ中身の Markdown と SVG を書き込む
flows:
  - name: 正常系
    summary: 文書を Markdown と SVG に書き出してパスを返却する
    setup:
      - name: 作業のフォルダ
        description: 設定と、目次のマーカーと `chart` を 1 つ持つ文書 `guide.mark.md`
      - name: Mock
        description: Claude Code の代わりに、起動した常駐サーバーへ HTTP でつなぐ MCP のクライアント。`project_dir` に作業のフォルダの絶対パスを入れて呼ぶ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: export_markdown（file: guide.mark.md）
        S->>F: 文書と設定を読み込む
        S->>F: guide-markdown/guide.md と SVG を書き込む
        S-->>C: out・images・warnings
      ```

      <!-- /map -->
    expected:
      - '`out` が `guide-markdown/guide.md` の絶対パスで、そのファイルがある'
      - '`images` が `guide-markdown/images/figure-1.svg` の絶対パス 1 件'
      - 同じ文書で実行した `mdmark export-markdown` の Markdown と SVG と中身が同じ
    test: test_normal
  - name: 異常系（文書が無い・ツールのエラー）
    summary: 無い文書は何も書き込まずにエラーにする
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: export_markdown（file: missing.md）
        S-->>C: isError（無いパス）
      ```

      <!-- /map -->
    expected:
      - '`isError` が立つ'
      - 内容に `missing.md` が出る
      - '`missing-markdown/` が作られていない'
    test: test_error_when_file_missing
  - name: 異常系（作業のフォルダが無い・ツールのエラー）
    summary: '`project_dir` を持たない呼び出しを、作業のフォルダを読み込まずにエラーにする'
    setup:
      - name: Mock
        description: 起動した常駐サーバーへ HTTP でつなぐ MCP のクライアント。`project_dir` を入れずに呼ぶ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: export_markdown（project_dir なし）
        S-->>C: isError（project_dir が無いこととプラグインから呼ぶこと）
      ```

      <!-- /map -->
    expected:
      - '`isError` が立つ'
      - 内容の文に `project_dir` と、プラグインを入れたセッションから呼ぶことが出る
    test: test_error_when_project_dir_missing
refs:
  - IF-472-49#
  - IF-472-9#
test_file: tests/integration/ClaudeCodeプラグイン/export-markdown.test.ts
tags:
  - name: topic:書き出し
    main: true
  - name: topic:markdown
  - name: tool:mcp
read_only: false
destructive: true
