id: IF-472-39
visibility: internal
title: "設定と索引を点検する"
entry:
  kind: operation
  value: '`mdmark check [--config {設定ファイル}] [--base {git の ref} | --text {Markdown} | --file {ファイル} --key {YAML のキー}]`（CLI。`npx github:shuhei1101/mdmark#v{バージョン} check` で呼ぶ）'
flows:
  - name: 正常系
    summary: ずれの無いフォルダで 0 件を返却する
    setup:
      - name: ずれの無いフォルダ
        description: '`mdmark init` の雛形に拡張子が `.mark.md` の文書 2 つを追加し、索引に 2 つとも記載し、`build.include` が 2 つに該当するフォルダ'
      - name: Mock
        description: 差し替える依存は無い（CLI をそのフォルダで子プロセスとして実行する）
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を探して読み込み、Schema と build の対象を確認する
        C->>M: 索引・文書
        M-->>C: []
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が `ずれ 0 件` の 1 行
      - 設定・索引・文書が変わっていない
    test: test_normal
  - name: 正常系（ずれがある）
    summary: 索引と文書のずれと設定の Schema のずれを出し、終了コード 1 で終わる
    setup:
      - name: ずれを持つフォルダ
        description: 正常系のフォルダから文書 `old.md` を削除して索引には残し、設定の `build` から `out` を削除したフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C->>M: 索引・文書
        M-->>C: missing_doc のずれ
        C-->>W: ずれ 2 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:build: schema:` で始まり `build.out` を含む行がある'
      - 索引の `old.md` の行を指す `missing_doc` の行がある
      - 最後の行が `ずれ 2 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_drift
  - name: 正常系（build の対象が 0 件）
    summary: '`build.include` がどの文書にも該当しないと `no_documents` を出す'
    setup:
      - name: 該当しない include
        description: 正常系のフォルダで、`build.include` をどのファイルにも該当しない glob にしたもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: include に該当する文書が 0 件
        C-->>W: no_documents の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:build.include: no_documents:` で始まる行がある'
    test: test_normal_when_no_documents
  - name: 異常系（設定ファイルが無い・終了コード 1）
    summary: 設定ファイルが見つからないと、`mdmark init` で配置できることを示して終わる
    setup:
      - name: 設定ファイルの無いフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い一時フォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 今のフォルダから上へ設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `mdmark.config.yaml` が無いことと `mdmark init` が出る
    test: test_error_when_config_missing
  - name: 異常系（設定ファイルを読み込めない・終了コード 1）
    summary: YAML として読み込めない設定ファイルは、読み込めない行を示して終わる
    setup:
      - name: 壊れた設定ファイル
        description: 3 行目の字下げが崩れた `mdmark.config.yaml` を持つフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定ファイルを YAML として読み込めない
        C-->>W: ファイルと行と修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `mdmark.config.yaml` と 3 行目が出る
    test: test_error_when_config_unreadable
  - name: 正常系（知らないマーカーがある）
    summary: 文書の本文の知らないマーカーを、文書と行を指す `unknown_mark` の行にして終了コード 1 で終わる
    setup:
      - name: 知らないマーカーを持つフォルダ
        description: 正常系のフォルダの文書 `a.mark.md` の 3 行目に `<!-- tabz -->` を記載し、同じ文書の `markdown` のコードブロックの中にも `<!-- tabz -->` を記載したフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を探して読み込み、Schema と build の対象を確認する
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文から、知っているマーカーに該当しないマーカーを取得する
        C-->>W: unknown_mark の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`a.mark.md:3: unknown_mark:` で始まり `tabz` を含む行が 1 つだけある'
      - コードブロックの中の `<!-- tabz -->` を指す行が無い
      - 最後の行が `ずれ 1 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_mark
  - name: 正常系（今の書き方のマーカーがある）
    summary: 文書の今の書き方のマーカーを、文書と行を指す `legacy_mark` の行にして終了コード 1 で終わる
    setup:
      - name: 今の書き方のマーカーを持つフォルダ
        description: 'シナリオ『設定と索引を点検する』の「正常シナリオ（今の書き方のマーカーがある）」と同じ。`a.mark.md` の 3 行目に `<!-- table: data filter=名前 -->`、`b.mark.md` の 1 行目に `<!-- section: closed -->`、5 行目に拡張の `<!-- greet: 太郎 -->` を記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書のマーカーの引数を描く処理と同じ読み取りで読む
        C-->>W: legacy_mark の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`a.mark.md:3: legacy_mark:`・`b.mark.md:1: legacy_mark:`・`b.mark.md:5: legacy_mark:` で始まる行が 1 つずつあり、どれも `mdmark upgrade` を含む'
      - '`b.mark.md:5:` の行が、拡張のマーカーを描くときに描かないことを含む'
      - 最後の行が `ずれ 3 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_legacy_mark
    refs:
      - SC-472-78#scenarios[正常シナリオ（今の書き方のマーカーがある）]
  - name: 正常系（マーカーの設定にずれがある）
    summary: 文書のマーカーの知らないキー・型の誤り・削除した機能の列の設定を、文書と行を指す行にして終了コード 1 で終わる
    setup:
      - name: マーカーの設定のずれを持つフォルダ
        description: 'シナリオ『設定と索引を点検する』の「正常シナリオ（マーカーの設定にずれがある）」と同じ。`a.mark.md` の 1 行目に `<!-- code: {"title": "app.ts", "color": "red"} -->`、5 行目に `<!-- section: {"open": "no"} -->`、9 行目に `<!-- table: {"features": {"total": {"enabled": false}}, "columns": {"数量": {"total": [{"calc": "sum"}]}}} -->` を記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 文書のマーカーの引数をマーカーの JSON Schema で検証する
        C-->>W: ずれの行・終了コード 1
    expected:
      - 終了コードが 1
      - '`a.mark.md:1: unknown_mark_arg:` で始まり `color` を含む行、`a.mark.md:5: mark_option_invalid:` で始まり `open` を含む行、`a.mark.md:9: mark_option_unapplied:` で始まり `columns.数量.total` を含む行が 1 つずつある'
      - 最後の行が `ずれ 3 件`
    test: test_normal_when_mark_options_drift
    refs:
      - SC-472-78#scenarios[正常シナリオ（マーカーの設定にずれがある）]
  - name: 正常系（拡張と check.ignore のマーカー）
    summary: 拡張が登録したマーカーと `check.ignore` に記載した名前のマーカーは、ずれにしない
    setup:
      - name: 拡張と除外する名前を記載したフォルダ
        description: '`mdmark init` の雛形の拡張 `extensions/example.js`（`directive` が `greet`）を設定の `extensions` に記載し、設定の `check.ignore` に `prettier-ignore` を記載したフォルダ。文書 `a.mark.md` に `<!-- greet: {"name": "太郎"} -->` と `<!-- prettier-ignore -->` を記載する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を読み込み、拡張をまとめて読み込み directive を取る
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文のマーカーを知っているマーカーと突き合わせる
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が `ずれ 0 件` の 1 行
    test: test_normal_when_known_extension_and_ignored_mark
  - name: 正常系（拡張を読み込めない）
    summary: 読み込めない拡張を `schema` のずれにし、その拡張のマーカーを知らないマーカーとして出す
    setup:
      - name: 読み込めない拡張を記載したフォルダ
        description: 設定の `extensions` に、読み込みの時点で `HTMLElement` を継いだ custom element を定義するモジュール `extensions/broken.js`（既定の書き出しの `directive` は `broken`）を記載し、文書 `a.mark.md` の 3 行目に `<!-- broken -->` を記載したフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 拡張をまとめて読み込み、directive を取れない
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文のマーカーを知っているマーカーと突き合わせる
        C-->>W: schema と unknown_mark の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:extensions[0]: schema:` で始まり、元のエラー（`HTMLElement`）と `load` の中へ移す修正方法を含む行がある'
      - '`a.mark.md:3: unknown_mark:` で始まり `broken` を含む行がある'
    test: test_normal_when_extension_unloadable
  - name: 正常系（比べる基準を指定する）
    summary: --base との merge-base から片方だけが変わった change_together の組を出し、終了コード 1 で終わる
    setup:
      - name: 組で修正する文書を持つ git のフォルダ
        description: 正常系のフォルダで、索引の文書 `a`（`a.mark.md`）と `b`（`b.mark.md`）が互いを `change_together` で記載し、全てをコミットした git のリポジトリ。コミットにタグ `base` を付ける
      - name: 片方だけの変更
        description: タグの後に `a.mark.md` の本文だけを書き換えてコミットする
        notes: merge-base からの比較で、コミット済みの変更も数えることを発生させる
      - name: Mock
        description: 差し替える依存は無い（そのフォルダで CLI と git を子プロセスとして実行する）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant G as git
        participant M as checkIndex
        W->>C: mdmark check --base base
        C->>G: base と HEAD の merge-base から変わったファイルを参照する
        G-->>C: a.md
        C->>M: 索引・文書・changedPaths
        M-->>C: missed_change_together
        C-->>W: ずれ 1 行・終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '`b.mark.md: missed_change_together:` で始まり `a.mark.md` を含む行がある'
      - 最後の行が `ずれ 1 件`
      - 同じフォルダで `--base` を指定せずに実行すると、終了コード 0 で `ずれ 0 件`
      - 設定・索引・文書と git の履歴が変わっていない
    test: test_normal_when_base_given
  - name: 異常系（比べる基準を参照できない・終了コード 1）
    summary: merge-base を参照できない --base は、参照できないことと修正方法を示して終わる
    setup:
      - name: git のフォルダ
        description: 正常系（比べる基準を指定する）と同じ
      - name: 無い ref
        description: '`--base` に `no-such-ref` を指定する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant G as git
        W->>C: mdmark check --base no-such-ref
        C->>G: no-such-ref と HEAD の merge-base を参照する
        G-->>C: 参照できない
        C-->>W: 参照できないことと修正方法・終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `no-such-ref` と `fetch-depth` が出る
      - 設定・索引・文書が変わっていない
    test: test_error_when_base_unknown
  - name: 正常系（エイリアスにずれがある）
    summary: エイリアスの行とレコードのずれを出し、終了コード 1 で終わる
    setup:
      - name: エイリアスにずれを持つフォルダ
        description: '正常系のフォルダの設定に `aliases` の 3 行を加えたフォルダ。1 行目は `alias_type: term`・`paths: aliases/terms.yaml` で、`id`・`name` を持ち `description` が空のレコードを持つ YAML を配置する。2 行目は `alias_type: env`・`paths: aliases/servers.yaml` で、`id`・`name`・`url` を持つレコードを持つ YAML を配置する。3 行目は `alias_type: term`・`paths: missing/*.yaml` で、該当するファイルが無い'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant B as buildAliases
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C->>C: 行の paths を参照して YAML を読み込む
        C->>B: 行・読み込んだ中身
        B-->>C: alias_required_empty のずれ
        C-->>W: ずれ 2 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`alias_no_files` の行があり、内容に `missing/*.yaml` を含む'
      - '`term` のレコードの YAML の `description` を指す `alias_required_empty` の行がある'
      - '`env` のレコードを指すずれの行が無い'
      - 最後の行が `ずれ 2 件`
      - 設定・エイリアスの YAML が変わっていない
    test: test_normal_when_alias_drift
  - name: 正常系（知らないテーマの名前がある）
    summary: 設定の `colorTheme` の知らない名前を `unknown_color_theme` のずれで出し、終了コード 1 で終わる
    setup:
      - name: 知らないテーマの名前を記載したフォルダ
        description: '正常系のフォルダの設定に `colorTheme: sepia` を記載したフォルダ'
      - name: 選べるテーマの名前を記載したフォルダ
        description: '正常系のフォルダの設定に `colorTheme: theme-slate` を記載したフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C->>C: colorTheme を入っているテーマの名前と照らす
        C-->>W: unknown_color_theme の 1 行・終了コード 1
    expected:
      - 知らない名前のフォルダで、終了コードが 1
      - '`mdmark.config.yaml:colorTheme: unknown_color_theme:` で始まる行が 1 つだけあり、内容に `sepia` と `dev-swiss`・`theme-paper`・`theme-slate`・`theme-contrast` を含む'
      - 最後の行が `ずれ 1 件`
      - 選べる名前のフォルダでは、終了コードが 0 で `unknown_color_theme` の行が無い
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_color_theme
  - name: 正常系（知らない明暗の値がある）
    summary: 設定の `colorScheme` の知らない値を `unknown_color_scheme` のずれで出し、終了コード 1 で終わる
    setup:
      - name: 知らない明暗の値のフォルダ
        description: '正常系のフォルダの設定に `colorScheme: sepia` を記載したフォルダ'
      - name: 記載できる値のフォルダ
        description: '正常系のフォルダの設定に `colorScheme: dark` を記載したフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark check
        W->>C: 知らない明暗の値のフォルダで mdmark check
        C->>C: colorScheme を記載できる値と照らす
        C-->>W: unknown_color_scheme の 1 行・終了コード 1
    expected:
      - '`mdmark.config.yaml:colorScheme: unknown_color_scheme:` で始まる行が 1 つだけあり、内容に `sepia` と `light`・`dark`・`auto` を含む'
      - 終了コードが 1
      - 記載できる値のフォルダでは、終了コードが 0 で `unknown_color_scheme` の行が無い
    test: test_normal_when_unknown_color_scheme
    refs:
      - SC-472-78#scenarios[正常シナリオ（知らない明暗の値がある）]
  - name: 正常系（見つからないファイルがある）
    summary: 文書からの相対パスにもアセットのルートにも無い画像・動画・音声・添付のファイルを `missing_file` のずれにする
    setup:
      - name: 見つからないファイルを持つフォルダ
        description: '`assets.root` が `assets` の設定と、`build.include` が該当する `docs/guide.mark.md`。`guide.mark.md` は、無い `images/missing.png`（3 行目）・`media/missing.mp4`（5 行目）・`media/missing.mp3`（7 行目）、リンクだけの段落 `[仕様書](files/missing.pdf)`（9 行目）、`assets/images/logo.png` にだけある `images/logo.png`、`https://example.com/a.png` を持つ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 文書の画像・動画・音声・添付のパスを、文書からの相対パスとアセットのルートで確認する
        C-->>W: missing_file の 4 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`docs/guide.mark.md:3: missing_file:`・`docs/guide.mark.md:5: missing_file:`・`docs/guide.mark.md:7: missing_file:`・`docs/guide.mark.md:9: missing_file:` で始まる行があり、内容にそれぞれ `images/missing.png`・`media/missing.mp4`・`media/missing.mp3`・`files/missing.pdf` を含む'
      - '`images/logo.png` と `https://example.com/a.png` を指す行が無い'
      - 最後の行が `ずれ 4 件`
      - 設定・文書が変わらず、書き出しのファイルが無い
    test: test_normal_when_files_missing
    refs:
