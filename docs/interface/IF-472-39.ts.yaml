lead: 文書の作成者が、設定ファイルの構造・索引と文書のずれ（`checkIndex`）・`build` の対象の有無・文書の本文にある知らないマーカー・文書が指す見つからないファイル・文書の図の部品の定義を点検し、ファイル・場所・種類・内容の一覧を受け取る。`--text` か `--file` と `--key` を指定したときは、設定と索引の点検の代わりに、指定した Markdown を描いたときの記載の警告と図の定義のずれを同じ一覧で受け取る。点検は設定・索引・文書を書き換えない。
idempotent: true
side_effects: なし（設定・索引・文書を書き換えない）
callers:
  - SC-472-78#
request:
  - name: --config
    type: string
    required: false
    default: 'なし（端末の設定と、今のフォルダから上のフォルダの `mdmark.config.yaml` を重ねる。インターフェース定義『設定を重ねて読み込む』を `purpose: export` で呼び、重ねた設定ファイルのそれぞれの構造を検めて、ずれの `file` にそのファイルを出す）'
    location: argument
    description: 使用する設定ファイルのパス
    example: docs/mdmark.config.yaml
  - name: --base
    type: string
    required: false
    default: なし（`change_together` の修正漏れを確認しない）
    location: argument
    description: 修正漏れの検査に比べる基準の git の ref。指定したときだけ、基準から変わった文書を `checkIndex` の `changedPaths` に指定する
    example: origin/develop
  - name: --text
    type: string
    required: false
    default: なし（設定と索引を点検する）
    location: argument
    description: 点検する Markdown の文字列。`-` を指定すると標準入力から読み込む
    constraints: '`--base`・`--file`・`--key` と一緒に指定できない'
    example: '-'
  - name: --file
    type: string
    required: false
    default: なし（設定と索引を点検する）
    location: argument
    description: Markdown をキーの値に持つ YAML のファイルのパス（今のフォルダからの相対パスか絶対パス）
    constraints: '`--key` と一緒に指定する。`--base`・`--text` と一緒に指定できない'
    example: records.yaml
  - name: --key
    type: string
    required: false
    default: なし
    location: argument
    description: '`--file` の YAML の中で点検する文字列の値のキーのパス。記載方法は索引のずれの場所と同じ（`.` でキーを、`[位置]` で配列の要素をたどる）'
    constraints: '`--file` と一緒に指定する'
    example: items[0].body
response:
  - name: 標準出力
    type: string
    description: 'ずれ 1 つを 1 行（`{ファイル}:{場所}: {種類}: {内容}`。場所が空のときは `{ファイル}: {種類}: {内容}`）で並べ、最後に `ずれ {件数} 件` の行を出す'
    notes: ファイルは設定ファイルのあるフォルダからの相対パス（`--text` のときは `-`、設定ファイルが無いときは今のフォルダからの相対パス）。`--text`・`--file` のときの並びは、場所の行の順（同じ行は描いたときの警告の順で、`unknown_mark`・`legacy_mark`・`unknown_mark_arg`・`mark_option_unapplied` は警告の後ろ、図の配置のずれはその後ろ）。並びは設定の `schema` → `unknown_color_theme` → `unknown_color_scheme` → `no_documents` → `checkIndex` が返却した並び → エイリアスのずれ（`buildAliases` が返却した並び。`alias_no_files`・`alias_unreadable` は読み込んだ行の順にその場所へ配置する） → `unknown_mark`・`legacy_mark`・`unknown_mark_arg`・`mark_option_unapplied`・`mark_option_invalid`（どれも文書のパスと行の順） → `missing_file` → `include_target_missing`・`include_circular`（どちらも文書のパスと行の順） → 図の点検のずれ（どれも文書のパスの順、同じ文書の中は行の順） → `plain_md_with_marks`（文書のパスの順）
  - name: 種類
    type: '''schema'' | ''unknown_color_theme'' | ''unknown_color_scheme'' | ''no_documents'' | ''missing_doc'' | ''orphan_doc'' | ''broken_ref'' | ''untyped_related'' | ''one_sided_change_together'' | ''related_link_overlap'' | ''missed_change_together'' | ''duplicate_term'' | ''avoided_term'' | ''alias_no_files'' | ''alias_unreadable'' | ''duplicate_alias_row_id'' | ''alias_records_missing'' | ''alias_field_missing'' | ''alias_unknown_type'' | ''alias_required_empty'' | ''duplicate_alias_id'' | ''unknown_mark'' | ''missing_file'' | ''include_target_missing'' | ''include_circular'' | ''diagram_invalid'' | ''diagram_node_overlap'' | ''diagram_node_overflow'' | ''diagram_wire_crosses_node'' | ''diagram_label_too_long'' | ''syntax_warning'' | ''unknown_mark_arg'' | ''legacy_mark'' | ''mark_option_unapplied'' | ''mark_option_invalid'' | ''plain_md_with_marks'''
    description: '`schema` は設定か索引が Schema に合わない（`build.glossary`・`build.entry` が `include` に該当しないもの・`aliases` の行の Schema のずれを含む）、`unknown_color_theme` は設定の `colorTheme` が mdmark に入っているテーマの名前のどれでもない、`unknown_color_scheme` は設定の `colorScheme` が `light`・`dark`・`auto` のどれでもない、`no_documents` は `build.include` に該当する文書が 0 件、`alias_no_files` は `aliases` の行の `paths` に該当するファイルが 0 件、`alias_unreadable` は `paths` に該当したファイルを YAML として読み込めない、`unknown_mark` は文書の本文に知っているマーカーのどれにも該当しないマーカーがある、`missing_file` は文書が指す画像・動画・音声・添付のファイルが文書からの相対パスにもアセットのルートにも無い、`include_target_missing` は include のマーカーが指すファイル・見出し・行の範囲が無いか、設定ファイルのフォルダの外を指す、`include_circular` は include の取り込みが循環する、`diagram_invalid` は図の部品の定義を読み込めないか構造が合わない、`diagram_node_overlap` はフロー図の 2 つのノードの矩形が重なる、`diagram_node_overflow` はフロー図のノードが図の `width`・`height` の外に出るか `frame` の縁をまたぐ、`diagram_wire_crosses_node` はフロー図の線が `from`・`to` でないノードの中を通る、`diagram_label_too_long` はフロー図のノードの種類・名前・補足の文字が、折り返してもノードの中に収まらない、`syntax_warning` は `--text`・`--file` で指定した Markdown を描いたときに出る記載の警告のうち `unknown_mark`・`diagram_invalid` に該当しないもの（include の取り込み先が無い警告を除く）、`unknown_mark_arg` はマーカーの JSON のオブジェクトに、描くときに警告を配置せずに無視する知らないキーがある、`legacy_mark` はマーカーの引数が今の書き方（JSON のオブジェクトでない）、`mark_option_unapplied` は `enabled` を `false` にした機能の列の設定がある、`mark_option_invalid` は点検する文書のマーカーの引数が JSON として読めないか、型・選べる値・必須に合わない、`plain_md_with_marks` は拡張子が純粋な `.md` の文書が mdmark の記法を含む。`duplicate_alias_row_id`〜`duplicate_alias_id` はインターフェース定義『エイリアスを作る』の `kind`、ほかはインターフェース定義『索引を点検する』の `kind`'
  - name: 終了コード
    type: 0 | 1
    description: ずれが 0 件なら 0、ずれがあるか点検できないときは 1
response_example: |-
  ```text
  docs/index.yaml:docs[1].path: missing_doc: `old.md` が見つかりません。文書を戻すか、索引の `docs[1]` を削除してください。
  mdmark.config.yaml:build: schema: `build.out` がありません。書き出す HTML のパスを記載してください。
  ずれ 2 件
  ```
exceptions:
  - name: なし（正常終了）
    condition: ずれが 0 件。終了コード 0
  - name: なし（ずれがある・終了コード 1）
    condition: ずれが 1 件以上ある
    notes: 全てのずれを出してから終わる
  - name: 設定ファイルが無い（終了コード 1）
    condition: '`--config` のファイルが無い、または今のフォルダと上のフォルダに `mdmark.config.yaml` が無い（`--text`・`--file` を指定し、`--config` を指定しないときを除く）'
    notes: 標準エラーに、探した場所と `mdmark init` で配置できることを出す
  - name: 設定ファイルを読み込めない（終了コード 1）
    condition: 設定ファイル（重ねた設定ファイルのどれか。端末の設定を含む）を YAML として読み込めない
    notes: 標準エラーに、ファイルと読み込めない行と修正方法を出す
  - name: 比べる基準を参照できない（終了コード 1）
    condition: '`--base` を指定し、git が無い・設定ファイルのフォルダが git のリポジトリの中に無い・その ref と HEAD の merge-base を参照できない'
    notes: 標準エラーに、指定した ref と参照できない理由と、ref を修正するか履歴を取得する（CI の checkout の `fetch-depth`）修正方法を出す。ずれの点検はしない
  - name: 引数の組が誤り（終了コード 1）
    condition: '`--text` と `--file`・`--base` を一緒に指定した、`--file` と `--key` の片方だけを指定した、または `--file` と `--base` を一緒に指定した'
    notes: 標準エラーに、一緒に指定できない引数か足りない引数と、正しい指定方法を出す。点検はしない
  - name: 点検するファイルを読み込めない（終了コード 1）
    condition: '`--file` のファイルが無いか、YAML として読み込めない'
    notes: 標準エラーに、ファイルと、無いことか読み込めない行と修正方法を出す
  - name: キーが無い（終了コード 1）
    condition: '`--key` のキーが `--file` の YAML に無いか、その値が文字列でない'
    notes: 標準エラーに、ファイルと指定したキーと、たどれたところまでのキーか値の型と、キーを修正する修正方法を出す
constraints:
  - item: 設定の点検
    constraint: '`schemas/mdmark.config.schema.json` に合わないところごとに `schema` のずれにする。空の設定ファイル（読み込んだ値がオブジェクトでない）も `schema` のずれにする。`build.glossary`・`build.entry` がまとめる文書に該当しないものも `schema` のずれにする。`theme`・`extensions` のファイルが無いものも `schema` のずれにする'
  - item: 索引の点検
    constraint: 設定に `index` があるときだけ行う。索引のフォルダの下の拡張子 `.md` のファイルのうち `build.exclude` に該当しないものを文書として `checkIndex` に指定し、返ったずれをそのまま出す。索引のファイルを読み込めないときは、索引を指す `schema` のずれにする
    decided_by: IF-472-37#
  - item: build の対象
    constraint: 設定に `build` があるときだけ行う。`include` に該当し `exclude` に該当しない文書が 0 件なら `no_documents` のずれにする
  - item: 内容の文
    constraint: ずれごとに、何が合わないかと修正方法を日本語の 1 文で記載する
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
  - item: 知らないマーカーの点検
    constraint: '点検する文書ごとに、描く処理と同じ記載方法のマーカー（`<!-- 名前 -->`・`<!-- 名前: {JSON のオブジェクト} -->`・`<!-- /名前 -->`。今の書き方の引数を含む）を、描く処理と同じく生の HTML のブロックと行内の HTML からだけ取得する（コードブロックとインラインコードの中は取得しない）。名前が知っているマーカーに該当しないマーカーを、1 つにつき 1 件の `unknown_mark` のずれにする。ファイルは設定ファイルのフォルダからの文書の相対パス、場所はマーカーのある行の番号（1 から）、内容はマーカーの名前と、名前を修正するか、拡張・対応表・`check.ignore` に追加するかの修正方法の 1 文'
  - item: 知っているマーカー
    constraint: '`features`・記法のマーカー・設定の `libraries` に既定を適用した対応表の名前・設定の `extensions` の拡張が既定の書き出しで持つ `directive`・設定の `check.ignore` の名前。拡張は `mdmark export` と同じくまとめ、Node で読み込んで既定の書き出しの `directive` を取る（設定の `extensions` のモジュールは、読み込みの時点でブラウザの API を使用せず、使用するのは `load` の中だけにする）。まとめられない・読み込めない・既定の書き出しが `directive` を持たない拡張は、その `extensions[{位置}]` を指す `schema` のずれにし（読み込めないときは、元のエラーと、ブラウザの API を使用する処理を `load` の中へ移す修正方法を内容に記載する）、その拡張のマーカーは知っているマーカーに入れない'
  - item: 拡張子の提案
    constraint: '制約「点検する文書」の文書のうち、ファイル名が `.md` で終わり `.mark.md` で終わらない文書（純粋な `.md`）ごとに、制約「知らないマーカーの点検」と同じ取得の仕方でマーカーを取得し、名前が知っているマーカー（`check.ignore` の名前を除く）に該当するマーカーが 1 つ以上あれば、1 文書につき 1 件の `plain_md_with_marks` のずれにする。場所は最初のマーカーの行の番号（1 から）、内容は拡張子を `.mark.md` に変える改名先のファイル名と、提案を止める設定 `check.suggestMarkExtension: false` の 1 文。設定の `check.suggestMarkExtension` が `false` のときと、`--text`・`--file` のときは点検しない'
    decided_by: CFG-472-3#settings[check.suggestMarkExtension]
    notes: 記法の判定の範囲は要件.md の未確定（判定の範囲、推奨 A）。GFM の記法と `mermaid` のコードブロックは mdmark の記法に数えない
  - item: 点検する文書
    constraint: 索引の点検に指定する文書（設定に `index` があるとき）と、`build` の対象の文書（設定に `build` があるとき）を合わせ、同じファイルは 1 回だけ点検する。どちらも無い設定では知らないマーカーを点検しない
  - item: 変わった文書
    constraint: '`--base` を指定したときだけ、設定ファイルのフォルダで `--base` と HEAD の merge-base を引き、merge-base から作業ツリーまでに変わったファイルと、git が管理していない新しいファイル（無視するファイルを除く）を、索引のファイルからの相対パスにして `checkIndex` の `changedPaths` に指定する。設定に `index` が無いときは `--base` を使用しない'
    decided_by: IF-472-37#constraints[修正漏れ]
  - item: エイリアスの点検
    constraint: 設定に `aliases` があるときだけ行う。Schema に合う行だけを使用し、行の `paths` を設定ファイルのフォルダから参照して YAML として読み込み、`buildAliases` に指定して返った `problems` をそのまま出す。`enabled` が `false` の行は読み込まない。`paths` に該当するファイルが 0 件の行は `alias_no_files`、YAML として読み込めないファイルは `alias_unreadable` のずれにする
    decided_by: IF-472-26#
  - item: テーマの名前の点検
    constraint: 設定に `colorTheme` があり、その値が `dev-swiss`・`theme-paper`・`theme-slate`・`theme-contrast` のどれでもないとき、`unknown_color_theme` のずれを 1 つ出す。場所は `colorTheme`、内容には記載した名前と選べるテーマの名前の一覧を入れる。文字列でない値は `schema` のずれにする
    decided_by: CFG-472-3#settings[colorTheme]
  - item: 明暗の値の点検
    constraint: 設定に `colorScheme` があり、その値が `light`・`dark`・`auto` のどれでもないとき、`unknown_color_scheme` のずれを 1 つ出す。場所は `colorScheme`、内容には記載した値と記載できる値の一覧を入れる。文字列でない値は `schema` のずれにする
    decided_by: CFG-472-3#settings[colorScheme]
  - item: 見つからないファイルの点検
    constraint: '制約「点検する文書」の文書ごとに、相対パスで指す画像（動画の `poster` を含む）・動画・音声と、添付のカードにするリンク（インターフェース定義『文書をHTML文字列にする』の制約「リンクと添付のカード」の添付の拡張子）のファイルを、インターフェース定義『文書をHTMLに書き出す』の制約「アセットのルート」と同じ順に探し、どちらにも無いものを 1 つにつき 1 件の `missing_file` のずれにする。ファイルは文書の相対パス、場所は記載した行の番号（1 から）、内容は記載したパスと種類（画像・動画・音声・添付）と、パスを修正するかファイルを配置するか `assets.root` を確認する修正方法の 1 文。コードブロックとインラインコードの中、絶対 URL、`#` で始まるリンクは点検しない。設定の `assets.root` のフォルダが無いときは `assets.root` を指す `schema` のずれにする'
    decided_by: CFG-472-3#settings[assets.root]
  - item: 図の定義の点検
    constraint: '制約「点検する文書」の文書ごとに、`<!-- flow -->`・`<!-- sequence -->`・`<!-- chart -->`・`<!-- param -->`・`<!-- er -->` の範囲の `json` のコードブロック（インターフェース定義『文書をHTML文字列にする』の制約「図の部品」と同じ読み込み方。埋め込んだ HTML の中の custom element は点検しない）を読み込む。描く処理と同じ確認で読み込めない定義は、1 つの定義につき 1 件の `diagram_invalid` のずれにし、内容は記載の警告と同じ文にする。読み込めたフロー図の定義は（座標を省いた判定フローチャートは、インターフェース定義『文書をHTML文字列にする』の制約「自動の配置」を適用した後の座標で）、ノードの矩形の重なり（辺が接するだけは重ならない）・`width`・`height` の外へのはみ出しと `frame` の縁をまたぐノード・線の各線分（`points` を含む）と `from`・`to` でないノードの矩形の交わり・ラベルの長さを点検し、ずれ 1 つにつき 1 件にする（同じノードの組・ノードと線の組は 1 件）。シーケンス図・グラフ・操作できる部品・ER 図の配置は点検しない。ファイルは文書の相対パス、場所は図の部品の開きのマーカーの行の番号（1 から）、内容は図のタイトル（無ければマーカーの名前）・対象のノードか線の `id`・修正方法の 1 文。点検はブラウザを使用しない'
  - item: ラベルの長さの目安
    constraint: ノードの種類・名前・補足の文字を、全角の文字は文字の大きさ、半角の文字は文字の大きさの 0.6 倍の幅とみなし、ノードの `w` から左右の余白を除いた幅で折り返した行の数を数える。文字の大きさと余白は描いた文書の CSS の値（種類 11px・名前 14px・補足 12px・行の高さ 1.4 倍・余白 上下 6px 左右 10px）とし、折り返した行の高さの合計がノードの `h` から上下の余白を除いた高さを超えるものをずれにする
    notes: ブラウザの実際の文字幅は使用しない（D-12）。目安の値は CSS を変えたときに合わせて修正する
  - item: 取り込み先の点検
    constraint: '制約「点検する文書」の文書ごとに、include のマーカー（コードブロックとインラインコードの中を除く）の取り込み先を、インターフェース定義『文書をHTML文字列にする』の制約「取り込み」と同じパスの解き方でファイルから読み込み、無いファイル・設定ファイルのフォルダの外を指すパス・無い見出しの ID・ファイルの行の数を越える行の範囲を 1 つにつき 1 件の `include_target_missing`、循環する取り込みを 1 つにつき 1 件の `include_circular` のずれにする（取り込んだ文書の中のマーカーもたどる）。ファイルはマーカーを記載した文書の相対パス、場所はマーカーの行の番号（1 から）、内容は、`include_target_missing` は記載した取り込み先と、無いもの（ファイル・フォルダの外・見出し・行。行はファイルの行の数も）と、パス・見出し・行の範囲を修正するかファイルを配置する修正方法の 1 文、`include_circular` は循環の順（`a.mark.md → b.mark.md → a.mark.md`）と、循環するマーカーのどれかを取り除く修正方法の 1 文。文書の `<!-- features: {"include": false} -->` の文書は点検しない'
    notes: 種類の名前は単一ユースケース『設定と索引を点検する』でインターフェース定義に任せたもの
  - item: 記法の点検
    constraint: '`--text` か `--file` と `--key` を指定したときは、設定・索引・`build` の対象・エイリアス・テーマの名前・見つからないファイルの点検をしない。指定した Markdown を `render` と同じ読み取りで読み込み、描いたときに出る記載の警告を 1 つにつき 1 件のずれにする。内容は警告の本文と同じ文。知らないマーカーの警告は `unknown_mark`、図の部品の定義の警告は `diagram_invalid`、そのほかは `syntax_warning` にする。マーカーの引数は制約「マーカーの設定の点検」のとおり点検し、JSON として読めない引数と型・選べる値・必須に合わない値は、描いたときの記載の警告として `syntax_warning` のずれにする。include のマーカーの取り込み先が無い警告（ファイル・見出し・行の範囲）は、取り込み先を読み込まないため出さない（取り込み先は設定の文書の点検の `include_target_missing`・`include_circular` が確認する）。読み込めたフロー図の定義は制約「図の定義の点検」と同じ配置の点検もする。設定ファイルが見つかれば、`features`・`libraries`・`extensions`（制約「知っているマーカー」と同じ読み込み方）・`check.ignore` を適用して描くときと同じ警告にし、見つからなければ既定の設定で点検する（設定ファイルが無いことをエラーにしない）。点検はブラウザを使用しない'
    notes: 入口を `mdmark check` の引数にするのは要件.md の未確定（記法の点検の入口、推奨 A）
  - item: マーカーの設定の点検
    constraint: '点検する文書ごと（`--text`・`--file` のときは指定した Markdown）に、記法のマーカー（`map`・`map-data` を除く。map のマーカーは制約「map の点検」の種類で点検する）の引数を、描く処理と同じ読み取り（インターフェース定義『文書をHTML文字列にする』の制約「マーカーの書式」）で読み、マーカーごとの JSON Schema（ER 図『マーカーの設定の共通の決まり』から辿るマーカーごとの ER 図と同じ内容）で検証する。拡張のマーカーと設定の `libraries` のマーカーは、今の書き方の `legacy_mark` だけを点検し、キーと値は検証しない（拡張の検査は `registerExtension` の `schema` で、描くときだけ行う）。名前の後ろが `{` で始まらない引数のマーカーは、1 つにつき 1 件の `legacy_mark` のずれにし、内容に引数を JSON のオブジェクトで記載することと `mdmark upgrade` で書き換えられること（拡張と `libraries` のマーカーは、描くときに描かないことと、`mdmark upgrade` が書き換えずに移行の報告に挙げること）を記載する。知らないキー（`features` のマーカーと表の `features` の知らない機能名を含む）は 1 つにつき 1 件の `unknown_mark_arg` のずれにし、内容に無視したキーのパス（`features.unknown` など）と、その場所で使用できるキー、誤記なら修正し新しいバージョンのキーなら mdmark のバージョンを上げる修正方法を記載する。`enabled` を `false` にした機能の列の設定は 1 つにつき 1 件の `mark_option_unapplied` のずれにし、内容に適用しない列の設定のパスと、機能を削除するか列の設定を削除する修正方法を記載する。点検する文書の、JSON として読めない引数と型・選べる値・必須に合わない値は 1 つにつき 1 件の `mark_option_invalid` のずれにし、内容は描いたときの記載の警告の本文と同じ文にする（`--text`・`--file` のときは `syntax_warning`）。ファイル・場所は制約「知らないマーカーの点検」と同じ（`--text`・`--file` のときは制約「記法の点検の場所」）。点検はブラウザを使用しない'
  - item: 記法の点検の場所
    constraint: '`--text` のずれの場所は、文字列の中の行の番号（1 から）。`--file` のずれのファイルは YAML のファイル、場所は YAML のファイルの行の番号（1 から）。キーの値がブロックスカラー（`|`・`>`）なら、値の中の行を YAML のファイルの行へ置き換え、それ以外の記載方法の値はキーの行にする。警告の場所は、警告の元になったマーカー（範囲なら開きのマーカー）の行。マーカーを持たない警告（読み込めないファイルツリーなど）は、警告を配置した場所の後ろのブロックの開始の行'
  - item: 重ねた設定ファイルの点検
    constraint: '索引と文書のずれは、インターフェース定義『設定を重ねて読み込む』を `purpose: export` で呼んで重ねた設定で点検する。設定の構造は、重ねた設定ファイルのそれぞれと、`config.applyToExport` によらず端末の設定のファイルがあればその構造も検める。ずれの `file` は『設定を重ねて読み込む』の制約「パスの表示」のパス（今のフォルダからの相対パスか `~` のパス）にする'
  - item: map の点検
    constraint: '制約「点検する文書」の文書ごとに、map の範囲を文書をHTML文字列にする.ts の制約「map の範囲」と同じ読み込み方で読み込み、制約「map の書き方の誤り」の項目を 1 つにつき 1 件のずれにする。Mermaid の読めない行・閉じの無いブロック・範囲の中の mermaid のブロックと補足の数の誤り・描けない図の種類は `map_invalid`、補足が指す Mermaid に無いノード・線・グループの ID は `map_unknown_ref`、補足の知らないキーと印の JSON のオブジェクトの知らないキーは `map_unknown_key`、補足のスキーマに合わない値・`--` を含む値・JSON として読めない印の引数・型の合わない印の値は `map_invalid_value`、Mermaid のクラスが設定の `map.kinds` に無いノードは `map_unknown_class`、補足の `layout` の `line` の名前が設定の `map.lines` に無い線は `map_unknown_line` にする（設定に `map` が無いときも同じ）。ファイルは文書の相対パス、場所は Mermaid の行は文書の行、補足の箇所は補足の中の行を文書の行へ置き換えた行、そのほかは map の開きのマーカーの行の番号（1 から）。内容は書き方の警告の項目と同じ文。配置は点検しない。文書の `<!-- features: {"map": false} -->` の文書は点検しない。点検はブラウザを使用しない'
    notes: '`--text`・`--file` の点検でも同じ種類にする（制約「記法の点検」の `syntax_warning` にしない）'
  - item: map の設定の点検
    constraint: 設定の `map.node_fit`・`map.url_state`・`map.kinds`・`map.lines` は、制約「設定の点検」の Schema で検査し、`node_fit` の知らない値・`url_state` が真偽値でない値・知らない形・模様・太さ・矢じり・色の名前を `schema` のずれにする。`map.kinds` の `icon` が Lucide に無い名前のものは、1 つにつき 1 件の `map_unknown_icon` のずれにする。ファイルは設定ファイル、場所はキーのパス（`map.kinds.store.icon`）、内容は記載した名前と、Lucide のアイコンの名前にする修正方法の 1 文。Lucide の名前の一覧は、外部ライブラリ『lucide』の採用バージョンのパッケージのアイコンの名前を使用する
    decided_by: IF-472-35#request[opts.config.map.kinds]
