id: IF-472-28
visibility: internal
title: バージョンを上げる
entry:
  kind: operation
  value: '`mdmark upgrade [--plan] [--yes] [--config {設定ファイル} | --settings]`（CLI。`npx github:shuhei1101/mdmark#v{目標のバージョン} upgrade` で呼ぶ）'
flows:
  - name: 正常系
    summary: 2 つのバージョンの手順をバージョンの順に当て、点検に合格してバージョンを書き換える
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: '`version: v0.3.0`・`legacy: 1`・`index`・`build` を記載したコメントつきの設定と、索引と、マーカー `<!-- note -->` を持つ文書 2 つの一時フォルダ'
        notes: '`legacy` は点検が拒まない最上位の知らないキーで、名前を変えても点検が通る'
      - name: Mock
        description: 作業ツリーをコピーした一時フォルダ（テスト用のパッケージ）の `migrations/` と `docs/guide/変更履歴.md` をテスト用のものに差し替え、`npm run build -- --version v0.5.0` でバージョンを埋めた `dist/cli.js` を子プロセスで実行する
        notes: '`v0.4.0` は `rename_key`（`file: config`・`legacy` → `renamed`）、`v0.5.0` は `replace_mark`（`<!-- note -->` → `<!-- callout -->`）。変更履歴は v0.3.0・v0.4.0・v0.5.0 の行を持つ'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C->>F: 設定を読み込む（version: v0.3.0）
        C->>C: v0.4.0・v0.5.0 の steps.yaml を読み込み、Schema で検める
        C->>F: 設定・索引・文書を .mdmark/backup/{日時}/ へ写す
        C->>F: v0.4.0 の rename_key・v0.5.0 の replace_mark を適用する
        C->>C: mdmark check と同じ点検（ずれ 0 件）
        C->>F: 設定の version を v0.5.0 にする
        C-->>W: 手順・変更履歴・コピーの場所・終了コード 0
    expected:
      - 終了コードが 0
      - 設定の `legacy` が `renamed` になり、値と他のキーの並びとコメントが残っている
      - 文書 2 つの `<!-- note -->` が `<!-- callout -->` になっている
      - 設定の `version` が `v0.5.0`
      - 標準出力に `v0.4.0:`・`v0.5.0:` の順で手順の行と、`v0.4.0`・`v0.5.0` の変更履歴の行が出て、`v0.3.0` の変更履歴の行が出ない
      - 標準出力の `コピー:` のフォルダに適用する前の設定・索引・文書があり、`.mdmark/.gitignore` の中身が `*`
    test: test_normal
  - name: 正常系（端末の設定を移行する）
    summary: '`--settings` で端末の設定に `file: config` の手順を当て、`version` を書き換える'
    setup:
      - name: 手元のバージョンが古い端末の設定
        description: '`version: v0.3.0`・`legacy: 1` を持つコメントつきの端末の設定を一時フォルダに配置し、`MDMARK_CONFIG` で指す'
      - name: Mock
        description: 正常系と同じテスト用のパッケージ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as 端末の設定
        W->>C: mdmark upgrade --settings
        C->>F: 端末の設定を読み込む（version: v0.3.0）
        C->>F: コピーを取り、v0.4.0 の rename_key を適用する（v0.5.0 の replace_mark は飛ばす）
        C->>C: 端末の設定の構造を点検する
        C->>F: version を v0.5.0 にする
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - 端末の設定の `legacy` が `renamed` になり、コメントが残り、`version` が `v0.5.0`
      - 端末の設定のフォルダの `.mdmark/backup/{日時}/` に適用する前の端末の設定がある
    test: test_normal_when_settings
  - name: 正常系（適用する前に示す）
    summary: '`--plan` でバージョンごとの手順・変更履歴・壊す手順を示し、何も書き換えない'
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: '正常系と同じ。`v0.5.0` の手順に `destructive: true` を付ける'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade --plan
        C->>C: 設定と v0.4.0・v0.5.0 の手順を参照する
        C-->>W: 手順・変更履歴・壊す手順のマーカー・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力に `replace_mark（壊す手順）:` の行と `--plan のため書き換えていません` がある
      - 設定・索引・文書が変わっておらず、`.mdmark/` が無い
    test: test_normal_when_plan
  - name: 正常系（値を聞く手順がある）
    summary: '`set_default` の `ask` で値を聞き、回答した値でキーを追加する'
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 'テスト用のパッケージを `--version v0.4.0` でビルドし、`v0.4.0` の手順を `set_default`（`file: config`・`key: title`・`ask`）に差し替える'
        notes: 標準入力に `設計の文書` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C-->>W: ask の質問（標準エラー）
        W->>C: 設計の文書
        C->>F: コピーを取り、title を追加する
        C->>C: 点検（ずれ 0 件）
        C->>F: version を v0.4.0 にする
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - 標準エラーに `ask` の質問の文が出る
      - 設定の `title` が `設計の文書`、`version` が `v0.4.0`
    test: test_normal_when_value_asked
  - name: 正常系（手元のバージョンを持たない設定）
    summary: 設定に `version` が無いと手元のバージョンを聞き、適用した後に `version` を追加する
    setup:
      - name: バージョンを持たない設定のフォルダ
        description: 正常系のフォルダの設定から `version` を削除したもの
      - name: Mock
        description: 正常系と同じ
        notes: 標準入力に `v0.3.0` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C-->>W: 手元のバージョンの質問（標準エラー）
        W->>C: v0.3.0
        C->>F: コピーを取り、v0.4.0・v0.5.0 の手順を適用する
        C->>C: 点検（ずれ 0 件）
        C->>F: 設定の先頭に version: v0.5.0 を追加する
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - '設定の最上位の先頭のキーが `version: v0.5.0`'
      - 設定・文書の中身が、`version` の行を除いて正常系と同じ
    test: test_normal_when_version_missing
  - name: 正常系（手元のバージョンが目標のバージョンと同じ）
    summary: 適用する手順が無ければ何も書き換えずに終わる
    setup:
      - name: バージョンが一致したフォルダ
        description: 正常系のフォルダの `version` を `v0.5.0` にしたもの
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C->>C: 手元のバージョンと目標のバージョンが同じ
        C-->>W: 適用する手順が無いこと・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力に `手元のバージョンが目標のバージョンと同じです。適用する手順はありません` がある
      - 設定・索引・文書が変わっておらず、`.mdmark/` が無い
    test: test_normal_when_up_to_date
  - name: 正常系（壊す手順を --yes で適用する）
    summary: '`--yes` なら壊す手順を確認せずに適用する'
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: '正常系と同じ。`v0.5.0` の手順に `destructive: true` を付ける'
        notes: 標準入力には何も指定しない
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade --yes
        C->>F: コピーを取り、確認せずに手順を適用する
        C->>C: 点検（ずれ 0 件）
        C->>F: version を v0.5.0 にする
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - 標準エラーに確認の質問が出ない
      - 文書のマーカーが書き換わり、`version` が `v0.5.0`
    test: test_normal_when_destructive_with_yes
  - name: 正常系（該当した後にもう一度適用する）
    summary: 手順が既に該当した設定・文書に同じ手順を適用しても中身が変わらない
    setup:
      - name: 手順が該当した後のフォルダ
        description: 正常系を実行した後のフォルダの `version` だけを `v0.3.0` に戻したもの（コピーから戻せずに止まった状態）
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C->>F: コピーを取り、v0.4.0・v0.5.0 の手順を適用する（どれも何も変えない）
        C->>C: 点検（ずれ 0 件）
        C->>F: version を v0.5.0 にする
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - 設定・文書の中身が正常系を実行した後と同じ
    test: test_normal_when_reapplied
  - name: 異常系（壊す手順を断った・終了コード 1）
    summary: 壊す手順の確認に `y` 以外を回答すると、何も書き換えずに終わる
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: '正常系と同じ。`v0.5.0` の手順に `destructive: true` を付ける'
        notes: 標準入力に `n` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C-->>W: 壊す手順を示して確認する（標準エラー）
        W->>C: n
        C-->>W: 何も適用しなかったことと --yes・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `--yes` が出る
      - 設定・索引・文書が変わっておらず、`.mdmark/` が無い
    test: test_error_when_destructive_declined
  - name: 異常系（手順の失敗・終了コード 1）
    summary: '`call` のスクリプトが失敗すると、前のバージョンで適用した分もコピーから戻す'
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: '正常系と同じ。`v0.5.0` の手順を、終了コード 1 で終わるスクリプトを実行する `call`（`files: [config]`）に差し替える'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant S as スクリプト
        participant F as フォルダ
        W->>C: mdmark upgrade
        C->>F: コピーを取り、v0.4.0 の rename_key を適用する
        C->>S: node {スクリプト} --config {設定ファイル}
        S-->>C: 終了コード 1
        C->>F: コピーから戻す
        C-->>W: 失敗したバージョン・手順・理由・終了コード 1
    expected:
      - 終了コードが 1
      - 設定の中身が適用する前と同じ（`legacy` が残り、`version` が `v0.3.0`）
      - 標準エラーに `v0.5.0` と手順の説明とスクリプトの終了コード 1 が出る
    test: test_error_when_step_fails
  - name: 異常系（点検のずれ・終了コード 1）
    summary: 適用した後の点検でずれがあると、コピーから戻してずれを出す
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ。設定の `build.out` は `dist/docs.html`
      - name: Mock
        description: '正常系と同じ。`v0.5.0` の手順を `map_values`（`file: config`・`key: build.out`・`dist/docs.html` → `dist/docs.txt`）に差し替える'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C->>F: コピーを取り、v0.4.0・v0.5.0 の手順を適用する
        C->>C: 点検（build.out の schema のずれ）
        C->>F: コピーから戻す
        C-->>W: ずれの行・終了コード 1
    expected:
      - 終了コードが 1
      - '標準エラーに `mdmark.config.yaml:build.out: schema:` で始まる行がある'
      - 設定の `legacy`・`build.out`・`version` が適用する前のまま
    test: test_error_when_check_fails
  - name: 異常系（図の定義のずれ・終了コード 1）
    summary: 適用した後の点検で図の定義にずれがあると、コピーから戻してずれを出す
    setup:
      - name: 図の定義にずれを持つ手元のバージョンが古いフォルダ
        description: 正常系のフォルダの文書の 1 つの 5 行目の `<!-- er -->` の範囲に、関係の先が定義に無いテーブル `payments` を指す ER 図の定義を記載したもの
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark upgrade
        C->>F: コピーを取り、v0.4.0・v0.5.0 の手順を適用する
        C->>C: 点検（図の定義のずれ）
        C->>F: コピーから戻す
        C-->>W: ずれの行・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに、その文書の 5 行目を指す `diagram_invalid` の行があり、内容に `payments` を含む
      - 設定・索引・文書が適用する前と同じ中身で、設定の `version` が `v0.3.0` のまま
    test: test_error_when_diagram_drift
    refs:
      - SC-472-27#scenarios[異常シナリオ（適用した後の点検で図の定義にずれがある）]
  - name: 異常系（手元のバージョンが新しい・終了コード 1）
    summary: 手元のバージョンが呼んだ CLI のバージョンより新しいと、もう一度呼ぶ方法を示して終わる
    setup:
      - name: バージョンが新しいフォルダ
        description: 正常系のフォルダの `version` を `v0.6.0` にしたもの
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C->>C: 手元のバージョン v0.6.0 が目標のバージョン v0.5.0 より新しい
        C-->>W: もう一度呼ぶ方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `v0.6.0`・`v0.5.0`・`npx github:shuhei1101/mdmark#v0.6.0 upgrade` が出る
      - 設定・索引・文書が変わっておらず、`.mdmark/` が無い
    test: test_error_when_local_version_newer
  - name: 異常系（手元のバージョンの書式の誤り・終了コード 1）
    summary: 手元のバージョンの質問に書式の違う回答を返却すると、書式を示して終わる
    setup:
      - name: バージョンを持たない設定のフォルダ
        description: 正常系（手元のバージョンを持たない設定）と同じ
      - name: Mock
        description: 正常系と同じ
        notes: 標準入力に `0.3` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C-->>W: 手元のバージョンの質問
        W->>C: 0.3
        C-->>W: 書式 v{MAJOR}.{MINOR}.{PATCH}・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `v{MAJOR}.{MINOR}.{PATCH}` が出る
      - 設定・索引・文書が変わっていない
    test: test_error_when_version_format_invalid
  - name: 異常系（回答が無い・終了コード 1）
    summary: 質問に回答する前に標準入力が終わると、何も書き換えずに終わる
    setup:
      - name: バージョンを持たない設定のフォルダ
        description: 正常系（手元のバージョンを持たない設定）と同じ
      - name: Mock
        description: 正常系と同じ
        notes: 標準入力を何も書き込まずに閉じる
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C-->>W: 手元のバージョンの質問
        C->>C: 標準入力が終わる
        C-->>W: 回答する質問・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに手元のバージョンの質問に回答が無いことが出る
      - 設定・索引・文書が変わっておらず、`.mdmark/` が無い
    test: test_error_when_answer_missing
  - name: 異常系（手順のファイルの誤り・終了コード 1）
    summary: 適用するバージョンの `steps.yaml` が Schema に合わないと、書き換える前に終わる
    setup:
      - name: 手元のバージョンが古いフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ。`v0.5.0` の `steps.yaml` の手順から `to` を削除する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C->>C: v0.5.0 の steps.yaml が Schema に合わない
        C-->>W: バージョンと合わないところと再インストール・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `v0.5.0` と `to` が出る
      - 設定・索引・文書が変わっておらず（v0.4.0 の手順も該当していない）、`.mdmark/` が無い
    test: test_error_when_steps_invalid
  - name: 異常系（設定ファイルが無い・終了コード 1）
    summary: 設定ファイルが見つからないと、`mdmark init` で配置できることを示して終わる
    setup:
      - name: 設定ファイルの無いフォルダ
        description: そのフォルダと上のフォルダに `mdmark.config.yaml` が無い一時フォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark upgrade
        C->>C: 今のフォルダから上へ設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `mdmark.config.yaml` が無いことと `mdmark init` が出る
    test: test_error_when_config_missing
  - name: 正常系（v0.9.0 までの索引からタグの語彙を削除する）
    summary: 語彙を削除する `call` の手順を当て、文書のタグを書き換えて索引の `schema` を `2` にし、点検に合格させる
    setup:
      - name: 語彙を持つ索引のフォルダ
        description: '正常系のフォルダの索引を、`schema: 1`・最上位の `tags` が `topic:mcp`（`aliases` に `MCP`）・`topic:old`（`deprecated` が `topic:mcp`）、`docs[0].tags` が `[MCP]`、`docs[1].tags` が `[topic:old]` にしたもの'
      - name: Mock
        description: 正常系と同じテスト用のパッケージ。`migrations/v0.5.0/` に、`drop-tag-vocabulary.mjs` を持つ移行の手順のフォルダの `steps.yaml` と全てのスクリプトを配置する
        notes: '`steps.yaml` の手順が `destructive: true` のため `--yes` を指定する'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant S as スクリプト
        participant F as フォルダ
        W->>C: mdmark upgrade --yes
        C->>F: 設定・索引・文書を写す
        C->>S: node drop-tag-vocabulary.mjs --config {設定ファイル}
        S->>F: 索引のタグを書き換え、語彙を削除して schema を 2 にする
        C->>C: mdmark check と同じ点検（ずれ 0 件）
        C->>F: 設定の version を v0.5.0 にする
        C-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - 索引の `schema` が `2` で、最上位に `tags` が無い
      - '`docs[0].tags` と `docs[1].tags` が `[topic:mcp]`'
      - 設定の `version` が `v0.5.0`
    test: test_normal_when_tag_vocabulary_dropped
  - name: 正常系（文書のマーカーを JSON の記載へ書き換える）
    summary: 文書のマーカーを書き換える `call` の手順を当て、今の書き方のマーカーを今の実装が適用している設定だけの JSON のオブジェクトにし、書き換えない記載を移行の報告に出す
    setup:
      - name: 今の書き方のマーカーを持つフォルダ
        description: シナリオ『バージョンを上げる』の「正常シナリオ（文書のマーカーを JSON の記載へ書き換える）」と「正常シナリオ（書き換えない記載を移行の報告に挙げる）」の文書を、設定の `build.include` に該当させたフォルダ
      - name: Mock
        description: 呼んだ CLI のバージョンを目標のバージョンにし、リポジトリの `migrations/next/` の移行の手順を目標のバージョンの手順として使用する
        notes: '`--yes` を指定する'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant S as スクリプト
        participant F as フォルダ
        W->>C: mdmark upgrade --yes
        C->>F: 設定・索引・文書を写す
        C->>S: node {文書のマーカーを書き換えるスクリプト} --config {設定ファイル}
        S->>F: 記法のマーカーの今の書き方を JSON のオブジェクトにする
        S-->>C: 移行の報告の行
        C->>C: mdmark check と同じ点検（unknown_mark・legacy_mark を除いてずれ 0 件）
        C->>F: 設定の version を目標のバージョンにする
        C-->>W: 手順の行の下の移行の報告の行・終了コード 0
    expected:
      - 終了コードが 0
      - 文書のマーカーがシナリオの期待値のとおりの JSON のオブジェクトになり、マーカーの外の本文・閉じのマーカー・引数の無いマーカー・コードブロックの中が変わっていない
      - '標準出力の手順の行の下に、`total=数量:sum`・`filter=名前:range`・拡張のマーカー・`libraries` のマーカーの移行の報告の行が、`{文書の相対パス}:{行}: {マーカーの名前}: {記載}: {理由}` の構造で 1 つずつある'
      - 書き換えた文書を `render` で描いた文字列が、書き換える前の文書を描いた文字列から、書き出さない記載（`total=数量:sum`・`filter=名前:range`）の記載の警告を除いたものと同じ（書き換えない拡張・`libraries` のマーカーの今の書き方の警告は、前と後の両方に残る）
      - 設定の `version` が目標のバージョン
    test: test_normal_when_document_marks_migrated
    refs:
      - SC-472-27#scenarios[正常シナリオ（文書のマーカーを JSON の記載へ書き換える）]
      - SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]
  - name: 正常系（廃止した図の範囲を map へ書き換える）
    summary: 文書の `flow`・`sequence` の範囲を map の範囲へ書き換える `call` の手順を当て、使っていた種類を設定の `map.kinds`・`map.lines` へ書き足し、写せない値と書き換えない範囲を移行の報告に出す
    setup:
      - name: 廃止した図の範囲を持つフォルダ
        description: シナリオ『バージョンを上げる』の「正常シナリオ（座標で書いた図を map へ書き換える）」の文書と、「正常シナリオ（書き換えない記載を移行の報告に挙げる）」の読めない定義の `flow` の範囲を、設定の `build.include` に該当させたフォルダ。設定は `map` を持たない
      - name: Mock
        description: 呼んだ CLI のバージョンを目標のバージョンにし、リポジトリの `migrations/next/` の移行の手順を目標のバージョンの手順として使用する
        notes: '`--yes` を指定する'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant S as スクリプト
        participant F as フォルダ
        W->>C: mdmark upgrade --yes
        C->>F: 設定・索引・文書を写す
        C->>S: node {廃止した図の範囲を書き換えるスクリプト} --config {設定ファイル}
        S->>F: flow・sequence の範囲を map の範囲にし、設定に map.kinds・map.lines を書き足す
        S-->>C: 移行の報告の行
        C->>C: mdmark check と同じ点検（移行の報告に挙げた retired_diagram を除いてずれ 0 件）
        C->>F: 設定の version を目標のバージョンにする
        C-->>W: 手順の行の下の移行の報告の行・終了コード 0
    expected:
      - 終了コードが 0
      - '読める定義の `flow`・`sequence` の範囲が、シナリオの期待値のとおりの `<!-- map: {…} -->` 〜 `<!-- /map -->` の範囲（`mermaid` のブロック 1 つと補足 `<!-- map-data: {"version": 1, …} -->`）になり、範囲の外の本文とコードブロックの中が変わっていない'
      - 読めない定義の `flow` の範囲は書き換わっていない
      - 設定に `map.kinds`・`map.lines` が加わり、ほかのキーとコメント・キーの並びが変わっていない
      - '標準出力の手順の行の下に、`{文書の相対パス}:{行}: {マーカーの名前}: {項目}: {理由}` の構造の移行の報告の行が、写せない値（範囲・更新日・`stickyTitles`）ごとと、読めない定義の範囲ごとに 1 つずつある'
      - 書き換えた文書を `mount` で描くと、範囲の場所に map の図が描かれ、書き方の警告が無い
      - 設定の `version` が目標のバージョン
    test: test_normal_when_retired_diagrams_migrated
    refs:
      - SC-472-27#scenarios[正常シナリオ（座標で書いた図を map へ書き換える）]
      - SC-472-27#scenarios[正常シナリオ（書き換えない記載を移行の報告に挙げる）]
lead: 文書の作成者が、設定の手元のバージョンから呼んだ CLI のバージョンまでの移行の手順をバージョンの順に設定・索引・文書へ当て、`mdmark check` と同じ点検が通ったら設定の `version` を呼んだ CLI のバージョンにする。適用する前にコピーを取り、失敗したらコピーから戻す。
idempotent: true
side_effects: 設定・索引・文書を書き換え、設定ファイルのあるフォルダの `.mdmark/backup/{日時}/` にコピーを配置する。`--plan` は何も書き換えない
exclusivity: 排他しない。同じフォルダで同時に実行しないことを前提にする
refs:
  - SC-472-27#
  - ER-472-5#
  - IF-472-39#
request:
  - name: --plan
    type: boolean
    required: false
    default: 'false'
    location: argument
    description: 何も書き換えず、適用するバージョンごとの手順・変更履歴の行・壊す手順の有無を出す
  - name: --yes
    type: boolean
    required: false
    default: 'false'
    location: argument
    description: 壊すマーカーのある手順を、確認せずに適用する。値を聞く手順と手元のバージョンの質問は飛ばさない
  - name: --config
    type: string
    required: false
    default: なし（今のフォルダから上のフォルダへ順に `mdmark.config.yaml` を探し、最初に見つかったものを使用する。`config.cascade` によらず、上のフォルダの設定と端末の設定は書き換えない）
    location: argument
    description: 使用する設定ファイルのパス
    example: docs/mdmark.config.yaml
  - name: --settings
    type: boolean
    required: false
    default: 'false'
    location: argument
    description: 移行の対象を端末の設定（`MDMARK_CONFIG`、無ければ `${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml`）にする。`--config` と一緒には指定できない
    notes: '`file: config` の手順と `files` が `[config]` だけの `call` だけを端末の設定へ当て（`call` のスクリプトの `--config` は端末の設定のパス）、`index`・`documents` の手順は飛ばす。点検は端末の設定の構造だけを確認する'
  - name: 標準入力
    type: string
    required: false
    default: なし（質問が無ければ読み込まない）
    location: argument
    description: 質問への回答。質問 1 つに 1 行を読み込む。質問は手元のバージョン（設定に `version` が無いとき）→ 値を聞く手順（適用する順）→ 壊す手順の確認（`--yes` が無いとき）の順に出す
    example: v0.3.0
response:
  - name: 標準出力
    type: string
    description: '`手元のバージョン: {バージョン}`・`目標のバージョン: {バージョン}` の後に、適用するバージョンごとに `{バージョン}:` の行と手順 1 つ 1 行（`  {種類}: {説明}`。壊すマーカーのある手順は種類の後ろに `（壊す手順）`）、`変更履歴:` の行と変更履歴の行 1 つ 1 行（`  {バージョン} {PR} {変更}`）を出す。最後に、適用したときは `コピー: {パス}` と `バージョンを {目標のバージョン} にしました`、`--plan` のときは `--plan のため書き換えていません`、適用する手順が無いときは `手元のバージョンが目標のバージョンと同じです。適用する手順はありません` を出す'
    notes: コピーのパスは設定ファイルのあるフォルダからの相対パス。手順のないバージョンは行を出さない
  - name: 標準エラー
    type: string
    description: 質問の文と、誤りの原因と修正方法の 1 文。点検が通らないときは、`mdmark check` と同じ構造のずれの行を出す
  - name: 終了コード
    type: 0 | 1
    description: 適用したとき・`--plan` で示したとき・適用する手順が無いときは 0、それ以外は 1
response_example: |-
  ```text
  手元のバージョン: v0.3.0
  目標のバージョン: v0.5.0
  v0.4.0:
    rename_key: `build.out` を `build.output` に改める
  v0.5.0:
    replace_mark（壊す手順）: マーカー `<!-- note -->` を `<!-- callout -->` に書き換える
  変更履歴:
    v0.4.0 #40 バージョンを上げるときに移行の手順を適用する mdmark upgrade を作る
    v0.5.0 #45 注意書きのマーカーの名前を統一する
  コピー: .mdmark/backup/20261017120000
  バージョンを v0.5.0 にしました
  ```
exceptions:
  - name: なし（正常終了）
    condition: 手順を適用して点検が通り、バージョンを書き換えた。`--plan` で示した。手元のバージョンが目標のバージョンと同じ。終了コード 0
  - name: 壊す手順を断った（終了コード 1）
    condition: '`--yes` が無く、壊す手順の確認に `y` 以外を回答した'
    notes: 何も書き換えず、コピーも取らない。`--yes` で確認せずに適用できることを出す
  - name: 手順の失敗（終了コード 1）
    condition: 手順を適用する途中で、`call` のスクリプトが 0 以外で終わったか、ファイルを書き込めなかった
    notes: コピーから戻し、失敗したバージョン・手順の説明・理由と、`call` のスクリプトが標準エラーへ書き込んだ行を出す
  - name: 点検のずれ（終了コード 1）
    condition: 全ての手順を適用した後の点検でずれが 1 件以上ある
    notes: コピーから戻し、ずれの行を出す
  - name: 手元のバージョンが新しい（終了コード 1）
    condition: 手元のバージョンが呼んだ CLI のバージョンより新しい
    notes: 手元のバージョンと目標のバージョンと、`npx github:shuhei1101/mdmark#{手元のバージョン} upgrade` など手元のバージョン以上の CLI でもう一度呼ぶことを出す
  - name: 手元のバージョンの書式の誤り（終了コード 1）
    condition: 設定の `version` か、質問への回答が `v{MAJOR}.{MINOR}.{PATCH}` に合わない
    notes: 書式を示す
  - name: 回答が無い（終了コード 1）
    condition: 質問に回答する前に標準入力が終わった
    notes: 何も書き換えない。回答する質問を出す
  - name: 手順のファイルの誤り（終了コード 1）
    condition: 適用するバージョンの `steps.yaml` が読み込めないか、`schemas/mdmark.steps.schema.json` に合わないか、`call` のスクリプトが無い
    notes: 何も書き換えない。バージョンと合わないところと、mdmark をもう一度入れることを出す
  - name: 設定ファイルが無い・読み込めない（終了コード 1）
    condition: '`--config` のファイルが無い、今のフォルダと上のフォルダに `mdmark.config.yaml` が無い、または YAML として読み込めない'
    notes: '`mdmark check` と同じ文を出す'
constraints:
  - item: 目標のバージョン
    constraint: ビルドが呼んだ CLI（`dist/cli.js`）に埋めたバージョン（ライブラリ本体の `version()` と同じ出所）。`version.ini` は読み込まない。引数では受けない
    notes: hotfix のビルドは `version.ini` を上げず `--version` で打つタグのバージョンを埋める。引数で古いバージョンを受けると、呼んだ CLI の構造で点検して目標のバージョンでは正しい設定を戻してしまう
  - item: 手元のバージョン
    constraint: 設定の `version`。無ければ標準エラーに `手元のバージョン（v{MAJOR}.{MINOR}.{PATCH}）を入れてください:` を出し、標準入力の 1 行を手元のバージョンにする（`--plan` のときも聞く）
    decided_by: CFG-472-3#settings[version]
  - item: バージョンの比較
    constraint: '`v{MAJOR}.{MINOR}.{PATCH}` の 3 つの数を左から数として比べる'
  - item: 適用するバージョン
    constraint: パッケージの `migrations/` の直下の `v{バージョン}` のフォルダのうち、手元のバージョンより新しく目標のバージョン以下のものをバージョンの昇順に適用する。`migrations/next/` は読み込まない
    decided_by: ER-472-5#tables[migrations/{バージョン}/steps.yaml]
  - item: 手順の検め
    constraint: 適用する全てのバージョンの `steps.yaml` を、質問と書き換えの前に `schemas/mdmark.steps.schema.json` で検める。1 つでも合わなければ何も書き換えない
  - item: 質問の順
    constraint: 手元のバージョン → 値を聞く手順（適用する順。キーが既にある `set_default` は聞かない）→ 壊す手順の確認（`--yes` が無く壊すマーカーの手順が 1 つ以上あるとき 1 回だけ）の順に、全て書き換えの前に聞く。`--plan` では手元のバージョンだけを聞く。確認は `y` だけを承諾とする
  - item: コピー
    constraint: 書き換えの前に、設定ファイルと、手順が書き換えうる全てのファイル（`file`・`files` が指すものと、`replace_mark` の対象の文書）を、設定ファイルのあるフォルダの `.mdmark/backup/{yyyymmddHHMMSS}/` へ、そのフォルダからの相対パスを保って写す。`.mdmark/.gitignore`（中身は `*`）が無ければ配置する。適用した後も削除しない
    notes: 日時は利用者の手元の時刻
  - item: 戻し
    constraint: 手順の失敗か点検のずれで、コピーの全てのファイルを元の場所へ書き込んで戻す。`call` のスクリプトは `files` に挙げたものだけを書き換える
  - item: 再適用
    constraint: '`rename_key` は元のキーがあり新しいキーが無いときだけ名前を変え、他は何もしない。`set_default` はキーが無いときだけ追加する。`map_values` は値が解釈しの表の元の値のときだけ替える。`replace_mark` は `from` を `to` に書き換える（`to` は `from` を含まない）。`call` のスクリプトはもう一度適用しても結果が変わらないように記載する'
    decided_by: ER-472-5#tables[migrations/{バージョン}/steps.yaml]
    notes: コピーから戻せずに止まっても（Ctrl-C など）、次の `upgrade` が同じ手元のバージョンからもう一度適用できる
  - item: YAML の書き換え
    constraint: 設定と索引はコメント・キーの並び・触らないキーの記載方法を残して書き換える
    decided_by: LIB-472-36#
  - item: 文書
    constraint: '`replace_mark` と `files` の `documents` が指す文書は、設定の `build` の対象（`include` に該当し `exclude` に該当しないもの）と索引の文書。同じ文書は 1 回だけ扱う'
  - item: スクリプトの呼び方
    constraint: '`node {スクリプト} --config {設定ファイルの絶対パス}` を設定ファイルのあるフォルダで実行し、終了コード 0 以外を失敗にする。スクリプトが標準出力に書き込んだ行は、適用した手順の行の下に字下げして標準出力へ出し、失敗したときに標準エラーへ書き込んだ行は失敗の理由の後ろに標準エラーへ出す。スクリプトの拡張子は `.js` か `.mjs`。待ち時間は制限なし'
    notes: スクリプトは同じバージョンの mdmark の開発者が記載し、利用者が Ctrl-C で止められる。`npx` が入れたパッケージは `node_modules` の下にあり、Node はそこの `.ts` の型を落とさない（`ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING`）ため `.ts` は受けない
  - item: 点検
    constraint: 全ての手順を適用した後に、`mdmark check` と同じ点検（呼んだ CLI の構造）を実行する。文書の本文の知らないマーカー（`unknown_mark`）と今の書き方のマーカー（`legacy_mark`。書き換えない記載は移行の報告に挙げる）と、移行の報告に挙げた廃止した図の範囲（`retired_diagram`）は点検しない。図の定義の点検（`diagram_invalid`）は実行する。ずれが 0 件のときだけバージョンを書き換える
    decided_by: IF-472-39#
  - item: 文書のマーカーの移行
    constraint: 'マーカーの設定を JSON のオブジェクトで記載するバージョンの移行の手順は、`files` が `[documents]` の `call` の手順 1 つで、制約「文書」の文書のマーカーのうち、名前の後ろが `{` で始まらない記法のマーカーの引数を、ER 図『マーカーの設定の共通の決まり』の「今の引数との対応」の表で JSON のオブジェクトに書き換える。書き出すのは今の実装が適用している設定だけで、書き出した JSON のオブジェクトを描いた結果は、書き換える前の記載を描いた結果から、書き出さない記載の記載の警告を除いたものと同じになる（書き換えない拡張と `libraries` のマーカーの記載の警告は、前と後の両方に残る）。引数の無くなるマーカーは `<!-- 名前 -->` にする。コードブロックと行内のコードの中・閉じのマーカー・引数の無いマーカー・マーカーの外の本文は書き換えない。今の実装が適用していない記載（`+total` の無い表の `total=` など）・読み込めない記載（知らない絞り込みの種類など）は書き出さず、拡張と設定の `libraries` のマーカーは引数をキーへ移す対応を持たないため書き換えない。どれも移行の報告の行（`{文書の相対パス}:{行}: {マーカーの名前}: {記載}: {書き出さない理由か書き換えない理由}`）を標準出力に 1 つずつ書き、制約「スクリプトの呼び方」のとおり手順の行の下に出す。報告の行が無ければ書き換えた文書の数だけを書く'
  - item: 廃止した図の範囲の移行
    constraint: '`flow`・`sequence` を廃止したバージョンの移行の手順は、`files` が `[config, documents]` の `call` の手順 1 つで、制約「文書」の文書の `<!-- flow -->`・`<!-- sequence -->` の範囲（コードブロックと行内のコードの中を除く）を、`<!-- map: {"title": "{題名}"} -->` 〜 `<!-- /map -->` の範囲（Mermaid の `mermaid` のブロック 1 つと補足 `<!-- map-data: {JSON のオブジェクト} -->`）に書き換える。フロー図は `flowchart` にし、`frame` と `lanes` を `subgraph` の入れ子、ノードと線とラベルを同じ ID と向き、判定フローチャートの開始・質問・アクション・結果のノードを Mermaid のノードの形、ノードの種類を Mermaid のクラス、`flow` 以外の線の種類を補足の `layout` の `line`、ノードの `href` を `click` の行、ノードの `hint`・`io` と線の `tip` と `frame`・`lanes` の `hint` を補足の `notes` の説明にする。シーケンス図は `sequenceDiagram` にし、参加者を `participant`、メッセージを元の順と向き（`reply` は点線の矢印）、`loop` を最後のメッセージから最初までを囲む `loop` 〜 `end`、メッセージの `tip` を補足の `notes` の説明にする。文書が使っていたノードの種類と線の種類は、設定の `map.kinds`・`map.lines` に名前・アイコン・形・模様として書き足す（同じ名前の行があれば書き換えない）。座標と大きさは写さず、報告にも挙げない。題の行の範囲・更新日と `stickyTitles` は書き出さず、範囲の外の本文・コードブロックの中は書き換えない。部品の定義を読めない範囲は書き換えない。写さない値と書き換えない範囲は、移行の報告の行（`{文書の相対パス}:{行}: {マーカーの名前}: {項目}: {理由}`）を標準出力に 1 つずつ書く'
    decided_by: SC-472-27#scenarios[正常シナリオ（座標で書いた図を map へ書き換える）]
    notes: 種類ごとの Mermaid の形とクラス、`map.kinds`・`map.lines` の値の対応はモジュール構成設計。確認ログ『今の flow・sequence を map へ変換する方法』
  - item: バージョンの書き換え
    constraint: 設定の `version` を目標のバージョンにする。無ければ最上位の先頭に追加する
  - item: 変更履歴
    constraint: パッケージの `docs/guide/変更履歴.md` の表のうち、バージョンの列が手元のバージョンより新しく目標のバージョン以下の行を、表の並びで出す。PR の列はリンクの文字（`#40`）だけを出す
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
