id: IF-472-15
visibility: internal
title: "HTMLに書き出す"
entry:
  kind: operation
  value: コマンド `mdmark.exportHtml`
flows:
  - name: 正常系
    summary: Markdown と同じフォルダに書き出し、通知からブラウザで開く
    setup:
      - name: 見本のワークスペース
        description: 見出し・表・注意書き・map の構成図と `./images/figure.png` を持つ `docs/guide.md` を開いた状態。`mdmark.export.outputDir` は既定の空。`</script>` を含むコードブロックを持つ
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ配信元とタグ一覧の代役。`showInformationMessage` は「ブラウザで開く」を返却する代役、`env.openExternal` は URL を記録する代役。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant BR as 既定のブラウザ
        U->>EX: mdmark.exportHtml
        EX->>EX: バージョンを決めて HTML を組む
        EX->>EX: docs/guide.html を書き込む
        EX->>U: 書き出したパスと「ブラウザで開く」
        U->>EX: ブラウザで開く
        EX->>BR: env.openExternal（docs/guide.html）
    expected:
      - '`docs/guide.html` が 1 つ記載され、戻り値がそのファイル'
      - 通知に `docs/guide.html` のパスと「ブラウザで開く」が出る
      - '`env.openExternal` の代役に `docs/guide.html` の `file:` の URL が渡る'
      - HTML を開くと、見出し・表・注意書き・map の構成図が描かれ、画像の `naturalWidth` が 0 より大きく、コードブロックの `</script>` が文字のまま出る
    test: test_normal
  - name: 正常系（書き出す先を指定する）
    summary: '`mdmark.export.outputDir` のフォルダに書き込み、保存していない書き換えも入れる'
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.export.outputDir` を `out`（無いフォルダ）にし、見出しを保存せずに書き換える
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.exportHtml
        EX->>EX: out/ を作り out/guide.html を書き込む
    expected:
      - ワークスペースの直下の `out/guide.html` が記載され、`docs/guide.html` は記載されない
      - HTML を開くと、保存していない見出しが描かれ、`docs/images/figure.png` の画像が読み込めている
    test: test_normal_when_output_dir
  - name: 異常系（書き出せない・通知）
    summary: 書き出す先に書き込めないとき、理由を通知して何も残さない
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.export.outputDir` に書き込みを許さないフォルダを指定する
      - name: Mock
        description: 正常系と同じ。`showErrorMessage` は文字を記録する代役
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.exportHtml
        EX->>EX: 書き出す先に書き込めない
        EX->>U: 書き出せない理由の通知
    expected:
      - 戻り値が `undefined`
      - '`showErrorMessage` の文字に書き出す先のパスと記載できない理由が入る'
      - 書き出す先に `.html` も一時ファイルも残らず、`env.openExternal` の代役は呼ばれない
    test: test_error_when_output_unwritable
  - name: 異常系（バージョンを決められない・通知）
    summary: 読み込むバージョンを決められないときは記載せずに理由を通知する
    setup:
      - name: 見本のワークスペース
        description: 正常系と同じ。`mdmark.lastVersion` は空
      - name: Mock
        description: タグ一覧の代役は応えない。`showErrorMessage` は文字を記録する代役
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.exportHtml
        EX->>EX: タグ一覧を取れず前回のバージョンも無い
        EX->>U: 理由の通知
    expected:
      - 戻り値が `undefined` で、`.html` が記載されない
      - '`showErrorMessage` が 1 回呼ばれる'
    test: test_error_when_version_undecidable
  - name: 正常系（選んだテーマで書き出す）
    summary: 設定ファイルの `colorTheme` を `mdmark.colorTheme` で上書きしたテーマで、書き出した HTML を描く
    setup:
      - name: テーマを選んだワークスペース
        description: '正常系と同じ `docs/guide.md` を開き、`mdmark.config.yaml` は `colorTheme: theme-paper`、`mdmark.colorTheme` は `theme-slate`'
      - name: Mock
        description: '正常系と同じ。書き出した HTML は Playwright の Chromium で file:// で開き、配色はライト（`prefers-color-scheme: light`）にする'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant H as 書き出した HTML
        U->>EX: mdmark.exportHtml
        EX->>EX: colorTheme を mdmark.colorTheme で上書きした config で HTML を組む
        EX->>H: docs/guide.html を書き込む
        U->>H: 開く
        H-->>U: theme-slate で描く
    expected:
      - 書き出した HTML に埋めた `config` の `colorTheme` が `theme-slate`
      - 開いた HTML で、描く先の要素の地の色の計算値が theme-slate の明るい配色の `--mdmark-color-bg` の値
    test: test_normal_when_color_theme_selected
  - name: 正常系（相対パスの外部ライブラリを埋める）
    summary: 相対パスの `libraries` と `html-scripts.url` を `data:` の URL で埋め、Chromium で file:// で開いて描く
    setup:
      - name: 手元のライブラリを指すワークスペース
        description: '`mdmark.config.yaml` の `libraries` に、`test-lib` として同じフォルダの別のファイルを import する手元のモジュールと、`unused-lib` として目印の文字列を持つモジュールを相対パスで記載し、`features.html-scripts: true` と `html-scripts.url` に変換のライブラリの手元のコピーを相対パスで記載する。Markdown は `test-lib` のマーカーと `ts` の範囲を持ち、`unused-lib` のマーカーを持たない'
      - name: Mock
        description: 正常系と同じ。書き出した HTML は Playwright の Chromium で file:// で開き、要求を記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant BR as Chromium
        U->>EX: mdmark.exportHtml
        EX->>EX: test-lib と変換のライブラリを esbuild-wasm でまとめる
        EX->>EX: data: の URL を config に配置した docs/guide.html を書き込む
        U->>BR: docs/guide.html を file:// で開く
        BR-->>U: test-lib のマーカーと範囲のスクリプトを描いた文書
    expected:
      - 書き出した HTML に埋めた `config.libraries["test-lib"]` と `config["html-scripts"].url` が `data:text/javascript` で始まり、`config.libraries` に `unused-lib` が無い
      - 書き出した HTML の `data:` の URL を復号した中に、`unused-lib` の目印の文字列が無い
      - 開いた HTML で、`test-lib` のマーカーの場所がそのライブラリで描かれ、通知ブロック（`.mdmark-notice`）が無い
      - 開いた HTML で、範囲の `ts` が記載した結果が範囲の要素に出る
      - 開いている間に、書き出した HTML 以外の `file:` の URL への要求が記録されない
    test: test_normal_when_relative_libraries
  - name: 正常系（設定ファイルの明暗で書き出す）
    summary: '`mdmark.preview.theme` によらず、設定ファイルの `colorScheme` を埋めた HTML を書き出す'
    setup:
      - name: 明暗を記載したワークスペース
        description: '正常系と同じ `docs/guide.md` を開き、`mdmark.config.yaml` は `colorScheme: dark`、`mdmark.preview.theme` は `light`'
      - name: Mock
        description: '正常系と同じ。書き出した HTML は Playwright の Chromium で file:// で開き、配色はライト（`prefers-color-scheme: light`）にする'
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant H as 書き出した HTML
        U->>EX: mdmark.exportHtml
        EX->>EX: 設定ファイルの colorScheme を入れた config で HTML を組む
        EX->>H: docs/guide.html を書き込む
        U->>H: 開く
        H-->>U: ダークの配色で描く
    expected:
      - 書き出した HTML に埋めた `config` の `colorScheme` が `dark`
      - 開いた HTML で、描く先の要素が class `mdmark-theme-dark` を持ち、地の色の計算値がダークの `--mdmark-color-bg` の値
    test: test_normal_when_config_color_scheme
    refs:
      - SC-472-6#
  - name: 正常系（設定ファイルの部品の文言で書き出す）
    summary: 設定ファイルの `labels` を埋めた HTML を書き出し、開いた HTML で操作できる部品のボタンを設定の文言で描く
    setup:
      - name: 部品の文言を記載したワークスペース
        description: '`docs/guide.md` は `<!-- param -->` のマーカーで操作できる部品の定義を 1 つ持ち、`mdmark.config.yaml` は `labels.paramCopy: コピー`'
      - name: Mock
        description: 正常系と同じ。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant H as 書き出した HTML
        U->>EX: mdmark.exportHtml
        EX->>EX: 設定ファイルの labels を入れた config で HTML を組む
        EX->>H: docs/guide.html を書き込む
        U->>H: 開く
        H-->>U: ボタンを「コピー」で描く
    expected:
      - '書き出した HTML に埋めた `config` の `labels` が `{ paramCopy: "コピー" }`'
      - 開いた HTML で、`button.mdmark-param-copy` の `textContent` が `コピー`
    test: test_normal_when_param_copy_label
    refs:
      - SC-472-6#
  - name: 正常系（相対パスの mermaid を読み込む）
    summary: 相対パスの `mermaid.url` を、本体と chunk をまとめた `data:` の URL で埋め、Chromium で file:// で開いて描く
    setup:
      - name: 手元の mermaid を指すワークスペース
        description: '`mdmark.config.yaml` の `mermaid.url` に、mermaid の本体と chunk の手元のコピーを相対パスで記載し、Markdown は言語 `mermaid` の flowchart のコードブロックを 1 つ持つ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: 相対パスの mermaid をまとめて data: の URL で埋める
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 図の枠に入った mermaid の図
    expected:
      - 書き出した HTML に埋めた `config.mermaid.url` が `data:text/javascript` で始まる
      - Chromium で開くと、mermaid のコードブロックの場所に `figure.mdmark-diagram[data-diagram="mermaid"]` があり、通知ブロックが出ない
    test: test_normal_when_relative_mermaid
  - name: 正常系（ツールチップの位置と相対パスの色分けのライブラリ）
    summary: 相対パスの `syntax.url` の本体と文書が使用する言語のモジュールを `data:` の URL にして import map で割り当て、Chromium で file:// で開いて色分けし、ツールチップを参照の下に出す
    setup:
      - name: 見本のワークスペース
        description: '`ts` のコードブロックと脚注の参照を 1 つずつ持つ Markdown と、`tooltips.placement: bottom` と `syntax.url: ./hljs/` を記載した `mdmark.config.yaml` と、`@highlightjs/cdn-assets` の `es/` フォルダのコピーの `hljs/` を配置したフォルダ'
        notes: '`hljs/languages/` の、Markdown が使用しない言語のモジュール 1 つの末尾に、他のファイルに出ない目印のコメントを追加する'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant B as ブラウザ（Chromium）
        W->>EX: mdmark: HTML に書き出す
        EX->>EX: core.min.js と languages/typescript.min.js をまとめて data: の URL にし、import map で割り当てる
        W->>B: 書き出した HTML を file:// で開く
        B-->>W: 色分けしたコードブロック
        W->>B: 脚注の参照にフォーカスを移す
        B-->>W: 参照の下に出たツールチップ
    expected:
      - '書き出した HTML に埋めた `config.tooltips` が `{ placement: "bottom" }` で、`config.syntax.url` が `hljs/` フォルダの `file:` の URL で `/` で終わる'
      - 書き出した HTML の `<script type="importmap">` の `imports` が、`{config.syntax.url}core.min.js` と `{config.syntax.url}languages/typescript.min.js` の 2 つだけを `data:text/javascript` で始まる URL に割り当てる
      - 書き出した HTML に目印の文字列が無い
      - Chromium で開くと、`ts` のコードブロックの中に class が `hljs-` で始まる要素があり、脚注の参照にフォーカスを移すと `role="tooltip"` のツールチップの上端が参照の下端より下にある
      - 開いている間に、書き出した HTML 以外の `file:` の URL への要求が出ない
    test: test_normal_when_tooltips_and_relative_syntax
    refs:
      - SC-472-6#scenarios[正常シナリオ（ツールチップの位置と相対パスの色分けのライブラリ）]
  - name: 正常系（設定の aliases のエイリアス）
    summary: 設定の `aliases` から作ったエイリアスを HTML に埋め、`mount` の `opts.aliases` に指定して下線とツールチップを出す
    setup:
      - name: エイリアスを持つワークスペース
        description: プレビューを開く.ts の正常系（設定の aliases のエイリアス）と同じ `mdmark.config.yaml`・`glossary.yaml`・`guide.md` を配置したフォルダ
      - name: Mock
        description: 正常系と同じ。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant BR as Chromium
        U->>EX: mdmark.exportHtml
        EX->>EX: 重ねた設定の aliases の行が指す glossary.yaml を読み込み、エイリアスを作る
        EX->>EX: エイリアスを埋め、mount に aliases を指定する guide.html を書き込む
        U->>BR: guide.html を file:// で開く
        BR-->>U: 別名に下線を付けた文書
    expected:
      - '書き出した HTML に埋めた `aliases` が 1 件で、その要素の `alias_type` が `term`・`name` が `描画`・`aliases` が `["レンダリング"]`'
      - 開いた HTML の本文の `レンダリング` が用語の下線の要素に包まれている
      - 下線の要素にフォーカスを移すと、`role="tooltip"` のツールチップの「用語」の区分に `描画` と `glossary.yaml` の意味が出る
      - 設定に `aliases` が無いワークスペースで書き出した HTML は、埋めた JSON に `aliases` を持たず、`mount` に `aliases` を指定しない
    test: test_normal_when_aliases
    refs:
      - SC-472-6#scenarios[正常シナリオ（設定の aliases のエイリアス）]
  - name: 異常系（aliases の YAML が無い・行を除いて書き出す）
    summary: '`aliases` の行の `paths` に該当するファイルが無いとき、その行を除いたエイリアスを埋めて書き出し、出力チャネルに警告を記録する'
    setup:
      - name: エイリアスを持つワークスペース
        description: 正常系（設定の aliases のエイリアス）の `aliases` の 2 行目に、`paths` が `missing/*.yaml`（該当するファイルが無い）の行を追加したもの
      - name: Mock
        description: 正常系と同じ。出力チャネルへ書き込んだ行を記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.exportHtml
        EX->>EX: aliases の 2 行目に該当するファイルが無い
        EX->>EX: 出力チャネルに警告を記載する
        EX->>EX: 1 行目のエイリアスを埋めた guide.html を書き込む
        EX->>U: 書き出したパスと「ブラウザで開く」
    expected:
      - '`docs/guide.html` が 1 つ記載され、戻り値がそのファイル'
      - 書き出した HTML に埋めた `aliases` が 1 行目の用語だけを持つ
      - '出力チャネルに `mdmark.config.yaml:aliases[1].paths: alias_no_files:` で始まる警告が 1 行ある'
      - '`showErrorMessage` は呼ばれない'
    test: test_error_when_aliases_missing
    refs:
      - SC-472-6#scenarios[異常シナリオ（aliases の YAML が無い）]
lead: 開いている Markdown を、jsDelivr の配布物を読み込んで `mount` で描く 1 つの HTML に書き出し、書き出したパスを通知で通知する。
idempotent: true
side_effects: 書き出す先に `{Markdown の名前}.html` を書き込む（あれば上書きする）。`mdmark.version` が `latest` のときはタグ一覧を 1 回取る。設定に `aliases` があるときは、その行の `paths` の YAML を読み込む。Markdown は書き換えない
callers:
  - SC-472-6#
exclusivity: 同じ書き出す先への書き出しが重なったら、後に書き込み終えた内容が残る（一時ファイルから置き換えるため、書き込みかけは残らない）
request:
  - name: uri
    type: vscode.Uri
    required: false
    default: なし（フォーカスのあるプレビューか、アクティブなエディタの Markdown）
    location: argument
    description: 書き出す Markdown
    constraints: '`languageId` が `markdown` の文書'
response:
  - name: '-'
    type: Promise<vscode.Uri | undefined>
    description: 書き出した HTML のファイル。書き出せなかったときは `undefined`
exceptions:
  - name: なし（正常終了）
    condition: HTML を書き込み、書き出したパスと「ブラウザで開く」の通知を出す
  - name: なし（書き出せない）
    condition: 書き出す先に書き込めない
    notes: 例外を投げず、書き出す先のパスと理由を `showErrorMessage` で出す。一時ファイルは削除する
  - name: なし（バージョンを決められない）
    condition: '`mdmark.version` が `latest` で、タグ一覧を取れず `mdmark.lastVersion` も無い'
    notes: 記載せずに、理由を `showErrorMessage` で出す
  - name: なし（aliases の YAML を使用できない）
    condition: '`aliases` の行の `paths` に該当するファイルが無い・YAML として読み込めない・行やレコードが `buildAliases` で使用できない'
    notes: 例外を投げず、使用できない行・レコードを除いたエイリアスを埋めて書き出し、出力チャネルに警告を記載する
constraints:
  - item: 書き出す先
    constraint: '`mdmark.export.outputDir` が空なら Markdown と同じフォルダ、相対パスなら Markdown を含むワークスペースのフォルダから、絶対パスならそのまま。ファイル名は Markdown の拡張子を `.html` に替えたもの。フォルダが無ければ作る。同じフォルダの一時ファイルに書き込んでから置き換える'
  - item: 書き出す中身
    constraint: '`TextDocument.getText()` の全文（保存していない書き換えを含む）を、`<script type="application/json">` に JSON で埋める（JSON の中の `<` は、JSON の Unicode エスケープであるバックスラッシュ・`u`・`003c` の 6 文字に置き換え、本文の `</script>` で `script` 要素が閉じないようにする）。バージョンはプレビューを開く.ts の制約「バージョンの決め方」で決め、`<link>` と `<script type="module">` でそのバージョンの jsDelivr の `dist/index.css`・`dist/index.js` を読み込み、`mount(document.querySelector("main"), { markdown, config })` を呼ぶ。制約「エイリアス」のエイリアスがあるときは、同じ JSON に `aliases` を埋め、`mount` の `opts.aliases` に指定する'
  - item: 設定と相対パス
    constraint: '`config` はプレビューを再描画する.ts の制約「設定の取り出し方」と同じ。`colorScheme` は `mdmark.preview.theme` によらず設定ファイルの値を指定する（`mdmark.preview.theme` はプレビューのパネルだけの配色）。`colorTheme` は `mdmark.colorTheme` が空でないときはその値で上書きする（プレビューを再描画する.ts の制約「送信する中身」と同じ）。重ねた設定はインターフェース定義『設定を重ねて読み込む』を `purpose: export` で呼んで得る。`libraries` と `html-scripts.url` の相対パスは、その値を記載した設定ファイルのフォルダから解決し、制約「埋めるライブラリ」のとおり HTML に埋める。`syntax.url` の相対パスは、同じく解決し、制約「埋める色分けのライブラリ」のとおり HTML に埋める。`theme` の CSS は HTML の `<style>` に埋め、`extensions` のモジュールは、インターフェース定義『文書をHTMLに書き出す』の制約「まとめるスクリプト」と同じ引数で、拡張機能の中では esbuild-wasm でまとめて HTML に埋め（`.ts` も読み込む。まとめられない拡張は飛ばして書き出す）、`mount` の前に登録する（`file:` のページから `file:` のモジュールを `import()` すると Chromium 系のブラウザが読み込まないため）。HTML に `<base href="{Markdown のフォルダの file: の URL}/">` を配置し、本文の相対パスの画像とリンクを Markdown のフォルダから解決する'
    notes: '`http:`・`https:` の `libraries`・`html-scripts.url`・`mermaid.url`・`syntax.url` は URL のまま読み込む。相対パスの `mermaid.url` は、`html-scripts.url` と同じく本体と chunk をまとめた `data:` の URL で埋める'
  - item: 通信
    constraint: 書き出した HTML は、開くときに jsDelivr へ届く必要がある。配布物を HTML に埋めない
    notes: 要件.md の確認ログ「書き出す HTML の作り方」。外へ要求しない 1 枚の HTML は CLI の `mdmark export` が作る
  - item: 通知
    constraint: 書き出せたら `showInformationMessage` で書き出したパスと「ブラウザで開く」のボタンを出し、押されたら `env.openExternal` で開く。文言は画面設計で決める
  - item: 埋めるライブラリ
    constraint: 相対パスの `libraries` は、文書にマーカーがある名前のモジュールだけを、相対パスの `html-scripts.url` は、文書に `ts`・`js` の範囲があり重ねた設定と文書のマーカーで `html-scripts` がオンのときだけ変換のライブラリを、`extensions` と同じく esbuild-wasm で import する先も含めて 1 つの ES モジュールにまとめ、`data:text/javascript` の URL にして `config` のそのキーの値に配置する。文書にマーカー・範囲が無い相対パスの値は `config` から除外する。まとめられないモジュールは埋めず、出力チャネルに警告を記録して書き出しを続ける（開いたときそのマーカー・範囲に mdmark が通知ブロックを出す）
    notes: Chromium 系のブラウザは `file:` のページから `file:` の ES モジュールを動的 `import()` で読み込まないため。変換のライブラリは範囲を変換して埋めずにそのまま埋め、配布物の `mount` の公開の引数を変えない
  - item: 埋める色分けのライブラリ
    constraint: '相対パスの `syntax.url` は、文書に色分けの対象のコードブロックがあるときだけ（使用する言語は `src/render/used.ts` の `usedSyntaxLanguages` で求める）、解決したフォルダの `core.min.js` と、使用する言語の `languages/{言語}.min.js` を 1 つずつ esbuild-wasm でまとめて `data:text/javascript` の URL にする。HTML の `<script type="module">` より前に `<script type="importmap">` を配置し、`imports` で `{解決したフォルダの file: の URL}/core.min.js`・`{同}/languages/{言語}.min.js` をその URL に割り当て、`config.syntax.url` を解決したフォルダの `file:` の URL（末尾に `/`）にする。色分けの対象が無いときは `syntax.url` を `config` から除外し、import map を配置しない。まとめられないモジュールは割り当てず、出力チャネルに警告を記録して書き出しを続ける（開いたとき、そのモジュールを使用するコードブロックは色分けせずに描かれる）'
    notes: '`syntax.url` は本体と言語のモジュールを読み込むフォルダの URL で、1 つの `data:` の URL では表せない。配布物の公開の引数を変えないため、CLI が使用する `setEmbeddedSyntax` は使用しない'
  - item: エイリアス
    constraint: '重ねた設定に `aliases` があるとき、プレビューを開く.ts の制約「エイリアス」と同じ読み込み方（`src/cli/aliases.ts` の `loadAliases`、指定する設定ファイルも同じ）でエイリアスを作り、HTML に埋める（`buildAliases` が返す `aliases` で、`env` を含まない）。設定に `aliases` が無いときは、埋めた JSON に `aliases` を持たず、`mount` に `aliases` を指定しない。使用できない行・レコードは除き、ずれごとにプレビューと同じ書式の警告を出力チャネルに書き込み、書き出しを続ける'
    notes: '`mdmark.openInBrowser`・`mdmark.printToPdf` も同じ HTML を組むため、同じエイリアスを埋める'
