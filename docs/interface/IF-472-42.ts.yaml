id: IF-472-42
visibility: internal
title: "雛形を配置する"
entry:
  kind: operation
  value: '`mdmark init [{配置先のフォルダ}] [--js]`（CLI。`npx github:shuhei1101/mdmark#v{バージョン} init` で呼ぶ）'
flows:
  - name: 正常系
    summary: 空のフォルダに TypeScript の雛形を配置する
    setup:
      - name: 空のフォルダ
        description: 配置先の一時フォルダ。何も配置していない
      - name: Mock
        description: 差し替える依存は無い（CLI を子プロセスで実行する）
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init {フォルダ}
        C->>F: 6 つの雛形を書き込む
        C-->>W: 配置した 6 つの行・終了コード 0
    expected:
      - 終了コードが 0
      - '`mdmark.config.yaml`・`theme.css`・`index.yaml`・`extensions/example.ts`・`tsconfig.json`・`package.json` がある'
      - '`mdmark.config.yaml` と `index.yaml` が設定と索引の JSON Schema に合う'
      - '`mdmark.config.yaml` の `version` が、ビルドした CLI に埋めたバージョン'
      - 標準出力に `配置した:` の行が 6 つ、雛形の並びで出る
    test: test_normal
  - name: 正常系（JavaScript を指定する）
    summary: '`--js` で JavaScript の拡張の雛形を配置する'
    setup:
      - name: 空のフォルダ
        description: 正常系と同じ
        notes: '`--js`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init {フォルダ} --js
        C->>F: 設定・theme.css・索引・extensions/example.js・tsconfig.json を書き込む
        C-->>W: 配置した 5 つの行・終了コード 0
    expected:
      - 終了コードが 0
      - '`extensions/example.js` と `tsconfig.json` があり、`extensions/example.ts`・`package.json` が無い'
      - '`extensions/example.js` の 1 行目が `// @ts-check` で、JSDoc の `@type` が `MdmarkExtension` を指す'
      - '`tsconfig.json` の `compilerOptions` が `allowJs`・`checkJs`・`noEmit` を `true` で持つ'
      - 配置したフォルダに、ビルドした `dist/index.d.ts` を `mdmark/index.d.ts` として配置し `tsc --noEmit` を実行すると、誤り 0 件で終了コード 0。`example.js` の `draw` に `slot.textContent = value.args.length` のように型に合わない行を追加すると、そのファイルと行を出して終了コードが 0 以外
      - '`mdmark.config.yaml`・`theme.css`・`index.yaml` が正常系と同じ中身'
    test: test_normal_when_javascript
  - name: 正常系（既にあるファイルがある）
    summary: 既にあるファイルを上書きせず、無いものだけを配置する
    setup:
      - name: 設定を記載したフォルダ
        description: 中身を記載した `mdmark.config.yaml` だけがあるフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant F as フォルダ
        W->>C: mdmark init {フォルダ}
        C->>F: mdmark.config.yaml のほかの 5 つを記載する
        C-->>W: 配置しなかった 1 つと配置した 5 つの行・終了コード 0
    expected:
      - 終了コードが 0
      - '`mdmark.config.yaml` の中身が変わっていない'
      - '標準出力に `配置しなかった（既にある）: mdmark.config.yaml` と `配置した:` の行が 5 つ出る'
    test: test_normal_when_file_exists
  - name: 異常系（配置先に記載できない・終了コード 1）
    summary: 配置先のフォルダを作れないと、書き込めないパスを示して終わる
    setup:
      - name: ファイルを指す配置先
        description: 配置先のフォルダのパスに、同じ名前のファイルがある
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark init {ファイルのパス}
        C-->>W: 書き込めないパスと修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに配置先のパスと修正方法が出る
      - 配置先のファイルが変わっていない
    test: test_error_when_unwritable
lead: 文書の作成者が、設定・利用側の CSS・索引・拡張の雛形をフォルダに配置する。雛形の原本はリポジトリの `templates/` に配置し、既にあるファイルは上書きしない。
idempotent: true
side_effects: 配置先のフォルダに、無い雛形のファイルとフォルダを書き込む
callers:
  - SC-472-83#
  - SC-472-79#
request:
  - name: '{配置先のフォルダ}'
    type: string
    required: false
    default: '`.`（今のフォルダ）'
    location: argument
    description: 雛形を配置するフォルダ
    notes: 無ければ作る
  - name: --js
    type: boolean
    required: false
    default: false（TypeScript の拡張の雛形を配置する）
    location: argument
    description: 拡張の雛形を JavaScript で配置する
    notes: '`package.json` を配置せず、`tsconfig.json` は JavaScript を点検するものを配置する'
response:
  - name: 標準出力
    type: string
    description: '配置したファイルの行（`配置した: {パス}`）と、既にあって配置しなかったファイルの行（`配置しなかった（既にある）: {パス}`）を、雛形の並びで 1 行ずつ出す'
    notes: パスは配置先のフォルダからの相対パス
  - name: 終了コード
    type: 0 | 1
    description: 配置できたら（配置しなかったファイルがあっても）0、書き込めなかったら 1
response_example: |-
  ```text
  配置しなかった（既にある）: mdmark.config.yaml
  配置した: theme.css
  配置した: index.yaml
  配置した: extensions/example.ts
  配置した: tsconfig.json
  配置した: package.json
  ```
exceptions:
  - name: なし（正常終了）
    condition: 無い雛形を全て記載した（既にあるファイルは配置せずに一覧に出す）。終了コード 0
  - name: 記載できない（終了コード 1）
    condition: 配置先のフォルダを作れない、またはファイルを書き込めない
    notes: 標準エラーに書き込めなかったパスと修正方法の 1 文を出す。記載できたファイルは残す
constraints:
  - item: 配置する雛形
    constraint: '`mdmark.config.yaml`（`version`・`index`・`theme`・`build` を記載した設定）・`theme.css`（CSS 変数を上書きする例）・`index.yaml`（文書と用語が 0 件の索引）・`extensions/example.ts`（`registerExtension` に指定する拡張を既定の export にする例）・`tsconfig.json`・`package.json`（拡張の型の検査と JavaScript への変換のコマンド）。`--js` のときは、`extensions/example.js`（先頭に `// @ts-check` を配置し、JSDoc の `@type` で `../mdmark/index.js` の `MdmarkExtension` を付けた同じ例）と、JavaScript を変換せずに点検する `tsconfig.json`（`allowJs`・`checkJs`・`noEmit`・`strict` で `extensions` を含める）を配置し、`package.json` を配置しない'
    notes: 並びはこの順。中身の原本は `templates/`（`--js` の `tsconfig.json` は `templates/js/tsconfig.json`）。型は、使用するバージョンの `dist/index.d.ts` を `mdmark/` に配置して読み込む（TypeScript の雛形と同じ）
  - item: 上書き
    constraint: 既にあるファイルは中身を読み込まず、配置せずに一覧に出す。上書きの指定は持たない
  - item: 配置した設定と索引の構造
    constraint: 配置した `mdmark.config.yaml` と `index.yaml` は、`schemas/mdmark.config.schema.json` と `schemas/mdmark.index.schema.json` に合う
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
  - item: 設定のバージョン
    constraint: 配置する `mdmark.config.yaml` の `version` は、ビルドが呼んだ CLI に埋めたバージョン。`templates/mdmark.config.yaml` の `version` の値を配置するときに置き換える
    decided_by: CFG-472-3#settings[version]
test_file: tests/integration/lib/init.test.ts
