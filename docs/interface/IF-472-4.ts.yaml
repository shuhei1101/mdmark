id: IF-472-4
visibility: internal
title: "MCPサーバーを起動・停止する"
entry:
  kind: operation
  value: '`mdmark serve`（CLI。`npx github:shuhei1101/mdmark#v{バージョン} serve` で呼ぶ）'
flows:
  - name: 正常系
    summary: 起動して待ち受ける URL を出し、instructions とツールの一覧を返却する
    setup:
      - name: Mock
        description: ビルドしたこのリポジトリの CLI を子プロセスで実行し、HTTP でつなぐ MCP のクライアントで `initialize` と `tools/list` を呼ぶ
      - name: 空いているポート
        description: '`MDMARK_PORT` に空きポートを指定する。手元の `mdmark serve` が使用する 8782 はテストで使用しない（既定のポートの値は単体テスト `test_read_port` で確認する）'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant S as mdmark serve
        participant C as MCP のクライアント
        W->>S: mdmark serve
        S-->>W: 待ち受ける URL
        C->>S: POST /mcp（initialize）
        S-->>C: instructions
        C->>S: POST /mcp（tools/list）
        S-->>C: 6 つのツール
    expected:
      - 標準出力に `http://127.0.0.1:{指定したポート}/mcp` を含む 1 行が出る
      - '`initialize` の `instructions` が制約『instructions』の文で、4,096 文字以下で、`MDMARK_LAUNCHER` を指定しないとき tmux のセッション名 `mdmark-mcp` を含む'
      - '`tools/list` が `export_html`・`build_site`・`check`・`list_templates`・`add_template`・`apply_template` の 6 つのツールを返却し、`read_guide` が無く、どのツールの `inputSchema` も `project_dir` を持たない'
      - プロセスが動き続けている
    test: test_normal
  - name: 正常系（unit で動いている）
    summary: '`MDMARK_LAUNCHER=systemd` で起動すると、instructions が unit の名前とログを確認する操作を伝える'
    setup:
      - name: Mock
        description: 正常系と同じで、`MDMARK_LAUNCHER=systemd` を指定する
    flow: |-
      sequenceDiagram
        participant S as mdmark serve
        participant C as MCP のクライアント
        C->>S: POST /mcp（initialize）
        S-->>C: instructions
    expected:
      - '`instructions` が 4,096 文字以下で、unit の名前 `mdmark-mcp` と `journalctl --user -u mdmark-mcp` を含み、tmux のセッションを含まない'
    test: test_normal_when_launched_by_systemd
  - name: 正常系（ポートを上書きする）
    summary: '`MDMARK_PORT` のポートで起動する'
    setup:
      - name: Mock
        description: 正常系と同じで、`MDMARK_PORT=18782` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant S as mdmark serve
        participant C as MCP のクライアント
        W->>S: MDMARK_PORT=18782 mdmark serve
        S-->>W: 待ち受ける URL
        C->>S: POST :18782/mcp（tools/list）
        S-->>C: 6 つのツール
    expected:
      - 標準出力に `http://127.0.0.1:18782/mcp` を含む 1 行が出る
      - 18782 の `/mcp` への `tools/list` が 6 つのツールを返却する
    test: test_normal_when_port_overridden
  - name: 正常系（止める）
    summary: SIGINT を受けて待ち受けを閉じ、終了コード 0 で終わる
    setup:
      - name: Mock
        description: 正常系と同じで起動した後、子プロセスへ SIGINT を送信する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant S as mdmark serve
        W->>S: Ctrl+C（SIGINT）
        S->>S: 待ち受けを閉じる
        S-->>W: 終了コード 0
    expected:
      - 終了コードが 0
      - ポートへつなぐと接続を拒まれる
    test: test_normal_when_stop
  - name: 異常系（ポートが使用されている・終了コード 1）
    summary: ポートを別のプロセスが使用しているとき、対処を出して終わる
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 使用されているポート
        description: テストが同じポートで待ち受けるサーバーを先に起動する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant S as mdmark serve
        W->>S: mdmark serve
        S->>S: 待ち受けに失敗（EADDRINUSE）
        S-->>W: 対処・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラー出力にポートの番号・`MDMARK_PORT` を `~/.claude/settings.json` の `env` と `mdmark serve` の環境の両方に設定すること・`mdmark serve` が既に起動しているならそのまま使用できることが出る
    test: test_error_when_port_in_use
  - name: 異常系（MDMARK_PORT が使用できない値・終了コード 1）
    summary: '`MDMARK_PORT` が整数でないとき、待ち受けずに終わる'
    setup:
      - name: Mock
        description: 正常系と同じで、`MDMARK_PORT=abc` を指定する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant S as mdmark serve
        W->>S: MDMARK_PORT=abc mdmark serve
        S->>S: 値を確認する
        S-->>W: 対処・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラー出力に `abc` と、1〜65535 の整数を設定することが出る
    test: test_error_when_port_invalid
lead: Claude Code のプラグインがつなぐ MCP の常駐サーバーを、127.0.0.1 の Streamable HTTP で起動する。Ctrl+C（SIGINT）か SIGTERM で止める。
side_effects: 127.0.0.1 のポートで待ち受ける
request:
  - name: MDMARK_PORT
    type: string
    required: false
    default: '8782'
    description: 待ち受けるポート。プラグインの `.mcp.json` の url も同じ環境変数で決まる
    constraints: 1〜65535 の整数
  - name: MDMARK_LAUNCHER
    type: '"systemd" | "tmux"'
    required: false
    default: なし
    description: 常駐サーバーを動かしている方法。`setup.js start-server` が指定し、`instructions` が伝える場所を決める
exceptions:
  - name: なし（正常終了）
    condition: SIGINT か SIGTERM を受けて待ち受けを閉じた。終了コード 0
  - name: なし（ポートが使用されている・終了コード 1）
    condition: ポートを別のプロセスが使用している
    notes: 標準エラー出力に、ポートの番号と、`~/.claude/settings.json` の `env` と `mdmark serve` の環境の両方に同じ `MDMARK_PORT` を設定すれば別のポートで動かせること、`mdmark serve` が既に起動しているならそのまま使用できることを出す
  - name: なし（MDMARK_PORT が使用できない値・終了コード 1）
    condition: '`MDMARK_PORT` が 1〜65535 の整数でない'
    notes: 標準エラー出力に、受け取った値と 1〜65535 の整数を設定することを出す
constraints:
  - item: 待ち受けるアドレス
    constraint: 127.0.0.1 だけで待ち受ける
  - item: パス
    constraint: '`/mcp` だけで MCP を受け、ほかのパスは 404'
  - item: Host・Origin
    constraint: '`Host` が `127.0.0.1` か `localhost`（ポート付き）でないリクエストと、`Origin` があってそれが localhost でないリクエストは 403'
  - item: セッション
    constraint: セッションを持たない（stateless）。リクエストごとに処理し、呼び出しの間で状態を持ち越さない
  - item: 作業のフォルダ
    constraint: ツールの作業のフォルダは引数の `project_dir` から取る。サーバーのカレントディレクトリは使用しない
  - item: 配布物
    constraint: 配布物は `mdmark serve` を呼んだパッケージから読み込む
  - item: instructions
    constraint: '`initialize` の `instructions` に、使用する場面と順序を事実の文で記載する。mdmark の記法・部品・図の記載方法はガイドとして dev-docs の配信元 `mdmark` にあり、文書を記載する前に dev-docs の `search_docs` で `source: "mdmark"` の `kind` が `docs` の文書をタグ `topic:ガイド` で絞って一覧を引き、当てはまるページを `view: "full"` で読み込むこと（作業場所が mdmark の外なら `outside_scope: true`）。dev-docs が無い、または配信元 `mdmark` が登録されていないときは「dev-docs が無いので見つかりません」であること。記載した後は `check` で点検し、図はガイドの『描いた図を確認する』の手順で確認すること。書き出しは `export_html`、まとめは `build_site` であること。利用側の CSS を探すときは `list_templates` で一覧を引き、選んだテンプレートを `apply_template` で配置して、返った値を設定の `theme` に記載すること。作った CSS を使い回すときは `add_template` で登録すること。記法を使用しない Markdown の編集とコードの調査には要らないこと。mdmark の記法で記載する文書の拡張子は `.mark.md` で、利用者の指示が無い限り純粋な `.md` には記法を使用しないこと。常駐サーバーが動いている場所（`MDMARK_LAUNCHER` が `systemd` なら systemd --user の unit の名前（端末の設定の `serve.systemdUnit`、無ければ `mdmark-mcp`）とログを確認する `journalctl --user -u {unit の名前}`、ほかは tmux のセッション名（端末の設定の `serve.tmuxSession`、無ければ `mdmark-mcp`））と、止まったときは `/mdmark:global-setup` でもう一度起動できること'
    decided_by: LIB-472-1#limitations[MCP の instructions の文字数]
    notes: 4,096 文字以下。ガイドの選び方（最初に『文書の記載方法』を参照する等）は配信元の説明書（`dev-docs.yaml` の `instructions`）に配置し、同じ文を instructions に配置しない
  - item: ツールのログ
    constraint: ツールの処理が想定しない例外で止まったときは、標準エラーにツール名と例外のメッセージとスタックを書き込み、その呼び出しを `isError` にして例外のメッセージを返却する。サーバーは止めない
  - item: ログ
    constraint: 起動したときに待ち受ける URL を標準出力に 1 行出す
refs:
  - SC-472-7#
  - SC-472-15#
test_file: tests/integration/ClaudeCodeプラグイン/serve.test.ts
