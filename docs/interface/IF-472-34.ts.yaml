      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 引数を JSON として読み、マーカーの JSON Schema で確かめる
        M->>M: 読めない引数・型の合わない値の箇所に記載の警告を配置する
        M-->>C: HTML 文字列
    expected:
      - '`<div class="mdmark-syntax-warning" role="note">` が 3 つある'
      - 1 つ目の details の前の警告の本文に読めない位置と理由があり、範囲が `<summary>詳細</summary>` の `open` を持たない `details` に入る
      - 画像が `mdmark-figure` の番号を持たず、その前の警告の本文に `id` には文字列を記載することがある
      - 3 つ目の details の前の警告の本文に `-->` での記載方法があり、範囲が `<summary>詳細</summary>` の `details` に入り、本文に ` b"} -->` の文字がある
    test: test_normal_when_mark_args_not_json
    refs:
