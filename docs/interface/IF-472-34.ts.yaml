id: IF-472-34
visibility: internal
title: 文書をHTML文字列にする
entry:
  kind: operation
  value: '`render(markdown, opts)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: DOM を使用せずに Markdown を HTML 文字列にする
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: ビルドした `dist/index.js` を `import()` で読み込む。`document` を持たない
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表（見出しが `列A`・`列B`、`列B` が右寄せ）・コードブロック（`ts`）・リンクを持つ文書
        notes: '`opts` は指定しない'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: Markdown を解析し、マーカーを取得する
        M->>M: 許可していない要素・属性・URL を落とす
        M-->>C: HTML 文字列
    expected:
      - '`id` を持つ `<h1>`（class `mdmark-heading` も持つ）・`<p>`・`<ul>`・`<table>`・`<pre><code class="language-ts">`・`<a href="…">` を持つ文字列が返る'
      - '`<td>` が同じ列の見出しの文言を `data-label`（`列A`・`列B`）に持つ'
      - '`列B` の `<th>` と `<td>` が class `mdmark-align-right` を持ち、文字列に `style=` が無い'
      - 文字列を描く先の要素（class `mdmark`）は含まない
    test: test_normal
  - name: 正常系（GitHub Flavored Markdown の拡張）
    summary: タスクリスト・取り消し線・www の自動リンクを GitHub と同じ要素にする
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 拡張の記法を持つ Markdown
        description: '`- [x] 済み` と `- [ ] 未` のリスト・`~~削除する~~`・`www.example.com`・`example.com` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: タスクリスト・取り消し線・www の自動リンクの規則を適用する
        M-->>C: HTML 文字列
    expected:
      - '`済み` の項目に `<input type="checkbox" disabled checked>` があり、`未` の項目の `input` は `checked` を持たない'
      - タスクの `<li>` が class `task-list-item` を持つ
      - '`~~削除する~~` が `<del>削除する</del>` になる'
      - '`www.example.com` が `href="http://www.example.com"` のリンクになり、`example.com` はリンクにならない'
    test: test_normal_when_gfm_extensions
  - name: 正常系（マーカーとスクリプトを落とす）
    summary: マーカーのコメントと、文書に記載したスクリプト・`style` を出力から落とす
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: マーカーとスクリプトを記載した Markdown
        description: '`<!-- features: {"a": true, "b": false} -->`・`<!-- unknown: {"size": 1} -->`・`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・`style="position:fixed"` を持つ段落・`<input type="text" value="x">`・`details` と `summary` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: マーカーを取得して取り除く
        M->>M: script 要素・on で始まる属性・javascript: の URL・style 属性を落とす
        M-->>C: HTML 文字列
    expected:
      - 文字列に `<!--`・`features`・`unknown` が無い
      - 文字列に `<script`・`onclick`・`javascript:`・`style=` が無い
      - 文書に記載した `<input type="text">` が `<input type="checkbox" disabled>` になり、`value` を持たない
      - '`<details>` と `<summary>` が残る'
      - '`script` 要素の中の文字が本文に出ない'
    test: test_normal_when_marks_and_scripts
  - name: 正常系（外部ライブラリのマーカー）
    summary: 外部ライブラリのマーカーを、読み込み中のマーカーの場所の要素に置き換える。モジュールは読み込まない
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 外部ライブラリのマーカーを持つ Markdown
        description: '段落の間に `<!-- test-lib: {"label": "a b", "size": 2} -->` を持つ文書'
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "https://example.invalid/test-lib.js" }`'
      - name: Mock
        description: 差し替える依存は無い（`render` は URL を読み込まないため、存在しないホストを指定する）
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown, { config })
        M->>M: 対応表にあるマーカーをマーカーの場所の要素に置き換える
        M-->>C: HTML 文字列
    expected:
      - 'マーカーの位置に `<div class="mdmark-embed" data-mdmark-slot="test-lib" data-mdmark-args="{&quot;label&quot;:&quot;a b&quot;,&quot;size&quot;:2}" role="status">図を読み込んでいます</div>` がある（`data-mdmark-args` は引数を空白なしの JSON にした文字）'
      - マーカーの前後の段落がある
      - 文字列に外部ライブラリの URL が無い
    test: test_normal_when_library_mark
  - name: 正常系（今の書き方の外部ライブラリと拡張のマーカー）
    summary: 引数が JSON のオブジェクトでない外部ライブラリと拡張のマーカーを、マーカーの場所の要素にせず記載の警告にする
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 今の書き方のマーカーを持つ Markdown
        description: '段落の間に `<!-- test-lib: a b -->` と、登録した拡張の `<!-- greet: world -->` を持つ文書'
      - name: 設定と拡張
        description: '`opts.config.libraries` に `{ "test-lib": "https://example.invalid/test-lib.js" }`。`registerExtension` で `directive` が `greet` の拡張を登録する'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown, { config })
        M->>M: 対応表と拡張のマーカーの引数が JSON のオブジェクトでない
        M-->>C: マーカーの場所に記載の警告を持つ HTML 文字列
    expected:
      - 文字列に `mdmark-embed` が無い
      - 2 つのマーカーの場所にそれぞれ記載の警告があり、本文に、引数を JSON のオブジェクトで記載することと `mdmark upgrade` がある
      - マーカーの前後の段落がある
    test: test_normal_when_legacy_embed_args
  - name: 正常系（記法を持つ文書）
    summary: 記法のマーカーと記載方法を、スクリプト無しで中身を読み込める HTML にする
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 記法を持つ Markdown
        description: '`<!-- toc -->`、`<!-- table: {"kind": "data", "columns": {"名前": {"filter": {}}}, "collapse": {"open": false}} -->` 〜 `<!-- /table -->` で囲んだ 3 行の表（列は `名前`・`値`）、`### macOS`・`### Windows` を持つ `<!-- tabs: {"group": "os"} -->` の範囲、`> [!WARNING]` と `> [!NOTE]-` の引用、番号付きリストを囲んだ `<!-- steps -->` の範囲、言語 `tree` のコードブロック（`src/` の下に `index.ts`）、`` `badge:v1` ``、直後に `<!-- section: {"open": false} -->` を持つ `## 補足`、直後に `<!-- row-detail: {"at": 1} -->` 〜 `<!-- /row-detail -->` を持つ 2 行の表、`<!-- fig: {"id": "arch"} -->` の直後の title `全体の構成` の画像と `[図](#fig-arch)` のリンクを持つ文書'
        notes: '`opts` は指定しない（記法の機能は既定でオン）'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: マーカーの範囲と引数を読み込む
        M->>M: 記法ごとの HTML にする
        M->>M: 許可していない要素・属性・URL を落とす
        M-->>C: HTML 文字列
    expected:
      - '`<nav class="mdmark-toc" aria-label="目次">` の中に `#補足` へのリンクがある'
      - 表が `<div class="mdmark-table" data-kind="data" data-features="sort pin filter resize" data-filter="0:select">` の中の `<details class="mdmark-table-details">` に入り、`details` が `open` を持たず、`<summary>表（3 行）</summary>` を持つ
      - タブの範囲が `<div class="mdmark-tabs" data-group="os">` になり、`macOS`・`Windows` の `<p class="mdmark-tab-title">` を持つ `<div class="mdmark-tab-panel">` が 2 つあり、どちらも `hidden` を持たない。`<h3` の `macOS` が無い
      - '`[!WARNING]` の引用が `<div class="markdown-alert markdown-alert-warning">` とタイトル `警告` になり、文字列に `[!WARNING]` が無い'
      - '`[!NOTE]-` の引用が `<details class="markdown-alert markdown-alert-note">` と `<summary class="markdown-alert-title">補足</summary>` になる'
      - ステップの範囲の `ol` が class `mdmark-steps` を持つ
      - ファイルツリーが `<div class="mdmark-tree">` の中の `<ul class="mdmark-tree-list" aria-label="ファイルツリー">` になり、`src/` が `mdmark-tree-folder`、`index.ts` が `data-file-icon="file-code"` を持つ `mdmark-tree-file` の `li` になる。`src/` の下の `ul` は `hidden` を持たない
      - '`<span class="mdmark-badge">v1</span>` があり、文字列に `badge:` が無い'
      - '`補足` の後ろが `<div class="mdmark-section-body" id="section-補足" data-section="closed">` に入り、中身の段落が文字列にある'
      - 2 行の表の 1 行目の直後に `<tr class="mdmark-row-detail" data-row="1"><td colspan="{列の数}">` と詳細の段落があり、表の後ろに詳細の段落が残っていない
      - 画像が `<figure class="mdmark-figure" id="fig-arch">` に入り、`<figcaption class="mdmark-figure-caption"><b>図 1</b>全体の構成</figcaption>` を持ち、リンクの文字が `図 1`
      - 文字列に `<!--`・`<svg`・`<button` が無い
    test: test_normal_when_syntax
  - name: 正常系（見出しの ID）
    summary: 見出しに GitHub と同じ規則の ID と、その ID へのリンクを付ける
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 見出しを持つ Markdown
        description: '`# Hello, World!`・`## 使用方法`・`## 使用方法` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 見出しの文字から ID を作り、重なりに番号を付ける
        M-->>C: HTML 文字列
    expected:
      - 見出しの `id` が上から `hello-world`・`使用方法`・`使用方法-1`
      - 各見出しの中に `<a class="mdmark-anchor" href="#{ID}" aria-label="「{見出しの文字}」へのリンク">` がある
    test: test_normal_when_headings
  - name: 正常系（記法の機能を解除する）
    summary: オフの記法はマーカーを取り除き、記載した Markdown を普通の Markdown として描く
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 記法を削除する Markdown
        description: '先頭に `<!-- features: {"table": false, "callout": false, "anchors": false} -->` を持ち、`<!-- table: {"kind": "data"} -->` 〜 `<!-- /table -->` で囲んだ表、`> [!WARNING]` の引用、`## 使用方法` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 設定の features に文書のマーカーを重ねる
        M->>M: オフの記法のマーカーを取り除き、普通の Markdown として描く
        M-->>C: HTML 文字列
    expected:
      - '`<table` があり、文字列に `mdmark-table` が無い'
      - '`<blockquote>` があり、文字列に `markdown-alert` が無い'
      - 見出しが `id="使用方法"` を持ち、文字列に `mdmark-anchor` が無い
      - 文字列に `<!--` が無い
    test: test_normal_when_syntax_features_disabled
  - name: 正常系（記載方法の誤り）
    summary: 読み込めない指定の箇所に記載の警告を配置し、読み込めた指定で本文を描く
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 記載方法を誤った Markdown
        description: '`<!-- table: {"kind": "unknown", "features": {"sort": {}}} -->` 〜 `<!-- /table -->` で囲んだ表、見出しの無い `<!-- tabs -->` 〜 `<!-- /tabs -->` の範囲、`### macOS`・`### Windows` を持つ `<!-- tabs: {"group": "", "grop": "os", "fold": true} -->` の範囲、`[図](#fig-missing)` のリンク、文書の終わりまで閉じのマーカーの無い `<!-- table: {"kind": "data"} -->` とその後の表を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 読み込めた指定だけを適用する
        M->>M: 読み込めない指定の箇所に記載の警告を配置する
        M-->>C: HTML 文字列
    expected:
      - '`<div class="mdmark-syntax-warning" role="note">` が 5 つあり、それぞれにタイトル `記載の警告` がある'
      - 1 つ目の表が `data-kind="default"` と `data-features="sort pin resize"` を持ち、その前の警告の本文に `kind` の `unknown` と選べる値（`data`・`plain`）がある
      - 見出しの無いタブの範囲の段落がある
      - 'このタブの範囲だけが `data-group` を持たない `<div class="mdmark-tabs">` になり、その前の警告の本文に空の文字の `group` があり、知らないキー `grop`・`fold` が無い'
      - リンクの文字が `図` のままで、警告の本文に `#fig-missing` がある
      - 閉じのマーカーの無い表が `data-kind="data"` を持ち、警告の本文に `<!-- /table -->` がある
    test: test_normal_when_syntax_errors
  - name: 正常系（記法の要素を偽る生の HTML）
    summary: 文書に生の HTML で記載した記法の class・`data-*`・`id` を落とす
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 生の HTML を書き込んだ Markdown
        description: '`<div class="mdmark-tabs" data-kind="data"><p id="fig-x" class="markdown-alert">偽り</p></div>` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 生の HTML から記法の class・data-*・id を落とす
        M-->>C: HTML 文字列
    expected:
      - '`偽り` の段落がある'
      - 文字列に `mdmark-tabs`・`data-kind`・`fig-x`・`markdown-alert` が無い
    test: test_normal_when_raw_html_imitates_syntax
  - name: 正常系（拡張のマーカー）
    summary: 登録した拡張のマーカーを、読み込み中のマーカーの場所の要素に置き換える。拡張のモジュールは読み込まない
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ。`registerExtension` で `directive` が `greet` の拡張を登録する
      - name: 拡張のマーカーを持つ Markdown
        description: '段落の間に `<!-- greet: {"target": "world", "lang": "ja"} -->` を持つ文書'
      - name: Mock
        description: 拡張の `load` と `schema` の `validate` は、呼ばれた回数を数える関数に差し替える
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: registerExtension({ name, directive: "greet", load, schema })
        C->>M: render(markdown)
        M->>M: 拡張のマーカーをマーカーの場所の要素に置き換える
        M-->>C: HTML 文字列
    expected:
      - 'マーカーの位置に `<div class="mdmark-embed" data-mdmark-slot="greet" data-mdmark-args="{&quot;target&quot;:&quot;world&quot;,&quot;lang&quot;:&quot;ja&quot;}" role="status">図を読み込んでいます</div>` がある'
      - '`load` と `validate` が 1 回も呼ばれていない'
    test: test_normal_when_extension_mark
  - name: 正常系（索引と参照の表）
    summary: 用語の意味・関連文書・末尾の関連文書の一覧を、スクリプト無しで読み込める HTML 文字列にする
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常系と同じ
      - name: 索引と参照の表
        description: '`mount` の「正常系（被参照の一覧）」と同じ索引と参照の表に、用語 `ワークスペース` を追加したもの'
        notes: '`opts.docId` は `arch`'
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` と `公開関数` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown, { index, docId, references })
        M-->>C: HTML 文字列
    expected:
      - '`ワークスペース` と `公開関数` が class `mdmark-term` の要素で、その隣に意味 `話し合いの記録を配置するフォルダ` と関連文書 `API` を持つ要素がある'
      - 文字列の末尾に、タイトル `関連文書` の一覧がある
      - 文字列に `script` 要素とマーカーの文字（`<!--`）が無い
      - Node とブラウザで同じ文字列を返却する。期待する HTML 文字列をテストの固定値にし、Node の `render` と、ブラウザ（Chromium）で配布物の `render` を呼んだ結果がどちらもその値と等しい
    test: test_normal_when_index
  - name: 正常系（図の部品）
    summary: 図の部品の定義から、タイトル・図・凡例を持つ図を描き、定義の JSON と文書のスクリプトを出さない
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 図の部品を持つ Markdown
        description: '`<!-- chart -->` 〜 `<!-- /chart -->` にグラフの定義、`<!-- param -->` 〜 `<!-- /param -->` に操作できる部品の定義を配置し、`<script>` を 1 つ持つ文書'
        notes: 定義は `docs/mock/refs/42/assets/samples.js` の `reply-time`・`strength` と同じ構造
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown)
        M->>M: 図の部品の範囲から定義を読み込み、構造を確認する
        M->>M: タイトル・図・凡例を描く
        M-->>C: HTML 文字列
    expected:
      - '`figure.mdmark-diagram` が 2 つあり、`data-diagram` がどちらも `chart`（2 つ目は `div.mdmark-param` の中のグラフ）'
      - 各図に題名のタイトルと凡例がある
      - 操作できる部品に `input type="range"` があり、`value` が定義の既定の値
      - 出力に定義の JSON の文字（`"series"`）と `script` 要素が無い
      - グラフの点がフォーカスできる要素で、系列の名前と値を持つ `role="tooltip"`・`hidden` の中身を持つ
    test: test_normal_when_diagram
  - name: 正常系（図の定義の誤り）
    summary: 読み込めない定義の図の場所だけを記載の警告にし、ほかの図と本文を描く
    setup:
