  - name: 正常系（記載できない取り込みの組み合わせ）
    summary: Markdown のファイルへの `lines` と、`heading` と `lines` の両方を記載したマーカーを、取り込まずに記載の警告にする
    setup:
      - name: 配布物を読み込んだ Node の処理
        description: 正常系と同じ
      - name: 取り込む文書の表
        description: '`opts.includes` に `共通/手順.md` と `src/app.ts` を持つ'
      - name: 記載できない組み合わせの Markdown
        description: 'シナリオ『ほかの文書を取り込む』の「異常シナリオ（記載できない取り込みの組み合わせ）」と同じ 2 つのマーカーを持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: render(markdown, { includes })
        M-->>C: マーカーの場所に記載の警告を持つ HTML 文字列
    expected:
      - 文字列に `mdmark-include` が無い
      - 2 つの記載の警告があり、それぞれの本文に `lines` は Markdown 以外のファイルにだけ記載できること・`heading` と `lines` は同時に記載できないことがある
    test: test_normal_when_include_lines_not_allowed
    refs:
