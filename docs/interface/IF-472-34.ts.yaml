        M->>M: 今の書き方の引数を、今の引数との対応で JSON のオブジェクトにする
        M-->>C: HTML 文字列
        C->>M: render(JSON の記載の markdown)
        M-->>C: HTML 文字列
    expected:
      - 2 つの文字列が同じ
      - どちらの文字列にも `mdmark-syntax-warning` が無い
    test: test_normal_when_legacy_marks
    refs:
      - SC-472-59#scenarios[正常シナリオ（今の書き方のマーカー）]
  - name: 正常系（複数行の JSON のマーカー）
    summary: 改行を挟んだ JSON のオブジェクトの引数を、1 行で記載したときと同じ HTML にする
    setup:
