        M->>C: $.ui.log（to: debug）
        M-->>C: 用語のマーカーの無い共通スタイルの部品の木
      ```

      <!-- /map -->
    expected:
      - 部品の木に下線の Text と脚注が無く、表・注意書き・見出し・コードは正常系と同じ部品で描かれる
      - '`$.ui.log` が `to: "debug"` で、`mdmark-style` と `missing.yaml` を含む文で 1 回呼ばれる'
