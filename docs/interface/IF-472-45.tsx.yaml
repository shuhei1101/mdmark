id: IF-472-45
visibility: internal
title: 返答を共通スタイルで描く
lead: Claude Code が返答のブロックを描く前に、返答の Markdown をブロックに分け、表・注意書き・見出し・コードブロック・開閉の範囲と、行の詳細・ステップなどの本文の部品を mdmark の共通スタイルの部品の木で描き、mdmark のマーカーを描き方に使用して画面から削除する。段落・箇条書きは Claude Code の Markdown 部品に任せ、描けないときは Claude Code の元の描画に任せる。
entry:
  kind: trigger
  value: 'Claude Code の mod の `ui.render`（`component`: `AssistantMessage`）のフック'
callers:
  - SC-472-97#
  - SC-472-98#
idempotent: true
side_effects: なし（画面に描く部品の木を返却するだけで、保存される返答の本文は変えない）。用語集を読み取れないときだけ Claude Code のデバッグログに 1 行を出す
request:
  - name: e.props.text
    type: string
    required: true
    location: argument
    description: 返答のブロックの Markdown。画面が隠す部分を除いた本文で、mdmark のマーカー（`<!-- ... -->`）は元の文字のまま含む
  - name: e.props.isFirstOfReply
    type: boolean
    required: true
    location: argument
    description: 返答の先頭の行頭の記号（`●`）を描くブロックか
  - name: e.surface
    type: "'terminal' | 'desktop' | 'vscode' | 'mobile'"
    required: true
    location: argument
    description: 描く画面の種類。狭い画面の表の描き方を決める
  - name: e.viewport.columns
    type: number
    required: false
    location: argument
    description: 描く幅の文字数。表の列の幅を決める
    default: なし（表を折り返さず、列の幅を中身の幅にする）
  - name: e.requestId
    type: string
    required: true
    location: argument
    description: 返答のブロックの ID。開閉の範囲の開閉の状態を、ブロックの本文のハッシュと範囲の順番と合わせて持つ鍵にする
  - name: settings.yaml
    type: CFG-472-4 のキー
    required: false
    location: argument
    description: '`$.env.get("MDMARK_STYLE_CONFIG")` か既定のパスから `$.fs.read` で読み取る設定'
    default: なし（全てのキーを既定値にする）
request_example: |-
  ```json
  {"surface": "terminal", "component": "AssistantMessage", "requestId": "msg_01", "viewport": {"columns": 88, "rows": 31}, "props": {"text": "## WS と WSL の違い\n\n<!-- table: {\"kind\": \"data\"} -->\n\n| 名前 | 種類 |\n| --- | --- |\n| WS | 用語 |\n\n<!-- /table -->\n\n> [!NOTE]\n> 用語は mdmark.config.yaml から取ります", "isFirstOfReply": true}}
  ```
response:
  - name: (戻り値)
    type: RenderElement
    description: 共通スタイルの部品の木（Box・Text・Code・Markdown・Button）。描き換えないときは `next(e)` の戻り値
response_example: |-
  ```tsx
  <Box key="reply" flexDirection="column">
    <Text bold color="#7aa2ff">WS と WSL の違い</Text>
    <Box flexDirection="column" borderStyle="single">…</Box>
    <Box flexDirection="row"><Text color="#7aa2ff">┃</Text><Box flexDirection="column"><Text bold color="#7aa2ff">NOTE</Text><Markdown>用語は mdmark.config.yaml から取ります</Markdown></Box></Box>
  </Box>
  ```
exceptions:
  - name: なし（正常終了）
    condition: 部品の木か `next(e)` の戻り値を返却する
  - name: なし（設定ファイルを読み取れない）
    condition: '`MDMARK_STYLE_CONFIG` か既定のパスの設定ファイルがあるが、YAML として読み取れない'
    notes: 部品の木を作らずに `next(e)` の戻り値を返却し、`$.ui.log` でデバッグログに mod の名前と理由を出す（外部ライブラリ LIB-472-1 の制限「mod のフックの例外」）
constraints:
  - item: 描き換える条件
    constraint: '`enabled` が `true` で、`targets` に `assistant` があるときだけ描き換える。そうでなければ `next(e)` を返却する'
  - item: 描き換えるブロック
    constraint: '表・注意書き（`> [!NOTE]` などの 5 種）・見出し（`#`〜`######`）・コードブロック・開閉の範囲（`<!-- details: タイトル -->`〜`<!-- /details -->`・`<!-- section: closed -->` の付いた見出しのセクション・`closed` の注意書き）・行の詳細（`<!-- row-detail -->`）・ステップ（`<!-- steps -->`）・ファイルツリー（言語 `tree` のコードブロック）・縦に並べる範囲（`<!-- tabs -->`・`<!-- columns -->`・`<!-- cards -->`・`<!-- wide -->`・`<!-- view -->`）・言語 `csv` のコードブロック・番号を付けた表（`<!-- fig -->`）。行内の記法（`badge:`・`[文字]{color=色}`・`==文字==`・`kbd:`）は、引用を除くブロックの中で描き換える。`parts` でオフにした種類と、ほかのブロック（段落・箇条書き・引用）は、そのブロックの Markdown を `Markdown` 部品に指定して Claude Code の標準の描き方で描く'
  - item: マーカー
    constraint: 単独の行のマーカーと行内のマーカーを描かない。行内のマーカーを削除した後の前後の文字は 1 つの空白でつなぐ。`table` の `kind`・`code` の `title`・`lines`・`highlight`・`row-detail` の `at`・`fig` の `id` を描き方に使用し、知らないマーカー・引数は描かずに無視する
  - item: 描かないブロック
    constraint: 図（言語 `mermaid` のコードブロック・`map` の範囲）と埋め込んだ HTML（`html` の範囲）はコードブロックとして描く
  - item: 表
    constraint: '罫線で囲み、列の幅は端末の表示幅（全角の文字を 2 つ分）で数える。`kind` が `data` の表は見出しの行を太字にする。表の幅が `viewport.columns` を超えるとき、`surface` が `desktop` なら表の Box を `overflowX: "scroll"` にして横にスクロールさせ、それ以外は列の幅を `viewport.columns` に収まるよう縮めてセルの中で折り返す'
  - item: 注意書き
    constraint: 種類の色の縦線（`┃`）と、先頭の種類のラベル（太字・種類の色）で描き、中身は `Markdown` 部品で描く
  - item: 見出し
    constraint: 太字と見出しの色で描く。`#` の記号は描かない
  - item: コードブロック
    constraint: 背景の面（Box の `backgroundColor`）の中に `Code` 部品で言語の色分けつきで描き、右上に言語のラベルを薄い色で描く。`code` のマーカーの `title` はコードの上の行、`lines` は行番号、`highlight` と行末の `[!code ++]`・`[!code --]`・`[!code highlight]`・`[!code focus]`・`[!code error]`・`[!code warning]` は行の色で描き、行末のマーカーの文字は描かない。コードの上の行の右端にコピーの Button を描き、押すと `$.ui.copy` でマーカーを除いたコードを写す
  - item: 開閉の範囲
    constraint: 閉じた範囲は Button（ラベル `▸ {タイトル}`）だけを描き、押すと開閉の状態を反転して `$.ui.invalidate("ui.render")` で再描画する。開いた範囲は Button（ラベル `▾ {タイトル}`）の下に中身を描く。開閉の状態は `requestId`・ブロックの本文（`e.props.text`）のハッシュ・範囲の順番を鍵にして（1 つの返答の複数のブロックが同じ `requestId` を持っても鍵が重ならない） mod のモジュールの中に持ち、Claude Code を閉じると消える
  - item: 色
    constraint: 見出し・注意書きの種類・用語の下線・罫線・色の名前（`blue`・`red`・`green`・`yellow`・`orange`・`purple`・`gray`）の文字色と背景色の色は、共通スタイルの定義のモジュールの値を使用する
  - item: 部品の木の上限
    constraint: ノードの数 20,000・深さ 32・文字数 100,000 のどれかを超えるときは `next(e)` を返却する
    decided_by: LIB-472-1#
  - item: 用語のマーカー
    constraint: インターフェース定義『発言の用語にマーカーを付ける』の制約「用語の照合」「下線」「カード」「脚注」と同じ規則で、返答の段落・箇条書き・注意書きの中の用語にも付ける。用語のマーカーを付けた段落・箇条書きは `Markdown` 部品に任せず、同じ描き方（太字・行内のコード・リンク）を Text で描く
  - item: 再読み込み
    constraint: 設定ファイルと用語集は呼ばれるたびに `$.fs.read` で再読み込みする
  - item: 行の詳細
    constraint: 直前の表の `at` 番目の行（見出しの行を除いて 1 から数える）の先頭のセルに Button（閉じているとき `[ ▸ ]`、開いているとき `[ ▾ ]`）を描き、押すと開閉の状態を反転して `$.ui.invalidate("ui.render")` で再描画する。開いた行の下に、全ての列をまたぐ 1 つのセルで詳細の中身を 2 桁字下げして描く。描いた直後は閉じる。開閉の状態の鍵と持ち方は制約「開閉の範囲」と同じ。`at` が表の行の数を超えるときと直前が表でないときは、詳細の中身を表の後ろに本文として描く
  - item: ステップ
    constraint: 範囲の最初の番号付きリストの項目ごとに、見出しの色の太字の番号と項目の中身を横に並べ、項目の間に罫線の色の `│` を 1 行描く。項目の中身は段落・箇条書きと同じ描き方にし、入れ子の番号付きリストはステップにしない。番号付きリストが無い範囲は中身をそのまま描く
  - item: ファイルツリー
    constraint: 罫線（`├── `・`└── `・`│   ` と `tree --charset=ascii` の `|-- `・`` `-- ``・`|   `）を薄い色、名前を本文の色で等幅のまま描き、前に空白がある最初の `#` から後ろを注釈として全ての行で同じ桁にそろえて薄い色で描く（`#` は描かない）。開閉・アイコン・コピーは描かない。上の行より 2 階層以上深い行か、罫線の後ろに罫線が無い行があるときは、コードブロックの部品で描く
  - item: 行内の記法
    constraint: バッジ（`badge:文言`・`badge:色:文言`）は前後に 1 桁の空白を付けた文言を色の名前の背景色と文字色（色が無いときは、共通スタイルの定義の面の色と本文の色）で描く。文字の色（`[文字]{color=色}`）は色の名前の文字色の太字、蛍光ペン（`==文字==`・`==文字=={color=色}`）は色の名前の背景色（既定は `yellow`）と本文の文字色、キー（`kbd:Ctrl+C`）は `+` で区切ったキーごとに `[Ctrl]` の太字と薄い色の `+` で描く。色の名前に無い値と、頭の後ろが空の記法は、mdmark の記法の説明と同じく色を付けずに描くか行内のコードのまま描く。行内のコードの中とコードブロックの中は描き換えない。行内の記法を含む段落・箇条書きは `Markdown` 部品に任せず、制約「用語のマーカー」と同じく Text で描く
  - item: 縦に並べる範囲
    constraint: 切り替え・横並び・広げる幅の Button を描かず、中身を記載した順に縦に並べる。タブは範囲の中で最初に出る見出しの階層で区切り、タブ名を制約「見出し」と同じ描き方で描き、中身を 2 桁字下げする。段組み・カードの格子・wide の範囲は見出しを付けずに描き、カードは項目ごとに `タイトル — 説明` の箇条書きにする。ビューの範囲の最初の表と言語 `csv` のコードブロック（1 行目を見出しの行にする）は、制約「表」と同じ描き方で描く。範囲の中のブロックは、範囲の外と同じ部品で描く
  - item: 図と表の番号
    constraint: '`fig` のマーカーの直後の表の上に、返答のブロックの頭から数えた通し番号の `表 {番号}` を薄い色で描く。画像・ギャラリーに付けた `fig` は描かずに無視する。本文の `#fig-{ID}` へのリンクの文字はその表の `表 {番号}` に替える'
  - item: 部品のオン・オフ
    constraint: '`parts` の `row_detail`・`steps`・`tree`・`inline`・`stack`・`figure` が `false` のとき、その部品の飾りだけを解除し、マーカーの行は描かない。`row_detail` は開閉の Button を描かず、詳細の中身を表の後ろに `Markdown` 部品で描く。`steps` は番号付きリストを `Markdown` 部品で描く。`tree` は言語 `tree` のコードブロックを制約「コードブロック」のとおりに描く（`parts.code` が `false` なら `Markdown` 部品）。`inline` は行内の記法を記載した文字のまま描く。`stack` は縦に並べる範囲のタブ名の見出し・字下げ・カードの箇条書きを作らず、言語 `csv` のコードブロックを表にしない。`figure` は `表 {番号}` を描かず、リンクの文字を替えない。範囲の中のブロックと、番号を付けた表そのものは、それぞれの部品のオン・オフのとおりに描く'
flows:
  - name: 正常系
    summary: 既定の設定で、表・注意書き・見出し・コードブロックを共通スタイルで描き、マーカーを削除する
    setup:
      - name: Mock
        description: Claude Code の代わりに `claude-code/testing` の `$.ui.mount` で `AssistantMessage` を `terminal` に描く。テストの `on("fs.read")` で設定ファイルが無いと返却する
      - name: 固定の返答
        description: '見出し・太字と行内のコードを含む段落・箇条書き・行内と単独の行のマーカー・`<!-- table: {"kind": "data"} -->` を付けた表・マーカーの無い表・`> [!NOTE]` の注意書き・言語 `ts` のコードブロックを持つ Markdown'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        participant F as ファイル
        C->>M: ui.render（AssistantMessage・本文）
        M->>F: 設定ファイルを読み込む
        F-->>M: 無い
        M->>M: 本文をブロックに分け、マーカーを描き方に使用する
        M-->>C: 共通スタイルの部品の木
      ```

      <!-- /map -->
    expected:
      - 表が罫線の Box で描かれ、`kind` が `data` の表だけ見出しの行が太字
      - 注意書きが縦線・種類の色・ラベル `NOTE` で描かれる
      - 見出しが太字と見出しの色の Text で、`#` を含まない
      - コードブロックが背景の面の Box の中の `Code` 部品で、言語のラベル `ts` とコピーの Button を持つ
      - 段落・箇条書きが `Markdown` 部品で描かれる
      - 部品の木の Text に `<!--` が 0 件で、行内のマーカーの前後が 1 つの空白でつながる
    test: test_normal
    refs:
      - SC-472-97#scenarios[正常シナリオ]
  - name: 正常系（部品をオフにしている）
    summary: '`parts.table` が `false` のとき、表だけ Markdown 部品に任せる'
    setup:
      - name: Mock
        description: '正常系と同じ。`on("fs.read")` で `global.parts.table: false` の設定ファイルを返却する'
      - name: 固定の返答
        description: 正常系と同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        participant F as ファイル
        C->>M: ui.render（AssistantMessage・本文）
        M->>F: 設定ファイルを読み込む
        F-->>M: parts.table: false
        M-->>C: 表だけ Markdown 部品の部品の木
      ```

      <!-- /map -->
    expected:
      - 表のブロックが、マーカーの行を除いた表の Markdown を指定した `Markdown` 部品で描かれる
      - 注意書き・見出し・コードブロックは正常系と同じ部品で描かれる
    test: test_normal_when_part_disabled
    refs:
      - SC-472-97#scenarios[正常シナリオ（部品をオフにしている）]
  - name: 正常系（返答を描き換えない設定）
    summary: '`targets` に `assistant` が無いとき、`next(e)` を返却する'
    setup:
      - name: Mock
        description: '正常系と同じ。`on("fs.read")` で `global.targets: [user]` の設定ファイルを返却する'
      - name: 固定の返答
        description: 正常系と同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        participant F as ファイル
        C->>M: ui.render（AssistantMessage・本文）
        M->>F: 設定ファイルを読み込む
        F-->>M: targets: [user]
        M-->>C: next(e) の戻り値
      ```

      <!-- /map -->
    expected:
      - 戻り値が `next(e)` の戻り値と同じ
    test: test_normal_when_assistant_not_targeted
    refs:
      - SC-472-97#scenarios[正常シナリオ（返答を描き換えない設定）]
  - name: 正常系（狭い画面の表）
    summary: 表の幅が描く幅を超えるとき、ターミナル版はセルで折り返し、デスクトップ版は横にスクロールする
    setup:
      - name: Mock
        description: 正常系と同じ。`viewport.columns` を 40 にし、`surface` を `terminal` と `desktop` で 1 回ずつ描く
      - name: 広い表
        description: 3 列で、3 列目のセルが 60 文字の表を持つ返答
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        C->>M: ui.render（AssistantMessage・本文・surface・viewport）
        M->>M: 表の幅と viewport.columns を比べる
        M-->>C: surface ごとの表の部品の木
      ```

      <!-- /map -->
    expected:
      - '`terminal` では、表の幅が 40 以下で、3 列目のセルの中身が複数の行に折り返される'
      - '`desktop` では、表の Box が `overflowX: "scroll"` を持ち、列の幅を縮めない'
    test: test_normal_when_table_wider_than_viewport
  - name: 正常系（コードブロックの飾り）
    summary: '`code` のマーカーと行末のマーカーで、タイトル・行番号・行の色を描き、コピーの Button でコードを写す'
    setup:
      - name: Mock
        description: 正常系と同じ。テストの `on("ui.copy")` でコピーした文字を受け取る
      - name: 飾りのあるコード
        description: '`<!-- code: title=a.ts lines -->` の直後に、行末に `// [!code ++]` を持つ行を含む言語 `ts` のコードブロックを持つ返答'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        C->>M: ui.render（AssistantMessage・本文）
        M-->>C: タイトル・行番号・行の色を持つコードの部品の木
        C->>M: コピーの Button の押下
        M->>C: $.ui.copy（マーカーを除いたコード）
      ```

      <!-- /map -->
    expected:
      - コードの上の行に `a.ts` が描かれ、各行の頭に行番号がある
      - '`[!code ++]` の行が追加した行の色で描かれ、`[!code ++]` の文字が描かれない'
      - コピーの Button を押すと、`[!code ++]` を除いたコードが写される
    test: test_normal_when_code_decorated
  - name: 正常系（開閉の範囲を押す）
    summary: 閉じた範囲の Button を押すと中身が開き、もう一度押すと閉じる
    setup:
      - name: Mock
        description: 正常系と同じ。描いた部品の木の Button を `ui.press` で押す
      - name: 開閉の範囲
        description: '`<!-- details: 用語を読み込む場所 -->` 〜 `<!-- /details -->` の範囲を持つ返答'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark-style
        C->>M: ui.render（AssistantMessage・本文）
        M-->>C: Button（▸ 用語を読み込む場所）だけの範囲
        C->>M: Button の押下
        M->>C: $.ui.invalidate(ui.render)
        C->>M: ui.render（同じ requestId）
        M-->>C: Button（▾ 用語を読み込む場所）と中身
      ```

      <!-- /map -->
    expected:
      - 描いた直後は Button のラベルが `▸ 用語を読み込む場所` で、中身の Text が無い
