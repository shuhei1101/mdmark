    refs:
      - SC-472-97#scenarios[正常シナリオ（本文の部品）]
  - name: 正常系（本文の部品をオフにしている）
    summary: '`parts.steps` と `parts.figure` が `false` のとき、ステップの範囲だけ Markdown 部品に任せ、中の行内の記法は描き換える。番号を付けた表は表の部品のまま `表 1` だけを解除する'
    setup:
