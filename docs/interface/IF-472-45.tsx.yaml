      - ファイルツリーの注釈 `ソース` が薄い色の Text で、`#` を含まない
      - バッジ `完了` が `green` の背景色と文字色の Text、`注意` が `red` の文字色の太字の Text、`決め手` が `yellow` の背景色の Text、キーが `[Ctrl]`・`+`・`[C]` の Text で描かれる
