id: IF-472-21
visibility: internal
title: "プレビューを再描画する"
entry:
  kind: trigger
  value: Markdown の変更（`workspace.onDidChangeTextDocument`）・保存（`workspace.onDidSaveTextDocument`）・設定ファイルの作成・変更・削除（`workspace.createFileSystemWatcher`）・設定 `mdmark.*` の変更・Webview の `ready`
flows:
  - name: 正常系
    summary: 打つたびに待ち、最後の全文だけを送信する
    setup:
      - name: プレビューを開いたワークスペース
        description: プレビューを開く.ts の正常系の後。`mdmark.preview.liveUpdate` は既定の `true`、`mdmark.preview.updateDelayMs` は既定の 300
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ。Webview へ送信したメッセージを時刻つきで記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 見出しを 100 ms おきに 3 回書き換える（保存しない）
        EX->>EX: 最後の変更から 300 ms 待つ
        EX->>PV: render（3 回目の全文）
        PV->>EX: rendered
    expected:
      - 3 回の書き換えの後に送信した `render` が 1 回だけで、中身が 3 回目の全文
      - '`render` を送信した時刻が、最後の書き換えから 300 ms より後'
      - Webview の見出しが 3 回目に記載した文字
    test: test_normal
  - name: 正常系（保存したときだけ再描画する）
    summary: '`liveUpdate` が `false` のときは保存でだけ送信する'
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.preview.liveUpdate` を `false` にする
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 見出しを書き換える
        U->>EX: 保存する
        EX->>PV: render（保存した全文）
    expected:
      - 保存する前は、`updateDelayMs` の 2 倍待っても `render` が送信されない
      - 保存すると `render` が 1 回送られ、Webview の見出しが書き換えた文字
    test: test_normal_when_live_update_off
  - name: 正常系（設定ファイルを保存する）
    summary: 設定ファイルの保存で、新しい features で再描画する
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.config.yaml` は `features` を持たず、`guide.md` は注意書きを持つ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.config.yaml に features.callout: false を記載して保存
        EX->>EX: features・libraries を取り出す
        EX->>PV: render（新しい config）
        PV->>PV: destroy して mount
        PV->>EX: rendered
    expected:
      - '`render` の `config.features` が `{ callout: false }`'
      - Webview の注意書きが `markdown-alert` の枠でなく `blockquote` で描かれる
    test: test_normal_when_config_saved
  - name: 正常系（設定ファイルの部品の文言で描く）
    summary: 設定ファイルの `labels` を `config` に入れ、操作できる部品の今の値をコピーするボタンを設定の文言で再描画する
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.config.yaml` は `labels` を持たず、`guide.md` は `<!-- param -->` のマーカーで操作できる部品の定義を 1 つ持つ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.config.yaml に labels.paramCopy: コピー を記載して保存
        EX->>EX: features・libraries・labels などを取り出す
        EX->>PV: render（新しい config）
        PV->>PV: destroy して mount
        PV->>EX: rendered
    expected:
      - '`render` の `config.labels` が `{ paramCopy: "コピー" }`'
      - Webview の `button.mdmark-param-copy` の `textContent` が `コピー`
    test: test_normal_when_param_copy_label_configured
  - name: 正常系（設定ファイルが無い）
    summary: 設定ファイルが無ければ設定なしで描き、通知を出さない
    setup:
      - name: 設定ファイルの無いワークスペース
        description: '`guide.md` だけを配置したフォルダでプレビューを開く'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: プレビューを開く
        PV->>EX: ready
        EX->>PV: render（config は空）
    expected:
      - '`render` の `config` が `{}` で、`configError` が送信されない'
      - Webview に設定ファイルを読み込めない帯が無い
    test: test_normal_when_config_missing
  - name: 正常系（背面から戻る）
    summary: 背面の間は送信せず、`ready` を受けて最後の全文を送信し、再作成した Webview を背面に回す前の位置へ戻す
    setup:
      - name: プレビューを開いたワークスペース
        description: 見出しを多く持つ長い Markdown を左の列のエディタで開き、右の列にプレビューを開いた状態。プレビューを、見えている範囲の先頭が見出し A の途中に該当する（見出し A の上端が先頭より上に出る）までスクロールし、見出し A の見えている範囲の先頭からの位置を記録してから、右の列で別の Markdown を開いてプレビューのパネルをその後ろに回す。エディタは左の列に見えたまま
        notes: 書き換える見出し B は、エディタの見えている範囲にある見出し A より下の見出し。エディタのスクロールを動かさずに書き換える
      - name: Mock
        description: 正常系と同じ。Webview から届いたメッセージも記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 背面の間に見出し B を 3 回書き換える
        U->>EX: プレビューのタブを表に戻す
        PV->>EX: ready
        EX->>PV: render（3 回目の全文）
        PV->>PV: 保存した元の行番号を先頭に配置する
    expected:
      - 背面の間に送信した `render` が 0 回
      - 表に戻した後の `ready` を受けて送信した `render` が 3 回目の全文で、Webview の見出し B が 3 回目の文字
      - 表に戻した後の Webview で、見出し A の見えている範囲の先頭からの位置が、背面に回す前に記録した値と 1 px 以内で同じ
      - 表に戻してから位置を戻した後、Webview から `revealLine` が届かず、エディタの `visibleRanges[0].start.line` が表に戻す直前と同じ
    test: test_normal_when_revealed
  - name: 正常系（相対パスの外部ライブラリ）
    summary: 設定ファイルからの相対パスの libraries を Webview で読み込める URL にして指定する
    setup:
      - name: 自作の図のワークスペース
        description: '`config/mdmark.config.yaml` に `libraries: { my-lib: ./libs/my-lib.js }`、`config/libs/my-lib.js` はマーカーの場所に `data-drawn` を付ける `draw` を持つ。`mdmark.configPath` は `config/mdmark.config.yaml`。`docs/guide.md` は `<!-- my-lib -->` を持つ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: docs/guide.md のプレビューを開く
        EX->>EX: ./libs/my-lib.js を config/ から解決し asWebviewUri にする
        EX->>PV: render（libraries は Webview の URL）
        PV->>EX: rendered
    expected:
      - '`render` の `config.libraries.my-lib` が `config/libs/my-lib.js` の `asWebviewUri` の URL'
      - Webview のマーカーの場所が `data-mdmark-drawn` を持ち、通知ブロックが無い
    test: test_normal_when_relative_library
  - name: 正常系（設定ファイルを修正する）
    summary: 読み込めない設定ファイルを修正して保存すると、新しい設定で描き帯を削除する
    setup:
      - name: 設定ファイルを読み込めないプレビュー
        description: 異常系（設定ファイルを読み込めない）の後
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 括弧を閉じて features.callout: false で保存
        EX->>PV: render（新しい config）
        EX->>PV: configOk
    expected:
      - '`render` の `config.features` が `{ callout: false }` で、続けて `configOk` が送信される'
      - Webview の設定ファイルを読み込めない帯が消える
    test: test_normal_when_config_fixed
  - name: 異常系（設定ファイルを読み込めない）
    summary: 読み込めない YAML を保存すると、前の設定で描いたまま読み込めない行を通知する
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系（設定ファイルを保存する）の後
      - name: 壊れた設定ファイル
        description: 4 行目に閉じていない `[` を持つ `mdmark.config.yaml`
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 壊れた mdmark.config.yaml を保存
        EX->>EX: YAMLParseError
        EX->>PV: configError（path: mdmark.config.yaml, line: 4）
    expected:
      - '`configError` の `path` が `mdmark.config.yaml`・`line` が `4` で、`render` は送信されない'
      - Webview の文書は描いたまま（注意書きは `blockquote` のまま）で、文書の先頭に設定ファイルを読み込めない帯と「設定ファイルを開く」がある
      - 帯を出したパネルの `auditPreview()` の axe の違反が 0 件
    test: test_error_when_config_unreadable
  - name: 正常系（設定ファイルに新しい配信元の libraries を追加する）
    summary: 開いたまま設定ファイルにまだ CSP に無い origin の `libraries` を追加して保存すると、HTML をもう一度入れてそのモジュールを読み込む
    setup:
      - name: 見本のワークスペース
        description: '`<!-- my-chart: {"label": "a"} -->` のマーカーを持つ `guide.md` と、`libraries` を持たない `mdmark.config.yaml` を配置したフォルダ。プレビューを開いて `rendered` を受けてある'
      - name: Mock
        description: 配布物とタグ一覧の代役の配信とは別の origin（別のポート）で、`draw` がマーカーの場所に `data-drawn` を付けるモジュール `my-chart.js` を配る手元のサーバー
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        participant LIB as 別の配信元
        U->>EX: mdmark.config.yaml に libraries.my-chart を追加して保存
        EX->>EX: libraries の origin が CSP に入れたものと違う
        EX->>PV: 新しい CSP の HTML をもう一度入れる
        PV->>EX: ready
        EX->>PV: render（全文・新しい設定）
        PV-->>LIB: my-chart.js
        PV->>EX: rendered
    expected:
      - Webview の HTML の CSP の `script-src` が別の配信元の origin を含む
      - 別の配信元が `my-chart.js` の要求を受ける
      - '`rendered` を受けた後、マーカーの場所が `data-mdmark-drawn` を持ち、通知ブロックが無い'
    test: test_normal_when_library_origin_added
  - name: 正常系（テーマの設定を変える）
    summary: '`mdmark.colorTheme` を変えると、設定ファイルの `colorTheme` を上書きした config で再描画し、空に戻すと設定ファイルのテーマで描く'
    setup:
      - name: プレビューを開いたワークスペース
        description: '正常系と同じ。`mdmark.config.yaml` に `colorTheme: theme-paper` を記載し、`mdmark.colorTheme` は空'
        notes: '`mdmark.preview.theme` は `light`'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.colorTheme を theme-slate にする
        EX->>PV: render（colorTheme: theme-slate）
        PV->>PV: destroy して mount
        PV->>EX: rendered
        U->>EX: mdmark.colorTheme を空に戻す
        EX->>PV: render（colorTheme: theme-paper）
        PV->>EX: rendered
    expected:
      - '`mdmark.colorTheme` を `theme-slate` にした後の `render` の `config.colorTheme` と Webview の文書の `data-mdmark-color-theme` が `theme-slate`（地の色の計算値はライブラリ本体の『文書を描く』の結合テストが確認する）'
      - 空に戻した後の `render` の `config.colorTheme` と Webview の文書の `data-mdmark-color-theme` が `theme-paper`
      - 設定ファイルの中身が変わっていない
    test: test_normal_when_color_theme_changed
  - name: 正常系（差分の変更後の側を書き換える）
    summary: 差分ビューの変更後の側を書き換えると、待ってから変更前と変更後の全文で同じパネルを再描画する
    setup:
      - name: 差分のプレビュー
        description: プレビューを開く.ts の正常系（差分ビューから開く）の後。`mdmark.preview.liveUpdate` は既定の `true`、`mdmark.preview.updateDelayMs` は既定の 300
      - name: Mock
        description: プレビューを開く.ts の正常系（差分ビューから開く）と同じ。Webview へ送信したメッセージを時刻つきで記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 変更後の側の末尾に段落を 1 つ追記する（保存しない）
        EX->>EX: 最後の変更から 300 ms 待つ
        EX->>PV: render（変更後の全文・previous）
        PV->>PV: update
        PV->>EX: rendered
    expected:
      - 送信した `render` が 1 回で、`markdown` が追記した後の全文、`previous` が変更前の全文
      - 追記した段落が `data-kind="add"` のブロックで出、前に色を適用したブロックが同じ `data-kind` のまま出ている
      - 差分のパネルが 1 つのままで、もう一度開いていない
    test: test_normal_when_diff_modified_side_edited
    refs:
      - SC-472-48#scenarios[正常シナリオ（変更後の側を書き換える）]
  - name: 正常系（差分のパネルが背面から戻る）
    summary: 差分のパネルも、再作成した Webview を背面に回す前の位置へ戻す
    setup:
      - name: 差分のプレビューを開いたワークスペース
        description: 見出しを多く持つ長い Markdown で、プレビューを開く.ts の正常系（差分ビューから開く）の後。差分のプレビューを、見えている範囲の先頭が見出し A の途中に該当する（見出し A の上端が先頭より上に出る）までスクロールし、見出し A の見えている範囲の先頭からの位置を記録してから、同じ列で別の Markdown を開いて差分のパネルをその後ろに回す
      - name: Mock
        description: プレビューを開く.ts の正常系（差分ビューから開く）と同じ。Webview から届いたメッセージも記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 差分のプレビューのタブを表に戻す
        PV->>EX: ready
        EX->>PV: render（変更後の全文と previous）
        PV->>PV: 保存した元の行番号を先頭に配置する
    expected:
      - 表に戻した後の `ready` を受けて送信した `render` が `previous` を持つ
      - 表に戻した後の Webview で、見出し A の見えている範囲の先頭からの位置が、背面に回す前に記録した値と 1 px 以内で同じ
    test: test_normal_when_diff_revealed
  - name: 正常系（取り込み先を保存する）
    summary: 取り込んでいるファイルを保存すると、再読み込みした取り込む文書で再描画する
    setup:
      - name: 取り込みを持つプレビュー
        description: プレビューを開く.ts の正常系（取り込む文書を描く）の後
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ。Webview へ送信したメッセージを記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 共通/手順.md の実行の段落を書き換えて保存する
        EX->>EX: includes を再読み込みする
        EX->>PV: render（guide.md の全文・includes）
        PV->>EX: rendered
    expected:
      - 保存の後に送信した `render` が 1 回で、`includes` の `共通/手順.md` が書き換えた後の中身
      - Webview の取り込んだ段落が書き換えた後の文
      - 取り込んでいないワークスペースのファイルを保存しても `render` を送信しない
    test: test_normal_when_include_target_saved
    refs:
      - SC-472-10#scenarios[正常シナリオ（取り込む文書を描く）]
  - name: 正常系（aliases の YAML を保存する）
    summary: '`aliases` の行が指す YAML を保存すると、再作成したエイリアスで再描画する'
    setup:
      - name: エイリアスを持つプレビュー
        description: プレビューを開く.ts の正常系（設定の aliases のエイリアス）の後
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ。Webview へ送信したメッセージを記録する
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: glossary.yaml の描画の意味を書き換えて保存する
        EX->>EX: エイリアスを再作成する
        EX->>PV: render（guide.md の全文・新しい aliases）
        PV->>PV: destroy して mount
        PV->>EX: rendered
    expected:
      - 保存の後に送信した `render` が 1 回で、`aliases` の `描画` の `description` が書き換えた後の意味
      - Webview のツールチップの「用語」の区分に書き換えた後の意味が出る
      - Webview のスクロールの位置が保存する前と同じ
    test: test_normal_when_aliases_yaml_saved
    refs:
      - SC-472-77#scenarios[正常シナリオ（aliases の YAML を書き換える）]
  - name: 正常系（設定ファイルの map で描く）
    summary: 設定ファイルの `map` を `config` に入れ、map の図を設定の種類と線で再描画する
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.config.yaml` は `map` を持たず、`guide.md` は `:::store` のノードと `-.->` の線を持つ map の範囲を 1 つ持つ
      - name: Mock
        description: 正常系と同じ
    flow: "sequenceDiagram\n  participant U as 文書の作成者\n  participant EX as 拡張機能\n  participant PV as Webview\n  U->>EX: mdmark.config.yaml に map.kinds.store と map.lines の -.-> を記載して保存\n  EX->>EX: features・libraries・map などを取り出す\n  EX->>PV: render（新しい config）\n  PV->>PV: destroy して mount\n  PV->>EX: rendered"
    expected:
      - '`render` の `config.map` が設定ファイルの `map` と同じ値'
      - Webview の `:::store` のノードの種類の行に `database` のアイコンと「保存先」があり、`-.->` の線が破線
      - '`map.kinds.store.shape` を知らない値 `hexagon` にして保存すると、`render` の `config.map` にその値のまま入り、`configError` が送信されず、ノードが角の丸い四角で描かれる'
    test: test_normal_when_map_configured
lead: 開いているプレビューを、Markdown と設定ファイルの最後の内容で再描画する。
idempotent: true
side_effects: Webview へ `render`・`configError`・`configOk` を送信する。Markdown と設定ファイルは書き換えない
callers:
  - SC-472-77#
exclusivity: パネルごとに待ちを 1 つだけ持ち、待つ間に変更が来たら待ちをもう一度始める。送信するのは常にその時点の全文
exceptions:
  - name: なし（正常終了）
    condition: 最後の全文と設定で再描画する
  - name: なし（設定ファイルを読み込めない）
    condition: 重ねた設定ファイルのどれかが YAML として読み込めない・設定の構造に合わない
    notes: 例外を投げず、前に使用した設定（無ければそのファイルを除いた残りの設定）で描いたまま、`configError` で読み込めないファイルと行かキーを通知する
constraints:
  - item: 再描画するきっかけ
    constraint: '`mdmark.preview.liveUpdate` が `true` のときは Markdown の変更から、`false` のときは Markdown の保存から再描画する。重ねた設定ファイル（ワークスペースの外の端末の設定を含む）・`theme` の CSS・`extensions` のファイル・前回 `aliases` を作るときに読み込んだ YAML のファイル（`paths` の glob に該当する新しいファイルは、設定を再読み込みするまで取得しない）の作成・変更・削除、前回送った `includes` のファイルの保存・削除、`mdmark.configPath`・`mdmark.preview.theme`・`mdmark.colorTheme` の変更でも再描画する。保存と設定ファイルは待たずに送信する'
  - item: 再描画するまでの待ち
    constraint: Markdown の最後の変更から `mdmark.preview.updateDelayMs` 待って送信する。範囲の外の値は既定の値として扱う
    decided_by: NFR-472-1#requirements[再描画するまでの待ち]
  - item: 送信する中身
    constraint: '`TextDocument.getText()` の全文（保存していない書き換えを含む）と、インターフェース定義『設定を重ねて読み込む』を `purpose: preview` で呼んで重ねた設定のうち `mount` の `opts.config` が読み込むキー（`mdmark.colorTheme` が空でないときは `colorTheme` をその値で上書きする）、`mdmark.preview.theme`、インターフェース定義『プレビューを開く』の制約「取り込む文書」のとおり再描画するたびに再読み込みした `includes`、プレビューを開く.ts の制約「エイリアス」のとおり作った `aliases`（設定に `aliases` が無いときは持たない）。差分のパネルは、変更後の文書の全文を `markdown`、その時点の変更前の文書の全文を `previous` に入れる。それ以外のパネルは `previous` を送信しない'
  - item: 背面のパネル
    constraint: パネルが見えていない間は送信せず、最後の全文だけを持つ。Webview の `ready` を受けたら、その時点の全文と設定で `render` を送信する。Webview は見えている先頭の元の行番号（スクロールを合わせる.ts の制約「プレビューから合わせる」と同じ内分で求め、整数に切り捨てない）を、スクロールの通知と `render` を描いた後に Webview の状態（`setState`）へ保存する。再作成した Webview（HTML をもう一度入れたときを含む）は、起動したときに `getState` の行を読み込んでおき、最初の `render` を描いた後にその行を `scrollToLine` と同じ位置に配置してから保存する。その行へ戻すまでは、スクロールの通知でも `render` を描いた後でも保存しない。戻したスクロールでは `revealLine` を送信しない。保存した行が無いとき（開いた直後）は先頭から描く
    notes: '背面の間の `postMessage` は届かない（PoC #70）。`retainContextWhenHidden` は `false` のままで、背面に回ると Webview が再作成される。位置を元の行番号で持つのは、背面の間の書き換えで文書の高さが変わっても同じ箇所へ戻すため'
  - item: 設定ファイルの場所
    constraint: '`mdmark.configPath` が空（既定）のときは、Markdown のフォルダを起点にインターフェース定義『設定を重ねて読み込む』で探して重ねる。値を記載したときは Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）から解決したそのファイルと端末の設定だけを重ねる。設定ファイルが 1 つも無ければ端末の設定だけで描き、通知は出さない。重ねた設定ファイルのどれかを読み込めない・設定の構造に合わないときは、端末の設定 → 上 → 近いの順で最初の 1 つを帯に出す'
    notes: docs/config/CFG-472-2
  - item: 設定の取り出し方
    constraint: インターフェース定義『設定を重ねて読み込む』で重ねた設定から、値がマップの `features`・`libraries`・`html-scripts`・`side-toc`・`labels`・`mermaid`・`map`・`tooltips`・`syntax` と値が文字列の `colorTheme`・`colorScheme` だけを `config` にする（プレビューでは、`colorScheme` は `mdmark.preview.theme` が `auto` のときだけ指定する。プレビューを開く.ts の制約「配色」。HTML への書き出しは `mdmark.preview.theme` によらず指定する）（マップでない値のキーは指定しない）。`theme` と `extensions` は制約「theme と extensions」のとおり適用する。他のキーは指定しない。キーの中の知らない名前と型の違う値は mdmark が無視する
    notes: docs/config/CFG-472-3
  - item: libraries の URL
    constraint: '`libraries` の各 URL と `html-scripts.url`・`syntax.url` に適用する。`http:`・`https:` の URL はそのまま指定する。それ以外は、その値を記載した設定ファイルのフォルダを基準に解決したファイルを `asWebviewUri` で Webview で読み込める URL にして指定する。`localResourceRoots` の外のファイルは Webview が読み込めず、mdmark がそのマーカーの場所に通知ブロックを出す（`syntax.url` は色分けせずに描く）。`syntax.url` はフォルダの URL のため、Webview の URL の末尾に `/` を付ける。再読み込みした `libraries` と `html-scripts.url`・`mermaid.url`・`syntax.url`（`html-scripts.url`・`mermaid.url`・`syntax.url` を記載しないときは既定の jsDelivr）の `http:`・`https:` の origin の集まりが今の HTML の CSP に入れた集まりと違うときは、`render` でなく Webview の HTML をもう一度入れる（`ready` を受けて全文を送信する）'
  - item: 設定ファイルを読み込めないとき
    constraint: '重ねた設定ファイルのどれかを YAML として読み込めないときは `YAMLParseError` の `linePos[0].line`（1 始まり）を `line` に、設定の構造に合わないときは最初のずれのキーを `settingKey` に入れ、そのファイルのパス（『設定を重ねて読み込む』の制約「パスの表示」）を `path` に入れて `configError` を送信する。前に使用した設定があれば残し、無ければそのファイルを除いた残りの設定で描く。読み込めるようになったら、新しい設定の `render` と `configOk` を送信する'
  - item: 設定が変わったときの描き方
    constraint: Webview は `config` と `aliases` が前と同じときは `update`、どちらかが違うときは `destroy` してから `mount` で描く。スクロールの位置は再描画する前の位置を保つ
    notes: '`update` は `mount` に指定した設定を使用する（文書を描く.ts のレスポンス）'
  - item: 差分のパネルを再描画するきっかけ
    constraint: 差分のパネルは、変更後の文書の変更・保存だけを制約「再描画するきっかけ」のとおり受け、変更前の文書の変更では再描画しない。設定ファイルと設定の変更は他のパネルと同じ
    notes: 変更前の側は `git:` の読み取り専用の文書か、要件のスコープ外（変更前の側の書き換え）
  - item: theme と extensions
    constraint: '重ねた設定の `theme` の CSS を Webview の URI にした `link` で配布物の CSS の後に読み込み、`extensions` のモジュールを拡張機能の中で esbuild-wasm で 1 つずつまとめ（`.ts` も読み込み、URL の import はまとめに取り込む。引数は CLI の書き出しと同じ）、拡張機能の保存場所（`globalStorageUri`）のファイルに書き込んで、`mount` の前に `import()` して `registerExtension` で登録する（CLI の書き出しと同じ順）。CSP には `extensions` のための origin を追加しない。`localResourceRoots` に `theme` のファイルのフォルダとまとめたファイルのフォルダを追加し、設定を再読み込みしたときは前に追加したフォルダを削除してもう一度追加する。`theme` の CSS だけが変わったときは HTML をもう一度入れず、`{ type: "theme", href }`（変えた回数の `?v={回数}` を付けた URL）を送信して `link` の `href` を替えさせる。`extensions` の並びかそのファイル、`theme` のパスが変わったときは HTML をもう一度入れる。まとめるのは `extensions` の並びかそのファイルが変わったときだけで、Markdown の書き換えではまとめない。まとめられない・登録できない拡張は飛ばして描く'
