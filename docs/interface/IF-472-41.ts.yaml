id: IF-472-41
visibility: internal
title: 配布物をビルドする
entry:
  kind: operation
  value: '`npm run build [-- --version v{MAJOR}.{MINOR}.{PATCH}]`（CLI）'
flows:
  - name: 正常系
    summary: '`version.ini` のバージョンを埋めてビルドする'
    setup:
      - name: 依存を入れた作業ツリー
        description: '`version.ini` が `v0.0.0` で、`migrations/next/retired-diagrams.mjs` を持つ作業ツリー'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant F as ファイル
        D->>B: npm run build
        B->>F: version.ini を読み込む
        B->>F: v0.0.0 を埋めた dist/index.js と index.css、型定義の dist/index.d.ts、まとめた依存の THIRD_PARTY_LICENSES.txt を書き込む
        B->>F: migrations/next/ に retired-diagrams.js と、まとめた依存の THIRD_PARTY_LICENSES.txt を書き込む
        B-->>D: 終了コード 0
    expected:
      - 終了コードが 0
      - '`dist/index.js` と `dist/index.css` がある'
      - '`dist/index.js` の `version()` が `v0.0.0` を返却する'
      - '`dist/THIRD_PARTY_LICENSES.txt` に `markdown-it` と `sanitize-html` の名前とライセンスの本文と、`lucide`（図と記法のアイコンの形状）の ISC と Feather 由来のアイコンの MIT の両方の著作権表示と本文がある'
      - '`dist/index.d.ts` が `version`・`mount`・`render`・`registerExtension` と `MdmarkExtension`・`MdmarkExtensionModule`・`MdmarkMarkArgs`・`StandardSchemaV1`・`MdmarkChartDefinition`・`MdmarkParamDefinition`・`MdmarkErDefinition` を export し、`tsc --noEmit` で型エラーが 0 件'
      - '`dist/cli.js` があり、`node dist/cli.js init {一時フォルダ}` が終了コード 0 で雛形を配置する'
      - '`dist/viewer.js` と `dist/viewer.css` がある'
      - '`plugin/scripts/pre-tool-use.js`・`plugin/scripts/session-start.js` があり、`plugin/guide`・`plugin/server`・`plugin/dist` が無く、`plugin/.claude-plugin/plugin.json` が `version` を持たずビルドの前と同じ中身'
      - '`dist/THIRD_PARTY_LICENSES.txt` に `dist/cli.js` にまとめた `@modelcontextprotocol/server` と、その配布物に取り込まれた `ajv` の名前とライセンスの本文がある'
      - '`migrations/next/THIRD_PARTY_LICENSES.txt` に、`migrations/next/retired-diagrams.js` にまとめた依存（`esbuild` などまとめずに読み込む依存を除く）の名前とライセンスの本文がある'
    test: test_normal
  - name: 正常系（バージョンを指定する）
    summary: '`--version` で指定したバージョンを埋めてビルドする'
    setup:
      - name: 依存を入れた作業ツリー
        description: '`version.ini` が `v0.0.0` の作業ツリー'
        notes: '`--version v0.0.1`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant F as ファイル
        D->>B: npm run build -- --version v0.0.1
        B->>F: v0.0.1 を埋めた dist/index.js と index.css を書き込む
        B-->>D: 終了コード 0
    expected:
      - 終了コードが 0
      - '`dist/index.js` の `version()` が `v0.0.1` を返却する'
      - '`plugin/.claude-plugin/plugin.json` が `version` を持たずビルドの前と同じ中身'
    test: test_normal_when_version_given
  - name: 異常系（移行の手順が無い・終了コード 1）
    summary: スキーマを変えたのに手順も一覧の合う行も無ければ、配布物を書き込まずに終わる
    setup:
      - name: タグを打った作業ツリー
        description: 作業ツリーをコピーした一時フォルダを git のリポジトリにして commit し、`v0.3.0` のタグを打った後、`schemas/mdmark.index.schema.json` の必須のキーの名前を変え、`migrations/no-steps.yaml` には SHA-256 の合わない `next` の行だけを配置したもの
        notes: SHA-256 は変える前の Schema のもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant G as git
        D->>B: npm run build
        B->>G: v0.3.0 の schemas/ を読み込む
        B->>B: 変えた Schema に手順も合う行も無い
        B-->>D: Schema と修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに `schemas/mdmark.index.schema.json` と `migrations/next/steps.yaml`・`migrations/no-steps.yaml` が出る
    test: test_error_when_schema_changed_without_steps
  - name: 異常系（出していないバージョンの手順が残る・終了コード 1）
    summary: release のビルドで `migrations/next/` が残っていれば、移し方を示して終わる
    setup:
      - name: バージョンを上げた作業ツリー
        description: 作業ツリーをコピーした一時フォルダを git のリポジトリにして commit し、`v0.3.0` のタグを打った後、`migrations/next/steps.yaml`（`rename_key` 1 つ）を配置し、`version.ini` を `v0.4.0` にしたもの
        notes: '`migrations/next/steps.yaml` が残り、`migrations/v0.4.0/` は無い'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant G as git
        D->>B: npm run build
        B->>G: 最新のバージョンのタグ v0.3.0 を読み込む
        B->>B: v0.4.0 がタグより新しく migrations/next/ が残る
        B-->>D: 移し方・終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに `migrations/next/` を `migrations/v0.4.0/` へ移し `no-steps.yaml` の `next` を `v0.4.0` にすることが出る
    test: test_error_when_next_steps_left_in_release
  - name: 異常系（移行の手順の構造の誤り・終了コード 1）
    summary: '`steps.yaml` が Schema に合わなければ、配布物を書き込まずに終わる'
    setup:
      - name: タグを打った作業ツリー
        description: 作業ツリーをコピーした一時フォルダを git のリポジトリにして commit し、`v0.3.0` のタグを打った後、`schemas/mdmark.index.schema.json` の必須のキーの名前を変え、`to` を持たない `rename_key` 1 つの `migrations/next/steps.yaml` を配置したもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        D->>B: npm run build
        B->>B: migrations/next/steps.yaml が Schema に合わない
        B-->>D: ファイルと合わないところ・終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに `migrations/next/steps.yaml` と `to` が出る
    test: test_error_when_steps_invalid
  - name: 異常系（バージョンの書式が違う・終了コード 1）
    summary: 書式に合わないバージョンを指定すると、配布物を書き込まずに終わる
    setup:
      - name: 依存を入れた作業ツリー
        description: '`dist/` が無い作業ツリー'
        notes: '`--version 1.2`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        D->>B: npm run build -- --version 1.2
        B-->>D: 書式 v{MAJOR}.{MINOR}.{PATCH} を示して終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに `v{MAJOR}.{MINOR}.{PATCH}` が出る
    test: test_error_when_version_format_invalid
  - name: 異常系（配布ファイルが上限を超える・終了コード 1）
    summary: 上限を超えた配布ファイルがあると、記載した配布物を削除して終わる
    setup:
      - name: 依存を入れた作業ツリー
        description: '`dist/` が無い作業ツリー'
      - name: Mock
        description: 配布ファイルの上限を 1 バイトに差し替える
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant F as ファイル
        D->>B: npm run build
        B->>F: dist/ を書き込む
        B->>F: サイズを数え、dist/ を削除する
        B-->>D: 超えたファイル名とサイズを示して終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに超えたファイル名とサイズが出る
    test: test_error_when_dist_file_too_large
  - name: 異常系（対応ブラウザの下限に無い API を使用する・終了コード 1）
    summary: 下限に無い API を確認せずに使用すると、記載した配布物を削除して終わる
    setup:
      - name: 下限に無い API を使用する作業ツリー
        description: '`dist/` が無い作業ツリー。`src/index.ts` の最上位に、有無を確認せずに `new Intl.Segmenter("ja")` を呼ぶ行を追加してある'
        notes: '`Intl.Segmenter` は Firefox 98 に無い'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant B as ビルド
        participant F as ファイル
        D->>B: npm run build
        B->>F: dist/ を書き込む
        B->>B: minify せずにまとめた JS を下限のバージョンと照らす
        B->>F: dist/ を削除する
        B-->>D: API・配布ファイル・ブラウザのバージョンを示して終了コード 1
    expected:
      - 終了コードが 1
      - '`dist/` が無い'
      - 標準エラーに `Intl.Segmenter`・`dist/index.js`・Firefox 98 が出る
    test: test_error_when_api_missing_in_baseline_browser
lead: '`src/` の TypeScript と CSS を、バージョンを埋めた ES モジュールの `dist/index.js` と `dist/index.css` と、公開関数と拡張の型定義 `dist/index.d.ts` と、Node で動く CLI の `dist/cli.js` と、CLI が書き出す HTML に埋める起動の処理 `dist/viewer.js`・`dist/viewer.css` にビルドする。'
idempotent: true
side_effects: '`dist/` と、`migrations/` の中の `marker-json.mjs` を持つフォルダの `legacy-marks.js` と `retired-diagrams.mjs` を持つフォルダの `retired-diagrams.js`、それぞれのフォルダの `THIRD_PARTY_LICENSES.txt` を書き換える'
callers:
  - SC-472-82#
request:
  - name: --version
    type: string
    required: false
    default: なし（`version.ini` の先頭行を埋める）
    location: argument
    description: 埋めるバージョン
    constraints: '`^v\d+\.\d+\.\d+$`'
    example: v0.0.1
exceptions:
  - name: なし（正常終了）
    condition: 配布物を書き込んで終了コード 0
  - name: バージョンの書式の誤り（終了コード 1）
    condition: 埋めるバージョンが `v{MAJOR}.{MINOR}.{PATCH}` に合わない
  - name: 配布ファイルの上限超過（終了コード 1）
    condition: '`dist/` のファイルが 1 つでも上限を超える'
  - name: 移行の手順が無い（終了コード 1）
    condition: 設定・索引の JSON Schema を最新のバージョンのタグから変えたのに、確認する手順のフォルダの `steps.yaml` も、`migrations/no-steps.yaml` の合う行も無い
  - name: 出していないバージョンの手順が残る（終了コード 1）
    condition: '比べるバージョンが最新のバージョンのタグより新しいビルド（release・hotfix のビルド）で、`migrations/next/` か `migrations/no-steps.yaml` の `version: next` の行が残っている'
  - name: 移行の手順の構造の誤り（終了コード 1）
    condition: '`migrations/` のどれかの `steps.yaml` が `schemas/mdmark.steps.schema.json` に合わないか（`call` のスクリプトの拡張子が `.js`・`.mjs` でないものを含む）、`call` のスクリプトが無いか、`migrations/no-steps.yaml` が ER 図『移行の手順』の構造に合わない'
  - name: ガイドの索引の誤り（終了コード 1）
    condition: '`guide/index.yaml` が ER 図『ガイド』の構造に合わないか、無いページを指す'
  - name: 対応ブラウザの下限に無い API（終了コード 1）
    condition: 利用側のブラウザが読み込む JS（`dist/index.js`・`dist/view.js`・`dist/comments.js`・`dist/viewer.js`）のどれかが、下限のバージョンに無い API を、同じ API の `typeof` で確認する `if` のブロックの外で使用する
constraints:
  - item: 配布ファイル 1 つのサイズ
    constraint: 672KB 以下（688128 バイト）。利用側のページが読み込まない `dist/cli.js`・`dist/viewer.js`・`dist/viewer.css` は対象外
    decided_by: NFR-472-1#requirements[配布ファイル 1 つのサイズ]
  - item: 出力の対象のブラウザ
    constraint: Chrome 99・Firefox 98・Safari 16.4
    decided_by: NFR-472-1#requirements[対応ブラウザ]
  - item: CLI の配布物
    constraint: '`dist/cli.js` は Node 24 を target にし、先頭に `#!/usr/bin/env node` を配置する。esbuild と YAML を読み込むライブラリはまとめず、`package.json` の `dependencies` から読み込む。`mdmark serve` が使用する MCP の SDK はまとめ、まとめた依存のライセンスを `dist/THIRD_PARTY_LICENSES.txt` に並べる。`package.json` の `bin` の `mdmark` が `dist/cli.js` を指す'
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
    notes: 書き出しに埋める `dist/index.css`・`dist/viewer.js`・`dist/viewer.css` は、同じバージョンのものを `dist/cli.js` と同じフォルダから読み込む。`dist/viewer.js` はライブラリ本体を含めてまとめる
  - item: 移行の手順の点検
    constraint: '配布物を書き込む前に実行する。比べるバージョンは `--version` があればそのバージョン、無ければ `version.ini` のバージョン。最新のバージョンのタグは `git tag` の `v{MAJOR}.{MINOR}.{PATCH}` のうち最も新しいバージョン。比べるバージョンがタグと同じなら `migrations/next/` と `version: next` の行を、新しければ `migrations/v{比べるバージョン}/` と `version: v{比べるバージョン}` の行を確認する。`schemas/mdmark.config.schema.json`・`schemas/mdmark.index.schema.json`・`schemas/mdmark.settings.schema.json`・`schemas/mdmark.templates.schema.json` の中身がタグのものと違うとき、確認するフォルダに `steps.yaml` があるか、確認する行のうち `schema` がそのファイルで `sha256` が今の中身と合う行があれば合格にする。タグに無い Schema と作業ツリーに無い Schema は比べない'
    decided_by: ER-472-5#
    notes: バージョンのタグが 1 つも無いとき、git の作業ツリーでないとき、比べるバージョンがタグより古いときは飛ばす。
  - item: 出していないバージョンの手順の移し
    constraint: 'スプリントの区切りに develop（release を切るときは release）で `version.ini` を上げる commit で、`migrations/next/` を `migrations/v{バージョン}/` へ移し、`migrations/no-steps.yaml` の `version: next` を `v{バージョン}` に書き換える。hotfix のビルドも同じように打つタグのバージョンへ移す'
    decided_by: CMD-472-1#
  - item: 移行の手順の配布
    constraint: '`migrations/`・`schemas/mdmark.steps.schema.json`・`docs/guide/変更履歴.md` は `dist/` に写さず、バージョンのタグのパッケージから `dist/cli.js` がパッケージの直下を基準に読み込む'
    notes: '`package.json` は `files` を持たず、パッケージには `.gitignore` に該当しないファイルが入る。入ることは E2E（バージョンを上げる）で確認する'
  - item: Claude Code プラグインの配布物
    constraint: '`dist/` を書き込んだ後に、まとめたフック `plugin/scripts/pre-tool-use.js`（Node 24）とまとめた依存の `plugin/THIRD_PARTY_LICENSES.txt` を書き込む。`plugin/.claude-plugin/plugin.json` には `version` を記載せず、Claude Code が commit の短縮 SHA をプラグインのバージョンにする。MCP サーバーとガイドは `plugin/` にまとめない。失敗したときは `dist/` と同じくプラグインの生成物も残さない'
    notes: '`plugin/` の定義（`.mcp.json`・`hooks/hooks.json`・`plugin.json`）は書き換えない'
  - item: 対応ブラウザの下限の確認
    constraint: 配布物を書き込んだ後に、配布ファイルのサイズの検査と並べて実行する。利用側のブラウザが読み込む JS と同じ入口・同じ target で minify せずにまとめた JS を、MDN の browser-compat-data で対応ブラウザの下限のバージョンと照らす。確認の束は一時フォルダに書き込み、`dist/` には配置しない。`if` のブロックの中の使用も数え、同じ API の `typeof` で確認する `if` のブロックの中と、その `typeof` の式の中の参照だけを数えない。ネットワークには接続しない
    decided_by: NFR-472-1#requirements[対応ブラウザ]
    notes: 照らすバージョンは制約『出力の対象のブラウザ』と同じ値から取る。minify した配布ファイルは `if` のブロックが式に畳まれ、有無を確認した箇所も報告に出るため照らさない。`dist/cli.js` は対象外
test_file: tests/integration/lib/build.test.ts
