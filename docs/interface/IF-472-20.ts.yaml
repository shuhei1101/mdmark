id: IF-472-20
visibility: internal
title: "プレビューをリロードする"
entry:
  kind: operation
  value: 'コマンド `mdmark.refreshPreview`（コマンドパレットの表示は「mdmark: プレビューをリロード」）と、Webview の「リロード」からの `{ type: "reload" }`'
flows:
  - name: 正常系
    summary: 描けないときの「リロード」から、配布物を再読み込みして描く
    setup:
      - name: 描けないプレビュー
        description: プレビューを開く.ts の異常系（配布物を読み込めない・オフライン）の後
      - name: Mock
        description: 配布物を配る手元のサーバーを、配布物を配る状態に戻す。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant PV as Webview
        participant EX as 拡張機能
        participant CDN as jsDelivr
        U->>PV: 「リロード」を押す
        PV->>EX: reload
        EX->>EX: 設定ファイルとバージョンをもう一度決める
        EX->>PV: HTML をもう一度入れる
        PV-->>CDN: index.js・index.css
        PV->>EX: ready
        EX->>PV: render
        PV->>EX: rendered
    expected:
      - タグ一覧の代役が 1 回呼ばれる
      - 描けない理由と「リロード」が消え、見出し・表・注意書き・map の構成図が描かれる
    test: test_normal
  - name: 正常系（コマンドパレットから）
    summary: '`mdmark.refreshPreview` で、新しく打たれたバージョンを読み込む'
    setup:
      - name: プレビューを開いたワークスペース
        description: プレビューを開く.ts の正常系の後（`v0.10.0` で描いている）
      - name: Mock
        description: タグ一覧の代役が `v0.11.0` も返却するようにする
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.refreshPreview
        EX->>EX: v0.11.0 を選ぶ
        EX->>PV: v0.11.0 で HTML をもう一度入れる
        PV->>EX: rendered
    expected:
      - 配布物の要求が `@v0.11.0/dist/` になり、`mdmark.lastVersion` が `v0.11.0`
      - パネルは 1 つのまま
    test: test_normal_when_from_command
  - name: 異常系（プレビューが無い・何もしない）
    summary: プレビューを開いていないときは何もしない
    setup:
      - name: 見本のワークスペース
        description: プレビューを開かずに `guide.md` をエディタで開いた状態
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ。タグ一覧の代役は呼ばれた回数を数える
    flow: |-
      sequenceDiagram
        participant U as 文書の作成者
        participant EX as 拡張機能
        U->>EX: mdmark.refreshPreview（executeCommand）
        EX->>EX: プレビューが無いので何もしない
    expected:
      - mdmark のパネルが 0 個のままで、タグ一覧の代役が呼ばれない
    test: test_error_when_no_preview
lead: プレビューの設定ファイルと読み込むバージョンをもう一度決め、配布物を再読み込みして描く。
idempotent: true
side_effects: Webview の HTML をもう一度入れる。`mdmark.version` が `latest` のときはタグ一覧を 1 回取り、`mdmark.lastVersion` を書き換える
callers:
  - SC-472-77#scenarios[正常シナリオ（リロードする）]
exclusivity: 対象はフォーカスのある mdmark のプレビューか、アクティブなエディタの Markdown のプレビュー。リロードしている間にもう一度呼ばれたら、後の呼び出しで HTML をもう一度入れる
request:
  - name: uri
    type: vscode.Uri
    required: false
    default: なし（フォーカスのあるプレビューか、アクティブなエディタの Markdown）
    location: argument
    description: リロードするプレビューの Markdown
response:
  - name: '-'
    type: Promise<void>
    description: Webview に HTML をもう一度入れたら解決する
exceptions:
  - name: なし（正常終了）
    condition: もう一度決めたバージョンと設定で描く。描けないときはプレビューを開く.ts の描けない理由と同じものを出す
  - name: なし（プレビューが無い）
    condition: 対象の Markdown のプレビューが開いていない
    notes: 何もしない。コマンドは mdmark のプレビューが 1 つ以上開いているときだけコマンドパレットに出す
constraints:
  - item: 再読み込みするもの
    constraint: 設定ファイル、`aliases` の行が指す YAML（プレビューを開く.ts の制約「エイリアス」）、読み込むバージョン（プレビューを開く.ts の制約「バージョンの決め方」）、Webview の HTML（配布物を再読み込みする）。`ready` を受けたらその時点の全文と設定で `render` を送信する。差分のパネルは、その時点の変更前の文書の全文を `previous` に入れ、タブのタイトルは `差分プレビュー {ファイル名}` のままにする
