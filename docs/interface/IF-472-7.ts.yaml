id: IF-472-7
visibility: internal
title: 常駐サーバーを起動する
entry:
  kind: operation
  value: '`node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js start-server`（スキルが Bash で呼ぶ）'
flows:
  - name: 正常系
    summary: systemd --user が使える端末で、unit を記載して enable して起動し、待ち受けを待って `tools/list` を確認する
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: テスト専用の unit の名前と空いたポート
        description: 端末の設定の `serve.systemdUnit` を `mdmark-test-{乱数}` にし、`MDMARK_PORT` に空いたポートを指定する
        notes: テストの後に `systemctl --user disable --now {unit の名前}` を呼び、unit のファイルを削除して `daemon-reload` する。手元の `mdmark-mcp` と 8782 には触れない
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。起動する `mdmark serve` は、`MDMARK_SERVE_COMMAND` でこのブランチのビルドした CLI に差し替える。systemd --user は手元のものを使用する
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        participant S as 常駐サーバー
        K->>P: start-server
        P->>D: is-system-running（running）
        P->>D: is-active（active ではない）
        P->>P: ポートが待ち受けていない
        P->>P: unit のファイルを記載する
        P->>D: daemon-reload・enable --now
        D->>S: 起動
        P->>S: ポートが待ち受けるまで待つ
        P->>S: tools/list
        S-->>P: ツールの一覧
        P-->>K: started・launcher: systemd・unit・ログを確認する操作・止め方・終了コード 0
    expected:
      - 終了コードが 0、標準出力の JSON の `result` が `started`、`launcher` が `systemd`、`changes` が `["unit_written"]`
      - '`~/.config/systemd/user/{unit の名前}.service` があり、`ExecStart` が `MDMARK_SERVE_COMMAND` を実行し、`Environment` に `MDMARK_PORT`・`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`MDMARK_LAUNCHER=systemd`・`PATH` がある'
      - '`systemctl --user is-enabled` が `enabled`、`is-active` が `active` を返却し、`MDMARK_PORT` のポートで待ち受けるプロセスが unit のメインのプロセスである'
      - '`journalctl --user -u {unit の名前}` に待ち受ける URL の 1 行がある'
      - '`tools` に `export_html`・`build_site`・`check` がある'
      - '`log` が `journalctl --user -u {unit の名前}`、`stop` が `systemctl --user disable --now {unit の名前}`'
    test: test_normal
  - name: 正常系（既に起動している）
    summary: unit が今の内容で active で待ち受けていれば、もう一度起動しない
    setup:
      - name: 起動した unit
        description: 正常系を実行した後の状態
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        participant S as 常駐サーバー
        K->>P: start-server
        P->>D: is-active（active）・unit のファイルが今の内容と同じ
        P->>S: tools/list
        P-->>K: already_running・終了コード 0
    expected:
      - '`result` が `already_running`、`changes` が空'
      - unit の `MainPID` と unit のファイルの中身が呼ぶ前と同じ
    test: test_normal_when_already_running
  - name: 正常系（unit が待ち受けていない）
    summary: unit が active で待ち受けていなければ、unit を起動し直す
    setup:
      - name: 待ち受けない unit
        description: unit のファイルは今の内容で、`MDMARK_SERVE_COMMAND` を待ち受けずに動き続ける `sleep 600` にして起動してある。その後 `MDMARK_SERVE_COMMAND` を戻して呼ぶ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        K->>P: start-server
        P->>D: is-active（active）・ポートが待ち受けていない
        P->>P: unit のファイルを記載し直す
        P->>D: daemon-reload・restart
        P-->>K: restarted・終了コード 0
    expected:
      - '`result` が `restarted`'
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある'
    test: test_normal_when_unit_not_listening
  - name: 正常系（unit の内容が古い）
    summary: unit のファイルが今の内容と違えば、記載し直して起動し直す
    setup:
      - name: 古い内容の unit
        description: 正常系を実行した後に、`MDMARK_SERVE_COMMAND` の引数を変えて呼ぶ（プラグインのビルドで埋めた mdmark のバージョンが変わって起動するコマンドが変わったときと同じ）
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        participant S as 常駐サーバー
        K->>P: start-server
        P->>D: is-active（active）・unit のファイルが今の内容と違う
        P->>P: unit のファイルを記載し直す
        P->>D: daemon-reload・restart
        D->>S: 今のコマンドで起動
        P->>S: tools/list
        P-->>K: restarted・changes: unit_written・終了コード 0
    expected:
      - '`result` が `restarted`、`changes` が `["unit_written"]`'
      - unit のファイルの `ExecStart` が変えた後の `MDMARK_SERVE_COMMAND` を実行する
      - unit の `MainPID` が呼ぶ前と違い、そのプロセスが `MDMARK_PORT` のポートで待ち受ける
    test: test_normal_when_unit_outdated
  - name: 正常系（tmux のセッションから移す）
    summary: tmux のセッションで動いている常駐サーバーを閉じてから unit を起動する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: tmux のセッションで動く常駐サーバー
        description: '`TMUX_TMPDIR` の tmux サーバーの、端末の設定のセッション名のセッションで、`MDMARK_PORT` のポートを待ち受ける `mdmark serve` を動かしてある'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant T as tmux
        participant D as systemd --user
        K->>P: start-server
        P->>T: has-session（ある）
        P->>T: kill-session
        P->>P: ポートが解放されるまで待つ
        P->>D: unit を記載して daemon-reload・enable --now
        P-->>K: started・changes: tmux_session_closed, unit_written・終了コード 0
    expected:
      - '`result` が `started`、`changes` が `["tmux_session_closed", "unit_written"]`'
      - そのセッション名の tmux のセッションが無く、`MDMARK_PORT` のポートで待ち受けるプロセスが unit のメインのプロセス 1 つだけ
    test: test_normal_when_moved_from_tmux
  - name: 正常系（tmux）
    summary: systemd --user が使えない端末で、tmux のセッションで `mdmark serve` を起動する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: systemctl の無い PATH
        description: '`PATH` から `systemctl` を削除する'
      - name: 先に起動した tmux サーバーと空いたポート
        description: '`TMUX_TMPDIR` の tmux サーバーを別のセッションで先に起動しておき、`MDMARK_PORT` に空いたポートを指定する'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        participant T as tmux
        participant S as 常駐サーバー
        K->>P: start-server
        P->>P: systemctl が無いので tmux を使用する
        P->>T: has-session（無い）
        P->>T: new-session -d -s {セッション名} -e MDMARK_PORT=… -e MDMARK_LAUNCHER=tmux sh -c 'mdmark serve | tee'
        T->>S: 起動（ログを serve.log へ）
        P->>S: ポートが待ち受けるまで待つ
        P->>S: tools/list
        P-->>K: started・launcher: tmux・セッション名・ログ・止め方・終了コード 0
    expected:
      - 終了コードが 0、`result` が `started`、`launcher` が `tmux`
      - '`mdmark-mcp` の tmux のセッションがあり、`MDMARK_PORT` のポートで待ち受ける（先に起動していた tmux サーバーの中でも 8782 では待ち受けない）'
      - 状態の配置場所の `serve.log` に待ち受ける URL の 1 行があり、`log` がそのパス
      - '`stop` が `tmux kill-session -t =mdmark-mcp`'
    test: test_normal_when_tmux
  - name: 正常系（tmux で既に起動している）
    summary: セッションがあり待ち受けていれば、もう一度起動しない
    setup:
      - name: 起動した常駐サーバー
        description: 正常系（tmux）を実行した後の状態
      - name: Mock
        description: 正常系（tmux）と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        participant T as tmux
        participant S as 常駐サーバー
        K->>P: start-server
        P->>T: has-session（ある）
        P->>S: tools/list
        P-->>K: already_running・終了コード 0
    expected:
      - '`result` が `already_running`'
      - 常駐サーバーのプロセスが呼ぶ前と同じ
    test: test_normal_when_tmux_already_running
  - name: 正常系（tmux のセッションはあるが待ち受けていない）
    summary: 応答しないセッションを閉じてからもう一度起動する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: systemctl の無い PATH
        description: 正常系（tmux）と同じ
      - name: 止まったセッション
        description: '`mdmark-mcp` の tmux のセッションで `sleep` だけを動かし、ポートで待ち受けていない'
      - name: Mock
        description: 正常系（tmux）と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        participant T as tmux
        K->>P: start-server
        P->>T: has-session（ある）・ポートが待ち受けていない
        P->>T: kill-session してから new-session
        P-->>K: restarted・終了コード 0
    expected:
      - '`result` が `restarted`'
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つある'
    test: test_normal_when_session_stale
  - name: 正常系（tmux に固定する）
    summary: 端末の設定の `serve.launcher` が `tmux` なら、active か enabled の unit を disable --now してから tmux で起動する
    setup:
      - name: 起動した unit
        description: 正常系を実行した後の状態から、端末の設定の `serve.launcher` を `tmux` に書き換える
      - name: 先に起動した tmux サーバー
        description: 正常系（tmux）と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        participant T as tmux
        K->>P: start-server
        P->>P: 端末の設定の serve.launcher が tmux
        P->>D: is-active（active）
        P->>D: disable --now
        P->>P: ポートが解放されるまで待つ
        P->>T: new-session
        P-->>K: started・changes: unit_disabled・終了コード 0
    expected:
      - '`result` が `started`、`launcher` が `tmux`、`changes` が `["unit_disabled"]`'
      - unit の `is-enabled` が `enabled` ではなく、`is-active` が `active` ではない
      - そのセッション名の tmux のセッションがあり、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけ
    test: test_normal_when_fixed_to_tmux
  - name: 正常系（引数で tmux を指定する）
    summary: '`--launcher tmux` で呼ぶと、unit に触れずに tmux で起動する（端末の設定が無いまま書き込みを断られたときの呼び方）'
    setup:
      - name: 起動した unit
        description: 正常系を実行した後の状態。unit は `MDMARK_PORT` のポートで待ち受けている
      - name: 先に起動した tmux サーバーと別の空いたポート
        description: 正常系（tmux）と同じ。`MDMARK_PORT` には unit と別の空いたポートを指定し、端末の設定の `serve.launcher` は書き換えない
      - name: Mock
        description: 正常系と同じ。`start-server --launcher tmux` で呼ぶ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant T as tmux
        K->>P: start-server --launcher tmux
        P->>T: has-session（無い）・new-session
        P-->>K: started・launcher: tmux・changes は空・終了コード 0
    expected:
      - '`result` が `started`、`launcher` が `tmux`、`changes` が空'
      - unit の `is-enabled` が `enabled`、`is-active` が `active` のままで、`MainPID` と unit のファイルの中身が呼ぶ前と同じ
      - そのセッション名の tmux のセッションがあり、指定したポートで待ち受ける
    test: test_normal_when_launcher_argument_is_tmux
  - name: 異常系（起動の方法が無い・終了コード 2）
    summary: systemd --user も tmux も使えなければ起動せず、端末で動かすコマンドを返却する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: systemctl と tmux の無い PATH
        description: '`PATH` から `systemctl` と tmux を削除する'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: start-server
        P-->>K: 端末で動かすコマンド・終了コード 2
    expected:
      - 終了コードが 2
      - 標準エラーに systemd --user も tmux も使えないことと、`MDMARK_PORT` を付けた `npx -y github:shuhei1101/mdmark#v{バージョン} serve` のコマンドが出る
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが無い'
    test: test_error_when_launcher_missing
  - name: 異常系（ポートが使用されている・終了コード 1）
    summary: unit もセッションも動いていないのにポートが待ち受けていれば、unit を記載せずに修正方法を返却する。起動した後に `mdmark serve` が終わったときも、ログの理由と修正方法を返却する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: ポートを使用するほかのプロセス
        description: '`MDMARK_PORT` のポートを mdmark ではないプロセスが待ち受ける'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        participant D as systemd --user
        K->>P: start-server
        P->>D: is-active（active ではない）
        P->>P: ポートが待ち受けている（ほかのプロセス）
        P-->>K: ポートが使用されていることと修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - '`~/.config/systemd/user/{unit の名前}.service` が作られず、`is-enabled` が `enabled` ではない'
      - 標準エラーに、ポートが使用されていることと、`settings.json` の `env` の `MDMARK_PORT` を空いたポートに変えてセッションをもう一度開き `global-setup` をもう一度呼ぶ修正方法が出る
      - ほかのプロセスはポートを待ち受けたまま
    test: test_error_when_port_in_use
  - name: 異常系（mdmark serve が終わった・終了コード 1）
    summary: unit で起動した `mdmark serve` が待ちの間に終わると、起動し直しを待たずに unit を disable --now して journal の末尾を返却する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ。`MDMARK_SERVE_COMMAND` を、1 行出して 0 以外で終わる `echo failed; exit 1` にする
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup）
        participant P as setup.js
        participant D as systemd --user
        K->>P: start-server
        P->>D: unit を記載して enable --now
        P->>D: show -p NRestarts,ActiveState,SubState（NRestarts が 1）
        P->>D: disable --now
        P-->>K: journal の末尾と修正方法・終了コード 1
    expected:
      - 終了コードが 1 で、上限の 120 秒より前に返る
      - unit の `is-enabled` が `enabled` ではなく、`is-active` が `active` ではない
      - 標準エラーに `mdmark serve` が終わったことと、`journalctl --user -u {unit の名前}` の末尾（`failed` の行）が出る
    test: test_error_when_server_exited
  - name: 異常系（待ちを超えた・終了コード 3）
    summary: 上限の間に待ち受けなければ、unit を disable --now してログの末尾ともう一度呼ぶことを返却する
    setup:
      - name: 一時の端末
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ。`MDMARK_SERVE_COMMAND` を待ち受けずに動き続ける `sleep 600` に、`MDMARK_START_TIMEOUT_SEC` を `2` にする
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        participant D as systemd --user
        K->>P: start-server
        P->>D: unit を記載して enable --now
        P->>P: 上限まで待ち受けない
        P->>D: disable --now
        P-->>K: journal の末尾ともう一度呼ぶこと・終了コード 3
    expected:
      - 終了コードが 3
      - unit の `is-enabled` が `enabled` ではなく、`is-active` が `active` ではない
      - 標準エラーに `journalctl --user -u {unit の名前}` の末尾と、取得に時間がかかっているのでもう一度 `global-setup` を呼ぶことが出る
    test: test_error_when_start_timed_out
lead: '`global-setup` が呼び、systemd --user の unit か tmux のセッションの中で `mdmark serve` を起動して待ち受けを待ち、`tools/list` でつながることを確認する。'
test_file: tests/integration/ClaudeCodeプラグイン/setup-start-server.test.ts
idempotent: true
side_effects: systemd --user では `~/.config/systemd/user/{unit の名前}.service` を記載して `daemon-reload`・`enable`・起動する。tmux ではセッションを作り、状態の配置場所の `serve.log` に追記する。起動しないほうの方法で動いている常駐サーバー（tmux のセッションか、active か enabled の unit）は止める
callers:
  - SC-472-69#
request:
  - name: --launcher
    type: '"systemd" | "tmux"'
    required: false
    default: なし（端末の設定の `serve.launcher`）
    location: argument
    description: 起動の方法をこの呼び出しだけ固定する。指定したときは、起動しないほうの方法で動いている常駐サーバーを止めない（制約『移し替え』は行わない）。`global-setup` は端末の設定が無いまま書き込みを断られたときに `tmux` を指定する
  - name: MDMARK_PORT
    type: string
    required: false
    default: "'8782'"
    location: argument
    description: 常駐サーバーのポート（環境変数）。unit の `Environment` かセッションの `-e` で指定する
  - name: MDMARK_CONFIG
    type: string
    required: false
    default: なし（既定のパス）
    location: argument
    description: 端末の設定のパス（環境変数）。起動の方法・unit の名前・セッション名を読み込み、起動するプロセスへ指定する
  - name: MDMARK_STATE_DIR
    type: string
    required: false
    default: なし（`${XDG_STATE_HOME:-~/.local/state}/mdmark`）
    location: argument
    description: 状態の配置場所（環境変数）
  - name: MDMARK_SERVE_COMMAND
    type: string
    required: false
    default: なし（`npx -y github:shuhei1101/mdmark#{プラグインのビルドで埋めた mdmark のバージョン} serve`）
    location: argument
    description: 起動するコマンド（環境変数）。テストでビルドした CLI に差し替える
  - name: MDMARK_START_TIMEOUT_SEC
    type: string
    required: false
    default: "'120'"
    location: argument
    description: 待ち受けを待つ上限の秒数（環境変数）。テストで短くする
response:
  - name: result
    type: '"started" | "already_running" | "restarted"'
    description: 起動したか・既に動いていたか・もう一度起動したか
  - name: launcher
    type: '"systemd" | "tmux"'
    description: 常駐サーバーを動かしている方法
  - name: changes[]
    type: '"unit_written" | "unit_disabled" | "tmux_session_closed"'
    description: unit のファイルを記載した・unit を disable --now した・tmux のセッションを閉じた、のうち行ったもの
  - name: unit
    type: string | null
    description: '`launcher` が `systemd` のとき unit の名前。ほかは `null`'
  - name: session
    type: string | null
    description: '`launcher` が `tmux` のとき tmux のセッション名。ほかは `null`'
  - name: url
    type: string
    description: '`http://127.0.0.1:{ポート}/mcp`'
  - name: tools[]
    type: string
    description: '`tools/list` が返却したツールの名前'
  - name: log
    type: string
    description: systemd では `journalctl --user -u {unit の名前}`、tmux では `serve.log` のパス
  - name: stop
    type: string
    description: 止める操作（systemd では `systemctl --user disable --now {unit の名前}`、tmux では `tmux kill-session -t ={セッション名}`）
exceptions:
  - name: なし（正常終了）
    condition: 待ち受けを確認した。終了コード 0
  - name: なし（ポートが使用されている・終了コード 1）
    condition: 起動する前に unit とセッションの外のプロセスがポートを待ち受けている、待ちの間に `mdmark serve` が終わった（制約『終わったことの判定』）、または待ち受けているプロセスから `tools/list` を受け取れない
    notes: '`mdmark serve` が終わったときは、unit を disable --now するかセッションを残さず、ログの末尾を出す'
  - name: なし（起動の方法が無い・終了コード 2）
    condition: 使用する起動の方法が使えない。`systemd` に固定して systemd --user が使えない、`tmux` に固定して `PATH` に tmux が無い、`auto` でどちらも使えない
  - name: なし（待ちを超えた・終了コード 3）
    condition: 上限の間にポートが待ち受けなかった
    notes: unit を disable --now するか、セッションを閉じる
constraints:
  - item: 起動の方法の決め方
    constraint: '`--launcher`、無ければ端末の設定の `serve.launcher`（既定 `auto`）。`auto` は systemd --user が使えれば `systemd`、使えなければ `tmux`'
    decided_by: CFG-472-3#settings[serve.launcher]
  - item: systemd --user が使えるか
    constraint: '`PATH` に `systemctl` があり、`systemctl --user is-system-running` の標準出力が `running`・`degraded`・`starting` のどれか。終了コードは見ない'
    notes: '`degraded` はほかの unit が失敗しているだけで、user のマネージャーは動いている。終了コードは `degraded` でも 0 以外になる'
    decided_by: LIB-472-25#catalogs
  - item: unit のファイル
    constraint: "`${XDG_CONFIG_HOME:-~/.config}/systemd/user/{unit の名前}.service`。`[Service]` に `Environment=` で `MDMARK_PORT`・`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`MDMARK_LAUNCHER=systemd`・`PATH`（呼んだ側の `PATH` で見つかる `node`・`npx` のフォルダと `/usr/local/bin:/usr/bin:/bin`）を、`ExecStart=/bin/sh -c '{起動するコマンド}'`・`Restart=on-failure` を、`[Install]` に `WantedBy=default.target` を記載する"
    notes: user のマネージャーの `PATH` には npx・node が無いことがあるため、`node`・`npx` のフォルダを渡す。呼んだ側の `PATH` をそのまま記載すると、セッションや worktree ごとに中身が変わって呼ぶたびに起動し直し、削除される worktree のパスも残る。`ExecStart` の既定の `npx -y github:…#v{バージョン} serve` は、取得済みのキャッシュがあればネットワークにつながらなくても CLI を起動するが、GitHub への問い合わせの再試行で約 2 分半かかる（2026-11-09 に v0.10.0 で、`HTTPS_PROXY` を使用できないポートにして測った。`npm_config_prefer_offline=true` でも同じ。つながるときは約 10 秒）。端末の起動時にネットワークが無くても、その後に起動する。user のマネージャーからは `network-online.target` を待てない
    decided_by: LIB-472-25#limitations
  - item: 終わったことの判定
    constraint: systemd では、待ちの 1 秒ごとに `systemctl --user show -p NRestarts -p ActiveState -p SubState {unit の名前}` の `Key=Value` の行を引き、`NRestarts` が 1 以上か、`SubState` が `auto-restart` か、`ActiveState` が `failed` なら終わったとする。tmux では `has-session` が 0 以外なら終わったとする
    notes: '`Restart=on-failure` の unit は、起動の上限（既定 10 秒に 5 回）を超えるまで `failed` にならず `activating (auto-restart)` と `active` を繰り返す。`NRestarts` は `start`・`restart` で 0 に戻る'
    decided_by: LIB-472-25#limitations
  - item: unit の値の書き方
    constraint: '`Environment=` の値は `"` で囲み、`\`・`"` を `\` で、`%` を `%%` で打ち消す。`ExecStart` のコマンドの `%` も `%%` に、`$` を `$$` にする（systemd が `${名前}`・`$名前` を環境変数で置き換えるため）'
    decided_by: LIB-472-25#limitations
  - item: unit の書き換え
    constraint: 記載する内容が今のファイルと同じなら記載しない。記載したら `daemon-reload` し、active なら `restart`、active でなければ `enable --now` する。内容が同じで enabled でなければ `enable` する
  - item: 移し替え
    constraint: 起動の方法を `--launcher` ではなく端末の設定（`auto` を含む）で決めたときだけ行う。systemd で起動するときは、端末の設定のセッション名の tmux のセッションを `kill-session` してから起動する。tmux で起動するのは端末の設定の `serve.launcher` が `tmux` のときと `auto` で systemd --user が使えないときで、前者で unit が active か enabled なら `disable --now` してから起動する。どちらもポートが解放されるまで 1 秒ごとに確かめ、上限は 10 秒
    notes: 同じポートに 2 つの常駐サーバーを立てない。unit のファイルは削除しない。`--launcher tmux`（端末の設定が無いまま書き込みを断られたとき）は unit に触れず、unit が active でポートが待ち受けていれば `already_running`（`launcher` は `systemd`）を返却する
  - item: tmux の起動のコマンド
    constraint: "`tmux new-session -d -s {セッション名} -e MDMARK_PORT={ポート} -e MDMARK_CONFIG={パス} -e MDMARK_STATE_DIR={パス} -e MDMARK_LAUNCHER=tmux sh -c '{起動するコマンド} 2>&1 | tee -a {serve.log}'`。環境変数は `-e` で明示して指定し、コマンドは `sh -c` の引数として指定して POSIX の記載方法だけを使用する"
    notes: tmux サーバーが既に動いていると呼んだ側の環境変数は渡らず、1 つの文字列のコマンドは `default-shell` で実行される
    decided_by: LIB-472-29#limitations
  - item: セッションの指定
    constraint: '`has-session`・`kill-session` の `-t` は `={セッション名}` の完全一致'
    decided_by: LIB-472-29#catalogs
  - item: 待ち
    constraint: 1 秒ごとにポートへもう一度つなぎ、上限は 120 秒（`MDMARK_START_TIMEOUT_SEC` で変えられる）
    decided_by: NFR-472-1#requirements[MCP サーバーの接続の待ち]
    notes: '空の npm のキャッシュから CLI を取得すると 53 秒かかった（PoC #73）。新しい端末とプラグインの更新の後は空のキャッシュからの取得になるため、その 2 倍強を上限にする'
  - item: unit の名前・セッション名
    constraint: 端末の設定の `serve.systemdUnit`・`serve.tmuxSession`、無ければどちらも `mdmark-mcp`
    decided_by: CFG-472-3#settings[serve.systemdUnit]
  - item: 常駐の仕方
    constraint: systemd --user の unit と tmux のセッションの外での `nohup`・`setsid`・`&` による常駐はしない
  - item: 出力
    constraint: 結果は標準出力に JSON の 1 行で出す。誤りは標準エラーに理由と修正方法を出す
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
