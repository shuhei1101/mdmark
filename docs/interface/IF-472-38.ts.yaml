id: IF-472-38
visibility: internal
title: "複数の文書を1枚のHTMLにまとめる"
entry:
  kind: operation
  value: '`mdmark build [--config {設定ファイル}] [--keep-traces]`（CLI。`npx github:shuhei1101/mdmark#v{バージョン} build` で呼ぶ）'
flows:
  - name: 正常系
    summary: 3 つの文書を、文書をまたぐ用語と被参照が有効になる 1 枚にまとめる
    setup:
      - name: 見本の文書群
        description: 入口 `README.md`・用語集の表を持つ `用語集.md`・`test-lib` のマーカーと画像を持つ `使い方/guide.md` と、3 つを記載した索引。`README.md` から他の 2 つへリンクし、本文に用語集の表の単語を持つ
      - name: build の設定
        description: '`include: ["**/*.md"]`・`glossary: ["用語集.md"]`・`entry: README.md`・`out: dist/docs.html`'
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant M as collectReferences
        participant H as build.out
        W->>C: mdmark build
        C->>C: 設定・索引・include の文書を読み込む
        C->>M: 索引・文書
        M-->>C: 参照の表
        C->>H: 3 つの文書と参照の表を埋めた HTML を書き込む
        C-->>W: 書き出した: dist/docs.html（文書 3 件）・終了コード 0
    expected:
      - '終了コードが 0 で、標準出力が `書き出した: dist/docs.html（文書 3 件）`、標準エラーが空'
      - '`dist/docs.html` を file:// で開くと `README.md` が描かれ、文書の一覧に 3 つが並ぶ'
      - '`README.md` の本文で `用語集.md` の表の用語がツールチップを出す'
      - '`README.md` の `使い方/guide.md` へのリンクで `使い方/guide.md` が描かれ、その末尾の関連文書に `README.md` が出る'
      - 描き終えるまでと文書を移った後に、ページ自身と画像の `data:` のほかの要求が 0 件
    test: test_normal
  - name: 正常系（1 枚に含まれない文書へのリンクがある）
    summary: 除外した文書へのリンクを記載したまま残し、警告に出す
    setup:
      - name: 除外した文書を指す文書群
        description: '正常系の文書群に `下書き/メモ.md` を追加し、`exclude: ["下書き/**"]` で削除し、`README.md` からリンクする'
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as build.out
        W->>C: mdmark build
        C->>C: exclude に該当する文書を除外する
        C->>H: 3 つの文書を埋めた HTML を書き込む
        C-->>W: リンクの警告・終了コード 0
    expected:
      - 終了コードが 0 で、標準出力の文書の件数が 3
      - 標準エラーに `README.md` と `下書き/メモ.md` を含む警告の行がある
      - HTML の中で、そのリンクが記載したままの `href` で残る
      - 文書の一覧に `下書き/メモ.md` が無い
    test: test_normal_when_link_outside_bundle
  - name: 異常系（build が無い・終了コード 1）
    summary: 設定に `build` が無いと、記載方法を示して終わる
    setup:
      - name: build の無い設定
        description: '`build` を持たない `mdmark.config.yaml` と文書を持つフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark build
        C->>C: 設定に build が無い
        C-->>W: build の記載方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `build` が無いことと `build.include`・`build.out` を記載することが出る
      - HTML が記載されていない
    test: test_error_when_build_missing
  - name: 異常系（対象の文書が 0 件・終了コード 1）
    summary: '`build.include` がどの文書にも該当しないと、HTML を書き込まずに終わる'
    setup:
      - name: 該当しない include
        description: '`build.include` がどのファイルにも該当しない設定'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark build
        C->>C: include に該当する文書が 0 件
        C-->>W: 対象が 0 件と include の修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに対象が 0 件であることと `build.include` が出る
      - '`build.out` に HTML が記載されていない'
    test: test_error_when_no_documents
  - name: 異常系（出力先へ書き込めない・終了コード 1）
    summary: '`build.out` へ記載できないと、パスと修正方法を示して終わる'
    setup:
      - name: 記載できない out
        description: 正常系の文書群にファイル `dist` を配置し、`build.out` を `dist/docs.html` にしたもの
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark build
        C-->>W: 書き込めないパスと修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `dist/docs.html` と修正方法が出る
      - ファイル `dist` が変わっていない
    test: test_error_when_output_unwritable
  - name: 異常系（動画・音声のコピー先へ書き込めない・終了コード 1）
    summary: 動画・音声のコピー先の `_files/` へ書き込めないと、HTML を書き込まずにパスと修正方法を示して終わる
    setup:
      - name: 記載できないコピー先
        description: 正常系（画像・動画・音声を埋める）の文書群で、`dist/` にファイル `docs_files` を配置したもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        W->>C: mdmark build
        C->>C: 動画・音声を docs_files/ へコピーする（作れない）
        C-->>W: 書き込めないパスと修正方法・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `dist/docs_files` と修正方法が出る
      - ファイル `dist/docs_files` が変わっておらず、`dist/docs.html` が書き込まれていない
    test: test_error_when_media_copy_unwritable
  - name: 正常系（エイリアスを読み込む）
    summary: 設定の aliases の YAML から作ったエイリアスを埋め、まとめた全ての文書で有効にしる
    setup:
      - name: エイリアスを持つフォルダ
        description: '正常系のフォルダの設定に `aliases` の 2 行（`alias_type` が `command` で `paths: aliases/commands.yaml`、`env` で `paths: aliases/servers.yaml`）を記載し、`aliases/commands.yaml` にレコード（`id: run-test`・`name: テストを実行する`・`command: npm test`）、`aliases/servers.yaml` にレコード（`id: dev-server`・`name: 開発サーバー`・`url: http://127.0.0.1:8767/`）を配置したフォルダ。まとめる 2 つの文書の本文に `テストを実行する` と `開発サーバー` がある'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant B as buildAliases
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>C: 設定の aliases の YAML を読み込む
        C->>B: 行・読み込んだ中身
        B-->>C: エイリアス
        C->>H: エイリアスを埋めた 1 枚の HTML を書き込む
        C-->>W: 書き出した・終了コード 0
    expected:
      - 終了コードが 0
      - まとめた 2 つの文書のどちらでも、`テストを実行する` に下線が付き、ツールチップに `npm test` が出る
      - '`開発サーバー` に下線が付かない'
      - 書き出した HTML のソースに `env` のレコードの `dev-server`・`http://127.0.0.1:8767/` が入っていない
    test: test_normal_when_aliases
  - name: 正常系（テーマを選ぶ設定）
    summary: 設定の `colorTheme` を埋める設定にコピーし、まとめた全ての文書を選んだテーマで描く
    setup:
      - name: テーマを選ぶフォルダ
        description: '正常系のフォルダの設定に `colorTheme: theme-slate` を記載したフォルダ'
      - name: Mock
        description: '差し替える依存は無い。書き出した HTML は Playwright の Chromium で file:// で開き、OS の配色はライト（`prefers-color-scheme: light`）にする'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>H: colorTheme をコピーした設定を埋めて 1 枚の HTML を書き込む
        C-->>W: 書き出した・終了コード 0
        W->>H: 開いて 2 つ目の文書へ移る
    expected:
      - 終了コードが 0
      - 最初に開いた文書と、文書の一覧から移った 2 つ目の文書のどちらでも、文書の地の色の計算値が theme-slate の明るい配色の `--mdmark-color-bg` の値
    test: test_normal_when_color_theme
  - name: 正常系（文書ごとのページの設定）
    summary: page のマーカーを持つ文書と持たない文書を行き来すると、開いた文書の明暗で再描画する
    setup:
      - name: ページの設定を持つフォルダ
        description: '正常系のフォルダで、`entry` の文書の先頭の行に `<!-- page: {"scheme": "dark", "theme": "theme-slate"} -->` を記載し、もう 1 つの文書はマーカーを持たない'
        notes: 設定は `colorScheme` を持たない。開くブラウザの配色はライト
      - name: Mock
        description: 差し替える依存は無い（記載した HTML だけを空のフォルダへコピーして file:// で開く）
    flow: |-
      sequenceDiagram
        participant W as 文書の作成者
        participant C as mdmark build
        participant H as まとめた HTML
        W->>C: mdmark build
        C->>H: マーカーを本文に残した文書を埋めて記載する
        W->>H: file:// で開き、もう 1 つの文書を選ぶ
        H-->>W: 開いた文書の明暗で再描画する
    expected:
      - 開いたとき、描く先の要素が class `mdmark-theme-dark` と属性 `data-mdmark-color-theme="theme-slate"` を持つ
      - もう 1 つの文書を選ぶと、描く先の要素が class `mdmark-theme-dark`・`mdmark-theme-light` を持たず、属性 `data-mdmark-color-theme` が `dev-swiss`
      - 外への要求が 0 件
    test: test_normal_when_page_settings_per_document
    refs:
      - SC-472-13#scenarios[正常シナリオ（文書ごとのページの設定）]
  - name: 正常系（画像・動画・音声を埋める）
    summary: 2 つの文書が指す同じ画像を 1 回だけ埋め、動画・音声を出力の隣のフォルダへコピーする
    setup:
      - name: まとめる文書とファイル
        description: 設定の `build` の `a.md` と `sub/b.md` が、同じ `images/chart.png`（`a.md` からは `images/chart.png`、`sub/b.md` からは `../images/chart.png`）と、別々の `media/demo.mp4`・`sub/media/voice.mp3` を相対パスで指す。`build.out` は `dist/docs.html`
      - name: Mock
        description: 差し替える依存は無い。まとめた HTML は Playwright の Chromium で file:// で開き、要求を記録する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>C: 画像を 1 回だけ data URL に替え、動画・音声を docs_files/ へコピーする
        C->>H: docs.html と docs_files/ を書き込む
        C-->>W: 書き出した: dist/docs.html（文書 2 件）・終了コード 0
    expected:
      - 終了コードが 0
      - '`chart.png` の `data:` URL が HTML の中に 1 回だけある'
      - '`dist/docs_files/media/demo.mp4` と `dist/docs_files/sub/media/voice.mp3` がある'
      - どちらの文書を開いても、`video`・`audio` の `src` がコピーへの相対パスで、`readyState` が 1 以上になる
      - '`docs.html` と `docs_files/` だけを空のフォルダへコピーして file:// で開き、文書を移っても、ページ自身・`docs_files/` の下のファイルと画像の `data:` のほかの要求が 0 件'
    test: test_normal_when_media_embedded
    refs:
      - SC-472-76#scenarios[正常シナリオ（画像・動画・音声を埋める）]
  - name: '正常系（blob: と動的 import を許さない環境で開く）'
    summary: 'まとめる全ての文書が使用するモジュールを 1 つのスクリプトにまとめて埋め、blob: と動的 import を許さない環境でも文書を移って描く'
    setup:
      - name: 埋めるモジュールを使用する文書群
        description: '入口 `README.md`（`greet` のマーカーと言語 `ts` のコードブロック）と、`README.md` からリンクする `guide.md`（ビューのマーカーと `test-lib` のマーカー）。`build` と、`extensions`（マーカー `greet` の拡張）・`libraries`（`test-lib` に相対パスの手元のモジュール）・`syntax.url`（手元の `vendor/highlightjs/es/`）を記載した設定'
        notes: '`greet` の拡張は `load` の中で同じフォルダの別のファイルを動的 `import()` で読み込む'
      - name: Mock
        description: "外部ライブラリと色分けのライブラリは手元のモジュール。まとめた HTML を、`Content-Security-Policy: script-src 'unsafe-inline'` のヘッダーを付けて返却する手元のサーバーから Playwright の Chromium で開く（`blob:` と `data:` のスクリプトと、動的 `import()` で読み込むスクリプトを許さない）"
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as build.out
        W->>C: mdmark build
        C->>C: 2 つの文書が使用する greet・ビューの部品・色分けの本体と ts・test-lib を起動の処理と 1 つのスクリプトにまとめる
        C->>H: まとめたスクリプトを script 要素に入れて記載する
        C-->>W: 書き出した: dist/docs.html（文書 2 件）・終了コード 0
        W->>H: blob: と動的 import を許さない環境で開き、リンクで guide.md へ移る
        H-->>W: どちらの文書もマーカー・ビュー・色分けを描く
    expected:
      - 終了コードが 0 で、標準エラーが空
      - '`README.md` で、`greet` のマーカーの場所に拡張が描いた要素があり、`ts` の `code` の中に class が `hljs-` で始まる `span` がある'
      - リンクで移った `guide.md` で、ビューが描かれ、`test-lib` のマーカーが描かれて通知ブロックが出ない
      - 開いてから文書を移った後までに、CSP の違反（`securitypolicyviolation`）が 0 件で、`blob:`・`data:` の URL のスクリプトへの要求が 0 件
    test: test_normal_when_blob_and_dynamic_import_blocked
    refs:
      - 'SC-472-76#scenarios[正常シナリオ（blob: と動的 import を許さない環境で開く）]'
  - name: 正常系（範囲のスクリプトと CSS）
    summary: 範囲の `ts` を変換してまとめ、文書を移るときに範囲の `destroy` を呼ぶ
    setup:
      - name: 範囲のスクリプトを持つフォルダ
        description: '`features.html-scripts` を `true` にし、`build` に、`<!-- html -->` の範囲に `html`・`css`・`ts` を配置した文書と、範囲を持たない文書の 2 つを指定した設定'
        notes: '`ts` はノードを押すと根の要素に class `is-open` を付与・解除し、`destroy` で `window.__mdmarkDestroyed` を 1 増やす'
      - name: Mock
        description: '正常系（blob: と動的 import を許さない環境で開く）と同じ'
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>C: 範囲の ts を esbuild で変え、まとめるスクリプトに加える
        C->>H: 1 枚の HTML を書き込む
        W->>H: 範囲を持つ文書を開き、範囲を持たない文書へ移る
        H-->>W: 範囲の destroy を呼んでから移った文書を描く
    expected:
      - 終了コードが 0 で、範囲を持つ文書の範囲のノードの背景が `css` の色で、押すと根の要素が class `is-open` を持つ
      - 範囲を持たない文書へ移ると `window.__mdmarkDestroyed` が 1 で、移った先に `style.mdmark-html-style` が無い
      - 開いてから文書を移り終えるまでに、CSP の違反が 0 件で、`blob:` の URL への要求が 0 件
    test: test_normal_when_range_scripts
    refs:
      - SC-472-76#scenarios[正常シナリオ（範囲のスクリプトと CSS）]
  - name: 正常系（取り込みとアイコンを埋める）
    summary: まとめる文書の取り込み先とまとめていない名前のアイコンの形状を埋め、外へ要求せずに描く
    setup:
      - name: 取り込みとアイコンを持つ文書群
        description: '設定の `build.include` が `docs/a.md` と `docs/b.md` に該当する。`a.md` が `<!-- include: {"path": "b.md", "heading": "使い方"} -->`・`<!-- include: {"path": "../共通/手順.md"} -->`・段落の `` `icon:sailboat` `` を持ち、`b.md` が `## 使用方法` を持つ。`共通/手順.md` は `build.include` に該当しない'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright の Chromium で file:// で開き、要求を記録する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>C: 文書ごとに取り込み先を読み込み、アイコンの形状を lucide から取り出す
        C->>H: 文書ごとの includes と icons を埋めて記載する
        C-->>W: 書き出した: {build.out}・終了コード 0
    expected:
      - 終了コードが 0
      - 開いた HTML の `a.md` の 2 つのマーカーの場所に、`b.md` の `使用方法` の中身と `共通/手順.md` の中身が描かれている
      - 文書の一覧に `共通/手順.md` が無い
      - '`sailboat` の場所に `svg` がある'
      - 描き終えるまでに外への要求が 0 件
    test: test_normal_when_includes_and_icons
    refs:
      - SC-472-76#scenarios[正常シナリオ（取り込みとアイコンを埋める）]
  - name: 正常系（mermaid のコードブロック）
    summary: まとめる文書のどれかに mermaid のコードブロックがあるときだけ mermaid を 1 回まとめて埋める
    setup:
      - name: mermaid を使用する文書を含むフォルダ
        description: 入口と、言語 `mermaid` の flowchart のコードブロックを持つ文書の 2 つ。`mermaid.url` に手元の `vendor/mermaid/mermaid.esm.min.mjs` を記載した設定
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as build.out
        W->>C: mdmark build
        C->>C: mermaid のコードブロックがある文書があるので、mermaid を 1 つのスクリプトにまとめる
        C->>H: mermaid を埋めて記載する
    expected:
      - 終了コードが 0 で、まとめた HTML を file:// で開いて mermaid の文書へ移ると、`figure.mdmark-diagram[data-diagram="mermaid"]` があり、外への要求が 0 件
      - mermaid のコードブロックを持たない文書だけを `include` にしたときは、mermaid が埋められていない
    test: test_normal_when_mermaid_embedded
  - name: 正常系（戻る・進むで離れたときの位置に戻る）
    summary: 文書間のリンクで移ってから戻る・進むと、その履歴の項目を離れたときのスクロール位置で描く
    setup:
      - name: 長い文書を持つフォルダ
        description: '`entry` の `a.md` は段落を 200 個持ち、100 個目の段落に `b.md` へのリンクを持つ。`b.md` は段落を 200 個持ち、末尾に `a.md` へのリンクを持つ'
        notes: 開く画面は 1280 × 800px
      - name: Mock
        description: 差し替える依存は無い（記載した HTML だけを空のフォルダへコピーして Playwright の Chromium で file:// で開く）
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant H as まとめた HTML
        participant S as sessionStorage
        U->>H: a.md を b.md へのリンクまでスクロールして押す
        H->>S: a.md の項目の位置を保存する
        H-->>U: b.md の頭
        U->>H: b.md を 1000px スクロールして戻る
        H->>S: b.md の項目の位置を保存する
        S-->>H: a.md の項目の位置
        H-->>U: a.md を保存した位置で描く
        U->>H: 進む
        S-->>H: b.md の項目の位置
        H-->>U: b.md を保存した位置で描く
        U->>H: b.md の末尾の a.md へのリンクを押す
        H-->>U: 新しい項目として a.md の頭
    expected:
      - 開いた後、`history.scrollRestoration` が `manual`
      - リンクで b.md へ移ると `scrollY` が 0
      - 戻るで a.md が描かれ、`scrollY` がリンクを押したときの値（±1px）で、b.md へのリンクが画面に入っている
      - 進むで b.md が描かれ、`scrollY` が 1000（±1px）
      - b.md の末尾のリンクで a.md へ移ると `scrollY` が 0
      - どの時点も URL の `#` が文書のパス（と見出し）だけを持ち、位置を持たない
      - 外への要求が 0 件
    test: test_normal_when_back_forward_restore_scroll
    refs:
      - SC-472-13#scenarios[正常シナリオ（戻る・進むで離れたときの位置に戻る）]
  - name: 正常系（再読み込みで離れたときの位置に戻る）
    summary: 開いている文書をスクロールして再読み込みすると、再読み込みの前の位置で描く
    setup:
      - name: 長い文書を持つフォルダ
        description: 正常系（戻る・進むで離れたときの位置に戻る）と同じ
      - name: Mock
        description: 正常系（戻る・進むで離れたときの位置に戻る）と同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant H as まとめた HTML
        participant S as sessionStorage
        U->>H: a.md を 3000px スクロールして再読み込みする
        H->>S: pagehide で a.md の項目の位置を保存する
        S-->>H: a.md の項目の位置
        H-->>U: a.md を保存した位置で描く
    expected:
      - 再読み込みの後、a.md が描かれ、`scrollY` が 3000（±1px）
    test: test_normal_when_reload_restore_scroll
    refs:
      - SC-472-13#scenarios[正常シナリオ（再読み込みで離れたときの位置に戻る）]
  - name: 正常系（戻るで開閉と選んだタブを戻す）
    summary: 開閉と group の無いタブを変えてから移り、戻ると開閉とタブを戻してから位置を戻す
    setup:
      - name: 開閉とタブを持つフォルダ
        description: '`entry` の `a.md` は、`<!-- section: {"open": false} -->` の h2 のセクション（中に `group` の無い 2 つのタブ。2 つ目のタブに段落 100 個と `b.md` へのリンク）、閉じた表（`<!-- table: {"kind": "data", "collapse": {"open": false}} -->`）、フォルダを持つファイルツリーを持つ。`b.md` は 1 段落'
      - name: Mock
        description: 正常系（戻る・進むで離れたときの位置に戻る）と同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant H as まとめた HTML
        participant S as sessionStorage
        U->>H: セクションと閉じた表を開き、ファイルツリーのフォルダを閉じ、2 つ目のタブを選ぶ
        U->>H: 2 つ目のタブの b.md へのリンクまでスクロールして押す
        H->>S: a.md の項目の開閉・タブ・位置を保存する
        H-->>U: b.md
        U->>H: 戻る
        S-->>H: a.md の項目の開閉・タブ・位置
        H-->>U: 開閉とタブを戻し、保存した位置で a.md を描く
    expected:
      - 戻るで a.md に戻ると、セクションのボタンの `aria-expanded` が `true` で中身が `hidden` を持たない
      - 閉じた表の `details` が `open` を持つ
      - ファイルツリーの閉じたフォルダのボタンの `aria-expanded` が `false`
      - 2 つ目のタブの `aria-selected` が `true`
      - '`scrollY` がリンクを押したときの値（±1px）で、b.md へのリンクが画面に入っている'
      - localStorage に `mdmark-tabs:` で始まるキーが無い
    test: test_normal_when_back_restore_folds_and_tabs
    refs:
      - SC-472-13#scenarios[正常シナリオ（戻る・進むで開閉と選んだタブを戻す）]
  - name: 正常系（sessionStorage が使えない）
    summary: sessionStorage を取り出せないページでは、戻るで文書の頭から描き、例外を出さない
    setup:
      - name: 長い文書を持つフォルダ
        description: 正常系（戻る・進むで離れたときの位置に戻る）と同じ
      - name: Mock
        description: 開く前に `addInitScript` で `window.sessionStorage` を読むと `SecurityError` を投げるように差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant H as まとめた HTML
        participant S as sessionStorage
        U->>H: a.md をスクロールして b.md へのリンクを押す
        H->>S: 保存する（SecurityError）
        H-->>U: b.md の頭
        U->>H: 戻る
        H-->>U: a.md の頭
    expected:
      - 戻るで a.md が描かれ、`scrollY` が 0
      - '`pageerror` が 0 件で、`console.warn` に表示の状態を保存できなかった旨が出る'
    test: test_normal_when_session_storage_unavailable
    refs:
      - SC-472-13#scenarios[異常シナリオ（sessionStorage が使えない）]
  - name: 正常系（文書を切り替えると map のクエリ文字列を消す）
    summary: map のグループの中へ入った文書から文書の一覧で別の文書へ移ると、クエリ文字列の `map-*` を消し、移った先の図を全体から描く
    setup:
      - name: map を持つフォルダ
        description: '`entry` の `a.md` と `b.md` が、それぞれ構成図の map の範囲を 1 つ持つ（どちらもグループ `place` を持つ）'
      - name: Mock
        description: 正常系と同じ。sessionStorage は開く前に空にする
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant H as まとめた HTML
        U->>H: a.md の図の「配置」のタイトルを押す
        H-->>U: グループの中を描き、クエリ文字列に map-1=place
        U->>H: 文書の一覧で b.md を押す
        H-->>U: クエリ文字列の map-1 を消し、b.md の図を全体から描く
        U->>H: 戻る
        H-->>U: a.md の図を「配置」の中から描く
    expected:
      - b.md へ移った後の `location.search` に `map-` で始まるキーが無く、b.md の図の戻るボタンが押せない
      - 戻るで a.md に戻ると、a.md の図が「配置」の中から描かれる
      - '`map-` 以外のクエリ文字列のキーは変わらない'
    test: test_normal_when_switch_clears_map_query
    refs:
      - SC-472-39#scenarios
  - name: 正常系（map の設定）
    summary: 設定の `map` を埋める設定にコピーし、まとめた全ての文書の map の図を設定の種類と線で描く
    setup:
      - name: map の設定
        description: '`map.kinds` に `store`（`label: 保存先`・`icon: database`・`shape: rect`・`color: purple`）、`map.lines` に `-.->`（`dash: dashed`）、`map.node_fit: width` を持つ設定と、`entry` の `a.md` と `b.md` がそれぞれ `:::store` のノードを持つ map の範囲を 1 つ持つフォルダ'
      - name: Mock
        description: 正常系と同じ
    flow: "sequenceDiagram\n  actor W as 文書の作成者\n  participant C as mdmark CLI\n  participant H as まとめた HTML\n  W->>C: mdmark build\n  C->>H: map をコピーした設定を埋めて 1 枚の HTML を書き込む\n  W->>H: a.md を開き、文書の一覧で b.md へ移る\n  H-->>W: どちらの文書も設定の種類と線で map の図を描く"
    expected:
      - 終了コードが 0
      - a.md と b.md のどちらでも、`:::store` のノードの種類の行に `database` のアイコンと「保存先」がある
    test: test_normal_when_map_config
  - name: 正常系（mdmark を使用していることを隠す）
    summary: 隠さない書き出しを指定しないとき、インターフェース定義『文書をHTMLに書き出す』と同じく隠し、ファイル名に `mdmark` を含む文書へも行き来できる
    setup:
      - name: mdmark の名前を持つフォルダ
        description: インターフェース定義『文書をHTMLに書き出す』の正常系（mdmark を使用していることを隠す）のフォルダに、`mdmark-intro.md` からリンクされ `mdmark-intro.md` へ戻るリンクを持つ `guide.md` を加え、`build.include` が 2 つに該当する設定
      - name: Mock
        description: 同じ流れの Mock と同じ。比べる HTML は、同じフォルダを `--keep-traces` でまとめたもの
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build
        C->>C: 隠さない HTML を組み立て、名前を別名へ置き換え、コメント・バージョン・mdmark 自身のライセンスの表記を削除する
        C->>H: build.out を書き込む
        C-->>W: 書き出した: build.out（文書 2 件）・終了コード 0
    expected:
      - 終了コードが 0
      - インターフェース定義『文書をHTMLに書き出す』の正常系（mdmark を使用していることを隠す）の、HTML の文字列・埋め込みの JSON・埋め込みの Markdown・バージョン・ライセンスの表記の期待値を満たす
      - file:// で開くと、文書の一覧に 2 つのタイトルが並び、`#/mdmark-intro.md` で開ける
      - 本文のリンクで `guide.md` へ移り、戻るリンクと `history.back()` で `mdmark-intro.md` へ戻れる
      - 要素・別名を `mdmark` に戻した class・計算後のスタイルが、比べる HTML と本文のコードの例の中を除いて同じ
    test: test_normal_when_traces_hidden
  - name: 正常系（隠さない書き出しを指定する）
    summary: '`--keep-traces` のとき、名前を置き換えず、コメントとバージョンを残してまとめる'
    setup:
      - name: mdmark の名前を持つフォルダ
        description: 正常系（mdmark を使用していることを隠す）と同じ
      - name: Mock
        description: 正常系（mdmark を使用していることを隠す）と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark build --keep-traces
        C->>H: 隠さない HTML を書き込む
        C-->>W: 書き出した: build.out（文書 2 件）・終了コード 0
    expected:
      - 終了コードが 0
      - HTML に `class="mdmark"`・`:root{--mdmark-version:`・`id="mdmark-payload"` が残る
    test: test_normal_when_traces_kept
lead: 文書の作成者が設定の `build` で決めた文書を、参照・被参照・用語のツールチップが有効になり、文書を行き来できる 1 枚の HTML にまとめる。埋めるものと外へ要求しないことはインターフェース定義『文書をHTMLに書き出す』と同じ。
idempotent: true
side_effects: '`build.out` に HTML を書き込む（既にあれば上書きする）。文書が指す動画・音声を、`build.out` の隣の `_files/` のフォルダへコピーする。文書が使用する外部ライブラリの URL の先を読み込む。書き出した HTML を開いたページでは、`history.scrollRestoration` を `manual` にし、履歴の項目ごとの表示の状態を sessionStorage に記載する'
callers:
  - SC-472-76#
request:
  - name: --config
    type: string
    required: false
    default: 'なし（端末の設定と、今のフォルダから上のフォルダの `mdmark.config.yaml` を重ねる。インターフェース定義『設定を重ねて読み込む』を `purpose: export` で呼ぶ）'
    location: argument
    description: 使用する設定ファイルのパス
    notes: まとめる文書と書き出す先は設定の `build` が持つ
  - name: --keep-traces
    type: boolean
    required: false
    default: なし（制約「mdmark の痕跡」のとおり隠してまとめる）
    location: argument
    description: 開発のときに、mdmark の名前・HTML のコメント・バージョン・mdmark 自身のライセンスの表記を残してまとめる
    notes: 値を取らないフラグ
response:
  - name: 標準出力
    type: string
    description: '`書き出した: {build.out}（文書 {件数} 件）` の 1 行'
  - name: 標準エラー
    type: string
    description: '警告 1 つを 1 行（`警告: {ファイル}: {内容}`）で並べる'
    notes: インターフェース定義『文書をHTMLに書き出す』の警告に、まとめた HTML に含まれない文書へのリンク・`build.glossary` と `build.entry` がまとめる文書に該当しないことを追加する
  - name: 終了コード
    type: 0 | 1
    description: 書き出したら（警告があっても）0、書き出せなかったら 1
  - name: 出力の HTML
    type: ファイル
    description: インターフェース定義『文書をHTMLに書き出す』と同じものを埋め、文書はまとめる全ての文書をパスで参照できる構造で埋める。開くと、文書の一覧と、URL が指す文書（指していなければ `build.entry`）を描く
response_example: |-
  ```text
  書き出した: dist/docs.html（文書 3 件）
  ```

  ```text
  警告: README.md: `下書き/メモ.md` へのリンクはまとめた HTML に含まれません。記載したままのリンクで残します。まとめるなら `build.include` に追加してください。
  ```
exceptions:
  - name: なし（正常終了）
    condition: '`build.out` に HTML を書き込んだ（読み込めなかったものと 1 枚に含まれない文書へのリンクは警告に出す）。終了コード 0'
  - name: 設定ファイルの誤り（終了コード 1）
    condition: 設定ファイルが無い・読み込めない・Schema に合わない（空の設定ファイルを含む。重ねた設定ファイルのどれかでも同じ）、または重ねた設定に `build` が無い。`build` の glob と `build.out` は `build` を記載した設定ファイルのフォルダから適用する
    notes: 標準エラーに原因と修正方法の 1 文を出す
  - name: 対象の文書が 0 件（終了コード 1）
    condition: '`build.include` に該当し `build.exclude` に該当しない文書が 0 件'
    notes: 標準エラーに、対象が 0 件であることと `build.include` を修正することを出す。HTML は記載しない
  - name: 出力先へ書き込めない（終了コード 1）
    condition: '`build.out` か、動画・音声のコピー先の `_files/` へ書き込めない'
    notes: 標準エラーに書き込めなかったパスと修正方法を出す。HTML は記載しない
constraints:
  - item: まとめる文書
    constraint: '`build.include` の glob に該当し `build.exclude` に該当しない `.md` のファイル。並びは glob の並び、同じ glob の中はパスの順で、重なりは最初の 1 つだけを残す。文書のパスは設定ファイルのあるフォルダからの相対パス（区切りは `/`）'
    decided_by: CFG-472-3#settings[build.include]
  - item: 文書間のリンク
    constraint: まとめる文書への相対リンク（フロー図のノードのリンク先を含む）は、開いたとき 1 枚の中の文書へ移る。それ以外の文書への相対リンクは記載したままの `href` で残し、リンクを持つ文書とリンク先を警告に出す
    notes: 1 枚の中の文書を指す URL の記載方法は画面設計で決める
  - item: 参照の表
    constraint: 設定に `index` があるとき、索引と索引の `docs` の文書を `collectReferences` に指定して作った参照の表を埋め、索引にある文書はその `id` を `mount` の `docId` に指定する
    decided_by: IF-472-31#
  - item: 用語集の文書
    constraint: '`build.glossary` の文書の用語集の表の用語を、まとめた全ての文書で有効にしる（索引が無いときも）。まとめる文書に該当しないパスは飛ばして警告に出す'
    decided_by: CFG-472-3#settings[build.glossary]
  - item: 最初に開く文書
    constraint: '`build.entry`。無いかまとめる文書に該当しないときは、まとめる文書の最初の 1 つ（該当しないときは警告に出す）'
    decided_by: CFG-472-3#settings[build.entry]
  - item: 埋めるもの
    constraint: インターフェース定義『文書をHTMLに書き出す』と同じ。外部ライブラリ・部品・色分けの言語はまとめる文書のどれかが使用するものだけを、同じものは 1 つだけ、1 つのスクリプトにまとめて埋める。画像・動画・音声はそれぞれの文書のフォルダを基準に探し、無ければ `assets.root` で探す。複数の文書が指す同じ画像は 1 回だけ埋め、文書からは同じ埋めた画像を指す。動画・音声は `build.out` と同じフォルダの `{build.out のファイル名から拡張子を除いた名前}_files/` へ、同じファイルを 1 回だけ、HTML を書き込む前にコピーする
    decided_by: IF-472-33#
  - item: 外部への要求
    constraint: 開いてから、文書を移っても、ページ自身・`_files/` の下にコピーした動画と音声と画像の `data:` のほかへ要求しない
    decided_by: NFR-472-1#requirements[書き出した HTML の外部への要求]
  - item: 文書の数
    constraint: 制限なし
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
  - item: 取り込みとアイコン
    constraint: インターフェース定義『文書をHTMLに書き出す』の制約「埋める取り込み」「埋めるアイコン」と同じ。取り込む文書の表はまとめる文書ごとに、その文書のフォルダからのパスをキーにして作る。取り込み先が `build` の対象外のファイルでも、設定ファイルのフォルダの中なら読み込んで埋め、文書の一覧には出さない。同じファイルの本文と同じ名前のアイコンの形状は 1 回だけ埋める
  - item: 文書ごとのページの設定
    constraint: 文書の page のマーカーは各文書の本文に残して埋め、開いた文書を `mount`（`update`）で描くときにその文書のマーカーで明暗・テーマ・右側の目次の出し方をもう一度決める。マーカーを持たない文書は、埋めた設定の `colorScheme`・`colorTheme`・`side-toc.mode` で描く
    decided_by: IF-472-35#constraints[ページの設定のマーカー]
  - item: 埋める mermaid
    constraint: 文書をHTMLに書き出す.ts の制約「埋める mermaid」と同じ。まとめる文書のどれかに mermaid のコードブロックがあるときだけ、mermaid を 1 回埋める
    decided_by: NFR-472-1#requirements[mermaid を埋めた書き出しの HTML のサイズ]
  - item: 戻る・進む・再読み込みの表示の状態
    constraint: 書き出した HTML は開いたとき `history.scrollRestoration` を `manual` にし、履歴の項目ごとに、縦横のスクロール位置・本文の開閉（`<details>`・セクション・行の詳細・最終列の畳み・コードの行の畳み・ER 図の畳み・ファイルツリーのフォルダ・表のツリーと見本）・`group` の無いタブで選んだタブを保存する。保存するのは `popstate`・文書の一覧と文書間のリンクのクリック・`pagehide`・間引いたスクロールのとき。戻る・進む・再読み込みで保存した状態を持つ項目へ戻ったときは、文書を描いた後に開閉とタブを戻してから位置を戻す。保存した状態を持たない項目（文書の一覧・文書間のリンクで新しく移った項目）は、今どおり見出しか文書の頭から描く
    notes: 表のメニュー・ドロワー・絞り込み、右側の目次、差分のパネル、コメントの吹き出しは戻さない。位置は URL に出さない
  - item: 表示の状態の保存先
    constraint: sessionStorage。キーは履歴の項目ごとに振る ID（`history.state` に持たせる）を含む。sessionStorage を取り出せない・書き込めないときは `console.warn` に出し、保存した状態を持たない項目と同じく描く
    decided_by: SC-472-13#scenarios[異常シナリオ（sessionStorage が使えない）]
  - item: map のクエリ文字列
    constraint: 文書の一覧と文書間のリンクで別の文書へ移るときは、クエリ文字列から `map-` で始まるキーを消してから移る。戻る・進む・再読み込みでは消さず、移った先の文書の map の図は sessionStorage の状態で描く
    decided_by: IF-472-35#constraints[map の状態の保存]
  - item: map の設定
    constraint: 文書をHTMLに書き出す.ts の制約「map の設定」と同じ
    decided_by: IF-472-33#constraints[map の設定]
  - item: mdmark の痕跡
    constraint: 文書をHTMLに書き出す.ts の制約「mdmark の痕跡」と同じ。まとめる全ての文書の本文・取り込む文書の表に同じ規則を当て、文書のパスと文書間のリンクの `href` は置き換えない
    decided_by: IF-472-33#constraints[mdmark の痕跡]
