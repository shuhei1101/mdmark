id: IF-472-11
visibility: internal
title: 端末の状態を調べる
entry:
  kind: operation
  value: '`node ${CLAUDE_PLUGIN_ROOT}/bin/setup.js status`（スキルが Bash で呼ぶ）'
flows:
  - name: 正常系
    summary: 空の端末で、端末の設定が無いこと・既定のセッション名・待ち受けていないことを返却する
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: 空いたポート
        description: '`MDMARK_PORT` に待ち受けるプロセスの無いポート'
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: status
        P->>P: 端末の設定のパス・tmux・ポートを確認する
        P-->>K: JSON の 1 行・終了コード 0
    expected:
      - 終了コードが 0
      - '`settings.path` が `MDMARK_CONFIG`、`settings.exists` が `false`、`settings.default_path` が `false`'
      - '`server.session` が `mdmark-mcp`、`server.listening` が `false`、`tmux.available` が `true`'
      - '`launcher.setting` が `auto`、`server.unit` が `mdmark-mcp`、`server.unit_path` が `~/.config/systemd/user/mdmark-mcp.service`'
      - '`systemd.available` が、`systemctl --user is-system-running` の標準出力が `running`・`degraded`・`starting` のどれかのときに `true`。`launcher.resolved` は `systemd.available` が `true` なら `systemd`、ほかは `tmux`'
      - '`state.log` が `MDMARK_STATE_DIR` の下の `serve.log`'
    test: test_normal
  - name: 正常系（セットアップ済み）
    summary: 端末の設定のバージョン・セッション名・待ち受けていることを返却する
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: セットアップ済みの端末
        description: '`version` と `serve.tmuxSession: mdmark-test` を持つ端末の設定と、そのセッション名の tmux のセッションで待ち受けている常駐サーバー'
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: status
        P-->>K: JSON の 1 行・終了コード 0
    expected:
      - '`settings.exists` が `true`、`settings.version` が端末の設定の `version`、`settings.target_version` がプラグインのビルドで埋めた mdmark のバージョン'
      - '`server.session` が `mdmark-test`、`server.session_exists` と `server.listening` が `true`'
    test: test_normal_when_already_set_up
  - name: 正常系（systemd --user が使えない）
    summary: '`PATH` に `systemctl` が無いことと、`auto` が tmux になることを返却する'
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: systemctl の無い PATH
        description: '`PATH` から `systemctl` を削除する'
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: status
        P-->>K: systemd.available: false・終了コード 0
    expected:
      - 終了コードが 0
      - '`systemd.available` が `false`、`launcher.resolved` が `tmux`、`server.unit_active` と `server.unit_enabled` が `false`'
    test: test_normal_when_systemd_unavailable
  - name: 正常系（tmux が無い）
    summary: '`PATH` に tmux が無いことを返却する'
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: tmux の無い PATH
        description: '`PATH` から tmux を削除する'
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: status
        P-->>K: tmux.available: false・終了コード 0
    expected:
      - 終了コードが 0
      - '`tmux.available` が `false`、`server.session_exists` が `false`'
    test: test_normal_when_tmux_missing
  - name: 異常系（端末の設定を読み込めない・終了コード 1）
    summary: 端末の設定が YAML として読み込めないとき、パスと行を出して終わる
    setup:
      - name: 一時の端末
        description: '`MDMARK_CONFIG`・`MDMARK_STATE_DIR`・`CLAUDE_CONFIG_DIR`・`TMUX_TMPDIR` を、それぞれ空の一時フォルダの下にする'
      - name: 読み込めない端末の設定
        description: '`MDMARK_CONFIG` のパスに、3 行目が YAML として読み込めない端末の設定を配置する'
      - name: Mock
        description: ビルドした `plugin/bin/setup.js` を子プロセスで実行する。差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant K as スキル（global-setup・setup）
        participant P as setup.js
        K->>P: status
        P-->>K: パスと行・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに端末の設定のパスと 3 行目が出る
    test: test_error_when_settings_unreadable
lead: '`global-setup` と `setup` が最初に呼び、端末の設定のパスとバージョン・起動の方法・unit の名前と tmux のセッション名・常駐サーバーが待ち受けているか・ログの場所を返却する。何も書き換えない。'
test_file: tests/integration/ClaudeCodeプラグイン/setup-status.test.ts
idempotent: true
side_effects: なし
callers:
  - SC-472-69#
  - SC-472-53#
request:
  - name: MDMARK_CONFIG
    type: string
    required: false
    default: なし（`${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml`）
    location: argument
    description: 端末の設定のパス（環境変数）
  - name: MDMARK_PORT
    type: string
    required: false
    default: '8782'
    location: argument
    description: 常駐サーバーのポート（環境変数）
  - name: MDMARK_STATE_DIR
    type: string
    required: false
    default: なし（`${XDG_STATE_HOME:-~/.local/state}/mdmark`）
    location: argument
    description: 状態の配置場所（環境変数）
response:
  - name: settings.path
    type: string
    description: 端末の設定の絶対パス
  - name: settings.default_path
    type: boolean
    description: '`MDMARK_CONFIG` が無いか、既定のパスと同じ'
  - name: settings.exists
    type: boolean
    description: 端末の設定のファイルがある
  - name: settings.version
    type: string | null
    description: 端末の設定の `version`。ファイルか `version` が無ければ `null`
  - name: settings.target_version
    type: string
    description: プラグインのビルドで埋めた mdmark のバージョン（ビルドのときの `version.ini` か `--version` の値）。移行の目標になる
  - name: server.port
    type: number
    description: 常駐サーバーのポート
  - name: server.session
    type: string
    description: tmux のセッション名（端末の設定の `serve.tmuxSession`、無ければ `mdmark-mcp`）
  - name: server.session_exists
    type: boolean
    description: そのセッション名の tmux のセッションがある
  - name: server.listening
    type: boolean
    description: '`127.0.0.1` のポートが接続を受ける'
  - name: tmux.available
    type: boolean
    description: '`PATH` に tmux がある'
  - name: systemd.available
    type: boolean
    description: systemd --user が使える（`PATH` に `systemctl` があり、`systemctl --user is-system-running` の標準出力が `running`・`degraded`・`starting` のどれか）
  - name: launcher.setting
    type: '"auto" | "systemd" | "tmux"'
    description: 端末の設定の `serve.launcher`、無ければ `auto`
  - name: launcher.resolved
    type: '"systemd" | "tmux"'
    description: '`start-server` が使用する起動の方法。`auto` は `systemd.available` が `true` なら `systemd`、ほかは `tmux`'
  - name: server.unit
    type: string
    description: unit の名前（端末の設定の `serve.systemdUnit`、無ければ `mdmark-mcp`）
  - name: server.unit_path
    type: string
    description: unit のファイルのパス（`${XDG_CONFIG_HOME:-~/.config}/systemd/user/{unit の名前}.service`）
  - name: server.unit_active
    type: boolean
    description: '`systemctl --user is-active` が `active`。systemd --user が使えなければ `false`'
  - name: server.unit_enabled
    type: boolean
    description: '`systemctl --user is-enabled` が `enabled`。systemd --user が使えなければ `false`'
  - name: state.dir
    type: string
    description: 状態の配置場所
  - name: state.log
    type: string
    description: 常駐サーバーのログのパス（`{state.dir}/serve.log`）
exceptions:
  - name: なし（正常終了）
    condition: 状態を返却した。終了コード 0
  - name: なし（端末の設定を読み込めない・終了コード 1）
    condition: 端末の設定が YAML として読み込めない
constraints:
  - item: ポートの確認
    constraint: '`127.0.0.1:{ポート}` へ TCP でつなぎ、接続を受けたら待ち受けているとする。待ちは 1 秒'
  - item: systemd --user の確認
    constraint: '`systemctl --user is-system-running` の標準出力で判定し、終了コードは見ない（`degraded` でも 0 以外になる）'
    decided_by: LIB-472-25#catalogs
  - item: セッションの確認
    constraint: '`tmux has-session -t ={セッション名}` の終了コード 0 をセッションがあるとする'
  - item: 出力
    constraint: 結果は標準出力に JSON の 1 行で出す。誤りは標準エラーに理由と修正方法を出す
  - item: 動く Node のバージョン
    constraint: Node 24 以降
    decided_by: NFR-472-1#requirements[CLI が動く Node のバージョン]
