id: CMD-472-1
visibility: internal
title: 開発コマンド
categories:
  - name: 環境構築（クローン直後）
    prerequisites:
      - Node.js v24
      - 取り込み後の追従（pull 後）の `npm ci` を実行してある
    commands: |-
      結合テストが使用する Chromium を入れる。

      ```bash
      npx playwright install chromium
      ```
    effects: '`~/.cache/ms-playwright` に Chromium（数百 MB）をダウンロードする。一度入れれば、どの作業ツリーからも使用できる'
    verification:
      state: 済
      date: '2026-10-13'
      detail: コマンドが終了コード 0 で終わり、続けて `npm run test:integration` のブラウザテストが通ることを確認した
  - name: 取り込み後の追従（pull 後）
    prerequisites:
      - Node.js v24
    commands: |-
      ```bash
      npm ci
      ```

      ESLint の道具（`tools/eslint/package-lock.json`）が変わった取り込みの後は、その依存ももう一度入れる。

      ```bash
      npm ci --prefix tools/eslint
      ```

      VS Code 拡張機能を触るときは、`vscode/` の依存も入れる。

      ```bash
      npm --prefix vscode ci
      ```
    effects: '`node_modules/` を `package-lock.json` のとおりに再作成する。`.git/hooks` に Git フックを入れない。`npm ci --prefix tools/eslint` は `tools/eslint/node_modules/` を再作成する（無いままでも `npm run lint:eslint` が起動の前に入れる）'
    verification:
      state: 済
      date: '2026-11-08'
      detail: 'lefthook を除いた作業ツリーで `npm ci` を実行し、終了コード 0 で終わり、`.git/hooks` の pre-commit・pre-push の更新時刻が変わらず、`node_modules/` に lefthook が入らないことを確認した。`tools/eslint/node_modules/` が無いまま `npm run lint:eslint` を実行し、`npm ci --prefix tools/eslint` で入れてから ESLint が終了コード 0 で終わることを確認した。`npm --prefix vscode ci` も終了コード 0 で終わった'
  - name: 依存の追加・更新・削除
    commands: |-
      バージョンを完全一致で固定して追加・更新する。

      ```bash
      npm i -D -E {パッケージ}@{バージョン}
      ```

      削除する。

      ```bash
      npm uninstall {パッケージ}
      ```
    effects: '`package.json` と `package-lock.json` を書き換える'
    verification:
      state: 済
      date: '2026-10-13'
      detail: 追加は vitest・esbuild・typescript・@biomejs/biome・@types/node で、削除するのは作業ツリーの記録で `@types/node` を削除し、`package.json` から消えることを確認した
  - name: 起動・停止
    prerequisites:
      - '`npm ci` で依存を入れてある'
    commands: |-
      Storybook で部品を確認する。

      1. 描画のインターフェースを起動する（`Ctrl+C` で止める）

      ```bash
      RENDER_PORT={描画のインターフェースのポート} npm run storybook:render
      ```

      2. 別の端末で Storybook を起動する（`Ctrl+C` で止める）

      ```bash
      RENDER_ORIGIN=http://127.0.0.1:{描画のインターフェースのポート} npm run storybook -- --host 127.0.0.1 --exact-port -p {ポート}
      ```

      手元のプラグインを Claude Code で確認する。

      1. ビルドする（`dist/cli.js` と、`plugin/` にフックが書き込まれる）

      ```bash
      npm run build
      ```

      2. MCP の常駐サーバーを起動する（`Ctrl+C` で止める。別のポートにするときは `~/.claude/settings.json` の `env` にも同じ `MDMARK_PORT` を配置する）

      ```bash
      node dist/cli.js serve
      ```

      3. 別の端末で作業ツリーをマーケットプレイスとして追加し、プラグインを入れる

      ```bash
      claude plugin marketplace add {作業ツリーの絶対パス}
      claude plugin install mdmark@mdmark
      ```

      4. 確認し終えたらプラグインとマーケットプレイスを削除する

      ```bash
      claude plugin uninstall mdmark@mdmark
      claude plugin marketplace remove mdmark
      ```
    verification:
      state: 済
      date: '2026-10-26'
      detail: 'Storybook の分は 2026-11-06 に react-vite でもう一度確認した（描画のインターフェースと `RENDER_ORIGIN` を指定した `storybook dev` を起動し、`/index.json` の 446 個のストーリーが Playwright でエラー無く描かれた。`kill` で止めると待受が閉じた）。2026-10-16 にも確認した（`RENDER_PORT=46601 npm run storybook:render` と `RENDER_ORIGIN=http://127.0.0.1:46601 npm run storybook -- --host 127.0.0.1 --exact-port -p 46602` を起動し、`/index.json` に 57 個のストーリー（13 個の部品）が載ることを確認した。Playwright で開いた `iframe.html?id=` の 57 個のストーリーが、`#storybook-root` にエラー無く描かれた。`kill` で止めると待受が閉じた）。プラグインの分は 2026-10-26 に確認した（`npm run build` が終了コード 0 で `dist/cli.js` と `plugin/scripts/`・`plugin/guide/` を書き込み、`MDMARK_PORT=18801 node dist/cli.js serve` が `MCP サーバーを起動しました: http://127.0.0.1:18801/mcp` を出した。空の `CLAUDE_CONFIG_DIR` で `claude plugin marketplace add {作業ツリーの絶対パス}` と `claude plugin install mdmark@mdmark` が成功し、`MDMARK_PORT=18801` を指定した `claude mcp list` が `plugin:mdmark:mdmark: http://127.0.0.1:18801/mcp (HTTP) - ✔ Connected` を出した。`kill -TERM` で止めるとプロセスが終わり、`claude plugin uninstall mdmark@mdmark` と `claude plugin marketplace remove mdmark` で削除された）'
    effects: プラグインの確認は、手元の Claude Code の設定にマーケットプレイスとプラグインを記載し、常駐サーバーは `127.0.0.1` の `MDMARK_PORT`（既定 8782）を待ち受ける。削除するコマンドで戻す。設定を書き換えたくないときは、`CLAUDE_CONFIG_DIR` に空のフォルダを指して実行する
  - name: テスト
    refs:
      - TP-472-1#
  - name: 静的検査
    refs:
      - TP-472-1#layers[lint]
  - name: ビルド・生成
    prerequisites:
      - '`npm ci` で依存を入れてある'
      - 移行の手順の点検に git のバージョンのタグが要る（`git fetch --tags`）。タグが無い clone、git の作業ツリーでないフォルダでは、スキーマの比較を飛ばす
    commands: |-
      `version.ini` のバージョンを埋めて `dist/` に配布物を書き込む。

      ```bash
      npm run build
      ```

      指定したバージョンを埋めて記載する。

      ```bash
      npm run build -- --version v{バージョン}
      ```

      VS Code 拡張機能を `vscode/dist/extension.cjs`・`vscode/media/preview.js`・`vscode/media/preview.css` にビルドし、型を検査する。

      ```bash
      npm --prefix vscode run build
      npm --prefix vscode run typecheck
      ```

      `vscode/mdmark-{バージョン}.vsix` を作る（`vscode:prepublish` でビルドも流れる）。

      ```bash
      npm --prefix vscode run package
      ```

      mermaid の図のストーリーの見本の SVG を `tests/fixtures/mermaid-svg/` に書き込む（mermaid のバージョンを変えたときに実行し、書き込んだファイルを commit する。`npx playwright install chromium` で Chromium を入れてある）。

      ```bash
      npm run fixtures:mermaid
      ```
    effects: '`npm run fixtures:mermaid` は `tests/fixtures/mermaid-svg/` の 9 つの SVG を上書きする。`dist/` を前回の分を削除してからもう一度書き込む。`index.js`・`index.css`・`THIRD_PARTY_LICENSES.txt`・ CLI の `cli.js`・書き出した HTML に埋める `viewer.js`・`viewer.css` のほかに、`tsconfig.dist.json` で `tsc` を実行して型定義（`index.d.ts` と、それが読み込む `.d.ts`）を記載する。`migrations/` の中の `marker-json.mjs` を持つフォルダの `legacy-marks.js` と、それにまとめた依存の `THIRD_PARTY_LICENSES.txt` も書き換える（移行の手順と一緒に commit する）。バージョンの書式が違う・`version.ini` を読み込めない・設定・索引の JSON Schema（`schemas/`）を最新のバージョンのタグから変えたのに移行の手順（`migrations/next/steps.yaml`）も手順なしの一覧（`migrations/no-steps.yaml`）の合う行も無い・release のビルドで `migrations/next/` が残っている・移行の手順の構造が合わない・esbuild か `tsc` が失敗する・`index.js`・`index.css` が 672KB を超える・`viewer.js` が `</script` の並びを持つ・利用側のブラウザが読み込む JS（`index.js`・`view.js`・`comments.js`・`map.js`・`viewer.js`）が対応ブラウザの下限（Chrome 99・Firefox 98・Safari 16.4）に無い API を、同じ API の `typeof` で確認する `if` のブロックの外で使用すると、終了コード 1 で終わり `dist/` は残らない。下限に無い API で止まったときは、標準エラーの API を `if (typeof {API} !== "undefined")` のブロックの中で使用する構造に修正する（早期 return の後ろと三項演算子では使用しない）。続けて Claude Code プラグインの生成物（`plugin/scripts/`・`plugin/THIRD_PARTY_LICENSES.txt`）も前回の分を削除して記載し、ガイドの索引（`guide/index.yaml`）の構造・指すページ、取り込まれたパッケージのライセンスの本文（`scripts/licenses/`）に問題があると、終了コード 1 で終わり `dist/` も `plugin/` の生成物も残らない'
    verification:
      state: 済
      date: '2026-10-24'
      detail: '`npm run build` が終了コード 0 で終わり、`dist/` に `index.js`・`index.css`・`THIRD_PARTY_LICENSES.txt`・`cli.js` と型定義が書き込まれることを確認した。スキーマをタグ v0.3.0 から変えたのに `migrations/no-steps.yaml` の合う行が無いと終了コード 1 で `dist/` が残らず、行を配置すると通ること、`--version v0.4.0` のビルドで `migrations/next/` が残ると終了コード 1 で終わることを確認した。`--version` の指定と、バージョンの書式の誤り・`version.ini` の欠け・esbuild の失敗・上限超過のとき `dist/` が残らないこと、型定義が `--moduleResolution bundler` と `nodenext` の利用側で型検査を通ること、移行の手順の点検の分岐は、単体テストで確認した。2026-10-23 に、`npm run build` が終了コード 0 で `plugin/` の生成物を記載することを確認した。`plugin/` の失敗の分岐は単体テストで確認した。VS Code 拡張機能のコマンドは `vscode/` を実装して走らせた（2026-10-23）。`npm --prefix vscode run build` が終了コード 0 で終わり、`vscode/dist/extension.cjs`（`require("vscode")` を持つ）・`vscode/media/preview.js`・`vscode/media/preview.css` が書き込まれ、`npm --prefix vscode run typecheck` が終了コード 0 で通る。`npm --prefix vscode run package` が `vscode:prepublish` のビルドも実行して `vscode/mdmark-0.1.0.vsix`（`package.json`・`readme.md`・`dist/extension.cjs`・`media/preview.css`・`media/preview.js` の 7 ファイル、73KB。`src/`・`node_modules/` を含まない）を記載する。LICENSE が無いと `vsce` が警告を出すが、終了コードは 0。2026-10-24 に、対応ブラウザの下限の確認を追加した `npm run build` が終了コード 0 で通ること、下限に無い API を確認せずに使用すると終了コード 1 で `dist/` が残らず標準エラーに配布ファイル・行・列・報告の文が出ることを、単体テストで確認した。2026-11-08 に、`npm run fixtures:mermaid` が終了コード 0 で `tests/fixtures/mermaid-svg/` に 9 つの SVG（暗い配色の flowchart は明るい配色と塗りの色が違い、sequence は actor が `svg.mdmark-mermaid-actor`）を書き込み、書き込んだパスを標準出力に出すことを確認した'
  - name: 取り込み前の検査
    commands: |-
      手で全件を検査する（Biome・ESLint・ルートと `vscode/` の型検査を順に実行し、最初の失敗で止まる）。

      ```bash
      npm run check
      ```
    prerequisites:
      - '`npm ci` で依存を入れてある'
    effects: 検査だけで、ファイルを書き換えない
    verification:
      state: 済
      date: '2026-11-06'
      detail: '`npm run check` が終了コード 0 で終わった（ESLint は Webview の 30 ファイルだけを検査した）'
  - name: 管理作業
    prerequisites:
      - タグを打つ担当（tester）が、スプリントの区切りに develop の worktree で実行する（release を切るときは master へマージする前に release の worktree で、hotfix は hotfix の worktree で実行する）
      - develop と release は `version.ini` を打つバージョンへ更新した後、hotfix は打つバージョンを決めた後
    commands: |-
      1. 依存を lock どおりに入れる

      ```bash
      npm ci
      ```

      2. 出していないバージョンの移行の手順を打つバージョンへ移し、`migrations/no-steps.yaml` の `version: next` を打つバージョンに書き換えて commit する（`migrations/next/` が無ければ `git mv` を、`version: next` の行が無ければ `sed` を飛ばす。どちらも無ければ手順ごと飛ばす）

      ```bash
      git mv migrations/next migrations/v{バージョン}
      sed -i 's/version: next$/version: v{バージョン}/' migrations/no-steps.yaml
      git add migrations
      git commit -m "chore: 移行の手順を v{バージョン} へ移す"
      ```

      3. 打つバージョンを埋めてビルドする

      ```bash
      npm run build -- --version v{バージョン}
      ```

      4. `dist/` と `plugin/` に差分があるかを確認する（出力が空なら手順 5 を飛ばす）

      ```bash
      git status --porcelain dist plugin
      ```

      5. `dist/` と `plugin/` を commit して対象のブランチへ push する

      ```bash
      git add dist plugin
      git commit -m "v{バージョン} の配布物を入れる"
      git push origin {対象のブランチ}
      ```

      6. develop のときは、今の HEAD（手順 5 の commit。手順 5 を飛ばしたときは手順 2 の commit か、それも飛ばしたときは push 済みの HEAD）に mdmark のタグを打って push する（手順 2 の commit を push していなければ、先に `git push origin develop` を実行する）。release と hotfix のタグは、master へマージした後にマージの手順で打つ

      ```bash
      git tag v{バージョン}
      git push origin v{バージョン}
      ```

      VS Code 拡張機能を出すときは、`vscode/package.json` の `version` を出すバージョンにした commit が develop に入った後、その commit でタグと `version` を照合してからタグを打つ（GitHub Actions の `vscode-release.yml` が .vsix を作り、そのタグの GitHub Release に添えて、Visual Studio Marketplace へ公開する）。`version` は Marketplace に公開済みのバージョンより上にする（同じバージョンは公開できず、ワークフローが `already exists.` で失敗する）。mdmark の `v{バージョン}` のタグと混ぜない。

      ```bash
      npm --prefix vscode run release:check -- vscode-v{バージョン}
      git tag vscode-v{バージョン}
      git push origin vscode-v{バージョン}
      ```
    effects: 対象のブランチへ `dist/` と `plugin/` の commit を push する。どちらも変わらなければ commit は要らない。develop では `v{バージョン}` のタグも push し、jsDelivr の `@v{バージョン}` と `npx github:shuhei1101/mdmark#v{バージョン}` がその commit を指す。`vscode-v{バージョン}` のタグの push は、Release に .vsix を添え、Marketplace の `ShuheiNishikawa.mdmark-vscode` にそのバージョンを公開する（公開したバージョンは上書きできない）
    verification:
      state: 未確認
      detail: 手順 1・2・3・4（`npm ci`、移行の手順の移し、`npm run build -- --version v{バージョン}`、`git status --porcelain dist` が `dist/` の差分を出す）は、一時の clone で `--version v0.4.0` を使用して確認した。`migrations/next/` が無いときは `git mv` が失敗するので飛ばし、`sed` 以降でビルドが通る。`plugin/` を追加した手順 4・5 は、`npm run build` が `plugin/` の生成物を記載することまでを確認した。手順 5 は対象のブランチへ push して外へ書き込むため走らせていない。VS Code 拡張機能のタグの照合（`npm --prefix vscode run release:check -- vscode-v0.1.0`）は、`package.json` の `version` が `0.1.0` のとき終了コード 0 で通り、`vscode-v0.2.0` のときは両方のバージョンを標準エラーに出して終了コード 1 で止まることを確認した。タグの push は外へ書き込むため走らせていない
