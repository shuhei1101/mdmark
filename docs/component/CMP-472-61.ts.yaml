    <!-- /flow -->

    - ※1 長文の列: 本文のセルが数値・日付・✓・バッジ・行内のコードだけの列でなく、見出しか本文のセルを改行（`<br>`・リストの項目・段落）で分けた 1 行が、20 文字（`LONG_CHARS`）以上の列。`render` が判定して `data-long` に写す。20 文字は、モックの表で名前・短い説明の列を折り返さず、文の列だけを折り返す数
    - ※2 最も長い半角の単語: 空白で区切った半角の英数字・記号の連なりで、途中で折り返せない幅。全角の文字はどこでも折り返せるので数えない。望む幅は最も長い行の幅を `width.max` で抑えた幅
    - ※3 望む幅: 折り返さない列は最も長い行の幅、折り返す列は最も長い行の幅（`width.max` で抑え、最小の幅を下回らない）。最小の幅は `width.max` を超えない
    - ※4 分け方: 表の見える幅から折り返さない列の幅を引いた残りを、折り返す列へ望む幅の比で分ける。最小の幅を下回る列は最小の幅で止め、止めた列を除いた残りの幅をほかの列へ分け直し、止める列が出なくなるまで繰り返す
    - ※5 `width.max` との関係: 最小の幅（`width.min`、無ければ長文の列と同じ値）が `width.max` より広いときは、最小の幅を `width.max` にする。`width.min` と `width.max` の両方を記載して `min` が `max` より大きいときも同じく `width.max` を優先し、記載の警告にしない
    - 幅の測り方: 最も長い行の幅は、セルの中に `white-space: nowrap` の見えない要素を置いて行の文字を入れ、`getBoundingClientRect().width` に、セルの左右の余白と枠線の幅と端数の 2px を足して切り上げる。列ごとに切り上げる分（1 列 1px）を表の見える幅から引いてから分ける
    - 行の数が多い表は、先頭から 200 行（`MEASURE_ROWS`）までを測る
    - モックは `docs/mock/pages/document/505/a-auto-width/` と `docs/mock/refs/505/assets/table-width.js`
  階層の表: '`tree` の表は `<div class="mdmark-table" data-tree>` で、本文の行が `<tr class="mdmark-tree-row" data-path data-parent data-depth aria-selected>`（補った行は `is-virtual`、子を持つ行は `has-children`）。キーのセルは `<td class="mdmark-tree-key"><span class="mdmark-tree-cell">` に、深さの数の `mdmark-tree-guide`（選んだ範囲は `is-active`）・子を持つ行は `<button class="mdmark-tree-toggle" aria-expanded aria-label>`、持たない行は `mdmark-tree-spacer`・`<span class="mdmark-tree-name" tabindex="0">`・`mdmark-tree-array`・`mdmark-tree-required`・`<button class="mdmark-tree-copy" aria-label="全体のパスをコピー">` を並べる。型は `mdmark-type-badge`（`data-type`）か `mdmark-type-chip`、既定は `mdmark-tree-default`、絞り込みで該当した単語は `mark.mdmark-tree-hit`。見本を結んだ表は `<div class="mdmark-tree-bar"><button class="mdmark-tree-example-toggle" aria-expanded aria-controls>`と、`<div class="mdmark-tree-layout">`（隠したとき `is-example-hidden`）の中に表と `<aside class="mdmark-tree-example">` を配置し、見本の行は `<span class="mdmark-yaml-line" data-path>`（表で選んだ行と同じパスは `is-linked`）。モックは `docs/mock/components/table/` の `#state-303-*`。印刷では開閉・コピー・見本の表示の切り替えのボタンを出さない'
