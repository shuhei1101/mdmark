      - name: autoWidths
        value: '[{"column":0,"width":82},{"column":1,"width":1063}]'
  - name: PinnedEach
    description: '`pinMode: each` で、1 列目と 3 列目だけを留めた。1・3 列目のボタンが押され、1・3 列目のセルが留まる。各列の `left`・`right` と、左端に留まった最も右の列の右・右端に留まった最も左の列の左の境の線は、列の幅と横のスクロールから `mount` が入れる'
    args:
