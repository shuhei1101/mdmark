  - name: PinnedUnderMergedHeader
    description: '`pinMode: each` で、2 行の見出しの `設定` の下の `既定` だけを名前と一緒に留めた。1 行目の `設定` のセルは、またぐ列が全て留まっていないので留めない'
    args:
