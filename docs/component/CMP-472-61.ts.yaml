        value: '["sort","pin","filter","resize"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くするために、見出しの列ごとの幅を描いた後に一度だけ測る","2026-10-01"],["みかん","印刷を修正する","2026-10-10"]]'
  - name: ResizeDragging
    description: 名前の列のつまみをドラッグしている。つまみの線を出したままにする
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","resize"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くするために、見出しの列ごとの幅を描いた後に一度だけ測る","2026-10-01"],["みかん","印刷を修正する","2026-10-10"]]'
      - name: resizing
        value: '0'
  - name: ColumnResized
    description: 名前の列の幅を 200px に指定した。ほかの列の幅は描いた直後のまま
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","resize"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くするために、見出しの列ごとの幅を描いた後に一度だけ測る","2026-10-01"],["みかん","印刷を修正する","2026-10-10"]]'
      - name: widths
        value: '[{"column":0,"width":200}]'
  - name: WideResized
    description: '`width.mode` が `nowrap` の説明の列を列の最小幅まで狭めた。幅を指定した `nowrap` の列は折り返す'
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","resize"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くするために、見出しの列ごとの幅を描いた後に一度だけ測る","2026-10-01"],["みかん","印刷を修正する","2026-10-10"]]'
      - name: wide
        value: '[1]'
      - name: widths
        value: '[{"column":1,"width":110}]'
lead: Markdown の表を囲み、多段の見出し・行見出し・縦に結合したセルを描き、種類と `+機能`・`-機能` で決まった並べ替え・ピン止め・絞り込みのボタンと、絞り込みのドロワーを付ける。見出し行は面の色で分け、表が画面に残っている間はページを縦にスクロールしても画面の上端に留め、集計の行を画面の下端に留める。列ごとに中身の量から折り返すかと列の幅を決め、全ての列の最小の幅が収まらない表は表の中で横にスクロールさせる。
args:
  - name: kind
    type: 列挙
    required: false
    default: default
    choices: '`default`（ピン止め）・`data`（並べ替え・ピン止め・絞り込み）・`plain`（機能なし。縦の罫線と面を削除する）'
    description: 表の種類。`data-kind` に入れる
  - name: features
    type: 配列
    required: true
    description: 付ける機能（`sort`・`pin`・`filter`・`resize`・`count`・`columns`・`total`・`copy`・`rowlink` のうち）。種類の機能に `+機能`・`-機能` を適用したもの。`data-features` に空白で結んで入れる
  - name: columns
    type: 配列
    required: true
    description: 列の見出しの HTML
  - name: rows
    type: 配列
    required: true
    description: 行ごとのセルの HTML の配列
  - name: filters
    type: オブジェクトの配列
    required: false
    default: '[]'
    enabled_when: '`features` に `filter` を含むとき'
    description: 絞り込みを付ける列（`{ column, kind }`。`kind` は `select`・`text`・`date`）。この列の見出しにだけ絞り込みのボタンとドロワーを配置する。`filter.type` を省いた列の `kind` は、`long` の列なら `text`、ほかは `select`
  - name: collapse
    type: 列挙
    required: false
    default: none
    choices: '`none`・`closed`・`open`'
    description: 表を折り畳みに入れるかと、既定の開閉
  - name: sort
    type: オブジェクト
    required: false
    default: なし（元の並び）
    enabled_when: '`features` に `sort` を含むとき'
    description: 並べ替えた列と向き（`{ column, direction }`。`direction` は `ascending`・`descending`）
  - name: overflow
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`features` に `pin` を含むとき'
    description: 表が幅からはみ出しているか。`true` のときだけピン止めのボタンを出す（`mount` が幅を測って決める）
  - name: pinned
    type: 整数の配列
    required: false
    default: '`[]`'
    enabled_when: '`overflow` が `true` のとき'
    description: 留める列の位置（小さい順。空は留めない）。`pinMode` が `each` なら列ごとに、その列より左で留めた列の幅の合計を `left`、右で留めた列の幅の合計を `right` に入れて留め、`through` なら先頭から最も右の列までを左端に留める。`rowHeader` を持つ表で省いたときは行見出しの全ての列。`mount` は描いた直後に `data-pin` の列（無ければ行見出しの列、行見出しも無ければ先頭の列。`through` はその最も右の列まで）にする
  - name: headRows
    type: 配列
    required: false
    default: '[]'
    description: 見出しが 2 段以上のときの行ごとのセル（`{ html, column, rowspan, colspan }`）の配列。`columns` は列ごとの名前（その列を最も下で覆う見出しの文字）にする。並べ替え・ピン止め・絞り込みのボタンは、最下段まで届き 1 列だけを覆うセルにだけ配置する。`colspan` を持つセルは `scope="colgroup"` で、またぐ列の中央に配置する
  - name: rowHeader
    type: 整数
    required: false
    default: '0'
    description: 本文の各行の先頭からこの数の列のセルを `<th scope="row">` にし、見出しと同じ太さ（600）で左に配置する
  - name: mergeColumns
    type: 配列
    required: false
    default: '[]'
    description: '`^^` で縦に結合する列の位置（`data-merge-columns`）。表示している行の隣り合う同じ値のセルを結合し（左の結合する列の切れ目でも切る）、始まりのセルに `rowspan` と `is-merged`（上寄せ）、続くセルに `hidden` を付ける。並べ替え・絞り込みのたびにもう一度結合する'
  - name: pin
    type: 整数の配列
    required: false
    default: なし（`data-pin` を持たない）
    enabled_when: '`features` に `pin` を含むとき'
    description: '`pin=` で記載した列の位置（小さい順）。囲みの `data-pin` に半角の空白で区切って写す'
  - name: wide
    type: 配列
    required: false
    default: '[]'
    description: 広く取る列の位置（`width.mode` が `nowrap` の列）。列の `th`・`td` に class `mdmark-wide` を付け、セルを折り返さずに値の長さの幅を取る
  - name: check
    type: 配列
    required: false
    default: '[]'
    description: 真偽値を ✓ と空欄で出す列の位置（`check=`）。列の `th`・`td` に class `mdmark-align-center` を付け、文字が `true` のセルを ✓（lucide の `check`）、`false` のセルを空欄にし、どちらも `data-value` に元の文字を持つ。ほかの文字のセルは文字のまま
  - name: openFilter
    type: 整数
    required: false
    default: なし（ドロワーを閉じる）
    description: 開いた絞り込みのドロワーの列の位置
  - name: filterValues
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 適用している絞り込み（`{ column, values }`・`{ column, text }`・`{ column, from, to }`）。適用した列のボタンを絞り込み中の外観にし、合わない行に `hidden` を付ける。全ての行が合わないときは `一致する行がありません` の行を出す
  - name: hide
    type: 配列
    required: false
    default: '[]'
    enabled_when: '`features` に `columns` を含むとき'
    description: 既定で隠す列の位置（`data-hide`）。先頭の列（0）は含まない
  - name: hiddenColumns
    type: 配列
    required: false
    default: '`hide` と同じ'
    enabled_when: '`features` に `columns` を含むとき'
    description: 今隠している列の位置。この列の見出し・セル・集計のセルに `hidden` を付け、テーブル設定のその列の目のアイコンを `aria-pressed="true"`・`aria-label="「{列名}」を表示"` にし、ボタンに隠した列の数のバッジを出す
  - name: openColumns
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`features` に `columns`・`reorder` のどちらかを含むとき'
    description: テーブル設定のパネルを開いているか
  - name: totals
    type: オブジェクトの配列
    required: false
    default: '[]'
    enabled_when: '`features` に `total` を含むとき'
    description: 集計する列（`{ column, calc }`。`calc` は `sum`・`avg`・`count`）。空でなければ `tfoot` に計算ごとに 1 行（`合計`・`平均`・`件数` の順。行は `data-total-kind="{計算}"`）を配置し、行の先頭のセルに計算の名前を、その計算を持つ列のセルに `filterValues` に合う行で集計した値を出す（先頭の列を集計する行は、名前を左、値をセルの末尾に配置する）。`sum`・`avg` は空のセルを除き、桁区切りを付けて小数を 2 桁までに丸める（平均する値が無いときは `—`）。`sum`・`avg` の列に空でなく数として読み込めないセルが 1 つでもあれば、その計算のセルを空にする
  - name: copyState
    type: 列挙
    required: false
    default: idle
    choices: '`idle`（`表をコピー`）・`copied`（`コピーしました`）・`failed`（`コピーできませんでした`）'
    enabled_when: '`features` に `copy` を含むとき'
    description: '`表をコピー` のボタンの状態。ボタンの `data-state` と、ツールチップ（`title`）・スクリーンリーダー向けの名前・アイコン（`copy`・`check`・`circle-alert`）を切り替える。ボタンは文字を持たずアイコンだけで、形式のメニューを開くことは `aria-expanded` で示す'
  - name: rowIds
    type: 配列
    required: false
    default: '[]'
    enabled_when: '`features` に `rowlink` を含むとき'
    description: 本文の行ごとの `id`。行に `id` を付け、先頭のセルに `#{id}` への行へのリンク（`link` のアイコン）を配置する
  - name: targetRow
    type: 整数
    required: false
    default: なし（強調しない）
    enabled_when: '`features` に `rowlink` を含むとき'
    description: URL の `#ID` が指す行の位置。その行に `data-target` を付けて強調し、行へのリンクのマーカーを出す
  - name: shownTotals
    type: 配列
    default: '`totals` の全ての計算'
    enabled_when: '`features` に `total` を含むとき'
    description: 出している集計の行の計算（`sum`・`avg`・`count` のうち）。含まない計算の行に `hidden` を付けて集計のメニューのチェックを解除し、`集計` のボタンを隠している外観（`is-active`）にして、スクリーンリーダー向けの名前に `（{隠している数} 件を非表示にしています）` を加える
  - name: openTotals
    type: 真偽値
    default: 'false'
    enabled_when: '`features` に `total` を含むとき'
    description: 集計のメニュー（`表示する集計`）を開いているか
  - name: openCopy
    type: 真偽値
    default: 'false'
    enabled_when: '`features` に `copy` を含むとき'
    description: コピーの形式のメニュー（`Markdown の表`・`TSV`）を開いているか
  - name: copyFallback
    type: オブジェクト
    default: なし（パネルを出さない）
    enabled_when: '`features` に `copy` を含むとき'
    description: クリップボードに書き込めなかったときに手動でコピーさせるパネルの中身（`{ format, text }`。`format` は `markdown`・`tsv`、`text` はコピーする文字）。指定すると帯の直後に、タイトル `クリップボードにコピーできませんでした`・案内 `「{形式の名前}」の中身を選択しています。Ctrl+C（Mac は ⌘C）でコピーしてください。`・`text` を入れた読み取り専用の `textarea`・閉じるボタンを持つパネルを出す
  - name: rowLinkNotice
    type: 列挙
    default: なし（通知を出さない）
    choices: '`copied`（`リンクをコピーしました`）・`failed`（`リンクをコピーできませんでした`）'
    enabled_when: '`targetRow` を指定したとき'
    description: '`targetRow` の行の URL をコピーした結果。その行の行へのリンクのマーカーの横の `role="status"` の要素に、文言とアイコン（`check`・`circle-alert`）を出す'
  - name: long
    type: 配列
    default: '[]'
    description: 長文の列の位置（`data-long`）。`render` が、見出しとセルを改行で分けた 1 行の文字数から決めて写す（決め方は注記の「列の幅」）。`mount` はこの列を折り返す列にし、`filters` の `kind` を省いた列の既定にも使用する
  - name: widthRanges
    type: オブジェクトの配列
    default: '[]'
    description: '`width.min`・`width.max` を記載した列（`{ column, min, max }`。`min`・`max` は em の数で、記載しない側は持たない）。`data-width` に `{位置}:{min}-{max}` を空白で区切って写す。`mount` はこの列を折り返す列にし、最小の幅と最大の幅にする'
  - name: autoWidths
    type: オブジェクトの配列
    default: '[]'
    description: '`mount` が自動で決めた列の幅（`{ column, width }`。`width` は見出しのセルの外側の幅の px）。最下段の各 `th` のインラインの `width` に入れ、`table` の幅を幅の合計にする。決め方は注記の「列の幅」。`widths` を指定した列は `widths` を優先する'
  - name: title
    type: 文字列
    required: false
    default: なし（`表（{本文の行の数} 行）`）
    enabled_when: '`collapse` が `closed`・`open` のとき'
    description: 折り畳みの見出し（`collapse.title` の値）。`summary` の文字にする
  - name: highlight
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 強調する列（`{ column, color }`。`color` は色の名前）。列の `th` と `td` に class `mdmark-col-highlight` と `data-color` を付け、セルを `--mdmark-color-accent-{色}-bg`、見出しのセルの下端の線を `--mdmark-color-accent-{色}-text` にする
  - name: rowColors
    type: 配列
    required: false
    default: '[]'
    description: 本文の行ごとの色の名前（色を付けない行は `null`）。行の `tr` に `data-color` を付け、セルを `--mdmark-color-accent-{色}-bg` にし、行の上下に `--mdmark-color-accent-{色}-text` の線を付ける。強調した列と重なるセルは行の色にする。`tr` に付くので、並べ替え・絞り込みの後も行に付いたまま動く
    status: planned
  - name: order
    type: 配列
    required: false
    default: Markdown に記載した順
    enabled_when: '`features` に `reorder` を含むとき'
    description: 今の列の順（元の列の位置の並び）。見出し・本文の行・集計の行のセルと、テーブル設定の一覧をこの順に並べる
  - name: dragging
    type: オブジェクト
    required: false
    default: なし（ドラッグしていない）
    enabled_when: '`openColumns` が `true` で `features` に `reorder` を含むとき'
    description: ドラッグしている列とドロップできる位置（`{ column, target, side }`。`side` は `before`・`after`）。動かす行を薄くし（`is-dragging`）、`target` の行の `side` の境に線を出す（`is-drop-before`・`is-drop-after`）。結合した見出しの範囲の外とピン止めの境の向こうの `target` には線を出さない
  - name: tree
    type: 整数
    required: false
    default: なし（階層にしない）
    description: キーの列の位置（`data-tree`）。その列の文字をキーのパスとして階層の行にし、表に無い親の行を補う。指定すると見出しに行の並べ替えのボタンを配置しない
  - name: treeType
    type: 整数
    required: false
    default: なし
    enabled_when: '`tree` を指定したとき'
    description: 型の列の位置。セルを値ごとに色の違うバッジ、`a \| b` は値ごとのチップにする
  - name: treeRequired
    type: 整数
    required: false
    default: なし
    enabled_when: '`tree` を指定したとき'
    description: 必須の列の位置。列を出さず、`✓`・`true` の行のキーの後ろに赤い * を出す
  - name: treeDefault
    type: 整数
    required: false
    default: なし
    enabled_when: '`tree` を指定したとき'
    description: 既定の列の位置。空でないセルを薄い等幅で出す
  - name: collapsedPaths
    type: 配列
    required: false
    default: '[]'
    enabled_when: '`tree` を指定したとき'
    description: 畳んだ行のパス。その行の開閉のボタンを `aria-expanded="false"`（▸）にし、子孫の行を `hidden` にする
  - name: selectedPath
    type: 文字列
    required: false
    default: なし（選ばない）
    enabled_when: '`tree` を指定したとき'
    description: 選んだ行のパス。その行を `aria-selected="true"` にし、同じ親を持つ行とその子孫の、その行の階層の縦線を濃くする。見本の開いているタブに同じパスの行があれば色を付ける
  - name: treeFilter
    type: 文字列
    required: false
    default: なし（絞り込まない）
    enabled_when: '`tree` を指定し、キーの列を `filters` に含むとき'
    description: キーの列の絞り込みの単語。末尾の名前が該当した行とその祖先の行を残し、該当した単語に色を付ける。件数は補った行を数えない
  - name: example
    type: オブジェクト
    required: false
    default: なし（見本を配置しない）
    enabled_when: '`tree` を指定したとき'
    description: '表の下に配置する YAML の見本（`{ heading, tabs: [{ name, lines: [{ text, path? }] }], active, hidden }`）。`active` は開いているタブの位置、`hidden` が `true` のとき見本を隠してボタンを `見本を表示` にする'
  - name: rawCsv
    type: 文字列
    required: false
    default: なし（CSV の表ではない）
    description: 言語 `csv` のコードブロックから作った表の、記載したとおりの CSV。指定すると `data-source="csv"` を付け、表の後ろに `<pre class="mdmark-raw" hidden><code class="language-csv">` を配置し、帯の右端に RAW のボタンを配置する
  - name: rawShown
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`rawCsv` を指定したとき'
    description: 元の CSV を出しているか。`true` なら RAW のボタンを `aria-pressed="true"` にし、表を隠して `pre.mdmark-raw` を出す
  - name: pinMode
    type: '`"each"` | `"through"`'
    required: false
    default: '`each`'
    enabled_when: '`features` に `pin` を含むとき'
    description: ピン止めの動き。設定の `table.pin` を `mount` が渡す。ボタンの名前と `aria-pressed` を付ける列が変わる
  - name: widths
    type: オブジェクトの配列
    required: false
    default: '`[]`'
    enabled_when: '`features` に `resize` を含むとき'
    description: 読者がつまみで指定した列の幅（`{ column, width }`。`width` は見出しのセルの外側の幅の px）。指定した列の見出しのセルに幅を入れ、`wide` の列でも折り返す。`mount` が入れ、描くたびに空に戻る
  - name: resizing
    type: 整数
    required: false
    default: なし（ドラッグしていない）
    enabled_when: '`features` に `resize` を含むとき'
    description: つまみをドラッグしている列の位置。その列のつまみの線を出したままにする。`mount` が入れる
events:
  - name: 並べ替える
    when: 列の見出しのボタンを押す
    value: 列の `th` の `aria-sort`
    description: '`mount` が降順 → 昇順 → 元の並びの順に行を並べ替える'
  - name: ピン止めする
    when: 列のピン止めのボタンを押す
    value: ボタンの `aria-pressed`
    description: '`mount` が、`pinMode` が `each` なら押した列だけを留め（もう一度押すとその列だけを解除する）、`through` なら押した列までを左端に留める（もう一度押すと解除する）'
  - name: 絞り込む
    when: 絞り込みのボタンでドロワーを開き、値を選ぶか入れる。「絞り込みを解除」で戻す
    value: ボタンの `aria-expanded` と、ドロワーの入力欄の値
    description: '`mount` が列ごとの絞り込みを重ねて行に適用する'
  - name: 列の表示を切り替える
    when: テーブル設定の目のアイコンを押す
    value: 一覧の行の `data-column`（列の位置）と目のアイコンの `aria-pressed`
    description: '`mount` がその列の見出し・セル・集計のセルの `hidden` を切り替える。残った列の幅は変えない'
  - name: 表をコピーする
    when: '`表をコピー` のボタンでコピーの形式のメニューを開き、`Markdown の表`・`TSV` のどちらかを押す'
    value: 形式のボタンの `data-format`（`markdown`・`tsv`）と、`表をコピー` のボタンの `data-state`
    description: '`mount` がメニューを閉じてフォーカスを `表をコピー` に戻し、見出しの行と表示している行の表示している列を選んだ形式でクリップボードへコピーし、結果を `data-state` とスクリーンリーダーで通知する。写せないときはコピーできないときのパネルを出す'
  - name: 行へ移る
    when: URL の `#ID` が行の `id` を指す（描いたときと `hashchange`）
    value: 行の `id`
    description: '`mount` が閉じた表・セクションを開き、絞り込みで隠れていれば絞り込みを解除してから行へ移り、その行に `data-target` を付ける'
  - name: 集計の行を切り替える
    when: 集計のメニューのチェックボックスを入れる・解除する
    value: チェックボックスの `value`（計算）と `checked`
    description: '`mount` がその計算の集計の行の `hidden` を切り替え、出したこと・隠したことをスクリーンリーダーで通知する'
  - name: コピーのパネルを閉じる
    when: コピーできないときのパネルの閉じるボタンを押すか、パネルの中にフォーカスがある間に Esc を押す
    value: なし
    description: '`mount` がパネルを取り除き、フォーカスを `表をコピー` に戻す'
  - name: 行の URL をコピーする
    when: 行へのリンクのマーカーを押す
    value: マーカーの解決済みの `href`
    description: '`mount` が行へ移る動きはそのままに、行を指す絶対 URL をクリップボードへコピーし、マーカーの横の `role="status"` の要素に結果を 2 秒出す'
  - name: 列を動かす
    when: テーブル設定の一覧のつまみをドラッグしてドロップするか、つまみにフォーカスして ↑・↓ キーを押す
    value: 一覧の行の `data-column` の並び
    description: '`mount` が同じ範囲の中で列を動かし、見出しと全ての行のセルをもう一度並べる。`pinMode` が `through` のときは同じピン止めの側の中だけで動かし、`each` のときは留めているかを列が持ったまま動かす'
  - name: 列の幅を変える
    when: 列の見出しの右端のつまみをドラッグするか、つまみにフォーカスして ←・→ キーを押す
    value: 列の位置と、つまみの `aria-valuenow`（幅の px）
    description: '`mount` がつまみの左の列の幅だけを、列の最小幅から上限（表の見えている幅からほかに留めた列の幅の合計を引いた幅）までの範囲で変え、留めた列の位置を計算し直す'
  - name: 列の幅を戻す
    when: つまみをダブルクリック・ダブルタップするか、つまみにフォーカスして Enter を押す
    value: 列の位置
    description: '`mount` がその列の幅の指定を解除し、描いた直後の幅（`nowrap` の列は折り返さない幅）に戻す'
  - name: 階層を開閉する
    when: 階層の行の開閉のボタンを押す（Shift を押しながら押す、Enter・Space を含む）
    value: ボタンの `aria-expanded`
    description: '`mount` が子孫の行を畳む・子を出す。Shift のときは子孫の開閉も同じにする'
  - name: 全体のパスをコピーする
    when: 階層の行のコピーのボタンを押す
    value: 行の `data-path`
    description: '`mount` が全体のパスをクリップボードへコピーし、結果を 2 秒出す'
  - name: 階層の行を選ぶ
    when: 階層の行か、見本の `data-path` の行を押す
    value: 行の `data-path`
    description: '`mount` が行を選び（選んだ行をもう一度押すと解く）、縦線と見本の行の色をもう一度付ける'
  - name: 見本の表示を切り替える
    when: '`見本を隠す`・`見本を表示` のボタンを押す'
    value: ボタンの `aria-expanded`
    description: '`mount` が見本を隠す・出し、ボタンの文言を替える'
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: 本文の行の地、横スクロールの影を隠す覆い、ページのスクロールで留める見出し行とピン止めした列の地、列のメニュー・表のメニュー・コピーの形式のパネル・行の URL の通知・絞り込みの引き出しの地の色
  - name: --mdmark-color-table-head
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: 見出し行の地の色
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: 見出し行で `--mdmark-color-table-head` を上書きしないときの面の色。本文の行は面で塗らず `--mdmark-color-bg-opaque` のままにする
  - name: --mdmark-table-rule-inline
    syntax: <length>
    default: 1px
    description: 縦の罫線の太さ（`plain` は 0）
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: 表の外枠の角丸は、この値の 2 倍にする。外枠・見出しの下・行の間・集計の上の線はどれも 1px の `--mdmark-color-border`。文書全体の角丸を変えると表の角丸も変わる
  - name: --mdmark-sticky-top
    syntax: <length>
    default: 0px
    description: 見出し行を留める位置の、画面の上端からのずれ。ページの上端に固定したヘッダーを持つ利用側は、その高さを指定する
  - name: --mdmark-color-accent-blue-bg
    syntax: <color>
    default: 値は docs/design-policy.md
    description: 強調した列のセルと色を付けた行の面の薄い色。ほかの色の名前も `--mdmark-color-accent-{色}-bg` で同じ
  - name: --mdmark-color-accent-blue-text
    syntax: <color>
    default: 値は docs/design-policy.md
    description: 強調した列の見出しの下端の線と、色を付けた行の上下の線の色。ほかの色の名前も `--mdmark-color-accent-{色}-text` で同じ
accessibility:
  - 列の強調と行の色は、見出しの下端の線と行の上下の線でも示し、色だけに頼らない。セルの文字と面の色のコントラストを 4.5:1 以上にする
  - 並べ替えのボタンは列名をスクリーンリーダー向けの名前にし、並べた列の `th` は `aria-sort` で向きを示す
  - 絞り込みのボタンは `「{列名}」で絞り込む` をスクリーンリーダー向けの名前に持ち、`aria-expanded`・`aria-controls` でドロワーの開閉を示す。絞り込み中は地・線・塗ったアイコンで示し、色だけに頼らない
  - ドロワーは開いたら最初の入力欄へフォーカスを移し、Esc で閉じてボタンへフォーカスを戻す
  - ピン止めのボタンは、`pinMode` が `each` なら `「{列名}」の列をピン止め`、`through` なら `「{列名}」の列までピン止め` をスクリーンリーダー向けの名前に持ち、`aria-pressed` で状態を示す（`each` は留めた列のボタン、`through` は留めた最も右の列のボタンを `true`）
  - 列の幅のつまみは `role="separator"`・`aria-orientation="vertical"`・`tabindex="0"` で、`「{列名}」の列の幅` をスクリーンリーダー向けの名前に持ち、`aria-valuenow`・`aria-valuetext`（`{幅}px`）・`aria-valuemin`・`aria-valuemax` で今の幅と範囲を示す。←・→ キーで幅を変え、Enter で戻す。ポインターが粗い画面では押せる幅を 24px にする
  - 多段の見出しは、複数の列をまたぐセルを `scope="colgroup"`、1 列のセルを `scope="col"` にし、行見出しは `scope="row"` にする。結合で隠したセルも値を持ち、並べ替え・絞り込み・コピー・集計はその値で扱う
  - 真偽値の ✓ は `role="img"` と `aria-label="はい"`、空欄のセルはスクリーンリーダー向けの `いいえ` を持ち、外観の空欄とスクリーンリーダーを対応させる
  - 表は `tabindex="0"` で、キーボードで横にスクロールできる。留めた見出し行と集計の行は元のセルをずらしたもので複製を作らず、スクリーンリーダーとフォーカスの順は 1 組のまま
  - 件数は `aria-live="polite"` で書き換えを通知し、スクリーンリーダーには `{全ての行の数} 件中 {表示している行の数} 件を表示` を指定する
  - テーブル設定のパネルは絞り込みのドロワーと同じ開閉の作法（`aria-expanded`・`aria-controls`、開いたら最初の押せるつまみか目のアイコンへフォーカス、Esc で閉じてボタンへ戻す）。押せない先頭の列の目のアイコンは、理由をパネルの案内に出す
  - 表をコピーのボタンは `copy` のアイコンだけで、`title` とスクリーンリーダー向けの名前を `表をコピー` にする
  - 集計のメニュー（`role="dialog"`・`aria-label="表示する集計"`）とコピーの形式のメニュー（`aria-label="コピーの形式"`）もテーブル設定のパネルと同じ開閉の作法。集計の行を隠しているときは、`集計` のボタンの外観に加えてスクリーンリーダー向けの名前に `（{隠している数} 件を非表示にしています）` を含める
  - 集計の行の出し入れ、表のコピーの結果（コピーした形式・書き込めなかったことと手動でコピーできること）は、帯の `role="status"` の要素でスクリーンリーダーに伝える
  - コピーできないときのパネルは `role="group"` でタイトルを名前に持ち、出したら `textarea` へフォーカスを移して中身を全て選択する。閉じるボタンは `閉じる` をスクリーンリーダー向けの名前に持ち、閉じるとフォーカスを `表をコピー` に戻す
  - 行へのリンクは `「{先頭のセルの文字}」の行へのリンク` をスクリーンリーダー向けの名前に持ち、フォーカスしたときはマーカーを出す。指せない端末ではマーカーを常に薄く出す。URL をコピーした結果は、描くときにマーカーの横へ配置した `role="status"` の要素でスクリーンリーダーに伝える
  - テーブル設定のボタンはアイコンだけで、`aria-label` とツールチップに `テーブル設定` を持つ。列を隠しているときは、バッジに加えて `aria-label` を `テーブル設定（{隠した列の数} 列を非表示）` にし、色と数だけに頼らない。パネルは絞り込みのドロワーと同じ開閉の作法。つまみはキーボードの ↑・↓ で動かせ、動かせないつまみは `disabled`。案内はつまみの `aria-describedby` でスクリーンリーダーに伝える
  - 階層の開閉のボタンは `aria-expanded` と `{パス} を畳む`・`{パス} を開く` のスクリーンリーダー向けの名前を持つ。キーの名前は `tabindex="0"` で、フォーカスでも全体のパスのツールチップを出す。選んだ行は `aria-selected` で示し、縦線の濃さだけに頼らない
  - 見本の表示の切り替えのボタンは `aria-expanded`・`aria-controls` で見本の開閉を示す
  - RAW のボタンは `aria-label="元の CSV を表示"` と `aria-pressed` を持ち、24px 四方以上。押した状態は青いアイコンと薄い青の面で示す。押すと表と元の CSV が入れ替わるため、状態は色のほかに出ている中身でも分かる
