        value: '[[{"text":"名前","rowspan":2},{"text":"設定","colspan":3},{"text":"備考","rowspan":2}],[{"text":"型"},{"text":"既定"},{"text":"必須"}]]'
      - name: rows
        value: '[["table.pin","string","each","false","each は押した列だけを留め、through は押した列までを留める。既定は each で、mount は他の値を無視して each にする"]]'
