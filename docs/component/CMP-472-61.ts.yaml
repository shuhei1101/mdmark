      - name: overflow
        value: 'true'
      - name: pinned
        value: '[0,2]'
      - name: pinMode
        value: each
  - name: Resizable
    description: '`resize` の表。最下段の各列の見出しのセルの右端に、列の幅を変えるつまみ（`role="separator"`）がある。つまみの線は、ポインターを乗せたとき・フォーカスしたとき・ドラッグ中に出し、ポインターが粗い画面では常に薄く出す'
    args:
      - name: kind
