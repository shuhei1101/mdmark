    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","resize"]'
      - name: columns
        value: '["名前","説明"]'
      - name: rows
        value: '[["表の幅","描画を速くするために、見出しの列ごとの幅を描いた後に一度だけ測り、表の見える幅が変わったときだけ列の幅を決め直す。並べ替え・絞り込み・列の表示の切り替えでは列の幅を変えず、読者がつまみで変えた列の幅は自動の幅より優先する"]]'
