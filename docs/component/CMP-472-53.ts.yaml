  - name: AliasDoc
    description: doc のエイリアス。「文書」の区分に名前と概要を持つ `role="tooltip"` のツールチップを開いた
    args:
      - name: text
        value: 設計書
      - name: id
        value: tip-alias-doc
      - name: alias
        value: '{"alias_type":"doc","id":"design-doc","name":"設計書","description":"仕様を記載した文書"}'
  - name: AliasCommand
    description: command のエイリアス。「コマンド」の区分に名前・説明・コマンドとコピーのボタン・実行場所を持つ `role="group"` のツールチップを開いた
    args:
      - name: text
        value: 単体テスト
      - name: id
        value: tip-alias-command
      - name: alias
        value: '{"alias_type":"command","id":"unit-test","name":"単体テスト","description":"ライブラリ本体の単体テストを実行する","command":"npm run test:unit","cwd":"リポジトリの直下"}'
  - name: AliasCommandCopied
