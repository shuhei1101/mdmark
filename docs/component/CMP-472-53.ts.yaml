id: CMP-472-53
visibility: internal
title: "用語のツールチップ"
implementation: "src/parts/term-tip.ts#renderTermTip"
story: "Parts/TermTip"
states:
  - name: TermOnly
    description: 用語だけに一致した単語。「用語」の意味だけを持つ `role="tooltip"` のツールチップを単語の上に開いた。透明な線はツールチップの下側にある
    args:
      - name: text
        value: ワークスペース
      - name: id
        value: tip-term
      - name: meaning
        value: 話し合いの記録を配置するフォルダ
  - name: DocsOnly
    description: 文書の別名だけに一致した単語。「関連文書」だけを持つ `role="group"` のツールチップを開いた
    args:
      - name: text
        value: 公開関数
      - name: id
        value: tip-docs
      - name: docs
        value: '[{"title":"API","href":"../api.md","description":"mount・render などの公開関数と引数の一覧"}]'
  - name: Both
    description: 用語にも文書の別名にも一致した単語。「用語」→「関連文書」の順に並ぶ
    args:
      - name: text
        value: 索引
      - name: id
        value: tip-both
      - name: meaning
        value: 文書と用語を並べた YAML のファイル
      - name: docs
        value: '[{"title":"索引のリファレンス","href":"../リファレンス/索引.md","description":"索引のキー・型・必須・既定と、点検が返却するずれの種類"}]'
  - name: ManyDocs
    description: 関連文書が 7 件あり、高さの上限を超える。ツールチップの中をスクロールする
    args:
      - name: text
        value: 設定
      - name: id
        value: tip-many
      - name: meaning
        value: mdmark.config.yaml に書き込む、機能のオン・オフと外部ライブラリの読み込み方
      - name: docs
        value: '[{"title":"設定の一覧","href":"../リファレンス/設定.md","description":"設定のキーと既定の一覧"},{"title":"機能をオン・オフする","href":"../使い方/カスタマイズ/機能をオン・オフする.md","description":"設定の features と文書のマーカーで、機能のオン・オフを切り替える"},{"title":"テーマを上書きする","href":"../使い方/カスタマイズ/テーマを上書きする.md","description":"CSS 変数と層の外の CSS で、描いた文書の外観を変える"},{"title":"文書を描く","href":"../使い方/導入/文書を描く.md","description":"配布物を読み込んだページで mount を呼び、要素の中に Markdown を描く"},{"title":"文書を描く仕組み","href":"../はじめに/コアコンセプト/文書を描く仕組み.md","description":"Markdown と設定を指定してから描かれるまでの流れと、機能のオン・オフの優先順"},{"title":"印刷する","href":"../使い方/カスタマイズ/印刷する.md","description":"印刷・PDF にしたときの文書の見え方"},{"title":"非機能要件","href":"../非機能要件.md","description":"配布物のサイズと対応ブラウザの決定値"}]'
  - name: LongMeaning
    description: 意味が長く、幅の上限で折り返す
    args:
      - name: text
        value: サニタイズ
      - name: id
        value: tip-long
      - name: meaning
        value: '描く前の HTML から、スクリプトと許可していない要素・属性を落とすこと。文書に記載した script 要素・イベント属性・javascript: の URL を実行しないための処理で、索引に記載したタイトルと意味にも適用する'
  - name: Closed
    description: 開く前。破線の下線だけが出て、ツールチップは隠れている
    args:
      - name: text
        value: ワークスペース
      - name: id
        value: tip-closed
      - name: meaning
        value: 話し合いの記録を配置するフォルダ
  - name: Avoided
    description: やめた言い方に一致した単語。波線の下線を付け、「代わりの用語」の区分に代わりの用語の単語と意味を持つ `role="tooltip"` のツールチップを開いた
    args:
      - name: text
        value: 作業場
      - name: id
        value: tip-avoided
      - name: replacement
        value: '{"term":"ワークスペース","meaning":"話し合いの記録を配置するフォルダ"}'
  - name: AvoidedClosed
