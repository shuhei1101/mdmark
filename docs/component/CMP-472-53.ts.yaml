    args:
      - name: text
        value: 単体テスト
      - name: id
        value: tip-alias-command-copied
      - name: alias
        value: '{"alias_type":"command","id":"unit-test","name":"単体テスト","description":"ライブラリ本体の単体テストを実行する","command":"npm run test:unit","cwd":"リポジトリの直下"}'
      - name: copy
        value: copied
  - name: AliasCommandFailed
    description: コマンドをコピーできなかった。ボタンが `コピーできませんでした`（`circle-alert` のアイコン）
    args:
      - name: text
        value: 単体テスト
      - name: id
        value: tip-alias-command-failed
      - name: alias
        value: '{"alias_type":"command","id":"unit-test","name":"単体テスト","description":"ライブラリ本体の単体テストを実行する","command":"npm run test:unit","cwd":"リポジトリの直下"}'
      - name: copy
        value: failed
  - name: AliasCommandLong
    description: コマンドが長く、コマンドの面の幅で折り返す。ツールチップの幅の上限を超えない
    args:
      - name: text
        value: まとめた HTML の書き出し
      - name: id
        value: tip-alias-command-long
      - name: alias
        value: '{"alias_type":"command","id":"build-handbook","name":"まとめた HTML の書き出し","description":"設定の build の文書を 1 枚の HTML にまとめる","command":"npx mdmark build --config docs/mdmark.config.yaml --out dist/handbook/index.html --title \"開発ハンドブック\"","cwd":"リポジトリの直下"}'
  - name: AliasUrl
    description: url のエイリアス。「URL」の区分に名前・説明・URL の文字のリンクを持つ `role="group"` のツールチップを開いた
    args:
      - name: text
        value: 課題の一覧
      - name: id
        value: tip-alias-url
      - name: alias
        value: '{"alias_type":"url","id":"issues","name":"課題の一覧","description":"Issue を並べたページ","url":"https://github.com/shuhei1101/mdmark/issues"}'
  - name: AliasUrlLong
    description: URL が長く、リンクの文字を 1 行に収めて末尾を「...」で省略する
    args:
      - name: text
        value: 移行の手順書
      - name: id
        value: tip-alias-url-long
      - name: alias
        value: '{"alias_type":"url","id":"upgrade-guide","name":"移行の手順書","description":"設定・索引・文書を新しいバージョンに合わせる手順","url":"https://github.com/shuhei1101/mdmark/blob/develop/docs/%E4%BD%BF%E3%81%84%E6%96%B9/%E5%B0%8E%E5%85%A5/%E7%89%88%E3%82%92%E4%B8%8A%E3%81%92%E3%82%8B.md?plain=1#L12-L48"}'
  - name: AliasUrlNotHttp
    description: http・https でない URL。リンクにせず文字で出し、リンクが無いので `role="tooltip"`
    args:
      - name: text
        value: 危ないリンク
      - name: id
        value: tip-alias-url-not-http
      - name: alias
        value: '{"alias_type":"url","id":"bad-link","name":"危ないリンク","url":"javascript:alert(1)"}'
  - name: AliasSkill
    description: skill のエイリアスで説明が空。「スキル」の区分に名前とスキル名の等幅の 1 行だけを出す
    args:
      - name: text
        value: 記録の取り込み
      - name: id
        value: tip-alias-skill
      - name: alias
        value: '{"alias_type":"skill","id":"session","name":"記録の取り込み","skill":"mindstella:session"}'
  - name: AliasTool
    description: tool のエイリアス。「ツール」の区分に名前・説明・ツール名の等幅の 1 行を出す
    args:
      - name: text
        value: 点検のツール
      - name: id
        value: tip-alias-tool
      - name: alias
        value: '{"alias_type":"tool","id":"check-tool","name":"点検のツール","description":"設定と索引のずれを返却する","tool":"check"}'
  - name: AliasPath
    description: path のエイリアス。「パス」の区分に名前・説明・パスの等幅の 1 行を出す
    args:
      - name: text
        value: 設定ファイル
      - name: id
        value: tip-alias-path
      - name: alias
        value: '{"alias_type":"path","id":"config-file","name":"設定ファイル","description":"機能のオン・オフと読み込む文書を記載する","path":"mdmark.config.yaml"}'
  - name: AliasAvoid
    description: avoid の種類のエイリアスに一致した単語。波線の下線を付け、「代わりの用語」の区分に置き換え先の単語だけを出す
    args:
      - name: text
        value: 作業場
      - name: id
        value: tip-alias-avoid
      - name: replacement
        value: '{"term":"ワークスペース"}'
lead: 本文の用語と文書の別名に破線の下線を付け、隣に「用語」の意味と「関連文書」の並びを持つツールチップを配置する。エイリアスには種類ごとの区分を持つツールチップを配置する。やめた言い方には波線の下線を付け、「代わりの用語」のツールチップを配置する。HTML 文字列を返却し、ブラウザと Node で同じ出力になる。開閉と配置場所は `mount` の操作が付ける。
args:
  - name: text
    type: 文字列
    required: true
    description: 下線を付ける本文の単語（HTML として特別な文字はエスケープする）
  - name: id
    type: 文字列
    required: true
    description: ツールチップの要素の `id`。単語の `aria-describedby`・`aria-details` が指す。描くごとに文書の中で一意にする
  - name: meaning
    type: 文字列
    default: '""'
    description: 「用語」に出す意味。空なら「用語」の区分を出さない
  - name: docs
    type: オブジェクトの配列
    default: '[]'
    description: 「関連文書」に並べる文書（`{ title, href, description }`。`description` は任意）。空なら「関連文書」の区分を出さない。`meaning` も `docs` も空なら、下線もツールチップも出さず `text` をそのまま返却する
  - name: replacement
    type: オブジェクト
    description: '`text` がやめた言い方のときの代わりの用語（`{ term, meaning }`。`meaning` は任意で、`avoid` の種類のエイリアスでは `term` に `replacement` を指定し `meaning` を指定しない）。指定すると、単語に破線ではなく波線の下線を付け（class `mdmark-term-avoided`）、ツールチップには「代わりの用語」の区分だけを配置して `term` と、あれば `meaning` を出す。指定したときは `meaning`・`docs`・`alias` を使用しない'
  - name: below
    type: 真偽値
    default: 'false'
    description: 単語の下に開いた外観にするか。`true` なら `mdmark-term-wrap` に `is-below` を付ける（`mount` が上に収まらない単語に付けるのと同じ class）。`render` は指定しない
  - name: alias
    type: オブジェクト
    description: '`text` が一致したエイリアス（ER 図『エイリアス』の `MdmarkAlias`）。指定すると、種類の見出し（`term` は「用語」、`doc` は「文書」、`command` は「コマンド」、`url` は「URL」、`skill` は「スキル」、`tool` は「ツール」、`path` は「パス」）の区分 1 つだけを配置し、`name` と、あれば `description` を出す。`command` はコマンドをコードとコピーのボタンで、あれば `cwd` を「実行場所」で出す。`url` は http・https の URL だけをリンクにし、ほかは文字で出す。`skill`・`tool`・`path` はその値を等幅の 1 行で出す。指定したときは `meaning`・`docs` を使用しない。`avoid` の種類と `term` の `avoid` はこの引数ではなく `replacement` で指定する'
    choices: '`alias_type` は `term`・`doc`・`command`・`url`・`skill`・`tool`・`path`'
    status: planned
  - name: copy
    type: 列挙
    default: '"idle"'
    choices: '`idle`（`コピー`、`copy` のアイコン）・`copied`（`コピーしました`、`check`）・`failed`（`コピーできませんでした`、`circle-alert`）'
    enabled_when: '`alias` の `alias_type` が `command` のとき'
    description: コマンドのコピーのボタンの状態（`mount` が付けた状態）。ボタンの `data-state` と文言・アイコンを切り替え、`copied`・`failed` のときは `role="status"` の要素に `コマンドを{文言}` を入れる。`render` は指定しない
    status: planned
events:
  - name: 開く・閉じる
    when: 単語にポインターを乗せるかフォーカスする。離すか Esc を押す。タッチの端末では単語をタップする。もう一度タップするか、ツールチップと単語の外をタップする
    value: '`mdmark-term-wrap` の `is-open`'
    description: '`mount` が 1 つだけ開き、ツールチップの上と中にフォーカスがある間は閉じず、Esc で閉じてフォーカスを単語に残す。ツールチップの中のリンクとボタンのタップでは閉じない'
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: ツールチップの地の色
  - name: --mdmark-color-term-underline
    syntax: <color>
    default: var(--mdmark-color-muted)
    description: 単語の破線の下線の色
  - name: --mdmark-tooltip-max-width
    syntax: <length>
    default: 22rem
    description: ツールチップの幅の上限（画面の幅から 2rem を減算した幅を超えない）
  - name: --mdmark-tooltip-max-height
    syntax: <length>
    default: 18rem
    description: ツールチップの高さの上限（画面の高さの 60% を超えない）。超える分はツールチップの中でスクロールする
  - name: --mdmark-color-avoided-underline
    syntax: <color>
    default: var(--mdmark-color-notice-border)
    description: やめた言い方の単語の波線の下線の色
accessibility:
  - 単語は `tabindex="0"` でフォーカスでき、フォーカスの枠を出す
  - 意味だけのツールチップは `role="tooltip"` で、単語の `aria-describedby` が指す
  - 関連文書を持つツールチップは `role="group"` と `aria-label`（「{単語}」の用語と関連文書、または「{単語}」の関連文書）で、単語の `aria-details` が指す。意味も持つときは、単語の `aria-describedby` が意味の要素を指す。ツールチップを単語の直後に配置し、単語の次の Tab で中のリンクへ移れる
  - 関連文書の並びは `role="list"`・`role="listitem"` で件数を伝える
  - 用語であることは破線の下線の形状でも示し、色だけに頼らない（リンクは実線）。単語の上でポインターの形状は変えない
  - やめた言い方であることは波線の下線の形状で示し、用語の破線と色だけで分けない。代わりの用語のツールチップは `role="tooltip"` で、単語の `aria-describedby` が指す
  - スクリプトが動かない HTML 文字列でも、単語にポインターを乗せるかフォーカスすると CSS で単語の上に開く
  - コマンドとリンクにした URL を持つエイリアスのツールチップは `role="group"` と `aria-label`（「{単語}」のコマンド・「{単語}」の URL）で、単語の `aria-details` が指し、説明を持つときは `aria-describedby` が説明の要素を指す。単語の次の Tab でリンクとコピーのボタンへ移れる。ほかの種類は `role="tooltip"`
  - コピーのボタンは文言をスクリーンリーダー向けの名前に持ち、結果を `role="status"` の要素で `コマンドをコピーしました`・`コマンドをコピーできませんでした` とスクリーンリーダーに伝える。状態は文言とアイコンで示し、色だけに頼らない
refs:
  - IF-472-35#constraints[ツールチップの操作]
  - ER-472-3#
status: planned
notes:
  出力の構造: '`<span class="mdmark-term-wrap"><span class="mdmark-term" tabindex="0" aria-describedby="{id}-meaning" aria-details="{id}">{text}</span><span class="mdmark-term-tip" id="{id}" role="group" aria-label="「{text}」の用語と関連文書">…</span></span>`。区分は `mdmark-term-tip-section` に見出し `mdmark-term-tip-heading`（「用語」「関連文書」）を配置し、意味は `mdmark-term-tip-meaning`、関連文書は `mdmark-term-tip-docs` の中の `mdmark-term-tip-doc`（タイトルの `a` と `mdmark-term-tip-doc-desc`）。意味だけのときは `role="tooltip"` で `aria-details` を持たない。`replacement` を指定したときは、単語が `<span class="mdmark-term mdmark-term-avoided" tabindex="0" aria-describedby="{id}">`、ツールチップが `role="tooltip"` で、見出し「代わりの用語」の区分に代わりの用語の単語 `mdmark-term-tip-replacement` と意味 `mdmark-term-tip-meaning` を配置する。開いたツールチップは既定で単語の上に配置し、ポインターが単語から移るための透明な線をツールチップの下側に持つ。`mount` が単語の下に配置したときは `mdmark-term-wrap` に `is-below` を付け、透明な線を上側に移す。狭い画面（71rem 以下）でスクリプトが動かないときは、上下とも描く先の要素の左端から単語の直後に出す。モックは `docs/mock/components/term-tooltip/`'
  印刷: 印刷の CSS で破線・波線の下線とツールチップを削除し、単語を本文の文字として出す
  エイリアスの出力の構造: 区分 `mdmark-term-tip-section` に見出し `mdmark-term-tip-heading`、名前 `mdmark-term-tip-name`、説明 `mdmark-term-tip-meaning`（`id` は `{id}-meaning`）を配置する。`command` は `mdmark-term-tip-command` の中に `code` とコピーのボタン `button.mdmark-term-tip-copy`（`type="button"`・`data-state`）を並べ、`cwd` は `mdmark-term-tip-fields` にラベル `mdmark-term-tip-label`（「実行場所」）と値 `mdmark-term-tip-value` を配置し、スクリーンリーダーの `mdmark-visually-hidden mdmark-term-tip-status`（`role="status"`）を配置する。`url` は http・https なら `a.mdmark-term-tip-link`、ほかは `span.mdmark-term-tip-link` で URL の文字を 1 行に収め、あふれる分を「...」で省略する。`skill`・`tool`・`path` は値を `code.mdmark-term-tip-code` の 1 行で出す
test_file: tests/integration/lib/term-tip.story.test.ts
