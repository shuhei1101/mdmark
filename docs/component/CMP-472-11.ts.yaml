id: CMP-472-11
visibility: internal
title: キー
lead: 頭に `kbd:` を付けた行内のコードを、`+` で区切ったキーの外観の並びにする。
implementation: src/parts/kbd.ts#renderKbd
story: Parts/Kbd
test_file: tests/integration/lib/kbd.story.test.ts
args:
  - name: keys
    type: 文字列の配列
    required: true
    description: キーの文言の並び（HTML として特別な文字はエスケープする）。1 つ以上
states:
  - name: Single
    description: キー 1 つ
    args:
      - name: keys
        value: '["Enter"]'
  - name: Combo
    description: '`kbd:Ctrl+Shift+P`'
    args:
      - name: keys
        value: '["Ctrl","Shift","P"]'
  - name: PlusKey
    description: '`kbd:Ctrl++`。2 つ目のキーが `+`'
    args:
      - name: keys
        value: '["Ctrl","+"]'
  - name: Dark
    description: 暗い配色
    args:
      - name: keys
        value: '["Ctrl","C"]'
    notes:
      定義: ストーリーは暗い配色で描く
css_properties:
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: キーの地の色
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: キーの線と下の影の色
accessibility:
  - キーは `kbd` 要素で、区切りの `+` も文字としてスクリーンリーダーに伝える
refs:
  - IF-472-34#constraints[キー]
status: planned
notes:
  HTML: '`<span class="mdmark-kbd-group"><kbd class="mdmark-kbd">{key}</kbd><span class="mdmark-kbd-join">+</span>…</span>`。モックは `docs/mock/components/kbd/`'
