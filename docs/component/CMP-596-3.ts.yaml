id: CMP-596-3
visibility: internal
title: mapのC4図
implementation: src/map/map.part.ts#renderMapC4Diagram
story: Parts/MapC4
states:
  - name: Default
    description: 要素 7 つ（人・外部の人・システム・外部のシステム・データベース・待ち行列）・入れ子の境界 2 つ・関係 6 本（`Rel_D`・`Rel_R`・`BiRel`・技術の引数）
    notes:
      定義: モックの `C4`・`C4_DATA`（`docs/mock/refs/596/assets/samples.js`）
  - name: BoundaryCollapsed
    description: 境界「通販」を閉じた。名前の行の下に「要素 3 件」の行を持つ 1 つのノードになり、中への関係が相手ごとに 1 本にまとまる
    args:
      - name: collapsed
        value: '["shop"]'
  - name: Entered
    description: 境界「通販」の中へ入った
    args:
      - name: entered
        value: shop
  - name: ElementSelected
    description: 「注文のシステム」と「在庫のシステム」を選んだ。`Rel_R` の線と両端のほかが薄い
    args:
      - name: selected
        value: '["store", "stock"]'
  - name: Narrow
    description: 幅 390px の置き場所
  - name: Container
    description: '`C4Container`。種類と技術の行（`[Container: Node.js]`）を持つ要素・`ContainerDb`・`ContainerQueue`・外部のコンテナ・`Container_Boundary` の破線のグループ'
    notes:
      定義: モックの `CONTAINER`・`CONTAINER_DATA`（`docs/mock/refs/660/assets/samples.js`）
  - name: Component
    description: '`C4Component`。`Component`・`ComponentDb`・`ComponentQueue`・`Component_Ext` と `Container_Boundary`'
    notes:
      定義: モックの `COMPONENT`・`COMPONENT_DATA`
  - name: Dynamic
    description: '`C4Dynamic`。関係のラベルの前に記載の順の番号「{番号}: 」を持ち、`RelIndex` の第 1 引数を番号にしない'
    notes:
      定義: モックの `DYNAMIC`・`DYNAMIC_DATA`
  - name: Deployment
    description: '`C4Deployment`。3 レイヤーの入れ子の配置先のノードを実線のグループで描き、`Node_L` を `Node_R` の左に配置する'
    notes:
      定義: モックの `DEPLOYMENT`・`DEPLOYMENT_DATA`
  - name: DeploymentCollapsed
    description: 配置先のノード「東京のリージョン」を閉じた。名前の行の下に「要素 2 件」の行を持つ 1 つのノードになる
    args:
      - name: collapsed
        value: '["region"]'
    notes:
      定義: モックの `DEPLOYMENT`・`DEPLOYMENT_DATA`
  - name: DynamicPlaying
    description: '`C4Dynamic` の 2 本目の関係を再生している。その線と「注文の画面」「注文の API」のほかが薄く、3 本目の逆向きの線も薄く、2 本目の線だけにデータの印を流す'
    args:
      - name: collapsed
        value: '["store"]'
      - name: focus
        value: '{"nodes": ["web", "api"], "wires": ["r2"]}'
      - name: packets
        value: '[{"wire": "r2", "direction": "forward"}]'
    notes:
      定義: モックの `DYNAMIC`・`DYNAMIC_DATA`（`docs/mock/refs/677/assets/c4-dynamic-play.js`）
  - name: DynamicPlayingBoundary
    description: '`C4Dynamic` の 4 本目の関係を再生している。先の「注文のデータベース」は閉じた境界「注文の保存」の中にあるため、境界を強調する'
    args:
      - name: collapsed
        value: '["store"]'
      - name: focus
        value: '{"nodes": ["api", "store"], "wires": ["r4"]}'
      - name: packets
        value: '[{"wire": "r4", "direction": "forward"}]'
    notes:
      定義: モックの `DYNAMIC`・`DYNAMIC_DATA`
  - name: DynamicPlayingBiRel
    description: '`C4Dynamic` の 5 本目の `BiRel` を再生している。データの印を線の両方へ流し、重なりで隠れていたラベル「5: 結果を確かめる」を線の中ほどに出す'
    args:
      - name: collapsed
        value: '["store"]'
      - name: focus
        value: '{"nodes": ["web", "customer"], "wires": ["r5"]}'
      - name: packets
        value: '[{"wire": "r5", "direction": "both"}]'
    notes:
      定義: モックの `DYNAMIC`・`DYNAMIC_DATA`
lead: map の `C4Context`・`C4Container`・`C4Component`・`C4Dynamic`・`C4Deployment` を、要素を種類の行・名前・説明を持つノード、境界を破線のグループ、配置先のノードを実線のグループにして構成図の部品の上に描き、外部の要素を灰色の面と種類の行で描き分ける。
args:
  - name: layout
    type: オブジェクト
    required: true
    description: '自動配置の結果（`MapLayout`）。要素はノード、境界と配置先のノードはグループ。関係のラベルは「{ラベル} [{技術}]」で、`C4Dynamic` は前に「{番号}: 」を付ける'
  - name: layout.nodes[].c4Kind
    type: 列挙
    required: true
    choices: person・system・system_db・system_queue・container・container_db・container_queue・component・component_db・component_queue
    description: 要素の種類。`person` は人のアイコン、`*_db` はデータベースのアイコン、`*_queue` は角の丸い横長の形状。種類の行は `[Person]`・`[Software System]`・`[Container]`・`[Component]`
  - name: layout.nodes[].technology
    type: 文字列
    required: false
    default: なし（種類の行に技術を出さない）
    description: 'コンテナ・コンポーネントの技術の引数。種類の行を `[Container: {技術}]` のように種類と技術にする'
  - name: layout.nodes[].external
    type: 真偽値
    required: false
    default: 'false'
    description: '`_Ext` の要素。灰色の面で描き、種類の行を `[External Person]`・`[External Container: {技術}]` のように `External` を付ける'
  - name: layout.nodes[].description
    type: 文字列
    required: false
    default: なし（出さない）
    description: 要素の説明の引数。名前の下に小さい文字で出す
  - name: layout.groups[].c4Boundary
    type: 列挙
    required: true
    choices: enterprise・system・container・boundary・deployment
    description: 境界の種類。`deployment`（`Deployment_Node`・`Node`・`Node_L`・`Node_R`）は実線、ほかは破線の枠で描き、タイトルの後ろに `enterprise` は `［Enterprise］`、`system` は `［Software System］`、`container` は `［Container］`、`deployment` は種類の引数を「［{種類}］」で付ける（種類の引数が無ければ付けない）。`boundary` は種類を付けない
  - name: collapsed
    type: 配列
    required: false
    default: '[]'
    description: 閉じた境界・配置先のノードの ID。名前の行の下の行に「要素 {数} 件」（入れ子の配置先のノードの中の要素を含む）を出す
  - name: entered
    type: 文字列
    required: false
    default: なし（全体）
    description: 中へ入った境界の ID。構成図の部品と同じ
  - name: selected
    type: 配列
    required: false
    default: '[]'
    description: 選んだ要素の ID。構成図のノードと同じく、つながる関係と相手・最短の経路を残す
  - name: focus
    type: オブジェクト
    required: false
    default: なし（薄くしない）
    description: 案内・再生・線のホバーで強調する要素と関係。構成図の部品と同じ。C4Dynamic の関係の再生では、再生している関係の線と両端の要素（閉じた境界の中の要素はその境界）を強調し、同じ 2 つの要素の間のほかの線も薄くする。その関係のラベルがほかのラベルとの重なりで隠れていたときは、線の中ほどに出し、重なる薄くしたラベルを隠す
  - name: packets
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: データの印を流す関係（線）。構成図の部品と同じ。`BiRel` は両方へ流す
  - name: hints
    type: 真偽値
    required: false
    default: 'true'
    description: '`false` のとき、要素・境界の説明のマーカーを配置せず、関係の押せる帯に `aria-describedby` を付けない（要素の説明の引数は描く）'
  - name: terms
    type: オブジェクト
    required: false
    default: なし（下線を付けない）
    description: 用語から意味への対応。要素の名前・説明の中の用語を `span.mdmark-term` にする（境界のタイトルは押せる要素のため付けない）
events:
  - name: 開閉する・中へ入る
    when: 境界の山形・タイトルのボタンを押す
    value: 境界の ID
    description: 構成図の部品と同じ
  - name: 選ぶ
    when: 要素の名前と説明の文字の外を押す。要素にフォーカスして Enter か Space を押す
    value: 要素の ID（別名）
    description: '`mount` が `selected` を切り替える'
  - name: 線を指す
    when: 関係の線にポインターを乗せるかフォーカスする。離す
    value: 線の ID
    description: 構成図の部品と同じ
uses:
  - component: CMP-472-5#
    how: ノード・グループ・線の描き方と、開閉・中へ入る・選択・強調・データの印・移動
  - component: CMP-472-38#
    how: 要素・境界・関係の説明
accessibility:
  - 要素のノードは構成図のノードと同じく押せる要素がフォーカスを受け、種類の行・名前・説明を読み上げの対象にする。外部の要素を灰色だけでなく種類の行の `External` でも伝える
  - 境界の破線の枠と配置先のノードの実線の枠は、種類をタイトルの「［{種類}］」でも伝える
  - 関係の押せる帯は `aria-label="{元}から{先}への線"`（`BiRel` は「{元}と{先}の間の線」）を持つ
refs:
  - IF-472-35#constraints[map の C4 図]
status: planned
