id: CMP-472-18
visibility: internal
title: "コードブロック"
implementation: "src/parts/code-block.ts#renderCodeBlock"
story: "Parts/CodeBlock"
states:
  - name: TitleAndLineNumbers
    description: タイトル・行番号・2 行目の強調
    args:
      - name: language
        value: ts
      - name: title
        value: app.ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(document.querySelector(\"#doc\"), await doc.text());"}]'
  - name: LineStart
    description: '`lineStart` が 10 の行番号。行番号が 10〜12 で、11〜12 行目を強調し、桁の数の幅を 2 桁で取る'
    args:
      - name: language
        value: ts
      - name: title
        value: src/app.ts の抜粋
      - name: lineNumbers
        value: 'true'
      - name: lineStart
        value: '10'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(document.querySelector(\"#doc\"), await doc.text());","kind":"highlight"}]'
  - name: LineMarks
    description: 削除した行・追加した行・強調・マーカーの無い行。マーカーの無い行もマーカーの列の幅を空けて文字の頭の位置を合わせる
    args:
      - name: language
        value: ts
      - name: lines
        value: '[{"text":"let count = 0;","kind":"del"},{"text":"let count = 1;","kind":"add"},{"text":"count += 1; // 数える","kind":"highlight"},{"text":"console.log(count);"}]'
  - name: TitleOnly
    description: タイトルだけ。行に分けず今の `pre` のまま描く
    args:
      - name: language
        value: yaml
      - name: title
        value: mdmark.config.yaml
      - name: lines
        value: '[{"text":"features:"},{"text":"  code: true"},{"text":"  print: true"}]'
  - name: TwoDigits
    description: 13 行で 2 桁の行番号と空の行、9〜10 行目の強調。空の行も 1 行の高さを取る
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"const element = document.querySelector(\"#doc\");"},{"text":"const response = await fetch(\"/README.md\");"},{"text":"const markdown = await response.text();"},{"text":""},{"text":"const config = {"},{"text":"  features: {"},{"text":"    code: true,","kind":"highlight"},{"text":"    print: true,","kind":"highlight"},{"text":"  },"},{"text":"};"},{"text":"mount(element, markdown, config);"}]'
  - name: LongLineAndTitle
    description: 幅を超えるタイトルと行。タイトルは帯の中で折り返し、行はブロックの中で横にスクロールして行の地を最も長い行の右端まで敷く
    args:
      - name: language
        value: ts
      - name: title
        value: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"const url = \"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.6.0/dist/index.js\";"},{"text":"export const decorate = (tokens: Token[], options: { title?: string; lines: boolean; highlight: number[] }) => tokens;","kind":"del"},{"text":"export const decorate = (tokens: Token[], options: CodeBlockOptions, warnings: SyntaxWarning[]): Token[] => applyCodeBlockOptions(tokens, options, warnings);","kind":"add"}]'
  - name: SyntaxPlain
    description: ts の色分け。タイトルも行番号も行の種類も無いため、行に分けない `pre` の `code` の中身を色分けする
    args:
      - name: language
        value: ts
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"// 文書を描く"},{"text":"const element: HTMLElement | null = document.querySelector(\"#doc\");"},{"text":"mount(element, `# 見出し ${300}`, { features: { syntax: true } });"}]'
  - name: SyntaxWithLineMarks
    description: タイトル・行番号・削除した行・追加した行・強調と色分け。行番号・行頭の `+`・`-`・行の地と左端の線はそのままに、行の中身だけが色分けされる
    args:
      - name: language
        value: ts
      - name: title
        value: app.ts
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"const limit = 100;","kind":"del"},{"text":"const limit = 300;","kind":"add"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(element, await doc.text());"}]'
  - name: SyntaxMultilineToken
    description: 行をまたぐブロックコメントとテンプレート文字列を、行番号を付けて色分けする。色の `span` を行の切れ目で閉じて次の行でもう一度開き、どの行もコメント・文字列の色のまま 1 行ずつ並ぶ
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"/*"},{"text":" * 文書を描く"},{"text":" */"},{"text":"const markdown = `# 見出し"},{"text":"本文 ${count}"},{"text":"`;","kind":"highlight"}]'
  - name: SyntaxPython
    description: 行コメントの頭が `#` の python の色分け。デコレーター・コメント・文字列・数値・組み込みの関数がそれぞれの色になる
    args:
      - name: language
        value: python
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"@dataclass"},{"text":"class Doc:"},{"text":"    # 文書のタイトル"},{"text":"    title: str = \"README\""},{"text":"    lines: int = 300"},{"text":""},{"text":"print(len(Doc().title))"}]'
  - name: LanguageLabel
    description: タイトルも行のマーカーも持たない ts のコードブロック。帯の左端の上端に `ts` のタブ、右端に `コピー` のボタン。帯は本文と同じ地で、帯と本文の間に線が無い
    args:
      - name: language
        value: ts
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"mount(document.querySelector(\"#doc\"), \"# 見出し\");"}]'
  - name: FileName
    description: '```python:hoge.py のコードブロック。帯の左端に `python` と、縦線で区切った `hoge.py`'
    args:
      - name: language
        value: python
      - name: fileName
        value: hoge.py
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"def hello():"},{"text":"    print(\"hello\")"}]'
  - name: LongFileName
    description: 帯の幅を超えるファイル名とタイトル。ファイル名とタイトルは帯の中で折り返し、コピーのボタンは右端に残る
    args:
      - name: language
        value: ts
      - name: fileName
        value: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      - name: title
        value: 色分けの対象を探す
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"export const findTargets = (root: Element) => root.querySelectorAll(\"code[data-mdmark-syntax]\");"}]'
  - name: NoLanguage
    description: 言語の無いコードブロック。言語のラベルを出さず、帯はコピーのボタンだけを持つ
    args:
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"npm install mdmark"}]'
  - name: Copied
    description: コードをコピーした。ボタンが `コピーしました`（`check` のアイコン）
    args:
      - name: language
        value: ts
      - name: copyState
        value: copied
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"}]'
  - name: CopyFailed
    description: コードをコピーできなかった。ボタンが `コピーできませんでした`（`circle-alert` のアイコン）
    args:
      - name: language
        value: ts
      - name: copyState
        value: failed
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"}]'
  - name: Focus
    description: '`[!code focus]` の 3〜4 行目。ほかの行を薄くし、ポインターを乗せるかフォーカスすると全ての行を戻す'
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","indent":1},{"text":"  for (const block of parse(markdown)) {","kind":"focus","indent":1,"foldLines":4},{"text":"    if (block.kind === \"table\") {","kind":"focus","indent":2,"foldLines":1},{"text":"      attachTable(block, config.features);","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
  - name: ErrorWarning
    description: '`[!code warning]` の 2 行目と `[!code error]` の 5 行目。地と左の線の色に加え、行頭の `!`・`×` で示す'
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","kind":"warning","indent":1},{"text":"  for (const block of parse(markdown)) {","indent":1,"foldLines":4},{"text":"    if (block.kind === \"table\") {","indent":2,"foldLines":1},{"text":"      attachTable(block, config.features);","kind":"error","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
  - name: Foldable
    description: 畳める行を持ち、全て開いた状態。インデントのレベルごとに縦線を描き、開閉のボタンはポインターを乗せた行だけに出す
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","indent":1},{"text":"  for (const block of parse(markdown)) {","indent":1,"foldLines":4},{"text":"    if (block.kind === \"table\") {","indent":2,"foldLines":1},{"text":"      attachTable(block, config.features);","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
  - name: FoldColumnHovered
    description: ポインターが開閉のボタンの列に乗っている。そのコードブロックの畳める全ての行の開閉のボタンを出す
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","indent":1},{"text":"  for (const block of parse(markdown)) {","indent":1,"foldLines":4},{"text":"    if (block.kind === \"table\") {","indent":2,"foldLines":1},{"text":"      attachTable(block, config.features);","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
      - name: foldColumnHovered
        value: 'true'
  - name: Folded
    description: '`fold` の `[3]` で 3 行目を畳んだ状態。3 行目の開閉のボタンを常に出し、行の後ろに `⋯` のボタン。閉じ括弧の 8 行目は残す'
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","indent":1},{"text":"  for (const block of parse(markdown)) {","indent":1,"foldLines":4,"folded":true},{"text":"    if (block.kind === \"table\") {","indent":2,"foldLines":1},{"text":"      attachTable(block, config.features);","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
  - name: FoldNested
    description: 1 行目を Shift を押しながら畳み、1 行目だけを開いた状態。内側の 3・4・9 行目は畳んだまま
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"export function mount(element, markdown, options = {}) {","foldLines":10},{"text":"  const config = withDefaults(options);","indent":1},{"text":"  for (const block of parse(markdown)) {","indent":1,"foldLines":4,"folded":true},{"text":"    if (block.kind === \"table\") {","indent":2,"foldLines":1,"folded":true},{"text":"      attachTable(block, config.features);","indent":3},{"text":"    }","indent":2},{"text":"    element.append(render(block));","indent":2},{"text":"  }","indent":1},{"text":"  return () => {","indent":1,"foldLines":1,"folded":true},{"text":"    element.replaceChildren();","indent":2},{"text":"  };","indent":1},{"text":"}"}]'
  - name: FoldNoLineNumbers
    description: 行番号の無い YAML の畳んだ行。開閉のボタンを行の頭の余白に配置する
    args:
      - name: language
        value: yaml
      - name: lines
        value: '[{"text":"version: \"0.9\""},{"text":"features:","foldLines":2},{"text":"  table: true","indent":1},{"text":"  diagram: true","indent":1},{"text":"libraries:","foldLines":3},{"text":"  highlight:","indent":1,"foldLines":2,"folded":true},{"text":"    url: https://cdn.jsdelivr.net/npm/highlight.js","indent":2},{"text":"    version: 11.11.1","indent":2},{"text":"build:","foldLines":1},{"text":"  - docs/使用方法/導入/README.md","indent":1}]'
  - name: Wrap
    description: '`wrap` と行番号を持ち、2 行目が枠の幅より長い。長い行は枠の幅で折り返し、行番号は折り返した行の 1 行目にだけ出す。ブロックに横スクロールが出ない（合意したモック `docs/mock/refs/328/assets/wrap.css`）'
    args:
      - name: language
        value: ts
      - name: title
        value: app.ts
      - name: lineNumbers
        value: 'true'
      - name: wrap
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"const url = \"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.10.0/dist/index.js\"; // バージョンを固定した URL から配布物を読み込み、描く先の要素に文書を描く"},{"text":"mount(document.querySelector(\"#doc\"), markdown);"}]'
lead: 左端に言語のラベルとタイトル、右端にコピーのボタンを配置した帯と、行番号・行の強調・追加した行と削除した行・注目する行・エラーと警告の行と、インデントの縦線・行の開閉と、言語に応じた色分けを付けたコードブロック。
args:
  - name: language
    type: 文字列
    required: false
    default: 空（言語の無いコードブロック）
    description: '情報文字列の最初の単語の、最初の `:` より前。`code` の class `language-{言語}` と、帯の左端の言語のラベルと、タイトルもファイル名も無いときのスクリーンリーダー向けの名前 `コード: {言語}` に使用する。空のときはラベルを出さない'
  - name: title
    type: 文字列
    required: false
    default: 空（タイトルを出さない）
    description: 'タイトル。空でなければコードブロックを `figure` で囲み、帯を `figcaption` にして言語のラベルの後ろに出し、`pre` のスクリーンリーダー向けの名前を `コード: {タイトル}` にする'
  - name: lineNumbers
    type: 真偽値
    required: false
    default: 'false'
    description: 行の左に `lineStart` から始まる行番号を出すか
  - name: lineStart
    type: 整数
    required: false
    default: '1'
    enabled_when: '`lineNumbers` が `true` のとき'
    description: 最初の行の番号（マーカーの `lines.start`）。`data-line` と、行番号の桁の数（`--mdmark-code-digits`。最後の行の番号の桁の数）に使用する
    status: planned
  - name: lines
    type: オブジェクトの配列
    required: true
    description: コードの行（`{ text, kind, indent, foldLines, folded }`）。`text` はマーカーを削除した行の文字、`kind` は `add`・`del`・`highlight`・`focus`・`error`・`warning` か空、`indent` はインデントのレベル（`data-indent`）、`foldLines` は畳める行の後ろの畳む行の数（`data-fold-lines`）、`folded` は畳んだ状態か（`fold=` の行は `data-folded`。`mount` が後ろの `foldLines` の行を `hidden` にし、行の末尾に `⋯` のボタンを配置する）
  - name: foldColumnHovered
    type: 真偽値
    default: 'false'
    description: ポインターが開閉のボタンの列（行番号の右の `--mdmark-code-fold-width` の幅。行番号を持たないときは行の頭の同じ幅）に乗っているか（`mount` が付けた状態）。`true` のとき `pre` に `data-fold-hover` を付け、畳める全ての行の開閉のボタンを出す。`mount` は `pre` の `pointermove`（ポインターの横の位置が列にあるか）と `pointerleave` で付け外しする
  - name: highlight
    type: 真偽値
    default: 'false'
    description: ストーリーで色分けした後の外観を出すか。部品の HTML は色分けを持たず、`mount` が描いた後に行の中身 `mdmark-code-text`（行に分けないときは `code`）を色分けした HTML に置き換える。部品の描画のインターフェースはこの引数が `true` のとき、`language` の言語で同じ置き換えを適用してから返却する
    status: planned
  - name: syntax
    type: 文字列
    required: false
    default: 空
    description: 色分けする言語のモジュール名（`typescript`・`yaml` など）。指定すると `code` に `data-mdmark-syntax="{モジュール名}"` を付け、`mount` が色分けする対象をこの属性で探す。外観は変えない
    status: planned
  - name: fileName
    type: 文字列
    default: 空（ファイル名を出さない）
    enabled_when: '`language` が空でないとき'
    description: '情報文字列の最初の単語の、最初の `:` より後ろ（```python:hoge.py の `hoge.py`）。言語のラベルの言語の後ろに細い縦線で区切って本文の色で出し、長い名前は帯の中で折り返す。タイトルが無いときはスクリーンリーダー向けの名前を `コード: {ファイル名}` にする'
  - name: copyState
    type: 列挙
    default: なし（コピーのボタンを付けない）
    choices: '`idle`（`コピー`、`copy` のアイコン）・`copied`（`コピーしました`、`check`）・`failed`（`コピーできませんでした`、`circle-alert`）'
    description: 帯の右端のコピーのボタンの状態（`mount` が付けた状態）。指定するとボタンと `role="status"` の要素を配置し、ボタンの `data-state` と文言・アイコンを切り替える。`copied`・`failed` のときは `role="status"` の要素に `コードを{文言}` を入れる
  - name: wrap
    type: 真偽値
    required: false
    default: 'false'
    description: '`<!-- code: {"wrap": true} -->` を持つか。`true` のとき `pre` に class `mdmark-code-lines mdmark-code-wrap` を付け、長い行を枠の幅で折り返す。行番号と行頭の `+`・`-` は折り返した行の 1 行目にだけ出す。`false` のときは折り返さず、利用側の `pre` への汎用の CSS でも折り返さない'
css_properties:
  - name: --mdmark-color-code-highlight-bg
    syntax: <color>
    default: '#fef3c7（ダーク #5c4a12）'
    description: 強調した行の地の色
  - name: --mdmark-color-code-highlight-line
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 強調した行の左端の線の色
  - name: --mdmark-color-diff-add-bg
    syntax: <color>
    default: '#e1ede2'
    description: 追加した行の地の色（差分の表示と共通）
  - name: --mdmark-color-diff-add-sign
    syntax: <color>
    default: '#15803d'
    description: 追加した行の行頭の `+` と左端の線の色（差分の表示と共通）
  - name: --mdmark-color-diff-del-bg
    syntax: <color>
    default: '#fbe6e3'
    description: 削除した行の地の色（差分の表示と共通）
  - name: --mdmark-color-diff-del-sign
    syntax: <color>
    default: '#b91c1c'
    description: 削除した行の行頭の `-` と左端の線の色（差分の表示と共通）
  - name: --mdmark-color-error
    syntax: <color>
    default: 値は docs/design-policy.md
    description: エラーの行の左端の線と行頭の `×` の色。地はこの色を `--mdmark-color-bg` に 12% 混ぜた色
  - name: --mdmark-color-callout-warning
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 警告の行の左端の線と行頭の `!` の色。地はこの色を `--mdmark-color-bg` に 14% 混ぜた色
  - name: --mdmark-code-fold-width
    syntax: <length>
    default: 2.75ch
    description: 畳める行を持つコードブロックで、行番号の右に取る開閉のボタンの列の幅
  - name: --mdmark-color-syntax-keyword
    syntax: <color>
    default: '#6d28d9（ダーク #d6c2ff）'
    description: 色分けのキーワード（予約語・デコレーター・`document` や `self` などの言語の変数）の色
  - name: --mdmark-color-syntax-string
    syntax: <color>
    default: '#166534（ダーク #4ade80）'
    description: 色分けの文字列（文字列・正規表現・エスケープ・Markdown のリンクの文字）の色
  - name: --mdmark-color-syntax-number
    syntax: <color>
    default: '#92400e（ダーク #fbbf24）'
    description: 色分けの数値（数値・`true`・`false`・`null`・YAML と Markdown の箇条書きの `-`）の色
  - name: --mdmark-color-syntax-type
    syntax: <color>
    default: '#be185d（ダーク #fbb6db）'
    description: 色分けの型（型・クラス名・組み込みの関数と型・HTML のタグ名・CSS のセレクター）の色
  - name: --mdmark-color-syntax-name
    syntax: <color>
    default: '#1d4ed8（ダーク #a8c1ff）'
    description: 色分けの名前（関数名・オブジェクトと YAML と JSON のキー・HTML の属性・CSS のプロパティ・Markdown の見出し）の色
  - name: --mdmark-color-syntax-comment
    syntax: <color>
    default: '#52525b（ダーク #c8c8cf）'
    description: 色分けのコメントの色。コメントは斜体でも示す
accessibility:
  - '`pre` は `tabindex="0"` とスクリーンリーダー向けの名前（タイトルがあれば `コード: {タイトル}`、ファイル名があれば `コード: {ファイル名}`、言語があれば `コード: {言語}`、どれも無ければ `コード`）を持ち、キーボードで横にスクロールできる'
  - 言語のラベルの言語は `aria-hidden="true"` でスクリーンリーダーに伝えず（`pre` の名前が持つ）、ファイル名だけを読み込ませる。ラベルは選んで写す中身に入れない
  - コピーのボタンは文言をスクリーンリーダー向けの名前に持ち、結果を `role="status"` の要素で `コードをコピーしました`・`コードをコピーできませんでした` とスクリーンリーダーに伝える。状態は文言とアイコンで示し、色だけに頼らない
  - 追加した行・削除した行・強調した行は、色に加えて左端の 2px の線（追加した行・削除した行は行頭の `+`・`-` も）で分ける。強調の線は隣り合う地の色と 3:1 以上
  - '行頭のマーカーは擬似要素の代わりの文字でスクリーンリーダーに伝える（追加した行は `追加した行`、削除した行は `削除した行`、強調した行は表示される文字を持たず `強調した行`）。代わりの文字を読み込めないブラウザ（Firefox 128・Safari 17.4 より前）でも行番号と `+`・`-` が出るよう、代わりの文字の無い `content` を先に記載し、代わりの文字付きの `content` を後ろに重ねる（例: `content: "+"; content: "+" / "追加した行";`）'
  - '行番号と行頭の `+`・`-` は擬似要素で出し、文字を選んで写す中身に入れない。行は `inline-block` で並べ、コピーした行の間に空行を入れない。空の行は `min-height: 1.55em` で高さを取る（`lh` 単位は対応ブラウザの一部で有効にならない）'
  - '注目する行を持つコードブロックは、ほかの行を不透明度 0.45 にし、ポインターを乗せるかフォーカスがあるときは全ての行を戻す（`prefers-reduced-motion: reduce` では移り変わりを付けない）。エラーと警告の行は、色に加えて左端の線と行頭の `×`・`!` で分け、行頭の文字は代わりの文字で `エラーの行`・`警告の行` とスクリーンリーダーに伝える'
  - '開閉のボタンは `aria-expanded`・`aria-controls` と `{n} 行目から {m} 行目` のスクリーンリーダー向けの名前を持ち、Enter・Space で開閉する。`⋯` のボタンは `{n} 行目から {m} 行目を展開` をスクリーンリーダー向けの名前に持つ。ポインターで乗せられない端末（`hover: none`）では開閉のボタンを常に出す'
  - インデントの縦線は CSS で引き、スクリーンリーダーと選んで写す中身に入れない
  - 印刷では行を折り返し、行番号は折り返した最初の 1 行にだけ出す。タイトル・言語のラベル・行番号・強調・行の色と `+`・`-` はそのまま出し、コピーのボタンは出さない。畳んだ行は開いて出し、開閉のボタンと `⋯` は出さず、注目する行のほかの行も薄くしない
  - 色分けは外観だけで、スクリーンリーダー向けの名前とコードの文字は変わらない。コメントは色に加えて斜体でも示す。色分けの 6 色は、地（`--mdmark-color-surface` と、追加した行・削除した行・強調した行の半透明の地を混ぜた色）に対して明るい配色で 5.21〜7.03、ダークで 6.56〜10.64（WCAG の相対輝度で計算）
  - '印刷ではダークを解除した明るい配色の色分けの色を、`print-color-adjust: exact` で色を省くブラウザの設定でも紙に出す'
