id: CMP-472-22
visibility: internal
title: "タブ"
implementation: "src/parts/tabs.ts#renderTabs"
story: "Parts/Tabs"
test_file: tests/integration/lib/tabs.story.test.ts
states:
  - name: First
    description: 1 つ目のタブを選んだ
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '0'
  - name: Second
    description: 2 つ目のタブを選んだ
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '1'
  - name: Many
    description: タブが多く、タブ名が長い。タブの並びが折り返す
    args:
      - name: titles
        value: '["macOS","Windows","Linux","FreeBSD","とても長いタブ名で並びの幅を超えるもの","Android","iOS"]'
      - name: selected
        value: '0'
  - name: Unmounted
    description: '`render` が出した状態。全ての中身がタブ名をタイトルにして縦に並ぶ（印刷もこの見え方）'
    args:
      - name: titles
        value: '["macOS","Windows"]'
  - name: Grouped
    description: 組 `os` を持ち、1 つ目のタブを選んだ。外観は First と同じで、`data-group` を持つ
    screenshot: false
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '0'
      - name: group
        value: os
  - name: Closed
    description: 閉じたタブ（`closed`）。見出し `タブ（uv・pip）` だけが見える
    args:
      - name: titles
        value: '["uv","pip"]'
      - name: selected
        value: '0'
      - name: collapse
        value: closed
  - name: OpenTitle
    description: 開いたタブと `collapse.title`。見出し `入れ方` の下にタブの並びと 1 つ目の中身が見える
    args:
      - name: titles
        value: '["macOS","Windows"]'
      - name: selected
        value: '0'
      - name: collapse
        value: open
      - name: title
        value: 入れ方
  - name: Nested
    description: 入れ子のタブ。外側（macOS・Windows）は Windows を選び、その中身に内側のタブ（PowerShell・WSL）を配置して PowerShell を選んだ。内側も外側と同じ外観で、外側の中身の上と間を空ける
    args:
      - name: titles
        value: '["macOS","Windows"]'
      - name: selected
        value: '1'
    notes:
      中身: 2 つ目の中身に、`titles` が `["PowerShell","WSL"]`・`selected` が `0` のタブを配置する
  - name: StrongTitle
    description: 見出しの `**` の強調を持つタブ名。選んでいないタブでも `strong` を `--mdmark-tab-strong-color` と `--mdmark-tab-strong-weight` で強調する
    args:
      - name: titles
        value: '["<strong>案 A</strong> SVG のまま","<strong>案 B</strong> Chart.js"]'
      - name: selected
        value: '0'
lead: '`<!-- tabs -->` の範囲を見出しで区切った中身を、見出しの文字をタブ名にしたタブで切り替えて見せる。`render` は全ての中身を順に出し、`mount` がタブの並びを付ける。URL の `#ID` が選ばれていないタブの中の要素を指すときは、`mount` がそのタブを選んでから要素へ移る。'
args:
  - name: titles
    type: 配列
    required: true
    description: タブ名（区切りの見出しの行内の HTML。`**` の強調は `strong` のまま。リンク（`a`）はタブのボタンでは中身の文字にし、中身のタブ名には残す）を並んだ順に
  - name: selected
    type: 整数
    required: false
    default: なし（タブの並びを付けず、全ての中身を順に出す）
    description: 選んだタブの位置（0 から）。指定すると `role="tablist"` の並びを付け、選んだタブの中身だけを出す（`mount` が付けた状態）
  - name: group
    type: 文字列
    required: false
    default: なし（組を持たず、他のタブと統一しない）
    description: タブの組の名前。指定すると `mdmark-tabs` に `data-group` を付ける。同じ組のタブの選択を統一し、選んだタブ名を覚えるのは `mount` の操作
  - name: collapse
    type: 列挙
    required: false
    default: none
    choices: '`none`・`closed`・`open`'
    description: タブを折り畳みに入れるかと、既定の開閉
    status: planned
  - name: title
    type: 文字列
    required: false
    default: なし（`タブ（{タブ名を・で並べたもの}）`）
    enabled_when: '`collapse` が `closed`・`open` のとき'
    description: 折り畳みの見出し（`collapse.title` の値）。`summary` の文字にする
    status: planned
slots:
  - name: default
    description: タブごとの中身（区切りの見出しから次の見出しの前までの HTML）。入れ子のタブの `mdmark-tabs` も配置できる
    passes: タブの位置
events:
  - name: タブを選ぶ
    when: タブを押すか、タブにフォーカスがあるときに左右の矢印・Home・End を押す
    value: 選んだタブの `aria-selected`
    description: '`mount` が選んだタブの中身だけを出し、ほかを `hidden` にする。`data-group` を持つときは、ページの同じ `data-group` で同じタブ名を持つ `mdmark-tabs` もそのタブ名へ切り替え、タブ名を localStorage に残す'
  - name: URL の ID でタブを選ぶ
    when: URL の `#ID` が選ばれていないタブの中身（入れ子のタブを含む）の中の要素を指す（描いたときと `hashchange`）
    value: URL の `#ID`
    description: '`mount` が外側のタブから順にその要素を含むタブを選び、外側の閉じたセクション（要素が見出しなら見出し自身の閉じたセクションも）を開いてから要素へスクロールする。描いたときは localStorage に残したタブ名より URL の ID を優先し、URL の ID で選んだタブは localStorage に残さず、同じ `data-group` のほかのタブも切り替えない'
css_properties:
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: 選んだタブを囲む線と、中身の枠の線の色
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: 選んだタブと中身の地の色
  - name: --mdmark-color-heading
    syntax: <color>
    default: '#18181b（ダーク #ededef）'
    description: 選んだタブの文字の色
  - name: --mdmark-tab-strong-weight
    syntax: <number>
    default: '700'
    description: タブ名の `strong` の太さ
  - name: --mdmark-tab-strong-color
    syntax: <color>
    default: var(--mdmark-color-heading)
    description: タブ名の `strong` の色。選んでいないタブでもこの色にする
accessibility:
  - WAI-ARIA のタブの作法に従う。並びは `role="tablist"`、タブは `role="tab"` と `aria-selected`・`aria-controls`、中身は `role="tabpanel"` と `aria-labelledby`
  - 選んだタブだけが `tabindex="0"`、ほかは `-1`。左右の矢印・Home・End で移って選ぶ。入れ子のタブはそれぞれ別の `tablist` で、矢印・Home・End はフォーカスのある並びの中だけで移り、内側を選んでも外側の選択を変えない
  - 選んだタブは線で囲んで中身の地とつなぎ、形状と地の色でも示し、色だけに頼らない
refs:
  - IF-472-34#constraints[タブ]
  - IF-472-35#constraints[タブの操作]
status: planned
notes:
  HTML: '`render` は `<div class="mdmark-tabs"><div class="mdmark-tab-panel"><p class="mdmark-tab-title">{タブ名}</p>{中身}</div>…</div>` を出し、`group` を指定すると外側の `div` に `data-group="{group}"` を付ける。`selected` を指定すると頭に `<div class="mdmark-tablist" role="tablist"><button class="mdmark-tab" type="button" role="tab">{タブ名}</button>…</div>` を配置し、中身を `role="tabpanel"` にして選んだもの以外に `hidden` を付ける。`collapse` が `closed`・`open` のときは `mdmark-tabs` を `<details class="mdmark-collapsible"><summary>{title}</summary>` に入れる（`open` のときは `details` に `open` を付ける）。見出しの外観は表の `mdmark-table-details` と同じ。モックは `docs/mock/components/tabs/`'
