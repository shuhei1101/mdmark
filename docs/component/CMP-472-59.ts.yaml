id: CMP-472-59
visibility: internal
title: 蛍光ペン
lead: '`==文字==` を、文字に色の面を敷いた蛍光ペンのマーカーにする。色の名前を指定するとその色の面にする。'
implementation: src/parts/highlight.ts#renderHighlight
story: Parts/Highlight
test_file: tests/integration/lib/highlight.story.test.ts
args:
  - name: html
    type: 文字列
    required: true
    description: マーカーの中身の行内の HTML
  - name: color
    type: 列挙
    required: false
    default: なし（既定の黄色の面）
    choices: '`blue`・`red`・`green`・`yellow`・`orange`・`purple`・`gray`'
    description: '`data-color` に入れる色の名前。面を `--mdmark-color-accent-{色}-bg` にする'
states:
  - name: Default
    description: 色を指定しない
    args:
      - name: html
        value: 決め手
  - name: Colored
    description: '`{color=green}`'
    args:
      - name: html
        value: 例外
      - name: color
        value: green
  - name: Long
    description: 行をまたぐ長い中身。行ごとに面を敷く
    args:
      - name: html
        value: とても長い強調の文字で行の幅を超えて次の行へ折り返すときの見え方を確認する
  - name: Dark
    description: 暗い配色
    args:
      - name: html
        value: 決め手
      - name: color
        value: yellow
    notes:
      定義: ストーリーは暗い配色で描く
css_properties:
  - name: --mdmark-highlight-bg
    syntax: <color>
    default: var(--mdmark-color-accent-yellow-bg)
    description: 色を指定しない蛍光ペンの面の色
accessibility:
  - 文字と面の色のコントラストを 4.5:1 以上にする
  - '`mark` 要素で、色だけで意味を持たせない'
refs:
  - IF-472-34#constraints[蛍光ペン]
status: planned
notes:
  HTML: '`<mark class="mdmark-highlight" data-color="{color}">{html}</mark>`（`color` が無いときは `data-color` を付けない）。コメントの `mark.mdmark-comment-mark` とは class で分ける。モックは `docs/mock/components/highlighter/`'
