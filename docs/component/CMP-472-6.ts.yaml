id: CMP-472-6
visibility: internal
title: "mermaid の図"
implementation: "src/parts/mermaid.ts#renderMermaidDiagram"
story: "Parts/MermaidDiagram"
states:
  - name: Flowchart
    description: flowchart。front matter の `title` を図の中に重ねない。ノードの塗り・枠線・文字・線の色が CSS 変数の色で、グラデーションと影が無い
    notes:
      定義: モックの「通常（flowchart）」（`docs/mock/components/mermaid-diagram/`）
  - name: Sequence
    description: シーケンス図。actor が lucide の人のアイコンで、本文の色の線で描かれ、参加者のノードに影が無い
    notes:
      定義: モックの「シーケンス図・案 A」
  - name: Class
    description: クラス図
    notes:
      定義: モックの「タイトルが無い」
  - name: State
    description: 状態遷移図。開始と終了のマーカーが本文の色
    notes:
      定義: モックの「そのほかの種類」の stateDiagram-v2
  - name: Er
    description: ER 図
    notes:
      定義: モックの「そのほかの種類」の erDiagram
  - name: Gantt
    description: ガントチャート。720px の幅で描いた図を、狭い枠では全体が収まる倍率の下限 0.75 で止め、収まらない分を枠の中で動かす
    notes:
      定義: モックの「そのほかの種類」の gantt
  - name: Pie
    description: 円グラフ。扇形をグラフの系列の色で分け、不透明で塗る
    notes:
      定義: モックの「そのほかの種類」の pie
  - name: DarkWithPrint
    description: 暗い配色の図と、印刷のための明るい配色の図を並べた。画面では暗い配色の図だけ、`@media print` では明るい配色の図だけが見える
    args:
      - name: printSvg
        value: 明るい配色で描いた Flowchart と同じ図の SVG
    notes:
      定義: Flowchart と同じ。ストーリーは描く先の祖先に `mdmark-theme-dark` を付ける
lead: 図の枠の表示する枠に入れる、mermaid で描いた SVG。SVG は mdmark の CSS 変数から作ったテーマで描かれる。
args:
  - name: svg
    type: 文字列
    required: true
    description: '`mount` が mermaid の `render` で描き、actor のアイコンを替えて SVG の filter の影を削除した SVG。今の配色の図として表示する枠に配置する'
  - name: printSvg
    type: 文字列
    required: false
    description: 暗い配色で描くときに、明るい配色のテーマでも描いた SVG。`svg` の後ろに配置し、画面では隠して `@media print` でだけ出す（`svg` は `@media print` で隠す）。明るい配色で描くときは指定しない
  - name: width
    type: 数値
    required: false
    description: SVG を描いた幅（px）。ガントチャートは描く先の幅と 720 の大きいほう。指定しないときは SVG の `viewBox` の幅
css_properties:
  - name: --mdmark-color-text
    syntax: <color>
    default: '#18181b（ダーク #ececef）'
    description: actor の人のアイコンの線と、状態遷移図の開始・終了のマーカーの色
accessibility:
  - SVG は mermaid が付ける `role="graphics-document document"`・`aria-roledescription`（図の種類）を持ち、`accTitle`・`accDescr` を `title`・`desc` で持つ
  - '`printSvg` は `aria-hidden="true"` を持ち、同じ図を 2 回スクリーンリーダーに伝えない'
  - ノード・ラベルの文字は SVG の文字のまま選べ、スクリーンリーダーに出る
  - 色だけで意味を伝える図（円グラフ）は、mermaid が描く凡例とラベルに名前と値を出す
status: planned
introduced:
  pr: 382
refs:
  - IF-472-35#constraints[mermaid の描き方]
  - IF-472-35#constraints[mermaid のテーマ]
notes:
  ストーリーの SVG: Storybook のストーリーは Node で HTML を返却するため、mermaid をストーリーの中で動かさない。モックと同じソースを `mount` が描いた SVG を、テストの準備で書き出したファイルとして指定する。ストーリーは図の枠（種類 `mermaid`）で包んで出し、題名はモックの場面のタイトル（front matter の `title` か図の種類の名前）にする
test_file: tests/integration/lib/mermaid-diagram.story.test.ts
