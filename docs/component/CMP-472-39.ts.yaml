id: CMP-472-39
visibility: internal
title: "図の枠"
implementation: "src/diagram/diagram.part.ts#renderDiagramFrame"
story: "Parts/DiagramFrame"
states:
  - name: Fit
    description: 開いたとき。全体が収まる倍率（倍率のボタンは 100%）で、右上のパネルは畳んで倍率のボタンと開閉のボタンだけを出す。表示する枠は `data-at-fit` を持ち、縦にスクロールしない
    notes:
      定義: 部品設計『グラフ』の SixSeries と同じグラフの定義
  - name: Zoomed
    description: 1 段拡大して位置を動かし、パネルを開いた。縮小・倍率・拡大・全画面・開閉のボタンが 1 行に並び、表示する枠は縦にもスクロールできる
    args:
      - name: zoom
        value: '1.25'
      - name: panelOpen
        value: 'true'
  - name: Max
    description: 上限（全体が収まる倍率の 5 倍。倍率のボタンは 500%）でパネルを開いた。拡大は押せない
    args:
      - name: zoom
        value: '5'
      - name: panelOpen
        value: 'true'
    notes:
      定義: 全体が収まる倍率が 1 の図で描く（`zoom` は定義の大きさを 1 とする値のため）
  - name: Narrow
    description: 狭い枠（幅 30rem 未満）で拡大してパネルを開いた。凡例を折り返し、パネルはボタンを 1.5rem 四方にして間を詰め、折り返さず 1 行に収める
    args:
      - name: zoom
        value: '0.6'
      - name: fit
        value: '0.48'
      - name: panelOpen
        value: 'true'
  - name: Fullscreen
    description: 全画面のモーダルの中。全画面のボタンの位置に閉じるボタンがある
    args:
      - name: modal
        value: 'true'
  - name: InFramedSurface
    description: '利用側の枠を持つ面の中。面で `--mdmark-diagram-box-shadow: none` を指定し、表示するノードの線が無い'
    notes:
      定義: 'ストーリーは図の枠を線と影を持つ面の要素で包み、面に `--mdmark-diagram-box-shadow: none` を指定する'
  - name: InFramedSurfaceFullscreen
    description: '枠を持つ面の中の図を全画面で開いたとき。面に指定した `--mdmark-diagram-box-shadow: none` を受け継がず、モーダルの中の表示するノードに既定の線がある'
    args:
      - name: modal
        value: 'true'
    notes:
      定義: '`InFramedSurface` と同じ面で包む'
  - name: Resized
    description: リサイズハンドルで表示する枠を低くした。全体が収まる倍率を幅と高さで求め、倍率のボタンは 100%
    args:
      - name: height
        value: "'240'"
  - name: ResizeHandleFocused
    description: リサイズハンドルにフォーカスした。フォーカスの枠が見える
  - name: ResizeOff
    description: 機能 `diagram-resize` がオフ。表示する枠の下端にリサイズハンドルが無い
    args:
      - name: resizable
        value: "'false'"
  - name: Mermaid
    description: 種類 `mermaid`。タイトルは題名だけで範囲と更新日を出さず、凡例の場所を取らない
    args:
      - name: kind
        value: mermaid
      - name: title
        value: 問い合わせの受付
      - name: legend
        value: "'[]'"
    notes:
      定義: 部品設計『mermaid の図』の Flowchart と同じ SVG
  - name: Map
    description: 種類 `map`。タイトルは題名だけで範囲と更新日と凡例が無く、置き場所の幅いっぱいで、開いたパネルの先頭に外へ戻る（押せない）・全て開く・全て閉じる・配置と選択を元に戻す（押せない）が並ぶ
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: panelOpen
        value: 'true'
    notes:
      定義: 部品設計『mapの構成図』の Default
  - name: ResizedToFit
    description: リサイズハンドルをダブルクリックした。倍率は変わらず、表示する枠の高さが今の倍率の図の全体が収まる高さになる
    args:
      - name: zoom
        value: '1.25'
  - name: MapInGroup
    description: 種類 `map` で外のグループの中へ入った。畳んだパネルに、外へ戻る（押せる）・倍率・開閉のボタンが並ぶ
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
    notes:
      定義: 部品設計『mapの構成図』の Default を、外のグループの中へ入った状態で描く。`tools` の外へ戻るは `disabled` が `false`
  - name: PlainMap
    description: 種類 `map` で、map の範囲の外の純粋な Mermaid を描いた図（`data-map-plain`）。front matter の `title` も `accTitle` も無いので、タイトルが図の種類の名前（シーケンス図）
    args:
      - name: kind
        value: map
      - name: title
        value: シーケンス図
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
    notes:
      定義: 部品設計『mapのシーケンス図』の Plain
  - name: SequenceHeadsStuck
    description: map のシーケンス図で、文書をスクロールして表示する枠の上端が画面の上端より上へ出た。参加者の行が画面の上端から `--mdmark-sticky-top` の位置に留まり、表示する枠の左と上の枠線が欠けない
    args:
      - name: kind
        value: map
    screenshot: false
    notes:
      定義: 部品設計『mapのシーケンス図』の HeadsStuck
  - name: Min
    description: 下限（全体が収まる倍率の 0.25 倍。倍率のボタンは 25%）でパネルを開いた。縮小は押せず、表示する枠は `data-at-fit` を持つ
    args:
      - name: zoom
        value: '0.25'
      - name: panelOpen
        value: 'true'
    notes:
      定義: 全体が収まる倍率が 1 の図で描く（`zoom` は定義の大きさを 1 とする値のため）
  - name: MapExportOpen
    description: 種類 `map` でパネルを開き、書き出すボタンを押した。全画面のボタンの隣の書き出すボタンが `aria-expanded="true"` で、その下に「SVG」「PNG」の 2 つのボタンの要素が表示する枠の中に重なる
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: panelOpen
        value: 'true'
      - name: exportable
        value: 'true'
      - name: exportOpen
        value: 'true'
      - name: listable
        value: 'true'
    notes:
      定義: 部品設計『mapの構成図』の Default。モック `docs/mock/components/map-export-list/` の「メニューを開いた状態」と同じ見た目（モックは popover で開くが、この部品は絶対配置の要素で開く）
  - name: MapListView
    description: 種類 `map` で一覧の表示のボタンを押した。ボタンが `aria-pressed="true"` で、表示する枠の中に部品『mapの一覧』の Flow が出て、最初の項目がパネルの下から始まる
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: exportable
        value: 'true'
      - name: listable
        value: 'true'
      - name: listView
        value: 'true'
    notes:
      定義: 部品設計『mapの一覧』の Flow を表示する枠に差し込む
  - name: MapListViewNarrow
    description: 幅 390px の置き場所で一覧の表示にした。計画した変更のバッジを持つ最初の項目がパネルと重ならない
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: exportable
        value: 'true'
      - name: listable
        value: 'true'
      - name: listView
        value: 'true'
    notes:
      定義: 部品設計『mapの一覧』の WithChanges を差し込む
  - name: MapNoList
    description: 種類 `map` のガントチャートでパネルを開いた。書き出すボタンがあり、一覧の表示のボタンが無い
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: panelOpen
        value: 'true'
      - name: exportable
        value: 'true'
      - name: listable
        value: 'false'
    notes:
      定義: 部品設計『mapの軸と格子の配置の図』のガントチャート
  - name: MapExportFailed
    description: PNG を選んだが canvas を作れなかった。「SVG」「PNG」のボタンの下に「この大きさの図は PNG にできません。SVG で書き出してください。」があり、要素は開いたまま
    args:
      - name: kind
        value: map
      - name: legend
        value: "'[]'"
      - name: wide
        value: "'true'"
      - name: panelOpen
        value: 'true'
      - name: exportable
        value: 'true'
      - name: exportOpen
        value: 'true'
      - name: listable
        value: 'true'
    notes:
      定義: MapExportOpen と同じ図で、PNG にできなかった後の状態（`role="status"` の文を入れた要素）を描く。`HTMLCanvasElement.prototype.toBlob` を `null` を渡す関数に差し替えて PNG を押す動きは、単体テスト `test_attach_map_export_when_png_unavailable` で確認する
  - name: FitTall
    description: 縦に長い図を `--mdmark-diagram-max-height` で切られた表示する枠で開いたとき。全体が収まる倍率でも図が枠に縦に収まらず、表示する枠は `data-at-fit` を持たずに縦にもスクロールする（指の縦の移動で図の中を動かせる）
  - name: ResizeHandleHover
    description: リサイズハンドルにポインターを乗せた。中央の横棒の色が `--mdmark-color-text` になる
lead: |-
  図の部品（グラフ・mermaid の図・map の図）を囲む枠。タイトル（題名・範囲・更新日）・図を出す表示する枠・凡例をこの順に配置し、表示する枠の右上に重ねたボタンのパネルと、拡大・縮小・移動・ピンチ・全画面のモーダルと、表示する枠の高さを変える下端のリサイズハンドルを持つ。
  パネルと表示する枠は、表示するノード（`.mdmark-diagram-box`）にまとめる。ボタンは 1.75rem 四方（図の枠の幅が 30rem 未満のとき 1.5rem）、パネルの余白は 0.125rem。
args:
  - name: kind
    type: 列挙
    required: true
    choices: '`flow`・`sequence`・`chart`・`mermaid`・`map`'
    description: 中の図の種類。`data-diagram` に入れる
  - name: title
    type: 文字列
    required: true
    description: 図の題名
  - name: scope
    type: 文字列
    required: false
    description: '図の範囲。タイトルの後ろに `範囲: {scope}` で出す。種類 `mermaid`・`map` では指定せず、範囲を出さない'
  - name: updated
    type: 文字列
    required: false
    description: 更新日（`YYYY-MM-DD`）。`time` 要素で出す。種類 `mermaid`・`map` では指定せず、更新日を出さない
  - name: legend
    type: オブジェクトの配列
    required: true
    description: 凡例の項目（`{ sample, label }`。`sample` はノードの種類・線の種類・系列のどれか）。図の下に並べる。空のときは凡例の `ul` に `hidden` を付け、凡例の場所を取らない
  - name: zoom
    type: 数値
    default: 全体が収まる倍率
    description: 今の倍率（定義の大きさを 1 とする）。全体が収まる倍率の 0.25 倍から 5 倍まで。全体が収まる倍率以下で、図の高さが表示する枠の高さに収まるときは表示する枠に `data-at-fit` を付け、縦にスクロールさせない
  - name: fit
    type: 数値
    default: '1'
    description: 全体が収まる倍率（定義の大きさを 1 とする）。倍率のボタンの文字は `zoom / fit` を百分率にして出す
  - name: modal
    type: 真偽値
    default: 'false'
    description: 全画面のモーダルの中に描くか。`true` のときは全画面のボタンの位置に閉じるボタンを配置し、表示する枠をモーダルの高さいっぱいにする
  - name: resizable
    type: 真偽値
    default: "'true'"
    description: 表示する枠の下端にリサイズハンドルを配置するか。`modal` が `true` のときと、機能 `diagram-resize` がオフのときは `false`
  - name: height
    type: 数値
    required: false
    default: 定義と `--mdmark-diagram-max-height` から決定する高さ
    description: リサイズハンドルで変えた表示する枠の高さ（px）。指定したときは全体が収まる倍率を幅とこの高さで求める
  - name: wide
    type: 真偽値
    default: 'false'
    description: 置き場所の幅いっぱいに広げるか（右側の目次をピン止めしていないときは右端の線の手前、ピン止めしたときはパネルの手前まで）。`true` のときは本文の幅との切り替えのボタンを出さず、倍率を 1 より小さくしない。種類 `map` は `true`
  - name: panelOpen
    type: 真偽値
    default: '''false'''
    description: 右上のパネルを開いているか。`false` のときは倍率のボタンと開閉のボタン（グループの中では外へ戻るも）だけを出し、`true` のときは `tools`・縮小・倍率・拡大・全画面・開閉のボタンを 1 行に並べる。開閉のボタンの `aria-expanded` に入れる
  - name: tools
    type: オブジェクトの配列
    default: '[]'
    description: パネルの先頭に並べるボタン（`{ name, label, disabled }`。`name` はアイコン、`label` はスクリーンリーダー向けの名前と `title`）。`panelOpen` が `true` のときだけ出し、外へ戻るは `disabled` が `false` の間は畳んだパネルにも出す。種類 `map` は、構成図では外へ戻る・全て開く・全て閉じる・配置と選択を元に戻す、シーケンス図では外へ戻る・全て開く・全て閉じる・参加者の並び順と選択を元に戻す
  - name: exportable
    type: 真偽値
    required: false
    default: "'false'"
    status: planned
    description: パネルの全画面のボタンの隣に書き出すボタン（lucide の `download`）を配置するか。種類 `map` は `true`
  - name: exportOpen
    type: 真偽値
    required: false
    default: "'false'"
    status: planned
    enabled_when: '`exportable` が `true` のとき'
    description: 書き出すボタンの下の「SVG」「PNG」の 2 つのボタンの要素（`div.mdmark-diagram-export`）を表示しているか。表示する枠の中に絶対配置し、表示・非表示を `hidden` で切り替える（Popover API は使用しない）。書き出すボタンの `aria-expanded` に入れる
  - name: listable
    type: 真偽値
    required: false
    default: "'false'"
    status: planned
    description: パネルの `tools` の先頭に一覧の表示のボタン（lucide の `list-tree`）を配置するか。種類 `map` の構成図の部品の上に描く図とシーケンス図は `true`、マインドマップと軸と格子の配置の図は `false`
  - name: listView
    type: 真偽値
    required: false
    default: "'false'"
    status: planned
    enabled_when: '`listable` が `true` のとき'
    description: 表示する枠の中を図から一覧（部品『mapの一覧』）に替えているか。一覧の表示のボタンの `aria-pressed` に入れ、`true` のときは図を `hidden` にする。倍率・位置・開閉は保ち、一覧の上の余白をパネルの高さ分とる。一覧は先頭から出し（図の位置は図に戻すときに戻す）、畳んだパネルでも押した一覧の表示のボタンは隠さない
slots:
  - name: default
    description: 表示する枠の中に配置する図の本体
    accepts:
      - CMP-472-13#
      - CMP-472-6#
      - CMP-472-5#
      - CMP-472-4#
  - name: list
    description: '`listView` が `true` のとき、図の代わりに表示する枠の中に配置する一覧'
    accepts:
      - CMP-740-1#
events:
  - name: 拡大・縮小する
    when: 拡大・縮小・倍率のボタンを押すか、表示する枠にフォーカスして `+`・`-`・`0` を押す
    value: 倍率のボタンの文字とスクリーンリーダー向けの名前
    description: '`mount` が倍率を 1.25 倍ずつ変え（倍率のボタンと `0` は開いたときの倍率と位置に戻す）、ボタンの `disabled` と倍率のボタンの文字・スクリーンリーダー向けの名前と、文書の中の表示する枠の高さの上限（定義の高さ × 今の倍率。`kind` が `map` の図は上限を持たず、リサイズハンドルで図の高さを越えて広げられる）を付け替える'
  - name: 動かす
    when: 余白をマウスでドラッグする、矢印キーを押す、指で表示する枠をスクロールする
    value: 表示する枠の `scrollLeft`・`scrollTop`
    description: '`mount` が表示する枠をスクロールさせる。指の移動はブラウザのスクロールで、ポインターのイベントでは動かさない（表示する枠の `touch-action` は `pan-x pan-y`）'
  - name: ピンチで拡大・縮小する
    when: 表示する枠の上で 2 本の指の間隔を変える
    value: '倍率のボタンの文字とスクリーンリーダー向けの名前'
    description: '`mount` が 2 本の指の中点の下の図の点を保って倍率を変え、`touchmove` と Safari の `gesturestart`・`gesturechange` を取り消してページの拡大を止める'
  - name: 全画面で開く・閉じる
    when: 全画面のボタンを押す。閉じるボタンか Esc を押す
    value: '`dialog` の `open`'
    description: '`mount` が `modal` を `true` にした枠を `dialog` に描いて開き、閉じたら削除して全画面のボタンへフォーカスを戻す。種類 `map` の図は、複製した図にも通常の表示と同じ map の操作（選択・線の強調とデータの印・開閉・中へ入る・移動・グループの大きさ・案内と再生・書き出す・一覧の表示）を付け直し、開閉・位置・グループの大きさは元の図と同じ状態を使う。Esc は、ツールチップを閉じる・選択を解く・中へ入ったグループから外へ戻る、の順に 1 回に 1 つ行い、どれも無いときに閉じる'
  - name: 高さを変える・戻す
    when: リサイズハンドルをドラッグする、フォーカスして `↑`・`↓` を押す。ダブルクリックする
    value: 表示する枠の高さとリサイズハンドルの `aria-valuenow`
    description: '`mount` が表示する枠の高さを変え（`↑`・`↓` は 32px ずつ。120px 以上。`kind` が `map` の図を除き、今の倍率の図の全体が収まる高さを超えない）、全体が収まる倍率をもう一度求める。ダブルクリックで倍率を変えずに、今の倍率の図の全体が収まる高さにする'
  - name: パネルを開く・畳む
    when: 開閉のボタンを押す
    value: '`panelOpen`（開閉のボタンの `aria-expanded`）'
    description: '`mount` が `panelOpen` を切り替え、開閉のボタンのスクリーンリーダー向けの名前を書き換える'
  - name: 書き出す
    when: 書き出すボタンを押して「SVG」か「PNG」のボタンを押す
    value: 書き出す形式（`data-export` の `svg`・`png`）
    description: '`mount` がインターフェース定義の制約『map の図の書き出し』のとおり、今の開閉のまま等倍の図の全体を SVG か 2 倍の PNG にして保存させ、要素を閉じる。PNG の canvas を作れないとき（`getContext` が `null`・`toBlob` が `null`・例外）は保存せず、要素を開いたままその中に「この大きさの図は PNG にできません。SVG で書き出してください。」を `role="status"` で出す。Esc・要素の外側のクリック・もう一度の書き出すボタンでも閉じ、Esc のときは書き出すボタンへフォーカスを戻す'
  - name: 一覧の表示を切り替える
    when: 一覧の表示のボタンを押す
    value: '`listView`（一覧の表示のボタンの `aria-pressed`）'
    description: '`mount` が `true` にしたときは部品『mapの一覧』を作って表示する枠に入れ、`false` にしたときは一覧を破棄して図を表示する。図の倍率・位置・開閉は保ち、状態は保存しない'
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: 右上のパネルと全画面のモーダルの背景色
  - name: --mdmark-diagram-max-height
    syntax: <length>
    default: 36rem
    description: 文書の中の表示する枠の最初の高さの上限。開いたときと全体が収まる倍率に戻したときは、高さを定義の高さ × 全体が収まる倍率とこの値の小さいほうにする（全体が収まる倍率は枠の幅で決める）。利用側が高さを変えたときはこの値で止めない
  - name: --mdmark-diagram-box-shadow
    syntax: none | <shadow>
    default: inset 0 0 0 1px var(--mdmark-color-border)
    description: 表示するノードの線（`box-shadow` の値）。既定値は `:root` に配置せず `var()` のフォールバックで持ち、描く先の要素で変えた `--mdmark-color-border` に追従する。利用側は枠を持つ面で `none` を指定して線を削除する。操作できる部品の中は mdmark が `none` にし、全画面のモーダルの中はこの値を受け継がず既定の線で描く
accessibility:
  - タイトルは `figcaption` で、表示する枠は `role="group"`・`aria-roledescription="図"`・`aria-labelledby`（タイトル）・`aria-keyshortcuts="+ - 0 ArrowLeft ArrowUp ArrowDown ArrowRight"`・`tabindex="0"` を持ち、フォーカスの枠を見せる
  - パネルは `role="toolbar"` と `aria-label="「{題名}」の表示"` を持つ。縮小・拡大・全画面・開閉のボタンはアイコンだけで、スクリーンリーダー向けの名前を `縮小`・`拡大`・`全画面で開く`・`全画面を閉じる`・`表示の操作を開く`（開いたとき `表示の操作を閉じる`）にする。開閉のボタンは `aria-expanded` を持ち、畳んだときも開いたときもパネルの右上の同じ位置にある。ボタンは 24px 四方を下回らない
  - 倍率は縮小と拡大の間のボタンに、全体が収まる倍率を 100% とした今の倍率を `125%` の構造（等幅の数字）で出し、スクリーンリーダー向けの名前を `倍率 {今の倍率}。全体が収まる倍率に戻す` にする（今の名前 `全体が収まる倍率に戻す` で探せる。[コードブロックの HTML を表示し、図・チャートの部品とヒントを持たせる](https://github.com/shuhei1101/mdmark/issues/6) の確認ログ）
  - 凡例は `aria-label="凡例"` の `ul` で、色の見本に名前を並べ、色だけで意味を伝えない
  - リサイズハンドルは、表示する枠の下端（横のスクロールバーの下）に配置する枠線と面を持たない高さ 24 CSS px 以上の帯で、中央に 40×4 CSS px の角の丸い横棒（`span.mdmark-diagram-resize-bar`。色は平常時 `--mdmark-color-muted`、ポインターを乗せたとき・フォーカスの間・操作している間は `--mdmark-color-text`）を持ち、帯のどこでもドラッグできる `role="separator"`・`aria-orientation="horizontal"`・`tabindex="0"` の要素。`aria-label="「{題名}」の表示の高さ"`・`aria-keyshortcuts="ArrowUp ArrowDown"`・`aria-valuenow`・`aria-valuemin`・`aria-valuemax`（px。`aria-valuemax` は 120px・今の倍率の図の全体が収まる高さ・今の高さの最大）・`aria-valuetext="{高さ}px"` と、操作を記載した `title` を持ち、フォーカスの枠を見せる。ポインターの形状は `ns-resize`
  - 書き出すボタンはアイコンだけで、スクリーンリーダー向けの名前を `図を書き出す` にし、`aria-expanded` と、開く要素を指す `aria-controls` を持つ（`aria-haspopup` は付けない）。開く要素の 2 つのボタンは文字「SVG」「PNG」を持ち、Tab で移る
  - 一覧の表示のボタンはアイコンだけで、スクリーンリーダー向けの名前を `一覧で表示` にし、`aria-pressed` で切り替えた状態を伝える
  - '拡大した図の移動のドラッグの代わりは、表示する枠のスクロールバー（`overflow: auto`）で、ポインターで 1 回押して動かせる（WCAG 2.2 の 2.5.7）。リサイズハンドルのドラッグの代わりは `↑`・`↓` と、ダブルクリックで全体が収まる高さにする操作'
