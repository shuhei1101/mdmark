id: CMP-596-1
visibility: internal
title: mapのクラス図
implementation: src/map/map.part.ts#renderMapClassDiagram
story: Parts/MapClass
states:
  - name: Default
    description: クラス 6 つ（`«interface»` と型の引数を含む）・関係 7 本（7 種類の記号と多重度とラベル）・namespace「形状」・`note for` のノート。クラス名の行は種類の行を持たない 1 行（高さ 36px）で、種類の文字と枠線の無い下向きの山形の開閉のボタンを同じ行の右端に置く
    notes:
      定義: モックの `CLASS`・`CLASS_DATA`（`docs/mock/refs/596/assets/samples.js`）
  - name: MembersCollapsed
    description: 「基本図形」のメンバーを閉じた。名前と右向きの山形の開閉のボタンの 1 行（高さ 36px。メンバーの数の文字は出さない）になる
    args:
      - name: collapsed
        value: '["基本図形"]'
  - name: Entered
    description: namespace「形状」の中へ入った
    args:
      - name: entered
        value: 形状
  - name: NamespaceCollapsed
    description: namespace「形状」を閉じた。名前の行の下に「クラス 3 件」の行を持つ 1 つのノードになる
    args:
      - name: collapsed
        value: '["形状"]'
  - name: PathSelected
    description: 「図面」と「円」を選んだ。2 本の最短の経路のクラスと関係のほかが薄い
    args:
      - name: selected
        value: '["図面", "円"]'
  - name: HintsOff
    description: ヒントをオフにした。説明のマーカーとメンバーの説明のボタンが無い
    args:
      - name: hints
        value: 'false'
  - name: Narrow
    description: 幅 390px の置き場所
  - name: LinkedClass
    description: Mermaid の `click`・`link` の行でリンク先を持つクラス。名前が本文のリンクと同じ色と下線で、クラスの全体がリンクになる。リンク先を持たないクラスは今のまま
    args:
      - name: links
        value: '{"図面": "https://example.com/drawing"}'
  - name: LongMembers
    description: クラスの幅に収まらないメンバー（`+検索(絞り込み条件, 期間, 件数, 詳細度, 件数のみ) dict`）・型の引数（`tuple<int, int>`）・補足の `width` を持つクラスと、長いラベル「ASGI アプリの生成」の関係と、ノードの幅で折り返すノート。メンバーの行は折り返して次の行と重ならず、ラベルはクラス・ノート・namespace「変換」のタイトルと重ならない。ノートは折り返した文の行が全て入る高さで、最後の行がノードの下の余白（`padding-bottom`）より上にある
    notes:
      定義: インターフェース定義『文書を描く』の正常系（map のクラス図で長いメンバーとラベルを重ねずに描く）のクラス図
  - name: MeasuredName
    description: '`map.node_fit` が `width` で、メンバーを持たない半角の名前のクラス（`MarkdownDocumentRenderer`）と、半角を含む文のノート（「Markdown を描く」）。クラスの幅とノートの幅は、描いた名前・文の幅に左右の余白（左 10px・右 28px）と枠線を加えた幅で、名前と文は 1 行で右の余白より左にある'
    notes:
      定義: 'インターフェース定義『文書を描く』の正常系（map の構成図・状態遷移図・クラス図で名前の幅と形状の余白からノードの大きさを決めて描く）のクラス図を、設定の `map.node_fit: width` で配置した結果'
      ストーリー: '`mount` で描いた結果を定義にする。Storybook のストーリーは部品の描画のサーバーが今の見積もり（半角を文字の大きさの 0.6 倍）で配置するため、フォントによってクラスとノートの幅がこの状態の大きさにならない'
lead: map の `classDiagram` を、クラスを属性とメソッドの区画を持つノード、namespace をグループにして構成図の部品の上に描き、関係の端の形状・多重度・ラベルとメンバーの開閉を持つ。
args:
  - name: layout
    type: オブジェクト
    required: true
    description: 自動配置の結果（`MapLayout`）。クラスとノートはノード、namespace はグループ。ノートのノードは、描くフォントで測った文の幅に左右の余白（左 10px・右 28px）と枠線を加えた幅で、ノードの幅で折り返した文の行が全て入る高さにする。`map.node_fit` が `width` のとき、クラスの幅は描くフォントで測った名前の幅に同じ余白と枠線を加えた幅（下限 220px・上限 360px）とメンバーの行の幅の大きい方にする。関係は矢じりの無い線（`..` は破線）で描く
  - name: layout.nodes[].classMembers
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: クラスのメンバー（`{ visibility, text, method, isStatic, isAbstract, note }`）。属性とメソッドを区切り線で分けた 2 つの区画に並べ、クラスの幅に収まらない行は折り返して、その行を折り返した行の数の高さにする。`text` の型の `~` は読み取りで `<`・`>` にした文字。静的は下線、抽象は斜体。`note` を持つ行に説明のボタンを配置する
  - name: layout.nodes[].annotation
    type: 文字列
    required: false
    default: なし（出さない）
    description: '`<<…>>` の中身。名前の上に `«…»` で出し、種類の行「クラス」に代える'
  - name: layout.ends
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 関係の端（`{ wire, at, shape, card }`。`at` は `from`・`to`、`shape` は `triangle`・`diamond-filled`・`diamond-open`・`arrow`）。線の端に形状を、端の近くに多重度を描く。同じ点から出る・入る端は辺に沿って 16px ずつずらす
  - name: collapsed
    type: 配列
    required: false
    default: '[]'
    description: 閉じた namespace とメンバーを閉じたクラスの ID。閉じた namespace は名前の行の下の行に「クラス {数} 件」、閉じたクラスは名前と右向きの山形の開閉のボタンの 1 行（メンバーの数はボタンのスクリーンリーダー向けの名前に持つ。クラス名の行は種類の行を持たない 1 行で、種類の文字と開閉のボタンを同じ行の右端に置く）
  - name: entered
    type: 文字列
    required: false
    default: なし（全体）
    description: 中へ入った namespace の ID。構成図の部品と同じ
  - name: selected
    type: 配列
    required: false
    default: '[]'
    description: 選んだクラスの ID。1 つなら関係と相手、2 つならつなぐ最短の経路を残す
  - name: focus
    type: オブジェクト
    required: false
    default: なし（薄くしない）
    description: 案内・線のホバーで強調するクラスと関係。構成図の部品と同じ
  - name: packets
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: データの印を流す関係（線）。構成図の部品と同じ
  - name: hints
    type: 真偽値
    required: false
    default: 'true'
    description: '`false` のとき、クラス・namespace の説明のマーカーとメンバーの説明のボタンを配置せず、関係の押せる帯に `aria-describedby` を付けない'
  - name: terms
    type: オブジェクト
    required: false
    default: なし（下線を付けない）
    description: 用語から意味への対応。クラスの名前とノートの文の中の用語を `span.mdmark-term` にする
  - name: links
    type: オブジェクト
    required: false
    default: '{}'
    description: Mermaid の `click`・`link` の行のクラスの ID からリンク先への対応（許可したものだけ）。構成図の部品の `links` と同じ
events:
  - name: 開閉する・中へ入る
    when: namespace の山形・タイトルのボタン、クラスの開閉のボタンを押す
    value: namespace かクラスの ID
    description: 構成図の部品の「開閉する」「中へ入る」と同じ。クラスの開閉はメンバーを開閉する
  - name: 選ぶ
    when: クラスの名前の行の文字の外を押す。クラスにフォーカスして Enter か Space を押す
    value: クラスの ID
    description: '`mount` が `selected` を切り替える。メンバーの行とノートは選ばない'
  - name: 線を指す
    when: 関係の線にポインターを乗せるかフォーカスする。離す
    value: 線の ID
    description: 構成図の部品と同じ
uses:
  - component: CMP-472-5#
    how: ノード・グループ・線の描き方と、開閉・中へ入る・選択・強調・データの印・移動
  - component: CMP-472-38#
    how: クラス・メンバー・関係の説明
accessibility:
  - クラスのノードは構成図のノードと同じく、ノードの全体を覆う押せる要素が `tabindex="0"` を持ってフォーカスを受け、選んだかを `（選択中）` で伝える
  - メンバーの区画は `role="list"`、行は `role="listitem"` を持ち、可視性の記号も読み上げの対象にする。メンバーの説明のボタンは `aria-label="{メンバー名}の説明"` を持つ
  - クラスの開閉のボタンは `aria-expanded` と、「{クラス名}のメンバーを開く」「…を閉じる」の名前を持つ
  - 関係の端の形状と多重度は飾りとして `aria-hidden`、関係の押せる帯は `aria-label="{元}から{先}への{関係の種類}"`（継承・実現・合成・集約・関連・依存・リンク）を持つ
refs:
  - IF-472-35#constraints[map のクラス図]
status: planned
test_file: tests/integration/lib/map-class.story.test.ts
