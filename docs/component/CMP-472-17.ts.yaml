id: CMP-472-17
visibility: internal
title: "コメントの吹き出し"
implementation: "src/parts/comment.ts#renderCommentBubble"
story: "Parts/CommentBubble"
states:
  - name: Single
    description: コメントが 1 つ
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["変数の名前を一覧にしてほしい"]'
  - name: Multiple
    description: 同じ箇所に複数のコメントと、長いコメント
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["変数の名前を一覧にしてほしい","既定の値も並べると、上書きするときに迷わずに済みます。ダークの値も同じ表に並べてください。\n2 行目の続き"]'
  - name: EscapedBody
    description: HTML に見える本文を文字のまま出す
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
  - name: Editable
    description: 読み込みと保存の関数が `update`・`remove` を持ち、コメントごとに「編集」「削除」のボタンを出す
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい","角丸は 6px のままでよいと思います。"]'
      - name: canEdit
        value: 'true'
      - name: canRemove
        value: 'true'
  - name: RemoveOnly
    description: 読み込みと保存の関数が `remove` だけを持ち、「削除」だけを出す
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canRemove
        value: 'true'
  - name: Editing
    description: 1 件目のコメントを入力欄に替えて書き換えている
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい","角丸は 6px のままでよいと思います。"]'
      - name: canEdit
        value: 'true'
      - name: canRemove
        value: 'true'
      - name: editIndex
        value: '0'
      - name: draft
        value: ここは <b>太字</b> にしたい。見出しも同じにする
  - name: Updating
    description: 書き換えた本文の保存を待っている
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canEdit
        value: 'true'
      - name: editIndex
        value: '0'
      - name: draft
        value: ここは <b>太字</b> にしたい。見出しも同じにする
      - name: editState
        value: saving
  - name: UpdateEmpty
    description: 本文を空にしたまま保存し、通知を出している
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canEdit
        value: 'true'
      - name: editIndex
        value: '0'
      - name: editState
        value: empty
  - name: UpdateFailed
    description: 書き換えた本文を保存できなかった
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canEdit
        value: 'true'
      - name: editIndex
        value: '0'
      - name: draft
        value: ここは <b>太字</b> にしたい。見出しも同じにする
      - name: editState
        value: failed
  - name: RemoveConfirm
    description: 1 件目のコメントの下に削除の確認を出している
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canEdit
        value: 'true'
      - name: canRemove
        value: 'true'
      - name: confirmIndex
        value: '0'
  - name: Removing
    description: 削除を待っている
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canRemove
        value: 'true'
      - name: confirmIndex
        value: '0'
      - name: removeState
        value: removing
  - name: RemoveFailed
    description: 削除できず、削除の確認を開いたまま通知を出している
    args:
      - name: quote
        value: テーマの変数
      - name: bodies
        value: '["ここは <b>太字</b> にしたい"]'
      - name: canRemove
        value: 'true'
      - name: confirmIndex
        value: '0'
      - name: removeState
        value: failed
lead: マーカーの下に開く、その箇所に付いたコメントの本文を並べた `role="dialog"` の枠。HTML 文字列を返却する。開閉と配置場所は `mount` と `mountComments` の操作が付ける。
args:
  - name: quote
    type: 文字列
    required: true
    description: マーカーの文字。タイトル `「{quote}」へのコメント` に文字として出す
  - name: bodies
    type: 配列
    required: true
    description: 付いたコメントの本文（保存した順）。文字として出し、HTML として解釈しない。改行はそのまま折り返す
  - name: ids
    type: 配列
    required: false
    default: なし
    description: '`bodies` と同じ順のコメントの `id`。各 `li` の `data-comment-id` に入れる'
  - name: canEdit
    type: 真偽値
    default: 'false'
    description: 各コメントの本文の右上に「編集」のアイコンのボタンを配置するか（読み込みと保存の関数が `update` を持つとき `true`）
  - name: canRemove
    type: 真偽値
    default: 'false'
    description: 各コメントの本文の右上に「削除」のアイコンのボタンを配置するか（読み込みと保存の関数が `remove` を持つとき `true`）
  - name: editIndex
    type: 整数
    required: false
    default: なし
    enabled_when: '`canEdit` が `true` のとき'
    description: 入力欄に替えるコメントの位置（0 から）。そのコメントの本文とボタンの場所に、本文の欄（`textarea`）と「キャンセル」「保存」を配置する
  - name: draft
    type: 文字列
    required: false
    default: なし（`editState` が `empty` なら空、それ以外はそのコメントの本文）
    enabled_when: '`editIndex` を指定したとき'
    description: 本文の欄に入っている文字
  - name: editState
    type: 列挙
    default: idle
    enabled_when: '`editIndex` を指定したとき'
    choices: '`idle`（記載している）・`saving`（保存を待っている）・`empty`（本文が空のまま保存した）・`failed`（保存できなかった）'
    description: '入力欄の状態。`saving` は保存のボタンを `disabled` にして `保存しています…` にする。`empty` は `コメントを記載してから保存してください。`、`failed` は `コメントを保存できませんでした。記載したコメントは残っています。もう一度「保存」を押してください。` を `role="alert"` で本文の欄の下に出し、本文の欄に `aria-invalid="true"` を付ける'
  - name: confirmIndex
    type: 整数
    required: false
    default: なし
    enabled_when: '`canRemove` が `true` のとき'
    description: 削除の確認を出すコメントの位置（0 から）。そのコメントの本文の下に、`このコメントを削除しますか? 削除すると元に戻せません。` と「キャンセル」「削除」を配置し、本文の右上のボタンは配置しない
  - name: removeState
    type: 列挙
    default: idle
    enabled_when: '`confirmIndex` を指定したとき'
    choices: '`idle`（確認している）・`removing`（削除を待っている）・`failed`（削除できなかった）'
    description: '削除の確認の状態。`removing` は確認の「削除」を `disabled` にして `削除しています…` にする。`failed` は `コメントを削除できませんでした。もう一度「削除」を押してください。` を `role="alert"` で確認の上に出す'
events:
  - name: 編集を始める
    when: 「編集」を押す
    value: コメントの位置
    description: '`mount`・`mountComments` がそのコメントを入力欄に替え、本文の欄へフォーカスを移す'
  - name: 編集を保存する
    when: 入力欄の「保存」を押す
    value: コメントの位置と本文の欄の文字
    description: '`mount`・`mountComments` が `update` を呼ぶ'
  - name: 編集をやめる
    when: 入力欄の「キャンセル」を押すか、本文の欄で Esc を押す
    description: '`mount`・`mountComments` が書き換える前の本文に戻し、そのコメントの「編集」へフォーカスを移す。吹き出しは閉じない'
  - name: 削除を確認する
    when: 「削除」を押す
    value: コメントの位置
    description: '`mount`・`mountComments` がそのコメントの下に削除の確認を出し、確認の「キャンセル」へフォーカスを移す'
  - name: 削除する
    when: 削除の確認の「削除」を押す
    value: コメントの位置
    description: '`mount`・`mountComments` が `remove` を呼ぶ'
  - name: 削除をやめる
    when: 削除の確認の「キャンセル」を押すか、確認の中で Esc を押す
    description: '`mount`・`mountComments` が確認を閉じ、そのコメントの「削除」へフォーカスを移す。吹き出しは閉じない'
  - name: 閉じる
    when: 閉じるボタンを押す・外側を押す・Esc を押す（入力欄・削除の確認を開いている間の Esc を除く）
    description: '`mount`・`mountComments` が吹き出しを閉じる。閉じるボタンと Esc ではフォーカスをマーカーへ戻す'
accessibility:
  - 枠は `role="dialog"`・`aria-label="コメント"`・`tabindex="-1"` で、開いたら枠へフォーカスを移す
  - 閉じるボタンは `aria-label="閉じる"` を持つ
  - 本文の並びは `ul` で件数を伝える
  - 「編集」「削除」はアイコンだけのボタンで、`aria-label` と `title` に `編集`・`削除` を入れる。押す範囲は 28px 四方
  - 本文の欄は `label` の `コメント` で名前を付け、通知を `aria-describedby` で指す
  - 削除の確認の「削除」は誤りの色で塗り、文字でも削除と分かるようにする
refs:
  - IF-472-35#constraints[コメントの操作]
  - IF-472-35#constraints[コメントの修正と削除]
status: planned
notes:
  HTML: '`<div class="mdmark-comment-popover mdmark-comment-bubble" role="dialog" aria-label="コメント" tabindex="-1"><div class="mdmark-comment-head"><p class="mdmark-comment-quote">「{quote}」へのコメント</p><button class="mdmark-comment-close" type="button" aria-label="閉じる" title="閉じる">{x のアイコン}</button></div><ul class="mdmark-comment-list"><li><p class="mdmark-comment-body">{本文}</p></li></ul></div>`。`canEdit`・`canRemove` のときの `li` は `<li class="mdmark-comment-item is-icon-actions" data-comment-id="{id}"><p class="mdmark-comment-body">{本文}</p><div class="mdmark-comment-icon-actions"><button class="mdmark-comment-icon-button" type="button" data-action="edit" aria-label="編集" title="編集">{pencil のアイコン}</button><button class="mdmark-comment-icon-button" type="button" data-action="remove" aria-label="削除" title="削除">{trash-2 のアイコン}</button></div></li>`。削除の確認は `div.mdmark-comment-confirm` に `p` と「キャンセル」（`mdmark-comment-button`）・「削除」（`mdmark-comment-button is-danger`）。モックは `docs/mock/components/comment/`（`docs/mock/refs/280/assets/comment-edit.css`）'
  印刷: 出さない
