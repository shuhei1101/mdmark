id: CMP-472-64
visibility: internal
title: "読み込み中のブロック"
implementation: "src/parts/embed.ts#renderEmbed"
story: "Parts/Embed"
states:
  - name: Loading
    description: 外部ライブラリを読み込んでいる間。図の高さを先に取り、破線の枠に `図を読み込んでいます` を出す
    args:
      - name: name
        value: chart
      - name: args
        value: a,b
lead: 外部ライブラリのマーカーの場所に配置し、読み込んだモジュールが描くまで図の高さを先に取っておく枠。マーカーの名前と引数を属性で持ち、`mount` がその要素を描く場所としてモジュールに指定する。HTML 文字列を返却し、ブラウザと Node で同じ出力になる。
args:
  - name: name
    type: 文字列
    required: true
    description: マーカーの名前。`data-mdmark-slot` に入れる
  - name: args
    type: 配列
    required: false
    default: '[]'
    description: マーカーの引数。空白で結んで `data-mdmark-args` に入れる
css_properties:
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: 破線の色
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: '`図を読み込んでいます` の文字の色'
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: 枠の角丸
accessibility:
  - 枠は `role="status"` を持ち、読み込み中であることを文言で伝える
refs:
  - IF-472-34#constraints[マーカーの場所の要素]
notes:
  出力: '`<div class="mdmark-embed" data-mdmark-slot="{name}" data-mdmark-args="{args を空白で結んだもの}" role="status">図を読み込んでいます</div>`。高さは 12rem。文言と高さは確認ログの決定（外部ライブラリを読み込んでいる間の見え方）。モックは `docs/mock/components/notice/` の「読み込み中」'
test_file: tests/integration/lib/embed.story.test.ts
