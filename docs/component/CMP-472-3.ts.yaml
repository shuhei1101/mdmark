id: CMP-472-3
visibility: internal
title: details の範囲
lead: details の範囲を、タイトルから開閉する折りたたみにする。外観は表・タブ・ステップの折り畳みと同じ `details.mdmark-collapsible`。
implementation: src/parts/collapsible.ts#renderCollapsible
story: Parts/DetailsRange
test_file: tests/integration/lib/details-range.story.test.ts
args:
  - name: title
    type: 文字列
    required: true
    description: '`summary` に入れるタイトルの行内の HTML'
  - name: html
    type: 文字列
    required: true
    description: 折りたたむ中身の HTML
  - name: open
    type: 真偽値
    required: false
    default: 'false'
    description: 開いた状態から始めるか。`true` なら `details` に `open` を付ける
states:
  - name: Closed
    description: 閉じた状態
    args:
      - name: title
        value: 補足の手順
      - name: html
        value: <p>中身の段落</p>
  - name: Open
    description: '`open` を指定した'
    args:
      - name: title
        value: 実行の例
      - name: html
        value: <p>中身の段落</p>
      - name: open
        value: 'true'
accessibility:
  - '`details` と `summary` の既定の開閉の操作（Enter・Space）と開閉の状態のスクリーンリーダーを使用する'
refs:
  - IF-472-34#constraints[details の範囲]
status: planned
notes:
  HTML: '`<details class="mdmark-collapsible"><summary>{title}</summary>{html}</details>`。タブ・ステップの `collapse` と同じ部品を使用する。モックは `docs/mock/components/details-range/`'
