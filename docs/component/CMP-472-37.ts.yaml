id: CMP-472-37
visibility: internal
title: 右側の目次
implementation: src/parts/side-toc.ts#renderSideToc
story: Parts/SideToc
states:
  - name: HoverRail
    description: hover の出し方で目次を隠し、右端に見出しの数の線だけを出す。本文をスクロールした後は、文書の末尾まで、線を見えている枠の上端（スクロールする場所の上端に `--mdmark-sticky-top` を加算した位置）から `--mdmark-space` 下に留め、線の並びの高さを見えている枠に収める。線の右端は、描く先の要素の幅によらず、見えている枠の右端（スクロールバーを除く）から 1rem に配置し、ページの差分のミニマップの帯と横の範囲が重なる間はその左端から 8px 左へずらす
  - name: HoverShown
    description: hover の出し方で目次を出している（指したかフォーカスで出た状態）。枠は画面に固定し、右端を右端の線の右端と同じ位置に統一し、文書のどこを表示していても、見えている枠の上端（スクロールする場所の上端に `--mdmark-sticky-top` を加算した位置）から `--mdmark-space` 下に出す。枠は、右端の線の上端から線 3 本分の位置まで届く高さを下限に持ち、線から枠へポインターを動かしても hover が切れない。枠は、表の見出し行・集計の行・ピン止めした列のセルを含む本文の全ての要素より手前に出す
    args:
      - name: open
        value: 'true'
      - name: current
        value: 使用方法
  - name: HoverPinned
    description: hover の出し方でピン止めし、目次を本文の右の列に出している
    args:
      - name: pinned
        value: 'true'
      - name: current
        value: 使用方法
  - name: FixedClosed
    description: fixed の出し方でサイドバーを閉じ、目次を出すボタンだけを出す
    args:
      - name: mode
        value: fixed
  - name: FixedOpen
    description: fixed の出し方でサイドバーを開き、今いるセクションの項目をハイライトしている
    args:
      - name: mode
        value: fixed
      - name: open
        value: 'true'
      - name: current
        value: 前提
  - name: WithoutSections
    description: '`sections` がオフで、すべて展開・すべて折りたたむのボタンが無い'
    args:
      - name: mode
        value: fixed
      - name: open
        value: 'true'
      - name: sections
        value: 'false'
  - name: LongHeading
    description: 見出しが長く、目次の項目が折り返す
    args:
      - name: mode
        value: fixed
      - name: open
        value: 'true'
      - name: headings
        value: '[{"level":2,"id":"long","text":"読み込みに失敗したときに通知ブロックが出る箇所と、ほかの本文の扱い"},{"level":3,"id":"long-2","text":"社内のネットワークから jsDelivr へ出られないときに書き出した 1 枚の HTML を使用する手順"}]'
  - name: HoverChanged
    description: hover の出し方で目次を出し、比較元から変わったセクションの項目の右端に変更のマーカー（橙の塗った円）を出している。変わったセクションの右端の線も橙にし、変わったセクションでもある今いるセクション（手順）の線は今いるセクションの色を優先する
    args:
      - name: open
        value: 'true'
      - name: current
        value: steps
      - name: headings
        value: '[{"level":1,"id":"doc","text":"文書","changed":true},{"level":2,"id":"premise","text":"前提"},{"level":2,"id":"steps","text":"手順","changed":true},{"level":3,"id":"steps-1","text":"準備"},{"level":2,"id":"added","text":"追加した節","changed":true}]'
  - name: FixedChanged
    description: fixed の出し方でサイドバーを開き、変わったセクションの項目に変更のマーカーを出している
    args:
      - name: mode
        value: fixed
      - name: open
        value: 'true'
      - name: headings
        value: '[{"level":1,"id":"doc","text":"文書","changed":true},{"level":2,"id":"premise","text":"前提"},{"level":2,"id":"steps","text":"手順","changed":true},{"level":3,"id":"steps-1","text":"準備"},{"level":2,"id":"added","text":"追加した節","changed":true}]'
  - name: LongHeadingChanged
    description: 長い見出しの項目に変更のマーカーを出し、折り返した文字とマーカーが重ならない（マーカーは項目の右端の 1 行目の高さ）
    args:
      - name: mode
        value: fixed
      - name: open
        value: 'true'
      - name: headings
        value: '[{"level":2,"id":"long","text":"読み込みに失敗したときに通知ブロックが出る箇所と、ほかの本文の扱い","changed":true}]'
lead: |-
  描いた文書の右側に配置し、h1〜h3 を入れ子にした目次・右端の線・目次を出すボタン・ピン止め・すべて展開とすべて折りたたむを持つ。
  出し方（hover・fixed）と、描く先の要素の幅 48rem 未満の狭い幅の帯を CSS で切り替える。
args:
  - name: headings
    type: オブジェクトの配列
    required: true
    description: 文書の頭からの h1・h2・h3（`{ level, id, text, changed }`）。閉じたセクションと選ばれていないタブの中の見出しも含める。深い階層は直前の浅い階層の入れ子にする。`changed` が `true` の見出しは比較元から変わったセクションで、項目のリンクに `data-changed`・`aria-label="{text}（変更）"` と末尾の変更のマーカー、右端の線に `data-changed` を付ける（省くと付けない）
  - name: mode
    type: 列挙
    required: false
    default: hover
    choices: hover / fixed
    description: 出し方。hover は右端の線を出し、指すかフォーカスで目次を重ねて出す。fixed は目次を出すボタンでサイドバーを開閉する
  - name: sections
    type: 真偽値
    required: false
    default: 'true'
    description: すべて展開・すべて折りたたむのボタンを配置するか（`sections` の機能）
  - name: open
    type: 真偽値
    required: false
    default: 'false'
    description: 目次を出しているか。目次を出すボタンの `aria-expanded` と aside の `data-open` に写す。`mount` は出していない状態で描く
  - name: pinned
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`mode` が `hover` のとき'
    description: ピン止めしているか。ピン止めのボタンの `aria-pressed` と aside の `data-pinned` に写す。`mount` は解除した状態で描く
  - name: current
    type: 文字列
    required: false
    description: 今いるセクションの見出しの ID。その項目に `aria-current="location"`、右端の線の対応する線に `data-current` を付け、狭い幅の帯にその見出しの文字を出す。省くと付けない
events:
  - name: 目次を出す・隠す
    when: 目次を出すボタン（三点リーダー）を押す、または出している目次の中で Esc を押す
    value: ボタンの `aria-expanded`
    description: '`mount` が aside の `data-open` を付与・解除し、Esc のときは目次を出すボタンへフォーカスを戻す'
  - name: ピン止めする
    when: ピン止めのボタンを押す
    value: ボタンの `aria-pressed`
    description: '`mount` が aside の `data-pinned` を付与・解除し、目次を本文の右の列に出したままにする'
  - name: 項目へ移る
    when: 目次の項目のリンクを押す
    value: リンクの `data-heading-id`（見出しの ID）。`href` は `#{id}` だが、利用側が書き換えてもよい
    description: '`mount` が URL の `#ID` で移るのと同じ処理を呼ぶ（URL が同じでも呼ぶ）。本文に重ねて開いた目次は閉じる'
  - name: すべて開閉する
    when: すべて展開・すべて折りたたむのボタンを押す
    value: ボタンの `data-fold-all`（`open` / `close`）
    description: '`mount` が文書の全てのセクションを開く。折りたたむときは h1 のセクションを開き、h2〜h4 のセクションを閉じる'
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: 目次を出すボタンと目次のパネル（狭い幅の目次を含む）の地の色
  - name: --mdmark-color-link
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: 今いるセクションの項目の文字、右端の線、ピン止めした後のピン止めのアイコンの色
  - name: --mdmark-color-callout-warning
    syntax: <color>
    default: '#b45309'
    description: 変更のマーカー（塗った円）と、変わったセクションの右端の線の色。今いるセクションの線は `--mdmark-color-link` を優先する
  - name: --mdmark-color-current-bg
    syntax: <color>
    default: '#e6f3f1（ダーク #10302c）'
    description: 今いるセクションの項目、目次を出しているときの目次を出すボタン、ピン止めした後のピン止めのボタンの背景
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: 目次の枠・ボタンの枠・目次の上端と項目の間の線・今いるセクションでない右端の線の色
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: ボタンのアイコンの色
  - name: --mdmark-sticky-top
    syntax: <length>
    default: 0px
    description: 右側の目次（右端の線を含む）と狭い幅の帯を画面に留める位置と、hover で開く目次の枠の上端の、画面（スクロールする場所）の上端からのずれ
  - name: --mdmark-space
    syntax: <length>
    default: 0.875rem
    description: hover で開く目次の枠の上端を、`--mdmark-sticky-top` の位置から下げる余白
accessibility:
  - 目次のパネルは `nav` で、`aria-label="右側の目次"` を持つ。見えるタイトルは持たず、本文の `<!-- toc -->` の目次（`aria-label="目次"`）とランドマークの名前を分ける
  - 目次を出すボタンは `aria-label`・`title` を「目次を表示」にし、`aria-expanded`・`aria-controls` で目次を出しているかを示す
  - ピン止めのボタンは `aria-label`・`title` を「目次をピン止め」にし、`aria-pressed` で状態を示す。押した後はアイコンの形状（点線の右の列から実線の右の列）と選択中の背景でも示し、色だけで示さない
  - すべて展開・すべて折りたたむのボタンは文字を持たず、`aria-label`・`title` を「すべて展開」「すべて折りたたむ」にする
  - 今いるセクションの項目は `aria-current="location"` を持ち、背景と文字の色で示す（太さは変えない）
  - 右端の線は `aria-hidden="true"` でスクリーンリーダーに伝えない。hover の出し方でも、キーボードのフォーカス（`:focus-visible` の要素）が目次の中に入れば目次を出す。ポインターで押したボタンに残るフォーカスでは出し続けない
  - 出している目次の中で Esc を押すと目次を隠し、目次を出すボタンへフォーカスを戻す
  - 変更のマーカーの付いた項目は、リンクの `aria-label` を `{見出しの文字}（変更）` にして読み上げで伝え、マーカーの円は `aria-hidden="true"` にする。リンクの文字には足さない（目次を出すボタンの今いる見出しの文字に写さないため）。マーカーは色のほかに円の有無で示す
