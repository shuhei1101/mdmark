notes:
  補足: '`<aside class="mdmark-side-toc" data-mode="{mode}"><button class="mdmark-side-toc-toggle" type="button" aria-expanded="{open}" aria-controls="{パネルの ID}" aria-label="目次を表示" title="目次を表示"><span class="mdmark-side-toc-current">{今いるセクションの見出し}</span>{三点リーダーのアイコン}</button><div class="mdmark-side-toc-rail" aria-hidden="true"><span class="mdmark-side-toc-bar" data-level="{level}"></span>…</div><nav class="mdmark-side-toc-panel" id="{パネルの ID}" aria-label="右側の目次"><div class="mdmark-side-toc-head"><div class="mdmark-side-toc-actions"><button class="mdmark-fold-all" type="button" data-fold-all="open" aria-label="すべて展開" title="すべて展開">…</button><button class="mdmark-fold-all" type="button" data-fold-all="close" aria-label="すべて折りたたむ" title="すべて折りたたむ">…</button></div><button class="mdmark-side-toc-pin" type="button" aria-pressed="{pinned}" aria-label="目次をピン止め" title="目次をピン止め">{ピン止めのアイコン}</button></div><ul class="mdmark-side-toc-list"><li><a href="#{id}" data-heading-id="{id}">{text}</a><ul>…</ul></li>（`changed` の項目は `<a href="#{id}" data-heading-id="{id}" data-changed aria-label="{text}（変更）">{text}<span class="mdmark-side-toc-changed" aria-hidden="true"></span></a>`）</ul></nav></aside>`。アイコンは lucide の ellipsis・panel-right-dashed（ピン止めを押す前）・panel-right（ピン止めを押した後）・chevrons-up-down・chevrons-down-up。まとめて開閉するボタンの並びは `sections` がオフのとき配置せず、ピン止めのボタンは fixed の出し方では CSS で隠す。狭い幅の帯は描く先の要素の幅で切り替えるため、ストーリーではなく `mount` の結合テスト（`test_normal_when_side_toc_in_narrow_width`）で確認する。ストーリーの結合テストは `tests/integration/lib/side-toc.story.test.ts`。モックは `docs/mock/components/toc/`・`docs/mock/refs/166/assets/side-toc.js` と、上端の並び・ピン止めのアイコン・hover で開く位置の `docs/mock/components/side-toc-head/`・`docs/mock/refs/320/assets/proposal.js`、変更のマーカーの `docs/mock/pages/document/550/a-dot-end/`・`docs/mock/refs/550/assets/toc-marker.css`'
test_file: tests/integration/lib/side-toc.story.test.ts
