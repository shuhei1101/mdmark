id: CMP-472-36
visibility: internal
title: 動画と音声
implementation: src/media/media.part.ts#renderMedia
story: Parts/Media
test_file: tests/integration/lib/media.story.test.ts
states:
  - name: Video
    description: '`poster` と title を持つ動画。再生バーを出し、下にキャプションを出す'
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: プレビューを開く操作
      - name: caption
        value: プレビューを開く操作
      - name: poster
        value: demo-poster.png
  - name: VideoAutoplay
    description: '`{width=320 autoplay loop}`。`muted` を追加し、幅 320px で出す'
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 繰り返し再生する短い操作
      - name: caption
        value: 繰り返し再生する短い操作
      - name: width
        value: 320px
      - name: autoplay
        value: 'true'
      - name: loop
        value: 'true'
  - name: VideoNoCaption
    description: title を持たない動画。キャプションを出さない
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 操作の動画
      - name: poster
        value: demo-poster.png
  - name: Audio
    description: title を持つ音声。再生バーとキャプションを出す
    args:
      - name: kind
        value: audio
      - name: src
        value: voice.mp3
      - name: alt
        value: 読み上げの見本
      - name: caption
        value: 読み上げの見本（3 秒）
  - name: VideoPrint
    description: '`poster` を持つ動画の印刷。再生バーを出さず、`poster` の画像とキャプションを出す'
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: プレビューを開く操作
      - name: caption
        value: プレビューを開く操作
      - name: poster
        value: demo-poster.png
    notes:
      定義: 'ストーリーは `emulateMedia({ media: "print" })` で確認する'
  - name: OpenButton
    description: 表のセルの中の動画。ラベルの文字と再生のアイコンの再生のボタン
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材 1
      - name: opener
        value: button
      - name: inline
        value: 'true'
  - name: OpenButtonAudio
    description: 表のセルの中の音声。音声のアイコンの再生のボタン
    args:
      - name: kind
        value: audio
      - name: src
        value: voice.mp3
      - name: alt
        value: 読み上げ
      - name: opener
        value: button
      - name: inline
        value: 'true'
  - name: OpenButtonCaption
    description: '`modal` の属性と title を持つ段落の動画。再生のボタンの後ろにキャプション'
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 操作の様子
      - name: caption
        value: 保存までの操作
      - name: opener
        value: button
  - name: OpenButtonLongLabel
    description: ラベルが長い。ボタンの中で折り返し、はみ出さない
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 設定ファイルを読み込めないときに文書の先頭へ出すバーの操作を、最初から最後まで通した長い名前の素材
      - name: opener
        value: button
      - name: inline
        value: 'true'
    notes:
      定義: ストーリーの画面の幅を 390px にする
  - name: OpenThumbnail
    description: '`thumbnail` の属性と `poster` を持つ動画。`poster` の画像に再生のアイコンを重ねる'
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材 2
      - name: poster
        value: demo-poster.png
      - name: opener
        value: thumbnail
      - name: inline
        value: 'true'
  - name: OpenButtonPrint
    description: 再生のボタンの印刷。枠と再生のアイコンを出さず、ラベルとキャプションを本文の文字で出す
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 操作の様子
      - name: caption
        value: 保存までの操作
      - name: opener
        value: button
    notes:
      定義: 'ストーリーは `emulateMedia({ media: "print" })` で確認する'
  - name: VideoResizable
    description: リサイズハンドルを持つ動画。動画の右下の角の下に 24×24 の押せる範囲があり、L 字の線は出さない
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: caption
        value: 素材の確認
      - name: poster
        value: demo-poster.png
      - name: resizable
        value: 'true'
  - name: VideoResizableHover
    description: 動画にポインターを乗せた状態。動画の角のすぐ下に L 字の線を出す
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: poster
        value: demo-poster.png
      - name: resizable
        value: 'true'
      - name: resizeState
        value: hover
  - name: VideoResizableFocus
    description: ハンドルにフォーカスした状態。L 字の線とフォーカスの枠線を出す
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: poster
        value: demo-poster.png
      - name: resizable
        value: 'true'
      - name: resizeState
        value: focus
  - name: VideoResizeMenu
    description: 大きさのメニューを開いた状態。ハンドルの下に右端を合わせて「小さくする」「大きくする」「元の大きさに戻す」を出し、元の大きさのときは「元の大きさに戻す」を押せない
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: poster
        value: demo-poster.png
      - name: resizable
        value: 'true'
      - name: resizeState
        value: menu
  - name: VideoResizableNarrow
    description: 幅 160px（下限）の動画。ハンドルとメニューが画面の中に収まり、「小さくする」を押せない
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: width
        value: 160px
      - name: resizable
        value: 'true'
      - name: resizeState
        value: menu
  - name: VideoResizablePrint
    description: リサイズハンドルを持つ動画の印刷。ハンドルとメニューを出さず、`poster` の画像とキャプションを出す
    args:
      - name: kind
        value: video
      - name: src
        value: demo.mp4
      - name: alt
        value: 素材の確認
      - name: caption
        value: 素材の確認
      - name: poster
        value: demo-poster.png
      - name: resizable
        value: 'true'
    notes:
      定義: 'ストーリーは `emulateMedia({ media: "print" })` で確認する'
lead: 拡張子が動画・音声の画像を、再生バーを持つ `video`・`audio` にして図に入れ、title をキャプションにする。印刷では動画の代わりに `poster` の画像を出す。
args:
  - name: kind
    type: 列挙
    required: true
    choices: '`video`・`audio`'
    description: 描く要素
  - name: src
    type: 文字列
    required: true
    description: 動画・音声の URL
  - name: alt
    type: 文字列
    required: true
    description: 要素の `aria-label` に入れる名前
  - name: caption
    type: 文字列
    required: false
    default: '""'
    description: title。空なら `figcaption` を出さない
  - name: width
    type: 文字列
    required: false
    default: なし（要素の元の幅。本文の幅を超えない）
    choices: '`{数}px`・`{1〜100}%`'
    description: '`figure` の `style` の `--mdmark-image-width` に入れる幅'
  - name: poster
    type: 文字列
    required: false
    default: なし
    enabled_when: '`kind` が `video` のとき'
    description: 再生前に出す画像の URL。指定したとき、印刷用の `img.mdmark-media-print` も配置する
  - name: autoplay
    type: 真偽値
    required: false
    default: 'false'
    description: 自動で再生するか。`true` のとき `muted` も付ける
  - name: muted
    type: 真偽値
    required: false
    default: 'false'
    description: ミュートにして始めるか
  - name: loop
    type: 真偽値
    required: false
    default: 'false'
    description: 繰り返し再生するか
  - name: opener
    type: 列挙
    required: false
    default: none
    choices: '`none`・`button`・`thumbnail`'
    description: '`none` は再生バーを持つ図。`button` はラベルの文字と再生のアイコンの再生のボタン、`thumbnail` は `poster` の画像に再生のアイコンを重ねた再生のボタンにし、再生バーを出さない（表のセルの中の動画・音声と、属性 `modal`・`thumbnail`）'
  - name: inline
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`opener` が `none` 以外のとき'
    description: 文の途中か表のセルの中に配置するか。`false` は画像だけの段落の場所の `div.mdmark-media-inline-figure` に入れ、`true` はボタンとキャプションだけを返す
  - name: resizable
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`kind` が `video` で `opener` が `none` のとき'
    description: 動画の右下の角に、縦横の比を保って幅を変えるリサイズハンドルを配置するか（機能 `media-resize`）
  - name: resizeState
    type: 列挙
    required: false
    default: idle
    choices: '`idle`・`hover`・`focus`・`menu`'
    enabled_when: '`resizable` が `true` のとき'
    description: ストーリーで表示するハンドルの状態。`hover` は動画にポインターを乗せた状態、`focus` はハンドルにフォーカスした状態、`menu` は大きさのメニューを開いた状態
css_properties:
  - name: --mdmark-image-width
    syntax: <length-percentage>
    default: なし
    description: 図の幅。`width` の値を `figure` の `style` で指定する
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: キャプションの文字の色
accessibility:
  - 要素は `controls` を持ち、ブラウザの再生バーをキーボードで操作できる。`aria-label` に alt を入れる
  - 自動で再生する動画は `muted` で始め、音を出さない
  - 印刷用の `poster` の画像は `alt=""` で、キャプションが名前を持つ
  - リサイズハンドルは `button` で Tab でフォーカスでき、名前は `「{alt}」の大きさを変える`（alt が空なら `src` のファイル名）。押せる範囲は 24×24 CSS px で、`↑`・`↓` で大きさを変え、ドラッグの代わりに大きさのメニューを開ける
  - 大きさのメニューは開いたら最初の押せるボタンへフォーカスを移し、Esc・外を押して閉じたらハンドルへフォーカスを戻す。押せないボタンは `disabled`
refs:
  - IF-472-34#constraints[動画と音声]
  - IF-472-35#constraints[印刷の画像と動画]
  - IF-472-35#constraints[動画の大きさのリサイズハンドル]
status: planned
notes:
  HTML: '`<figure class="mdmark-figure mdmark-media" style="--mdmark-image-width: {width}"><video src="{src}" controls preload="metadata" playsinline aria-label="{alt}" poster="{poster}"></video><img class="mdmark-media-print" src="{poster}" alt=""><figcaption class="mdmark-figure-caption">{caption}</figcaption></figure>`。音声は `audio`（`playsinline` を持たない）。再生のボタンは `<button class="mdmark-media-open" type="button" aria-haspopup="dialog" data-media-kind data-media-src …>{アイコン}<span class="mdmark-media-open-label">{alt}</span></button><span class="mdmark-media-open-caption">{caption}</span>`（`thumbnail` は class `mdmark-media-thumb`・中身は `<img src="{poster}" alt="">` とアイコン・`aria-label="{alt}"`）。モックは `docs/mock/components/media/`'
tags:
  - name: topic:動画
    main: true
  - name: topic:音声
