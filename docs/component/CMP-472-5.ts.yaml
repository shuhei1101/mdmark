accessibility:
  - 開いたグループの右下の角のボタンは `button` で、押せる大きさが 24px 四方、`aria-label="{タイトル}の大きさを変える"`、ポインターの形状が `nwse-resize` で、キーボードでフォーカスでき、フォーカスの枠が見える。見た目は 16px の 2 本の斜線で、閉じたグループと中へ入っているときの外のグループには置かない
  - グループの左・右・下の縁の内側 8px は、タイトルの行と同じくポインターの形状が `grab` で、ドラッグでグループを動かす。キーボードではタイトルの行と同じ Alt + 矢印キーで動かす
  - グループの開閉のボタンは `aria-expanded` と `aria-label="{タイトル}を開く"`（開いているときは `閉じる`）を持つ。タイトルのボタンは `aria-label="{タイトル}の中へ入る"` を持つ
  - リンク先を持たないノードは、ノードの `div` がフォーカスを受けず、ノードの全体を覆う押せる要素（`span.mdmark-diagram-node-hit`）がノードの代わりにフォーカスを受ける（ノードの中にフォーカスできる要素を入れ子にしない）。押せる要素は `role="button"`・`tabindex="0"`・`aria-roledescription="ノード"`・`aria-keyshortcuts="Enter Space Alt+ArrowLeft Alt+ArrowUp Alt+ArrowDown Alt+ArrowRight"` と、ノードの名前のスクリーンリーダー向けの名前を持ち、フォーカスの枠をノードの外側に出す。選んだかをノードの `data-selected` と、スクリーンリーダー向けの名前の末尾の `（選択中）` で伝える（`aria-pressed` は付けない）
  - 押せる要素は、ノードの中の種類の行・名前の文字・説明のマーカー・ノードの中に入れた部品（ER 図の列の行と、列の開閉・列の説明のボタン）の下に重ね、それらを押せる要素の中に入れない。名前の中の用語・説明のマーカー・ノードの中に入れた部品のボタンは、押せる要素とは別にフォーカスできる（Tab の順は押せる要素、ノードの中の並び）。名前の文字と ER 図の列の名前の文字は、押せる要素の上で選んでコピーできる
  - 線の押せる範囲は、線ごとの `g.map-wire-hit` に区間ごとの幅 14px の帯を並べる。最も長い区間の帯が `tabindex="0"` と `aria-label="{元}から{先}への線"`（ラベルがあれば末尾に `「{ラベル}」`）を持ち、ほかの帯は `aria-hidden="true"` でフォーカスを受けない。ポインターの形状は区間の向きで `ns-resize` か `ew-resize`。フォーカスしたときは `g.map-wire-hit:focus-within` で全ての区間の帯にフォーカスの色を付ける
  - 'ノードの名前の文字は選んでコピーでき（ポインターの形状は `text`）、種類の行の文字は選べない（`user-select: none`）。ドラッグできる場所のポインターの形状は `grab`'
  - '強調しない要素（`map-dim`、`map-focus` の中の `map-keep` でない要素、中へ入ったときに外側に残す `map-faded`）のうち文字を持つ要素は、`opacity` で薄くせず、文字を本文の文字色と背景の色を 68% : 32% で混ぜた色にし、ノード・グループ・線のラベル・多重度の枠と面も背景の色と混ぜる（mdmark のテーマのライトとダークで、文字の背景に対するコントラスト 4.5:1 以上）。文字を持たない線・ライフライン・関係の端は `--mdmark-map-dim-opacity` の `opacity` で薄くする。データの印は `aria-hidden`。読者が始めた印は `prefers-reduced-motion` でも流し、再配置したときのノードとグループの移動は止める'
  - 色を持たないグループの枠線は背景とのコントラスト比 3:1 以上
  - リンク先を持つノードは、ノードの `div` がフォーカスを受けず、`a.mdmark-diagram-node-link` がノードの代わりにフォーカスを受ける（ノードの中にフォーカスできる要素を入れ子にしない）。リンクはスクリーンリーダー向けの名前がノードの名前（選んでいれば `（選択中）`）で、`aria-roledescription="ノード"`・`aria-keyshortcuts="Space Alt+ArrowLeft Alt+ArrowUp Alt+ArrowDown Alt+ArrowRight"` を持ち、Enter でリンク先を開き、Space で選び、Alt + 矢印キーで動かす。説明のマーカーとは別にフォーカスできる（Tab の順はリンク、マーカー）。グループの説明のマーカーはタイトルのボタンの外にあり、`aria-describedby` で説明のツールチップを指す
  - ノードの右上とグループのタイトルの右の説明のマーカーは、押せる大きさを 24px 四方以上にする（閉じたグループのタイトルの行と、ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図のノードも同じ）。ノードの種類の行は、マーカーと重ならないよう右にマーカーの幅の余白を取る
  - 計画した変更は色だけで伝えず、変更の名前のバッジ（`removed` は破線の枠線のバッジと名前の取り消し線）で示す。ノードの押せる要素のスクリーンリーダー向けの名前の末尾に「、{変更の名前}」を追加し、バッジは `aria-hidden`
  - ノードの名前は 13px・種類の行と線のラベルは 11px で、どれも標準の太さ（400）にする（確認ログ『map の図のノードの名前・種類の行・線のラベルの文字の大きさと太さ』）。ノードの幅と名前の行の数は、この大きさで測る。ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図・軸と格子の配置の図のノードの名前と種類の行も同じ値にする
  - データの印の色は、どの色合いも明るい配色・暗い配色の背景とのコントラスト比 3:1 以上。色だけで線を見分けさせず、形状も線ごとに変える
  - 移動のボタンは `type="button"`・`aria-haspopup="true"`・`aria-expanded` を持つ lucide の `move` のアイコンだけのボタンで、スクリーンリーダー向けの名前を `「{表示名}」を移動`（表示名はノード・グループの名前、線は両端の名前を `→` でつないだもの。Mermaid の ID は使用しない）、`title` のツールチップを `移動` にする。押せる範囲は 24px 四方以上。メニューは `role="group"` と `aria-label="「{表示名}」の移動"`（大きさのメニューは `「{タイトル}」の大きさ`）を持ち、開いたら最初の押せる項目へフォーカスを移し、項目の間を Tab と上下の矢印キーで移る。押せない向きは `disabled`。メニューを開いた状態と閉じた状態で axe-core の違反を出さない
