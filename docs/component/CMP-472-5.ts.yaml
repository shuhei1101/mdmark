notes:
  データの印の見た目: |-
    - 大きさ: 外側の輪郭・光を含めて、丸は半径 5.6px、四角は 9.6px 四方（角の丸み 1.6px）、ひし形は中心から頂点まで 6.4px、三角は上向きで高さと幅 11.2px（今の 8 割）。どの塗り方もこの大きさの中に収める
    - 塗り方: `solid` は印の色で塗り、背景の色の 1.5px の縁を内側に付ける。`ring` は 6 割の大きさで塗り、外側に同じ色の 1px の輪郭を `opacity` 0.6 で重ねる。`tinted` は印の色を背景の色と 30% : 70% で混ぜた面に、印の色の 1.5px の輪郭を付ける。`glow` は 6 割の大きさで塗り、外側に同じ色の広がりを `opacity` 0.3 で重ねる。`shine` は `solid` の左上に半径 1.6px の白の照りを `opacity` 0.8 で入れる
    - 形状と色の順番: 線の番号（Mermaid に記載した順、0 から）を 4 で割った余りで形状（丸・四角・ひし形・三角）、5 で割った余りで色を決める
    - 速さ: 今の速さ（毎秒 60px）に、線の ID の FNV-1a のハッシュから求めた 0.9〜1.1 の倍率（0.9 + 0.2 × (ハッシュ mod 1001) / 1000）を掛ける。線の中の印の出始めは、同じハッシュから求めた 1 周の時間の割合だけずらす
    - `random`: 線の ID に `:fill` を続けた文字列の FNV-1a のハッシュを 5 で割った余りで、`solid`・`ring`・`tinted`・`glow`・`shine` から選ぶ。同じ図を描き直しても同じ塗り方になる
    - 重なりの順: 線 → データの印 → ノード → 線のラベルの順に重ね、印をラベルとノードの下に描く
  データの印の色合い: |-
    値は明るい配色 / 暗い配色の順。どの色も、選べるテーマの背景（明るい配色 `#ffffff`・`#fbf8f1`・`#f8fafc`、暗い配色 `#131316`・`#1c1915`・`#0f172a`・`#000000`）とのコントラスト比 3:1 以上。明るい配色の値は、最も暗い明るい背景 `#fbf8f1` で 3:1 以上になるまで、色相と彩度を保って明度を下げた

    | 色合い | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | `accent` | アクセントの青の文字の色 | 緑 | 橙 | 紫 | 赤 |
    | `vivid` | `#3b82f6` / `#3b82f6` | `#1ca34d` / `#22c55e` | `#ed6506` / `#f97316` | `#a855f7` / `#a855f7` | `#ef4444` / `#ef4444` |
    | `pastel` | `#2e8ffb` / `#93c5fd` | `#15a249` / `#86efac` | `#da7103` / `#fdba74` | `#b26bfd` / `#d8b4fe` | `#fa5454` / `#fca5a5` |
    | `muted` | `#5b7fa6` / `#5b7fa6` | `#6b9080` / `#6b9080` | `#bf8153` / `#c08457` | `#8e7cc3` / `#8e7cc3` | `#b56576` / `#b56576` |
    | `cool` | `#2563eb` / `#2563eb` | `#0d98d6` / `#0ea5e9` | `#119e8f` / `#14b8a6` | `#6366f1` / `#6366f1` | `#8b5cf6` / `#8b5cf6` |

    `accent` は各色の `--mdmark-color-accent-{色}-text` を指し、配色で切り替わる
