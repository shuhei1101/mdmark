id: CMP-472-5
visibility: internal
title: mapの構成図
implementation: src/map/map.part.ts#renderMapFlow
story: Parts/MapFlow
states:
  - name: Default
    description: 入れ子のグループ 2 つ・色を持つグループ・種類を持つノードと持たないノード・破線と太い線・両向きの線。凡例が無く、種類を持たないノードは種類の行を持たず、名前をノードの上下の中央に描く
    notes:
      定義: モックの `FLOW`・`DATA`・`CONFIG`（`docs/mock/refs/445/assets/samples.js`）
  - name: Entered
    description: 「記法の読み取り」の中へ入った。外の要素が薄く、入ったグループのタイトルがボタンでない
    args:
      - name: entered
        value: lib
  - name: Collapsed
    description: 「データ」を閉じた。二重の枠線のノードになり、名前の行の下に「ノード {数} 件」の行が重ならずにあり、そこへの線が 1 本にまとまり、本数とラベルを出さない
    args:
      - name: collapsed
        value: '["read"]'
  - name: SelectedOne
    description: ノードを 1 つ選んだ。そのノードとその線のほか（線の相手のノードを含む）が薄く、その線の上をデータの印が流れる
    args:
      - name: selected
        value: '["mount"]'
  - name: SelectedTwo
    description: ノードを 2 つ選んだ。選んだノードどうしの線だけが残る
    args:
      - name: selected
        value: '["mount", "marker"]'
  - name: Focused
    description: 案内の手順で強調した。強調するノードどうしの線の上を既定の丸と、`packet` で色と形状を変えた印が流れる
  - name: WireReattached
    description: 線の真ん中の区間をノードの上へ動かした。線と矢じりがノードの上の辺に付く
  - name: NodeFitWidth
    description: '`map.node_fit` が `width`。名前の長いノードが幅 360px まで広がってから折り返す'
    notes:
      定義: モックの `docs/mock/components/map-kinds/` の「長い名前のノードの広げ方」
  - name: LinkedNode
    description: Mermaid の `click` の行でリンク先を持つノード。名前が本文のリンクと同じ色と下線で、ノードの全体がリンクになり、説明のマーカーはリンクの後ろにある。リンク先を持たないノードは今のまま
    args:
      - name: links
        value: '{"mount": "https://example.com/spec"}'
  - name: GroupNote
    description: 補足の `notes` で説明を持つグループ。タイトルの右にノードと同じマーカーがあり、説明を持たないグループには無い
    args:
      - name: notes
        value: '{"lib": "記法を読み取る部分"}'
  - name: HintsOff
    description: '`hints` が `false`。説明を持つノード・グループ・線にマーカーとツールチップが無く、線のラベル・ノードの名前・グループのタイトルは描かれる'
    args:
      - name: notes
        value: '{"lib": "記法を読み取る部分", "mount": "文書を描く入口"}'
      - name: hints
        value: 'false'
  - name: GroupResized
    description: 中のグループ「ページ」を角で右と下へ 40px 広げた。外のグループが中身に合わせて広がり、グループの右下に 2 本の斜線の角のボタンがある
    args:
      - name: groupSizes
        value: '{"page": {"w": 336, "h": 274}}'
  - name: Narrow
    description: 幅 390px の置き場所。図は倍率 1 のまま表示する枠の中で横にスクロールする
  - name: Plain
    description: map の範囲の外の純粋な Mermaid の flowchart（`data-map-plain`）。補足が無く、種類を持たないノードだけで、説明のマーカーとツールチップを持たない
  - name: ParallelWires
    description: 同じグループの同じ列に並ぶ 3 つのノードから、別のグループのノードへ 1 本ずつ出る線。3 本の線が同じ区間を重ならず、区間と直角の向きにずらして並ぶ。線は配置の結果の点の並びのとおりに描き、ずらすのは配置（インターフェース定義の制約『map の線の通り道』）が持つ
    notes:
      定義: ストーリーの中で記載する Mermaid。`flowchart LR` で、`subgraph A` の中の縦に並ぶ 3 つのノード（`a1`・`a2`・`a3`）から、`subgraph B` の中の 3 つのノード（`b1`・`b2`・`b3`）へ `a1 --> b3`・`a2 --> b1`・`a3 --> b2` の 3 本の線を引く
  - name: WrappedName
    description: 種類の行を持ち、名前（「注文の明細を月ごとに集計する」）がノードの幅で 2 行に折り返すノード。ノードは種類の行と折り返した名前の行が全て入る高さで、名前の最後の行がノードの下の余白（`padding-bottom`）より上にある
    notes:
      定義: インターフェース定義『文書を描く』の正常系（map の構成図・状態遷移図で折り返すノードの名前をノードに収めて描く）の構成図
  - name: MeasuredName
    description: 半角を含む名前（「文書の Markdown」）の種類の行を持つノードと、`pill` の形状の種類のノード（「利用側のページ」）。どちらも名前が 1 行で、ノードの幅は描いた名前の幅に左右の余白と枠線を加えた幅で、名前の下に 1 行分の空きを残さない。`pill` のノードの名前は左の余白 16px の内側にある
    notes:
      定義: インターフェース定義『文書を描く』の正常系（map の構成図・状態遷移図・クラス図で名前の幅と形状の余白からノードの大きさを決めて描く）の構成図
      ストーリー: '`mount` で描いた結果を定義にする。Storybook のストーリーは部品の描画のサーバーが今の見積もり（半角を文字の大きさの 0.6 倍）で配置するため、フォントによって名前が 2 行に折り返し、この状態の大きさにならない'
  - name: Styled
    description: '`style`・`classDef`・`linkStyle` の色を適用した。ノード A の面と枠線が指定の色、D・E の面が classDef の色で文字が黒、2 本目の線が赤。ほかは map の配色'
    notes:
      定義: モック `docs/mock/components/plain-mermaid-style/` の「style と classDef を持つ flowchart」の案 B
  - name: WireEndsAndShapes
    description: 端に丸・×を付けた線・見えない線でつないだノード・長さを指定した線と、平行四辺形・台形・二重の円・文書の形状のノード
    notes:
      定義: インターフェース定義『文書を描く』の正常系（flowchart の線の端・見えない線・線の長さ・形状の指定）の Mermaid
  - name: PlannedChanges
    description: '補足の `changes` を持つ。種類の色 `green` の「利用側のページ」と線 1 本が追加の色、`layout` の `color: blue` を持つ「mount」が orange の枠線、「旧版の読み取り」とそこへの線が削除の色の破線で名前に取り消し線があり、3 つのノードの右上に「追加」「変更」「削除」のバッジがある。種類のアイコンと名前の行は種類の色のまま'
    args:
      - name: changes
        value: '{"user": "added", "user->mount": "added", "mount": "changed", "legacy": "removed", "mount->legacy": "removed"}'
    notes:
      定義: 'モック `docs/mock/components/map-changes/` の「計画した変更」の図（`docs/mock/refs/740/assets/map-extra.js` の見た目）に、`mount` へ `layout` の `color: blue` を追加した図'
  - name: SharedSide
    description: 1 つのノードの下の辺から 4 本、上の辺に 2 本の線が出入りする。端が辺の中点 1 か所に集まらず、相手のノードの並びの順に 16px 間隔で並び、並んで同じ向きに走る区間も 16px 離れる
    notes:
      定義: モック `docs/mock/components/map-wire-ports/` の「1 つのノードの上下の辺に 4 本と 2 本」（`FAN`）
  - name: PacketVariety
    description: 1 つのノードから同じ長さの 3 本の線が出て、そのノードを選んだ。印の形状が丸・四角・ひし形、色が色合い `accent` の 1〜3 番目、塗り方が `tinted` で、3 本の印が同じ位置に並ばずに流れる
    notes:
      定義: モック `docs/mock/components/map-wire-packet/` の「今の見た目と案」の図（同じ長さの 3 本）
  - name: PacketFills
    description: PacketVariety の図を、`packetStyle.fill` を `solid`・`ring`・`tinted`・`glow`・`shine`・`random` にして並べた。どの塗り方も、外側の輪郭・光を含めた印の大きさが `shine` と同じ
    notes:
      定義: モック `docs/mock/components/map-wire-packet/` の「印の塗り方の案」。ストーリーの引数で `packetStyle.fill` を切り替える
  - name: PacketPalettes
    description: PacketVariety の図を、`packetStyle.palette` を 5 つの色合いにして、明るい配色と暗い配色で並べた。どの色も背景とのコントラスト比が 3:1 以上
    notes:
      定義: モック `docs/mock/components/map-wire-packet/` の「印の色合いの案」
  - name: PacketSourceColor
    description: ノード 1 つに `style` で色を指定した図。そのノードから出る線の印がノードの色、指定の無いノードから出る線の印が `--mdmark-map-packet-gray` で、形状は線ごとに順に変わる。印は線のラベルとノードの下を通る
    notes:
      定義: モック `docs/mock/components/map-wire-packet/` の「ノードに色を指定した図」「線のラベルとノードとの重なり」
  - name: LongWireLabel
    description: 横の線と縦の線に、置く区間より長いラベルを持つ。ラベルは線に重ならず、横の線は線の上、縦の線は線の右に 6px 離れてあり、線と矢じりが見える
    notes:
      定義: モック `docs/mock/components/map-wire-label/` の案 A
  - name: WireRouteAfterDrag
    description: 左下のノードの右の辺から出て右上のノードの下の辺に入る L 字の線の縦の区間を、右上のノードの右端より右へ動かした。線は右上のノードの右の辺へ回り込んでつながり、端はどちらもノードの辺に付き、つながらないノードの下を通る
    notes:
      定義: モック `docs/mock/components/map-wire-drag-route/` の 2 回目の図（直した後）
  - name: MoveButton
    args:
      - name: selected
        value: '["mount"]'
      - name: moveTarget
        value: '{"kind":"node","id":"mount"}'
    description: ノードを動かさずに押した。ノードの内側の右上の角に `move` のアイコンだけの移動のボタン（`aria-expanded="false"`、名前 `「{ノードの名前}」を移動`）を重ねる
  - name: MoveButtonNearPanel
    args:
      - name: selected
        value: '["render"]'
      - name: moveTarget
        value: '{"kind":"node","id":"render"}'
    description: 図の右上のパネルと右上の角が重なるノードを押した。移動のボタンをノードの内側の左上の角に出す
  - name: MoveMenu
    args:
      - name: selected
        value: '["mount"]'
      - name: moveTarget
        value: '{"kind":"node","id":"mount"}'
      - name: moveMenu
        value: move
    description: 移動のボタンで移動のメニューを開いた。`上へ移す`・`下へ移す`・`左へ移す`・`右へ移す` を並べ、ノード・移動のボタン・図のパネルと重ならない側（下・上・右・左の順）に開く。動かしても位置が変わらない向きは `disabled`（合意したモック `docs/mock/components/map-move-menu/`）
  - name: MoveMenuSegment
    args:
      - name: moveTarget
        value: '{"kind":"segment","id":"mount-render:1"}'
      - name: moveMenu
        value: move
    description: 縦の線の区間を押して移動のメニューを開いた。区間と直角の `左へ移す`・`右へ移す` だけを並べ、ボタンは押した区間にだけ出す
  - name: ResizeMenu
    args:
      - name: moveTarget
        value: '{"kind":"group","id":"core"}'
      - name: moveMenu
        value: resize
    description: グループの右下の角を動かさずに押して大きさのメニューを開いた。`右へ広げる`・`下へ広げる`・`左へ狭める`・`上へ狭める` を並べ、中身より狭められない向きは `disabled`
lead: map の `flowchart` を自動配置した結果のノードと線（線の交差の飛び越えを含む）を描き、その上に入れ子のグループの面を重ねる。グループの開閉と中へ入るボタン、ノードと線の選択・移動、強調しない要素を薄くする表示、線の上を流れるデータの印を持つ。
args:
  - name: layout
    type: オブジェクト
    required: true
    description: 自動配置の結果（`MapLayout`。`width`・`height`・`nodes`・`groups`・`wires`）。ノードと線を描き、グループは外側から順に面とタイトルの行を重ねる。ノードの幅は、描くフォントで測った名前の幅に左右の余白（左 10px。`pill` の形状は 16px。右 28px）と左右の枠線（1.5px ずつ）を加えた幅（下限と上限の間）で、描いた名前の行の数は見積もりの行の数と一致する。ノードは、種類の行と、ノードの幅から左右の余白と左右の枠線を除いた幅で折り返した名前の行が全て入り、名前の最後の行がノードの下の余白（`padding-bottom`）より上にある高さで描く
  - name: layout.groups[].id
    type: 文字列
    required: true
    description: Mermaid の `subgraph` の ID。`data-group` に入れる
  - name: layout.groups[].title
    type: 文字列
    required: true
    description: グループのタイトル。中へ入るボタンの文字にする
  - name: layout.groups[].color
    type: 文字列
    required: false
    default: なし（`--mdmark-map-group-border` の枠線だけを描く）
    description: 補足の `layout` の色の名前。面とタイトルの文字をその色にする
  - name: layout.nodes[].kind
    type: オブジェクト
    required: false
    default: なし（種類の行を空にし、角の丸い四角で描く）
    description: 設定の `map.kinds` のそのノードのクラスの値（`{ label, icon, shape, color }`）。ノードの種類の行・形・色に使用する
  - name: layout.wires[].line
    type: オブジェクト
    required: false
    default: なし（実線・太さ normal・塗りの矢じり）
    description: 設定の `map.lines` のその線の矢印か名前の値（`{ dash, width, head, color }`）。線の模様・太さ・矢じり・色に使用する
  - name: layout.wires[].merged
    type: オブジェクトの配列
    required: false
    description: 閉じたグループへの線を 1 本にまとめたときの元の線（`{ from, to, label }`）。まとめた線は本数とラベルを出さず、補足の `notes` に説明を持つ元の線だけを「{元の名前} → {先の名前}：{説明}」で図のツールチップに並べる（説明を持つ元の線が無ければツールチップを付けない）
  - name: notes
    type: オブジェクト
    required: false
    default: '{}'
    description: 補足の `notes` の ID ごとの説明。ノードとグループの説明は右上（グループはタイトルの右）のマーカーと `hint` のツールチップ、線の説明は線の押せる帯の `wire` のツールチップにする
  - name: hints
    type: 真偽値
    required: false
    default: 'true'
    description: '`false` のとき、`notes` の説明と注記のツールチップと、ノード・グループのマーカーを作らず、線の押せる帯に `aria-describedby` を付けない。注記の持ち主の `id` はノード・グループのタイトル・線の押せる帯に付ける。ER 図・状態遷移図の map（ER 図の列の説明のボタンを含む）も同じ'
  - name: links
    type: オブジェクト
    required: false
    default: '{}'
    description: Mermaid の `click` の行のノードの ID からリンク先への対応（許可したものだけ）。ノードの全体を覆う `a.mdmark-diagram-node-link` にし、ノードに class `has-link` を付ける
  - name: collapsed
    type: 配列
    required: false
    default: '[]'
    description: 閉じたグループの ID。閉じたグループは、左上に開くボタンを持つ二重の枠線の 1 つのノード（`map-closed-group`）で描き、1 行目のタイトルの行（開くボタン・名前・説明のマーカー）の下の行に、中のノードの数を「ノード {数} 件」で出す。2 つの行は重ならず、ノードの高さは配置の結果のまま描く（2 つの行が収まる高さは配置が決める）。ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図の閉じたグループも同じ
  - name: entered
    type: 文字列
    required: false
    default: なし（全体）
    description: 中へ入ったグループの ID。そのグループの外のノード・グループ・線に class `map-faded` を付け、そのグループのタイトルをボタンでない文字にする
  - name: selected
    type: 配列
    required: false
    default: '[]'
    description: 選んだノードの ID。選んだノードに `data-selected` を付け、`focus` より優先して強調する範囲を決める（1 つならそのノードとそのノードの線、2 つ以上なら選んだノードどうしの線）
  - name: focus
    type: オブジェクト
    required: false
    default: なし（薄くしない）
    description: 案内・再生・線のホバーで強調するノードと線（`{ nodes, wires }`）。強調する要素に `map-focus`、ほかのノード・線・ラベルに `map-dim` を付ける
  - name: packets
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: データの印を流す線（`{ wire, direction, color, shape, fill }`。`direction` は `forward`・`backward`・`both`、`shape` は `circle`・`square`・`diamond`・`triangle`、`fill` は `packetStyle.fill` と同じ値）。指定している間、元から先へ繰り返し流す。`color` は色の名前か `line`・`source`・`target`。省いた `shape`・`color`・`fill` は、図の中の線の記載の順番（線の番号）と `packetStyle` から決める（補足『データの印の見た目』）。知らない値は省いたときと同じ
  - name: groupSizes
    type: オブジェクト
    required: false
    default: '{}'
    description: 角で大きさを変えたグループの ID → `{ w, h }`（px）。配置はそのグループをこの大きさ以上で描き、外のグループを中身に合わせて広げる。中のノードとグループを囲む大きさより小さくはしない
  - name: dragging
    type: 文字列
    required: false
    default: なし
    description: 動かしているノード・グループ・線の ID。その要素のポインターの形状を `grabbing` にし、動かしている間は配置のアニメーションを止める
  - name: terms
    type: オブジェクト
    required: false
    default: なし（下線を付けない）
    description: 用語から意味への対応（`data-map-terms`）。ノードの名前の中の用語を `span.mdmark-term` にし、意味を図のツールチップにする。説明のツールチップの文の中の用語はフォーカスを持たない下線にし、末尾に「{用語}：{意味}」の行を並べる。グループのタイトルと線のラベルには付けない
  - name: layout.nodes[].style
    type: オブジェクト
    required: false
    default: なし（map の配色）
    description: Mermaid の `style`・`classDef`（`class` の行・`:::` で当てたもの）から読み取った色（`{ fill, stroke, color }`）。ノードの面・枠線・名前の文字の色にする。`color` が無く `fill` があるときの文字の色は、面に対するコントラスト比が高い方の `#000000` か `#ffffff`。明るい配色と暗い配色で変えない。同じノードが補足の `changes` を持つときは、枠線を変更の色にし、面と文字の色はこの色のままにする
  - name: layout.nodes[].shape
    type: 列挙
    required: false
    default: '`rect`'
    choices: '今の形状（`rect`・`round`・`stadium`・`circle`・`cylinder`・`subroutine`・`hexagon`・`rhombus`・`flag`）に加え `lean-right`（`[/ /]`）・`lean-left`（`[\ \]`）・`trapezoid`（`[/ \]`）・`trapezoid-alt`（`[\ /]`）・`double-circle`（`(((`　`)))`）と、`@{ shape: … }` の mermaid の形状の名前'
    description: ノードの形状。面と枠線をその形状で描き、名前は形状の内側に収める
  - name: layout.wires[].style
    type: オブジェクト
    required: false
    default: なし（map の配色）
    description: Mermaid の `linkStyle` から読み取った色（`{ stroke, color }`）。線と矢じりと線のラベルの文字の色にする
  - name: layout.wires[].ends
    type: オブジェクト
    required: false
    default: なし（矢印のとおり）
    description: 線の端の記号（`{ from, to }`。値は `circle`・`cross`）。`--o`・`--x`・`o--o`・`x--x` の端に丸・×を線の色で描く
  - name: layout.wires[].invisible
    type: 真偽値
    required: false
    default: '`false`'
    description: '`~~~` の見えない線。`true` の線は配置にだけ使用し、線・ラベル・押せる帯を描かない'
  - name: changes
    type: オブジェクト
    required: false
    default: '{}'
    status: planned
    description: '補足の `changes` のノード・グループ・線の ID から `added`・`changed`・`removed` への対応（使用できない値・種類のものは除いた後）。`added` は `--mdmark-color-diff-add-sign`、`changed` は色の名前 `orange`、`removed` は `--mdmark-color-diff-del-sign` の色をノード・グループの枠線と線に適用し（`layout` の `color` と種類の色より優先。種類のアイコンと名前の行は種類の色のまま）、`removed` は枠線と線を破線、名前を 2px の取り消し線（`word-break: normal`）にする。ノードとグループのタイトルの右上に、枠線をまたいで変更の名前のバッジ（`span.mdmark-map-change`、`data-change` に値）を配置する。ER 図・状態遷移図・クラス図・アーキテクチャ図・C4 図の map も同じ'
  - name: packetStyle
    type: オブジェクト
    required: false
    default: '`{ fill: "tinted", palette: "accent" }`'
    description: 設定の `map.packets`（`{ fill, palette }`）。`fill` は `solid`・`ring`・`tinted`・`glow`・`shine`・`random`、`palette` は `accent`・`vivid`・`pastel`・`muted`・`cool`。図の要素に `data-packet-palette` を付け、色合いの CSS 変数を切り替える
  - name: moveTarget
    type: オブジェクト
    required: false
    default: なし（移動のボタンを出さない）
    description: 最後に動かさずに押した要素。`kind`（`node`・`group`・`segment`）と `id`（線の区間は線の ID と区間の番号）を持ち、その要素の内側の右上の角（図のパネルと重なるときは左上）に移動のボタンを出す
  - name: moveMenu
    type: 列挙
    required: false
    default: '`closed`'
    choices: closed・move・resize
    description: '`closed`・`move`（移動のボタンで開いた移動のメニュー）・`resize`（グループの右下の角で開いた大きさのメニュー。`moveTarget` の `kind` が `group` のとき）'
events:
  - name: 開閉する
    when: グループの左上の山形のボタンか、閉じたグループの開くボタンを押す（Shift を押しながら押すと中のグループも）
    value: グループの ID（`data-group`）と Shift の有無
    description: '`mount` が `collapsed` を切り替えて再配置し、図の倍率と表示する枠の高さを保つ'
  - name: 中へ入る
    when: グループのタイトルのボタンを押す
    value: グループの ID
    description: '`mount` が `entered` をそのグループにして中だけを再配置する'
  - name: 選ぶ
    when: ノードの名前の文字の外を押す（ポインターが 4px 動くまで）か、ノードにフォーカスして Enter か Space を押す。線を押す（4px 未満の動き）か、線にフォーカスして Enter を押す
    value: ノードの ID（`data-node`）か、線の両端の ID
    description: '`mount` が `selected` のノードを切り替える。線は、両端が選ばれていれば両方を解き、それ以外は両方を選ぶ'
  - name: 動かす
    when: ノード・グループのタイトルの行（上端から 36px。ボタンの外）・グループの左・右・下の縁（内側 8px。右下の角を除く）・線の区間を 4px 以上ドラッグする。フォーカスして Alt + 矢印キーを押す（8px ずつ。Shift も押すと 32px ずつ。線は真ん中の区間を動かす）
    value: 動かした要素の ID と動いた量（px）
    description: '`mount` が位置を固定して再配置し、sessionStorage に保つ。ほかのノード・グループとの間が 16px より狭くなる位置と、グループの左端・上端より外へは動かさない'
  - name: 大きさを変える
    when: 開いたグループの右下の角のボタンを 4px 以上ドラッグする。角にフォーカスして矢印キーを押す（→・↓ で広げ、←・↑ で狭める。8px ずつ、Shift も押すと 32px ずつ）
    value: グループの ID と大きさ（px）
    description: '`mount` が `groupSizes` を変えて再配置し、sessionStorage に保つ。中のノードとグループを囲む大きさより小さくせず、ほかのノード・グループとの間が 16px より狭くなる大きさへは広げない。「配置と選択を元に戻す」で空にする'
  - name: 線を指す
    when: 線にポインターを乗せるかフォーカスする。離す
    value: 線の ID
    description: '`mount` がその線と両端のノードを `focus` にし、その線に `packets` を流す。離すと元に戻す'
  - name: ノードを押す
    when: map の図のカスタム要素から描いた構成図で、ノードを押すか、フォーカスして Enter を押す
    value: 押したノードの Mermaid の ID
    description: 今の選択と強調に加えて、map の図のカスタム要素が `mdmark-node-click` を送信する。文書の map の範囲で描いた図では送信しない
  - name: 移動のメニューで動かす
    when: 移動のボタンで開いたメニューの向きの項目を押す
    value: 動かした要素の ID と動いた量（px）
    description: '`mount` が、要素にフォーカスして Alt + その向きの矢印キーを 1 回押したときと同じだけ動かし、sessionStorage に保つ。メニューは開いたまま、再描画した後も押した項目にフォーカスを残す。Esc でメニューを閉じて移動のボタンへフォーカスを戻す'
  - name: 大きさのメニューで変える
    when: グループの右下の角を 4px 未満の動きで押して開いたメニューの項目を押す
    value: グループの ID と大きさ（px）
    description: '`mount` が、角にフォーカスしてその向きの矢印キーを 1 回押したときと同じだけ大きさを変え、sessionStorage に保つ。メニューは開いたまま。Esc でメニューを閉じて角へフォーカスを戻す'
css_properties:
  - name: --mdmark-map-dim-opacity
    syntax: <number>
    default: '0.25'
    description: 強調しない線・ライフライン・関係の端（文字を持たない要素）の `opacity`。文字を持つ要素の薄い表示には使用しない
  - name: --mdmark-map-group-border
    syntax: <color>
    default: color-mix(in srgb, var(--mdmark-color-muted) 70%, transparent)
    description: 色を持たないグループの枠線の色
  - name: --mdmark-map-packet-1
    syntax: <color>
    default: 色合いの 1 番目の色（`accent` は `var(--mdmark-color-accent-blue-text)`）
    description: 色を指定したノードの無い図で、線の番号を 5 で割った余りが 0 の線の印の色。`--mdmark-map-packet-2`〜`-5` も同じく余り 1〜4 の線の色で、色合いごとの値は補足『データの印の色合い』。利用側のテーマで上書きできる
  - name: --mdmark-map-packet-gray
    syntax: <color>
    default: var(--mdmark-color-accent-gray-text)
    description: 色を指定したノードがある図で、色の指定の無いノードから出る線の印の色
