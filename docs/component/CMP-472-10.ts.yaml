id: CMP-472-10
visibility: internal
title: カードの格子
lead: cards の範囲のリストの項目を、アイコン・タイトル・説明を持つカードにして、入るだけ横に並べる。描く先の要素が狭いときは記載した順に 1 列に追加する。
implementation: src/parts/card-grid.ts#renderCardGrid
story: Parts/CardGrid
test_file: tests/integration/lib/card-grid.story.test.ts
args:
  - name: items
    type: オブジェクトの配列
    required: true
    description: 項目ごとのカード。1 個以上
  - name: items[].title
    type: 文字列（HTML）
    required: true
    description: カードのタイトル。項目の最初のリンクの文字（リンクの無い項目は最初の行の文字）
  - name: items[].href
    type: 文字列
    required: false
    description: リンク先。無いときはリンクではないカード（`div`）にする
  - name: items[].icon
    type: 文字列
    required: false
    description: アイコンの名前（Lucide の名前。記法の `icon:名前` の `名前`）。部品が記法のアイコンと同じ要素に class `mdmark-card-grid-icon` を追加して組み立てる。無いときはアイコンを配置せず、タイトルを左端から始める
  - name: items[].description
    type: 文字列（HTML）
    required: false
    description: タイトルの下に出す説明
states:
  - name: Wide
    description: 4 項目を 1280px の幅に 1 行で並べる
    args:
      - name: items
        value: '[{"title":"使用方法","href":"使い方/README.md","icon":"book","description":"導入と使用方法の手順"},{"title":"リファレンス","href":"リファレンス/README.md","description":"名前から参照する一覧"},{"title":"example.com/docs","href":"https://example.com/docs"},{"title":"始める","href":"はじめに/README.md","icon":"rocket"}]'
  - name: NoLink
    description: リンクを持たない項目と、リンクを持つ項目
    args:
      - name: items
        value: '[{"title":"準備中","icon":"clock","description":"次のバージョンで追加する"},{"title":"使用方法","href":"使い方/README.md","icon":"book","description":"導入と使用方法の手順"}]'
  - name: Long
    description: 長いタイトルと説明。同じ行のカードの高さが一致し、説明が折り返す
    args:
      - name: items
        value: '[{"title":"設定を重ねて読み込む仕組みと優先の順番","href":"a.md","icon":"book","description":"端末の設定と、文書のフォルダから上のフォルダの設定ファイルを重ねる順・切り替え・相対パスの基準・優先の順番"},{"title":"変更履歴","href":"b.md","description":"バージョンごとの変更の一覧"},{"title":"始める","href":"c.md","icon":"rocket"}]'
  - name: Narrow
    description: 描く先の要素の幅が 390px。1 列に追加する
    args:
      - name: items
        value: Wide と同じ
    notes:
      定義: ストーリーは幅 390px の枠に描く
css_properties:
  - name: --mdmark-space
    syntax: <length>
    default: 1rem
    description: 格子の上下の余白
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: カードの線の色
  - name: --mdmark-color-link
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: リンクのカードのタイトルの色、ポインターを乗せたときの線の色、キーボードのフォーカスの輪郭の色
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: アイコンと説明の文字の色
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: リンクのカードにポインターを乗せたときの面の色
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: カードの角丸
accessibility:
  - 格子は `ul`、カードは `li` に入れ、記載した順の DOM の並びのまま並べる
  - リンクのカードは 1 つの `a` で、Tab で記載した順にフォーカスでき、フォーカスの輪郭を出す。リンクの無いカードは Tab で止まらない
  - リンクのカードはタイトルをリンクの色と下線にし、色だけでリンクと分からせない。アイコンは `aria-hidden`
refs:
  - IF-472-34#constraints[カードの格子]
  - CMP-472-9#
status: planned
notes:
  HTML: '`<ul class="mdmark-card-grid"><li><a class="mdmark-card-grid-item" href="{href}">{icon}<span class="mdmark-card-grid-title">{title}</span><p class="mdmark-card-grid-desc">{description}</p></a></li>…</ul>`（リンクの無い項目は `a` の代わりに `div`）。列は `repeat(auto-fill, minmax(min(100%, 14rem), 1fr))`。モックは `docs/mock/components/card-grid/`（確認ログ）'
