id: CMP-472-57
visibility: internal
title: 脚注の一覧
lead: 描いた文書の本文の後ろ・関連文書の一覧の前に、「脚注（{件数} 件）」の見出しで閉じた脚注の一覧を配置し、項目ごとに脚注の中身と本文の参照へ戻るリンクを並べる。注記の一覧は同じ部品で「注記（{件数} 件）」の見出しにし、脚注の一覧の後ろに配置する。HTML 文字列を返却し、ブラウザと Node で同じ出力になる。
implementation: src/parts/footnote.ts#renderFootnotes
story: Parts/Footnotes
test_file: tests/integration/lib/footnote.story.test.ts
args:
  - name: kind
    type: 列挙
    required: false
    default: '`footnote`'
    choices: '`footnote`（脚注）・`annotation`（注記）'
    description: 脚注の一覧か注記の一覧か。`annotation` は `details` に `mdmark-notes` を付け、見出しを `注記（{件数} 件）`、項目の頭を「※{番号}」、項目の `id` を `mdmark-note-{number}`、戻るリンクの `href` を `#mdmark-noteref-{number}-{i}`、読み上げの名前を `本文の注記 {番号} へ戻る` にする
  - name: items
    type: オブジェクトの配列
    required: true
    description: 脚注の項目（番号の順）。空なら空文字を返却する（一覧を配置しない）
  - name: items[].number
    type: 整数
    required: true
    choices: 1 以上
    description: 脚注の番号。項目の `id`（`mdmark-fn-{number}`）に使用する。番号の文字は CSS のカウンターで角括弧付きに出す
  - name: items[].html
    type: 文字列
    required: true
    description: 脚注の中身を描いた HTML（定義の段落を `p` のまま持つ）。最後の段落の末尾に戻るリンクを並べる
  - name: items[].refCount
    type: 整数
    required: true
    choices: 1 以上
    description: その脚注を本文で参照した回数。参照ごとに戻るリンク（`href="#mdmark-fnref-{number}-{0 からの通し番号}"`）を配置し、2 以上ならリンクに a・b… の文字を添える
  - name: open
    type: 真偽値
    required: false
    default: 'false'
    description: 開いた外観にするか。`true` なら `details` に `open` を付ける（ストーリーで中身を見せるため。`render` は指定しない）
states:
  - name: Closed
    description: 描いた直後。見出し `脚注（2 件）` だけが出て、項目は隠れている
    args:
      - name: items
        value: '[{"number":1,"html":"<p>CSS 変数と層の外の CSS で上書きする。</p>","refCount":1},{"number":2,"html":"<p>file:// で開き、外への要求は 0 件。</p>","refCount":1}]'
  - name: Open
    description: 開いた一覧。`[1]`・`[2]` の番号と中身、末尾の戻るリンクが並ぶ
    args:
      - name: items
        value: '[{"number":1,"html":"<p>CSS 変数と層の外の CSS で上書きする。</p>","refCount":1},{"number":2,"html":"<p>file:// で開き、外への要求は 0 件。</p>","refCount":1}]'
      - name: open
        value: 'true'
  - name: ReferencedTwice
    description: 同じ脚注を 2 回参照した。項目は 1 つで、戻るリンクが `a`・`b` の 2 つ並ぶ
    args:
      - name: items
        value: '[{"number":1,"html":"<p>閉じのマーカーの記載を忘れると、範囲の上に警告が出る。</p>","refCount":2}]'
      - name: open
        value: 'true'
  - name: Long
    description: 中身が 2 段落とリンクを持つ脚注と、10 件を超える番号。番号の列の幅は 2 桁でもずれない
    args:
      - name: items
        value: '[{"number":11,"html":"<p>既定のテーマは dev-swiss で、<code>colorTheme</code> で選べる。</p><p>明暗は OS の配色に合わせ、<a href=\"../使い方/カスタマイズ/テーマを上書きする.md\">テーマを選ぶ</a> の手順で固定できる。</p>","refCount":1},{"number":12,"html":"<p>短い補足。</p>","refCount":1}]'
      - name: open
        value: 'true'
  - name: Annotations
    description: 開いた注記の一覧。見出し `注記（2 件）` と、「※1」・「※2」の頭と本文、戻るリンクが並ぶ。1 つ目は 2 か所から参照され、戻るリンクが `a`・`b` の 2 つ
    args:
      - name: kind
        value: annotation
      - name: items
        value: '[{"number":1,"html":"<p>条件を満たさないときは次の工程へ進む。</p>","refCount":2},{"number":2,"html":"<p>画像は data URL で埋める。</p>","refCount":1}]'
      - name: open
        value: 'true'
css_properties:
  - name: --mdmark-color-footnote-ref
    syntax: <color>
    default: var(--mdmark-color-link)
    description: 一覧の番号の色（本文の番号と同じ変数）
  - name: --mdmark-color-annotation-ref
    syntax: <color>
    default: var(--mdmark-color-footnote-ref)
    description: 注記の一覧の「※{番号}」の色（本文の注記のマーカーと同じ変数）
uses:
  - component: CMP-472-58#
    how: 一覧の番号を本文の番号と同じ角括弧・マーカーの色にする
accessibility:
  - 一覧は `details` と `summary` で開閉し、`summary` の `脚注（{件数} 件）` で件数を伝える
  - 項目は `ol` の項目で、番号の文字は CSS で付け、スクリーンリーダーは `ol` の順で伝える
  - 戻るリンクはアイコンだけで、`aria-label` を `本文の脚注 {番号} へ戻る`（参照が 2 つ以上なら `本文の脚注 {番号} の {n} つ目の参照へ戻る`）にする
  - '`mount` が番号から移った項目は `tabindex="-1"` でフォーカスを受け、フォーカスの枠を出す'
refs:
  - IF-472-34#constraints[脚注]
  - IF-472-35#constraints[脚注の操作]
  - IF-472-34#constraints[注記]
status: planned
notes:
  出力の構造: '`<details class="mdmark-footnotes"><summary>脚注（{件数} 件）</summary><ol class="mdmark-footnotes-list"><li class="mdmark-fn-item" id="mdmark-fn-{number}">{html の最後の p の末尾に <a class="mdmark-fn-back" href="#mdmark-fnref-{number}-{i}" aria-label="…">{lucide の corner-up-left}{a・b}</a>}</li>…</ol></details>`。見出しの文言と配置場所は確認ログの決定。モックは `docs/mock/components/footnote/`'
  印刷: 印刷では `mount` が一覧を開き、戻るリンクと `summary` の開閉のマーカーを出さない
  注記の一覧: '`kind` が `annotation` のとき `<details class="mdmark-footnotes mdmark-notes"><summary>注記（{件数} 件）</summary><ol class="mdmark-footnotes-list"><li class="mdmark-fn-item" id="mdmark-note-{number}">…</li>…</ol></details>`。脚注の一覧と分けて並べることは確認ログの決定（案 A）。モックは `docs/mock/components/annotation/`'
