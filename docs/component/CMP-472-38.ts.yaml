id: CMP-472-38
visibility: internal
title: "図のツールチップ"
implementation: "src/parts/diagram.ts#renderDiagramTip"
story: "Parts/DiagramTooltip"
states:
  - name: Closed
    description: 閉じている。補足の `notes` で説明を持つ線と、説明を持つノードのマーカーだけが見える
    notes:
      定義: 部品設計『mapの構成図』の Default
  - name: Wire
    description: map の構成図の線の説明を開いた。開いた線を太くする
    args:
      - name: kind
        value: wire
      - name: open
        value: 'true'
  - name: Term
    description: ノードの中の用語を開いた。本文の用語と同じ破線の下線と外観
  - name: Hint
    description: map の構成図のノードの説明を開いた。ノードの下に文だけを出す
    args:
      - name: kind
        value: hint
      - name: open
        value: 'true'
  - name: Table
    description: ER 図のテーブルの説明のボタンで開いた。テーブルの下に、論理名と物理名・概要・`desc` を持つ列の名前と説明を出す
    args:
      - name: kind
        value: table
      - name: open
        value: 'true'
    notes:
      定義: モックの `shop-er` の注文のテーブル（`docs/mock/components/er-diagram/` の「テーブルのツールチップ」）
  - name: Item
    description: '折れ線の点のツールチップを開いた。点の下に系列の名前と `{横の目盛り}: {値}` を出す'
    args:
      - name: kind
        value: item
      - name: open
        value: "'true'"
    notes:
      定義: モックの `reply-time`
  - name: GroupHint
    description: map の構成図のグループのタイトルのマーカーで説明を開いた。マーカーの下に文だけを出す
    args:
      - name: kind
        value: hint
      - name: open
        value: "'true'"
    notes:
      定義: 部品設計『mapの構成図』の GroupNote
  - name: Merged
    description: map の構成図で閉じたグループへまとめた線を開いた。元の線を 1 行ずつ並べる
    args:
      - name: kind
        value: merged
      - name: open
        value: '''true'''
    notes:
      定義: 部品設計『mapの構成図』の Collapsed
lead: map の構成図の線・ノードのマーカー・グループのタイトルのマーカー、ER 図のテーブルの説明のボタン、グラフの項目、埋め込んだ HTML の `data-hint` に付くツールチップ。map の構成図は補足の `notes` の説明を、ER 図はテーブルの概要と列の説明を、グラフは系列か項目の名前と値を出す。ノードの中の用語は用語のツールチップを使用する。
args:
  - name: kind
    type: 列挙
    required: true
    choices: '`wire`（線の説明）・`hint`（ノードかグループの説明か、埋め込んだ HTML の `data-hint` の文だけ）・`table`（ER 図のテーブルの概要と列の説明）・`item`（グラフの項目の系列か項目の名前と値）・`merged`（map の構成図で閉じたグループへまとめた線の元の線）。map の構成図の線の補足の `notes` は `wire`、ノードとグループの補足の `notes` は `hint`'
    description: ツールチップの種類
  - name: label
    type: 文字列
    required: true
    description: 持ち主の名前（線のラベル・ノードの名前）。ツールチップのタイトルに出す
  - name: tip
    type: 文字列
    enabled_when: '`kind` が `wire` のとき'
    description: 線の入力の詳細
  - name: io
    type: オブジェクト
    enabled_when: '`kind` が `io` のとき'
    description: ノードの `{ in, do, out }`。`入力`・`処理`・`出力` の見出しを付けて 3 行に出す
  - name: open
    type: 真偽値
    default: 'false'
    description: 開いているか。開いている線は太くする
  - name: hint
    type: 文字列
    required: false
    enabled_when: '`kind` が `hint` か `io` のとき'
    description: ノードの `hint` か `data-hint` の文。`io` と一緒に持つときは入力・処理・出力の後に出す
  - name: table
    type: オブジェクト
    required: false
    enabled_when: '`kind` が `table` のとき'
    description: ER 図のテーブルの `{ name, label, desc, columns }`。タイトルを `{論理名}（{物理名}）` にし、概要と、`desc` を持つ列の名前と説明を並べる
  - name: value
    type: 文字列
    required: false
    enabled_when: '`kind` が `item` のとき'
    description: '項目の値の文。`label` に系列の名前（円とドーナツは項目の名前）を配置し、折れ線・面・棒・積み上げ・横棒・レーダー・組み合わせは `{横の目盛り}: {値}`、散布図は `{x のラベル} {x}・{y のラベル} {y}`、バブルはその後ろに `・{大きさのラベル} {値}`、円とドーナツは `{値}{unit}（{割合}）` にする'
  - name: merged
    type: オブジェクトの配列
    required: false
    enabled_when: '`kind` が `merged` のとき'
    description: まとめた元の線（`{ from, to, label }`）。`{元} → {先}` とラベルを 1 行ずつ並べる
events:
  - name: 開く・閉じる
    when: 持ち主にポインターを乗せるかフォーカスする。離すか Esc を押す。タッチの端末では持ち主をタップする。もう一度タップするか、ツールチップと持ち主の外をタップする
    value: ツールチップの `hidden`
    description: '`mount` が 1 つだけ開き、ツールチップの上では閉じず、Esc で閉じてフォーカスを持ち主に残す'
uses:
  - component: CMP-472-53#
    how: ノードの中の用語の下線と意味はこの部品ではなく用語のツールチップで出す
accessibility:
  - ツールチップは `role="tooltip"` で、持ち主（線のラベルのボタン・ノードの右上のマーカーのボタン・グループのタイトルの右のマーカーのボタン・`tabindex="0"` を持つグラフの項目・ER 図のテーブルの説明のボタン）は `aria-describedby` でそれを指す。ノードのマーカーの外では開かない
  - ノードのマーカーのボタンは、`io` を持つとき `aria-label="「{ノードの名前}」の入力・処理・出力"`、`hint` だけを持つとき `aria-label="「{ノードの名前}」の説明"` を持つ
  - ER 図のテーブルの説明のボタンは `aria-label="「{論理名}」の説明"` を持ち、ツールチップをテーブルの下（下に収まらないときは上）に出す。どの持ち主も `tooltips.diagramPlacement` に従う
  - ホバーとフォーカスの両方で出し、Esc で消え、上に乗っても消えない（WCAG 1.4.13）。タッチの端末では持ち主のタップで開閉を切り替え、ツールチップと持ち主の外のタップで閉じる。ポインターの形状は変えない
  - 理解に必須のことは入れず、線とノードの要約だけで図を理解できるようにする。印刷では出さない
  - グループのタイトルのマーカーのボタンは `aria-label="「{タイトル}」の説明"` を持つ。グラフの項目はフォーカスしたときに輪で示す
status: planned
introduced:
  pr: 42
test_file: tests/integration/lib/diagram-tooltip.story.test.ts
