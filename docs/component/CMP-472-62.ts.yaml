id: CMP-472-62
visibility: internal
title: "記載の警告"
implementation: "src/parts/syntax-warning.ts#renderSyntaxWarning"
story: "Parts/SyntaxWarning"
test_file: tests/integration/lib/syntax-warning.story.test.ts
states:
  - name: TypeMismatch
    description: マーカーの値の型が合わない。本文だけを出す
    args:
      - name: mark
        value: '<!-- tabs: {"collapse": "closed"} -->'
      - name: message
        value: 'の `collapse` には `open`・`title` を持つオブジェクトを記載してください（例 `{"open": false}`）。折り畳みに入れずに描いています。'
  - name: InvalidJson
    description: マーカーの引数を JSON として読めない
    args:
      - name: mark
        value: '<!-- details: {"title": 補足} -->'
      - name: message
        value: の引数を JSON として読めません（11 文字目の `補` で、値の文字を `"` で囲んでいません）。値の文字は `"` で囲んでください。既定の設定で描いています。
  - name: CommentEndInValue
    description: 値に `-->` を記載し、コメントがそこで閉じた
    args:
      - name: mark
        value: '<!-- details: {"title": "a -->'
      - name: message
        value: の引数を JSON として読めません（文字の値が閉じていません）。値に `-->` を記載すると、コメントがそこで閉じます。`>` を `\u003e` にした `--\u003e` で記載してください。既定の設定で描いています。
  - name: LegacyExtension
    description: 拡張のマーカーの引数が今の書き方（JSON のオブジェクトでない）
    args:
      - name: mark
        value: '<!-- greet: world -->'
      - name: message
        value: 'の引数は JSON のオブジェクトで記載してください（例: `<!-- greet: {"target": "world"} -->`）。拡張 `greet` の部品は描いていません。`mdmark upgrade` の移行の報告で、記載し直す箇所を確かめられます。'
  - name: Items
    description: 表のマーカーに、読み込めない指定を複数記載した。本文の後に項目を並べる
    args:
      - name: mark
        value: '<!-- table: {"kind": "data", "columns": {"数量": {"total": [{"calc": "max"}]}, "名前": {"hidden": true}}} -->'
      - name: message
        value: の読み込めない指定を当てずに描いています。
      - name: items
        value: '[{"label":"columns.数量.total[0].calc","message":"`max` は選べる値にありません。選べる値は `sum`・`avg`・`count` です"},{"label":"columns.名前.hidden","message":"先頭の列は隠せません。当てずに描いています"}]'
  - name: BrokenReference
    description: 切れた図表の参照。マーカーを持たず本文だけを出す
    args:
      - name: message
        value: 'リンク先の `#fig-missing` の図表がありません。`<!-- fig: {"id": "missing"} -->` を図か表の直前に記載するか、リンク先を修正してください。'
  - name: ExtensionSchema
    description: 拡張の引数が Schema に合わない。issue ごとの項目を並べる
    args:
      - name: mark
        value: '<!-- greet: {"target": "World", "count": "2"} -->'
      - name: message
        value: の引数が、拡張 `greet` の決まりに合いません。修正してから再読み込みしてください。
      - name: items
        value: '[{"label":"target","message":"Invalid format: Expected /^[a-z]+$/ but received \"World\""},{"label":"count","message":"Invalid type: Expected number but received \"2\""}]'
  - name: LongMark
    description: マーカーが長く枠の幅を超える。マーカーが枠の中で折り返す
    args:
      - name: mark
        value: '<!-- table: {"kind": "data", "columns": {"とても長い列の名前": {"filter": {"type": "range"}}, "もう一つの長い列の名前": {"filter": {"type": "text"}}, "更新日": {"filter": {"type": "date"}}}} -->'
      - name: message
        value: の `filter.type` の `range` は選べる値にありません。選べる値は `select`・`text`・`date` です。
  - name: GlossaryColumn
    description: 用語集の表のマーカーに、表に無い列名を記載した
    args:
      - name: mark
        value: '<!-- glossary: {"term": {"column": "用語"}, "meaning": {"column": "説明"}} -->'
      - name: message
        value: の `meaning.column` の列 `説明` が表にありません。表の列は `用語`・`意味` です。列名を修正してください。この表からは用語を入れずに描いています。
  - name: GlossaryMissingArg
    description: 用語集の表のマーカーに、必須の `meaning` を記載していない
    args:
      - name: mark
        value: '<!-- glossary: {"term": {"column": "用語"}} -->'
      - name: message
        value: 'に必須の `meaning` がありません。意味の列を `"meaning": {"column": "列名"}` で指してください。この表からは用語を入れずに描いています。'
  - name: ViewGroupColumn
    description: ビューのマーカーの `board.group.column` に、表に無い列名を記載した
    args:
      - name: mark
        value: '<!-- view: {"board": {"group": {"column": "優先度"}}} -->'
      - name: message
        value: の列 `優先度` は表にありません。表の列は `タイトル`・`状態`・`担当` です。ボードにせず、表で描いています。
  - name: ViewNoTable
    description: ビューのマーカーの範囲に表が無い
    args:
      - name: mark
        value: '<!-- view: {"board": {"group": {"column": "状態"}}} -->'
      - name: message
        value: の範囲に、項目にする表がありません。範囲の中に Markdown の表を記載してください。範囲の中身はそのまま描いています。
  - name: ViewUnknownIcon
    description: ビューのマーカーの `board.values.{値}.icon` に、使用できないアイコンの名前を記載した
    args:
      - name: mark
        value: '<!-- view: {"board": {"group": {"column": "状態"}, "values": {"完了": {"icon": "rocket"}}}} -->'
      - name: message
        value: のアイコン `rocket` は使用できません。使用できるアイコンは `circle`・`circle-dashed`・`circle-dot`・`circle-pause`・`circle-check`・`circle-x`・`inbox`・`archive`・`clock`・`flag`・`star`・`bug`・`eye`・`lock`・`zap`・`ban` です。`完了` の列には既定のアイコンを付けています。
  - name: IconName
    description: '`icon:` の名前が Lucide の名前の記載方法に合わない'
    args:
      - name: mark
        value: icon:Rocket!
      - name: message
        value: 'の `Rocket!` は Lucide のアイコンの名前になりません。名前は英小文字・数字・`-` で記載します（例: `rocket`）。記載した文字のまま表示しています。'
  - name: IconNotInLucide
    description: '`icon:` の名前が Lucide に無い'
    args:
      - name: mark
        value: icon:no-such-icon
      - name: message
        value: の `no-such-icon` は Lucide に無いアイコンの名前です。https://lucide.dev/icons/ で名前を確認してください。記載した文字のまま表示しています。
  - name: ColumnsCount
    description: columns の範囲の列の数が 2〜3 でない
    args:
      - name: mark
        value: <!-- columns -->
      - name: message
        value: の範囲が 4 列です。横に並べられるのは 2〜3 列です。`<!-- column -->` を減らしてください。中身を記載した順に表示しています。
  - name: IncludeMissing
    description: include の取り込み先の行の範囲が無い
    args:
      - name: mark
        value: '<!-- include: {"path": "src/app.ts", "lines": {"from": 20, "to": 22}} -->'
      - name: message
        value: の `src/app.ts` は 12 行で、20〜22 行目がありません。行の範囲を修正してください。
  - name: IncludeCircular
    description: include の取り込みが循環する
    args:
      - name: mark
        value: '<!-- include: {"path": "a.md"} -->'
      - name: message
        value: の取り込みが循環しています（`a.md` → `b.md` → `a.md`）。この場所では取り込んでいません。
  - name: CsvColumns
    description: CSV の列の数が見出しの行とそろわない
    args:
      - name: message
        value: CSV の 2 行目・3 行目の列の数が、見出しの行の 3 列と違います。見出しの列の数にそろえて表示しています。
lead: 記法のマーカーや拡張の引数に読み込めない指定がある箇所に配置し、作成者へ読み込めない指定と修正方法を通知する枠。HTML 文字列を返却し、ブラウザと Node で同じ出力になる。
args:
  - name: mark
    type: 文字列
    required: false
    default: '""'
    description: '読み込めない指定を記載したマーカーの文字（`<!-- tabs: {"collapse": "closed"} -->` など）。本文の頭の `code` に入れる（HTML として特別な文字はエスケープする）。空ならマーカーを出さない'
  - name: message
    type: 文字列
    required: true
    description: 何が読み込めず、どう修正し、どう描いたかの本文。行内のコードにする箇所は `` ` `` で囲む
  - name: items
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 読み込めない指定が複数あるときの項目（`{ label, message }`）。本文の後の `ul` に、`label` を `code` にして並べる。空なら `ul` を出さない
css_properties:
  - name: --mdmark-color-notice-border
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 枠の破線とタイトルのアイコンの色
  - name: --mdmark-color-text
    syntax: <color>
    default: '#18181b（ダーク #ededef）'
    description: タイトルと本文の文字の色
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: 枠の角丸
accessibility:
  - 枠は `role="note"` を持ち、タイトル `記載の警告` の文言で通知する（色とアイコンだけに頼らない）
  - タイトルのアイコンは CSS で付け、スクリーンリーダーに含めない
  - マーカーは長くても枠の中で折り返し、横スクロールを出さない
refs:
  - IF-472-34#constraints[作成者の誤り]
  - IF-472-32#constraints[引数の検査]
status: planned
notes:
  HTML: '`<div class="mdmark-syntax-warning" role="note"><p class="mdmark-syntax-warning-title">記載の警告</p><p><code>{mark}</code>{message}</p><ul><li><code>{label}</code>: {message}</li></ul></div>`。呼び名は確認ログの決定（記載方法を誤った箇所に出す枠の呼び名）。モックは `docs/mock/components/syntax-warning/`'
