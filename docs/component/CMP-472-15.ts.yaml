id: CMP-472-15
visibility: internal
title: "コメントのマーカー"
implementation: "src/parts/comment.ts#renderCommentMark"
story: "Parts/CommentMark"
states:
  - name: Default
    description: 段落の中のマーカー
    args:
      - name: text
        value: テーマの変数
  - name: Expanded
    description: 吹き出しを開いている
    args:
      - name: text
        value: テーマの変数
      - name: expanded
        value: 'true'
  - name: Focused
    description: '`focusComment` で移り、強調している'
    args:
      - name: text
        value: テーマの変数
      - name: focused
        value: 'true'
lead: コメントが付いた本文の文字を包むマーカー。本文の文字は変えず、押すと付いたコメントの吹き出しを開く。HTML 文字列を返却する。
args:
  - name: text
    type: 文字列
    required: true
    description: 包む本文の文字。文字として出し、HTML として解釈しない
  - name: expanded
    type: 真偽値
    default: 'false'
    description: 吹き出しを開いているか。`aria-expanded` に入れる
  - name: focused
    type: 真偽値
    default: 'false'
    description: '`focusComment` で移ったマーカーか。`true` なら `data-focused` を付け、地の色を `--mdmark-color-comment-line` を 22% 混ぜた色に濃くし、2px の `--mdmark-color-comment-line` の線で全周を囲む（線と文字の間は 2px）'
events:
  - name: 吹き出しを開く
    when: マーカーを押すか、フォーカスして Enter・Space を押す
    value: マーカーの `aria-expanded`
    description: '`mount`・`mountComments` がマーカーの下に付いたコメントの吹き出しを開く'
css_properties:
  - name: --mdmark-color-comment-bg
    syntax: <color>
    default: '#f2effe（ダーク #25222d）'
    description: マーカーの地の色と、入力欄を開いている間の選んだ文字の色
  - name: --mdmark-color-comment-line
    syntax: <color>
    default: '#6d28d9（ダーク #c4a7ff）'
    description: マーカーの下線の色
accessibility:
  - '`mark` に `tabindex="0"`・`role="button"`・`aria-haspopup="dialog"`・`aria-expanded` を付ける'
  - '`aria-describedby` で文書の中に 1 つ配置する説明 `コメントが付いた箇所` を指す'
  - マーカーは地の色と下線で示し、色だけに頼らない
  - 強調は全周の線でも示し、地の色だけに頼らない。吹き出しを開いているマーカー（`aria-expanded="true"`）の線より目立たせる
refs:
  - IF-472-35#constraints[コメントの操作]
  - IF-472-35#constraints[コメントの箇所]
  - IF-472-35#constraints[コメントの箇所へ移る]
status: planned
notes:
  HTML: '`<mark class="mdmark-comment-mark" tabindex="0" role="button" aria-haspopup="dialog" aria-expanded="false" aria-describedby="mdmark-comment-hint">{text}</mark>`。モックは `docs/mock/components/comment/`'
  印刷: 地の色を削除し、下線だけを残す
test_file: tests/integration/lib/comment-mark.story.test.ts
