  - id: include
    name: 取り込んだ中身
    kind: container
    description: include のマーカーの場所に、取り込んだ文書の全体・見出しの中・行の範囲を本文と同じ外観で描く。取り込んだことを示すラベルは出さない
    position: 描く先の要素 > 本文の列
    visible_when: '`include` がオンで、取り込み先があるとき'
    refs:
      - IF-472-34#constraints[取り込み]
    status: planned
    introduced:
      pr: 307
  - id: pagebreak
    name: 改ページ
    kind: container
    description: 印刷のときだけこの場所で改ページする。画面では何も出さず高さを持たない
    position: 描く先の要素 > 本文の列
    visible_when: 印刷のとき（`pagebreak` がオン）
    refs:
      - IF-472-34#constraints[改ページ]
    status: planned
    introduced:
      pr: 307
  - id: wide
    name: wide の範囲
    kind: region
    description: wide の範囲を本文の幅を越えて広げる。範囲の上の本文の幅の右端に切り替えのボタンを配置する
    position: 描く先の要素 > 本文の列（広げた幅は右側の目次・文書の一覧の列と右端の線の内側）
    component: CMP-472-7#
    args:
      - name: html
        value: 範囲の中身を描いた HTML
      - name: state
        value: '`<!-- wide: {"open": false} -->` なら `narrow`、それ以外は `wide`。読者がボタンを押すたびに入れ替える'
      - name: toggle
        value: '`mount` は `true`、`render` は `false`'
    action: 切り替えのボタンを押すと、広げた幅と本文の幅を切り替える。印刷では用紙の幅に収め、ボタンを出さない
    visible_when: '`wide` がオンのとき。ボタンは広げられる幅（右側の目次を付けたときは描く先の要素、付けないときは描く先の要素の親の幅）が本文の幅より広いときだけ'
    refs:
