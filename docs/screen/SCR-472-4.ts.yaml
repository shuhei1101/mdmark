けたファイルツリーで描きます。罫線のまま見せるときは、直前に <!-- code: {"tree_warning": false} --> を記載してください。コードブロックのまま描いています。`（言語の無いコードブロックは `言語 {言語} のコードブロックに` を `言語の無いコードブロックに` にする。直前の `code` のマーカーの `tree_warning` が `false` のコードブロックには配置しない） / ビューの `board.group.column` の列が表に無い: `{mark} の列 {列名} は表にありません。表の列は {列の並び} です。ボードにせず、表で描いています。` / ビューの列に無い値: `{mark} の board.values の {値} は {列名} の列にありません。列の値は {値の並び} です。当てずに描いています。` / ビューの範囲に表が無い: `{mark} の範囲に、項目にする表がありません。範囲の中に Markdown の表を記載してください。範囲の中身はそのまま描いています。` / ビューの使用できないアイコン: `{mark} のアイコン {名前} は使用できません。使用できるアイコンは {並び} です。{値} の列には既定のアイコンを付けています。` / コードブロックのマーカーの行の指定: `{mark} の読み込めない指定を当てずに描いています。` と、項目 `{キーのパス}: コードブロックに無い行の番号です。コードブロックは {最初の行の番号}〜{最後の行の番号} 行目です`・`{キーのパス}: to が from より小さい範囲です。{"from": 2, "to": 4} のように記載してください`（`{キーのパス}` は `highlight[0]`・`fold[1].to` など） / コードブロックのマーカーの直後にコードブロックが無い: `{mark} の直後にコードブロックがありません。マーカーの次の行にコードブロックを記載してください。` / 知らないコードの行のマーカー: `コードの行のマーカー {マーカー} は使用できません。使用できるマーカーは [!code ++]・[!code --]・[!code highlight]・[!code focus]・[!code error]・[!code warning] です。{n} 行目には当てず、記載した文字のまま描いています。`（知らないマーカー 1 つにつき 1 つの警告） / 拡張の引数: `{mark} の引数が、拡張 {name} の決まりに合いません。修正してから再読み込みしてください。` と、issue ごとの項目（拡張を登録するの制約「引数の検査」） / 図の部品の定義の誤り（`{図}` はマーカーの図の種類の名前（`chart` はグラフ・`param` は操作できる部品・`er` は ER 図）、`{呼び名}` はグラフなら「このグラフ」、操作できる部品なら「この部品」、それ以外は「この図」）: JSON のコードブロックが無い・2 つ以上: `{図}の部品の定義を読み込めません。マーカーの範囲に json のコードブロックを 1 つだけ配置してください。{呼び名}は描いていません。` / JSON として読み込めない: `{図}の部品の定義を JSON として読み込めません（{行} 行目の {読み込めた最後の部分} の後に {足りない記号} がありません）。{呼び名}は描いていません。` / 構造に合わない: `{図}の部品の定義を読み込めません。{読み込めない箇所と修正方法の文}。{呼び名}は描いていません。`（例 `系列「担当者」の点が 4 つで、横の目盛り（x.ticks）の 5 つと合いません`・`ノード「分類」の種類 robot は使用できません。使用できる種類は llm・dm・script・mcp・data・external・start・question・action・result です`）。読み込めない箇所が 2 つ以上あるときは、本文に 1 つ目を記載し、残りを項目に並べる。埋め込んだ HTML の中の custom element（`<mdmark-chart>` など）の定義の誤りも同じ文言で、`{図}` はその要素の図の種類 / `<!-- html -->` の範囲に `html` のコードブロックが無い・2 つ以上: `<!-- html --> の範囲に html のコードブロックを 1 つだけ配置してください。範囲の中身はそのまま描いています。` / 拡張のマーカーの部品の定義を JSON として読み込めない: `{mark} の部品の定義を JSON として読み込めません（{行} 行目の {読み込めた最後の部分} の後に {足りない記号} がありません）。拡張 {name} の部品は描いていません。` / 廃止した図の範囲（`{名前}` は `flow`・`sequence`）: `<!-- {名前} --> の図の記載方法は廃止しました。mdmark upgrade を実行すると、map の範囲（Mermaid と補足）へ書き換えます。この図は描いていません。`（範囲の場所に 1 つ） / 埋め込んだ HTML の中の廃止した図の要素（`{要素}` は `mdmark-flow`・`mdmark-sequence`）: `<{要素}> の要素は廃止しました。埋め込んだ HTML の外に <!-- map --> の範囲で記載し直してください。この図は描いていません。`（要素の場所に 1 つ） / map のノードの許さないリンク先（図の前の map の書き方の警告の項目）: `ノードのリンク先に使用できないものがあります。使用できるリンク先は http・https・mailto と相対パスです。このノードはリンクにせずに描いています。` と、ノードごとの項目 `{ID}: {記載したリンク先}`。今の書き方の記法のマーカー（名前の後ろが `{` で始まらない引数）の読み込めない指定は、mdmark v0.10.0 の文言のまま、引数の語（`filter=`・`closed` など）で指して出す。記法のマーカーの知らないキーと、今の書き方の知らない種類・`+機能`・`-機能`・キー・指定の単語には警告を配置しない / mermaid が解釈できないソース: `mermaid の図を描けません（{mermaid のエラーの 1 行目}）。コードブロックのまま表示しています。`（コードブロックの前に配置する）。文中のマーカー・ID・値は行内のコードにする'
