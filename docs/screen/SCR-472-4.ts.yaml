id: SCR-472-4
visibility: internal
title: 文書
elements:
  - name: 描く先の要素
    id: mdmark-root
    kind: container
    description: 利用側のページが `mount` に指定した要素。class `mdmark` を付け、地の色・内側の余白・角丸を適用する（枠と影は付けない）。配色は文書の page のマーカーの `scheme`・`opts.config.colorScheme`・祖先の class・`prefers-color-scheme` の順でライトかダークにし、印刷では明るい配色にする（文書を描く.ts の制約「明暗の当て方」「配色の切り替え」）。配色の値の組は page のマーカーの `theme` か `opts.config.colorTheme` で選んだテーマのものにする（同じ制約「選んだテーマ」）
    visible_when: 常時
    source: 文書を描く.request.el
    refs:
      - IF-472-35#
  - name: コードブロック
    id: code-block
    kind: region
    position: 描く先の要素
    description: 'Markdown のコードブロック。上に帯を配置し、左端に言語のラベルとタイトル、右端にコードのコピーのボタンを出す。帯は本文と同じ地にし、帯とコードの間に線を出さず、帯とコードを 1 つの外側の枠線と角丸で囲む（ダークの配色と印刷でも同じ）。狭い幅ではブロックの中で横スクロールし、続きがある側の端に影を出す（利用側の `pre` への汎用の CSS でも折り返さない）。直前の `<!-- code: {…} -->` の `wrap` が `true` のブロックだけは、長い行を枠の幅で折り返す。印刷では折り返す。スクリーンリーダー向けの名前（`aria-label`）は、タイトルがあれば `コード: {タイトル}`、ファイル名があれば `コード: {ファイル名}`、言語があれば `コード: {言語の識別子}`、どれも無ければ `コード`。情報文字列の最初の単語は最初の `:` の前を言語、後ろをファイル名として読み込む（```python:hoge.py）。`code` がオンで、直前に `<!-- code: {…} -->` か行末にコードの行のマーカーがあるときは、コードブロックの部品でタイトル・行番号・行の強調・追加した行と削除した行・注目する行・エラーと警告の行を付けて描く。インデントのある行は、レベルごとの縦線を描き、次の行がより深い行を開閉できるようにする。`syntax` がオンで、言語が色分けの言語の対応表にあるときは、描いた後に言語に応じて色分けする（色分けのライブラリかその言語のモジュールを読み込めないときは色分けせずに残す）'
    visible_when: 文書にコードブロックがあるとき
    tab_order: 0
    reason: キーボードで横スクロールできるように `tabindex="0"` を付ける。スクリーンリーダー向けの名前は情報文字列をそのまま使用し、言語名への対応表は持たない（モックの `TypeScript` は `ts` になる）
    component: CMP-472-18#
    args:
      - name: lines
        value: コードブロックの行（行末のコードの行のマーカーを削除した文字と、マーカーと `highlight` から決めた行の種類、インデントのレベル、畳む行の数、`fold` で最初から畳むか）
      - name: language
        value: コードブロックの情報文字列の言語
      - name: title
        value: '直前の `<!-- code: {…} -->` の `title`'
      - name: lineNumbers
        value: '直前の `<!-- code: {…} -->` に `lines` があるか'
      - name: fileName
        value: コードブロックの情報文字列の最初の単語の、最初の `:` より後ろ
      - name: copyState
        value: '`mount` が付けたときは `idle`、コピーした結果で `copied`・`failed`'
      - name: wrap
        value: '直前の `<!-- code: {…} -->` の `wrap` が `true` か'
    refs:
      - IF-472-35#constraints[色分けの対象]
  - name: 表
    id: table
    kind: table
    position: 描く先の要素
    description: 'Markdown の表。表のマーカーで囲んだ表はその種類、囲まない表は既定の種類の表の部品にする。列ごとに中身の量から折り返すかと列の幅を決め（部品設計『表』の注記「列の幅」）、長文の列が折り返す表は本文の幅いっぱいに広げ、全ての列が折り返さずに収まる表は列の幅の合計で描く。全ての列の最小の幅の合計が本文の幅に収まらないときだけ、最小の幅で描いて表の中で横スクロールし、続きがある側の端に影を出す。縦の高さの上限は持たず、表が画面に残っている間は見出し行を画面の上端（`--mdmark-sticky-top` だけ下）に、集計の行を画面の下端に留める。紙の幅が 40rem 以下の印刷では、行ごとの「列名: 値」の並びに追加する。スクリーンリーダー向けの名前（`aria-label`）は `表: {直前の見出しの文字}`（直前に見出しが無ければ `表`）。`table` の機能がオフのときは部品を使用せず今の表を描く'
    visible_when: 文書に表があるとき
    tab_order: 0
    sorting: 種類と `features` と列の設定で決まる。並べ替えは長文の列（`columns.{列名}.sort` の `true` の列を除く）と `columns.{列名}.sort` の `false` の列に付けない（表の種類と `features.sort` の記載によらない）。`data` は並べ替え（降順 → 昇順 → 元の並び）・ピン止め・`columns.{列名}.filter` で指定した列の絞り込み・列の幅の変更、既定の種類はピン止めと列の幅の変更、`plain` は無し。件数（`count`）・列の表示（`columns`）・列の並べ替え（`reorder`）・集計の行（`total`）・表のコピー（`copy`）・行へのリンク（`rowlink`）はどの種類の既定にも入らず、`features.{機能}` か、その機能の列の設定（`hidden` は `columns`、`total` は `total`）を記載した表にだけ付く。既定の並びは記載した順
    component: CMP-472-61#
    args:
      - name: kind
        value: 表のマーカーの種類（囲まない表と知らない種類は `default`）
      - name: features
        value: 種類の機能にマーカーの `+機能`・`-機能` を適用したもの
      - name: columns
        value: 表の見出し行のセル（`header.rows` で多段にした表は、列ごとに最も下で覆う見出しのセル）
      - name: rows
        value: 表の本文の行のセル
      - name: filters
        value: マーカーの `columns.{列名}.filter.type`（列名を列の位置として解釈する。`type` を省いた列は `select`）
      - name: collapse
        value: マーカーの `collapse.open` の `false`・`true` を `closed`・`open`（`collapse` が無ければ `none`）
      - name: headRows
        value: マーカーの `header.rows` の数の先頭の行を、`<<` を `colspan`・`^^` を `rowspan` として解釈した行ごとのセル（2 段以上のときだけ）
      - name: rowHeader
        value: マーカーの `header.columns` の数（無ければ 0）
      - name: mergeColumns
        value: 本文に `^^` を記載した列の位置
      - name: hide
        value: マーカーの `columns.{列名}.hidden` の `true` の列（先頭を除く列の位置として解釈する）
      - name: totals
        value: マーカーの `columns.{列名}.total[].calc`（列名を列の位置として解釈する）
      - name: rowIds
        value: '`rowlink` の機能の表の行ごとの、先頭のセルの文字から見出しと同じ規則で作った ID（文書の中の見出し・前の行と重なれば `-1`・`-2`）'
      - name: title
        value: マーカーの `collapse.title`（記載しなければ指定しない）
      - name: highlight
        value: マーカーの `columns.{列名}.highlight.color`（列名を列の位置として解釈する。色を省いた列は `blue`）
      - name: rowColors
        value: マーカーの `rows.colors` の `column` と `value`・`at` から決めた本文の行ごとの色（複数の要素が該当する行は後ろの要素の色）
      - name: pinned
        value: '`pin` の表で幅からはみ出す間は、マーカーの `columns.{列名}.pinned` の `true` の列の位置（無ければ行見出しの列、行見出しも無ければ先頭の列。`pinned` の `false` の列は除く。`pinMode` が `through` ならその最も右の列までの全ての列）。押したピン止めのボタンで変わる'
      - name: unpinned
        value: '`pinned` のうち、左から順に幅を足して表の見えている幅を超える列の位置（`mount` が表の幅・列の幅・ピン止め・列の表示と並びが変わるたびに求め直す）'
      - name: noSort
        value: '`render` が写した長文の列（`data-long`）のうちマーカーの `columns.{列名}.sort` が `true` でない列と、`columns.{列名}.sort` が `false` の列（列名を列の位置として解釈する）'
      - name: wide
        value: マーカーの `columns.{列名}.width.mode` の `nowrap` の列（列名を列の位置として解釈する）
      - name: check
        value: マーカーの `columns.{列名}.format.type` の `check` の列（列名を列の位置として解釈する）
      - name: order
        value: 読者がテーブル設定で動かした列の順（`reorder` の機能の表だけ。描くたびに Markdown に記載した順に戻る）
      - name: tree
        value: マーカーの `tree.key.column`（列名を列の位置として解釈する）
      - name: treeType
        value: マーカーの `tree.type.column`
      - name: treeRequired
        value: マーカーの `tree.required.column`
      - name: treeDefault
        value: マーカーの `tree.default.column`
      - name: example
        value: マーカーの `tree.example.heading` の見出しの直下のタブと、各タブの `yaml` のコードブロックの行とキーのパス
      - name: pinMode
        value: 設定の `table.pin`（`each`・`through`。他の値と省いたときは `each`）
      - name: widths
        value: 読者がつまみで指定した列の幅（`resize` の表だけ。描くたびに空に戻る）
      - name: resizing
        value: 読者がつまみをドラッグしている列の位置
    action: 'テーブル設定のパネルで列を動かす・隠す（要素「表のテーブル設定のパネル」）。列の見出しの右端のつまみで列の幅を変える（要素「表の列の幅のつまみ」）。`tree` の表は、行を押して選ぶと同じ親の範囲の縦線を濃くし、もう一度押すと解く。`columns` の機能の表で列の表示を切り替えるたびに、`opts.onColumnsChange` に表の番号と隠している列の名前を指定する'
    action_ref: IF-472-35#constraints[列の表示の通知]
    error_message: 'マーカーの誤りは表の前の記載の警告で通知する。`mark` はそのマーカーの文字。表に無い列名の `tree.key.column`: `{mark} の tree.key.column の列 {列名} が表にありません。表の列は {列の並び} です。階層にせずに描いています。` / 無い見出しの `tree.example.heading`: `{mark} の tree.example.heading の見出し {見出し} が文書に無いか、直下にタブがありません。見本を配置せずに描いています。`。文中のマーカー・列名・見出しは行内のコードにする'
  - name: 表のセル
    id: table-cell
    kind: label
    position: 描く先の要素 > 表
    description: '`td` は同じ列の見出しの文字を `data-label` に持ち、狭い紙の印刷で列名として出す。列の配置は Markdown の `:--`・`:-:`・`--:` に従い、class `mdmark-align-{left,center,right}` で適用する。`columns.{列名}.format.type` が `check` の列の `true`・`false` のセルは ✓ と空欄で出す'
    visible_when: 常時
  - name: 折り畳み
    id: details
    kind: details
    position: 描く先の要素
    description: 文書に記載した `details` と `summary`。開閉は文書に記載したとおり（`open` の有無）で始まる。印刷の機能がオンのとき、印刷の前に開き、印刷の後に開いたものだけをもう一度閉じる
    visible_when: 文書に `details` があるとき
    initial_state: 活性
    action: '`summary` を押すと開閉する（ブラウザの振る舞い）'
  - name: フロントマターの表示
    id: frontmatter
    kind: details
    position: 本文の先頭
    description: 文書の先頭の YAML のフロントマターを、見出し `フロントマター` の閉じた折りたたみに言語 `yaml` のコードブロックで出す（部品『フロントマター』）。印刷の機能がオンのとき、印刷の前に開き、印刷の後にもう一度閉じる
    visible_when: 文書の先頭にフロントマターがあり、機能 `frontmatter` がオンのとき（既定はオフで、オフのときはフロントマターを描かない）
    initial_state: 活性
    action: '`summary` を押すと開閉する（ブラウザの振る舞い）'
  - name: タスクのチェックボックス
    id: task-checkbox
    kind: input
    position: 描く先の要素 > リストの項目
    description: '`- [ ]` と `- [x]` の項目の頭に配置するチェックボックス。表示だけで操作できない'
    type: 真偽値
    io: 表示
    visible_when: 文書にタスクリストがあるとき
    initial_state: 非活性
    initial_value: '`[x]` なら `checked`'
  - name: 外部ライブラリのマーカーの場所
    id: embed
    kind: region
    component: CMP-472-64#
    args:
      - name: name
        value: マーカーの名前
      - name: args
        value: マーカーの引数
    position: 描く先の要素
    description: 対応表にあるマーカーと、`registerExtension` で登録した拡張のマーカーの場所。読み込み中のブロックを配置し、読み込んだモジュールの `draw` がこの要素に描く
    visible_when: 文書に対応表にあるマーカーがあるとき
  - name: 通知ブロック
    id: notice
    kind: label
    component: CMP-472-65#
    args:
      - name: name
        value: マーカーの名前（拡張は拡張の `name`）
      - name: source
        value: 対応表のマーカーは `library`、拡張のマーカーは `extension`
    position: 描く先の要素
    description: 外部ライブラリや拡張のモジュールを読み込めない、`draw` が例外を投げた、または拡張の `schema` の `validate` が失敗したマーカーの場所を置き換える
    visible_when: 外部ライブラリか拡張のモジュールを読み込めないときと、拡張の `validate` が失敗したとき
    refs:
      - IF-472-35#exceptions[なし（通知ブロック）]
  - name: 見出しとセクション
    id: section
    kind: heading
    component: CMP-472-21#
    args:
      - name: level
        value: 見出しの階層（1〜4）
      - name: id
        value: GitHub と同じ規則の見出しの ID
      - name: title
        value: 見出しの中身
    position: 描く先の要素
    description: h1〜h4 の見出しとそのセクション。`anchors` がオンのとき見出しに ID へのアンカーを、`sections` がオンのとき開閉のボタンを付ける。h5・h6 は ID とアンカーだけを付ける
    visible_when: 文書に見出しがあるとき
    initial_value: '開いた状態。見出しの直後に `<!-- section: {"open": false} -->` があるセクションは閉じた状態'
    action: 開閉のボタンでセクションを開閉する。Shift を押しながら押す（Shift+Enter・Shift+Space を含む）と、そのセクションと中の入れ子のセクションを全て同じ状態にする。URL の `#ID` が閉じたセクションの中を指すときはそのセクションを開き、見出しを指すときは見出し自身の閉じたセクションも開く
    refs:
      - IF-472-35#constraints[セクションと行の詳細の開閉]
      - IF-472-35#constraints[入れ子をまとめて開閉]
    status: planned
  - name: 目次
    id: toc
    kind: nav
    component: CMP-472-55#
    args:
      - name: headings
        value: 文書の h2・h3 の階層・ID・文字
    position: 描く先の要素
    description: '`<!-- toc -->` の場所に配置する目次'
    visible_when: 文書に `<!-- toc -->` があり、`toc` がオンのとき
    action: 項目を押すとその見出しへ移る（ページ内のリンク）
    status: planned
  - name: 注意書き
    id: callout
    kind: region
    component: CMP-472-52#
    args:
      - name: kind
        value: 引用の 1 行目の種類（知らない種類は `note`）
      - name: collapsed
        value: 種類の末尾に `-` があるか
    slots:
      - name: default
        value: 引用の 2 行目からの本文
    position: 描く先の要素
    description: 1 行目が `[!NOTE]` などの引用
    visible_when: 文書に注意書きの引用があり、`callout` がオンのとき
    initial_value: 閉じた注意書きは閉じた状態
    status: planned
  - name: タブ
    id: tabs
    kind: tabs
    component: CMP-472-22#
    args:
      - name: titles
        value: 範囲で最初に出る見出しの階層の見出しの文字
      - name: group
        value: タブのマーカーの `group`（記載しないときは指定しない）
      - name: collapse
        value: マーカーの `collapse.open` の `false`・`true` を `closed`・`open`（`collapse` が無ければ `none`）
      - name: title
        value: マーカーの `collapse.title`（記載しなければ指定しない）
    slots:
      - name: default
        value: 区切りの見出しから次の見出しの前までの中身
    position: 描く先の要素
    description: '`<!-- tabs -->` の範囲'
    visible_when: 文書にタブの範囲があり、`tabs` がオンのとき
    initial_value: 1 つ目のタブを選んだ状態。`group` を持ち、localStorage にその組で残したタブ名のタブがあればそのタブを選んだ状態。URL の `#ID` がタブの中の要素を指すときは、localStorage より優先してその要素を含むタブを選んだ状態。`closed` の範囲は見出しだけを出した閉じた状態
    action: タブを押すか矢印キーで中身を切り替える。`group` を持つときは、ページの同じ `group` で同じタブ名を持つタブも切り替え、選んだタブ名を残す。URL の `#ID`（`hashchange` を含む）が選ばれていないタブの中の要素を指すときは、そのタブを選んでから要素へ移る（選んだタブ名は残さず、同じ `group` のほかのタブも切り替えない）
    refs:
      - IF-472-35#constraints[タブの操作]
      - IF-472-35#constraints[URL の ID でタブの中へ移る]
    status: planned
  - name: ステップ
    id: steps
    kind: list
    component: CMP-472-20#
    args:
      - name: items
        value: 範囲の最初の番号付きリストの項目
      - name: collapse
        value: マーカーの `collapse.open` の `false`・`true` を `closed`・`open`（`collapse` が無ければ `none`）
      - name: title
        value: マーカーの `collapse.title`（記載しなければ指定しない）
    position: 描く先の要素
    description: '`<!-- steps -->` の範囲の番号付きリスト'
    visible_when: 文書にステップの範囲があり、`steps` がオンのとき
    initial_value: '`collapse.open` が `false` の範囲は見出しだけを出した閉じた状態、それ以外は全ての手順を出した状態'
    status: planned
  - name: ファイルツリー
    id: file-tree
    kind: tree
    component: CMP-472-26#
    args:
      - name: nodes
        value: 言語 `tree` のコードブロックの罫線（`├── `・`└── `・`│   ` と `\|-- `・`` `-- ``・`\|   `）を読み込んだ項目。前に空白がある最初の `#` で名前と注釈を分け、注釈はインラインを描いた HTML
      - name: source
        value: コードブロックの中身
      - name: open
        value: '直前の `<!-- tree: {…} -->` の `depth`（記載しないか読み込めないときは指定しない）'
      - name: interactive
        value: '`render` は `false`、`mount` が付けた後は `true`'
      - name: wrap
        value: '直前の `<!-- tree: {…} -->` の `wrap` が `true` か'
    position: 描く先の要素
    description: '言語 `tree` のコードブロック。長い名前と注釈は折り返さずにツリーの中で横スクロールし、直前の `<!-- tree: {…} -->` の `wrap` が `true` のツリーだけは、名前を名前の列の中で折り返し、注釈を名前の下の行に出す'
    visible_when: 文書に言語 `tree` のコードブロックがあり、`tree` がオンで、全ての行を読み込めたとき
    initial_value: '`depth` の階層まで開いた状態（指定が無ければ全てのフォルダを開く）。コピーボタンは `コピー`'
