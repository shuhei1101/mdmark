      - name: rawShown
        value: 読者が押すたびに入れ替える
    action: 押すと表を隠して元の CSV を出し、もう一度押すと表に戻す
    visible_when: '`csv` がオンで、表が言語 `csv` のコードブロックから作られたとき'
    refs:
      - IF-472-35#constraints[CSV の表と元の CSV の切り替え]
    status: planned
    introduced:
      pr: 307
