    status: planned
    introduced:
      pr: 307
  - id: csv-raw-toggle
    name: RAW のボタン
    kind: button
    label: なし（スクリーンリーダー向けの名前 `元の CSV を表示`）
    description: CSV の表の帯の右端に配置するコードのアイコンのボタン
    position: 描く先の要素 > CSV の表 > 帯の右端
    component: CMP-472-61#
    args:
