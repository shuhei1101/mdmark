    description: 文書の HTML の `ruby`。`rt` は親の文字の 0.6 倍と 11px の大きい方の大きさで出す
    position: 描く先の要素 > 本文の段落の中
    visible_when: 文書に `ruby` を記載したとき
    refs:
      - IF-472-34#constraints[ルビ]
    status: planned
    introduced:
      pr: 307
  - id: layout-columns
    name: 段組み
    kind: container
    description: columns の範囲の中身を 2〜3 列に並べる。描く先の要素が狭いときは縦に並べる
    position: 描く先の要素 > 本文の列
    component: CMP-472-51#
    args:
      - name: columns
        value: '`<!-- column -->` で区切った中身を描いた HTML'
    visible_when: '`columns` がオンで、列の数が 2〜3 のとき'
    refs:
      - IF-472-34#constraints[段組み]
    status: planned
    introduced:
      pr: 307
  - id: card-grid
    name: カードの格子
    kind: container
    description: cards の範囲のリストの項目を、アイコン・タイトル・説明のカードにして入るだけ横に並べる。描く先の要素が狭いときは 1 列に追加する。リンクを持つ項目はリンクのカード、持たない項目はリンクではないカード
    position: 描く先の要素 > 本文の列
    component: CMP-472-10#
    args:
      - name: items
        value: 範囲のリストの項目ごとの、最初のリンク先・リンクの文字・前の `icon:` のアイコン・残りの文字の説明
    visible_when: '`card-grid` がオンで、`<!-- cards -->` の範囲の中身がリスト 1 つのとき'
    refs:
      - IF-472-34#constraints[カードの格子]
    status: planned
    introduced:
      pr: 352
  - id: details-range
    name: details の範囲
    kind: details
    label: マーカーのタイトル（空のとき `詳細`）
    description: details の範囲をタイトルから開閉する
    position: 描く先の要素 > 本文の列
    component: CMP-472-3#
    args:
      - name: title
        value: マーカーのタイトル
      - name: html
        value: 範囲の中身を描いた HTML
      - name: open
        value: マーカーの `open`（省くと `false`）
    action: タイトルを押すと開閉する。印刷では開いて出す
    visible_when: '`details` がオンのとき'
    refs:
      - IF-472-34#constraints[details の範囲]
    status: planned
    introduced:
