id: SCR-472-5
visibility: internal
title: ClaudeCodeの返答と発言
lead: mod のプラグイン mdmark-style が描き換える Claude Code の返答と利用者の発言。返答の表・見出し・注意書き・コードブロック・開閉の範囲・行の詳細・ステップなどの本文の部品と、発言と返答の用語の下線・カード・脚注を、Claude Code の Box・Text・Button で描く。
mock: docs/mock/pages/claude-code-terminal/716/document-parts/
screen: src/mdmark-style/mod.tsx
test_file: tests/integration/ClaudeCodeプラグイン/mdmark-style/screen.test.tsx
elements:
  - name: 表
    id: reply-table
    kind: table
    io: 表示
    position: 返答
    description: 返答の Markdown の表。罫線で囲み、`kind` が `data` の表は見出しの行を太字にする
    visible_when: '`parts.table` が `true` のとき'
    constraints: 表の幅が端末の幅を超えるとき、デスクトップ版は表の中で横にスクロールし、ターミナル版・VS Code はセルの中で折り返す。折り返す位置は空白で、1 つの単語が列の幅を超えるときだけ単語の途中で折り返す
    refs:
      - IF-472-45#constraints[表]
      - CMP-472-61#
    status: planned
  - name: 見出し
    id: reply-heading
    kind: label
    io: 表示
    position: 返答
    description: '`#`〜`######` の見出しの文字。`#` の記号は描かない'
    visible_when: '`parts.heading` が `true` のとき'
    refs:
      - IF-472-45#constraints[見出し]
    status: planned
  - name: 注意書き
    id: reply-callout
    kind: label
    io: 表示
    position: 返答
    description: '`> [!NOTE]` などの 5 種の注意書き。種類の色の縦線と、先頭の種類のラベルの後ろに中身を描く'
    label: '種類のラベル: `NOTE`・`TIP`・`IMPORTANT`・`WARNING`・`CAUTION`（種類の後ろにタイトルを記載したときはタイトル）'
    visible_when: '`parts.callout` が `true` のとき'
    refs:
      - IF-472-45#constraints[注意書き]
      - CMP-472-52#
    status: planned
  - name: コードブロック
    id: reply-code
    kind: code
    io: 表示
    position: 返答
    description: 背景の面の中に、言語の色分けつきのコードを描く。`code` のマーカーの `title`・`lines`・`highlight` と行末の `[!code …]` を、タイトルの行・行番号・行の色で描く
    label: '右上の言語のラベル: コードブロックの言語（例 `ts`）'
    visible_when: '`parts.code` が `true` のとき'
    refs:
      - IF-472-45#constraints[コードブロック]
      - CMP-472-18#
    status: planned
  - name: コピーボタン
    id: reply-code-copy
    kind: button
    io: 入力
    position: 返答 > コードブロック > タイトルの行の右端
    description: コードブロックのコードをクリップボードへコピーする
    label: コピー
    visible_when: '`parts.code` が `true` のとき'
    action: 押すと `$.ui.copy` でマーカーを除いたコードをコピーする
    action_ref: IF-472-45#constraints[コードブロック]
    status: planned
  - name: 開閉のボタン
    id: reply-fold-toggle
    kind: button
    io: 入力
    position: 返答 > 開閉の範囲の先頭
    description: details の範囲・`closed` の見出しのセクション・`closed` の注意書きの、タイトルと開閉の状態
    label: 閉じているとき `▸ {タイトル}`、開いているとき `▾ {タイトル}`
    initial_value: 閉じた状態
    visible_when: '`parts.fold` が `true` のとき'
    action: 押すと開閉の状態を反転して返答を描き直す。開いているときはボタンの下に中身を描く
    action_ref: IF-472-45#constraints[開閉の範囲]
    refs:
      - CMP-472-3#
      - CMP-472-21#
    status: planned
  - name: 用語の下線
    id: term-underline
    kind: label
    io: 表示
    position: 発言・返答の段落・箇条書き・注意書き
    description: メッセージごとに用語の最初の出現に、共通スタイルの用語の下線の色で下線を付ける
    visible_when: '`parts.terms` が `true` で、`glossary` の用語が本文にあるとき'
    refs:
      - IF-472-46#constraints[下線]
      - CMP-472-53#
    status: planned
  - name: 用語のカード
    id: term-card
    kind: tooltip
    io: 表示
    position: 用語の下線 > 用語の次の行
    description: 用語の名前（太字）と意味。罫線と背景色で後ろの行を隠して手前に出す
    width: 48 桁と行の幅の短い方
    visible_when: '用語の下線が出ていて、`parts.hover_card` が `true` で、ポインターを用語に乗せている間'
    refs:
      - IF-472-46#constraints[カード]
      - CMP-472-53#
    status: planned
  - name: 脚注の番号
    id: term-footnote-ref
    kind: label
    io: 表示
    position: 用語の下線の後ろ
    description: 用語の出た順の番号を薄い色で描く
    label: '`[{番号}]`'
    visible_when: '用語の下線が出ていて、`parts.footnote` が `true` のとき'
    refs:
      - IF-472-46#constraints[脚注]
      - CMP-472-58#
    status: planned
  - name: 脚注の一覧
    id: term-footnotes
    kind: label
    io: 表示
    position: 発言・返答の本文の後ろ
    description: 脚注の番号ごとの用語の名前と意味を薄い色で並べる
    label: '`[{番号}] {名前}: {意味}`'
    visible_when: '用語の下線が出ていて、`parts.footnote` が `true` のとき'
    refs:
      - IF-472-46#constraints[脚注]
      - CMP-472-57#
    status: planned
  - name: 発言の背景の帯
    id: user-band
    kind: label
    io: 表示
    position: 発言
    description: 用語のマーカーを付けた発言を、Claude Code の標準の発言と同じ背景の帯と行頭の `❯` で描く
    visible_when: 用語のマーカーを付けた発言
    refs:
      - IF-472-46#constraints[背景の帯]
    status: planned
  - name: 行の詳細のボタン
    id: reply-row-detail-toggle
    kind: button
    io: 入力
    position: 返答 > 表 > 詳細を持つ行の先頭のセル
    description: '`<!-- row-detail -->` の詳細を持つ行の開閉の状態'
    label: 閉じているとき `[ ▸ ]`、開いているとき `[ ▾ ]`
    initial_value: 閉じた状態
    visible_when: '`parts.row_detail` が `true` のとき'
    action: 押すと開閉の状態を反転して返答を描き直す。開いているときは行の下に詳細の中身を 2 桁字下げして描く
    action_ref: IF-472-45#constraints[行の詳細]
    refs:
      - CMP-472-60#
    status: planned
  - name: ステップ
    id: reply-steps
    kind: label
    io: 表示
    position: 返答
    description: '`<!-- steps -->` の番号付きリスト。見出しの色の太字の番号と項目の中身を並べ、項目の間を罫線の色の `│` でつなぐ'
    visible_when: '`parts.steps` が `true` のとき'
    refs:
      - IF-472-45#constraints[ステップ]
      - CMP-472-20#
    status: planned
  - name: ファイルツリー
    id: reply-tree
    kind: label
    io: 表示
    position: 返答
    description: 言語 `tree` のコードブロック。罫線を薄い色、名前を本文の色で等幅のまま描き、注釈を同じ桁にそろえて薄い色で描く
    visible_when: '`parts.tree` が `true` で、罫線を解釈できるとき'
    constraints: 罫線を解釈できないときは、コードブロック（`reply-code`）で描く
    refs:
      - IF-472-45#constraints[ファイルツリー]
      - CMP-472-26#
    status: planned
  - name: バッジ
    id: reply-badge
    kind: label
    io: 表示
    position: 返答の段落・箇条書き・表のセルの中
    description: '`badge:` の文言。前後に 1 桁の空白を付け、色の名前の背景色と文字色（色が無いときは面の色と本文の色）で描く'
    visible_when: '`parts.inline` が `true` のとき'
    refs:
      - IF-472-45#constraints[行内の記法]
      - CMP-472-23#
    status: planned
  - name: 文字の色・蛍光ペン
    id: reply-text-color
    kind: label
    io: 表示
    position: 返答の段落・箇条書き・表のセルの中
    description: '`[文字]{color=色}` を色の名前の文字色の太字、`==文字==` を色の名前の背景色（既定は `yellow`）で描く'
    visible_when: '`parts.inline` が `true` のとき'
    refs:
      - IF-472-45#constraints[行内の記法]
      - CMP-472-48#
      - CMP-472-59#
    status: planned
  - name: キー
    id: reply-kbd
    kind: label
    io: 表示
    position: 返答の段落・箇条書き・表のセルの中
    description: '`kbd:` のキーを `+` で区切り、キーごとに `[Ctrl]` の太字と薄い色の `+` で描く'
    label: '`[{キー}]`'
    visible_when: '`parts.inline` が `true` のとき'
    refs:
      - IF-472-45#constraints[行内の記法]
      - CMP-472-11#
    status: planned
  - name: タブ名の見出し
    id: reply-stack-heading
    kind: label
    io: 表示
    position: 返答 > タブの範囲
    description: タブ名を見出し（`reply-heading`）と同じ描き方で描き、中身を 2 桁字下げして縦に並べる。段組み・カードの格子・wide は見出しを付けずに縦に並べ、ビュー・CSV は表（`reply-table`）で描く
    visible_when: '`parts.stack` が `true` のとき'
    refs:
      - IF-472-45#constraints[縦に並べる範囲]
      - CMP-472-22#
    status: planned
  - name: 表の番号
    id: reply-figure-label
    kind: label
    io: 表示
    position: 返答 > 番号を付けた表の上
    description: 返答のブロックの頭から数えた表の通し番号を薄い色で描く
    label: '`表 {番号}`'
    visible_when: '`parts.figure` が `true` で、表の直前に `<!-- fig -->` があるとき'
    refs:
      - IF-472-45#constraints[図と表の番号]
      - CMP-472-40#
    status: planned
refs:
  - IF-472-45#
  - IF-472-46#
  - CFG-472-4#
tags:
  - name: tool:claude-code
    main: true
  - name: topic:プラグイン
  - name: topic:テーブル
  - name: topic:注意書き
  - name: topic:コードブロック
  - name: topic:用語
  - name: topic:脚注
  - name: topic:ステップ
  - name: topic:ファイルツリー
  - name: topic:バッジ
  - name: topic:タブ
  - name: topic:色
  - name: topic:図表の番号
