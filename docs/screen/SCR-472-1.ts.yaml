id: SCR-472-1
visibility: internal
title: "VSCodeのコマンドと通知"
elements:
  - name: プレビューを横に開くボタン
    id: editor-title-open-preview
    kind: button
    position: Markdown のエディタのタイトル
    description: '`contributes.menus.editor/title` のボタン。アイコンは VS Code の `$(open-preview)`、ポインターを合わせるとコマンドの表示名を出す'
    label: 'mdmark: プレビューを横に開く'
    visible_when: '`editorLangId == markdown`'
    action_ref: IF-472-22#
    status: planned
    introduced:
      pr: 69
  - name: コマンドの表示名
    id: command-titles
    kind: label
    position: コマンドパレット
    description: '`contributes.commands` の `category` を `mdmark`、`title` を次にする。`mdmark.openPreviewToSide`: プレビューを横に開く（既定のショートカット `Shift+Alt+D`、Mac は `Shift+Option+D`）・`mdmark.openPreview`: プレビューを開く・`mdmark.refreshPreview`: プレビューをリロード・`mdmark.openConfig`: 設定ファイルを開く・`mdmark.openSettings`: 設定を開く・`mdmark.exportHtml`: HTML に書き出す・`mdmark.openInBrowser`: ブラウザで開く・`mdmark.printToPdf`: PDF に印刷'
    label: 'mdmark: {title}'
    visible_when: '`mdmark.refreshPreview` は mdmark のプレビューが開いているとき。他は `editorLangId == markdown` か mdmark のプレビューにフォーカスがあるとき（`mdmark.openConfig`・`mdmark.openSettings` は常時）'
    refs:
      - IF-472-22#exceptions[なし（Markdown でない）]
    reason: 「プレビューをリロード」は確認ログの決定。「プレビューを開く」「HTML に書き出す」「ブラウザで開く」「PDF に印刷」は単一ユースケースのシナリオの表記
    status: planned
    introduced:
      pr: 69
  - name: 雛形を作るかの確認
    id: confirm-create-config
    kind: dialog
    position: VS Code のモーダルのダイアログ
    description: '設定ファイルが無いときに `mdmark.openConfig` が `showInformationMessage(文, { modal: true, detail }, "作成")` で尋ねる。作らないときは VS Code が追加する「キャンセル」を押す'
    label: '文: `{雛形を作るパス} がありません。雛形を作りますか？`（雛形を作るパスは `mdmark.configPath`、空のときは `mdmark.config.yaml` を、インターフェース定義『設定を重ねて読み込む』の制約「パスの表示」のパスにしたもの。例 `mdmark.config.yaml がありません。雛形を作りますか？`）、detail: `features・libraries・theme・extensions の記載方法をコメントで添えたファイルを作ります。作った直後は、プレビューの外観は変わりません。`、ボタン: `作成`'
    visible_when: '`mdmark.openConfig` を呼び、設定ファイルが無いとき'
    action_ref: IF-472-25#
    status: planned
    introduced:
      pr: 69
  - name: 雛形の中身
    id: config-template
    kind: label
    position: 作った設定ファイルのエディタ
    description: 「作成」で記載する YAML。キーは記載せず、記載方法をコメントで示す
    label: |-
      ```yaml
      # mdmark の設定。端末の設定（~/.config/mdmark/settings.yaml）に重ねて読み込みます。端末の設定の config.cascade を true にすると、上のフォルダの mdmark.config.yaml も重ねます

      # 機能のオン・オフ（使用するときは次の 2 行の # を削除する）
      # features:
      #   callout: false

      # 外部ライブラリのモジュール。相対パスはこのファイルのあるフォルダから（使用するときは次の 2 行の # を削除する）
      # libraries:
      #   my-chart: ./libs/my-chart.js

      # 右側の目次の出し方。hover か fixed（使用するときは次の 2 行の # を削除する）
      # side-toc:
      #   mode: fixed

      # 配色のテーマ。dev-swiss・theme-paper・theme-slate・theme-contrast のどれか。VS Code の設定 mdmark.colorTheme が空でないときはそちらが優先（使用するときは次の 1 行の # を削除する）
      # colorTheme: theme-paper

      # 利用側の CSS。相対パスはこのファイルのあるフォルダから（使用するときは次の 1 行の # を削除する）
      # theme: ./theme.css

      # 拡張のモジュール。相対パスはこのファイルのあるフォルダから（使用するときは次の 2 行の # を削除する）
      # extensions:
      #   - ./extensions/example.js
      ```
    visible_when: 雛形を作ったとき
    refs:
      - CFG-472-3#settings[features]
      - CFG-472-3#settings[libraries]
      - CFG-472-3#settings[colorTheme]
    status: planned
    introduced:
      pr: 69
  - name: 書き出した通知
    id: notify-exported
    kind: notification
    position: VS Code の通知
    description: '`mdmark.exportHtml` が書き出せたときに `showInformationMessage` で出す。`mdmark.openInBrowser`・`mdmark.printToPdf` では出さない'
    label: '文: `HTML を書き出しました: {書き出したファイルのパス}`、ボタン: `ブラウザで開く`'
    visible_when: '`mdmark.exportHtml` が書き出せたとき'
    action: 「ブラウザで開く」を押すと、書き出した HTML を `env.openExternal` で開く
    action_ref: IF-472-15#constraints[通知]
    status: planned
    introduced:
      pr: 69
  - name: 書き出せない通知
    id: notify-export-failed
    kind: notification
    position: VS Code の通知
    description: 書き出す先に書き込めないときに `showErrorMessage` で出す（`mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf`）。理由は OS が返却した誤りの文
    label: '`HTML を書き出せませんでした: {書き出す先のパス}（{理由}）。設定 mdmark.export.outputDir を書き込めるフォルダに修正してください。`'
    visible_when: 書き出す先に書き込めないとき
    status: planned
    introduced:
      pr: 69
  - name: バージョンを決められない通知
    id: notify-version-undecidable
    kind: notification
    position: VS Code の通知
    description: 書き出すときに読み込むバージョンを決められないときに `showErrorMessage` で出す（`mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf`）
    label: '`HTML を書き出せませんでした。読み込む mdmark のバージョンを決められません。ネットワークにつながっているかを確認してから、もう一度実行してください。`'
    visible_when: '`mdmark.version` が `latest` で、タグ一覧を取れず前回のバージョンも無いとき'
    status: planned
    introduced:
      pr: 69
  - name: 設定を開くボタン
    id: editor-title-open-settings
    kind: button
    position: mdmark のプレビューのエディタのタイトル
    description: '`contributes.menus.editor/title` のボタン。アイコンは VS Code の `$(gear)`、ポインターを合わせるとコマンドの表示名を出し、スクリーンリーダー向けの名前もコマンドの表示名になる。キーボードで押せる（VS Code のエディタのタイトルのボタンのまま）'
    label: 'mdmark: 設定を開く'
    visible_when: mdmark のプレビューのパネルがアクティブなとき（`activeWebviewPanelId`）
    action: VS Code の設定画面を mdmark の項目に絞って開く
    action_ref: IF-472-24#
    reason: 歯車の配置場所は確認ログ「プレビューの歯車のボタンの配置場所と押したときの動き」の決定
    status: planned
screen: vscode/package.json
lead: VS Code 拡張機能が VS Code の画面に追加する入口（エディタのタイトルのボタン・コマンドパレットのコマンド）と、VS Code のダイアログ・通知に出す文言。外観は VS Code のままで、モックは作らない。
refs:
  - IF-472-15#
  - IF-472-25#
