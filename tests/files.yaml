# yaml-language-server: $schema=../dev/テンプレート/files.schema.yaml
files:
  - path: e2e/chart.ts
    description: E2E テストが使う見本のグラフの定義を受け持つ。E2E テストの準備や操作の仕方を変えるときに読む。
    tags: [topic:e2e, tool:playwright, topic:図]
  - path: e2e/cli.ts
    description: E2E テストで CLI を子プロセスで流し、終了コードと出力を受け取る処理を受け持つ。E2E テストの準備や操作の仕方を変えるときに読む。
    tags: [topic:e2e, tool:playwright, topic:cli]
  - path: e2e/diagram.ts
    description: E2E テストが使う図の見本の文書・固有の部品の代役・型の点検の実行と、図の倍率の読み取りを受け持つ。E2E テストの準備や操作の仕方を変えるときに読む。
    tags: [topic:e2e, tool:playwright, topic:図]
  - path: e2e/diff-samples.ts
    description: E2E テストが使う差分の見本の文書と 3 つのリビジョンを受け持つ。E2E テストの準備や操作の仕方を変えるときに読む。
    tags: [topic:e2e, tool:playwright, topic:差分]
  - path: e2e/diff-ui.ts
