# mdmark-style の設定（MDMARK_STYLE_CONFIG、無ければ ${XDG_CONFIG_HOME:-~/.config}/mdmark-style/settings.yaml）
# 全てのキーと既定値の見本。mdmark-style はこのファイルを読み込まない

global:
  # false のとき、返答・発言を描き換えない
  enabled: true
  # 描き換える場所（assistant は返答、user は発言）
  targets: [assistant, user]
  # 部品ごとのオン・オフ
  parts:
    table: true
    heading: true
    callout: true
    code: true
    # false のとき、開閉の範囲を開いたまま描く
    fold: true
    terms: true
    hover_card: true
    footnote: true
  # 用語を取る mdmark.config.yaml のパス（無いときは用語のマーカーを付けない。相対パスはこのファイルのフォルダから）
  # glossary: ~/notes/mdmark.config.yaml
  # false のとき、セッションの開始でマーカーの記載方法を注入しない
  inject_marker_guide: true

# プロジェクト（絶対パスかフォルダ名）ごとに global へ重ねる値（相対パスは起動したプロジェクトの直下から）
projects: []
#  - match: mdmark
#    glossary: docs/mdmark.config.yaml
