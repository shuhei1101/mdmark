  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/nonfunctional.schema.yaml
      ref: design-schemas/v8.4.0
