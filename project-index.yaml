      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: vscode
    title: VS Code 拡張機能
    paths: [vscode/files.yaml]
    exclude: [package-lock.json]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: plugin
    title: Claude Code プラグインの定義
    paths: [plugin/files.yaml]
    exclude: [THIRD_PARTY_LICENSES.txt, "*.js", mdmark.config.yaml]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: storybook
    title: Storybook の設定
    paths: [.storybook/files.yaml]
