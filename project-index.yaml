converters:
  - id: prompt-doc
    run: [project-index, prompt-doc]
# dev-docs の画面のタブとサイドバー。タブの並びとグループは knowledge の規約『開発ドキュメントのナビゲーション』に従う
nav:
  tabs:
    - title: はじめに
      items:
        - group: コアコンセプト
          items:
            - page: docs/guide-concept-rendering
            - page: docs/guide-concept-common-and-local
            - page: docs/guide-concept-index-and-backlinks
            - page: docs/guide-concept-bundle
            - page: docs/guide-concept-layered-config
            - page: docs/guide-concept-upgrade
            - page: docs/guide-concept-map
            - page: docs/guide-concept-diff
            - page: docs/guide-concept-claude-code
        - page: docs/guide-changelog
    - title: 使い方
      items:
        - group: 導入
          items:
            - page: docs/guide-install-load-dist
            - page: docs/guide-install-mount
            - page: docs/guide-install-upgrade
            - page: docs/guide-install-diff
        - group: 記載する
          items:
            - page: docs/guide-write-writing
            - page: docs/guide-write-tables
            - page: docs/guide-write-components
            - page: docs/guide-write-glossary
            - page: docs/guide-write-colors
            - page: docs/guide-write-media
            - page: docs/guide-write-figure-numbers
            - page: docs/guide-write-view-and-comments
        - group: 図を描く
          items:
            - page: docs/guide-diagram-draw
            - page: docs/guide-diagram-interactive-parts
            - page: docs/guide-diagram-map
            - page: docs/guide-diagram-mermaid
            - page: docs/guide-diagram-code-html
            - page: docs/guide-diagram-verify
            - page: docs/guide-diagram-local-parts
            - page: docs/guide-diagram-samples
        - group: カスタマイズ
          items:
            - page: docs/guide-customize-theme
            - page: docs/guide-customize-features
            - page: docs/guide-customize-extensions
            - page: docs/guide-customize-parts-js
            - page: docs/guide-customize-print
        - group: 書き出す
          items:
            - page: docs/guide-export-init
            - page: docs/guide-export-export
            - page: docs/guide-export-build
            - page: docs/guide-export-check
        - group: VS Code で確認する
          items:
            - page: docs/guide-vscode-preview
            - page: docs/guide-vscode-diff
            - page: docs/guide-vscode-html-pdf
        - group: Claude Code で使用する
          items:
            - page: docs/guide-claude-code-plugin
            - page: docs/guide-claude-code-setup
            - page: docs/guide-claude-code-server
            - page: docs/guide-claude-code-mcp-tools
    - title: 設計書
      items:
        - group: 全体
          items:
            - page: architecture
              title: アーキテクチャ図
            - page: nonfunctional
              title: 非機能要件
            - page: layout
              title: フォルダ構成
            - page: files_top/docs/design-policy.md
              title: デザイン方針
        - group: シナリオ
          items:
            - auto: {document: scenario}
        - group: インターフェース定義
          items:
            - auto: {document: interface}
        - group: モジュール構成
          items:
            - group: ライブラリ本体
              items:
                - auto: {document: module, filter: {field: name, op: prefix, values: ['ライブラリ本体 /']}}
            - group: VS Code 拡張機能
              items:
                - auto: {document: module, filter: {field: name, op: prefix, values: ['VS Code 拡張機能 /']}}
            - group: Claude Code プラグイン
              items:
                - auto: {document: module, filter: {field: name, op: prefix, values: ['ClaudeCodeプラグイン /']}}
        - group: 部品設計
          items:
            - auto: {document: component}
        - group: 画面設計
          items:
            - auto: {document: screen}
        - group: モック
          items:
            - group: assets
              items:
                - auto: {document: mock, filter: {and: [{field: id, op: prefix, values: [docs/mock/assets/]}, {not: {field: id, op: suffix, values: [/index.md]}}]}}
            - group: components
              items:
                - auto: {document: mock, filter: {and: [{field: id, op: prefix, values: [docs/mock/components/]}, {not: {field: id, op: suffix, values: [/index.md]}}]}}
            - group: pages
              items:
                - auto: {document: mock, filter: {and: [{field: id, op: prefix, values: [docs/mock/pages/]}, {not: {field: id, op: suffix, values: [/index.md]}}]}}
            - group: refs
              items:
                - auto: {document: mock, filter: {and: [{field: id, op: prefix, values: [docs/mock/refs/]}, {not: {field: id, op: suffix, values: [/index.md]}}]}}
            - group: styles
              items:
                - auto: {document: mock, filter: {and: [{field: id, op: prefix, values: [docs/mock/styles/]}, {not: {field: id, op: suffix, values: [/index.md]}}]}}
        - group: 設定
          items:
            - auto: {document: config}
        - group: ER 図
          items:
            - auto: {document: er}
        - group: データ
          items:
            - auto: {document: data}
        - group: 外部 API
          items:
            - auto: {document: external_api}
        - group: 外部ライブラリ
          items:
            - auto: {document: library}
        - group: 開発
          items:
            - page: test_procedure
              title: テスト実行方法
            - page: dev_command
              title: 開発コマンド
    - title: コード
      items:
        - group: ライブラリ本体
          items:
            - group: 直下
              items:
                - auto: {document: src, filter: {field: id, op: regex, values: ['^src/[^/]+$']}}
            - group: callout
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/callout/]}}
            - group: card
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/card/]}}
            - group: cli
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/cli/]}}
            - group: code-block
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/code-block/]}}
            - group: comments
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/comments/]}}
            - group: diagram
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/diagram/]}}
            - group: diff
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/diff/]}}
            - group: embedded-html
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/embedded-html/]}}
            - group: figure
              items:
                - auto: {document: src, filter: {field: id, op: prefix, values: [src/figure/]}}
            - group: footnote
