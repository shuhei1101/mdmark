  - id: layout
    title: フォルダ構成
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  # YAML の設計書でないファイルは、フォルダごとの管理用の YAML が 1 ファイル 1 行で持つ
  - id: files_top
    title: リポジトリの直下と docs/ の直下のファイル
    paths: [files.yaml]
    exclude: ["docs/pr/**", "dist/**", "tmp/**", package-lock.json, docs/README.md, docs/index.yaml, "docs/*/README.md", "docs/*/index.yaml", docs/_theme/_data/nav.project.yml, "docs/_theme/assets/vendor/**"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
  - id: mock
    title: モック
    paths: [docs/mock/files.yml]
    exclude: [comments.js, index.css, index.js, view.js, viewer.css, viewer.js, "*.gif", "*.png", "*.mp4", "*.mp3"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
  - id: terms
    title: 用語集
    paths: [docs/guide/用語集.yaml]
    schema:
      source: knowledge
      path: schemas/terms.schema.yaml
      ref: design-schemas/v9.7.0
    records: terms
    alias_type: term
  - id: docs
    title: 公開ドキュメント
    alias_type: doc
    paths: [docs/guide/files.yml]
    exclude: [README.md, index.yaml, はじめに.md, 使用方法.md, リファレンス.md]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: ライブラリ本体のコード
    paths: [src/files.yaml]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    exclude: ["*.webm"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: scripts
    title: 開発のスクリプト
    paths: [scripts/files.yaml]
