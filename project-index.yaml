# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/006a49034a210dfb1eb2f8b998abad760c002f5b/schemas/project-index.schema.json
version: "3"
name: mdmark
worktrees: [".claude/worktrees/*"]
description: Markdown 文書の表示（拡張記法・図・差分・部品）を各アプリで共通に使用するライブラリの設計書・公開ドキュメント・コード
github:
  repository: shuhei1101/mdmark
instructions: |-
  mdmark のガイドは、公開ドキュメントの行（kind が docs）のうちタグ topic:ガイド の文書。
  mdmark で文書を記載するときは、filter に {"and": [{"field": "tags", "op": "eq", "values": ["topic:ガイド"]}, {"field": "kind", "op": "eq", "values": ["docs"]}]} を指定して一覧を検索し、description の「〜ときに参照する」が作業に該当するページを view: "full" で読み込む。
  人が読み込む資料を記載するときは、最初に『文書の記載方法』（docs/guide/記載する-文書の記載方法.md）を読み込む。
  記法の記載方法を確認するときは『記法』（docs/guide/記法.mark.md）を読み込む。
  設計書は `docs/` の種類ごとのフォルダの YAML（`{ID}.yaml`）で、書式は `documents[].schema` が指す Schema が持つ。各文書の公開範囲は `visibility`（`public` / `internal`）で、YAML の文書はキー、Markdown は `files.yml` の行が持つ。
when:
  - mdmark の記法・部品・図の描き方を確認するとき
  - mdmark の CLI・公開関数・設定・索引のキーを確認するとき
  - mdmark のライブラリ・CLI・VS Code 拡張機能・Claude Code プラグインの設計書・コード・テストを調べるとき
documents:
  - id: data
    title: データ
    paths: ["docs/data/**/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/data.schema.yaml
      ref: design-schemas/v8.4.0
    writable: true
    metadata:
      name: title
      description: lead
      visibility: visibility
  # 設計書は種類ごとの行。index.yaml は目次なので exclude で除く
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: scenario
