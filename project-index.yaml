    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  # YAML の設計書でないファイルは、フォルダごとの管理用の YAML が 1 ファイル 1 行で持つ
  - id: files_root
    title: docs の直下の Markdown と Pages の共通レイアウト
    paths: [docs/_root/files.yml]
    exclude: [README.md, index.yaml, nav.yml, nav.project.yml, llms.txt, search.json, _config.yml]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
  - id: mock
    title: モック
    paths: [docs/mock/files.yml]
    exclude: [comments.js, index.css, index.js, view.js, viewer.css, viewer.js, "*.gif", "*.png", "*.mp4", "*.mp3"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
  - id: docs
    title: 公開ドキュメント
    paths: [docs/guide/files.yml]
    exclude: [README.md, index.yaml, はじめに.md, 使用方法.md, リファレンス.md]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: ライブラリ本体のコード
    paths: [src/files.yaml]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    exclude: ["*.webm"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: scripts
    title: 開発のスクリプト
    paths: [scripts/files.yaml]
    exclude: ["*.txt"]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.4.0
  - id: init_templates
    title: 雛形
    paths: [templates/files.yaml]
    records: files
    body_file: path
    schema:
