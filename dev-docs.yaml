# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/0c27b6525b43c781d4c258c433eebcf432190023/schemas/dev-docs.schema.json
version: "3"
name: mdmark
worktrees: [".claude/worktrees/*"]
description: Markdown 文書の表示（拡張記法・図・差分・部品）を各アプリで共通に使用するライブラリの設計書・公開ドキュメント・コード
github:
  repository: shuhei1101/mdmark
instructions: |-
  mdmark のガイドは、公開ドキュメントの行（kind が docs）のうちタグ topic:ガイド の文書。
  mdmark で文書を記載するときは、filter に {"and": [{"field": "tags", "op": "eq", "values": ["topic:ガイド"]}, {"field": "kind", "op": "eq", "values": ["docs"]}]} を指定して一覧を検索し、description の「〜ときに参照する」が作業に該当するページを view: "full" で読み込む。
  人が読み込む資料を記載するときは、最初に『文書の記載方法』（guide/記載する-文書の記載方法.md）を読み込む。
  記法の記載方法を確認するときは『記法』（guide/記法.md）を読み込む。
  設計書は `docs/` の種類ごとのフォルダの YAML（`{ID}.yaml`）で、書式は `schemas/{種類}.schema.yaml` が持つ。各文書の公開範囲は `visibility`（`public` / `internal`）で、YAML の文書はキー、Markdown は `files.yml` の行が持つ。
when:
  - mdmark の記法・部品・図の描き方を確認するとき
  - mdmark の CLI・公開関数・設定・索引のキーを確認するとき
  - mdmark のライブラリ・CLI・VS Code 拡張機能・Claude Code プラグインの設計書・コード・テストを調べるとき
documents:
  # 設計書は種類ごとの行。index.yaml は目次なので exclude で除く
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: component
    title: 部品設計
    paths: ["docs/component/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/component.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: screen
    title: 画面設計
    paths: ["docs/screen/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/screen.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: er
    title: ER 図
    paths: ["docs/er/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/er.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: external_api
    title: 外部 API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/dev-command.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      visibility: visibility
  # YAML の設計書でないファイルは、フォルダごとの管理用の YAML が 1 ファイル 1 行で持つ
  - id: files_root
    title: docs の直下の Markdown と Pages の共通レイアウト
    paths: [docs/_root/files.yml]
    exclude: [README.md, index.yaml, nav.yml, nav.project.yml, llms.txt, search.json, _config.yml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
    metadata:
      visibility: visibility
  - id: mock
    title: モック
    paths: [docs/mock/files.yml]
    exclude: [comments.js, index.css, index.js, view.js, viewer.css, viewer.js]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
    metadata:
      visibility: visibility
  - id: docs
    title: 公開ドキュメント
    paths: [docs/guide/files.yml]
    exclude: [README.md, index.yaml, はじめに.md, 使用方法.md, リファレンス.md]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
    metadata:
      visibility: visibility
      category: category
  - id: src
    title: ライブラリ本体のコード
    paths: [src/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: scripts
    title: 開発のスクリプト
    paths: [scripts/files.yaml]
    exclude: ["*.txt"]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: init_templates
    title: 雛形
    paths: [templates/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: schemas
    title: Schema
    paths: [schemas/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: migrations
    title: 移行の手順
    paths: [migrations/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: guide
    title: ガイドの索引
    paths: [guide/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: vscode
    title: VS Code 拡張機能
    paths: [vscode/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: plugin
    title: Claude Code プラグインの定義
    paths: [plugin/files.yaml]
    exclude: [THIRD_PARTY_LICENSES.txt, pre-tool-use.js]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: storybook
    title: Storybook の設定
    paths: [.storybook/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
  - id: workflows
    title: ワークフロー
    paths: [.github/files.yaml]
    records: files
    body_file: path
    schema: schemas/files.schema.yaml
