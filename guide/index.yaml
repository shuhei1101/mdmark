schema: 1
guides:
  - name: notation
    when: マーカーと記法を文書に記載するとき・拡張子が `.mark.md` の文書を記載するとき
    summary: マーカーの引数を JSON のオブジェクトで記載する決まりと、表・注意書き・タブ・ステップ・ファイルツリー・バッジ・セクションの開閉・行の詳細などのマーカーと記法の一覧
    page: docs/guide/記法.md
  - name: tables
    when: 表に並べ替え・絞り込み・ピン止めなどの機能を付けるとき
    summary: 表をマーカーで囲み、種類・機能・列の設定を JSON のキーで選ぶ手順
    page: docs/guide/記載する-表に機能を付ける.md
  - name: components
    when: 注意書き・タブ・ステップ・ファイルツリー・バッジ・目次などで本文を組むとき・フォルダ構成を記載するとき
    summary: 本文の部品を記載する手順
    page: docs/guide/記載する-本文を部品で組む.md
  - name: glossary
    when: 索引や用語集を記載するとき
    summary: 索引に文書と用語を記載し、表から用語集に用語を入れる手順
    page: docs/guide/記載する-索引と用語集を記載する.md
  - name: figure-numbers
    when: 図や表に番号を付けて参照するとき
    summary: fig のマーカーと、番号を出すリンクの記載
    page: docs/guide/記載する-図と表に番号を付ける.md
  - name: colors
    when: 表の列と行・バッジ・本文の文字に色を付けるとき
    summary: 色の名前の一覧と、決め手の 1 文だけに色を付ける色の使用方法のガイド
    page: docs/guide/記載する-色で強調する.md
  - name: media
    when: 画像・動画・GIF・音声を文書に配置するとき
    summary: 画像の属性・キャプション・ライトボックス・ギャラリー・配色ごとの出し分け・動画・GIF・音声・アセットの配置場所
    page: docs/guide/記載する-画像と動画を配置する.md
  - name: view-comments
    when: ビュー（ボード表示と表形式）やコメントを使用するとき
    summary: ビューのマーカー、列の絞り込み、コメントを付ける手順
    page: docs/guide/記載する-ビューとコメントを使用する.md
  - name: map
    when: 構成図・シーケンス図を新しく描くとき
    summary: map のマーカー・Mermaid のブロック・補足の記載方法と、配置と色の上書き・案内・再生の書き方
    page: docs/guide/図を描く-Mermaidと補足で図を描く.md
  - name: diagrams
    when: グラフ・操作できる部品・ER 図と、座標で記載したフロー図・シーケンス図を描くとき
    summary: HTML の用途と、文書に部品の定義を記載して図を描く手順（新しい構成図・シーケンス図は map を使用する）
    page: docs/guide/図を描く-図を描く.md
  - name: interactive-parts
    when: スライダーや今の値をコピーするボタンなど、操作できる部品を付けるとき
    summary: スライダー・グラフ・コピーするボタンの部品の定義
    page: docs/guide/図を描く-操作できる部品を作る.md
  - name: mermaid
    when: mermaid のコードブロックで図を描くとき
    summary: mermaid のコードブロックの記載、図の枠のタイトル、テーマの変え方
    page: docs/guide/図を描く-mermaidの図を描く.md
  - name: html-blocks
    when: コードブロックの HTML でチャートやヒントを描くとき
    summary: HTML を描かせるマーカー、チャートの custom element、data-hint の記載
    page: docs/guide/図を描く-コードブロックのHTMLを描く.md
  - name: html-rules
    when: AI が HTML を作るとき
    summary: HTML の記載の決まり
    page: docs/guide/HTMLの記載方法.md
  - name: diagram-check
    when: 描いた図を確認するとき
    summary: 配置した部品を Playwright で動かし、スクリーンショットを撮って確認する手順
    page: docs/guide/図を描く-描いた図を確認する.md
  - name: diagram-sample
    when: 図や操作できる部品の記載の見本を確認したいとき
    summary: フロー図・シーケンス図・グラフ・操作できる部品を組み合わせた見本の文書
    page: docs/guide/図を描く-見本.md
  - name: custom-parts
    when: 利用側に固有の部品や CSS を、その場所の文書にだけ適用するとき
    summary: registerExtension と CSS で固有の部品と外観を追加する手順
    page: docs/guide/図を描く-固有の部品とCSSを適用する.md
  - name: architecture-style
    when: 構成図を描くとき
    summary: 枠・3 レイヤー・タイトルと凡例・線・交差・ツールチップ・操作の外観の決まりと、map の図をグループにするかの判定フローチャート
    page: docs/guide/構成図の決まり.md
  - name: flowchart-style
    when: 処理の順番を描くフローチャートを描くとき
    summary: 時系列・ループの帯・分岐の外観の決まり
    page: docs/guide/フローチャートの決まり.md
  - name: extension
    when: registerExtension で自分のマーカーを追加するとき
    summary: 拡張の登録手順。TypeScript を推奨し、配る前に JavaScript へ変換し、linter（Biome を推奨）を使用する
    page: docs/guide/カスタマイズ-拡張を登録する.md
  - name: index-schema
    when: 索引のキーや点検が返却するずれの種類を確認するとき
    summary: 索引のキー・型・必須・既定と、点検のずれの種類の一覧
    page: docs/guide/索引.md
  - name: writing
    when: 人が読み込む資料を mdmark で記載するとき
    summary: 表し方の優先順位・確認すれば分かることを記載しない・裏返しを記載しない・参考は末尾にまとめる、の決まり
    page: docs/guide/記載する-文書の記載方法.md
