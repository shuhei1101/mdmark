<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>bundle / side-toc（まとめた HTML の右側の目次） | mdmark のモック</title>
  <!-- 本文の規則とモック専用の操作列（#16 で共有するアセット） -->
  <link rel="stylesheet" href="../../../../refs/16/assets/sample.css">
  <!-- 採用スタイル本体の変数の値 -->
  <link rel="stylesheet" href="../../../../assets/style.css">
  <!-- 拡張記法の規則（#19 で共有するアセット）: 見出しのアンカー・節の開閉・表 -->
  <link rel="stylesheet" href="../../../../refs/19/assets/syntax.css">
  <!-- まとめた HTML の画面と文書の一覧の規則（#32 で共有するアセット） -->
  <link rel="stylesheet" href="../../../../refs/32/assets/bundle.css">
  <!-- この PR で追加する右側の目次とまとめて開閉するボタンの規則（#166 で共有するアセット） -->
  <link rel="stylesheet" href="../../../../refs/166/assets/side-toc.css">
  <!-- この画面の規則（モックのパンくず・狭い幅の帯の高さ） -->
  <link rel="stylesheet" href="./style.css">
  <!-- 印刷の規則: 紙に出すときだけ当てる。[data-print-styles]: モックの「印刷の見え方」で preview.js が media を all に切り替える -->
  <link rel="stylesheet" href="../../32/side-list/print.css" media="print" data-print-styles>
  <link rel="stylesheet" href="../../../../refs/19/assets/syntax-print.css" media="print" data-print-styles>
  <link rel="stylesheet" href="../../../../refs/166/assets/side-toc-print.css" media="print" data-print-styles>
  <!-- 配色の切り替え -->
  <script src="../../../../refs/16/assets/sample.js" defer></script>
  <!-- 拡張記法の操作（ページ内検索で開いた節・印刷の前後の展開）。文書を差し替える前に読むため、節の開閉は app.js が受け持つ -->
  <script src="../../../../refs/19/assets/syntax.js" defer></script>
  <!-- 文書の行き来・文書の一覧のパネル・節の開閉・案の切り替え（右側の目次を組み立てる前に文書と出し方を当てる） -->
  <script src="./app.js" defer></script>
  <!-- 右側の目次・今いる節・すべて展開とすべて折りたたむ・Shift での入れ子の開閉 -->
  <script src="../../../../refs/166/assets/side-toc.js" defer></script>
  <!-- 印刷の見え方（モックだけの仕組み。#151 で共有するアセット） -->
  <script src="../../../../refs/151/assets/preview.js" defer></script>
</head>
<body>
  <!-- モック専用の操作列: 配色・印刷の見え方、目次の出し方の切り替え、開き方の例 -->
  <div class="mock-bar">
    <!-- [data-scheme-set]: sample.js が押されたボタンの値を html の data-scheme に当てる（実装では OS の配色の設定に従う） -->
    <div class="mock-bar-group" role="group" aria-label="配色と印刷">
      <button class="mock-bar-item" type="button" data-scheme-set="light" aria-pressed="false">明るい配色</button>
      <button class="mock-bar-item" type="button" data-scheme-set="dark" aria-pressed="false">ダーク</button>
      <!-- [data-preview-toggle]: preview.js が印刷の規則を画面にも当てる -->
      <button class="mock-bar-item" type="button" data-preview-toggle aria-pressed="false">印刷の見え方</button>
    </div>
    <!-- [data-scene-mode]: app.js が行き先の URL（?mode=）と今の案の aria-current を当てる -->
    <div class="mock-bar-group" role="group" aria-label="目次の出し方（side-toc.mode）">
      <a class="mock-bar-item" data-scene-mode="hover">hover（既定）</a>
      <a class="mock-bar-item" data-scene-mode="fixed">fixed</a>
    </div>
    <!-- 開き方の例: URL の # を付けない・文書と閉じた節の中の見出しを指す -->
    <div class="mock-bar-group" role="group" aria-label="開き方">
      <a class="mock-bar-item" href="#/README.md">entry の文書</a>
      <a class="mock-bar-item" href="#/使い方/guide.md#何も描かれない">閉じた節の中の見出しを指す</a>
    </div>
  </div>

  <!-- まとめた HTML の画面: mdmark build が書き出す 1 枚の HTML の body の中身 -->
  <div class="mdmark-bundle">
    <!-- 横の文書の一覧（PC 幅）: フォルダの無い文書を先に、フォルダごとに 1 段の見出しでまとめる。[data-doc-list]: app.js がパネルへ写す元 -->
    <aside class="mdmark-bundle-side">
      <nav class="mdmark-doc-list" aria-label="文書の一覧" data-doc-list>
        <div class="mdmark-doc-list-group">
          <ul>
            <li><a href="#/README.md" data-doc-path="README.md">mdmark の文書</a></li>
          </ul>
        </div>
        <div class="mdmark-doc-list-group">
          <p class="mdmark-doc-list-folder">はじめに</p>
          <ul>
            <li><a href="#/はじめに/変更履歴.md" data-doc-path="はじめに/変更履歴.md">変更履歴</a></li>
          </ul>
        </div>
        <div class="mdmark-doc-list-group">
          <p class="mdmark-doc-list-folder">使い方</p>
          <ul>
            <li><a href="#/使い方/guide.md" data-doc-path="使い方/guide.md">使い方</a></li>
          </ul>
        </div>
        <div class="mdmark-doc-list-group">
          <p class="mdmark-doc-list-folder">使い方/導入</p>
          <ul>
            <li><a href="#/使い方/導入/配布物を読み込む.md" data-doc-path="使い方/導入/配布物を読み込む.md">版を固定した URL で JavaScript と CSS を読み込み、要素に文書を描くまで</a></li>
          </ul>
        </div>
        <div class="mdmark-doc-list-group">
          <p class="mdmark-doc-list-folder">リファレンス</p>
          <ul>
            <li><a href="#/リファレンス/api.md" data-doc-path="リファレンス/api.md">API</a></li>
            <li><a href="#/リファレンス/設定.md" data-doc-path="リファレンス/設定.md">設定</a></li>
          </ul>
        </div>
      </nav>
    </aside>

    <!-- 開いている文書の領域: ページの主な内容のランドマーク -->
    <main class="mdmark-bundle-main">
      <!-- 狭い幅の帯: 文書の一覧を開くボタンと、開いている文書の題（[data-bar-title]: app.js が書き換える） -->
      <div class="mdmark-bundle-bar">
        <!-- [data-panel-open]: app.js がパネルを開く -->
        <button class="mdmark-bundle-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="doc-list-panel" data-panel-open>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>文書の一覧
        </button>
        <span class="mdmark-bundle-bar-title" data-bar-title></span>
      </div>

      <!-- 描く先の要素: 本文の列と右側の目次を並べる -->
      <article class="mdmark">
        <!-- 本文の列: 開いている文書。[data-doc-view]: app.js が文書を差し替える -->
        <div class="mdmark-content" data-doc-view></div>
        <!-- 右側の目次: side-toc.js が本文の列の見出しから組み立てる。[data-href-prefix]: app.js が開いている文書の #/{文書のパス}# を当てる -->
        <div class="mdmark-side-toc" data-mode="hover"></div>
      </article>
    </main>
  </div>

  <!-- 文書の一覧のパネル（狭い幅）: 背景の押下・Esc・閉じるボタン・文書を選ぶと閉じる。開閉は履歴に積まない -->
  <dialog class="mdmark-bundle-panel" id="doc-list-panel" closedby="any" aria-labelledby="doc-list-panel-title">
    <div class="mdmark-bundle-panel-head">
      <p class="mdmark-bundle-panel-title" id="doc-list-panel-title">文書の一覧</p>
      <!-- [data-panel-close]: app.js がパネルを閉じる -->
      <button class="mdmark-bundle-button is-icon" type="button" aria-label="文書の一覧を閉じる" data-panel-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <!-- [data-panel-body]: app.js が横の文書の一覧を写す -->
    <div data-panel-body></div>
  </dialog>


  <!-- 埋めた文書: render の本文。文書間のリンク・見出しのアンカーは、1 枚の中の文書を指す #/{文書のパス}#{見出しの ID} に直してある。
       1 枚に含まれない文書へのリンクは書いたままの href で残る。[data-doc-path]・[data-doc-title]: app.js が URL と照らし、帯とタブの題に使う -->

  <!-- entry の文書: h1 と h2 を 1 つずつ持つ -->
  <template data-doc-path="README.md" data-doc-title="mdmark の文書">
<h1 class="mdmark-heading" id="mdmark-の文書"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-mdmark-の文書">mdmark の文書<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/README.md#mdmark-の文書" aria-label="「mdmark の文書」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h1>
<div class="mdmark-section-body" id="section-mdmark-の文書">
<p>この 1 枚の HTML には、mdmark の使い方と API の文書をまとめています。</p>
<h2 class="mdmark-heading" id="まとめた文書"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-まとめた文書">まとめた文書<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/README.md#まとめた文書" aria-label="「まとめた文書」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h2>
<div class="mdmark-section-body" id="section-まとめた文書">
<p>文書は、はじめに・使い方・リファレンスの 3 つのフォルダに分かれます。</p>
</div>
</div>
  </template>

  <!-- h2・h3 を持つ長い文書: 右側の目次・今いる節・閉じた節を確かめる -->
  <template data-doc-path="使い方/guide.md" data-doc-title="使い方">
<h1 class="mdmark-heading" id="使い方"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-使い方">使い方<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#使い方" aria-label="「使い方」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h1>
<div class="mdmark-section-body" id="section-使い方">
<p>使う側のページに mdmark を組み込み、要素の中に文書を描くまでの手順です。</p>
<h2 class="mdmark-heading" id="読み込む"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-読み込む">読み込む<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#読み込む" aria-label="「読み込む」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h2>
<div class="mdmark-section-body" id="section-読み込む">
<p>使う側のページは、版のタグを固定した URL で配布物の JavaScript と CSS を読み込みます。</p>
<p>読み込みの決まりは、まだ書きかけの <a href="../下書き/メモ.md">読み込みのメモ</a> にもまとめています。</p>
<h3 class="mdmark-heading" id="タグを固定する"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-タグを固定する">タグを固定する<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#タグを固定する" aria-label="「タグを固定する」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h3>
<div class="mdmark-section-body" id="section-タグを固定する">
<p>URL の @ の後ろに版のタグを書くと、配布物が後から変わりません。</p>
<p>タグを書かずに読むと、新しい版が出たときに見た目や記法が黙って変わります。</p>
<p>版を上げるときは、変更履歴で壊す変更が無いかを確かめてから URL のタグを書き換えます。</p>
</div>
<h3 class="mdmark-heading" id="css-を読み込む"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-css-を読み込む">CSS を読み込む<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#css-を読み込む" aria-label="「CSS を読み込む」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h3>
<div class="mdmark-section-body" id="section-css-を読み込む">
<p>配布物の CSS は、使う側の CSS より先に読みます。</p>
<p>使う側の CSS は mdmark の層の外に書くため、読む順によらず使う側の規則が勝ちます。</p>
<p>CSS を読まずに描くと、表の並べ替えや節の開閉のボタンが素のボタンのまま出ます。</p>
</div>
</div>
<h2 class="mdmark-heading" id="描く"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-描く">描く<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#描く" aria-label="「描く」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h2>
<div class="mdmark-section-body" id="section-描く">
<p>配布物を読んだページで <code>mount</code> を呼ぶと、要素の中に文書を描きます。</p>
<p>引数の一覧は <a href="#/リファレンス/api.md">API</a> に書きました。</p>
<h3 class="mdmark-heading" id="本文を差し替える"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-本文を差し替える">本文を差し替える<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#本文を差し替える" aria-label="「本文を差し替える」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h3>
<div class="mdmark-section-body" id="section-本文を差し替える">
<p>描き終えた後に本文を差し替えるときも、同じ要素に <code>mount</code> を呼び直します。</p>
<p>呼び直すと、右側の目次と今いる節も新しい本文の見出しで組み直します。</p>
<p>開いていた節の開閉は保たず、印のとおりの開閉に戻ります。</p>
</div>
<h3 class="mdmark-heading" id="片付ける"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-片付ける">片付ける<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#片付ける" aria-label="「片付ける」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h3>
<div class="mdmark-section-body" id="section-片付ける">
<p>描く先の要素を片付けるときは、<code>mount</code> が返す関数を呼びます。</p>
<p>片付けた後の要素には、何も残りません。</p>
<p>右側の目次・ボタン・スクロールの監視も一緒に外れます。</p>
</div>
</div>
<h2 class="mdmark-heading" id="困ったとき"><button class="mdmark-section-toggle" type="button" aria-expanded="false" aria-controls="section-困ったとき">困ったとき<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#困ったとき" aria-label="「困ったとき」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h2>
<div class="mdmark-section-body" id="section-困ったとき" hidden="until-found">
<p>描けないときに確かめることです。普段は開かなくて構いません。</p>
<h3 class="mdmark-heading" id="何も描かれない"><button class="mdmark-section-toggle" type="button" aria-expanded="false" aria-controls="section-何も描かれない">何も描かれない<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/使い方/guide.md#何も描かれない" aria-label="「何も描かれない」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h3>
<div class="mdmark-section-body" id="section-何も描かれない" hidden="until-found">
<p>ブラウザの開発者ツールのコンソールに、配布物を読めなかった知らせが出ていないかを確かめます。</p>
<p>社内のネットワークから jsDelivr へ出られないときは、書き出した 1 枚の HTML を使います。</p>
</div>
</div>
</div>
  </template>

  <!-- 表を持ち、見出しが h1 だけの文書 -->
  <template data-doc-path="リファレンス/api.md" data-doc-title="API">
<h1 class="mdmark-heading" id="api"><button class="mdmark-section-toggle" type="button" aria-expanded="true" aria-controls="section-api">API<svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><a class="mdmark-anchor" href="#/リファレンス/api.md#api" aria-label="「API」へのリンク"><svg class="mdmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></a></h1>
<div class="mdmark-section-body" id="section-api">
<p>配布物の公開関数の一覧です。</p>
