<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>document / back-to-top（画面の右下の先頭へ戻るボタン） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体） -->
  <link rel="stylesheet" href="../../../../../../dist/index.css">
  <!-- 余白のマーカーの規則（#277 のモック。配布物 v0.9.0 に無い） -->
  <link rel="stylesheet" href="../../../../refs/277/assets/margin.css">
  <!-- この PR で追加する先頭へ戻るボタンの規則（番号で共有するアセット） -->
  <link rel="stylesheet" href="../../../../refs/287/assets/back-to-top.css">
  <!-- 使う側のページの見た目と、モック専用の操作列 -->
  <link rel="stylesheet" href="../../../../refs/287/assets/scene.css">
  <!-- 配布物の mount で長い文書を描き、先頭へ戻るボタンのモックを付ける -->
  <script type="module" src="../../../../refs/287/assets/scene.js"></script>
</head>
<body>
  <!-- モック専用の操作列: 未確定の論点の案と、重ねる部品・描く場所の切り替え。[data-scene-axis] [data-scene-value]: scene.js が行き先の URL と今の案の aria-current を当てる -->
  <div class="mock-bar">
    <div class="mock-bar-group" role="group" aria-label="出し始める量">
      <span class="mock-bar-label">出し始める量</span>
      <a class="mock-bar-item" data-scene-axis="threshold" data-scene-value="viewport">A: 画面の高さ 1 つ分（推奨）</a>
      <a class="mock-bar-item" data-scene-axis="threshold" data-scene-value="half">B: 画面の高さの半分</a>
    </div>
    <div class="mock-bar-group" role="group" aria-label="余白の列と重なるとき">
      <span class="mock-bar-label">余白の列と重なるとき</span>
      <a class="mock-bar-item" data-scene-axis="margin" data-scene-value="shift">A: 余白の列の左へずらす（推奨）</a>
      <a class="mock-bar-item" data-scene-axis="margin" data-scene-value="none">B: ずらさない</a>
    </div>
    <div class="mock-bar-group" role="group" aria-label="重ねる部品">
      <span class="mock-bar-label">重ねる部品</span>
      <a class="mock-bar-item" data-scene-axis="with" data-scene-value="hover">右側の目次 hover（既定）</a>
      <a class="mock-bar-item" data-scene-axis="with" data-scene-value="fixed">右側の目次 fixed</a>
      <a class="mock-bar-item" data-scene-axis="with" data-scene-value="comments">余白のマーカー</a>
      <a class="mock-bar-item" data-scene-axis="with" data-scene-value="diff">差分のミニマップ</a>
    </div>
    <div class="mock-bar-group" role="group" aria-label="描く場所">
      <span class="mock-bar-label">描く場所</span>
      <a class="mock-bar-item" data-scene-axis="host" data-scene-value="window">画面全体がスクロール</a>
      <a class="mock-bar-item" data-scene-axis="host" data-scene-value="box">スクロールする要素の中</a>
    </div>
  </div>

  <!-- 使う側のページのトップバー（mdmark の外） -->
  <header class="host-bar">使う側のアプリ</header>

  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../../../index.md">pages</a> / <a href="../../index.md">document</a> / <a href="../index.md">287</a> / back-to-top
  </nav>

  <main class="host">
    <!-- スクロールする要素: 描く場所が「スクロールする要素の中」のときだけ高さ 600px で縦にスクロールする -->
    <div class="scroll-box">
      <!-- mount で描く先の要素 -->
      <div id="doc"></div>
    </div>
  </main>
</body>
</html>
