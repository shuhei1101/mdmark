<!DOCTYPE html>

<head>

</head>
<body>
  <!-- モック専用の操作列。[data-scene-state]・[data-scene-scheme]: scene.js が行き先の URL と今の値の aria-current を適用する -->

    <div class="mock-bar-group" role="group" aria-label="表示の形式の案">
      <span class="mock-bar-label">表示の形式</span>

    <div class="mock-bar-group" role="group" aria-label="描き方">
      <span class="mock-bar-label">描き方</span>
      <a class="mock-bar-item" data-scene-state="off">既定（表示しない）</a>
      <a class="mock-bar-item" data-scene-state="on">表示をオン</a>
      <a class="mock-bar-item" data-scene-state="current">今の描き方</a>
    </div>
    <div class="mock-bar-group" role="group" aria-label="明暗">
      <span class="mock-bar-label">明暗</span>
      <a class="mock-bar-item" data-scene-scheme="light">明るい配色</a>
      <a class="mock-bar-item" data-scene-scheme="dark">ダーク</a>

  </div>

  <!-- 利用側のページのトップバー（mdmark の外） -->
  <header class="host-bar">利用側のアプリ</header>

  <nav class="crumbs" aria-label="パンくずリスト">

</html>
