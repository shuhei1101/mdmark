<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>revision-picker | mdmark の部品のモック</title>
  <!-- 本文の規則と知らせの枠の規則（#16 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/16/assets/sample.css">
  <!-- 採用スタイル本体の変数の値（差分の色を含む） -->
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- カタログの並べ方と差分の規則（#49 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/49/assets/catalog.css">
  <link rel="stylesheet" href="../../refs/49/assets/diff.css">
  <!-- 配色の切り替え -->
  <script src="../../refs/16/assets/sample.js" defer></script>
  <!-- 見本のリビジョン・差分を描くスクリプトと、見本ごとに差分の場所を開いて描くスクリプト -->
  <script src="../../refs/49/assets/samples.js" defer></script>
  <script src="../../refs/49/assets/diff.js" defer></script>
  <script src="../../refs/49/assets/catalog.js" defer></script>
</head>
<body>
  <!-- モック専用の操作列: 配色の切り替え -->
  <div class="mock-bar">
    <!-- [data-scheme-set]: sample.js が押されたボタンの値を html の data-scheme に当てる -->
    <div class="mock-bar-group" role="group" aria-label="配色">
      <button class="mock-bar-item" type="button" data-scheme-set="light" aria-pressed="false">明るい配色</button>
      <button class="mock-bar-item" type="button" data-scheme-set="dark" aria-pressed="false">ダーク</button>
    </div>
  </div>

  <main class="host">
    <div class="catalog">
      <h1 class="catalog-title">リビジョンの選択と「変更を見る」</h1>
      <!-- 文書の右上に置くボタン。押すと差分を開く -->
      <section aria-labelledby="toggle-closed">
        <h2 class="catalog-label" id="toggle-closed">「変更を見る」（閉じている）</h2>
        <article class="mdmark">
          <div class="mdmark-diff-bar"><button type="button" class="mdmark-diff-toggle" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M9 10h6"/><path d="M12 13V7"/><path d="M9 17h6"/></svg>変更を見る</button></div>
        </article>
      </section>

      <!-- 開いている間は押された見た目にする。もう一度押すと閉じる -->
      <section aria-labelledby="toggle-open">
        <h2 class="catalog-label" id="toggle-open">「変更を見る」（開いている）</h2>
        <article class="mdmark">
          <div class="mdmark-diff-bar"><button type="button" class="mdmark-diff-toggle" aria-expanded="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M9 10h6"/><path d="M12 13V7"/><path d="M9 17h6"/></svg>変更を見る</button></div>
        </article>
      </section>

      <!-- 選ぶ欄に日時・label・author を出す -->
      <section aria-labelledby="picker-normal">
        <h2 class="catalog-label" id="picker-normal">通常（3 つのリビジョンを新しい順に並べ、一番新しいものとその 1 つ前を選ぶ）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal"></div>
        </article>
      </section>

      <!-- 前の欄では一番新しい r3 を選べない。前に r2 を選ぶと、後の欄では r2 と r1（前と同じか古い）を選べない -->
      <section aria-labelledby="picker-oldest">
        <h2 class="catalog-label" id="picker-oldest">前に r2 を選んだ（前の欄では r3、後の欄では r2 と r1 を選べない）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal" data-mock-before="r2" data-mock-after="r3"></div>
        </article>
      </section>

      <!-- label・author が無いリビジョンは日時だけを出し、長い説明は欄の中で切る -->
      <section aria-labelledby="picker-sparse">
        <h2 class="catalog-label" id="picker-sparse">label・author が無い / 長い label と author</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="sparse"></div>
        </article>
      </section>

      <!-- 選ぶ欄を残し、差分の場所に知らせの枠を出す。別のリビジョンを選び直すと消える -->
      <section aria-labelledby="picker-content-error">
        <h2 class="catalog-label" id="picker-content-error">本文を取り出せない（前に r1 を選んだ）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="content-error" data-mock-before="r1" data-mock-after="r2"></div>
        </article>
      </section>

    </div>
  </main>
</body>
</html>
