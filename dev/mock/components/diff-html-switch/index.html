<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>diff-html-switch | mdmark の部品のモック</title>
  <!-- 本文の規則と知らせの枠の規則（#16 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/16/assets/sample.css">
  <!-- 採用スタイル本体の変数の値（差分の色を含む） -->
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- カタログの並べ方と差分の規則（#49 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/49/assets/catalog.css">
  <link rel="stylesheet" href="../../refs/49/assets/diff.css">
  <!-- 配色の切り替え -->
  <script src="../../refs/16/assets/sample.js" defer></script>
  <!-- 見本のリビジョン・差分を描くスクリプトと、見本ごとに差分の場所を開いて描くスクリプト -->
  <script src="../../refs/49/assets/samples.js" defer></script>
  <script src="../../refs/49/assets/diff.js" defer></script>
  <script src="../../refs/49/assets/catalog.js" defer></script>
</head>
<body>
  <!-- モック専用の操作列: 配色の切り替え -->
  <div class="mock-bar">
    <!-- [data-scheme-set]: sample.js が押されたボタンの値を html の data-scheme に当てる -->
    <div class="mock-bar-group" role="group" aria-label="配色">
      <button class="mock-bar-item" type="button" data-scheme-set="light" aria-pressed="false">明るい配色</button>
      <button class="mock-bar-item" type="button" data-scheme-set="dark" aria-pressed="false">ダーク</button>
    </div>
  </div>

  <main class="host">
    <div class="catalog">
      <h1 class="catalog-title">埋め込んだ HTML の切り替え</h1>
      <!-- 変えた範囲の見出しに、ソースと描いた結果の切り替えを置く -->
      <section aria-labelledby="html-source">
        <h2 class="catalog-label" id="html-source">ソース（既定）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal" data-mock-before="r1" data-mock-after="r2"></div>
        </article>
      </section>

      <!-- 幅があれば前と後を横に並べ、狭い幅では縦に積む -->
      <section aria-labelledby="html-rendered">
        <h2 class="catalog-label" id="html-rendered">描いた結果（前と後を横に並べる）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal" data-mock-before="r1" data-mock-after="r2" data-mock-view="rendered"></div>
        </article>
      </section>

      <!-- 幅によらず前と後を縦に並べる案 -->
      <section aria-labelledby="html-rendered-stack">
        <h2 class="catalog-label" id="html-rendered-stack">描いた結果（前と後を縦に並べる）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal" data-mock-before="r1" data-mock-after="r2" data-mock-view="rendered" data-mock-sides="stack"></div>
        </article>
      </section>

      <!-- r3 で足した範囲。前の側に範囲が無いことを示す -->
      <section aria-labelledby="html-one-side">
        <h2 class="catalog-label" id="html-one-side">片側にだけある範囲（描いた結果）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="normal" data-mock-view="rendered"></div>
        </article>
      </section>

      <!-- 範囲の外だけを変えたとき。範囲の行は色なしで出し、切り替えを付けない -->
      <section aria-labelledby="html-unchanged">
        <h2 class="catalog-label" id="html-unchanged">変えていない範囲</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="outside"></div>
        </article>
      </section>

      <!-- 描いた結果では script 要素とイベントの属性を落とす。ソースでは文字として出す -->
      <section aria-labelledby="html-script">
        <h2 class="catalog-label" id="html-script">スクリプトを書いた範囲（描いた結果）</h2>
        <article class="mdmark">
          <!-- [data-mock-case]: catalog.js が場面の取り出し元から差分の場所を開いて描く -->
          <div class="mdmark-diff" data-mock-case="script" data-mock-view="rendered"></div>
        </article>
      </section>

    </div>
  </main>
</body>
</html>
