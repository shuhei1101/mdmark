<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- color-scheme: 明るい配色とダークの両方を持つことをブラウザへ伝える -->
  <meta name="color-scheme" content="light dark">
  <title>param-control | mdmark の部品のモック</title>
  <!-- 本文の規則とモック専用の操作列（#16 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/16/assets/sample.css">
  <!-- 採用スタイル本体の変数の値 -->
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- 拡張記法の規則とカタログの並べ方（#19 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/19/assets/syntax.css">
  <link rel="stylesheet" href="../../refs/19/assets/catalog.css">
  <!-- 用語のツールチップの規則（#27 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/27/assets/glossary.css">
  <!-- 図の部品と操作できる部品の規則（#42 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/42/assets/diagram.css">
  <!-- 配色の切り替え -->
  <script src="../../refs/16/assets/sample.js" defer></script>
  <!-- 部品の定義の見本と、部品を描いて操作を付けるスクリプト（#42 で共有するアセット） -->
  <script src="../../refs/42/assets/samples.js" defer></script>
  <script src="../../refs/42/assets/diagram.js" defer></script>
</head>
<body>
  <!-- モック専用の操作列: 配色の切り替え -->
  <div class="mock-bar">
    <!-- [data-scheme-set]: sample.js が押されたボタンの値を html の data-scheme に当てる -->
    <div class="mock-bar-group" role="group" aria-label="配色">
      <button class="mock-bar-item" type="button" data-scheme-set="light" aria-pressed="false">明るい配色</button>
      <button class="mock-bar-item" type="button" data-scheme-set="dark" aria-pressed="false">ダーク</button>
    </div>
  </div>

  <main class="host">
    <div class="catalog">
      <h1 class="catalog-title">操作できる部品（スライダー・グラフ・今の値を写すボタン）</h1>

      <!-- 開いたとき: 既定の値。値を変える区画と写すボタンをグラフより上に置く。スライダーは矢印キーでも動く -->
      <section aria-labelledby="state-default">
        <h2 class="catalog-label" id="state-default">開いたとき（既定の値 5。スライダーは矢印キーでも動く）</h2>
        <article class="mdmark">
          <!-- [data-mock-param]: diagram.js が samples.js の同じ名前の定義から部品を描く（実装では文書に書いた部品の定義を mount が読む） -->
          <div data-mock-param="strength"></div>
        </article>
      </section>

      <!-- 値を変えた: グラフの今の値の線が描き直され、既定の値の線と比べられる -->
      <section aria-labelledby="state-changed">
        <h2 class="catalog-label" id="state-changed">値を変えた（8。グラフが追従する）</h2>
        <article class="mdmark">
          <!-- [data-mock-value]: 開いたときの値を変えて見せる（モックだけの指定） -->
          <div data-mock-param="strength" data-mock-value="8"></div>
        </article>
      </section>

      <!-- 写した: ボタンの右に写したことを出す（読み上げにも伝える） -->
      <section aria-labelledby="state-copied">
        <h2 class="catalog-label" id="state-copied">写した</h2>
        <article class="mdmark">
          <!-- [data-mock-copy]: 写した・写せなかったの知らせを出したまま見せる（モックだけの指定） -->
          <div data-mock-param="strength" data-mock-value="8" data-mock-copy="copied"></div>
        </article>
      </section>

      <!-- 写せなかった: クリップボードへ書けないとき。書けなかったことと直し方を出し、写すはずだった JSON を選んで写せる文字で出す。スライダーとグラフは操作できるまま -->
      <section aria-labelledby="state-failed">
        <h2 class="catalog-label" id="state-failed">写せなかった（選んで写せる JSON を出す）</h2>
        <article class="mdmark">
          <div data-mock-param="strength" data-mock-value="8" data-mock-copy="failed"></div>
        </article>
      </section>
    </div>
  </main>
</body>
</html>
