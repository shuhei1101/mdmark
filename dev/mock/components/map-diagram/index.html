<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅で等倍に表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-diagram（map の図の状態） | mdmark のモック</title>
  <!-- 配布物の CSS（ライブラリ本体）: 色・余白・角丸の CSS 変数 -->
  <link rel="stylesheet" href="../../../../dist/index.css">
  <!-- 利用側のページの外観（#287 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/287/assets/scene.css">
  <!-- map の図のモックの規則（#445 で共有するアセット） -->
  <link rel="stylesheet" href="../../refs/445/assets/map-mock.css">
  <style>
    /* カタログの並び: 状態ごとに見出しと図を縦に並べる */
    .catalog { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .catalog h2 { font-size: 15px; margin: 32px 0 4px; }
    .catalog p.state-note { margin: 0; color: var(--mdmark-color-muted); font-size: 13px; }
    .narrow { width: 390px; max-width: 100%; }
  </style>
</head>
<body class="mdmark-theme-light">
  <header class="host-bar">利用側のアプリ</header>
  <nav class="crumbs" aria-label="パンくずリスト">
    <a href="../index.md">components</a> / map-diagram
  </nav>
  <main class="catalog mdmark" id="catalog"></main>
  <script type="module">
    import { createMap } from "../../refs/445/assets/map-mock.js";
    import { DATA, FLOW, SEQUENCE } from "../../refs/445/assets/samples.js";

    /** 状態の見出し・補足・初期状態 */
    const STATES = [
      ["通常", "入れ子のグループを自動配置した全体の図。凡例は図に 2 種類以上ある種類だけ", {}],
      ["グループの中", "入ったグループの中だけを配置し直し、外を薄く残す。上端のパンくずで戻る", { enter: "lib" }],
      ["閉じたグループとまとめた線", "閉じたグループは二重の枠のノード。同じ相手への線は 1 本にまとめて件数を出す", { collapsed: ["read"] }],
      ["まとめた線の一覧", "件数を押すと、線の近くに元の線の一覧を重ねる", { collapsed: ["read"], edgeList: "L6" }],
      ["ノードのページ", "図の枠の中を置き換える。項目の無い欄は、無い旨を出す", { node: "layout" }],
      ["ノードのページ（欄が空）", "入る線・視点・シーケンス・リンク先の図を持たないノード", { node: "index" }],
      ["視点", "選んだ視点の線が使用するノードだけで配置し直す", { view: "呼び出し" }],
      ["巡回（最初の手順）", "前へは押せない状態。強調しないノードは薄くする", { step: 0 }],
      ["巡回（最後の手順）", "グループの中に入り、次へは押せない状態", { step: 2, enter: "place" }],
      ["再生（一時停止）", "送り手と受け手を強調し、帯に今の番号とメッセージの文を出す", { play: 1, paused: true }],
    ];
    const catalog = document.getElementById("catalog");
    const add = (title, note, initial, narrow = false) => {
      catalog.append(Object.assign(document.createElement("h2"), { textContent: title }));
      catalog.append(Object.assign(document.createElement("p"), { className: "state-note", textContent: note }));
      const map = createMap({ title: "全体の構成", flow: FLOW, data: DATA, sequence: SEQUENCE }, initial);
      if (initial.paused) map.frame.dataset.paused = "true";
      const wrap = document.createElement("div");
      if (narrow) wrap.className = "narrow";
      wrap.append(map.frame);
      catalog.append(wrap);
    };
    for (const [title, note, initial] of STATES) add(title, note, initial);
    add("狭い幅（390px）", "帯とパンくずは折り返し、図は表示する枠の中で横にスクロールする", { enter: "lib" }, true);
  </script>
</body>
</html>
