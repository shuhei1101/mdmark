  - name: buildCsp
    title: CSP を組む
    kind: 関数
    container: vscode/src/preview/html.ts
    usecase: VSCodeでプレビューを開く
    summary: インターフェース定義の制約「CSP」のとおりの `Content-Security-Policy` の値を組む
    scope: public
    args:
      - name: options
        type: '{ nonce: string; distOrigin: string; libraryOrigins: string[]; cspSource: string }'
        required: true
        description: nonce・配布物の origin・`libraries` の origin・`Webview.cspSource`
    returns:
      type: string
      description: '`;` で区切った CSP'
    unit_tests:
      - name: test_build_csp
        case: 正常
        summary: スクリプトは nonce と配信元だけ、スタイルに unsafe-inline を足す
        condition: '`nonce` が `abc`、`distOrigin` が `https://cdn.jsdelivr.net`、`libraryOrigins` が `["https://cdn.example.com"]`、`cspSource` が `https://*.vscode-cdn.net`'
        mock: なし
        expected: "`default-src 'none'; script-src 'nonce-abc' https://cdn.jsdelivr.net https://cdn.example.com https://*.vscode-cdn.net; style-src https://cdn.jsdelivr.net https://*.vscode-cdn.net 'unsafe-inline'; img-src https://*.vscode-cdn.net https: data:; font-src https://cdn.jsdelivr.net https://*.vscode-cdn.net; connect-src https://cdn.jsdelivr.net`"
    refs:
