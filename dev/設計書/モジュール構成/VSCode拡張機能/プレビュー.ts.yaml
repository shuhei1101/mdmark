  - name: buildPreviewHtml
    title: Webview の HTML を組む
    kind: 関数
    container: vscode/src/preview/html.ts
    usecase: VSCodeでプレビューを開く
    summary: CSP・`<base>`・配布物の CSS・パネルの CSS・描く先を包む要素（`PreviewBoot` の `data-*`）・nonce 付きのパネルのスクリプトを持つ HTML を組む
    description: 属性に入れる値は HTML として特別な文字をエスケープする。バージョンを決められないときは配布物の `link` と `data-dist-js` を持たず `data-status="versionUndecidable"` を持つ。テストのときだけ `data-test` を持つ
    scope: public
    args:
      - name: options
        type: '{ nonce: string; csp: string; baseHref: string; distJs?: string; distCss?: string; version?: string; scriptUri: string; styleUri: string; configPath: string; test: boolean }'
        required: true
        description: 組むのに要る値。`baseHref` は Markdown のフォルダの `asWebviewUri` に `/` を付けたもの、`scriptUri`・`styleUri` は `media/preview.js`・`media/preview.css` の `asWebviewUri`
    returns:
      type: string
      description: HTML 文字列
    unit_tests:
      - name: test_build_preview_html
        case: 正常
        summary: CSP・base・配布物・スクリプトの nonce を持つ
        condition: '`distJs`・`distCss`・`version` を渡し、`test` が `false`'
        mock: なし
        expected: '`<meta http-equiv="Content-Security-Policy" content="{csp}">`、`<base href="{baseHref}">`、`<link rel="stylesheet" href="{distCss}">`、`#mdmark-preview` が `data-dist-js` と `data-version` を持ち `data-test` を持たない、全ての `script` が `nonce="{nonce}"` を持つ'
      - name: test_build_preview_html_when_undecidable
        case: 正常
        summary: バージョンを決められないときは配布物を読まない
        condition: '`distJs`・`distCss`・`version` を渡さず、`test` が `true`'
        mock: なし
        expected: 配布物の `link` が無く、`#mdmark-preview` が `data-status="versionUndecidable"` と `data-test` を持つ
      - name: test_build_preview_html_when_special_chars
        case: 正常
        summary: 属性の値をエスケープする
        condition: '`configPath` が `a"><script>x</script>.yaml`'
        mock: なし
        expected: '`data-config-path="a&quot;&gt;&lt;script&gt;x&lt;/script&gt;.yaml"`、nonce を持たない `script` が無い'
    callees:
      - '#functions[buildCsp]'
      - '#functions[distUrl]'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[相対パスの基準]
      - dev/設計書/モジュール構成/VSCode拡張機能/Webview.ts#data_models[PreviewBoot]
    status: planned
  - name: createNonce
    title: nonce を作る
    kind: 関数
    container: vscode/src/preview/html.ts
    usecase: VSCodeでプレビューを開く
    summary: '`crypto.getRandomValues` の 16 バイトを base64url にした文字列を返す（HTML を入れるたびに作り直す）'
    scope: public
    returns:
      type: string
      description: nonce
    unit_tests:
      - name: test_create_nonce
        case: 正常
        summary: 呼ぶたびに違う base64url の文字列を返す
        condition: 2 回呼ぶ
        mock: なし
        expected: どちらも `^[A-Za-z0-9_-]{22}$` に合い、等しくない
    status: planned
  - name: resolveLink
    title: リンクの開き先を見分ける
    kind: 関数
    container: vscode/src/preview/links.ts
    usecase: プレビューのリンクと画像を開く
    summary: '`http:`・`https:`・`mailto:` は `external`、それ以外のスキームは `none`、相対パスは `#` 以降を落として Markdown のフォルダから解決し、拡張子が `.md` なら `markdown`、他は `file` を返す'
    scope: public
    args:
      - name: options
        type: '{ href: string; markdownDir: string }'
        required: true
        description: 書いたままの `href` と Markdown のフォルダの絶対パス
    returns:
      type: LinkTarget
      description: 開き先
    unit_tests:
      - name: test_resolve_link
        case: 正常
        summary: 種類ごとに開き先を決める
        condition: '`markdownDir` が `/ws/docs` で、`https://example.com`・`mailto:a@example.com`・`./guide.md#使い方`・`../img/a.png`・`javascript:x`'
        mock: なし
        expected: '`external`（URL のまま）・`external`・`{ kind: "markdown", path: "/ws/docs/guide.md" }`・`{ kind: "file", path: "/ws/img/a.png" }`・`none`'
      - name: test_resolve_link_when_encoded
        case: 正常
        summary: パーセントエンコードした相対パスを戻して解決する
        condition: '`./%E4%BD%BF%E3%81%84%E6%96%B9.md`'
        mock: なし
        expected: '`{ kind: "markdown", path: "/ws/docs/使い方.md" }`'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューのリンクを開く.ts#constraints[リンクの見分け方]
    status: planned
