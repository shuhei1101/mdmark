title: "VS Code 拡張機能 / 拡張機能の入口"
lead: 拡張機能の `activate` と、`vscode/package.json` の `contributes`（コマンド・ショートカット・メニュー・設定）。コマンドと VS Code の通知を各機能へつなぐ。
directory: |-
  ```tree
  vscode/
  ├── package.json      # 拡張機能の定義（main・engines・contributes・scripts・依存）
  └── src/
      ├── extension.ts  # activate（コマンドと通知の登録、テストのときの戻り値）
      ├── deps.ts       # 各処理が受ける共通の依存 ExtensionDeps と globalState のキー
      ├── workspace.ts  # 相対パスの設定の基準のフォルダ（baseDirOf）
      ├── escape.ts     # HTML として特別な文字のエスケープ（vscode を import しない）
      └── log.ts        # ログの出力先の型（vscode を import しない）
  ```

  `extension.ts` はビルドが `vscode/dist/extension.cjs`（CommonJS。`vscode` はまとめない）にまとめ、`package.json` の `main` が指す。
constants:
  - name: contributes
    title: 拡張機能が追加するもの
    container: vscode/package.json
    summary: '`package.json` の `contributes` と、それを有効にしるキー'
    entries:
      - key: engines.vscode
        value: '`^1.141.0`'
        description: 非機能要件「対応する VS Code のバージョン」。`@types/vscode` は `1.141.0` に統一する
      - key: activationEvents
        value: '`onLanguage:markdown`・`onWebviewPanel:mdmark.preview`'
        description: コマンドは `contributes.commands` から VS Code が追加する
      - key: contributes.commands
        value: '`mdmark.openPreviewToSide`・`mdmark.openPreview`・`mdmark.refreshPreview`・`mdmark.openConfig`・`mdmark.openSettings`・`mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf`'
        description: '`category` は `mdmark`、`title` は画面設計の「コマンドの表示名」。`mdmark.openPreviewToSide` は `icon` に `$(open-preview)`、`mdmark.openSettings` は `icon` に `$(gear)`'
      - key: contributes.menus.editor/title
        value: '`mdmark.openPreviewToSide`（`when`: `editorLangId == markdown`、`group`: `navigation`）・`mdmark.openSettings`（`when`: `activeWebviewPanelId == ''mdmark.preview''`、`group`: `navigation`）'
        description: エディタのタイトルのボタン
      - key: contributes.menus.commandPalette
        value: "`mdmark.refreshPreview` は `mdmark.previewOpen`、`mdmark.openConfig`・`mdmark.openSettings` は常時、他は `editorLangId == markdown || activeWebviewPanelId == 'mdmark.preview'`"
        description: コマンドパレットに出す条件。`mdmark.previewOpen` は `setContext` でパネルが 1 つ以上開いているかを記載する
      - key: contributes.keybindings
        value: '`mdmark.openPreviewToSide` に `shift+alt+d`（`mac`: `shift+alt+d`）、`when`: `editorLangId == markdown`'
        description: 既定のショートカット（Mac は `Shift+Option+D`）
      - key: contributes.configuration
        value: 設定『VS Code 拡張機能』の `settings.json` のキー。`mdmark.version` は `pattern` `^(latest|v\d+\.\d+\.\d+)$`、`mdmark.preview.updateDelayMs` は `minimum` 0・`maximum` 5000、`mdmark.preview.theme` は `enum`、`mdmark.colorTheme` は `enum`（`""`・`dev-swiss`・`theme-paper`・`theme-slate`・`theme-contrast`）と `enumItemLabels`（`""` は「（設定ファイルに従う）」、他は名前のまま）
        description: 既定は `SETTING_DEFAULTS` と同じ値
    refs:
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#
      - dev/設計書/設定/VSCode拡張機能#
      - dev/設計書/非機能要件/非機能要件#requirements[対応する VS Code の版]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#constants[SETTING_DEFAULTS]
    status: planned
data_models:
  - name: TestApi
    title: テストのときの戻り値
    container: vscode/src/extension.ts
    usecase: 共通
    summary: '`ExtensionMode.Test` のときだけ `activate` が返却する、結合テストが Webview の DOM を確認するインターフェース'
    properties:
      - name: inspectPreview
        type: '(selector: string) => Promise<InspectedElement[]>'
        description: 最後に表に出たパネルの要素を調べる
      - name: auditPreview
        type: () => Promise<AxeViolation[]>
        description: 最後に表に出たパネルを axe で検査する
    refs:
      - dev/設計書/モジュール構成/VSCode拡張機能/プレビュー.ts#classes[PreviewManager]
    status: planned
  - name: Logger
    title: ログの出力先
    container: vscode/src/log.ts
    usecase: 共通
    summary: 各処理に依存として指定するログの出力先。`activate` が作る `LogOutputChannel` が満たし、単体テストは呼ばれたものを記録する代役を指定する
    description: '`vscode` を import しない処理（読み込むバージョン・設定）も受け取れるよう、`LogOutputChannel` のうち使用するメソッドだけを持つ型にする'
    properties:
      - name: info
        type: '(message: string, ...args: unknown[]) => void'
        description: 経過
      - name: warn
        type: '(message: string, ...args: unknown[]) => void'
        description: 代わりの値で続けた失敗
      - name: error
        type: '(error: string | Error, ...args: unknown[]) => void'
        description: 利用者の操作が果たせなかった失敗
    refs:
      - dev/設計書/外部ライブラリ/vscode#
    status: planned
  - name: ExtensionDeps
    title: 拡張機能の共通の依存
    container: vscode/src/deps.ts
    usecase: 共通
    summary: '`activate` が `extensionMode` と環境変数から作り、`PreviewManager`・`PreviewPanel`・`exportMarkdown` が受ける依存'
    properties:
      - name: context
        type: ExtensionContext
        description: VS Code が指定する文脈（`globalState`・`extensionUri`）
      - name: distBase
        type: string
        description: 配布物の配信元（`DIST_BASE` か `MDMARK_VSCODE_DIST_BASE`）
      - name: tagsUrl
        type: string
        description: タグ一覧の取得先（`TAGS_URL` か `MDMARK_VSCODE_TAGS_URL`）
      - name: test
        type: boolean
        description: '`ExtensionMode.Test` で動いているか'
      - name: log
        type: Logger
        description: ログの出力先
    status: planned
functions:
  - name: activate
    title: 拡張機能を動かし始める
    kind: 関数
    container: vscode/src/extension.ts
    usecase: 共通
    summary: コマンドと VS Code の通知を登録し、テストのときだけ `TestApi` を返却する
    scope: public
    side_effects: 登録したものを `context.subscriptions` に入れる
    args:
      - name: context
        type: ExtensionContext
        required: true
        description: VS Code が指定する
    returns:
      type: TestApi | undefined
      description: '`ExtensionMode.Test` のときだけ `TestApi`'
    process: |-
      1. `context.extensionMode` が `ExtensionMode.Test` のときだけ、環境変数 `MDMARK_VSCODE_DIST_BASE`・`MDMARK_VSCODE_TAGS_URL` を読み込む。無ければ `DIST_BASE`・`TAGS_URL`
      2. `window.createOutputChannel("mdmark", { log: true })` でログの出力先を 1 つ作り、`openConfigFile` には `Logger` として、`PreviewManager`・`exportMarkdown` には `ExtensionDeps` の `log` として指定する。`PreviewManager` を作る
      3. コマンドを登録する
         - `mdmark.openPreviewToSide`・`mdmark.openPreview` は `PreviewManager.open`（`ViewColumn.Beside`・`ViewColumn.Active`）
         - `mdmark.refreshPreview` は `PreviewManager.refresh`
         - `mdmark.openConfig` は対象の Markdown の基準のフォルダと Markdown のフォルダ（`cwd`。対象が無ければ基準のフォルダ）で `openConfigFile`
         - `mdmark.openSettings` は `commands.executeCommand("workbench.action.openSettings", "@ext:" + context.extension.id)`（`context.extension.id` は `package.json` の `publisher`.`name`）
         - `mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf` は `exportMarkdown`（`export`・`browser`・`print`）
      4. `workspace.onDidChangeTextDocument`・`onDidSaveTextDocument`・`onDidChangeConfiguration`・`window.onDidChangeTextEditorVisibleRanges` を `PreviewManager` へ、ワークスペースの `**/mdmark.config.yaml` の `createFileSystemWatcher` の作成・変更・削除を `PreviewManager.handleConfigChange` へつなぐ（パネルごとの見張るファイルは `PreviewManager` が張る）
      5. テストのときだけ `{ inspectPreview, auditPreview }` を返却する
    callees:
      - dev/設計書/モジュール構成/VSCode拡張機能/プレビュー.ts#classes[PreviewManager]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#functions[openConfigFile]
      - dev/設計書/モジュール構成/VSCode拡張機能/書き出し.ts#functions[exportMarkdown]
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#
    status: planned
