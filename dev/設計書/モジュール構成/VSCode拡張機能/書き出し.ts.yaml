title: "VS Code 拡張機能 / 書き出し"
lead: 開いている Markdown を jsDelivr の配布物で描く 1 つの HTML に書き出し、ブラウザで開き、印刷のダイアログを出させる。
directory: |-
  ```tree
  vscode/src/export/
  ├── html.ts    # 書き出す先のパスと HTML の組み立て（vscode を import しない）
  ├── write.ts   # 一時ファイルからの置き換え（vscode を import しない）
  ├── embed.ts   # 相対パスの libraries と html-scripts.url・mermaid.url を埋める処理（vscode を import しない）
  └── export.ts  # mdmark.exportHtml・mdmark.openInBrowser・mdmark.printToPdf の本体
  ```
enums:
  - name: ExportMode
    title: 書き出しの使い方
    container: vscode/src/export/export.ts
    usecase: HTMLに書き出す
    summary: 書き出した後に何をするか
    values:
      - value: export
        title: 書き出す
        description: 書き出した通知を出す（`mdmark.exportHtml`）
      - value: browser
        title: ブラウザで開く
        description: 通知を出さず `env.openExternal` で開く（`mdmark.openInBrowser`）
      - value: print
        title: PDF に印刷
        description: 印刷を待つ処理を足して書き、通知を出さずに開く（`mdmark.printToPdf`）
    status: planned
constants:
  - name: PRINT_WAIT_MS
    title: 印刷のダイアログを出すまでの待ちの上限
    container: vscode/src/export/html.ts
    summary: '`mount` の後、外部ライブラリの印の場所が無くなるのとフォントを待つ上限（ミリ秒）'
    value: '10000'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[印刷のダイアログを出すまでの待ちの上限]
    status: planned
functions:
  - name: resolveExportPath
    title: 書き出す先を決める
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`mdmark.export.outputDir` が空なら Markdown と同じフォルダ、相対パスならワークスペースのフォルダから、絶対パスならそのままのフォルダに、拡張子を `.html` に替えた名前を付けて返す'
    scope: public
    args:
      - name: options
        type: '{ markdownPath: string; outputDir: string; workspaceDir: string }'
        required: true
        description: Markdown の絶対パス、`mdmark.export.outputDir`、Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）
    returns:
      type: string
      description: 書き出す HTML の絶対パス
    unit_tests:
      - name: test_resolve_export_path
        case: 正常
        summary: 空・相対パス・絶対パスのそれぞれで書き出す先を決める
        condition: '`markdownPath` が `/ws/docs/guide.md`、`workspaceDir` が `/ws` で、`outputDir` が `""`・`out`・`/tmp/html`'
        mock: なし
        expected: '`/ws/docs/guide.html`・`/ws/out/guide.html`・`/tmp/html/guide.html`'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[書き出す先]
    status: planned
  - name: escapeScriptJson
    title: script に埋める JSON にする
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`JSON.stringify` し、`<` を JSON の Unicode エスケープ（6 文字）に置き換えて返す。本文の `</script>` で `script` 要素が閉じない'
    scope: public
    args:
      - name: value
        type: unknown
        required: true
        description: 埋める値
    returns:
      type: string
      description: '`<` を持たない JSON'
    unit_tests:
      - name: test_escape_script_json
        case: 正常
        summary: 本文の script の閉じを含んでも `<` を残さず、読み戻すと同じ値
        condition: '`{ markdown: "a</script><b>" }`'
        mock: なし
        expected: 戻り値が `<` を含まず、`JSON.parse` すると元の値
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[書き出す中身]
    status: planned
  - name: buildExportHtml
    title: 書き出す HTML を組む
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`<base>`・そのバージョンの `index.css` の `<link>`・`theme` の CSS の `<style>`・本文と設定の JSON の `<script type="application/json">`・`index.js` を読んで拡張を `registerExtension` で登録してから `mount(document.querySelector("main"), { markdown, config })` を呼ぶ `<script type="module">` を持つ HTML を組む'
    description: '`print` が `true` のときだけ、`mount` の後に「外部ライブラリの印の場所（class `mdmark-embed` と `role="status"` の要素）が無くなり、`document.fonts.ready` が解決したら `window.print()` を 1 回呼ぶ。`PRINT_WAIT_MS` を超えたらそのまま呼ぶ」処理を足す。印の場所は `MutationObserver` で待つ。`title` は Markdown のファイル名をエスケープして入れる。拡張のコードは `moduleDataUrl` で `data:` の URL にする'
    scope: public
    args:
      - name: options
        type: '{ markdown: string; config: PreviewConfig; title: string; distJs: string; distCss: string; baseHref: string; print: boolean; themeCss?: string; extensions: string[] }'
        required: true
        description: 全文・設定（相対パスの `libraries`・`html-scripts.url` は `embedLocalLibraries` が `data:` の URL にした値）・題・配布物の URL・Markdown のフォルダの `file:` の URL に `/` を付けたもの・印刷を待つか・重ねた設定の `theme` の CSS の中身・拡張を束ねた ES モジュールのコード（設定の順）
    returns:
      type: string
      description: HTML 文字列
    unit_tests:
      - name: test_build_export_html
        case: 正常
        summary: 本文を JSON で埋め、バージョン付きの配布物で mount する
        condition: '`markdown` が `# 題\n</script>`、`print` が `false`'
        mock: なし
        expected: '`<base href="{baseHref}">`・`<link rel="stylesheet" href="{distCss}">`・`type="application/json"` の `script` を持ち、その中身が `<` を含まない。`type="module"` の `script` が `{distJs}` を import し `mount` を呼ぶ。`window.print` を含まない'
      - name: test_build_export_html_when_print
        case: 正常
        summary: 印刷を待つ処理を足す
        condition: '`print` が `true`'
        mock: なし
        expected: '`window.print()`・`document.fonts.ready`・`PRINT_WAIT_MS` の値 `10000` を含む'
      - name: test_build_export_html_when_theme_and_extensions
        case: 正常
        summary: theme の CSS を配布物の CSS の後に埋め、拡張を mount の前に登録する
        condition: "`themeCss` が `.a{color:red}</style>`、`extensions` が `[\"export default {name:'x'}\"]`"
        mock: なし
        expected: '`<style>` が配布物の `link` の後にあり、中身が `</style` を含まない。`type="module"` の `script` が `registerExtension` を `mount` より前に呼ぶ。`extensions` が空で `themeCss` が無いときは `<style>` と `registerExtension` を含まない'
    callees:
      - '#functions[escapeScriptJson]'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[書き出す中身]
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[設定と相対パス]
      - dev/設計書/インターフェース定義/VSCode拡張機能/PDFに印刷する.ts#constraints[印刷する時]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#data_models[PreviewConfig]
    status: planned
  - name: writeFileAtomically
    title: 一時ファイルから置き換える
    kind: 関数
    container: vscode/src/export/write.ts
    usecase: HTMLに書き出す
    summary: フォルダが無ければ作り、同じフォルダの `.{名前}.{乱数}.tmp` に書いてから `rename` で置き換える。失敗したら一時ファイルを消して投げ直す
    scope: internal
    is_async: true
    side_effects: フォルダとファイルを書く
    args:
      - name: options
        type: '{ path: string; content: string }'
        required: true
        description: 書き出す先と中身
    returns:
      type: Promise<void>
      description: 置き換えたら解決する
    exceptions:
      - name: Error
        condition: フォルダを作れない・書けない・置き換えられない（OS の誤りを投げ直す）
    unit_tests:
      - name: test_write_file_atomically
        case: 正常
        summary: 無いフォルダを作って書き、一時ファイルを残さない
        condition: 一時フォルダの下の無いフォルダ `out/guide.html` に書く
        mock: なし（一時フォルダ）
        expected: '`out/guide.html` が中身どおりで、`out/` に `.tmp` のファイルが無い'
      - name: test_write_file_atomically_when_not_writable
        case: 異常
        summary: 書けなければ一時ファイルを消して投げ直す
        condition: 書き出す先が既にあるフォルダ（`rename` が失敗する）
        mock: なし（一時フォルダ）
        expected: 例外を投げ、フォルダに `.tmp` のファイルが無い
        exception: 置き換えられない
    status: planned
  - name: exportMarkdown
    title: Markdown を書き出す
    kind: 関数
    container: vscode/src/export/export.ts
    usecase: HTMLに書き出す
    summary: '`mdmark.exportHtml`・`mdmark.openInBrowser`・`mdmark.printToPdf` の本体。バージョンと設定を決めて HTML を書き、`mode` に合わせて知らせるか開く'
    scope: public
    is_async: true
    side_effects: 書き出す先に `{Markdown の名前}.html` を書く（あれば上書きする）。`mdmark.version` が `latest` のときはタグ一覧を 1 回取り `mdmark.lastVersion` を書き換える
    args:
      - name: options
        type: '{ document: TextDocument; mode: ExportMode; deps: ExtensionDeps }'
        required: true
        description: 書き出す Markdown・使い方・`PreviewManager` と同じ依存（`globalState` を持つ `ExtensionContext`・配布物の配信元・タグ一覧の取得先・ログの出力先）
    returns:
      type: Promise<Uri | undefined>
      description: 書き出した HTML。書き出せなかったときは `undefined`
    process: |-
      1. 読むバージョンを決める（読むバージョンを決める）
         - `undecidable` の場合、画面設計の「バージョンを決められない通知」を `showErrorMessage` で出し、`undefined` を返す
         - `fetched` が `true` の場合、`mdmark.lastVersion` に書く
      2. 設定ファイルを読み（設定ファイルを読む。`purpose: export`、`cwd` は Markdown のフォルダ、`baseDir` は Markdown を含むワークスペースのフォルダ、`env` は `process.env`、`home` は `os.homedir()`）、相対パスの `libraries`・`html-scripts.url`・`mermaid.url` を `getText()` の全文で判定して埋め（相対パスのライブラリを埋める。`bundle` は拡張を束ねる。まとめられないものは `[warn]` を出す）、`theme` の CSS を読んで `<style>` に、`extensions` を拡張を束ねる（拡張を束ねる）で束ねて、それぞれを描く前に登録するスクリプトとして埋める（束ねられない拡張は `[warn]` を出して飛ばす）。`problem` があるときはそのファイルを重ねずに書き出す。続けて `mdmark.colorTheme` で上書きする（テーマの設定で上書きする）
         - `[warn]` 設定ファイルを読めないため設定なしで書き出す（パス・行・`message`）
         - `[warn]` ライブラリをまとめられない（パス・誤り）
      3. 書き出す先を決め（書き出す先を決める）、`getText()` の全文で HTML を組み（書き出す HTML を組む。`print` は `mode` が `print` のとき）、書く（一時ファイルから置き換える）
         - 書けない場合、画面設計の「書き出せない通知」を `showErrorMessage` で出し、`undefined` を返す
           - `[error]` HTML を書き出せない（パス・誤り）
         - `[info]` HTML を書き出した（パス・バージョン・`mode`）
      4. `mode` で分ける
         - `export` の場合、「書き出した通知」を出す（待たずに返す）。「ブラウザで開く」が押されたら `env.openExternal` で開く
         - `browser`・`print` の場合、`env.openExternal` で開く
      5. 書き出した HTML の `Uri` を返す
    callees:
      - dev/設計書/モジュール構成/VSCode拡張機能/読むバージョン.ts#functions[decideVersion]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#functions[loadConfig]
      - dev/設計書/モジュール構成/VSCode拡張機能/プレビュー.ts#functions[distUrl]
      - '#functions[resolveExportPath]'
      - '#functions[buildExportHtml]'
      - '#functions[writeFileAtomically]'
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#functions[bundleExtensions]
      - '#functions[embedLocalLibraries]'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#
      - dev/設計書/インターフェース定義/VSCode拡張機能/ブラウザで開く.ts#
      - dev/設計書/インターフェース定義/VSCode拡張機能/PDFに印刷する.ts#
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#elements[書き出した通知]
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#elements[書き出せない通知]
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#elements[バージョンを決められない通知]
    status: planned
  - name: moduleDataUrl
    title: 'モジュールの data: の URL にする'
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: ES モジュールのコードを `encodeURIComponent` して `data:text/javascript;charset=utf-8,` の後ろに置いた URL を返す
    scope: public
    args:
      - name: code
        type: string
        required: true
        description: ES モジュールのコード
    returns:
      type: string
      description: '`data:text/javascript;charset=utf-8,` で始まる URL'
    unit_tests:
      - name: test_module_data_url
        case: 正常
        summary: 復号すると元のコードに戻る
        condition: '`export default "a b#%あ";`'
        mock: なし
        expected: '`data:text/javascript;charset=utf-8,` で始まり、後ろを `decodeURIComponent` すると元のコード'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[埋めるライブラリ]
    status: planned
  - name: embedLocalLibraries
    title: 相対パスのライブラリを埋める
    kind: 関数
    container: vscode/src/export/embed.ts
    usecase: HTMLに書き出す
    summary: '`http:`・`https:` でない `libraries` の値のうちライブラリ本体の `usedLibraryMarks` が返す名前と、ライブラリ本体の `collectRangeScripts` が 1 件以上返すときの `html-scripts.url` と、ライブラリ本体の `usesMermaid` が `true` を返すときの `mermaid.url` を `bundle` でまとめ、`moduleDataUrl` の URL に替えて返す'
    description: 拾わなかった・まとめられなかった相対パスの `libraries` の値は返す `libraries` から外し、`html-scripts.url` は返す `htmlScripts` から、`mermaid.url` は返す `mermaid` から `url` を外す（`url` を外した mermaid のコードブロックは、開いたときに既定の jsDelivr の URL から読む）。`bundle` は mermaid が中で読む chunk の動的 `import()` を同じモジュールに取り込む。`http:`・`https:` の値と文字列でない値はそのまま返す。同じパスは 1 回だけまとめる
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ markdown: string; libraries: Record<string, unknown> | undefined; htmlScripts: Record<string, unknown> | undefined; mermaid: Record<string, unknown> | undefined; config: MdmarkConfig; bundle: (paths: string[]) => Promise<Array<{ path: string; code: string } | { path: string; error: string }>> }'
        required: true
        description: 書き出す全文・重ねた設定の `libraries`・`html-scripts`・`mermaid`（相対パスは設定を重ねる処理が絶対パスにした値）・`collectRangeScripts` に渡す重ねた設定・絶対パスを ES モジュールにまとめる関数（拡張機能では `bundleExtensions`）
    returns:
      type: 'Promise<{ libraries: Record<string, unknown> | undefined; htmlScripts: Record<string, unknown> | undefined; mermaid: Record<string, unknown> | undefined; failures: Array<{ path: string; error: string }> }>'
      description: 埋めた値に替えた `libraries`・`html-scripts`・`mermaid` と、まとめられなかったパスと誤り
    unit_tests:
      - name: test_embed_local_libraries
        case: 正常
        summary: 'マーカーがある相対パスのライブラリと変換のライブラリだけを data: の URL に替える'
        condition: '`libraries` が `test-lib: /ws/libs/test.js`・`unused-lib: /ws/libs/unused.js`・`cdn-lib: https://example.com/a.js`、`html-scripts.url` が `/ws/libs/babel.js`、文書は `test-lib`・`cdn-lib` のマーカーと `ts` の範囲を持ち `config.features` が `{ "html-scripts": true }`'
        mock: '`bundle` はパスごとに `export default "{パス}"` を返し、渡されたパスを記録する'
        expected: '`libraries` が `test-lib`（`moduleDataUrl` の値）と `cdn-lib`（そのまま）だけを持ち、`htmlScripts.url` が `moduleDataUrl` の値。`bundle` に渡ったパスが `/ws/libs/test.js` と `/ws/libs/babel.js` だけで、`failures` が空'
      - name: test_embed_local_libraries_when_bundle_fails
        case: 異常
        summary: まとめられないものは外して誤りを返し、範囲が無ければ変換のライブラリをまとめない
        condition: '`test-lib` のマーカーを持ち範囲を持たない文書、`html-scripts.url` が絶対パス'
        mock: '`bundle` は `/ws/libs/test.js` に `{ path, error: "読めない" }` を返す'
        expected: '`libraries` に `test-lib` が無く、`htmlScripts` が `url` を持たず、`failures` が `/ws/libs/test.js` と誤りの 1 件。`bundle` に `html-scripts.url` のパスが渡らない'
        exception: まとめられない
      - name: test_embed_local_libraries_when_mermaid
        case: 正常
        summary: mermaid のコードブロックがある文書のときだけ、相対パスの mermaid.url を data の URL に替える
        condition: '`mermaid` が `{ url: "/ws/libs/mermaid.mjs", theme: "neutral" }`。文書が `mermaid` のコードブロックを持つときと持たないとき'
        mock: '`bundle` はパスごとに `export default "{パス}"` を返し、渡されたパスを記録する'
        expected: '前者の `mermaid` が `{ url: moduleDataUrl の値, theme: "neutral" }` で、`bundle` に `/ws/libs/mermaid.mjs` が渡る。後者は `bundle` に渡らず、`mermaid` が渡した値のまま'
    callees:
      - '#functions[moduleDataUrl]'
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[usedLibraryMarks]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[collectRangeScripts]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[usesMermaid]
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[埋めるライブラリ]
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[設定と相対パス]
    status: planned
test_files:
  - tests/unit/vscode/src/export/html.test.ts
  - tests/unit/vscode/src/export/write.test.ts
  - tests/unit/vscode/src/export/embed.test.ts
