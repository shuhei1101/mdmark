  - name: topInset
    title: 上端の帯の高さを測る
    kind: 関数
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: 狭い幅で右側の目次（`.mdmark-side-toc`）を描いた文書の上端の帯にしているとき、帯の下端からスクロールする要素の上端までの高さを返却する。帯が無いときは 0
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; scroller: Element }'
        required: true
        description: 描いた文書の要素と、スクロールする要素
    returns:
      type: number
      description: 見えている先頭を下げる高さ（px）
    process: |-
      1. `root` の中の `.mdmark-side-toc` が無いか、その幅が `root` の中の本文の列（`.mdmark-content`）の幅より狭い（広い幅の右の列）ときは 0 を返却する
      2. 帯の `getBoundingClientRect().bottom` から、スクロールする要素の上端（画面がスクロールするときは 0）を参照した値を返却する（負なら 0）
    unit_tests:
      - name: test_top_inset_when_band
        case: 正常
        summary: 狭い幅の帯の下端までの高さを返却する
        condition: 幅 390px の要素に右側の目次を持つ文書を描く
        mock: なし
        expected: 帯の高さ（`getBoundingClientRect().bottom`）と等しい値
      - name: test_top_inset_when_wide
        case: 正常
        summary: 広い幅の右の列では 0
        condition: 幅 1280px の要素に右側の目次を持つ文書を描く
        mock: なし
        expected: '`0`'
      - name: test_top_inset_when_no_side_toc
        case: 正常
        summary: 右側の目次が無い文書では 0
        condition: 見出しの無い文書を描く
        mock: なし
        expected: '`0`'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/スクロールを合わせる.ts#constraints[プレビューから合わせる]
