    usecase: 共通
    summary: 描く先を包む要素と保存した行を受け、`DocumentView` のメソッドを持つオブジェクトを返却する。`DocumentView` のプロパティはこの関数の中の変数に持つ
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; savedLine?: number; mdmark?: Mdmark }'
        required: true
        description: 描く先を包む要素・保存した行・（単体テストの）配布物
    returns:
      type: DocumentView
      description: 描いた文書
    status: planned
  - name: registerExtensions
    title: 拡張を登録する
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: 拡張の URL を順に読み込み、`default` を読み込んだ配布物の `registerExtension` に指定する。読み込めない・登録できない拡張は飛ばして続ける
    description: CLI が書き出した HTML の `prepareModules` と同じ順と扱い。React Compiler は `import()` を中に持つコンポーネントを変換しないため、コンポーネントの外の関数に配置する
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ mdmark: Mdmark; urls: string[]; importModule?: (url: string) => Promise<{ default?: unknown }> }'
        required: true
        description: 読み込んだ配布物・`boot.extensions`・拡張を読み込む関数（既定は `import(/* @vite-ignore */ url)`）
    returns:
      type: Promise<void>
      description: 全ての拡張を試したら解決する
    process: |-
      1. `urls` の順に `importModule(url)` で読み込み、`default` を `mdmark.registerExtension` に指定する
         - 読み込めない・`registerExtension` が例外を投げた場合、`console.error` に出して次の拡張へ進む（マーカーは知らないマーカーとして取り除かれる）
    unit_tests:
      - name: test_register_extensions
        case: 正常
        summary: 順に登録し、読み込めない拡張を飛ばす
        condition: '`urls` が `["a.js", "b.js", "c.js"]`、`b.js` だけ reject する `importModule`'
        mock: '`importModule` と `registerExtension` を記録する代役にする。`console.error` を記録する'
        expected: '`registerExtension` が `a.js`・`c.js` の `default` の順に呼ばれ、`console.error` が 1 回'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#constraints[theme と extensions]
    status: planned
    introduced:
      pr: 347
styles:
  - name: panel
    title: パネルの CSS
    container: vscode/src/webview/shared/styles/panel.css
    summary: Tailwind の theme と utilities の層、トークンの 3 ティア、`@theme inline` の割り当てと、パネルの部品の下地
    description: '冒頭で `@layer theme, base, components, utilities;` と Tailwind の既定の層の順を宣言し、`tailwindcss/theme.css`（`layer(theme)`）と `tailwindcss/utilities.css`（`layer(utilities)`）だけを読み込む。Preflight（`tailwindcss/preflight.css`）は読み込まない（描いた文書の要素の既定を mdmark の `@layer mdmark` から変えない）。独自の層は追加しない。トークンは `:root` に配置する: プリミティブは VS Code が `html` に指定する `--vscode-*`、セマンティックは shadcn/ui の名前（`--background`・`--foreground`・`--card`・`--card-foreground`・`--muted-foreground`・`--primary`・`--primary-foreground`・`--secondary`・`--border`・`--ring`・`--radius`）と警告の `--warning-border` を `--vscode-*` に割り当て、派生は `--primary-hover`・`--secondary-hover`（`color-mix(in oklab, …)`）。`@theme inline` で `--color-*: initial` の後にトークンを `--color-*`・`--radius-*` へ割り当てる'
    values:
      - class_name: .mdmark-panel-part
        target: 状態の表示と帯の外側（`base` の層）
        value: '`font-family: var(--vscode-font-family)`・`line-height: 1.6`・`overflow-wrap: anywhere`・子の `box-sizing: border-box`'
      - class_name: .mdmark-preview-status
        target: 状態の表示の外側
        value: Tailwind のクラスで `grid justify-items-center`・上の余白 `25dvh`（`pt-[25dvh]` の任意値は使用せず、`@theme` の `--spacing-panel-state` を割り当てたクラス）
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
      - dev/設計書/部品設計/設定ファイルを読み込めない帯.ts#
      - dev/設計書/外部ライブラリ/tailwindcss#
    status: planned
notes:
  ストーリー: '`panel-screen.stories.tsx` は画面の本体のストーリーで、モックの場面（`Document`・`Loading`・`Offline`・`VersionMissing`・`VersionUndecidable`・`DiffUnsupported`・`ConfigError`・`MediaError`）を持つ。`load` はストーリーの引数で代役（`Document` などはリポジトリの `dist/index.js` を読み込む関数）を指定し、読み込めなかった配布物の `HEAD` は MSW のハンドラで回答する。拡張機能から受けるメッセージは `createFakeVsCodeApi` が `ready` の後に送信する。`--vscode-*` の値はデコレーターが `:root` に与える（Light Modern・Dark Modern）'
  React の外の DOM: 描く先の要素の子は mdmark だけが書き換え、React は子を描かない。配色の class は描く先を包む要素（React の木を描く要素）に `DocumentView` が付ける
  テストの配置場所: '単体テストは今と同じく `tests/unit/vscode/src/webview/` の下に、`src/webview/` からの相対パスと同じ場所に配置する（設計書の `test_files` が `tests/` から始まるため。knowledge の規約『フォルダ構成』の対象の横に配置する決まりから削除される）。DOM と React を使用するテストは `*.browser.test.ts(x)` にし、Vitest のブラウザ（Chromium）で Testing Library と userEvent を使用する（スクロールの位置と要素の高さを測るため jsdom は使用しない）。MSW は公式の Vitest Browser Mode の構成で、`msw/browser` の `setupWorker(...handlers)` を `test.extend` のフィクスチャで `worker.start()`・`worker.resetHandlers()`・`worker.stop()` し、直下の `vitest.config.ts` の `unit-browser` のプロジェクトに `publicDir: ".storybook/public"` を指定して Storybook と同じ `mockServiceWorker.js` を配信する'
