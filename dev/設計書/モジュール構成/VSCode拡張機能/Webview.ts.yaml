functions:
  - name: startPreview
    title: パネルを始める
    kind: 関数
    container: vscode/src/webview/main.tsx
    usecase: VSCodeでプレビューを開く
    summary: Webview の入口。描く先を包む要素から始め方と保存した状態を読み、その要素に React の木（`App`）を描く。描く先を包む要素が無いページでは何もしない
    description: ファイルの末尾で呼ぶ
    scope: public
    process: |-
      1. `#mdmark-preview` が無ければ終わる
      2. 始め方を読み（始め方を読む）、`getVsCodeApi()` の `getState?.()` から保存した行を読む（保存した行を読む）
      3. `createRoot(#mdmark-preview).render(<App boot api savedLine />)`
    callees:
      - '#functions[readBoot]'
      - '#functions[savedLineFrom]'
      - '#functions[getVsCodeApi]'
      - '#components[App]'
    unit_tests:
      - name: test_start_preview_when_no_root
        case: 正常
        summary: 描く先を包む要素が無いページでは描かない
        condition: '`#mdmark-preview` の無いページで呼ぶ'
        mock: '`acquireVsCodeApi` を呼ばれたかを記録する代役にする'
        expected: 例外を投げず、`acquireVsCodeApi` が呼ばれない
    status: planned
  - name: readBoot
    title: 始め方を読む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: VSCodeでプレビューを開く
    summary: 描く先を包む要素の `data-*` から `PreviewBoot` を読む
    scope: public
    args:
      - name: root
        type: HTMLElement
        required: true
        description: '`#mdmark-preview`'
    returns:
      type: PreviewBoot
      description: 始め方
    unit_tests:
      - name: test_read_boot
        case: 正常
        summary: data-* を読み、知らない status は持たない
        condition: '`data-dist-js`・`data-version`・`data-config-path`・`data-test` を持つ要素と、`data-status="other"` だけを持つ要素'
        mock: なし
        expected: '1 つ目は全ての値と `test: true`、2 つ目は `status` が `undefined`・`configPath` が空・`test` が `false`'
    status: planned
  - name: savedLineFrom
    title: 保存した行を読む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: 共通
    summary: '`getState` で読んだ値が `PreviewState` なら、その行を返す'
    scope: public
    args:
      - name: state
        type: unknown
        required: true
        description: '`getState` の値'
    returns:
      type: number | undefined
      description: 保存した行
    unit_tests:
      - name: test_saved_line_from
        case: 正常
        summary: line が数のときだけ返す
        condition: '`{ line: 20.5 }`・`{ line: "20" }`・`undefined`・`null`'
        mock: なし
        expected: '`20.5`・`undefined`・`undefined`・`undefined`'
    status: planned
  - name: getVsCodeApi
    title: VS Code の API を取る
    kind: 関数
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    summary: '`acquireVsCodeApi()` を初回だけ呼んで覚え、2 回目からは同じ値を返す（VS Code は 2 回目の呼び出しで例外を投げる）'
    scope: public
    returns:
