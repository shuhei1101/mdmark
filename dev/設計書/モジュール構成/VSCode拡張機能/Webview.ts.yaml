title: VS Code 拡張機能 / Webview
lead: プレビューのパネルの中で動く React の画面と、配布物を読む前にも出す部品。jsDelivr の mdmark を読んで `mount`・`update` で描き、スクロール・リンク・状態の表示を担う。拡張機能とのメッセージの型も持つ。
directory: |-
  ```tree
  vscode/
  ├── vite.config.ts                     # Webview を media/preview.js・media/preview.css に書く Vite の設定
  ├── components.json                    # shadcn/ui の CLI の設定
  └── src/
      ├── messages.ts                    # 拡張機能 ⇄ Webview のメッセージの型（型だけ）
      └── webview/
          ├── main.tsx                   # 入口: 描く先を包む要素を読み、React の木を描く
          ├── app/
          │   └── app.tsx                # Error Boundary と画面
          ├── features/preview/panel/
          │   ├── panel-screen.tsx       # 画面: 状態の表示・帯・描く先の要素を並べ、メッセージ・読み込み・スクロール・リンクをつなぐ
          │   ├── panel-screen.stories.tsx
          │   ├── boot.ts                # 描く先を包む要素の data-* と保存した状態の読み取り
          │   ├── document-view.ts       # mdmark の mount・update・スクロールの位置・inspect・axe
          │   ├── load-mdmark.ts         # 配布物の import()・読めない理由の見分け・差分の色分けへの対応
          │   ├── diff-source.ts         # 差分の取り出し元
          │   ├── scroll.ts              # 元の行番号とスクロールの位置の内分
          │   ├── assets.ts              # 相対パスのアセットの差し替え・再生できない要素の通知
          │   └── hooks/
          │       ├── use-document-view.ts
          │       ├── use-host-messages.ts
          │       ├── use-load-mdmark.ts
          │       ├── use-scroll-sync.ts
          │       ├── use-link-clicks.ts
          │       └── use-media-errors.ts
          ├── shared/
          │   ├── adapters/
          │   │   └── vscode-api.ts      # acquireVsCodeApi を 1 回だけ呼び、送信と状態の読み書きを渡す
          │   ├── components/
          │   │   ├── preview-status.tsx # プレビューの状態の表示
          │   │   ├── preview-status.stories.tsx
          │   │   ├── config-band.tsx    # 設定ファイルを読めない帯
          │   │   ├── config-band.stories.tsx
          │   │   └── ui/
          │   │       ├── alert.tsx      # shadcn/ui の Alert（warning の variant を追加）
          │   │       ├── button.tsx     # shadcn/ui の Button（default・outline）
          │   │       └── spinner.tsx    # shadcn/ui の Spinner
          │   ├── lib/
          │   │   ├── cn.ts              # class の結合（clsx + tailwind-merge）
          │   │   ├── media-error.ts     # 再生できない動画・音声の知らせの HTML
          │   │   └── media-error.stories.ts
          │   └── styles/
          │       └── panel.css          # トークンの 3 ティア・@theme inline・Tailwind の theme と utilities
          └── testing/
              ├── fake-vscode-api.ts     # 送ったメッセージと状態を記録する acquireVsCodeApi の代役
              └── msw/
                  └── handlers.ts        # 読めなかった配布物の HEAD の応答（成功・404・ネットワークのエラー・遅延）
  ```

  `main.tsx` と `panel.css` は Vite が `vscode/media/preview.js`（ES モジュール 1 ファイル）と `vscode/media/preview.css` に書く。mdmark の配布物は束ねず、実行時に `import()` で読む。`vscode/media/` は丸ごと git の管理の外にする。
data_models:
  - name: HostMessage
    title: 拡張機能から Webview へのメッセージ
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: '`type` で見分ける判別付きの型'
    description: '`{ type: "render"; markdown: string; previous?: string; config: PreviewConfig; theme: "auto" | "light" | "dark"; includes?: Record<string, string> }`・`{ type: "scrollToLine"; line: number }`・`{ type: "configError"; line: number }`・`{ type: "configOk" }`・`{ type: "assetsResolved"; id: number; urls: Record<string, string | null> }`・`{ type: "inspect"; id: number; selector: string; play?: boolean }`・`{ type: "axe"; id: number }`。`inspect`・`axe` はテストのときだけ送る'
    properties:
      - name: type
        type: '"render" | "scrollToLine" | "configError" | "configOk" | "assetsResolved" | "inspect" | "axe"'
        description: メッセージの種類
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#data_models[PreviewConfig]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[動画・音声とアセットのルートの解決]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
    status: planned
  - name: WebviewMessage
    title: Webview から拡張機能へのメッセージ
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: '`type` で見分ける判別付きの型'
    description: '`{ type: "ready" }`・`{ type: "rendered" }`・`{ type: "loadFailed"; reason: "offline" | "versionMissing" | "diffUnsupported" }`・`{ type: "openLink"; href: string }`・`{ type: "revealLine"; line: number }`・`{ type: "reload" }`・`{ type: "openConfig" }`・`{ type: "resolveAssets"; id: number; paths: string[] }`・`{ type: "openAsset"; path: string }`・`{ type: "inspected"; id: number; elements: InspectedElement[] }`・`{ type: "axed"; id: number; violations: AxeViolation[] }`'
    properties:
      - name: type
        type: '"ready" | "rendered" | "loadFailed" | "openLink" | "revealLine" | "reload" | "openConfig" | "resolveAssets" | "openAsset" | "inspected" | "axed"'
        description: メッセージの種類
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[動画・音声とアセットのルートの解決]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[再生できない動画・音声]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
    status: planned
  - name: InspectedElement
    title: 調べた要素
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: 結合テストが Webview の DOM の期待値を確かめるために返す要素 1 つの様子
    properties:
      - name: tagName
        type: string
        description: 小文字のタグ名
      - name: className
        type: string
        description: '`class` の値'
      - name: attributes
        type: Record<string, string>
        description: 全ての属性
      - name: text
        type: string
        description: '`textContent`'
      - name: naturalWidth
        type: number | undefined
        description: '`img` のときだけ'
      - name: top
        type: number
        description: 見えている範囲の先頭からの位置（px。`getBoundingClientRect().top`）
      - name: height
        type: number
        description: 高さ（px）
      - name: currentTime
        type: number | undefined
        description: '`video`・`audio` のときだけ。`play` を受けたときは、`play()` から 1 秒後の値'
      - name: readyState
        type: number | undefined
        description: '`video`・`audio` のときだけ。要素の `readyState`（4 は再生に足りるデータを読めた）'
    status: planned
  - name: AxeViolation
    title: axe の違反
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: 結合テストが受け取る axe-core の違反 1 件
    properties:
      - name: id
        type: string
        description: axe-core の規則の ID（`color-contrast` など）
      - name: impact
        type: string | null
        description: axe-core の影響度
      - name: targets
        type: string[]
        description: 違反した要素のセレクタ
    status: planned
  - name: PreviewBoot
    title: パネルの始め方
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: VSCodeでプレビューを開く
    summary: 拡張機能が HTML の描く先を包む要素（`#mdmark-preview`）の `data-*` に置き、入口が読む値
    properties:
      - name: root
        type: HTMLElement
        description: 描く先を包む要素。React の木を描く場所で、配色の class を付ける
      - name: distJs
        type: string | undefined
        description: '`data-dist-js`。読む配布物の `index.js` の URL。バージョンを決められないときは持たない'
      - name: version
        type: string | undefined
        description: '`data-version`。読むバージョン（描けない理由に出す）'
      - name: status
        type: '"versionUndecidable" | undefined'
        description: '`data-status`。配布物を読まずに出す状態'
      - name: configPath
        type: string
        description: '`data-config-path`。`mdmark.configPath` の書いたままの値（帯に出す）'
      - name: test
        type: boolean
        description: '`data-test` を持つか。`inspect`・`axe` を受けるのは `true` のときだけ'
    status: planned
  - name: PreviewState
    title: Webview の状態
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    role: DTO
    summary: '`acquireVsCodeApi().setState` で保存し、作り直した Webview が `getState` で読む値'
    properties:
      - name: line
        type: number
        description: 見えている先頭の元の行番号（0 始まり）。整数に切り捨てず、小数部で行の途中の割合を持つ
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[背面のパネル]
    status: planned
    introduced:
      pr: 243
  - name: VsCodeApi
    title: VS Code の Webview の API
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    role: アダプター
    summary: '`acquireVsCodeApi()` が返す API のうち、Webview が使うもの'
    properties:
      - name: postMessage
        type: '(message: WebviewMessage) => void'
        description: 拡張機能へ送る
      - name: getState
        type: (() => unknown) | undefined
        description: 保存した状態を読む。持たない代役では行を戻さない
      - name: setState
        type: '((state: PreviewState) => void) | undefined'
        description: 状態を保存する。持たない代役では行を保存しない
    status: planned
  - name: Mdmark
    title: 読んだ配布物
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: 共通
    summary: '`import()` で読んだ mdmark の配布物のうち、Webview が使うもの'
    properties:
      - name: mount
        type: '(element: HTMLElement, options: { markdown: string; config?: unknown; diffSource?: DiffSource; docId?: string; diffMode?: "blocks"; includes?: Record<string, string> }) => MountHandle'
        description: 描く。`MountHandle` は `update(markdown, options?)`・`destroy()` を持つ
      - name: diffModes
        type: unknown
        description: 対応する差分の出し方。持たない前のバージョンもある
    status: planned
  - name: Anchor
    title: 行の印
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: '`data-source-line` を持つ要素の元の行番号と、文書の先頭からの位置'
    properties:
      - name: line
        type: number
        description: 元の行番号（0 始まり）
      - name: top
        type: number
        description: スクロールする要素の先頭からの位置（px）
    status: planned
  - name: DiffTexts
    title: 差分の全文
    container: vscode/src/webview/features/preview/panel/diff-source.ts
    usecase: VS Code の差分ビューの変更をプレビューで見る
    role: DTO
    summary: 差分のパネルで取り出し元が返す、最後に受けた `render` の全文。書き換えられる入れ物
    properties:
      - name: modified
        type: string
        description: 変更後の全文（`render` の `markdown`）
      - name: original
        type: string
        description: 変更前の全文（`render` の `previous`）
    status: planned
    introduced:
      pr: 196
  - name: PreviewStatusProps
    title: プレビューの状態の表示の props
    container: vscode/src/webview/shared/components/preview-status.tsx
    usecase: VSCodeでプレビューを開く
    summary: 部品設計『プレビューの状態の表示』の引数とイベント
    properties:
      - name: state
        type: PreviewStatusState
        description: 出す状態
      - name: version
        type: string | undefined
        description: 読もうとした mdmark の版
      - name: onReload
        type: () => void
        description: 「リロード」を押したとき
    status: planned
enums:
  - name: PreviewStatusState
    title: プレビューの状態
    container: vscode/src/webview/shared/components/preview-status.tsx
    usecase: VSCodeでプレビューを開く
    summary: プレビューの状態の表示が出す状態（文字列のリテラルの和）
    values:
      - value: loading
        title: 読み込み中
        description: 配布物を読み終えていない
      - value: offline
        title: 読めない
        description: 配布物を jsDelivr から読めない
      - value: versionMissing
        title: 版が無い
        description: 指定したバージョンが無い
      - value: versionUndecidable
        title: 版を決められない
        description: 読むバージョンを決められない
      - value: diffUnsupported
        title: 差分に対応しない
        description: 読んだ配布物が差分の表示に対応しない
      - value: unexpected
        title: 描画の失敗
        description: Webview の描画中に例外が出た（Error Boundary が受けた）
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
    status: planned
constants:
  - name: LOADING_DELAY_MS
    title: 読み込み中を出すまでの待ち
    container: vscode/src/webview/features/preview/panel/hooks/use-load-mdmark.ts
    summary: 配布物を読み始めてからこのミリ秒が経っても描けていなければ読み込み中を出す
    value: '1000'
    refs:
      - dev/設計書/画面設計/VSCodeのプレビュー.ts#elements[読み込み中の表示]
    status: planned
  - name: INSPECT_PLAY_MS
    title: 再生してから調べるまでの待ち
    container: vscode/src/webview/features/preview/panel/document-view.ts
    summary: '`inspect` の `play` で、`play()` を呼んでから調べるまで待つミリ秒'
    value: '1000'
    status: planned
  - name: DIFF_DOC_ID
    title: 差分の取り出し元の docId
    container: vscode/src/webview/features/preview/panel/diff-source.ts
    summary: 差分のパネルで `mount` に渡す `docId`
    value: '"diff"'
    status: planned
  - name: viteConfig
    title: Webview の Vite の設定
    container: vscode/vite.config.ts
    summary: '`export default defineConfig(...)` する設定'
    entries:
      - key: plugins
        value: '`@vitejs/plugin-react`・`@rolldown/plugin-babel` の `reactCompilerPreset`・`@tailwindcss/vite`'
      - key: build.lib
        value: '`entry: "src/webview/main.tsx"`・`formats: ["es"]`・`fileName: () => "preview.js"`・`cssFileName: "preview"`'
      - key: build.outDir
        value: '`media`（`emptyOutDir: false`。結合テストのビルドが `media/test/` に置く axe を残す）'
      - key: build.rolldownOptions.output.codeSplitting
        value: '`false`（ES モジュール 1 ファイルにし、Webview のリソースの範囲の外へチャンクを読みに行かない）'
      - key: build.target
        value: '`es2022`'
      - key: build.assetsInlineLimit
        value: '`0`（CSS に `data:` を埋めず、CSP の `img-src` を広げない）'
      - key: resolve.alias
        value: '`@` → `src/webview`'
    refs:
      - dev/設計書/外部ライブラリ/vite#
      - dev/設計書/外部ライブラリ/react#
    status: planned
  - name: shadcnConfig
    title: shadcn/ui の CLI の設定
    container: vscode/components.json
    summary: '`npx shadcn add` が部品を書く場所'
    entries:
      - key: style
        value: '`new-york`'
      - key: tsx
        value: '`true`'
      - key: tailwind.css
        value: '`src/webview/shared/styles/panel.css`'
      - key: tailwind.cssVariables
        value: '`true`'
      - key: aliases.ui
        value: '`@/shared/components/ui`'
      - key: aliases.utils
        value: '`@/shared/lib/cn`'
    refs:
      - dev/設計書/外部ライブラリ/shadcn-ui#
    status: planned
classes:
  - name: DocumentView
    title: 描いた文書
    container: vscode/src/webview/features/preview/panel/document-view.ts
    usecase: 共通
    role: 外部ライブラリとの同期
    summary: React の外の DOM として持つ描く先の要素に、mdmark の `mount`・`update` で文書を描き、スクロールの位置と配色の class を持つ
    description: '`type` で定義し、`createDocumentView` が作る。プロパティは関数の中に閉じた状態で、外から読まない。React の state を持たず、画面の hook とメッセージの処理から呼ばれる。描く先の要素の子は mdmark だけが書き換える'
    kind: インタフェース
    properties:
      - name: root
        type: HTMLElement
        access: private
        description: 描く先を包む要素（`#mdmark-preview`）。配色の class を付ける
      - name: element
        type: HTMLElement | undefined
        access: private
        description: 描く先の要素。`attach` で受け、`detach` で外す
      - name: mdmark
        type: Mdmark | undefined
        access: private
        description: '`import()` で読んだ配布物。`useMdmark` で受ける'
      - name: handle
        type: MountHandle | undefined
        access: private
        description: 今の描画。初回の `render` までは `undefined`
      - name: configKey
        type: string | undefined
        access: private
        description: 今の描画に渡した `config` の `JSON.stringify`（前と同じかの比較に使う）
      - name: pendingScrollTop
        type: number | undefined
        access: private
        description: '`scrollToLine` で動かした `scrollTop`。次の `scroll` の知らせでその値なら `revealLine` を送らずに消す'
      - name: diffTexts
        type: DiffTexts | undefined
        access: private
        description: 差分のパネルで取り出し元に渡した全文。`previous` を持つ `render` を初めて受けたときに作る
      - name: savedLine
        type: number | undefined
        access: private
        description: 作り直した Webview が起動したときに `getState` で読んだ行。最初の `render` でその行へ戻したら消す
    methods:
      - name: attach
        title: 描く先の要素を受ける
        kind: メソッド
        summary: React が描いた描く先の要素を受ける（ref のコールバックが呼ぶ）
        args:
          - name: element
            type: HTMLElement
            required: true
            description: 描く先の要素
        returns:
          type: void
          description: '-'
      - name: detach
        title: 描く先の要素を外す
        kind: メソッド
        summary: '`handle?.destroy()` を呼び、描く先の要素と描画を外す（ref のコールバックの後始末が呼ぶ）'
        returns:
          type: void
          description: '-'
        unit_tests:
          - name: test_detach
            case: 正常
            summary: 外すと描画を destroy し、次の render で mount し直す
            condition: '`render` の後に `detach`、`attach` で同じ要素を受けて同じ設定の `render`'
            mock: mdmark を `mount` と戻り値の `destroy` を記録する代役にする
            expected: '`destroy` が 1 回、`mount` が 2 回'
      - name: useMdmark
        title: 配布物を受ける
        kind: メソッド
        summary: '`import()` で読み終えた配布物を後から受ける'
        args:
          - name: mdmark
            type: Mdmark
            required: true
            description: 読み終えた配布物
        returns:
          type: void
          description: '-'
      - name: supportsDiff
        title: 差分の色分けに対応するかを返す
        kind: メソッド
        summary: 受けた配布物が差分の色分けに対応するかを返す。配布物を受ける前は `true`
        returns:
          type: boolean
          description: 対応すれば true
        callees:
          - '#functions[supportsDiffBlocks]'
      - name: render
        title: 描く
        kind: メソッド
        summary: '`render` を受けて文書を描く。初回と `config` が変わったときは `mount`（前の描画は `destroy`）、それ以外は `update`'
        args:
          - name: message
            type: 'Extract<HostMessage, { type: "render" }>'
            required: true
            description: 全文・設定・配色・取り込む文書の表
        returns:
          type: void
          description: '-'
        process: |-
          1. `theme` が `light`・`dark` なら `root` に class `mdmark-theme-light`・`mdmark-theme-dark` を付け、`auto` なら両方を外す
          2. 描き直す前の `scrollTop` を控える
          3. `previous` を持つときは、`diffTexts` が無ければ作り、`modified` を `markdown`、`original` を `previous` に書き換える
          4. `configKey` が同じで `handle` があれば `handle.update(markdown)`（`includes` を持てば `{ includes }` も渡す）、違えば `handle?.destroy()` の後に描く先の要素へ `mount(element, { markdown, config, includes })`。`diffTexts` があるときは `diffSource: createDiffSource(diffTexts)`・`docId: DIFF_DOC_ID`・`diffMode: "blocks"` も渡す
          5. `savedLine` があれば `scrollToLine(savedLine)` で置いて `savedLine` を消し（`pendingScrollTop` に覚えるため `revealLine` は送らない）、無ければ控えた `scrollTop` に戻す
          6. `savedLine` で置いたときは、次の `requestAnimationFrame` で `scrollTop` が置いた値から動いていなければ、もう一度 `scrollToLine` で置き直す（差分のパネルは描いた後に色分けで描き直し、行より上の高さが変わる）
        exceptions:
          - name: Error
            condition: 配布物か描く先の要素を受ける前に呼ばれた
            message: '`mdmark の配布物を読む前に render を受けた`'
        unit_tests:
          - name: test_render
            case: 正常
            summary: 初回は mount、同じ設定の次の回は update
            condition: '`config` が `{}` の `render` を 2 回'
            mock: mdmark を `mount` と戻り値の `update`・`destroy` を記録する代役にする
            expected: '`mount` が 1 回、2 回目は `update` が 2 回目の `markdown` で 1 回、`destroy` は呼ばれない'
          - name: test_render_when_config_changed
            case: 正常
            summary: 設定が変わったら destroy してから mount し直し、スクロールの位置を保つ
            condition: '`config` が `{}` の `render` の後、`scrollTop` を 200 にして `config` が `{ features: { callout: false } }` の `render`'
            mock: mdmark を代役にする
            expected: '`destroy` の後に `mount` が新しい `config` で呼ばれ、`scrollTop` が 200'
          - name: test_render_when_theme
            case: 正常
            summary: 配色を固定するときだけ包む要素に class を付ける
            condition: '`theme` が `dark`、続けて `auto`'
            mock: mdmark を代役にする
            expected: 1 回目の後は `root` が `mdmark-theme-dark` を持ち、2 回目の後は `mdmark-theme-*` を持たない
          - name: test_render_when_diff
            case: 正常
            summary: previous を持つ render では取り出し元を渡して blocks で描き、次の render では取り出し元の全文を書き換えてから update する
            condition: '`markdown` が `A2`・`previous` が `A1` の `render` の後、`markdown` が `A3` の `render`（`config` は同じ）'
            mock: mdmark を `mount` に渡された引数と `update` を記録する代役にする
            expected: '`mount` に `docId: "diff"`・`diffMode: "blocks"` と `diffSource` が渡る。`diffSource.revisions("diff")` が `modified`・`original` の順。`update` が `A3` で呼ばれた時点で `content` の `modified` が `A3`、`original` が `A1`'
          - name: test_render_when_saved_line
            case: 正常
            summary: 保存した行を持つ view は、最初の render の後だけその行へ戻し、自分が起こしたスクロールとして捨てる
            condition: '`data-source-line` を持つ見出しを並べた長い文書を描く代役で、`savedLine` が 20 の view を作り `render`、続けて `takeScroll()`。その後 `scrollTop` を 100 にして同じ設定の `render`'
            mock: mdmark を `markdown` の見出しを `data-source-line` つきで描く代役にする
            expected: 1 回目の後の `scrollTop` が `scrollToLine(20)` で置く位置と同じで、`takeScroll()` が `undefined`。2 回目の後の `scrollTop` が 100
          - name: test_render_when_not_loaded
            case: 異常
            summary: 配布物を受ける前は描かない
            condition: '`useMdmark` を呼ばずに `render`'
            mock: なし
            expected: '`Error`'
            exception: 配布物か描く先の要素を受ける前に呼ばれた
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[設定が変わったときの描き方]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[背面のパネル]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[配色]
        callees:
          - '#functions[createDiffSource]'
      - name: scrollToLine
        title: 行まで動かす
        kind: メソッド
        summary: 元の行番号の位置を先頭（上端の帯があればその下端）に置く。動かす `scrollTop` が今の値と違うときだけ動かし、`pendingScrollTop` に覚える
        args:
          - name: line
            type: number
            required: true
            description: 元の行番号（0 始まり）
        returns:
          type: void
          description: '-'
        process: |-
          1. 元の行番号の位置から上端の帯の高さ（`topInset`）を引いた値を `scrollTop` にする
          2. 狭い幅で右側の目次の帯が上端に留まると帯の下端が変わるため、動かした後の `topInset` で 1 をもう一度行う
          3. `scrollTop` が動かす前と違えば、`pendingScrollTop` に覚える
        callees:
          - '#functions[collectAnchors]'
          - '#functions[topForLine]'
          - '#functions[topInset]'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/スクロールを合わせる.ts#constraints[往復の止め方]
      - name: takeScroll
        title: スクロールを行にする
        kind: メソッド
        summary: '`scroll` の知らせを受け、自分が起こしたスクロールなら `undefined`、そうでなければ見えている先頭の元の行番号を返す'
        returns:
          type: number | undefined
          description: '`revealLine` で送る行'
        process: |-
          1. `scrollTop` が `pendingScrollTop` と等しければ、`pendingScrollTop` を消して `undefined` を返す
          2. `pendingScrollTop` を消し、`currentLine()` を返す
        unit_tests:
          - name: test_take_scroll_when_own_scroll
            case: 正常
            summary: 自分が動かしたスクロールの知らせだけを捨てる
            condition: '`scrollToLine(20)` の後に `takeScroll()`、続けて `scrollTop` を別の値にして `takeScroll()`'
            mock: なし
            expected: 1 回目は `undefined`、2 回目はその位置の行
        callees:
          - '#functions[collectAnchors]'
          - '#functions[lineForTop]'
          - '#functions[topInset]'
      - name: currentLine
        title: 先頭の行を返す
        kind: メソッド
        summary: 見えている先頭の位置（上端の帯があればその下端）を元の行番号にして返す。描く前は `undefined`
        returns:
          type: number | undefined
          description: '`revealLine` で送る行'
        process: |-
          1. `handle` が無ければ `undefined` を返す
          2. 今の `scrollTop` に上端の帯の高さ（`topInset`）を足した位置を行にして返す（行の印を集める、位置を行にする）
        unit_tests:
          - name: test_current_line
            case: 正常
            summary: 描く前は行を返さず、描いた後は先頭の行を返す
            condition: '`render` の前に `currentLine()`、`render` の後に `scrollToLine(20)` して `currentLine()`'
            mock: mdmark を `data-source-line` つきの見出しを描く代役にする
            expected: 1 回目は `undefined`、2 回目は 20
        callees:
          - '#functions[collectAnchors]'
          - '#functions[lineForTop]'
          - '#functions[topInset]'
      - name: currentPosition
        title: 先頭の位置を返す
        kind: メソッド
        summary: 見えている先頭の位置（上端の帯があればその下端）を、整数に切り捨てない元の行番号にして返す。描く前は `undefined`
        returns:
          type: number | undefined
          description: '`setState` で保存する位置'
        process: |-
          1. `handle` が無ければ `undefined` を返す
          2. 今の `scrollTop` に上端の帯の高さ（`topInset`）を足した位置を、切り捨てない行にして返す（行の印を集める、位置を切り捨てない行にする）
        unit_tests:
          - name: test_current_position
            case: 正常
            summary: 描く前は位置を返さず、描いた後は行の途中の位置を切り捨てずに返す
            condition: '`render` の前に `currentPosition()`、`render` の後に `scrollToLine(20.5)` して `currentPosition()` と `currentLine()`'
            mock: mdmark を `data-source-line` つきの見出しを描く代役にする
            expected: 1 回目は `undefined`、2 回目は 20.5 との差が 0.05 未満、`currentLine()` は 20
        callees:
          - '#functions[collectAnchors]'
          - '#functions[fractionalLineForTop]'
          - '#functions[topInset]'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[背面のパネル]
      - name: inspect
        title: 要素を調べる
        kind: メソッド
        summary: '`selector` に当たる要素ごとの `InspectedElement` を返す（テストのときだけ呼ばれる）。`play` のときは、当たった `video`・`audio` を `muted` にして `play()` を呼び、`INSPECT_PLAY_MS` 待ってから調べる（`play()` が拒まれた要素もそのまま調べる）'
        is_async: true
        args:
          - name: selector
            type: string
            required: true
            description: CSS セレクタ（`document` 全体に当てる）
          - name: play
            type: boolean
            required: false
            default: 'false'
            description: 当たった動画・音声を再生してから調べるか
        returns:
          type: Promise<InspectedElement[]>
          description: 当たった要素の並び
        unit_tests:
          - name: test_inspect
            case: 正常
            summary: 属性・文字・画像の幅・位置を返す
            condition: '`<h1 id="a" class="x">題</h1>` と読み終えた `<img alt="図">` を置き、`h1, img` で調べる'
            mock: なし
            expected: '`h1` は `className` が `x`・`attributes.id` が `a`・`text` が `題`・`naturalWidth` が無い。`img` は `naturalWidth` が画像の幅。どちらも `top`・`height` が数'
          - name: test_inspect_when_play
            case: 正常
            summary: 動画を再生してから調べる
            condition: '再生できる短い `webm` の `<video>` を置き、`video` と `play: true` で調べる'
            mock: なし
            expected: '`currentTime` が 0.5 以上'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#flows[正常系（相対パスとアセットのルートの動画・音声）]
      - name: audit
        title: axe で検査する
        kind: メソッド
        summary: 結合テストのビルドが置いた `media/test/axe.js` を、`preview.js` と同じ場所の Webview の URL から `import()` で読み、`root` に `axe.run` を流して違反を返す（テストのときだけ呼ばれる）
        is_async: true
        returns:
          type: Promise<AxeViolation[]>
          description: 違反の並び。無ければ空
        process: |-
          1. `document` の `script[src$='preview.js']` の `src` の `preview.js` を `test/axe.js` に替えた URL を `import()` で読む（UMD のため `window.axe` に入る）
          2. `window.axe.run({ include: [root], exclude: [element] })` の `violations` を、`id`・`impact`・`nodes[].target` を連ねたセレクタの `targets` にして返す。描く先の要素（mdmark が描いた文書）は検査の範囲に入れず、パネルの部品（状態の表示・帯）だけを検査する（文書のアクセシビリティはライブラリ本体のテストが受け持ち、PoC で出た `label-content-name-mismatch` はライブラリ本体の問題として切り出す）
        exceptions:
          - name: Error
            condition: '`preview.js` の `script` が無い'
            message: '`preview.js の script が無い`'
        unit_tests:
          - name: test_audit
            case: 正常
            summary: axe の違反を ID・影響度・セレクタにして返す
            condition: '`src` が `…/preview.js` の `script` を置き、`…/test/axe.js` を `window.axe.run` が違反 1 件（`color-contrast`・`serious`・`[["#a"]]`）を返す代役のモジュールにする'
            mock: '`axe.js` を代役のモジュールにする'
            expected: '`[{ id: "color-contrast", impact: "serious", targets: ["#a"] }]`。`run` に `include: [root]`・`exclude: [描く先の要素]` が渡る'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
          - dev/設計書/外部ライブラリ/axe-core#
    status: planned
    implementations:
      - target: '#functions[createDocumentView]'
        notes: クロージャに状態を持つオブジェクトを返す（knowledge の規約『TypeScript のスタイル』の関数ベースで書く決まりに合わせ、クラスにしない）
components:
  - name: App
    title: Webview のアプリ
    container: vscode/src/webview/app/app.tsx
    usecase: 共通
    summary: 画面を `react-error-boundary` の `ErrorBoundary` で包む
    description: '描画中の例外は `fallbackRender` で `PreviewStatus`（`state: "unexpected"`）を出し、`onError` で `console.error` に例外を出す。「リロード」は `reload` を送り、拡張機能が HTML を入れ直す（`resetErrorBoundary` の代わり）'
    kind: コンポーネント
    props:
      - name: boot
        type: PreviewBoot
        required: true
        description: パネルの始め方
      - name: api
        type: VsCodeApi
        required: true
        description: VS Code の Webview の API
      - name: savedLine
        type: number | undefined
        required: false
        description: 保存した行
    unit_tests:
      - name: test_app_when_render_error
        case: 異常
        summary: 画面の描画で例外が出たら、描画の失敗とリロードを出す
        condition: '`PanelScreen` を例外を投げる代役にして描き、「リロード」を押す'
        mock: '`PanelScreen` を代役にする。`api` を `postMessage` を記録する代役にする'
        expected: 題「プレビューを表示できません」と描画の失敗の文言があり、`reload` が 1 回送られる
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
    status: planned
  - name: PanelScreen
    title: プレビューのパネル
    container: vscode/src/webview/features/preview/panel/panel-screen.tsx
    usecase: 共通
    summary: 画面設計『VSCodeのプレビュー』の要素を並べ、配布物の読み込み・拡張機能のメッセージ・スクロール・リンクを hook でつなぐ
    description: |-
      描く順は 状態の表示（`status` があるとき）→ 帯（`configErrorLine` があるとき）→ 描く先の要素（`status` があるときは `hidden`）。描く先の要素は子を持たない `div` で、中身は `DocumentView` が mdmark で描く。メッセージは `type` ごとに次のとおり処理する（`settled`・`assetsId` は ref に持つ）

      - `render`: `previous` を持ち `view.supportsDiff()` が false なら、描かずに `status` を `diffUnsupported` にして `loadFailed`（`diffUnsupported`）を送る。それ以外は `view.render` の後に `status` を消して `rendered` を送り、`currentPosition()` が数なら `setState({ line })` で保存する。`collectAssetPaths` が 1 つ以上返せば `assetsId` を増やして `resolveAssets` を送る
      - `assetsResolved`: `id` が `assetsId` と同じときだけ `applyAssetUrls` を呼ぶ
      - `scrollToLine`: `view.scrollToLine`
      - `configError`・`configOk`: `configErrorLine` を行にする・消す
      - `inspect`・`axe`: `boot.test` のときだけ `view.inspect`・`view.audit` の結果を `inspected`・`axed` で同じ `id` で送る
      - 上の `type` 以外: 処理しない（`window` の `message` には、MSW の Service Worker など拡張機能以外が送るものも届く）

      メッセージの処理と配布物の読み込みの結果の処理で投げた例外（`view.render` の例外など）は、`react-error-boundary` の `useErrorBoundary` の `showBoundary` で `App` の Error Boundary へ渡し、描画の失敗（`unexpected`）を出す
    kind: 画面
    props:
      - name: boot
        type: PreviewBoot
        required: true
        description: パネルの始め方
      - name: api
        type: VsCodeApi
        required: true
        description: VS Code の Webview の API
      - name: savedLine
        type: number | undefined
        required: false
        description: 保存した行。最初の `render` でその行へ戻す
      - name: load
        type: '(url: string) => Promise<Mdmark>'
        required: false
        default: '`loadMdmark`'
        description: 配布物を読む関数。ストーリーと単体テストが代役を渡す
    state:
      - name: status
        type: '{ state: PreviewStatusState; version?: string } | undefined'
        initial: '`boot.status` が `versionUndecidable` か `boot.distJs` が無いとき `{ state: "versionUndecidable" }`、それ以外は `undefined`'
        description: 文書の代わりに出す状態の表示
        notes: '`useState`'
      - name: configErrorLine
        type: number | undefined
        initial: '`undefined`'
        description: 設定ファイルを読めない行。あるときだけ帯を出す
        notes: '`useState`'
    unit_tests:
      - name: test_panel_screen_when_rendered
        case: 正常
        summary: 配布物を読み終えたら ready を送り、render で描いて rendered を送る
        condition: 代役の `load` を渡して描き、`ready` を待って `render` を送る
        mock: '`api` を送ったメッセージと状態を記録する代役にする。`load` を mdmark の代役を返す関数にする'
        expected: '`ready`・`rendered` の順に送られ、描く先の要素に代役が描いた本文がある。状態の表示が無い'
      - name: test_panel_screen_when_slow
        case: 正常
        summary: 1 秒経っても描けていなければ読み込み中を出し、render で消す
        condition: 解決しない `load` を渡して描き、フェイクタイマーで `LOADING_DELAY_MS` 進める。続けて `load` を解決して `render` を送る
        mock: '`api` を代役にする。`load` を後から解決できる代役にする。タイマーをフェイクにする'
        expected: 進めた後に題「mdmark を読み込んでいます」がある。`render` の後に無い
      - name: test_panel_screen_when_load_failed
        case: 異常
        summary: 配布物を読めなければ理由と版を出し、loadFailed を送る
        condition: '`data-version="v0.7.0"` の `boot` と reject する `load` を渡し、MSW で HEAD をネットワークのエラーにする'
        mock: '`api` を代役にする。`load` を reject する代役にする。MSW の `offline` のハンドラ'
        expected: '`loadFailed`（`offline`）が送られ、状態の表示に `v0.7.0` と `data-action="reload"` のボタンがある。読み込み中は出ない'
      - name: test_panel_screen_when_version_undecidable
        case: 正常
        summary: 版を決められないときは配布物を読まずに理由を出す
        condition: '`status` が `versionUndecidable` の `boot` で描く'
        mock: '`api` を代役にする。`load` を呼ばれたかを記録する代役にする'
        expected: '`load` が呼ばれず、`ready` が送られない。状態の表示に版を決められない文言がある'
      - name: test_panel_screen_when_diff_unsupported
        case: 異常
        summary: 差分に対応しない配布物で previous つきの render を受けると、描かずに理由を出す
        condition: '`data-version="v0.8.0"` の `boot` で、`diffModes` を持たない配布物を読んだ後に `previous` つきの `render` を送る'
        mock: '`api` を代役にする。`load` を `mount` だけを持つ代役を返す関数にする'
        expected: '`mount` が呼ばれず、`loadFailed`（`diffUnsupported`）が送られ `rendered` は送られない。状態の表示に `v0.8.0` と `data-action="reload"` のボタンがある'
      - name: test_panel_screen_when_reload_clicked
        case: 正常
        summary: 「リロード」で reload を送る
        condition: 読めない状態で「リロード」を userEvent で押す
        mock: '`api` を代役にする'
        expected: '`reload` が 1 回送られる'
      - name: test_panel_screen_when_config_error
        case: 正常
