      description: VS Code の Webview の API
    unit_tests:
      - name: test_get_vs_code_api
        case: 正常
        summary: 2 回呼んでも acquireVsCodeApi は 1 回
        condition: 2 回呼ぶ
        mock: '`acquireVsCodeApi` を呼ばれた数を記録する代役にする'
        expected: 同じ値で、`acquireVsCodeApi` が 1 回
    status: planned
  - name: loadMdmark
    title: 配布物を読む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: '`import(/* @vite-ignore */ url)` で配布物を読む'
    description: React Compiler は `import()` を中に持つコンポーネントを変換しないため、コンポーネントの外の関数に置く
    scope: public
    is_async: true
    args:
      - name: url
        type: string
        required: true
        description: 配布物の `index.js` の URL
    returns:
      type: Promise<Mdmark>
      description: 読んだ配布物。読めなければ reject
    status: planned
  - name: classifyLoadFailure
    title: 読めない理由を見分ける
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: 読めなかった `index.js` の URL を `fetch` の `HEAD` で確かめ、404 なら `versionMissing`、それ以外は `offline` を返す
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ url: string; fetch: typeof fetch }'
        required: true
        description: 読めなかった URL と `fetch`
    returns:
      type: Promise<"offline" | "versionMissing">
      description: 描けない理由
    unit_tests:
      - name: test_classify_load_failure
        case: 正常
        summary: 404 は指定したバージョンが無い
        condition: '`fetch` が 404'
        mock: '`fetch` を代役にする'
        expected: '`versionMissing`。`fetch` に `method: "HEAD"` が渡る'
      - name: test_classify_load_failure_when_network_error
        case: 正常
        summary: ネットワークのエラーと 404 以外はオフライン
        condition: '`fetch` が `TypeError` で reject、別の回に 503'
        mock: '`fetch` を代役にする'
        expected: どちらも `offline`
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[描けない理由の見分け方]
    status: planned
  - name: supportsDiffBlocks
    title: 差分の色分けに対応するかを見る
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VS Code の差分ビューの変更をプレビューで見る
    summary: 読んだ配布物の `diffModes` が配列で `blocks` を含むとき true を返す
    scope: public
    args:
      - name: mdmark
        type: '{ diffModes?: unknown }'
        required: true
        description: '`import()` で読んだ配布物'
