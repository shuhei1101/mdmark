        type: '"ok" | "versionMissing" | "offline" | "slow"'
        required: true
        description: 応答の種類
    returns:
      type: HttpHandler[]
      description: '`https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@*/dist/index.js` の `HEAD` のハンドラ'
    refs:
      - dev/設計書/外部ライブラリ/msw#
      - dev/設計書/外部API/jsDelivr#
    status: planned
  - name: createDocumentView
    title: 描いた文書を作る
    kind: 関数
    container: vscode/src/webview/features/preview/panel/document-view.ts
    usecase: 共通
    summary: 描く先を包む要素と保存した行を受け、`DocumentView` のメソッドを持つオブジェクトを返す。`DocumentView` のプロパティはこの関数の中の変数に持つ
    scope: public
    args:
      - name: options
        type: '{ root: HTMLElement; savedLine?: number; mdmark?: Mdmark }'
        required: true
        description: 描く先を包む要素・保存した行・（単体テストの）配布物
    returns:
      type: DocumentView
      description: 描いた文書
    status: planned
styles:
  - name: panel
    title: パネルの CSS
    container: vscode/src/webview/shared/styles/panel.css
    summary: Tailwind の theme と utilities の層、トークンの 3 ティア、`@theme inline` の割り当てと、パネルの部品の下地
    description: '冒頭で `@layer theme, base, components, utilities;` と Tailwind の既定の層の順を宣言し、`tailwindcss/theme.css`（`layer(theme)`）と `tailwindcss/utilities.css`（`layer(utilities)`）だけを読む。Preflight（`tailwindcss/preflight.css`）は読まない（描いた文書の要素の既定を mdmark の `@layer mdmark` から変えない）。独自の層は足さない。トークンは `:root` に置く: プリミティブは VS Code が `html` に渡す `--vscode-*`、セマンティックは shadcn/ui の名前（`--background`・`--foreground`・`--card`・`--card-foreground`・`--muted-foreground`・`--primary`・`--primary-foreground`・`--secondary`・`--border`・`--ring`・`--radius`）と警告の `--warning`・`--warning-border` を `--vscode-*` に割り当て、派生は `--primary-hover`・`--secondary-hover`・`--warning-foreground`（`color-mix(in oklab, …)`）。`@theme inline` で `--color-*: initial` の後にトークンを `--color-*`・`--radius-*` へ割り当てる'
    values:
      - class_name: .mdmark-panel-part
        target: 状態の表示と帯の外側（`base` の層）
        value: '`font-family: var(--vscode-font-family)`・`line-height: 1.6`・`overflow-wrap: anywhere`・子の `box-sizing: border-box`'
      - class_name: .mdmark-preview-status
        target: 状態の表示の外側
        value: Tailwind のクラスで `grid justify-items-center`・上の余白 `25dvh`（`pt-[25dvh]` の任意値は使わず、`@theme` の `--spacing-panel-state` を割り当てたクラス）
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
      - dev/設計書/部品設計/設定ファイルを読めない帯.ts#
      - dev/設計書/外部ライブラリ/tailwindcss#
    status: planned
notes:
  ストーリー: '`panel-screen.stories.tsx` は画面の本体のストーリーで、モックの場面（`Document`・`Loading`・`Offline`・`VersionMissing`・`VersionUndecidable`・`DiffUnsupported`・`ConfigError`・`MediaError`）を持つ。`load` はストーリーの引数で代役（`Document` などはリポジトリの `dist/index.js` を読む関数）を渡し、読めなかった配布物の `HEAD` は MSW のハンドラで答える。拡張機能から受けるメッセージは `createFakeVsCodeApi` が `ready` の後に送る。`--vscode-*` の値はデコレーターが `:root` に与える（Light Modern・Dark Modern）'
  React の外の DOM: 描く先の要素の子は mdmark だけが書き換え、React は子を描かない。配色の class は描く先を包む要素（React の木を描く要素）に `DocumentView` が付ける
  テストの置き場所: '単体テストは今と同じく `tests/unit/vscode/src/webview/` の下に、`src/webview/` からの相対パスと同じ場所に置く（設計書の `test_files` が `tests/` から始まるため。knowledge の規約『フォルダ構成』の対象の横に置く決まりから外れる）。DOM と React を使うテストは `*.browser.test.ts(x)` にし、Vitest のブラウザ（Chromium）で Testing Library と userEvent を使う（スクロールの位置と要素の高さを測るため jsdom は使わない）。MSW は公式の Vitest Browser Mode の構成で、`msw/browser` の `setupWorker(...handlers)` を `test.extend` のフィクスチャで `worker.start()`・`worker.resetHandlers()`・`worker.stop()` し、直下の `vitest.config.ts` の `unit-browser` のプロジェクトに `publicDir: ".storybook/public"` を指定して Storybook と同じ `mockServiceWorker.js` を配信する'
