  - name: useHostMessages
    title: 拡張機能のメッセージを受ける
    kind: フック
    container: vscode/src/webview/features/preview/panel/hooks/use-host-messages.ts
    usecase: 共通
    summary: '`window` の `message` を購読し、最新の処理（`useEffectEvent`）に `HostMessage` を渡す。後始末で購読を外す'
    scope: public
    args:
      - name: onMessage
        type: '(message: HostMessage) => void'
        required: true
        description: メッセージの処理
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_use_host_messages
        case: 正常
        summary: 描き直した後の処理にメッセージを渡し、外した後は渡さない
        condition: 処理 A で描き、処理 B で描き直して `message` を送り、`unmount` してもう一度送る
        mock: なし
        expected: B だけが 1 回呼ばれる
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
    status: planned
  - name: useLoadMdmark
    title: 配布物を読む
    kind: フック
    container: vscode/src/webview/features/preview/panel/hooks/use-load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: '`distJs` があれば配布物を読み、読めたら `onLoaded`、読めなければ理由を見分けて `onFailed`、`LOADING_DELAY_MS` 経ったら `onSlow` を呼ぶ'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ distJs: string | undefined; load: (url: string) => Promise<Mdmark>; onLoaded: (mdmark: Mdmark) => void; onFailed: (reason: "offline" | "versionMissing") => void; onSlow: () => void }'
        required: true
        description: 読む URL・読む関数・結果の処理
    returns:
      type: void
      description: '-'
    process: |-
      1. `distJs` が無ければ何もしない
      2. `LOADING_DELAY_MS` 後に `onSlow` を呼ぶタイマーを置く
      3. `load(distJs)` を呼ぶ
         - 解決した場合、`onLoaded`
         - reject した場合、理由を見分けて（読めない理由を見分ける）`onFailed`
      4. 後始末でタイマーを外し、外した後に届いた結果は捨てる
