title: VS Code 拡張機能 / Webview
lead: プレビューのパネルの中で動く React の画面と、配布物を読み込む前にも出す部品。jsDelivr の mdmark を読み込んで `mount`・`update` で描き、スクロール・リンク・状態の表示を担う。拡張機能とのメッセージの型も持つ。
directory: |-
  ```tree
  vscode/
  ├── vite.config.ts                     # Webview を media/preview.js・media/preview.css に書き込む Vite の設定
  ├── components.json                    # shadcn/ui の CLI の設定
  └── src/
      ├── messages.ts                    # 拡張機能 ⇄ Webview のメッセージの型（型だけ）
      └── webview/
          ├── main.tsx                   # 入口: 描く先を包む要素を読み込み、React の木を描く
          ├── app/
          │   └── app.tsx                # Error Boundary と画面
          ├── features/preview/panel/
          │   ├── panel-screen.tsx       # 画面: 状態の表示・帯・描く先の要素を並べ、メッセージ・読み込み・スクロール・リンクをつなぐ
          │   ├── panel-screen.stories.tsx
          │   ├── boot.ts                # 描く先を包む要素の data-* と保存した状態の読み取り
          │   ├── document-view.ts       # mdmark の mount・update・スクロールの位置・inspect・axe
          │   ├── load-mdmark.ts         # 配布物の import()・読み込めない理由の見分け・差分の色分けへの対応
          │   ├── diff-source.ts         # 差分の取り出し元
          │   ├── scroll.ts              # 元の行番号とスクロールの位置の内分
          │   ├── assets.ts              # 相対パスのアセットの差し替え・再生できない要素の通知
          │   └── hooks/
          │       ├── use-document-view.ts
          │       ├── use-host-messages.ts
          │       ├── use-load-mdmark.ts
          │       ├── use-scroll-sync.ts
          │       ├── use-link-clicks.ts
          │       └── use-media-errors.ts
          ├── shared/
          │   ├── adapters/
          │   │   └── vscode-api.ts      # acquireVsCodeApi を 1 回だけ呼び、送信と状態の読み込みと保存を指定する
          │   ├── components/
          │   │   ├── preview-status.tsx # プレビューの状態の表示
          │   │   ├── preview-status.stories.tsx
          │   │   ├── config-band.tsx    # 設定ファイルを読み込めない帯
          │   │   ├── config-band.stories.tsx
          │   │   └── ui/
          │   │       ├── alert.tsx      # shadcn/ui の Alert（warning の variant を追加）
          │   │       ├── button.tsx     # shadcn/ui の Button（default・outline）
          │   │       └── spinner.tsx    # shadcn/ui の Spinner
          │   ├── lib/
          │   │   ├── cn.ts              # class の結合（clsx + tailwind-merge）
          │   │   ├── media-error.ts     # 再生できない動画・音声の通知の HTML
          │   │   └── media-error.stories.ts
          │   └── styles/
          │       └── panel.css          # トークンの 3 ティア・@theme inline・Tailwind の theme と utilities
          └── testing/
              ├── fake-vscode-api.ts     # 送信したメッセージと状態を記録する acquireVsCodeApi の代役
              └── msw/
                  └── handlers.ts        # 読み込めなかった配布物の HEAD の応答（成功・404・ネットワークのエラー・遅延）
  ```

  `main.tsx` と `panel.css` は Vite が `vscode/media/preview.js`（ES モジュール 1 ファイル）と `vscode/media/preview.css` に書き込む。mdmark の配布物はまとめず、実行時に `import()` で読み込む。`vscode/media/` は丸ごと git の管理の外にする。
data_models:
  - name: HostMessage
    title: 拡張機能から Webview へのメッセージ
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: '`type` で見分ける判別付きの型'
    description: '`{ type: "render"; markdown: string; previous?: string; config: PreviewConfig; theme: "auto" | "light" | "dark"; includes?: Record<string, string>; aliases?: MdmarkAlias[] }`・`{ type: "scrollToLine"; line: number }`・`{ type: "configError"; path: string; line?: number; settingKey?: string }`・`{ type: "configOk" }`・`{ type: "theme"; href: string }`・`{ type: "assetsResolved"; id: number; urls: Record<string, string | null> }`・`{ type: "inspect"; id: number; selector: string; play?: boolean }`・`{ type: "axe"; id: number }`。`configError` は `line` と `settingKey` のどちらか一方を持つ。`inspect`・`axe` はテストのときだけ送信する'
    properties:
      - name: type
        type: '"render" | "scrollToLine" | "configError" | "configOk" | "theme" | "assetsResolved" | "inspect" | "axe"'
        description: メッセージの種類
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
      - dev/設計書/モジュール構成/VSCode拡張機能/設定.ts#data_models[PreviewConfig]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[動画・音声とアセットのルートの解決]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
    status: planned
  - name: WebviewMessage
    title: Webview から拡張機能へのメッセージ
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: '`type` で見分ける判別付きの型'
    description: '`{ type: "ready" }`・`{ type: "rendered" }`・`{ type: "loadFailed"; reason: "offline" | "versionMissing" | "diffUnsupported" }`・`{ type: "openLink"; href: string }`・`{ type: "revealLine"; line: number }`・`{ type: "reload" }`・`{ type: "openConfig" }`・`{ type: "resolveAssets"; id: number; paths: string[] }`・`{ type: "openAsset"; path: string }`・`{ type: "inspected"; id: number; elements: InspectedElement[] }`・`{ type: "axed"; id: number; violations: AxeViolation[] }`'
    properties:
      - name: type
        type: '"ready" | "rendered" | "loadFailed" | "openLink" | "revealLine" | "reload" | "openConfig" | "resolveAssets" | "openAsset" | "inspected" | "axed"'
        description: メッセージの種類
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[動画・音声とアセットのルートの解決]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[再生できない動画・音声]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
    status: planned
  - name: InspectedElement
    title: 調べた要素
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: 結合テストが Webview の DOM の期待値を確認するために返却する要素 1 つの様子
    properties:
      - name: tagName
        type: string
        description: 小文字のタグ名
      - name: className
        type: string
        description: '`class` の値'
      - name: attributes
        type: Record<string, string>
        description: 全ての属性
      - name: text
        type: string
        description: '`textContent`'
      - name: naturalWidth
        type: number | undefined
        description: '`img` のときだけ'
      - name: top
        type: number
        description: 見えている範囲の先頭からの位置（px。`getBoundingClientRect().top`）
      - name: height
        type: number
        description: 高さ（px）
      - name: currentTime
        type: number | undefined
        description: '`video`・`audio` のときだけ。`play` を受けたときは、`play()` から 1 秒後の値'
      - name: readyState
        type: number | undefined
        description: '`video`・`audio` のときだけ。要素の `readyState`（4 は再生に足りるデータを読み込めた）'
    status: planned
  - name: AxeViolation
    title: axe の違反
    container: vscode/src/messages.ts
    usecase: 共通
    role: DTO
    summary: 結合テストが受け取る axe-core の違反 1 件
    properties:
      - name: id
        type: string
        description: axe-core の規則の ID（`color-contrast` など）
      - name: impact
        type: string | null
        description: axe-core の影響度
      - name: targets
        type: string[]
        description: 違反した要素のセレクタ
    status: planned
  - name: PreviewBoot
    title: パネルの始め方
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: VSCodeでプレビューを開く
    summary: 拡張機能が HTML の描く先を包む要素（`#mdmark-preview`）の `data-*` に配置し、入口が読み込む値
    properties:
      - name: root
        type: HTMLElement
        description: 描く先を包む要素。React の木を描く場所で、配色の class を付ける
      - name: distJs
        type: string | undefined
        description: '`data-dist-js`。読み込む配布物の `index.js` の URL。バージョンを決められないときは持たない'
      - name: version
        type: string | undefined
        description: '`data-version`。読み込むバージョン（描けない理由に出す）'
      - name: status
        type: '"versionUndecidable" | undefined'
        description: '`data-status`。配布物を読み込まずに出す状態'
      - name: configPath
        type: string
        description: '`data-config-path`。`mdmark.configPath` の記載したままの値（帯に出す）'
      - name: test
        type: boolean
        description: '`data-test` を持つか。`inspect`・`axe` を受けるのは `true` のときだけ'
      - name: extensions
        type: string[]
        description: '`data-extensions`（JSON の配列）。重ねた設定の `extensions` の Webview で読み込める URL。無い・文字列の配列でないときは空'
    status: planned
  - name: PreviewState
    title: Webview の状態
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    role: DTO
    summary: '`acquireVsCodeApi().setState` で保存し、再作成した Webview が `getState` で読み込む値'
    properties:
      - name: line
        type: number
        description: 見えている先頭の元の行番号（0 始まり）。整数に切り捨てず、小数部で行の途中の割合を持つ
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#constraints[背面のパネル]
    status: planned
    introduced:
      pr: 243
  - name: VsCodeApi
    title: VS Code の Webview の API
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    role: アダプター
    summary: '`acquireVsCodeApi()` が返却する API のうち、Webview が使用するもの'
    properties:
      - name: postMessage
        type: '(message: WebviewMessage) => void'
        description: 拡張機能へ送信する
      - name: getState
        type: (() => unknown) | undefined
        description: 保存した状態を読み込む。持たない代役では行を戻さない
      - name: setState
        type: '((state: PreviewState) => void) | undefined'
        description: 状態を保存する。持たない代役では行を保存しない
    status: planned
  - name: Mdmark
    title: 読み込んだ配布物
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: 共通
    summary: '`import()` で読み込んだ mdmark の配布物のうち、Webview が使用するもの'
    properties:
      - name: mount
        type: '(element: HTMLElement, options: { markdown: string; config?: unknown; diffSource?: DiffSource; docId?: string; diffMode?: "blocks"; includes?: Record<string, string>; aliases?: unknown[] }) => MountHandle'
        description: 描く。`MountHandle` は `update(markdown, options?)`・`destroy()` を持つ
      - name: diffModes
        type: unknown
        description: 対応する差分の出し方。持たない前のバージョンもある
      - name: registerExtension
        type: '(extension: unknown) => void'
        description: 拡張を登録する。配布物を読み込んだ後、`mount` の前に呼ぶ
    status: planned
  - name: Anchor
    title: 行のマーカー
    container: vscode/src/webview/features/preview/panel/scroll.ts
    usecase: エディタとプレビューのスクロールを合わせる
    summary: '`data-source-line` を持つ要素の元の行番号と、文書の先頭からの位置'
    properties:
      - name: line
        type: number
        description: 元の行番号（0 始まり）
      - name: top
        type: number
        description: スクロールする要素の先頭からの位置（px）
      - name: collapsed
        type: boolean
        description: 閉じたセクションの見出しのとき `true`。この行より後で次のマーカーの行より前の行は、この見出しの位置に配置する。それ以外の要素は持たない
    status: planned
  - name: DiffTexts
    title: 差分の全文
    container: vscode/src/webview/features/preview/panel/diff-source.ts
    usecase: VS Code の差分ビューの変更をプレビューで確認する
    role: DTO
    summary: 差分のパネルで取り出し元が返却する、最後に受けた `render` の全文。書き換えられる入れ物
    properties:
      - name: modified
        type: string
        description: 変更後の全文（`render` の `markdown`）
      - name: original
        type: string
        description: 変更前の全文（`render` の `previous`）
    status: planned
    introduced:
      pr: 196
  - name: PreviewStatusProps
    title: プレビューの状態の表示の props
    container: vscode/src/webview/shared/components/preview-status.tsx
    usecase: VSCodeでプレビューを開く
    summary: 部品設計『プレビューの状態の表示』の引数とイベント
    properties:
      - name: state
        type: PreviewStatusState
        description: 出す状態
      - name: version
        type: string | undefined
        description: 読み込もうとした mdmark のバージョン
      - name: onReload
        type: () => void
        description: 「リロード」を押したとき
    status: planned
enums:
  - name: PreviewStatusState
    title: プレビューの状態
    container: vscode/src/webview/shared/components/preview-status.tsx
    usecase: VSCodeでプレビューを開く
    summary: プレビューの状態の表示が出す状態（文字列のリテラルの和）
    values:
      - value: loading
        title: 読み込み中
        description: 配布物を読み込み終えていない
      - value: offline
        title: 読み込めない
        description: 配布物を jsDelivr から読み込めない
      - value: versionMissing
        title: バージョンが無い
        description: 指定したバージョンが無い
      - value: versionUndecidable
        title: バージョンを決められない
        description: 読み込むバージョンを決められない
      - value: diffUnsupported
        title: 差分に対応しない
        description: 読み込んだ配布物が差分の表示に対応しない
      - value: unexpected
        title: 描画の失敗
        description: Webview の描画中に例外が出た（Error Boundary が受けた）
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
    status: planned
constants:
  - name: LOADING_DELAY_MS
    title: 読み込み中を出すまでの待ち
    container: vscode/src/webview/features/preview/panel/hooks/use-load-mdmark.ts
    summary: 配布物を読み込み始めてからこのミリ秒が経っても描けていなければ読み込み中を出す
    value: '1000'
    refs:
      - dev/設計書/画面設計/VSCodeのプレビュー.ts#elements[読み込み中の表示]
    status: planned
  - name: INSPECT_PLAY_MS
    title: 再生してから調べるまでの待ち
    container: vscode/src/webview/features/preview/panel/document-view.ts
    summary: '`inspect` の `play` で、`play()` を呼んでから調べるまで待つミリ秒'
    value: '1000'
    status: planned
  - name: DIFF_DOC_ID
    title: 差分の取り出し元の docId
    container: vscode/src/webview/features/preview/panel/diff-source.ts
    summary: 差分のパネルで `mount` に指定する `docId`
    value: '"diff"'
    status: planned
  - name: viteConfig
    title: Webview の Vite の設定
    container: vscode/vite.config.ts
    summary: '`export default defineConfig(...)` する設定'
    entries:
      - key: plugins
        value: '`@vitejs/plugin-react`・`@rolldown/plugin-babel` の `reactCompilerPreset`・`@tailwindcss/vite`'
      - key: build.lib
        value: '`entry: "src/webview/main.tsx"`・`formats: ["es"]`・`fileName: () => "preview.js"`・`cssFileName: "preview"`'
      - key: build.outDir
        value: '`media`（`emptyOutDir: false`。結合テストのビルドが `media/test/` に配置する axe を残す）'
      - key: build.rolldownOptions.output.codeSplitting
        value: '`false`（ES モジュール 1 ファイルにし、Webview のリソースの範囲の外へチャンクを読み込みに行かない）'
      - key: build.target
        value: '`es2022`'
      - key: build.assetsInlineLimit
        value: '`0`（CSS に `data:` を埋めず、CSP の `img-src` を広げない）'
      - key: resolve.alias
        value: '`@` → `src/webview`'
    refs:
      - dev/設計書/外部ライブラリ/vite#
      - dev/設計書/外部ライブラリ/react#
    status: planned
  - name: shadcnConfig
    title: shadcn/ui の CLI の設定
    container: vscode/components.json
    summary: '`npx shadcn add` が部品を記載する場所'
    entries:
      - key: style
        value: '`new-york`'
      - key: tsx
        value: '`true`'
      - key: tailwind.css
        value: '`src/webview/shared/styles/panel.css`'
      - key: tailwind.cssVariables
        value: '`true`'
      - key: aliases.ui
        value: '`@/shared/components/ui`'
      - key: aliases.utils
        value: '`@/shared/lib/cn`'
    refs:
      - dev/設計書/外部ライブラリ/shadcn-ui#
    status: planned
classes:
  - name: DocumentView
    title: 描いた文書
    container: vscode/src/webview/features/preview/panel/document-view.ts
    usecase: 共通
    role: 外部ライブラリとの同期
    summary: React の外の DOM として持つ描く先の要素に、mdmark の `mount`・`update` で文書を描き、スクロールの位置と配色の class を持つ
    description: '`type` で定義し、`createDocumentView` が作る。プロパティは関数の中に閉じた状態で、外から読み込まない。React の state を持たず、画面の hook とメッセージの処理から呼ばれる。描く先の要素の子は mdmark だけが書き換える'
    kind: インタフェース
    properties:
      - name: root
        type: HTMLElement
        access: private
        description: 描く先を包む要素（`#mdmark-preview`）。配色の class を付ける
      - name: element
        type: HTMLElement | undefined
        access: private
        description: 描く先の要素。`attach` で受け、`detach` で削除する
      - name: mdmark
        type: Mdmark | undefined
        access: private
        description: '`import()` で読み込んだ配布物。`useMdmark` で受ける'
      - name: handle
        type: MountHandle | undefined
        access: private
        description: 今の描画。初回の `render` までは `undefined`
      - name: configKey
        type: string | undefined
        access: private
        description: 今の描画に指定した `config` と `aliases` の組の `JSON.stringify`（前と同じかの比較に使用する）
      - name: pendingScrollTop
        type: number | undefined
        access: private
        description: '`scrollToLine` で動かした `scrollTop`。次の `scroll` の通知でその値なら `revealLine` を送信せずに削除する'
      - name: diffTexts
        type: DiffTexts | undefined
        access: private
        description: 差分のパネルで取り出し元に指定した全文。`previous` を持つ `render` を初めて受けたときに作る
      - name: savedLine
        type: number | undefined
        access: private
        description: 再作成した Webview が起動したときに `getState` で読み込んだ行。最初の `render` でその行へ戻したら削除する
    methods:
      - name: attach
        title: 描く先の要素を受ける
        kind: メソッド
        summary: React が描いた描く先の要素を受ける（ref のコールバックが呼ぶ）
        args:
          - name: element
            type: HTMLElement
            required: true
            description: 描く先の要素
        returns:
          type: void
          description: '-'
      - name: detach
        title: 描く先の要素を削除する
        kind: メソッド
        summary: '`handle?.destroy()` を呼び、描く先の要素と描画を削除する（ref のコールバックの後始末が呼ぶ）'
        returns:
          type: void
          description: '-'
        unit_tests:
          - name: test_detach
            case: 正常
            summary: 削除すると描画を destroy し、次の render で もう一度 mount する
            condition: '`render` の後に `detach`、`attach` で同じ要素を受けて同じ設定の `render`'
            mock: mdmark を `mount` と戻り値の `destroy` を記録する代役にする
            expected: '`destroy` が 1 回、`mount` が 2 回'
      - name: useMdmark
        title: 配布物を受ける
        kind: メソッド
        summary: '`import()` で読み込み終えた配布物を後から受ける'
        args:
          - name: mdmark
            type: Mdmark
            required: true
            description: 読み込み終えた配布物
        returns:
          type: void
          description: '-'
      - name: supportsDiff
        title: 差分の色分けに対応するかを返却する
        kind: メソッド
        summary: 受けた配布物が差分の色分けに対応するかを返却する。配布物を受ける前は `true`
        returns:
          type: boolean
          description: 対応すれば true
        callees:
          - '#functions[supportsDiffBlocks]'
      - name: render
        title: 描く
        kind: メソッド
        summary: '`render` を受けて文書を描く。初回と `config` か `aliases` が変わったときは `mount`（前の描画は `destroy`）、それ以外は `update`'
        args:
          - name: message
            type: 'Extract<HostMessage, { type: "render" }>'
            required: true
            description: 全文・設定・配色・取り込む文書の表
        returns:
          type: void
          description: '-'
        process: |-
          1. `theme` が `light`・`dark` なら `root` に class `mdmark-theme-light`・`mdmark-theme-dark` を付け、`auto` なら両方を削除する
          2. 再描画する前の `scrollTop` を記録する
          3. `previous` を持つときは、`diffTexts` が無ければ作り、`modified` を `markdown`、`original` を `previous` に書き換える
          4. `configKey` が同じで `handle` があれば `handle.update(markdown)`（`includes` を持てば `{ includes }` も指定する）、違えば `handle?.destroy()` の後に描く先の要素へ `mount(element, { markdown, config, includes, aliases })`（`aliases` は持つときだけ指定する）。`diffTexts` があるときは `diffSource: createDiffSource(diffTexts)`・`docId: DIFF_DOC_ID`・`diffMode: "blocks"` も指定する
          5. `savedLine` があれば `scrollToLine(savedLine)` で配置して `savedLine` を削除し（`pendingScrollTop` に覚えるため `revealLine` は送信しない）、無ければ記録した `scrollTop` に戻す
          6. `savedLine` で配置したときは、次の `requestAnimationFrame` で `scrollTop` が配置した値から動いていなければ、もう一度 `scrollToLine` でもう一度配置する（差分のパネルは描いた後に色分けで再描画し、行より上の高さが変わる）
        exceptions:
          - name: Error
            condition: 配布物か描く先の要素を受ける前に呼ばれた
            message: '`mdmark の配布物を読み込む前に render を受けた`'
        unit_tests:
          - name: test_render
            case: 正常
            summary: 初回は mount、同じ設定の次の回は update
            condition: '`config` が `{}` の `render` を 2 回'
            mock: mdmark を `mount` と戻り値の `update`・`destroy` を記録する代役にする
            expected: '`mount` が 1 回、2 回目は `update` が 2 回目の `markdown` で 1 回、`destroy` は呼ばれない'
          - name: test_render_when_config_changed
            case: 正常
            summary: 設定が変わったら destroy してから もう一度 mount し、スクロールの位置を保つ
            condition: '`config` が `{}` の `render` の後、`scrollTop` を 200 にして `config` が `{ features: { callout: false } }` の `render`'
            mock: mdmark を代役にする
            expected: '`destroy` の後に `mount` が新しい `config` で呼ばれ、`scrollTop` が 200'
          - name: test_render_when_aliases_changed
            case: 正常
            summary: aliases が変わったら destroy してから もう一度 mount し、mount に aliases を指定する
            condition: '`aliases` を持たない `render` の後、同じ `config` で `aliases` に用語 1 件を持つ `render`'
            mock: mdmark を `mount` に指定された引数と `update`・`destroy` を記録する代役にする
            expected: '1 回目の `mount` に `aliases` が渡らず、2 回目は `destroy` の後に `mount` が `aliases` の 1 件で呼ばれ、`update` は呼ばれない'
          - name: test_render_when_theme
            case: 正常
            summary: 配色を固定するときだけ包む要素に class を付ける
            condition: '`theme` が `dark`、続けて `auto`'
            mock: mdmark を代役にする
            expected: 1 回目の後は `root` が `mdmark-theme-dark` を持ち、2 回目の後は `mdmark-theme-*` を持たない
          - name: test_render_when_diff
            case: 正常
            summary: previous を持つ render では取り出し元を指定して blocks で描き、次の render では取り出し元の全文を書き換えてから update する
            condition: '`markdown` が `A2`・`previous` が `A1` の `render` の後、`markdown` が `A3` の `render`（`config` は同じ）'
            mock: mdmark を `mount` に指定された引数と `update` を記録する代役にする
            expected: '`mount` に `docId: "diff"`・`diffMode: "blocks"` と `diffSource` が渡る。`diffSource.revisions("diff")` が `modified`・`original` の順。`update` が `A3` で呼ばれた時点で `content` の `modified` が `A3`、`original` が `A1`'
          - name: test_render_when_saved_line
            case: 正常
            summary: 保存した行を持つ view は、最初の render の後だけその行へ戻し、自分が発生させたスクロールとして捨てる
            condition: '`data-source-line` を持つ見出しを並べた長い文書を描く代役で、`savedLine` が 20 の view を作り `render`、続けて `takeScroll()`。その後 `scrollTop` を 100 にして同じ設定の `render`'
            mock: mdmark を `markdown` の見出しを `data-source-line` つきで描く代役にする
            expected: 1 回目の後の `scrollTop` が `scrollToLine(20)` で配置する位置と同じで、`takeScroll()` が `undefined`。2 回目の後の `scrollTop` が 100
          - name: test_render_when_not_loaded
            case: 異常
            summary: 配布物を受ける前は描かない
            condition: '`useMdmark` を呼ばずに `render`'
            mock: なし
            expected: '`Error`'
            exception: 配布物か描く先の要素を受ける前に呼ばれた
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#constraints[設定が変わったときの描き方]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#constraints[背面のパネル]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[配色]
        callees:
          - '#functions[createDiffSource]'
      - name: scrollToLine
        title: 行まで動かす
        kind: メソッド
        summary: 元の行番号の位置を先頭（上端の帯があればその下端）に配置する。動かす `scrollTop` が今の値と違うときだけ動かし、`pendingScrollTop` に覚える
        args:
          - name: line
            type: number
            required: true
            description: 元の行番号（0 始まり）
        returns:
          type: void
          description: '-'
        process: |-
          1. 元の行番号の位置から上端の帯の高さ（`topInset`）を参照した値を `scrollTop` にする
          2. 狭い幅で右側の目次の帯が上端に留まると帯の下端が変わるため、動かした後の `topInset` で 1 をもう一度行う
          3. `scrollTop` が動かす前と違えば、`pendingScrollTop` に覚える
        callees:
          - '#functions[collectAnchors]'
          - '#functions[topForLine]'
          - '#functions[topInset]'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/スクロールを合わせる.ts#constraints[往復の止め方]
      - name: takeScroll
        title: スクロールを行にする
        kind: メソッド
        summary: '`scroll` の通知を受け、自分が発生させたスクロールなら `undefined`、そうでなければ見えている先頭の元の行番号を返却する'
        returns:
          type: number | undefined
          description: '`revealLine` で送信する行'
        process: |-
          1. `scrollTop` が `pendingScrollTop` と等しければ、`pendingScrollTop` を削除して `undefined` を返却する
          2. `pendingScrollTop` を削除し、`currentLine()` を返却する
        unit_tests:
          - name: test_take_scroll_when_own_scroll
            case: 正常
            summary: 自分が動かしたスクロールの通知だけを捨てる
            condition: '`scrollToLine(20)` の後に `takeScroll()`、続けて `scrollTop` を別の値にして `takeScroll()`'
            mock: なし
            expected: 1 回目は `undefined`、2 回目はその位置の行
        callees:
          - '#functions[collectAnchors]'
          - '#functions[lineForTop]'
          - '#functions[topInset]'
      - name: currentLine
        title: 先頭の行を返却する
        kind: メソッド
        summary: 見えている先頭の位置（上端の帯があればその下端）を元の行番号にして返却する。描く前は `undefined`
        returns:
          type: number | undefined
          description: '`revealLine` で送信する行'
        process: |-
          1. `handle` が無ければ `undefined` を返却する
          2. 今の `scrollTop` に上端の帯の高さ（`topInset`）を追加した位置を行にして返却する（行のマーカーを集める、位置を行にする）
        unit_tests:
          - name: test_current_line
            case: 正常
            summary: 描く前は行を返却せず、描いた後は先頭の行を返却する
            condition: '`render` の前に `currentLine()`、`render` の後に `scrollToLine(20)` して `currentLine()`'
            mock: mdmark を `data-source-line` つきの見出しを描く代役にする
            expected: 1 回目は `undefined`、2 回目は 20
        callees:
          - '#functions[collectAnchors]'
          - '#functions[lineForTop]'
          - '#functions[topInset]'
      - name: currentPosition
        title: 先頭の位置を返却する
        kind: メソッド
        summary: 見えている先頭の位置（上端の帯があればその下端）を、整数に切り捨てない元の行番号にして返却する。描く前は `undefined`
        returns:
          type: number | undefined
          description: '`setState` で保存する位置'
        process: |-
          1. `handle` が無ければ `undefined` を返却する
          2. 今の `scrollTop` に上端の帯の高さ（`topInset`）を追加した位置を、切り捨てない行にして返却する（行のマーカーを集める、位置を切り捨てない行にする）
        unit_tests:
          - name: test_current_position
            case: 正常
            summary: 描く前は位置を返却せず、描いた後は行の途中の位置を切り捨てずに返却する
            condition: '`render` の前に `currentPosition()`、`render` の後に `scrollToLine(20.5)` して `currentPosition()` と `currentLine()`'
            mock: mdmark を `data-source-line` つきの見出しを描く代役にする
            expected: 1 回目は `undefined`、2 回目は 20.5 との差が 0.05 未満、`currentLine()` は 20
        callees:
          - '#functions[collectAnchors]'
          - '#functions[fractionalLineForTop]'
          - '#functions[topInset]'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを再描画する.ts#constraints[背面のパネル]
      - name: inspect
        title: 要素を調べる
        kind: メソッド
        summary: '`selector` に該当する要素ごとの `InspectedElement` を返却する（テストのときだけ呼ばれる）。`play` のときは、該当した `video`・`audio` を `muted` にして `play()` を呼び、`INSPECT_PLAY_MS` 待ってから調べる（`play()` が拒まれた要素もそのまま調べる）'
        is_async: true
        args:
          - name: selector
            type: string
            required: true
            description: CSS セレクタ（`document` 全体に適用する）
          - name: play
            type: boolean
            required: false
            default: 'false'
            description: 該当した動画・音声を再生してから調べるか
        returns:
          type: Promise<InspectedElement[]>
          description: 該当した要素の並び
        unit_tests:
          - name: test_inspect
            case: 正常
            summary: 属性・文字・画像の幅・位置を返却する
            condition: '`<h1 id="a" class="x">タイトル</h1>` と読み込み終えた `<img alt="図">` を配置し、`h1, img` で調べる'
            mock: なし
            expected: '`h1` は `className` が `x`・`attributes.id` が `a`・`text` が `タイトル`・`naturalWidth` が無い。`img` は `naturalWidth` が画像の幅。どちらも `top`・`height` が数'
          - name: test_inspect_when_play
            case: 正常
            summary: 動画を再生してから調べる
            condition: '再生できる短い `webm` の `<video>` を配置し、`video` と `play: true` で調べる'
            mock: なし
            expected: '`currentTime` が 0.5 以上'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#flows[正常系（相対パスとアセットのルートの動画・音声）]
      - name: audit
        title: axe で検査する
        kind: メソッド
        summary: 結合テストのビルドが配置した `media/test/axe.js` を、`preview.js` と同じ場所の Webview の URL から `import()` で読み込み、`root` に `axe.run` を実行して違反を返却する（テストのときだけ呼ばれる）
        is_async: true
        returns:
          type: Promise<AxeViolation[]>
          description: 違反の並び。無ければ空
        process: |-
          1. `document` の `script[src$='preview.js']` の `src` の `preview.js` を `test/axe.js` に替えた URL を `import()` で読み込む（UMD のため `window.axe` に入る）
          2. `window.axe.run({ include: [root], exclude: [element] })` の `violations` を、`id`・`impact`・`nodes[].target` を連ねたセレクタの `targets` にして返却する。描く先の要素（mdmark が描いた文書）は検査の範囲に入れず、パネルの部品（状態の表示・帯）だけを検査する（文書のアクセシビリティはライブラリ本体のテストが受け持ち、PoC で出た `label-content-name-mismatch` はライブラリ本体の問題として切り出す）
        exceptions:
          - name: Error
            condition: '`preview.js` の `script` が無い'
            message: '`preview.js の script が無い`'
        unit_tests:
          - name: test_audit
            case: 正常
            summary: axe の違反を ID・影響度・セレクタにして返却する
            condition: '`src` が `…/preview.js` の `script` を配置し、`…/test/axe.js` を `window.axe.run` が違反 1 件（`color-contrast`・`serious`・`[["#a"]]`）を返却する代役のモジュールにする'
            mock: '`axe.js` を代役のモジュールにする'
            expected: '`[{ id: "color-contrast", impact: "serious", targets: ["#a"] }]`。`run` に `include: [root]`・`exclude: [描く先の要素]` が渡る'
        refs:
          - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[テストのときの差し替え]
          - dev/設計書/外部ライブラリ/axe-core#
    status: planned
    implementations:
      - target: '#functions[createDocumentView]'
        notes: クロージャに状態を持つオブジェクトを返却する（knowledge の規約『TypeScript のスタイル』の関数ベースで記載する決まりに合わせ、クラスにしない）
components:
  - name: App
    title: Webview のアプリ
    container: vscode/src/webview/app/app.tsx
    usecase: 共通
    summary: 画面を `react-error-boundary` の `ErrorBoundary` で包む
    description: '描画中の例外は `fallbackRender` で `PreviewStatus`（`state: "unexpected"`）を出し、`onError` で `console.error` に例外を出す。「リロード」は `reload` を送信し、拡張機能が HTML をもう一度入れる（`resetErrorBoundary` の代わり）'
    kind: コンポーネント
    props:
      - name: boot
        type: PreviewBoot
        required: true
        description: パネルの始め方
      - name: api
        type: VsCodeApi
        required: true
        description: VS Code の Webview の API
      - name: savedLine
        type: number | undefined
        required: false
        description: 保存した行
    unit_tests:
      - name: test_app_when_render_error
        case: 異常
        summary: 画面の描画で例外が出たら、描画の失敗とリロードを出す
        condition: '`PanelScreen` を例外を投げる代役にして描き、「リロード」を押す'
        mock: '`PanelScreen` を代役にする。`api` を `postMessage` を記録する代役にする'
        expected: タイトル「プレビューを表示できません」と描画の失敗の文言があり、`reload` が 1 回送られる
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
    status: planned
  - name: PanelScreen
    title: プレビューのパネル
    container: vscode/src/webview/features/preview/panel/panel-screen.tsx
    usecase: 共通
    summary: 画面設計『VSCodeのプレビュー』の要素を並べ、配布物の読み込み・拡張機能のメッセージ・スクロール・リンクを hook でつなぐ
    description: |-
      描く順は 状態の表示（`status` があるとき）→ 帯（`configError` があるとき）→ 描く先の要素（`status` があるときは `hidden`）。描く先の要素は子を持たない `div` で、中身は `DocumentView` が mdmark で描く。配布物を読み込んだ後、`boot.extensions` を登録してから（拡張を登録する）`ready` を送信する。メッセージは `type` ごとに次のとおり処理する（`settled`・`assetsId` は ref に持つ）

      - `render`: `previous` を持ち `view.supportsDiff()` が false なら、描かずに `status` を `diffUnsupported` にして `loadFailed`（`diffUnsupported`）を送信する。それ以外は `view.render` の後に `status` を削除して `rendered` を送信し、`currentPosition()` が数なら `setState({ line })` で保存する。`collectAssetPaths` が 1 つ以上返せば `assetsId` を増やして `resolveAssets` を送信する
      - `assetsResolved`: `id` が `assetsId` と同じときだけ `applyAssetUrls` を呼ぶ
      - `scrollToLine`: `view.scrollToLine`
      - `configError`・`configOk`: `configError` を受けた `path`・`line`・`settingKey` にする・削除する
      - `theme`: `#mdmark-theme` の `link` の `href` を替える（再描画しない）
      - `inspect`・`axe`: `boot.test` のときだけ `view.inspect`・`view.audit` の結果を `inspected`・`axed` で同じ `id` で送信する
      - `boot.test` のときだけ、描き始める前から `document` の `securitypolicyviolation` を数え、`document.documentElement` の `data-mdmark-csp-violations` に件数（最初は `0`）を記載する（結合テストが `inspect` で読み込む）
      - 上の `type` 以外: 処理しない（`window` の `message` には、MSW の Service Worker など拡張機能以外が送信するものも届く）

      メッセージの処理と配布物の読み込みの結果の処理で投げた例外（`view.render` の例外など）は、state に入れて次の描画で投げ、`App` の Error Boundary に描画の失敗（`unexpected`）を出させる（`useErrorBoundary` は Error Boundary の外で描くと例外を投げ、画面を単独で描く単体テストとストーリーで使用できない）
    kind: 画面
    props:
      - name: boot
        type: PreviewBoot
        required: true
        description: パネルの始め方
      - name: api
        type: VsCodeApi
        required: true
        description: VS Code の Webview の API
      - name: savedLine
        type: number | undefined
        required: false
        description: 保存した行。最初の `render` でその行へ戻す
      - name: load
        type: '(url: string) => Promise<Mdmark>'
        required: false
        default: '`loadMdmark`'
        description: 配布物を読み込む関数。ストーリーと単体テストが代役を指定する
      - name: importModule
        type: '(url: string) => Promise<{ default?: unknown }>'
        required: false
        default: '`import(/* @vite-ignore */ url)`'
        description: 拡張を読み込む関数（拡張を登録するに指定する）。単体テストが代役を指定する
    state:
      - name: status
        type: '{ state: PreviewStatusState; version?: string } | undefined'
        initial: '`boot.status` が `versionUndecidable` か `boot.distJs` が無いとき `{ state: "versionUndecidable" }`、それ以外は `undefined`'
        description: 文書の代わりに出す状態の表示
        notes: '`useState`'
      - name: configError
        type: '{ path: string; line?: number; settingKey?: string } | undefined'
        initial: '`undefined`'
        description: 帯に出す読み込めない設定ファイル。あるときだけ帯を出す
        notes: '`useState`'
    unit_tests:
      - name: test_panel_screen_when_rendered
        case: 正常
        summary: 配布物を読み込み終えたら ready を送信し、render で描いて rendered を送信する
        condition: 代役の `load` を指定して描き、`ready` を待って `render` を送信する
        mock: '`api` を送信したメッセージと状態を記録する代役にする。`load` を mdmark の代役を返却する関数にする'
        expected: '`ready`・`rendered` の順に送信され、描く先の要素に代役が描いた本文がある。状態の表示が無い'
      - name: test_panel_screen_when_slow
        case: 正常
        summary: 1 秒経っても描けていなければ読み込み中を出し、render で削除する
        condition: 解決しない `load` を指定して描き、フェイクタイマーで `LOADING_DELAY_MS` 進める。続けて `load` を解決して `render` を送信する
        mock: '`api` を代役にする。`load` を後から解決できる代役にする。タイマーをフェイクにする'
        expected: 進めた後にタイトル「mdmark を読み込んでいます」がある。`render` の後に無い
      - name: test_panel_screen_when_load_failed
        case: 異常
        summary: 配布物を読み込めなければ理由とバージョンを出し、loadFailed を送信する
        condition: '`data-version="v0.7.0"` の `boot` と reject する `load` を指定し、MSW で HEAD をネットワークのエラーにする'
        mock: '`api` を代役にする。`load` を reject する代役にする。MSW の `offline` のハンドラ'
        expected: '`loadFailed`（`offline`）が送信され、状態の表示に `v0.7.0` と `data-action="reload"` のボタンがある。読み込み中は出ない'
      - name: test_panel_screen_when_version_undecidable
        case: 正常
        summary: バージョンを決められないときは配布物を読み込まずに理由を出す
        condition: '`status` が `versionUndecidable` の `boot` で描く'
        mock: '`api` を代役にする。`load` を呼ばれたかを記録する代役にする'
        expected: '`load` が呼ばれず、`ready` が送信されない。状態の表示にバージョンを決められない文言がある'
      - name: test_panel_screen_when_diff_unsupported
        case: 異常
        summary: 差分に対応しない配布物で previous つきの render を受けると、描かずに理由を出す
        condition: '`data-version="v0.8.0"` の `boot` で、`diffModes` を持たない配布物を読み込んだ後に `previous` つきの `render` を送信する'
        mock: '`api` を代役にする。`load` を `mount` だけを持つ代役を返却する関数にする'
        expected: '`mount` が呼ばれず、`loadFailed`（`diffUnsupported`）が送信され `rendered` は送信されない。状態の表示に `v0.8.0` と `data-action="reload"` のボタンがある'
      - name: test_panel_screen_when_reload_clicked
        case: 正常
        summary: 「リロード」で reload を送信する
        condition: 読み込めない状態で「リロード」を userEvent で押す
        mock: '`api` を代役にする'
        expected: '`reload` が 1 回送られる'
      - name: test_panel_screen_when_config_error
        case: 正常
        summary: configError で帯を文書の前に 1 つだけ出し、configOk で削除する
        condition: '描いた後に `configError`（`path: "mdmark.config.yaml"`・`line: 4`）、`configError`（`path: "~/.config/mdmark/settings.yaml"`・`settingKey: "features.callout"`）、`configOk` の順に送信し、2 回目の後に「設定ファイルを開く」を押す'
        mock: '`api` を代役にする'
        expected: 1 回目の後は帯に `mdmark.config.yaml` と `4 行目`、2 回目の後は帯が 1 つで `~/.config/mdmark/settings.yaml` と `features.callout` を出し、描く先の要素より前にある。`openConfig` が送信される。`configOk` の後は帯が無い
      - name: test_panel_screen_when_state_saved
        case: 正常
        summary: 保存した行の途中の位置を持つ状態で始めると、最初の render の後にその位置へ戻してから保存し、revealLine を送信しない
        condition: '`savedLine` を 20.5 で描き、見出しを `data-source-line` つきで並べた長い文書の `render` を送信し、次のフレームまで待つ'
        mock: '`api` を `postMessage`・`setState` を記録する代役にする。mdmark を代役にする'
        expected: '`setState` が最初に呼ばれた引数の `line` が 20.5 との差が 0.05 未満で、`{ line: 0 }`・`{ line: 20 }` では呼ばれない。`revealLine` が送信されない'
      - name: test_panel_screen_when_assets
        case: 正常
        summary: 描いた後に相対パスを問い合わせ、返った URL に替える
        condition: '`![操作](m/demo.mp4)` を描く代役の `render` を送信し、送信された `id` で `assetsResolved` を返却する'
        mock: '`api` を代役にする。mdmark を代役にする'
        expected: '`resolveAssets` が `paths: ["m/demo.mp4"]` で送信され、`video` の `src` が返却した URL'
      - name: test_panel_screen_when_inspect
        case: 正常
        summary: テストのときだけ inspect と axe に回答する
        condition: '`test` が `true` と `false` の `boot` で、それぞれ `inspect` を送信する'
        mock: '`api` を代役にする'
        expected: '`true` のときだけ同じ `id` の `inspected` が送信される'
      - name: test_panel_screen_when_csp_violation
        case: 正常
        summary: テストのときだけ CSP の違反の件数を html 要素に記載する
        condition: '`test` が `true` と `false` の `boot` で描き、それぞれ `document` に `securitypolicyviolation` を 2 回送る'
        mock: '`api` を代役にする'
        expected: '`true` のときだけ `document.documentElement` の `data-mdmark-csp-violations` が `2`（描いた直後は `0`）。`false` のときは属性を持たない'
      - name: test_panel_screen_when_unknown_message
        case: 正常
        summary: 拡張機能のメッセージでない `message` を処理しない
        condition: '`App` で描いて `ready` を待った後、`{ type: "msw/worker:stop" }` と、`type` を持たない値を送信し、続けて `render` を送信する'
        mock: '`api` を代役にする'
        expected: 状態の表示が出ず、`render` の後に `rendered` が 1 回送られる
      - name: test_panel_screen_when_handler_throws
        case: 異常
        summary: メッセージの処理で投げた例外を Error Boundary へ指定する
        condition: '`App` で描き、`mount` が例外を投げる代役の配布物を読み込んだ後に `render` を送信する'
        mock: '`api` を代役にする。`load` を `mount` が例外を投げる代役を返却する関数にする'
        expected: 状態の表示に描画の失敗の文言と `data-action="reload"` のボタンがあり、`rendered` が送信されない
      - name: test_panel_screen_when_extensions
        case: 正常
        summary: 配布物を読み込んだ後、extensions を登録してから ready を送信する
        condition: '`extensions` が `["a.js", "b.js"]` の `boot` と、`a.js` だけ reject する拡張を読み込む関数を指定して描く'
        mock: '`api` を代役にする。`load` を `registerExtension` を記録する mdmark の代役を返却する関数にする。拡張を読み込む関数を代役にする'
        expected: '`registerExtension` が `b.js` の `default` で 1 回だけ呼ばれ、その後に `ready` が送信される'
      - name: test_panel_screen_when_theme
        case: 正常
        summary: theme で theme の CSS の link の href を替える
        condition: '`<link id="mdmark-theme" href="t.css">` を配置したページで描き、`{ type: "theme", href: "t.css?v=1" }` を送信する'
        mock: '`api` を代役にする'
        expected: '`#mdmark-theme` の `href` が `t.css?v=1` で、`render` を受けずに描いた文書がそのまま'
    refs:
      - dev/設計書/画面設計/VSCodeのプレビュー.ts#
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[Webview とのメッセージ]
    status: planned
  - name: PreviewStatus
    title: プレビューの状態の表示
    container: vscode/src/webview/shared/components/preview-status.tsx
    usecase: VSCodeでプレビューを開く
    summary: 部品設計の引数どおりに、読み込み中（Spinner とタイトル）か、描けない理由（Alert の warning・タイトル・理由・「リロード」）を描く
    description: 外側は class `mdmark-preview-status`、読み込み中は `mdmark-preview-loading`、描けない理由の Alert は `mdmark-preview-notice` を持ち（結合テストが探すマーカー。外観は Tailwind のクラス）、「リロード」は `data-action="reload"` を持つ。理由の文言は状態ごとの関数で組み、`version` は `code` に入れる
    kind: コンポーネント
    props:
      - name: state
        type: PreviewStatusState
        required: true
        description: 出す状態
      - name: version
        type: string
        required: false
        description: 読み込もうとした mdmark のバージョン
      - name: onReload
        type: () => void
        required: true
        description: 「リロード」を押したとき
    unit_tests:
      - name: test_preview_status
        case: 正常
        summary: 指定したバージョンが無い理由とリロードを出し、バージョンを文字のまま出す
        condition: '`state` が `versionMissing`、`version` が `v9.9.9<b>`'
        mock: なし
        expected: '`role="status"` の要素に `h1` のタイトル「プレビューを表示できません」、`code` の文字が `v9.9.9<b>`（要素にならない）、`data-action="reload"` の `button`'
      - name: test_preview_status_when_loading
        case: 正常
        summary: 読み込み中はタイトルと Spinner だけ
        condition: '`state` が `loading`'
        mock: なし
        expected: タイトル「mdmark を読み込んでいます」と `role="img"`・`aria-label="読み込み中"` の `svg` があり、`button` が無い
      - name: test_preview_status_when_diff_unsupported
        case: 正常
        summary: 差分に対応しないバージョンの理由とリロードを出す
        condition: '`state` が `diffUnsupported`、`version` が `v0.8.0`'
        mock: なし
        expected: 部品設計の状態 `DiffUnsupported` の文言（`v0.8.0` と `mdmark.version` の `code`）と `button`
      - name: test_preview_status_when_unexpected
        case: 正常
        summary: 描画の失敗の理由とリロードを出す
        condition: '`state` が `unexpected`'
        mock: なし
        expected: 部品設計の状態 `Unexpected` の文言と `button`
      - name: test_preview_status_when_reload_clicked
        case: 正常
        summary: リロードを押すと onReload を呼ぶ
        condition: '`state` が `offline` で「リロード」を userEvent で押す'
        mock: '`onReload` を記録する関数にする'
        expected: '`onReload` が 1 回呼ばれる'
    refs:
      - dev/設計書/部品設計/プレビューの状態の表示.ts#
    status: planned
  - name: ConfigBand
    title: 設定ファイルを読み込めない帯
    container: vscode/src/webview/shared/components/config-band.tsx
    usecase: 記載した内容をプレビューに映す
    summary: 部品設計の引数どおりに、Alert の warning の帯と「設定ファイルを開く」（Button の outline）を描く。YAML として読み込めないときは行、設定の構造に合わないときはキーを出す
    description: 幅の基準の枠は class `mdmark-config-band-frame`（`@container`）、帯は `mdmark-config-band` を持ち、ボタンは `data-action="openConfig"` を持つ。帯の幅が 30rem 以上でボタンを文の右に配置する
    kind: コンポーネント
    props:
      - name: path
        type: string
        required: true
        description: 読み込めない設定ファイルのパス（設定ファイルのパスを表示の構造にしたもの）
      - name: line
        type: number
        required: false
        description: YAML として読み込めない行（1 始まり）。`settingKey` とどちらか一方だけを指定する
      - name: settingKey
        type: string
        required: false
        description: 設定の構造に合わない最初のキー。`line` とどちらか一方だけを指定する
      - name: onOpenConfig
        type: () => void
        required: true
        description: 「設定ファイルを開く」を押したとき
    unit_tests:
      - name: test_config_band
        case: 正常
        summary: タイトル・パス・行とボタンを出し、パスを文字のまま出す
        condition: '`path` が `a<b>.yaml`、`line` が 4'
        mock: なし
        expected: '`role="status"` の要素に `h2` のタイトル「設定ファイルを読み込めません」、`code` の文字が `a<b>.yaml`、本文に `4 行目を YAML として読み込めないため` と `この設定ファイルを重ねずに表示しています`、`data-action="openConfig"` の `button`'
      - name: test_config_band_when_clicked
        case: 正常
        summary: 設定ファイルを開くを押すと onOpenConfig を呼ぶ
        condition: 「設定ファイルを開く」を userEvent で押す
        mock: '`onOpenConfig` を記録する関数にする'
        expected: '`onOpenConfig` が 1 回呼ばれる'
      - name: test_config_band_when_setting_key
        case: 正常
        summary: 構造に合わないときはキーを出す
        condition: '`path` が `~/.config/mdmark/settings.yaml`、`settingKey` が `features.callout`'
        mock: なし
        expected: '`code` の文字が `~/.config/mdmark/settings.yaml` と `features.callout`、本文に `が設定の構造に合わないため` があり、`行目` が無い'
    refs:
      - dev/設計書/部品設計/設定ファイルを読み込めない帯.ts#
