    kind: コンポーネント
    status: planned
functions:
  - name: startPreview
    title: パネルを始める
    kind: 関数
    container: vscode/src/webview/main.tsx
    usecase: VSCodeでプレビューを開く
    summary: Webview の入口。描く先を包む要素から始め方と保存した状態を読み込み、その要素に React の木（`App`）を描く。描く先を包む要素が無いページでは何もしない
    description: ファイルの末尾で呼ぶ
    scope: public
    process: |-
      1. `#mdmark-preview` が無ければ終わる
      2. 始め方を読み込み（始め方を読み込む）、`getVsCodeApi()` の `getState?.()` から保存した行を読み込む（保存した行を読み込む）
      3. `createRoot(#mdmark-preview).render(<App boot api savedLine />)`
    callees:
      - '#functions[readBoot]'
      - '#functions[savedLineFrom]'
      - '#functions[getVsCodeApi]'
      - '#components[App]'
    unit_tests:
      - name: test_start_preview_when_no_root
        case: 正常
        summary: 描く先を包む要素が無いページでは描かない
        condition: '`#mdmark-preview` の無いページで呼ぶ'
        mock: '`acquireVsCodeApi` を呼ばれたかを記録する代役にする'
        expected: 例外を投げず、`acquireVsCodeApi` が呼ばれない
    status: planned
  - name: readBoot
    title: 始め方を読み込む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: VSCodeでプレビューを開く
    summary: 描く先を包む要素の `data-*` から `PreviewBoot` を読み込む
    scope: public
    args:
      - name: root
        type: HTMLElement
        required: true
        description: '`#mdmark-preview`'
    returns:
      type: PreviewBoot
      description: 始め方
    unit_tests:
      - name: test_read_boot
        case: 正常
        summary: data-* を読み込み、知らない status と配列でない data-extensions は持たない
        condition: '`data-dist-js`・`data-version`・`data-config-path`・`data-extensions`（`["web:/w/e.js"]`）・`data-test` を持つ要素と、`data-status="other"` と `data-extensions="x"` だけを持つ要素'
        mock: なし
        expected: '1 つ目は全ての値と `extensions: ["web:/w/e.js"]`・`test: true`、2 つ目は `status` が `undefined`・`configPath` が空・`extensions` が空・`test` が `false`'
    status: planned
  - name: savedLineFrom
    title: 保存した行を読み込む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/boot.ts
    usecase: 共通
    summary: '`getState` で読み込んだ値が `PreviewState` なら、その行を返却する'
    scope: public
    args:
      - name: state
        type: unknown
        required: true
        description: '`getState` の値'
    returns:
      type: number | undefined
      description: 保存した行
    unit_tests:
      - name: test_saved_line_from
        case: 正常
        summary: line が数のときだけ返却する
        condition: '`{ line: 20.5 }`・`{ line: "20" }`・`undefined`・`null`'
        mock: なし
        expected: '`20.5`・`undefined`・`undefined`・`undefined`'
    status: planned
  - name: getVsCodeApi
    title: VS Code の API を取る
    kind: 関数
    container: vscode/src/webview/shared/adapters/vscode-api.ts
    usecase: 共通
    summary: '`acquireVsCodeApi()` を初回だけ呼んで覚え、2 回目からは同じ値を返却する（VS Code は 2 回目の呼び出しで例外を投げる）'
    scope: public
    returns:
      type: VsCodeApi
      description: VS Code の Webview の API
    unit_tests:
      - name: test_get_vs_code_api
        case: 正常
        summary: 2 回呼んでも acquireVsCodeApi は 1 回
        condition: 2 回呼ぶ
        mock: '`acquireVsCodeApi` を呼ばれた数を記録する代役にする'
        expected: 同じ値で、`acquireVsCodeApi` が 1 回
    status: planned
  - name: loadMdmark
    title: 配布物を読み込む
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: '`import(/* @vite-ignore */ url)` で配布物を読み込む'
    description: React Compiler は `import()` を中に持つコンポーネントを変換しないため、コンポーネントの外の関数に配置する
    scope: public
    is_async: true
    args:
      - name: url
        type: string
        required: true
        description: 配布物の `index.js` の URL
    returns:
      type: Promise<Mdmark>
      description: 読み込んだ配布物。読み込めなければ reject
    status: planned
  - name: classifyLoadFailure
    title: 読み込めない理由を見分ける
    kind: 関数
    container: vscode/src/webview/features/preview/panel/load-mdmark.ts
    usecase: VSCodeでプレビューを開く
    summary: 読み込めなかった `index.js` の URL を `fetch` の `HEAD` で確認し、404 なら `versionMissing`、それ以外は `offline` を返却する
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ url: string; fetch: typeof fetch }'
        required: true
        description: 読み込めなかった URL と `fetch`
    returns:
      type: Promise<"offline" | "versionMissing">
