        mock: なし
        expected: '1 つ目は `{ colorTheme: "theme-slate", features: { callout: false } }`、2 つ目は `{ colorTheme: "theme-paper", features: { callout: false } }`、3 つ目は `{}`。渡した `config` は変わらない'
    refs:
