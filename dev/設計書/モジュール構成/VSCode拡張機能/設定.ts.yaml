  - name: libraryOrigins
    title: libraries の配信元を取得する
    kind: 関数
    container: vscode/src/config.ts
    usecase: VSCodeでプレビューを開く
    summary: '`libraries` の値と `html-scripts.url`・`mermaid.url`（どちらも無ければライブラリ本体の既定の URL）のうち `http:`・`https:` の URL の origin を、重なりを除いて返却する（CSP の `script-src` に使用する）'
