  - name: openConfigFile
    title: 設定ファイルを開く
    kind: 関数
    container: vscode/src/config-file.ts
    usecase: 書いた内容をプレビューに映す
    summary: '`mdmark.openConfig` の本体。開くファイル（無ければ最も近い設定ファイル）をエディタで開き、無ければ雛形を作るか尋ねる'
    scope: public
    is_async: true
    side_effects: 「作成」を選んだときだけ、フォルダを作って `CONFIG_TEMPLATE` を書く
    args:
      - name: options
        type: '{ path?: string; cwd: string; configPath: string; baseDir: string; log: Logger }'
        required: true
        description: 開くファイル（帯から呼んだときは帯に出したファイル）・Markdown のフォルダ・`mdmark.configPath`・基準のフォルダ
    returns:
      type: Promise<void>
      description: 開いたか、作らないと答えたら解決する
    process: |-
      1. 開くファイルを決める
         - `path` があれば `path`
         - 無く `configPath` が空でなければ、設定ファイルの場所を決める（設定ファイルの場所を決める）
         - どちらも無ければ、`cwd` から上へ最も近い `mdmark.config.yaml` を探し（上のフォルダの設定ファイルを探す。`cascade: false`）、無ければ `baseDir` の `mdmark.config.yaml`
      2. ファイルがあれば `window.showTextDocument` で開いて終わる
      3. 無ければ `window.showInformationMessage` を `{ modal: true, detail }` とボタン「作成」で出す（文言は画面設計の「雛形を作るかの確認」）
         - 「作成」以外（閉じた・キャンセル）の場合、何も書かずに終わる
      4. フォルダが無ければ作り、`CONFIG_TEMPLATE` を書いて `window.showTextDocument` で開く。書く前にファイルができていたら書き換えずに開く
         - フォルダを作れない・書けない場合、`window.showErrorMessage` で OS の誤りの文を出して終わる
           - `[error]` 設定ファイルの雛形を書けない（パス・誤り）
         - `[info]` 設定ファイルの雛形を作った（パス）
    callees:
      - '#functions[resolveConfigPath]'
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[findConfigChain]
      - '#constants[CONFIG_TEMPLATE]'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/設定ファイルを開く.ts#
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#elements[雛形を作るかの確認]
    status: planned
