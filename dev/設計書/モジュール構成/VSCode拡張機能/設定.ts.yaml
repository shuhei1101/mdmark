title: "VS Code 拡張機能 / 設定"
lead: VS Code の設定 `mdmark.*` の読み取りと、`mdmark.config.yaml` の場所の解決・端末の設定と重ねた設定の読み取り・`mount` に渡すキーの取り出し・雛形の作成。
directory: |-
  ```tree
  vscode/src/
  ├── settings.ts     # settings.json の mdmark.* を読み、範囲の外の値を既定に戻す（vscode を import しない）
  ├── config.ts       # 設定ファイルの場所・読み取り・features と libraries の取り出し・雛形（vscode を import しない）
  └── config-file.ts  # mdmark.openConfig（設定ファイルを開く・雛形を作るか尋ねる）
  ```
data_models:
  - name: PreviewSettings
    title: 拡張機能の設定
    container: vscode/src/settings.ts
    usecase: 共通
    summary: '`mdmark.*` を読み、範囲の外の値を既定に戻した値'
    properties:
      - name: version
        type: string
        description: '`mdmark.version`'
      - name: configPath
        type: string
        description: '`mdmark.configPath`'
      - name: liveUpdate
        type: boolean
        description: '`mdmark.preview.liveUpdate`'
      - name: updateDelayMs
        type: number
        description: '`mdmark.preview.updateDelayMs`（描き直すまでの待ちを整える）'
      - name: scrollPreviewWithEditor
        type: boolean
        description: '`mdmark.preview.scrollPreviewWithEditor`'
      - name: scrollEditorWithPreview
        type: boolean
        description: '`mdmark.preview.scrollEditorWithPreview`'
      - name: theme
        type: '"auto" | "light" | "dark"'
        description: '`mdmark.preview.theme`。知らない値は `auto`'
      - name: outputDir
        type: string
        description: '`mdmark.export.outputDir`'
      - name: colorTheme
        type: '"" | "dev-swiss" | "theme-paper" | "theme-slate" | "theme-contrast"'
        description: '`mdmark.colorTheme`。知らない値と文字列でない値は `""`（設定ファイルに従う）'
    refs:
      - dev/設計書/設定/VSCode拡張機能#
    status: planned
  - name: PreviewConfig
    title: mount に渡す設定
    container: vscode/src/config.ts
    usecase: 共通
    summary: 設定ファイルから取り出した `features`・`libraries`・`html-scripts`・`side-toc`・`labels`・`colorTheme`・`colorScheme`。`render` の `config` と書き出す HTML の `config` になる
    properties:
      - name: features
        type: Record<string, unknown> | undefined
        description: 書いた値のまま（中の知らない名前と型の違う値は mdmark が無視する）
      - name: libraries
        type: Record<string, unknown> | undefined
        description: 書いた値のまま。URL は呼ぶ側が直す（libraries の URL を直す）
      - name: side-toc
        type: Record<string, unknown> | undefined
        description: 書いた値のまま（`mode` の知らない値は mdmark が `hover` で描く）
      - name: labels
        type: Record<string, unknown> | undefined
        description: 書いた値のまま（中の知らないキーと、空文字・文字列でない値は mdmark が無視して既定の文言で描く）
      - name: colorTheme
        type: string | undefined
        description: 設定ファイルに書いた値のまま。`mdmark.colorTheme` が空でないときは `applyColorTheme` がその値に置き換える（知らない名前は mdmark が dev-swiss で描く）
      - name: colorScheme
        type: string | undefined
        description: 設定ファイルに書いた値のまま。プレビューでは `mdmark.preview.theme` が `light`・`dark` のとき `applyPreviewTheme` が除く（知らない値は mdmark が `auto` で描く）
    status: planned
  - name: ConfigLoad
    title: 設定ファイルの読み取りの結果
    container: vscode/src/config.ts
    usecase: 書いた内容をプレビューに映す
    summary: '`loadConfig` の戻り値。重ねた設定から取り出した `mount` に渡すキー・`theme`・`extensions`・見張るファイル・最も近い設定ファイル・読めないファイル'
    properties:
      - name: config
        type: PreviewConfig
        description: 重ねた設定のうち、マップの `features`・`libraries`・`html-scripts`・`side-toc`・`labels` と文字列の `colorTheme`・`colorScheme`。読めない・形の合わないファイルは重ねずに残りを重ねた値。相対パスはその値を書いた設定ファイルのフォルダから解決した絶対パス
      - name: theme
        type: string | undefined
        description: 重ねた設定の `theme` の絶対パス
      - name: extensions
        type: string[]
        description: 重ねた設定の `extensions` の絶対パス。無ければ空
      - name: files
        type: string[]
        description: 重ねた設定ファイルの絶対パス（端末の設定 → 上 → 近い）。見張るファイルに使う
      - name: nearest
        type: string | undefined
        description: 最も近い `mdmark.config.yaml`（`mdmark.configPath` を書いたときはそのファイル）の絶対パス。「設定ファイルを開く」が開く
      - name: assetsRoot
        type: string | undefined
        description: 重ねた設定の `assets.root` の絶対パス。`mount` には渡さない
      - name: problem
        type: ConfigProblem | undefined
        description: 読めない・形の合わない最初の設定ファイル（端末の設定 → 上 → 近いの順）
    status: planned
  - name: ConfigProblem
    title: 読めない設定ファイル
    container: vscode/src/config.ts
    usecase: 書いた内容をプレビューに映す
    role: DTO
    summary: 帯に出す、読めない・形の合わない設定ファイル 1 つ
    properties:
      - name: path
        type: string
        description: 設定ファイルの絶対パス
      - name: line
        type: number | undefined
        description: YAML として読めない行（1 始まり）。形に合わないときは無い
      - name: settingKey
        type: string | undefined
        description: 設定の形に合わない最初のキー（`features.callout` のように `.` でつなぐ）。YAML として読めないときは無い
      - name: message
        type: string
        description: 誤りの文（ログに出す）
    status: planned
    introduced:
      pr: 347
constants:
  - name: SETTING_DEFAULTS
    title: 設定の既定
    container: vscode/src/settings.ts
    summary: 設定が無いか型が違うときに使う値。`vscode/package.json` の `contributes.configuration` の `default` と同じ値
    entries:
      - key: version
        value: '"latest"'
      - key: configPath
        value: '""'
      - key: liveUpdate
        value: 'true'
      - key: updateDelayMs
        value: '300'
      - key: scrollPreviewWithEditor
        value: 'true'
      - key: scrollEditorWithPreview
        value: 'true'
      - key: theme
        value: '"auto"'
      - key: outputDir
        value: '""'
      - key: colorTheme
        value: '""'
    refs:
      - dev/設計書/設定/VSCode拡張機能#
    status: planned
  - name: UPDATE_DELAY_RANGE
    title: 描き直すまでの待ちの範囲
    container: vscode/src/settings.ts
    summary: '`mdmark.preview.updateDelayMs` に許すミリ秒の最小と最大'
    value: '{ min: 0, max: 5000 }'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[描き直すまでの待ち]
    status: planned
  - name: CONFIG_TEMPLATE
    title: 設定ファイルの雛形
    container: vscode/src/config.ts
    summary: '`mdmark.openConfig` が「作成」で書く YAML。キーを書かず、書き方をコメントで示す'
    description: 値は画面設計の「雛形の中身」の YAML をそのまま持つ
    refs:
      - dev/設計書/画面設計/VSCodeのコマンドと通知.ts#elements[雛形の中身]
    status: planned
function_types:
  - name: ReadTextFile
    title: テキストのファイルを読む関数
    container: vscode/src/config.ts
    summary: UTF-8 で読む。ファイルが無ければ `code` が `ENOENT` の例外を投げる
    args:
      - name: path
        type: string
        required: true
        description: 絶対パス
    returns:
      type: Promise<string>
      description: ファイルの中身
    implementations:
      - target: node:fs/promises の readFile
        notes: 拡張機能の中で使う
    status: planned
functions:
  - name: readSettings
    title: 設定を読む
    kind: 関数
    container: vscode/src/settings.ts
    usecase: 共通
    summary: '`mdmark` の設定の値を読み、型が違う値と範囲の外の値を `SETTING_DEFAULTS` に戻して返す'
    description: 呼ぶ側が `workspace.getConfiguration("mdmark", uri).get` を渡す
    scope: public
    args:
      - name: get
        type: '(key: string) => unknown'
        required: true
        description: '`mdmark.` を除いたキー（`preview.updateDelayMs` など）の値を返す関数'
    returns:
      type: PreviewSettings
      description: 整えた設定
    unit_tests:
      - name: test_read_settings
        case: 正常
        summary: 書いた値をそのまま読む
        condition: '`version` が `v0.6.0`、`preview.updateDelayMs` が `1000`、`preview.theme` が `dark`、他は `undefined`'
        mock: なし
        expected: '`version` が `v0.6.0`、`updateDelayMs` が `1000`、`theme` が `dark`、他は `SETTING_DEFAULTS`'
      - name: test_read_settings_when_out_of_range
        case: 正常
        summary: 範囲の外・整数でない待ちと知らない配色は既定に戻す
        condition: '`preview.updateDelayMs` が `-1`・`5001`・`12.5`・`"300"` の 4 通り、`preview.theme` が `sepia`'
        mock: なし
        expected: '`updateDelayMs` がどれも `300`、`theme` が `auto`。`0` と `5000` はそのまま読む'
      - name: test_read_settings_when_color_theme
        case: 正常
        summary: 入っているテーマの名前だけを読み、他の値は空に戻す
        condition: '`colorTheme` が `theme-slate`・`sepia`・`1` の 3 通り'
        mock: なし
        expected: 1 つ目の `colorTheme` が `theme-slate`、残りは `""`
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[描き直すまでの待ち]
    status: planned
  - name: resolveConfigPath
    title: 設定ファイルの場所を決める
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`mdmark.configPath` が相対パスなら基準のフォルダから解決し、絶対パスならそのまま返す'
    scope: public
    args:
      - name: options
        type: '{ configPath: string; baseDir: string }'
        required: true
        description: '`mdmark.configPath` と、Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）の絶対パス'
    returns:
      type: string
      description: 設定ファイルの絶対パス
    unit_tests:
      - name: test_resolve_config_path
        case: 正常
        summary: 相対パスは基準のフォルダから、絶対パスはそのまま
        condition: '`baseDir` が `/ws`、`configPath` が `docs/mdmark.config.yaml` と `/etc/mdmark.yaml`'
        mock: なし
        expected: '`/ws/docs/mdmark.config.yaml` と `/etc/mdmark.yaml`'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[設定ファイルの場所]
    status: planned
  - name: parseConfig
    title: 設定を取り出す
    kind: 関数
    container: vscode/src/config.ts
    usecase: 書いた内容をプレビューに映す
    summary: YAML を `yaml` の `parse` で読み、最上位がマップのときだけ `features`・`libraries`・`html-scripts`・`side-toc`・`colorTheme`・`colorScheme` を取り出す。`assets` がマップで `root` が文字列なら `assetsRoot` に入れる
    scope: public
    args:
      - name: text
        type: string
        required: true
        description: 設定ファイルの中身
    returns:
      type: ConfigLoad
      description: '`ok` か `error`'
    process: |-
      1. `parse(text)` を呼ぶ
         - `YAMLParseError` の場合、`{ kind: "error", line: error.linePos[0].line, message: error.message }` を返す
      2. 最上位がマップでなければ（空のファイルを含む）`{ kind: "ok", config: {} }` を返す
      3. `features`・`libraries`・`html-scripts`・`side-toc` のうち値がマップのキーと、値が文字列の `colorTheme`・`colorScheme` だけを `config` に入れ、`assets.root` が文字列なら `assetsRoot` に入れて返す。他のキーは読まない
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[設定の取り出し方]
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[設定ファイルを読めないとき]
      - dev/設計書/外部ライブラリ/yaml#
    status: removed
  - name: loadConfig
    title: 設定ファイルを読む
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: ライブラリ本体の `loadLayeredConfig` で設定を重ねて読み、`ConfigLoad` にする。設定ファイルが 1 つも無ければ端末の設定だけで返す
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; configPath: string; baseDir: string; purpose: "preview" | "export"; env: Record<string, string | undefined>; home: string; readFile: ReadTextFile; isFile: (path: string) => Promise<boolean> }'
        required: true
        description: Markdown のフォルダ・`mdmark.configPath`・基準のフォルダ（設定ファイルの場所を決める）・プレビューか書き出しか・環境変数・ホームのフォルダ・読む関数・ファイルがあるかを確かめる関数
    returns:
      type: Promise<ConfigLoad>
      description: 読み取りの結果
    process: |-
      1. `configPath` が空でなければ設定ファイルの場所を決める（設定ファイルの場所を決める）
         - そのファイルが無い（`isFile` が `false`）場合、`explicit` を渡さず、`isFile` を常に `false` を返す関数にして呼ぶ（上へ探さず、端末の設定だけを重ねる）
      2. 設定を重ねて読む（設定を重ねて読む。`explicitName` は `mdmark.configPath`）
      3. 結果を `ConfigLoad` にする
         - `config` は重ねた設定のうち、値がマップの `features`・`libraries`・`html-scripts`・`side-toc`・`labels` と、値が文字列の `colorTheme`・`colorScheme` だけ
         - `files` は重ねた設定ファイルの `path`、`theme`・`extensions`・`assetsRoot` は重ねた設定の `theme`・`extensions`・`assets.root`
         - `unreadable` がある場合、`problem` は `{ path, line, message }`。無く `issues` がある場合、`problem` は `{ path: issues[0].file, settingKey: issues[0].where, message: issues[0].message }`
    exceptions:
      - name: Error
        condition: '`readFile` が `ENOENT` 以外で失敗した（投げ直す）'
    unit_tests:
      - name: test_load_config
        case: 正常
        summary: 重ねた設定から mount のキー・theme・extensions を取り出す
        condition: '端末の設定に `features.callout: false`、`/w/docs/mdmark.config.yaml` に `theme: ./t.css`・`extensions: [./e.js]`・`build: { include: ["*.md"], out: a.html }`、`cwd` が `/w/docs`、`configPath` が空'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`config` が `{ features: { callout: false } }`、`theme` が `/w/docs/t.css`、`extensions` が `["/w/docs/e.js"]`、`files` が端末の設定と `/w/docs/mdmark.config.yaml`、`nearest` が `/w/docs/mdmark.config.yaml`、`problem` が無い'
      - name: test_load_config_when_missing
        case: 正常
        summary: 設定ファイルが 1 つも無ければ空の設定
        condition: '`readFile` がどのファイルにも `ENOENT` を投げ、`isFile` がどれも `false`'
        mock: '`readFile`・`isFile` を代役にする'
        expected: '`config` が `{}`、`extensions` と `files` が空、`nearest`・`problem` が無い'
      - name: test_load_config_when_assets_root
        case: 正常
        summary: assets.root を書いた設定ファイルのフォルダから解決する
        condition: '`/w/mdmark.config.yaml` に `assets: { root: ./assets }`、`cwd` が `/w`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`assetsRoot` が `/w/assets` で、`config` に `assets` が無い'
      - name: test_load_config_when_unreadable
        case: 正常
        summary: YAML として読めないファイルを problem にし、残りを重ねる
        condition: '端末の設定に `features.callout: false`、`/w/mdmark.config.yaml` の 4 行目に閉じていない `[`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`problem` の `path` が `/w/mdmark.config.yaml`・`line` が 4、`config` が `{ features: { callout: false } }`'
      - name: test_load_config_when_invalid
        case: 正常
        summary: 形の合わないファイルを problem にしてキーを返す
        condition: '端末の設定に `features.callout: maybe`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`problem` の `path` が端末の設定・`settingKey` が `features.callout`・`line` が無い'
      - name: test_load_config_when_config_path_missing
        case: 正常
        summary: mdmark.configPath のファイルが無ければ上へ探さず端末の設定だけを重ねる
        condition: '`configPath` が `missing.yaml`、`/w/mdmark.config.yaml` に `features.table: false`、端末の設定に `features.callout: false`'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`config` が `{ features: { callout: false } }`、`files` が端末の設定だけ、`nearest` が無い'
      - name: test_load_config_when_labels
        case: 正常
        summary: labels の値がマップのときだけ config に入れる
        condition: '`/w/mdmark.config.yaml` に `labels: { paramCopy: コピー }`、`/w/b/mdmark.config.yaml` に `labels: コピー`、`cwd` が `/w` と `/w/b` の 2 回（端末の設定は無い）'
        mock: '`readFile`・`isFile` をメモリのファイルの表に差し替える'
        expected: '`cwd` が `/w` のとき `config` が `{ labels: { paramCopy: "コピー" } }`、`/w/b` のとき `config` に `labels` が無い'
    callees:
      - '#functions[resolveConfigPath]'
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[loadLayeredConfig]
    status: planned
  - name: resolveLibraries
    title: libraries の URL を直す
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`libraries` の各値について、`http:`・`https:` の URL はそのまま、それ以外の文字列は設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にして返す'
    description: プレビューは `toUrl` に `asWebviewUri` を、書き出しは `pathToFileURL` を渡す。文字列でない値はそのまま渡し、mdmark が無視する
    scope: public
    args:
      - name: options
        type: '{ libraries: Record<string, unknown>; configDir: string; toUrl: (path: string) => string }'
        required: true
        description: 取り出した `libraries`、設定ファイルのあるフォルダ、絶対パスを読める URL にする関数
    returns:
      type: Record<string, unknown>
      description: URL を直した `libraries`
    unit_tests:
      - name: test_resolve_libraries
        case: 正常
        summary: 相対パスだけを設定ファイルのフォルダから直す
        condition: '`{ a: "./libs/a.js", b: "https://cdn.example.com/b.js", c: "../c.js" }`、`configDir` が `/ws/docs`、`toUrl` が頭に `web:` を付ける'
        mock: なし
        expected: '`{ a: "web:/ws/docs/libs/a.js", b: "https://cdn.example.com/b.js", c: "web:/ws/c.js" }`'
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#constraints[libraries の URL]
      - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す.ts#constraints[設定と相対パス]
    status: planned
  - name: resolveHtmlScripts
    title: html-scripts の URL を直す
    kind: 関数
    container: vscode/src/config.ts
    usecase: 共通
    summary: '`html-scripts.url` が `http:`・`https:` でない文字列なら、設定ファイルのフォルダから解決した絶対パスを `toUrl` で URL にした `html-scripts` を返す。それ以外はそのまま返す'
    scope: public
    args:
      - name: options
        type: '{ htmlScripts: Record<string, unknown>; configDir: string; toUrl: (path: string) => string }'
        required: true
        description: 取り出した `html-scripts`、設定ファイルのあるフォルダ、絶対パスを読める URL にする関数
