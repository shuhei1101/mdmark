id: MOD-472-42
title: ライブラリ本体 / 索引と用語
lead: 索引の構造の検査・参照の表・索引の点検と、用語集の表の読み取り・用語と文書の別名の照合・ツールチップと関連文書の一覧の部品・ツールチップの操作。索引の処理は DOM に頼らず、Node とブラウザで同じ結果を返却する。
directory: |-
  ```tree
  src/
  ├── knowledge/
  │   ├── index-shape.ts   # 索引の型と構造の検査（normalizeIndex）
  │   ├── paths.ts         # 索引のパスの正規化・リンクの解決・相対パス
  │   ├── aliases.ts       # エイリアスの型と、設定の行と YAML の中身からエイリアスを作る buildAliases
  │   ├── dictionary.ts    # 用語と文書の別名の辞書・単語の正規化・単語の区切りでの照合
  │   ├── references.ts    # 参照の表（collectReferences）
  │   ├── matches.ts       # 本文の参照の取り出し（collectMatches）
  │   ├── positions.ts     # 照合した文字の位置を本文の行と行の中の位置へ戻す
  │   └── check.ts         # 索引の点検（checkIndex）
  ├── render/syntax/
  │   ├── glossary.ts      # glossary のマーカーで囲んだ表の読み取り
  │   ├── terms.ts         # 本文の用語と文書の別名に下線を付けるコアルール
  │   └── backlinks.ts     # 末尾の関連文書の一覧を配置するコアルール
  ├── parts/
  │   ├── term-tip.ts      # 用語のツールチップの HTML
  │   └── backlinks.ts     # 関連文書の一覧の HTML
  └── interact/
      └── terms.ts         # ツールチップの開閉・配置場所・id の再割り当て
  ```
