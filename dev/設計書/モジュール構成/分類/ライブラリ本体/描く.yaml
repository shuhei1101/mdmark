id: MOD-472-37
title: "ライブラリ本体 / 描く"
lead: 利用側のページの要素に文書を描き、再描画と片付けを受け持つ処理。記法の操作を付け、文書のマーカーにある外部ライブラリと拡張のモジュールを読み込んでマーカーの場所に描かせ、色分けの対象のコードブロックを色分けし、印刷の前後で折り畳みと記法を開いて戻す。ブラウザでだけ動く（色分けの HTML を行に分ける `src/highlight-lines.ts` だけは DOM を使用せず、部品の描画のインターフェースも使用する）。
directory: |-
  ```tree
  src/
  ├── mount.ts            # 公開関数 mount と、描いた要素の記録
  ├── libraries.ts        # マーカーの場所に外部ライブラリのモジュールを描かせる loadLibraries と、埋めたモジュールの記録
  ├── highlight.ts        # 色分けのライブラリを読み込んでコードブロックを色分けする highlightCodeBlocks と、埋めたモジュールの記録
  ├── highlight-lines.ts  # 色分けした HTML を行に分ける splitHighlightedLines・highlightLines（DOM を使用しない）
  ├── html-scripts.ts     # 埋め込んだ HTML の範囲の ts・js を変換して動かす runHtmlScripts と、変換のライブラリの読み込み・埋めた関数の記録
  ├── inline-icons.ts     # まとめていない名前のアイコンを jsDelivr から読み込む loadInlineIcons
  └── print.ts            # 印刷の前後で折り畳みを開いて戻す attachPrint
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 文書を要素に描く
        class 描いた要素の操作
        class マーカーの場所に外部ライブラリを描かせる
        class 色分けの対象を色分けする
        class 色分けした行を作る
        class 色分けしたHTMLを行に分ける
        class 印刷の前後で折り畳みを開く
        文書を要素に描く --> 描いた要素の操作 : 返却する
        文書を要素に描く --> マーカーの場所に外部ライブラリを描かせる : 描くたびに呼ぶ
        文書を要素に描く --> 色分けの対象を色分けする : 描くたびに呼ぶ
        色分けの対象を色分けする --> 色分けした行を作る : 行に分けたコードブロック
        色分けした行を作る --> 色分けしたHTMLを行に分ける
        文書を要素に描く --> 印刷の前後で折り畳みを開く : 1 回だけ付ける
      ```
notes:
  単体テストの実行場所: このページの関数は DOM を使用するため、単体テストを `tests/unit/src/{mount,libraries,highlight,print}.browser.test.ts` に配置し（DOM を使用しない `highlight-lines.ts` は `tests/unit/src/highlight-lines.test.ts` で `unit` プロジェクト）、Vitest のプロジェクト `unit-browser`（Chromium、`tests/unit/**/*.browser.test.ts`）で実行する。`unit` プロジェクトは `*.browser.test.ts` を除く
