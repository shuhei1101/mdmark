id: MOD-472-32
title: ライブラリ本体 / ビルド
lead: '`npm run build` が実行するビルドのスクリプト。バージョンを決めて検査し、esbuild で `dist/` を書き込み、配布ファイルのサイズを検査する。Node.js v24 が型を削除して `node scripts/build.ts` で直接実行する。'
directory: |-
  ```tree
  scripts/
  ├── baseline.ts    # 利用側のブラウザが読み込む JS を minify せずにまとめ、対応ブラウザの下限に無い API を取得する
  ├── build.ts       # バージョンの決定と検査・esbuild の呼び出し・まとめたライブラリのライセンスの書き出し・サイズの検査
  ├── bundle.ts      # build.ts と build-plugin.ts が使用する Node とブラウザのまとめの target・先頭の行・postcss の差し替え・まとめたパッケージとライセンスの引き方
  └── migrations.ts  # スキーマを変えたバージョンに移行の手順があるかの点検
  ```
