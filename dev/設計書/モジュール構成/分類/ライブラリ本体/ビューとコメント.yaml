        マーカーのビューに付ける --> 部品のHTML
        コメントを付ける --> 部品のHTML
notes:
  配布ファイルの分け方: '`src/views/index.ts` と `src/comments/index.ts` は別の esbuild の入口で、使用する関数（表の部品・表の操作・通知ブロックなど）をそれぞれのファイルにまとめる（`dist/index.js` を `import` しない）。`dist/index.js` は `src/part-modules.ts`・`src/mount-parts.ts`・2 つの `spec.ts` だけを持ち、部品の HTML と操作を持たない。部品の CSS は `src/index.css` に入れる'
