        class ビューを描く公開関数
        class コメントを付ける公開関数
        class 描いた文書に部品を付ける
        class ビューの引数を検める
        class コメントの引数を検める
        class ビューを描く
        class マーカーのビューに付ける
        class コメントを付ける
        class 選んだ範囲から下書きを作る
        class コメントの箇所を探す
        class コメントを修正・削除する
        class 部品のHTML
        ビューを描く公開関数 --> ビューの引数を検める : 同期で検める
        ビューを描く公開関数 --> 部品のモジュールを読み込む : view
        コメントを付ける公開関数 --> コメントの引数を検める : 同期で検める
