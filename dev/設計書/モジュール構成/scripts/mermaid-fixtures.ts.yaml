id: MOD-472-344
title: ライブラリ本体 / 部品の描画 / mermaid-fixtures.ts
functions:
  - name: writeMermaidFixtures
    title: mermaid の見本の SVG を記載する
    container: scripts/mermaid-fixtures.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: Playwright の Chromium で、`dev/mock/components/mermaid-diagram/` の場面と同じソースを `mount` で描き、図の `svg`（暗い配色の場面は印刷用の `svg` も）を `tests/fixtures/mermaid-svg/{名前}.svg` に書き込む。mermaid のバージョンを変えたときに `npm run fixtures:mermaid` で実行し、記載したファイルを commit する
    side_effects: '`tests/fixtures/mermaid-svg/` のファイルを書き換える'
    args:
      - name: options
        type: '{ root: string }'
        required: true
        description: 作業ツリーの場所
    returns:
      type: Promise<string[]>
      description: 記載したファイルのパス
    refs:
      - CMP-472-6#
    status: planned
    introduced:
      pr: 382
