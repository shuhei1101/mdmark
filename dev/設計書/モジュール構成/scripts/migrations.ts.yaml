id: MOD-472-168
title: ライブラリ本体 / ビルド / migrations.ts
test_files:
  - tests/unit/scripts/migrations.test.ts
constants:
  - name: CHECKED_SCHEMAS
    title: 点検する Schema
    container: scripts/migrations.ts
    summary: 変えたら移行の手順を求める `schemas/` のファイル
    value: '`["mdmark.config.schema.json", "mdmark.index.schema.json", "mdmark.settings.schema.json", "mdmark.templates.schema.json"]`'
functions:
  - name: latestVersionTag
    title: 最新のバージョンのタグを参照する
    container: scripts/migrations.ts
    summary: '`git tag --list v*` のうち `VERSION_PATTERN` に合う最も新しいバージョンを返却する'
    description: git は `execFile` で引数を配列にして呼ぶ。git の作業ツリーでないとき・タグが無いときは `undefined`。比較は `compareVersions`
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: root
        type: string
        required: true
        description: 作業ツリーの直下
    returns:
      type: Promise<string | undefined>
      description: 最新のバージョンのタグ
    unit_tests:
      - name: test_latest_version_tag
        case: 正常
        summary: 数として最も新しいタグを返却する
        condition: '`v0.9.0`・`v0.10.0`・`foo` のタグ'
        mock: 一時フォルダの git のリポジトリ
        expected: '`v0.10.0`'
      - name: test_latest_version_tag_when_none
        case: 正常
        summary: タグが無ければ undefined
        condition: タグの無いリポジトリと、git のリポジトリでないフォルダ
        mock: 一時フォルダ
        expected: どちらも `undefined`
    refs:
      - MOD-472-148#functions[compareVersions]
    status: planned
    introduced:
      pr: 39
  - name: checkMigrations
    title: 移行の手順を点検する
    container: scripts/migrations.ts
    summary: スキーマを最新のバージョンのタグから変えたのに移行の手順も手順なしの一覧の合う行も無いこと、release のビルドで出していないバージョンの手順が残ること、手順の構造の誤りを、修正方法つきの文で返却する
    description: '順に、`migrations/` の全ての `steps.yaml`（`next` と `v{バージョン}`）を `validateSteps` で検め、`call` のスクリプトがあることと `no-steps.yaml` の構造を確認する → `latestVersionTag` が `undefined` か、比べるバージョンがタグより古ければそこで終える → 比べるバージョンがタグと同じなら `next`、新しければ `v{比べるバージョン}` を確認するバージョンにし、新しいときは `migrations/next/` と `version: next` の行が残っていれば誤りにする → `CHECKED_SCHEMAS` ごとに `git show {タグ}:schemas/{名前}` と今の中身を比べ、違うものは確認するバージョンの `steps.yaml` か、確認するバージョン・その Schema・今の中身の SHA-256（`node:crypto`）の合う行があれば合格にする。タグに無い Schema と作業ツリーに無い Schema は比べない'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ root: string; version: string }'
        required: true
        description: 作業ツリーの直下・比べるバージョン（`resolveVersion` のバージョン）
    returns:
      type: Promise<string[]>
      description: 誤り 1 つ 1 文（無ければ空）
    unit_tests:
      - name: test_check_migrations
        case: 正常
        summary: スキーマを変えて next に手順があれば誤り 0 件
        condition: '`v0.3.0` のタグの後に `mdmark.index.schema.json` を変え、`migrations/next/steps.yaml` を配置する。バージョンは `v0.3.0`'
        mock: 一時フォルダの git のリポジトリ
        expected: 空
      - name: test_check_migrations_when_listed
        case: 正常
        summary: SHA-256 の合う手順なしの行があれば誤り 0 件
        condition: '`mdmark.config.schema.json` を変え、`no-steps.yaml` に `next`・その Schema・今の SHA-256 の行'
        mock: 一時フォルダの git のリポジトリ
        expected: 空
      - name: test_check_migrations_when_steps_missing
        case: 異常
        summary: スキーマを変えて手順も合う行も無ければ誤り
        condition: '`mdmark.index.schema.json` を変え、`no-steps.yaml` には SHA-256 の合わない `next` の行だけ'
        mock: 一時フォルダの git のリポジトリ
        expected: 1 つで `schemas/mdmark.index.schema.json` と `migrations/next/steps.yaml` を含む
      - name: test_check_migrations_when_next_left
        case: 異常
        summary: release のビルドで next が残れば誤り
        condition: タグ `v0.3.0`、バージョン `v0.4.0`、`migrations/next/steps.yaml` がある
        mock: 一時フォルダの git のリポジトリ
        expected: 誤りに `migrations/v0.4.0/` へ移すことが入る
      - name: test_check_migrations_when_no_tag
        case: 正常
        summary: タグが無ければスキーマを比べない
        condition: タグの無いリポジトリで Schema を変える
        mock: 一時フォルダの git のリポジトリ
        expected: 空
    refs:
      - '#functions[latestVersionTag]'
      - MOD-472-146#functions[validateSteps]
      - ER-472-5#
    status: planned
    introduced:
      pr: 39
