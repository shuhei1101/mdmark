data_models:
  - name: MdmarkAlias
    title: エイリアス
    container: src/knowledge/aliases.ts
    role: DTO
    summary: 設定の行の `metadata` を適用して作ったエイリアス 1 件（公開の型）。`buildAliases` が返却し、`mount`・`render`・`collectMatches` の `aliases` に並べて指定する
    description: キーと意味は ER 図『エイリアス』の `MdmarkAlias`。値の無いキーは持たない（`aliases` だけは空の並びでも持つ）
    properties:
      - name: alias_type
        type: MdmarkAliasType
        description: エイリアスの種類。ツールチップの区分と照合したときの扱いを決める
      - name: id
        type: string
        description: エイリアスの ID。指定したエイリアスの中で一意
      - name: name
        type: string
        description: 照合する単語で、ツールチップに出す名前。`avoid` の種類ではやめた言い方
      - name: aliases
        type: string[]
        description: 名前と同じく照合する単語
      - name: description
        type: string | undefined
        description: ツールチップの説明
      - name: related
        type: string[] | undefined
        description: '`term` の関連する単語。受け取るだけで使用しない'
      - name: command
        type: string | undefined
        description: '`command` の種類のコマンド'
      - name: cwd
        type: string | undefined
        description: '`command` の種類の実行場所'
      - name: url
        type: string | undefined
        description: '`url` の種類の URL'
      - name: skill
        type: string | undefined
        description: '`skill` の種類のスキル名'
      - name: tool
        type: string | undefined
        description: '`tool` の種類のツール名'
      - name: path
        type: string | undefined
        description: '`path` の種類のパス'
      - name: avoid
        type: string[] | undefined
        description: '`term` の種類のやめた言い方'
      - name: replacement
        type: string | undefined
        description: '`avoid` の種類の置き換え先の単語'
    refs:
      - ER-472-3#tables[MdmarkAlias]
    status: planned
    introduced:
      pr: 176
  - name: MdmarkAliasSource
    title: エイリアスの元のファイル
    container: src/knowledge/aliases.ts
    role: DTO
    summary: 行の `paths` に該当したファイルを YAML として読み込んだ中身 1 つ（公開の型）
    properties:
      - name: rowId
        type: string
        description: そのファイルを指した行の `id`
      - name: path
        type: string
        description: ファイルのパス（設定ファイルのフォルダからの相対パス。区切りは `/`）
      - name: data
        type: unknown
        description: ファイルを YAML として読み込んだ値
    refs:
      - IF-472-26#request[input.sources]
    status: planned
    introduced:
      pr: 176
  - name: MdmarkAliasProblem
    title: エイリアスのずれ
    container: src/knowledge/aliases.ts
    role: DTO
    summary: '`buildAliases` が返却する、使用できなかった行・レコードのずれ 1 件（公開の型）'
    properties:
      - name: file
        type: string
        description: ずれのあるファイル。行のずれは `configFile`、レコードのずれはそのレコードのファイルの `path`
      - name: where
        type: string
        description: 行のずれは設定のキーのパス（`aliases[1].id`）、レコードのずれはファイルの中のパス（`terms[2].command`。`records` を持たない行は `command`）。ファイル全体のずれは空文字
      - name: kind
        type: "'duplicate_alias_row_id' | 'alias_records_missing' | 'alias_field_missing' | 'alias_unknown_type' | 'alias_required_empty' | 'duplicate_alias_id'"
        description: ずれの種類。意味はインターフェース定義『エイリアスを作る』の `problems[].kind`
      - name: message
        type: string
        description: ずれの内容と修正方法の日本語の 1 文
    refs:
      - IF-472-26#response[problems]
    status: planned
    introduced:
      pr: 176
