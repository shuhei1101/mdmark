    value: '`{ id: "ID", name: "名前", description: "説明", command: "コマンド", url: "URL", skill: "スキル名", tool: "ツール名", path: "パス", replacement: "置き換え先" }`'
    status: planned
    introduced:
      pr: 176
functions:
  - name: buildAliases
    title: エイリアスを作る
    container: src/knowledge/aliases.ts
    kind: 関数
    scope: public
    summary: 公開関数。設定の `aliases` の行と、行の `paths` に該当した YAML を読み込んだ中身から、`metadata` を適用したエイリアスの並びと、使用できない行・レコードのずれの一覧を返却する
    description: '行を頭から確認して、オブジェクトで `id`（空でない文字列）・`paths`・`alias_type`（文字列）を持つ行だけを使用する（持たない行は使用せず、ずれにもしない）。`enabled` が `false` の行は読み込まない。行の `id` が前の行と同じなら、その行を読み込まず `duplicate_alias_row_id`（`file` は `configFile`、`where` は `aliases[{行の位置}].id`）にする。行の `alias_type` が `ALIAS_TYPES` に無ければ、その行のレコードを読み込まず `alias_unknown_type`（`file` は `configFile`、`where` は `aliases[{行の位置}].alias_type`）にする。読み込む行ごとに `sources` のうち `rowId` がその行のものを並びの順に確認して、`records` を持つ行はファイルの値のそのキーの配列の要素ごとに、持たない行はファイルの値を 1 件のレコードにする（キーが無いか配列でないファイルは `alias_records_missing`。配列の要素とファイルの値がオブジェクトでないものは使用しない）。レコードごとに `readAliasRecord` で値を取り、`metadata` に記載した列が無ければ無い列ごとに `alias_field_missing` にしてそのレコードを使用しない。続けて `checkAliasFields` で必須のキーを確認し、`alias_required_empty`（空のキーごとに 1 件）にしたレコードは使用しない。エイリアスの `alias_type` は行の `alias_type` にする。残ったレコードの `id` が前のレコード（`env` を含む）と同じなら `duplicate_alias_id` にして使用しない。`env` のレコードは確認するだけで `aliases` に入れない。レコードのずれの `file` はファイルの `path`、`where` はレコードのパス（`records` を持つ行は `{records}[{配列の位置}]`、持たない行は空）にキーを `.` で続けたもの（末尾のキーは `metadata` に記載した列名、記載していなければエイリアスのキー。レコードのパスが空ならキーだけ）。`message` は次の 1 文: `duplicate_alias_row_id` は ``行の `id` `{id}` が前の行と同じです。`id` を変えてください。``、`alias_records_missing` は ```{records}` の配列がありません。ファイルに `{records}` の配列を記載するか、`records` を修正してください。``、`alias_field_missing` は ```metadata.{キー}` が指す列 `{field}` がレコードにありません。列を記載するか、`metadata.{キー}` を修正してください。``、`alias_unknown_type` は ```alias_type` の `{値}` は種類にありません。`term`・`doc`・`command`・`url`・`skill`・`tool`・`path`・`env`・`avoid` のどれかにしてください。``、`alias_required_empty` は ``\`{path}\` の \`{レコードのパス}\` の \`{キー}\` が空です。{ALIAS_KEY_LABELS のラベル}を記載してください。``（レコードのパスが空なら ``\`{path}\` の \`{キー}\` が空です。…``。`env` の `url` と `port` が両方空なら、キーを `url` にして ``… の `url` と `port` が両方空です。URL かポートを記載してください。``）、`duplicate_alias_id` は ``エイリアスの `id` `{id}` が前のエイリアスと同じです。`id` を変えてください。``。引数を書き換えない'
    args:
      - name: input
        type: '{ rows: unknown[]; sources: MdmarkAliasSource[]; configFile?: string }'
        required: true
        description: 設定の `aliases` の行・行の `paths` に該当したファイルの中身・行のずれの `file` に出す設定ファイルの名前（既定 `mdmark.config.yaml`）
    args_example: |-
      ```ts
      const { aliases, problems } = buildAliases({ rows: config.aliases, sources });
      ```
    returns:
      type: '{ aliases: MdmarkAlias[]; problems: MdmarkAliasProblem[] }'
      description: 作ったエイリアス（行の並び、行の中は `sources` の並び、ファイルの中は `records` の配列の並び）と、同じ順のずれ
    callees:
      - '#functions[readAliasRecord]'
      - '#functions[checkAliasFields]'
    refs:
      - IF-472-26#
    unit_tests:
      - name: test_build_aliases
        case: 正常
        summary: records を持つ行と持たない行から、metadata を適用したエイリアスを並びの順に作り、env と読み込まない行を除く
        condition: インターフェース定義『エイリアスを作る』の「正常系」の 4 つの行とその中身
        mock: なし
        expected: そのフローの期待値と等しく、引数が書き換わっていない
      - name: test_build_aliases_when_invalid_rows
        case: 正常
        summary: 使用できない行とレコードを除いてずれにし、残りからエイリアスを作る
        condition: インターフェース定義『エイリアスを作る』の「正常系（使用できない行とレコード）」の行と中身
        mock: なし
        expected: そのフローの期待値と等しく、`problems` の並びが行の順
      - name: test_build_aliases_when_rows_not_usable
        case: 正常
        summary: id・paths・alias_type を持たない行と、オブジェクトでない行をずれにせずに飛ばす
        condition: '`null`・文字列・`alias_type` を持たない行・`id` が空文字の行と、正しい行 `terms` の 5 行。`rowId` が `terms` でない `sources` も 1 つ指定する'
        mock: なし
        expected: '`aliases` が `terms` の行のエイリアスだけで、`problems` が空'
      - name: test_build_aliases_when_values_coerced
        case: 正常
        summary: 数・真偽値を文字列にし、前後の空白を除き、別名を並びにする
        condition: '`id` が `42`、`name` が ` 単体テスト `、`aliases` が `["ユニットテスト", 3, null]`、`command` が `true` の `command` のレコード'
        mock: なし
        expected: '`id` が `"42"`、`name` が `単体テスト`、`aliases` が `["ユニットテスト"]`、`command` が `"true"`'
      - name: test_build_aliases_when_name_missing
        case: 正常
        summary: name が空のとき、body_file の列のファイル名、records を持つ行はレコードの id、持たない行はファイル名の順で名前にする
        condition: '`records` と `body_file: path` を持つ行の `name` の無いレコード 2 件（`path` が `docs/guide.md` の `id` `g` と、`path` を持たない `id` `ws`）と、`records` を持たない行の `commands/unit-test.yaml`'
        mock: なし
        expected: 名前が `guide`・`ws`・`unit-test`
      - name: test_build_aliases_when_fields_missing
        case: 正常
        summary: metadata に記載した列が無いレコードは、無い列ごとにずれにし、必須のキーを確認しない
        condition: '`metadata` が `{description: meaning, command: cmd}` の `command` の行で、`meaning`・`cmd` の無いレコード'
        mock: なし
        expected: '`problems` が `alias_field_missing` の 2 件だけで、`where` が `meaning`・`cmd` の順。`alias_required_empty` が無い'
      - name: test_build_aliases_when_env_has_no_url_and_port
        case: 正常
        summary: env の url と port が両方空なら 1 件のずれにし、env を aliases に入れない
        condition: '`url`・`port` を持たない `env` のレコードと、`port` だけを持つ `env` のレコード'
        mock: なし
        expected: '`problems` が `where` `url` の `alias_required_empty` の 1 件で、`message` に `url` と `port` がある。`aliases` が空'
      - name: test_build_aliases_when_id_same_as_env
        case: 正常
        summary: env のレコードと同じ id のエイリアスを duplicate_alias_id にする
        condition: '`env` の `dev-server` の後に `url` の `dev-server`'
        mock: なし
        expected: '`problems` が `duplicate_alias_id` の 1 件で、`aliases` が空'
    status: planned
    introduced:
      pr: 176
  - name: readAliasRecord
    title: レコードから値を取る
    container: src/knowledge/aliases.ts
    kind: 関数
    scope: internal
    summary: 1 つのレコードに行の `metadata` を適用して、エイリアスのキーごとの値と、`metadata` に記載した列が無いキーを返却する
    description: '`ALIAS_KEYS` のキーごとに、`metadata` のそのキーが空でない文字列なら、その列名を `.` で分けてレコードの入れ子の列をたどった値を取り（たどれなければ `missing` に入れる）、そうでなければレコードの同じ名前の列を取る（列が無ければキーを持たない）。`aliases`・`avoid`・`related` は、文字列なら 1 件の並びに、並びなら文字列の要素だけを残す（数・真偽値・`null` の要素は捨てる）。ほかのキーは、文字列・数・真偽値を文字列にして前後の空白を除き、それ以外の値と空文字は持たない。`name` が無ければ、`bodyFile` の列の値が空でないときはそのパスの最後の名前から拡張子を除いたもの、そうでなければ `fallbackName` にする。`metadata` のほかのキーとレコードのほかの列は使用しない'
    args:
      - name: options
        type: '{ record: Record<string, unknown>; metadata: Record<string, unknown>; bodyFile?: string; fallbackName: string }'
        required: true
        description: レコード・行の `metadata`（無い行は空のオブジェクト）・行の `body_file`・`name` が無いときの名前（`records` を持つ行はレコードの `id`、持たない行はファイルのパスの最後の名前から拡張子を除いたもの）
    returns:
      type: '{ values: Partial<Record<(typeof ALIAS_KEYS)[number], string | string[]>>; missing: Array<{ key: string; field: string }> }'
      description: キーごとの値と、`metadata` のキーの順の、記載した列が無いキー（`field` は列名）
    unit_tests:
      - name: test_read_alias_record
        case: 正常
        summary: metadata の列名・同じ名前の列の順で値を取る
        condition: '`metadata` が `{name: term, description: meta.summary}`。レコードが `term`・`meta: {summary}`・`aliases`・`memo` を持つ'
        mock: なし
        expected: '`values` が `name`・`description`（`meta.summary` の値）・`aliases` だけを持ち、`memo` を持たない。`missing` が空'
      - name: test_read_alias_record_when_nested_column_missing
        case: 正常
        summary: 入れ子の列をたどれなければ missing に入れる
        condition: '`metadata` が `{description: meta.summary}`。レコードの `meta` が文字列'
        mock: なし
        expected: '`missing` が `{key: description, field: meta.summary}` の 1 件で、`values` が `description` を持たない'
    status: planned
    introduced:
      pr: 176
  - name: checkAliasFields
    title: 種類と必須のキーを確認する
    container: src/knowledge/aliases.ts
    kind: 関数
    scope: internal
    summary: 行の種類の必須のキー（`ALIAS_REQUIRED_KEYS`）が空でないかを返却する
    description: '種類ごとに `id`・`name` と `ALIAS_REQUIRED_KEYS` のキーのうち空のものを並びの順に返却する。`env` は `url` と `port` が両方空のときだけ `url` を返却する'
    args:
      - name: options
        type: '{ aliasType: MdmarkAliasType; values: Partial<Record<(typeof ALIAS_KEYS)[number], string | string[]>> }'
        required: true
        description: 行の `alias_type` と、`readAliasRecord` の `values`
    returns:
      type: '{ kind: "alias_required_empty"; keys: string[] } | undefined'
      description: ずれ。無ければ `undefined`
    unit_tests:
      - name: test_check_alias_fields
        case: 正常
        summary: 種類ごとに必須のキーの空を返却する
        condition: '`description` の無い `term`、`command` の無い `command`、`replacement` の無い `avoid`、全てを持つ `url`'
        mock: なし
        expected: 順に `keys` が `["description"]`・`["command"]`・`["replacement"]`、`undefined`
    status: planned
    introduced:
      pr: 176
  - name: usableAliases
    title: 使用できるエイリアスに絞る
    container: src/knowledge/aliases.ts
    kind: 関数
    scope: internal
    summary: '`mount`・`render`・`collectMatches` に指定されたエイリアスから、照合に使用できるものだけを並びの順に返却する'
    description: オブジェクトで、`alias_type` が `MdmarkAliasType` の値（`env` と知らない種類を除く）、`id`・`name` が空でない文字列、種類の必須のキー（`ALIAS_REQUIRED_KEYS`）が空でない文字列で、`id` が前に残したエイリアスと同じでないものだけを残す。`aliases`・`avoid` は空でない文字列の要素だけにした並びにする（無ければ空の並び）。通知ブロックも警告も出さない。引数を書き換えない
    args:
      - name: aliases
        type: readonly unknown[]
        required: true
        description: 利用側が指定したエイリアス
    returns:
      type: MdmarkAlias[]
      description: 照合に使用するエイリアス
    unit_tests:
      - name: test_usable_aliases
        case: 正常
        summary: env・知らない種類・必須のキーが空・同じ id の後のものを除く
        condition: '`command` の `unit-test`、`env` の `dev-server`、`alias_type` が `memo`、`command` が空の `command`、2 つ目の `unit-test`、文字列 `x` の 6 つ'
        mock: なし
        expected: 1 つ目の `unit-test` だけを返却する
    status: planned
    introduced:
      pr: 176
