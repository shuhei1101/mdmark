id: MOD-472-255
title: ライブラリ本体 / 索引と用語 / references.ts
test_files:
  - tests/unit/src/knowledge/references.test.ts
data_models:
  - name: MdmarkReferences
    title: 参照の表
    container: src/knowledge/references.ts
    role: DTO
    summary: '`collectReferences` が返却し、`mount`・`render` の `opts.references` が受け取る値（公開の型）'
    properties:
      - name: backlinks
        type: Record<string, string[]>
        description: 文書の `id` から、その文書を参照している文書の `id` の並び
      - name: glossary
        type: MdmarkGlossaryEntry[]
        description: 各文書の用語集の表から入れた用語（`term`・`aliases`・`meaning`・`docId`・`avoid`）
  - name: MdmarkGlossaryEntry
    title: 用語集の表の用語
    container: src/knowledge/references.ts
    role: DTO
    summary: 用語集の表の 1 行から入れた用語（公開の型 `MdmarkReferences` の一部）
    properties:
      - name: term
        type: string
        description: 用語
      - name: aliases
        type: string[]
        description: 別名
      - name: meaning
        type: string
        description: 意味
      - name: docId
        type: string
        description: 表を持つ文書の `id`
      - name: avoid
        type: string[] | undefined
        description: やめた言い方の列を「、」「,」で区切ったもの。やめた言い方の列が無いときは空。`collectReferences`・`readGlossaryRows` は常に入れる。利用側が組み立てた参照の表で無いときは、やめた言い方を持たない用語として扱う
functions:
  - name: collectReferences
    title: 参照の表を作る
    container: src/knowledge/references.ts
    kind: 関数
    scope: public
    summary: 索引と全ての文書の本文から、文書ごとの被参照と各文書の用語集の表の用語を返却する
    description: '`normalizeIndex` で合う文書だけを使用する。各文書の本文を解析器でトークンにし、文書の `features` のマーカーを重ねた機能で、`link_open` の `href` を `resolveLink` で解き、テキストのトークンを `findWords` で文書の別名と照合し、`glossary` のマーカーの表を `readGlossaryTable` で読み込む（表の用語はやめた言い方の列を `avoid` に持つ）。コード・リンク・見出し・用語集の表の中は照合しない。`related` の要素の相手（`readRelated` の `to`）も参照に数える'
    args:
      - name: input
        type: '{ index: MdmarkIndex; documents: Record<string, string>; config?: MdmarkConfig }'
        required: true
        description: 索引・文書のパスから本文を参照する表・設定
    returns:
      type: MdmarkReferences
      description: 参照の表
    callees:
      - 'MOD-472-254#functions[normalizeIndex]'
      - 'MOD-472-262#functions[resolveLink]'
      - 'MOD-472-257#functions[findWords]'
      - 'MOD-472-259#functions[readGlossaryTable]'
    unit_tests:
      - name: test_collect_references
        case: 正常
        summary: '`related`・本文のリンク・文書の別名から被参照を作る'
        condition: インターフェース定義『参照の表を作る』のリクエスト例
        mock: なし
        expected: レスポンス例と等しく、引数が書き換わっていない
      - name: test_collect_references_when_disabled
        case: 正常
        summary: '`backlinks` がオフの文書は参照元にも参照先にもならず、`glossary` がオフの文書の表は入れない'
        condition: '`guide` の本文に `<!-- features: -backlinks -glossary -->` と用語集の表'
        mock: なし
        expected: '`backlinks.arch` に `guide` が無く、`glossary` が空'
      - name: test_collect_references_ignores_code_and_headings
        case: 正常
        summary: コード・見出し・リンクの文字の中の別名は参照にしない
        condition: '`arch` の本文の見出しと行内のコードにだけ `公開関数`'
        mock: なし
        expected: '`backlinks.api` が空'
      - name: test_collect_references_when_alias_notation_differs
        case: 正常
        summary: 全角と半角・英字の大文字と小文字だけが違う文書の別名を被参照にする
        condition: インターフェース定義『参照の表を作る』の「正常系（表記の違う別名）」の索引と文書
        mock: なし
        expected: '`backlinks.api` が `["arch", "guide"]`'
      - name: test_collect_references_when_related_objects
        case: 正常
        summary: オブジェクトの関連は `to` を、文字列の関連はその文字列を参照に数える
        condition: '`api` の `related` が `[{ to: "arch", type: "requires", when: "前提を確認するとき" }]`、`guide` の `related` が `["arch"]` で、どちらの本文も `arch` をリンクも別名でも指さない'
        mock: なし
        expected: '`backlinks.arch` が `["api", "guide"]`'
    refs:
      - IF-472-31#
  - name: parseDocument
    title: 文書の本文を読む
    container: src/knowledge/references.ts
    kind: 関数
    scope: internal
    summary: 文書の本文を、マーカー・機能・用語集の表を読み込んだトークンにする。解析の前に `splitFrontmatter` で本文の先頭のフロントマターを空白にし、フロントマターの中のリンク・文書の別名・用語を照合の対象にしない
    description: '`collectReferences`・`collectMatches`・`checkIndex` が共通で呼ぶ。フロントマターは改行以外を空白にするため、トークンの行番号と本文の文字の位置は元の本文と同じ'
    args:
      - name: options
        type: '{ body: string; docId: string; defaults: Record<string, boolean> }'
        required: true
        description: 本文の Markdown、文書の `id`、設定の `features`
    returns:
      type: ParsedDocument
      description: トークン・機能のオン・オフ・用語集の表の用語と行
    callees:
      - MOD-472-217#functions[splitFrontmatter]
    refs:
      - IF-472-31#constraints[フロントマター]
      - IF-472-36#constraints[フロントマター]
      - IF-472-37#constraints[フロントマター]
    unit_tests:
      - name: test_parse_document_when_frontmatter
        case: 正常
        summary: フロントマターの中のリンクと用語集の表を読み込まず、後ろの行番号を保つ
        condition: '`---\nsee: "[設計](../設計/arch.md)"\n---\n\n| 用語 | 意味 |` の後ろに用語集の表を持つ本文'
        mock: なし
        expected: トークンに `../設計/arch.md` の `link_open` が無く、用語集の表の用語の行が元の本文の行
    status: planned
    introduced:
      pr: 422
