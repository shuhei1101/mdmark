id: MOD-472-201
title: ライブラリ本体 / 拡張 / extensions.ts
test_files:
  - tests/unit/src/extensions.test.ts
data_models:
  - name: MdmarkMarkArgs
    title: マーカーの引数
    container: src/extensions.ts
    usecase: 共通
    summary: マーカーの引数を判別した値。拡張の `schema` と `draw` が受け取る（公開の型）
    properties:
      - name: args
        type: string[]
        description: '`キー=値` でない引数を記載した順に'
      - name: keys
        type: Record<string, string>
        description: '`キー=値` の引数。同じキーは後に記載した値'
      - name: definition
        type: unknown
        description: マーカーを範囲で記載し、範囲に `json` のコードブロックを 1 つ配置したときの、その JSON を読み込んだ値。範囲が無いマーカーでは持たない。JSON として読み込めないときは `schema` も `load` も呼ばず記載の警告にする（分類『図』の `parseDefinitionJson`）
  - name: MdmarkExtensionModule
    title: 拡張のモジュール
    container: src/extensions.ts
    usecase: 拡張の登録
    summary: '`load` が返却するモジュールの構造（公開の型）'
    properties:
      - name: draw
        type: '(slot: HTMLElement, value: MdmarkMarkArgs) => void | Promise<void>'
        description: マーカーの場所の要素に描く
  - name: MdmarkExtension
    title: 拡張
    container: src/extensions.ts
    usecase: 拡張の登録
    summary: '`registerExtension` に指定する拡張（公開の型）'
    properties:
      - name: name
        type: string
        description: 拡張の名前。通知ブロック・記載の警告・`console.error` に出す
      - name: directive
        type: string
        description: マーカーの名前
      - name: load
        type: () => Promise<MdmarkExtensionModule>
        description: モジュールを読み込む関数
      - name: schema
        type: StandardSchemaV1<MdmarkMarkArgs> | undefined
        description: 引数を検査する Standard Schema
  - name: WarningItem
    title: 警告の項目
    container: src/extensions.ts
    usecase: 共通
    summary: 記載の警告に並べる 1 項目（部品『記載の警告』の `items` の要素）
    properties:
      - name: label
        type: string
        description: 項目の頭に `code` で出す文字。空なら出さない
      - name: message
        type: string
        description: 項目の本文
constants:
  - name: RESERVED_DIRECTIVES
    title: 拡張に使用できないマーカーの名前
    container: src/extensions.ts
    summary: '`features` と記法のマーカーの名前（`ReadonlySet<string>`）'
    value: '["features", "table", "tabs", "steps", "section", "row-detail", "fig", "toc", "glossary"]'
  - name: extensions
    title: 拡張の登録表
    container: src/extensions.ts
    summary: '`directive` から拡張を参照する `Map<string, MdmarkExtension>`。モジュールに 1 つ'
    value: new Map()
functions:
  - name: registerExtension
    title: 拡張を登録する
    container: src/extensions.ts
    kind: 関数
    scope: public
    summary: 拡張の構造を確認して登録表に追加する公開関数
    description: '`name` が空・`directive` が `MARK_NAME_PATTERN` に合わない・`load` が関数でない・`schema` が `~standard.validate` を持たないときは `TypeError`（メッセージに項目名）。`directive` が `RESERVED_DIRECTIVES` か登録済みのときは `Error`（メッセージに名前）。どちらも登録しない'
    args:
      - name: extension
        type: MdmarkExtension
        required: true
        description: 登録する拡張
    returns:
      type: void
      description: 戻り値は無い
    side_effects: '`extensions` に追加する'
    unit_tests:
      - name: test_register_extension
        case: 正常
        summary: 登録した拡張を `extensionFor` で参照できる
        condition: '`directive` が `greet` の拡張'
        mock: なし（各テストの前に `resetExtensions`）
        expected: '`extensionFor("greet")` が登録した拡張'
      - name: test_register_extension_when_invalid
        case: 異常
        summary: 構造の合わない拡張は TypeError で登録しない
        condition: '`directive` が `Greet!`、`load` が文字列、`schema` が `{}` の 3 つ'
        mock: なし
        expected: どれも `TypeError`（メッセージに `directive`・`load`・`schema`）を投げ、`extensionFor` が `undefined`
      - name: test_register_extension_when_directive_taken
        case: 異常
        summary: 記法のマーカーと登録済みの名前は Error で登録しない
        condition: '`directive` が `table` の拡張と、`greet` を 2 回'
        mock: なし
        expected: どちらも `Error`（メッセージに名前）を投げ、最初の `greet` が残る
  - name: extensionFor
    title: 拡張を参照する
    container: src/extensions.ts
    kind: 関数
    scope: internal
    summary: '`directive` の拡張を返却する。無ければ `undefined`'
    args:
      - name: directive
        type: string
        required: true
        description: マーカーの名前
    returns:
      type: MdmarkExtension | undefined
      description: 登録した拡張
  - name: resetExtensions
    title: 登録表を空にする
    container: src/extensions.ts
    kind: 関数
    scope: internal
    summary: 単体テストの前に登録表を空にする。公開の入口からは export しない
    returns:
      type: void
      description: 戻り値は無い
    side_effects: '`extensions` を空にする'
  - name: validateMarkArgs
    title: 引数を検査する
    container: src/extensions.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: '`schema["~standard"].validate(value)` を待ち、合えば `[]`、合わなければ issue ごとの `WarningItem` を返却する'
    description: '`validate` の例外・拒否はそのまま投げる（呼ぶ側が通知ブロックにする）'
    args:
      - name: schema
        type: StandardSchemaV1<MdmarkMarkArgs>
        required: true
        description: 拡張の `schema`
      - name: value
        type: MdmarkMarkArgs
        required: true
        description: マーカーの引数
    returns:
      type: Promise<WarningItem[]>
      description: 合わない項目。合えば空
    callees:
      - '#functions[formatIssue]'
    unit_tests:
      - name: test_validate_mark_args
        case: 正常
        summary: 合う値は空を返却する
        condition: 'valibot 1.5.0 の `strictTuple` で英小文字 1 つを許す schema と `{ args: ["world"], keys: {} }`'
        mock: なし
        expected: '`[]`'
      - name: test_validate_mark_args_when_invalid
        case: 正常
        summary: 合わない値は issue ごとの項目を返却する
        condition: '同じ schema と `{ args: ["World", "2"], keys: {} }`'
        mock: なし
        expected: ラベルが `1 つ目の World`・`2 つ目の 2` の 2 項目
      - name: test_validate_mark_args_when_rejected
        case: 異常
        summary: validate の拒否を投げる
        condition: '`validate` が `Promise.reject(new Error("boom"))` の schema'
        mock: なし
        expected: '`boom` のエラーで拒否される'
  - name: formatIssue
    title: issue を警告の項目にする
    container: src/extensions.ts
    kind: 関数
    scope: internal
    summary: issue の `path`（要素が `{ key }` なら `key` を読み込む）が `args` と位置に届けば `{位置+1} つ目の {値}`、`keys` とキーに届けば `{キー}=`、それ以外はラベル無しにし、`message` を本文にする
    args:
      - name: issue
        type: StandardSchemaV1.Issue
        required: true
        description: validate の issue
      - name: value
        type: MdmarkMarkArgs
        required: true
        description: 検査した引数（位置の値を参照する）
    returns:
      type: WarningItem
      description: 警告の項目
    unit_tests:
      - name: test_format_issue
        case: 正常
        summary: 位置まで届く path を位置と値のラベルにする
        condition: '`path` が `[{ key: "args" }, { key: 1 }]`、値の `args` が `["World", "2"]`'
        mock: なし
        expected: '`{ label: "2 つ目の 2", message }`'
      - name: test_format_issue_when_key
        case: 正常
        summary: キーまで届く path を `{キー}=` にする
        condition: '`path` が `["keys", "lang"]`'
        mock: なし
        expected: ラベルが `lang=`
      - name: test_format_issue_when_no_position
        case: 正常
        summary: 位置を持たない issue はラベル無し
        condition: '`path` が `["args"]` と、`path` が無い issue'
        mock: なし
        expected: どちらもラベルが空で、本文が `message`
