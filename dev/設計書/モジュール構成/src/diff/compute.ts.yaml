id: MOD-472-190
title: ライブラリ本体 / 差分 / compute.ts
test_files:
  - tests/unit/src/diff/compute.test.ts
data_models:
  - name: DiffLine
    title: 差分の行
    container: src/diff/compute.ts
    usecase: 読者が文書の 2 つのリビジョンを比べて差分を確認する
    role: DTO
    summary: 比べた 1 行
    properties:
      - name: kind
        type: '"same" | "del" | "add"'
        description: 同じ行・前にだけある行・後にだけある行
      - name: parts
        type: '{ text: string; changed: boolean }[]'
        description: 行の文字を切った並び。対の行で変わった単語だけ `changed` が true。対にならない行は 1 つだけで false
  - name: DiffBlock
    title: 差分の塊
    container: src/diff/compute.ts
    usecase: 読者が埋め込んだ HTML の差分を描いた結果の前と後に切り替える
    role: DTO
    summary: 行の塊か、埋め込んだ HTML の範囲の塊
    description: '`{ type: "lines"; lines: DiffLine[] } | { type: "html"; lines: DiffLine[]; changed: boolean; before: string | null; after: string | null }`。`before`・`after` は範囲の `html` のコードブロックの中身で、その側に範囲が無ければ `null`'
  - name: DiffResult
    title: 差分の結果
    container: src/diff/compute.ts
    usecase: 読者が文書の 2 つのリビジョンを比べて差分を確認する
    role: DTO
    summary: 比べた結果
    properties:
      - name: blocks
        type: DiffBlock[]
        description: 上から順の塊
      - name: counts
        type: '{ del: number; add: number }'
        description: 削除した行と追加した行の数。どちらも 0 なら変更が無い
functions:
  - name: computeDiff
    title: 差分を計算する
    container: src/diff/compute.ts
    summary: 2 つの Markdown のソースを、空白だけの行を除いて行ごとに比べ、対の行を単語ごとに比べ、埋め込んだ HTML の範囲を塊に分ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ before: string; after: string; segmenter: Intl.Segmenter | undefined; engine?: DiffEngine }'
        required: true
        description: '`before`・`after` は前と後の Markdown、`segmenter` は単語の区切り（持たないブラウザでは `undefined`）、`engine` は既定 `jsdiffEngine`'
    returns:
      type: DiffResult
      description: 塊の並びと行の数
    process: |-
      1. 前と後を行に分け、空白だけでない行をそれぞれ行末に改行を付けてつなぎ、`engine.lines` で比べる（空白だけの行どうしの一致を、変えていない行の手がかりにしない。最後の行の改行の有無は比べない）。比べた切れを行に分けて `same`・`del`・`add` の行の並びにし、除いた空白だけの行を、前と後のそれぞれで直前の空白でない行（無ければソースの先頭）の後ろに戻す。付けた先が `same` の行かソースの先頭なら、前と後の空白だけの行を前から順に対にし、文字が同じ対を `same`、文字が違う対を `del` と `add`、対にならない行をその側の `del` か `add` にする。付けた先が `del`・`add` の行なら、その側の空白だけの行を同じ `del`・`add` にする。変えた塊の中では削除した行を先、追加した行を後に並べる
      2. 変えた塊ごとに、削除した行と追加した行を前から順に対にし、対の行を `engine.words` で比べて `parts` を作る（削除した側は `removed` を、追加した側は `added` を `changed` にする）。対にならない行は 1 つの切れにする
      3. 行を上から読み込み、`<!-- html -->` から `<!-- /html -->` までの行を `html` の塊、それ以外を `lines` の塊にまとめる。`html` の塊は、`same` 以外の行を持つかで `changed` を決め、`add` を除いた行と `del` を除いた行からそれぞれの側の `html` のコードブロックの中身を取り出す（その側に範囲の行が無ければ `null`）
      4. `del`・`add` の行を数えて `counts` にする
    unit_tests:
      - name: test_compute_diff
        case: 正常
        summary: 行の差と対の行の単語の差を出す
        condition: '段落の単語 `差分` を `変更` に書き換え、行を 1 つ追加し、別の行を 1 つ削除する。`segmenter` は `new Intl.Segmenter("ja", { granularity: "word" })`'
        mock: なし（既定の `jsdiffEngine`）
        expected: '`counts` が `{ del: 2, add: 2 }`。書き換えた行の対で `changed` の切れが `差分` と `変更` だけ'
      - name: test_compute_diff_when_no_segmenter
        case: 正常
        summary: 単語の区切りが無ければ 1 文字ずつ比べる
        condition: 同じ入力で `segmenter` が `undefined`
        mock: なし
        expected: 対の行の `changed` の切れが、変わった文字だけ
      - name: test_compute_diff_when_same
        case: 正常
        summary: 同じ本文なら数が 0
        condition: 前と後が同じ Markdown
        mock: なし
        expected: '`counts` が `{ del: 0, add: 0 }` で、全ての行が `same`'
      - name: test_compute_diff_when_html
        case: 正常
        summary: 埋め込んだ HTML の範囲を塊にし、前と後の中身を取り出す
        condition: 表のセルの数を変えた範囲・変えていない範囲・後にだけある範囲
        mock: なし
        expected: '`html` の塊が 3 つ。`changed` が順に true・false・true。3 つ目の `before` が `null`'
      - name: test_compute_diff_when_engine
        case: 正常
        summary: 指定した計算を使用する
        condition: '`engine` に、全ての行を削除して追加する切れを返却する `lines` を指定する'
        mock: '`engine` を差し替える'
        expected: 全ての行が `del` か `add` になる
      - name: test_compute_diff_when_one_line_paragraphs
        case: 正常
        summary: 1 行の段落だけの文書で、空行の一致を手がかりにせず、変えていない段落を同じ行にする
        condition: '前: `A\n\nC\n\nD\n`。後: `A\n\nB\n\nC\n`'
        mock: なし（既定の `jsdiffEngine`）
        expected: '行の並びが `same` の `A`・`same` の空行・`add` の `B`・`add` の空行・`same` の `C`・`del` の空行・`del` の `D` の順。`counts` が `{ del: 2, add: 2 }`'
      - name: test_compute_diff_when_blank_line_added
        case: 正常
        summary: 空行だけを追加した変更を、追加した空行にする
        condition: '前: `X\nY\n`。後: `X\n\nY\n`'
        mock: なし
        expected: '行の並びが `same` の `X`・`add` の空行・`same` の `Y` の順。`counts` が `{ del: 0, add: 1 }`'
      - name: test_compute_diff_when_blank_text_differs
        case: 正常
        summary: 文字の違う空白だけの行は、削除した行と追加した行にする
        condition: '前: `A\n␣␣\nB\n`（`␣` は空白）。後: `A\n\nB\n`'
        mock: なし
        expected: '行の並びが `same` の `A`・`del` の `␣␣`・`add` の空行・`same` の `B` の順'
      - name: test_compute_diff_when_leading_blank_lines
        case: 正常
        summary: 先頭の空行はソースの先頭に付け、前と後で対にする
        condition: '前: `\n\nA\n`。後: `\nA\n`'
        mock: なし
        expected: '行の並びが `same` の空行・`del` の空行・`same` の `A` の順'
      - name: test_compute_diff_when_last_newline_missing
        case: 正常
        summary: 最後の行の改行の有無は比べない
        condition: '前: `A\nB`。後: `A\nB\n`'
        mock: なし
        expected: '`counts` が `{ del: 0, add: 0 }` で、全ての行が `same`'
    callees:
      - '#function_types[DiffEngine]'
    refs:
      - IF-472-35#constraints[差分の計算]
      - LIB-472-9#
function_types:
  - name: DiffEngine
    title: 差分の計算の関数型
    container: src/diff/compute.ts
    summary: 行と単語の比較。既定は jsdiff の `diffLines`・`diffWords`・`diffChars` を包む `jsdiffEngine`、単体テストで差し替える
    args:
      - name: lines
        type: '(pair: { before: string; after: string }) => DiffChange[]'
        description: 行ごとに比べる（`diffLines`）
      - name: words
        type: '(pair: { before: string; after: string; segmenter: Intl.Segmenter | undefined }) => DiffChange[]'
        description: '単語ごとに比べる。`segmenter` が無いときは 1 文字ずつに切って比べる（`diffWords` の `intlSegmenter`、無ければ `diffChars`）。`DiffChange` は `{ value: string; added: boolean; removed: boolean }`'
    returns:
      type: '-'
      description: 上の 2 つを持つオブジェクト
