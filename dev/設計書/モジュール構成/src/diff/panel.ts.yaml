id: MOD-472-192
title: ライブラリ本体 / 差分 / panel.ts
test_files:
  - tests/unit/src/diff/panel.browser.test.ts
constants:
  - name: LOADING_DELAY_MS
    title: 読み込み中を出すまでの待ち
    container: src/diff/panel.ts
    summary: 取り出し元の待ちがこれを過ぎたら読み込み中の文を出す（外部規約『表示の安定』の 1 秒）
    value: '1000'
  - name: SPINNER_DELAY_MS
    title: 回る表示を追加するまでの待ち
    container: src/diff/panel.ts
    summary: 取り出し元の待ちがこれを過ぎたら回る表示を追加する（同じ規約の 2 秒）
    value: '2000'
  - name: DIFF_HIDDEN_ATTRIBUTE
    title: 差分で隠した要素の属性
    container: src/diff/panel.ts
    summary: '差分を開いている間に隠す本文の要素と右側の目次に付ける属性。`index.css` が `display: none !important` で隠す'
    value: '"data-mdmark-diff-hidden"'
    status: planned
    introduced:
      pr: 166
functions:
  - name: attachDiff
    title: 差分を付ける
    container: src/diff/panel.ts
    summary: 描いた文書に「変更表示」と差分の場所を配置し、開く・もう一度選ぶ・閉じるを受け取って取り出し元を呼び、差分を描く。削除する関数を返却する
    kind: 関数
    scope: internal
    side_effects: '`root` の中に要素を配置し、本文の要素と `hideWith` の要素に `DIFF_HIDDEN_ATTRIBUTE` を付与・解除する。取り出し元を呼ぶ。取り出せないときは `console.error` に出す'
    args:
      - name: options
        type: '{ root: HTMLElement; source: DiffSource; docId: string; renderHtml: DiffHtmlRenderer; hideWith?: HTMLElement[]; open?: boolean }'
        required: true
        description: '`root` は描いた本文（右側の目次を配置したときは本文の列）、`source` と `docId` は `mount` に指定されたもの、`renderHtml` は埋め込んだ HTML を文書と同じ描き方で描き、操作を付ける関数を返却する関数、`hideWith` は差分を開いている間、`root` の外で一緒に隠す要素（右側の目次）、`open` は配置した時点で開くか（既定 `false`。`mount` の `diffMode` が `open` のとき `true`）'
    returns:
      type: () => void
      description: 差分を閉じ、待ちと受け取りとミニマップを片付け、配置した要素を取り除く関数
    process: |-
      1. `root` の直下の最初の `h1` の後ろ（H1 のセクションでは見出しとセクションの中身の間。無ければ先頭）に、差分を開くボタン（`renderDiffToggle`）と `hidden` の差分の場所を配置する。場所の `id` はモジュールの通し番号でページの中で一意にする。`open` が `true` なら、配置した後に手順 2 の開くときと同じことをする
      2. ボタンを押すと開くか閉じる。開くときは、`h1`・ボタン・場所以外の `root` の子と `hideWith` の要素に `DIFF_HIDDEN_ATTRIBUTE` を付けて隠し（`hidden` は書き換えないため、セクションの開閉と影響し合わない）、開いた世代を 1 進め、手順 3 をする。閉じるときは世代を 1 進め、ミニマップを削除し、場所を空にして `hidden` にし、付けた `DIFF_HIDDEN_ATTRIBUTE` を削除する（セクションはそのときの開閉のまま）
      3. 待ちの間、`LOADING_DELAY_MS` を過ぎたら場所に `renderDiffMessage({ kind: "loading" })`、`SPINNER_DELAY_MS` を過ぎたら `spinner: true` に替える。`source.revisions(docId)` を待ち、世代が変わっていたら何もしない。拒否か `checkRevisions` が投げたら、場所を `renderNotice({ name: docId, source: "diff-revisions" })` にして終わる
         - `[error]` リビジョンの一覧を取り出せない（`revisions`・`docId`・元のエラーを `console.error` の引数に並べる）
      4. リビジョンが 1 つなら `renderDiffMessage({ kind: "single" })` を出して終わる。2 つ以上なら、前に 2 番目・後に 1 番目を選んでリビジョンの選択（`renderRevisionPicker`）を配置し、手順 5 をする。前をもう一度選んだら後の選べない項目を修正し、後が前以前なら前の 1 つ新しいリビジョンに移す。もう一度選ぶたびに手順 5 をする
      5. 選んだ 2 つの `source.content({ docId, revisionId })` を並んで待ち（再選択の世代を進め、古い待ちの結果は描かない）、待ちの間は手順 3 と同じタイマーで、`LOADING_DELAY_MS` を過ぎたら行の場所を `renderDiffMessage({ kind: "loading" })` にして数の文とミニマップを削除し、`SPINNER_DELAY_MS` を過ぎたら `spinner: true` に替える。拒否か文字列でないものがあれば、選択を残して行の場所を `renderNotice({ name: 取り出せなかったリビジョンの説明, source: "diff-content" })` にし、数の文とミニマップを削除する
         - `[error]` 本文を取り出せない（`content`・`docId`・リビジョンの `id`・元のエラーか合わなかった値を並べる）
      6. `computeDiff` で比べる（`segmenter` は `Intl.Segmenter` があれば `ja`・`word` で作る）。数がどちらも 0 なら `renderDiffMessage({ kind: "same" })` を出す。そうでなければ `renderDiffLines` で行を描き（`html` の塊の `before`・`after` は `renderHtml` を経由する）、配置した前と後のプレビューの中身ごとに `scopeIds` で `id` に側ごとの頭（`{場所の id}-{範囲の番号}-{before か after}-`）を付けてから `renderHtml` の `attach` で操作を付け、削除する関数を記録する（再描画する・閉じる・削除するときに呼ぶ）。数の文を書き換え、埋め込んだ HTML の見方のボタンに受け取りを付け、`attachMinimap` でミニマップを付ける
      7. 削除する関数は、世代を進め、待ちのタイマー・受け取り・ミニマップを削除し、配置したボタンと場所を取り除いて付けた `DIFF_HIDDEN_ATTRIBUTE` を削除する
    unit_tests:
      - name: test_attach_diff
        case: 正常
        summary: 開くと一覧と 2 つの本文を取り出して差分を描く
        condition: '`h1` と段落を描いた `root`。`r3`・`r2`・`r1` を返却する取り出し元'
        mock: 取り出し元は呼ばれた引数を記録する関数
        expected: 開く前は `revisions` が呼ばれない。開くと `content` が `r2`・`r3` で呼ばれ、段落が `data-mdmark-diff-hidden` を持ち、`mdmark-diff-line` がある
      - name: test_attach_diff_when_reselected
        case: 正常
        summary: 前をもう一度選ぶと後の選択を修正して再描画する
        condition: 開いた後に前の欄で `r1` を選ぶ
        mock: 取り出し元は呼ばれた引数を記録する関数
        expected: '`content` が `r1`・`r3` で呼ばれ、後の欄の `r1` が `disabled`'
      - name: test_attach_diff_when_stale
        case: 正常
        summary: 待つ間にもう一度選ぶと、前の待ちの結果を描かない
        condition: 1 回目の `content` を待たせたままもう一度選び、2 回目を先に返却してから 1 回目を返却する
        mock: 合図で返却する取り出し元
        expected: 行が 2 回目の結果のまま
      - name: test_attach_diff_when_loading
        case: 正常
        summary: 待ちが 1 秒・2 秒を過ぎると読み込み中と回る表示を出す
        condition: '`revisions` を返却せずに時計を 1 秒、2 秒進める'
        mock: Vitest の偽の時計
        expected: 1 秒で `変更を読み込んでいます`、2 秒で回る表示が出る
      - name: test_attach_diff_when_revisions_rejected
        case: 異常
        summary: 一覧を取り出せないと通知ブロックを出す
        condition: '`revisions` が拒否する'
        mock: '`console.error` を記録する関数で包む'
        expected: '場所が `renderNotice({ name: "guide", source: "diff-revisions" })` の HTML。`console.error` に `revisions` と元のエラー'
      - name: test_attach_diff_when_content_rejected
        case: 異常
        summary: 本文を取り出せないと選択を残して通知ブロックを出す
        condition: '`content` が `r2` で拒否する'
        mock: '`console.error` を記録する関数で包む'
        expected: 選択が残り、行の場所が `diff-content` の通知ブロック
      - name: test_attach_diff_when_detached
        case: 正常
        summary: 削除すると配置した要素を取り除き、本文を戻す
        condition: 開いた後に削除する関数を呼ぶ
        mock: なし
        expected: ボタンと場所が無く、段落が `data-mdmark-diff-hidden` を持たない。ミニマップの帯が無い
      - name: test_attach_diff_when_content_loading
        case: 正常
        summary: もう一度選んだ本文の待ちが 1 秒を過ぎると、前の差分に替えて読み込み中を出す
        condition: 開いた後に前の欄で `r1` を選び、`content` を返却せずに時計を 1 秒、2 秒進める
        mock: Vitest の偽の時計。取り出し元は 2 回目の `content` を合図まで返却しない
        expected: 1 秒で行の場所が `変更を読み込んでいます` になり、数の文が空、2 秒で回る表示が出る。選ぶ欄は残る
      - name: test_attach_diff_when_preview_attached
        case: 正常
        summary: プレビューの前と後に操作を付け、再選択と閉じるで削除する
        condition: 変えた埋め込んだ HTML の範囲を 1 つ持つ 2 つの本文。開いた後にもう一度選び、閉じる
        mock: '`renderHtml` は、`attach` に指定された要素と削除する関数を呼んだ回数を記録する偽物'
        expected: 開くと `attach` が前と後のプレビューの中身で 1 回ずつ呼ばれる。もう一度選ぶと前の 2 つが削除され、閉じると全て削除される
      - name: test_attach_diff_when_h1_section
        case: 正常
        summary: H1 のセクションでは見出しとセクションの中身の間に配置し、開いている間は右側の目次も隠し、閉じてもセクションの開閉を変えない
        condition: '`# 手引き` のセクションと、閉じた `## 導入` のセクションを `attachSections` で開閉にした `root`。`hideWith` に `aside` を指定し、開いてから閉じる'
        mock: 取り出し元は `r2`・`r1` を返却する関数
        expected: ボタンが `h1` の直後で `section-手引き` の前。開いている間は `section-手引き` と `aside` が `data-mdmark-diff-hidden` を持つ。閉じた後はどちらも持たず、`section-導入` は `hidden="until-found"` のまま
      - name: test_attach_diff_when_open
        case: 正常
        summary: open では配置した時点で開き、押すと閉じる
        condition: '`h1` と段落を描いた `root`。`open: true`。`r2`・`r1` を返却する取り出し元。開いた後に「変更表示」を押す'
        mock: 取り出し元は呼ばれた引数を記録する関数
        expected: 押す前に `revisions` が 1 回、`content` が `r1`・`r2` で呼ばれ、ボタンが `aria-expanded="true"` で段落が `data-mdmark-diff-hidden` を持つ。押した後は `aria-expanded="false"` で段落が属性を持たない
    callees:
      - 'MOD-472-189#functions[checkRevisions]'
      - 'MOD-472-190#functions[computeDiff]'
      - 'MOD-472-193#functions[attachMinimap]'
      - 'MOD-472-194#functions[renderDiffToggle]'
      - 'MOD-472-195#functions[renderRevisionPicker]'
      - 'MOD-472-196#functions[renderDiffLines]'
      - 'MOD-472-199#functions[renderDiffMessage]'
      - MOD-472-310#functions[renderNotice]
      - '#functions[scopeIds]'
    refs:
      - IF-472-35#constraints[差分を開く UI]
      - IF-472-35#constraints[差分の待ち]
      - SCR-472-4#
  - name: scopeIds
    title: id に頭を付ける
    container: src/diff/panel.ts
    summary: 要素の中の `id` に頭を付け、その `id` を指す属性も書き換えて、前と後のプレビューと本文の間で `id` を重ならせない
    kind: 関数
    scope: internal
    side_effects: '`root` の子孫の属性を書き換える'
    args:
      - name: options
        type: '{ root: HTMLElement; prefix: string }'
        required: true
        description: '`root` はプレビューの側の中身、`prefix` は付ける頭'
    returns:
      type: void
      description: なし
    process: |-
      1. `root` の中の `id` を持つ要素を集め、元の `id` から頭を付けた `id` への表を作り、`id` を書き換える
      2. `aria-labelledby`・`aria-describedby`・`aria-controls`・`for` の空白で区切った `id` と、`href` の `#{id}`、属性と `style` の `url(#{id})` のうち、表にあるものを頭を付けた `id` に書き換える。表に無い `id`（範囲の外を指すもの）は変えない
    unit_tests:
      - name: test_scope_ids
        case: 正常
        summary: id と、それを指す属性に頭を付ける
        condition: '`<figcaption id="d-1-title">`・`aria-labelledby="d-1-title"`・`marker-end="url(#d-1-arrow)"` と `<marker id="d-1-arrow">`、範囲の外を指す `aria-describedby="outside"` を持つ要素。`prefix` は `p-1-before-`'
        mock: なし
        expected: '`id` が `p-1-before-d-1-title`・`p-1-before-d-1-arrow` になり、`aria-labelledby` と `marker-end` もそれを指す。`aria-describedby="outside"` は変わらない'
function_types:
  - name: DiffHtmlRenderer
    title: 埋め込んだ HTML を描く関数型
    container: src/diff/panel.ts
    summary: 差分のプレビューの前と後の HTML を文書と同じ描き方で描き、配置した要素に文書と同じ操作を付ける関数を返却する。実体は `mount` が作り、単体テストで差し替える
    args:
      - name: html
        type: string
        description: 範囲の `html` のコードブロックの中身
    returns:
      type: '{ html: string; attach: (root: HTMLElement) => () => void }'
      description: '`html` は描いた範囲の中身。`attach` は、配置した要素に図の拡大・ツールチップ・操作できる部品などの操作を付け、削除する関数を返却する'
