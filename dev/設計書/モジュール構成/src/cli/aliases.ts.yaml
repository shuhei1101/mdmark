id: MOD-472-124
title: ライブラリ本体 / CLI / aliases.ts
test_files:
  - tests/unit/src/cli/aliases.test.ts
functions:
  - name: loadAliases
    title: エイリアスを読み込む
    container: src/cli/aliases.ts
    usecase: 共通
    summary: 設定の `aliases` の行の `paths` を設定ファイルのフォルダから参照して YAML を読み込み、`buildAliases` に指定して、エイリアスとずれを返却する
    description: '`check`・`export`・`build` が共通で使用する。オブジェクトで `enabled` が `false` でない行ごとに、`paths` の各 glob を `node:fs/promises` の `glob`（`cwd` は設定ファイルのフォルダ。`globFiles` と同じやり方）で引き、該当したファイルを重ねずパスの順に並べる。該当するファイルが 0 件の行は `alias_no_files`（`file` は設定ファイル、`where` は `aliases[{行の位置}].paths`、`message` は ```{paths を `・` で並べた}` に該当するファイルがありません。`paths` を修正してください。``）にする。該当したファイルは `yaml` で読み込み、読み込めないファイルは `alias_unreadable`（`file` はそのファイル、`where` は空、`message` は `loadConfig` と同じ構造の ``{行} 行目を YAML として読み込めません（{理由}）。字下げと記載方法を修正してください。``）にしてそのファイルを使用しない。読み込めたファイルを `MdmarkAliasSource`（`path` は設定ファイルのフォルダからの相対パス）にして、`config.aliases` の行と一緒に `buildAliases`（`configFile` は設定ファイルの名前）に指定し、返った `problems` を `CheckIssue` にする。ずれの並びは行の順で、行ごとに `alias_no_files`・`alias_unreadable` をその行の場所に配置し、`buildAliases` の `problems` はその後ろに返った順で配置する。設定に `aliases` が無ければファイルを読み込まず `{ aliases: undefined, issues: [], files: [] }` を返却する。`files` は行の `paths` に該当した YAML の絶対パス（読み込めなかったファイルを含み、重ねずパスの順）で、VS Code 拡張機能のプレビューが見張るファイルに使用する'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: loaded
        type: LoadedConfig
        required: true
        description: 読み込んだ設定（`config.aliases` は `validateConfig` が Schema に合わない行を `null` にしたもの）
    returns:
      type: 'Promise<{ aliases: MdmarkAlias[] | undefined; issues: CheckIssue[]; files: string[] }>'
      description: 作ったエイリアス（`env` を含まない）と、エイリアスのずれと、該当した YAML の絶対パス
    callees:
      - MOD-472-260#functions[buildAliases]
    refs:
      - IF-472-39#constraints[エイリアスの点検]
    unit_tests:
      - name: test_load_aliases
        case: 正常
        summary: 行の paths の YAML を読み込んでエイリアスを作る
        condition: '`aliases` に `alias_type: command`・`paths: [aliases/commands.yaml]` の行と `alias_type: env`・`paths: [aliases/servers.yaml]` の行、それぞれのファイルにレコード 1 件'
        mock: 一時フォルダ
        expected: '`aliases` が `command` の 1 件、`issues` が空、`files` が `aliases/commands.yaml`・`aliases/servers.yaml` の絶対パスの 2 件'
      - name: test_load_aliases_when_no_files
        case: 異常
        summary: 該当するファイルが無い行を alias_no_files にする
        condition: '`paths: [missing/*.yaml]` の行'
        mock: 一時フォルダ
        expected: '`issues` が 1 件で `kind` が `alias_no_files`、`where` が `aliases[0].paths`、`message` に `missing/*.yaml` が入る'
      - name: test_load_aliases_when_unreadable
        case: 異常
        summary: YAML として読み込めないファイルを alias_unreadable にして使用しない
        condition: '`aliases/a.yaml` が字下げの崩れた YAML、`aliases/b.yaml` が読み込める YAML'
        mock: 一時フォルダ
        expected: '`alias_unreadable` が 1 件で `file` が `aliases/a.yaml`、`aliases` に `b.yaml` のレコードだけが入り、`files` が `a.yaml`・`b.yaml` の 2 件'
      - name: test_load_aliases_when_disabled_or_null
        case: 正常
        summary: enabled が false の行と null の行は読み込まない
        condition: '`enabled: false` で該当するファイルの無い行と、`null` の行'
        mock: 一時フォルダ
        expected: '`issues` が空、`aliases` が空の配列'
      - name: test_load_aliases_when_no_aliases
        case: 正常
        summary: 設定に aliases が無ければ何も読み込まない
        condition: '`aliases` の無い設定'
        mock: なし
        expected: '`aliases` が `undefined`、`issues` と `files` が空'
    status: planned
    introduced:
      pr: 176
