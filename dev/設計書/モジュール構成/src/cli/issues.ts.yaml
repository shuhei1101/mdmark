id: MOD-472-125
title: ライブラリ本体 / CLI / issues.ts
test_files:
  - tests/unit/src/cli/issues.test.ts
functions:
  - name: formatCheckIssue
    title: ずれを 1 行にする
    container: src/cli/issues.ts
    usecase: 共通
    kind: 関数
    scope: public
    summary: '`CheckIssue` を `{file}:{where}: {kind}: {message}`（`where` が空なら `{file}: {kind}: {message}`）の 1 行にする'
    description: '`mdmark check` の出力・`mdmark export` の警告・`mdmark upgrade` の点検のずれ・VS Code 拡張機能のプレビューのエイリアスの警告が使用する。拡張機能ホストのまとめに `check.ts` の依存（ネイティブバージョンの `esbuild` など）を入れないため、値の import を持たない `src/cli/issues.ts` に配置し、`CheckIssue` は型だけを `check.ts` から import する'
    args:
      - name: issue
        type: CheckIssue
        required: true
        description: ずれ
    returns:
      type: string
      description: ずれの 1 行
    unit_tests:
      - name: test_format_check_issue
        case: 正常
        summary: where を持つずれは file と where を `:` でつなぐ
        condition: '`file` が `mdmark.config.yaml`・`where` が `aliases[1].paths`・`kind` が `alias_no_files`・`message` が `m`'
        mock: なし
        expected: '`mdmark.config.yaml:aliases[1].paths: alias_no_files: m`'
      - name: test_format_check_issue_when_no_where
        case: 正常
        summary: where が空のずれは file だけを配置する
        condition: '`file` が `aliases/a.yaml`・`where` が空・`kind` が `alias_unreadable`・`message` が `m`'
        mock: なし
        expected: '`aliases/a.yaml: alias_unreadable: m`'
    callers:
      - 'MOD-472-110#functions[runCheck]'
      - 'MOD-472-120#functions[prepareEmbeds]'
      - MOD-472-30#
      - MOD-472-90#classes[PreviewPanel]
    status: planned
