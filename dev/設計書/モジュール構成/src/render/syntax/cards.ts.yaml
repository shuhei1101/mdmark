id: MOD-472-272
title: ライブラリ本体 / 記法 / cards.ts
test_files:
  - tests/unit/src/render/syntax/cards.test.ts
data_models:
  - name: CardSpec
    title: カードの指定
    container: src/render/syntax/cards.ts
    summary: リンク 1 つだけの段落から作る、部品『カード』へ指定する値
    properties:
      - name: kind
        type: '"link" | "file"'
        description: カードの種類
      - name: href
        type: string
        description: リンク先
      - name: title
        type: string
        description: タイトル。`link` で URL をそのまま記載したときはスキームを除いた URL
      - name: fileKind
        type: AttachmentKind | undefined
        description: '`file` のときの種類'
    refs:
      - IF-472-34#constraints[リンクと添付のカード]
    status: planned
    introduced:
      pr: 263
constants:
  - name: ATTACHMENT_KINDS
    title: 添付の拡張子と種類
    container: src/render/syntax/cards.ts
    summary: リンク先のパスの拡張子（小文字）から添付の種類（`AttachmentKind`）を参照する。CLI の点検も使用する
    entries:
      - key: pdf
        value: pdf
      - key: doc・docx・odt・rtf
        value: doc
      - key: xls・xlsx・ods・csv・tsv
        value: sheet
      - key: ppt・pptx・odp・key
        value: slide
      - key: zip・gz・tar・7z
        value: archive
      - key: txt
        value: text
    refs:
      - IF-472-34#constraints[リンクと添付のカード]
    status: planned
    introduced:
      pr: 263
functions:
  - name: cardOf
    title: リンクからカードの指定を作る
    container: src/render/syntax/cards.ts
    kind: 関数
    scope: internal
    summary: リンク先のパス（クエリとフラグメントを除く）の拡張子が `ATTACHMENT_KINDS` にあれば `file`、`http`・`https` の URL なら `link` の `CardSpec` を返却する。`#` で始まるリンク・`mailto:`・拡張子 `md` のリンクと、それ以外は `undefined`
    args:
      - name: href
        type: string
        required: true
        description: リンク先
      - name: text
        type: string
        required: true
        description: 記載した文字
      - name: autolinked
        type: boolean
        required: true
        description: URL をそのまま記載したリンクか（タイトルをスキームを除いた URL にする）
    returns:
      type: CardSpec | undefined
      description: カードの指定
    unit_tests:
      - name: test_card_of
        case: 正常
        summary: リンクと添付を見分ける
        condition: '`https://example.com/docs/guide`（URL のまま）・`[設計の資料](https://example.com/design)`・`[仕様書](files/spec.pdf?v=1)`'
        mock: なし
        expected: '`{ link, title: example.com/docs/guide }`・`{ link, title: 設計の資料 }`・`{ file, title: 仕様書, fileKind: pdf }`'
      - name: test_card_of_when_not_card
        case: 正常
        summary: カードにしないリンクは undefined
        condition: '`#導入`・`mailto:a@example.com`・`guide.md`・`ftp://example.com/a`'
        mock: なし
        expected: どれも `undefined`
    status: planned
    introduced:
      pr: 263
  - name: buildCards
    title: リンクと添付のカードにする
    container: src/render/syntax/cards.ts
    kind: 関数
    scope: internal
    summary: コアルール。`cards` がオンなら、段落の `inline` の子が前後の空白の `text` を除いて `link_open`・文字・`link_close` だけのものを `cardOf` で見分け、カードになるものは段落を部品『カード』の `html_block` に置き換える。脚注の定義の囲み（`mdmark_footnote_def_open`〜`close`）の中の段落は、ツールチップでリンクのまま読み込めるようカードにしない
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[cardOf]'
      - MOD-472-332#functions[renderCard]
    refs:
      - IF-472-34#constraints[リンクと添付のカード]
    unit_tests:
      - name: test_build_cards
        case: 正常
        summary: リンク 1 つだけの段落をカードにする
        condition: '`https://example.com/docs/guide` だけの段落と `[仕様書](files/spec.pdf)` だけの段落'
        mock: なし
        expected: '`<a class="mdmark-card" data-card="link" href="https://example.com/docs/guide">` と `<a class="mdmark-card" data-card="file" data-file-kind="pdf" href="files/spec.pdf">`'
      - name: test_build_cards_when_inline
        case: 正常
        summary: 文の中のリンクはカードにしない
        condition: '`詳しくは https://example.com/docs を確認する。`'
        mock: なし
        expected: '`mdmark-card` が無い'
      - name: test_build_cards_when_feature_off
        case: 正常
        summary: cards がオフならリンクのまま
        condition: '`env.features.cards` が `false` で URL だけの段落'
        mock: なし
        expected: '`mdmark-card` が無く、`a` がある'
    status: planned
    introduced:
      pr: 263
