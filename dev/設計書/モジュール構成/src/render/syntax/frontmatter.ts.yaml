id: MOD-472-302
title: ライブラリ本体 / 記法 / frontmatter.ts
test_files:
  - tests/unit/src/render/syntax/frontmatter.test.ts
functions:
  - name: insertFrontmatter
    title: フロントマターの表示を差し込む
    container: src/render/syntax/frontmatter.ts
    kind: 関数
    scope: internal
    summary: コアルール（機能を決めた後、取り込みの後、コードブロックの飾りより前）。`frontmatter` がオンで `env.frontmatter` の中身が空白だけでないとき、中身を持つ `fence` のトークン（`info` は `yaml`、`map` はフロントマターの 2 行目から閉じる行まで）を作り、その前後に `renderFrontmatter` の HTML を `SLOT_MARKER` で分けた `ownBlock` を置いて、`state.tokens` の先頭に入れる
    description: コードブロックの描き方（言語のラベル・コピーのボタン・色分け）は、差し込んだ `fence` に後のコアルールと `renderer.rules.fence` がそのまま当てる。`ownBlock` が `nonce` の印を付けるため、`sanitize` の後も折りたたみの class が残る。取り込んだ文書（`expandIncludes`）はこのルールを通らず、表示を持たない
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態。`state.env.frontmatter` を読む
    side_effects: '`state.tokens` の先頭に 3 つのトークンを入れる'
    callees:
      - MOD-472-339#functions[renderFrontmatter]
    refs:
      - IF-472-34#constraints[フロントマター]
    unit_tests:
      - name: test_insert_frontmatter
        case: 正常
        summary: 機能がオンなら、折りたたみの開きと閉じの間に yaml の fence を入れる
        condition: '`env.frontmatter` が `{ content: "title: a", endLine: 2 }`、`features.frontmatter` が `true`'
        mock: なし
        expected: '`state.tokens` の先頭が `html_block`（`mdmark-frontmatter` を持ち `data-mdmark-own` の印を持つ）・`fence`（`info` が `yaml`、`content` が `title: a\n`、`map` が `[1, 3]`）・`html_block`（`</details>`）'
      - name: test_insert_frontmatter_when_off
        case: 正常
        summary: 機能がオフなら何も入れない
        condition: 同じ `env.frontmatter`、`features.frontmatter` が `false`
        mock: なし
        expected: '`state.tokens` が変わらない'
      - name: test_insert_frontmatter_when_blank
        case: 正常
        summary: 中身が空白だけなら何も入れない
        condition: '`env.frontmatter` が `{ content: "  ", endLine: 2 }`、`features.frontmatter` が `true`'
        mock: なし
        expected: '`state.tokens` が変わらない'
    status: planned
    introduced:
      pr: 422
