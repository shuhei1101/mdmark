id: MOD-472-283
title: ライブラリ本体 / 記法 / steps.ts
test_files:
  - tests/unit/src/render/syntax/steps.test.ts
functions:
  - name: buildSteps
    title: ステップにする
    container: src/render/syntax/steps.ts
    kind: 関数
    scope: internal
    summary: コアルール。`steps` がオンなら、`steps` の範囲の最初の番号付きリスト（入れ子は除く）の `ol` に class `mdmark-steps` を付ける。マーカーの引数は `readStepsOptions` で読み込み、読み込めない指定の警告と、`skipped` を `pushSkippedArgs` で範囲の前に差し込む。`collapse` が `closed`・`open` なら、その `ol` を `renderCollapsible` の折り畳み（見出しは `title` か `手順（{入れ子を除く項目の数} ステップ）`）に入れる。番号付きリストが無ければ警告を差し込む
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - 'MOD-472-213#functions[pushWarning]'
      - '#functions[readStepsOptions]'
      - MOD-472-325#functions[renderCollapsible]
    unit_tests:
      - name: test_build_steps
        case: 正常
        summary: 範囲の番号付きリストを手順にし、入れ子はそのまま
        condition: 入れ子の番号付きリストを持つ 3 項目のリストを囲んだ範囲
        mock: なし
        expected: 外側の `ol` だけが class `mdmark-steps` を持つ
      - name: test_build_steps_when_no_list
        case: 正常
        summary: 番号付きリストが無い範囲は警告を差し込む
        condition: 番号の無いリストを囲んだ範囲
        mock: なし
        expected: 警告と `<ul>` があり、`mdmark-steps` が無い
      - name: test_build_steps_when_collapsed
        case: 正常
        summary: closed・open のステップを title= か項目の数の見出しの折り畳みに入れる
        condition: '`<!-- steps: closed -->` で入れ子の番号付きリストを持つ 2 項目のリスト、`<!-- steps: open title=準備 -->` で 3 項目のリストを囲んだ範囲'
        mock: なし
        expected: 1 つ目が `open` を持たない `<details class="mdmark-collapsible"><summary>手順（2 ステップ）</summary><ol class="mdmark-steps">`、2 つ目が `<details class="mdmark-collapsible" open><summary>準備</summary>`
      - name: test_build_steps_when_unreadable_options
        case: 異常
        summary: 読み込めない指定は警告にして折り畳まずに手順にする
        condition: '`<!-- steps: fold -->` と `<!-- steps: title=準備 -->` でそれぞれ 2 項目の番号付きリストを囲んだ範囲'
        mock: なし
        expected: 1 つ目の範囲の前に記載の警告が無く（`fold` は `unknown_mark_arg` になる）、2 つ目の範囲の前の警告の項目に `title=` がある。どちらの `<ol class="mdmark-steps">` も `details` に入らない
  - name: readStepsOptions
    title: ステップのマーカーの指定を読み込む
    container: src/render/syntax/steps.ts
    summary: ステップのマーカーの引数から折り畳みの指定を読み込み、読み込めない指定を 1 つの警告にまとめる
    description: '`readCollapse`（`text` に `mark` の `rest` を指定する）で `closed`・`open`・`title=` を読み込み、その項目を画面設計『文書』の「ステップのマーカーの読み込めない指定」の項目にして 1 つの警告にまとめる。残りの引数（`キー=値` と `キー=値` の構造でない指定）は `skipped` に入れる（`キー=値` の構造でない指定が `titleTail` と同じなら `titleTailItem` の項目にする）'
    kind: 関数
    scope: internal
    args:
      - name: mark
        type: Mark
        required: true
        description: ステップの開きのマーカー
    returns:
      type: '{ collapse: "none" | "closed" | "open"; title?: string; warning?: SyntaxWarning; skipped: SkippedArg[] }'
      description: 折り畳みの指定と、読み込めない指定があれば記載の警告と、スキップした引数
    unit_tests:
      - name: test_read_steps_options
        case: 正常
        summary: open と title= を読み込む
        condition: '`<!-- steps: open title=準備 -->`'
        mock: なし
        expected: '`collapse` が `open`、`title` が `準備` で、`warning` が無い'
      - name: test_read_steps_options_when_none
        case: 正常
        summary: 引数が無ければ折り畳まず警告も無い
        condition: '`<!-- steps -->`'
        mock: なし
        expected: '`collapse` が `none` で、`title` と `warning` が無い'
      - name: test_read_steps_options_when_unreadable
        case: 異常
        summary: 組み合わせの誤りを警告にし、知らない指定とキーをスキップする
        condition: '`<!-- steps: closed open fold size=2 -->`'
        mock: なし
        expected: '`collapse` が `closed`、`warning.items` の `label` が `closed と open` の 1 つ、`skipped` の `arg` が `fold`・`size=`'
      - name: test_read_steps_options_when_title_has_space
        case: 異常
        summary: title= の値の空白の後ろの単語を警告にし、スキップしない
        condition: '`<!-- steps: open title=準備の 手順 -->`'
        mock: なし
        expected: '`title` が `準備の`、`warning.items` の `label` が `手順` の 1 つ、`skipped` が空'
      - name: test_read_steps_options_when_title_followed_by_open
        case: 正常
        summary: title= の直後の open は当て、警告にしない
        condition: '`<!-- steps: title=準備 open -->`'
        mock: なし
        expected: '`collapse` が `open`、`title` が `準備`、`warning` が無く `skipped` が空'
    status: planned
    introduced:
      pr: 225
    callees:
      - 'MOD-472-270#functions[readCollapse]'
