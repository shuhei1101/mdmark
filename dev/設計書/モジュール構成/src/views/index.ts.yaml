id: MOD-472-156
title: ライブラリ本体 / ビューとコメント / index.ts
test_files:
  - tests/unit/src/views/index.browser.test.ts
data_models:
  - name: ViewPartModule
    title: ビューの部品のモジュール
    container: src/views/index.ts
    role: モジュールの構造
    summary: '`dist/view.js` が export する関数'
    properties:
      - name: drawView
        type: '(el: HTMLElement, opts: MdmarkViewOptions) => () => void'
        description: '`mountView` が呼ぶ'
      - name: attachView
        type: '(view: HTMLElement) => () => void'
        description: '`mount` が描いた `div.mdmark-view` ごとに呼ぶ'
functions:
  - name: drawView
    title: ビューを描く
    container: src/views/index.ts
    summary: '`mountView` の指定から、`el` の中に class `mdmark` の要素を配置してビューを描き、表の操作と切り替えを付ける'
    kind: 関数
    scope: public
    side_effects: '`el` の中を書き換え、表の絞り込みのドロワーを開いている間 `document` の受け取りを付ける'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先
      - name: opts
        type: MdmarkViewOptions
        required: true
        description: 検めた指定
    returns:
      type: () => void
      description: 操作を削除し、`el` の中を空にする関数
    process: |-
      1. 項目を `columns` の並びの値の配列にする（キーが無ければ空の文字）
      2. `el` の中を空にし、class `mdmark` の `div` を配置して、その中に `renderView`（`mode` は `default`、無ければ `group` があれば `board`、`filters` は `filter` の列の位置と種類、`icons` は `icons`、`id` はモジュールの通し番号）を入れる
      3. `attachTables` で表の並べ替えと絞り込みを付け、`attachSwitch` で切り替えを付ける
      4. 削除する関数は、両方を削除して `el` の中を空にする
    unit_tests:
      - name: test_draw_view
        case: 正常
        summary: ボードで描き、切り替えで表形式に替える
        condition: 'タイトル・状態・担当の 5 件、`group: "状態"`。1 件目のタイトルは `<script>alert(1)</script>設計`'
        mock: なし
        expected: '`el > .mdmark > .mdmark-view` があり、ボードの列は `未着手`・`進行中`・`完了` の順。タイトルは文字として出て `script` 要素が無い。「表」を押すと表が出てボードが `hidden`、「表」が `aria-pressed="true"`'
      - name: test_draw_view_when_filtered
        case: 正常
        summary: 表形式の絞り込みはボードに該当せず、戻すと残っている
        condition: '`default: "table"`・`filter: { 担当: "select" }`。担当の絞り込みで `佐藤` を選び、ボードに替えて表に戻す'
        mock: なし
        expected: ボードに 5 件の項目が出る。表に戻すと `佐藤` 以外の行が `hidden`
      - name: test_draw_view_when_destroyed
        case: 正常
        summary: 削除すると el が空になる
        condition: 描いた後に削除する関数を呼ぶ
        mock: なし
        expected: '`el` の子が無い'
    refs:
      - IF-472-30#constraints[描くビュー]
      - CMP-472-25#
  - name: attachView
    title: マーカーのビューに付ける
    container: src/views/index.ts
    summary: '`render` が描いた `div.mdmark-view` の `data-view` と中の表から、切り替えとボードを配置して付ける'
    kind: 関数
    scope: public
    side_effects: '`view` の中に要素を追加する'
    args:
      - name: view
        type: HTMLElement
        required: true
        description: '`div.mdmark-view`'
    returns:
      type: () => void
      description: 追加した要素を取り除き、表を元に戻す関数
    process: |-
      1. `data-view` を `ViewSpec` として読み込む。`group` が `null` で `boardDisabled` が空なら何もせず、何もしない関数を返却する
      2. 中の表の見出しの `th` と本文の `td` の文字（`visibleText`）を列名と値にする（`mdmark-table-empty` の行は除く）
      3. 表を囲む要素を `div.mdmark-view-table` で包み、その前に `renderViewSwitch` と `renderViewBoard`（`boardDisabled` のときは空のボード）を配置する
      4. `attachSwitch` で切り替えを付け、`mode` で出し分ける
    unit_tests:
      - name: test_attach_view
        case: 正常
        summary: マーカーの表からボードを追加し、削除すると戻す
        condition: '`data-view` が `{"group":1,"mode":"board","boardDisabled":"","icons":{}}` で、タイトル・状態の表を持つ要素'
        mock: なし
        expected: 切り替えとボードがあり、表が `hidden`。削除すると切り替えとボードが無く、表が `hidden` を持たず `div.mdmark-view-table` が無い
      - name: test_attach_view_when_board_disabled
        case: 正常
        summary: group の列が無いとボードを押せない
        condition: '`boardDisabled` に `w1` を持つ'
        mock: なし
        expected: ボードのボタンが `disabled` で `aria-describedby="w1"`、表が出ている
    refs:
      - IF-472-35#constraints[ビューの操作]
  - name: attachSwitch
    title: 切り替えを付ける
    container: src/views/index.ts
    summary: 切り替えのボタンを押すとボードと表形式を出し分け、`aria-pressed` を修正する
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ view: HTMLElement; mode: "board" | "table" }'
        required: true
        description: ビューの要素と最初のビュー
    returns:
      type: () => void
      description: 受け取りを解除する関数
    process: |-
      1. `mode` で `.mdmark-view-board` と `.mdmark-view-table` の `hidden` と、ボタンの `aria-pressed` を記載する
      2. `.mdmark-view-switch` の `click` を受け、押したボタンの `data-mode` で手順 1 をする（`disabled` のボタンは押せない）
    unit_tests: []
