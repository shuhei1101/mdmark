id: MOD-472-154
title: ライブラリ本体 / ビューとコメント / spec.ts
test_files:
  - tests/unit/src/views/spec.test.ts
data_models:
  - name: MdmarkViewOptions
    title: ビューの引数
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` に指定する項目と表示の指定'
    properties:
      - name: columns
        type: string[]
        description: 列名。表形式の列の並びと、ボードの項目に出す値の並び
      - name: items
        type: Record<string, string>[]
        description: 列名をキーにした項目の値。並びは表の行の順
      - name: group
        type: string | undefined
        description: ボードで列に分ける列名
      - name: default
        type: '"board" | "table" | undefined'
        description: 描いた直後に出すビュー
      - name: filter
        type: Record<string, FilterKind> | undefined
        description: 表形式で絞り込みを付ける列と種類（`FilterKind` は `src/table-logic.ts`）
      - name: icons
        type: Record<string, ViewIconName> | undefined
        description: ボードの列の見出しの値からアイコンの名前を参照する対応。`DEFAULT_VALUE_ICONS` に重ねる
  - name: MdmarkViewHandle
    title: ビューの片付け
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` の Promise の値'
    properties:
      - name: destroy
        type: () => void
        description: '`el` の中を空にし、ビューの操作と `document` の受け取りを解除する。2 回目以降は何もしない'
  - name: ViewSpec
    title: マーカーのビューの指定
    container: src/views/spec.ts
    role: DTO
    summary: '`render` が `div.mdmark-view` の `data-view` に JSON で記載し、`attachView` が読み込む指定'
    properties:
      - name: group
        type: number | null
        description: ボードで分ける列の位置。`group=` が無いか表に無ければ `null`
      - name: mode
        type: '"board" | "table"'
        description: 描いた直後に出すビュー
      - name: boardDisabled
        type: string
        description: '`group=` の列が表に無いときの記載の警告の `id`。それ以外は空'
      - name: icons
        type: Record<string, ViewIconName>
        description: '`icons=` の読み込めた対応'
constants:
  - name: VIEW_ICON_NAMES
    title: 使用できるアイコン
    container: src/views/spec.ts
    summary: ボードの列の見出しに使用できる lucide のアイコンの名前
    value: '["circle", "circle-dashed", "circle-dot", "circle-pause", "circle-check", "circle-x", "inbox", "archive", "clock", "flag", "star", "bug", "eye", "lock", "zap", "ban"]'
  - name: DEFAULT_VALUE_ICONS
    title: 値の既定のアイコン
    container: src/views/spec.ts
    summary: ボードの列の値から既定のアイコンを参照する。無い値は `FALLBACK_VALUE_ICON`
    value: '{ 未着手: "circle-dashed", 進行中: "circle-dot", 保留: "circle-pause", 完了: "circle-check", 中止: "circle-x" }'
  - name: FALLBACK_VALUE_ICON
    title: 対応に無い値のアイコン
    container: src/views/spec.ts
    value: '"circle"'
    summary: 既定の対応にも `icons` にも無い値のアイコン
functions:
  - name: checkViewOptions
    title: ビューの引数を検める
    container: src/views/spec.ts
    summary: '`mountView` の引数がインターフェース定義のとおりかを確認し、合わなければ誤った引数の名前を含む `TypeError` を投げる'
    kind: 関数
    scope: internal
    args:
      - name: el
        type: unknown
        required: true
        description: 描く先
      - name: opts
        type: unknown
        required: true
        description: 指定
    returns:
      type: asserts opts is MdmarkViewOptions
      description: 合えば何も返却しない
    process: |-
      1. `el` が `HTMLElement` でなければ投げる（`el`）
      2. `columns` が 1 つ以上の空でない文字列の配列で重なりが無いか（`opts.columns`）、`items` が配列で要素がオブジェクトか（`opts.items`）を確認する
      3. `group`・`filter` のキーが `columns` にあるか、`filter` の値が `FILTER_KINDS` か、`default` が `board`・`table` で、`group` が無いのに `board` でないか、`icons` の値が `VIEW_ICON_NAMES` かを確認する
    unit_tests:
      - name: test_check_view_options
        case: 正常
        summary: 合う引数では投げない
        condition: '`columns`・`items`・`group`・`default: "table"`・`filter`・`icons` を持つ'
        mock: なし
        expected: 投げない
      - name: test_check_view_options_when_invalid
        case: 異常
        summary: 合わない引数ごとに名前を含めて投げる
        condition: '`columns: []`・列名の重なり・`items` の要素が配列・無い `group`・無い `filter` の列・`filter` の種類 `range`・`group` が無いのに `default: "board"`・`icons` の `rocket` をそれぞれ指定する'
        mock: なし
        expected: それぞれ `TypeError` を投げ、メッセージに `opts.columns`・`opts.items`・`opts.group`・`opts.filter`・`opts.default`・`opts.icons` のうちの該当する名前を含む
    refs:
      - IF-472-30#exceptions[TypeError]
