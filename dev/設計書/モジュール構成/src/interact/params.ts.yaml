id: MOD-472-185
title: ライブラリ本体 / 図 / params.ts
test_files:
  - tests/unit/src/interact/params.browser.test.ts
functions:
  - name: attachParams
    title: 操作できる部品の操作を付ける
    container: src/interact/params.ts
    kind: 関数
    scope: internal
    summary: スライダーの `input` で今の値とグラフの系列を再描画し、写すボタンで `paramJson` を `navigator.clipboard.writeText` で書き込み、結果を `role="status"` に出す。拒まれたら `pre` を出す。点の表は、`mount` が Markdown から読み込んだ `param` の定義を文書の中の並びの順で受け取る（出力の HTML に定義を残さない）
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
      - name: definitions
        type: MdmarkParamDefinition[]
        required: true
        description: '`render` と同じ解析で読み込めた `param` の定義。`div.mdmark-param` の並びと同じ順'
    returns:
      type: () => void
      description: 付けた操作を削除する関数
    callees:
      - 'MOD-472-181#functions[paramJson]'
    unit_tests:
      - name: test_attach_params
        case: 正常
        summary: 値を変えて写す
        condition: スライダーを 8 にして `input` を送信し、写すボタンを押す
        mock: '`navigator.clipboard.writeText` を指定された文字を記録して解決する関数に差し替える'
        expected: '`output` が `8`、記録した文字の `strength.value` が 8、通知が `クリップボードにコピーしました`'
      - name: test_attach_params_when_clipboard_denied
        case: 異常
        summary: 拒まれたら選んで写せる JSON を出す
        condition: 写すボタンを押す
        mock: '`navigator.clipboard.writeText` を `NotAllowedError` で拒まれる関数に差し替える'
        expected: '`pre` が `hidden` を持たず、文字が写すはずだった JSON で、例外が外に出ない'
