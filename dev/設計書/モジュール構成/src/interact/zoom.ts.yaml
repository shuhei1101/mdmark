id: MOD-472-177
title: ライブラリ本体 / 図 / zoom.ts
test_files:
  - tests/unit/src/interact/zoom.browser.test.ts
constants:
  - name: DRAG_THRESHOLD
    title: ドラッグとみなす距離
    container: src/interact/zoom.ts
    summary: 押した位置からこの px を超えて動いたときだけ図を動かしたことにし、リンク先を開かない。超えないうちはグラフの項目のツールチップを優先する
    entries:
      - key: px
        value: '4'
functions:
  - name: attachZoom
    title: 拡大・縮小・移動を付ける
    container: src/interact/zoom.ts
    kind: 関数
    scope: internal
    summary: '表示する枠と中身に、`fitScale` の倍率から `ZOOM.max` までの拡大・縮小（縮小・拡大・倍率のボタンと `+`・`-`・`0`）と、拡大中の移動（移動のボタン・矢印キー・ドラッグ）を付ける。倍率は中身に `transform: scale()` を掛け、大きさのノードを倍率を掛けた大きさにしてスクロールさせる。端のボタンの `disabled`、倍率の文字とスクリーンリーダー向けの名前（`percentBase` が `fit` なら全体が収まる倍率を 100%、`content` なら中身の大きさを 100% とする）、移動のボタンのまとまりの `hidden` を倍率が変わるたびに書き換え、`onChange` に倍率を通知する。`.mdmark-diagram-node-link` の上からもドラッグを始め（文字を選ばせず、リンクの `dragstart` を `preventDefault` してブラウザのリンクのドラッグを始めない）、`DRAG_THRESHOLD` を超えて動いたときだけ動かしたことにする。動かした後の `pointerup` で `window` にキャプチャの `click` の受け取り（次の 1 回を `preventDefault`・`stopPropagation` して削除される）を付け、`setTimeout(0)` でも解除する（`click` が来ない終わり方で受け取りを残さない）。`pointercancel` では受け取りを付けず、`detach` でも解除する。ドラッグを始めたとき（`DRAG_THRESHOLD` を超えたとき）に `onPanStart` を 1 回呼ぶ（超えないまま離したら動かさない）。`fitHeight` は真偽値か、全体が収まる倍率を求めるたびに呼ぶ関数で受ける。`refit()` は今の倍率と位置を保ったまま、全体が収まる倍率（下限）とボタンの状態をもう一度求める。図（`attachDiagrams`）とライトボックス（`attachLightbox`）が使用する'
    args:
      - name: options
        type: '{ viewport: HTMLElement; content: HTMLElement; size: { width: number; height: number }; tools: HTMLElement; onChange?: (zoom: number, fit: number) => void; onPanStart?: () => void; fitHeight?: boolean | (() => boolean); dragIgnore?: string; keyTargets?: HTMLElement[]; percentBase?: "fit" | "content"; fitMin?: number }'
        required: true
        description: 表示する枠・倍率を掛ける中身・中身の大きさ・ボタンを持つ要素（`data-tool` で見分ける）・倍率が変わったときに呼ぶ関数・全体が収まる倍率を高さでも決めるか（既定 `true`。文書の中の図は `false` で幅だけで決める）・ドラッグを始めない要素のセレクタ（押せる要素に加える）・キーを受ける要素（既定は表示する枠とボタンを持つ要素）・倍率の文字の基準（既定 `content`。ライトボックスは画像の大きさを 100% にする）・全体が収まる倍率の下限（既定は下限なし。`attachDiagrams` が図の `data-fit-min` を指定する）
    returns:
      type: '{ reset(): void; fit(): number; refit(): void; detach(): void }'
      description: 全体が収まる倍率に戻す関数・今の全体が収まる倍率を返却する関数・付けた操作を削除する関数
    callees:
      - 'MOD-472-173#functions[fitScale]'
    unit_tests:
      - name: test_attach_zoom
        case: 正常
        summary: 収まる倍率で始め、拡大・縮小と戻す
        condition: 幅 600px の枠に幅 1100 の中身
        mock: なし
        expected: 倍率の文字が `55%` で縮小が `disabled`、拡大の後に `68%`、`0` の後に `55%`、`onChange` が倍率ごとに呼ばれる
      - name: test_attach_zoom_when_panned
        case: 正常
        summary: 拡大中だけ移動のボタンを出し、矢印キーとドラッグで動かす
        condition: 拡大を 2 回押し、枠で `ArrowRight` を押してから左へ 40px ドラッグ
        mock: なし
        expected: 移動のまとまりが `hidden` を持たず、`scrollLeft` が 80 増えた後に 40 増える
      - name: test_attach_zoom_when_detached
        case: 正常
        summary: 削除すると操作が有効にならない
        condition: '`detach()` を呼んで拡大を押す'
        mock: なし
        expected: 倍率が変わらない
      - name: test_attach_zoom_when_percent_base_fit
        case: 正常
        summary: 全体が収まる倍率を 100% として出す
        condition: 幅 600px の枠に幅 1100 の中身、`percentBase` が `fit`。拡大を 1 回押す
        mock: なし
        expected: 倍率の文字が `100%` で始まり、拡大の後に `125%` でスクリーンリーダー向けの名前が `倍率 125%。全体が収まる倍率に戻す`
      - name: test_attach_zoom_when_dragged_on_link
        case: 正常
        summary: リンクの上から動かした後の click を window で止め、次のタスクで受け取りを解除する
        condition: 拡大を 2 回押し、中身の `a.mdmark-diagram-node-link` の上で `pointerdown` → 40px の `pointermove` → `pointerup` → `click`。もう 1 回、動かして離した後に `click` を出さず、次のタスクで `document` に `click` を出す
        mock: '`document` のキャプチャの `click` を数える関数'
        expected: 1 回目の `click` が `defaultPrevented` で `document` に届かず、`scrollLeft` が 40 変わる。2 回目の後の `document` の `click` は止められず届く
      - name: test_attach_zoom_when_link_pressed
        case: 正常
        summary: しきい値以下の動きはドラッグにしない
        condition: リンクの上で `pointerdown` → 3px の `pointermove` → `pointerup` → `click`
        mock: なし
        expected: '`click` が `defaultPrevented` でなく、`scrollLeft` が変わらない'
      - name: test_attach_zoom_when_drag_threshold
        case: 正常
        summary: しきい値までのドラッグでは動かさず、超えたら動かして `onPanStart` を呼ぶ
        condition: 拡大を 2 回押し、中身の上で押して 2px 動かして離し、次に 40px 左へ動かして離す
        mock: '`onPanStart` に呼ばれた回数を数える関数'
        expected: 2px の後は `scrollLeft` が変わらず `onPanStart` が 0 回、40px の後は `scrollLeft` が増え `onPanStart` が 1 回
      - name: test_attach_zoom_when_refit
        case: 正常
        summary: '`fitHeight` の関数が `true` を返却するようになった後の `refit()` で、倍率を保ち下限を高さでもう一度求める'
        condition: 幅 600px・高さ 400px の枠に幅 500・高さ 1600 の中身。始めは `fitHeight` が `false` を返却し、`true` を返却するようにして `refit()` を呼ぶ
        mock: なし
        expected: '`refit()` の前後で倍率が `1` のままで、`fit()` が `1` から `0.25` になり、縮小のボタンが `disabled` でなくなる'
      - name: test_attach_zoom_when_link_dragstart
        case: 正常
        summary: ノードのリンクの上の押下で、ブラウザのリンクのドラッグを始めない
        condition: 拡大を 2 回押し、中身の `a.mdmark-diagram-node-link` に `dragstart` を出す
        mock: なし
        expected: '`dragstart` が `defaultPrevented`'
    status: planned
    introduced:
      pr: 263
