id: MOD-472-179
title: ライブラリ本体 / 図 / diagram-resize.ts
test_files:
  - tests/unit/src/interact/diagram-resize.browser.test.ts
constants:
  - name: DIAGRAM_HEIGHT_KEY_PREFIX
    title: 図の高さのキーの頭
    container: src/interact/diagram-resize.ts
    summary: リサイズハンドルで変えた高さを sessionStorage に記載するキーの頭
    value: '"mdmark-diagram-height:"'
    status: planned
    introduced:
      pr: 308
functions:
  - name: attachDiagramResize
    title: リサイズハンドルを付ける
    container: src/interact/diagram-resize.ts
    kind: 関数
    scope: internal
    summary: リサイズハンドルの `pointerdown`（`setPointerCapture`）から `pointerup` までの縦の移動だけ表示する枠の `style.height` を変え、フォーカスの間の `ArrowUp`・`ArrowDown` で `RESIZE.step` ずつ変え、`dblclick` で倍率を変えずに `fit()`（今の倍率の図の全体が収まる高さ）にする。高さは `clampDiagramHeight` で収め、変えるたびに `aria-valuenow`・`aria-valuemin`・`aria-valuemax`（今の倍率の図の全体が収まる高さと今の高さの大きいほう）・`aria-valuetext`（`{高さ}px`）を書き換え、`onResize` を呼ぶ。変えた高さを `storage` の `key` に整数の文字で記載し、戻したらキーを削除する。`storage` の読み込みと保存の例外は捕まえて保たない。読み込んだ値が正の整数でなければ使用しない。ドラッグの間はリサイズハンドルに class `is-resizing` を付ける
    args:
      - name: options
        type: '{ viewport: HTMLElement; handle: HTMLElement; key: string; storage: Storage | null; fit: () => number; onResize: (height: number | null) => void }'
        required: true
        description: 表示する枠・リサイズハンドル・高さを保つキー（`diagramHeightKey`）・保つ先・今の倍率の図の全体が収まる高さを返却する関数・高さを変えたとき（戻したときは `null`）に呼ぶ関数
    returns:
      type: '{ restored: number | null; detach: () => void }'
      description: 付けたときに `storage` から読み込んで適用した高さ（無ければ `null`）と、操作を削除する関数
    callees:
      - 'MOD-472-173#functions[clampDiagramHeight]'
    status: planned
    introduced:
      pr: 308
    unit_tests:
      - name: test_attach_diagram_resize
        case: 正常
        summary: ドラッグと上下キーで高さを変えて保つ
        condition: 高さ 300px の表示する枠、`fit` が `1000`。リサイズハンドルを 200px 下へドラッグし、`ArrowUp` を押す
        mock: '`storage` に `Map` で包んだ `Storage` の構造のオブジェクトを指定する'
        expected: 高さが `500px`、`468px` の順になり、`aria-valuenow` も同じ。`storage` の `key` が `468`。`onResize` が `500`・`468` で呼ばれる
      - name: test_attach_diagram_resize_when_fit
        case: 正常
        summary: ダブルクリックで今の倍率の図の全体が収まる高さにする
        condition: 高さを 300px にした後に `dblclick`、`fit` が `760`
        mock: 同上
        expected: 高さが `760px` で、`storage` の `key` が `760`、`onResize` が `760` で呼ばれる。倍率は変わらない
      - name: test_attach_diagram_resize_when_restored
        case: 正常
        summary: 保った高さで開き、読み込めない値は使用しない
        condition: '`storage` の `key` が `420` のときと `abc` のときと、`fit` の 1000 を超える `1500` のとき'
        mock: 同上
        expected: '`420` では `restored` が `420` で高さが `420px`。`abc` では `restored` が `null` で高さを変えない。`1500` では上限を持たないため `restored` が `1500` で高さが `1500px`、`aria-valuenow`・`aria-valuemax` が `1500`'
      - name: test_attach_diagram_resize_when_storage_throws
        case: 異常
        summary: 保つ先が例外を投げても高さを変える
        condition: '`getItem`・`setItem` が例外を投げる `storage`。`ArrowDown` を押す'
        mock: 例外を投げる `Storage` の構造のオブジェクト
        expected: 例外を外へ出さず、高さが 32px 増える
  - name: diagramHeightKey
    title: 図の高さのキー
    container: src/interact/diagram-resize.ts
    kind: 関数
    scope: internal
    summary: '`{DIAGRAM_HEIGHT_KEY_PREFIX}{pathname}#{index}:{title}` を返却する。同じページの同じ順の同じ題名の図だけが同じ高さを読み込む'
    args:
      - name: options
        type: '{ pathname: string; index: number; title: string }'
        required: true
        description: ページの `location.pathname`、`root` の中の図の通し番号（0 から）、図の題名
    returns:
      type: string
      description: sessionStorage のキー
    unit_tests:
      - name: test_diagram_height_key
        case: 正常
        summary: ページ・順・題名でキーを作る
        condition: '`{ pathname: "/docs/a.html", index: 1, title: "問い合わせの流れ" }`'
        mock: なし
        expected: '`mdmark-diagram-height:/docs/a.html#1:問い合わせの流れ`'
    status: planned
    introduced:
      pr: 308
