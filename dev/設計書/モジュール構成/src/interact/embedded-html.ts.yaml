id: MOD-472-230
title: ライブラリ本体 / 操作 / embedded-html.ts
test_files:
  - tests/unit/src/interact/embedded-html.browser.test.ts
functions:
  - name: attachEmbeddedHtml
    title: 埋め込んだ HTML の幅を確認する
    container: src/interact/embedded-html.ts
    summary: '`root` の中の `div.mdmark-html` ごとに `ResizeObserver` で幅を見、`scrollWidth` が `clientWidth` を 1px より大きく超える間だけ class `is-wide` と `tabindex="0"` を付ける。返却する関数で監視を解除し、付けた class と `tabindex` を削除する'
    kind: 関数
    scope: internal
    side_effects: '`root` の中の要素の class と `tabindex` を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: 監視を解除する関数
    unit_tests:
      - name: test_attach_embedded_html
        case: 正常
        summary: 列より広い間だけ横にスクロールさせる
        condition: '幅 600px の要素に、幅 900px の中身と幅 300px の中身の `div.mdmark-html`。その後、要素に `max-width: none` を付けて幅を 1000px にする（`.mdmark` の `max-width` が `--mdmark-content-width` で止めるため）'
        mock: なし（Chromium）
        expected: 付けた直後は前者だけが `is-wide` と `tabindex="0"` を持ち、幅を広げた後はどちらも持たない。削除する関数の後はどちらも持たない
    status: planned
    introduced:
      pr: 45
