  - name: MERMAID_FIXED_THEME_VARIABLES
    title: どのテーマでも固定する変数
    container: src/mermaid-source.ts
    summary: 'どのテーマでも `themeVariables` の最後に重ね、設定の `themeVariables` でも変えさせない値。`{ useGradient: false, dropShadow: "none" }`。テーマ `mdmark` だけはさらに `pieOpacity: "1"`（円グラフの扇形を凡例と同じ不透明な色で塗る）を対応表の値に追加する'
    value: '{ useGradient: false, dropShadow: "none" }'
    reason: デザイン方針の「使用しないもの」（影・グラデーション）
functions:
  - name: splitMermaidTitle
    title: タイトルを取り出す
    container: src/mermaid-source.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: 'ソースの先頭の front matter（`---` の行で囲んだ範囲）の `title:` の値を取り出してその行を除く。front matter に `title` が無ければ、`accTitle:` の行の値を取る（`accTitle` の行は残す）。図の種類の行の最初の単語を `kind` にする'
    args:
      - name: source
        type: string
        required: true
        description: mermaid のコードブロックの中身
    returns:
      type: MermaidSource
      description: タイトル・`render` に指定するソース・図の種類の単語
    unit_tests:
      - name: test_split_mermaid_title
        case: 正常
        summary: front matter の title を取り出し、ほかの行が無ければ front matter ごと除く
        condition: "`---\\ntitle: 問い合わせの受付\\n---\\nflowchart LR\\n  A --> B`"
        mock: なし
        expected: "`{ title: \"問い合わせの受付\", body: \"flowchart LR\\n  A --> B\", kind: \"flowchart\" }`"
      - name: test_split_mermaid_title_when_other_keys
        case: 正常
        summary: title のほかの front matter の行は残す
        condition: "`---\\ntitle: 受付\\nconfig:\\n  look: classic\\n---\\nflowchart LR`"
        mock: なし
        expected: "`body` が `---\\nconfig:\\n  look: classic\\n---\\nflowchart LR`"
      - name: test_split_mermaid_title_when_acc_title
        case: 正常
        summary: front matter が無ければ accTitle の値を取り、行は残す
        condition: "`sequenceDiagram\\n  accTitle: 文書を描く\\n  A->>B: x`"
        mock: なし
        expected: '`title` が `文書を描く`、`body` が指定したソースのまま、`kind` が `sequenceDiagram`'
      - name: test_split_mermaid_title_when_none
        case: 正常
        summary: どちらも無ければ title を持たない
        condition: "`classDiagram\\n  class A`"
        mock: なし
        expected: '`title` が `undefined`、`kind` が `classDiagram`'
  - name: mermaidKindName
    title: 図の種類の名前を参照する
    container: src/mermaid-source.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: '`MERMAID_KIND_NAMES` を `Object.hasOwn` で引き、無ければ `図` を返却する'
    args:
      - name: kind
        type: string
        required: true
        description: '`splitMermaidTitle` の `kind`'
    returns:
      type: string
      description: 図の種類の名前
    unit_tests:
      - name: test_mermaid_kind_name
        case: 正常
        summary: 表の単語は名前に、表に無い単語と継承した名前は `図` にする
        condition: '`stateDiagram-v2`・`journey`・`constructor`'
        mock: なし
        expected: '`状態遷移図`・`図`・`図`'
