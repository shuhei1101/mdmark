id: MOD-472-175
title: ライブラリ本体 / 図 / check.ts
test_files:
  - tests/unit/src/diagram/check.test.ts
constants:
  - name: LABEL_METRICS
    title: ラベルの長さの目安
    container: src/diagram/check.ts
    summary: 描いた文書の CSS の `.mdmark-diagram-node` と同じ文字の大きさと余白。CSS を修正したときは合わせて修正する
    value: 種類 11px・名前 14px・補足 12px・行の高さ 1.4 倍・余白 上下 6px 左右 10px
    status: planned
    introduced:
      pr: 275
functions:
  - name: checkFlowLayout
    title: フロー図の配置を点検する
    container: src/diagram/check.ts
    kind: 関数
    scope: internal
    summary: 読み込めたフロー図の定義の、ノードの矩形の重なり（辺が接するだけは除く）・`width`・`height` の外へのはみ出しと `frame` の縁をまたぐノード・線の各線分（`points` を含む）と `from`・`to` でないノードの矩形の交わり・`labelLineCount` で折り返した高さが収まらないラベルを、ずれ 1 つにつき 1 件にして返却する（同じノードの組・ノードと線の組は 1 件）
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: 読み込めたフロー図の定義
    returns:
      type: 'Array<{ kind: "diagram_node_overlap" | "diagram_node_overflow" | "diagram_wire_crosses_node" | "diagram_label_too_long"; ids: string[] }>'
      description: ずれの種類と、対象のノードか線の `id`
    callees:
      - '#functions[labelLineCount]'
    unit_tests:
      - name: test_check_flow_layout
        case: 正常
        summary: 整った配置はずれを返却しない
        condition: モックの `inquiry` の定義と、辺が接するだけの 2 つのノード
        mock: なし
        expected: 空の配列
      - name: test_check_flow_layout_when_broken
        case: 異常
        summary: 重なり・はみ出し・横切り・ラベルの長さを返却する
        condition: インターフェース定義『設定と索引を点検する』の「正常系（図の定義のずれ）」のフロー図の定義
        mock: なし
        expected: '`diagram_node_overlap`（2 つのノードの `id`）・`diagram_node_overflow`・`diagram_wire_crosses_node`（線とノードの `id`）・`diagram_label_too_long` を 1 件ずつ返却する'
    status: planned
    introduced:
      pr: 275
  - name: labelLineCount
    title: ラベルの折り返した行の数を数える
    container: src/diagram/check.ts
    kind: 関数
    scope: internal
    summary: '`LABEL_METRICS` の文字の大きさで、全角の文字を文字の大きさ、半角の文字を 0.6 倍の幅とみなし、幅で折り返した行の数を返却する'
    args:
      - name: options
        type: '{ text: string; fontSize: number; width: number }'
        required: true
        description: ラベルの文字・文字の大きさ・折り返す幅
    returns:
      type: number
      description: 行の数（空の文字は 0）
    unit_tests:
      - name: test_label_line_count
        case: 正常
        summary: 全角と半角の幅で折り返す
        condition: '`fontSize` 14・`width` 70 で、`あいうえおか` と `abcdefgh`'
        mock: なし
        expected: '`2` と `1`'
    status: planned
    introduced:
      pr: 275
