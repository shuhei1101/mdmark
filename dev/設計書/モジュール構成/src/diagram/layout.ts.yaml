id: MOD-472-178
title: ライブラリ本体 / 図 / layout.ts
test_files:
  - tests/unit/src/diagram/layout.test.ts
constants:
  - name: FLOWCHART_LAYOUT
    title: 自動の配置の大きさと間隔
    container: src/diagram/layout.ts
    summary: 座標を省いた判定フローチャートのノードの既定の大きさと配置の間隔（px）。ノードの大きさと間隔はモックの `judgement-auto` と同じ値（図の余白は上下左右とも `margin`）
    entries:
      - key: sizes.start
        value: 100×100
      - key: sizes.question
        value: 280×136
      - key: sizes.action
        value: 200×72
      - key: sizes.result
        value: 200×60
      - key: gapY
        value: '40'
      - key: gapX
        value: '120'
      - key: margin
        value: '16'
      - key: lineStep
        value: 20（名前が収まらないときに高さを追加する刻み）
functions:
  - name: layoutFlowchart
    title: 判定フローチャートを配置する
    container: src/diagram/layout.ts
    kind: 関数
    scope: internal
    summary: 座標を省いた判定フローチャートの定義に、インターフェース定義『文書をHTML文字列にする』の制約「自動の配置」の決まりでノードの `x`・`y`・`w`・`h`、線の `points`、図の `width`・`height` を入れた定義を返却する
    description: ノードを左と右の 2 つの列と行の格子に割り当てる。`start` を 0 行目の左の列に配置し、`start` から線をたどる。`question` から右へ出る線の先を先に割り当て（複数の線が入るノードの位置をこの線で決める）、次に下へ出る線と `action` の先を割り当てる。列の幅はその列のノードの最大の `w`、行の高さはその行のノードの最大の `h` にし、ノードは列の中央・行の中央に配置する。ノードの大きさは `FLOWCHART_LAYOUT` の `sizes` から始め、`labelLineCount` で名前が収まらないときは `lineStep` ずつ高さを追加する。下へ出る線は出るノードの下辺の中央から、右へ出る線は右辺の中央から引き、縦と横の線分で先のノードの入りインターフェース（同じ列なら上辺。右の列は、同じ行なら左辺、下の行なら上辺、上の行なら下辺）へつなぐ。線の `labelAt` は最初の線分の中点にする。`start` から届かないノードは最後の行の下に定義の順に左の列へ並べる。`width`・`height` は全てのノードと線を囲む矩形に `margin` を追加する
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: 座標を省いた判定フローチャートの定義（`readDefinition` が構造を確認したもの）
    returns:
      type: MdmarkFlowDefinition
      description: 座標を入れた定義（指定した定義は書き換えない）
    callees:
      - 'MOD-472-175#functions[labelLineCount]'
    refs:
      - IF-472-34#constraints[自動の配置]
    unit_tests:
      - name: test_layout_flowchart
        case: 正常
        summary: モックの judgement-auto と同じ列と行の関係に配置する
        condition: モックの `judgement-auto` の定義から座標・`points`・`width`・`height` を除き、線に `from`・`to` を追加したもの
        mock: なし
        expected: ノードの `y`・`w`・`h` と `height` が `judgement-auto` と等しい。`start`・`q1`・`q2`・`r2` の中央の `x` が等しく、`q1` の `x` が `margin`（16）。`a1` と `r1` の `x` が等しく `q1` の右端 + `gapX`（120）で、`width` がその右端 + `margin`。線の `points` が縦と横の線分だけで、配置した定義を `checkFlowLayout` に指定すると空の配列
      - name: test_layout_flowchart_when_both_results
        case: 正常
        summary: 両方の先が結果なら NO を下、YES を右に配置する
        condition: 開始・質問 1 つ・結果 2 つで、質問の `YES` と `NO` の先が結果
        mock: なし
        expected: '`YES` の先の中央の高さが質問と同じで `x` が質問より右、`NO` の先の `y` が質問の下端より下で中央の `x` が質問と同じ'
      - name: test_layout_flowchart_when_long_name
        case: 正常
        summary: 名前が収まらないノードの高さを追加し、配置のずれを出さない
        condition: アクションの名前が全角 40 文字の `judgement-auto`
        mock: なし
        expected: そのアクションの `h` が 72 より大きく、配置した定義を `checkFlowLayout` に指定すると空の配列
      - name: test_layout_flowchart_when_unreachable
        case: 正常
        summary: 開始から届かないノードを一番下に並べる
        condition: どの線にもつながらない結果を 1 つ持つ `judgement-auto`
        mock: なし
        expected: その結果の `y` がほかの全てのノードの下端より下で、`checkFlowLayout` が空の配列
      - name: test_layout_flowchart_when_shared_result
        case: 正常
        summary: 下の質問から上の行の結果へ入る線を、結果の下辺で止める
        condition: 開始 → `q1`、`q1` YES → `ok`、`q1` NO → `q2`、`q2` YES → `ok`、`q2` NO → `ng` の座標を省いた判定フローチャート
        mock: なし
        expected: '`ok` が `q1` の行にあり、`q2` → `ok` の線の最後の点が `ok` の下辺の中央で、全ての線が縦と横だけ'
    status: planned
    introduced:
      pr: 328
