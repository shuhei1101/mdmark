id: MOD-472-194
title: ライブラリ本体 / 差分 / diff-toggle.ts
test_files:
  - tests/unit/src/parts/diff-toggle.test.ts
functions:
  - name: renderDiffToggle
    title: 差分を開くボタンを描く
    container: src/parts/diff-toggle.ts
    summary: 部品設計『差分を開くボタン』の HTML を返却する。アイコンは lucide の `file-diff`
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ controls: string; expanded?: boolean }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<button type="button" class="mdmark-diff-toggle" aria-expanded="…" aria-controls="…">{アイコン}変更表示</button>` を `mdmark-diff-bar` で包んだ HTML'
    unit_tests:
      - name: test_render_diff_toggle
        case: 正常
        summary: 開閉の状態を属性に出す
        condition: '`{ controls: "p1", expanded: true }`'
        mock: なし
        expected: '`aria-expanded="true"`・`aria-controls="p1"` と文字 `変更表示` を持ち、アイコンが `aria-hidden`'
    refs:
      - CMP-472-46#
