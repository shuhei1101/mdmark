id: MOD-472-186
title: ライブラリ本体 / 図 / hint.ts
test_files:
  - tests/unit/src/parts/hint.test.ts
functions:
  - name: renderHintMarkup
    title: ヒントのマーカーと中身を付ける
    container: src/parts/hint.ts
    summary: '部品設計『ヒント』の HTML。`data-hint` を持つ要素の開きタグに、行内の要素なら class `mdmark-hint-inline`・`tabindex="0"`・`aria-describedby` を、それ以外なら class `mdmark-hint-block` を付け、閉じタグの前に `button.mdmark-hint-mark`（ブロックだけ）と、要素の後ろに `renderDiagramTip` の `kind: "hint"` の中身を配置する。`sanitizeEmbedded` の `transformTags` と `exclusiveFilter` から呼ぶ'
    kind: 関数
    scope: internal
    args:
      - name: hint
        type: '{ tag: string; text: string; id: string }'
        required: true
        description: 要素のタグ名・`data-hint` の値・ツールチップの `id`（`mdmark-hint-{n}`）
    returns:
      type: '{ placement: "block" | "inline"; attributes: Record<string, string>; inside: string; after: string }'
      description: 要素に追加する属性と、閉じタグの前と要素の後ろに配置する HTML
    unit_tests:
      - name: test_render_hint_markup
        case: 正常
        summary: ブロックの要素にはマーカー、行内の要素には tabindex を付ける
        condition: '`tag` が `div` と `span`'
        mock: なし
        expected: '`div` は `placement` が `block` で `inside` が `aria-label="説明"` のボタン、`span` は `inline` で `attributes.tabindex` が `0`。どちらも `after` が `role="tooltip"` で `hidden`'
    refs:
      - 'MOD-472-172#functions[renderDiagramTip]'
    status: planned
    introduced:
      pr: 45
