id: MOD-472-336
title: ライブラリ本体 / 部品 / highlight.ts
test_files:
  - tests/unit/src/parts/highlight.test.ts
functions:
  - name: renderHighlight
    title: 蛍光ペンを描く
    container: src/parts/highlight.ts
    summary: 部品設計『蛍光ペン』の HTML を返却する。ストーリーの描画で使用し、`render` は `useHighlight` のトークンから同じ HTML を出す
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ html: string; color?: ColorName }'
        required: true
        description: 中身の HTML と色の名前
    returns:
      type: string
      description: 部品の HTML
    unit_tests:
      - name: test_render_highlight
        case: 正常
        condition: '`{ html: "決め手" }` と `{ html: "例外", color: "green" }`'
        expected: '`<mark class="mdmark-highlight">決め手</mark>` と `<mark class="mdmark-highlight" data-color="green">例外</mark>`'
        mock: なし
        summary: 色があれば `data-color` を付ける
