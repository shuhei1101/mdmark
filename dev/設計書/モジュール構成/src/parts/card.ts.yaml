id: MOD-472-332
title: ライブラリ本体 / 部品 / card.ts
test_files:
  - tests/unit/src/parts/card.test.ts
functions:
  - name: renderCard
    title: カードを描く
    container: src/parts/card.ts
    kind: 関数
    scope: internal
    summary: 部品設計『カード』の HTML を返却する。`link` はドメインに URL のホスト、URL に `href` を出し、`file` はドメインに拡張子の大文字、URL にファイル名を出す。アイコンの `span` は中身を持たず、CSS が `data-card`・`data-file-kind` ごとに付ける
    args:
      - name: options
        type: '{ kind: "link" | "file"; href: string; title: string; fileKind?: AttachmentKind }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<a class="mdmark-card"` で始まる HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    refs:
      - CMP-472-9#
    unit_tests:
      - name: test_render_card
        case: 正常
        summary: リンクのカードにホストと URL を出す
        condition: 部品設計の `Link`
        mock: なし
        expected: '`data-card="link"`、`mdmark-card-domain` が URL のホスト、`mdmark-card-url` が `href`'
      - name: test_render_card_when_file
        case: 正常
        summary: 添付のカードに拡張子とファイル名を出す
        condition: 部品設計の `FilePdf`
        mock: なし
        expected: '`data-card="file"`・`data-file-kind="pdf"`、`mdmark-card-domain` が `PDF`、`mdmark-card-url` がファイル名'
      - name: test_render_card_when_escaped
        case: 正常
        summary: タイトルと URL をエスケープする
        condition: '`title: "<b>資料</b>"`、`href: "https://example.com/?a=1&b=2"`'
        mock: なし
        expected: '`&lt;b&gt;資料&lt;/b&gt;` と `href="https://example.com/?a=1&amp;b=2"`'
    status: planned
    introduced:
      pr: 263
