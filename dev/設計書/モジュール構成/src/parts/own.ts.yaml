id: MOD-472-311
title: ライブラリ本体 / 部品 / own.ts
test_files:
  - tests/unit/src/parts/own.test.ts
constants:
  - name: SLOT_MARKER
    title: 中身の差し込みインターフェース
    container: src/parts/own.ts
    summary: 中身を持つ部品に中身の代わりに指定し、記法がこの前後で HTML を分ける文字列。Markdown に現れない制御文字だけで作る
    value: '"\u0000mdmark-slot\u0000"'
functions:
  - name: markOwn
    title: mdmark が出した要素にマーカーを付ける
    container: src/parts/own.ts
    kind: 関数
    scope: internal
    summary: 部品の HTML の全ての開始タグに `data-mdmark-own="{nonce}"` を追加する。描画の `sanitize` は、この属性を持つ要素にだけ記法の class・`data-*`・`id` を残し、属性は削除する
    description: 部品の HTML は文字をエスケープ済みで、文書の中身（`SLOT_MARKER` の位置）を含まないため、開始タグを `<{名前}` で見分けられる
    args:
      - name: html
        type: string
        required: true
        description: 部品の HTML
      - name: nonce
        type: string
        required: true
        description: 描くごとに作るマーカーの値
    returns:
      type: string
      description: マーカーを付けた HTML
    unit_tests:
      - name: test_mark_own
        case: 正常
        summary: 全ての開始タグにマーカーを付け、閉じタグと文字はそのまま
        condition: '`<div class="a"><p>x &lt;y&gt;</p></div>` と nonce `n1`'
        mock: なし
        expected: '`<div data-mdmark-own="n1" class="a"><p data-mdmark-own="n1">x &lt;y&gt;</p></div>`'
