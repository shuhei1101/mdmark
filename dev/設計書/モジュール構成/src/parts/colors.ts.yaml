      - name: test_is_color_name
        case: 正常
        summary: 7 つの名前だけを色の名前にする
        condition: '`blue`・`gray`・`Blue`・`pink`・空の文字'
        mock: なし
        expected: '`true`・`true`・`false`・`false`・`false`'
