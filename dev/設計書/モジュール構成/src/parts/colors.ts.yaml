    container: src/parts/colors.ts
    kind: 関数
    scope: internal
    summary: 文字が `COLOR_NAMES` のどれかと一致するか（大文字と小文字を区別する）を返却する
    args:
      - name: value
        type: string
        required: true
        description: 読み込んだ文字
    returns:
      type: value is ColorName
      description: 色の名前なら `true`
