    summary: 表の列と行・バッジ・本文の文字に記載できる色の名前。型 `ColorName` はこの要素の和。記載の警告の本文に並べる
    value: '["blue", "red", "green", "yellow", "orange", "purple", "gray"]'
    refs:
      - IF-472-34#constraints[色の名前]
