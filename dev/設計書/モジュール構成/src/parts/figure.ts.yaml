id: MOD-472-322
title: ライブラリ本体 / 部品 / figure.ts
test_files:
  - tests/unit/src/parts/figure.test.ts
functions:
  - name: renderFigure
    title: 図表の番号を描く
    container: src/parts/figure.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図表の番号』の HTML を返却する。画像はタイトルを下、表は上に配置する
    args:
      - name: options
        type: '{ kind: "image" | "table"; id?: string; number: number; caption?: string; body: string }'
        required: true
        description: 部品設計の引数と中身の HTML（`SLOT_MARKER` を指定できる）。`id` を省くと `id` を付けない（重なった ID）
    returns:
      type: string
      description: '`<figure class="mdmark-figure"` で始まる HTML'
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
    unit_tests:
      - name: test_render_figure
        case: 正常
        summary: 画像はタイトルを下、表はタイトルを上に配置する
        condition: '`kind: image`、`number: 1`、`caption: 全体の構成` と、`kind: table`、`number: 1`'
        mock: なし
        expected: 1 つ目は中身の後に `<figcaption class="mdmark-figure-caption"><b>図 1</b>全体の構成</figcaption>`、2 つ目は中身の前に `<b>表 1</b>`
