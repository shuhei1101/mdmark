id: MOD-472-325
title: ライブラリ本体 / 部品 / collapsible.ts
test_files:
  - tests/unit/src/parts/collapsible.test.ts
functions:
  - name: renderCollapsible
    title: 折り畳みを描く
    container: src/parts/collapsible.ts
    summary: タブとステップを入れる `<details class="mdmark-collapsible">` と、エスケープした見出しの `<summary>` を返却する。`open` のときは `details` に `open` を付ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ title: string; open: boolean; body: string; className?: string }'
        required: true
        description: 見出しの文字、既定で開くか、中身の HTML（`SLOT_MARKER` を指定できる）、`mdmark-collapsible` の後ろに加える class（省くと加えない）
    returns:
      type: string
      description: '`<details class="mdmark-collapsible"` で始まる HTML'
    unit_tests:
      - name: test_render_collapsible
        case: 正常
        summary: 閉じた折り畳みに中身を入れ、見出しをエスケープする
        condition: '`title: "a<b"`、`open: false`、`body: "<ol></ol>"`'
        mock: なし
        expected: '`<details class="mdmark-collapsible"><summary>a&lt;b</summary><ol></ol></details>`'
      - name: test_render_collapsible_when_class_name
        case: 正常
        summary: 加える class を mdmark-collapsible の後ろに付ける
        condition: '`title: "フロントマター"`、`open: false`、`body: "<pre></pre>"`、`className: "mdmark-frontmatter"`'
        mock: なし
        expected: '`<details class="mdmark-collapsible mdmark-frontmatter"><summary>フロントマター</summary><pre></pre></details>`'
      - name: test_render_collapsible_when_open
        case: 正常
        summary: 開いた折り畳みは open を持つ
        condition: '`title: "準備"`、`open: true`'
        mock: なし
        expected: '`<details class="mdmark-collapsible" open><summary>準備</summary>` で始まる'
    status: planned
    introduced:
      pr: 225
    callees:
      - 'MOD-472-313#functions[escapeHtml]'
