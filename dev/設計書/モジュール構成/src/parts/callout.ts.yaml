id: MOD-472-275
title: ライブラリ本体 / 記法 / callout.ts
test_files:
  - tests/unit/src/parts/callout.test.ts
constants:
  - name: CALLOUT_KINDS
    title: 注意書きの種類
    container: src/parts/callout.ts
    summary: 引用の 1 行目に記載できる種類。知らない種類は `note`
    value: '["note", "tip", "important", "warning", "caution"]'
functions:
  - name: renderCallout
    title: 注意書きを描く
    container: src/parts/callout.ts
    kind: 関数
    scope: internal
    summary: '部品設計『注意書き』の HTML を返却する。`title` を指定すると、タイトルを `<span class="mdmark-visually-hidden">{種類の名前}: </span>{title}` にする'
    args:
      - name: options
        type: '{ kind: CalloutKind; collapsed?: boolean; open?: boolean; title?: string; body: string }'
        required: true
        description: 種類・折り畳み・開閉・タイトルの行内の HTML（エスケープ済み）・本文の HTML（`SLOT_MARKER` を指定できる）
    returns:
      type: string
      description: 注意書きの HTML
    unit_tests:
      - name: test_render_callout
        case: 正常
        summary: 種類の class とタイトルを出す
        condition: '`kind: warning`'
        mock: なし
        expected: '`<div class="markdown-alert markdown-alert-warning"><p class="markdown-alert-title">警告</p>`'
      - name: test_render_callout_when_collapsed
        case: 正常
        summary: 折り畳みは details にする
        condition: '`kind: note`、`collapsed: true`'
        mock: なし
        expected: '`<details class="markdown-alert markdown-alert-note"><summary class="markdown-alert-title">補足</summary>`'
      - name: test_render_callout_when_titled
        case: 正常
        summary: タイトルの頭にスクリーンリーダー向けの種類の名前を配置する
        condition: '`kind` が `tip`、`title` が `設定を先に確認する`'
        mock: なし
        expected: '`<p class="markdown-alert-title"><span class="mdmark-visually-hidden">ヒント: </span>設定を先に確認する</p>`'
      - name: test_render_callout_when_open
        case: 正常
        summary: 開いた状態の折り畳みにする
        condition: '`kind` が `warning`、`collapsed` と `open` が `true`'
        mock: なし
        expected: '`<details class="markdown-alert markdown-alert-warning" open>`'
