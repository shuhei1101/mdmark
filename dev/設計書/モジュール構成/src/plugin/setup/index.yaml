  - page: server.ts.yaml
    summary: '`start-server` の起動の方法の決定・systemd --user の unit と tmux のセッションでの起動・待ち受けの確認。'
  - page: status.ts.yaml
    summary: '`status` の結果を作る。'
  - page: systemd.ts.yaml
    summary: '`start-server`・`status` が呼ぶ systemd --user の確認・unit のファイルの組み立て・unit の状態の読み取り。'
  - page: write.ts.yaml
    summary: '`write-settings`・`write-config` と `settings.json` の `env` の書き換え。'
