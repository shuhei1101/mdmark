  - page: guide.ts.yaml
    summary: ガイドの索引（名前・参照するとき・概要・本文のページ）の構造を検査する。プラグインのビルドが使用する。
  - page: http.ts.yaml
    summary: ClaudeCodeプラグイン / MCPサーバー / http.ts
  - page: mcp.ts.yaml
    summary: ClaudeCodeプラグイン / MCPサーバー / mcp.ts
  - page: port.ts.yaml
    summary: '`127.0.0.1` のポートが待ち受けているかの確認と、待ち受けるポートの読み取り（`mdmark serve`・SessionStart のフック・`setup.js` が使用する）。'
  - page: pre-tool-use.ts.yaml
    summary: プラグインの `hooks/hooks.json` が `node` で起動する処理。PreToolUse で作業のフォルダを MCP のツールの引数 `project_dir` に入れる。
  - page: session-start.ts.yaml
    summary: プラグインの `hooks/hooks.json` の SessionStart が `node` で起動する処理。常駐サーバーが待ち受けていないときだけ、そのことを 1 行で指定する。
  - page: setup/
    summary: setup の設計書
  - page: templates.ts.yaml
    summary: 端末の設定のフォルダの `templates/css/` に配置する CSS のテンプレートの索引を読み込み・検査し・記載し、テンプレートを一覧・登録・配置する。MCP の `list_templates`・`add_template`・`apply_template` の処理が呼ぶ。
  - page: tools.ts.yaml
    summary: ClaudeCodeプラグイン / MCPサーバー / tools.ts
