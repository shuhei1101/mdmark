  - name: runUpgrade
    title: 版を上げる
    container: src/cli/upgrade.ts
    usecase: 版を上げる
    summary: 手元の版から呼んだ CLI の版までの移行の手順を当て、点検が通ったら設定の版を書き換える
    description: 順に、設定を探して読む（`findConfigFile`・`loadConfig`）→ 手元の版（設定の `version`、無ければ `ask`）→ 目標の版（`options.cliVersion`）と比べる（新しければ `CliError`、同じならその旨を出して 0）→ `loadMigrationVersions` → 当て先を作る（索引は設定の `index`、文書は `collectBuildDocuments` と `readIndexWithDocuments` の文書）→ 手順と `changelogRows` の行を出す → `--plan` ならその旨を出して 0 → キーが無い `set_default` の `ask` を当てる順に聞く → 壊す印があり `--yes` が無ければ確かめ、`CONFIRM_ANSWER` 以外なら `CliError` → `takeBackup`（`stepFiles`）→ 版の順に `applyStep` → `collectCheckIssues` → ずれがあれば `restoreBackup` してずれの行を標準エラーに出し 1 → `writeConfigVersion` → 写しの場所と版を出して 0。`applyStep` が投げた `CliError` は `restoreBackup` してから投げ直す。問いに答えが無い（`undefined`）ときは、書き換えの前に `CliError` を投げる
    kind: 関数
    scope: public
    is_async: true
    side_effects: 設定・索引・文書を書き換え、写しを置く
    args:
      - name: options
        type: '{ config?: string | undefined; plan: boolean; yes: boolean; packageDir: string; cliVersion: string; now: Date }'
        required: true
        description: '`--config`・`--plan`・`--yes`・パッケージの直下（`migrations/` と変更履歴の基準）・目標の版（`cliVersion()`。テストで差し替える）・今の時刻'
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
      - name: ask
        type: Prompter
        required: true
        description: 問い（テストで差し替える）
    returns:
      type: Promise<0 | 1>
      description: 当てた・示した・当てる手順が無いとき 0、点検のずれで戻したとき 1
    exceptions:
      - name: CliError
        condition: 設定ファイルが無い・読めない
        message: '`findConfigFile`・`loadConfig` のメッセージ'
      - name: CliError
        condition: 手元の版の書式が違う
        message: 手元の版 {値} の書式が違います。v{MAJOR}.{MINOR}.{PATCH} で書いてください。
      - name: CliError
        condition: 問いに答える前に入力が終わった
        message: 「{問い}」に答えがありません。何も書き換えていません。
      - name: CliError
        condition: 手元の版が目標の版より新しい
        message: 手元の版 {手元の版} はこの mdmark（{目標の版}）より新しいです。npx github:shuhei1101/mdmark#{手元の版} upgrade のように、手元の版以上の mdmark で呼んでください。
      - name: CliError
        condition: 壊す手順の確かめを断った
        message: 何も当てていません。確かめずに当てるときは --yes を付けてください。
      - name: CliError
        condition: 手順のファイルの誤り・手順の失敗・写しを取れない
        message: '`loadMigrationVersions`・`applyStep`・`takeBackup` のメッセージ（手順の失敗は写しから戻した後）'
    unit_tests:
      - name: test_run_upgrade
        case: 正常
        summary: 2 つの版の手順を当てて版を書き換える
        condition: '`version: v0.3.0` の設定、パッケージは `v0.5.0` で `v0.4.0`（`rename_key`）・`v0.5.0`（`replace_mark`）を持つ'
        mock: 一時フォルダのパッケージと設定、出力を配列に貯める `CliIo`、呼ばれたら失敗にする `Prompter`
        expected: 0 を返し、キーと印が書き換わり、`version` が `v0.5.0`、標準出力の最後が `版を v0.5.0 にしました`
      - name: test_run_upgrade_when_plan
        case: 正常
        summary: --plan は何も書き換えない
        condition: 'test_run_upgrade と同じで `plan: true`'
        mock: test_run_upgrade と同じ
        expected: 0 を返し、設定・文書が変わらず `.mdmark/` が無い
      - name: test_run_upgrade_when_up_to_date
        case: 正常
        summary: 同じ版なら何も当てない
        condition: '`version: v0.5.0` の設定'
        mock: test_run_upgrade と同じ
        expected: 0 を返し、標準出力に `当てる手順はありません` が出る
      - name: test_run_upgrade_when_version_missing
        case: 正常
        summary: version が無ければ手元の版を聞く
        condition: '`version` を持たない設定'
        mock: 1 回目に `v0.3.0` を返す `Prompter`
        expected: 0 を返し、`version` が `v0.5.0`
      - name: test_run_upgrade_when_local_newer
        case: 異常
        summary: 手元の版が新しければ CliError
        condition: '`version: v0.6.0` の設定'
        mock: test_run_upgrade と同じ
        expected: '`CliError` の文に `v0.6.0`・`v0.5.0`・`npx github:shuhei1101/mdmark#v0.6.0 upgrade` が入る'
      - name: test_run_upgrade_when_declined
        case: 異常
        summary: 壊す手順を断ると何も書き換えない
        condition: '`v0.5.0` の手順に `destructive: true`、`yes: false`'
        mock: '`n` を返す `Prompter`'
        expected: '`CliError` の文に `--yes` が入り、設定が変わらず `.mdmark/` が無い'
      - name: test_run_upgrade_when_step_fails
        case: 異常
        summary: 手順が失敗すると写しから戻して投げ直す
        condition: '`v0.5.0` が `process.exit(1)` する `call`'
        mock: test_run_upgrade と同じ
        expected: '`CliError` を投げ、設定に `v0.4.0` で変えたキーが戻り `version` が `v0.3.0`'
      - name: test_run_upgrade_when_check_fails
        case: 異常
        summary: 点検のずれで写しから戻し 1 を返す
        condition: '`v0.5.0` が `build.out` を `.txt` に読み替える `map_values`'
        mock: test_run_upgrade と同じ
        expected: 1 を返し、標準エラーに `build.out` の `schema` の行があり、設定が当てる前の中身
      - name: test_run_upgrade_when_answer_missing
        case: 異常
        summary: 問いに答えが無ければ書き換えずに CliError
        condition: '`version` を持たない設定'
        mock: '`undefined` を返す `Prompter`'
        expected: '`CliError` を投げ、`.mdmark/` が無い'
      - name: test_run_upgrade_when_plan_with_ask
        case: 正常
        summary: --plan では値を聞く手順があっても聞かない
        condition: '`v0.5.0` が `ask` を持つ `set_default`、`plan: true`'
        mock: 呼ばれたら失敗にする `Prompter`
        expected: 0 を返し、`Prompter` が呼ばれない
    refs:
      - '#functions[loadMigrationVersions]'
      - '#functions[stepFiles]'
      - '#functions[applyStep]'
      - '#functions[takeBackup]'
      - '#functions[restoreBackup]'
      - '#functions[changelogRows]'
      - '#functions[writeConfigVersion]'
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[findConfigFile]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[collectBuildDocuments]
    status: planned
    introduced:
      pr: 39
  - name: cliVersion
    title: 呼んだ CLI の版
    container: src/cli/versions.ts
    usecase: 共通
    summary: ビルドが `dist/cli.js` に埋めた `__MDMARK_VERSION__` を返す
    description: ライブラリ本体の `version()` と同じ出所。hotfix のビルドは `version.ini` を上げず `--version` で打つタグの版を埋めるため、`version.ini` は読まない
