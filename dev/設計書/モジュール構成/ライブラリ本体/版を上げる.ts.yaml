title: "ライブラリ本体 / 版を上げる"
lead: '`mdmark upgrade` の処理。版の読み取りと比較、移行の手順の読み取り・検め・適用、写しと戻し、変更履歴の行の抽き出し、標準入力での問いを持ち、`runUpgrade` がこれらと CLI の点検をつなぐ。'
directory: |-
  ```tree
  src/cli/
  ├── versions.ts    # 版の書式・比較・呼んだ CLI の版
  ├── migrations.ts  # 移行の手順の読み取り・形の検め・適用
  ├── backup.ts      # 当てる前の写しと写しからの戻し
  ├── changelog.ts   # 変更履歴の表から範囲の行を抽き出す
  ├── prompt.ts      # 標準入力の 1 行を答えにする問い
  └── upgrade.ts     # mdmark upgrade
  schemas/
  └── mdmark.steps.schema.json  # steps.yaml の JSON Schema
  migrations/
  ├── v{版}/        # 出した版の steps.yaml とスクリプト
  ├── next/          # 出していない版の steps.yaml とスクリプト
  └── no-steps.yaml  # 移行の手順が要らないスキーマの変更の一覧
  ```
function_types:
  - name: Prompter
    title: 問い
    container: src/cli/prompt.ts
    summary: 問いの文を出し、答えの 1 行を返す。答える前に入力が終わったら `undefined` を返す
    args:
      - name: question
        type: string
        required: true
        description: 問いの文
    returns:
      type: Promise<string | undefined>
      description: 前後の空白を落とした答え、入力が終わっていれば `undefined`
data_models:
  - name: MigrationStep
    title: 移行の手順
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: '`steps.yaml` の `steps` の要素 1 つ。`op` で分けた判別子つきユニオン'
    properties:
      - name: op
        type: '"rename_key" | "set_default" | "map_values" | "replace_mark" | "call"'
        description: 手順の種類。残りのプロパティは種類ごとに ER 図『移行の手順』の必須のとおりに持つ
      - name: description
        type: string
        description: 何をどう変えるかの 1 文
      - name: destructive
        type: boolean
        default: 'false'
        description: 壊す印
      - name: file
        type: '"config" | "index"'
        description: '`rename_key`・`set_default`・`map_values` が書き換える YAML'
      - name: from
        type: string
        description: '`rename_key` の元のキーのパス、`replace_mark` の書き換える前の印'
      - name: to
        type: string
        description: '`rename_key` の新しいキーのパス、`replace_mark` の書き換えた後の印'
      - name: key
        type: string
        description: '`set_default`・`map_values` のキーのパス'
      - name: value
        type: unknown
        description: '`set_default` が足す値'
      - name: ask
        type: string
        description: '`set_default` が値を聞く問いの文'
      - name: mapping
        type: Record<string, unknown>
        description: '`map_values` の読み替えの表'
      - name: script
        type: string
        description: '`call` のスクリプトの、`steps.yaml` のあるフォルダからの相対パス'
      - name: files
        type: ("config" | "index" | "documents")[]
        description: '`call` が書き換えうるもの'
    refs:
      - dev/設計書/ER図/移行の手順#tables[migrations/{版}/steps.yaml]
  - name: MigrationVersion
    title: 当てる版
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: 当てる 1 つの版と、その版の検めた手順
    properties:
      - name: version
        type: string
        description: 版（`v{MAJOR}.{MINOR}.{PATCH}`）
      - name: dir
        type: string
        description: その版のフォルダの絶対パス（`call` のスクリプトの基準）
      - name: steps
        type: MigrationStep[]
        description: 書いた順の手順
  - name: MigrationTarget
    title: 手順の当て先
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: 手順を当てる設定・索引・文書の場所と、当てる前に聞いた答え
    properties:
      - name: configPath
        type: string
        description: 設定ファイルの絶対パス
      - name: indexPath
        type: string | undefined
        description: 設定の `index` が指す索引の絶対パス。設定に `index` が無ければ `undefined`
      - name: documents
        type: string[]
        description: '`build` の対象と索引の文書の絶対パス（重なりなし）'
      - name: answers
        type: Map<MigrationStep, string>
        description: '`ask` を持つ `set_default` に答えた値'
  - name: ChangelogRow
    title: 変更履歴の行
    container: src/cli/changelog.ts
    usecase: 版を上げる
    summary: 変更履歴の表の 1 行
    properties:
      - name: version
        type: string
        description: バージョンの列
      - name: pr
        type: string
        description: PR の列のリンクの文字（`#40`）
      - name: change
        type: string
        description: 変更の列
constants:
  - name: VERSION_PATTERN
    title: 版の書式
    container: src/cli/versions.ts
    summary: 手元の版・パッケージの版・移行の手順のフォルダ名が合うべき書式
    value: '`/^v(\d+)\.(\d+)\.(\d+)$/`'
  - name: MIGRATIONS_DIR
    title: 移行の手順のフォルダ
    container: src/cli/migrations.ts
    summary: パッケージの直下からの移行の手順のフォルダと、その中の名前
    entries:
      - key: root
        value: '`migrations`'
      - key: next
        value: '`next`'
      - key: steps
        value: '`steps.yaml`'
      - key: noSteps
        value: '`no-steps.yaml`'
  - name: SCRIPT_EXTENSIONS
    title: スクリプトの拡張子
    container: src/cli/migrations.ts
    summary: '`call` のスクリプトに許す拡張子（`node_modules` の下で流せるものだけ）'
    value: '`[".js", ".mjs"]`'
  - name: BACKUP_DIR
    title: 写しのフォルダ
    container: src/cli/backup.ts
    summary: 設定ファイルのあるフォルダからの写しの置き場と、中身が `*` の `.gitignore` を置くフォルダ
    entries:
      - key: root
        value: '`.mdmark`'
      - key: backups
        value: '`.mdmark/backup`'
  - name: CHANGELOG_FILE
    title: 変更履歴のファイル
    container: src/cli/changelog.ts
    summary: パッケージの直下からの変更履歴のパス
    value: '`docs/はじめに/変更履歴.md`'
  - name: CONFIRM_ANSWER
    title: 承諾の答え
    container: src/cli/upgrade.ts
    summary: 壊す手順の確かめで承諾とする答え
    value: '`y`'
functions:
  - name: parseVersion
    title: 版を読む
    container: src/cli/versions.ts
    usecase: 版を上げる
    summary: '`v{MAJOR}.{MINOR}.{PATCH}` を 3 つの数にする。書式が違えば `undefined`'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: 版の文字列
    returns:
      type: '[number, number, number] | undefined'
      description: MAJOR・MINOR・PATCH
    unit_tests:
      - name: test_parse_version
        case: 正常
        summary: 版を 3 つの数にする
        condition: '`v0.12.3`'
        mock: なし
        expected: '`[0, 12, 3]`'
      - name: test_parse_version_when_invalid
        case: 異常
        summary: 書式の違う版は undefined
        condition: '`0.3`・`v0.3`・`v0.3.0-rc`'
        mock: なし
        expected: どれも `undefined`
    status: planned
    introduced:
      pr: 39
  - name: compareVersions
    title: 版を比べる
    container: src/cli/versions.ts
    usecase: 版を上げる
    summary: 2 つの版を MAJOR・MINOR・PATCH の順に数として比べる
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: a
        type: string
        required: true
        description: 書式の合う版
      - name: b
        type: string
        required: true
        description: 書式の合う版
    returns:
      type: -1 | 0 | 1
      description: '`a` が古ければ -1、同じなら 0、新しければ 1'
    exceptions:
      - name: Error
        condition: どちらかが `VERSION_PATTERN` に合わない（呼ぶ側の不具合）
        message: '版の書式が違います: {版}'
    unit_tests:
      - name: test_compare_versions
        case: 正常
        summary: 桁ごとに数として比べる
        condition: '`v0.10.0` と `v0.9.9`、`v1.0.0` と `v1.0.0`、`v0.3.0` と `v0.4.0`'
        mock: なし
        expected: 1・0・-1
    status: planned
    introduced:
      pr: 39
  - name: validateSteps
    title: 移行の手順の形を検める
    container: src/cli/migrations.ts
    usecase: 共通
    summary: 読んだ `steps.yaml` を `schemas/mdmark.steps.schema.json` と同じ形で検め、手順の並びと合わないところを返す
    description: 検めるのは、最上位が `steps`（配列）だけを持つこと・各手順の `op` が 5 つのどれかで `description` が空でないこと・`op` ごとの必須のプロパティ・`set_default` が `value` か `ask` のどちらか 1 つだけを持つこと・`replace_mark` の `to` が `from` を含まないこと・`map_values` の読み替えの表の新しい値が元の値に無いこと・`call` の `script` の拡張子が `SCRIPT_EXTENSIONS` のどれかで `files` が 1 つ以上。形の検査は `validateConfig` と同じく手書きで、ライブラリを足さない。配布物のビルドもこの関数で検める
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: raw
        type: unknown
        required: true
        description: YAML として読んだ値
      - name: file
        type: string
        required: true
        description: 合わないところに出すファイルの名前（`migrations/v0.5.0/steps.yaml` など）
    returns:
      type: '{ steps: MigrationStep[]; problems: string[] }'
      description: '形の合う手順と、合わないところ 1 つ 1 文（`{ファイル}: steps[{番号}].{キー}: {内容}`）。`problems` が空でなければ `steps` を使わない'
    unit_tests:
      - name: test_validate_steps
        case: 正常
        summary: 5 つの種類の手順をそのまま返す
        condition: '`rename_key`・`set_default`（`value`）・`map_values`・`replace_mark`・`call`（`.mjs`）を 1 つずつ持つ値'
        mock: なし
        expected: '`problems` が空で、`steps` が 5 つ'
      - name: test_validate_steps_when_required_missing
        case: 異常
        summary: op の必須のプロパティが無いと合わないところを返す
        condition: '`replace_mark` が `to` を持たない'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].to` を含む'
      - name: test_validate_steps_when_not_reapplicable
        case: 異常
        summary: 当て直すと結果が変わる手順を拒む
        condition: '`to` が `from` を含む `replace_mark` と、新しい値が元の値にある `map_values`'
        mock: なし
        expected: '`problems` が 2 つ'
      - name: test_validate_steps_when_script_ts
        case: 異常
        summary: 拡張子 .ts のスクリプトを拒む
        condition: '`script: move.ts` の `call`'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].script` を含む'
    status: planned
    introduced:
      pr: 39
  - name: loadMigrationVersions
    title: 当てる版を読む
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: パッケージの `migrations/` から手元の版より新しく目標の版以下の `v{版}` を版の昇順に読み、形を検めて返す
    description: '`v{版}` でないフォルダ（`next` を含む）とファイルは飛ばす。`migrations/` が無ければ空の並びを返す。全ての版を検めてから、合わないところを 1 つの `CliError` にまとめて投げる。`call` のスクリプトは版のフォルダの配下にあることを確かめる'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ packageDir: string; from: string; to: string }'
        required: true
        description: パッケージの直下・手元の版・目標の版
    returns:
      type: Promise<MigrationVersion[]>
      description: 当てる版の並び（昇順）
    exceptions:
      - name: CliError
        condition: '`steps.yaml` を読めない・形が合わない、`call` のスクリプトが無いか版のフォルダの外を指す'
        message: 移行の手順に誤りがあります（{合わないところを `、` でつないだもの}）。mdmark を入れ直してください。
    unit_tests:
      - name: test_load_migration_versions
        case: 正常
        summary: 範囲の版だけを昇順に返す
        condition: '`v0.3.0`・`v0.4.0`・`v0.10.0`・`next` のフォルダ、`from: v0.3.0`・`to: v0.10.0`'
        mock: 一時フォルダのパッケージ
        expected: '`v0.4.0`・`v0.10.0` の 2 つ'
      - name: test_load_migration_versions_when_steps_invalid
        case: 異常
        summary: 形の合わない版があれば CliError
        condition: '`v0.4.0` の手順が `op` を持たない'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` の文に `migrations/v0.4.0/steps.yaml` と `steps[0].op` が入る'
      - name: test_load_migration_versions_when_script_outside
        case: 異常
        summary: 版のフォルダの外を指すスクリプトを拒む
        condition: '`script: ../x.mjs` の `call`'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` を投げる'
    refs:
      - '#functions[validateSteps]'
      - '#functions[compareVersions]'
    status: planned
    introduced:
      pr: 39
  - name: renameKey
    title: キーの名前を変える
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: YAML の Document で、元のキーがあり新しいキーが無いときだけ、値とコメントを保って新しいキーへ移す
    description: キーのパスは `.` で区切る。新しいキーが同じ親の下なら元のキーの位置で名前だけを替え、親が違えば新しい親の末尾に移す（無い親は作る）
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: from
        type: string
        required: true
        description: 元のキーのパス
      - name: to
        type: string
        required: true
        description: 新しいキーのパス
    returns:
      type: boolean
      description: 書き換えたら `true`
    unit_tests:
      - name: test_rename_key
        case: 正常
        summary: 同じ親の下で名前を変え、位置とコメントを保つ
        condition: '`build:` の下に `# 書き出す先` のコメントつきの `out` と `include` がある。`build.out` → `build.output`'
        mock: なし
        expected: '`true` を返し、文字列にすると `output` が `out` の位置にありコメントが残る'
      - name: test_rename_key_when_already_renamed
        case: 正常
        summary: 新しいキーがあれば何もしない
        condition: '`build.output` だけがある'
        mock: なし
        expected: '`false` を返し、文字列が変わらない'
    status: planned
    introduced:
      pr: 39
  - name: setDefault
    title: 無いキーを足す
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: キーが無いときだけ値を足す
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: value
        type: unknown
        required: true
        description: 足す値
    returns:
      type: boolean
      description: 足したら `true`
    unit_tests:
      - name: test_set_default
        case: 正常
        summary: 無いキーを足す
        condition: '`features.diff` が無い。値 `true`'
        mock: なし
        expected: '`true` を返し、`features.diff` が `true`'
      - name: test_set_default_when_present
        case: 正常
        summary: あるキーは変えない
        condition: '`features.diff: false` がある'
        mock: なし
        expected: '`false` を返し、値が `false` のまま'
    status: planned
    introduced:
      pr: 39
  - name: mapValues
    title: 値を読み替える
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: キーの値が読み替えの表の元の値のときだけ新しい値に替える
    description: 値が配列のときは要素ごとに替える。比べるのは YAML の値としての一致
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: mapping
        type: Record<string, unknown>
        required: true
        description: 元の値から新しい値への表
    returns:
      type: boolean
      description: 替えたら `true`
    unit_tests:
      - name: test_map_values
        case: 正常
        summary: 表にある値を替え、無い値は残す
        condition: '`build.include: [docs/**/*.md, a.md]`、表 `{ "docs/**/*.md": "**/*.md" }`'
        mock: なし
        expected: '`true` を返し、`[**/*.md, a.md]`'
      - name: test_map_values_when_no_match
        case: 正常
        summary: 当て直しても変わらない
        condition: 替えた後の値に同じ表を当てる
        mock: なし
        expected: '`false` を返す'
    status: planned
    introduced:
      pr: 39
  - name: replaceMark
    title: 印を書き換える
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: 文書の本文の `from` を全て `to` にする
    description: 文字列として一致した箇所を替える（正規表現にしない）。`to` は `from` を含まないため、当て直しても結果が変わらない
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: 文書の本文
      - name: from
        type: string
        required: true
        description: 書き換える前の印
      - name: to
        type: string
        required: true
        description: 書き換えた後の印
    returns:
      type: string
      description: 書き換えた本文
    unit_tests:
      - name: test_replace_mark
        case: 正常
        summary: 全ての印を書き換える
        condition: '`<!-- note -->` を 2 つ持つ本文、`<!-- note -->` → `<!-- callout -->`'
        mock: なし
        expected: 2 つとも `<!-- callout -->` になり、他の文字が変わらない
    status: planned
    introduced:
      pr: 39
  - name: stepFiles
    title: 手順が書き換えうるファイル
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: 当てる全ての手順が書き換えうるファイルを、設定ファイルを先頭に重なりなく返す
    description: '設定ファイルは版を書き換えるため手順に関わらず含める。`file: index` と `files` の `index` は索引を、`replace_mark` と `files` の `documents` は文書を足す。索引が無いときは足さない'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: versions
        type: MigrationVersion[]
        required: true
        description: 当てる版
      - name: target
        type: MigrationTarget
        required: true
        description: 手順の当て先
    returns:
      type: string[]
      description: 絶対パスの並び
    unit_tests:
      - name: test_step_files
        case: 正常
        summary: 設定・索引・文書を重なりなく返す
        condition: '`file: index` の `rename_key` と `replace_mark` と `files: [index, documents]` の `call`、文書 2 つ'
        mock: なし
        expected: 設定・索引・文書 2 つの 4 つで、先頭が設定
      - name: test_step_files_when_no_index
        case: 正常
        summary: 索引が無ければ足さない
        condition: '`indexPath` が `undefined` で `file: index` の手順を持つ'
        mock: なし
        expected: 設定だけ
    status: planned
    introduced:
      pr: 39
  - name: applyStep
    title: 手順を当てる
    container: src/cli/migrations.ts
    usecase: 版を上げる
    summary: 手順 1 つを当て先へ当てる
    description: '`rename_key`・`set_default`・`map_values` は対象の YAML を `parseDocument` で読み、`renameKey`・`setDefault`・`mapValues` が書き換えたときだけ書き戻す。`file: index` で索引が無ければ何もしない。`set_default` の `ask` は `target.answers` の値を YAML の値として読んで足す。`replace_mark` は各文書の本文を `replaceMark` で書き換え、変わった文書だけ書き戻す。`call` は `process.execPath` で `[{スクリプト}, "--config", {設定ファイル}]` を設定ファイルのフォルダで流す（シェルを通さない）'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 設定・索引・文書を書き換える。`call` は子プロセスを流す
    args:
      - name: options
        type: '{ step: MigrationStep; version: MigrationVersion; target: MigrationTarget }'
        required: true
        description: 当てる手順・その版・当て先
    returns:
      type: Promise<void>
      description: 当て終えた
    exceptions:
      - name: CliError
        condition: ファイルを読めない・書けない、対象の YAML を読めない、`call` のスクリプトが 0 以外で終わった
        message: '{版} の手順「{説明}」に失敗しました（{理由}）。'
    unit_tests:
      - name: test_apply_step
        case: 正常
        summary: rename_key で設定のキーの名前を変えて書き戻す
        condition: '`file: config` の `rename_key`（`legacy` → `renamed`）'
        mock: 一時フォルダの設定
        expected: 設定ファイルに `renamed` があり `legacy` が無い
      - name: test_apply_step_when_asked
        case: 正常
        summary: ask の答えを YAML の値として足す
        condition: '`ask` を持つ `set_default`（`key: count`）、答え `3`'
        mock: 一時フォルダの設定
        expected: '`count` が数 `3`'
      - name: test_apply_step_when_index_missing
        case: 正常
        summary: '索引が無ければ file: index の手順は何もしない'
        condition: '`indexPath` が `undefined` で `file: index` の `rename_key`'
        mock: 一時フォルダの設定
        expected: 例外を投げず、ファイルが変わらない
      - name: test_apply_step_when_script_fails
        case: 異常
        summary: スクリプトが 0 以外で終わると CliError
        condition: '`process.exit(1)` する `.mjs` を流す `call`'
        mock: 一時フォルダのスクリプト
        expected: '`CliError` の文に版と手順の説明と終了コード 1 が入る'
    refs:
      - '#functions[renameKey]'
      - '#functions[setDefault]'
      - '#functions[mapValues]'
      - '#functions[replaceMark]'
    status: planned
    introduced:
      pr: 39
