title: "ライブラリ本体 / 操作"
lead: '`mount` が描いた記法に操作を付け、外す処理。表の並べ替え・ピン止め・絞り込み、タブ、節と行の詳細の開閉を受け持ち、付ける関数はどれも外す関数を返す。ブラウザでだけ動く。'
directory: |-
  ```tree
  src/
  ├── table-logic.ts  # 表の並べ替えの比べ方と絞り込みの当てはめ（部品の表と操作が使う）
  └── interact/
      ├── index.ts     # attachInteractions
      ├── tables.ts    # 表の並べ替え・ピン止め・絞り込み
      ├── tabs.ts      # タブの切り替え
      └── sections.ts  # 節と行の詳細の開閉、URL の #ID で開く
  ```
data_models:
  - name: FilterValue
    title: 当てた絞り込み
    container: src/table-logic.ts
    summary: 列 1 つに当てた絞り込み（部品『表』の `filterValues` の要素と同じ形）
    properties:
      - name: column
        type: number
        description: 列の位置
      - name: values
        type: string[] | undefined
        description: '`select` の選んだ値'
      - name: text
        type: string | undefined
        description: '`text` の含む文字'
      - name: from
        type: string | undefined
        description: '`date` の開始日（`YYYY-MM-DD`）'
      - name: to
        type: string | undefined
        description: '`date` の終了日（`YYYY-MM-DD`）'
functions:
  - name: attachInteractions
    title: 記法の操作を付ける
    container: src/interact/index.ts
    kind: 関数
    scope: internal
    summary: 機能がオンの記法だけ `attachTables`・`attachTabs`・`attachSections` を呼び、`glossary` か `backlinks` がオンなら `attachTermTips` を呼ぶ。`html` がオンなら `attachEmbeddedHtml` を、さらに `hints` がオンなら `div.mdmark-html` ごとに `attachDiagramTips` を呼ぶ。まとめて外す関数を返す
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean> }'
        required: true
        description: 描いた要素と文書で決まった機能のオン・オフ
    returns:
      type: () => void
      description: 付けた操作を外す関数
    callees:
      - '#functions[attachTables]'
      - '#functions[attachTabs]'
      - '#functions[attachSections]'
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[attachTermTips]
    unit_tests:
      - name: test_attach_interactions
        case: 正常
        summary: オフの記法には操作を付けない
        condition: タブと表を描いた要素、`features` の `tabs` が `false`
        mock: なし
        expected: '`role="tablist"` が無く、表の見出しにボタンがある'
      - name: test_attach_interactions_when_hints_off
        case: 正常
        summary: hints がオフなら埋め込んだ HTML にツールチップの操作を付けない
        condition: ヒントを持つ `div.mdmark-html` を描いた要素と、`features` の `hints` が `false`
        mock: なし
        expected: 印にフォーカスしても `role="tooltip"` の要素が `hidden` を持ったまま
  - name: compareCells
    title: セルを比べる
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 並べ替えの比較。両方が数値（`,` を除いて数になる）なら数の大きさ、それ以外は `Intl.Collator`（`ja`・数字を数として）の順で比べる
    args:
      - name: a
        type: string
        required: true
        description: セルの文字
      - name: b
        type: string
        required: true
        description: セルの文字
    returns:
      type: number
      description: '`a` が前なら負、後なら正、同じなら 0'
    unit_tests:
      - name: test_compare_cells
        case: 正常
        summary: 数値は数の大きさで比べる
        condition: '`10` と `2`、`1,022` と `227`'
        mock: なし
        expected: どちらも正
      - name: test_compare_cells_when_text
        case: 正常
        summary: 文字は辞書の順で比べる
        condition: '`みかん` と `りんご`'
        mock: なし
        expected: 負
  - name: matchesFilter
    title: セルが絞り込みに合うか
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: '`select` は選んだ値のどれかと等しい、`text` は大文字と小文字を区別せずに含む、`date` は開始日以降かつ終了日以前（片方だけも可。日付として読めないセルは合わない）。値が空の絞り込みは全てに合う'
    args:
      - name: cell
        type: string
        required: true
        description: セルの文字
      - name: kind
        type: '"select" | "text" | "date"'
        required: true
        description: 絞り込みの種類
      - name: value
        type: FilterValue
        required: true
        description: 当てた絞り込み
    returns:
      type: boolean
      description: 合うか
    unit_tests:
      - name: test_matches_filter
        case: 正常
        summary: 3 種類を判定する
        condition: '`select` の `["りんご"]` と `りんご`・`りんご飴`、`text` の `描画` と `描画を速くする`、`date` の `2026-10-05`〜`2026-10-15` と `2026-10-10`・`2026-10-20`'
        mock: なし
        expected: '`りんご` が合い `りんご飴` が合わない、`描画を速くする` が合う、`2026-10-10` が合い `2026-10-20` が合わない'
      - name: test_matches_filter_when_open_range
        case: 正常
        summary: 開始日だけのときはその日以降に合う
        condition: '`date` の `from` だけ `2026-10-10` と `2026-10-01`・`2026-10-10`'
        mock: なし
        expected: '`2026-10-01` が合わず、`2026-10-10` が合う'
  - name: attachTables
    title: 表に操作を付ける
    container: src/interact/tables.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-table` の `data-features`・`data-filter` を読み、見出しに `renderTableTools` のボタンとドロワーを置いて、並べ替え・ピン止め・絞り込みを付ける
    description: '並べ替えは昇順 → 降順 → 元の並び（描いたときの順を行に控える）を繰り返し、`th` の `aria-sort` を付け外しする。行の詳細の行はその行に付いて動かす。ピン止めのボタンは `ResizeObserver` で表がはみ出すときだけ出し、押した列までのセルに `position: sticky` と左端からの位置を当てる。絞り込みのドロワーは `hidden` と `aria-expanded` で開閉し、同時に 1 つだけ開く。開いたら最初の入力欄へフォーカスを移し（スマホでもボタンの押下の処理の中で移す）、開いている間だけ `document` の `pointerdown`（外を押す）と `keydown`（Esc）を受け取る。「絞り込みを外す」はその列の入力を空にして絞り込みを当て直す（ドロワーの中の押下を外の押下として扱わない）。列ごとの絞り込みは `matchesFilter` で重ねて当て、合わない行に `hidden` を付ける'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: ボタン・ドロワー・受け取り・`ResizeObserver` を外す関数
    side_effects: 表の DOM を書き換え、イベントと `ResizeObserver` を付ける
    callees:
      - '#functions[compareCells]'
      - '#functions[matchesFilter]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTableTools]
      - '#functions[visibleText]'
    unit_tests:
      - name: test_attach_tables_when_sorted
        case: 正常
        summary: 3 回の押下で昇順・降順・元の並びになる
        condition: '`data` の表（値の列が `10`・`2`・`33`）の値の列の見出しを 3 回押す'
        mock: なし
        expected: '`2,10,33`・`33,10,2`・`10,2,33` の順で、`aria-sort` が `ascending`・`descending`・無し'
      - name: test_attach_tables_when_filtered
        case: 正常
        summary: ドロワーで絞って外し、外の押下で閉じる
        condition: '`data-filter="0:select"` の表でボタンを押し、`りんご` を選び、「絞り込みを外す」を押し、表の外を押す'
        mock: なし
        expected: 開いた後に候補の検索欄にフォーカス、選んだ後に 1 行だけ、外した後に全ての行とドロワーが開いたまま、外を押した後にドロワーが `hidden`
      - name: test_attach_tables_when_escape
        case: 正常
        summary: Esc で閉じてボタンへフォーカスを戻す
        condition: ドロワーを開いて Esc
        mock: なし
        expected: ドロワーが `hidden`、ボタンにフォーカス
      - name: test_attach_tables_when_pinned
        case: 正常
        summary: はみ出す表だけピン止めのボタンを出し、押した列までを留める
        condition: 幅 320px の要素に 10 列の表と 2 列の表、2 列目のピン止めを押す
        mock: なし
        expected: 10 列の表だけボタンが `hidden` を持たず、1・2 列目のセルが `sticky`
      - name: test_attach_tables_when_detached
        case: 正常
        summary: 外すと document の受け取りが残らない
        condition: ドロワーを開いたまま外す関数を呼ぶ
        mock: '`document.removeEventListener` を数える関数で包む'
        expected: '`pointerdown`・`keydown` が外れている'
      - name: test_attach_tables_when_cell_has_term
        case: 正常
        summary: セルに用語の下線があっても、絞り込みの値の候補と見出しのボタンの名前にツールチップの文字を含めない
        condition: '`<!-- table: data filter=名前 -->` の表（列 `名前`・`値`、行 `印`・`表`）と、`印`・`名前` を入れた用語集の表を `mount` で描く'
        mock: なし
        expected: 絞り込みの値の候補が `["印", "表"]`、見出しのボタンの名前が `名前` と `値`、`印` のセルに用語の下線が残る
  - name: attachTabs
    title: タブに操作を付ける
    container: src/interact/tabs.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-tabs` の頭にタブの並びを置き、中身を `role="tabpanel"` にする。`data-group` を持つものは `loadTabChoice` のタブ名のタブ、無ければ 1 つ目を選ぶ。押すと左右の矢印・Home・End で選び、`data-group` を持つときは `tabSelectors` でページの同じ `data-group` の `mdmark-tabs` を同じタブ名へ切り替え（フォーカスは動かさない。そのタブ名が無ければ変えない）、`saveTabChoice` で残す
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: タブの並びを取り除き、`tabSelectors` から外し、中身を `render` の形に戻す関数
    side_effects: タブの DOM を書き換え、イベントを付ける。`data-group` を持つときは localStorage を読み書きし、`root` の外の同じ `data-group` のタブも切り替える
    callees:
      - '#functions[loadTabChoice]'
      - '#functions[saveTabChoice]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTabs]
    unit_tests:
      - name: test_attach_tabs
        case: 正常
        summary: 押すと矢印キーで切り替わる
        condition: 3 つの中身のタブ、2 つ目を押し、右の矢印、End、Home
        mock: なし
        expected: 2 つ目・3 つ目・3 つ目・1 つ目の順に `aria-selected="true"` とフォーカスが移り、その中身だけが `hidden` を持たない
      - name: test_attach_tabs_when_group_synced
        case: 正常
        summary: 同じ組のタブを揃えて残す
        condition: '`data-group="os"` の `macOS`・`Windows` のタブを 2 つ、`data-group="os"` の `macOS`・`Linux` のタブを 1 つ、組の無い `macOS`・`Windows` のタブを 1 つ、2 つの `root` に分けて付け、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 1 つ目と 2 つ目は `Windows` を選び、3 つ目と 4 つ目は `macOS` のまま。フォーカスは 1 つ目の `Windows`。localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_attach_tabs_when_choice_saved
        case: 正常
        summary: 残したタブ名のタブを選んで付ける
        condition: localStorage の `mdmark-tabs:os` が `Windows`、`mdmark-tabs:lang` が `Go`。`data-group="os"` の `macOS`・`Windows` と `data-group="lang"` の `Python`・`TypeScript` のタブ
        mock: なし
        expected: '`os` は `Windows`、`lang` は `Python` を選ぶ。localStorage は書き換わらない'
      - name: test_attach_tabs_when_detached
        case: 正常
        summary: 外したタブは揃える対象から外れる
        condition: '`data-group="os"` のタブを 2 つの `root` に付け、1 つ目の `root` を外してから 2 つ目の `Windows` を押す'
        mock: なし
        expected: 例外が出ず、1 つ目の `root` にタブの並びが無く、中身に `hidden` が無い
  - name: attachSections
    title: 節と行の詳細に開閉を付ける
    container: src/interact/sections.ts
    kind: 関数
    scope: internal
    summary: '`sections` がオンなら節の見出しを開閉のボタンにして `data-section="closed"` の中身を `hidden="until-found"` にし、`row-details` がオンなら詳細を持つ行に開閉のボタンを置いて詳細の行を閉じる。URL の `#ID` が閉じた節の中を指すとき（付けたときと `hashchange`）と `beforematch` でその節を開く'
    args:
      - name: options
        type: '{ root: HTMLElement; sections: boolean; rowDetails: boolean }'
        required: true
        description: 描いた要素と、節・行の詳細の機能
    returns:
      type: () => void
      description: ボタン・`hashchange` の受け取りを外す関数
    side_effects: 節・行の DOM を書き換え、`window` の `hashchange` を受け取る
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSection]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderRowDetail]
      - '#functions[visibleText]'
    unit_tests:
      - name: test_attach_sections
        case: 正常
        summary: 閉じた節を閉じ、押すと開く
        condition: '`data-section="closed"` の節と開いた節'
        mock: なし
        expected: 閉じた節の中身が `hidden="until-found"`、押した後に `hidden` が無く `aria-expanded="true"`
      - name: test_attach_sections_when_hash
        case: 正常
        summary: 閉じた節の中の ID への hashchange で開く
        condition: 閉じた節の中の `### 注意`、`location.hash` を `#注意`
        mock: なし
        expected: 節の中身が `hidden` を持たない
      - name: test_attach_sections_when_row_detail
        case: 正常
        summary: 行の詳細を閉じ、押すと開く
        condition: 2 行目に詳細を持つ表
        mock: なし
        expected: ボタンは 2 行目にだけあり、押した後に詳細の行が `hidden` を持たない
      - name: test_attach_sections_when_row_has_term
        case: 正常
        summary: 行の詳細の開閉ボタンの名前にツールチップの文字を含めない
        condition: 行の詳細を持つ表で、持ち主の行の 1 列目に用語 `印` の下線がある
        mock: なし
        expected: 開閉ボタンの読み上げの名前に `印` が入り、ツールチップの意味の文字が入らない
  - name: visibleText
    title: 要素の見える文字を読む
    container: src/interact/text.ts
    kind: 関数
    scope: internal
    summary: 要素の `textContent` から、用語のツールチップ（`.mdmark-term-tip`）の文字を除いて前後の空白を落とした文字を返す
    description: 表の並べ替え・絞り込み・ピン止めのセルの値、見出しのボタンの名前、行の詳細の開閉ボタンの名前は、この関数で読む。要素は書き換えない
    args:
      - name: element
        type: Element
        required: true
        description: 読む要素
    returns:
      type: string
      description: ツールチップを除いた文字
    unit_tests:
      - name: test_visible_text
        case: 正常
        summary: ツールチップの文字を除く
        condition: '`<td>本文の<span class="mdmark-term-wrap"><span class="mdmark-term">印</span><span class="mdmark-term-tip">用語HTML コメントで書く指定</span></span></td>`'
        mock: なし（Chromium）
        expected: '`本文の印`、`td` の中身が変わらない'
  - name: attachEmbeddedHtml
    title: 埋め込んだ HTML の幅を見る
    container: src/interact/embedded-html.ts
    summary: '`root` の中の `div.mdmark-html` ごとに `ResizeObserver` で幅を見、`scrollWidth` が `clientWidth` を 1px より大きく超える間だけ class `is-wide` と `tabindex="0"` を付ける。返す関数で監視を外し、付けた class と `tabindex` を消す'
    kind: 関数
    scope: internal
    side_effects: '`root` の中の要素の class と `tabindex` を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: 監視を外す関数
    unit_tests:
      - name: test_attach_embedded_html
        case: 正常
        summary: 列より広い間だけ横にスクロールさせる
        condition: '幅 600px の要素に、幅 900px の中身と幅 300px の中身の `div.mdmark-html`。その後、要素に `max-width: none` を付けて幅を 1000px にする（`.mdmark` の `max-width` が `--mdmark-content-width` で止めるため）'
        mock: なし（Chromium）
        expected: 付けた直後は前者だけが `is-wide` と `tabindex="0"` を持ち、幅を広げた後はどちらも持たない。外す関数の後はどちらも持たない
    status: planned
    introduced:
      pr: 45
  - name: loadTabChoice
    title: 残したタブ名を読む
    container: src/interact/tabs.ts
    kind: 関数
    scope: internal
    summary: localStorage の `{TAB_CHOICE_KEY_PREFIX}{group}` を読む。`window.localStorage` の取り出しと読み出しを try の中で行い、例外は `console.warn` に出して `undefined` を返す
    args:
      - name: group
        type: string
        required: true
        description: 組の名前
    returns:
      type: string | undefined
      description: 残したタブ名。残していないか読めないときは `undefined`
    unit_tests:
      - name: test_load_tab_choice
        case: 正常
        summary: 残したタブ名を返す
        condition: localStorage の `mdmark-tabs:os` が `Windows`
        mock: なし
        expected: '`Windows`'
      - name: test_load_tab_choice_when_storage_unavailable
        case: 異常
        summary: localStorage を取り出せなければ undefined
        condition: '`window.localStorage` を読むと `SecurityError` を投げる'
        mock: '`window.localStorage` の getter と `console.warn` を差し替える'
        expected: 例外を投げず `undefined` を返し、`console.warn` が 1 回呼ばれる
  - name: saveTabChoice
    title: 選んだタブ名を残す
    container: src/interact/tabs.ts
    kind: 関数
    scope: internal
    summary: localStorage の `{TAB_CHOICE_KEY_PREFIX}{group}` にタブ名を書く。`window.localStorage` の取り出しと書き込みを try の中で行い、例外は `console.warn` に出して続ける
    args:
      - name: choice
        type: '{ group: string; name: string }'
        required: true
        description: 組の名前と選んだタブ名
    side_effects: localStorage に書く
    unit_tests:
      - name: test_save_tab_choice
        case: 正常
        summary: タブ名を残す
        condition: '`{ group: "os", name: "Windows" }`'
        mock: なし
        expected: localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_save_tab_choice_when_storage_unavailable
        case: 異常
        summary: localStorage を取り出せなければ書かずに続ける
        condition: '`window.localStorage` を読むと `SecurityError` を投げる'
        mock: '`window.localStorage` の getter と `console.warn` を差し替える'
        expected: 例外を投げず、`console.warn` が 1 回呼ばれる
test_files:
  - tests/unit/src/interact/index.browser.test.ts
  - tests/unit/src/interact/tables.browser.test.ts
  - tests/unit/src/interact/tabs.browser.test.ts
  - tests/unit/src/interact/sections.browser.test.ts
  - tests/unit/src/interact/text.browser.test.ts
  - tests/unit/src/interact/embedded-html.browser.test.ts
constants:
  - name: TAB_CHOICE_KEY_PREFIX
    title: 残したタブ名のキーの頭
    container: src/interact/tabs.ts
    summary: 選んだタブ名を残す localStorage のキーの頭。キーは `{頭}{group}`
    value: '"mdmark-tabs:"'
    refs:
