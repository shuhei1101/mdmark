title: ライブラリ本体 / 操作
lead: '`mount` が描いた記法に操作を付け、削除する処理。表の並べ替え・ピン止め・絞り込み、タブ、セクションと行の詳細の開閉、表の見出し行と集計の行を留める処理、コードブロックのコピー、右側の目次を受け持ち、付ける関数はどれも削除する関数を返却する。ブラウザでだけ動く。'
directory: |-
  ```tree
  src/
  ├── code-fold-logic.ts # コードの行のインデントのレベル・畳む行の数・隠す行・縦線を濃くする範囲（render と部品と操作が使用する）
  ├── tree-logic.ts   # キーのパスの分け方・階層の行の計画・YAML の見本の行のパス・階層の絞り込み（render と操作が使用する。DOM もトークンも使用しない）
  ├── table-logic.ts  # 列を動かせるかの判定と列の順の入れ替え・列の幅の上限と収め方・表の並べ替えの比べ方・最下段の見出しのセル・隣り合う同じ値の結合・絞り込みの当てはめ・数の読み込み方・集計と読み込めないセル・TSV と Markdown の表・最終列を畳むか・行を留める量・URL の #ID の読み込み方（部品の表と操作が使用する）
  └── interact/
      ├── index.ts       # attachInteractions
      ├── placement.ts   # ツールチップを持ち主の上と下のどちらに配置するかを決める
      ├── tables.ts      # 表の並べ替え・ピン止め・絞り込み・件数・集計・コピー・行へ移る・行の URL のコピー・最終列を畳む
      ├── table-settings.ts # テーブル設定のパネルの開閉・列の表示の切り替え・列の並べ替え（ドラッグと ↑・↓ キー）
      ├── table-resize.ts # 列の幅のつまみのドラッグ・←→ キーで列の幅を変え、ダブルクリック・ダブルタップ・Enter で戻す
      ├── table-tree.ts  # 階層の表の開閉・パスのツールチップとコピー・行の選択・絞り込み・見本との連動
      ├── sticky.ts      # 表の見出し行と集計の行を画面の端に留める
      ├── clipboard.ts   # クリップボードへ書き込む（表・行の URL・コードブロック・ファイルツリーが使用する）
      ├── code-blocks.ts # コードブロックのコピー
      ├── code-folds.ts  # コードの行の畳む・開く・Shift でまとめて開閉・インデントの縦線を濃くする
      ├── trees.ts       # ファイルツリーのフォルダの開閉とコピー
      ├── tabs.ts        # タブの切り替えと、URL の #ID の指すタブを選ぶ処理
      ├── footnotes.ts   # 脚注のツールチップの開閉と、番号と末尾の一覧の行き来
      ├── sections.ts    # セクションと行の詳細の開閉、Shift で入れ子をまとめて開閉、すべて開閉、URL の #ID で開く
      ├── side-toc.ts    # 右側の目次を配置し、出し方・ピン止め・項目から移る・すべて開閉・今いるセクションを付ける
      ├── back-to-top.ts # 先頭へ戻るボタンを配置し、出し分け・配置する位置・押したときの移動を付ける
      ├── scroller.ts    # 要素をスクロールする一番近い祖先の要素を見つける（先頭へ戻るボタンと差分のミニマップが使用する）
      ├── lightbox.ts    # 画像を拡大のボタンで包み、ライトボックスで開いて切り替え・拡大・縮小・移動を付ける
      ├── gif.ts         # GIF を止める・再生するボタンを付ける
      ├── wide.ts        # wide の範囲の幅の切り替えのボタン
      └── csv-raw.ts     # CSV の表と元の CSV の切り替え
  ```
data_models:
  - name: FilterValue
    title: 適用した絞り込み
    container: src/table-logic.ts
    summary: 列 1 つに適用した絞り込み（部品『表』の `filterValues` の要素と同じ構造）
    properties:
      - name: column
        type: number
        description: 列の位置
      - name: values
        type: string[] | undefined
        description: '`select` の選んだ値'
      - name: text
        type: string | undefined
        description: '`text` のキーワード'
      - name: from
        type: string | undefined
        description: '`date` の開始日（`YYYY-MM-DD`）'
      - name: to
        type: string | undefined
        description: '`date` の終了日（`YYYY-MM-DD`）'
  - name: SideTocState
    title: 右側の目次の状態
    container: src/interact/side-toc.ts
    summary: '`mount` ごとに 1 つ作り、`update` で再描画しても保つ右側の目次の状態。`attachSideToc` が読み込んで描き、押されるたびに書き換える'
    properties:
      - name: open
        type: boolean
        description: 目次を出すボタンで目次を出しているか
      - name: pinned
        type: boolean
        description: ピン止めしているか
    status: planned
    introduced:
      pr: 166
functions:
  - name: attachInteractions
    title: 記法の操作を付ける
    container: src/interact/index.ts
    kind: 関数
    scope: internal
    summary: 機能がオンの記法だけ `attachSections`・`attachTables`・`attachTabs` の順に呼び（付けたときも `hashchange` も、`attachTables` が行へ送信する前に `attachSections` が URL の `#ID` の指す閉じたセクションを開くため）、`table` がオンなら `attachTables` の後に `attachStickyRows` を、`code` がオンなら `attachCodeCopy` と `attachCodeFolds` を、`tree` がオンなら `attachFileTrees` を呼び、`footnotes` がオンなら `attachFootnotes` を呼び、`glossary` か `backlinks` がオンなら `attachTermTips` を呼ぶ。`html` がオンなら `attachEmbeddedHtml` を、さらに `hints` がオンなら `div.mdmark-html` ごとに `attachDiagramTips` を呼ぶ。`attachTermTips`・`attachFootnotes` には `placement` を、`attachDiagrams` と `div.mdmark-html` の `attachDiagramTips` には `diagramPlacement` を指定する。まとめて削除する関数を返却する。`lightbox` がオンなら `attachLightbox` を、`gif` がオンなら `attachLightbox` の後に `attachGifs` を呼ぶ（GIF の包みが拡大のボタンを含むため）
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; placement: TooltipPlacement; diagramPlacement: TooltipPlacement; pinMode?: TablePinMode; onColumnsChange?: (event: MdmarkColumnsChange) => void }'
        required: true
        description: 描いた要素と文書で決まった機能のオン・オフと、既定を適用した設定のツールチップを出す場所（本文の `placement` と図の `diagramPlacement`）と、`attachTables` に指定する表のピン止めの動き（既定を適用した設定の `table.pin`。既定 `each`）と列の表示の通知（`mount` の `opts.onColumnsChange`。`MdmarkColumnsChange` は `src/mount.ts` から型だけを読み込む）
    returns:
      type: () => void
      description: 付けた操作を削除する関数
    callees:
      - '#functions[attachTables]'
      - '#functions[attachTabs]'
      - '#functions[attachSections]'
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[attachTermTips]
      - '#functions[attachStickyRows]'
      - '#functions[attachCodeCopy]'
      - '#functions[attachFileTrees]'
      - '#functions[attachLightbox]'
      - '#functions[attachGifs]'
      - '#functions[attachCodeFolds]'
      - '#functions[attachFootnotes]'
    unit_tests:
      - name: test_attach_interactions
        case: 正常
        summary: オフの記法には操作を付けない
        condition: タブと表を描いた要素、`features` の `tabs` が `false`
        mock: なし
        expected: '`role="tablist"` が無く、表の見出しにボタンがある'
      - name: test_attach_interactions_when_hints_off
        case: 正常
        summary: hints がオフなら埋め込んだ HTML にツールチップの操作を付けない
        condition: ヒントを持つ `div.mdmark-html` を描いた要素と、`features` の `hints` が `false`
        mock: なし
        expected: マーカーにフォーカスしても `role="tooltip"` の要素が `hidden` を持ったまま
      - name: test_attach_interactions_when_row_in_closed_section
        case: 正常
        summary: 閉じたセクションの中の行へは、セクションを開いてから送信する
        condition: '`data-section="closed"` のセクションの中に `rowlink` の表（`id` `もも` の行）を描いた要素で、`location.hash` を `#もも` にして付け、次に `#/a.md#もも` にして `hashchange` を送信する'
        mock: '`Element.prototype.scrollIntoView` を、呼ばれたときにセクションの中身の `hidden` を記録する関数に差し替える'
        expected: どちらも、`もも` の行の `scrollIntoView` が呼ばれたときにセクションの中身が `hidden` を持たず、行が `data-target` を持つ
      - name: test_attach_interactions_when_code_off
        case: 正常
        summary: code がオフならコードブロックにコピーのボタンを付けず、table がオフなら行を留めない
        condition: 帯を持つコードブロックと表を描いた要素、`features` の `code` と `table` が `false`
        mock: なし
        expected: '`mdmark-code-copy` が無く、`table` が `data-mdmark-sticky` を持たない'
      - name: test_attach_interactions_when_tree_off
        case: 正常
        summary: tree がオフならファイルツリーに開閉とコピーを付けない
        condition: ファイルツリーを描いた要素と、`features` の `tree` が `false`
        mock: なし
        expected: '`mdmark-tree-bar` と `mdmark-tree-toggle` が無い'
      - name: test_attach_interactions_when_lightbox_off
        case: 正常
        summary: lightbox がオフなら画像を包まず、gif がオフならボタンを付けない
        condition: 画像と GIF を描いた要素と、`features` の `lightbox` と `gif` が `false`
        mock: なし
        expected: '`button.mdmark-image-open` と `button.mdmark-gif-toggle` が無い'
  - name: compareCells
    title: セルを比べる
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 並べ替えの比較。両方が数値（`,` を除いて数になる）なら数の大きさ、それ以外は `Intl.Collator`（`ja`・数字を数として）の順で比べる
    args:
      - name: a
        type: string
        required: true
        description: セルの文字
      - name: b
        type: string
        required: true
        description: セルの文字
    returns:
      type: number
      description: '`a` が前なら負、後なら正、同じなら 0'
    unit_tests:
      - name: test_compare_cells
        case: 正常
        summary: 数値は数の大きさで比べる
        condition: '`10` と `2`、`1,022` と `227`'
        mock: なし
        expected: どちらも正
      - name: test_compare_cells_when_text
        case: 正常
        summary: 文字は辞書の順で比べる
        condition: '`みかん` と `りんご`'
        mock: なし
        expected: 負
  - name: matchesFilter
    title: セルが絞り込みに合うか
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: '`select` は選んだ値のどれかと等しい、`text` は大文字と小文字を区別せずに含む、`date` は開始日以降かつ終了日以前（片方だけも可。日付として読み込めないセルは合わない）。値が空の絞り込みは全てに合う'
    args:
      - name: cell
        type: string
        required: true
        description: セルの文字
      - name: kind
        type: '"select" | "text" | "date"'
        required: true
        description: 絞り込みの種類
      - name: value
        type: FilterValue
        required: true
        description: 適用した絞り込み
    returns:
      type: boolean
      description: 合うか
    unit_tests:
      - name: test_matches_filter
        case: 正常
        summary: 3 種類を判定する
        condition: '`select` の `["りんご"]` と `りんご`・`りんご飴`、`text` の `描画` と `描画を速くする`、`date` の `2026-10-05`〜`2026-10-15` と `2026-10-10`・`2026-10-20`'
        mock: なし
        expected: '`りんご` が合い `りんご飴` が合わない、`描画を速くする` が合う、`2026-10-10` が合い `2026-10-20` が合わない'
      - name: test_matches_filter_when_open_range
        case: 正常
        summary: 開始日だけのときはその日以降に合う
        condition: '`date` の `from` だけ `2026-10-10` と `2026-10-01`・`2026-10-10`'
        mock: なし
        expected: '`2026-10-01` が合わず、`2026-10-10` が合う'
  - name: attachTables
    title: 表に操作を付ける
    container: src/interact/tables.ts
    kind: 関数
    scope: internal
    summary: 表を横にスクロールさせるのは表を包む `div.mdmark-table-scroll` で、ピン止めを適用するはみ出しはその要素の `scrollWidth` と `clientWidth` で決める。列の表示を切り替えるたびに、テーブル設定のボタンの隠した列の数のバッジ（`span.mdmark-table-tool-badge`。0 列なら `hidden` にする）・`is-active`・`aria-label` を書き換える。コピーの結果はボタンの `title` とスクリーンリーダー向けの名前を書き換えて示す。各 `mdmark-table` の `data-features`・`data-filter`・`data-hide`・`data-total`・`data-pin` を読み込み、見出しに `renderTableTools` のボタンとドロワーを配置して、並べ替え・ピン止め・絞り込みを付ける。`count`・`columns`・`reorder`・`total`・`copy` の表は `renderTableBar` の帯とメニュー（テーブル設定の一覧を分ける留めた列の数は `data-pin` がある表だけ数え、無い表は 0）を、`columns`・`reorder` の表は `attachTableSettings` でテーブル設定を、`data-tree` の表は `attachTableTree` で階層の操作を、`total` の表は `renderTotalRows` の集計の行を配置し、`rowlink` の表は行へ移る処理と行の URL のコピーを付け、`resize` の表は `attachColumnResize` で列の幅のつまみの操作を付ける。全ての表に、描く先の要素の幅で最終列を畳む処理を付ける。`thead` が複数の行を持つ表は `bottomHeadCells` で列ごとの最下段の見出しのセルを決め、ボタンをそのセルにだけ配置し、列の位置はそのセルの列で数える（`cellIndex` を使用しない）。`data-merge-columns` の表は、並べ替え・絞り込みのたびに、表示している本文の行のその列の値から `mergeSpans` で結合を決め、始まりのセルに `rowspan` と `is-merged`、続くセルに `hidden` をもう一度付ける。結合で隠したセルも値を持つセルとして並べ替え・絞り込み・コピー・集計に使用する。囲み・表から探す部品の要素（ピン止めのボタン・ドロワー・畳んだ列のセル・行の詳細の行など）は、`closest(".mdmark-table")` がその囲みのものだけにし、行の詳細の中の表の要素を取得しない。受け取り（`click`・`change`・`input`・`keydown`）は、対象の `closest(".mdmark-table")` がその囲みのときだけ処理する
    description: |-
      並べ替えは降順 → 昇順 → 元の並び（描いたときの順を行に記録する）を繰り返し、`th` の `aria-sort` を付与・解除する。行の詳細の行と畳んだ最終列の開閉の行はその行に付いて動かす。ピン止めのボタンは `ResizeObserver` で表がはみ出すときだけ出し、留める列の位置の集まり（付けたときは `initialPinnedColumns`、ボタンを押すと `togglePinnedColumn`）のセルに、表がはみ出す間だけ `position: sticky` と `pinOffsets` の `left`（`each` は `right` も）を適用する（はみ出さない間は留めず、留める列は記録したまま）。列の幅は見出しの列ごとのセルの `offsetWidth`（隠した列は 0）で測る。ボタンの `aria-pressed` は、`each` は留めた列、`through` は留めた最も右の列だけを `true` にする。境の線は、表を包む要素の `scroll` と留める列を変えるたびに、左端に留まっている最も右の列のセルに `is-pinned-edge`、右端に留まっている最も左の列のセルに `is-pinned-edge-end` を付ける（留まっているかは列の元の位置と `scrollLeft`・`clientWidth`・`pinOffsets` で決める）。`thead` が複数の行を持つ表の見出しのセルは、またぐ列が全て留める列のときだけ留め、`left` は最初の列、`right` は最後の列の値にする。セルの値は `cellValue` で読み込む（`data-check` の列は `data-value`）。絞り込みのドロワーは `hidden` と `aria-expanded` で開閉し、同時に 1 つだけ開く。開いたら最初の入力欄へフォーカスを移し（スマホでもボタンの押下の処理の中で移す）、開いている間だけ `document` の `pointerdown`（外を押す）と `keydown`（Esc）を受け取る。「絞り込みを解除」はその列の入力を空にして絞り込みをもう一度適用する（ドロワーの中の押下を外の押下として扱わない）。列ごとの絞り込みは `matchesFilter` で重ねて当て、合わない行に `hidden` を付ける。

      件数と集計の行は、絞り込みを適用するたびに、行の詳細・開閉の行・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行から再作成する（集計は `computeTotal`）。集計の行は計算ごとの 1 行で、付けたときに全ての本文の行から `findUnreadableTotals` で数として読み込めないセルを持つ列と計算を記録し、そのセルは再作成しても空にする。`集計` のボタンのメニュー（`表示する集計`）のチェックボックスに合わせて計算の行の `hidden` を切り替え、ボタンの `is-active` とスクリーンリーダー向けの名前を書き換え、`{計算の名前}の行を出しました`・`{計算の名前}の行を隠しました` を帯の `mdmark-table-status` に入れる（選択は覚えない）。テーブル設定のパネル・集計のメニュー・コピーの形式のメニューは絞り込みのドロワーと同じ開閉の受け取りを使用する（同時に開くのはドロワーとパネル・メニューを合わせて 1 つ）。列の表示と順の切り替え（テーブル設定のパネルの目のアイコンとつまみ）は `attachTableSettings` に任せ、切り替えるたびに最終列を畳むかをもう一度決める。ピン止めの左端からの位置は隠した列を除いてもう一度測る。`onColumnsChange` を指定したときは、`attachTableSettings` が目のアイコンで列の表示を切り替えた後に、`{ tableIndex, hidden }` で 1 回呼ぶ。`tableIndex` は付けたときに `root` の中の `columns` の表（`.mdmark-diff-block[data-kind="del"]` の中の表を除く）を文書の順に並べた位置、`hidden` は隠している列の見出しのセルの `visibleText` を列の順に並べた新しい配列。例外を投げたら、`onColumnsChange` と元のエラーを `console.error` に出して続ける。

      コピーは形式のボタンの `data-format` で、見出しの行と、行の詳細・開閉の行・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行と階層の表の畳んで隠した行（補った行 `is-virtual` を除く）の、テーブル設定で隠していない列（畳んだ最終列は含める）の `visibleText`（階層の表のキーの列は行の `data-path`）を `tableToMarkdown` か `tableToTsv` にして `copyText` で書き込む。書き込めたらボタンを `copied` にして 2 秒で `idle` に戻し、`{形式の名前}をコピーしました` を `mdmark-table-status` に入れる。書き込めなければボタンを `failed` にし、前のパネルを取り除いてから帯の直後に `renderCopyPanel` のパネルを配置し、`textarea` へフォーカスを移して `select()` し、`クリップボードにコピーできませんでした。選択した{形式の名前}を手動でコピーできます` を入れる。パネルは閉じるボタンか、パネルの中の Esc で取り除き、フォーカスを `表をコピー` に戻す。

      行へ移る処理は、付けたときと `hashchange` で `rowIdFromHash` の ID を持つ行を探し、囲む閉じた `details` を開き（閉じたセクションは、`attachInteractions` が先に付けた `attachSections` が同じきっかけで開いている）、行が `hidden` ならその表の絞り込みを全て削除し、`scrollIntoView` してその行だけに `data-target` を付ける。行へのリンクのマーカーを押すと、移る動きはそのままにマーカーの `href` プロパティ（解決済みの絶対 URL）を `copyText` で記載し、描いたときにマーカーの横へ配置した `mdmark-row-link-notice` に `data-state` と文言（`リンクをコピーしました`・`リンクをコピーできませんでした`）を入れて 2 秒後に空に戻す。

      列の幅は、`attachColumnResize` に、列の幅の上限を返す関数（`columnWidthLimit` に、表を包む要素の `clientWidth`・はみ出しているか・列ごとの幅・留めている列を渡す）と、幅を変えた後の処理を渡す。幅を変えた後は、留める列があれば `pinColumns` で留める位置と境の線をもう一度決める。最終列を畳むかは決め直さない。

      最終列を畳む処理は、描いた要素 `root` を `ResizeObserver` で見、`root` の幅（`contentRect.width`）が前と変わったときと列の表示の切り替えのときだけ、一度畳みを削除して測り、`shouldFold` で決める（高さだけの変化では決め直さない）。表示している最終列に幅を指定している（`is-resized`）ときは畳まない。測るのは `root` の中身の幅と、表示している最終列（先頭の列を除く）のセルの中身の高さが、計算した `line-height` の 1.5 倍を超えるものがあるか。畳むときは最終列のセルに `mdmark-fold-col`、囲みに `is-folded` を付け、行の詳細を持たない行には `renderFoldedColumn` の開閉のボタンを先頭のセルに、開閉の行を行の直後に配置し、行の詳細を持つ行には詳細の中身の先頭に同じ `mdmark-fold-part` を配置する。畳まないときはこれらを取り除く。開閉のボタンは `aria-expanded` と開閉の行の `hidden` を切り替え、開閉の行はその行が隠れると隠す
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
      - name: options
        type: '{ onColumnsChange?: (event: MdmarkColumnsChange) => void; pinMode?: TablePinMode }'
        required: false
        description: 列の表示の通知と、ピン止めの動き（既定 `each`）
    returns:
      type: () => void
      description: ボタン・ドロワー・パネル・開閉の行・受け取り・`ResizeObserver`・タイマーを削除する関数
    side_effects: 表の DOM を書き換え、イベントと `ResizeObserver` を付ける
    callees:
      - '#functions[compareCells]'
      - '#functions[matchesFilter]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTableTools]
      - '#functions[visibleText]'
      - '#functions[cellValue]'
      - '#functions[findUnreadableTotals]'
      - '#functions[tableToMarkdown]'
      - '#functions[shouldFold]'
      - '#functions[copyText]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCopyPanel]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderFoldedColumn]
      - '#functions[bottomHeadCells]'
      - '#functions[mergeSpans]'
      - '#functions[attachColumnResize]'
      - '#functions[columnWidthLimit]'
    unit_tests:
      - name: test_attach_tables_when_sorted
        case: 正常
        summary: 3 回の押下で降順・昇順・元の並びになる
        condition: '`data` の表（値の列が `10`・`2`・`33`）の値の列の見出しを 3 回押す'
        mock: なし
        expected: '`33,10,2`・`2,10,33`・`10,2,33` の順で、`aria-sort` が `descending`・`ascending`・無し'
      - name: test_attach_tables_when_filtered
