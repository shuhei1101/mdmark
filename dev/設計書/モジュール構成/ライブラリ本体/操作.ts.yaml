  - name: computeTotal
    title: 列を集計する
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: セルの文字を集計して表示する文字にする。`sum`・`avg` は `parseNumberCell` で数として読めるセルだけ（空のセルと読めないセルを除く）、`count` は空でないセルを数える。値は `Intl.NumberFormat`（`ja`、小数は 2 桁まで）で整え、平均する値が無いときは `—`。読めないセルを持つ列のセルを空にするのは呼ぶ側（`findUnreadableTotals`）
    args:
