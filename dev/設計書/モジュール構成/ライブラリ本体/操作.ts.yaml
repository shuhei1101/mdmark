        condition: 幅 390px の要素に、`test_attach_tables_when_folded` の 3 列 3 行の表で 2 行目に行の詳細を持つものを `attachSections` の後に付け、行の詳細のボタンを押す
        mock: なし
        expected: 2 行目は `mdmark-fold-toggle` を持たず、詳細の行の中身の先頭に `mdmark-fold-part` があり、押した後に詳細の行が `hidden` を持たない。1・3 行目は `mdmark-fold-toggle` を持つ
      - name: test_attach_tables_when_fold_column_hidden
