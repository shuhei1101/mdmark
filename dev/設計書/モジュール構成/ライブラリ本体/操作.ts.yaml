      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTotalRows]
  - name: attachTabs
    title: タブに操作を付ける
    container: src/interact/tabs.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-tabs` の頭にタブの並びを置き、中身を `role="tabpanel"` にする。`data-group` を持つものは `loadTabChoice` のタブ名のタブ、無ければ 1 つ目を選ぶ。中身の選び方を `tabPanelSelectors` に登録し、付けたときに URL の `#ID`（`rowIdFromHash` で読む）が選ばれていない中身の中を指すなら、残したタブ名より先に `revealTabTarget` でそのタブを選んで要素を `scrollIntoView` する。押すと左右の矢印・Home・End で選び、`data-group` を持つときはページの `document.querySelectorAll(".mdmark-tabs[data-group]")` を `dataset.group === group` で絞った `mdmark-tabs` を、`tabSelectors` から引いた関数で同じタブ名へ切り替え（組の名前をセレクタに入れない。`tabSelectors` に無いものは飛ばす。フォーカスは動かさない。そのタブ名が無ければ変えない）、`saveTabChoice` で残す
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: タブの並びを取り除き、`tabSelectors` と `tabPanelSelectors` から外し、中身を `render` の形に戻す関数
    side_effects: タブの DOM を書き換え、イベントを付ける。`data-group` を持つときは localStorage を読み書きし、`root` の外の同じ `data-group` のタブも切り替える
    callees:
      - '#functions[loadTabChoice]'
      - '#functions[saveTabChoice]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTabs]
      - '#functions[revealTabTarget]'
      - '#functions[rowIdFromHash]'
    unit_tests:
      - name: test_attach_tabs
        case: 正常
        summary: 押すと矢印キーで切り替わる
        condition: 3 つの中身のタブ、2 つ目を押し、右の矢印、End、Home
        mock: なし
        expected: 2 つ目・3 つ目・3 つ目・1 つ目の順に `aria-selected="true"` とフォーカスが移り、その中身だけが `hidden` を持たない
      - name: test_attach_tabs_when_group_synced
        case: 正常
        summary: 同じ組のタブを揃えて残す
        condition: '`data-group="os"` の `macOS`・`Windows` のタブを 2 つ、`data-group="os"` の `macOS`・`Linux` のタブを 1 つ、組の無い `macOS`・`Windows` のタブを 1 つ、2 つの `root` に分けて付け、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 1 つ目と 2 つ目は `Windows` を選び、3 つ目と 4 つ目は `macOS` のまま。フォーカスは 1 つ目の `Windows`。localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_attach_tabs_when_choice_saved
        case: 正常
        summary: 残したタブ名のタブを選んで付ける
        condition: localStorage の `mdmark-tabs:os` が `Windows`、`mdmark-tabs:lang` が `Go`。`data-group="os"` の `macOS`・`Windows` と `data-group="lang"` の `Python`・`TypeScript` のタブ
        mock: なし
        expected: '`os` は `Windows`、`lang` は `Python` を選ぶ。localStorage は書き換わらない'
      - name: test_attach_tabs_when_detached
        case: 正常
        summary: 外したタブは揃える対象から外れる
        condition: '`data-group="os"` のタブを 2 つの `root` に付け、1 つ目の `root` を外してから 2 つ目の `Windows` を押す'
        mock: なし
        expected: 例外が出ず、1 つ目の `root` にタブの並びが無く、中身に `hidden` が無い
      - name: test_attach_tabs_when_group_has_quote
        case: 正常
        summary: セレクタの記号を含む組の名前でも揃える
        condition: '`data-group` が `a"b\c]` の `macOS`・`Windows` のタブを 2 つ、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 例外が出ず、2 つとも `Windows` を選び、localStorage の `mdmark-tabs:a"b\c]` が `Windows`
      - name: test_attach_tabs_when_hash_in_tab
        case: 正常
        summary: 'URL の #ID が指す要素を含むタブを、残したタブ名より先に選ぶ'
        condition: localStorage の `mdmark-tabs:os` が `macOS`。`data-group="os"` の `macOS`・`Windows` のタブで、`Windows` の中身に `### 注意`。`location.hash` を `#注意` にしてから付ける
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`Windows` を選び、`### 注意` で `scrollIntoView` が 1 回呼ばれる。localStorage の `mdmark-tabs:os` は `macOS` のまま'
  - name: attachSections
