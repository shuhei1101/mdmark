        summary: ドロワーで絞って除外し、外の押下で閉じる
        condition: '`data-filter="0:select"` の表でボタンを押し、`りんご` を選び、「絞り込みを解除」を押し、表の外を押す'
        mock: なし
        expected: 開いた後に候補の検索欄にフォーカス、選んだ後に 1 行だけ、削除した後に全ての行とドロワーが開いたまま、外を押した後にドロワーが `hidden`
      - name: test_attach_tables_when_escape
        case: 正常
        summary: Esc で閉じてボタンへフォーカスを戻す
        condition: ドロワーを開いて Esc
        mock: なし
        expected: ドロワーが `hidden`、ボタンにフォーカス
      - name: test_attach_tables_when_pinned
        case: 正常
        summary: はみ出す表だけピン止めのボタンを出して先頭の列を既定で留め、押した列だけを留める
        condition: 幅 320px の要素に 10 列の表と 2 列の表、3 列目のピン止めを押し、もう一度押す
        mock: なし
        expected: 10 列の表だけボタンが `hidden` を持たない。付けた直後は 10 列の表の 1 列目のセルだけが `sticky` で 1 列目のボタンが `aria-pressed="true"`、2 列の表はどのセルも `sticky` でない。押した後は 1・3 列目のセルが `sticky` で 2 列目は `sticky` でなく、3 列目のセルの `left` が 1 列目のセルの `offsetWidth`、もう一度押した後は 1 列目のセルだけが `sticky`
      - name: test_attach_tables_when_pin_specified
        case: 正常
        summary: data-pin の列だけを留め、pin の無い表は留めず、幅が広がると留めを解除する
        condition: 幅 320px の要素に、`data-features="pin"`・`data-pin="1"` の 8 列の表と `data-features=""` の 10 列の表を付け、要素の幅を 2000px にする
        mock: なし
        expected: 付けた直後は 1 つ目の表の 2 列目のセルだけが `sticky` で 2 列目のボタンだけが `aria-pressed="true"`、2 つ目の表はピン止めのボタンが無くどのセルも `sticky` でない。2000px にした後は 1 つ目の表のどのセルも `sticky` でない
      - name: test_attach_tables_when_check_column
        case: 正常
        summary: 真偽値の列を data-value の値で並べ替え・絞り込み・コピーする
        condition: '`data-features="sort filter copy"`・`data-filter="1:select"`・`data-check="1"` の表（名前 `a`・`b`・`c`、必須の `td` が `data-value` の `true`・`false`・`true` と ✓ か `いいえ` の中身）で、必須の列を昇順に並べ、`true` に絞り、TSV でコピーする'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に差し替える'
        expected: 並べた後の名前が `b`・`a`・`c`、絞り込みの候補が `true`・`false`、絞った後は `a`・`c` の 2 行、`名前\t必須\na\ttrue\nc\ttrue` で 1 回呼ばれる
      - name: test_attach_tables_when_detached
