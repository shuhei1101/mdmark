        mock: '`navigator.clipboard.writeText` を 1 回目は `NotAllowedError` で拒み 2 回目は解決する関数に、時計を偽の時計に差し替える'
        expected: 1 回目の後と 2 秒後は `data-state="failed"`、2 回目の後は `copied`。`unhandledrejection` が起きない
      - name: test_attach_code_copy_when_detached
        case: 正常
