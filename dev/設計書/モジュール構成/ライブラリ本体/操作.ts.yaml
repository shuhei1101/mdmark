        case: 正常
        summary: 行の詳細の中の表の要素を、親の表の操作が取得しない
        condition: 幅 320px の要素に、`data-features="sort pin filter"`・`data-filter="0:select"` の 10 列の親の表を付ける。1 行目の行の詳細の中に `data-features="pin filter"`・`data-filter="0:select"` の 2 列の表の囲みを配置し、`attachSections` の後に付ける。行の詳細は閉じたまま、付けた後に描く先の要素の幅を 300px に変えて `ResizeObserver` の呼び出しを待ち、さらに親の表の囲みの幅だけを 250px に変えて待ち、続けて親の表の 1 列目の絞り込みのボタンを押す
        mock: なし
        expected: 親の表のピン止めのボタンが `hidden` を持たず、中の表のピン止めのボタンが `hidden` を持つ。押した後に開くのは親の表の囲みの 1 列目のドロワーだけで、中の表のドロワーは `hidden` のまま。値の候補に中の表のセルの文字が無い。中の表の囲みに親の表のドロワーが配置されない
      - name: test_attach_tables_when_nested_table_sorted
        case: 正常
        summary: 行の詳細の中の表の並べ替えのボタンを押しても、親の表を並べ替えない
        condition: '`data-features="sort pin"` の 2 列の親の表（1 列目の値が上から `a`・`b`）を付ける。1 行目の行の詳細の中に `data-features="sort pin"` の 2 列の表の囲みを配置し、`attachSections` の後に付け、中の表の 1 列目の並べ替えのボタンを押す'
        mock: なし
        expected: 親の表の本文の行の並びが `a`・`b` のままで、親の表の見出しのセルが `aria-sort` を持たない。中の表の 1 列目の見出しのセルの `aria-sort` が `descending`
      - name: test_attach_tables_when_merged_sorted
        case: 正常
        summary: 最下段の見出しにボタンを配置し、並べ替え・絞り込みの後にもう一度結合する
        condition: インターフェース定義『文書を描く』の「正常系（結合した表を並べ替えて絞り込む）」の表
        mock: '`navigator.clipboard.writeText` を記録する関数'
        expected: ボタンが 2 行目の `th` にだけある。降順の後に分類のセルがどれも `rowspan` と `hidden` を持たない。`A` に絞り込んだ後に 1 行目の分類のセルが `rowspan="2"`。TSV の各行の分類が `A`
      - name: test_attach_tables_when_row_header_pinned
        case: 正常
        summary: 行見出しを持つはみ出す表を、描いた直後に行見出しの全ての列を留める
        condition: 幅 320px の要素に、`row-header=2` の 10 列 5 行の表
        mock: なし
        expected: 1・2 列目のピン止めのボタンが `aria-pressed="true"`、1・2 列目のセルの `position` が `sticky`、3 列目は `sticky` でない
      - name: test_attach_tables_when_tree_copied
        case: 正常
        summary: 階層の表のコピーに畳んだ行を含め、キーを全体のパスで記載し、補った行を含めない
        condition: '`data-tree="0"` の表（キーは `features.table`・`aliases[].id`）で `aliases[]` を畳み、Markdown の表でコピーする'
        mock: '`navigator.clipboard.writeText` を代役にする'
        expected: '記載した文字の本文の行が `features.table`・`aliases[].id` の 2 行で、キーのセルが全体のパスのまま。`features`・`aliases[]` の行が無い'
      - name: test_attach_tables_when_columns_notified
        case: 正常
        summary: 列の表示を切り替えるたびに、表の番号と隠している列の見出しで通知する
        condition: '`data-features="columns"` の表を 3 つ（1 つ目は `div.mdmark-diff-block[data-kind="del"]` の中、2 つ目は `data-hide="2"`、3 つ目は列 `名前`・`状態`・`説明`）付け、3 つ目の表のテーブル設定のパネルで `状態` の目のアイコンを押して隠し、もう一度押して表示する'
        mock: '`onColumnsChange` は引数を記録する関数'
        expected: '付けた時点では呼ばれない。隠した後に `{ tableIndex: 1, hidden: ["状態"] }`、戻した後に `{ tableIndex: 1, hidden: [] }` で、合わせて 2 回呼ばれる'
      - name: test_attach_tables_when_columns_callback_throws
        case: 異常
        summary: 通知が例外を投げても列の表示を切り替える
        condition: '`data-features="columns"` の表で 2 列目のチェックを解除する'
        mock: '`onColumnsChange` は例外を投げる。`console.error` を記録する'
        expected: 2 列目の `th`・`td` が `hidden` を持ち、`console.error` に `onColumnsChange` と投げたエラー
      - name: test_attach_tables_when_columns_badge
        case: 正常
        summary: 列の表示を切り替えるたびにバッジとスクリーンリーダー向けの名前を書き換える
        condition: '`data-features="columns"`・`data-hide="1"` の 3 列の表で、2 列目を表示し、次に 2 列目と 3 列目を隠し、3 列目を表示する'
        mock: なし
        expected: 付けた直後はバッジ `1` と `aria-label` が `テーブル設定（1 列を非表示）`。表示した後はバッジが `hidden` で `is-active` を持たず、`aria-label` が `テーブル設定`。隠した後はバッジ `2`。3 列目を表示した後はバッジ `1`
      - name: test_attach_tables_when_scroll_wrapper
        case: 正常
        summary: 包む要素がはみ出す間だけピン止めを適用する
        condition: 幅 1000px の要素に、`div.mdmark-table-scroll` で包んだ 2 列の `data` の表と 12 列の `data` の表
        mock: なし（Chromium）
        expected: 2 列の表はピン止めのボタンが `hidden` で `table` の幅が包む要素の幅と同じ。12 列の表はピン止めのボタンが `hidden` を持たず、包む要素の `scrollWidth` が `clientWidth` より大きい
      - name: test_attach_tables_when_pinned_at_end
        case: 正常
        summary: 留めた列より左を表示している間は、留めた列を右端に並べて留める
        condition: 幅 800px の要素（既定で留める先頭の列と 8・9 列目が見えている範囲に収まる）に 10 列の表、右端までスクロールして 8・9 列目のピン止めを押し、左端までスクロールする
        mock: なし
        expected: 8 列目のセルの `right` が 9 列目のセルの `offsetWidth`、9 列目のセルの `right` が `0px`。左端に戻した後、表を包む要素の右端と 9 列目のセルの右端がそろい、8 列目のセルが `is-pinned-edge-end` を持ち、9 列目は持たない
      - name: test_attach_tables_when_pinned_through
        case: 正常
        summary: '`pinMode: through` の表は押した列までを左端に留め、押した列のボタンだけを押した状態にする'
        condition: '幅 320px の要素に 10 列の表を `pinMode: "through"` で付け、3 列目のピン止めを押し、もう一度押す'
        mock: なし
        expected: 押した後は 1〜3 列目のセルが `sticky` で `right` が空、3 列目のボタンだけが `aria-pressed="true"`、ボタンの `aria-label` が `「{列名}」の列までピン止め`。もう一度押した後はどのセルも `sticky` でない
      - name: test_attach_tables_when_pinned_under_merged_header
        case: 正常
        summary: 結合した見出しの下の 1 列だけを留めると、結合したセルは留めない
        condition: 幅 320px の要素に、1 行目が `名前`・`設定`（3 列）・`備考`、2 行目が `名前`・`型`・`既定`・`必須`・`備考` の表を付け、`既定` のピン止めを押す
        mock: なし
        expected: '`既定` の 2 行目の `th` と本文の `td` が `sticky` で `left` が `名前` のセルの `offsetWidth`、1 行目の `設定` の `th` は `sticky` でない'
      - name: test_attach_tables_when_column_resized
        case: 正常
        summary: '`resize` の表は、留めた列の幅を変えると留める位置を計算し直し、上限で止める'
        condition: 幅 320px の要素に `data-features="pin resize"` の、列名が短く留めた 1 列目と 3 列目の幅の合計が見えている幅に収まる 10 列の表を付け、3 列目のピン止めを押し、1 列目のつまみで → キーを押し、続けて 1 列目のつまみを 2000px 右へドラッグする
        mock: なし
        expected: → キーの後、3 列目のセルの `left` が 1 列目の `th` の `offsetWidth`。ドラッグの後、1 列目の `th` の `offsetWidth` が表を包む要素の `clientWidth` から 3 列目の `th` の `offsetWidth` を引いた値以下で、つまみの `aria-valuenow` と `aria-valuemax` が同じ
      - name: test_attach_tables_when_resized_column_not_folded
        case: 正常
        summary: 最終列を畳む判定は描く先の要素の幅の変化でだけやり直し、幅を指定した最終列は畳まない
        condition: 幅 600px の要素に、最終列が 1 行に収まる 3 列の表を付け、最終列のつまみで ← キーを押して折り返させ、続けて要素の幅を 590px にする
        mock: なし
        expected: ← キーの後も、要素の幅を変えた後も、最終列のセルが `mdmark-fold-col` を持たず、囲みが `is-folded` を持たない
      - name: test_attach_tables_when_resize_off
        case: 正常
        summary: '`resize` を持たない表には、つまみの操作を付けない'
        condition: '`data-features="sort pin"` の表を付ける'
        mock: なし
        expected: '`mdmark-col-resize` が無い'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[列の表示の通知]
      - '#functions[computeTotal]'
      - '#functions[tableToTsv]'
      - '#functions[rowIdFromHash]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTableBar]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTotalRows]
  - name: attachTabs
    title: タブに操作を付ける
    container: src/interact/tabs.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-tabs` の頭にタブの並びを配置し、中身を `role="tabpanel"` にする。`data-group` を持つものは `loadTabChoice` のタブ名のタブ、無ければ 1 つ目を選ぶ。中身の選び方を `tabPanelSelectors` に登録し、付けたときに URL の `#ID`（`rowIdFromHash` で読み込む）が選ばれていない中身の中を指すなら、残したタブ名より先に `revealTabTarget` でそのタブを選んで要素を `scrollIntoView` する。押すと左右の矢印・Home・End で選び、`data-group` を持つときはページの `document.querySelectorAll(".mdmark-tabs[data-group]")` を `dataset.group === group` で絞った `mdmark-tabs` を、`tabSelectors` から参照した関数で同じタブ名へ切り替え（組の名前をセレクタに入れない。`tabSelectors` に無いものは飛ばす。フォーカスは動かさない。そのタブ名が無ければ変えない）、`saveTabChoice` で残す。タブのボタンにはタブ名の要素の子のノードのコピーを入れ（`strong` を残す）、組の統一と残すタブ名にはその文字を使用する。入れ子の `mdmark-tabs` はそれぞれ別の並びにし、キーの移動と選択はその並びの中だけで行う
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: タブの並びを取り除き、`tabSelectors` と `tabPanelSelectors` から除外し、中身を `render` の構造に戻す関数
    side_effects: タブの DOM を書き換え、イベントを付ける。`data-group` を持つときは localStorage を読み込みと保存し、`root` の外の同じ `data-group` のタブも切り替える
    callees:
      - '#functions[loadTabChoice]'
      - '#functions[saveTabChoice]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTabs]
      - '#functions[revealTabTarget]'
      - '#functions[rowIdFromHash]'
    unit_tests:
      - name: test_attach_tabs
        case: 正常
        summary: 押すと矢印キーで切り替わる
        condition: 3 つの中身のタブ、2 つ目を押し、右の矢印、End、Home
        mock: なし
        expected: 2 つ目・3 つ目・3 つ目・1 つ目の順に `aria-selected="true"` とフォーカスが移り、その中身だけが `hidden` を持たない
      - name: test_attach_tabs_when_group_synced
        case: 正常
        summary: 同じ組のタブを統一して残す
        condition: '`data-group="os"` の `macOS`・`Windows` のタブを 2 つ、`data-group="os"` の `macOS`・`Linux` のタブを 1 つ、組の無い `macOS`・`Windows` のタブを 1 つ、2 つの `root` に分けて付け、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 1 つ目と 2 つ目は `Windows` を選び、3 つ目と 4 つ目は `macOS` のまま。フォーカスは 1 つ目の `Windows`。localStorage の `mdmark-tabs:os` が `Windows`
      - name: test_attach_tabs_when_choice_saved
        case: 正常
        summary: 残したタブ名のタブを選んで付ける
        condition: localStorage の `mdmark-tabs:os` が `Windows`、`mdmark-tabs:lang` が `Go`。`data-group="os"` の `macOS`・`Windows` と `data-group="lang"` の `Python`・`TypeScript` のタブ
        mock: なし
        expected: '`os` は `Windows`、`lang` は `Python` を選ぶ。localStorage は書き換わらない'
      - name: test_attach_tabs_when_detached
        case: 正常
        summary: 削除したタブは統一する対象から削除される
        condition: '`data-group="os"` のタブを 2 つの `root` に付け、1 つ目の `root` を削除してから 2 つ目の `Windows` を押す'
        mock: なし
        expected: 例外が出ず、1 つ目の `root` にタブの並びが無く、中身に `hidden` が無い
      - name: test_attach_tabs_when_group_has_quote
        case: 正常
        summary: セレクタの記号を含む組の名前でも統一する
        condition: '`data-group` が `a"b\c]` の `macOS`・`Windows` のタブを 2 つ、1 つ目の `Windows` を押す'
        mock: localStorage を空にしておく
        expected: 例外が出ず、2 つとも `Windows` を選び、localStorage の `mdmark-tabs:a"b\c]` が `Windows`
      - name: test_attach_tabs_when_hash_in_tab
        case: 正常
        summary: 'URL の #ID が指す要素を含むタブを、残したタブ名より先に選ぶ'
        condition: localStorage の `mdmark-tabs:os` が `macOS`。`data-group="os"` の `macOS`・`Windows` のタブで、`Windows` の中身に `### 注意`。`location.hash` を `#注意` にしてから付ける
        mock: '`Element.prototype.scrollIntoView` を記録する関数に差し替える'
        expected: '`Windows` を選び、`### 注意` で `scrollIntoView` が 1 回呼ばれる。localStorage の `mdmark-tabs:os` は `macOS` のまま'
      - name: test_attach_tabs_when_nested
        case: 正常
        summary: 入れ子のタブをそれぞれの並びで切り替え、強調したタブ名をボタンに残す
        condition: インターフェース定義『文書を描く』の「正常系（入れ子のタブを切り替える）」の文書を描いた要素
        mock: なし
        expected: '`role="tablist"` が 2 つで、`Windows` のボタンが `strong` を持つ。`bash` を押した後も `macOS` が選ばれたまま。内側の `bash` で右の矢印を押すとフォーカスが `zsh` に移る'
  - name: attachSections
    title: セクションと行の詳細に開閉を付ける
    container: src/interact/sections.ts
    kind: 関数
    scope: internal
    summary: '`sections` がオンならセクションの見出し（h1〜h4）を開閉のボタンにして `data-section="closed"` の中身を `hidden="until-found"` にし、`row-details` がオンなら詳細を持つ行に開閉のボタンを配置して詳細の行を閉じる。見出しが差分のブロック（`div.mdmark-diff-block`）の中にあるときは、そのブロックの次の兄弟の `mdmark-section-body` をセクションの中身にする。セクションの開閉の関数を `sectionSetters` に記録する。Shift を押しながら開閉のボタンを押したとき（`click` の `shiftKey`）と、ボタンで Shift を押しながら Enter・Space を押したとき（`keydown` の `shiftKey`。既定の動きを止め、`click` を発生させない）は、そのセクションを今と逆の状態にし、中の入れ子の全てのセクション（中身の中の `mdmark-section-body`）を同じ状態にする。URL の `#ID`（`rowIdFromHash` で読み込む。まとめた HTML の `#/{文書のパス}#{ID}` も同じ）が指す要素があるとき（付けたときと `hashchange`）は `revealTarget` を呼び、`beforematch` でそのセクションを開く'
    args:
      - name: options
        type: '{ root: HTMLElement; sections: boolean; rowDetails: boolean }'
        required: true
        description: 描いた要素と、セクション・行の詳細の機能
    returns:
      type: () => void
      description: ボタン・`hashchange` の受け取りを解除する関数
    side_effects: セクション・行の DOM を書き換え、`window` の `hashchange` を受け取る
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSection]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderRowDetail]
      - '#functions[visibleText]'
      - '#functions[revealTabTarget]'
    unit_tests:
      - name: test_attach_sections
        case: 正常
        summary: 閉じたセクションを閉じ、押すと開く
        condition: '`data-section="closed"` のセクションと開いたセクション'
        mock: なし
        expected: 閉じたセクションの中身が `hidden="until-found"`、押した後に `hidden` が無く `aria-expanded="true"`
      - name: test_attach_sections_when_hash
        case: 正常
        summary: 閉じたセクションの中の ID への hashchange で開く
        condition: 閉じたセクションの中の `### 注意`、`location.hash` を `#注意`
        mock: なし
        expected: セクションの中身が `hidden` を持たない
      - name: test_attach_sections_when_row_detail
        case: 正常
        summary: 行の詳細を閉じ、押すと開く
        condition: 2 行目に詳細を持つ表
        mock: なし
        expected: ボタンは 2 行目にだけあり、押した後に詳細の行が `hidden` を持たない
      - name: test_attach_sections_when_row_has_term
        case: 正常
        summary: 行の詳細の開閉ボタンの名前にツールチップの文字を含めない
        condition: 行の詳細を持つ表で、持ち主の行の 1 列目に用語 `マーカー` の下線がある
        mock: なし
        expected: 開閉ボタンのスクリーンリーダー向けの名前に `マーカー` が入り、ツールチップの意味の文字が入らない
      - name: test_attach_sections_when_bundle_hash
        case: 正常
        summary: 'まとめた HTML の # の構造でも閉じたセクションを開く'
        condition: 閉じたセクションの中の `### 注意`、`location.hash` を `#/a.md#%E6%B3%A8%E6%84%8F`
        mock: なし
        expected: セクションの中身が `hidden` を持たない
      - name: test_attach_sections_when_hash_in_tab
        case: 正常
        summary: 選ばれていないタブの中の ID への hashchange でそのタブを選ぶ
        condition: '`attachTabs` を付けた `macOS`・`Windows` のタブの `Windows` の中身にある閉じたセクションの中の `### 注意`、`location.hash` を `#注意`'
        mock: なし
        expected: '`Windows` が `aria-selected="true"` で、セクションの中身が `hidden` を持たない'
      - name: test_attach_sections_when_h1
        case: 正常
        summary: H1 のセクションも開閉する
        condition: '`# 手引き`・段落・`## 概要`・段落を `render` で描いた要素に付け、`手引き` の開閉のボタンを押す'
        mock: なし
        expected: '`手引き` のボタンが `aria-expanded="false"` で `section-手引き` が `hidden="until-found"`、`概要` の見出しも隠れる'
      - name: test_attach_sections_when_shift_click
        case: 正常
        summary: Shift を押しながら押すと、そのセクションと入れ子のセクションを同じ状態にし、外のセクションは変えない
