  - name: attachStickyRows
    title: 表の見出し行と集計の行を留める
    container: src/interact/sticky.ts
    summary: '各 `mdmark-table` の見出し行を画面の上端（`--mdmark-sticky-top`）に、集計の行を画面の下端に、表が画面にかかっている間だけ留める（`dev/mock/refs/151/assets/table.js`・`table.css`）。`CSS.supports("(animation-timeline: view()) and (animation-range: 0% 100%)")` が真なら `root` に `data-mdmark-sticky="timeline"` を付け、表ごとに `stickyRange` の値を `--mdmark-sticky-head-start`・`--mdmark-sticky-head-max`・`--mdmark-sticky-foot-max`・`--mdmark-sticky-foot-end` に入れて、動かすのは CSS のスクロール連動のアニメーションに任せる。そうでなければ `data-mdmark-sticky="script"` を付け、`stickyShift` の値を `--mdmark-sticky-head-shift`・`--mdmark-sticky-foot-shift` に入れ、集計の行を上げている間だけ `--mdmark-sticky-foot-reach` を `2px`（それ以外は `0px`）にする。値は付けたときと、各表の `ResizeObserver`（絞り込み・集計の出し入れ・幅の変化で表の高さが変わったとき）で求め直し、`script` では `window` の `scroll`（capture・passive。求め直すのは `requestAnimationFrame` で 1 フレームに 1 回）と `resize` でも求め直す。本文の行が 1 つもない表は留めない'
    kind: 関数
    scope: internal
    side_effects: '`root` の属性と表の CSS 変数を書き換え、`window` の `scroll`・`resize` を受け取る'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: 受け取りと `ResizeObserver` を外し、`data-mdmark-sticky` と CSS 変数を取り除く関数
    unit_tests:
      - name: test_attach_sticky_rows_when_timeline
        case: 正常
        summary: animation-timeline を持つブラウザでは動く範囲を CSS 変数に入れる
        condition: 本文 30 行と集計の行を持つ表（集計の行は先に `attachTables` で置く）を付け、外す
        mock: '`CSS.supports` を`true` を返す関数に差し替える'
        expected: 付けた後は `root` が `data-mdmark-sticky="timeline"`、表の `--mdmark-sticky-head-max` と `--mdmark-sticky-foot-max` が 0px より大きい。外した後は属性と CSS 変数が無い
      - name: test_attach_sticky_rows_when_script
        case: 正常
        summary: animation-timeline を持たないブラウザではスクロールに合わせてずらす量を入れる
        condition: 画面より高い本文 60 行と集計の行を持つ表（集計の行は先に `attachTables` で置く）を付け、見出し行の上端が画面の上端より 300px 上になるまでスクロールして 1 フレーム待つ
        mock: '`CSS.supports` を `false` を返す関数に差し替える'
        expected: '`root` が `data-mdmark-sticky="script"`、表の `--mdmark-sticky-head-shift` が 300px、`--mdmark-sticky-foot-reach` が `2px`、見出し行の上端が画面の上端と揃い、集計の行の下端が画面の下端と揃う'
      - name: test_attach_sticky_rows_when_detached
        case: 正常
        summary: 外した後はスクロールしても書き換えない
        condition: '`test_attach_sticky_rows_when_script` の表を付けて外し、スクロールして 1 フレーム待つ'
        mock: '`CSS.supports` を `false` を返す関数に差し替える'
        expected: '`root` に `data-mdmark-sticky` が無く、表に `--mdmark-sticky-head-shift` が無い'
    callees:
      - '#functions[stickyShift]'
      - '#functions[stickyRange]'
    status: planned
    introduced:
      pr: 151
  - name: attachCodeCopy
    title: コードブロックにコピーを付ける
    container: src/interact/code-blocks.ts
    summary: 各 `mdmark-code-bar` の末尾に `renderCodeCopy` のボタンを置き、押すと `copyText` でコードを写す。写す文字は、行の印を持つブロックでは `data-kind="del"` の行を除いた `mdmark-code-text` を改行でつないだもの、それ以外は `code` の文字から末尾の改行を 1 つ除いたもの。書けたら `data-state="copied"` にして 2 秒で `idle` に戻し、書けなければ `failed` にして次に押すまで残す
    kind: 関数
