title: "ライブラリ本体 / 操作"
lead: '`mount` が描いた記法に操作を付け、外す処理。表の並べ替え・ピン止め・絞り込み、タブ、節と行の詳細の開閉、表の見出し行と集計の行を留める処理、コードブロックのコピーを受け持ち、付ける関数はどれも外す関数を返す。ブラウザでだけ動く。'
directory: |-
  ```tree
  src/
  ├── table-logic.ts  # 表の並べ替えの比べ方・絞り込みの当てはめ・数の読み方・集計と読めないセル・TSV と Markdown の表・最終列を畳むか・行を留める量・URL の #ID の読み方（部品の表と操作が使う）
  └── interact/
      ├── index.ts       # attachInteractions
      ├── placement.ts   # ツールチップを持ち主の上と下のどちらに置くかを決める
      ├── tables.ts      # 表の並べ替え・ピン止め・絞り込み・件数・列の表示・集計・コピー・行へ移る・行の URL のコピー・最終列を畳む
      ├── sticky.ts      # 表の見出し行と集計の行を画面の端に留める
      ├── clipboard.ts   # クリップボードへ書く（表・行の URL・コードブロックが使う）
      ├── code-blocks.ts # コードブロックのコピー
      ├── tabs.ts        # タブの切り替えと、URL の #ID の指すタブを選ぶ処理
      └── sections.ts    # 節と行の詳細の開閉、URL の #ID で開く
  ```
data_models:
  - name: FilterValue
    title: 当てた絞り込み
    container: src/table-logic.ts
    summary: 列 1 つに当てた絞り込み（部品『表』の `filterValues` の要素と同じ形）
    properties:
      - name: column
        type: number
        description: 列の位置
      - name: values
        type: string[] | undefined
        description: '`select` の選んだ値'
      - name: text
        type: string | undefined
        description: '`text` の含む文字'
      - name: from
        type: string | undefined
        description: '`date` の開始日（`YYYY-MM-DD`）'
      - name: to
        type: string | undefined
        description: '`date` の終了日（`YYYY-MM-DD`）'
functions:
  - name: attachInteractions
    title: 記法の操作を付ける
    container: src/interact/index.ts
    kind: 関数
    scope: internal
    summary: 機能がオンの記法だけ `attachSections`・`attachTables`・`attachTabs` の順に呼び（付けたときも `hashchange` も、`attachTables` が行へ送る前に `attachSections` が URL の `#ID` の指す閉じた節を開くため）、`table` がオンなら `attachTables` の後に `attachStickyRows` を、`code` がオンなら `attachCodeCopy` を呼び、`glossary` か `backlinks` がオンなら `attachTermTips` を呼ぶ。`html` がオンなら `attachEmbeddedHtml` を、さらに `hints` がオンなら `div.mdmark-html` ごとに `attachDiagramTips` を呼ぶ。`attachDiagrams`・`attachTermTips`・`attachDiagramTips` には `placement` を渡す。まとめて外す関数を返す
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; placement: TooltipPlacement }'
        required: true
        description: 描いた要素と文書で決まった機能のオン・オフと、既定を当てた設定のツールチップを出す場所
    returns:
      type: () => void
      description: 付けた操作を外す関数
    callees:
      - '#functions[attachTables]'
      - '#functions[attachTabs]'
      - '#functions[attachSections]'
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[attachTermTips]
      - '#functions[attachStickyRows]'
      - '#functions[attachCodeCopy]'
    unit_tests:
      - name: test_attach_interactions
        case: 正常
        summary: オフの記法には操作を付けない
        condition: タブと表を描いた要素、`features` の `tabs` が `false`
        mock: なし
        expected: '`role="tablist"` が無く、表の見出しにボタンがある'
      - name: test_attach_interactions_when_hints_off
        case: 正常
        summary: hints がオフなら埋め込んだ HTML にツールチップの操作を付けない
        condition: ヒントを持つ `div.mdmark-html` を描いた要素と、`features` の `hints` が `false`
        mock: なし
        expected: 印にフォーカスしても `role="tooltip"` の要素が `hidden` を持ったまま
      - name: test_attach_interactions_when_row_in_closed_section
        case: 正常
        summary: 閉じた節の中の行へは、節を開いてから送る
        condition: '`data-section="closed"` の節の中に `rowlink` の表（`id` `もも` の行）を描いた要素で、`location.hash` を `#もも` にして付け、次に `#/a.md#もも` にして `hashchange` を送る'
        mock: '`Element.prototype.scrollIntoView` を、呼ばれたときに節の中身の `hidden` を記録する関数に差し替える'
        expected: どちらも、`もも` の行の `scrollIntoView` が呼ばれたときに節の中身が `hidden` を持たず、行が `data-target` を持つ
      - name: test_attach_interactions_when_code_off
        case: 正常
        summary: code がオフならコードブロックにコピーのボタンを付けず、table がオフなら行を留めない
        condition: 帯を持つコードブロックと表を描いた要素、`features` の `code` と `table` が `false`
        mock: なし
        expected: '`mdmark-code-copy` が無く、`table` が `data-mdmark-sticky` を持たない'
  - name: compareCells
    title: セルを比べる
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: 並べ替えの比較。両方が数値（`,` を除いて数になる）なら数の大きさ、それ以外は `Intl.Collator`（`ja`・数字を数として）の順で比べる
    args:
      - name: a
        type: string
        required: true
        description: セルの文字
      - name: b
        type: string
        required: true
        description: セルの文字
    returns:
      type: number
      description: '`a` が前なら負、後なら正、同じなら 0'
    unit_tests:
      - name: test_compare_cells
        case: 正常
        summary: 数値は数の大きさで比べる
        condition: '`10` と `2`、`1,022` と `227`'
        mock: なし
        expected: どちらも正
      - name: test_compare_cells_when_text
        case: 正常
        summary: 文字は辞書の順で比べる
        condition: '`みかん` と `りんご`'
        mock: なし
        expected: 負
  - name: matchesFilter
    title: セルが絞り込みに合うか
    container: src/table-logic.ts
    kind: 関数
    scope: internal
    summary: '`select` は選んだ値のどれかと等しい、`text` は大文字と小文字を区別せずに含む、`date` は開始日以降かつ終了日以前（片方だけも可。日付として読めないセルは合わない）。値が空の絞り込みは全てに合う'
    args:
      - name: cell
        type: string
        required: true
        description: セルの文字
      - name: kind
        type: '"select" | "text" | "date"'
        required: true
        description: 絞り込みの種類
      - name: value
        type: FilterValue
        required: true
        description: 当てた絞り込み
    returns:
      type: boolean
      description: 合うか
    unit_tests:
      - name: test_matches_filter
        case: 正常
        summary: 3 種類を判定する
        condition: '`select` の `["りんご"]` と `りんご`・`りんご飴`、`text` の `描画` と `描画を速くする`、`date` の `2026-10-05`〜`2026-10-15` と `2026-10-10`・`2026-10-20`'
        mock: なし
        expected: '`りんご` が合い `りんご飴` が合わない、`描画を速くする` が合う、`2026-10-10` が合い `2026-10-20` が合わない'
      - name: test_matches_filter_when_open_range
        case: 正常
        summary: 開始日だけのときはその日以降に合う
        condition: '`date` の `from` だけ `2026-10-10` と `2026-10-01`・`2026-10-10`'
        mock: なし
        expected: '`2026-10-01` が合わず、`2026-10-10` が合う'
  - name: attachTables
    title: 表に操作を付ける
    container: src/interact/tables.ts
    kind: 関数
    scope: internal
    summary: 各 `mdmark-table` の `data-features`・`data-filter`・`data-hide`・`data-total` を読み、見出しに `renderTableTools` のボタンとドロワーを置いて、並べ替え・ピン止め・絞り込みを付ける。`count`・`columns`・`total`・`copy` の表は `renderTableBar` の帯とメニューを、`total` の表は `renderTotalRows` の集計の行を置き、`rowlink` の表は行へ移る処理と行の URL のコピーを付ける。全ての表に、描く先の要素の幅で最終列を畳む処理を付ける
    description: '並べ替えは昇順 → 降順 → 元の並び（描いたときの順を行に控える）を繰り返し、`th` の `aria-sort` を付け外しする。行の詳細の行と畳んだ最終列の開閉の行はその行に付いて動かす。ピン止めのボタンは `ResizeObserver` で表がはみ出すときだけ出し、押した列までのセルに `position: sticky` と左端からの位置を当てる。絞り込みのドロワーは `hidden` と `aria-expanded` で開閉し、同時に 1 つだけ開く。開いたら最初の入力欄へフォーカスを移し（スマホでもボタンの押下の処理の中で移す）、開いている間だけ `document` の `pointerdown`（外を押す）と `keydown`（Esc）を受け取る。「絞り込みを外す」はその列の入力を空にして絞り込みを当て直す（ドロワーの中の押下を外の押下として扱わない）。列ごとの絞り込みは `matchesFilter` で重ねて当て、合わない行に `hidden` を付ける。


      件数と集計の行は、絞り込みを当てるたびに、行の詳細・開閉の行・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行から作り直す（集計は `computeTotal`）。集計の行は計算ごとの 1 行で、付けたときに全ての本文の行から `findUnreadableTotals` で数として読めないセルを持つ列と計算を控え、そのセルは作り直しても空にする。`集計` のボタンのメニュー（`出す集計`）のチェックボックスに合わせて計算の行の `hidden` を切り替え、ボタンの `is-active` と読み上げの名前を書き換え、`{計算の名前}の行を出しました`・`{計算の名前}の行を隠しました` を帯の `mdmark-table-status` に入れる（選択は覚えない）。列の表示のメニュー・集計のメニュー・コピーの形式のメニューは絞り込みのドロワーと同じ開閉の受け取りを使う（同時に開くのはドロワーとメニューを合わせて 1 つ）。列の表示はチェックボックスに合わせて列の見出し・セル・集計のセルの `hidden` を切り替え、「既定に戻す」で `data-hide` の状態に戻し、切り替えるたびに最終列を畳むかを決め直す。ピン止めの左端からの位置は隠した列を除いて測り直す。


      コピーは形式のボタンの `data-format` で、見出しの行と、行の詳細・開閉の行・`一致する行がありません` の行を除く本文の行のうち `hidden` を持たない行の、列の表示で隠していない列（畳んだ最終列は含める）の `visibleText` を `tableToMarkdown` か `tableToTsv` にして `copyText` で書く。書けたらボタンを `copied` にして 2 秒で `idle` に戻し、`{形式の名前}をコピーしました` を `mdmark-table-status` に入れる。書けなければボタンを `failed` にし、前のパネルを取り除いてから帯の直後に `renderCopyPanel` のパネルを置き、`textarea` へフォーカスを移して `select()` し、`クリップボードにコピーできませんでした。選択した{形式の名前}を手でコピーできます` を入れる。パネルは閉じるボタンか、パネルの中の Esc で取り除き、フォーカスを `表をコピー` に戻す。


      行へ移る処理は、付けたときと `hashchange` で `rowIdFromHash` の ID を持つ行を探し、囲む閉じた `details` を開き（閉じた節は、`attachInteractions` が先に付けた `attachSections` が同じきっかけで開いている）、行が `hidden` ならその表の絞り込みを全て外し、`scrollIntoView` してその行だけに `data-target` を付ける。行へのリンクの印を押すと、移る動きはそのままに印の `href` プロパティ（解決済みの絶対 URL）を `copyText` で書き、描いたときに印の横へ置いた `mdmark-row-link-notice` に `data-state` と文言（`リンクをコピーしました`・`リンクをコピーできませんでした`）を入れて 2 秒後に空に戻す。


      最終列を畳む処理は、描いた要素 `root` を `ResizeObserver` で見、幅が変わるたびと列の表示の切り替えのたびに、一度畳みを外して測り、`shouldFold` で決める。測るのは `root` の中身の幅と、表示している最終列（先頭の列を除く）のセルの中身の高さが、計算した `line-height` の 1.5 倍を超えるものがあるか。畳むときは最終列のセルに `mdmark-fold-col`、囲みに `is-folded` を付け、行の詳細を持たない行には `renderFoldedColumn` の開閉のボタンを先頭のセルに、開閉の行を行の直後に置き、行の詳細を持つ行には詳細の中身の先頭に同じ `mdmark-fold-part` を置く。畳まないときはこれらを取り除く。開閉のボタンは `aria-expanded` と開閉の行の `hidden` を切り替え、開閉の行はその行が隠れると隠す'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた要素
    returns:
      type: () => void
      description: ボタン・ドロワー・パネル・開閉の行・受け取り・`ResizeObserver`・タイマーを外す関数
    side_effects: 表の DOM を書き換え、イベントと `ResizeObserver` を付ける
    callees:
      - '#functions[compareCells]'
      - '#functions[matchesFilter]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTableTools]
      - '#functions[visibleText]'
      - '#functions[findUnreadableTotals]'
      - '#functions[tableToMarkdown]'
      - '#functions[shouldFold]'
      - '#functions[copyText]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCopyPanel]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderFoldedColumn]
    unit_tests:
      - name: test_attach_tables_when_sorted
        case: 正常
        summary: 3 回の押下で昇順・降順・元の並びになる
        condition: '`data` の表（値の列が `10`・`2`・`33`）の値の列の見出しを 3 回押す'
        mock: なし
        expected: '`2,10,33`・`33,10,2`・`10,2,33` の順で、`aria-sort` が `ascending`・`descending`・無し'
      - name: test_attach_tables_when_filtered
        case: 正常
        summary: ドロワーで絞って外し、外の押下で閉じる
        condition: '`data-filter="0:select"` の表でボタンを押し、`りんご` を選び、「絞り込みを外す」を押し、表の外を押す'
        mock: なし
        expected: 開いた後に候補の検索欄にフォーカス、選んだ後に 1 行だけ、外した後に全ての行とドロワーが開いたまま、外を押した後にドロワーが `hidden`
      - name: test_attach_tables_when_escape
        case: 正常
        summary: Esc で閉じてボタンへフォーカスを戻す
        condition: ドロワーを開いて Esc
        mock: なし
        expected: ドロワーが `hidden`、ボタンにフォーカス
      - name: test_attach_tables_when_pinned
        case: 正常
        summary: はみ出す表だけピン止めのボタンを出し、押した列までを留める
        condition: 幅 320px の要素に 10 列の表と 2 列の表、2 列目のピン止めを押す
        mock: なし
        expected: 10 列の表だけボタンが `hidden` を持たず、1・2 列目のセルが `sticky`
      - name: test_attach_tables_when_detached
        case: 正常
        summary: 外すと document の受け取りが残らない
        condition: ドロワーを開いたまま外す関数を呼ぶ
        mock: '`document.removeEventListener` を数える関数で包む'
        expected: '`pointerdown`・`keydown` が外れている'
      - name: test_attach_tables_when_cell_has_term
        case: 正常
        summary: セルに用語の下線があっても、絞り込みの値の候補と見出しのボタンの名前にツールチップの文字を含めない
        condition: '`<!-- table: data filter=名前 -->` の表（列 `名前`・`値`、行 `印`・`表`）と、`印`・`名前` を入れた用語集の表を `mount` で描く'
        mock: なし
        expected: 絞り込みの値の候補が `["印", "表"]`、見出しのボタンの名前が `名前` と `値`、`印` のセルに用語の下線が残る
      - name: test_attach_tables_when_counted
        case: 正常
        summary: 絞り込みに合わせて件数と計算ごとの集計の行を作り直す
        condition: '`data-features="sort pin filter count total"`・`data-filter="0:text"`・`data-total="0:count 1:sum 2:avg"` の表（名前 `りんご`・`みかん`・`りんご飴`・`ぶどう`、数量 `10`・`2`・`33`・空、単価 `100`・`200`・`300`・`400`）を `りんご` で絞り込む'
        mock: なし
        expected: 絞り込む前は `4 / 4 件` と、`合計 45`・`平均 250`・`件数 4` の 3 行がこの順、後は `2 / 4 件` と `合計 43`・`平均 200`・`件数 2`、絞り込みを `存在しない` にした後は `0 / 4 件` と `合計 0`・`平均 —`・`件数 0`（`一致する行がありません` の行を数えない）
      - name: test_attach_tables_when_columns_toggled
        case: 正常
        summary: 列を隠して既定に戻し、Esc でメニューを閉じる
        condition: '`data-features="sort pin filter columns total"`・`data-hide="1"`・`data-total="2:sum"` の 3 列の表で、メニューを開き、2 列目を入れて 3 列目を外し、「既定に戻す」を押し、Esc'
        mock: なし
        expected: 付けた直後は 2 列目の `th`・`td` が `hidden`、開いた後は 1 列目のチェックボックスが `disabled` で 2 つ目のチェックボックスにフォーカス、切り替えた後は 3 列目の `th`・`td`・集計のセルが `hidden`、戻した後は 2 列目だけが `hidden`、Esc の後はメニューが `hidden` で `列の表示` にフォーカス
      - name: test_attach_tables_when_copied
        case: 正常
        summary: 形式のメニューで TSV を選び、表示している行と列を写して 2 秒でボタンを戻す
        condition: '`data-features="sort pin filter columns copy"`・`data-hide="1"`・`data-filter="0:text"` の表（列 `名前`・`説明`・`更新日`、名前 `りんご`・`みかん`・`りんご飴`、更新日 `2026-10-01`・`2026-10-10`・`2026-10-20`）を `りんご` で絞り、`表をコピー` を押して `TSV` を押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に、時計を偽の時計に差し替える'
        expected: '`表をコピー` を押した後に形式のメニューが `hidden` を持たず、`TSV` を押した後にメニューが `hidden` でフォーカスが `表をコピー`。`名前\t更新日\nりんご\t2026-10-01\nりんご飴\t2026-10-20` で 1 回呼ばれ、ボタンが `data-state="copied"`、`mdmark-table-status` が `TSVをコピーしました`、2 秒進めると `idle`'
      - name: test_attach_tables_when_copy_denied
        case: 正常
        summary: 拒まれたら手でコピーするパネルを出し、Esc で閉じる
        condition: '`data-features="copy"` の表で `表をコピー` を押して `Markdown の表` を押し、パネルの中で Esc'
        mock: '`navigator.clipboard.writeText` を `NotAllowedError` で拒む関数に、時計を偽の時計に差し替える'
        expected: ボタンが `data-state="failed"` で 2 秒進めても変わらず、帯の直後に `mdmark-copy-panel` があり、`textarea` にフォーカスがあって中身が全て選ばれ、`mdmark-table-status` が `クリップボードにコピーできませんでした。選択したMarkdown の表を手でコピーできます`。Esc の後はパネルが無くフォーカスが `表をコピー`。`unhandledrejection` が起きない
      - name: test_attach_tables_when_row_linked
        case: 正常
        summary: '#ID が指す行を開いて強調し、hashchange で移す'
        condition: 閉じた `details` の中の `rowlink` の表（`id` `みかん` の行）と、`data-filter="0:text"` で `ぶどう` に絞った `rowlink` の表（`id` `もも` の行）を描いた要素で、`#みかん` のまま付け、`#もも` にし、`#/a.md#%E3%81%BF%E3%81%8B%E3%82%93` にする
        mock: なし
        expected: 付けた後は `details` が `open` で `みかん` の行だけ `data-target`、`#もも` の後は 2 つ目の表の行が全て `hidden` を持たず `もも` の行だけ `data-target`、`#/a.md#…` の後は `みかん` の行だけ `data-target`
      - name: test_attach_tables_when_copied_markdown
        case: 正常
        summary: Markdown の表の形式で写す
        condition: '`data-features="copy"` の表（列 `名前`・`式`、行 `a`・`x | y`）で `表をコピー` を押して `Markdown の表` を押す'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数に差し替える'
        expected: '`| 名前 | 式 |\n| --- | --- |\n| a | x \| y |` で 1 回呼ばれ、`mdmark-table-status` が `Markdown の表をコピーしました`'
      - name: test_attach_tables_when_totals_unreadable
        case: 正常
        summary: 数として読めないセルを持つ列の合計と平均は、絞り込んでも空のままにする
        condition: '`data-features="sort pin filter total"`・`data-filter="0:text"`・`data-total="1:sum 1:avg 1:count"` の表（名前 `りんご`・`みかん`、数量 `10`・`約 3`）を `りんご` で絞り込む'
        mock: なし
        expected: 絞り込む前も後も合計と平均の行の数量のセルが空で、件数の行は `2`・`1`
      - name: test_attach_tables_when_totals_toggled
        case: 正常
        summary: 集計のメニューで計算の行を隠して出し、読み上げで知らせる
        condition: '`data-features="total"`・`data-total="1:sum 1:avg"` の表で `集計` を押し、`平均` のチェックを外し、入れ直し、Esc'
        mock: なし
        expected: 開いた後はメニューが `hidden` を持たず最初のチェックボックスにフォーカス、外した後は平均の行が `hidden` でボタンが `is-active`・読み上げの名前に `（1 件を隠しています）`・`mdmark-table-status` が `平均の行を隠しました`、入れ直した後は平均の行が `hidden` を持たず `平均の行を出しました`、Esc の後はメニューが `hidden` で `集計` にフォーカス
      - name: test_attach_tables_when_row_link_copied
        case: 正常
        summary: 行へのリンクの印を押すと行の絶対 URL を写し、知らせを 2 秒出す
        condition: '`rowlink` の表（`id` `みかん` の行）で、その行の印を押す。もう 1 つの表では書き込みを拒む'
        mock: '`navigator.clipboard.writeText` を記録して解決する関数（1 つ目）と `NotAllowedError` で拒む関数（2 つ目）に、時計を偽の時計に差し替える'
        expected: 1 つ目は `location.href` の `#` より前に `#%E3%81%BF%E3%81%8B%E3%82%93` を続けた URL で呼ばれ、印の横の `mdmark-row-link-notice` が `data-state="copied"` と `リンクをコピーしました`、2 つ目は `data-state="failed"` と `リンクをコピーできませんでした`。2 秒進めるとどちらも空で `data-state` を持たない。どちらも行が `data-target` を持つ
      - name: test_attach_tables_when_folded
        case: 正常
        summary: 狭い幅で折り返す最終列を畳み、開閉し、広げると畳みを外す
        condition: 幅 390px の要素に、どの行も 1 行に収まらない説明の列を最終列に持つ 3 列 3 行の表と、短い文字の 2 列の表。付けた後、畳んだ表の 1 行目の開閉のボタンを押し、要素の幅を 800px にする
        mock: なし
        expected: 付けた後は 1 つ目の表だけ囲みが `is-folded` で各行に `aria-expanded="false"` の `mdmark-fold-toggle`、2 つ目の表は畳まない。押した後はボタンが `aria-expanded="true"` で直後の `mdmark-fold-detail` が `hidden` を持たず、`mdmark-fold-name` が `説明`。800px にした後は `is-folded`・開閉のボタン・開閉の行が無い
      - name: test_attach_tables_when_folded_with_row_detail
