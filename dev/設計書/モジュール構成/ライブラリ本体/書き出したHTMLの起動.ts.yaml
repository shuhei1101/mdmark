title: "ライブラリ本体 / 書き出したHTMLの起動"
lead: CLI が書き出した HTML に埋める起動の処理。ライブラリ本体と一緒に `dist/viewer.js` にまとめ、書き出しのときに CLI が埋めるモジュールと 1 つのスクリプトにまとめる。開いたときに埋めた中身を読み込んで、読み込み済みのモジュールを指定し、拡張を登録して `mount` で描く。まとめた HTML では URL の `#` で文書を行き来する。
directory: |-
  ```tree
  src/viewer/
  ├── index.ts   # startViewer を export する。CLI がまとめる入口から呼ばれ、埋めた中身を読み込んで 1 文書かまとめた HTML を起動する
  ├── modules.ts # 読み込み済みのモジュールの指定と拡張の登録
  ├── route.ts   # URL の # の読み取りと、描いた文書のリンクの書き換え
  ├── bundle.ts  # まとめた HTML の文書の行き来と一覧のパネル
  └── viewer.css # まとめた HTML の画面と印刷の規則（層 mdmark）。画面全体の地は --mdmark-color-bg、上の帯・ボタン・一覧のパネルの地は --mdmark-color-bg-opaque。60rem 未満では開いている文書に --mdmark-sticky-top: calc(3.25rem + 1px) を指定し、右側の目次の帯と表の見出し行を上の帯の下に留める
  ```
data_models:
  - name: EmbeddedModules
    title: 埋めたモジュール
    container: src/viewer/modules.ts
    usecase: 共通
    summary: CLI がまとめる入口のモジュールが `startViewer` に指定する、同じスクリプトにまとめた部品・色分け・外部ライブラリ・拡張のモジュール
    properties:
      - name: parts
        type: 'Partial<Record<PartName, Record<string, unknown>>>'
        description: 静的な `import` で取り込んだ部品のモジュール。文書にビューのマーカーがあるときだけ `view` を持つ
      - name: syntax
        type: 'EmbeddedSyntax | undefined'
        description: 静的な `import` で取り込んだ色分けの本体と言語のモジュール。文書に色分けの対象があり本体をまとめられたときだけ持つ
      - name: mermaid
        type: '{ default?: unknown } | undefined'
        description: 静的な `import` で取り込んだ mermaid のモジュールの名前空間。文書に mermaid のコードブロックがありまとめられたときだけ持つ
      - name: libraries
        type: 'Record<string, () => Promise<LibraryModule>>'
        description: マーカーの名前から、外部ライブラリのモジュールをリテラルの動的 `import()` で読み込む関数を参照する表。まとめた後は同じスクリプトの中のモジュールを評価して返却する
      - name: extensions
        type: 'Array<() => Promise<{ default?: unknown }>>'
        description: 拡張のモジュールをリテラルの動的 `import()` で読み込む関数。設定の `extensions` の順
      - name: htmlScripts
        type: Map<string, () => unknown> | undefined
        description: 範囲のコードの文字から、既定のエクスポートを返却する関数を参照する表（CLI が esbuild で変えてまとめたもの）
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#constraints[まとめるスクリプト]
    status: planned
    introduced:
      pr: 296
constants:
  - name: DOC_HASH_PREFIX
    title: '文書を指す # の頭'
    container: src/viewer/route.ts
    summary: URL の `#` のうち、文書の指定として扱う頭
    value: '"#/"'
    refs:
      - dev/設計書/画面設計/まとめたHTML.ts#elements[開いている文書]
  - name: WIDE_QUERY
    title: 横の一覧を出す幅
    container: src/viewer/bundle.ts
    summary: 横の文書の一覧を出し、パネルを閉じる幅のメディアクエリ（CSS の境と同じ値）
    value: '"(min-width: 60rem)"'
functions:
  - name: startViewer
    title: 書き出した HTML を起動する
    container: src/viewer/index.ts
    usecase: 共通
    summary: '`#mdmark-payload` の JSON を読み込み、埋めたモジュールを `prepareModules` に指定して用意してから、`kind` が `document` なら描く先の要素に `mount` で描き、`bundle` なら `startBundle` を呼ぶ'
    description: '`src/viewer/index.ts` は `startViewer` を export するだけで自分では呼ばない。CLI がまとめる入口のモジュールが `startViewer(document, 埋めたモジュール)` を呼ぶ。`document` のときは `opts.docId` に文書の `docId`、`opts.references` に参照の表、`opts.aliases` に `payload.aliases` を指定する'
    kind: 関数
    scope: public
    is_async: true
    side_effects: ページに文書を描き、拡張を登録する
    args:
      - name: doc
        type: Document
        required: true
        description: ページの `document`
      - name: embedded
        type: EmbeddedModules
        required: true
        description: 同じスクリプトにまとめたモジュール
    returns:
      type: Promise<void>
      description: 描き始めたら解決する
    unit_tests:
      - name: test_start_viewer
        case: 正常
        summary: document の中身を描く先の要素に描く
        condition: '`kind: document`、文書が `# タイトル`。`embedded` は `{ parts: {}, libraries: {}, extensions: [] }`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に中身の `script` と `article.mdmark` を配置する
        expected: '`article` に `h1` の `タイトル` が描かれる'
      - name: test_start_viewer_when_aliases
        case: 正常
        summary: 埋めたエイリアスで下線を付ける
        condition: '`kind: document`、文書が `単体テストを実行する。`、`aliases` に `command` の `単体テスト`。`embedded` は `{ parts: {}, libraries: {}, extensions: [] }`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に中身の `script` と `article.mdmark` を配置する
        expected: '`article` の `単体テスト` が `mdmark-term` の要素で、ツールチップにコマンドがある'
    callees:
      - '#functions[prepareModules]'
      - '#functions[startBundle]'
    status: planned
    introduced:
      pr: 32
  - name: prepareModules
    title: 埋めたモジュールを用意する
    container: src/viewer/modules.ts
    usecase: 共通
    summary: 埋めた部品を `setPartModuleLoader`、埋めた色分けの本体と言語を `setEmbeddedSyntax`、埋めた mermaid を `setEmbeddedMermaid`、埋めた外部ライブラリを `setEmbeddedLibraries`、埋めた範囲のスクリプトを `setEmbeddedHtmlScripts` で読み込みに指定し、拡張を 1 つずつ読み込んで既定の export を `registerExtension` で登録する
    description: '`URL.createObjectURL` と URL を読み込む動的 `import()` を使用しない。`parts` に無い部品（`view`・`comments`）は、呼ぶと拒否する関数を `setPartModuleLoader` で入れ、ページの隣の `view.js`・`comments.js` へ要求しない。`syntax` が無いときは本体を持たない `setEmbeddedSyntax({ languages: {} })` を入れ、色分けのために jsDelivr へ要求しない（色分けせずに描く）。`mermaid` が無いときは `setEmbeddedMermaid({})` を入れ、mermaid のために jsDelivr へ要求しない（mermaid のコードブロックは通知ブロックとコードブロックで描く）。`setEmbeddedLibraries` には `libraries` をそのまま入れ、表に無い外部ライブラリのマーカーは通知ブロックになる。拡張は 1 つずつ `try` で囲んで読み込み（モジュールの評価）と登録をし、例外を投げたものは `console.error` に出して飛ばし（マーカーは知らないマーカーとして取り除かれる）、ほかの拡張と描画は続ける'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 部品・色分け・外部ライブラリの読み込みの差し替えを入れ、拡張を登録する
    args:
      - name: embedded
        type: EmbeddedModules
        required: true
        description: 同じスクリプトにまとめたモジュール
      - name: deps
        type: '{ register: (ext: MdmarkExtension) => void }'
        required: false
        default: '`registerExtension`'
        passing: injected
        description: 差し替える依存（テスト用）
    returns:
      type: Promise<void>
      description: 全ての拡張を登録するか飛ばしたら解決する
    unit_tests:
      - name: test_prepare_modules
        case: 正常
        summary: 埋めたモジュールを読み込みに指定し、拡張を登録する
        condition: '`parts` に `view`、`libraries` に `chart`、`extensions` に `{ default: { name: "greet", ... } }` を返却する関数 1 つ'
        mock: 呼ばれた拡張を貯める `register`
        expected: '`loadPartModule("view")` が `parts.view` を返却し、`loadPartModule("comments")` が拒否する。`embeddedLibraries` が `libraries` で、`register` が `greet` で 1 回呼ばれる'
      - name: test_prepare_modules_when_extension_fails
        case: 正常
        summary: 読み込みで例外を投げる拡張を飛ばして続ける
        condition: '`extensions` に 2 つで、1 つ目の関数が例外で拒否する（モジュールの最上位の例外）'
        mock: 呼ばれた拡張を貯める `register`。`console.error` を見張る
        expected: '`register` が 2 つ目で 1 回だけ呼ばれ、`console.error` が 1 回呼ばれ、例外を投げない'
      - name: test_prepare_modules_when_syntax
        case: 正常
        summary: 埋めた色分けのモジュールを入れ、無ければ本体を持たない値を入れる
        condition: '`syntax` が `{ core: 本体, languages: { typescript: 言語 } }` の中身と、`syntax` を持たない中身'
        mock: なし。`setEmbeddedSyntax` の後に `embeddedSyntax` を読み込む
        expected: 前者は `embeddedSyntax` が指定した `syntax`。後者は `core` を持たず `languages` が空
      - name: test_prepare_modules_when_mermaid
        case: 正常
        summary: 埋めた mermaid を入れ、無ければ mermaid を持たない値を入れる
        condition: '`mermaid` が `{ default: { initialize, render } }` の中身と、`mermaid` を持たない中身'
        mock: なし。`setEmbeddedMermaid` の後に `embeddedMermaid` を読み込む
        expected: 前者は `embeddedMermaid` が指定した `mermaid`。後者は `default` を持たない `{}`
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/描く.ts#functions[setEmbeddedSyntax]
      - dev/設計書/モジュール構成/ライブラリ本体/描く.ts#functions[setEmbeddedLibraries]
      - dev/設計書/モジュール構成/ライブラリ本体/mermaid.ts#functions[setEmbeddedMermaid]
      - dev/設計書/モジュール構成/ライブラリ本体/ビューとコメント.ts#functions[setPartModuleLoader]
    status: planned
    introduced:
      pr: 32
  - name: resolveRoute
    title: 'URL の # から開く文書を決める'
    container: src/viewer/route.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: '`#/{文書のパス}` と `#/{文書のパス}#{見出しの ID}` を読み込み、`#/` で始まらないときと 1 枚に無い文書を指すときは `entry` を返却する'
    kind: 関数
    scope: public
    args:
      - name: hash
        type: string
        required: true
        description: '`location.hash`（パーセント符号化されたまま）'
      - name: paths
        type: ReadonlySet<string>
        required: true
        description: まとめた文書のパス
      - name: entry
        type: string
        required: true
        description: 最初に開く文書
    returns:
      type: '{ path: string; heading: string | null; missing: boolean }'
      description: 開く文書・移る見出しの ID・1 枚に無い文書を指していたか
    unit_tests:
      - name: test_resolve_route
        case: 正常
        summary: 文書と見出しを読み込む
        condition: '`#/%E4%BD%BF%E3%81%84%E6%96%B9/guide.md#%E6%8F%8F%E3%81%8F`（`#/使い方/guide.md#描く`）'
        mock: なし
        expected: '`{ path: "使い方/guide.md", heading: "描く", missing: false }`'
      - name: test_resolve_route_when_no_hash
        case: 正常
        summary: '# が無いと entry'
        condition: '`""`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: false }`'
      - name: test_resolve_route_when_heading_only
        case: 正常
        summary: '#/ で始まらない # は文書の指定にしない'
        condition: '`#描く`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: false }`'
      - name: test_resolve_route_when_missing_document
        case: 正常
        summary: 1 枚に無い文書は entry で missing
        condition: '`#/下書き/メモ.md`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: true }`'
    status: planned
    introduced:
      pr: 32
  - name: rewriteLinks
    title: 描いた文書のリンクを 1 枚の中へ向ける
    container: src/viewer/route.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 描いた文書のリンクのうち、まとめた文書への相対リンクを `#/{文書のパス}`（`#` 付きなら `#/{文書のパス}#{ID}`）に、`#{ID}` だけのリンクを `#/{描いた文書のパス}#{ID}` に書き換え、文書へのリンクに `data-doc-path` を付ける
    description: 相対リンクは `resolveLink` で描いた文書のパスから解く。まとめた文書に無いリンク・スキームを持つリンクは記載したまま残す。印刷の規則は `data-doc-path` を関連文書のリンクの後ろに併記する
    kind: 関数
    scope: public
    side_effects: '`root` の中の `a` の `href` と `data-doc-path` を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた文書の要素
      - name: docPath
        type: string
        required: true
        description: 描いた文書のパス
      - name: paths
        type: ReadonlySet<string>
        required: true
        description: まとめた文書のパス
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_rewrite_links
        case: 正常
        summary: 文書間のリンク・見出しのアンカー・含まれないリンクを記載し分ける
        condition: '`使い方/guide.md` に `../リファレンス/api.md#mount`・`#描く`・`../下書き/メモ.md`・`https://example.com/` のリンク、まとめた文書は `使い方/guide.md`・`リファレンス/api.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に作った要素
        expected: '`href` が順に `#/リファレンス/api.md#mount`・`#/使い方/guide.md#描く`・`../下書き/メモ.md`・`https://example.com/`、`data-doc-path` は 1 つ目だけが `リファレンス/api.md`'
    status: planned
    introduced:
      pr: 32
  - name: startBundle
    title: まとめた HTML を起動する
    container: src/viewer/bundle.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 横の一覧とパネルに `renderDocList` を配置し、URL の `#` が指す文書を `mount` で描いて、`hashchange` で文書を行き来する
    description: '`mount` の `opts.aliases` にはどの文書も `payload.aliases` を指定する。文書を替えるときは前の `mount` の返り値で片付けてから再描画し、描いた後に `rewriteLinks` を呼ぶ。後は画面設計『まとめたHTML』のとおり: 一覧の `aria-current` と帯のタイトルとページのタイトルを合わせ、見出しを指していればそこへ、無ければ文書の頭へ移り、移ったときは h1 へフォーカスを移す（開いた直後は移さない）。`missing` のときは `history.replaceState` で URL を `entry` に合わせる。開いている文書の中の見出しへ移るリンク（`href` が `#/{今の文書のパス}#` で始まるもの）を修飾キーなしで押したときは、既定の動きを止めて `history.replaceState` で URL を置き換えてから移る。パネルは `showModal` で開き、文書を選ぶ・閉じるボタン・背景・Esc・`WIDE_QUERY` に合う幅になったときに閉じる（`closedby` を持たないブラウザでは背景の押下を座標で判定する）。文書を描く前に `restoreAssets` で `payload.assets` の画像を戻す'
    kind: 関数
    scope: public
    side_effects: 画面と履歴を書き換える
    args:
      - name: doc
        type: Document
        required: true
        description: ページの `document`
      - name: payload
        type: ExportPayload
        required: true
        description: '埋めた中身（`kind: bundle`）'
      - name: config
        type: MdmarkConfig
        required: true
        description: 埋めた設定（`payload.config`）
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_start_bundle
        case: 正常
        summary: URL が指す文書を描き、一覧で開いている文書を示す
        condition: '`#/b.md`、文書は `a.md`（entry）と `b.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`b.md` の本文が描かれ、横の一覧で `b.md` のリンクだけが `aria-current="page"`'
      - name: test_start_bundle_when_missing_document
        case: 正常
        summary: 1 枚に無い文書を指すと entry を描き URL を合わせる
        condition: '`#/下書き/メモ.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`a.md` が描かれ、`location.hash` が `#/a.md`'
      - name: test_start_bundle_when_side_toc_link_into_closed_section
        case: 正常
        summary: 右側の目次の項目を押すと、閉じたセクションを開いて見出しへ移る
        condition: '`#/b.md` で、`b.md` が `## 導入`（セクションのマーカーで閉じた状態）とその中の `### 注意` を持つ。右側の目次の `注意` の項目を押す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`導入` の中身が `hidden` を持たず、`location.hash` が `#/b.md#注意`'
    callees:
      - '#functions[resolveRoute]'
      - '#functions[rewriteLinks]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderDocList]
      - '#functions[restoreAssets]'
    refs:
      - dev/設計書/画面設計/まとめたHTML.ts#
    status: planned
    introduced:
      pr: 32
  - name: restoreAssets
    title: 埋めた画像を戻す
    container: src/viewer/bundle.ts
    usecase: まとめたHTMLで文書を行き来する
    kind: 関数
    scope: internal
    summary: 文書の Markdown の `mdmark-asset:{キー}` を `assets` の `data:` URL に替える（後ろのフラグメントは残す）。`assets` に無いキーは替えない
    args:
      - name: markdown
        type: string
        required: true
        description: 埋めた文書の Markdown
      - name: assets
        type: Record<string, string> | undefined
        required: true
        description: '`payload.assets`'
    returns:
      type: string
      description: 替えた Markdown
    unit_tests:
      - name: test_restore_assets
        case: 正常
        summary: 'キーを data: URL に替え、フラグメントを残す'
        condition: '`![図](mdmark-asset:a1#only-dark)` と `{ a1: "data:image/png;base64,AA==" }`'
        mock: なし
        expected: '`![図](data:image/png;base64,AA==#only-dark)`'
      - name: test_restore_assets_when_unknown
        case: 正常
        summary: 知らないキーは替えない
        condition: '`![図](mdmark-asset:zz)` と `{}`'
        mock: なし
        expected: 元のまま
    status: planned
    introduced:
      pr: 263
test_files:
  - tests/unit/src/viewer/index.browser.test.ts
  - tests/unit/src/viewer/modules.test.ts
  - tests/unit/src/viewer/route.test.ts
  - tests/unit/src/viewer/route.browser.test.ts
  - tests/unit/src/viewer/bundle.browser.test.ts
