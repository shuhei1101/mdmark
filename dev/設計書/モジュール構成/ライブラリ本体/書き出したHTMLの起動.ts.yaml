title: "ライブラリ本体 / 書き出したHTMLの起動"
lead: CLI が書き出した HTML に埋める起動の処理。ライブラリ本体と一緒に `dist/viewer.js` にまとめ、書き出しのときに CLI が埋めるモジュールと 1 つのスクリプトにまとめる。開いたときに埋めた中身を読み込んで、読み込み済みのモジュールを指定し、拡張を登録して `mount` で描く。まとめた HTML では URL の `#` で文書を行き来する。
directory: |-
  ```tree
  src/viewer/
  ├── index.ts   # startViewer を export する。CLI がまとめる入口から呼ばれ、埋めた中身を読み込んで 1 文書かまとめた HTML を起動する
  ├── modules.ts # 読み込み済みのモジュールの指定と拡張の登録
  ├── route.ts   # URL の # の読み取りと、描いた文書のリンクの書き換え
  ├── bundle.ts  # まとめた HTML の文書の行き来と一覧のパネル
  ├── view-state.ts # まとめた HTML の履歴の項目ごとの表示の状態（位置・開閉・タブ）の取り出し・保存・復元
  └── viewer.css # まとめた HTML の画面と印刷の規則（層 mdmark）。画面全体の地は --mdmark-color-bg、上の帯・ボタン・一覧のパネルの地は --mdmark-color-bg-opaque。60rem 未満では開いている文書に --mdmark-sticky-top: calc(3.25rem + 1px) を指定し、右側の目次の帯と表の見出し行を上の帯の下に留める
  ```
data_models:
  - name: EmbeddedModules
    title: 埋めたモジュール
    container: src/viewer/modules.ts
    usecase: 共通
    summary: CLI がまとめる入口のモジュールが `startViewer` に指定する、同じスクリプトにまとめた部品・色分け・外部ライブラリ・拡張のモジュール
    properties:
      - name: parts
        type: 'Partial<Record<PartName, Record<string, unknown>>>'
        description: 静的な `import` で取り込んだ部品のモジュール。文書にビューのマーカーがあるときだけ `view` を持つ
      - name: syntax
        type: 'EmbeddedSyntax | undefined'
        description: 静的な `import` で取り込んだ色分けの本体と言語のモジュール。文書に色分けの対象があり本体をまとめられたときだけ持つ
      - name: mermaid
        type: '{ default?: unknown } | undefined'
        description: 静的な `import` で取り込んだ mermaid のモジュールの名前空間。文書に mermaid のコードブロックがありまとめられたときだけ持つ
      - name: libraries
        type: 'Record<string, () => Promise<LibraryModule>>'
        description: マーカーの名前から、外部ライブラリのモジュールをリテラルの動的 `import()` で読み込む関数を参照する表。まとめた後は同じスクリプトの中のモジュールを評価して返却する
      - name: extensions
        type: 'Array<() => Promise<{ default?: unknown }>>'
        description: 拡張のモジュールをリテラルの動的 `import()` で読み込む関数。設定の `extensions` の順
      - name: htmlScripts
        type: Map<string, () => unknown> | undefined
        description: 範囲のコードの文字から、既定のエクスポートを返却する関数を参照する表（CLI が esbuild で変えてまとめたもの）
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#constraints[まとめるスクリプト]
    status: planned
    introduced:
      pr: 296
  - name: ViewState
    title: 表示の状態
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 履歴の項目を離れたときの表示の状態。sessionStorage に JSON で保存する
    properties:
      - name: path
        type: string
        description: 状態を取り出した文書のパス。戻した文書のパスと違うときは状態を使わない
      - name: x
        type: number
        description: '`scrollX`'
      - name: y
        type: number
        description: '`scrollY`'
      - name: folds
        type: boolean[]
        description: '`RESTORABLE_FOLDS` に当たる要素の、文書の中の出現順の開閉（`details` は `open`、ボタンは `aria-expanded` が `"true"`）'
      - name: tabs
        type: number[]
        description: '`data-group` を持たない `.mdmark-tabs` の、文書の中の出現順の選んだタブの番号（0 から）'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる.ts#constraints[戻る・進む・再読み込みの表示の状態]
    status: planned
    introduced:
      pr: 428
constants:
  - name: DOC_HASH_PREFIX
    title: '文書を指す # の頭'
    container: src/viewer/route.ts
    summary: URL の `#` のうち、文書の指定として扱う頭
    value: '"#/"'
    refs:
      - dev/設計書/画面設計/まとめたHTML.ts#elements[開いている文書]
  - name: WIDE_QUERY
    title: 横の一覧を出す幅
    container: src/viewer/bundle.ts
    summary: 横の文書の一覧を出し、パネルを閉じる幅のメディアクエリ（CSS の境と同じ値）
    value: '"(min-width: 60rem)"'
  - name: VIEW_STATE_KEY_PREFIX
    title: 表示の状態を保存するキーの頭
    container: src/viewer/view-state.ts
    summary: sessionStorage のキーの頭。キーは `{頭}{履歴の項目の ID}`
    value: '"mdmark-bundle-view:"'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる.ts#constraints[表示の状態の保存先]
  - name: HISTORY_ENTRY_FIELD
    title: 履歴の項目の ID を持つフィールド
    container: src/viewer/view-state.ts
    summary: '`history.state` の中で、履歴の項目の ID を持つフィールドの名前'
    value: '"mdmarkEntry"'
  - name: RESTORABLE_FOLDS
    title: 戻す開閉のセレクタ
    container: src/viewer/view-state.ts
    summary: 戻す本文の開閉の要素のセレクタ。`details`・セクション・行の詳細と最終列の畳み・コードの行の畳み・ER 図の畳み・ファイルツリーと表のツリーのフォルダ・表のツリーの見本。表のメニュー・ドロワー・絞り込み、右側の目次、差分のパネル、コメントの吹き出しの開閉は含めない
    value: '"details, .mdmark-section-toggle, .mdmark-row-toggle, .mdmark-code-fold, .mdmark-diagram-er-fold, .mdmark-tree-toggle, .mdmark-tree-example-toggle"'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる.ts#constraints[戻る・進む・再読み込みの表示の状態]
  - name: SCROLL_SAVE_INTERVAL_MS
    title: スクロール中の保存の間隔
    container: src/viewer/view-state.ts
    summary: スクロールしている間、表示の状態を保存する最短の間隔（ミリ秒）。規約『入力と文言』の「スクロールのたびに書き込むときは間引く」と、出典の TanStack Router の scroll restoration の間引きの値に合わせる
    value: "100"
functions:
  - name: startViewer
    title: 書き出した HTML を起動する
    container: src/viewer/index.ts
    usecase: 共通
    summary: '`#mdmark-payload` の JSON を読み込み、埋めたモジュールを `prepareModules` に指定して用意してから、`kind` が `document` なら描く先の要素に `mount` で描き、`bundle` なら `startBundle` を呼ぶ'
    description: '`src/viewer/index.ts` は `startViewer` を export するだけで自分では呼ばない。CLI がまとめる入口のモジュールが `startViewer(document, 埋めたモジュール)` を呼ぶ。`document` のときは `opts.docId` に文書の `docId`、`opts.references` に参照の表、`opts.aliases` に `payload.aliases` を指定する'
    kind: 関数
    scope: public
    is_async: true
    side_effects: ページに文書を描き、拡張を登録する
    args:
      - name: doc
        type: Document
        required: true
        description: ページの `document`
      - name: embedded
        type: EmbeddedModules
        required: true
        description: 同じスクリプトにまとめたモジュール
    returns:
      type: Promise<void>
      description: 描き始めたら解決する
    unit_tests:
      - name: test_start_viewer
        case: 正常
        summary: document の中身を描く先の要素に描く
        condition: '`kind: document`、文書が `# タイトル`。`embedded` は `{ parts: {}, libraries: {}, extensions: [] }`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に中身の `script` と `article.mdmark` を配置する
        expected: '`article` に `h1` の `タイトル` が描かれる'
      - name: test_start_viewer_when_aliases
        case: 正常
        summary: 埋めたエイリアスで下線を付ける
        condition: '`kind: document`、文書が `単体テストを実行する。`、`aliases` に `command` の `単体テスト`。`embedded` は `{ parts: {}, libraries: {}, extensions: [] }`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に中身の `script` と `article.mdmark` を配置する
        expected: '`article` の `単体テスト` が `mdmark-term` の要素で、ツールチップにコマンドがある'
    callees:
      - '#functions[prepareModules]'
      - '#functions[startBundle]'
    status: planned
    introduced:
      pr: 32
  - name: prepareModules
    title: 埋めたモジュールを用意する
    container: src/viewer/modules.ts
    usecase: 共通
    summary: 埋めた部品を `setPartModuleLoader`、埋めた色分けの本体と言語を `setEmbeddedSyntax`、埋めた mermaid を `setEmbeddedMermaid`、埋めた外部ライブラリを `setEmbeddedLibraries`、埋めた範囲のスクリプトを `setEmbeddedHtmlScripts` で読み込みに指定し、拡張を 1 つずつ読み込んで既定の export を `registerExtension` で登録する
    description: '`URL.createObjectURL` と URL を読み込む動的 `import()` を使用しない。`parts` に無い部品（`view`・`comments`・`map`）は、呼ぶと拒否する関数を `setPartModuleLoader` で入れ、ページの隣の `view.js`・`comments.js`・`map.js` へ要求しない。`syntax` が無いときは本体を持たない `setEmbeddedSyntax({ languages: {} })` を入れ、色分けのために jsDelivr へ要求しない（色分けせずに描く）。`mermaid` が無いときは `setEmbeddedMermaid({})` を入れ、mermaid のために jsDelivr へ要求しない（mermaid のコードブロックは通知ブロックとコードブロックで描く）。`setEmbeddedLibraries` には `libraries` をそのまま入れ、表に無い外部ライブラリのマーカーは通知ブロックになる。拡張は 1 つずつ `try` で囲んで読み込み（モジュールの評価）と登録をし、例外を投げたものは `console.error` に出して飛ばし（マーカーは知らないマーカーとして取り除かれる）、ほかの拡張と描画は続ける'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 部品・色分け・外部ライブラリの読み込みの差し替えを入れ、拡張を登録する
    args:
      - name: embedded
        type: EmbeddedModules
        required: true
        description: 同じスクリプトにまとめたモジュール
      - name: deps
        type: '{ register: (ext: MdmarkExtension) => void }'
        required: false
        default: '`registerExtension`'
        passing: injected
        description: 差し替える依存（テスト用）
    returns:
      type: Promise<void>
      description: 全ての拡張を登録するか飛ばしたら解決する
    unit_tests:
      - name: test_prepare_modules
        case: 正常
        summary: 埋めたモジュールを読み込みに指定し、拡張を登録する
        condition: '`parts` に `view`、`libraries` に `chart`、`extensions` に `{ default: { name: "greet", ... } }` を返却する関数 1 つ'
        mock: 呼ばれた拡張を貯める `register`
        expected: '`loadPartModule("view")` が `parts.view` を返却し、`loadPartModule("comments")` が拒否する。`embeddedLibraries` が `libraries` で、`register` が `greet` で 1 回呼ばれる'
      - name: test_prepare_modules_when_extension_fails
        case: 正常
        summary: 読み込みで例外を投げる拡張を飛ばして続ける
        condition: '`extensions` に 2 つで、1 つ目の関数が例外で拒否する（モジュールの最上位の例外）'
        mock: 呼ばれた拡張を貯める `register`。`console.error` を見張る
        expected: '`register` が 2 つ目で 1 回だけ呼ばれ、`console.error` が 1 回呼ばれ、例外を投げない'
      - name: test_prepare_modules_when_syntax
        case: 正常
        summary: 埋めた色分けのモジュールを入れ、無ければ本体を持たない値を入れる
        condition: '`syntax` が `{ core: 本体, languages: { typescript: 言語 } }` の中身と、`syntax` を持たない中身'
        mock: なし。`setEmbeddedSyntax` の後に `embeddedSyntax` を読み込む
        expected: 前者は `embeddedSyntax` が指定した `syntax`。後者は `core` を持たず `languages` が空
      - name: test_prepare_modules_when_mermaid
        case: 正常
        summary: 埋めた mermaid を入れ、無ければ mermaid を持たない値を入れる
        condition: '`mermaid` が `{ default: { initialize, render } }` の中身と、`mermaid` を持たない中身'
        mock: なし。`setEmbeddedMermaid` の後に `embeddedMermaid` を読み込む
        expected: 前者は `embeddedMermaid` が指定した `mermaid`。後者は `default` を持たない `{}`
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/描く.ts#functions[setEmbeddedSyntax]
      - dev/設計書/モジュール構成/ライブラリ本体/描く.ts#functions[setEmbeddedLibraries]
      - dev/設計書/モジュール構成/ライブラリ本体/mermaid.ts#functions[setEmbeddedMermaid]
      - dev/設計書/モジュール構成/ライブラリ本体/ビューとコメント.ts#functions[setPartModuleLoader]
    status: planned
    introduced:
      pr: 32
  - name: resolveRoute
    title: 'URL の # から開く文書を決める'
    container: src/viewer/route.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: '`#/{文書のパス}` と `#/{文書のパス}#{見出しの ID}` を読み込み、`#/` で始まらないときと 1 枚に無い文書を指すときは `entry` を返却する'
    kind: 関数
    scope: public
    args:
      - name: hash
        type: string
        required: true
        description: '`location.hash`（パーセント符号化されたまま）'
      - name: paths
        type: ReadonlySet<string>
        required: true
        description: まとめた文書のパス
      - name: entry
        type: string
        required: true
        description: 最初に開く文書
    returns:
      type: '{ path: string; heading: string | null; missing: boolean }'
      description: 開く文書・移る見出しの ID・1 枚に無い文書を指していたか
    unit_tests:
      - name: test_resolve_route
        case: 正常
        summary: 文書と見出しを読み込む
        condition: '`#/%E4%BD%BF%E3%81%84%E6%96%B9/guide.md#%E6%8F%8F%E3%81%8F`（`#/使い方/guide.md#描く`）'
        mock: なし
        expected: '`{ path: "使い方/guide.md", heading: "描く", missing: false }`'
      - name: test_resolve_route_when_no_hash
        case: 正常
        summary: '# が無いと entry'
        condition: '`""`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: false }`'
      - name: test_resolve_route_when_heading_only
        case: 正常
        summary: '#/ で始まらない # は文書の指定にしない'
        condition: '`#描く`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: false }`'
      - name: test_resolve_route_when_missing_document
        case: 正常
        summary: 1 枚に無い文書は entry で missing
        condition: '`#/下書き/メモ.md`'
        mock: なし
        expected: '`{ path: entry, heading: null, missing: true }`'
    status: planned
    introduced:
      pr: 32
  - name: rewriteLinks
    title: 描いた文書のリンクを 1 枚の中へ向ける
    container: src/viewer/route.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 描いた文書のリンクのうち、まとめた文書への相対リンクを `#/{文書のパス}`（`#` 付きなら `#/{文書のパス}#{ID}`）に、`#{ID}` だけのリンクを `#/{描いた文書のパス}#{ID}` に書き換え、文書へのリンクに `data-doc-path` を付ける
    description: 相対リンクは `resolveLink` で描いた文書のパスから解く。まとめた文書に無いリンク・スキームを持つリンクは記載したまま残す。印刷の規則は `data-doc-path` を関連文書のリンクの後ろに併記する
    kind: 関数
    scope: public
    side_effects: '`root` の中の `a` の `href` と `data-doc-path` を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた文書の要素
      - name: docPath
        type: string
        required: true
        description: 描いた文書のパス
      - name: paths
        type: ReadonlySet<string>
        required: true
        description: まとめた文書のパス
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_rewrite_links
        case: 正常
        summary: 文書間のリンク・見出しのアンカー・含まれないリンクを分けて記載する
        condition: '`使い方/guide.md` に `../リファレンス/api.md#mount`・`#描く`・`../下書き/メモ.md`・`https://example.com/` のリンク、まとめた文書は `使い方/guide.md`・`リファレンス/api.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に作った要素
        expected: '`href` が順に `#/リファレンス/api.md#mount`・`#/使い方/guide.md#描く`・`../下書き/メモ.md`・`https://example.com/`、`data-doc-path` は 1 つ目だけが `リファレンス/api.md`'
    status: planned
    introduced:
      pr: 32
  - name: startBundle
    title: まとめた HTML を起動する
    container: src/viewer/bundle.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 横の一覧とパネルに `renderDocList` を配置し、URL の `#` が指す文書を `mount` で描いて、`hashchange` で文書を行き来する
    description: '`mount` の `opts.aliases` にはどの文書も `payload.aliases` を指定する。文書の一覧と文書間のリンクで別の文書へ移るときは、`history.replaceState` で今の URL のクエリ文字列から `map-` で始まるキーを消してから移る（戻る・進む・再読み込みでは消さない）。文書を替えるときは前の `mount` の返り値で片付けてから再描画し、描いた後に `rewriteLinks` を呼ぶ。後は画面設計『まとめたHTML』のとおり: 一覧の `aria-current` と帯のタイトルとページのタイトルを合わせ、見出しを指していればそこへ、無ければ文書の頭へ移り、移ったときは h1 へフォーカスを移す（開いた直後は移さない）。`missing` のときは `history.replaceState` で URL を `entry` に合わせる。開いている文書の中の見出しへ移るリンク（`href` が `#/{今の文書のパス}#` で始まるもの）を修飾キーなしで押したときは、既定の動きを止めて `history.replaceState` で URL を置き換えてから移る。パネルは `showModal` で開き、文書を選ぶ・閉じるボタン・背景・Esc・`WIDE_QUERY` に合う幅になったときに閉じる（`closedby` を持たないブラウザでは背景の押下を座標で判定する）。文書を描く前に `restoreAssets` で `payload.assets` の画像を戻す。表示の状態: 起動したとき `history.scrollRestoration` を `manual` にし、`ensureEntryId` で今の項目の ID をメモリに持つ。`popstate`・文書の一覧と描いた文書のリンクの `click`・`pagehide`・`SCROLL_SAVE_INTERVAL_MS` ごとに間引いた `scroll` のときに、メモリの ID へ `captureViewState` の値を `writeViewState` で保存する。`hashchange` のときと起動したとき（再読み込み）は、移り先の項目の ID を `ensureEntryId` で取り（リンクで新しく積んだ項目には新しい ID が振られる）、その ID の `readViewState` の値が描いた文書と同じパスを持つかで分ける。持つときは、描いた後に `applyViewState`（`keepFocus: true`）で開閉とタブと位置を戻し、その後に `hashchange` のときだけフォーカスを h1 へ `preventScroll` で移す（起動したときは移さない）。持たないときは見出しか文書の頭へ移る。`popstate` の有無では分けない。`history.replaceState` で URL を置き換えるとき（`missing` と見出しへ移るリンク）は、今の `history.state` を引き継ぐ'
    kind: 関数
    scope: public
    side_effects: 画面と履歴を書き換え、`history.scrollRestoration` を `manual` にし、sessionStorage に表示の状態を記載する
    args:
      - name: doc
        type: Document
        required: true
        description: ページの `document`
      - name: payload
        type: ExportPayload
        required: true
        description: '埋めた中身（`kind: bundle`）'
      - name: config
        type: MdmarkConfig
        required: true
        description: 埋めた設定（`payload.config`）
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_start_bundle_when_switch_clears_map_query
        case: 正常
        summary: 文書を切り替えると map のクエリ文字列を消す
        condition: '`?map-1=place&x=1#/a.md` で開き、文書の一覧で `b.md` を押す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`location.search` が `?x=1` で、`b.md` が描かれる。戻ると `?map-1=place&x=1` の項目に戻る'
      - name: test_start_bundle
        case: 正常
        summary: URL が指す文書を描き、一覧で開いている文書を示す
        condition: '`#/b.md`、文書は `a.md`（entry）と `b.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`b.md` の本文が描かれ、横の一覧で `b.md` のリンクだけが `aria-current="page"`'
      - name: test_start_bundle_when_missing_document
        case: 正常
        summary: 1 枚に無い文書を指すと entry を描き URL を合わせる
        condition: '`#/下書き/メモ.md`'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`a.md` が描かれ、`location.hash` が `#/a.md`'
      - name: test_start_bundle_when_side_toc_link_into_closed_section
        case: 正常
        summary: 右側の目次の項目を押すと、閉じたセクションを開いて見出しへ移る
        condition: '`#/b.md` で、`b.md` が `## 導入`（セクションのマーカーで閉じた状態）とその中の `### 注意` を持つ。右側の目次の `注意` の項目を押す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: '`導入` の中身が `hidden` を持たず、`location.hash` が `#/b.md#注意`'
      - name: test_start_bundle_when_back_restores_view_state
        case: 正常
        summary: 戻るで、離れたときの位置へ戻り、リンクで移ったときは頭から描く
        condition: '`#/a.md`（段落 200 個と `b.md` へのリンク）で 3000px スクロールしてリンクを押し、`history.back()` する'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する。sessionStorage は描く前に空にする
        expected: '`b.md` へ移った直後の `scrollY` が 0、戻った後に `a.md` が描かれ `scrollY` が 3000（±1px）、`history.scrollRestoration` が `manual`'
      - name: test_start_bundle_when_back_focuses_title
        case: 正常
        summary: 戻るで開閉とタブを戻した後、フォーカスを h1 へ移す
        condition: '`a.md` の `group=` の無いタブで 2 つ目を選び、その中の `b.md` へのリンクを押してから `history.back()` する'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: 2 つ目のタブの `aria-selected` が `true` で、`document.activeElement` が `a.md` の h1
      - name: test_start_bundle_when_heading_link_keeps_entry_id
        case: 正常
        summary: 見出しへ移るリンクで URL を置き換えても、履歴の項目の ID を引き継ぐ
        condition: '`#/b.md` で、`b.md` の目次の見出しのリンクを押す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: リンクを押す前と後で `history.state.mdmarkEntry` が同じ
      - name: test_start_bundle_when_session_storage_unavailable
        case: 異常
        summary: sessionStorage が使えないと、戻るで文書の頭から描き例外を出さない
        condition: '`window.sessionStorage` を読むと `SecurityError` を投げるように差し替え、test_start_bundle_when_back_restores_view_state と同じ操作をする'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に画面の骨組みを配置する
        expected: 戻った後の `scrollY` が 0、例外が出ず、`console.warn` が呼ばれる
    callees:
      - '#functions[resolveRoute]'
      - '#functions[rewriteLinks]'
      - '#functions[ensureEntryId]'
      - '#functions[captureViewState]'
      - '#functions[applyViewState]'
      - '#functions[readViewState]'
      - '#functions[writeViewState]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderDocList]
      - '#functions[restoreAssets]'
    refs:
      - dev/設計書/画面設計/まとめたHTML.ts#
    status: planned
    introduced:
      pr: 32
  - name: restoreAssets
    title: 埋めた画像を戻す
    container: src/viewer/bundle.ts
    usecase: まとめたHTMLで文書を行き来する
    kind: 関数
    scope: internal
    summary: 文書の Markdown の `mdmark-asset:{キー}` を `assets` の `data:` URL に替える（後ろのフラグメントは残す）。`assets` に無いキーは替えない
    args:
      - name: markdown
        type: string
        required: true
        description: 埋めた文書の Markdown
      - name: assets
        type: Record<string, string> | undefined
        required: true
        description: '`payload.assets`'
    returns:
      type: string
      description: 替えた Markdown
    unit_tests:
      - name: test_restore_assets
        case: 正常
        summary: 'キーを data: URL に替え、フラグメントを残す'
        condition: '`![図](mdmark-asset:a1#only-dark)` と `{ a1: "data:image/png;base64,AA==" }`'
        mock: なし
        expected: '`![図](data:image/png;base64,AA==#only-dark)`'
      - name: test_restore_assets_when_unknown
        case: 正常
        summary: 知らないキーは替えない
        condition: '`![図](mdmark-asset:zz)` と `{}`'
        mock: なし
        expected: 元のまま
    status: planned
    introduced:
      pr: 263
  - name: ensureEntryId
    title: 履歴の項目の ID を取る
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: '`history.state` の `HISTORY_ENTRY_FIELD` を返し、無ければ新しい ID を振って今の `history.state` に加えて `replaceState` する'
    kind: 関数
    scope: public
    side_effects: 'ID が無いとき `history.replaceState` を呼ぶ（URL は変えない）'
    args:
      - name: win
        type: Window
        required: true
        description: ページの `window`
    returns:
      type: string
      description: 今の履歴の項目の ID（時刻と乱数の 36 進の文字）
    unit_tests:
      - name: test_ensure_entry_id
        case: 正常
        summary: ID が無ければ振り、2 回目は同じ ID を返す
        condition: '`history.replaceState({ other: 1 }, "")` の後に 2 回呼ぶ'
        mock: Chromium の `window`（`.browser.test.ts` で実行する）
        expected: '2 回とも同じ空でない文字を返し、`history.state` が `{ other: 1, mdmarkEntry: その文字 }`'
    status: planned
    introduced:
      pr: 428
  - name: captureViewState
    title: 表示の状態を取り出す
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 描いた文書の要素から、位置・`RESTORABLE_FOLDS` の開閉・`group=` の無いタブの選択を取り出す
    kind: 関数
    scope: public
    args:
      - name: target
        type: '{ view: HTMLElement; path: string }'
        required: true
        description: 描く先の要素と、描いている文書のパス
    returns:
      type: ViewState
      description: 表示の状態
    unit_tests:
      - name: test_capture_view_state
        case: 正常
        summary: 開閉とタブの選択を出現順に取り出す
        condition: 閉じた `details`・開いたセクション・`group=` の無いタブ群（2 つ目を選択）・`group=os` のタブ群を描いた要素
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に `mount` で描く
        expected: '`folds` が `[false, true]`、`tabs` が `[1]`（`group=os` のタブ群を含まない）、`path` が指定したパス'
    status: planned
    introduced:
      pr: 428
  - name: applyViewState
    title: 表示の状態を戻す
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 開閉を戻し、タブを選び直してから、位置へスクロールする。描いた後に高さが変わって位置がずれたら、読む人がスクロールの操作をするまで位置へ合わせ直す
    description: '開閉は今の状態と違う要素だけ、`details` は `open` を変え、ボタンは `click()` で切り替える。タブは選ぶ番号のタブのボタンを `click()` する。数が合わない要素とタブ群は飛ばす。`keepFocus` が `true` のときは、`click()` で移ったフォーカスを、戻す前の `document.activeElement` へ `preventScroll` で戻す。合わせ直しは描く先の要素の `ResizeObserver` で行い、`wheel`・`touchstart`・`keydown`・`pointerdown` のどれかが起きたら止める'
    kind: 関数
    scope: public
    side_effects: 描いた文書の開閉・タブ・ページのスクロール位置を変える
    args:
      - name: target
        type: '{ view: HTMLElement; state: ViewState; keepFocus: boolean }'
        required: true
        description: 描く先の要素・戻す表示の状態・開閉を戻した後にフォーカスを元の要素へ戻すか（`startBundle` は、部品のボタンへ移ったフォーカスを残さないよう常に `true` で呼ぶ）
    returns:
      type: () => void
      description: 合わせ直しを止める関数（文書を差し替える前に呼ぶ）
    unit_tests:
      - name: test_apply_view_state
        case: 正常
        summary: 開閉とタブを戻してから位置へスクロールする
        condition: 'test_capture_view_state と同じ文書を新しく描き、そこで取り出した状態と `y: 1200` を戻す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に `mount` で描く
        expected: '`details` が `open` を持たず、セクションの `aria-expanded` が `true`、2 つ目のタブの `aria-selected` が `true`、`scrollY` が 1200（±1px）'
      - name: test_apply_view_state_when_counts_differ
        case: 正常
        summary: 数が合わない開閉は飛ばし、例外を出さない
        condition: '`folds` が要素より 1 つ多い状態'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に `mount` で描く
        expected: 例外が出ず、要素のある分だけ開閉が戻る
      - name: test_apply_view_state_when_keep_focus
        case: 正常
        summary: keepFocus のときは、ボタンを押して移ったフォーカスを元へ戻す
        condition: 'コードの行の畳みを持つ文書を描き、`body` にフォーカスがある状態で、畳みを開いた状態を `keepFocus: true` で戻す'
        mock: Chromium の `document`（`.browser.test.ts` で実行する）に `mount` で描く
        expected: 畳みのボタンの `aria-expanded` が `true` で、`document.activeElement` が `body`
    status: planned
    introduced:
      pr: 428
  - name: readViewState
    title: 保存した表示の状態を読み込む
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: sessionStorage の `{VIEW_STATE_KEY_PREFIX}{ID}` を読み込み、`ViewState` の構造なら返す
    description: 値が無い・JSON でない・構造が合わないときは `undefined`。sessionStorage を取り出せない・読み込めないときは `console.warn` に出して `undefined`
    kind: 関数
    scope: public
    args:
      - name: entry
        type: '{ win: Window; id: string }'
        required: true
        description: ページの `window` と履歴の項目の ID
    returns:
      type: ViewState | undefined
      description: 保存した表示の状態
    unit_tests:
      - name: test_read_view_state_when_broken
        case: 異常
        summary: 壊れた値は使わない
        condition: キーに `"{"` を入れておく
        mock: Chromium の `window`（`.browser.test.ts` で実行する）
        expected: '`undefined` を返し、例外が出ない'
      - name: test_read_view_state_when_storage_unavailable
        case: 異常
        summary: sessionStorage を取り出せないと警告して使わない
        condition: '`window.sessionStorage` を読むと `SecurityError` を投げる'
        mock: '`window` の `sessionStorage` の getter を差し替える'
        expected: '`undefined` を返し、`console.warn` が 1 回呼ばれる'
    status: planned
    introduced:
      pr: 428
  - name: writeViewState
    title: 表示の状態を保存する
    container: src/viewer/view-state.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: sessionStorage の `{VIEW_STATE_KEY_PREFIX}{ID}` へ JSON で保存する。取り出せない・書き込めないときは `console.warn` に出して続ける
    kind: 関数
    scope: public
    side_effects: sessionStorage に書き込む
    args:
      - name: entry
        type: '{ win: Window; id: string; state: ViewState }'
        required: true
        description: ページの `window`・履歴の項目の ID・保存する表示の状態
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_write_view_state
        case: 正常
        summary: 保存した値を読み込める
        condition: '`writeViewState` の後に `readViewState`'
        mock: Chromium の `window`（`.browser.test.ts` で実行する）
        expected: 保存した値と同じ `ViewState` が返る
      - name: test_write_view_state_when_quota_exceeded
        case: 異常
        summary: 書き込めないと警告して続ける
        condition: '`Storage.prototype.setItem` が `QuotaExceededError` を投げる'
        mock: '`Storage.prototype.setItem` を差し替える'
        expected: 例外が出ず、`console.warn` が 1 回呼ばれる
    status: planned
    introduced:
      pr: 428
