title: ライブラリ本体 / map / 点検
lead: map の範囲の読み取りの項目に、補足が指す ID と設定の `map` の種類・線・アイコンの照合を加え、書き方の警告と点検のずれにする項目を集める。
functions:
- name: collectMapProblems
  title: 書き方の誤りを集める
  kind: 関数
  container: src/map/check.ts
  usecase: 設定と索引を点検する
  role: 処理
  summary: map の範囲の Mermaid と補足と設定から、`MapProblem` を全て集める
  scope: public
  callees:
  - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseFlowchart]
  - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseSequence]
  - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseMapData]
  args:
  - name: range
    type: '{ args: string; mermaid: string | undefined; mermaidCount: number; data: string | undefined; dataCount: number }'
    required: true
    description: 範囲の印の引数・mermaid のブロック・補足とその数
  - name: config
    type: ResolvedConfig["map"]
    required: true
    description: 既定を当てた設定の `map`
  returns:
    type: MapProblem[]
    description: 項目（範囲の行の順）
  process: |-
    1. mermaid のブロックが 0 か 2 つ以上・補足が 2 つ以上・描けない図の種類（`flowchart`・`sequenceDiagram` 以外）は `map_invalid` を 1 件返して終える
    2. 印の引数の知らないキーを `map_unknown_key` にする
    3. `parseFlowchart` か `parseSequence` と `parseMapData` の項目を合わせる
    4. 補足の `notes`・`walkthroughs`・`layout`・`plays_over` が指す ID が Mermaid に無いものを `map_unknown_ref` にする
    5. ノードのクラスが `config.kinds` に無いものを `map_unknown_class`、`layout` の `line` が `config.lines` に無いものを `map_unknown_line` にする（同じ名前は 1 件）
  unit_tests:
  - name: test_collect_map_problems
    case: 正常
    summary: ずれの無い範囲
    condition: モックの `FLOW`・`DATA`・`CONFIG`
    mock: なし
    expected: 空
  - name: test_collect_map_problems_when_unknown_ref
    case: 異常
    summary: 無い ID
    condition: 補足の `notes.ghost`
    mock: なし
    expected: '`map_unknown_ref` が 1 件で `notes.ghost` を含む'
  - name: test_collect_map_problems_when_unknown_class
    case: 異常
    summary: 設定に無いクラス
    condition: '`:::queue` のノードと `queue` の無い `kinds`'
    mock: なし
    expected: '`map_unknown_class` が 1 件'
  - name: test_collect_map_problems_when_unknown_line
    case: 異常
    summary: 設定に無い線の名前
    condition: '`layout` の `line: back` と `back` の無い `lines`'
    mock: なし
    expected: '`map_unknown_line` が 1 件'
  - name: test_collect_map_problems_when_no_mermaid
    case: 異常
    summary: mermaid のブロックが無い
    condition: '`mermaidCount: 0`'
    mock: なし
    expected: '`map_invalid` が 1 件だけ'
  - name: test_collect_map_problems_when_unsupported_kind
    case: 異常
    summary: 描けない種類
    condition: '`pie` のブロック'
    mock: なし
    expected: '`map_invalid` が 1 件で、`flowchart`・`sequenceDiagram` を含む'
  - name: test_collect_map_problems_when_unknown_arg
    case: 異常
    summary: 知らない印の引数
    condition: '`mdoe=x`'
    mock: なし
    expected: '`map_unknown_key` が 1 件で、使用できる引数の一覧を含む'
- name: checkMapConfig
  title: map の設定を点検する
  kind: 関数
  container: src/map/check.ts
  usecase: 設定と索引を点検する
  role: 処理
  summary: 設定の `map.kinds` の `icon` のうち Lucide に無い名前を `map_unknown_icon` の項目にする（Schema の検査は `validateConfig`）
  scope: public
  args:
  - name: map
    type: unknown
    required: true
    description: 設定ファイルの `map` の値
  returns:
    type: 'Array<{ key: string; message: string }>'
    description: キーのパス（`map.kinds.store.icon`）と内容
  unit_tests:
  - name: test_check_map_config
    case: 正常
    summary: 知っているアイコン
    condition: '`icon: database`'
    mock: なし
    expected: 空
  - name: test_check_map_config_when_unknown_icon
    case: 異常
    summary: 無いアイコン
    condition: '`icon: no-such-icon`'
    mock: なし
    expected: 1 件で、キーが `map.kinds.store.icon`
constants:
- name: LUCIDE_ICON_NAMES
  title: Lucideのアイコンの名前
  container: src/map/lucide-names.ts
  usecase: 設定と索引を点検する
  role: 定数
  summary: '`lucide` のパッケージの採用バージョンのアイコンの名前の並び（ビルドで作る）'
