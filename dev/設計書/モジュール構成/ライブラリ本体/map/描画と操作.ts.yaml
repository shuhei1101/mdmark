  - name: startDrag
    title: ドラッグを始める
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 押した場所（ノード・グループのタイトルの行・線の区間）を判定し、4px 動くまでは押した扱い、動いたら全てのノードとグループの位置を固定してから動かす
    scope: public
    args:
      - name: options
        type: '{ event: PointerEvent; layout: MapLayout; state: MapState; onMove: (state: MapState) => void; onClick: () => void; scale?: number; pointOf?: (event: PointerEvent) => [number, number] }'
        required: true
        description: 押したイベント・配置・状態・動かしたとき・押したときの関数・図の中身とポインターの座標の比・ポインターの位置を図の中身の座標にする関数（線の区間を選ぶ）
    returns:
      type: void
      description: なし
    process: |-
      1. 押した要素からノード・グループ・線の区間を決める（グループの面と余白は図の移動に任せて何もしない）
      2. 4px 動くまでは待ち、離したら `onClick` を呼ぶ
      3. 動いたら全てのノードとグループの今の位置を `positions` に入れ、ノード・グループは動いた分を足し、線の区間は `wireShifts` に足す。ほかとの間が `minGap` より狭くなる位置と、グループの左端・上端より外へは進めない
      4. 線の端の区間がノードの辺の端を越えたら、越えた側の辺へつなぎ替える
    unit_tests:
      - name: test_start_drag_when_click
        case: 正常
        summary: 押しただけ
        condition: 3px 動かして離す
        mock: '`onMove`・`onClick`'
        expected: '`onClick` を 1 回呼び、`onMove` を呼ばない'
      - name: test_start_drag_when_node
        case: 正常
        summary: ノードを動かす
        condition: ノードを下へ 40px
        mock: '`onMove`'
        expected: そのノードの `y` が 40 増え、ほかのノードの位置が変わらない
      - name: test_start_drag_when_blocked
        case: 正常
        summary: 近づけすぎ
        condition: 隣のノードとの間が 10px になる位置まで動かす
        mock: '`onMove`'
        expected: 間が 16px の位置で止まる
      - name: test_start_drag_when_reattach
        case: 正常
        summary: つなぎ替え
        condition: 線の真ん中の区間を相手のノードの上まで動かす
        mock: '`onMove`'
        expected: 線の端がそのノードの上の辺に付く
  - name: moveByKey
    title: キーで動かす
    kind: 関数
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: フォーカスしたノード・グループを指定した量だけ、線は真ん中の区間を区間と直角の向きへ動かした状態を返す。動かせないときは `undefined`
    scope: public
    args:
      - name: options
        type: '{ layout: MapLayout; state: MapState; target: { node?: string; group?: string; wire?: string }; dx: number; dy: number }'
        required: true
        description: 配置・状態・動かす要素の ID・動かす量（px。`KEY_MOVE_PX` か `KEY_MOVE_PX_LARGE` に矢印の向きを掛けた値）
    returns:
      type: MapState | undefined
      description: 動かした後の状態
    process: |-
      1. 全てのノードとグループの今の位置を `positions` に入れ、ノード・グループは `startDrag` と同じく、ほかとの間が `minGap` より狭くなる位置とグループの左端・上端より外へは進めない
      2. 線は真ん中の区間のずらしに、横の区間なら `dy`、縦の区間なら `dx` を足し、端のつなぎ替えを `attachments` に入れる。区間と同じ向きの矢印では動かさない
    unit_tests:
      - name: test_move_by_key_when_node
        case: 正常
        summary: ノード
        condition: '`A` を `dy: 8`'
        mock: なし
        expected: '`positions.A` が `{ x: 0, y: 8 }`'
      - name: test_move_by_key_when_wire
        case: 正常
        summary: 線の真ん中の区間
        condition: '`A->C`（点 5 つ。真ん中の区間は縦）を `dx: 8`'
        mock: なし
        expected: '`wireShifts["A->C"]` の区間 1 のずらしが 8'
      - name: test_move_by_key_when_blocked
        case: 正常
        summary: 動かせない
        condition: '図の余白の内側の左上にある `A` を `dy: -8`。縦の区間の線を `dy: 8`'
        mock: なし
        expected: どちらも `undefined`
  - name: attachBand
    title: 案内と再生を進める
    kind: 関数
    container: src/map/band.ts
    usecase: 図を巡回する
    role: 処理
    summary: 図の枠の下に案内の帯を配置し、前へ・次へ・停止・自動で進めると強調・データの印・スクロールを付ける
    scope: public
    args:
      - name: options
        type: '{ figure: HTMLElement; mode: "walkthrough" | "playback"; steps: BandStep[]; interval: number; autoplay: boolean; apply: (step: BandStep | undefined) => void; reducedMotion: boolean; observe: (target: Element, onEnter: () => void) => () => void }'
        required: true
        description: 図の枠・モード・手順・間隔（秒。印の `interval`）・印の `play` が `autoplay` か・強調を当てる関数・動きを減らす設定・画面に入ったら 1 回呼ぶ関数を登録して外す関数を返す関数（`IntersectionObserver` の差し替え口）
    returns:
      type: BandHandle
      description: 止める関数と片付ける関数
    process: |-
      1. `renderMapBand` で帯を描き、前へ・次へは端で反対の端へ回し、`apply` で強調を当てる
      2. 自動で進めるの間は `interval` 秒ごとに次へ進め、強調するノードの中心へ表示する枠をスクロールする。読者がホイール・ドラッグ・キーで表示する枠を触ったら、自動で進め直すまでスクロールしない
      3. 停止で `apply(undefined)` を呼び、始めた段に戻す。`update` で手順を差し替えたときは、自動で進めるを止めて番号を `–` に戻す
      4. `autoplay` が `true` なら `observe` で図の枠が画面に入るのを待ち、入ったら `reducedMotion` が `false` のときだけ自動で進めるを始める（`true` のときは止めた帯のまま）
    unit_tests:
      - name: test_attach_band_when_next
        case: 正常
        summary: 次へ
        condition: 4 手順で次へを 5 回押す
        mock: '`apply`'
        expected: '`apply` に手順 0・1・2・3・0 が渡る'
      - name: test_attach_band_when_auto
        case: 正常
        summary: 自動で進める
        condition: '`interval: 3` で自動で進めるを押し、時計を 6 秒進める'
        mock: 時計（fake timers）・`scrollTo`
        expected: 手順 0・1 まで進み、表示する枠の `scrollTo` を 2 回呼ぶ
      - name: test_attach_band_when_user_scrolls
        case: 正常
        summary: 読者が触る
        condition: 自動で進める間に表示する枠でホイールを回す
        mock: 時計・`scrollTo`
        expected: 以降の手順で `scrollTo` を呼ばない
      - name: test_attach_band_when_autoplay
        case: 正常
        summary: 画面に入ったら始める
        condition: '`autoplay: true`・`reducedMotion: false`。`observe` の `onEnter` を呼ぶ'
        mock: '`observe`・時計'
        expected: '`onEnter` の前は `apply` を呼ばず、呼んだ後に手順 0 が渡り、自動で進めるの `aria-pressed` が `true`'
      - name: test_attach_band_when_update
        case: 正常
        summary: 手順の差し替え
        condition: 4 手順で次へを 2 回押してから、2 手順に `update` する
        mock: '`apply`'
        expected: 帯の番号が `–/2` になり、`update` で `apply` を呼ばない
      - name: test_attach_band_when_autoplay_reduced
        case: 正常
        summary: 動きを減らす設定
        condition: '`autoplay: true`・`reducedMotion: true`。`onEnter` を呼ぶ'
        mock: '`observe`'
        expected: '`apply` を呼ばず、帯の番号が `–` のまま'
  - name: renderMapFlow
    title: mapの構成図のHTML
    kind: 関数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: 部品設計『mapの構成図』の HTML。フロー図の部品の定義にしたノードと線を `renderFlow` で描き、グループの面とタイトルの行・開閉と中へ入るボタン・閉じたグループを重ねる。ノードと線を押す場所はフォーカスできるボタンにし、中へ入ったグループと薄く残したグループのほかは、タイトルの行に動かす帯（`.map-group-bar`）を置く
    scope: public
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[renderFlow]
