title: ライブラリ本体 / map / 描画と操作
lead: '`dist/map.js` の入口と、構成図・シーケンス図を描いて開閉・中へ入る・選択・移動・案内・再生の操作を付け、状態を sessionStorage とクエリ文字列に保つ処理と、部品の HTML。ブラウザでだけ動く（部品の HTML は Node でも動く）。'
test_files:
  - tests/unit/src/map/state.test.ts
  - tests/unit/src/map/drag.browser.test.ts
  - tests/unit/src/map/band.browser.test.ts
  - tests/unit/src/map/index.browser.test.ts
  - tests/unit/src/map/flow-view.browser.test.ts
  - tests/unit/src/map/sequence-view.browser.test.ts
  - tests/unit/src/parts/map.test.ts
data_models:
  - name: MapPartModule
    title: mapの部品のモジュール
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`dist/map.js` が export する関数'
    properties:
      - name: attachMap
        type: '(root: HTMLElement, config: ResolvedConfig) => () => void'
        description: '`root` の中の `div.mdmark-map` を全て図にし、片付ける関数を返す'
  - name: MapState
    title: 図の状態
    container: src/map/state.ts
    usecase: 図のグループの中へ入る・開閉する
    role: データモデル
    summary: 図ごとに保つ状態
    properties:
      - name: collapsed
        type: string[]
        description: 閉じたグループの ID かブロックの番号
      - name: entered
        type: string | undefined
        description: 中へ入ったグループの ID か、中だけを描くブロックの番号
      - name: selected
        type: string[]
        description: 選んだノードか参加者の ID
      - name: positions
        type: 'Record<string, { x: number; y: number }>'
        description: 動かしたノード・グループの座標
      - name: wireShifts
        type: 'Record<string, Array<{ segment: number; offset: number }>>'
        description: 動かした線の区間のずらし
      - name: attachments
        type: 'Record<string, { from?: "top" | "right" | "bottom" | "left"; to?: "top" | "right" | "bottom" | "left" }>'
        description: 線をつなぎ替えた端の辺（線の ID ごと。元の端は `from`、先の端は `to`）
      - name: order
        type: string[] | undefined
        description: 参加者の並び順
      - name: height
        type: number | undefined
        description: 表示する枠の高さ
  - name: MapFlowHandle
    title: 構成図の操作の口
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachMapFlow` の戻り値'
    properties:
      - name: focus
        type: '(target: { nodes: string[]; wires: string[] }) => void'
        description: 案内を止めて、外から強調を当てる（シーケンス図の再生）
      - name: clearFocus
        type: () => void
        description: 外から当てた強調を解く
      - name: destroy
        type: () => void
        description: 操作と観察を外す
  - name: MapSequenceHandle
    title: シーケンス図の操作の口
    container: src/map/sequence-view.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachMapSequence` の戻り値'
    properties:
      - name: playsOver
        type: number | undefined
        description: 補足の `plays_over`（再生を重ねる構成図の番号）
      - name: clear
        type: () => void
        description: 再生を止めて強調を解く（構成図の案内を始めたとき）
      - name: destroy
        type: () => void
        description: 時計と操作を外す
  - name: BandStep
    title: 帯の手順
    container: src/map/band.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachBand` が進める 1 つの手順'
    properties:
      - name: title
        type: string
        description: 帯のタイトル
      - name: text
        type: string
        description: 説明の文
      - name: nodes
        type: string[]
        description: 強調するノードか参加者
      - name: wires
        type: string[]
        description: データの印を流す線
      - name: enter
        type: string | undefined
        description: その手順で中へ入るグループ
  - name: BandHandle
    title: 帯の操作の口
    container: src/map/band.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: '`attachBand` の戻り値'
    properties:
      - name: stop
        type: () => void
        description: 強調を解いて始める前に戻す
      - name: update
        type: '(steps: BandStep[]) => void'
        description: 進める手順を差し替え、始める前の状態に戻す（強調は当て直さない）
      - name: destroy
        type: () => void
        description: 時計と操作を外す
  - name: MapFlowArgs
    title: mapの構成図の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapの構成図』の引数（`layout`・`collapsed`・`entered`・`selected`・`focus`・`packets`・`dragging`）
    properties:
      - name: layout
        type: MapLayout
        description: 配置の結果
      - name: collapsed
        type: string[]
        description: 閉じたグループ
      - name: entered
        type: string | undefined
        description: 中へ入ったグループ
      - name: selected
        type: string[]
        description: 選んだノード
      - name: focus
        type: '{ nodes: string[]; wires: string[] } | undefined'
        description: 強調
      - name: packets
        type: MapPacket[]
        description: データの印
      - name: dragging
        type: string | undefined
        description: 動かしている要素
  - name: MapSequenceArgs
    title: mapのシーケンス図の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『mapのシーケンス図』の引数
    properties:
      - name: sequence
        type: Sequence
        description: 読み取り結果
      - name: rows
        type: SequenceRow[]
        description: '`sequenceRows` の行'
      - name: participants
        type: string[]
        description: 表示する参加者の順
      - name: collapsed
        type: number[]
        description: 閉じたブロック
      - name: entered
        type: number | undefined
        description: 中だけを描くブロック
      - name: selected
        type: string[]
        description: 選んだ参加者
      - name: focus
        type: '{ message: number } | undefined'
        description: 再生の強調
  - name: MapBandArgs
    title: 案内の帯の引数
    container: src/parts/map.ts
    usecase: Mermaidと補足で図を描く
    role: データモデル
    summary: 部品設計『案内の帯』の引数
    properties:
      - name: mode
        type: '"walkthrough" | "playback"'
        description: モード
      - name: total
        type: number
        description: 手順の数
      - name: index
        type: number | undefined
        description: 今の番号
      - name: title
        type: string
        description: タイトル
      - name: text
        type: string
        description: 説明の文
      - name: auto
        type: boolean
        description: 自動で進めているか
      - name: label
        type: string
        description: 帯の名前
constants:
  - name: MAP_STATE_KEY_PREFIX
    title: 状態のキーの頭
    container: src/map/state.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 定数
    summary: sessionStorage のキーの頭（`{頭}{pathname}{まとめた HTML の文書の経路}#{図の番号}`。文書の経路はハッシュの `#/{パス}` の部分で、まとめた HTML のほかでは空）
    value: '"mdmark-map:"'
  - name: MAP_QUERY_PREFIX
    title: クエリ文字列のキーの頭
    container: src/map/state.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 定数
    summary: クエリ文字列のキーの頭（`map-{図の番号}`）
    value: '"map-"'
  - name: DRAG_THRESHOLD_PX
    title: 押した扱いの動き
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: この値より動かずに離したら押した扱いにする（px）
    value: '4'
  - name: KEY_MOVE_PX
    title: キー 1 回で動かす量
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: Alt + 矢印キー 1 回で動かす量（px）。Shift も押すと `KEY_MOVE_PX_LARGE`
    value: '8'
  - name: KEY_MOVE_PX_LARGE
    title: Shift で動かす量
    container: src/map/drag.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: Alt + Shift + 矢印キー 1 回で動かす量（px）
    value: '32'
  - name: DIM_SELECTOR
    title: 薄くする対象
    container: src/map/flow-view.ts
    usecase: Mermaidと補足で図を描く
    role: 定数
    summary: 強調するときに `map-dim` を付ける要素のセレクター（ノード・線・ラベル・ライフライン）
functions:
  - name: attachMap
    title: mapを付ける
    kind: 関数
    container: src/map/index.ts
    usecase: Mermaidと補足で図を描く
    role: 処理
    summary: '`root` の中の `div.mdmark-map` ごとに、種類で構成図かシーケンス図を付け、案内と再生をつなぎ、片付ける関数を返す'
    scope: public
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[attachMapFlow]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[attachMapSequence]
      - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseMapArgs]
      - dev/設計書/モジュール構成/ライブラリ本体/map/点検.ts#functions[collectMapProblems]
    args:
      - name: root
        type: HTMLElement
        required: true
        description: '`mount` が描いた要素'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を当てた設定
    returns:
      type: () => void
      description: 付けた操作と観察を外す関数
    process: |-
      1. `div.mdmark-map` ごとに `data-map-args` を `parseMapArgs` で読み、`data-map-kind` で `attachMapFlow` か `attachMapSequence` に引数と一緒に指定する。`collapse` があれば図の枠を `details`（`open` は `collapse.open`、見出しは `collapse.title` か `title`）で包む
      2. 範囲ごとに `collectMapProblems`（`includeUnknownKeys: false`）から `collectMapStructure` の項目を除いた項目があれば、`render` の記載の警告に足すか、無ければ図の枠の前に部品『書き方の警告』を配置する
      3. シーケンス図の補足の `plays_over` が指す構成図を探し、再生の強調を構成図にも当てる。片方の図で案内か再生を始めたら、もう片方の強調を解く
    unit_tests:
      - name: test_attach_map
        case: 正常
        summary: 構成図とシーケンス図
        condition: 2 つの `div.mdmark-map`
        mock: なし（jsdom）
        expected: '`figure.mdmark-diagram[data-diagram=map]` が 2 つになり、返した関数で操作が外れる'
      - name: test_attach_map_when_collapse
        case: 正常
        summary: 折りたたみ
        condition: '`data-map-args` が `{"title":"全体","collapse":{"open":false}}`'
        mock: なし（jsdom）
        expected: 図の枠が `open` を持たない `details` に入り、`summary` の文字が `全体`
      - name: test_attach_map_when_problems
        case: 異常
        summary: 書き方の誤り
        condition: 読めない Mermaid の行と知らない補足のキー `layuot` を持つ範囲
        mock: なし（jsdom）
        expected: 図の枠の前の記載の警告が 1 つで、読めない行と `layuot` を含む
  - name: attachMapFlow
    title: 構成図を付ける
    kind: 関数
    container: src/map/flow-view.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 処理
    summary: 構成図を読み取り、状態を読んで配置し、描いて測った大きさで配置し直し、操作を付ける
    scope: public
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseFlowchart]
      - dev/設計書/モジュール構成/ライブラリ本体/map/配置.ts#functions[layoutMap]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[readMapState]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[writeMapState]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[startDrag]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[attachBand]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[renderMapFlow]
    args:
      - name: range
        type: HTMLElement
        required: true
        description: '`div.mdmark-map`'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を当てた設定
      - name: args
        type: MapArgs
        required: true
        description: 印の引数
      - name: onWalk
        type: () => void
        required: false
        description: 案内の手順を進めたときに呼ぶ関数
    returns:
      type: MapFlowHandle
      description: 強調を外から当てる関数と片付ける関数
    process: |-
      1. `parseFlowchart`・`parseMapData` で読み、`readMapState`（印の `focus` と、補足の `layout` の `collapsed` が `true` の ID を指定する）で状態を読む
      2. 補足の `layout` に状態の `positions`・`attachments`（`ends` に重ねる）を重ねた上書きで `layoutMap` を配置し、`renderDiagramFrame`（種類 `map`・`wide`・`tools`）と `renderMapFlow` で描く
      3. ノードの中身を測り、見積もりと違う大きさのノードを `size` にして配置し直す。以降はノードの大きさを `ResizeObserver` で見て同じく配置し直す
      4. 補足の `walkthroughs` を `attachBand`（モード `walkthrough`）の手順にする。手順を進めるたびに `onWalk` を呼び、停止で案内を始めたときに中へ入っていたグループに戻す
      4. 開閉・中へ入る・選ぶ・線を指す・動かすの操作と、Esc（選択を解き、無ければ外へ戻る）、右上のボタンを付け、変わるたびに `writeMapState` で保つ
      5. 補足に `walkthroughs` があれば `attachBand`（印の `interval`・`play`）で案内の帯を付ける
    unit_tests:
      - name: test_attach_map_flow_when_toggle
        case: 正常
        summary: グループを閉じる
        condition: モックの `FLOW` を描き、`store` の開閉のボタンを押す
        mock: '`readMapState`・`writeMapState`'
        expected: '`store` が `map-closed-group` になり、`writeMapState` の `collapsed` が `[store]`'
      - name: test_attach_map_flow_when_select_wire
        case: 正常
        summary: 線を押す
        condition: '`mount`→`marker` の線を押す'
        mock: '`writeMapState`'
        expected: '`selected` が `[mount, marker]`。もう一度押すと空'
      - name: test_attach_map_flow_when_escape
        case: 正常
        summary: Esc
        condition: '`entered: read` で選択が無い'
        mock: なし
        expected: 外へ戻り、`entered` が `lib`
      - name: test_attach_map_flow_when_packets
        case: 正常
        summary: 選んだ線と指した線の印
        condition: '`mount` を押して選ぶ。選択を解いてから `marker->data` の線を指す'
        mock: なし
        expected: 選んでいる間は `mount` の線の上に `.map-packet` があり、選択を解くと無くなる。線を指している間は `marker->data` の上にだけ `.map-packet` があり、離すと無くなる
  - name: attachMapSequence
    title: シーケンス図を付ける
    kind: 関数
    container: src/map/sequence-view.ts
    usecase: シーケンス図の参加者を選んで強調する
    role: 処理
    summary: シーケンス図を読み取り、状態を読んで表示する行を決めて描き、ブロックの開閉・中だけを描く・参加者の選択と並べ替えを付ける
    scope: public
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/map/読み取り.ts#functions[parseSequence]
      - dev/設計書/モジュール構成/ライブラリ本体/map/配置.ts#functions[sequenceRows]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[attachBand]
      - dev/設計書/モジュール構成/ライブラリ本体/map/描画と操作.ts#functions[renderMapSequence]
    args:
      - name: range
        type: HTMLElement
        required: true
        description: '`div.mdmark-map`'
      - name: config
        type: ResolvedConfig
        required: true
        description: 既定を当てた設定
      - name: args
        type: MapArgs
        required: true
        description: 印の引数
      - name: onStep
        type: '(message: number | undefined) => void'
        required: false
        description: 再生で進めたメッセージの番号を受け取る関数（止めたときは `undefined`）
    returns:
      type: MapSequenceHandle
      description: 再生の強調を外から受け取る関数と片付ける関数
    process: |-
      1. `parseSequence`・`parseMapData` で読み、`readMapState` で状態を読んで `sequenceRows` で表示する行を決め、`renderMapSequence` で描く
      2. 表示する行のメッセージを `attachBand`（モード `playback`）の手順にする。開閉・中だけを描くで表示するメッセージが変わったら `update` で手順を差し替え、再生していれば `onStep(undefined)` を呼ぶ
      3. 参加者の箱の名前の文字の外を押すと選び、4px 動かすと並べ替えのドラッグにして、移す先の列に縦の線（`.map-insert-line`）を出し、離した位置に最も近い列へ移す。ドラッグの直後の押した扱いは選ばない
    unit_tests:
      - name: test_attach_map_sequence_when_reorder
        case: 正常
        summary: Alt + →
        condition: 1 人目の参加者にフォーカスして Alt + →
        mock: '`writeMapState`'
        expected: '`order` の 1 人目と 2 人目が入れ替わる'
      - name: test_attach_map_sequence_when_enter_block
        case: 正常
        summary: 中だけを描く
        condition: '`loop` のタブの名前を押す'
        mock: '`writeMapState`'
        expected: '`entered` が `1` で、`loop` の中の参加者だけを描く'
      - name: test_attach_map_sequence_when_packets
        case: 正常
        summary: 選んだ参加者の印
        condition: '`mount` の参加者の箱の名前の外を押す'
        mock: なし
        expected: '`mount` が送る・受けるメッセージの線の上に `.map-packet` があり、ほかのメッセージの線の上には無い'
  - name: readMapState
    title: 状態を読む
    kind: 関数
    container: src/map/state.ts
    usecase: 図のグループの中へ入る・開閉する
    role: 処理
    summary: クエリ文字列（`url_state` が `true` のとき）→ sessionStorage → 印の `focus` の順に、最初に入るグループかブロックを決め、ほかの状態を sessionStorage から読み、知らない ID・番号を捨てる。sessionStorage に開閉の状態が無いときは、補足の `layout` の `collapsed` が `true` のグループを閉じる
    scope: public
    args:
      - name: options
        type: '{ index: number; ids: Set<string>; urlState: boolean; focus: string | undefined; collapsed: string[]; storage: Storage | undefined; location: Location }'
        required: true
        description: 図の番号・知っている ID・設定・印の `focus`・補足で最初に閉じるグループの ID・保存先
    returns:
      type: MapState
      description: 状態
    unit_tests:
      - name: test_read_map_state_when_query
        case: 正常
        summary: クエリ文字列を先に読む
        condition: '`?map-1=read` と sessionStorage の `entered: place`'
        mock: なし
        expected: '`entered` が `read`'
      - name: test_read_map_state_when_url_state_off
        case: 正常
        summary: url_state が false
        condition: '同上で `urlState: false`'
        mock: なし
        expected: '`entered` が `place`'
      - name: test_read_map_state_when_unknown_id
        case: 正常
        summary: 知らない ID
        condition: '`?map-1=ghost`'
        mock: なし
        expected: '`entered` が無い'
      - name: test_read_map_state_when_storage_unavailable
        case: 正常
        summary: sessionStorage が無い
        condition: '`storage: undefined`'
        mock: なし
        expected: 空の状態で、例外を投げない
