      - name: args
        type: MapFlowArgs
        required: true
        description: 部品の引数
    returns:
      type: '{ html: string; tips: string }'
      description: 図の HTML（`html`）と、ノードの説明と用語のツールチップの HTML（`tips`。図の枠の `.mdmark-diagram-box` に配置する）
    unit_tests:
      - name: test_render_map_flow
        case: 正常
        summary: グループとノード
        condition: 部品の Default の引数
        mock: なし
        expected: '`[data-group]` が 4 つ、`[data-node]` が 10 で、凡例が無い'
      - name: test_render_map_flow_when_keyboard
        case: 正常
        summary: キーで操作する場所
        condition: '`entered: read` と、`entered` なし'
        mock: なし
        expected: '配置した全てのノードと線を押す場所が `tabindex="0"`・`role="button"` を持ち、`read` の `.map-group-bar` が `entered: read` では無く、`entered` なしではある'
      - name: test_render_map_flow_when_entered
        case: 正常
        summary: 中へ入った
        condition: '`entered: read`'
        mock: なし
        expected: '`read` の外の要素が `map-faded` を持ち、`read` のタイトルが `button` でない'
      - name: test_render_map_flow_when_packets
        case: 正常
        summary: データの印
        condition: '`mount->marker` に `{ direction: both, color: orange, shape: square }`、`marker->data` に `{ direction: forward }` の印'
        mock: なし
        expected: '`mount->marker` の印は四角でオレンジの塗りを持ち、逆向き（`keyPoints="1;0"`）を含む両方向へ流れる。`marker->data` の印は丸で線の色、逆向きを含まない。どの印も `animateMotion` を `repeatCount="indefinite"` で持つ'
      - name: test_render_map_flow_when_unknown_color
        case: 異常
        summary: 知らない色の名前
        condition: '印の `color` が `red;x:y`、グループの色が `blue;x`'
        mock: なし
        expected: 印が線の色で塗られ、グループが色を持たず、出力に `;x:y` と `;x` が無い
      - name: test_render_map_flow_when_terms
        case: 正常
        summary: 用語の下線
        condition: '`terms` が `{"補足": "意味"}` で、ノード `data` の名前が `<b>補足</b>の検査`'
        mock: なし
        expected: ノード `data` の `.mdmark-diagram-node-name` の中に `span.mdmark-term` が 1 つで文字が `補足`、`<b>` は逃がした文字で、`tips` に意味のツールチップと、`notes` の説明のツールチップがある。グループのタイトルに `mdmark-term` が無い
  - name: renderMapSequence
