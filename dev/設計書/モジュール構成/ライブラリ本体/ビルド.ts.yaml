        mock: 一時フォルダの git のリポジトリ
        expected: 誤りに `migrations/v0.4.0/` へ移すことが入る
      - name: test_check_migrations_when_no_tag
        case: 正常
        summary: タグが無ければスキーマを比べない
        condition: タグの無いリポジトリで Schema を変える
        mock: 一時フォルダの git のリポジトリ
        expected: 空
    refs:
