    summary: スキーマを最新のバージョンのタグから変えたのに移行の手順も手順なしの一覧の合う行も無いこと、release のビルドで出していないバージョンの手順が残ること、手順の構造の誤りを、修正方法つきの文で返却する
    description: '順に、`migrations/` の全ての `steps.yaml`（`next` と `v{バージョン}`）を `validateSteps` で検め、`call` のスクリプトがあることと `no-steps.yaml` の構造を確認する → `latestVersionTag` が `undefined` か、比べるバージョンがタグより古ければそこで終える → 比べるバージョンがタグと同じなら `next`、新しければ `v{比べるバージョン}` を確認するバージョンにし、新しいときは `migrations/next/` と `version: next` の行が残っていれば誤りにする → `CHECKED_SCHEMAS` ごとに `git show {タグ}:schemas/{名前}` と今の中身を比べ、違うものは確認するバージョンの `steps.yaml` か、確認するバージョン・その Schema・今の中身の SHA-256（`node:crypto`）の合う行があれば合格にする。タグに無い Schema と作業ツリーに無い Schema は比べない'
