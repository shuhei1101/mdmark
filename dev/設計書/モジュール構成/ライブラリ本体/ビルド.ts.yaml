title: "ライブラリ本体 / ビルド"
lead: '`npm run build` が実行するビルドのスクリプト。版を決めて検査し、esbuild で `dist/` を書き、配布ファイルのサイズを検査する。Node.js v24 が型を消して `node scripts/build.ts` で直接実行する。'
directory: |-
  ```tree
  scripts/
  └── build.ts  # 版の決定と検査・esbuild の呼び出し・サイズの検査
  ```
constants:
  - name: VERSION_PATTERN
    title: 版の書式
    container: scripts/build.ts
    summary: 埋める版が合うべき書式
    value: /^v\d+\.\d+\.\d+$/
  - name: MAX_DIST_FILE_BYTES
    title: 配布ファイル 1 つの上限
    container: scripts/build.ts
    summary: jsDelivr が配る 1 ファイルの上限（20MB）
    value: 20 * 1024 * 1024
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[配布ファイル 1 つのサイズ]
  - name: BROWSER_TARGETS
    title: 出力の対象のブラウザ
    container: scripts/build.ts
    summary: esbuild の `target` に渡すブラウザの版
    value: '["chrome94", "firefox93", "safari16.4"]'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[対応ブラウザ]
functions:
  - name: main
    title: ビルドを実行する
    container: scripts/build.ts
    kind: 関数
    scope: public
    is_async: true
    summary: 前回の `dist/` を消してから、版を決めて検査し、`dist/` を書いてサイズを検査し、終了コードを返す
    side_effects: '最初に `dist/` を消してから書き直す。失敗したとき（版の書式の誤り・`version.ini` を読めない・esbuild の失敗・上限超過）は `dist/` を残さず、標準エラーに理由を出す'
    args:
      - name: argv
        type: string[]
        description: コマンドの引数（`--version v{版}` を持てる）
      - name: options
        type: '{ root: string; maxBytes: number }'
        required: false
        default: リポジトリの直下と `MAX_DIST_FILE_BYTES`
        description: 作業ツリーの場所と配布ファイルの上限（テストで差し替える）
    returns:
      type: Promise<0 | 1>
      description: 成功は 0、版の書式の誤り・`version.ini` を読めない・esbuild の失敗・上限超過は 1
    unit_tests:
      - name: test_main
        case: 正常
        summary: '`version.ini` の版でビルドする'
        condition: '`--version` 無し、`version.ini` は `v0.0.0`'
        mock: 一時フォルダに `src/` と `version.ini` を置く
        expected: 0 を返し、`dist/index.js` に `v0.0.0` が埋まる
      - name: test_main_when_version_given
        case: 正常
        summary: 渡した版でビルドする
        condition: '`--version v0.0.1`'
        mock: 一時フォルダに `src/` と `version.ini` を置く
        expected: 0 を返し、`dist/index.js` に `v0.0.1` が埋まる
      - name: test_main_when_version_format_invalid
        case: 異常
        summary: 版の書式が違うと前回の `dist/` を残さずに終わる
        condition: '`--version 1.2`'
        mock: 一時フォルダに `src/` と `version.ini` と、前回のビルドの `dist/index.js` を置く
        expected: 1 を返し、`dist/` が無く、標準エラーに `v{MAJOR}.{MINOR}.{PATCH}` が出る
      - name: test_main_when_version_ini_missing
        case: 異常
        summary: '`version.ini` を読めないと前回の `dist/` を残さずに終わる'
        condition: '`--version` 無し、`version.ini` が無い'
        mock: 一時フォルダに `src/` と、前回のビルドの `dist/index.js` を置く（`version.ini` は置かない）
        expected: 1 を返し、`dist/` が無く、標準エラーに `version.ini` が出る
      - name: test_main_when_build_fails
        case: 異常
        summary: esbuild が失敗すると前回の `dist/` を残さずに終わる
        condition: '`src/index.ts` に構文エラーがある'
        mock: 一時フォルダに構文エラーのある `src/index.ts` と `version.ini` と、前回のビルドの `dist/index.js` を置く
        expected: 1 を返し、`dist/` が無く、標準エラーに `src/index.ts` が出る
      - name: test_main_when_dist_file_too_large
        case: 異常
        summary: 上限を超えると `dist/` を消して終わる
        condition: '`maxBytes` が 1'
        mock: 一時フォルダに `src/` と `version.ini` を置く
        expected: 1 を返し、`dist/` が無く、標準エラーにファイル名とサイズが出る
    callees:
      - '#functions[resolveVersion]'
      - '#functions[buildDist]'
      - '#functions[findTooLargeOutputs]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/配布物をビルドする.ts#
    description: ファイルの末尾で、`import.meta.main` が `true`（`node scripts/build.ts` で入口として実行された）ときだけ `main(process.argv.slice(2))` を呼び、戻り値を `process.exitCode` に入れる。単体テストが import したときは呼ばない。
  - name: resolveVersion
    title: 埋める版を決める
    container: scripts/build.ts
    kind: 関数
    scope: public
    summary: '`--version` があればその値、無ければ `version.ini` の先頭行を返し、書式を検査する'
    args:
      - name: argv
        type: string[]
        description: コマンドの引数
      - name: root
        type: string
        description: '`version.ini` を置いたフォルダ'
    returns:
      type: string
      description: 埋める版
    exceptions:
      - name: VersionFormatError
        condition: 版が `VERSION_PATTERN` に合わない
        message: '版の書式が違う: {版}（v{MAJOR}.{MINOR}.{PATCH}）'
    unit_tests:
      - name: test_resolve_version
        case: 正常
        summary: '`version.ini` の先頭行を返す'
        condition: '`--version` 無し'
        mock: 一時フォルダに `v0.0.0` と書いた `version.ini`
        expected: '`v0.0.0`'
      - name: test_resolve_version_when_version_given
        case: 正常
        summary: 渡した版を優先する
        condition: '`--version v0.0.1`'
        mock: 一時フォルダに `v0.0.0` と書いた `version.ini`
        expected: '`v0.0.1`'
      - name: test_resolve_version_when_format_invalid
        case: 異常
        summary: 書式の違う版を拒む
        condition: '`--version 1.2`'
        mock: なし
        expected: '`VersionFormatError` を投げる'
        exception: VersionFormatError
  - name: buildDist
    title: 配布物を書く
    container: scripts/build.ts
    kind: 関数
    scope: public
    is_async: true
    summary: esbuild で `src/index.ts` と `src/index.css` を、版を埋めた `dist/index.js` と `dist/index.css` に束ねる
    description: '`format: esm`・`bundle: true`・`target: BROWSER_TARGETS`・`define` で `__MDMARK_VERSION__` を、`banner.css` で `:root{--mdmark-version:"{版}"}` を埋め、`metafile` を取る。'
    side_effects: '`dist/` を書き換える'
    args:
      - name: version
        type: string
        description: 埋める版
      - name: root
        type: string
        description: 作業ツリーの場所
    returns:
      type: Promise<Record<string, number>>
      description: 出力ファイルのパスとバイト数
    unit_tests:
      - name: test_build_dist
        case: 正常
        summary: 版を埋めた JS と CSS を 1 つずつ書く
        condition: 版 `v0.0.1`
        mock: 一時フォルダに `src/index.ts` と `src/index.css` を置く
        expected: 戻り値が `dist/index.js` と `dist/index.css` の 2 件。JS に `"v0.0.1"`、CSS の先頭に `--mdmark-version:"v0.0.1"` が入る
  - name: findTooLargeOutputs
    title: 上限を超えた配布ファイルを拾う
    container: scripts/build.ts
    kind: 関数
    scope: public
    summary: 出力ファイルのうち上限を超えたものを返す
    args:
      - name: outputs
        type: Record<string, number>
        description: 出力ファイルのパスとバイト数
      - name: maxBytes
        type: number
        description: 1 ファイルの上限
    returns:
      type: 'Array<{ path: string; bytes: number }>'
      description: 上限を超えたファイル（無ければ空）
    unit_tests:
      - name: test_find_too_large_outputs
        case: 正常
        summary: 上限以下なら空を返す
        condition: 100 バイトと 200 バイト、上限 200
        mock: なし
        expected: 空
      - name: test_find_too_large_outputs_when_over_limit
        case: 正常
        summary: 上限を超えたファイルだけを返す
        condition: 100 バイトと 201 バイト、上限 200
        mock: なし
        expected: 201 バイトの 1 件
test_files:
  - tests/unit/scripts/build.test.ts
