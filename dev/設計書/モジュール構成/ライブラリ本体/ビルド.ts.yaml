  - name: findBaselineViolations
    title: 対応ブラウザの下限に無い API を取得する
    kind: 関数
    container: scripts/baseline.ts
    scope: public
    is_async: true
    summary: 利用側のブラウザが読み込む JS を minify せずにまとめ、対応ブラウザの下限に無い API の使用を返却する
    description: '`BASELINE_ENTRIES` のうち作業ツリーにある入口を、`buildDist` と同じ `target: BROWSER_TARGETS`・`plugins: [postcssStubPlugin]`・`define` で、`minify: false`・`write: false` にしてまとめる。まとめた JS ごとに `lintBundle` を呼ぶ。ネットワークに接続しない'
    side_effects: なし（まとめた JS はメモリに配置し、ファイルに書き込まない）
    args:
      - name: options
        type: '{ root: string; version: string }'
        required: true
        description: 作業ツリーの場所と、`define` に埋めるバージョン
    returns:
      type: Promise<BaselineViolation[]>
      description: 下限に無い API の使用（無ければ空）。入口の順、まとめた JS の中の位置の順
    process: |-
      1. 作業ツリーにある入口を minify せずにまとめる（esbuild）
      2. まとめた JS ごとに、下限に無い API の使用を取得する（まとめた JS を下限のバージョンと照らす）
      3. 取得したものを入口の順につないで返却する
    unit_tests:
      - name: test_find_baseline_violations
        case: 正常
        summary: 下限に無い API を使用しなければ空を返却する
        condition: '`src/index.ts` が `export const a = 1`'
        mock: 一時フォルダに `src/` を配置し、作業ツリーの `node_modules` へのリンクを配置する
        expected: 空
      - name: test_find_baseline_violations_when_api_unguarded
        case: 正常
        summary: 確認せずに使用する下限に無い API を返却する
        condition: '`src/index.ts` の最上位で `new Intl.Segmenter("ja")` を呼ぶ'
        mock: 一時フォルダに `src/` を配置し、作業ツリーの `node_modules` へのリンクを配置する
        expected: 1 件で、`file` が `dist/index.js`、`api` が `Intl.Segmenter`、`message` に `Firefox 98` が入る
      - name: test_find_baseline_violations_when_api_guarded
        case: 正常
        summary: 同じ API の typeof の if の中で使用すれば返却しない
        condition: '`src/index.ts` が `if (typeof Intl.Segmenter !== "undefined") { new Intl.Segmenter("ja"); }`'
        mock: 一時フォルダに `src/` を配置し、作業ツリーの `node_modules` へのリンクを配置する
        expected: 空
      - name: test_find_baseline_violations_when_unrelated_if
        case: 正常
        summary: 無関係な条件の if の中の使用も返却する
        condition: '`src/index.ts` が `export function f(x: number) { if (x > 1) { return new Intl.Segmenter("ja"); } }`'
        mock: 一時フォルダに `src/` を配置し、作業ツリーの `node_modules` へのリンクを配置する
        expected: 1 件で、`api` が `Intl.Segmenter`
      - name: test_find_baseline_violations_when_entry_missing
        case: 正常
        summary: 作業ツリーに無い入口は飛ばす
        condition: '`src/index.ts` だけがあり、`src/views/`・`src/comments/`・`src/viewer/` が無い'
        mock: 一時フォルダに `src/` を配置し、作業ツリーの `node_modules` へのリンクを配置する
        expected: 例外を投げず、空
    callees:
      - '#functions[toBrowserslist]'
      - '#functions[isGuardedByTypeof]'
      - '#functions[lintBundle]'
    callers:
      - '#functions[main]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/配布物をビルドする.ts#constraints[対応ブラウザの下限の確認]
      - dev/設計書/外部ライブラリ/eslint-plugin-compat#
      - dev/設計書/外部ライブラリ/eslint#
    notes:
      if の中を全て数える理由: 'eslint-plugin-compat の既定は、祖先に `IfStatement` があれば条件を確認せずに数えない。無関係な `if` の中の使用を見逃すため、`ignoreConditionalChecks: true` で全て数え、削除するのは `isGuardedByTypeof` に任せる'
      minify しない理由: minify した JS では `if` のブロックが式に畳まれ、同じ API の `typeof` の確認の中の使用も報告に出る
  - name: isGuardedByTypeof
    title: 有無を確認した中かを判定する
    kind: 関数
    container: scripts/baseline.ts
    scope: internal
    summary: 報告の位置が、同じ API の typeof を条件に持つ if の中（ブロックか条件の式）にあるかを返却する
    description: '`SourceCode` の `getIndexFromLoc` で報告の位置を引き（`getIndexFromLoc` の列は 0 始まりのため、引数の列から 1 参照して指定する）、`getNodeByRangeIndex` のセクションとその祖先（`getAncestors`）のうち `IfStatement` の `test` を確認する。`test` の中に、引数の元の文字列（`getText`）が `api` と同じ `typeof` の単項式があれば真。早期 return の後ろ・三項演算子・論理式の右辺は `IfStatement` の祖先を持たないため偽'
    args:
      - name: options
        type: '{ sourceCode: SourceCode; line: number; column: number; api: string }'
        required: true
        description: まとめた JS の `SourceCode`（ESLint の `Linter.getSourceCode()`）、報告の行と列（1 始まり）、API の名前
    returns:
      type: boolean
      description: 同じ API の `typeof` の確認の中なら `true`
    unit_tests:
      - name: test_is_guarded_by_typeof
        case: 正常
        summary: 同じ API の typeof の if のブロックの中は真
        condition: '`if (typeof Intl.Segmenter !== "undefined") { new Intl.Segmenter("ja"); }` の `new` の位置'
        mock: なし
        expected: '`true`'
      - name: test_is_guarded_by_typeof_when_else_block
        case: 正常
        summary: else のブロックの中も真
        condition: '`if (typeof Intl.Segmenter === "undefined") { f(); } else { new Intl.Segmenter("ja"); }` の `new` の位置'
        mock: なし
        expected: '`true`'
      - name: test_is_guarded_by_typeof_when_in_test
        case: 正常
        summary: 条件の typeof の式の中の参照も真
        condition: '`if (typeof Intl.Segmenter !== "undefined") {}` の `Intl.Segmenter` の先頭の `I` の位置'
        mock: なし
        expected: '`true`'
      - name: test_is_guarded_by_typeof_when_unrelated_if
        case: 正常
        summary: 無関係な条件の if の中は偽
        condition: '`if (x > 1) { new Intl.Segmenter("ja"); }` の `new` の位置'
        mock: なし
        expected: '`false`'
      - name: test_is_guarded_by_typeof_when_other_api
        case: 正常
        summary: 別の API の typeof の if の中は偽
        condition: '`if (typeof Highlight !== "undefined") { new Intl.Segmenter("ja"); }` の `new` の位置、`api` は `Intl.Segmenter`'
        mock: なし
        expected: '`false`'
      - name: test_is_guarded_by_typeof_when_early_return
        case: 正常
        summary: 早期 return の後ろは偽
        condition: '`function f() { if (typeof Intl.Segmenter === "undefined") { return; } return new Intl.Segmenter("ja"); }` の 2 つ目の `new` の位置'
        mock: なし
        expected: '`false`'
      - name: test_is_guarded_by_typeof_when_ternary
        case: 正常
        summary: 三項演算子は偽
        condition: '`typeof Intl.Segmenter === "undefined" ? undefined : new Intl.Segmenter("ja")` の `new` の位置'
        mock: なし
        expected: '`false`'
      - name: test_is_guarded_by_typeof_when_just_before_if
        case: 正常
        summary: 確認の if の直前の位置は偽（列を 0 始まりに修正して参照する）
        condition: '`Intl.Segmenter;if (typeof Intl.Segmenter !== "undefined") {}` の 1 行目 15 列（`;` の位置。1 ずれると `if` の `i` を指す）'
        mock: なし
        expected: '`false`'
    callers:
      - '#functions[findBaselineViolations]'
  - name: toBrowserslist
    title: ブラウザのバージョンを browserslist の記載方法に修正する
    kind: 関数
    container: scripts/baseline.ts
    scope: public
    summary: esbuild の target の記載方法（`chrome99`）を browserslist の記載方法（`chrome 99`）に修正する
    args:
      - name: targets
        type: string[]
        required: true
        description: esbuild の target（`BROWSER_TARGETS`）
    returns:
      type: string[]
      description: browserslist の問い合わせ
    exceptions:
      - name: Error
        condition: 英小文字の名前と数字・`.` のバージョンに分けられない
        message: 'target の書式が違う: {target}'
    unit_tests:
      - name: test_to_browserslist
        case: 正常
        summary: 名前とバージョンの間に空白を入れる
        condition: '`["chrome99", "firefox98", "safari16.4"]`'
        mock: なし
        expected: '`["chrome 99", "firefox 98", "safari 16.4"]`'
      - name: test_to_browserslist_when_format_invalid
        case: 異常
        summary: バージョンの無い target を拒む
        condition: '`["chrome"]`'
        mock: なし
        expected: '`Error` を投げ、メッセージに `chrome` が入る'
        exception: 名前とバージョンに分けられない
    callers:
      - '#functions[findBaselineViolations]'
  - name: lintBundle
    title: まとめた JS を下限のバージョンと照らす
    kind: 関数
    container: scripts/baseline.ts
    scope: internal
    summary: まとめた JS 1 つに eslint-plugin-compat を実行し、同じ API の typeof の確認の中を除いた報告を返却する。照らせなかったときは例外を投げる
    description: "ESLint の `Linter` で `compat/compat` を実行し、`settings.browsers` に `toBrowserslist(BROWSER_TARGETS)`、`settings.ignoreConditionalChecks: true`、`linterOptions.noInlineConfig: true` を指定する。通知のうち `ruleId` が `compat/compat` のものを報告にし、`ruleId` が `null` で文が `has no effect because you have 'noInlineConfig' setting` を含むもの（まとめた依存が持つ他のプラグインの規則を無効にするコメント）だけを落とす。それ以外の通知（構文として読み込めない `fatal` の通知、`No matching configuration found` など）が 1 件でもあれば、何も照らさずに 0 件を返却することになるため例外を投げる"
    args:
      - name: options
        type: '{ code: string; file: string }'
        required: true
        description: まとめた JS と、それに該当する配布ファイル（`dist/index.js` など。ESLint に指定するファイル名を兼ねる）
    returns:
      type: BaselineViolation[]
      description: 下限に無い API の使用（無ければ空）
    process: |-
      1. まとめた JS に eslint-plugin-compat を実行する（ESLint の `Linter`）
      2. `compat/compat` でも `noInlineConfig` の通知でもない通知があれば例外を投げる
      3. `compat/compat` の報告ごとに API の名前を文の頭から取る
      4. 同じ API の `typeof` の確認の中なら削除する（有無を確認した中かを判定する）
      5. 残りを `BaselineViolation` にして返却する
    exceptions:
      - name: Error
        condition: '`compat/compat` でも `noInlineConfig` の通知でもない通知がある（構文として読み込めない・設定が該当しない 等）'
        message: 'まとめた JS を下限のバージョンと照らせない: {file}:{行}:{列} {通知の文}'
      - name: Error
        condition: '`compat/compat` の報告の文の頭から API の名前を取れない'
        message: '報告の文から API を取れない: {報告の文}'
    unit_tests:
      - name: test_lint_bundle
        case: 正常
        summary: 確認せずに使用する下限に無い API を返却し、同じ API の typeof の if の中は返却しない
        condition: '`code` が `new Intl.Segmenter("ja");` と `if (typeof Intl.Segmenter !== "undefined") { new Intl.Segmenter("ja"); }` の 2 行、`file` が `dist/index.js`'
        mock: なし
        expected: 1 件で、1 行目の `Intl.Segmenter`
      - name: test_lint_bundle_when_inline_config
        case: 正常
        summary: 他のプラグインの規則を無効にするコメントは落とす
        condition: '`code` が `// eslint-disable-next-line foo/bar` と `export const a = 1;` の 2 行、`file` が `dist/index.js`'
        mock: なし
        expected: 空
      - name: test_lint_bundle_when_parse_error
        case: 異常
        summary: 構文として読み込めない JS を拒む
        condition: '`code` が `let let = 1;`、`file` が `dist/index.js`'
        mock: なし
        expected: '`Error` を投げ、メッセージに `dist/index.js` と `Parsing error` が入る'
        exception: 構文として読み込めない
      - name: test_lint_bundle_when_config_not_matched
        case: 異常
        summary: 設定が該当しないファイル名を拒む
        condition: '`code` が `export const a = 1;`、`file` が `dist/index.ts`'
        mock: なし
        expected: '`Error` を投げ、メッセージに `dist/index.ts` と `No matching configuration` が入る'
        exception: 設定が該当しない
    callers:
      - '#functions[findBaselineViolations]'
    callees:
      - '#functions[toBrowserslist]'
      - '#functions[isGuardedByTypeof]'
test_files:
  - tests/unit/scripts/build.test.ts
  - tests/unit/scripts/migrations.test.ts
  - tests/unit/scripts/baseline.test.ts
data_models:
  - name: BaselineViolation
    title: 下限に無い API の使用
    container: scripts/baseline.ts
    role: DTO
    summary: 対応ブラウザの下限に無い API の使用 1 件
    properties:
      - name: file
        type: string
        description: 照らした JS に該当する配布ファイル（`dist/index.js` など）
      - name: line
        type: number
        description: minify せずにまとめた JS の中の行（1 始まり）
      - name: column
        type: number
        description: minify せずにまとめた JS の中の列（1 始まり）
      - name: api
        type: string
        description: API の名前（`Intl.Segmenter` など。報告の文の頭から取る）
      - name: message
        type: string
        description: eslint-plugin-compat の報告の文（`Intl.Segmenter() is not supported in Firefox 98` など。無い下限のブラウザとバージョンを含む）
