        condition: '`mdmark.config.schema.json` を変え、`no-steps.yaml` に `next`・その Schema・今の SHA-256 の行'
        mock: 一時フォルダの git のリポジトリ
        expected: 空
      - name: test_check_migrations_when_steps_missing
        case: 異常
        summary: スキーマを変えて手順も合う行も無ければ誤り
        condition: '`mdmark.index.schema.json` を変え、`no-steps.yaml` には SHA-256 の合わない `next` の行だけ'
        mock: 一時フォルダの git のリポジトリ
        expected: 1 つで `schemas/mdmark.index.schema.json` と `migrations/next/steps.yaml` を含む
      - name: test_check_migrations_when_next_left
        case: 異常
