        condition: '`term=用語 aliases=別名 meaning=意味`、行 `印 | マーク、オン・オフの印 | HTML コメントで書く指定`'
        mock: なし
        expected: '`aliases` が `["マーク", "オン・オフの印"]`、`warning` が無い'
      - name: test_read_glossary_table_when_unknown_column
        case: 異常
        summary: 表に無い列名では用語を返さず警告を返す
        condition: '`term=用語 meaning=説明`、列が `用語`・`意味`'
        mock: なし
        expected: '`entries` が空、`warning` に `説明` と列の並び `用語`・`意味`'
      - name: test_read_glossary_table_when_missing_arg
        case: 異常
        summary: 必須の `meaning=` が無ければ警告を返す
        condition: '`term=用語`'
        mock: なし
        expected: '`entries` が空、`warning` に `meaning=`'
