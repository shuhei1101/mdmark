  - name: readGlossaryTable
    title: 用語集の表を読む
    container: src/render/syntax/glossary.ts
    kind: 関数
    scope: internal
    summary: '`glossary` の印の範囲の中の表のトークンから、用語・意味・別名の列を読んで用語を返す'
    description: 印の引数の `term=`・`meaning=`・`aliases=` で列の見出しの文字を指す。別名のセルは「、」と「,」で区切り、前後の空白を落とす。必須の引数が無いときと、表に無い列名のときは用語を返さず、書き方の警告の項目を返す。用語か意味が空の行は飛ばす。行は `readGlossaryRows` で読み、用語だけを返す（やめた言い方は用語に入れない）
    args:
      - name: options
        type: '{ args: MarkArgs; tokens: Token[]; docId: string }'
        required: true
        description: 印の引数・範囲の中のトークン・表を持つ文書の `id`（索引を渡さないときは空文字）
    returns:
      type: '{ entries: MdmarkGlossaryEntry[]; warning?: string }'
      description: 用語と、書き方の警告の本文（画面設計『文書』の `用語集の表` のエラーの文言）
    unit_tests:
      - name: test_read_glossary_table
        case: 正常
