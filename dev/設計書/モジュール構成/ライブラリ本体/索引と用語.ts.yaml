  - name: termsRule
    title: 用語の下線のコアルール
    container: src/render/syntax/terms.ts
    kind: 関数
    scope: internal
    summary: 本文のテキストのトークンを `findWords` で辞書と照合し、当たった語を語とツールチップの組（`renderTermTip`）に置き換える
    description: 辞書は `buildDictionary` で、索引の `terms`・描く文書の用語集の表・他の文書の用語集の表（`references.glossary`、索引の `docs` の順）・文書の `aliases`（`backlinks` がオンのとき）から作る。同じ用語の `id` は節（見出しから次の同じか上の階の見出しまで）ごとに最初の 1 回だけ下線を付ける。コード・リンク・見出し・用語集の表の中は照合しない。テキストのトークンを語の前後のテキストと、語の位置の `html_inline`（`renderTermTip` の HTML）に分ける。ツールチップの `id` は文書の中の通し番号で `mdmark-term-{番号}` にする（ページで一意にするのは `attachTermTips`）。やめた言い方は、`words` の後ろに `avoided` の語を足した並びで照合する（同じ長さなら用語の語・別名と文書の別名が先に当たる）。当たった語は用語 → やめた言い方 → 文書の別名の順に引き、やめた言い方なら `renderTermTip` に `replacement` を渡す（文書の別名と同じ語でも、関連文書を出さずにやめた言い方にする。点検の `findAvoidedTerms` と揃える）。やめた言い方は節ごとに言い方ごとの最初の 1 回だけで、用語の下線とは別に数える。`glossary` と `backlinks` が両方オフのときは何もしない
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it のコアの状態（`state.env` は `RenderEnv`）
    returns:
      type: void
      description: トークンの並びと `env` を書き換える
    callees:
      - '#functions[buildDictionary]'
      - '#functions[findWords]'
      - '#functions[relativeHref]'
      - '#functions[renderTermTip]'
    unit_tests:
      - name: test_terms_rule
        case: 正常
        summary: 節ごとに最初の 1 回だけ下線を付ける
        condition: 索引の用語 `印` と、2 つの節にそれぞれ 2 回ずつ `印` が出る本文
        mock: なし
        expected: '`mdmark-term-wrap` の要素が 2 つで、各節の最初の語の位置にあり、語の直後にツールチップがある'
      - name: test_terms_rule_skips_code_and_links
        case: 正常
        summary: コード・リンク・見出し・用語集の表の中の語には付けない
        condition: '`印` が行内のコード・リンクの文字・見出し・用語集の表にだけ出る本文'
        mock: なし
        expected: '`mdmark-term-wrap` の要素が無い'
      - name: test_terms_rule_prefers_longer
        case: 正常
        summary: 重なる語は長い方に付ける
        condition: 用語 `機能` と `機能のオン・オフ`、本文 `機能のオン・オフを切り替える`
        mock: なし
        expected: 下線の語が `機能のオン・オフ` の 1 つ
      - name: test_terms_rule_doc_aliases
        case: 正常
        summary: 文書の別名に当たった語に関連文書を付け、描く文書自身は除く
        condition: '`docId` が `guide`、`api` と `guide` の `aliases` に `公開関数`、本文に `公開関数`'
        mock: なし
        expected: ツールチップの関連文書が `api` だけで、`href` が描く文書からの相対パス
      - name: test_terms_rule_when_backlinks_off
        case: 正常
        summary: '`backlinks` がオフなら文書の別名では照合しない'
        condition: '同じ入力に `<!-- features: -backlinks -->`'
        mock: なし
        expected: '`公開関数` に下線が無い'
      - name: test_terms_rule_avoided
        case: 正常
        summary: やめた言い方に節ごとに最初の 1 回だけマーカーを付け、用語の下線とは別に数える
        condition: 用語 `ワークスペース`（`avoid` に `作業場`）。1 つ目の節の段落に `ワークスペース` 1 回と `作業場` 2 回、2 つ目の節の段落に `作業場` 1 回
        mock: なし
        expected: '`mdmark-term-avoided` の要素が 2 つで、各節の最初の `作業場` の位置にあり、ツールチップに見出し `代わりの用語` と `ワークスペース` がある。1 つ目の節の `ワークスペース` には `mdmark-term-avoided` の無い下線がある'
      - name: test_terms_rule_avoided_prefers_term_words
        case: 正常
        summary: やめた言い方が用語の語の一部として出たところにはマーカーを付けない
        condition: 用語 `ワークスペース`（`avoid` なし）と用語 `仕事`（`avoid` に `ワーク`）。本文の 1 つ目の段落が `ワークスペースを開く。`、2 つ目の節の段落が `ワークを始める。`
        mock: なし
        expected: '`ワークスペース` は用語の下線で、`mdmark-term-avoided` の要素は 2 つ目の節の `ワーク` の 1 つだけ'
      - name: test_terms_rule_avoided_over_doc_alias
        case: 正常
        summary: 文書の別名と同じやめた言い方は、関連文書を出さずにやめた言い方にする
        condition: 用語 `ワークスペース`（`avoid` に `作業場`）と、`aliases` に `作業場` を持つ文書 `old`。`docId` は `guide`、本文に `作業場`
        mock: なし
        expected: '`作業場` が `mdmark-term-avoided` の要素で、ツールチップに見出し `関連文書` が無い'
      - name: test_terms_rule_avoided_when_glossary_off
        case: 正常
        summary: '`glossary` がオフならやめた言い方を照合しない'
        condition: '`test_terms_rule_avoided` と同じ入力に `<!-- features: -glossary -->`'
        mock: なし
        expected: '`mdmark-term-avoided` の要素が無い'
  - name: backlinksRule
