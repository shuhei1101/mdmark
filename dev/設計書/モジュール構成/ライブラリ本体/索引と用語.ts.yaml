  - name: embeddedHtmlMatches
    title: 埋め込んだ HTML の文字を照合する
    container: src/knowledge/matches.ts
    kind: 関数
    scope: internal
    summary: '`<!-- html -->` の範囲の `html` のコードブロックの文字を、描くときと同じ範囲で照合し、本文の位置を返す'
    description: 範囲の見つけ方は `buildEmbeddedHtml` と同じ。図の部品の custom element を除いた HTML を `sanitizeEmbedded` に通し、文字を受け取る関数で受けた文字（`termsFilter` と同じく、`a`・`code`・`pre`・`button`・見出しが直接持つ文字を除き、逃がした文字を戻す）のうち、`sanitizeEmbedded` の出力に残ったもの（要素ごと落ちる要素の文字を除く）を `findWords` で照合する。位置は、コードブロックの中身を `maskEmbeddedHtml` で伏せた本文へ、中身の頭から順に `alignText` で当てて戻す。伏せた文字はどの文字にも当たらないため、属性の値・中身ごと落ちる要素・照合しない要素の中の同じ綴りを取り違えない
    args:
      - name: options
        type: '{ body: string; tokens: Token[]; dictionary: Dictionary }'
        required: true
        description: 本文・本文のトークン・辞書
    returns:
      type: 'Array<{ word: string; offset: number; end: number }>'
      description: 一致した語と、本文の頭からの始まりと終わり
    callees:
      - '#functions[findWords]'
      - '#functions[maskEmbeddedHtml]'
      - '#functions[alignText]'
    unit_tests:
      - name: test_embedded_html_matches
        case: 正常
        summary: HTML の文字の用語の位置だけを返し、属性の値・落ちる要素・照合しない要素が直接持つ同じ綴りは返さず、その要素の中の入れ子の文字は返す
        condition: '`<!-- html -->` の範囲に、`<p>&amp;&lt;b&gt; の後ろのワークスペース</p>`・`<span title="ワークスペース">ワークスペース</span>`・`<script>ワークスペース</script>WS`・`<code>ワークスペース</code> とワークスペース`・`<a href="#">ワークスペース</a>`・`<a href="#"><span>ワークスペース</span></a>` の行'
        mock: なし
        expected: '`p` の文字・`span` の要素の文字・`script` の後ろの `WS`・`code` の後ろの文字・`a` の中の `span` の文字の 5 件だけで、本文の行を切り出した文字が一致した文字と同じ'
  - name: diagramTermMatches
    title: 図の部品の用語を照合する
    container: src/knowledge/matches.ts
    kind: 関数
    scope: internal
    summary: 図の部品の範囲の定義と、埋め込んだ HTML の中の custom element の定義の `{{語}}` のうち、意味のある用語の位置を返す
    description: 範囲の見つけ方は `buildDiagrams`（印の範囲の `json` のコードブロック）と `takeParts`（`PART_PATTERN`）と同じ。定義の JSON の文字列を戻して `{{語}}` を探し、語が `dictionary.terms` に完全に一致して意味が空でないものだけを返す（`lookup` と同じ。文書の別名は引かない）。位置は JSON のエスケープ（`\"`・`ア`）を数えて本文の位置へ戻す
    args:
      - name: options
        type: '{ body: string; tokens: Token[]; dictionary: Dictionary; html: boolean }'
        required: true
        description: 本文・本文のトークン・辞書・埋め込んだ HTML の機能がオンか
    returns:
      type: 'Array<{ word: string; offset: number; end: number }>'
      description: 一致した語と、本文の頭からの始まりと終わり
    unit_tests:
      - name: test_diagram_term_matches
        case: 正常
        summary: 定義の `{{語}}` の用語の位置を返し、用語でない語は返さない
        condition: '`<!-- flow -->` の定義の箱の `name` に JSON のエスケープの後ろの `{{ワークスペース}}` と `{{公開関数}}`、`<!-- html -->` の中の `<mdmark-flow>` の箱に `{{ワークスペース}}`'
        mock: なし
        expected: '`ワークスペース` の 2 件だけで、本文の行を切り出した文字が `ワークスペース`'
  - name: maskEmbeddedHtml
    title: 埋め込んだ HTML の照合しない範囲を伏せる
    container: src/knowledge/positions.ts
    kind: 関数
    scope: internal
    summary: 埋め込んだ HTML のうち、照合に渡らない範囲を、どの文字にも当たらない文字で伏せた同じ長さの文字列を返す
    description: 伏せるのは、タグ（`<`〜`>`。属性の値を含む）・コメント（`<!--`〜`-->`）と、中身ごと落ちる要素（sanitize-html の `nonTextTags` の `script`・`style`・`textarea`・`option`・`xmp` と、`button` を除く図の部品だけが持つ要素）の開きから閉じまでと、図の部品の custom element（`PART_PATTERN`）の定義ごとと、文字を照合しない要素（`TEXT_FILTER_SKIP_TAGS`）が直接持つ文字。`sanitizeEmbedded` の `textFilter` はその文字を直接持つ一番内側の要素で判定するため、タグを頭から読んで開いている要素の並びを持ち、一番内側が `TEXT_FILTER_SKIP_TAGS` の要素のときの文字だけを伏せる（`<a><span>語</span></a>` の `span` の文字は伏せない）。要素の一覧は `src/render/sanitize.ts` から同じ定数を export して使い、別に書かない。文字の位置は変えない
    args:
      - name: html
        type: string
        required: true
        description: コードブロックの中身の HTML
    returns:
      type: string
      description: 照合に渡らない範囲を伏せた、同じ長さの文字列
    unit_tests:
      - name: test_mask_embedded_html
        case: 正常
        summary: タグ・コメント・落ちる要素の中と、照合しない要素が直接持つ文字を伏せ、要素の文字と入れ子の文字を残す
        condition: '`<span title="語">語</span><!-- 語 --><script>語</script><code>語</code><a href="#">語</a><a href="#"><span>入</span></a><h2><em>見</em></h2>`'
        mock: なし
        expected: 長さが同じで、最初の `span` の要素の文字の `語` と、`a` の中の `span` の `入`、見出しの中の `em` の `見` だけが残る
  - name: findDocs
    title: 索引から文書を探す
    kind: 関数
    container: src/knowledge/find.ts
    usecase: 索引から文書を探す
    summary: 索引の文書を、題・別名・概要の部分一致、タグ、関係する文書で絞る
    description: 渡した条件を全て満たす文書を、索引の `docs` の並びで返す。条件を 1 つも渡さなければ全ての文書を返す。関係する文書は、参照の表の被参照から、その文書が参照している文書と、その文書を参照している文書を引く
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ index: MdmarkIndex; references?: MdmarkReferences; text?: string; tags?: string[]; relatedTo?: string }'
        required: true
        description: 索引・参照の表（`relatedTo` を渡すときに要る）・語・タグ・関係を引く文書の ID
    returns:
      type: MdmarkIndexDoc[]
      description: 当たった文書（索引の並び）。当たらなければ空
    process: |-
      1. `text` があれば、題・別名・概要のどれかに、大文字と小文字を区別せず含む文書に絞る
      2. `tags` があれば、全てのタグを持つ文書に絞る
      3. `relatedTo` があれば、参照の表の `backlinks[relatedTo]` にある文書と、`backlinks` に `relatedTo` を持つ文書に絞る（`relatedTo` 自身は含めない）
    unit_tests:
      - name: test_find_docs
        case: 正常
        summary: 題の一部で引く
        condition: '文書 `a`（題「文書 A」）・`b`（題「文書 B」）、`text: "文書 a"`'
        mock: なし
        expected: '`a` だけ'
      - name: test_find_docs_when_alias_or_description
        case: 正常
        summary: 別名と概要でも引く
        condition: '`a` の別名に `構成図`、`b` の概要に `構成`、`text: "構成"`'
        mock: なし
        expected: '`a`・`b` の順'
      - name: test_find_docs_when_tags
        case: 正常
        summary: 全てのタグを持つ文書に絞る
        condition: '`a` のタグ `設計`・`API`、`b` のタグ `設計`、`tags: ["設計", "API"]`'
        mock: なし
        expected: '`a` だけ'
      - name: test_find_docs_when_related_to
        case: 正常
        summary: 参照先と被参照を引く
        condition: '参照の表の `backlinks` が `{ a: ["c"], b: ["a"] }`、文書 `a`・`b`・`c`・`d`、`relatedTo: "a"`'
        mock: なし
        expected: '`b`・`c` の順で、`a`・`d` を含まない'
      - name: test_find_docs_when_no_condition
        case: 正常
        summary: 条件が無ければ全ての文書
        condition: 文書 2 つ、条件無し
        mock: なし
        expected: 2 件
      - name: test_find_docs_when_no_match
        case: 正常
        summary: 当たらなければ空
        condition: どの文書にも無い語
        mock: なし
        expected: 空
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#
    status: planned
    introduced:
      pr: 72
  - name: readGlossaryRows
    title: 用語集の表の行を読む
    container: src/render/syntax/glossary.ts
    summary: '`glossary` の印の範囲の中の表のトークンから、用語・意味・別名・やめた言い方の列を読んで行ごとに返す'
    description: 印の引数の `term=`・`meaning=`・`aliases=`・`avoid=` で列の見出しの文字を指す（`aliases=`・`avoid=` は任意）。別名とやめた言い方のセルは「、」と「,」で区切り、前後の空白を落とし、空のものを除く。必須の引数が無いときと、表に無い列名のときはその表の行を返さず、最初の誤りを書き方の警告の本文にする。用語か意味が空の行は飛ばす
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ args: MarkArgs; tokens: Token[]; docId: string }'
        required: true
        description: 印の引数・範囲の中のトークン・表を持つ文書の `id`（索引を渡さないときは空文字）
    returns:
      type: '{ rows: GlossaryRow[]; warning?: string }'
      description: 行ごとの用語・行番号・やめた言い方と、書き方の警告の本文
    unit_tests:
      - name: test_read_glossary_rows_with_avoid
        case: 正常
        summary: やめた言い方の列を「、」「,」で区切って読み、用語の別名には入れない
        condition: '`term=用語 meaning=意味 avoid=やめた言い方`、行 `ワークスペース | 作業の置き場所 | 作業場、ワーク場, `'
        mock: なし
        expected: '`entry.avoid` が `["作業場", "ワーク場"]`、`entry.aliases` が `[]`、`warning` が無い'
      - name: test_read_glossary_rows_without_avoid
        case: 正常
        summary: '`avoid=` が無ければやめた言い方を空にする'
        condition: '`term=用語 aliases=別名 meaning=意味`、行 `印 | マーク | HTML コメントで書く指定`'
        mock: なし
        expected: '`entry.avoid` が `[]`、`entry` が `readGlossaryTable` の用語と等しい'
      - name: test_read_glossary_rows_when_unknown_avoid_column
        case: 異常
        summary: '`avoid=` が表に無い列名なら行を返さず警告を返す'
        condition: '`term=用語 meaning=意味 avoid=旧称`、列が `用語`・`意味`'
        mock: なし
        expected: '`rows` が空、`warning` に `avoid=` と `旧称` と列の並び `用語`・`意味`'
