  - name: renderTermTip
    title: 用語のツールチップの HTML を返す
    container: src/parts/term-tip.ts
    kind: 関数
    scope: internal
    summary: 語・`id`・意味・関連文書から、部品設計『用語のツールチップ』の語とツールチップの組の HTML（`mdmark-term-wrap` の中に語と、その直後のツールチップ）を返す
    description: 意味だけのときは `role="tooltip"`、関連文書があるときは `role="group"` にする。区分には意味だけのときも見出し（`用語`・`関連文書`）を付ける（モック `dev/mock/components/term-tooltip/` のとおり）。`hidden` は付けず、開閉は CSS（`:hover`・`:focus-within`）と `attachTermTips` が付ける class が決める。`replacement` があるときは `meaning`・`docs` を使わず、語に class `mdmark-term mdmark-term-avoided` を付け、`role="tooltip"` のツールチップに見出し `代わりの用語` の区分だけを置いて `mdmark-term-tip-replacement`（代わりの用語の語）と `mdmark-term-tip-meaning`（意味）を出し、語の `aria-describedby` でツールチップを指す。`below` が `true` のときは `mdmark-term-wrap` に `is-below` を付ける（ストーリーが下に開いた見た目を出すため。`render` は渡さない）。文字はエスケープする
    args:
      - name: props
        type: '{ text: string; id: string; meaning?: string; docs?: { title: string; href: string; description?: string }[]; replacement?: { term: string; meaning: string }; below?: boolean }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: 語とツールチップの組の HTML
    unit_tests:
      - name: test_render_term_tip
        case: 正常
        summary: 部品設計の状態ごとに HTML を返す
        condition: 部品設計『用語のツールチップ』の `TermOnly`・`DocsOnly`・`Both` の引数
        mock: なし
        expected: '`role` が状態のとおりで、`TermOnly` は見出し `用語` だけ、`DocsOnly` は `関連文書` だけ、`Both` は `用語` → `関連文書` の順。どの状態も `hidden` を持たない'
      - name: test_render_term_tip_escapes
        case: 正常
        summary: 意味と題をエスケープする
        condition: 意味に `<script>`
        mock: なし
        expected: '`&lt;script&gt;` になる'
      - name: test_render_term_tip_avoided
        case: 正常
        summary: '`replacement` を渡すと、やめた言い方のマーカーと代わりの用語のツールチップを返す'
