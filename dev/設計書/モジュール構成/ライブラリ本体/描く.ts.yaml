        condition: '`exports.default = () => "</script>" // 末尾`、`index` が 2'
        mock: なし
        expected: 戻りを `new Function` なしに評価できる形で、`HTML_SCRIPTS_REGISTRY` の鍵と `2` を含み、`</script` を含まない
