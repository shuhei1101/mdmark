title: "ライブラリ本体 / 描く"
lead: 利用側のページの要素に文書を描き、再描画と片付けを受け持つ処理。記法の操作を付け、文書のマーカーにある外部ライブラリと拡張のモジュールを読み込んでマーカーの場所に描かせ、色分けの対象のコードブロックを色分けし、印刷の前後で折り畳みと記法を開いて戻す。ブラウザでだけ動く（色分けの HTML を行に分ける `src/highlight-lines.ts` だけは DOM を使用せず、部品の描画のインターフェースも使用する）。
directory: |-
  ```tree
  src/
  ├── mount.ts            # 公開関数 mount と、描いた要素の記録
  ├── libraries.ts        # マーカーの場所に外部ライブラリのモジュールを描かせる loadLibraries と、埋めたモジュールの記録
  ├── highlight.ts        # 色分けのライブラリを読み込んでコードブロックを色分けする highlightCodeBlocks と、埋めたモジュールの記録
  ├── highlight-lines.ts  # 色分けした HTML を行に分ける splitHighlightedLines・highlightLines（DOM を使用しない）
  ├── html-scripts.ts     # 埋め込んだ HTML の範囲の ts・js を変換して動かす runHtmlScripts と、変換のライブラリの読み込み・埋めた関数の記録
  ├── inline-icons.ts     # まとめていない名前のアイコンを jsDelivr から読み込む loadInlineIcons
  └── print.ts            # 印刷の前後で折り畳みを開いて戻す attachPrint
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 文書を要素に描く
        class 描いた要素の操作
        class マーカーの場所に外部ライブラリを描かせる
        class 色分けの対象を色分けする
        class 色分けした行を作る
        class 色分けしたHTMLを行に分ける
        class 印刷の前後で折り畳みを開く
        文書を要素に描く --> 描いた要素の操作 : 返却する
        文書を要素に描く --> マーカーの場所に外部ライブラリを描かせる : 描くたびに呼ぶ
        文書を要素に描く --> 色分けの対象を色分けする : 描くたびに呼ぶ
        色分けの対象を色分けする --> 色分けした行を作る : 行に分けたコードブロック
        色分けした行を作る --> 色分けしたHTMLを行に分ける
        文書を要素に描く --> 印刷の前後で折り畳みを開く : 1 回だけ付ける
      ```
data_models:
  - name: MountOptions
    title: 描く設定
    container: src/mount.ts
    usecase: 利用側のページが文書を描く
    role: DTO
    summary: '`mount` の第 2 引数（公開の型）'
    properties:
      - name: markdown
        type: string
        description: 描く Markdown
      - name: config
        type: MdmarkConfig | undefined
        description: 利用側の設定。省いたキーには既定を適用する
      - name: index
        type: MdmarkIndex | undefined
        description: 索引。省くと索引の用語と関連文書を出さない
      - name: docId
        type: string | undefined
        description: 描く文書の索引の `id`。索引に無い `id` は省いたのと同じ
      - name: references
        type: MdmarkReferences | undefined
        description: '`collectReferences` の戻り値。省くと、関連文書の一覧は索引の `related` だけから出し、他の文書の用語集の表の用語を照合しない'
      - name: diffSource
        type: DiffSource | undefined
        description: 差分の取り出し元。指定すると描いた文書に差分を開く UI を付ける。指定するときは `docId` も要る
      - name: commentStore
        type: MdmarkCommentStore | undefined
        description: コメントの読み込みと保存の関数。`comments` がオンのときだけ使用する。指定するときは `docId` も要る
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: エイリアス（`buildAliases` の戻り値の `aliases`）。`glossary` がオンのとき、名前と別名に下線と種類ごとのツールチップを付ける。使用できないエイリアス（`env` を含む）は照合せず、通知ブロックも出さない
      - name: diffMode
        type: DiffMode | undefined
        description: 差分の出し方。`button`（既定）・`open`・`blocks`。`diffSource` を指定しないときは使用しない。知らない値は `button` にする
      - name: baseMarkdown
        type: string | null | undefined
        description: 比較元の Markdown。文字列なら、本文の中で比較元から変えたブロックを `diffMode` の `blocks` と同じ色で塗り分ける。`null` は省いたのと同じ
      - name: onColumnsChange
        type: '((event: MdmarkColumnsChange) => void) | undefined'
        description: '`+columns` の表で列の表示を切り替えるたびに呼ぶ関数'
  - name: MountHandle
    title: 描いた要素の操作
    container: src/mount.ts
    usecase: 利用側のページが文書を描く
    summary: '`mount` の戻り値（公開の型）'
    properties:
      - name: update
        type: '(markdown: string, options?: { baseMarkdown?: string | null }) => void'
        description: 本文だけを再描画する。設定は `mount` に指定したものを使用する。`options.baseMarkdown` で比較元を差し替え（`null` で削除し）、省くと前の比較元のまま描く。`destroy` の後は何もしない
      - name: reloadComments
        type: () => Promise<void>
        description: 本文を再描画せずにコメントを再読み込みし、マーカーをもう一度付ける。コメントを付けていないときと `destroy` の後は `load` を呼ばずに解決する
      - name: focusComment
        type: '(id: string) => void'
        description: その `id` のコメントのマーカーを画面に入れてフォーカスを移し、強調する。マーカーが無い `id` と `destroy` の後は何もしない
      - name: destroy
        type: () => void
        description: 要素の中を空にして class `mdmark` を削除し、印刷の受け取りを解除する。2 回目以降は何もしない
  - name: MdmarkColumnsChange
    title: 列の表示の通知
    container: src/mount.ts
    usecase: 利用側のページが文書を描く
    role: DTO
    summary: '`onColumnsChange` に指定する値（公開の型）'
    properties:
      - name: tableIndex
        type: number
        description: 本文の中の `+columns` の表の出現順の番号（0 から。削除したブロックの中の表は数えない）
      - name: hidden
        type: string[]
        description: 隠している列の見出しの文字（`textContent` の前後の空白を除いたもの）を表の列の順に並べた新しい配列
    status: planned
    introduced:
      pr: 280
  - name: LibraryModule
    title: 外部ライブラリのモジュール
    container: src/libraries.ts
    usecase: 文書が使用する外部ライブラリだけを読み込む
    summary: '`import()` で読み込んだモジュールが名前付きで export する構造'
    properties:
      - name: draw
        type: '(slot: HTMLElement, args: string[]) => void | Promise<void>'
        description: マーカーの場所の要素と、マーカーの引数を受けて描く
  - name: EmbeddedSyntax
    title: 埋めた色分けのモジュール
    container: src/highlight.ts
    summary: 書き出した HTML の起動の処理が `setEmbeddedSyntax` で指定する、同じスクリプトにまとめた色分けのモジュール
    properties:
      - name: core
        type: '{ default?: unknown } | undefined'
        description: 本体（`core.min.js`）のモジュール。埋めなかったときは持たない
      - name: languages
        type: 'Record<string, { default?: unknown }>'
        description: 言語のモジュール名からモジュールを参照する表。埋めなかった言語は持たない
    status: planned
    introduced:
      pr: 97
function_types:
  - name: ImportModule
    title: モジュールを読み込む
    container: src/libraries.ts
    summary: URL のモジュールを読み込む関数。既定は `(url) => import(url)` で、単体テストで差し替える
    args:
      - name: url
        type: string
        description: 解決済みの URL
    returns:
      type: Promise<LibraryModule>
      description: 読み込んだモジュール
  - name: SyntaxImport
    title: 色分けのモジュールを読み込む
    container: src/highlight.ts
    summary: URL の色分けのモジュールを読み込む関数。既定は `(url) => import(url)` で、単体テストで差し替える
    args:
      - name: url
        type: string
        description: 解決済みの URL
    returns:
      type: 'Promise<{ default?: unknown }>'
      description: 読み込んだモジュール。本体の `default` は `HLJSApi`、言語の `default` は `LanguageFn`
    status: planned
    introduced:
      pr: 97
constants:
  - name: mounted
    title: 描いた要素の記録
    container: src/mount.ts
    summary: 描いた要素からその `MountHandle` を参照する。同じ要素への `mount` が前の描画を片付けるのに使用する
    value: new WeakMap<HTMLElement, MountHandle>()
  - name: ROOT_CLASS
    title: 描く先の class
    container: src/mount.ts
    summary: 描く先の要素に付ける class。本文の CSS はこの class の下に該当する
    value: '"mdmark"'
  - name: DRAWN_ATTRIBUTE
    title: 描き終えたマーカー
    container: src/libraries.ts
    summary: モジュールが描き終えたマーカーの場所に付ける属性。読み込み中の破線と高さを削除するのに使用する
    value: '"data-mdmark-drawn"'
  - name: embeddedSyntax
    title: 埋めた色分けのモジュールの記録
    container: src/highlight.ts
    summary: '`setEmbeddedSyntax` が入れる `EmbeddedSyntax`。無ければ `syntax.url` から読み込む。モジュールの中の `let` で持ち、ページの中の全ての `mount` に有効になる'
    value: undefined
    status: planned
    introduced:
      pr: 97
  - name: embeddedLibraries
    title: 埋めた外部ライブラリの記録
    container: src/libraries.ts
    summary: '`setEmbeddedLibraries` が入れる、マーカーの名前から外部ライブラリのモジュールを返却する関数を参照する表。無ければ対応表の URL から読み込む。モジュールの中の `let` で持ち、ページの中の全ての `mount` に有効になる'
    value: undefined
    status: planned
    introduced:
      pr: 296
  - name: COLOR_THEME_ATTRIBUTE
    title: テーマの属性
    container: src/mount.ts
    summary: 描く先の要素に、既定を適用した設定の `colorTheme` を値にして付ける属性。`src/index.css` は `:root:has()` でこの属性の値を確認して、テーマの配色の値を `:root` に適用する
    value: '"data-mdmark-color-theme"'
    reason: '`:root` に当て、利用側が `:root` に記載した上書きと `document.body` の直下の部品にも同じ配色を届ける。明暗の class（`mdmark-theme-*`）と名前を分けるため class でなく属性にする'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[選んだテーマ]
    status: planned
    introduced:
      pr: 181
  - name: COLOR_SCHEME_CLASSES
    title: 明暗の class
    container: src/mount.ts
    summary: 描く先の要素に付ける明暗の class。`src/index.css` の `mdmark-theme-light`・`mdmark-theme-dark` と同じ名前
    value: '{ light: "mdmark-theme-light", dark: "mdmark-theme-dark" } as const'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[明暗の当て方]
    status: planned
  - name: embeddedHtmlScripts
    title: 埋めた範囲の関数
    container: src/html-scripts.ts
    summary: 書き出した HTML の起動の処理が入れる、範囲のコードの文字から既定のエクスポートを返却する関数を参照する表。既定は `undefined`
    value: undefined
    status: planned
    introduced:
      pr: 303
  - name: HTML_SCRIPTS_REGISTRY
    title: 範囲の関数の受け取りの鍵
    container: src/html-scripts.ts
    summary: '`script` 要素が包んだ関数を指定する、`window` の鍵の名前。動かす間だけ配置し、終えたら削除する'
    value: '"__mdmarkHtmlScript"'
    status: planned
    introduced:
      pr: 303
  - name: TRANSPILE_OPTIONS
    title: 範囲のコードの変換の設定
    container: src/html-scripts.ts
    summary: '言語ごとの `transform` の設定。どちらも `sourceType: "module"`・`babelrc: false`・`configFile: false`'
    value: '{ ts: { filename: "range.ts", presets: ["typescript"], plugins: ["transform-modules-commonjs"] }, js: { filename: "range.js", plugins: ["transform-modules-commonjs"] } }'
    refs:
      - dev/設計書/外部ライブラリ/babel-standalone#catalogs[API].entries[transform]
    status: planned
    introduced:
      pr: 303
  - name: LUCIDE_VERSION
    title: まとめた lucide のバージョン
    container: src/inline-icons.ts
    value: ビルドと単体テストの `define` で `package.json` の `lucide` のバージョンを埋める
    summary: まとめていないアイコンを読み込む URL のバージョン
functions:
  - name: mount
    title: 文書を要素に描く
    container: src/mount.ts
    kind: 関数
    scope: public
    summary: 公開関数。要素の中に文書を描き、記法の操作を付け、外部ライブラリと拡張のマーカーを描かせ、印刷の受け取りを付けて `MountHandle` を返却する
    side_effects: '`el` の中身と class を書き換え、`window` に `beforeprint`・`afterprint` の受け取りを付ける。`mounted` に `el` を記録する。`onColumnsChange` を呼ぶ'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先の要素
      - name: opts
        type: MountOptions
        required: true
        description: Markdown・設定・索引・描く文書の `id`・参照の表
    args_example: |-
      ```ts
      const handle = mount(document.querySelector("#doc"), { markdown: "# 見出し", config });
      handle.update("# 次の見出し");
      handle.destroy();
      ```
    returns:
      type: MountHandle
      description: 再描画と片付けの関数
    process: |-
      1. `diffSource` か `commentStore` を指定して `docId` が無ければ `TypeError` を投げる。`commentStore` を `checkCommentStore(commentStore, "commentStore")` で確認する（コメントの読み込みと保存の関数を検める）。`baseMarkdown` を `checkBaseMarkdown` で確認し、`onColumnsChange` を指定して関数でなければ `onColumnsChange` を含む `TypeError` を投げる。比較元（`baseMarkdown` が文字列ならその値、それ以外は無し）を記録する。`mounted` に `el` があれば、その `destroy` を呼ぶ。差分の出し方を `normalizeDiffMode(opts.diffMode)` で決める
      2. 設定に既定を適用する（設定に既定を適用する）
      3. 描く世代を 0、片付けたマーカーを `false`、操作を削除する関数・右側の目次を削除する関数・先頭へ戻るボタンを削除する関数を無しにし、右側の目次の状態（`SideTocState`）を `{ open: false, pinned: false }` で作る
      4. 文書を描く。描くたびに次の処理をする
         - 世代を 1 進め、前の操作を削除する関数・右側の目次を削除する関数・先頭へ戻るボタンを削除する関数があれば呼ぶ
         - 本文の HTML と機能のオン・オフを得て（文書を描く。`opts` の `index`・`docId`・`references`・`aliases` を指定する）、戻りの `page` を既定を適用した設定に重ねてこの描画の設定にする（ページの設定を重ねる）。`el` の中を本文の HTML に置き換え、`el` に `ROOT_CLASS` を付け、`COLOR_THEME_ATTRIBUTE` にこの描画の設定の `colorTheme` を付ける。`COLOR_SCHEME_CLASSES` の 2 つの class を削除してから、この描画の設定の `colorScheme` が `light`・`dark` ならその class を付ける
         - 機能のオン・オフを記録する
         - 機能の `side-toc` がオンなら右側の目次を付け（右側の目次を付ける。この描画の設定の `sideToc.mode`・機能の `sections`・手順 3 の状態を指定する。前の描画と `sideToc.mode` が違うときは、指定する前に手順 3 の状態を `{ open: false, pinned: false }` に戻す）、削除する関数を記録する。以降の記法の操作・外部ライブラリ・色分け・部品・差分に描いた要素として指定するのは、戻りの `content`（本文の列。右側の目次を付けないときは `el`）
         - 比較元があって本文と違うときは、本文の HTML を `el` に配置する前に、本文と比較元の Markdown を同じ引数で描いた `template` の中身を `colorDiffBlocks` に経由し、本文の中身を `el` に配置する（下の `blocks` の色分けと同じ）
         - 機能の `comments` がオンで `commentStore` と `docId` を指定し、右側の目次が本文の列に包んでいない（戻りの `content` が `el`）ときは、`el` の子を `div.mdmark-content` に包み、以降の描いた要素をその本文の列にする。削除する関数は、包む前の子の並びへ戻す（余白の列を本文の列の右に配置するため。インターフェース定義『文書を描く』の制約「余白のマーカー」）
         - 記法の操作を付け（記法の操作を付ける。ツールチップを出す場所は、既定を適用した設定の `tooltips.placement` と `tooltips.diagramPlacement` を、表のピン止めの動きは `table.pin` を指定する。`onColumnsChange` を指定したときはそれも指定する）、削除する関数を記録する
         - マーカーの場所に外部ライブラリと拡張を描かせる（マーカーの場所に外部ライブラリを描かせる）。今の世代と片付けたマーカーを確認する `isCurrent` を指定し、戻りの Promise は待たない
         - 色分けの対象を色分けする（色分けの対象を色分けする）。既定を適用した設定の `syntax.url`・同じ `isCurrent`・`mount` ごとに 1 つ作るモジュールの記録（`Map`）を指定し、戻りの Promise は待たない
         - 機能の `mermaid` がオンなら、前の mermaid の図を削除する関数を呼んでから mermaid の図を付ける（mermaid の図を付ける。描いた要素・`el`・この描画の設定・`mount` の通し番号・同じ `isCurrent`・`mount` ごとに 1 つ作る mermaid のモジュールの記録（`Map`）・既定を適用した設定の `tooltips.diagramPlacement` を指定する）。戻りの `ready` は待たず、`detach` を記録する。マーカーの場所に外部ライブラリを描かせる処理の後に呼ぶ（読み込み中のブロックをマーカーの場所として取得させない）
         - 機能の `html-scripts` がオンなら範囲のスクリプトを動かす（範囲のスクリプトを動かす。既定を適用した設定の `htmlScripts.url`・同じ `isCurrent`・`mount` ごとに 1 つ作る読み込みの記録を指定する）。戻りの Promise は待たず、解決した関数を範囲の `destroy` として記録し、再描画する前・`destroy`・同じ要素への 2 回目の `mount` で呼ぶ（解決する前に再描画したときは、解決したときに呼ぶ）
         - ビューとコメントの部品を付け（描いた文書に部品を付ける。機能のオン・オフ・`commentStore`・`docId`・`isCurrent` と、`mount` ごとに 1 つ作る `warned` を指定する）、戻りの `PartsHandle` を記録する。前の `PartsHandle` の `detach` は再描画する前に呼ぶ
         - `diffSource` を指定し、差分の出し方が `button` か `open` なら、前の差分を削除する関数を呼んでから差分を付け（差分を付ける。`open` には差分の出し方が `open` かを指定する。右側の目次を付けたときは `hideWith` にその要素を指定する。`renderHtml` は、範囲の HTML を `html` のコードブロックに入れ `<!-- html -->` で囲んだ Markdown を、今の設定・`index`・`docId`・`references`・`aliases` で文書を描く処理に経由し、得た埋め込んだ HTML の範囲の中身と、配置した要素にその描画の機能のオン・オフと操作できる部品の定義、今の設定の `tooltips.placement` で記法の操作を付ける `attach` を返却する関数（`DiffHtmlRenderer`）。文書と同じく図の部品を図の HTML にし、許可の検査とヒントを当て、図の拡大・ツールチップ・操作できる部品も文書と同じく動かす。`html` の機能がオフのときは空の文字と何もしない `attach` を返却する）、削除する関数を記録する
         - `diffSource` を指定し、差分の出し方が `blocks` で、比較元が無く、色分けせずに描いたときは、比べる 2 つの本文を取り出す（`loadDiffPair`。戻りの Promise は待たない）。解決したときに世代が変わっているか片付けていれば何もしない。`pair` で前と後が違えば、後の Markdown をこの手順 4 で再描画する。そのときは本文の HTML を `el` に配置する前に、後と前の Markdown を同じ引数で描いた `template` の中身を `colorDiffBlocks` に経由し（`segmenter` は `Intl.Segmenter` があれば `ja`・`word` で作る）、後の中身を `el` に配置する。色分けして描いたときは取り出し元をもう一度呼ばない。`single` と同じ本文のときは描いたまま残す。`failed` なら本文の列の先頭に `renderNotice({ name: docId, source: "diff-blocks" })` の通知ブロックを配置する
         - 機能の `back-to-top` がオンなら先頭へ戻るボタンを付け（先頭へ戻るボタンを付ける。`el` と、ここまでで決まった本文の列を指定する）、削除する関数を記録する。描くたびにもう一度付け、スクロールする場所を `update` の後にももう一度決める
      5. 印刷の受け取りを付ける（印刷の前後で折り畳みと記法を開く）。`isEnabled` は記録した機能のオン・オフの `print` を返却する
      6. `update` は、片付けた後なら何もしない。`options.baseMarkdown` を指定したときは `checkBaseMarkdown` で確認し（投げたら再描画せずにそのまま投げる）、比較元を文字列ならその値、`null` なら無しに差し替える。手順 4 で再描画する（右側の目次の状態は保つ。`index`・`docId`・`references`・`aliases` は最初に指定したもののまま）
      7. `reloadComments` は、片付けた後なら解決した Promise を返却し、そうでなければ記録した `PartsHandle` の `reloadComments()` を返却する。`focusComment(id)` は、片付けた後なら何もせず、そうでなければ記録した `PartsHandle` の `focusComment(id)` を呼ぶ
      8. `destroy` は、片付けた後なら何もせず、そうでなければ片付けたマーカーを `true` にし、操作・差分・ビューとコメントの部品・右側の目次・先頭へ戻るボタン・mermaid の図・印刷の受け取りを解除し、`el` の中を空にして `ROOT_CLASS`・`COLOR_THEME_ATTRIBUTE`・`COLOR_SCHEME_CLASSES` の class を削除し、`mounted` の `el` が自分なら削除する
      9. `mounted` に `el` と戻り値を記録して返却する
