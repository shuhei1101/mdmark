        condition: '`config` に `{ colorTheme: "theme-slate" }` を渡して `# A` を描き、`update("# B")` の後に `destroy`'
        mock: なし
        expected: 描いた後と `update` の後の `el` の `data-mdmark-color-theme` が `theme-slate`。`destroy` の後は属性を持たない
      - name: test_mount_when_color_theme_unknown
        case: 正常
        summary: 知らないテーマの名前と省いたときは dev-swiss を付ける
        condition: '`config` に `{ colorTheme: "sepia" }` を渡して描く要素と、`config` を省いて描く要素'
        mock: なし
        expected: どちらの `el` も `data-mdmark-color-theme` が `dev-swiss`。例外を投げない
      - name: test_mount_when_diff_mode_open
        case: 正常
        summary: open では描いた時点で差分を開き、update の後も開いたままにする
        condition: '`# 見出し` と `docId: "guide"`・`diffSource`・`diffMode: "open"` を渡し、後で `update("# 次")`'
        mock: 取り出し元は `r2`・`r1` を返し、呼ばれた引数を控える関数
        expected: 描いた直後に `revisions` が 1 回呼ばれ、`mdmark-diff-toggle` が `aria-expanded="true"`。`update` の後も `aria-expanded="true"` で `revisions` が 2 回呼ばれている
      - name: test_mount_when_diff_blocks
        case: 正常
        summary: blocks ではボタンを置かず、取り出した 2 つの本文で色分けして描き直す
        condition: '`diffMode: "blocks"`。取り出し元は `r2`（段落を 1 つ足した全文。`opts.markdown` と同じ）と `r1` を返す。取り出し元の待ちを終えた後に確かめる'
        mock: 取り出し元は呼ばれた引数を控える関数
        expected: '`mdmark-diff-toggle` が無い。`revisions` が 1 回、`content` が `r1`・`r2` で 1 回ずつ呼ばれ、足した段落が `div.mdmark-diff-block[data-kind="add"]` に包まれる。表の操作のボタンなど記法の操作が色分けした本文に付いている'
