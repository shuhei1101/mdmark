        expected: '例外を投げず、本文の列の最初の子が `renderNotice({ name: "guide", source: "diff-blocks" })` の知らせの枠で、`mdmark-diff-block` が無い'
  - name: loadLibraries
    title: 印の場所に外部ライブラリを描かせる
    container: src/libraries.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: 要素の中の印の場所ごとに、登録した拡張なら引数を検査して `load` で、対応表なら URL でモジュールを読んで `draw` を呼ぶ。引数が合わない場所は書き方の警告に、読めない・描けない・検査が失敗する場所は知らせの枠に替える
    description: '同じ名前のモジュールは 1 回の呼び出しの中で 1 回だけ読む（2 回目からは同じ Promise を待つ）。拡張は対応表より優先し、`draw` に `parseMarkArgs` の値を渡す（対応表のモジュールには今のまま引数の配列を渡す）。拡張の知らせの枠は `source: "extension"` で、名前は拡張の `name`。書き方の警告は `renderSyntaxWarning` に印の文字・拡張の名前・`validateMarkArgs` の項目を渡す。印の場所が無ければ何も読まない。読み込みと `draw` に時間の上限は置かない'
    side_effects: 印の場所の要素の属性を書き換え、失敗した場所を知らせの枠に置き換える。失敗を `console.error` に出す
    args:
      - name: options
        type: '{ root: HTMLElement; libraries: Record<string, LibraryEntry>; isCurrent: () => boolean; importModule?: ImportModule }'
        required: true
        description: '`root` は描いた要素、`libraries` は既定を当てた対応表、`isCurrent` は描いた文書がまだ今のものか、`importModule` はモジュールを読む関数（既定 `(url) => import(url)`）'
    returns:
      type: Promise<void>
      description: 全ての印の場所を描き終えるか知らせの枠に替えたら解決する。失敗しても拒否しない
    process: |-
      1. `root` の中の `[data-mdmark-slot]` の要素を全て拾う
      2. 拾った要素ごとに並行して次を行う
         - `data-mdmark-slot` の名前で対応表の行を引く。行が無い（文書に生の HTML で書かれた）要素は取り除き、ほかは行わない
         - 行の `url` を `document.baseURI` を基準に解決する
         - 名前ごとに 1 回だけモジュールを読む（モジュールを読む）
         - `data-mdmark-args` を空白で区切った引数で、モジュールの `draw` を呼んで待つ
         - 待った後に `isCurrent()` が `false` なら何もしない
         - 描けたら、要素から `role` を外し `DRAWN_ATTRIBUTE` を付ける
         - 読めない・`draw` が無い・`draw` が例外を投げたときは、要素を知らせの枠に置き換える（知らせの枠を描く）。題は行の `figure` で分ける。`draw` が要素を `root` から取り除いていたら置き換えない
           - `[error]` 外部ライブラリを読み込めない（印の名前・URL・元のエラーを `console.error` の引数に並べる）
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderNotice]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSyntaxWarning]
      - dev/設計書/モジュール構成/ライブラリ本体/拡張.ts#functions[extensionFor]
      - dev/設計書/モジュール構成/ライブラリ本体/拡張.ts#functions[validateMarkArgs]
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[parseMarkArgs]
    unit_tests:
      - name: test_load_libraries
        case: 正常
        summary: 印の場所ごとに `draw` を呼び、描けた場所の読み込み中の印を外す
        condition: '`renderEmbed` の要素が `test-lib`（引数 `a b`）と `test-lib`（引数無し）の 2 つ。対応表は `{ "test-lib": { url: "/fixtures/test-lib.js", figure: true } }`'
        mock: '`importModule` が `draw` を持つモジュールを返す'
        expected: '`importModule` が 1 回、`location.origin` + `/fixtures/test-lib.js` で呼ばれる。`draw` が `(1 つ目の要素, ["a", "b"])` と `(2 つ目の要素, [])` で呼ばれる。2 つの要素が `role` を持たず `data-mdmark-drawn` を持つ'
      - name: test_load_libraries_when_no_slot
        case: 正常
        summary: 印の場所が無ければ何も読まない
        condition: 段落だけの要素
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれない'
      - name: test_load_libraries_when_unknown_slot
        case: 正常
        summary: 対応表に無い名前の印の場所を取り除き、何も読まない
        condition: '`<div class="mdmark-embed" data-mdmark-slot="zzz">` の要素 1 つ。対応表は空'
        mock: '`importModule` と `console.error` を見張る'
        expected: 要素が無くなり、`importModule` と `console.error` が呼ばれない。戻りの Promise は解決する
      - name: test_load_libraries_when_import_fails
        case: 正常
        summary: 読めない印の場所を知らせの枠に替え、エラーを出す
        condition: '`test-lib` の印の場所 1 つ。対応表の `figure` は `true`'
        mock: '`importModule` が `new Error("404")` で拒否する。`console.error` を見張る'
        expected: '要素が `renderNotice({ name: "test-lib", figure: true })` の HTML に替わる。`console.error` が 1 回、引数に `test-lib`・URL・`Error("404")` を含めて呼ばれる。戻りの Promise は解決する'
      - name: test_load_libraries_when_draw_throws
        case: 正常
        summary: '`draw` が例外を投げた印の場所を知らせの枠に替える'
        condition: '`test-lib` の印の場所 1 つ。対応表の `figure` は `false`'
        mock: '`importModule` が、例外を投げる `draw` を持つモジュールを返す'
        expected: '要素が `renderNotice({ name: "test-lib", figure: false })` の HTML に替わる'
      - name: test_load_libraries_when_draw_missing
        case: 正常
        summary: '`draw` を export しないモジュールの印の場所を知らせの枠に替える'
        condition: '`test-lib` の印の場所 1 つ'
        mock: '`importModule` が空のモジュールを返す'
        expected: 要素が知らせの枠に替わり、`console.error` が 1 回呼ばれる
      - name: test_load_libraries_when_stale
        case: 正常
        summary: 描き直した後に読み終えた古い印の場所には手を付けない
        condition: '`isCurrent` が `false` を返す。読み込みは拒否する'
        mock: '`importModule` が拒否する。`console.error` を見張る'
        expected: 要素が読み込み中の枠のままで、`console.error` が呼ばれない
      - name: test_load_libraries_when_draw_removes_slot
        case: 正常
        summary: '`draw` が印の場所を取り除いてから例外を投げても、知らせの枠に替えず拒否しない'
        condition: '`test-lib` の印の場所 1 つ'
        mock: '`importModule` が、引数の要素を `remove()` してから例外を投げる `draw` を持つモジュールを返す。`console.error` を見張る'
        expected: 戻りの Promise が解決し、`root` の中に知らせの枠が無い。`console.error` が 1 回呼ばれる
      - name: test_load_libraries_when_extension
        case: 正常
        summary: 拡張の印を load で読み、読み分けた引数で draw を呼ぶ
        condition: '`greet` を登録し、`data-mdmark-slot="greet" data-mdmark-args="world lang=ja"` の場所を 2 つ'
        mock: '`load` は `draw` を控えるモジュールを返す関数（呼ばれた回数を数える）'
        expected: '`load` が 1 回、`draw` が 2 回で引数が `{ args: ["world"], keys: { lang: "ja" } }`'
      - name: test_load_libraries_when_extension_args_invalid
        case: 異常
        summary: 引数が schema に合わない場所は書き方の警告にし、load しない
        condition: 引数 1 つを英小文字で許す schema の `greet` と `World 2` の場所
        mock: '`load` は呼ばれた回数を数える関数'
        expected: 場所が `mdmark-syntax-warning` になり、`load` が 0 回
      - name: test_load_libraries_when_extension_fails
        case: 異常
        summary: load の拒否と validate の拒否は拡張の知らせの枠にする
        condition: '`load` が拒否される拡張と、`validate` が拒否される拡張の場所'
        mock: '`console.error` を控える関数で包む'
        expected: どちらも `mdmark-notice` で本文が `表示に使う拡張（…）` で始まり、`console.error` に拡張の名前と元のエラー
  - name: attachPrint
    title: 印刷の前後で折り畳みと記法を開く
    container: src/print.ts
    kind: 関数
    scope: internal
    summary: '`beforeprint` で要素の中の閉じた `details`・閉じた節・行の詳細・ファイルツリーの閉じたフォルダを開き、タブの全ての中身を出し、`afterprint` で開いたものだけを戻す受け取りを `window` に付け、外す関数を返す'
    side_effects: '`window` に受け取りを付ける。`details` の `open` を書き換える'
    args:
      - name: options
        type: '{ root: HTMLElement; isEnabled: () => boolean }'
        required: true
        description: '`root` は描いた要素、`isEnabled` は印刷の機能がオンか（印刷のたびに読む）'
    returns:
      type: () => void
      description: 受け取りを外す関数
    process: |-
      1. `beforeprint` を受けたとき、`isEnabled()` が `true` なら、次を行い、変えたものを控える
         - `open` を持たない `details` を開く
         - `hidden` を持つ `mdmark-section-body`・`mdmark-row-detail`・`div.mdmark-tree` の入れ子の `ul` の `hidden` を外す
         - `role="tabpanel"` の `hidden` を外し、`mdmark-tabs` に `data-printing` を付ける（印刷の CSS がタブの並びを隠し、タブ名の題を出す）
      2. `afterprint` を受けたとき、控えたものを元に戻し（節とツリーの入れ子の `ul` は `hidden="until-found"`、行の詳細とタブの中身は `hidden`、`data-printing` を外す）、控えを空にする
      3. 外す関数は、2 つの受け取りを `window` から外す
    unit_tests:
      - name: test_attach_print
        case: 正常
        summary: 印刷の前に閉じた折り畳みを開き、後に開いたものだけを閉じ直す
        condition: 閉じた `details` と開いた `details`。`isEnabled` は `true`
        mock: なし
        expected: '`beforeprint` の後に 2 つとも `open` を持ち、`afterprint` の後に初めに閉じていた方だけが `open` を持たない'
      - name: test_attach_print_when_disabled
        case: 正常
        summary: 印刷の機能がオフなら開かない
        condition: 閉じた `details`。`isEnabled` は `false`
        mock: なし
        expected: '`beforeprint` の後も `open` を持たない'
      - name: test_attach_print_when_detached
        case: 正常
        summary: 外した後は受け取らない
        condition: 外す関数を呼んだ後に `beforeprint` を送る
        mock: なし
        expected: '`details` が `open` を持たない'
      - name: test_attach_print_when_syntax
        case: 正常
        summary: 印刷の前に閉じた節・行の詳細・タブの中身を出し、後に戻す
        condition: 操作を付けた、閉じた節・閉じた行の詳細・2 つ目を選んだタブ
        mock: なし
        expected: '`beforeprint` の後にどれも `hidden` を持たず、`afterprint` の後に節が `hidden="until-found"`、行の詳細が `hidden`、1 つ目のタブの中身が `hidden`'
      - name: test_attach_print_when_tree
        case: 正常
        summary: 印刷の前にファイルツリーの閉じたフォルダを開き、後に閉じ直す
        condition: 操作を付けた、`src/` が閉じたファイルツリー。`isEnabled` は `true`
        mock: なし
        expected: '`beforeprint` の後に `src/` の入れ子の `ul` が `hidden` を持たず、`afterprint` の後に `hidden="until-found"` を持つ'
  - name: highlightCodeBlocks
    title: 色分けの対象を色分けする
    container: src/highlight.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: 要素の中の `code[data-mdmark-syntax]` が 1 つ以上あれば、色分けのライブラリの本体と使う言語のモジュールを読み、読めた言語の `code` の中身を色分けした HTML に置き換える
    description: 読む先は、`syntaxModuleUrls` があればその URL（`languages` に無い言語は読まず、`console.error` にも出さない）、無ければ `url` を `document.baseURI` を基準に解決した `{url}core.min.js` と `{url}languages/{モジュール名}.min.js`。読んだモジュールは `modules`（URL → 読み込みの Promise）に控え、同じ `mount` の描き直しでは読み直さない。色分けの HTML は highlight.js が文字をエスケープしてから `span` を付けたもので、sanitize を通さない。待ちに時間の上限は置かない
    side_effects: '`code` と `mdmark-code-text` の中身を置き換える。本体に言語を登録する。読めないモジュールを `console.error` に出す'
    args:
      - name: options
        type: '{ root: HTMLElement; url: string; isCurrent: () => boolean; modules: Map<string, Promise<{ default?: unknown }>>; importModule?: SyntaxImport }'
        required: true
        description: '`root` は描いた要素、`url` は既定を当てた設定の `syntax.url`、`isCurrent` は描いた文書がまだ今のものか、`modules` は `mount` ごとに 1 つの読んだモジュールの控え、`importModule` はモジュールを読む関数（既定 `(url) => import(url)`）'
    returns:
      type: Promise<void>
      description: 色分けし終えるか、読めずにやめたら解決する。失敗しても拒否しない
    process: |-
      1. `root` の中の `code[data-mdmark-syntax]` を拾う。無ければ何も読まずに終える
      2. 本体の URL を決め、`modules` に無ければ読み始めて控え、待つ
         - `[error]` 本体を読めない（URL と元のエラーを `console.error` に出し、色分けせずに終える）
      3. 拾った `code` の `data-mdmark-syntax` の値を重なりなく並べ、言語ごとに URL を決めて並べて読み（`Promise.allSettled`）、読めた言語を本体の `registerLanguage` で登録する（登録済みの言語は飛ばす）
         - `[error]` 言語のモジュールを読めない（URL と元のエラーを `console.error` に出し、その言語の `code` を色分けせずに残す）
      4. 待った後に `isCurrent()` が `false` なら何もしない
      5. 登録できた言語の `code` ごとに次を行う
         - `mdmark-code-text` を持つときは、各行の `textContent` を色分けした行にし（色分けした行を作る）、各 `mdmark-code-text` の `innerHTML` に入れる
         - 持たないときは、`code` の `textContent` を `highlight`（`ignoreIllegals: true`）に通した HTML を `code` の `innerHTML` に入れる
    callees:
      - '#functions[highlightLines]'
    unit_tests:
      - name: test_highlight_code_blocks
        case: 正常
        summary: 行に分けた形と分けない形の両方を色分けし、文字と行の形を変えない
        condition: '`renderCodeBlock` の `syntax: "typescript"` の行に分けないコードブロックと、`syntax: "yaml"`・`lineNumbers: true` で 3 行のブロックスカラーを持つコードブロック。`url` は `/hl/`'
        mock: '`importModule` が `/hl/core.min.js` に npm の `highlight.js/lib/core`、`/hl/languages/{名前}.min.js` に `highlight.js/lib/languages/{名前}` を返す'
        expected: '`importModule` が `location.origin` + `/hl/core.min.js`・`/hl/languages/typescript.min.js`・`/hl/languages/yaml.min.js` の 3 回。両方の `code` に class が `hljs-` で始まる `span` があり、`textContent` と `mdmark-code-line` の数・`data-line` が色分けの前と同じ'
      - name: test_highlight_code_blocks_when_no_target
        case: 正常
        summary: 色分けの対象が無ければ何も読まない
        condition: '`data-mdmark-syntax` を持たない `pre > code.language-ts` だけの要素'
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれない'
      - name: test_highlight_code_blocks_when_core_fails
        case: 異常
        summary: 本体を読めないときは色分けせずに残し、エラーを出す
        condition: '`test_highlight_code_blocks` と同じ要素'
        mock: '`importModule` が `core.min.js` を `new Error("404")` で拒否する。`console.error` を見張る'
        expected: 戻りの Promise が解決し、両方の `code` の HTML が前と同じ。言語のモジュールを読まず、`console.error` が URL と `Error("404")` を含めて 1 回呼ばれる
      - name: test_highlight_code_blocks_when_language_fails
        case: 異常
        summary: 読めない言語だけ色分けせずに残す
        condition: '`test_highlight_code_blocks` と同じ要素'
        mock: '`test_highlight_code_blocks` と同じで、`languages/yaml.min.js` だけ拒否する。`console.error` を見張る'
        expected: '`typescript` の `code` は色分けし、`yaml` の `code` の HTML は前と同じ。`console.error` が `languages/yaml.min.js` を含めて 1 回呼ばれる'
      - name: test_highlight_code_blocks_when_stale
        case: 正常
        summary: 読み終えたときに描き直していたら色を当てない
        condition: '`test_highlight_code_blocks` と同じ要素。`isCurrent` が `false` を返す'
        mock: '`test_highlight_code_blocks` と同じ'
        expected: 両方の `code` の HTML が前と同じ
      - name: test_highlight_code_blocks_when_cached
        case: 正常
        summary: 同じモジュールの控えで 2 回呼ぶとモジュールを読み直さない
        condition: '`test_highlight_code_blocks` と同じ要素を 2 つ作り、同じ `modules` で順に呼ぶ'
        mock: '`test_highlight_code_blocks` と同じ'
        expected: '`importModule` が合わせて 3 回で、両方の要素が色分けされる'
      - name: test_highlight_code_blocks_when_module_urls
        case: 正常
        summary: 埋めたモジュールの URL があればそこから読み、埋めていない言語は読まない
        condition: '`setSyntaxModuleUrls({ core: "blob:core", languages: { typescript: "blob:ts" } })` の後に `test_highlight_code_blocks` と同じ要素。終えたら `setSyntaxModuleUrls(undefined)`'
        mock: '`importModule` が `blob:core` に本体、`blob:ts` に typescript を返す。`console.error` を見張る'
        expected: '`importModule` が `blob:core` と `blob:ts` の 2 回だけ。`typescript` の `code` は色分けし、`yaml` の `code` は前と同じで、`console.error` が呼ばれない'
      - name: test_highlight_code_blocks_when_dockerfile_and_diff
        case: 正常
        summary: dockerfile と、行の印を持つ diff を色分けする
        condition: '`render` で描いた `dockerfile` のコードブロック（`FROM node:22`）と、`diff` のコードブロック（`-old`・`+new // [!code ++]`）。`url` は `/hl/`'
        mock: '`importModule` が `test_highlight_code_blocks` と同じく npm の `highlight.js` の本体と言語を返す'
        expected: '`importModule` が `/hl/languages/dockerfile.min.js` と `/hl/languages/diff.min.js` を読む。`dockerfile` の `code` に `hljs-keyword` の `span`、`diff` の行に `hljs-deletion` と `hljs-addition` の `span` があり、`+new` の行は `data-kind="add"` のまま'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[色分けの読み込み]
      - dev/設計書/外部ライブラリ/highlight.js#
    status: planned
    introduced:
      pr: 97
  - name: setSyntaxModuleUrls
    title: 埋めた色分けのモジュールの URL を入れる
    container: src/highlight.ts
    kind: 関数
    scope: internal
    summary: '`syntaxModuleUrls` を置き換える。`undefined` で `syntax.url` から読む形に戻す'
    side_effects: '`syntaxModuleUrls` を書き換える'
    args:
      - name: urls
        type: SyntaxModuleUrls | undefined
        required: true
        description: 埋めたモジュールの URL
    returns:
      type: void
      description: なし
    status: planned
    introduced:
      pr: 97
  - name: highlightLines
    title: 色分けした行を作る
    container: src/highlight-lines.ts
    kind: 関数
    scope: internal
    summary: '行の文字を改行でつないで highlight.js の `highlight`（`ignoreIllegals: true`）に通し、`splitHighlightedLines` で行ごとの HTML に戻す'
    description: 行をまたぐコメント・文字列も正しく色分けするため、行ごとでなくつないだ文字を一度に通す。`mount` と部品の描画のインターフェース（Node）が使う
    args:
      - name: options
        type: '{ hljs: HLJSApi; language: string; lines: string[] }'
        required: true
        description: '`hljs` は言語を登録した本体（型は npm の `highlight.js` から `import type`）、`language` は言語のモジュール名、`lines` はエスケープ前の行の文字'
    returns:
      type: string[]
      description: 行ごとの色分けした HTML。数は `lines` と同じ
    callees:
      - '#functions[splitHighlightedLines]'
    unit_tests:
      - name: test_highlight_lines
        case: 正常
        summary: 行をまたぐ文字列を色分けし、行の数と文字を変えない
        condition: 'npm の `highlight.js/lib/core` に `yaml` を登録し、`key: |`・`  a < b`・`  c` の 3 行'
        mock: なし
        expected: 3 要素で、2・3 要素目が `<span class="hljs-string">` で始まり `</span>` で終わる。各要素のタグを外してエスケープを戻した文字が元の行と同じ
    status: planned
    introduced:
      pr: 97
  - name: splitHighlightedLines
    title: 色分けしたHTMLを行に分ける
    container: src/highlight-lines.ts
    kind: 関数
    scope: internal
    summary: highlight.js が返した HTML を改行で分け、行末で開いている `span` を閉じて次の行の頭で同じ開始タグを開き直す
    description: 入力のタグは highlight.js が出す `<span class="...">` と `</span>` だけとして扱い、文字はエスケープ済みのまま切り分ける。開いている開始タグを入れ子の順に持ち、行末でその数だけ `</span>` を足し、次の行の頭に同じ順で開始タグを置く
    args:
      - name: html
        type: string
        required: true
        description: highlight.js の `highlight` の `value`
    returns:
      type: string[]
      description: 行ごとの HTML。改行が n 個なら n + 1 要素
    unit_tests:
      - name: test_split_highlighted_lines
        case: 正常
        summary: 行をまたぐ `span` を行末で閉じ、次の行で開き直す
        condition: '`<span class="hljs-comment">/*\n * a\n */</span>\nx`'
        mock: なし
        expected: '`["<span class=\"hljs-comment\">/*</span>", "<span class=\"hljs-comment\"> * a</span>", "<span class=\"hljs-comment\"> */</span>", "x"]`'
      - name: test_split_highlighted_lines_when_nested
        case: 正常
        summary: 入れ子の `span` を内側から閉じ、外側から開き直す
        condition: '`<span class="hljs-string">`a<span class="hljs-subst">${b\nc}</span>`</span>`'
        mock: なし
        expected: 1 要素目が `</span></span>` で終わり、2 要素目が `<span class="hljs-string"><span class="hljs-subst">c}` で始まる
      - name: test_split_highlighted_lines_when_single_line
        case: 正常
        summary: 改行が無ければそのまま 1 要素で返す
        condition: '`<span class="hljs-number">1</span> &lt; 2`'
        mock: なし
        expected: '`["<span class=\"hljs-number\">1</span> &lt; 2"]`'
    status: planned
    introduced:
      pr: 97
notes:
  単体テストの実行場所: このページの関数は DOM を使うため、単体テストを `tests/unit/src/{mount,libraries,highlight,print}.browser.test.ts` に置き（DOM を使わない `highlight-lines.ts` は `tests/unit/src/highlight-lines.test.ts` で `unit` プロジェクト）、Vitest のプロジェクト `unit-browser`（Chromium、`tests/unit/**/*.browser.test.ts`）で流す。`unit` プロジェクトは `*.browser.test.ts` を除く
