  - name: loadInlineIcons
    title: 束ねていないアイコンを読む
    container: src/inline-icons.ts
    summary: '中が空の `span.mdmark-inline-icon` の名前ごとに、`opts.icons` に無ければ `lucideIconUrl` の URL を 1 回だけ `import()` し、`iconNodeSvg` の svg を同じ名前の全ての場所に入れる。失敗した名前だけ `HEAD` の `fetch` で 404 かを確かめ、404 は行内のコードに戻して書き方の警告を置き、それ以外は行内のコードに戻して文書の先頭に知らせの枠（`source: "icons"`）を 1 つだけ置く'
    kind: 関数
    scope: internal
    args:
    - name: options
      type: '{ root: HTMLElement; icons: Record<string, MdmarkIconNode>; isCurrent: () => boolean; importModule?: ImportModule; fetchHead?: (url: string) => Promise<Response> }'
      required: true
      description: '`root` は描く先の要素、`icons` は `opts.icons`、`isCurrent` は描いた文書がまだ今のものか（`import()`・`HEAD` の後に偽なら DOM に触れずに戻る）、`importModule` はモジュールを読む関数（既定 `(url) => import(url)`）、`fetchHead` は `HEAD` を送る関数（既定 `(url) => fetch(url, { method: "HEAD" })`）'
    returns:
      type: Promise<void>
      description: 全て入れ終えたら解決する
    side_effects: jsDelivr のモジュールを `import()` し、失敗した名前だけ `HEAD` を送る。描く先の要素の中を書き換える。404 でなく読めなかった名前の URL を `console.error` に出す
    callees:
    - '#functions[lucideIconUrl]'
    - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[iconNodeSvg]
    unit_tests:
    - name: test_load_inline_icons
      case: 正常
      condition: '`sailboat` 2 か所と `anchor` 1 か所の空の要素'
      expected: '`import` が `sailboat.mjs` と `anchor.mjs` の 1 回ずつで、3 か所に svg が入る'
      mock: '`importModule` と `fetchHead` を渡す'
      summary: 名前ごとに 1 回だけ読む
    - name: test_load_inline_icons_when_not_found
      case: 異常
      condition: '`no-such-icon` の `import` が失敗し、`HEAD` が 404'
      expected: その場所が `<code>icon:no-such-icon</code>` になり、段落の前に書き方の警告があり、知らせの枠が無い
      mock: '`importModule` と `fetchHead` を渡す'
      summary: 404 は書き方の警告にする
    - name: test_load_inline_icons_when_offline
      case: 異常
      condition: 全ての `import` と `HEAD` が失敗する
      expected: 全ての場所が行内のコードになり、知らせの枠が 1 つだけある
      mock: '`importModule` と `fetchHead` を渡す'
      summary: 読めないときは知らせの枠を 1 つ置く
    - name: test_load_inline_icons_when_stale
      case: 正常
      condition: '`import` と `HEAD` が失敗し、読み込みの間に `isCurrent` が偽になる'
      expected: 知らせの枠と書き方の警告が無く、空の要素がそのまま残る
      mock: '`importModule` と `fetchHead` を渡す'
      summary: 古い描画の結果を書き込まない
  - name: lucideIconUrl
