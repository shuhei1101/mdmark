        expected: '`aside.mdmark-side-toc` が 1 つだけで `data-pinned` を持ち、項目が `#b`・`#c`'
      - name: test_mount_when_side_toc_off
        case: 正常
        summary: 機能をオフにすると右側の目次を置かず、本文を列に包まない
        condition: '先頭に `<!-- features: -side-toc -->` を持つ `# 手引き`・`## 導入`'
        mock: なし
        expected: '`aside.mdmark-side-toc` と `div.mdmark-content` が無く、`el` の直下に `h1` がある'
      - name: test_mount_when_aliases_updated
        case: 正常
        summary: update で描き直しても、最初に渡したエイリアスで下線を付ける
        condition: '`aliases` に `command` の `単体テスト` を渡して `単体テストを流す。` を描き、`update("もう一度単体テストを流す。")`'
        mock: なし
        expected: '`update` の後も `mdmark-term-wrap` が 1 つあり、ツールチップに `npm run test:unit` とコピーのボタンがある'
      - name: test_mount_when_color_theme
        case: 正常
