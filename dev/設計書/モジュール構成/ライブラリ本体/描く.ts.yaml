title: "ライブラリ本体 / 描く"
lead: 使う側のページの要素に文書を描き、描き直しと片付けを受け持つ処理。記法の操作を付け、文書の印にある外部ライブラリと拡張のモジュールを読んで印の場所に描かせ、色分けの対象のコードブロックを色分けし、印刷の前後で折り畳みと記法を開いて戻す。ブラウザでだけ動く（色分けの HTML を行に分ける `src/highlight-lines.ts` だけは DOM を使わず、部品の描画のインターフェースも使う）。
directory: |-
  ```tree
  src/
  ├── mount.ts            # 公開関数 mount と、描いた要素の控え
  ├── libraries.ts        # 印の場所に外部ライブラリのモジュールを描かせる loadLibraries
  ├── highlight.ts        # 色分けのライブラリを読んでコードブロックを色分けする highlightCodeBlocks と、埋めたモジュールの URL の控え
  ├── highlight-lines.ts  # 色分けした HTML を行に分ける splitHighlightedLines・highlightLines（DOM を使わない）
  └── print.ts            # 印刷の前後で折り畳みを開いて戻す attachPrint
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 文書を要素に描く
        class 描いた要素の操作
        class 印の場所に外部ライブラリを描かせる
        class 色分けの対象を色分けする
        class 色分けした行を作る
        class 色分けしたHTMLを行に分ける
        class 印刷の前後で折り畳みを開く
        文書を要素に描く --> 描いた要素の操作 : 返す
        文書を要素に描く --> 印の場所に外部ライブラリを描かせる : 描くたびに呼ぶ
        文書を要素に描く --> 色分けの対象を色分けする : 描くたびに呼ぶ
        色分けの対象を色分けする --> 色分けした行を作る : 行に分けたコードブロック
        色分けした行を作る --> 色分けしたHTMLを行に分ける
        文書を要素に描く --> 印刷の前後で折り畳みを開く : 1 回だけ付ける
      ```
data_models:
  - name: MountOptions
    title: 描く設定
    container: src/mount.ts
    usecase: 使う側のページが文書を描く
    role: DTO
    summary: '`mount` の第 2 引数（公開の型）'
    properties:
      - name: markdown
        type: string
        description: 描く Markdown
      - name: config
        type: MdmarkConfig | undefined
        description: 使う側の設定。省いたキーには既定を当てる
      - name: index
        type: MdmarkIndex | undefined
        description: 索引。省くと索引の用語と関連文書を出さない
      - name: docId
        type: string | undefined
        description: 描く文書の索引の `id`。索引に無い `id` は省いたのと同じ
      - name: references
        type: MdmarkReferences | undefined
        description: '`collectReferences` の戻り値。省くと、関連文書の一覧は索引の `related` だけから出し、他の文書の用語集の表の用語を照合しない'
      - name: diffSource
        type: DiffSource | undefined
        description: 差分の取り出し元。渡すと描いた文書に差分を開く UI を付ける。渡すときは `docId` も要る
      - name: commentStore
        type: MdmarkCommentStore | undefined
        description: コメントの読み書きの関数。`comments` がオンのときだけ使う。渡すときは `docId` も要る
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: エイリアス（`buildAliases` の戻り値の `aliases`）。`glossary` がオンのとき、名前と別名に下線と種類ごとのツールチップを付ける。使えないエイリアス（`env` を含む）は照合せず、知らせの枠も出さない
      - name: diffMode
        type: DiffMode | undefined
        description: 差分の出し方。`button`（既定）・`open`・`blocks`。`diffSource` を渡さないときは使わない。知らない値は `button` にする
  - name: MountHandle
    title: 描いた要素の操作
    container: src/mount.ts
    usecase: 使う側のページが文書を描く
    summary: '`mount` の戻り値（公開の型）'
    properties:
      - name: update
        type: '(markdown: string) => void'
        description: 本文だけを描き直す。設定は `mount` に渡したものを使う。`destroy` の後は何もしない
      - name: destroy
        type: () => void
        description: 要素の中を空にして class `mdmark` を外し、印刷の受け取りを外す。2 回目以降は何もしない
  - name: LibraryModule
    title: 外部ライブラリのモジュール
    container: src/libraries.ts
    usecase: 文書が使う外部ライブラリだけを読み込む
    summary: '`import()` で読んだモジュールが名前付きで export する形'
    properties:
      - name: draw
        type: '(slot: HTMLElement, args: string[]) => void | Promise<void>'
        description: 印の場所の要素と、印の引数を受けて描く
  - name: SyntaxModuleUrls
    title: 埋めた色分けのモジュールの URL
    container: src/highlight.ts
    summary: 書き出した HTML の起動の処理が `setSyntaxModuleUrls` で渡す、埋めた色分けのモジュールの `blob:` URL
    properties:
      - name: core
        type: string
        description: 本体（`core.min.js`）の URL
      - name: languages
        type: Record<string, string>
        description: 言語のモジュール名から URL を引く表。埋めなかった言語は持たない
    status: planned
    introduced:
      pr: 97
function_types:
  - name: ImportModule
    title: モジュールを読む
    container: src/libraries.ts
    summary: URL のモジュールを読む関数。既定は `(url) => import(url)` で、単体テストで差し替える
    args:
      - name: url
        type: string
        description: 解決済みの URL
    returns:
      type: Promise<LibraryModule>
      description: 読んだモジュール
  - name: SyntaxImport
    title: 色分けのモジュールを読む
    container: src/highlight.ts
    summary: URL の色分けのモジュールを読む関数。既定は `(url) => import(url)` で、単体テストで差し替える
    args:
      - name: url
        type: string
        description: 解決済みの URL
    returns:
      type: 'Promise<{ default?: unknown }>'
      description: 読んだモジュール。本体の `default` は `HLJSApi`、言語の `default` は `LanguageFn`
    status: planned
    introduced:
      pr: 97
constants:
  - name: mounted
    title: 描いた要素の控え
    container: src/mount.ts
    summary: 描いた要素からその `MountHandle` を引く。同じ要素への `mount` が前の描画を片付けるのに使う
    value: new WeakMap<HTMLElement, MountHandle>()
  - name: ROOT_CLASS
    title: 描く先の class
    container: src/mount.ts
    summary: 描く先の要素に付ける class。本文の CSS はこの class の下に当たる
    value: '"mdmark"'
  - name: DRAWN_ATTRIBUTE
    title: 描き終えた印
    container: src/libraries.ts
    summary: モジュールが描き終えた印の場所に付ける属性。読み込み中の破線と高さを外すのに使う
    value: '"data-mdmark-drawn"'
  - name: syntaxModuleUrls
    title: 埋めた色分けのモジュールの URL の控え
    container: src/highlight.ts
    summary: '`setSyntaxModuleUrls` が入れる `SyntaxModuleUrls`。無ければ `syntax.url` から読む。モジュールの中の `let` で持ち、ページの中の全ての `mount` に効く'
    value: undefined
    status: planned
    introduced:
      pr: 97
  - name: COLOR_THEME_ATTRIBUTE
    title: テーマの属性
    container: src/mount.ts
    summary: 描く先の要素に、既定を当てた設定の `colorTheme` を値にして付ける属性。`src/index.css` は `:root:has()` でこの属性の値を見て、テーマの配色の値を `:root` に当てる
    value: '"data-mdmark-color-theme"'
    reason: '`:root` に当て、使う側が `:root` に書いた上書きと `document.body` の直下の部品にも同じ配色を届ける。明暗の class（`mdmark-theme-*`）と名前を分けるため class でなく属性にする'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[選んだテーマ]
    status: planned
    introduced:
      pr: 181
functions:
  - name: mount
    title: 文書を要素に描く
    container: src/mount.ts
    kind: 関数
    scope: public
    summary: 公開関数。要素の中に文書を描き、記法の操作を付け、外部ライブラリと拡張の印を描かせ、印刷の受け取りを付けて `MountHandle` を返す
    side_effects: '`el` の中身と class を書き換え、`window` に `beforeprint`・`afterprint` の受け取りを付ける。`mounted` に `el` を控える'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先の要素
      - name: opts
        type: MountOptions
        required: true
        description: Markdown・設定・索引・描く文書の `id`・参照の表
    args_example: |-
      ```ts
      const handle = mount(document.querySelector("#doc"), { markdown: "# 見出し", config });
      handle.update("# 次の見出し");
      handle.destroy();
      ```
    returns:
      type: MountHandle
      description: 描き直しと片付けの関数
    process: |-
      1. `diffSource` か `commentStore` を渡して `docId` が無ければ `TypeError` を投げる。`commentStore` が `load`・`save` の関数を持たなければ `TypeError` を投げる（コメントの引数を検める）。`mounted` に `el` があれば、その `destroy` を呼ぶ。差分の出し方を `normalizeDiffMode(opts.diffMode)` で決める
      2. 設定に既定を当てる（設定に既定を当てる）
      3. 描く世代を 0、片付けた印を `false`、操作を外す関数と右側の目次を外す関数を無しにし、右側の目次の状態（`SideTocState`）を `{ open: false, pinned: false }` で作る
      4. 文書を描く。描くたびに次を行う
         - 世代を 1 進め、前の操作を外す関数と右側の目次を外す関数があれば呼ぶ
         - 本文の HTML と機能のオン・オフを得て（文書を描く。`opts` の `index`・`docId`・`references`・`aliases` を渡す）、`el` の中を本文の HTML に置き換え、`el` に `ROOT_CLASS` を付け、`COLOR_THEME_ATTRIBUTE` に既定を当てた設定の `colorTheme` を付ける
         - 機能のオン・オフを控える
         - 機能の `side-toc` がオンなら右側の目次を付け（右側の目次を付ける。既定を当てた設定の `sideToc.mode`・機能の `sections`・手順 3 の状態を渡す）、外す関数を控える。以降の記法の操作・外部ライブラリ・色分け・部品・差分に描いた要素として渡すのは、戻りの `content`（本文の列。右側の目次を付けないときは `el`）
         - 記法の操作を付け（記法の操作を付ける。ツールチップを出す場所は、既定を当てた設定の `tooltips.placement` を渡す）、外す関数を控える
         - 印の場所に外部ライブラリと拡張を描かせる（印の場所に外部ライブラリを描かせる）。今の世代と片付けた印を見る `isCurrent` を渡し、戻りの Promise は待たない
         - 色分けの対象を色分けする（色分けの対象を色分けする）。既定を当てた設定の `syntax.url`・同じ `isCurrent`・`mount` ごとに 1 つ作るモジュールの控え（`Map`）を渡し、戻りの Promise は待たない
         - ビューとコメントの部品を付け（描いた文書に部品を付ける。機能のオン・オフ・`commentStore`・`docId`・`isCurrent` と、`mount` ごとに 1 つ作る `warned` を渡す）、外す関数を控える。前の外す関数は描き直す前に呼ぶ
         - `diffSource` を渡し、差分の出し方が `button` か `open` なら、前の差分を外す関数を呼んでから差分を付け（差分を付ける。`open` には差分の出し方が `open` かを渡す。右側の目次を付けたときは `hideWith` にその要素を渡す。`renderHtml` は、範囲の HTML を `html` のコードブロックに入れ `<!-- html -->` で囲んだ Markdown を、今の設定・`index`・`docId`・`references`・`aliases` で文書を描く処理に通し、得た埋め込んだ HTML の範囲の中身と、置いた要素にその描画の機能のオン・オフと操作できる部品の定義、今の設定の `tooltips.placement` で記法の操作を付ける `attach` を返す関数（`DiffHtmlRenderer`）。文書と同じく図の部品を図の HTML にし、許可の検査とヒントを当て、図の拡大・ツールチップ・操作できる部品も文書と同じく動かす。`html` の機能がオフのときは空の文字と何もしない `attach` を返す）、外す関数を控える
         - `diffSource` を渡し、差分の出し方が `blocks` で、色分けせずに描いたときは、比べる 2 つの本文を取り出す（`loadDiffPair`。戻りの Promise は待たない）。解決したときに世代が変わっているか片付けていれば何もしない。`pair` で前と後が違えば、後の Markdown をこの手順 4 で描き直す。そのときは本文の HTML を `el` に置く前に、後と前の Markdown を同じ引数で描いた `template` の中身を `colorDiffBlocks` に通し（`segmenter` は `Intl.Segmenter` があれば `ja`・`word` で作る）、後の中身を `el` に置く。色分けして描いたときは取り出し元を呼び直さない。`single` と同じ本文のときは描いたまま残す。`failed` なら本文の列の先頭に `renderNotice({ name: docId, source: "diff-blocks" })` の知らせの枠を置く
      5. 印刷の受け取りを付ける（印刷の前後で折り畳みと記法を開く）。`isEnabled` は控えた機能のオン・オフの `print` を返す
      6. `update` は、片付けた後なら何もせず、そうでなければ手順 4 で描き直す（右側の目次の状態は保つ。`index`・`docId`・`references`・`aliases` は最初に渡したもののまま）
      7. `destroy` は、片付けた後なら何もせず、そうでなければ片付けた印を `true` にし、操作・差分・ビューとコメントの部品・右側の目次・印刷の受け取りを外し、`el` の中を空にして `ROOT_CLASS` と `COLOR_THEME_ATTRIBUTE` を外し、`mounted` の `el` が自分なら消す
      8. `mounted` に `el` と戻り値を控えて返す
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定と機能.ts#functions[resolveConfig]
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[renderDocument]
      - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[attachInteractions]
      - '#functions[loadLibraries]'
      - '#functions[attachPrint]'
      - dev/設計書/モジュール構成/ライブラリ本体/差分.ts#functions[attachDiff]
      - dev/設計書/モジュール構成/ライブラリ本体/差分.ts#functions[normalizeDiffMode]
      - dev/設計書/モジュール構成/ライブラリ本体/差分.ts#functions[loadDiffPair]
      - dev/設計書/モジュール構成/ライブラリ本体/差分.ts#functions[colorDiffBlocks]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderNotice]
      - dev/設計書/モジュール構成/ライブラリ本体/ビューとコメント.ts#functions[attachParts]
      - '#functions[highlightCodeBlocks]'
      - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[attachSideToc]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#
    unit_tests:
      - name: test_mount
        case: 正常
        summary: 要素に本文を描き、class を付ける
        condition: '`# 見出し` を描く'
        mock: なし
        expected: '`el` が class `mdmark` を持ち、中に文字が `見出し` の `h1` がある。戻り値が `update` と `destroy` を持つ'
      - name: test_mount_when_updated
        case: 正常
        summary: '`update` で本文だけを描き直す'
        condition: '`# A` を描いた後、`update("# B")`'
        mock: なし
        expected: '本文の列（`div.mdmark-content`）の中の見出しが文字 `B` の `h1` 1 つだけで、`el` が、class `mdmark` を持ったまま'
      - name: test_mount_when_destroyed
        case: 正常
        summary: '`destroy` で片付け、その後の `update` と 2 回目の `destroy` は何もしない'
        condition: '`destroy` の後に `update("# B")` と `destroy()`'
        mock: なし
        expected: '`el` の中が空で class `mdmark` を持たない。例外が出ない'
      - name: test_mount_when_remounted
        case: 正常
        summary: 同じ要素へもう一度描くと、前の描画を片付けてから描く
        condition: '`mount(el, A)` の後に `mount(el, B)`、続けて 1 回目の戻り値の `update("# C")`'
        mock: なし
        expected: '`el` の中の本文の列（`div.mdmark-content`）が 1 つだけで、その中の見出しが文字 `B` の `h1` のまま'
      - name: test_mount_when_print_disabled_by_mark
        case: 正常
        summary: 文書の印で印刷の機能を外すと、印刷の前に折り畳みを開かない
        condition: '`<!-- features: -print -->` と閉じた `details`。設定の `features` は省く'
        mock: なし
        expected: '`beforeprint` を送った後も `details` が `open` を持たない'
      - name: test_mount_when_updated_with_print_mark
        case: 正常
        summary: '`update` で描き直した文書の印が印刷の機能に効く'
        condition: '印の無い文書を描いた後、`<!-- features: -print -->` と閉じた `details` に `update`'
        mock: なし
        expected: '`beforeprint` を送った後も `details` が `open` を持たない'
      - name: test_mount_when_updated_with_syntax
        case: 正常
        summary: 描き直すと前の操作を外し、新しい本文に操作を付ける
        condition: 表を描いて絞り込みのドロワーを開いた後、タブの文書に `update`
        mock: '`document.removeEventListener` を数える関数で包む'
        expected: '`pointerdown`・`keydown` が外れ、`role="tablist"` がある'
      - name: test_mount_when_diff_source
        case: 正常
        summary: 取り出し元を渡すと見出しの後ろに差分を開くボタンを置き、片付けると取り除く
        condition: '`# 見出し` と `docId: "guide"`・`diffSource` を渡し、後で `destroy`'
        mock: 取り出し元は呼ばれた引数を控える関数
        expected: '本文の列の中で `h1` の次（節の中身の前）に `mdmark-diff-toggle` があり、`revisions` は呼ばれていない。`destroy` の後はボタンが無い'
      - name: test_mount_when_diff_source_without_doc_id
        case: 異常
        summary: 取り出し元を渡して docId が無いと投げる
        condition: '`diffSource` を渡し、`docId` を省く'
        mock: なし
        expected: '`TypeError` を投げ、`el` の中は変わらない'
      - name: test_mount_when_diff_html_has_chart
        case: 正常
        summary: 差分の埋め込んだ HTML のプレビューで、図の部品を文書と同じく図に描く
        condition: 前と後の本文で `<mdmark-chart>` の定義を書き換えた範囲。差分を開いて「プレビュー」を押す
        mock: 取り出し元は 2 つの本文を返す関数
        expected: プレビューの前と後に図の要素（`figure[data-diagram="chart"]`）があり、定義の JSON の文字が本文に出ない
      - name: test_mount_when_diff_preview_zoomed
        case: 正常
        summary: 差分のプレビューの図も文書と同じく拡大でき、前と後で id が重ならない
        condition: '`test_mount_when_diff_html_has_chart` と同じ本文で差分を開き、「プレビュー」を押して、後の側の図の拡大のボタンを押す'
        mock: 取り出し元は 2 つの本文を返す関数
        expected: 後の側の図の倍率が上がる。ページの中の `id` に重なりが無く、後の側の表示する枠の `aria-labelledby` が後の側の題を指す
      - name: test_mount_when_comment_store_without_doc_id
        case: 異常
        summary: コメントの読み書きの関数を渡して docId が無いと投げる
        condition: '`commentStore` を渡し、`docId` を省く'
        mock: なし
        expected: '`TypeError` を投げ、`el` の中は変わらない'
      - name: test_mount_when_view_marked
        case: 正常
        summary: ビューの印があると部品を付け、描き直すと前の部品を外す
        condition: ビューの印を持つ文書を描いた後、印の無い文書に `update`
        mock: '`setPartModuleUrl` で `view` を、`attachView` が呼ばれた要素と外した回数を控えるモジュールの URL に差し替える'
