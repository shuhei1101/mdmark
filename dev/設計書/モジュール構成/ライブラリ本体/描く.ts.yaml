  - name: loadLibraries
    title: マーカーの場所に外部ライブラリを描かせる
    container: src/libraries.ts
    kind: 関数
    scope: internal
    is_async: true
    summary: 要素の中のマーカーの場所ごとに、登録した拡張なら引数を検査して `load` で、対応表なら URL でモジュールを読み込んで `draw` を呼ぶ。引数が合わない場所は記載の警告に、読み込めない・描けない・検査が失敗する場所は通知ブロックに替える
    description: '同じ名前のモジュールは 1 回の呼び出しの中で 1 回だけ読み込む（2 回目からは同じ Promise を待つ）。拡張は対応表より優先し、`draw` に `parseMarkArgs` の値を指定する（対応表のモジュールには今のまま引数の配列を指定する）。拡張の通知ブロックは `source: "extension"` で、名前は拡張の `name`。記載の警告は `renderSyntaxWarning` にマーカーの文字・拡張の名前・`validateMarkArgs` の項目を指定する。マーカーの場所が無ければ何も読み込まない。`embeddedLibraries` があるときは、URL を読み込まずに表の関数でモジュールを読み込み、表に無い名前は読み込めないものとして通知ブロックにする（ページの隣のファイルや CDN へ要求しない）。読み込みと `draw` に時間の上限は配置しない'
    side_effects: マーカーの場所の要素の属性を書き換え、失敗した場所を通知ブロックに置き換える。失敗を `console.error` に出す
    args:
      - name: options
        type: '{ root: HTMLElement; libraries: Record<string, LibraryEntry>; isCurrent: () => boolean; importModule?: ImportModule }'
        required: true
        description: '`root` は描いた要素、`libraries` は既定を適用した対応表、`isCurrent` は描いた文書がまだ今のものか、`importModule` はモジュールを読み込む関数（既定 `(url) => import(url)`）'
    returns:
      type: Promise<void>
      description: 全てのマーカーの場所を描き終えるか通知ブロックに替えたら解決する。失敗しても拒否しない
    process: |-
      1. `root` の中の `[data-mdmark-slot]` の要素を全て取得する
      2. 取得した要素ごとに並行して次の処理をする
         - `data-mdmark-slot` の名前で対応表の行を参照する。行が無い（文書に生の HTML で記載された）要素は取り除き、ほかは行わない
         - 行の `url` を `document.baseURI` を基準に解決する
         - 名前ごとに 1 回だけモジュールを読み込む。`embeddedLibraries` があるときはその名前の関数を呼び、無い名前は `Error`（埋めていない）で拒否する。無いときは解決した URL で読み込む（モジュールを読み込む）
         - `data-mdmark-args` を空白で区切った引数で、モジュールの `draw` を呼んで待つ
         - 待った後に `isCurrent()` が `false` なら何もしない
         - 描けたら、要素から `role` を削除し `DRAWN_ATTRIBUTE` を付ける
         - 読み込めない・`draw` が無い・`draw` が例外を投げたときは、要素を通知ブロックに置き換える（通知ブロックを描く）。タイトルは行の `figure` で分ける。`draw` が要素を `root` から取り除いていたら置き換えない
           - `[error]` 外部ライブラリを読み込めない（マーカーの名前・URL・元のエラーを `console.error` の引数に並べる）
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderNotice]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSyntaxWarning]
      - dev/設計書/モジュール構成/ライブラリ本体/拡張.ts#functions[extensionFor]
      - dev/設計書/モジュール構成/ライブラリ本体/拡張.ts#functions[validateMarkArgs]
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[parseMarkArgs]
    unit_tests:
      - name: test_load_libraries
        case: 正常
        summary: マーカーの場所ごとに `draw` を呼び、描けた場所の読み込み中のマーカーを削除する
        condition: '`renderEmbed` の要素が `test-lib`（引数 `a b`）と `test-lib`（引数無し）の 2 つ。対応表は `{ "test-lib": { url: "/fixtures/test-lib.js", figure: true } }`'
        mock: '`importModule` が `draw` を持つモジュールを返却する'
        expected: '`importModule` が 1 回、`location.origin` + `/fixtures/test-lib.js` で呼ばれる。`draw` が `(1 つ目の要素, ["a", "b"])` と `(2 つ目の要素, [])` で呼ばれる。2 つの要素が `role` を持たず `data-mdmark-drawn` を持つ'
      - name: test_load_libraries_when_no_slot
        case: 正常
        summary: マーカーの場所が無ければ何も読み込まない
        condition: 段落だけの要素
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれない'
      - name: test_load_libraries_when_unknown_slot
        case: 正常
        summary: 対応表に無い名前のマーカーの場所を取り除き、何も読み込まない
        condition: '`<div class="mdmark-embed" data-mdmark-slot="zzz">` の要素 1 つ。対応表は空'
        mock: '`importModule` と `console.error` を見張る'
        expected: 要素が無くなり、`importModule` と `console.error` が呼ばれない。戻りの Promise は解決する
      - name: test_load_libraries_when_import_fails
        case: 正常
        summary: 読み込めないマーカーの場所を通知ブロックに替え、エラーを出す
        condition: '`test-lib` のマーカーの場所 1 つ。対応表の `figure` は `true`'
        mock: '`importModule` が `new Error("404")` で拒否する。`console.error` を見張る'
        expected: '要素が `renderNotice({ name: "test-lib", figure: true })` の HTML に替わる。`console.error` が 1 回、引数に `test-lib`・URL・`Error("404")` を含めて呼ばれる。戻りの Promise は解決する'
      - name: test_load_libraries_when_draw_throws
        case: 正常
        summary: '`draw` が例外を投げたマーカーの場所を通知ブロックに替える'
        condition: '`test-lib` のマーカーの場所 1 つ。対応表の `figure` は `false`'
        mock: '`importModule` が、例外を投げる `draw` を持つモジュールを返却する'
        expected: '要素が `renderNotice({ name: "test-lib", figure: false })` の HTML に替わる'
      - name: test_load_libraries_when_draw_missing
        case: 正常
        summary: '`draw` を export しないモジュールのマーカーの場所を通知ブロックに替える'
        condition: '`test-lib` のマーカーの場所 1 つ'
        mock: '`importModule` が空のモジュールを返却する'
        expected: 要素が通知ブロックに替わり、`console.error` が 1 回呼ばれる
      - name: test_load_libraries_when_stale
        case: 正常
        summary: 再描画した後に読み込み終えた古いマーカーの場所には手を付けない
        condition: '`isCurrent` が `false` を返却する。読み込みは拒否する'
        mock: '`importModule` が拒否する。`console.error` を見張る'
        expected: 要素が読み込み中のブロックのままで、`console.error` が呼ばれない
      - name: test_load_libraries_when_draw_removes_slot
        case: 正常
        summary: '`draw` がマーカーの場所を取り除いてから例外を投げても、通知ブロックに替えず拒否しない'
        condition: '`test-lib` のマーカーの場所 1 つ'
        mock: '`importModule` が、引数の要素を `remove()` してから例外を投げる `draw` を持つモジュールを返却する。`console.error` を見張る'
        expected: 戻りの Promise が解決し、`root` の中に通知ブロックが無い。`console.error` が 1 回呼ばれる
      - name: test_load_libraries_when_extension
        case: 正常
        summary: 拡張のマーカーを load で読み込み、判別した引数で draw を呼ぶ
        condition: '`greet` を登録し、`data-mdmark-slot="greet" data-mdmark-args="world lang=ja"` の場所を 2 つ'
        mock: '`load` は `draw` を記録するモジュールを返却する関数（呼ばれた回数を数える）'
        expected: '`load` が 1 回、`draw` が 2 回で引数が `{ args: ["world"], keys: { lang: "ja" } }`'
      - name: test_load_libraries_when_extension_args_invalid
        case: 異常
        summary: 引数が schema に合わない場所は記載の警告にし、load しない
        condition: 引数 1 つを英小文字で許す schema の `greet` と `World 2` の場所
        mock: '`load` は呼ばれた回数を数える関数'
        expected: 場所が `mdmark-syntax-warning` になり、`load` が 0 回
      - name: test_load_libraries_when_extension_fails
        case: 異常
        summary: load の拒否と validate の拒否は拡張の通知ブロックにする
        condition: '`load` が拒否される拡張と、`validate` が拒否される拡張の場所'
        mock: '`console.error` を記録する関数で包む'
        expected: どちらも `mdmark-notice` で本文が `表示に使用する拡張（…）` で始まり、`console.error` に拡張の名前と元のエラー
      - name: test_load_libraries_when_embedded
        case: 正常
        summary: 埋めた外部ライブラリは URL を読み込まずに表の関数で読み込み、表に無い名前は通知ブロックにする
        condition: '`setEmbeddedLibraries({ "test-lib": 関数 })` の後に、`test-lib` と `other` のマーカーの場所。対応表は両方を持つ。終えたら `setEmbeddedLibraries(undefined)`'
        mock: '`importModule` を見張る。表の関数は `draw` を持つモジュールを返却する'
        expected: '`importModule` が呼ばれず、`test-lib` の場所が `data-mdmark-drawn` を持ち、`other` の場所が `renderNotice` の HTML に替わる'
  - name: attachPrint
    title: 印刷の前後で折り畳みと記法を開く
    container: src/print.ts
    kind: 関数
    scope: internal
    summary: '`beforeprint` で要素の中の閉じた `details`・閉じたセクション・行の詳細・ファイルツリーの閉じたフォルダ・コードブロックの畳んだ行・列を畳んだ ER 図のテーブル・畳んだ階層の表の行・隠した YAML の見本を開き、タブの全ての中身を出し、`afterprint` で開いたものだけを戻す受け取りを `window` に付け、削除する関数を返却する'
    side_effects: '`window` に受け取りを付ける。`details` の `open` を書き換える'
    args:
      - name: options
        type: '{ root: HTMLElement; isEnabled: () => boolean }'
        required: true
        description: '`root` は描いた要素、`isEnabled` は印刷の機能がオンか（印刷のたびに読み込む）'
    returns:
      type: () => void
      description: 受け取りを解除する関数
    process: |-
      1. `beforeprint` を受けたとき、`isEnabled()` が `true` なら、次の処理をし、変えたものを記録する
         - `open` を持たない `details` を開く
         - `hidden` を持つ `mdmark-section-body`・`mdmark-row-detail`・`div.mdmark-tree` の入れ子の `ul` の `hidden` を削除する（ツリーの `ul` は、そのフォルダの `mdmark-tree-toggle` を `aria-expanded="true"` にする）
         - `aria-expanded="false"` の `mdmark-code-fold` を `setCodeFoldOpen` で開く
         - `aria-expanded="false"` の `mdmark-diagram-er-fold` のテーブルを `setErTableFolded` で開く（関係の線をもう一度結ぶ）
         - `role="tabpanel"` の `hidden` を削除し、`mdmark-tabs` に `data-printing` を付ける（印刷の CSS がタブの並びを隠し、タブ名のタイトルを出す）
      2. `afterprint` を受けたとき、記録したものを元に戻し（セクションとツリーの入れ子の `ul` は `hidden="until-found"`、ツリーの開閉のボタンは `aria-expanded="false"`、行の詳細とタブの中身は `hidden`、コードブロックの行は `setCodeFoldOpen` で、ER 図のテーブルは `setErTableFolded` でもう一度畳む、`data-printing` を削除する）、記録を空にする
      3. 削除する関数は、2 つの受け取りを `window` から除外する
    unit_tests:
      - name: test_attach_print
        case: 正常
        summary: 印刷の前に閉じた折り畳みを開き、後に開いたものだけをもう一度閉じる
        condition: 閉じた `details` と開いた `details`。`isEnabled` は `true`
        mock: なし
        expected: '`beforeprint` の後に 2 つとも `open` を持ち、`afterprint` の後に初めに閉じていた方だけが `open` を持たない'
      - name: test_attach_print_when_disabled
        case: 正常
        summary: 印刷の機能がオフなら開かない
        condition: 閉じた `details`。`isEnabled` は `false`
        mock: なし
        expected: '`beforeprint` の後も `open` を持たない'
      - name: test_attach_print_when_detached
        case: 正常
        summary: 削除した後は受け取らない
        condition: 削除する関数を呼んだ後に `beforeprint` を送信する
        mock: なし
        expected: '`details` が `open` を持たない'
      - name: test_attach_print_when_syntax
        case: 正常
        summary: 印刷の前に閉じたセクション・行の詳細・タブの中身を出し、後に戻す
        condition: 操作を付けた、閉じたセクション・閉じた行の詳細・2 つ目を選んだタブ
        mock: なし
        expected: '`beforeprint` の後にどれも `hidden` を持たず、`afterprint` の後にセクションが `hidden="until-found"`、行の詳細が `hidden`、1 つ目のタブの中身が `hidden`'
      - name: test_attach_print_when_tree
        case: 正常
        summary: 印刷の前にファイルツリーの閉じたフォルダを開き、後にもう一度閉じる
        condition: 操作を付けた、`src/` が閉じたファイルツリー。`isEnabled` は `true`
        mock: なし
        expected: '`beforeprint` の後に `src/` の入れ子の `ul` が `hidden` を持たず `src/` のボタンが `aria-expanded="true"`、`afterprint` の後に `ul` が `hidden="until-found"` を持ちボタンが `aria-expanded="false"`'
      - name: test_attach_print_when_code_folded
        case: 正常
        summary: 印刷の前にコードブロックの畳んだ行を開き、後にもう一度畳む
        condition: 操作を付けた、2 行目を畳んだコードブロックと、入れ子の注意書きを閉じた `details`。`isEnabled` は `true`
        mock: なし
        expected: '`beforeprint` の後に 3 行目以降が `hidden` を持たず、内側の注意書きの `details` も `open` を持つ。`afterprint` の後に 2 行目のボタンが `aria-expanded="false"` で後ろの行が `hidden`、内側の `details` が `open` を持たない'
      - name: test_attach_print_when_er_folded
        case: 正常
        summary: 印刷の前に ER 図の畳んだテーブルを開き、後にもう一度畳む
        condition: 操作を付けた、モックの `shop-er-folded` の ER 図。`isEnabled` は `true`
        mock: なし（Chromium）
        expected: '`beforeprint` の後に注文のテーブルの全ての列の行が `hidden` を持たず開閉のボタンが `aria-expanded="true"`、`afterprint` の後に主キーと外部キー以外の列の行が `hidden` を持ちボタンが `aria-expanded="false"`'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[setFolderOpen]
      - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[setCodeFoldOpen]
