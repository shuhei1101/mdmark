  - name: runUpgrade
    title: バージョンを上げる
    container: src/cli/upgrade.ts
    usecase: バージョンを上げる
    summary: 手元のバージョンから呼んだ CLI のバージョンまでの移行の手順を当て、点検が通ったら設定のバージョンを書き換える
    description: '順に、設定を探して読み込む（`findConfigFile`・`loadConfig`）→ 手元のバージョン（設定の `version`、無ければ `ask`）→ 目標のバージョン（`options.cliVersion`）と比べる（新しければ `CliError`、同じならその旨を出して 0）→ `loadMigrationVersions` → 当て先を作る（索引は設定の `index`、文書は `collectBuildDocuments` と `readIndexWithDocuments` の文書）→ 手順と `changelogRows` の行を出す → `--plan` ならその旨を出して 0 → キーが無い `set_default` の `ask` を適用する順に聞く → 壊すマーカーがあり `--yes` が無ければ確認し、`CONFIRM_ANSWER` 以外なら `CliError` → `takeBackup`（`stepFiles`）→ バージョンの順に `applyStep`（返った行があれば、`{バージョン} の手順「{説明}」:` の行に続けて 2 字下げて標準出力へ出す） → `collectCheckIssues`（`unknownMarks: false`）→ ずれがあれば `restoreBackup` してずれの行を標準エラーに出し 1 → `writeConfigVersion` → コピーの場所とバージョンを出して 0。`applyStep` が投げた `CliError` は `restoreBackup` してからもう一度投げる。質問に回答が無い（`undefined`）ときは、書き換えの前に `CliError` を投げる。`settings` が真のときは、設定を探す代わりに `resolveSettingsPath` の端末の設定を読み込み、`file: config` 以外の手順（`files` が `[config]` だけの `call` は残す）と索引・文書の当て先を飛ばし、点検は `validateConfig`（`settings: true`）だけにする。`config` と一緒なら `CliError`'
    kind: 関数
    scope: public
    is_async: true
    side_effects: 設定・索引・文書を書き換え、コピーを配置する
    args:
      - name: options
        type: '{ config?: string | undefined; settings: boolean; plan: boolean; yes: boolean; packageDir: string; cliVersion: string; now: Date }'
        required: true
        description: '`--config`・`--settings`・`--plan`・`--yes`・パッケージの直下（`migrations/` と変更履歴の基準）・目標のバージョン（`cliVersion()`。テストで差し替える）・今の時刻'
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
      - name: ask
        type: Prompter
        required: true
        description: 質問（テストで差し替える）
    returns:
      type: Promise<0 | 1>
      description: 適用した・示した・適用する手順が無いとき 0、点検のずれで戻したとき 1
    exceptions:
      - name: CliError
        condition: 設定ファイルが無い・読み込めない
        message: '`findConfigFile`・`loadConfig` のメッセージ'
      - name: CliError
        condition: 手元のバージョンの書式が違う
        message: 手元のバージョン {値} の書式が違います。v{MAJOR}.{MINOR}.{PATCH} で記載してください。
      - name: CliError
        condition: 質問に回答する前に入力が終わった
        message: 「{質問}」に回答がありません。何も書き換えていません。
      - name: CliError
        condition: 手元のバージョンが目標のバージョンより新しい
        message: 手元のバージョン {手元のバージョン} はこの mdmark（{目標のバージョン}）より新しいです。npx github:shuhei1101/mdmark#{手元のバージョン} upgrade のように、手元のバージョン以上の mdmark で呼んでください。
      - name: CliError
        condition: 壊す手順の確認を断った
        message: 何も適用していません。確認せずに適用するときは --yes を付けてください。
      - name: CliError
        condition: 手順のファイルの誤り・手順の失敗・コピーを取れない
        message: '`loadMigrationVersions`・`applyStep`・`takeBackup` のメッセージ（手順の失敗はコピーから戻した後）'
      - name: CliError
        condition: '`--config` と `--settings` を一緒に指定した'
        message: --config と --settings は一緒に指定できません。
    unit_tests:
      - name: test_run_upgrade
        case: 正常
        summary: 2 つのバージョンの手順を適用してバージョンを書き換える
        condition: '`version: v0.3.0` の設定、パッケージは `v0.5.0` で `v0.4.0`（`rename_key`）・`v0.5.0`（`replace_mark`）を持つ'
        mock: 一時フォルダのパッケージと設定、出力を配列に貯める `CliIo`、呼ばれたら失敗にする `Prompter`
        expected: 0 を返却し、キーとマーカーが書き換わり、`version` が `v0.5.0`、標準出力の最後が `バージョンを v0.5.0 にしました`
      - name: test_run_upgrade_when_plan
        case: 正常
        summary: --plan は何も書き換えない
        condition: 'test_run_upgrade と同じで `plan: true`'
        mock: test_run_upgrade と同じ
        expected: 0 を返却し、設定・文書が変わらず `.mdmark/` が無い
      - name: test_run_upgrade_when_up_to_date
        case: 正常
        summary: 同じバージョンなら何も適用しない
        condition: '`version: v0.5.0` の設定'
        mock: test_run_upgrade と同じ
        expected: 0 を返却し、標準出力に `適用する手順はありません` が出る
      - name: test_run_upgrade_when_version_missing
