  - name: migrateAliasRows
    title: エイリアスの元の行を新しい構造へ書き換える
    container: migrations/next/alias-rows.mjs
    usecase: バージョンを上げる
    kind: 関数
    scope: public
    summary: 設定の `aliases` の v0.2.0 の構造の行を、alias-inject v0.3.0 の構造へ書き換える移行の手順のスクリプトの処理
    description: '`steps.yaml` の `call`（`destructive: true`・`files: [config]`。`description` は ``設定の `aliases` の行を alias-inject v0.3.0 の構造へ書き換える（値を失うのは `metadata` に固定値を記載した行だけ）``）が実行する。スクリプトとして呼ばれると、`--config` の設定ファイルを `yaml` の `parseDocument` で読み込み、この関数を呼ぶ。`problems` があれば書き戻さずに標準エラーへ 1 行ずつ書き込んで 1 で終わり、無ければ `changed` のときだけ `doc.toString({ flowCollectionPadding: false })` で書き込んで戻し、`notices` を標準出力へ 1 行ずつ書き込んで 0 で終わる。行ごとに、`metadata.alias_type` を持つ行だけを書き換える（行の `alias_type` を持つ行と、`metadata.alias_type` を持たない行は触らない）。`{type: custom, value}` は `value` を行の `alias_type` にする。`{type: ref, field}` は、行の `paths` を設定ファイルのフォルダから `node:fs/promises` の `glob` で参照した YAML のレコード（`records` を持つ行はそのキーの配列の要素、持たない行はファイルの値）の `field` の列の値を重ねずに集め（YAML として読み込めないファイルがあれば `problems` に ``aliases[{行}]（{id}）の `{パス}` を YAML として読み込めません。字下げと記載方法を修正してください。`` を追加してその行を書き換えない）、1 つだけならその値を行の `alias_type` にする。0 個なら `problems` に ``aliases[{行}]（{id}）はレコードが無く、種類を決められません。行に `alias_type` を記載してください。`` を追加し、2 個以上なら `problems` に ``aliases[{行}]（{id}）はレコードの `{field}` から種類を 1 つに決められません（{集めた値を `・` で並べた}）。種類ごとに行を分け、行に `alias_type` を記載してください。`` を追加する。`metadata` のほかのキーは、`{type: ref, field}` を `field` の文字列にし、`{type: custom, value}` はキーを除いて `notices` に ``aliases[{行}]（{id}）の `metadata.{キー}` の固定値 `{value}` を除外しました。必要なら YAML の列に記載してください。`` を追加する。`metadata.alias_type` を除き、空になった `metadata` も除く。もう一度適用しても結果が変わらない。単体テストは `migrations/*/alias-rows.mjs` を探して import し、release で `next/` をバージョンのフォルダへ移した後も同じテストで読み込む'
    is_async: true
    args:
      - name: options
        type: '{ doc: Document; configDir: string }'
        required: true
        description: 設定ファイルを `parseDocument` で読み込んだ文書と、設定ファイルのあるフォルダの絶対パス
    returns:
      type: 'Promise<{ changed: boolean; notices: string[]; problems: string[] }>'
      description: '`doc` を書き換えたか・除外した固定値の通知・種類を決められない行の修正方法（並びは行の順）'
    side_effects: '`doc` を書き換え、`paths` の YAML を読み込む'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/バージョンを上げる.ts#constraints[スクリプトの呼び方]
      - dev/設計書/ER図/エイリアス#tables[aliases]
    unit_tests:
      - name: test_migrate_alias_rows
        case: 正常
        summary: custom と種類が 1 つの ref の alias_type を行へ移し、ref の値を列名にする
        condition: 単一ユースケース『バージョンを上げる』の「正常シナリオ（エイリアスの元の行を新しい構造へ書き換える）」の `terms`・`commands` の 2 行とその YAML
        mock: 一時フォルダ
        expected: '`terms` が `alias_type: term`・`metadata: {name: term, description: meaning}`、`commands` が `alias_type: command` で `metadata` を持たず、`changed` が `true`、`notices`・`problems` が空。設定のコメントが残る'
      - name: test_migrate_alias_rows_when_custom_value
        case: 正常
        summary: alias_type 以外の custom のキーを除外して通知する
        condition: '`cwd` を `{type: custom, value: リポジトリの直下}` で取る `command` の行 `tests`'
        mock: 一時フォルダ
        expected: '`metadata` が `cwd` を持たず、`notices` が 1 件で `tests`・`cwd`・`リポジトリの直下` を含む'
      - name: test_migrate_alias_rows_when_mixed_types
        case: 異常
        summary: ref の列の種類が 2 つ以上の行を problems にする
        condition: レコードの `alias_type` に `term` と `command` が混ざる行 `mixed`
        mock: 一時フォルダ
        expected: '`problems` が 1 件で `mixed`・`term`・`command` を含む'
      - name: test_migrate_alias_rows_when_already_migrated
        case: 正常
        summary: v0.3.0 の構造の行は触らない
        condition: '`alias_type: term`・`metadata: {name: term}` の行'
        mock: なし
        expected: '`changed` が `false`、`notices`・`problems` が空'
      - name: test_migrate_alias_rows_when_no_records
        case: 異常
        summary: ref の行のレコードが 0 件なら、alias_type の記載を求める problems にする
        condition: '`alias_type` を `{type: ref, field: alias_type}` で取り、`paths` に該当するファイルが無い行 `empty`'
        mock: 一時フォルダ
        expected: '`problems` が 1 件で `empty` と `alias_type` を含み、「行を分け」を含まない'
      - name: test_migrate_alias_rows_when_unreadable
        case: 異常
        summary: YAML として読み込めないファイルを problems にし、例外を投げない
        condition: '`alias_type` を `{type: ref, field: alias_type}` で取り、`paths` に該当するファイルが字下げの崩れた YAML の行 `broken`'
        mock: 一時フォルダ
        expected: 例外を投げず、`problems` が 1 件で `broken` とファイルのパスを含み、`changed` が `false`
    status: planned
    introduced:
      pr: 360
  - name: dropTagVocabulary
    title: 索引からタグの語彙を削除する
    kind: 関数
    container: migrations/next/drop-tag-vocabulary.mjs
    usecase: バージョンを上げる
    summary: v0.9.0 までの索引の YAML の文字列から、文書のタグの別名・やめたタグを語彙の `name`・振り替え先に書き換え、最上位の `tags` を削除して `schema` を `2` にした YAML を返却する
    description: '`yaml` の `parseDocument` で読み込み、コメントとキーの並びを保って `doc.toString({ flowCollectionPadding: false })` で書き込んで戻す。語彙の並びで先のタグを優先し、別名から `name` へ、`deprecated` を持つタグの `name` から振り替え先への表を作る。文書のタグの名前（文字列の要素はその文字列、オブジェクトの要素は `name`）を、別名なら `name` に、その結果がやめたタグなら振り替え先に 1 回だけ書き換える。書き換えで同じ文書に同じ名前が 2 つ以上できたら先の 1 つを残し、どれかが `main: true` なら残す要素を `main: true` のオブジェクトにする。最上位の `tags` を削除し、`schema` が `1` なら `2` にする。変えるものが無ければ `undefined` を返却する（もう一度適用しても結果が変わらない）。ファイルの読み込みと保存は `runDropTagVocabulary` が持つ。`migrations/next/` は release で `migrations/v{版}/` へ移る'
    scope: internal
    is_async: false
    args:
      - name: source
        type: string
        required: true
        description: 索引の YAML の文字列
    returns:
      type: string | undefined
      description: 書き換えた YAML。変えるものが無ければ `undefined`
    unit_tests:
      - name: test_drop_tag_vocabulary
        case: 正常
        summary: 別名・やめたタグを書き換え、語彙を削除して `schema` を `2` にする
        condition: '`schema: 1`、語彙が `topic:mcp`（`aliases` に `MCP`）・`topic:old`（`deprecated` が `topic:mcp`）・`topic:yaml`、`docs[0].tags` が `[MCP, {name: topic:old, main: true}, topic:yaml, 設計]`、最上位のコメントを持つ YAML'
        mock: なし
        expected: '`schema` が `2`、最上位に `tags` が無く、`docs[0].tags` が `[{name: topic:mcp, main: true}, topic:yaml, 設計]`、コメントが残る'
      - name: test_drop_tag_vocabulary_without_vocabulary
        case: 正常
        summary: '語彙を持たない `schema: 1` の索引は `schema` だけを `2` にする'
        condition: '`schema: 1` で最上位の `tags` を持たず、`docs[0].tags` が `[MCP]` の YAML'
        mock: なし
        expected: '`schema` が `2` で、ほかは入力と同じ'
      - name: test_drop_tag_vocabulary_when_reapplied
        case: 正常
        summary: 適用した後の索引では `undefined` を返却する
        condition: '`test_drop_tag_vocabulary` の戻り値'
        mock: なし
        expected: '`undefined`'
  - name: runDropTagVocabulary
    title: 設定の索引からタグの語彙を削除する
    kind: 関数
    container: migrations/next/drop-tag-vocabulary.mjs
    usecase: バージョンを上げる
    summary: '`call` のスクリプトの入口。`--config` の設定ファイルの `index` が指す索引を `dropTagVocabulary` で書き換えて書き込んで戻す'
    description: '`applyStep` が `[{スクリプト}, "--config", {設定ファイル}]` で実行する。ファイルを直接流したとき（`import.meta.url` が `process.argv[1]` の `pathToFileURL` の `href`）だけ `process.argv.slice(2)` で呼ぶ。`--config` の次の値を設定ファイルのパスにし、設定を `yaml` の `parse` で読み込む。設定に `index` が無ければ何もせずに返却する（`applyStep` の `file: index` と同じ扱い）。`index` を設定ファイルのフォルダからの相対パスとして索引を読み込み、`dropTagVocabulary` の戻り値が `undefined` でなければ書き込んで戻す。`--config` が無い・設定や索引を読み込めないときは例外を投げ、Node が 0 以外の終了コードで終わる'
    scope: internal
    is_async: true
    args:
      - name: argv
        type: string[]
        required: true
        description: スクリプトの引数（`["--config", {設定ファイル}]`）
    returns:
      type: Promise<void>
      description: 書き込んで戻した後に解決する
    unit_tests:
      - name: test_run_drop_tag_vocabulary
        case: 正常
        summary: 設定の `index` が指す索引を書き換える
        condition: '一時フォルダに `index: docs/index.yaml` の設定と、`test_drop_tag_vocabulary` の入力の索引を配置し、`["--config", {設定ファイル}]` で呼ぶ'
        mock: なし（一時フォルダ）
        expected: 索引のファイルが `test_drop_tag_vocabulary` の期待値と同じ中身になる
      - name: test_run_drop_tag_vocabulary_without_index
        case: 正常
        summary: 設定に `index` が無ければ何も書き換えない
        condition: '`index` を持たない設定だけの一時フォルダ'
        mock: なし（一時フォルダ）
        expected: 例外を投げず、フォルダの中身が変わらない
      - name: test_run_drop_tag_vocabulary_without_config
        case: 異常
        summary: '`--config` が無ければ例外を投げる'
        condition: '`[]` で呼ぶ'
        mock: なし
        expected: 例外を投げる
    callees:
      - '#functions[dropTagVocabulary]'
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/バージョンを上げる.ts#
  - dev/設計書/ER図/移行の手順#
