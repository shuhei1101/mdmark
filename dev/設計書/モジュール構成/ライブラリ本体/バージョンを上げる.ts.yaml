title: ライブラリ本体 / バージョンを上げる
lead: '`mdmark upgrade` の処理。バージョンの読み取りと比較、移行の手順の読み取り・検め・適用、コピーと戻し、変更履歴の行の抽き出し、標準入力での質問を持ち、`runUpgrade` がこれらと CLI の点検をつなぐ。'
directory: |-
  ```tree
  src/cli/
  ├── versions.ts    # バージョンの書式・比較・呼んだ CLI のバージョン
  ├── migrations.ts  # 移行の手順の読み取り・構造の検め・適用
  ├── backup.ts      # 適用する前のコピーとコピーからの戻し
  ├── changelog.ts   # 変更履歴の表から範囲の行を抽き出す
  ├── prompt.ts      # 標準入力の 1 行を回答にする質問
  └── upgrade.ts     # mdmark upgrade
  schemas/
  └── mdmark.steps.schema.json  # steps.yaml の JSON Schema
  migrations/
  ├── v{バージョン}/        # 出したバージョンの steps.yaml とスクリプト
  ├── next/          # 出していないバージョンの steps.yaml とスクリプト
  │   ├── steps.yaml
  │   └── alias-rows.mjs  # 設定の aliases の行を alias-inject v0.3.0 の構造へ書き換える
  └── no-steps.yaml  # 移行の手順が要らないスキーマの変更の一覧
  ```
function_types:
  - name: Prompter
    title: 質問
    container: src/cli/prompt.ts
    summary: 質問の文を出し、回答の 1 行を返却する。回答する前に入力が終わったら `undefined` を返却する
    args:
      - name: question
        type: string
        required: true
        description: 質問の文
    returns:
      type: Promise<string | undefined>
      description: 前後の空白を落とした回答し、入力が終わっていれば `undefined`
data_models:
  - name: MigrationStep
    title: 移行の手順
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: '`steps.yaml` の `steps` の要素 1 つ。`op` で分けた判別子つきユニオン'
    properties:
      - name: op
        type: '"rename_key" | "set_default" | "map_values" | "replace_mark" | "call"'
        description: 手順の種類。残りのプロパティは種類ごとに ER 図『移行の手順』の必須のとおりに持つ
      - name: description
        type: string
        description: 何をどう変えるかの 1 文
      - name: destructive
        type: boolean
        default: 'false'
        description: 壊すマーカー
      - name: file
        type: '"config" | "index"'
        description: '`rename_key`・`set_default`・`map_values` が書き換える YAML'
      - name: from
        type: string
        description: '`rename_key` の元のキーのパス、`replace_mark` の書き換える前のマーカー'
      - name: to
        type: string
        description: '`rename_key` の新しいキーのパス、`replace_mark` の書き換えた後のマーカー'
      - name: key
        type: string
        description: '`set_default`・`map_values` のキーのパス'
      - name: value
        type: unknown
        description: '`set_default` が追加する値'
      - name: ask
        type: string
        description: '`set_default` が値を聞く質問の文'
      - name: mapping
        type: Record<string, unknown>
        description: '`map_values` の解釈しの表'
      - name: script
        type: string
        description: '`call` のスクリプトの、`steps.yaml` のあるフォルダからの相対パス'
      - name: files
        type: ("config" | "index" | "documents")[]
        description: '`call` が書き換えうるもの'
    refs:
      - dev/設計書/ER図/移行の手順#tables[migrations/{版}/steps.yaml]
  - name: MigrationVersion
    title: 適用するバージョン
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 適用する 1 つのバージョンと、そのバージョンの検めた手順
    properties:
      - name: version
        type: string
        description: バージョン（`v{MAJOR}.{MINOR}.{PATCH}`）
      - name: dir
        type: string
        description: そのバージョンのフォルダの絶対パス（`call` のスクリプトの基準）
      - name: steps
        type: MigrationStep[]
        description: 記載した順の手順
  - name: MigrationTarget
    title: 手順の当て先
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 手順を適用する設定・索引・文書の場所と、適用する前に聞いた回答
    properties:
      - name: configPath
        type: string
        description: 設定ファイルの絶対パス
      - name: indexPath
        type: string | undefined
        description: 設定の `index` が指す索引の絶対パス。設定に `index` が無ければ `undefined`
      - name: documents
        type: string[]
        description: '`build` の対象と索引の文書の絶対パス（重なりなし）'
      - name: answers
        type: Map<MigrationStep, string>
        description: '`ask` を持つ `set_default` に回答した値'
  - name: ChangelogRow
    title: 変更履歴の行
    container: src/cli/changelog.ts
    usecase: バージョンを上げる
    summary: 変更履歴の表の 1 行
    properties:
      - name: version
        type: string
        description: バージョンの列
      - name: pr
        type: string
        description: PR の列のリンクの文字（`#40`）
      - name: change
        type: string
        description: 変更の列
constants:
  - name: VERSION_PATTERN
    title: バージョンの書式
    container: src/cli/versions.ts
    summary: 手元のバージョン・パッケージのバージョン・移行の手順のフォルダ名が合うべき書式
    value: '`/^v(\d+)\.(\d+)\.(\d+)$/`'
  - name: MIGRATIONS_DIR
    title: 移行の手順のフォルダ
    container: src/cli/migrations.ts
    summary: パッケージの直下からの移行の手順のフォルダと、その中の名前
    entries:
      - key: root
        value: '`migrations`'
      - key: next
        value: '`next`'
      - key: steps
        value: '`steps.yaml`'
      - key: noSteps
        value: '`no-steps.yaml`'
  - name: SCRIPT_EXTENSIONS
    title: スクリプトの拡張子
    container: src/cli/migrations.ts
    summary: '`call` のスクリプトに許す拡張子（`node_modules` の下で実行できるものだけ）'
    value: '`[".js", ".mjs"]`'
  - name: BACKUP_DIR
    title: コピーのフォルダ
    container: src/cli/backup.ts
    summary: 設定ファイルのあるフォルダからのコピーの配置場所と、中身が `*` の `.gitignore` を配置するフォルダ
    entries:
      - key: root
        value: '`.mdmark`'
      - key: backups
        value: '`.mdmark/backup`'
  - name: CHANGELOG_FILE
    title: 変更履歴のファイル
    container: src/cli/changelog.ts
    summary: パッケージの直下からの変更履歴のパス
    value: '`docs/はじめに/変更履歴.md`'
  - name: CONFIRM_ANSWER
    title: 承諾の回答
    container: src/cli/upgrade.ts
    summary: 壊す手順の確認で承諾とする回答し
    value: '`y`'
functions:
  - name: parseVersion
    title: バージョンを読み込む
    container: src/cli/versions.ts
    usecase: バージョンを上げる
    summary: '`v{MAJOR}.{MINOR}.{PATCH}` を 3 つの数にする。書式が違えば `undefined`'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: バージョンの文字列
    returns:
      type: '[number, number, number] | undefined'
      description: MAJOR・MINOR・PATCH
    unit_tests:
      - name: test_parse_version
        case: 正常
        summary: バージョンを 3 つの数にする
        condition: '`v0.12.3`'
        mock: なし
        expected: '`[0, 12, 3]`'
      - name: test_parse_version_when_invalid
        case: 異常
        summary: 書式の違うバージョンは undefined
        condition: '`0.3`・`v0.3`・`v0.3.0-rc`'
        mock: なし
        expected: どれも `undefined`
    status: planned
    introduced:
      pr: 39
  - name: compareVersions
    title: バージョンを比べる
    container: src/cli/versions.ts
    usecase: バージョンを上げる
    summary: 2 つのバージョンを MAJOR・MINOR・PATCH の順に数として比べる
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: a
        type: string
        required: true
        description: 書式の合うバージョン
      - name: b
        type: string
        required: true
        description: 書式の合うバージョン
    returns:
      type: -1 | 0 | 1
      description: '`a` が古ければ -1、同じなら 0、新しければ 1'
    exceptions:
      - name: Error
        condition: どちらかが `VERSION_PATTERN` に合わない（呼ぶ側の不具合）
        message: 'バージョンの書式が違います: {バージョン}'
    unit_tests:
      - name: test_compare_versions
        case: 正常
        summary: 桁ごとに数として比べる
        condition: '`v0.10.0` と `v0.9.9`、`v1.0.0` と `v1.0.0`、`v0.3.0` と `v0.4.0`'
        mock: なし
        expected: 1・0・-1
    status: planned
    introduced:
      pr: 39
  - name: validateSteps
    title: 移行の手順の構造を検める
    container: src/cli/migrations.ts
    usecase: 共通
    summary: 読み込んだ `steps.yaml` を `schemas/mdmark.steps.schema.json` と同じ構造で検め、手順の並びと合わないところを返却する
    description: 検めるのは、最上位が `steps`（配列）だけを持つこと・各手順の `op` が 5 つのどれかで `description` が空でないこと・`op` ごとの必須のプロパティ・`set_default` が `value` か `ask` のどちらか 1 つだけを持つこと・`replace_mark` の `to` が `from` を含まないこと・`map_values` の解釈しの表の新しい値が元の値に無いこと・`call` の `script` の拡張子が `SCRIPT_EXTENSIONS` のどれかで `files` が 1 つ以上。構造の検査は `validateConfig` と同じく手書きで、ライブラリを追加しない。配布物のビルドもこの関数で検める
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: raw
        type: unknown
        required: true
        description: YAML として読み込んだ値
      - name: file
        type: string
        required: true
        description: 合わないところに出すファイルの名前（`migrations/v0.5.0/steps.yaml` など）
    returns:
      type: '{ steps: MigrationStep[]; problems: string[] }'
      description: '構造の合う手順と、合わないところ 1 つ 1 文（`{ファイル}: steps[{番号}].{キー}: {内容}`）。`problems` が空でなければ `steps` を使用しない'
    unit_tests:
      - name: test_validate_steps
        case: 正常
        summary: 5 つの種類の手順をそのまま返却する
        condition: '`rename_key`・`set_default`（`value`）・`map_values`・`replace_mark`・`call`（`.mjs`）を 1 つずつ持つ値'
        mock: なし
        expected: '`problems` が空で、`steps` が 5 つ'
      - name: test_validate_steps_when_required_missing
        case: 異常
        summary: op の必須のプロパティが無いと合わないところを返却する
        condition: '`replace_mark` が `to` を持たない'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].to` を含む'
      - name: test_validate_steps_when_not_reapplicable
        case: 異常
        summary: もう一度適用すると結果が変わる手順を拒む
        condition: '`to` が `from` を含む `replace_mark` と、新しい値が元の値にある `map_values`'
        mock: なし
        expected: '`problems` が 2 つ'
      - name: test_validate_steps_when_script_ts
        case: 異常
        summary: 拡張子 .ts のスクリプトを拒む
        condition: '`script: move.ts` の `call`'
        mock: なし
        expected: '`problems` が 1 つで `steps[0].script` を含む'
    status: planned
    introduced:
      pr: 39
  - name: loadMigrationVersions
    title: 適用するバージョンを読み込む
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: パッケージの `migrations/` から手元のバージョンより新しく目標のバージョン以下の `v{バージョン}` をバージョンの昇順に読み込み、構造を検めて返却する
    description: '`v{バージョン}` でないフォルダ（`next` を含む）とファイルは飛ばす。`migrations/` が無ければ空の並びを返却する。全てのバージョンを検めてから、合わないところを 1 つの `CliError` にまとめて投げる。`call` のスクリプトはバージョンのフォルダの配下にあることを確認する'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ packageDir: string; from: string; to: string }'
        required: true
        description: パッケージの直下・手元のバージョン・目標のバージョン
    returns:
      type: Promise<MigrationVersion[]>
      description: 適用するバージョンの並び（昇順）
    exceptions:
      - name: CliError
        condition: '`steps.yaml` を読み込めない・構造が合わない、`call` のスクリプトが無いかバージョンのフォルダの外を指す'
        message: 移行の手順に誤りがあります（{合わないところを `、` でつないだもの}）。mdmark をもう一度入れてください。
    unit_tests:
      - name: test_load_migration_versions
        case: 正常
        summary: 範囲のバージョンだけを昇順に返却する
        condition: '`v0.3.0`・`v0.4.0`・`v0.10.0`・`next` のフォルダ、`from: v0.3.0`・`to: v0.10.0`'
        mock: 一時フォルダのパッケージ
        expected: '`v0.4.0`・`v0.10.0` の 2 つ'
      - name: test_load_migration_versions_when_steps_invalid
        case: 異常
        summary: 構造の合わないバージョンがあれば CliError
        condition: '`v0.4.0` の手順が `op` を持たない'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` の文に `migrations/v0.4.0/steps.yaml` と `steps[0].op` が入る'
      - name: test_load_migration_versions_when_script_outside
        case: 異常
        summary: バージョンのフォルダの外を指すスクリプトを拒む
        condition: '`script: ../x.mjs` の `call`'
        mock: 一時フォルダのパッケージ
        expected: '`CliError` を投げる'
    refs:
      - '#functions[validateSteps]'
      - '#functions[compareVersions]'
    status: planned
    introduced:
      pr: 39
  - name: renameKey
    title: キーの名前を変える
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: YAML の Document で、元のキーがあり新しいキーが無いときだけ、値とコメントを保って新しいキーへ移す
    description: キーのパスは `.` で区切る。新しいキーが同じ親の下なら元のキーの位置で名前だけを替え、親が違えば新しい親の末尾に移す（無い親は作る）
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: from
        type: string
        required: true
        description: 元のキーのパス
      - name: to
        type: string
        required: true
        description: 新しいキーのパス
    returns:
      type: boolean
      description: 書き換えたら `true`
    unit_tests:
      - name: test_rename_key
        case: 正常
        summary: 同じ親の下で名前を変え、位置とコメントを保つ
        condition: '`build:` の下に `# 書き出す先` のコメントつきの `out` と `include` がある。`build.out` → `build.output`'
        mock: なし
        expected: '`true` を返却し、文字列にすると `output` が `out` の位置にありコメントが残る'
      - name: test_rename_key_when_already_renamed
        case: 正常
        summary: 新しいキーがあれば何もしない
        condition: '`build.output` だけがある'
        mock: なし
        expected: '`false` を返却し、文字列が変わらない'
    status: planned
    introduced:
      pr: 39
  - name: setDefault
    title: 無いキーを追加する
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: キーが無いときだけ値を追加する
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: value
        type: unknown
        required: true
        description: 追加する値
    returns:
      type: boolean
      description: 追加したら `true`
    unit_tests:
      - name: test_set_default
        case: 正常
        summary: 無いキーを追加する
        condition: '`features.diff` が無い。値 `true`'
        mock: なし
        expected: '`true` を返却し、`features.diff` が `true`'
      - name: test_set_default_when_present
        case: 正常
        summary: あるキーは変えない
        condition: '`features.diff: false` がある'
        mock: なし
        expected: '`false` を返却し、値が `false` のまま'
    status: planned
    introduced:
      pr: 39
  - name: mapValues
    title: 値を解釈する
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: キーの値が解釈しの表の元の値のときだけ新しい値に替える
    description: 値が配列のときは要素ごとに替える。比べるのは YAML の値としての一致
    kind: 関数
    scope: public
    is_async: false
    side_effects: '`doc` を書き換える'
    args:
      - name: doc
        type: Document
        required: true
        description: yaml の Document
      - name: key
        type: string
        required: true
        description: キーのパス
      - name: mapping
        type: Record<string, unknown>
        required: true
        description: 元の値から新しい値への表
    returns:
      type: boolean
      description: 替えたら `true`
    unit_tests:
      - name: test_map_values
        case: 正常
        summary: 表にある値を替え、無い値は残す
        condition: '`build.include: [docs/**/*.md, a.md]`、表 `{ "docs/**/*.md": "**/*.md" }`'
        mock: なし
        expected: '`true` を返却し、`[**/*.md, a.md]`'
      - name: test_map_values_when_no_match
        case: 正常
        summary: もう一度適用しても変わらない
        condition: 替えた後の値に同じ表を適用する
        mock: なし
        expected: '`false` を返却する'
    status: planned
    introduced:
      pr: 39
  - name: replaceMark
    title: マーカーを書き換える
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 文書の本文の `from` を全て `to` にする
    description: 文字列として一致した箇所を替える（正規表現にしない）。`to` は `from` を含まないため、もう一度適用しても結果が変わらない
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: text
        type: string
        required: true
        description: 文書の本文
      - name: from
        type: string
        required: true
        description: 書き換える前のマーカー
      - name: to
        type: string
        required: true
        description: 書き換えた後のマーカー
    returns:
      type: string
      description: 書き換えた本文
    unit_tests:
      - name: test_replace_mark
        case: 正常
        summary: 全てのマーカーを書き換える
        condition: '`<!-- note -->` を 2 つ持つ本文、`<!-- note -->` → `<!-- callout -->`'
        mock: なし
        expected: 2 つとも `<!-- callout -->` になり、他の文字が変わらない
    status: planned
    introduced:
      pr: 39
  - name: stepFiles
    title: 手順が書き換えうるファイル
    container: src/cli/migrations.ts
    usecase: バージョンを上げる
    summary: 適用する全ての手順が書き換えうるファイルを、設定ファイルを先頭に重なりなく返却する
    description: '設定ファイルはバージョンを書き換えるため手順に関わらず含める。`file: index` と `files` の `index` は索引を、`replace_mark` と `files` の `documents` は文書を追加する。索引が無いときは追加しない'
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: versions
        type: MigrationVersion[]
        required: true
        description: 適用するバージョン
      - name: target
        type: MigrationTarget
        required: true
        description: 手順の当て先
    returns:
      type: string[]
      description: 絶対パスの並び
    unit_tests:
