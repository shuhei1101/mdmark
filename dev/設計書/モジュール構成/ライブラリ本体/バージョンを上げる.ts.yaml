    exceptions:
      - name: CliError
        condition: ファイルを読み込めない・記載できない、対象の YAML を読み込めない、`call` のスクリプトが 0 以外で終わった
        message: '{バージョン} の手順「{説明}」に失敗しました（{理由}）。（`call` のスクリプトが標準エラーに書き込んだ行があれば、改行して続ける）'
    unit_tests:
