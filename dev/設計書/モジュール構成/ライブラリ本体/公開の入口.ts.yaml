title: "ライブラリ本体 / 公開の入口"
lead: 配布物の入口の JavaScript と CSS。JavaScript は公開関数と公開の型を export し、CSS は描いた文書の見た目を `@layer mdmark` に入れて持つ。
directory: |-
  ```tree
  src/
  ├── index.ts   # 公開関数 version()・mount()・render()・registerExtension()・collectReferences()・collectMatches()・checkIndex()・buildAliases()・定数 diffModes と公開の型の export
  └── index.css  # 描いた文書と記法の CSS（@layer mdmark）
  ```
functions:
  - name: version
    title: 版を返す
    container: src/index.ts
    kind: 関数
    scope: public
    summary: ビルドで埋めた版を返す
    description: 'ビルドが識別子 `__MDMARK_VERSION__` を版の文字列に置き換える。ソースでは `declare const __MDMARK_VERSION__: string` で宣言する。'
    returns:
      type: string
      description: '`v{MAJOR}.{MINOR}.{PATCH}` の版'
    unit_tests:
      - name: test_version
        case: 正常
        summary: 埋めた版を返す
        condition: '`__MDMARK_VERSION__` に `v9.9.9` を置く'
        mock: '`globalThis.__MDMARK_VERSION__` に値を置いてから読み込む'
        expected: '`v9.9.9` を返す'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/版を返す.ts#
notes:
  公開するもの: '`src/index.ts` は `version` に加えて、`mount`（`src/mount.ts`）・`render`（`src/render/index.ts`）・`registerExtension`（`src/extensions.ts`）・`collectReferences`（`src/knowledge/references.ts`）・`collectMatches`（`src/knowledge/matches.ts`）・`checkIndex`（`src/knowledge/check.ts`）・`buildAliases`（`src/knowledge/aliases.ts`）・`mountView`・`mountComments`（`src/mount-parts.ts`）と定数 `diffModes`（`src/diff/source.ts`）を export し、型 `MdmarkConfig`・`MountOptions`・`MountHandle`・`MdmarkExtension`・`MdmarkExtensionModule`・`MdmarkMarkArgs`・`StandardSchemaV1`・`MdmarkIndex`・`MdmarkIndexDocTag`・`MdmarkIndexTag`・`MdmarkIndexRelated`・`MdmarkRelationType`・`MdmarkReferences`・`MdmarkMatches`・`MdmarkMatch`・`MdmarkMatchTarget`・`MdmarkAvoidedMatch`・`MdmarkIndexIssue`・`MdmarkAlias`・`MdmarkAliasType`・`MdmarkAliasSource`・`MdmarkAliasProblem`・`DiffSource`・`DiffRevision`・`DiffMode`（`src/diff/source.ts`）・`MdmarkViewOptions`・`MdmarkViewHandle`（`src/views/spec.ts`）・`MdmarkComment`・`MdmarkCommentDraft`・`MdmarkCommentStore`・`MdmarkCommentsHandle`（`src/comments/spec.ts`）を `export type` で出す。他の関数は export しない。公開の型は markdown-it・sanitize-html の型を参照しない（`dist/index.d.ts` を使う側がその型を入れずに型検査できるようにする）'
styles:
  - name: index
    title: 入口の CSS
    container: src/index.css
    summary: 描いた文書の CSS。全ての規則を `@layer mdmark` に入れ、見た目の値を `--mdmark-` の CSS 変数で配る。版の CSS 変数 `--mdmark-version` はビルドが先頭に `:root` の宣言として差し込む
    description: |-
      採用したモックの規則を写す。本文の規則は `dev/mock/refs/16/assets/sample.css` の `@layer mdmark` の中身、変数の値は `dev/mock/assets/style.css`、横スクロールの影は同じフォルダの `style.css`、印刷は `print.css` から取る。記法の規則は `dev/mock/refs/19/assets/syntax.css` と `syntax-print.css`（印刷）から取り、エイリアスのツールチップの規則は `dev/mock/refs/176/assets/alias-tip.css` の `@layer mdmark` の中身から取り、アイコンは `mask-image` の SVG の data URL で付ける。モック専用の規則（`.mock-*`・`.host*`・`.catalog*`・`body`・`--host-*`）は写さない。

      ダークの配色は、モックの `:root[data-scheme="dark"]` を `@media screen and (prefers-color-scheme: dark)` の `:root` に置き換えて持つ（印刷では明るい配色のまま）。描く先の祖先の class で決める配色も `:root` に値を置き、使う側が層の外で `:root` に書いた上書きと `document.body` の直下の部品にも同じ配色が届くようにする。選んだテーマの配色も、描く先の属性 `data-mdmark-color-theme` を `:root:has()` で見て `:root` に置く。入れ子の規則はソースに書いたまま置き、ビルドが対象のブラウザに合わせて展開する。
    values:
      - class_name: ':root'
        target: 変数の既定
        value: '`--mdmark-font-body`・`--mdmark-font-heading`・`--mdmark-font-mono`・`--mdmark-font-size`（`0.875rem`）・`--mdmark-line-height`（`1.8`）・`--mdmark-content-width`（`none`。行の長さを抑えたい使う側が上限を渡す）・`--mdmark-space`（`0.875rem`）・`--mdmark-padding`（`1.5rem`）・`--mdmark-radius`（`4px`）・`--mdmark-heading-weight`・`--mdmark-heading-rule-width`・`--mdmark-table-rule-inline`・`--mdmark-h1-marker`・`--mdmark-h2-marker`・`--mdmark-h3-marker`（見出しの前の記号。既定は持たず、規則の側で空の文字列に落とす）と、`--mdmark-color-`（`bg`・`text`・`heading`・`muted`・`link`・`border`・`surface`・`scroll-shadow`・`notice-bg`・`notice-border`・`notice-text`）。値は `dev/mock/assets/style.css` の `:root`（`--mdmark-content-width` だけはモック作成で決めた `none`）'
      - class_name: ':root'
        target: ダークの配色（画面で OS の設定がダークのとき）
        value: '`--mdmark-color-` の 11 個をダークの値にし、`color-scheme: dark`。値は `dev/mock/assets/style.css` の `:root[data-scheme="dark"]`'
      - class_name: .mdmark
        target: 描く先の要素
        value: '地の色 `--mdmark-color-bg`・内側の余白 `--mdmark-padding`・角丸 `--mdmark-radius`。枠と影は付けない。行の長さ・書体・行間・ブロックの間隔と、中の見出し・段落・リスト・引用・表・コード・リンク・折り畳み・区切り線・画像・タスクリストの規則'
      - class_name: '.mdmark :is(pre, table)'
        target: 横スクロールする表とコードブロック
        value: 続きがある側の端に影を出す背景の重ね合わせ（中身と動く面の `local` と、端に留まる影の `scroll`）。本文のセルの地は透明（見出し行のセルは面の色）
      - class_name: '.mdmark :is(th, td).mdmark-align-{left,center,right}'
        target: 表の列の揃え
        value: '`text-align: left` / `center` / `right`'
      - class_name: '.mdmark .mdmark-embed:not([data-mdmark-drawn])'
        target: 読み込み中の枠
        value: '`min-height: 12rem`・`--mdmark-color-border` の破線・角丸 `--mdmark-radius`・文字を中央に `--mdmark-color-muted` で置く'
      - class_name: .mdmark .mdmark-notice
        target: 知らせの枠
        value: '地 `--mdmark-color-notice-bg`・1px の線（4 辺）`--mdmark-color-notice-border`・文字 `--mdmark-color-notice-text`・角丸 `--mdmark-radius`。題（`.mdmark-notice-title`）は太字のブロック、`code` は折り返す'
      - class_name: '@media print .mdmark'
        target: 印刷のとき
        value: '地と余白を外して紙の幅いっぱいにする。`a[href^="http"]::after` で URL を併記する。表・コードブロック・図・読み込み中の枠・知らせの枠を改ページで切らない。図の表示する枠は `attachDiagrams` が当てたインラインの高さと上限を `height: auto !important; max-height: none !important` で外し、図の全体の高さで出す。表とコードブロックの横スクロールと影をやめて紙の幅に収め、長い行を折り返す。`h1`〜`h3` の直後で改ページしない'
      - class_name: '@media print and (max-width: 40rem) .mdmark'
        target: 狭い紙幅で印刷するとき
        value: '表を行ごとに縦に積み、見出し行を隠し、`td::before` に `attr(data-label)` で列名を出す。セルの揃えは列の揃えの class より強い指定で `start` に戻す'
      - class_name: :root（記法）
        target: 記法の変数の既定
        value: '`--mdmark-color-table-head`・`--mdmark-color-callout-note`・`-tip`・`-important`・`-warning`・`-caution`・`--mdmark-sticky-top`（`0px`。見出し行を留める画面の上端からのずれ）・`--mdmark-color-code-highlight-bg`（`#fef3c7`、ダーク `#5c4a12`）・`--mdmark-color-code-highlight-line`（`#b45309`、ダーク `#fbbf24`）・ファイルの種類のアイコンの色 `--mdmark-color-file-text`・`-code`・`-config`・`-image`・`-sheet`・`-archive`・`-script`（値とダークの値は `dev/mock/refs/225/assets/tree.css`）。値とダークの値は `dev/mock/assets/style.css`'
      - class_name: .mdmark .mdmark-table ほか記法の class
        target: 記法の部品
        value: '部品設計（表・注意書き・タブ・ステップ・ファイルツリー・バッジ・目次・節・行の詳細・図表の番号・書き方の警告・コードブロック）の HTML に当てる規則。表は縦の高さの上限を持たず（横にはみ出す表は表の中で横にスクロールする）、見出し行と集計の行はページのスクロールで留める。留め方は `root` の `data-mdmark-sticky` で分け、`timeline` は `@supports (animation-timeline: view()) and (animation-range: 0% 100%)` の中で `view-timeline`（inset は `var(--mdmark-sticky-top, 0px) 0px`）と `--mdmark-sticky-head-start`・`-head-max`・`-foot-max`・`-foot-end` の `animation-range` で動かし、`script` は `--mdmark-sticky-head-shift`・`-foot-shift` の `transform: translateY()` で動かす。集計の行は計算ごとの行を面の色でつなぎ、`max-width: 768px` ではセルの上下の余白を `0.2em` に詰める。集計とコピーの形式のメニュー・コピーできないときのパネル・行の URL の知らせ・狭い幅で畳む最終列（`.is-folded`・`.mdmark-fold-*`）もここで当てる。値は `dev/mock/refs/151/assets/table.css`（モックの `--mdmark-mock-*` は `--mdmark-sticky-*`、`.is-sticky-timeline`・`.is-sticky-shift` は `[data-mdmark-sticky]` に読み替える）。コードブロックは全てのブロックに帯（左端に言語のラベル、続けて題かファイル名、右端にコピーのボタン）を置き、値は `dev/mock/refs/151/assets/code-block.css`。`plain` は縦の罫線と面を外す。表は本文の行を地の色にして見出し行だけを面の色で塗り、外側を `calc(var(--mdmark-radius) * 2)` の角丸の 1px の枠で囲む。セルの線は内側だけに引き、見出し行の下・集計の上の線も 1px（`dev/mock/refs/80/assets/table-options.css` の案 A〜C 共通と案 B。`plain` は外側の枠を引かず見出し行も地の色）。注意書きの面は種類の色を `--mdmark-color-bg` に 7%、線は 40% `color-mix(in oklab, …)` で混ぜる（`dev/mock/refs/80/assets/canvas-themes.css` の `.theme-dev-swiss .markdown-alert`）。表・タブ・ステップの折り畳み（`.mdmark-collapsible` と閉じた表の帯）は `dev/mock/refs/225/assets/collapse.css`、ファイルツリーの帯・注釈の列（`--mdmark-tree-note-start`）・`data-file-icon` ごとのアイコンと色・「ほかにもある」の項目・フォルダの開閉は `dev/mock/refs/225/assets/tree.css` から取る。モックのアイコンの要素（`.mdmark-icon`・`.mdmark-tree-chevron`）は、フォルダは開閉のボタンの `aria-expanded`、ファイルは `data-file-icon` で選ぶ `mask-image` に読み替える'
      - class_name: '@media print の記法'
        target: 印刷のときの記法
        value: 表の絞り込み・ピン止め・開閉のボタンとタブの並びを隠し、見出し行・集計の行・列を留めず（`animation` と `transform` を外す）、セルの余白を詰める。集計とコピーの形式のメニュー・コピーできないときのパネル・行の URL の知らせ・最終列の開閉を隠し、畳んだ最終列は元の列に戻す（`dev/mock/refs/151/assets/table-print.css`）。コードブロックのコピーのボタンを隠し、言語のラベルは残す（`dev/mock/refs/151/assets/code-block-print.css`）。飾ったコードブロックは題・行番号・行の地の色と `+`・`-` を出したまま行を折り返し、行番号は折り返した最初の 1 行にだけ出す（`dev/mock/refs/65/assets/code-block-print.css`）。`[data-printing]` のタブは全ての中身をタブ名を題にして縦に並べる。タブ・ステップの折り畳みの見出しの開閉のマーカーを外す（`dev/mock/refs/225/assets/collapse-print.css`）。ファイルツリーの帯（コピーボタン）・コピーできないときのパネル・開閉のアイコンを隠し、長い名前と注釈を折り返す（`dev/mock/refs/225/assets/tree-print.css`）
      - class_name: .mdmark .mdmark-html と .mdmark-hint-*
        target: 埋め込んだ HTML とヒント
        value: '部品設計（埋め込んだHTML・ヒント）の HTML に当てる規則。`dev/mock/refs/45/assets/embed.css` から取る。`.is-wide` の間だけ横にスクロールし、ブロックの印（`.mdmark-hint-mark`）は要素の右上に `position: absolute` で置き、アイコンは lucide の `info` を `mask-image` で付ける。行内（`.mdmark-hint-inline`）は破線の下線。ツールチップは図のツールチップと同じ規則。用語・ヒント・図の線のラベルと箱の印に `cursor: help` を付けない。印刷では印とツールチップを隠し、横のスクロールをやめて紙の幅に収める'
      - class_name: :root（差分）
        target: 差分の変数の既定
        value: '`--mdmark-color-diff-del-bg`（`#fbe6e3`）・`-del-word`（`#eeb4ad`）・`-del-sign`（`#b91c1c`）・`-add-bg`（`#e1ede2`）・`-add-word`（`#a9ccaf`）・`-add-sign`（`#15803d`）、`--mdmark-diff-minimap-width`（`14px`）・`--mdmark-diff-minimap-z-index`（`10`）。ダークの値は `dev/mock/assets/style.css`'
      - class_name: .mdmark-diff-* と body > .mdmark-diff-minimap
        target: 差分の部品
        value: '差分を開くボタン・リビジョンの選択・差分の行・埋め込んだ HTML の差分・差分の状態の文は `.mdmark` の下。ミニマップは `document.body` の直下に置くため `.mdmark` の外で当て、`position: fixed` と `z-index: var(--mdmark-diff-minimap-z-index)`。`@media print` ではミニマップを隠す。値は `dev/mock/assets/style.css`'
      - class_name: :root（ビューとコメント）
        target: ビューとコメントの変数の既定
        value: '`--mdmark-view-column-width`（`12rem`）・`--mdmark-color-comment-bg`（`#f2effe`、ダーク `#25222d`）・`--mdmark-color-comment-line`（`#6d28d9`、ダーク `#c4a7ff`）・`--mdmark-color-error`（`#b91c1c`、ダーク `#f87171`）。値は `dev/mock/assets/style.css`。コメントのボタン・入力欄・吹き出しは `.mdmark` の外に置くため、この 4 つは `.mdmark` でなく `:root` に置く'
      - class_name: .mdmark .mdmark-view-*
        target: ビューの部品
        value: 部品設計（ビュー）の HTML に当てる規則。`dev/mock/refs/55/assets/view.css` から取る。切り替えの選んだボタンは濃い地で塗り、ボードの列は地の枠を持たず見出しの下の線で区切る（確認ログ）。列の最小の幅は `var(--mdmark-view-column-width)` で、収まらない列は `.mdmark-view-board` の中で横にスクロールする。列の見出しのアイコンは部品の HTML が持つ SVG
      - class_name: .mdmark-comment-* と ::highlight(mdmark-comment-pending)
        target: コメントの部品
        value: '部品設計（コメントのボタン・入力欄・印・吹き出し・箇所が見つからないコメントの一覧）の HTML に当てる規則。`dev/mock/refs/55/assets/comment.css` から取る。印と一覧は `.mdmark` の下、ボタン（`.mdmark-comment-add`）・入力欄と吹き出し（`.mdmark-comment-popover`）は `document.body` に置くため `.mdmark` の外で当て、`position: fixed` にする。保存のボタン（`.is-primary`）は地と線を `--mdmark-color-text`、文字を `--mdmark-color-bg` にする（`dev/mock/refs/80/assets/canvas-themes.css` の `.theme-dev-swiss .mdmark-comment-button.is-primary`）。`::highlight(mdmark-comment-pending)` は入力欄を開いている間の選んだ文字に `--mdmark-color-comment-bg` を当てる'
      - class_name: '@media print（ビューとコメント）'
        target: ビューとコメントの印刷
        value: '`dev/mock/refs/55/assets/view-print.css` から取る。ビューは今のビューを出し、切り替えを隠す（絞り込みのボタンは表の印刷の規則が隠す）。ボードは横のスクロールをやめ、紙の幅に収まる数の列で折り返し、列と項目を改ページで切らない。コメントのボタン・入力欄・吹き出しを隠し、印は地の色を外して下線だけで箇所を示す'
      - class_name: :root:has({class} .mdmark)
        target: 描く先の祖先の class で決める配色（画面のとき）
        value: '`@media screen` の中で、ダークの class の下に `.mdmark` があればダークの配色の値（`prefers-color-scheme: dark` の `:root` と同じ値と `color-scheme: dark`）を、ライトの class の下にあれば `:root` の既定と同じ値と `color-scheme: light` を `:root` に置く。ダークの class は `mdmark-theme-dark`・`vscode-dark`・`vscode-high-contrast:not(.vscode-high-contrast-light)`、ライトの class は `mdmark-theme-light`・`vscode-light`・`vscode-high-contrast-light`。`vscode-*` の規則は、`.mdmark` かその祖先が `mdmark-theme-*` を持つときに当てない。同じ優先度のライトとダークが入れ子になるときは、内側の class を持つ祖先の下の `.mdmark` を外側の規則から `:not()` で外し、描く先に近い祖先に従わせる'
        notes: '`:root` より強い指定のため、OS の設定のダークの規則に勝つ。`@media print` では当てず、印刷は明るい配色のまま'
      - class_name: .mdmark .mdmark-term-avoided
        target: やめた言い方のマーカー
        value: '`.mdmark-term` の破線を波線（`text-decoration: underline wavy`）に替え、色を `--mdmark-color-avoided-underline`（既定 `var(--mdmark-color-notice-border)`、`:root` に置く）にする。代わりの用語の語 `mdmark-term-tip-replacement` は太字。印刷では波線を外す（`.mdmark-term` の印刷の規則より詳細度が高いので別に宣言する）。値は `dev/mock/refs/79/assets/avoided-term.css`・`avoided-term-print.css`'
      - class_name: :root（色分け）と .mdmark code [class^="hljs-"]
        target: コードブロックの色分け
        value: '`--mdmark-color-syntax-{keyword,string,number,type,name,comment}` の既定とダークの値を `:root` に置き（部品設計『コードブロック』の CSS カスタムプロパティ）、`hljs-*` の class を 6 つの変数へ寄せる（部品設計の補足『色分けの種類』。コメントは斜体、`hljs-subst` は本文の色、`hljs-strong` は太字、`hljs-emphasis` は斜体）。`diff` の色分けの `hljs-addition`・`hljs-deletion` は差分の `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` にする（`dev/mock/refs/151/assets/code-block.css`）。値は `dev/mock/refs/97/assets/syntax-highlight.css`。`@media print` では色分けした `code` に `print-color-adjust: exact` を当て、明るい配色の色で印刷する'
        notes: 色分けの HTML は `mount` が描いた後に入れるため、規則は描いた文書の class `.mdmark` の下で当てる
      - class_name: .mdmark:has(> .mdmark-side-toc) と .mdmark-content・.mdmark-side-toc-*・.mdmark-fold-all
        target: 右側の目次と本文の列
        value: '部品設計（右側の目次）の HTML に当てる規則。`dev/mock/refs/166/assets/side-toc.css` から取る。右側の目次を持つ描く先の要素を `container: mdmark / inline-size` の flex にして本文の列と右側の目次を並べ、行の長さの上限（`--mdmark-content-width`）は本文の列が持つ。右側の目次は `position: sticky` で `calc(var(--mdmark-sticky-top, 0px) + var(--mdmark-space))` に留め、`data-mode`・`data-open`・`data-pinned` で出し方を切り替える。`@container mdmark (width < 48rem)` では右側の目次を本文の上の狭い幅の帯にして `var(--mdmark-sticky-top, 0px)` に留め、見出しに `scroll-margin-block-start: calc(var(--mdmark-sticky-top, 0px) + 3.5rem)` を付ける。広い幅の見出しは `scroll-margin-block-start: var(--mdmark-sticky-top, 0px)`'
      - class_name: '@media print（右側の目次）'
        target: 右側の目次の印刷
        value: '右側の目次を隠し、描く先の要素を `display: block`、本文の列を `max-width: none` にして紙の幅いっぱいに並べる（`dev/mock/refs/166/assets/side-toc-print.css`）'
      - class_name: .mdmark [data-mdmark-diff-hidden]
        target: 差分を開いている間に隠す要素
        value: '`display: none !important`（`DIFF_HIDDEN_ATTRIBUTE`）'
      - class_name: :root:has(.mdmark[data-mdmark-color-theme="{テーマ}"])
        target: 選んだテーマの明るい配色
        value: '`theme-paper`・`theme-slate`・`theme-contrast` のそれぞれに、そのテーマの `--mdmark-color-*` の明るい配色の値と `color-scheme: light` を `:root` に置く。値は `dev/mock/assets/themes/{テーマ}.css` の `:root`。`dev-swiss` の規則は置かず、`:root` の既定の値のままにする'
        notes: 属性は `mount` が描く先の要素に付ける（`COLOR_THEME_ATTRIBUTE`）。印刷でもこの値を使う。同じページに別のテーマの文書が並んだときは、`theme-paper`・`theme-slate`・`theme-contrast` の並びで後のテーマが全ての文書に当たる（`dev-swiss` は規則を持たないため他のテーマに負ける）
      - class_name: :root:has(.mdmark[data-mdmark-color-theme="{テーマ}"])（暗い配色）
        target: 選んだテーマの暗い配色（画面のとき）
        value: '`@media screen and (prefers-color-scheme: dark)` の中と、暗い class の下に属性を持つ `.mdmark` があるときは、そのテーマの暗い配色の値と `color-scheme: dark` を、明るい class の下では明るい配色の値を `:root` に置く。class の種類・`mdmark-theme-*` が `vscode-*` に勝つ優先・入れ子は内側に従う決まりは `:root:has({class} .mdmark)` の行と同じで、その行のセレクタの `.mdmark` に属性を重ねる。値は `dev/mock/assets/themes/{テーマ}.css` の `@media screen` の中'
        notes: '`@media screen` の中にだけ置き、印刷は明るい配色のまま。`prefers-color-scheme` の規則は明るい配色の規則の後に置く。class の規則は属性を重ねた分だけ `:root:has({class} .mdmark)` の規則より詳細度が高く、既定の明暗の値に勝つ。`@layer mdmark` の中なので、使う側が層の外で `:root` や `.mdmark` に書いた変数には負ける'
      - class_name: .mdmark .mdmark-diff-block
        target: 差分のブロック
        value: '部品設計（差分のブロック）の HTML に当てる規則。`dev/mock/refs/196/assets/diff-preview.css` の `@layer mdmark` の中身（`.mdmark-diff-block`・`.mdmark-diff-block-sign`・`.mdmark-diff-block-label`）から取る。`data-kind` ごとに地を `--mdmark-color-diff-add-bg`・`--mdmark-color-diff-del-bg`、左の余白の記号を `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` にする。削除した `li` は番号を出さず後ろの項目の番号を進めない（`list-style-type: none`・`counter-increment: list-item 0`）'
      - class_name: :root（色のプリセット）
        target: 色の名前ごとの面と文字の色
        value: '`--mdmark-color-accent-{blue,red,green,yellow,orange,purple,gray}-{bg,text}` の明るい配色とダークの値。選んだテーマの配色の規則にも、そのテーマの値を置く。値は `dev/設計書/デザイン方針.md` と `dev/mock/components/color-preset/index.html` の `<style>`'
      - class_name: .mdmark .mdmark-col-highlight[data-color]・.mdmark tr[data-color]・.mdmark-badge[data-color]・.mdmark-color[data-color]
        target: 列と行の色・バッジの色・本文の文字の色
        value: '強調した列のセルと色を付けた行のセルの地を `--mdmark-color-accent-{色}-bg` にし、強調した列の見出しのセルに下端の線、色を付けた行に上下の線（`-text`）を付ける。バッジは地と文字、`mdmark-color` は文字の色と `font-weight: 700`。`dev/mock/components/table/`・`dev/mock/components/badge/`・`dev/mock/components/color-preset/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-image・.mdmark-image-open・.mdmark-only-*
        target: 画像の図
        value: '`--mdmark-image-width` を `figure` の幅の上限にし、`data-align` で左・中央・右に寄せる。拡大のボタンは枠を持たず、ホバーとフォーカスで右上の `maximize-2` を出す。`mdmark-only-dark` は明るい配色で、`mdmark-only-light` は暗い配色（OS の設定・祖先の class・選んだテーマ）で `display: none`。`dev/mock/components/figure/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-gallery
        target: ギャラリー
        value: '`container-type: inline-size` を持ち、格子を `--mdmark-gallery-cols` 列にする。置き場所の幅が 32rem より狭いときは 2 列まで、20rem より狭いときは 1 列に減らす（`@container`）。画像は切り抜かず縦横比を保つ。`dev/mock/components/figure/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-lightbox
        target: ライトボックス
        value: '`dialog` を画面いっぱいに開き、`::backdrop` を暗くする。帯の送り・枚数・拡大の操作・閉じるのボタンは図の全画面のボタンと同じ見た目にする。`dev/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-media・.mdmark-media-print
        target: 動画と音声
        value: '`video` を `--mdmark-image-width` の幅に収め、`audio` は列の幅にする。`mdmark-media-print` は画面では `display: none`。`dev/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-gif・.mdmark-gif-toggle
        target: GIF
        value: '`canvas` を `img` に重ね、`canvas[hidden]` を `display: none` にする。ボタンは画像の右上に置き、`aria-pressed` で `pause` と `play` のアイコンを出し分ける。`dev/mock/components/media/` の `<style>` から取る'
      - class_name: .mdmark .mdmark-card
        target: リンクと添付のカード
        value: アイコン・タイトル・ドメインと URL を並べる枠。長い URL は折り返す。アイコンは `data-card` と `data-file-kind` ごとに `mask-image` の lucide（`globe`・`file-text`・`file-spreadsheet`・`file-archive`・`file`）で付ける。`dev/mock/components/link-card/` の `<style>` から取る
      - class_name: '@media print（画像と動画）'
        target: 画像・動画・カードの印刷
        value: 拡大のアイコンと GIF のボタンを隠し、`mdmark-only-light` を出して `mdmark-only-dark` を隠す。`video`・`audio` を隠して `mdmark-media-print` を出す。カードの後ろにリンク先の URL を出す。色のプリセットは選んだテーマの明るい配色の値で残す
    refs:
      - dev/設計書/画面設計/文書.ts#
      - dev/設計書/部品設計/知らせの枠.ts#
      - dev/設計書/部品設計/読み込み中の枠.ts#
