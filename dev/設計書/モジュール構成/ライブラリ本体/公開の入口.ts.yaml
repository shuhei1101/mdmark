title: "ライブラリ本体 / 公開の入口"
lead: 配布物の入口の JavaScript と CSS。JavaScript は公開関数と公開の型を export し、CSS は描いた文書の見た目を `@layer mdmark` に入れて持つ。
directory: |-
  ```tree
  src/
  ├── index.ts   # 公開関数 version()・mount()・render()・registerExtension()・collectReferences()・collectMatches()・checkIndex() と公開の型の export
  └── index.css  # 描いた文書と記法の CSS（@layer mdmark）
  ```
functions:
  - name: version
    title: 版を返す
    container: src/index.ts
    kind: 関数
    scope: public
    summary: ビルドで埋めた版を返す
    description: 'ビルドが識別子 `__MDMARK_VERSION__` を版の文字列に置き換える。ソースでは `declare const __MDMARK_VERSION__: string` で宣言する。'
    returns:
      type: string
      description: '`v{MAJOR}.{MINOR}.{PATCH}` の版'
    unit_tests:
      - name: test_version
        case: 正常
        summary: 埋めた版を返す
        condition: '`__MDMARK_VERSION__` に `v9.9.9` を置く'
        mock: '`globalThis.__MDMARK_VERSION__` に値を置いてから読み込む'
        expected: '`v9.9.9` を返す'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/版を返す.ts#
notes:
  公開するもの: '`src/index.ts` は `version` に加えて、`mount`（`src/mount.ts`）・`render`（`src/render/index.ts`）・`registerExtension`（`src/extensions.ts`）・`collectReferences`（`src/knowledge/references.ts`）・`collectMatches`（`src/knowledge/matches.ts`）・`checkIndex`（`src/knowledge/check.ts`）・`mountView`・`mountComments`（`src/mount-parts.ts`）を export し、型 `MdmarkConfig`・`MountOptions`・`MountHandle`・`MdmarkExtension`・`MdmarkExtensionModule`・`MdmarkMarkArgs`・`StandardSchemaV1`・`MdmarkIndex`・`MdmarkReferences`・`MdmarkMatches`・`MdmarkMatch`・`MdmarkMatchTarget`・`MdmarkIndexIssue`・`DiffSource`・`DiffRevision`（`src/diff/source.ts`）・`MdmarkViewOptions`・`MdmarkViewHandle`（`src/views/spec.ts`）・`MdmarkComment`・`MdmarkCommentDraft`・`MdmarkCommentStore`・`MdmarkCommentsHandle`（`src/comments/spec.ts`）を `export type` で出す。他の関数は export しない。公開の型は markdown-it・sanitize-html の型を参照しない（`dist/index.d.ts` を使う側がその型を入れずに型検査できるようにする）'
styles:
  - name: index
    title: 入口の CSS
    container: src/index.css
    summary: 描いた文書の CSS。全ての規則を `@layer mdmark` に入れ、見た目の値を `--mdmark-` の CSS 変数で配る。版の CSS 変数 `--mdmark-version` はビルドが先頭に `:root` の宣言として差し込む
    description: |-
      採用したモックの規則を写す。本文の規則は `dev/mock/refs/16/assets/sample.css` の `@layer mdmark` の中身、変数の値は `dev/mock/assets/style.css`、横スクロールの影は同じフォルダの `style.css`、印刷は `print.css` から取る。記法の規則は `dev/mock/refs/19/assets/syntax.css` と `syntax-print.css`（印刷）から取り、アイコンは `mask-image` の SVG の data URL で付ける。モック専用の規則（`.mock-*`・`.host*`・`.catalog*`・`body`・`--host-*`）は写さない。

      ダークの配色は、モックの `:root[data-scheme="dark"]` を `@media screen and (prefers-color-scheme: dark)` の `:root` に置き換えて持つ（印刷では明るい配色のまま）。入れ子の規則はソースに書いたまま置き、ビルドが対象のブラウザに合わせて展開する。
    values:
      - class_name: ':root'
        target: 変数の既定
        value: '`--mdmark-font-body`・`--mdmark-font-heading`・`--mdmark-font-mono`・`--mdmark-font-size`（`1rem`）・`--mdmark-line-height`（`1.75`）・`--mdmark-content-width`（`46rem`）・`--mdmark-space`（`1rem`）・`--mdmark-padding`（`1.5rem`）・`--mdmark-radius`（`6px`）・`--mdmark-heading-weight`・`--mdmark-heading-rule-width`・`--mdmark-table-rule-inline`・`--mdmark-h1-marker`・`--mdmark-h2-marker`・`--mdmark-h3-marker`（見出しの前の記号。既定は持たず、規則の側で空の文字列に落とす）と、`--mdmark-color-`（`bg`・`text`・`heading`・`muted`・`link`・`border`・`surface`・`scroll-shadow`・`notice-bg`・`notice-border`・`notice-text`）。値は `dev/mock/assets/style.css` の `:root`'
      - class_name: ':root'
        target: ダークの配色（画面で OS の設定がダークのとき）
        value: '`--mdmark-color-` の 11 個をダークの値にし、`color-scheme: dark`。値は `dev/mock/assets/style.css` の `:root[data-scheme="dark"]`'
      - class_name: .mdmark
        target: 描く先の要素
        value: '地の色 `--mdmark-color-bg`・内側の余白 `--mdmark-padding`・角丸 `--mdmark-radius`。枠と影は付けない。行の長さ・書体・行間・ブロックの間隔と、中の見出し・段落・リスト・引用・表・コード・リンク・折り畳み・区切り線・画像・タスクリストの規則'
      - class_name: '.mdmark :is(pre, table)'
        target: 横スクロールする表とコードブロック
        value: 続きがある側の端に影を出す背景の重ね合わせ（中身と動く面の `local` と、端に留まる影の `scroll`）。セルの地は透明
      - class_name: '.mdmark :is(th, td).mdmark-align-{left,center,right}'
        target: 表の列の揃え
        value: '`text-align: left` / `center` / `right`'
      - class_name: '.mdmark .mdmark-embed:not([data-mdmark-drawn])'
        target: 読み込み中の枠
        value: '`min-height: 12rem`・`--mdmark-color-border` の破線・角丸 `--mdmark-radius`・文字を中央に `--mdmark-color-muted` で置く'
      - class_name: .mdmark .mdmark-notice
        target: 知らせの枠
        value: '地 `--mdmark-color-notice-bg`・1px の線（4 辺）`--mdmark-color-notice-border`・文字 `--mdmark-color-notice-text`・角丸 `--mdmark-radius`。題（`.mdmark-notice-title`）は太字のブロック、`code` は折り返す'
      - class_name: '@media print .mdmark'
        target: 印刷のとき
        value: '地と余白を外して紙の幅いっぱいにする。`a[href^="http"]::after` で URL を併記する。表・コードブロック・図・読み込み中の枠・知らせの枠を改ページで切らない。表とコードブロックの横スクロールと影をやめて紙の幅に収め、長い行を折り返す。`h1`〜`h3` の直後で改ページしない'
      - class_name: '@media print and (max-width: 40rem) .mdmark'
        target: 狭い紙幅で印刷するとき
        value: '表を行ごとに縦に積み、見出し行を隠し、`td::before` に `attr(data-label)` で列名を出す。セルの揃えは列の揃えの class より強い指定で `start` に戻す'
      - class_name: :root（記法）
        target: 記法の変数の既定
        value: '`--mdmark-color-table-head`・`--mdmark-color-callout-note`・`-tip`・`-important`・`-warning`・`-caution`・`--mdmark-table-max-height`（`28rem`）・`--mdmark-color-code-highlight-bg`（`#fff8c5`、ダーク `#2e2a14`）・`--mdmark-color-code-highlight-line`（`#9a6700`、ダーク `#d29922`）。値とダークの値は `dev/mock/assets/style.css`'
      - class_name: .mdmark .mdmark-table ほか記法の class
        target: 記法の部品
        value: '部品設計（表・注意書き・タブ・ステップ・ファイルツリー・バッジ・目次・節・行の詳細・図表の番号・書き方の警告・コードブロック）の HTML に当てる規則。表は見出し行を `position: sticky` で上端に留め、高さを `--mdmark-table-max-height` に抑える。`plain` は縦の罫線と面を外す'
      - class_name: '@media print の記法'
        target: 印刷のときの記法
        value: 表の絞り込み・ピン止め・開閉のボタンとタブの並びを隠し、見出し行と列を留めず、表の高さの上限を外してセルの余白を詰める。飾ったコードブロックは題・行番号・行の地の色と `+`・`-` を出したまま行を折り返し、行番号は折り返した最初の 1 行にだけ出す（`dev/mock/refs/65/assets/code-block-print.css`）。`[data-printing]` のタブは全ての中身をタブ名を題にして縦に並べる
      - class_name: .mdmark .mdmark-html と .mdmark-hint-*
        target: 埋め込んだ HTML とヒント
        value: '部品設計（埋め込んだHTML・ヒント）の HTML に当てる規則。`dev/mock/refs/45/assets/embed.css` から取る。`.is-wide` の間だけ横にスクロールし、ブロックの印（`.mdmark-hint-mark`）は要素の右上に `position: absolute` で置き、アイコンは lucide の `info` を `mask-image` で付ける。行内（`.mdmark-hint-inline`）は破線の下線。ツールチップは図のツールチップと同じ規則。用語・ヒント・図の線のラベルと箱の印に `cursor: help` を付けない。印刷では印とツールチップを隠し、横のスクロールをやめて紙の幅に収める'
      - class_name: :root（差分）
        target: 差分の変数の既定
        value: '`--mdmark-color-diff-del-bg`（`#ffebe9`）・`-del-word`（`#ffcecb`）・`-del-sign`（`#d1242f`）・`-add-bg`（`#dafbe1`）・`-add-word`（`#aceebb`）・`-add-sign`（`#1a7f37`）、`--mdmark-diff-minimap-width`（`14px`）・`--mdmark-diff-minimap-z-index`（`10`）。ダークの値は `dev/mock/assets/style.css`'
      - class_name: .mdmark-diff-* と body > .mdmark-diff-minimap
        target: 差分の部品
        value: '差分を開くボタン・リビジョンの選択・差分の行・埋め込んだ HTML の差分・差分の状態の文は `.mdmark` の下。ミニマップは `document.body` の直下に置くため `.mdmark` の外で当て、`position: fixed` と `z-index: var(--mdmark-diff-minimap-z-index)`。`@media print` ではミニマップを隠す。値は `dev/mock/assets/style.css`'
      - class_name: :root（ビューとコメント）
        target: ビューとコメントの変数の既定
        value: '`--mdmark-view-column-width`（`12rem`）・`--mdmark-color-comment-bg`（`#fbefff`、ダーク `#2e2147`）・`--mdmark-color-comment-line`（`#8250df`、ダーク `#ab7df8`）・`--mdmark-color-error`（`#d1242f`、ダーク `#f85149`）。値は `dev/mock/assets/style.css`。コメントのボタン・入力欄・吹き出しは `.mdmark` の外に置くため、この 4 つは `.mdmark` でなく `:root` に置く'
      - class_name: .mdmark .mdmark-view-*
        target: ビューの部品
        value: 部品設計（ビュー）の HTML に当てる規則。`dev/mock/refs/55/assets/view.css` から取る。切り替えの選んだボタンは濃い地で塗り、ボードの列は地の枠を持たず見出しの下の線で区切る（確認ログ）。列の最小の幅は `var(--mdmark-view-column-width)` で、収まらない列は `.mdmark-view-board` の中で横にスクロールする。列の見出しのアイコンは部品の HTML が持つ SVG
      - class_name: .mdmark-comment-* と ::highlight(mdmark-comment-pending)
        target: コメントの部品
        value: '部品設計（コメントのボタン・入力欄・印・吹き出し・箇所が見つからないコメントの一覧）の HTML に当てる規則。`dev/mock/refs/55/assets/comment.css` から取る。印と一覧は `.mdmark` の下、ボタン（`.mdmark-comment-add`）・入力欄と吹き出し（`.mdmark-comment-popover`）は `document.body` に置くため `.mdmark` の外で当て、`position: fixed` にする。保存のボタン（`.is-primary`）は差し色 `--mdmark-color-link` で塗る。`::highlight(mdmark-comment-pending)` は入力欄を開いている間の選んだ文字に `--mdmark-color-comment-bg` を当てる'
      - class_name: '@media print（ビューとコメント）'
        target: ビューとコメントの印刷
        value: '`dev/mock/refs/55/assets/view-print.css` から取る。ビューは今のビューを出し、切り替えを隠す（絞り込みのボタンは表の印刷の規則が隠す）。ボードは横のスクロールをやめ、紙の幅に収まる数の列で折り返し、列と項目を改ページで切らない。コメントのボタン・入力欄・吹き出しを隠し、印は地の色を外して下線だけで箇所を示す'
      - class_name: .mdmark .mdmark-term-avoided
        target: やめた言い方のマーカー
        value: '`.mdmark-term` の破線を波線（`text-decoration: underline wavy`）に替え、色を `--mdmark-color-avoided-underline`（既定 `var(--mdmark-color-notice-border)`、`:root` に置く）にする。代わりの用語の語 `mdmark-term-tip-replacement` は太字。印刷では波線を外す（`.mdmark-term` の印刷の規則より詳細度が高いので別に宣言する）。値は `dev/mock/refs/79/assets/avoided-term.css`・`avoided-term-print.css`'
    refs:
      - dev/設計書/画面設計/文書.ts#
      - dev/設計書/部品設計/知らせの枠.ts#
      - dev/設計書/部品設計/読み込み中の枠.ts#
test_files:
  - tests/unit/src/index.test.ts
