title: ライブラリ本体 / 設定と機能
lead: 利用側が指定する設定に既定を適用する処理と、設定の `features` に文書の `features` のマーカーを重ねて機能のオン・オフを決める処理。どちらも DOM に頼らず、ブラウザと Node で動く。
directory: |-
  ```tree
  src/
  ├── config.ts    # 設定の型・既定・既定を適用する resolveConfig・ページの設定を重ねる applyPageSettings
  └── features.ts  # 文書のマーカーを重ねる resolveFeatures
  schemas/
  └── mdmark.config.schema.json  # 設定の JSON Schema
  ```
data_models:
  - name: MdmarkConfig
    title: 設定
    container: src/config.ts
    usecase: 共通
    role: DTO
    summary: 利用側が `opts.config` に指定する設定（公開の型）。他のキーを持っていても読み込まない
    properties:
      - name: features
        type: Record<string, boolean> | undefined
        description: 機能のオン・オフの既定
      - name: libraries
        type: Record<string, string> | undefined
        description: マーカーの名前からモジュールの URL を参照する対応表
      - name: tooltips
        type: '{ placement?: string; diagramPlacement?: string } | undefined'
        description: ツールチップの設定。`placement` は持ち主の上と下のどちらに先に出すか（`top` / `bottom`）。`diagramPlacement` は図・ヒント・グラフの項目のツールチップを先に出す側。知らない値も受けて `resolveConfig` が `placement` は `top`、`diagramPlacement` は `bottom` にするため、型は `string`
      - name: syntax
        type: '{ url?: string } | undefined'
        description: 色分けのライブラリの設定。`url` は highlight.js の `es/` フォルダの URL（末尾 `/`）
      - name: '"side-toc"'
        type: '{ mode?: string } | undefined'
        description: 右側の目次の設定。`mode` は出し方（`hover` / `fixed`）。知らない値も受けて `resolveConfig` が `hover` にするため、型は `string`
      - name: colorTheme
        type: string | undefined
        description: 配色のテーマの名前（`COLOR_THEMES` のどれか）。知らない値も受けて `resolveConfig` が `DEFAULT_COLOR_THEME` にするため、型は `string`
      - name: colorScheme
        type: string | undefined
        description: 配色の明暗（`COLOR_SCHEMES` のどれか）。知らない値も受けて `resolveConfig` が `DEFAULT_COLOR_SCHEME` にするため、型は `string`
      - name: labels
        type: '{ paramCopy?: string } | undefined'
        description: 部品の文言の設定。`paramCopy` は操作できる部品の今の値をコピーするボタンの文言。空文字も受けて `resolveConfig` が `DEFAULT_LABELS.paramCopy` にする
      - name: '"html-scripts"'
        type: '{ url?: string } | undefined'
        description: 範囲のスクリプトの設定。`url` は範囲の `ts`・`js` を変換する @babel/standalone の ES モジュールの URL
      - name: mermaid
        type: '{ url?: string; theme?: string; themeVariables?: Record<string, unknown> } | undefined'
        description: mermaid の設定。`url` は mermaid の ES モジュールの URL、`theme` はテーマの名前（知らない値も受けて `resolveConfig` が `mdmark` にするため、型は `string`）、`themeVariables` はテーマの変数の上書き
  - name: LibraryEntry
    title: 対応表の行
    container: src/config.ts
    usecase: 共通
    summary: マーカー 1 つのモジュールの URL と、図のマーカーか
    properties:
      - name: url
        type: string
        description: モジュールの URL
      - name: figure
        type: boolean
        description: 図のマーカーか。通知ブロックのタイトルを分ける。設定の `libraries` で追加した行は `true`
  - name: ResolvedConfig
    title: 既定を適用した設定
    container: src/config.ts
    usecase: 共通
    summary: 全てのキーに値を持つ、内部で使用する設定
    properties:
      - name: features
        type: Record<string, boolean>
        description: '`DEFAULT_FEATURES` に設定の `features` を重ねたもの。キーは `DEFAULT_FEATURES` のキーだけ'
      - name: libraries
        type: Record<string, LibraryEntry>
        description: '`DEFAULT_LIBRARIES` に設定の `libraries` を重ねたもの'
      - name: tooltips
        type: '{ placement: TooltipPlacement; diagramPlacement: TooltipPlacement }'
        description: '`placement` は設定の `tooltips.placement` が `bottom` のときだけ `bottom`、それ以外は `top`。`diagramPlacement` は設定の `tooltips.diagramPlacement` が `top` のときだけ `top`、それ以外は `bottom`'
      - name: syntax
        type: '{ url: string }'
        description: 設定の `syntax.url` が文字列ならその値、それ以外は `DEFAULT_SYNTAX_URL`
      - name: sideToc
        type: '{ mode: SideTocMode }'
        description: 設定の `side-toc.mode` が `fixed` のときだけ `fixed`、それ以外は `hover`
      - name: colorTheme
        type: ColorTheme
        description: 設定の `colorTheme` が `COLOR_THEMES` にあればその値、それ以外は `DEFAULT_COLOR_THEME`
      - name: colorScheme
        type: ColorScheme
        description: 設定の `colorScheme` が `COLOR_SCHEMES` にあればその値、それ以外は `DEFAULT_COLOR_SCHEME`
      - name: labels
        type: '{ paramCopy: string }'
        description: 設定の `labels.paramCopy` が空でない文字列ならその値、それ以外は `DEFAULT_LABELS.paramCopy`
      - name: htmlScripts
        type: '{ url: string }'
        description: 範囲のスクリプトの変換のライブラリの URL（既定 `DEFAULT_HTML_SCRIPTS_URL`）
      - name: mermaid
        type: '{ url: string; theme: MermaidTheme; themeVariables: Record<string, string> }'
        description: '`url` は設定の `mermaid.url` が文字列ならその値、それ以外は `DEFAULT_MERMAID_URL`。`theme` は `MERMAID_THEMES` にあればその値、それ以外は `mdmark`。`themeVariables` は設定の `mermaid.themeVariables` のうち値が文字列のキーだけ（`useGradient`・`dropShadow` を除く）'
  - name: MermaidTheme
    title: mermaid のテーマ
    container: src/config.ts
    usecase: 共通
    summary: mermaid の図のテーマの名前（`"mdmark" | "default" | "neutral" | "dark" | "forest" | "base"`）
    description: '`mdmark` は描く先の要素の CSS 変数から作る mdmark の外観のテーマ、ほかは mermaid のテーマの名前'
    status: planned
    introduced:
      pr: 382
  - name: TooltipPlacement
    title: ツールチップを出す場所
    container: src/config.ts
    usecase: 共通
    summary: ツールチップを持ち主の上と下のどちらに先に出すか（`"top" | "bottom"`）
    description: '`top` は上に出し、上に収まらないときだけ下に出す。`bottom` は下に出し、下に収まらず上に収まるときだけ上に出す'
  - name: SideTocMode
    title: 右側の目次の出し方
    container: src/config.ts
    usecase: 共通
    summary: 右側の目次の出し方（`"hover" | "fixed"`）
    description: '`hover` は右端の線を出し、指すかフォーカスで目次を重ねて出す。`fixed` は目次を出すボタンでサイドバーを開閉する'
    status: planned
    introduced:
      pr: 166
  - name: ColorTheme
    title: 配色のテーマ
    container: src/config.ts
    usecase: 共通
    summary: mdmark に入れた配色のテーマの名前（`"dev-swiss" | "theme-paper" | "theme-slate" | "theme-contrast"`）
    status: planned
    introduced:
      pr: 181
  - name: ColorScheme
    title: 配色の明暗
    container: src/config.ts
    usecase: 共通
    summary: 描いた文書の配色の明暗（`"light" | "dark" | "auto"`）
    description: '`light`・`dark` は描く先の要素の class で祖先の class と OS の設定に勝たせ、`auto` は class を付けずに祖先の class と OS の設定に任せる'
    status: planned
  - name: PageSettings
    title: ページの設定
    container: src/config.ts
    usecase: 共通
    summary: 文書の page のマーカーから読み込んだ、設定より優先する値。記載しなかったキーは持たない
    properties:
      - name: scheme
        type: ColorScheme | undefined
        description: '`scheme=` の値'
      - name: theme
        type: ColorTheme | undefined
        description: '`theme=` の値'
      - name: toc
        type: SideTocMode | undefined
        description: '`toc=` の値'
    status: planned
constants:
  - name: DEFAULT_FEATURES
    title: 機能の既定
    container: src/config.ts
    summary: このバージョンが知っている機能とその既定。機能を作る Issue が行を追加する
    value: '{ print: true, table: true, callout: true, tabs: true, steps: true, tree: true, badge: true, footnotes: true, code: true, syntax: true, toc: true, anchors: true, sections: true, "row-details": true, figures: true, diagrams: true, "diagram-resize": true, glossary: true, backlinks: true, html: true, hints: true, mermaid: true, views: true, comments: false, "html-scripts": false, "side-toc": true, "back-to-top": true, "text-color": true, images: true, gallery: true, lightbox: true, media: true, gif: true, cards: true, icon: true, columns: true, highlight: true, kbd: true, details: true, pagebreak: true, include: true, wide: true, csv: true, "card-grid": true }'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[features.print]
  - name: DEFAULT_LIBRARIES
    title: 既定の対応表
    container: src/config.ts
    summary: マーカーの名前から `LibraryEntry` を参照する既定の対応表。この Issue では空で、外部ライブラリを使用する機能を作る Issue（#6）がバージョンを固定した URL の行を追加する
    value: '{}'
  - name: MARK_NAME_PATTERN
    title: マーカーの名前の書式
    container: src/config.ts
    summary: マーカーの名前と設定の `libraries` のキーが合うべき書式
    value: /^[a-z][a-z0-9-]*$/
  - name: DEFAULT_SYNTAX_URL
    title: 色分けのライブラリの既定の読み込み先
    container: src/config.ts
    summary: 設定の `syntax.url` が無いときに読み込む highlight.js の `es/` フォルダの URL。バージョンを固定する
    value: '"https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/"'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[syntax.url]
    status: planned
    introduced:
      pr: 97
  - name: COLOR_THEMES
    title: 選べるテーマ
    container: src/config.ts
    summary: mdmark に入れた配色のテーマの名前の並び。`resolveConfig`・CLI の点検と書き出しの警告が照らす
    value: '["dev-swiss", "theme-paper", "theme-slate", "theme-contrast"] as const'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[colorTheme]
    status: planned
    introduced:
      pr: 181
  - name: DEFAULT_COLOR_THEME
    title: 既定のテーマ
    container: src/config.ts
    summary: 設定に `colorTheme` が無いか知らない名前のときのテーマ。配色の値は `src/index.css` の `:root` の既定のまま
    value: '"dev-swiss"'
    status: planned
    introduced:
      pr: 181
  - name: COLOR_SCHEMES
    title: 記載できる明暗
    container: src/config.ts
    summary: 配色の明暗の値の並び。`resolveConfig`・page のマーカーの読み取り・CLI の点検が照らす
    value: '["light", "dark", "auto"] as const'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[colorScheme]
    status: planned
  - name: DEFAULT_COLOR_SCHEME
    title: 既定の明暗
    container: src/config.ts
    summary: 設定に `colorScheme` が無いか知らない値のときの明暗
    value: '"auto"'
    status: planned
  - name: DEFAULT_LABELS
    title: 既定の部品の文言
    container: src/config.ts
    summary: 設定の `labels.paramCopy` が空でない文字列でないときの部品の文言
    value: '{ paramCopy: "今の値を写す" }'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[labels.paramCopy]
    status: implemented
    introduced:
      pr: 258
  - name: DEFAULT_MERMAID_URL
    title: mermaid の既定の読み込み先
    container: src/config.ts
    summary: 設定の `mermaid.url` が無いときに読み込む mermaid の ES モジュールの URL。バージョンを固定する
    value: '"https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs"'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[mermaid.url]
      - dev/設計書/外部ライブラリ/mermaid#
    status: planned
    introduced:
      pr: 382
  - name: MERMAID_THEMES
    title: 選べる mermaid のテーマ
    container: src/config.ts
    summary: '`MermaidTheme` の値の並び。`resolveConfig` が照らす'
    value: '["mdmark", "default", "neutral", "dark", "forest", "base"] as const'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[mermaid.theme]
    status: planned
    introduced:
      pr: 382
  - name: DEFAULT_HTML_SCRIPTS_URL
    title: 範囲のスクリプトの変換のライブラリの既定の読み込み先
    container: src/config.ts
    summary: 設定の `html-scripts.url` が無いときに読み込む @babel/standalone の ES モジュールの URL。バージョンを固定する
    value: '"https://cdn.jsdelivr.net/npm/@babel/standalone@8.1.1/+esm"'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[html-scripts.url]
      - dev/設計書/外部ライブラリ/babel-standalone#
    status: planned
    introduced:
      pr: 303
functions:
  - name: resolveConfig
    title: 設定に既定を適用する
    container: src/config.ts
    kind: 関数
    scope: public
    summary: 利用側の設定に既定を当て、型の合わない値を落とした `ResolvedConfig` を返却する
    description: '`features` は `DEFAULT_FEATURES` のキーのうち、設定に真偽値があるものだけを置き換える。`libraries` は `MARK_NAME_PATTERN` に合うキーと文字列の値だけを取り、既定にある名前は `url` だけを置き換え、無い名前は `figure: true` で追加する。`tooltips.placement` は `bottom` のときだけ `bottom` にし、無い値・他の値は `top` にする。`tooltips.diagramPlacement` は `top` のときだけ `top` にし、無い値・他の値は `bottom` にする。`syntax.url` は文字列のときだけ取り、無い値・他の型は `DEFAULT_SYNTAX_URL` にする。`html-scripts.url` は文字列のときだけ取って `htmlScripts.url` に入れ、無い値・他の型は `DEFAULT_HTML_SCRIPTS_URL` にする。`side-toc.mode` は `fixed` のときだけ `fixed` にし、無い値・他の値は `hover` にする。`colorTheme` は `COLOR_THEMES` にあるときだけ取り、無い値・他の値・文字列でない値は `DEFAULT_COLOR_THEME` にする（例外を投げない）。`colorScheme` は `COLOR_SCHEMES` にあるときだけ取り、無い値・他の値・文字列でない値は `DEFAULT_COLOR_SCHEME` にする。`labels.paramCopy` は空でない文字列のときだけ取り、無い値・空文字・他の型は `DEFAULT_LABELS.paramCopy` にする。`mermaid.url` は文字列のときだけ取り、無い値・他の型は `DEFAULT_MERMAID_URL` にする。`mermaid.theme` は `MERMAID_THEMES` にあるときだけ取り、無い値・他の値は `mdmark` にする。`mermaid.themeVariables` はマップのときだけ、値が文字列のキーを取り、`useGradient`・`dropShadow` は取らない。指定されたオブジェクトは書き換えない'
    args:
      - name: options
        type: '{ config?: MdmarkConfig; defaultLibraries?: Record<string, LibraryEntry> }'
        required: true
        description: '`config` は利用側の設定、`defaultLibraries` は既定の対応表（既定 `DEFAULT_LIBRARIES`。単体テストで差し替える）'
    returns:
      type: ResolvedConfig
      description: 既定を適用した設定
    unit_tests:
      - name: test_resolve_config
        case: 正常
        summary: 設定が無ければ既定を返却する
        condition: '`config` が `undefined`'
        mock: なし
        expected: '`{ features: DEFAULT_FEATURES, libraries: {}, tooltips: { placement: "top", diagramPlacement: "bottom" }, syntax: { url: DEFAULT_SYNTAX_URL }, htmlScripts: { url: DEFAULT_HTML_SCRIPTS_URL }, mermaid: { url: DEFAULT_MERMAID_URL, theme: "mdmark", themeVariables: {} }, sideToc: { mode: "hover" }, colorTheme: "dev-swiss", colorScheme: "auto", labels: { paramCopy: "今の値を写す" } }`（`comments`・`html-scripts` を除く全ての機能が `true`）'
      - name: test_resolve_config_when_features_given
        case: 正常
        summary: 知っている機能の真偽値だけを置き換える
        condition: '`{ features: { print: false, unknown: true, other: "yes" } }`'
        mock: なし
        expected: '`features` が `DEFAULT_FEATURES` の `print` だけを `false` にした値'
      - name: test_resolve_config_when_libraries_given
        case: 正常
        summary: 書式に合う名前と文字列の URL だけを追加する
        condition: '`{ libraries: { "test-lib": "/fixtures/test-lib.js", "Bad Name": "/x.js", "num": 1 } }`'
        mock: なし
        expected: '`libraries` が `{ "test-lib": { url: "/fixtures/test-lib.js", figure: true } }`'
      - name: test_resolve_config_when_default_library_overridden
        case: 正常
        summary: 既定の行は URL だけを置き換え、`figure` は既定のまま
        condition: '`defaultLibraries` が `{ block: { url: "https://a/x.js", figure: false } }`、`config` が `{ libraries: { block: "/y.js" } }`'
        mock: なし
        expected: '`libraries.block` が `{ url: "/y.js", figure: false }`'
      - name: test_resolve_config_when_tooltip_placement_given
        case: 正常
        summary: '`bottom` だけを受け、他の値は `top` にする'
        condition: '`{ tooltips: { placement: "bottom" } }` と `{ tooltips: { placement: "left" } }`'
        mock: なし
        expected: 前者の `tooltips.placement` が `bottom`、後者は `top`
      - name: test_resolve_config_when_syntax_url_given
        case: 正常
        summary: 文字列の `syntax.url` だけを受け、他の型は既定にする
        condition: '`{ syntax: { url: "/vendor/highlightjs/es/" } }` と `{ syntax: { url: 1 } }`'
        mock: なし
        expected: 前者の `syntax.url` が `/vendor/highlightjs/es/`、後者は `DEFAULT_SYNTAX_URL`
      - name: test_resolve_config_when_side_toc_mode_given
        case: 正常
        summary: '`fixed` だけを受け、他の値と無いときは `hover` にする'
        condition: '`{ "side-toc": { mode: "fixed" } }`、`{ "side-toc": { mode: "left" } }`、`{}`'
        mock: なし
        expected: 1 つ目の `sideToc.mode` が `fixed`、残りは `hover`。`{}` の `features["side-toc"]` と `features["back-to-top"]` が `true`
      - name: test_resolve_config_when_color_theme_given
        case: 正常
        summary: '`COLOR_THEMES` の名前だけを受け、他の値と無いときは `dev-swiss` にする'
        condition: '`{ colorTheme: "theme-slate" }`、`{ colorTheme: "sepia" }`、`{ colorTheme: 1 }`、`{}`'
        mock: なし
        expected: 1 つ目の `colorTheme` が `theme-slate`、残りは `dev-swiss`。例外を投げない
      - name: test_resolve_config_when_color_scheme_given
        case: 正常
        summary: '`COLOR_SCHEMES` の値だけを受け、他の値と無いときは `auto` にする'
        condition: '`{ colorScheme: "dark" }`、`{ colorScheme: "sepia" }`、`{ colorScheme: 1 }`、`{}`'
        mock: なし
        expected: 1 つ目の `colorScheme` が `dark`、残りは `auto`。`{}` の `features["card-grid"]` が `true`。例外を投げない
      - name: test_resolve_config_when_labels_given
        case: 正常
        summary: 空でない文字列の `labels.paramCopy` だけを受け、空文字・他の型・無いときは既定にする
        condition: '`{ labels: { paramCopy: "コピー" } }`、`{ labels: { paramCopy: "" } }`、`{ labels: { paramCopy: 1 } }`、`{ labels: { other: "x" } }`'
        mock: なし
        expected: '1 つ目の `labels` が `{ paramCopy: "コピー" }`、残りは `{ paramCopy: "今の値を写す" }`（知らないキー `other` を持たない）。例外を投げない'
      - name: test_resolve_config_when_html_scripts_url_given
        case: 正常
        summary: 文字列の `html-scripts.url` だけを受け、他の型と無いときは既定にする
        condition: '`{ "html-scripts": { url: "/vendor/babel.mjs" } }`・`{ "html-scripts": { url: 1 } }`・`{}`'
        mock: なし
        expected: 1 つ目の `htmlScripts.url` が `/vendor/babel.mjs`、残りは `DEFAULT_HTML_SCRIPTS_URL`。`{}` の `features["html-scripts"]` が `false`
      - name: test_resolve_config_when_mermaid_given
        case: 正常
        summary: mermaid の url・theme・themeVariables の型の合う値だけを受ける
        condition: '`{ mermaid: { url: "/vendor/mermaid.mjs", theme: "neutral", themeVariables: { primaryColor: "#e0f2f1", useGradient: "true", dropShadow: "x", fontSize: 14 } } }`・`{ mermaid: { url: 1, theme: "no-such-theme", themeVariables: "x" } }`・`{}`'
        mock: なし
        expected: '1 つ目の `mermaid` が `{ url: "/vendor/mermaid.mjs", theme: "neutral", themeVariables: { primaryColor: "#e0f2f1" } }`、残りは `{ url: DEFAULT_MERMAID_URL, theme: "mdmark", themeVariables: {} }`。`{}` の `features.mermaid` が `true`。例外を投げない'
      - name: test_resolve_config_when_diagram_placement_given
        case: 正常
        summary: '`top` だけを受け、他の値と無いときは `bottom` にする'
        condition: '`{ tooltips: { diagramPlacement: "top" } }`、`{ tooltips: { diagramPlacement: "left" } }`、`{ tooltips: { placement: "bottom" } }`'
        mock: なし
        expected: '`tooltips.diagramPlacement` が順に `top`・`bottom`・`bottom`。3 つ目の `tooltips.placement` は `bottom`'
  - name: applyPageSettings
    title: ページの設定を重ねる
    container: src/config.ts
    kind: 関数
    scope: internal
    summary: 既定を適用した設定に、文書の page のマーカーの値を重ねた設定を返却する
    description: '`page.scheme` があれば `colorScheme`、`page.theme` があれば `colorTheme`、`page.toc` があれば `sideToc.mode` を置き換える。無いキーは設定の値のまま。指定されたオブジェクトは書き換えない'
    args:
      - name: options
        type: '{ config: ResolvedConfig; page: PageSettings }'
        required: true
        description: 既定を適用した設定と、`renderDocument` が返却したページの設定
    returns:
      type: ResolvedConfig
      description: '`mount` が描くのに使用する設定'
    unit_tests:
      - name: test_apply_page_settings
        case: 正常
        summary: マーカーに記載したキーだけを置き換える
        condition: '`colorScheme: "dark"`・`colorTheme: "theme-paper"`・`sideToc.mode: "hover"` の設定に、`{ scheme: "light", toc: "fixed" }` を重ねる。別に `{}` を重ねる'
        mock: なし
        expected: 1 つ目は `colorScheme` が `light`・`colorTheme` が `theme-paper`・`sideToc.mode` が `fixed`。2 つ目は設定と同じ値。指定した設定は変わらない
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[ページの設定のマーカー]
    status: planned
  - name: resolveFeatures
    title: 文書のマーカーで機能のオン・オフを決める
    container: src/features.ts
    kind: 関数
    scope: public
    summary: 設定の `features` に、文書の `features` のマーカーの引数（`+名前`・`-名前`）を記載した順に重ねる
    description: 既定に無い名前と、`+`・`-` で始まらない引数は無視する。同じ名前が何度も出たら後のものが勝つ。機能を作る Issue は、この戻り値を読み込んで機能を出すかを決める
    args:
      - name: options
        type: '{ defaults: Record<string, boolean>; args: string[] }'
        required: true
        description: '`defaults` は既定を適用した設定の `features`、`args` は文書の `features` のマーカーの引数を記載した順に並べたもの'
    returns:
      type: Record<string, boolean>
      description: 決まったオン・オフ（`defaults` は書き換えない）
    unit_tests:
      - name: test_resolve_features
        case: 正常
        summary: マーカーが無ければ設定のまま
        condition: '`defaults` が `{ print: true }`、`args` が `[]`'
        mock: なし
        expected: '`{ print: true }`'
      - name: test_resolve_features_when_disabled
        case: 正常
        summary: '`-名前` でオフにする'
        condition: '`defaults` が `{ print: true }`、`args` が `["-print"]`'
        mock: なし
        expected: '`{ print: false }`'
      - name: test_resolve_features_when_enabled
        case: 正常
        summary: '`+名前` でオンにし、知らない名前と符号の無い引数を無視する'
        condition: '`defaults` が `{ print: false }`、`args` が `["+print", "+unknown", "print"]`'
        mock: なし
        expected: '`{ print: true }`'
      - name: test_resolve_features_when_repeated
        case: 正常
        summary: 同じ名前は後のものが勝つ
        condition: '`defaults` が `{ print: true }`、`args` が `["-print", "+print"]`'
        mock: なし
        expected: '`{ print: true }`'
notes:
  設定の Schema: '`schemas/mdmark.config.schema.json`（draft 2020-12）は設定の設計書の `settings` と同じキーと型を持つ。`features` は値が真偽値のオブジェクト、`libraries` はキーが `MARK_NAME_PATTERN`（`propertyNames.pattern`）で値が文字列のオブジェクト。`features.syntax` は真偽値、`syntax` は `url`（文字列）を持つオブジェクト。`side-toc` は `mode`（`hover` / `fixed` の列挙）を持つオブジェクト。`colorTheme` は文字列（知らない名前は Schema で拒まず、`mdmark check` が `unknown_color_theme` で返却する）。`colorScheme` も文字列（知らない値は `unknown_color_scheme` で返却する）。`labels` は `paramCopy`（`minLength: 1` の文字列）を持つオブジェクト。Schema を変えたら `migrations/no-steps.yaml` に `version: next` の行を配置する。他の Issue が追加するキーを拒まないよう、最上位は `additionalProperties` を許す'
test_files:
  - tests/unit/src/config.test.ts
  - tests/unit/src/features.test.ts
