  - name: splitMermaidTitle
    title: タイトルを取り出す
    container: src/mermaid-source.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: 'ソースの先頭の front matter（`---` の行で囲んだ範囲）の `title:` の値を取り出してその行を除く。front matter に `title` が無ければ、`accTitle:` の行の値を取る（`accTitle` の行は残す）。図の種類の行の最初の単語を `kind` にする'
