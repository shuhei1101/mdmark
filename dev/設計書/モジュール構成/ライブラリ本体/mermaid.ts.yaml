functions:
  - name: attachMermaid
    title: mermaid の図を付ける
    container: src/mermaid.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: '`root` の中の `[data-mdmark-mermaid]` のコードブロックが 1 つ以上あれば、読み込み中のブロックに替えて mermaid を読み込み、ソースを SVG にして図の枠に置き換え、図の操作を付ける。配色の明暗が変わったら再描画する'
    description: 読み込み先は、`embeddedMermaid` があればそのモジュール（URL を読み込まない。`default` に `render` が無ければ読み込めないときと同じ扱いにし、`console.error` に出さない）、無ければ `url` を `document.baseURI` を基準に解決した URL。読み込みの Promise は `modules` に記録し、同じ `mount` の再描画では再読み込みしない。待ちに時間の上限は配置しない
    is_async: false
    side_effects: '`root` の中の mermaid のコードブロックに `hidden` を付けて前後に要素を配置する。mermaid の `initialize` を呼ぶ。読み込めないモジュールを `console.error` に出す。祖先の `class` を `MutationObserver` で、OS の配色を `matchMedia("(prefers-color-scheme: dark)")` の `change` で確認する'
    args:
      - name: options
        type: '{ root: HTMLElement; scope: HTMLElement; config: ResolvedConfig; mountId: number; isCurrent: () => boolean; modules: Map<string, Promise<{ default?: unknown }>>; placement: TooltipPlacement; importModule?: SyntaxImport }'
        required: true
        description: '`root` は描いた要素（本文の列）、`scope` は描く先の要素（`mount` の `el`。明暗の class を持つ）、`config` はこの描画の設定（`mermaid` を使用する）、`mountId` は `mount` の通し番号（`render` の `id` に使用する）、`isCurrent` は描いた文書がまだ今のものか、`modules` は `mount` ごとに 1 つの読み込んだモジュールの記録、`placement` は図のツールチップを先に出す側、`importModule` はモジュールを読み込む関数（既定 `(url) => import(url)`）'
    returns:
      type: '{ ready: Promise<void>; detach: () => void }'
      description: '`ready` は全ての対象を図か通知ブロックか記載の警告にし終えたら解決する（失敗しても拒否しない）。`detach` は監視と付けた図の操作を削除する'
    process: |-
      1. `root` の中の `[data-mdmark-mermaid]` を取得する。無ければ何も読み込まず、解決した `ready` と何もしない `detach` を返却する
      2. 取得した要素ごとに、中の `code` の `textContent` をソースとして記録し、要素に `hidden` を付け、前に `renderEmbed({ name: "mermaid" })` の読み込み中のブロックを配置する（部品設計『読み込み中のブロック』）。マーカーの場所の外部ライブラリを取得する処理（マーカーの場所に外部ライブラリを描かせる）は先に呼び終えているため、この枠を取得しない
      3. モジュールを決め、`modules` に無ければ読み込み始めて記録し、待つ
         - `[error]` mermaid を読み込めない（URL と元のエラーを `console.error` に出す）。待った後に `isCurrent()` が `false` なら何もせずに終える。そうでなければ、各読み込み中のブロックを `renderNotice({ name: "mermaid", figure: true })` の通知ブロックに替え、要素の `hidden` を削除して終える
      4. 待った後に `isCurrent()` が `false` なら何もせずに終える
      5. 対象を文書の順に描く（mermaid の図を描く）。描けた対象は、読み込み中のブロックと要素を図の枠に置き換える。解釈できない対象は、読み込み中のブロックを `renderSyntaxWarning` の記載の警告（本文は画面設計『文書』の mermaid の行。`{mermaid のエラーの 1 行目}` は例外の `message` の 1 行目）に替え、要素の `hidden` を削除する
      6. 置き換えた図の枠に図の操作を付ける（図の拡大・縮小・移動・全画面を付ける。`root` と、置き換えた `figure` の並びを `figures` に指定する）。削除する関数を記録する
      7. 描き終えたときのテーマの変数を記録し、明暗の監視を付ける。`scope` の祖先の要素の `class` の変更（`scope` 自身は見ない）と `prefers-color-scheme` の `change` で、テーマの変数を再作成し（テーマの変数を作る）、記録した値と違えば、記録したソースから手順 5・6 をもう一度実行する（前の図の操作を削除し、図の枠を新しい図の枠に置き換える）
      8. `detach` は監視と図の操作を削除する。`mount` は再描画する前・`destroy`・同じ要素への 2 回目の `mount` で呼ぶ
    callees:
      - '#functions[drawMermaidDiagram]'
      - '#functions[mermaidThemeVariables]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderEmbed]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderNotice]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSyntaxWarning]
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[attachDiagrams]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[mermaid の対象]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[mermaid の読み込み]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[mermaid を読めないとき]
    test_setup:
      - name: mermaid のコードブロック
        description: '`render` で、front matter の `title` を持つ flowchart と `actor` を持つ sequenceDiagram の 2 つの mermaid のコードブロックを描いた要素（`src/index.css` を適用した Chromium のページ）'
      - name: mermaid のモジュール
        description: npm の `mermaid@12.3.0` の `dist/mermaid.esm.min.mjs` を、`importModule` が返却する
    unit_tests:
      - name: test_attach_mermaid
        case: 正常
        summary: 読み込みの間は読み込み中のブロックを配置し、描いたら図の枠に置き換えて操作を付ける
        condition: 'mermaid のコードブロックの要素。`config.mermaid` は既定'
        mock: '`importModule` が mermaid のモジュールを返却する。返却する前に 1 回止める'
        expected: '止めている間、`div.mdmark-embed[data-mdmark-slot="mermaid"]` が 2 つあり、コードブロックが `hidden`。`ready` の後は `figure.mdmark-diagram[data-diagram="mermaid"]` が 2 つで、1 つ目の題名が front matter の `title`、2 つ目が `シーケンス図`。読み込み中のブロックとコードブロックが無く、倍率のボタンがある。`importModule` が 1 回'
      - name: test_attach_mermaid_when_no_target
        case: 正常
        summary: 対象が無ければ何も読み込まない
        condition: '`data-mdmark-mermaid` を持たない `ts` のコードブロックだけの要素'
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれず、`ready` が解決する'
      - name: test_attach_mermaid_when_unavailable
        case: 異常
        summary: 読み込めないときは通知ブロックに替えてコードブロックを出す
        condition: mermaid のコードブロックの要素
        mock: '`importModule` が `new Error("404")` で拒否する。`console.error` を見張る'
        expected: '`ready` が解決し、各コードブロックの前に `mdmark-notice` があり、コードブロックの `hidden` が無く、読み込み中のブロックが無い。`console.error` が URL と `Error("404")` を含めて呼ばれる'
      - name: test_attach_mermaid_when_syntax_invalid
        case: 異常
        summary: 解釈できないソースは記載の警告に替え、ほかは描く
        condition: '1 つ目が図の種類の行を持たないソース、2 つ目が flowchart の要素'
        mock: mermaid のモジュール
        expected: 1 つ目のコードブロックの前に `mdmark-syntax-warning` があり、本文が `mermaid の図を描けません（` で始まる。2 つ目は図の枠。文書に `#d` で始まる id のエラーの図が無い
      - name: test_attach_mermaid_when_stale
        case: 正常
        summary: 読み込み終えたときに再描画していたら何もしない
        condition: mermaid のコードブロックの要素。`isCurrent` が `false` を返却する
        mock: mermaid のモジュール
        expected: 図の枠が無く、`render` を呼ばない
      - name: test_attach_mermaid_when_embedded
        case: 正常
        summary: 埋めたモジュールがあれば URL を読み込まない
        condition: '`setEmbeddedMermaid({ default: mermaid })` の後に mermaid のコードブロックの要素。終えたら `setEmbeddedMermaid(undefined)`'
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれず、図の枠が 2 つ'
      - name: test_attach_mermaid_when_embedded_without_module
        case: 異常
        summary: 埋めたモジュールが mermaid を持たなければ、外へ読み込まずに通知ブロックにする
        condition: '`setEmbeddedMermaid({})` の後に mermaid のコードブロックの要素。終えたら `setEmbeddedMermaid(undefined)`'
        mock: '`importModule` と `console.error` を見張る'
        expected: '`importModule` と `console.error` が呼ばれず、各コードブロックの前に `mdmark-notice` がある'
      - name: test_attach_mermaid_when_scheme_changed
        case: 正常
        summary: 祖先の明暗の class が変わったら再描画し、変わらなければ再描画しない
        condition: '描いた後に `document.body` へ `mdmark-theme-dark` を付け、次に明暗に関わらない class `x` を付ける'
        mock: mermaid のモジュール。`render` の回数を数える
        expected: '`mdmark-theme-dark` の後に `render` が 2 回増え、flowchart のノードの塗りの計算済みの色が暗い配色の `--mdmark-color-surface` と一致する。`x` の後は増えない'
      - name: test_attach_mermaid_when_detached
        case: 正常
        summary: 削除すると明暗が変わっても再描画しない
        condition: 描いた後に `detach()` を呼び、`document.body` へ `mdmark-theme-dark` を付ける
        mock: mermaid のモジュール。`render` の回数を数える
        expected: '`render` の回数が増えず、倍率のボタンを押しても倍率が変わらない'
      - name: test_attach_mermaid_when_small
        case: 正常
        summary: 表示する枠より小さい図を、枠の中で横の中央に配置する
        condition: 幅 1000px の描く先に、ノード 2 つの flowchart の mermaid のコードブロック
        mock: mermaid のモジュール
        expected: '`.mdmark-diagram-sizer` の幅が表示する枠より狭く、表示する枠の左端からの空きと右端までの空きの差が 2px 以内'
  - name: drawMermaidDiagram
    title: mermaid の図を描く
    container: src/mermaid.ts
    kind: 関数
    scope: internal
    is_async: true
    usecase: mermaidの図を描く
    summary: '1 つのソースを、今の配色のテーマと、暗い配色のときは明るい配色のテーマでも `render` し、図の枠の HTML を返却する。解釈できなければ例外のメッセージを返却する'
    side_effects: '`renderQueue` に `initialize` と `render` の組をつなぐ。暗い配色のときは `scope` の明暗の class を同じタスクの中で一時的に明るい配色の class に替えて戻す。mermaid が文書に残すエラーの図を削除する'
    args:
      - name: options
        type: '{ mermaid: MermaidModule; source: string; root: HTMLElement; scope: HTMLElement; config: ResolvedConfig["mermaid"]; id: string; frameId: string; resizable?: boolean }'
        required: true
        description: '読み込んだ mermaid・ソース・描いた要素・描く先の要素・設定の `mermaid`・`render` に指定する id（`mdmark-mermaid-{mountId}-{通し番号}`。描くたびに新しい値にする。mermaid の `render` は同じ id の要素を文書から削除するため）・図の枠の `id` の頭・リサイズハンドルを配置するか（既定 `true`。`attachMermaid` は機能 `diagram-resize` を指定する）'
    returns:
      type: 'Promise<{ html: string } | { error: string }>'
      description: '`html` は図の枠の HTML、`error` は mermaid の例外の `message` の 1 行目'
    process: |-
      1. ソースのタイトルを取り出す（タイトルを取り出す）。タイトルが無ければ図の種類の名前を参照する（図の種類の名前を参照する）
      2. 今の配色のテーマの変数を作る（テーマの変数を作る。`scope` を指定する）
      3. 描く先が暗い配色か（`--mdmark-color-bg` の明るさが 0.5 未満か）を確認する。暗い配色なら、同じタスクの中で `scope` の `mdmark-theme-dark` を削除して `mdmark-theme-light` を付け、明るい配色のテーマの変数を作り、`scope` の class を元に戻す（`:root` に該当する配色の値は描く先の明暗の class で決まり、描画を挟まないため画面は変わらない）
      4. `renderQueue` につないで、`initialize({ startOnLoad: false, securityLevel: "strict", theme, themeVariables, gantt: { useWidth: max(root.clientWidth, MERMAID_GANTT_MIN_WIDTH) } })` と `render(id, body)` を順に呼ぶ。`theme` は設定の `theme` が `mdmark` なら `base`、それ以外はその名前。暗い配色なら明るい配色のテーマの変数でも `initialize` と `render(id + "-print", body)` を呼ぶ
         - `render` が例外を投げた場合、`document.getElementById("d" + id)` を削除し、`{ error }` を返却する
      5. SVG を要素にして、actor のアイコンを替え（actor のアイコンを替える）、`width`・`height` の属性を `viewBox` の幅と高さにし、`style` を削除する
      6. 図の部品の HTML（mermaid の図を描く部品。`svg`・`printSvg`・`width`）を中身に、図の枠の HTML（図の枠を描く。`kind: "mermaid"`・`title`・`legend: []`・`fitMin: MERMAID_MIN_FIT`・`resizable` は機能 `diagram-resize`）を返却する
    callees:
      - '#functions[splitMermaidTitle]'
      - '#functions[mermaidKindName]'
      - '#functions[mermaidThemeVariables]'
      - '#functions[replaceMermaidActors]'
      - '#functions[renderMermaidDiagram]'
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[renderDiagramFrame]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[mermaid の描き方]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[mermaid のテーマ]
    unit_tests:
      - name: test_draw_mermaid_diagram
        case: 正常
        summary: 明るい配色では SVG を 1 つだけ配置し、固定の初期化の設定で描く
        condition: '`attachMermaid` のセットアップの flowchart のソース。描く先は明るい配色'
        mock: mermaid のモジュールの `initialize` を見張る
        expected: '`html` の `svg` が 1 つで、`mdmark-mermaid-print` が無い。`initialize` が `startOnLoad: false`・`securityLevel: "strict"`・`theme: "base"`・`themeVariables.useGradient: false`・`themeVariables.dropShadow: "none"` で 1 回呼ばれる。ノードの枠線の `stroke` が `url(` で始まらない'
      - name: test_draw_mermaid_diagram_when_dark
        case: 正常
        summary: 暗い配色では明るい配色の図も描いて並べ、描く先の class を戻す
        condition: 'flowchart のソース。`scope` が class `mdmark-theme-dark` を持つ'
        mock: mermaid のモジュールの `initialize` を見張る
        expected: '`html` の `svg` が 2 つで、2 つ目が `mdmark-mermaid-print` の中にあり `aria-hidden="true"`。`initialize` が 2 回で、2 回目の `themeVariables.primaryColor` が明るい配色の `--mdmark-color-surface` の hex。終えた後の `scope` の class が `mdmark-theme-dark` だけ'
      - name: test_draw_mermaid_diagram_when_theme_configured
        case: 正常
        summary: 'mermaid のテーマを選び、変数を重ね、固定の値は変えさせない'
        condition: '`config` が `{ theme: "neutral", themeVariables: { primaryColor: "#e0f2f1", useGradient: "true" } }`'
        mock: mermaid のモジュールの `initialize` を見張る
        expected: '`initialize` が `theme: "neutral"`・`themeVariables` が `{ primaryColor: "#e0f2f1", useGradient: false, dropShadow: "none" }` で呼ばれる'
      - name: test_draw_mermaid_diagram_when_invalid
        case: 異常
        summary: 解釈できないソースはエラーの 1 行目を返却し、エラーの図を削除する
        condition: 図の種類の行を持たないソース
        mock: mermaid のモジュール
        expected: '`{ error }` の `error` が改行を含まず、文書に `id` が `d` + `id` の要素が無い'
      - name: test_draw_mermaid_diagram_when_gantt
        case: 正常
        summary: ガントチャートは 720px より狭い描く先でも 720px で描く
        condition: 幅 400px の描く先と gantt のソース
        mock: mermaid のモジュールの `initialize` を見張る
        expected: '`initialize` の `gantt.useWidth` が `720`、図の枠の `figure` が `data-fit-min="0.75"`'
      - name: test_draw_mermaid_diagram_when_end_in_name
        case: 正常
        summary: 名前に _end を含むノードと状態に終了のマーカーの規則を当てず、状態遷移図の終了のマーカーだけを本文の色にする
        condition: '`flowchart LR` の円柱のノード `job_end[(記録)]` と、状態 `受付_end` を持つ `stateDiagram-v2` を `src/index.css` を適用した描く先に描く'
        mock: mermaid のモジュール
        expected: 'ページの CSS のセレクタに `_end` を含む規則（入れ子の親のセレクタを重ねた構造）が、`job_end` のノードと `受付_end` の状態の構造に該当せず、それらの塗りが本文の色でない。状態遷移図の終了のマーカーの内側の塗りが `--mdmark-color-text` の計算済みの色'
  - name: mermaidThemeVariables
    title: テーマの変数を作る
    container: src/mermaid.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: 'テーマ `mdmark` なら、描く先の要素の計算済みの CSS 変数から `MERMAID_THEME_COLORS` の変数を hex で作り、`fontFamily`（`--mdmark-font-body`）・`fontSize`（描く先の `font-size`）・`pieOpacity: "1"` を追加する。ほかのテーマは空から始める。設定の `themeVariables` の値が文字列のキーを重ね、最後に `MERMAID_FIXED_THEME_VARIABLES` を重ねる'
    side_effects: 試しの要素を `scope` に配置して削除する
    args:
      - name: options
        type: '{ scope: HTMLElement; config: ResolvedConfig["mermaid"] }'
        required: true
        description: CSS 変数を解決する要素と、設定の `mermaid`
    returns:
      type: Record<string, string | boolean>
      description: '`initialize` の `themeVariables`'
    callees:
      - '#functions[cssColorToHex]'
    unit_tests:
      - name: test_mermaid_theme_variables
        case: 正常
        summary: 対応表の変数を全て hex にし、固定の値を重ねる
        condition: '`src/index.css` を適用した描く先と、既定の `config`'
        mock: なし
        expected: '`MERMAID_THEME_COLORS` の全てのキーが `#` で始まる 7 桁か 9 桁の値で、`primaryColor` が `--mdmark-color-surface` の hex。`useGradient` が `false`、`dropShadow` が `none`、`pieOpacity` が `1`、`fontFamily` が `--mdmark-font-body` の値'
      - name: test_mermaid_theme_variables_when_other_theme
        case: 正常
        summary: mermaid のテーマでは CSS 変数を使用せず、設定の文字列の値と固定の値だけにする
        condition: '`config` が `{ theme: "dark", themeVariables: { lineColor: "#ff0000", fontSize: 14 } }`'
        mock: なし
        expected: '`{ lineColor: "#ff0000", useGradient: false, dropShadow: "none" }`'
  - name: cssColorToHex
    title: 色を hex にする
    container: src/mermaid.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: '`scope` の中に `color: var({name})` の試しの要素を配置して計算済みの `color` を読み込み、sRGB の hex にして試しの要素を削除する。`rgb()`・`rgba()` は値を読み込み、ほかの記載方法（`oklab()`・`color()`）は 1×1 の canvas（`colorSpace: "srgb"`）に塗って `getImageData` で読み込む。透明度が 1 なら `#rrggbb`、それ以外は `#rrggbbaa`'
    args:
      - name: options
        type: '{ scope: HTMLElement; name: string }'
        required: true
        description: 解決する要素と CSS 変数の名前
    returns:
      type: string
      description: hex の色
    reason: PoC #384 で、canvas で `#rrggbbaa` にすると透明度の低い色の RGB が丸めでずれたため、`rgb()`・`rgba()` は canvas を経由しない
    unit_tests:
      - name: test_css_color_to_hex
        case: 正常
        summary: rgb・rgba は丸めずに読み込み、color-mix の値も hex にする
        condition: '`--a: rgb(24 24 27)`・`--b: rgba(24, 24, 27, 0.14)`・`--c: color-mix(in oklab, #0f766e 50%, #ffffff)` を持つ要素'
        mock: なし
        expected: '`#18181b`・`#18181b24`・`#` で始まる 7 桁の値'
  - name: replaceMermaidActors
    title: actor のアイコンを替える
    container: src/mermaid.ts
    kind: 関数
    scope: internal
    usecase: mermaidの図を描く
    summary: 'SVG の `g.actor-man` ごとに、子の `circle`（`cx`・`cy`・`r`）と `line`（`x1`・`y1`・`x2`・`y2`）の属性から包むノードを求め、`text` 以外の子を削除し、ノードの幅と高さの小さいほうを辺にした lucide の `user` の `svg`（class `mdmark-mermaid-actor`）をノードの中央に配置する'
    description: '`getBBox` を使用せず属性から求め、画面に出していない印刷用の SVG にも同じく適用する。`circle` を持たない `g.actor-man` は替えない'
    side_effects: '`svg` を書き換える'
    args:
      - name: svg
        type: SVGSVGElement
        required: true
        description: mermaid が描いた SVG
    returns:
      type: void
      description: なし
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[iconSvg]
    reason: 確認ログの「シーケンス図の actor のアイコン」（推奨案 A）
    unit_tests:
      - name: test_replace_mermaid_actors
        case: 正常
        summary: 棒人間を lucide の人のアイコンに替え、名前の文字は残す
        condition: '`circle cx="75" cy="20" r="10"` と `line` 4 本（x 60〜90・y 30〜60）と `text` を持つ `g.actor-man`'
        mock: なし
        expected: '`g.actor-man` の子が `svg.mdmark-mermaid-actor` と `text` だけで、`svg` の `width`・`height` が `30`・`x` が `60`・`y` が `10`'
  - name: setEmbeddedMermaid
