test_files:
  - tests/unit/src/mermaid-source.test.ts
  - tests/unit/src/mermaid.browser.test.ts
  - tests/unit/src/parts/mermaid.test.ts
notes:
  他の分類への変更: '`mount` は記法の操作と外部ライブラリの後に `attachMermaid` を呼ぶ（分類『描く』）。`render` は機能 `mermaid` がオンなら言語 `mermaid` のコードブロックに `data-mdmark-mermaid` を付ける（分類『記法』『部品』）。図の枠は種類 `mermaid` と倍率の下限を持ち、`attachDiagrams` は指定した図だけに付けられる（分類『図』）。書き出しは mermaid をまとめ、起動の処理が `setEmbeddedMermaid` で指定する（分類『CLI』『書き出したHTMLの起動』）'
