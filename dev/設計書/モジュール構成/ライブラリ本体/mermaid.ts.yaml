title: "ライブラリ本体 / mermaid"
lead: '`mount` が描いた mermaid のコードブロックを、mermaid で描いた SVG の図の枠に置き換える処理。描く先の CSS 変数から mermaid のテーマの変数を作り、配色の明暗が変わったら再描画する。ソースの読み取りと図の部品の HTML は DOM を使用せず、読み込みと描画はブラウザでだけ動く。'
directory: |-
  ```tree
  src/
  ├── mermaid.ts          # mermaid を読み込んで図にする attachMermaid と、埋めたモジュールの記録・テーマの変数の解決・actor のアイコンの置き換え
  ├── mermaid-source.ts   # ソースのタイトルの取り出し・図の種類の名前・テーマの変数の対応表（DOM を使用しない）
  └── parts/
      └── mermaid.ts      # 部品『mermaid の図』の renderMermaidDiagram
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class mermaidの図を付ける
        class テーマの変数を作る
        class 色をhexにする
        class タイトルを取り出す
        class 図の種類の名前を参照する
        class actorのアイコンを替える
        class mermaidの図を描く
        class 図の枠を描く
        mermaidの図を付ける --> テーマの変数を作る : 描くたびに呼ぶ
        テーマの変数を作る --> 色をhexにする
        mermaidの図を付ける --> タイトルを取り出す
        mermaidの図を付ける --> 図の種類の名前を参照する : タイトルが無いとき
        mermaidの図を付ける --> actorのアイコンを替える
        mermaidの図を付ける --> mermaidの図を描く
        mermaidの図を付ける --> 図の枠を描く
      ```
data_models:
  - name: MermaidModule
    title: mermaid のモジュール
    container: src/mermaid.ts
    usecase: mermaidの図を描く
    summary: '`import()` で読み込んだ mermaid の ES モジュールが既定のエクスポートで持つ構造'
    properties:
      - name: initialize
        type: '(config: Record<string, unknown>) => void'
        description: ページの中で 1 つの mermaid の設定を置き換える
      - name: render
        type: '(id: string, source: string) => Promise<{ svg: string }>'
        description: ソースを SVG の文字列にする。解釈できないソースは例外で拒否し、文書の `#d{id}` にエラーの図を残す
    refs:
      - dev/設計書/外部ライブラリ/mermaid#
  - name: MermaidSource
    title: mermaid のソースの読み取り
    container: src/mermaid-source.ts
    usecase: mermaidの図を描く
    summary: '`splitMermaidTitle` の戻り値'
    properties:
      - name: title
        type: string | undefined
        description: front matter の `title`、無ければ `accTitle` の値。どちらも無ければ持たない
      - name: body
        type: string
        description: mermaid の `render` に指定するソース。front matter から `title` の行を除き、ほかの行が無ければ front matter ごと除く
      - name: kind
        type: string
        description: 図の種類の行の最初の単語（`flowchart`・`sequenceDiagram` など）。無ければ空
