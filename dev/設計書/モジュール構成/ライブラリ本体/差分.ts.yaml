  - name: loadDiffPair
    title: 比べる 2 つの本文を取り出す
    container: src/diff/blocks.ts
    summary: 取り出し元の一覧を 1 回、前と後の本文を 1 回ずつ呼び、ブロックの色分けに使う 2 つの Markdown を返す
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 取り出し元を呼ぶ。取り出せないときは `console.error` に出す
    args:
      - name: options
        type: '{ source: DiffSource; docId: string }'
        required: true
        description: '`mount` に渡された取り出し元と文書の `id`'
    returns:
      type: Promise<DiffPair>
      description: 取り出した結果。reject しない
    process: |-
      1. `source.revisions(docId)` を待ち、`checkRevisions` で検める。拒否か投げたら `{ kind: "failed" }` を返す
         - `[error]` リビジョンの一覧を取り出せない（`revisions`・`docId`・元のエラーを `console.error` の引数に並べる。`attachDiff` と同じ）
      2. リビジョンが 1 つ以下なら `{ kind: "single" }` を返す
      3. 2 番目（前）と 1 番目（後）の `source.content({ docId, revisionId })` を並んで待つ。拒否か文字列でないものがあれば `{ kind: "failed" }` を返す
         - `[error]` 本文を取り出せない（`content`・`docId`・リビジョンの `id`・元のエラーか合わなかった値を並べる。`attachDiff` と同じ）
      4. `{ kind: "pair", before, after }` を返す
    unit_tests:
      - name: test_load_diff_pair
        case: 正常
        summary: 2 番目を前、1 番目を後にして取り出す
        condition: '`modified`・`original` を返し、`content` がリビジョンごとの全文を返す取り出し元'
        mock: 取り出し元は呼ばれた引数を控える関数
        expected: '`revisions` が 1 回、`content` が `original`・`modified` で 1 回ずつ呼ばれ、`{ kind: "pair" }` の `before` が `original`、`after` が `modified` の全文'
      - name: test_load_diff_pair_when_single
        case: 正常
        summary: リビジョンが 1 つなら本文を取り出さない
        condition: '`revisions` が 1 つを返す'
        mock: 取り出し元は呼ばれた引数を控える関数
        expected: '`{ kind: "single" }` を返し、`content` が呼ばれない'
      - name: test_load_diff_pair_when_content_rejected
        case: 異常
        summary: 本文を取り出せなければ failed を返す
        condition: '`content` が `original` で拒否する'
        mock: '`console.error` を控える関数で包む'
        expected: '`{ kind: "failed" }` を返し、`console.error` の引数に `content`・`docId`・`original`・元のエラーを含む'
      - name: test_load_diff_pair_when_revisions_invalid
        case: 異常
        summary: 一覧の形が合わなければ failed を返す
        condition: '`revisions` が `{}` を返す'
        mock: '`console.error` を控える関数で包む'
        expected: '`{ kind: "failed" }` を返し、`content` が呼ばれない'
    callees:
      - '#functions[checkRevisions]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[差分の出し方]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[差分の取り出し元]
    status: planned
    introduced:
      pr: 196
  - name: collectBlockRanges
    title: ブロックに分ける
    container: src/diff/blocks.ts
    summary: 描いた文書の要素を色分けの単位のブロックに分け、元の行の範囲を付けて上から順に返す
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ root: ParentNode; lineCount: number }'
        required: true
        description: '`root` は描いた文書の中身、`lineCount` はその Markdown の行の数'
    returns:
      type: BlockRange[]
      description: 上から順のブロック
    process: |-
      1. `root` の直下と `div.mdmark-section-body` の直下の要素を文書の順に辿る。`mdmark-section-body` はその中に入り、`data-source-line` を自分か子孫に持たない要素は飛ばす
      2. `ul`・`ol` は直下の `li` ごとに `unit: "item"`、`data-source-line` を持つ表（`table` か表の記法の外側）は見出し行を `unit: "block"` の表そのもの、`tbody` の `tr` ごとに `unit: "row"`、それ以外は要素ごとに `unit: "block"` のブロックにする
      3. ブロックの `start` は要素（無ければ最初の子孫）の `data-source-line`、`end` は次のブロックの `start` の 1 つ前（最後は `lineCount - 1`）にする
    unit_tests:
      - name: test_collect_block_ranges
        case: 正常
        summary: 節の中身の中のブロックと、リストの項目・表の行を分ける
        condition: '`# 題`・`## 節` の下に段落・3 つの項目の番号付きリスト・2 行の表を持つ Markdown を既定の設定で描いた要素'
        mock: なし
        expected: '`h1`・`h2`・段落・`li` 3 つ・表・`tr` 2 つの順で、`unit` が `block`・`item`・`row`。`mdmark-section-body` は含まない。各 `start`・`end` が Markdown の行と合う'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[描いた文書のブロックの色分け]
    status: planned
    introduced:
      pr: 196
  - name: colorDiffBlocks
    title: ブロックを色分けする
    container: src/diff/blocks.ts
    summary: 後の文書を描いた中身に、追加の色を当て、前の文書から削除したブロックを差し込む
    kind: 関数
    scope: internal
    side_effects: '`after` の子孫を書き換える。`before` の要素を `after` へ移す'
    args:
      - name: options
        type: '{ before: { root: ParentNode; markdown: string }; after: { root: ParentNode; markdown: string }; segmenter: Intl.Segmenter | undefined; engine?: DiffEngine }'
        required: true
        description: '`before`・`after` は前と後の Markdown と、それを今の描き方で描いた中身（画面に置く前の `template` の中身）。`segmenter` と `engine` は `computeDiff` に渡す'
    returns:
      type: void
      description: なし
    process: |-
      1. `computeDiff` で前と後の Markdown を比べ、全ての塊の行を上から読んで、前の行番号ごとに消したか、後の行番号ごとに足したか、`same` の行の前から後への行番号の対応を作る。`same` でない行が続くところを 1 つの変えた塊にする
      2. `collectBlockRanges` で前と後をブロックに分ける。後のブロックで範囲に足した行を持つものを追加、前のブロックで範囲の空白だけでない行が全て消した行のものを削除の候補にする。前のブロックで見出しの節が丸ごと削除の候補なら、見出しと節の中身を 1 つの候補にまとめる。リスト・表の全ての項目・行が候補で、後にそのリスト・表が無いときはリスト・表ごと 1 つの候補にする
      3. 同じ変えた塊の候補と追加のブロックを前から順に対にし、`isRewrite` が true の対は候補を外す。残った候補を削除したブロックにする
      4. 追加のブロックを `renderDiffBlock({ kind: "add", unit, html: 要素の outerHTML })` の要素に置き換える
      5. 削除したブロックごとに、`renderDiffBlock({ kind: "del", ... })` の要素を作り、差し込む場所を決める。前の文書で同じ親の直前にあった変えていないブロックの `start` を行の対応で後の行番号にし、その行を範囲に持つ後のブロックの後ろ（その後ろに先に差し込んだ削除のブロックがあればその後ろ）に置く。直前に無ければ、前の文書で属していた節の見出しを同じ対応で引いた後の節の中身の先頭、節に属さなければ `after.root` の先頭に置く。リストの項目と表の行は、前の文書で直前の項目・行の後ろ（無ければ対応するリスト・`tbody` の先頭）に置く
    unit_tests:
      - name: test_color_diff_blocks
        case: 正常
        summary: 足した・書き換えた段落に追加の色、消した段落を前の位置に削除の色で差し込む
        condition: '前: `# 題`・段落 A・`## 節`・段落 C・段落 D。後: 段落 A の語を 1 つ書き換え、段落 C を消し、段落 D を別の文の段落 E に入れ替える。どちらも既定の設定で描いた中身'
        mock: なし（既定の `jsdiffEngine`）
        expected: 段落 A と E が `data-kind="add"` の `div.mdmark-diff-block` に包まれる。段落 C が `## 節` の `mdmark-section-body` の先頭、段落 D が E の直前に `data-kind="del"` である。段落 A の削除は無い。削除のブロックの中に `data-source-line` と `id` が無い
      - name: test_color_diff_blocks_when_list_and_table
        case: 正常
        summary: リストの項目と表の行の単位で色を当てる
        condition: '前: 5 つの項目の番号付きリストと 3 行の表。後: 4 番目の項目を消し、項目を 1 つ足し、表の 2 行目の全てのセルを書き換える'
        mock: なし
        expected: リストと表は包まれない。消した `li` が 3 番目の項目の後ろに `data-kind="del"`、足した `li` が `data-kind="add"` で、どちらも class `mdmark-diff-block`。表の 2 行目は削除の `tr` と追加の `tr` がこの順
      - name: test_color_diff_blocks_when_section_deleted
        case: 正常
        summary: 見出しごと消した節を 1 つの削除のブロックにする
        condition: '前: `## 一`・段落・`## 二`・段落 2 つ・`## 三`・段落。後: `## 二` の節を丸ごと消す'
        mock: なし
        expected: '`## 一` の節の後ろに `data-kind="del"` のブロックが 1 つだけあり、その中に `h2` と段落 2 つを持ち、`h2` が `id` を持たない'
      - name: test_color_diff_blocks_when_same
        case: 正常
        summary: 同じ本文なら何も変えない
        condition: 前と後が同じ Markdown
        mock: なし
        expected: '`after.root` の HTML が呼ぶ前と同じ'
    callees:
      - '#functions[computeDiff]'
      - '#functions[collectBlockRanges]'
      - '#functions[isRewrite]'
      - '#functions[renderDiffBlock]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[描いた文書のブロックの色分け]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[色を当てたブロックの要素]
    status: planned
    introduced:
      pr: 196
  - name: isRewrite
    title: 書き換えかを見分ける
    container: src/diff/blocks.ts
    summary: 対の 2 つのブロックの文字を語ごとに比べ、同じ文字の数が長い方の文字の数の半分以上なら true を返す
    kind: 関数
