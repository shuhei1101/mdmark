        summary: 外すと置いた要素を取り除き、本文を戻す
        condition: 開いた後に外す関数を呼ぶ
        mock: なし
        expected: ボタンと場所が無く、段落が `data-mdmark-diff-hidden` を持たない。ミニマップの帯が無い
      - name: test_attach_diff_when_content_loading
        case: 正常
        summary: 選び直した本文の待ちが 1 秒を過ぎると、前の差分に替えて読み込み中を出す
        condition: 開いた後に前の欄で `r1` を選び、`content` を返さずに時計を 1 秒、2 秒進める
        mock: Vitest の偽の時計。取り出し元は 2 回目の `content` を合図まで返さない
        expected: 1 秒で行の場所が `変更を読み込んでいます` になり、数の文が空、2 秒で回る表示が出る。選ぶ欄は残る
      - name: test_attach_diff_when_preview_attached
        case: 正常
        summary: プレビューの前と後に操作を付け、選び直しと閉じるで外す
        condition: 変えた埋め込んだ HTML の範囲を 1 つ持つ 2 つの本文。開いた後に選び直し、閉じる
        mock: '`renderHtml` は、`attach` に渡された要素と外す関数を呼んだ回数を控える偽物'
        expected: 開くと `attach` が前と後のプレビューの中身で 1 回ずつ呼ばれる。選び直すと前の 2 つが外され、閉じると全て外される
      - name: test_attach_diff_when_h1_section
        case: 正常
        summary: H1 の節では見出しと節の中身の間に置き、開いている間は右側の目次も隠し、閉じても節の開閉を変えない
        condition: '`# 手引き` の節と、閉じた `## 導入` の節を `attachSections` で開閉にした `root`。`hideWith` に `aside` を渡し、開いてから閉じる'
        mock: 取り出し元は `r2`・`r1` を返す関数
        expected: ボタンが `h1` の直後で `section-手引き` の前。開いている間は `section-手引き` と `aside` が `data-mdmark-diff-hidden` を持つ。閉じた後はどちらも持たず、`section-導入` は `hidden="until-found"` のまま
      - name: test_attach_diff_when_open
