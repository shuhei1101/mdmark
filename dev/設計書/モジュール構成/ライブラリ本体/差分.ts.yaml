title: "ライブラリ本体 / 差分"
lead: '`mount` に渡した取り出し元から 2 つのリビジョンの本文を受け、行と語を比べて描き、ミニマップで送る処理と、描いた文書のブロックを追加と削除の色で塗り分ける処理と、その部品の HTML。ブラウザでだけ動く（部品の HTML と比較は Node でも動く）。'
directory: |-
  ```tree
  src/
  ├── diff/
  │   ├── source.ts   # 公開の型 DiffSource・DiffRevision・DiffMode と対応する差分の出し方 diffModes、取り出し元が返した値の検査
  │   ├── compute.ts  # 行と語の比較（jsdiff を差分の計算の関数型の後ろに置く）
  │   ├── panel.ts    # 差分を開く UI・待ち・選び直し・知らせの枠を付ける attachDiff
  │   ├── blocks.ts   # 比べる 2 つの本文の取り出し loadDiffPair と、描いた文書のブロックの色分け colorDiffBlocks
  │   └── minimap.ts  # 送り先ごとに 1 本のミニマップを置く attachMinimap
  └── parts/
      ├── diff-toggle.ts      # 差分を開くボタンの HTML
      ├── revision-picker.ts  # リビジョンの選択の HTML
      ├── diff-lines.ts       # 差分の行の HTML
      ├── diff-html.ts        # 埋め込んだ HTML の差分の HTML
      ├── diff-blocks.ts      # 差分のブロックの HTML
      ├── diff-minimap.ts     # ミニマップの HTML
      └── diff-message.ts     # 差分の状態の文の HTML
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction LR
        class 差分を付ける
        class 比べる2つの本文を取り出す
        class ブロックを色分けする
        class 取り出し元の値を検める
        class 差分を計算する
        class 差分の計算の関数型
        class jsdiffの計算
        class ミニマップを付ける
        class 部品のHTML
        差分を付ける --> 取り出し元の値を検める : 戻り値を検める
        差分を付ける --> 差分を計算する : 本文を渡す
        比べる2つの本文を取り出す --> 取り出し元の値を検める : 戻り値を検める
        ブロックを色分けする --> 差分を計算する : 本文を渡す
        ブロックを色分けする --> 部品のHTML : 色を当てる
        差分を計算する --> 差分の計算の関数型 : 使う
        jsdiffの計算 ..|> 差分の計算の関数型
        差分を付ける --> ミニマップを付ける : 行を描いたら付ける
        差分を付ける --> 部品のHTML : 描く
data_models:
  - name: DiffSource
    title: 差分の取り出し元
    container: src/diff/source.ts
    usecase: 使う側のページが差分の取り出し元を渡す
    role: インターフェース
    summary: 使う側が書く取り出し元（公開の型）
    properties:
      - name: revisions
        type: '(docId: string) => Promise<DiffRevision[]>'
        description: 文書のリビジョンを新しい順に返す
      - name: content
        type: '(target: { docId: string; revisionId: string }) => Promise<string>'
        description: そのリビジョンの Markdown を返す
  - name: DiffRevision
    title: リビジョン
    container: src/diff/source.ts
    usecase: 使う側のページが差分の取り出し元を渡す
    role: DTO
    summary: 文書の変更の 1 回分（公開の型）
    properties:
      - name: id
        type: string
        description: リビジョンの識別子。空でない文字列で、一覧の中で重ならない
      - name: at
        type: string
        description: ISO 8601 の日時
      - name: label
        type: string | undefined
        description: 一言の説明
      - name: author
        type: string | undefined
        description: 書いた人
  - name: DiffLine
    title: 差分の行
    container: src/diff/compute.ts
    usecase: 読む人が文書の 2 つのリビジョンを比べて差分を見る
    role: DTO
    summary: 比べた 1 行
    properties:
      - name: kind
        type: '"same" | "del" | "add"'
        description: 同じ行・前にだけある行・後にだけある行
      - name: parts
        type: '{ text: string; changed: boolean }[]'
        description: 行の文字を切った並び。対の行で変わった語だけ `changed` が true。対にならない行は 1 つだけで false
  - name: DiffBlock
    title: 差分の塊
    container: src/diff/compute.ts
    usecase: 読む人が埋め込んだ HTML の差分を描いた結果の前と後に切り替える
    role: DTO
    summary: 行の塊か、埋め込んだ HTML の範囲の塊
    description: '`{ type: "lines"; lines: DiffLine[] } | { type: "html"; lines: DiffLine[]; changed: boolean; before: string | null; after: string | null }`。`before`・`after` は範囲の `html` のコードブロックの中身で、その側に範囲が無ければ `null`'
  - name: DiffResult
    title: 差分の結果
    container: src/diff/compute.ts
    usecase: 読む人が文書の 2 つのリビジョンを比べて差分を見る
    role: DTO
    summary: 比べた結果
    properties:
      - name: blocks
        type: DiffBlock[]
        description: 上から順の塊
      - name: counts
        type: '{ del: number; add: number }'
        description: 削除した行と追加した行の数。どちらも 0 なら変更が無い
  - name: DiffMode
    title: 差分の出し方
    container: src/diff/source.ts
    usecase: 使う側のページが差分の取り出し元を渡す
    role: DTO
    summary: '`mount` の `opts.diffMode` の値（公開の型）'
    description: '`(typeof diffModes)[number]`（`"button" | "open" | "blocks"`）'
    status: planned
    introduced:
      pr: 196
  - name: DiffPair
    title: 比べる 2 つの本文
    container: src/diff/blocks.ts
    usecase: VS Code の差分ビューの変更をプレビューで見る
    role: DTO
    summary: ブロックの色分けのために取り出した結果
    description: '`{ kind: "pair"; before: string; after: string } | { kind: "single" } | { kind: "failed" }`。`pair` は 2 番目（前）と 1 番目（後）のリビジョンの Markdown、`single` はリビジョンが 1 つ以下、`failed` は一覧か本文を取り出せなかった'
    status: planned
    introduced:
      pr: 196
  - name: BlockRange
    title: ブロックの行の範囲
    container: src/diff/blocks.ts
    usecase: VS Code の差分ビューの変更をプレビューで見る
    role: DTO
    summary: 色分けの単位のブロック 1 つと、その元の行の範囲
    properties:
      - name: element
        type: HTMLElement
        description: ブロックの要素（本文か節の中身の直下の要素、いちばん外の `li`、`tbody` の `tr`）
      - name: unit
        type: '"block" | "item" | "row"'
        description: 部品『差分のブロック』の `unit` に渡す値
      - name: start
        type: number
        description: ブロックの `data-source-line`（0 始まり）
      - name: end
        type: number
        description: 次のブロックの `data-source-line` の 1 つ前。最後のブロックは文書の最後の行
    status: planned
    introduced:
      pr: 196
constants:
  - name: LOADING_DELAY_MS
    title: 読み込み中を出すまでの待ち
    container: src/diff/panel.ts
    summary: 取り出し元の待ちがこれを過ぎたら読み込み中の文を出す（外部規約『表示の安定』の 1 秒）
    value: '1000'
  - name: SPINNER_DELAY_MS
    title: 回る表示を足すまでの待ち
    container: src/diff/panel.ts
    summary: 取り出し元の待ちがこれを過ぎたら回る表示を足す（同じ規約の 2 秒）
    value: '2000'
  - name: minimaps
    title: 送り先ごとのミニマップ
    container: src/diff/minimap.ts
    summary: 送り先のスクロールの要素から、そこに置いた帯と印を出している差分の行の集まりを引く
    value: 'new WeakMap<Element, { band: HTMLElement; lines: Set<HTMLElement>; detach: () => void }>()'
  - name: MINIMAP_VARIABLES
    title: 帯に写す変数
    container: src/diff/minimap.ts
    summary: 差分の行の計算値から読み、`document.body` の直下の帯の `style` に写す CSS 変数。使う側が `.mdmark` に書いた上書きを帯にも当てる
    value: '["--mdmark-color-diff-del-sign", "--mdmark-color-diff-add-sign", "--mdmark-color-border", "--mdmark-color-surface", "--mdmark-color-muted", "--mdmark-color-text", "--mdmark-diff-minimap-width", "--mdmark-diff-minimap-z-index"]'
  - name: DIFF_HIDDEN_ATTRIBUTE
    title: 差分で隠した要素の属性
    container: src/diff/panel.ts
    summary: '差分を開いている間に隠す本文の要素と右側の目次に付ける属性。`index.css` が `display: none !important` で隠す'
    value: '"data-mdmark-diff-hidden"'
    status: planned
    introduced:
      pr: 166
  - name: diffModes
    title: 対応する差分の出し方
    container: src/diff/source.ts
    summary: 配布物が対応する `opts.diffMode` の値の並び。`src/index.ts` が名前付きで公開し、使う側が差分の出し方に対応するバージョンかを見分ける
    value: '["button", "open", "blocks"] as const'
    status: planned
    introduced:
      pr: 196
function_types:
  - name: DiffEngine
    title: 差分の計算の関数型
    container: src/diff/compute.ts
    summary: 行と語の比較。既定は jsdiff の `diffLines`・`diffWords`・`diffChars` を包む `jsdiffEngine`、単体テストで差し替える
    args:
      - name: lines
        type: '(pair: { before: string; after: string }) => DiffChange[]'
        description: 行ごとに比べる（`diffLines`）
      - name: words
        type: '(pair: { before: string; after: string; segmenter: Intl.Segmenter | undefined }) => DiffChange[]'
        description: '語ごとに比べる。`segmenter` が無いときは 1 文字ずつに切って比べる（`diffWords` の `intlSegmenter`、無ければ `diffChars`）。`DiffChange` は `{ value: string; added: boolean; removed: boolean }`'
    returns:
      type: '-'
      description: 上の 2 つを持つオブジェクト
  - name: DiffHtmlRenderer
    title: 埋め込んだ HTML を描く関数型
    container: src/diff/panel.ts
    summary: 差分のプレビューの前と後の HTML を文書と同じ描き方で描き、置いた要素に文書と同じ操作を付ける関数を返す。実体は `mount` が作り、単体テストで差し替える
    args:
      - name: html
        type: string
        description: 範囲の `html` のコードブロックの中身
    returns:
      type: '{ html: string; attach: (root: HTMLElement) => () => void }'
      description: '`html` は描いた範囲の中身。`attach` は、置いた要素に図の拡大・ツールチップ・操作できる部品などの操作を付け、外す関数を返す'
functions:
  - name: checkRevisions
    title: 取り出し元の一覧を検める
    container: src/diff/source.ts
    summary: '`revisions` が返した値がリビジョンの配列の形かを検め、形が合うときだけその配列を返す'
    kind: 関数
    scope: internal
    args:
      - name: value
        type: unknown
        required: true
        description: '`revisions` が解決した値'
    returns:
      type: DiffRevision[]
      description: 検めたリビジョンの並び（並べ替えない）
    process: |-
      1. 配列でなければ `TypeError` を投げる
      2. 要素ごとに、`id` が空でない文字列・`at` が `Date.parse` で読める文字列・`label` と `author` が無いか文字列であることを確かめ、合わなければその要素と位置を持つ `TypeError` を投げる
      3. `id` が重なれば `TypeError` を投げる
      4. 配列をそのまま返す
    unit_tests:
      - name: test_check_revisions
        case: 正常
        summary: 形が合う一覧をそのまま返す
        condition: '`label`・`author` を持つものと持たないものの 2 つ'
        mock: なし
        expected: 同じ配列を同じ順で返す
      - name: test_check_revisions_when_not_array
        case: 異常
        summary: 配列でなければ投げる
        condition: '`{}`'
        mock: なし
        expected: '`TypeError` を投げる'
      - name: test_check_revisions_when_at_missing
        case: 異常
        summary: '`at` が無い要素を拒む'
        condition: '`[{ id: "r1" }]`'
        mock: なし
        expected: '`TypeError` を投げ、メッセージに `at` と位置 `0` を含む'
      - name: test_check_revisions_when_id_duplicated
        case: 異常
        summary: '`id` が重なる一覧を拒む'
        condition: '`id` がどちらも `r1` の 2 つ'
        mock: なし
        expected: '`TypeError` を投げる'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[差分の取り出し元]
  - name: computeDiff
    title: 差分を計算する
    container: src/diff/compute.ts
    summary: 2 つの Markdown のソースを行ごとに比べ、対の行を語ごとに比べ、埋め込んだ HTML の範囲を塊に分ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ before: string; after: string; segmenter: Intl.Segmenter | undefined; engine?: DiffEngine }'
        required: true
        description: '`before`・`after` は前と後の Markdown、`segmenter` は語の区切り（持たないブラウザでは `undefined`）、`engine` は既定 `jsdiffEngine`'
    returns:
      type: DiffResult
      description: 塊の並びと行の数
    process: |-
      1. `engine.lines` で前と後を比べ、切れを行に分けて `same`・`del`・`add` の行の並びにする。変えた塊の中では消した行を先、足した行を後に並べる
      2. 変えた塊ごとに、消した行と足した行を前から順に対にし、対の行を `engine.words` で比べて `parts` を作る（削除した側は `removed` を、追加した側は `added` を `changed` にする）。対にならない行は 1 つの切れにする
      3. 行を上から読み、`<!-- html -->` から `<!-- /html -->` までの行を `html` の塊、それ以外を `lines` の塊にまとめる。`html` の塊は、`same` 以外の行を持つかで `changed` を決め、`add` を除いた行と `del` を除いた行からそれぞれの側の `html` のコードブロックの中身を取り出す（その側に範囲の行が無ければ `null`）
      4. `del`・`add` の行を数えて `counts` にする
    unit_tests:
      - name: test_compute_diff
        case: 正常
        summary: 行の差と対の行の語の差を出す
        condition: '段落の語 `差分` を `変更` に書き換え、行を 1 つ足し、別の行を 1 つ消す。`segmenter` は `new Intl.Segmenter("ja", { granularity: "word" })`'
        mock: なし（既定の `jsdiffEngine`）
        expected: '`counts` が `{ del: 2, add: 2 }`。書き換えた行の対で `changed` の切れが `差分` と `変更` だけ'
      - name: test_compute_diff_when_no_segmenter
        case: 正常
        summary: 語の区切りが無ければ 1 文字ずつ比べる
        condition: 同じ入力で `segmenter` が `undefined`
        mock: なし
        expected: 対の行の `changed` の切れが、変わった文字だけ
      - name: test_compute_diff_when_same
        case: 正常
        summary: 同じ本文なら数が 0
        condition: 前と後が同じ Markdown
        mock: なし
        expected: '`counts` が `{ del: 0, add: 0 }` で、全ての行が `same`'
      - name: test_compute_diff_when_html
        case: 正常
        summary: 埋め込んだ HTML の範囲を塊にし、前と後の中身を取り出す
        condition: 表のセルの数を変えた範囲・変えていない範囲・後にだけある範囲
        mock: なし
        expected: '`html` の塊が 3 つ。`changed` が順に true・false・true。3 つ目の `before` が `null`'
      - name: test_compute_diff_when_engine
        case: 正常
        summary: 渡した計算を使う
        condition: '`engine` に、全ての行を消して足す切れを返す `lines` を渡す'
        mock: '`engine` を差し替える'
        expected: 全ての行が `del` か `add` になる
    callees:
      - '#function_types[DiffEngine]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[差分の計算]
      - dev/設計書/外部ライブラリ/diff#
  - name: attachDiff
    title: 差分を付ける
    container: src/diff/panel.ts
    summary: 描いた文書に「変更を見る」と差分の場所を置き、開く・選び直す・閉じるを受け取って取り出し元を呼び、差分を描く。外す関数を返す
    kind: 関数
    scope: internal
    side_effects: '`root` の中に要素を置き、本文の要素と `hideWith` の要素に `DIFF_HIDDEN_ATTRIBUTE` を付け外しする。取り出し元を呼ぶ。取り出せないときは `console.error` に出す'
    args:
      - name: options
        type: '{ root: HTMLElement; source: DiffSource; docId: string; renderHtml: DiffHtmlRenderer; hideWith?: HTMLElement[]; open?: boolean }'
        required: true
        description: '`root` は描いた本文（右側の目次を置いたときは本文の列）、`source` と `docId` は `mount` に渡されたもの、`renderHtml` は埋め込んだ HTML を文書と同じ描き方で描き、操作を付ける関数を返す関数、`hideWith` は差分を開いている間、`root` の外で一緒に隠す要素（右側の目次）、`open` は置いた時点で開くか（既定 `false`。`mount` の `diffMode` が `open` のとき `true`）'
    returns:
      type: () => void
      description: 差分を閉じ、待ちと受け取りとミニマップを片付け、置いた要素を取り除く関数
    process: |-
      1. `root` の直下の最初の `h1` の後ろ（H1 の節では見出しと節の中身の間。無ければ先頭）に、差分を開くボタン（`renderDiffToggle`）と `hidden` の差分の場所を置く。場所の `id` はモジュールの通し番号でページの中で一意にする。`open` が `true` なら、置いた後に手順 2 の開くときと同じことを行う
      2. ボタンを押すと開くか閉じる。開くときは、`h1`・ボタン・場所以外の `root` の子と `hideWith` の要素に `DIFF_HIDDEN_ATTRIBUTE` を付けて隠し（`hidden` は書き換えないため、節の開閉と影響し合わない）、開いた世代を 1 進め、手順 3 を行う。閉じるときは世代を 1 進め、ミニマップを外し、場所を空にして `hidden` にし、付けた `DIFF_HIDDEN_ATTRIBUTE` を外す（節はそのときの開閉のまま）
      3. 待ちの間、`LOADING_DELAY_MS` を過ぎたら場所に `renderDiffMessage({ kind: "loading" })`、`SPINNER_DELAY_MS` を過ぎたら `spinner: true` に替える。`source.revisions(docId)` を待ち、世代が変わっていたら何もしない。拒否か `checkRevisions` が投げたら、場所を `renderNotice({ name: docId, source: "diff-revisions" })` にして終わる
         - `[error]` リビジョンの一覧を取り出せない（`revisions`・`docId`・元のエラーを `console.error` の引数に並べる）
      4. リビジョンが 1 つなら `renderDiffMessage({ kind: "single" })` を出して終わる。2 つ以上なら、前に 2 番目・後に 1 番目を選んでリビジョンの選択（`renderRevisionPicker`）を置き、手順 5 を行う。前を選び直したら後の選べない項目を直し、後が前以前なら前の 1 つ新しいリビジョンに移す。選び直すたびに手順 5 を行う
      5. 選んだ 2 つの `source.content({ docId, revisionId })` を並んで待ち（選び直しの世代を進め、古い待ちの結果は描かない）、待ちの間は手順 3 と同じタイマーで、`LOADING_DELAY_MS` を過ぎたら行の場所を `renderDiffMessage({ kind: "loading" })` にして数の文とミニマップを外し、`SPINNER_DELAY_MS` を過ぎたら `spinner: true` に替える。拒否か文字列でないものがあれば、選択を残して行の場所を `renderNotice({ name: 取り出せなかったリビジョンの説明, source: "diff-content" })` にし、数の文とミニマップを外す
         - `[error]` 本文を取り出せない（`content`・`docId`・リビジョンの `id`・元のエラーか合わなかった値を並べる）
      6. `computeDiff` で比べる（`segmenter` は `Intl.Segmenter` があれば `ja`・`word` で作る）。数がどちらも 0 なら `renderDiffMessage({ kind: "same" })` を出す。そうでなければ `renderDiffLines` で行を描き（`html` の塊の `before`・`after` は `renderHtml` を通す）、置いた前と後のプレビューの中身ごとに `scopeIds` で `id` に側ごとの頭（`{場所の id}-{範囲の番号}-{before か after}-`）を付けてから `renderHtml` の `attach` で操作を付け、外す関数を控える（描き直す・閉じる・外すときに呼ぶ）。数の文を書き換え、埋め込んだ HTML の見方のボタンに受け取りを付け、`attachMinimap` でミニマップを付ける
      7. 外す関数は、世代を進め、待ちのタイマー・受け取り・ミニマップを外し、置いたボタンと場所を取り除いて付けた `DIFF_HIDDEN_ATTRIBUTE` を外す
    unit_tests:
      - name: test_attach_diff
        case: 正常
        summary: 開くと一覧と 2 つの本文を取り出して差分を描く
        condition: '`h1` と段落を描いた `root`。`r3`・`r2`・`r1` を返す取り出し元'
