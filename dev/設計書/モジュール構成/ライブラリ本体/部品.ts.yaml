data_models:
  - name: CodeLine
    title: コードの行
    container: src/parts/code-block.ts
    summary: 部品『コードブロック』の `lines` の要素
    properties:
      - name: text
        type: string
        description: コードの行の印を外した行の文字（エスケープ前）
      - name: kind
        type: '"add" | "del" | "highlight" | undefined'
        description: 行の種類。無ければ飾らない行
  - name: SideTocHeading
    title: 右側の目次の見出し
    container: src/parts/side-toc.ts
    summary: 右側の目次に並べる見出し 1 つ
    properties:
      - name: level
        type: 1 | 2 | 3
        description: 見出しのレベル
      - name: id
        type: string
        description: 見出しの ID
      - name: text
        type: string
        description: 目次に出す見出しの文字
    status: planned
