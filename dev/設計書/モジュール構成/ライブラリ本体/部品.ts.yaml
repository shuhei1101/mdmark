title: "ライブラリ本体 / 部品"
lead: 文書の中に mdmark が置く UI の部品を HTML 文字列で返す関数と、Storybook のストーリー。DOM に頼らず、ブラウザと Node で同じ出力になる。
directory: |-
  ```tree
  src/parts/
  ├── escape.ts                    # HTML の特別な文字をエスケープする escapeHtml
  ├── own.ts                       # mdmark が出した要素の印を付ける markOwn と SLOT_MARKER
  ├── notice.ts                    # 知らせの枠の renderNotice
  ├── notice.stories.yaml          # 知らせの枠のストーリー（Figure・Block・LongName・Extension）
  ├── embed.ts                     # 読み込み中の枠の renderEmbed
  ├── embed.stories.yaml           # 読み込み中の枠のストーリー（Loading）
  ├── syntax-warning.ts            # 書き方の警告の renderSyntaxWarning
  ├── table.ts                     # 表の renderTable・renderTableTools・renderTableBar・renderTotalRows・renderCopyPanel・renderFoldedColumn
  ├── callout.ts                   # 注意書きの renderCallout
  ├── tabs.ts                      # タブの renderTabs
  ├── steps.ts                     # ステップの renderSteps
  ├── tree.ts                      # ファイルツリーの renderTree
  ├── badge.ts                     # バッジの renderBadge
  ├── code-block.ts                # コードブロックの renderCodeBlock と renderCodeCopy
  ├── toc.ts                       # 目次の renderToc
  ├── section.ts                   # 節の renderSection
  ├── side-toc.ts                  # 右側の目次の renderSideToc
  ├── row-detail.ts                # 行の詳細の renderRowDetail
  ├── figure.ts                    # 図表の番号の renderFigure
  ├── doc-list.ts                  # 文書の一覧の renderDocList
  └── {部品}.stories.yaml         # 部品設計の states ごとのストーリー（上の部品ごとに 1 つ）
  ```
constants:
  - name: LOADING_TEXT
    title: 読み込み中の文言
    container: src/parts/embed.ts
    summary: 読み込み中の枠に出す文字
    value: '"図を読み込んでいます"'
  - name: NOTICE_TITLES
    title: 知らせの枠の題
    container: src/parts/notice.ts
    summary: 図の印かどうかで分ける題
    value: '{ figure: "この図を表示できません", block: "この箇所を表示できません" }'
  - name: SLOT_MARKER
    title: 中身の差し込み口
    container: src/parts/own.ts
    summary: 中身を持つ部品に中身の代わりに渡し、記法がこの前後で HTML を分ける文字列。Markdown に現れない制御文字だけで作る
    value: '"\u0000mdmark-slot\u0000"'
  - name: SYNTAX_ATTRIBUTE
    title: 色分けの対象の属性
    container: src/parts/code-block.ts
    summary: 色分けするコードブロックの `code` に付け、値に言語のモジュール名を持つ属性。mdmark が出した要素だけが sanitize を通って持ち続けるため、文書に書いた生の HTML の `code` は色分けの対象にならない
    value: '"data-mdmark-syntax"'
    status: planned
    introduced:
      pr: 97
functions:
  - name: escapeHtml
    title: HTML の特別な文字をエスケープする
    container: src/parts/escape.ts
    kind: 関数
    scope: public
    summary: "`&`・`<`・`>`・`\"`・`'` を文字参照にする"
    args:
      - name: text
        type: string
        required: true
        description: エスケープする文字列
    returns:
      type: string
      description: 要素の中身にも属性の値にも置ける文字列
    unit_tests:
      - name: test_escape_html
        case: 正常
        summary: 特別な文字を全て文字参照にする
        condition: "`<a href=\"x\">'&'</a>`"
        mock: なし
        expected: '`&lt;a href=&quot;x&quot;&gt;&#39;&amp;&#39;&lt;/a&gt;`'
  - name: renderNotice
    title: 知らせの枠を描く
    container: src/parts/notice.ts
    kind: 関数
    scope: public
    summary: 部品設計『知らせの枠』の HTML を返す
    args:
      - name: options
        type: '{ name: string; figure?: boolean; source?: "library" | "extension" | "part" | "diff-revisions" | "diff-content" }'
        required: true
        description: 印の名前、図の印か（既定 `true`）、読めなかったもの（既定 `library`。`extension` は本文を `表示に使う拡張（…）` にする。`part` は本文を `表示に使う部品（…）` にする。`diff-revisions`・`diff-content` は部品設計の題と本文にし、`figure` を使わない）
    returns:
      type: string
      description: '`<div class="mdmark-notice" role="status">` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    refs:
      - dev/設計書/部品設計/知らせの枠.ts#
    unit_tests:
      - name: test_render_notice
        case: 正常
        summary: 図の印の題と、印の名前を入れた本文を返す
        condition: '`{ name: "chart" }`'
        mock: なし
        expected: 題が `この図を表示できません`、本文に `<code>chart</code>` と直し方が入る
      - name: test_render_notice_when_block
        case: 正常
        summary: 図でない印の題を返す
        condition: '`{ name: "tabs", figure: false }`'
        mock: なし
        expected: 題が `この箇所を表示できません`
      - name: test_render_notice_when_name_has_html
        case: 正常
        summary: 印の名前をエスケープする
        condition: '`{ name: "<b>x</b>" }`'
        mock: なし
        expected: '`<code>&lt;b&gt;x&lt;/b&gt;</code>`'
      - name: test_render_notice_when_extension
        case: 正常
        summary: 拡張を読めないときの本文を返す
        condition: '`{ name: "greet", source: "extension" }`'
        mock: なし
        expected: 本文が `表示に使う拡張（<code>greet</code>）を読み込めませんでした。` で始まる
      - name: test_render_notice_when_diff
        case: 正常
        summary: 差分の取り出し元を読めないときの題と本文を返す
        condition: '`{ name: "guide", source: "diff-revisions" }` と `{ name: "2026/10/19 16:40 件数を直す", source: "diff-content" }`'
        mock: なし
        expected: 前者の題が `変更の履歴を表示できません`、後者の本文が `「2026/10/19 16:40 件数を直す」の本文を取り出せませんでした。` で始まる
      - name: test_render_notice_when_part
        case: 正常
        summary: 部品のモジュールを読めないときの本文を返す
        condition: '`{ name: "view", figure: false, source: "part" }`'
        mock: なし
        expected: 題が `この箇所を表示できません`、本文が `表示に使う部品（<code>view</code>）を読み込めませんでした。` で始まる
  - name: renderEmbed
    title: 読み込み中の枠を描く
    container: src/parts/embed.ts
    kind: 関数
    scope: public
    summary: 部品設計『読み込み中の枠』の HTML を返す
    args:
      - name: options
        type: '{ name: string; args?: string[] }'
        required: true
        description: 印の名前と引数（既定 `[]`）
    returns:
      type: string
      description: '`<div class="mdmark-embed" data-mdmark-slot="{name}" data-mdmark-args="{args}" role="status">図を読み込んでいます</div>`'
    callees:
      - '#functions[escapeHtml]'
    refs:
      - dev/設計書/部品設計/読み込み中の枠.ts#
    unit_tests:
      - name: test_render_embed
        case: 正常
        summary: 印の名前と引数を属性に持つ枠を返す
        condition: '`{ name: "chart", args: ["a", "b"] }`'
        mock: なし
        expected: '`data-mdmark-slot="chart"`・`data-mdmark-args="a b"`・`role="status"`・文字 `図を読み込んでいます`'
      - name: test_render_embed_when_args_have_quote
        case: 正常
        summary: 引数をエスケープする
        condition: '`{ name: "chart", args: ["\"><script>"] }`'
        mock: なし
        expected: '`data-mdmark-args="&quot;&gt;&lt;script&gt;"`'
  - name: markOwn
    title: mdmark が出した要素に印を付ける
    container: src/parts/own.ts
    kind: 関数
    scope: internal
    summary: 部品の HTML の全ての開始タグに `data-mdmark-own="{nonce}"` を足す。描画の `sanitize` は、この属性を持つ要素にだけ記法の class・`data-*`・`id` を残し、属性は外す
    description: 部品の HTML は文字をエスケープ済みで、文書の中身（`SLOT_MARKER` の位置）を含まないため、開始タグを `<{名前}` で見分けられる
    args:
      - name: html
        type: string
        required: true
        description: 部品の HTML
      - name: nonce
        type: string
        required: true
        description: 描くごとに作る印の値
    returns:
      type: string
      description: 印を付けた HTML
    unit_tests:
      - name: test_mark_own
        case: 正常
        summary: 全ての開始タグに印を付け、閉じタグと文字はそのまま
        condition: '`<div class="a"><p>x &lt;y&gt;</p></div>` と nonce `n1`'
        mock: なし
        expected: '`<div data-mdmark-own="n1" class="a"><p data-mdmark-own="n1">x &lt;y&gt;</p></div>`'
  - name: renderSyntaxWarning
    title: 書き方の警告を描く
    container: src/parts/syntax-warning.ts
    kind: 関数
    scope: internal
    summary: 部品設計『書き方の警告』の HTML を返す。`message`・項目の `` ` `` で囲んだ箇所を `code` にし、それ以外はエスケープする
    args:
      - name: options
        type: '{ mark?: string; message: string; items?: WarningItem[] }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<div class="mdmark-syntax-warning" role="note">` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_syntax_warning
        case: 正常
        summary: 題・印・本文・項目を出し、印をエスケープする
        condition: '`mark` が `<!-- table: data +x -->`、項目が 1 つ'
        mock: なし
        expected: '題 `書き方の警告`、`<code>&lt;!-- table: data +x --&gt;</code>`、`<ul>` に 1 項目'
      - name: test_render_syntax_warning_without_mark
        case: 正常
        summary: 印と項目が無ければ本文だけ
        condition: '`message` だけ'
        mock: なし
        expected: '`<code>` で始まらず、`<ul>` が無い'
  - name: renderTable
    title: 表を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の HTML を返す。`render` は表を `SLOT_MARKER` にして囲みだけを使い、Storybook は `columns`・`rows` と状態の引数（`sort`・`overflow`・`pinned`・`openFilter`・`filterValues`・`hiddenColumns`・`openColumns`・`copyState`・`targetRow`・`shownTotals`・`openTotals`・`openCopy`・`copyFallback`・`rowLinkNotice`・`folded`・`unfoldedRows`）で操作を付けた後の見た目を作る。囲みには `hide`・`totals` を `data-hide`・`data-total` で持たせ、`rows` を渡したときは `renderTableBar` の帯とメニュー、`copyFallback` のときは `renderCopyPanel` のパネル、`renderTotalRows` の集計の行、`rowIds` の行の `id` と行へのリンクと知らせの要素、`folded` のときは `renderFoldedColumn` の開閉のボタンと開閉の行（最終列のセルに `mdmark-fold-col`、囲みに `is-folded`）も描く。集計の値は `filterValues` に合う行から `computeTotal` で出し、全ての行で `findUnreadableTotals` が返した列と計算のセルは空にする
    args:
      - name: options
        type: TableOptions
        required: true
        description: 部品設計の引数（`kind`・`features`・`columns`・`rows`・`filters`・`collapse`・`hide`・`totals`・`rowIds`・状態の引数）。`rows` を省いて `body` に `SLOT_MARKER` を渡すと囲みだけを作る
    returns:
      type: string
      description: '`<div class="mdmark-table"` で始まる HTML'
    callees:
      - '#functions[renderTableTools]'
      - '#functions[escapeHtml]'
      - '#functions[renderTotalRows]'
      - '#functions[renderTableBar]'
      - '#functions[renderCopyPanel]'
      - '#functions[renderFoldedColumn]'
    unit_tests:
      - name: test_render_table
        case: 正常
        summary: 囲みに種類・機能・絞り込みを属性で持たせる
        condition: '`kind: data`、`features: [sort, pin, filter]`、`filters: [{0, select}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: '`<div class="mdmark-table" data-kind="data" data-features="sort pin filter" data-filter="0:select">` の中に `SLOT_MARKER`'
      - name: test_render_table_when_closed
        case: 正常
        summary: 閉じた表は折り畳みに入れる
        condition: '`collapse: closed`'
        mock: なし
        expected: '`<details class="mdmark-table-details"><summary>表を開く</summary>` を持ち、`open` を持たない'
      - name: test_render_table_when_filtered
        case: 正常
        summary: 当てた絞り込みに合わない行を隠し、一致する行が無ければ知らせの行を出す
        condition: '`filterValues: [{ column: 1, text: "存在しない" }]`'
        mock: なし
        expected: 本文の行が全て `hidden` で、`一致する行がありません` の行が `hidden` を持たない
      - name: test_render_table_when_feature_attributes
        case: 正常
        summary: 囲みに隠す列と集計する列を属性で持たせる
        condition: '`features: [sort, pin, filter, columns, total]`、`hide: [1]`、`totals: [{2, sum}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: 囲みが `data-hide="1"`・`data-total="2:sum"` を持ち、帯と集計の行を持たない
      - name: test_render_table_when_all_features
        case: 正常
        summary: 5 つの機能の状態を描く
        condition: '部品設計の `AllFeatures`（`hide: [1]`、`totals: [{2, sum}]`、`rowIds`）に `targetRow: 1`'
        mock: なし
        expected: 帯に `3 / 3 件`・`列の表示`・`表をコピー`、説明の列の見出し・セル・集計のセルが `hidden`、`tfoot` に `合計 25`、各行に `id` と `mdmark-row-anchor`、2 行目だけ `data-target`
      - name: test_render_table_when_totals_unreadable
        case: 正常
        summary: 数として読めないセルを持つ列の合計と平均を空にし、計算ごとの行を出す
        condition: 部品設計の `TotalsUnreadable`（数量の列に `-`・`約 3`）
        mock: なし
        expected: '`tfoot` に `data-total-kind` が `sum`・`avg` の 2 行がこの順にあり、合計の行の数量のセルが空、平均の行の単価のセルが `250`'
      - name: test_render_table_when_totals_hidden
        case: 正常
        summary: 出さない計算の集計の行を隠す
        condition: '部品設計の `TotalsHidden`（`shownTotals: [sum]`）'
        mock: なし
        expected: 平均と件数の行が `hidden`、合計の行が `hidden` を持たず、`集計` のボタンが `is-active`
      - name: test_render_table_when_copy_fallback
        case: 正常
        summary: クリップボードに書けなかったときのパネルを帯の直後に出す
        condition: '部品設計の `CopyFallback`（`copyFallback: { format: tsv, text: "名前\t数量" }`、`copyState: failed`）'
        mock: なし
        expected: '`mdmark-table-bar` の直後に `role="group"` の `mdmark-copy-panel` があり、案内が `「TSV」の中身を選択しています。` で始まり、`textarea` が `readonly` で中身が `名前\t数量`'
      - name: test_render_table_when_row_link_notice
        case: 正常
        summary: 行の URL をコピーした結果を印の横の知らせに出す
        condition: '部品設計の `RowLinkCopied`（`targetRow: 1`、`rowLinkNotice: copied`）'
        mock: なし
        expected: どの行にも `role="status"` の `mdmark-row-link-notice` があり、2 行目だけが `data-state="copied"` と `リンクをコピーしました` を持つ
      - name: test_render_table_when_folded
        case: 正常
        summary: 最終列を畳み、開いた行の直後に最終列を出す
        condition: '部品設計の `FoldedOpen`（`folded: true`、`unfoldedRows: [0]`）'
        mock: なし
        expected: 囲みが `is-folded`、最終列のセルが `mdmark-fold-col`、各行の先頭のセルに `mdmark-fold-toggle` があり、1 行目のボタンだけ `aria-expanded="true"`、1 行目の直後の `mdmark-fold-detail` が `hidden` を持たず `mdmark-fold-name` が `説明`
  - name: renderTableTools
    title: 表の見出しのボタンとドロワーを描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 列 1 つの見出しの中身（並べ替え・絞り込み・ピン止めのボタン）と、その列の絞り込みのドロワーの HTML を返す。`mount` が描いた表に足すのにも使う
    args:
      - name: options
        type: '{ id: string; column: number; label: string; features: string[]; filter?: { kind: "select" | "text" | "date"; values: string[] }; active?: boolean; open?: boolean; value?: FilterValue; pinVisible?: boolean; pinPressed?: boolean }'
        required: true
        description: ドロワーの id の頭、列の位置、列名、機能、絞り込み（`select` は候補の値）、絞り込み中か、ドロワーを開いているか、当てている絞り込み、ピン止めのボタンを出すか（既定 `false`。`mount` が幅を測って決め、Storybook は `overflow` で出す）、この列までを留めているか
    returns:
      type: '{ header: string; drawer: string }'
      description: 見出しの中身とドロワー（絞り込みが無ければ空）
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_table_tools
        case: 正常
        summary: 値を選ぶドロワーとボタンを返す
        condition: '`features: [sort, pin, filter]`、`filter: { kind: select, values: ["りんご", "みかん"] }`、列名 `名前`'
        mock: なし
        expected: '`header` に `mdmark-sort`・`mdmark-filter`（`aria-label="「名前」で絞り込む"`）・`mdmark-pin`（`hidden`）、`drawer` に `hidden` の `mdmark-filter-drawer`・候補の検索欄・2 つのチェックボックス・`絞り込みを外す`'
      - name: test_render_table_tools_when_date
        case: 正常
        summary: 日付のドロワーは開始日と終了日の欄を持つ
        condition: '`filter: { kind: date }`'
        mock: なし
        expected: '`drawer` に `開始日`・`終了日` の `<input type="date">` がある'
  - name: renderCallout
    title: 注意書きを描く
    container: src/parts/callout.ts
    kind: 関数
    scope: internal
    summary: 部品設計『注意書き』の HTML を返す
    args:
      - name: options
        type: '{ kind: CalloutKind; collapsed?: boolean; open?: boolean; body: string }'
        required: true
        description: 種類・折り畳み・開閉・本文の HTML（`SLOT_MARKER` を渡せる）
    returns:
      type: string
      description: 注意書きの HTML
    unit_tests:
      - name: test_render_callout
        case: 正常
        summary: 種類の class と題を出す
        condition: '`kind: warning`'
        mock: なし
        expected: '`<div class="markdown-alert markdown-alert-warning"><p class="markdown-alert-title">警告</p>`'
      - name: test_render_callout_when_collapsed
        case: 正常
        summary: 折り畳みは details にする
        condition: '`kind: note`、`collapsed: true`'
        mock: なし
        expected: '`<details class="markdown-alert markdown-alert-note"><summary class="markdown-alert-title">補足</summary>`'
  - name: renderTabs
    title: タブを描く
    container: src/parts/tabs.ts
    kind: 関数
    scope: internal
    summary: 部品設計『タブ』の HTML を返す。`group` を渡すと `mdmark-tabs` に `data-group` を付ける。`selected` を渡すとタブの並びを付け、選んだもの以外の中身を `hidden` にする
    args:
      - name: options
        type: '{ id: string; titles: string[]; panels: string[]; selected?: number; group?: string }'
        required: true
        description: id の頭、タブ名、タブごとの中身の HTML（`SLOT_MARKER` を渡せる）、選んだタブ、組の名前
    returns:
      type: string
      description: '`<div class="mdmark-tabs">` で始まる HTML'
    unit_tests:
      - name: test_render_tabs
        case: 正常
        summary: selected が無ければ全ての中身を隠さずに出す
        condition: '`titles: [macOS, Windows]`'
        mock: なし
        expected: '`mdmark-tab-title` が 2 つ、`role="tablist"` と `hidden` が無い'
      - name: test_render_tabs_when_selected
        case: 正常
        summary: selected のタブだけを出す
        condition: '`selected: 1`'
        mock: なし
        expected: '`role="tablist"` と 2 つの `role="tab"`、2 つ目が `aria-selected="true"` と `tabindex="0"`、1 つ目の `tabpanel` が `hidden`'
      - name: test_render_tabs_when_group
        case: 正常
        summary: group を data-group に写す
        condition: '`group: "os\"&"`'
        mock: なし
        expected: '`<div class="mdmark-tabs" data-group="os&quot;&amp;">` で始まる（値をエスケープする）'
  - name: renderSteps
    title: ステップを描く
    container: src/parts/steps.ts
    kind: 関数
    scope: internal
    summary: 部品設計『ステップ』の HTML を返す（Storybook 用。`render` は `ol` に class を付けるだけ）
    args:
