title: "ライブラリ本体 / 部品"
lead: 文書の中に mdmark が置く UI の部品を HTML 文字列で返す関数と、Storybook のストーリー。DOM に頼らず、ブラウザと Node で同じ出力になる。
directory: |-
  ```tree
  src/parts/
  ├── escape.ts                    # HTML の特別な文字をエスケープする escapeHtml
  ├── own.ts                       # mdmark が出した要素の印を付ける markOwn と SLOT_MARKER
  ├── notice.ts                    # 知らせの枠の renderNotice
  ├── notice.stories.yaml          # 知らせの枠のストーリー（Figure・Block・LongName・Extension）
  ├── embed.ts                     # 読み込み中の枠の renderEmbed
  ├── embed.stories.yaml           # 読み込み中の枠のストーリー（Loading）
  ├── syntax-warning.ts            # 書き方の警告の renderSyntaxWarning
  ├── table.ts                     # 表の renderTable と renderTableTools
  ├── callout.ts                   # 注意書きの renderCallout
  ├── tabs.ts                      # タブの renderTabs
  ├── steps.ts                     # ステップの renderSteps
  ├── tree.ts                      # ファイルツリーの renderTree
  ├── badge.ts                     # バッジの renderBadge
  ├── toc.ts                       # 目次の renderToc
  ├── section.ts                   # 節の renderSection
  ├── row-detail.ts                # 行の詳細の renderRowDetail
  ├── figure.ts                    # 図表の番号の renderFigure
  ├── doc-list.ts                  # 文書の一覧の renderDocList
  └── {部品}.stories.yaml         # 部品設計の states ごとのストーリー（上の部品ごとに 1 つ）
  ```
constants:
  - name: LOADING_TEXT
    title: 読み込み中の文言
    container: src/parts/embed.ts
    summary: 読み込み中の枠に出す文字
    value: '"図を読み込んでいます"'
  - name: NOTICE_TITLES
    title: 知らせの枠の題
    container: src/parts/notice.ts
    summary: 図の印かどうかで分ける題
    value: '{ figure: "この図を表示できません", block: "この箇所を表示できません" }'
  - name: SLOT_MARKER
    title: 中身の差し込み口
    container: src/parts/own.ts
    summary: 中身を持つ部品に中身の代わりに渡し、記法がこの前後で HTML を分ける文字列。Markdown に現れない制御文字だけで作る
    value: '"\u0000mdmark-slot\u0000"'
functions:
  - name: escapeHtml
    title: HTML の特別な文字をエスケープする
    container: src/parts/escape.ts
    kind: 関数
    scope: public
    summary: "`&`・`<`・`>`・`\"`・`'` を文字参照にする"
    args:
      - name: text
        type: string
        required: true
        description: エスケープする文字列
    returns:
      type: string
      description: 要素の中身にも属性の値にも置ける文字列
    unit_tests:
      - name: test_escape_html
        case: 正常
        summary: 特別な文字を全て文字参照にする
        condition: "`<a href=\"x\">'&'</a>`"
        mock: なし
        expected: '`&lt;a href=&quot;x&quot;&gt;&#39;&amp;&#39;&lt;/a&gt;`'
  - name: renderNotice
    title: 知らせの枠を描く
    container: src/parts/notice.ts
    kind: 関数
    scope: public
    summary: 部品設計『知らせの枠』の HTML を返す
    args:
      - name: options
        type: '{ name: string; figure?: boolean; source?: "library" | "extension" | "diff-revisions" | "diff-content" }'
        required: true
        description: 印の名前、図の印か（既定 `true`）、読めなかったもの（既定 `library`。`extension` は本文を `表示に使う拡張（…）` にする。`diff-revisions`・`diff-content` は部品設計の題と本文にし、`figure` を使わない）
    returns:
      type: string
      description: '`<div class="mdmark-notice" role="status">` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    refs:
      - dev/設計書/部品設計/知らせの枠.ts#
    unit_tests:
      - name: test_render_notice
        case: 正常
        summary: 図の印の題と、印の名前を入れた本文を返す
        condition: '`{ name: "chart" }`'
        mock: なし
        expected: 題が `この図を表示できません`、本文に `<code>chart</code>` と直し方が入る
      - name: test_render_notice_when_block
        case: 正常
        summary: 図でない印の題を返す
        condition: '`{ name: "tabs", figure: false }`'
        mock: なし
        expected: 題が `この箇所を表示できません`
      - name: test_render_notice_when_name_has_html
        case: 正常
        summary: 印の名前をエスケープする
        condition: '`{ name: "<b>x</b>" }`'
        mock: なし
        expected: '`<code>&lt;b&gt;x&lt;/b&gt;</code>`'
      - name: test_render_notice_when_extension
        case: 正常
        summary: 拡張を読めないときの本文を返す
        condition: '`{ name: "greet", source: "extension" }`'
        mock: なし
        expected: 本文が `表示に使う拡張（<code>greet</code>）を読み込めませんでした。` で始まる
      - name: test_render_notice_when_diff
        case: 正常
        summary: 差分の取り出し元を読めないときの題と本文を返す
        condition: '`{ name: "guide", source: "diff-revisions" }` と `{ name: "2026/10/19 16:40 件数を直す", source: "diff-content" }`'
        mock: なし
        expected: 前者の題が `変更の履歴を表示できません`、後者の本文が `「2026/10/19 16:40 件数を直す」の本文を取り出せませんでした。` で始まる
  - name: renderEmbed
    title: 読み込み中の枠を描く
    container: src/parts/embed.ts
    kind: 関数
    scope: public
    summary: 部品設計『読み込み中の枠』の HTML を返す
    args:
      - name: options
        type: '{ name: string; args?: string[] }'
        required: true
        description: 印の名前と引数（既定 `[]`）
    returns:
      type: string
      description: '`<div class="mdmark-embed" data-mdmark-slot="{name}" data-mdmark-args="{args}" role="status">図を読み込んでいます</div>`'
    callees:
      - '#functions[escapeHtml]'
    refs:
      - dev/設計書/部品設計/読み込み中の枠.ts#
    unit_tests:
      - name: test_render_embed
        case: 正常
        summary: 印の名前と引数を属性に持つ枠を返す
        condition: '`{ name: "chart", args: ["a", "b"] }`'
        mock: なし
        expected: '`data-mdmark-slot="chart"`・`data-mdmark-args="a b"`・`role="status"`・文字 `図を読み込んでいます`'
      - name: test_render_embed_when_args_have_quote
        case: 正常
        summary: 引数をエスケープする
        condition: '`{ name: "chart", args: ["\"><script>"] }`'
        mock: なし
        expected: '`data-mdmark-args="&quot;&gt;&lt;script&gt;"`'
  - name: markOwn
    title: mdmark が出した要素に印を付ける
    container: src/parts/own.ts
    kind: 関数
    scope: internal
    summary: 部品の HTML の全ての開始タグに `data-mdmark-own="{nonce}"` を足す。描画の `sanitize` は、この属性を持つ要素にだけ記法の class・`data-*`・`id` を残し、属性は外す
    description: 部品の HTML は文字をエスケープ済みで、文書の中身（`SLOT_MARKER` の位置）を含まないため、開始タグを `<{名前}` で見分けられる
    args:
      - name: html
        type: string
        required: true
        description: 部品の HTML
      - name: nonce
        type: string
        required: true
        description: 描くごとに作る印の値
    returns:
      type: string
      description: 印を付けた HTML
    unit_tests:
      - name: test_mark_own
        case: 正常
        summary: 全ての開始タグに印を付け、閉じタグと文字はそのまま
        condition: '`<div class="a"><p>x &lt;y&gt;</p></div>` と nonce `n1`'
        mock: なし
        expected: '`<div data-mdmark-own="n1" class="a"><p data-mdmark-own="n1">x &lt;y&gt;</p></div>`'
  - name: renderSyntaxWarning
    title: 書き方の警告を描く
    container: src/parts/syntax-warning.ts
    kind: 関数
    scope: internal
    summary: 部品設計『書き方の警告』の HTML を返す。`message`・項目の `` ` `` で囲んだ箇所を `code` にし、それ以外はエスケープする
    args:
      - name: options
        type: '{ mark?: string; message: string; items?: WarningItem[] }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`<div class="mdmark-syntax-warning" role="note">` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_syntax_warning
        case: 正常
        summary: 題・印・本文・項目を出し、印をエスケープする
        condition: '`mark` が `<!-- table: data +x -->`、項目が 1 つ'
        mock: なし
        expected: '題 `書き方の警告`、`<code>&lt;!-- table: data +x --&gt;</code>`、`<ul>` に 1 項目'
      - name: test_render_syntax_warning_without_mark
        case: 正常
        summary: 印と項目が無ければ本文だけ
        condition: '`message` だけ'
        mock: なし
        expected: '`<code>` で始まらず、`<ul>` が無い'
  - name: renderTable
    title: 表を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 部品設計『表』の HTML を返す。`render` は表を `SLOT_MARKER` にして囲みだけを使い、Storybook は `columns`・`rows` と状態の引数（`sort`・`overflow`・`pinned`・`openFilter`・`filterValues`・`hiddenColumns`・`openColumns`・`copyState`・`targetRow`）で操作を付けた後の見た目を作る。囲みには `hide`・`totals` を `data-hide`・`data-total` で持たせ、`rows` を渡したときは `renderTableBar` の帯とメニュー、`renderTotalRow` の集計の行、`rowIds` の行の `id` と行へのリンクも描く
    args:
      - name: options
        type: TableOptions
        required: true
        description: 部品設計の引数（`kind`・`features`・`columns`・`rows`・`filters`・`collapse`・状態の引数）。`rows` を省いて `body` に `SLOT_MARKER` を渡すと囲みだけを作る
    returns:
      type: string
      description: '`<div class="mdmark-table"` で始まる HTML'
    callees:
      - '#functions[renderTableTools]'
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_table
        case: 正常
        summary: 囲みに種類・機能・絞り込みを属性で持たせる
        condition: '`kind: data`、`features: [sort, pin, filter]`、`filters: [{0, select}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: '`<div class="mdmark-table" data-kind="data" data-features="sort pin filter" data-filter="0:select">` の中に `SLOT_MARKER`'
      - name: test_render_table_when_closed
        case: 正常
        summary: 閉じた表は折り畳みに入れる
        condition: '`collapse: closed`'
        mock: なし
        expected: '`<details class="mdmark-table-details"><summary>表を開く</summary>` を持ち、`open` を持たない'
      - name: test_render_table_when_filtered
        case: 正常
        summary: 当てた絞り込みに合わない行を隠し、一致する行が無ければ知らせの行を出す
        condition: '`filterValues: [{ column: 1, text: "存在しない" }]`'
        mock: なし
        expected: 本文の行が全て `hidden` で、`一致する行がありません` の行が `hidden` を持たない
      - name: test_render_table_when_feature_attributes
        case: 正常
        summary: 囲みに隠す列と集計する列を属性で持たせる
        condition: '`features: [sort, pin, filter, columns, total]`、`hide: [1]`、`totals: [{2, sum}]`、`body: SLOT_MARKER`'
        mock: なし
        expected: 囲みが `data-hide="1"`・`data-total="2:sum"` を持ち、帯と集計の行を持たない
      - name: test_render_table_when_all_features
        case: 正常
        summary: 5 つの機能の状態を描く
        condition: '部品設計の `AllFeatures`（`hide: [1]`、`totals: [{2, sum}]`、`rowIds`）に `targetRow: 1`'
        mock: なし
        expected: 帯に `3 / 3 件`・`列の表示`・`表をコピー`、説明の列の見出し・セル・集計のセルが `hidden`、`tfoot` に `合計 25`、各行に `id` と `mdmark-row-anchor`、2 行目だけ `data-target`
  - name: renderTableTools
    title: 表の見出しのボタンとドロワーを描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 列 1 つの見出しの中身（並べ替え・絞り込み・ピン止めのボタン）と、その列の絞り込みのドロワーの HTML を返す。`mount` が描いた表に足すのにも使う
    args:
      - name: options
        type: '{ id: string; column: number; label: string; features: string[]; filter?: { kind: "select" | "text" | "date"; values: string[] }; active?: boolean; open?: boolean; value?: FilterValue; pinVisible?: boolean; pinPressed?: boolean }'
        required: true
        description: ドロワーの id の頭、列の位置、列名、機能、絞り込み（`select` は候補の値）、絞り込み中か、ドロワーを開いているか、当てている絞り込み、ピン止めのボタンを出すか（既定 `false`。`mount` が幅を測って決め、Storybook は `overflow` で出す）、この列までを留めているか
    returns:
      type: '{ header: string; drawer: string }'
      description: 見出しの中身とドロワー（絞り込みが無ければ空）
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_table_tools
        case: 正常
        summary: 値を選ぶドロワーとボタンを返す
        condition: '`features: [sort, pin, filter]`、`filter: { kind: select, values: ["りんご", "みかん"] }`、列名 `名前`'
        mock: なし
        expected: '`header` に `mdmark-sort`・`mdmark-filter`（`aria-label="「名前」で絞り込む"`）・`mdmark-pin`（`hidden`）、`drawer` に `hidden` の `mdmark-filter-drawer`・候補の検索欄・2 つのチェックボックス・`絞り込みを外す`'
      - name: test_render_table_tools_when_date
        case: 正常
        summary: 日付のドロワーは開始日と終了日の欄を持つ
        condition: '`filter: { kind: date }`'
        mock: なし
        expected: '`drawer` に `開始日`・`終了日` の `<input type="date">` がある'
  - name: renderCallout
    title: 注意書きを描く
    container: src/parts/callout.ts
    kind: 関数
    scope: internal
    summary: 部品設計『注意書き』の HTML を返す
    args:
      - name: options
        type: '{ kind: CalloutKind; collapsed?: boolean; open?: boolean; body: string }'
        required: true
        description: 種類・折り畳み・開閉・本文の HTML（`SLOT_MARKER` を渡せる）
    returns:
      type: string
      description: 注意書きの HTML
    unit_tests:
      - name: test_render_callout
        case: 正常
        summary: 種類の class と題を出す
        condition: '`kind: warning`'
        mock: なし
        expected: '`<div class="markdown-alert markdown-alert-warning"><p class="markdown-alert-title">警告</p>`'
      - name: test_render_callout_when_collapsed
        case: 正常
        summary: 折り畳みは details にする
        condition: '`kind: note`、`collapsed: true`'
        mock: なし
        expected: '`<details class="markdown-alert markdown-alert-note"><summary class="markdown-alert-title">補足</summary>`'
  - name: renderTabs
    title: タブを描く
    container: src/parts/tabs.ts
    kind: 関数
    scope: internal
    summary: 部品設計『タブ』の HTML を返す。`selected` を渡すとタブの並びを付け、選んだもの以外の中身を `hidden` にする
    args:
      - name: options
        type: '{ id: string; titles: string[]; panels: string[]; selected?: number }'
        required: true
        description: id の頭、タブ名、タブごとの中身の HTML（`SLOT_MARKER` を渡せる）、選んだタブ
    returns:
      type: string
      description: '`<div class="mdmark-tabs">` で始まる HTML'
    unit_tests:
      - name: test_render_tabs
        case: 正常
        summary: selected が無ければ全ての中身を隠さずに出す
        condition: '`titles: [macOS, Windows]`'
        mock: なし
        expected: '`mdmark-tab-title` が 2 つ、`role="tablist"` と `hidden` が無い'
      - name: test_render_tabs_when_selected
        case: 正常
        summary: selected のタブだけを出す
        condition: '`selected: 1`'
        mock: なし
        expected: '`role="tablist"` と 2 つの `role="tab"`、2 つ目が `aria-selected="true"` と `tabindex="0"`、1 つ目の `tabpanel` が `hidden`'
  - name: renderSteps
    title: ステップを描く
    container: src/parts/steps.ts
    kind: 関数
    scope: internal
    summary: 部品設計『ステップ』の HTML を返す（Storybook 用。`render` は `ol` に class を付けるだけ）
    args:
      - name: options
        type: '{ items: string[]; start?: number }'
        required: true
        description: 項目の HTML と最初の番号
    returns:
      type: string
      description: '`<ol class="mdmark-steps">` で始まる HTML'
    unit_tests:
      - name: test_render_steps
        case: 正常
        summary: 項目を並べ、start が 1 なら属性を省く
        condition: 3 項目
        mock: なし
        expected: '`<ol class="mdmark-steps">` に `li` が 3 つ'
  - name: renderTree
    title: ファイルツリーを描く
    container: src/parts/tree.ts
    kind: 関数
    scope: internal
    summary: 部品設計『ファイルツリー』の HTML を返す
    args:
      - name: options
        type: '{ nodes: TreeNode[] }'
        required: true
        description: 項目
    returns:
      type: string
      description: '`<ul class="mdmark-tree"` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_tree
        case: 正常
        summary: フォルダとファイルを分け、名前をエスケープする
        condition: '`src/` の子に `a<b>.ts`'
        mock: なし
        expected: '`src/` が `mdmark-tree-folder`、`a&lt;b&gt;.ts` が `mdmark-tree-file`'
  - name: renderBadge
    title: バッジを描く
    container: src/parts/badge.ts
    kind: 関数
    scope: internal
    summary: 部品設計『バッジ』の HTML を返す
    args:
      - name: options
        type: '{ label: string }'
        required: true
        description: 札の文言
    returns:
      type: string
      description: '`<span class="mdmark-badge">` の HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_badge
        case: 正常
        summary: 文言をエスケープして札にする
        condition: '`label: "<b>v1</b>"`'
        mock: なし
        expected: '`<span class="mdmark-badge">&lt;b&gt;v1&lt;/b&gt;</span>`'
  - name: renderToc
    title: 目次を描く
    container: src/parts/toc.ts
    kind: 関数
    scope: internal
    summary: 部品設計『目次』の HTML を返す。h3 は直前の h2 の入れ子にする
    args:
      - name: options
        type: '{ headings: Array<{ level: 2 | 3; id: string; text: string }> }'
        required: true
        description: h2・h3
    returns:
      type: string
      description: '`<nav class="mdmark-toc" aria-label="目次">` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_toc
        case: 正常
        summary: h3 を直前の h2 の入れ子にする
        condition: '`導入`（h2）・`前提`（h3）・`使い方`（h2）'
        mock: なし
        expected: '`導入` の `li` の中の `ul` に `#前提` のリンク'
  - name: renderSection
    title: 節を描く
    container: src/parts/section.ts
    kind: 関数
    scope: internal
    summary: 部品設計『節』の HTML を返す。`toggle` が `false` のときは開閉のボタンを置かず中身を隠さない
    args:
      - name: options
        type: '{ level: 2 | 3 | 4; id: string; title: string; open?: boolean; toggle?: boolean; anchor?: boolean; body: string }'
        required: true
        description: 部品設計の引数と中身の HTML（`SLOT_MARKER` を渡せる）
    returns:
      type: string
      description: 見出しと `mdmark-section-body` の HTML
    unit_tests:
      - name: test_render_section
        case: 正常
        summary: 閉じた節はボタンを aria-expanded=false にし、中身を hidden=until-found にする
        condition: '`open: false`、`toggle: true`'
        mock: なし
        expected: '`aria-expanded="false"`、`data-section="closed" hidden="until-found"`'
      - name: test_render_section_when_unmounted
        case: 正常
        summary: toggle が false なら中身を隠さず data-section だけに写す
        condition: '`open: false`、`toggle: false`'
        mock: なし
        expected: '`<button` が無く、`data-section="closed"` で `hidden` が無い'
  - name: renderRowDetail
    title: 行の詳細を描く
    container: src/parts/row-detail.ts
    kind: 関数
    scope: internal
    summary: 部品設計『行の詳細』の詳細の行と、`toggle` のときは行の先頭のセルの開閉のボタンの HTML を返す
    args:
      - name: options
        type: '{ id: string; row: number; columns: number; label: string; open?: boolean; toggle?: boolean; body: string }'
        required: true
        description: 部品設計の引数と中身の HTML（`SLOT_MARKER` を渡せる）
    returns:
      type: '{ row: string; toggle: string }'
      description: 詳細の行と、開閉のボタン（`toggle` が `false` なら空）
    unit_tests:
      - name: test_render_row_detail
        case: 正常
        summary: 閉じた詳細の行とボタンを返す
        condition: '`row: 1`、`columns: 3`、`label: table`'
        mock: なし
        expected: '`row` が `<tr class="mdmark-row-detail" data-row="1" … hidden><td colspan="3">`、`toggle` が `aria-expanded="false"` と `aria-label="「table」の詳細"`'
  - name: renderFigure
    title: 図表の番号を描く
    container: src/parts/figure.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図表の番号』の HTML を返す。画像は題を下、表は上に置く
    args:
      - name: options
        type: '{ kind: "image" | "table"; id?: string; number: number; caption?: string; body: string }'
        required: true
        description: 部品設計の引数と中身の HTML（`SLOT_MARKER` を渡せる）。`id` を省くと `id` を付けない（重なった ID）
    returns:
      type: string
      description: '`<figure class="mdmark-figure"` で始まる HTML'
    callees:
      - '#functions[escapeHtml]'
    unit_tests:
      - name: test_render_figure
        case: 正常
        summary: 画像は題を下、表は題を上に置く
        condition: '`kind: image`、`number: 1`、`caption: 全体の構成` と、`kind: table`、`number: 1`'
        mock: なし
        expected: 1 つ目は中身の後に `<figcaption class="mdmark-figure-caption"><b>図 1</b>全体の構成</figcaption>`、2 つ目は中身の前に `<b>表 1</b>`
  - name: renderDocList
    title: 文書の一覧を描く
    container: src/parts/doc-list.ts
    usecase: まとめたHTMLで文書を行き来する
    summary: 部品設計『文書の一覧』の HTML を返す。フォルダの無い文書を先に、フォルダごとに 1 段の見出しでまとめ、`current` の行に `aria-current="page"` を付ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ docs: Array<{ path: string; title: string }>; current?: string }'
        required: true
        description: まとめた文書と開いている文書のパス
    returns:
      type: string
      description: '`<nav class="mdmark-doc-list" aria-label="文書の一覧">` で始まる HTML。各リンクは `href="#/{path}"` と `data-doc-path` を持つ'
    unit_tests:
      - name: test_render_doc_list
        case: 正常
        summary: フォルダの無い文書を先に、フォルダごとに最初に出た順でまとめる
        condition: '`docs` が `a/x.md`・`README.md`・`b/y.md`・`a/z.md`、`current` が `b/y.md`'
        mock: なし
        expected: まとまりが見出しなし（`README.md`）・`a`（`x.md`・`z.md`）・`b` の順で、`b/y.md` のリンクだけが `aria-current="page"` を持つ
      - name: test_render_doc_list_when_escaped
        case: 正常
        summary: 題とパスの HTML の特殊文字を替える
        condition: 題が `<b>&` の文書
        mock: なし
        expected: 題が `&lt;b&gt;&amp;` で出る
    callees:
      - '#functions[escapeHtml]'
    refs:
      - dev/設計書/部品設計/文書の一覧.ts#
    status: planned
    introduced:
      pr: 32
  - name: renderTableBar
    title: 表の上の帯と列の表示のメニューを描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: '`count`・`columns`・`copy` のうち付けた機能の帯（件数・`列の表示`・`表をコピー`）と、列の表示のメニュー（列名のチェックボックス、先頭の列は `disabled`、`先頭の列は隠せません`、`既定に戻す`）の HTML を返す。アイコンは lucide の `columns-3`・`copy`・`check`・`circle-alert`（`columns-3` は `src/parts/icons.ts` に足す）。`mount` が描いた表に足すのにも使う'
    args:
      - name: options
        type: '{ id: string; features: string[]; labels: string[]; shown: number; total: number; hiddenColumns: number[]; openColumns?: boolean; copyState?: "idle" | "copied" | "failed" }'
        required: true
        description: メニューの id の頭、機能、列名、表示している行の数、全ての行の数、隠している列、メニューを開いているか、コピーのボタンの状態
    returns:
      type: '{ bar: string; menu: string }'
      description: 帯とメニュー（該当する機能が無ければ空）
    unit_tests:
      - name: test_render_table_bar
        case: 正常
        summary: 件数と列の表示とコピーの帯を返す
        condition: '`features: [count, columns, copy]`、列名 `名前`・`説明`・`更新日`、`shown: 2`、`total: 3`、`hiddenColumns: [1]`'
        mock: なし
        expected: '`bar` に `aria-live="polite"` の `2 / 3 件` と読み上げ `3 件中 2 件を表示`、`aria-expanded="false"` の `列の表示`、`data-state="idle"` の `表をコピー`。`menu` が `hidden` で、名前のチェックボックスが `checked disabled`、説明のチェックが外れ、`先頭の列は隠せません` と `既定に戻す` がある'
      - name: test_render_table_bar_when_copy_failed
        case: 正常
        summary: コピーできなかったボタンを返す
        condition: '`features: [copy]`、`copyState: failed`'
        mock: なし
        expected: '`bar` のボタンが `data-state="failed"` と `コピーできませんでした` を持ち、件数と `列の表示` が無く、`menu` が空'
    refs:
      - '#functions[escapeHtml]'
  - name: renderTotalRow
    title: 集計の行を描く
    container: src/parts/table.ts
    kind: 関数
    scope: internal
    summary: 列の数だけセルを持つ `<tfoot><tr class="mdmark-table-total">` を返す。集計する列のセルは `data-total="{計算}"` と題（`合計`・`平均`・`個数`）と値を持ち、隠している列のセルは `hidden` を持つ。`mount` が集計し直すときにも使う
    args:
      - name: options
        type: '{ columns: number; totals: Array<{ column: number; calc: "sum" | "avg" | "count"; value: string }>; hiddenColumns: number[]; labels: string[] }'
        required: true
        description: 列の数、集計する列と計算と整えた値（`computeTotal` の戻り値）、隠している列、列名（`data-label`）
    returns:
      type: string
      description: '`<tfoot>` の HTML'
    unit_tests:
      - name: test_render_total_row
        case: 正常
        summary: 集計する列に題と値を出し、隠した列のセルを隠す
        condition: '`columns: 3`、`totals: [{0, count, "4"}, {1, sum, "45"}, {2, avg, "250"}]`、`hiddenColumns: [2]`'
        mock: なし
        expected: 3 つのセルが `個数 4`・`合計 45`・`平均 250` で `data-total` を持ち、3 つ目だけ `hidden`
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[computeTotal]
notes:
  ストーリー: '`*.stories.yaml` は `title`（部品設計の `story`）と、部品設計の `states` ごとの `stories[].name`・`stories[].parameters.server.id`（部品の id。ファイル名の頭）・`stories[].args` を持つ。`embed` の配列の引数は `a,b` の 1 つの文字列で書く。この PR で足す部品の配列・オブジェクトの引数は JSON の文字列で書く（戻し方は『部品の描画』）。中身を持つ部品のストーリーは、中身に部品ごとの見本の HTML を渡す'
  印の付け方: 部品の関数は `markOwn` を掛けない。記法のコアルールと `mount` の操作が、差し込む前に掛ける
