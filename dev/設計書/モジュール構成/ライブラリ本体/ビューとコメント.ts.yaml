title: "ライブラリ本体 / ビューとコメント"
lead: ビューとコメントの部品を `dist/index.js` と別の配布ファイル（`dist/view.js`・`dist/comments.js`）に分け、マーカーのある文書と `mountView`・`mountComments` を呼んだときにだけ読み込む処理と、その部品の HTML。ブラウザでだけ動く（部品の HTML と箇所の探し方は Node でも動く）。
directory: |-
  ```tree
  src/
  ├── part-modules.ts      # 部品のモジュールのファイル名・読み込みの差し替え・1 回だけ読み込む loadPartModule（dist/index.js）
  ├── mount-parts.ts       # 公開関数 mountView・mountComments と、mount が呼ぶ attachParts（dist/index.js）
  ├── views/
  │   ├── spec.ts          # 公開の型 MdmarkViewOptions・MdmarkViewHandle、使用できるアイコンと既定の対応、引数の検査（dist/index.js）
  │   └── index.ts         # dist/view.js の入口。drawView・attachView
  ├── comments/
  │   ├── spec.ts          # 公開の型 MdmarkComment・MdmarkCommentDraft・MdmarkCommentStore・MdmarkCommentsHandle、引数とコメントの構造の検査（dist/index.js）
  │   ├── anchor.ts        # 選んだ範囲から下書きを作る・本文の文字から箇所を探す（dist/comments.js）
  │   ├── bubble.ts        # 吹き出しのコメントの修正と削除の操作（dist/comments.js）
  │   ├── margin.ts        # 本文の列の右の余白の列に、箇所の行の高さで余白のマーカーを配置する（dist/comments.js）
  │   └── index.ts         # dist/comments.js の入口。attachComments
  └── parts/
      ├── view.ts          # ビューの HTML とアイコンの形状（dist/view.js）
      └── comment.ts       # コメントのボタン・入力欄・マーカー・吹き出し・箇所が見つからないコメントの一覧・余白のマーカーの HTML（dist/comments.js）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction LR
        class 部品のモジュールを読み込む
        class ビューを描く公開関数
        class コメントを付ける公開関数
        class 描いた文書に部品を付ける
        class ビューの引数を検める
        class コメントの引数を検める
        class ビューを描く
        class マーカーのビューに付ける
        class コメントを付ける
        class 選んだ範囲から下書きを作る
        class コメントの箇所を探す
        class コメントを修正・削除する
        class 部品のHTML
        ビューを描く公開関数 --> ビューの引数を検める : 同期で検める
        ビューを描く公開関数 --> 部品のモジュールを読み込む : view
        コメントを付ける公開関数 --> コメントの引数を検める : 同期で検める
        コメントを付ける公開関数 --> 部品のモジュールを読み込む : comments
        描いた文書に部品を付ける --> 部品のモジュールを読み込む : マーカーと機能があるときだけ
        部品のモジュールを読み込む ..> ビューを描く : dist/view.js
        部品のモジュールを読み込む ..> マーカーのビューに付ける : dist/view.js
        部品のモジュールを読み込む ..> コメントを付ける : dist/comments.js
        コメントを付ける --> コメントの箇所を探す : 読み込んだコメント
        コメントを付ける --> 選んだ範囲から下書きを作る : 保存するとき
        コメントを付ける --> コメントを修正・削除する : 吹き出しを開くとき
        コメントを修正・削除する --> 部品のHTML
        ビューを描く --> 部品のHTML
        マーカーのビューに付ける --> 部品のHTML
        コメントを付ける --> 部品のHTML
data_models:
  - name: MdmarkViewOptions
    title: ビューの引数
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` に指定する項目と表示の指定'
    properties:
      - name: columns
        type: string[]
        description: 列名。表形式の列の並びと、ボードの項目に出す値の並び
      - name: items
        type: Record<string, string>[]
        description: 列名をキーにした項目の値。並びは表の行の順
      - name: group
        type: string | undefined
        description: ボードで列に分ける列名
      - name: default
        type: '"board" | "table" | undefined'
        description: 描いた直後に出すビュー
      - name: filter
        type: Record<string, FilterKind> | undefined
        description: 表形式で絞り込みを付ける列と種類（`FilterKind` は `src/table-logic.ts`）
      - name: icons
        type: Record<string, ViewIconName> | undefined
        description: ボードの列の見出しの値からアイコンの名前を参照する対応。`DEFAULT_VALUE_ICONS` に重ねる
  - name: MdmarkViewHandle
    title: ビューの片付け
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` の Promise の値'
    properties:
      - name: destroy
        type: () => void
        description: '`el` の中を空にし、ビューの操作と `document` の受け取りを解除する。2 回目以降は何もしない'
  - name: ViewSpec
    title: マーカーのビューの指定
    container: src/views/spec.ts
    role: DTO
    summary: '`render` が `div.mdmark-view` の `data-view` に JSON で記載し、`attachView` が読み込む指定'
    properties:
      - name: group
        type: number | null
        description: ボードで分ける列の位置。`group=` が無いか表に無ければ `null`
      - name: mode
        type: '"board" | "table"'
        description: 描いた直後に出すビュー
      - name: boardDisabled
        type: string
        description: '`group=` の列が表に無いときの記載の警告の `id`。それ以外は空'
      - name: icons
        type: Record<string, ViewIconName>
        description: '`icons=` の読み込めた対応'
  - name: MdmarkCommentDraft
    title: コメントの下書き
    container: src/comments/spec.ts
    role: 公開の型
    summary: '`save` に指定する、まだ `id` の無いコメント'
    properties:
      - name: quote
        type: string
        description: 選んだ文字（前後の空白を落とす）
      - name: prefix
        type: string
        description: 選んだ文字の直前の本文の文字。`CONTEXT_CHARS` 文字まで
      - name: suffix
        type: string
        description: 選んだ文字の直後の本文の文字。`CONTEXT_CHARS` 文字まで
      - name: body
        type: string
        description: コメントの本文（前後の空白を落とす）
  - name: MdmarkComment
    title: コメント
    container: src/comments/spec.ts
    role: 公開の型
    summary: 保存したコメント。`MdmarkCommentDraft` に `id` を追加したもの
    inherits: MdmarkCommentDraft
    properties:
      - name: id
        type: string
        description: 保存先が付けた ID
  - name: MdmarkCommentStore
    title: コメントの読み込みと保存の関数
    container: src/comments/spec.ts
    role: 公開の型
    summary: 利用側が記載する、コメントの読み込みと保存
    properties:
      - name: load
        type: '(target: { docId: string }) => Promise<MdmarkComment[]>'
        description: 対象のコメントを返却する
      - name: save
        type: '(target: { docId: string; comment: MdmarkCommentDraft }) => Promise<MdmarkComment>'
        description: 下書きを保存し、`id` を付けたコメントを返却する
      - name: update
        type: '((target: { docId: string; id: string; body: string }) => Promise<void>) | undefined'
        description: コメントの本文を書き換える。持つときだけ吹き出しに「編集」を出す
      - name: remove
        type: '((target: { docId: string; id: string }) => Promise<void>) | undefined'
        description: コメントを削除する。持つときだけ吹き出しに「削除」を出す
  - name: MdmarkCommentsHandle
    title: コメントの片付け
    container: src/comments/spec.ts
    role: 公開の型
    summary: '`mountComments` の Promise の値'
    properties:
      - name: destroy
        type: () => void
        description: マーカーを削除して文字を元の並びに戻し、ボタン・入力欄・吹き出し・一覧と `document` の受け取りを解除する。2 回目以降は何もしない
  - name: ViewPartModule
    title: ビューの部品のモジュール
    container: src/views/index.ts
    role: モジュールの構造
    summary: '`dist/view.js` が export する関数'
    properties:
      - name: drawView
        type: '(el: HTMLElement, opts: MdmarkViewOptions) => () => void'
        description: '`mountView` が呼ぶ'
      - name: attachView
        type: '(view: HTMLElement) => () => void'
        description: '`mount` が描いた `div.mdmark-view` ごとに呼ぶ'
  - name: CommentsPartModule
    title: コメントの部品のモジュール
    container: src/comments/index.ts
    role: モジュールの構造
    summary: '`dist/comments.js` が export する関数'
    properties:
      - name: attachComments
        type: '(options: { root: HTMLElement; store: MdmarkCommentStore; docId: string; reveal?: (element: HTMLElement) => void; margin?: boolean }) => Promise<CommentsController>'
        description: '`mountComments` と `mount` が呼ぶ'
  - name: CommentsController
    title: 付けたコメントの操作
    container: src/comments/index.ts
    role: モジュールの構造
    summary: '`attachComments` の Promise の値'
    properties:
      - name: detach
        type: () => void
        description: マーカーを削除して文字を元に戻し、配置した要素と受け取りを解除する。2 回目以降は何もしない
      - name: reload
        type: () => Promise<void>
        description: '`load` をもう一度呼んでマーカーをもう一度付ける'
      - name: focus
        type: '(id: string) => void'
        description: その `id` のコメントのマーカーへ移って強調する
    status: planned
    introduced:
      pr: 280
  - name: PartsHandle
    title: 描いた文書に付けた部品の操作
    container: src/mount-parts.ts
    role: モジュールの構造
    summary: '`attachParts` の戻り値'
    properties:
      - name: detach
        type: () => void
        description: 付けた部品を削除する。読み込みを待っている間に呼ぶと、読み込めた後に付けない
      - name: reloadComments
        type: () => Promise<void>
        description: 付けたコメントの `reload` を呼ぶ。コメントを付けていないときは解決した Promise を返却する
      - name: focusComment
        type: '(id: string) => void'
        description: 付けたコメントの `focus` を呼ぶ。コメントを付けていないときは何もしない
    status: planned
    introduced:
      pr: 280
constants:
  - name: PART_MODULE_FILES
    title: 部品のモジュールのファイル名
    container: src/part-modules.ts
    summary: 部品の名前から、`dist/index.js` の隣に配置する配布ファイルの名前を参照する
    value: '{ view: "view.js", comments: "comments.js", map: "map.js" }'
  - name: partModuleLoaders
    title: 部品のモジュールの読み込みの差し替え
    container: src/part-modules.ts
    summary: 書き出した HTML の起動の処理が、同じスクリプトにまとめた部品のモジュールを返却する関数を入れる。無い名前は `PART_MODULE_FILES` を `import.meta.url` から解決して読み込む
    value: 'new Map<PartName, () => Promise<Record<string, unknown>>>()'
    status: planned
    introduced:
      pr: 296
  - name: partModules
    title: 読み込んだ部品のモジュール
    container: src/part-modules.ts
    summary: 部品の名前から読み込みの Promise を参照する。ページの中で 1 回だけ読み込む（失敗も記録し、再読み込みしない）
    value: new Map<PartName, Promise<unknown>>()
  - name: VIEW_ICON_NAMES
    title: 使用できるアイコン
    container: src/views/spec.ts
    summary: ボードの列の見出しに使用できる lucide のアイコンの名前
    value: '["circle", "circle-dashed", "circle-dot", "circle-pause", "circle-check", "circle-x", "inbox", "archive", "clock", "flag", "star", "bug", "eye", "lock", "zap", "ban"]'
  - name: DEFAULT_VALUE_ICONS
    title: 値の既定のアイコン
    container: src/views/spec.ts
    summary: ボードの列の値から既定のアイコンを参照する。無い値は `FALLBACK_VALUE_ICON`
    value: '{ 未着手: "circle-dashed", 進行中: "circle-dot", 保留: "circle-pause", 完了: "circle-check", 中止: "circle-x" }'
  - name: FALLBACK_VALUE_ICON
    title: 対応に無い値のアイコン
    container: src/views/spec.ts
    value: '"circle"'
    summary: 既定の対応にも `icons` にも無い値のアイコン
  - name: VIEW_ICON_PATHS
    title: アイコンの形状
    container: src/parts/view.ts
    summary: '`VIEW_ICON_NAMES` と切り替えの `board`・`table` の、24 の格子の lucide の SVG の中身'
    value: "{ circle: '<circle cx=\"12\" cy=\"12\" r=\"10\"/>', … }"
  - name: CONTEXT_CHARS
    title: 前後の文字の数
    container: src/comments/anchor.ts
    summary: 下書きの `prefix`・`suffix` に取る文字の上限
    value: '32'
  - name: COMMENT_BLOCKS
    title: コメントを付けられるブロック
    container: src/comments/index.ts
    summary: 選んだ文字の始まりと終わりが同じ 1 つに入っていればボタンを出すブロック
    value: '"p, li, td, th, h1, h2, h3, h4, h5, h6, blockquote"'
  - name: COMMENT_EXCLUDED
    title: コメントを付けない場所
    container: src/comments/index.ts
    summary: この中の選びにはボタンを出さず、箇所を探す本文の文字にも数えない（マーカー `.mdmark-comment-mark` だけは本文の文字に数える）
    value: '"input, textarea, pre, code, .mdmark-view-switch, .mdmark-view-board, .mdmark-filter-drawer, .mdmark-comment-mark, .mdmark-comment-popover, .mdmark-comment-add, .mdmark-comment-orphans"'
  - name: PENDING_HIGHLIGHT
    title: 選んだ箇所の色の名前
    container: src/comments/index.ts
    summary: 入力欄を開いている間の選んだ文字に適用する Custom Highlight の名前（CSS の `::highlight()` と統一する）
    value: '"mdmark-comment-pending"'
  - name: DISCARD_MESSAGE
    title: 捨てる確認の文
    container: src/comments/index.ts
    summary: 本文がある入力欄を閉じるときの `window.confirm` の文
    value: '"記載したコメントを捨てて閉じますか？"'
  - name: POPOVER_GAP_PX
    title: 箇所と枠の隙間
    container: src/comments/index.ts
    summary: ボタン・入力欄・吹き出しを箇所から離す幅
    value: '6'
  - name: POPOVER_GUTTER_PX
    title: 画面の端からの幅
    container: src/comments/index.ts
    summary: ボタン・入力欄・吹き出しを画面の端から離す幅
    value: '8'
  - name: SAME_LINE_PX
    title: 同じ行とみなす差
    container: src/comments/margin.ts
    summary: 箇所の行の上端の差がこの値以下なら、同じ行として 1 つのマーカーにまとめる
    value: '4'
  - name: MARKER_GAP_PX
    title: マーカーの間の幅
    container: src/comments/margin.ts
    summary: 上下に並んだマーカーの間に空ける幅
    value: '4'
  - name: MAX_OPEN_DEPTH
    title: 開く処理の上限
    container: src/comments/margin.ts
    summary: 閉じた中の箇所へ移るとき、入れ子の閉じた要素を外側から開く処理を繰り返す上限
    value: '4'
  - name: CLOSED_LABELS
    title: 閉じた中の種類の文言
    container: src/parts/comment.ts
    summary: 余白のマーカーのスクリーンリーダー向けの名前に添える、閉じた中の種類ごとの文言
    value: '{ section: "閉じたセクションの中", tab: "選ばれていないタブの中", row: "閉じた行の詳細の中" }'
  - name: COMMENT_MESSAGES
    title: 入力欄の通知
    container: src/parts/comment.ts
    summary: 部品設計『コメントの入力欄』の `empty`・`failed` の通知と、部品設計『コメントの吹き出し』の修正・削除の通知と削除の確認の文
    value: '{ empty: "コメントを記載してから保存してください。", failed: "コメントを保存できませんでした。記載したコメントは残っています。もう一度「コメントを保存」を押してください。", updateFailed: "コメントを保存できませんでした。記載したコメントは残っています。もう一度「保存」を押してください。", removeFailed: "コメントを削除できませんでした。もう一度「削除」を押してください。", removeConfirm: "このコメントを削除しますか? 削除すると元に戻せません。" }'
functions:
  - name: loadPartModule
    title: 部品のモジュールを読み込む
    container: src/part-modules.ts
    summary: 部品の配布ファイルをページの中で 1 回だけ `import()` し、export の構造を確認して返却する
    kind: 関数
    scope: internal
    args:
      - name: name
        type: PartName
        required: true
        description: '`"view"` か `"comments"`'
      - name: importModule
        type: '(url: string) => Promise<Record<string, unknown>>'
        required: false
        default: 動的 `import()`
        passing: injected
        description: モジュールを読み込む関数（単体テストで差し替える）
    returns:
      type: 'Promise<{ url: string; module: ViewPartModule | CommentsPartModule }>'
      description: 読み込んだ URL とモジュール。読み込めない・構造が合わないときは元のエラーで reject し、エラーの `cause` に URL を持たせる
    process: |-
      1. `partModules` に名前があればその Promise を返却する
      2. `partModuleLoaders` に名前があれば、URL を `PART_MODULE_FILES[name]` にしてその関数を待つ。無ければ URL を `new URL("./" + PART_MODULE_FILES[name], import.meta.url).href` にして `importModule(url)` を待つ
      3. 読み込んだモジュールで、`view` は `drawView`・`attachView`、`comments` は `attachComments` が関数かを確認する。合わなければ `Error`（モジュールが {名前} を export していない）を投げる
      4. 手順 2〜3 の Promise を `partModules` に記録して返却する
    unit_tests:
      - name: test_load_part_module
        case: 正常
        summary: 隣の配布ファイルを読み込み、同じ名前は 1 回だけ読み込む
        condition: '`view` を 2 回読む'
        mock: '`importModule` は呼ばれた URL を記録し、2 つの関数を持つオブジェクトを返却する'
        expected: '`importModule` が 1 回だけ、`view.js` で終わる URL で呼ばれる。2 回とも同じモジュール'
      - name: test_load_part_module_when_loader
        case: 正常
        summary: 差し替えた関数で読み込み、URL を読み込まない
        condition: '`setPartModuleLoader("view", 関数)` の後に `view` を読み込む。関数は 2 つの関数を持つオブジェクトを返却する'
        mock: '`importModule` を見張る'
        expected: '`importModule` が呼ばれず、関数が返却したモジュールと `url` の `view.js` を返却する'
      - name: test_load_part_module_when_shape_mismatch
        case: 異常
        summary: 関数を export しないモジュールを拒む
        condition: '`comments` を読み込む'
        mock: '`importModule` は `{}` を返却する'
        expected: '`attachComments` を含むメッセージの Error で reject し、`cause` に URL'
      - name: test_load_part_module_when_rejected
        case: 異常
        summary: 読み込めないモジュールは元のエラーで reject し、次も再読み込みしない
        condition: '`view` を 2 回読む'
        mock: '`importModule` は reject する'
        expected: 2 回とも同じエラーで reject し、`importModule` は 1 回だけ呼ばれる
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/ビューを描く.ts#constraints[部品のモジュールの読み込み]
      - dev/設計書/インターフェース定義/ライブラリ本体/コメントを付ける.ts#constraints[部品のモジュールの読み込み]
  - name: setPartModuleLoader
    title: 部品のモジュールの読み込みを差し替える
    container: src/part-modules.ts
    summary: '`partModuleLoaders` に部品の名前とモジュールを返却する関数を入れる。書き出した HTML の起動の処理が呼ぶ'
    kind: 関数
    scope: internal
    args:
      - name: name
        type: PartName
        required: true
        description: 部品の名前
      - name: loader
        type: '() => Promise<Record<string, unknown>>'
        required: true
        description: 同じスクリプトにまとめた部品のモジュールを返却する関数。埋めなかった部品は拒否する関数
    returns:
      type: void
      description: '-'
    process: 1. `partModuleLoaders` に `name` → `loader` を入れる
    unit_tests: []
    status: planned
    introduced:
      pr: 296
  - name: mountView
    title: ビューを描く公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、ビューの部品のモジュールを読み込んで `el` にビューを描く
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中を書き換える。読み込めないときは通知ブロックを配置し、`console.error` に出す'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先の要素
      - name: opts
        type: MdmarkViewOptions
        required: true
        description: 項目と表示の指定
    args_example: |-
      ```ts
      const view = await mountView(slot, { columns: ["タイトル", "状態"], items, group: "状態" });
      view.destroy();
      ```
    returns:
      type: Promise<MdmarkViewHandle>
      description: 描き終えたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkViewOptions` が投げる（同期）'
    process: |-
      1. `checkViewOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("view")` を待ち、`module.drawView(el, opts)` の削除する関数を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読み込めないときは `el` の中を class `mdmark` の要素 1 つにし、その中に `renderNotice({ name: "view", figure: false, source: "part" })` を配置し、部品の名前・URL・元のエラーを `console.error` に出して、元のエラーで reject する
    unit_tests:
      - name: test_mount_view
        case: 正常
        summary: モジュールの drawView を呼んで destroy を返却する
        condition: '`columns`・`items`・`group` を指定する'
        mock: '`loadPartModule` の `importModule` は、呼ばれた引数を記録して削除する関数を返却する `drawView` を持つモジュールを返却する'
        expected: '`drawView` が `el` と `opts` で呼ばれる。`destroy` を 2 回呼んでも解除する関数は 1 回だけ呼ばれる'
      - name: test_mount_view_when_invalid
        case: 異常
        summary: 引数が合わないと同期で投げ、モジュールを読み込まない
        condition: '`group` に無い列名'
        mock: '`importModule` は呼ばれたかを記録する'
        expected: '`TypeError` を同期で投げ、`importModule` は呼ばれず、`el` は変わらない'
      - name: test_mount_view_when_module_unavailable
        case: 異常
        summary: 読み込めないと通知ブロックを配置して reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`console.error` を記録する関数で包む'
        expected: '`el` の中にタイトルが `この箇所を表示できません` の通知ブロックがあり、元のエラーで reject する。`console.error` に `view` と URL'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/ビューを描く.ts#
  - name: mountComments
    title: コメントを付ける公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、コメントの部品のモジュールを読み込んで `el` の中にコメントを付ける
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中にマーカー・ボタン・一覧を配置し、`document` に受け取りを付ける'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: コメントを付けられる範囲の要素
      - name: opts
        type: '{ store: MdmarkCommentStore; docId: string }'
        required: true
        description: 読み込みと保存の関数と対象の ID
    returns:
      type: Promise<MdmarkCommentsHandle>
      description: 読み込んだコメントにマーカーを付けたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkCommentOptions` が投げる（同期）'
    process: |-
      1. `checkCommentOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("comments")` を待ち、`module.attachComments({ root: el, store, docId })` が返却した `CommentsController` の `detach` を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読み込めないときは `el` を書き換えず、`load` を呼ばずに元のエラーで reject する
    unit_tests:
      - name: test_mount_comments
        case: 正常
        summary: モジュールの attachComments を呼んで destroy を返却する
        condition: '`store` と `docId: "panel-setup"`'
        mock: '`importModule` は、引数を記録して削除する関数で解決する `attachComments` を持つモジュールを返却する'
        expected: '`attachComments` が `{ root: el, store, docId }` で呼ばれる。`destroy` で削除する関数が 1 回呼ばれる'
      - name: test_mount_comments_when_invalid
        case: 異常
        summary: 読み込みと保存の関数が無いと同期で投げる
        condition: '`store` に `save` が無い'
        mock: なし
        expected: メッセージに `opts.store` を含む `TypeError` を同期で投げる
      - name: test_mount_comments_when_module_unavailable
        case: 異常
        summary: 読み込めないと el を書き換えずに reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`load` は呼ばれたかを記録する'
        expected: 元のエラーで reject し、`el` の中は変わらず、`load` は呼ばれない
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/コメントを付ける.ts#
  - name: attachParts
    title: 描いた文書に部品を付ける
    container: src/mount-parts.ts
    summary: '`mount` が描くたびに呼ぶ。ビューのマーカーとコメントの機能があるときだけ部品のモジュールを読み込んで付け、削除する関数を返却する'
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; commentStore?: MdmarkCommentStore; docId?: string; isCurrent: () => boolean; warned: { missingStore: boolean } }'
        required: true
        description: 描いた要素・文書で決まった機能・`mount` の `commentStore` と `docId`・描いた文書がまだ今のものか・`mount` ごとに記録する、読み込みと保存の関数が無いことを出したか
    returns:
      type: PartsHandle
      description: 付けた部品を削除する関数と、付けたコメントを再読み込みする・マーカーへ移る関数
    process: |-
      1. `features.views` がオンで `root` に `div.mdmark-view` があれば `loadPartModule("view")` を待ち、`isCurrent()` で削除していなければ、`div.mdmark-view` ごとに `attachView` を呼んで削除する関数を記録する
      2. `features.comments` がオンで `commentStore` と `docId` があれば `loadPartModule("comments")` を待ち、`isCurrent()` で削除していなければ `attachComments({ root, store: commentStore, docId, reveal: openEnclosing, margin: true })` を待って `CommentsController` を記録する（待つ間に削除したら、得た `detach` をすぐ呼ぶ）。この待ちの Promise（読み込めない・削除したときは `undefined` で解決する）も記録する。`features.comments` がオンで `commentStore` を指定していなければ、モジュールを読み込まず、コメントの機能に読み込みと保存の関数が要ることを `console.error` に出す（`mount` ごとに 1 回。`mount` が指定する `warned` で記録する）
      3. `features.map` がオンで `root` に `div.mdmark-map` があれば `loadPartModule("map")` を待ち、`isCurrent()` で削除していなければ `attachMap(root, config)` を呼んで削除する関数を記録する
      4. 読み込めないときは付けずに、部品の名前（`view`・`comments`・`map`）・URL・元のエラーを `console.error` に 1 回出す（ページの中で部品ごとに 1 回）。ビューのマーカーの場所は `render` の表のまま残す
      5. `reloadComments` は、コメントの待ちの Promise を記録していなければ解決した Promise を返却する。記録していれば待ち、`CommentsController` を得て削除していなければその `reload()` を返却し、それ以外は解決する。`focusComment(id)` は、`CommentsController` を記録していて削除していなければその `focus(id)` を呼ぶ
      6. `detach` は、削除したマーカーを起動し、記録した削除する関数を逆の順に呼ぶ。続けて `root` の中の要素ごとに、`mountedViews`・`mountedComments` に残っている戻り値の `destroy` を呼ぶ（拡張の `draw` から呼んだ `mountView`・`mountComments` を、`mount` の `update`・`destroy` で片付ける）
    unit_tests:
      - name: test_attach_parts
        case: 正常
        summary: ビューのマーカーごとに attachView を呼ぶ
        condition: '`div.mdmark-view` 2 つを持つ `root`、`views: true`'
        mock: '`importModule` は呼ばれた要素を記録する `attachView` を返却する'
        expected: '`attachView` が 2 回呼ばれ、削除する関数で両方の削除する関数が呼ばれる'
      - name: test_attach_parts_when_no_marks
        case: 正常
        summary: マーカーも機能も無ければモジュールを読み込まない
        condition: 'ビューのマーカーの無い `root`、`comments: false`'
        mock: '`importModule` は呼ばれたかを記録する'
        expected: '`importModule` が呼ばれない'
      - name: test_attach_parts_when_comments_without_store
        case: 正常
        summary: comments がオンでも読み込みと保存の関数が無ければ読み込まず、console.error に 1 回だけ出す
        condition: '`comments: true`、`commentStore` を指定せず、同じ `warned` で 2 回呼ぶ'
        mock: '`importModule` は呼ばれたかを記録する。`console.error` を記録する'
        expected: '`importModule` が呼ばれない。`console.error` が 1 回だけ呼ばれる'
      - name: test_attach_parts_when_detached_while_loading
        case: 正常
        summary: 読み込みを待つ間に削除すると付けない
        condition: 読み込みを合図まで待たせ、削除する関数を呼んでから返却する
        mock: 合図で返却する `importModule`
        expected: '`attachView` が呼ばれない'
      - name: test_attach_parts_when_module_unavailable
        case: 異常
        summary: 読み込めないと表を残して console.error に 1 回出す
        condition: '`div.mdmark-view` 2 つ'
        mock: '`importModule` は reject する。`console.error` を記録する'
        expected: '`root` の中は変わらない。`console.error` が `view` と URL で 1 回だけ呼ばれる'
      - name: test_attach_parts_when_parts_mounted_inside
        case: 正常
        summary: 削除する関数で root の中に mountView・mountComments で付けた部品も片付ける
        condition: '`root` の中の要素 1 つに `mountView`、別の要素に `mountComments` を呼び、解決してから `attachParts` の削除する関数を呼ぶ。`root` の外の要素にも `mountView` を呼ぶ'
        mock: '`importModule` は、呼ばれた回数を記録する削除する関数を返却する `drawView`・`attachComments` を持つモジュールを返却する'
        expected: '`root` の中の 2 つの削除する関数が 1 回ずつ呼ばれ、`root` の外のビューの削除する関数は呼ばれない'
      - name: test_attach_parts_when_comments_reloaded
        case: 正常
        summary: reloadComments と focusComment を付けたコメントに任せる
        condition: '`comments: true`・`commentStore`・`docId` で呼び、`reloadComments()` と `focusComment("c1")` を呼ぶ'
        mock: '`importModule` は、引数を記録し、`reload`・`focus` の呼び出しを記録する `CommentsController` で解決する `attachComments` を持つモジュールを返却する'
        expected: '`attachComments` の引数の `reveal` が `openEnclosing`。`reload` が 1 回呼ばれて `reloadComments()` が解決し、`focus` が `c1` で 1 回呼ばれる'
      - name: test_attach_parts_when_comments_reload_disabled
        case: 正常
        summary: コメントを付けていないとき・読み込めないときは load を呼ばずに解決する
        condition: '`comments: false` で呼んだ戻り値と、`importModule` が reject するときの戻り値の `reloadComments()`'
        mock: '`importModule` は呼ばれたかを記録するか reject する。`console.error` を記録する'
        expected: どちらも解決し、1 つ目は `importModule` が呼ばれない
      - name: test_attach_parts_when_comments_reload_after_detach
        case: 正常
        summary: 削除した後の reloadComments は reload を呼ばずに解決する
        condition: '`attachComments` の解決の前に `detach` を呼び、その後に `reloadComments()`'
        mock: 合図で解決する `attachComments`
        expected: '`reloadComments()` が解決し、`reload` は呼ばれず、得た `detach` が 1 回呼ばれる'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#exceptions[なし（ビュー・コメントの部品のモジュールを読み込めない）]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[コメントの再読み込み]
