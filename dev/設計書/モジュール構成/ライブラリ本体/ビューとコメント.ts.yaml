        expected: 段落の文字だけをつないだ文字
  - name: locateComments
    title: コメントの箇所を探す
    container: src/comments/anchor.ts
    summary: 本文の文字の中で、コメントごとに箇所を探し、同じ箇所のコメントをまとめ、見つからないものを分ける
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ text: string; comments: MdmarkComment[] }'
        required: true
        description: 本文の文字と読んだコメント
    returns:
      type: '{ anchors: Array<{ start: number; end: number; comments: MdmarkComment[] }>; orphans: MdmarkComment[] }'
      description: 箇所の並び（始まりの順）と見つからないコメント
    process: |-
      1. `prefix + quote + suffix` が一致する最初の位置があれば、`quote` の始まりと終わりを箇所にする
      2. 無ければ `quote` が 1 か所だけ一致すればそこを箇所にし、0 か所か 2 か所以上なら見つからないコメントにする
      3. 始まりと終わりが同じ箇所はまとめ（保存の順を保つ）、ほかの箇所と重なる箇所は見つからないコメントにする
    unit_tests:
      - name: test_locate_comments
        case: 正常
        summary: 前後の文字で箇所を決める
        condition: '`手順` が 2 か所ある本文と、2 か所目の前後の文字を持つコメント'
        mock: なし
        expected: 2 か所目の位置
      - name: test_locate_comments_when_context_changed
        case: 正常
        summary: 前後が変わっても 1 か所だけなら付く
        condition: '`prefix` が合わず、`quote` が 1 か所だけある'
        mock: なし
        expected: その位置
      - name: test_locate_comments_when_ambiguous
        case: 正常
        summary: 前後が合わず 2 か所あると見つからないにする
        condition: '`prefix` が合わず、`quote` が 2 か所ある'
        mock: なし
        expected: '`orphans` に入る'
      - name: test_locate_comments_when_same_place
        case: 正常
        summary: 同じ箇所のコメントをまとめる
        condition: 同じ `quote`・`prefix`・`suffix` のコメント 2 つ
        mock: なし
        expected: 箇所が 1 つで `comments` が 2 つ
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[コメントの箇所]
  - name: attachComments
    title: コメントを付ける
    container: src/comments/index.ts
    summary: 読んだコメントに印を付け、文字の選び・ボタン・入力欄・吹き出しの操作を付け、外す関数を返す
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`root` の中の文字を印で包み、ボタン・一覧を置き、`document` と `window` に受け取りを付ける。`store.load`・`store.save` を呼ぶ'
    args:
      - name: options
        type: '{ root: HTMLElement; store: MdmarkCommentStore; docId: string }'
        required: true
        description: 範囲の要素・読み書きの関数・対象の ID
    returns:
      type: Promise<() => void>
      description: 印を外して文字を元に戻し、置いた要素と受け取りを外す関数
    process: |-
      1. `store.load({ docId })` を待つ。reject するか、配列でないか `isComment` でない要素があれば、`load`・`docId`・元のエラーか合わなかった値を `console.error` に出し、コメントを空にする
      2. `commentText(root)` と `locateComments` で箇所を探し、箇所ごとに文字の節を分けて `renderCommentMark` の形の `mark` で包み、付いたコメントを控える。見つからないコメントがあれば `root` の末尾に `renderCommentOrphans` を置く。読み上げの説明 `コメントが付いた箇所` を `document.body` に 1 つ置く
      3. `selectionchange` を受け、選びの始まりと終わりが `root` の中の同じ `COMMENT_BLOCKS` に入り、`COMMENT_EXCLUDED` に入らず、文字が空白だけでないときに、`renderCommentButton` をそのブロックの直後に置き、選んだ文字の終わりの下（収まらなければ上）に置く。条件を外れたらボタンを隠す（フォーカス中は隠さない）
      4. ボタンを押すと、`renderCommentForm` の入力欄を `document.body` に置いて選んだ範囲の下に置き、本文の欄へフォーカスを移し、`CSS.highlights` があれば範囲を `PENDING_HIGHLIGHT` に入れる
      5. 保存のボタンで、本文が空なら `state: empty` の知らせを出す。空でなければ `state: saving` にして `store.save({ docId, comment: draftFromRange(...) })` を待つ。reject するか `isComment` でなければ `save`・`docId`・元のエラーを `console.error` に出して `state: failed` にし、本文を残す。保存できたら入力欄を閉じ、範囲を印で包んで印へフォーカスを移す
      6. キャンセルと Esc で入力欄を閉じる。本文があれば `window.confirm(DISCARD_MESSAGE)` で確かめ、捨てないときは残す。閉じたらボタンへフォーカスを戻す。外側の押下では閉じない
      7. 印の押下・Enter・Space で `renderCommentBubble` の吹き出しを開いて印の `aria-expanded` を `true` にし、吹き出しへフォーカスを移す。閉じるボタンと Esc で閉じて印へフォーカスを戻し、外側の押下でも閉じる
      8. `scroll`（捕捉）と `resize` で、開いている枠かボタンを元の箇所に付いていかせる
      9. 外す関数は、受け取りを外し、置いた要素と `PENDING_HIGHLIGHT` を消し、印を中の文字の節に戻して `normalize` する
    unit_tests:
      - name: test_attach_comments_when_loaded
        case: 正常
        summary: 読んだコメントに印を付け、見つからないものを一覧に出す
        condition: '`導入の手順` を持つ段落。`load` が `quote` が `導入の手順` と `無い文字` の 2 件を返す'
        mock: '`store` はメモリーで返す'
        expected: '`導入の手順` が `mark.mdmark-comment-mark` に包まれ、末尾の一覧に `無い文字` がある'
      - name: test_attach_comments_when_saved
        case: 正常
        summary: 選んで書いて保存すると印を付ける
        condition: 段落の `導入の手順` を選び、ボタン・本文 `手順の数を <b>3</b> にする`・保存を押す
        mock: '`save` は下書きに `id: "c1"` を足して返し、引数を控える'
        expected: '`save` が `docId` と `quote`・`prefix`・`suffix`・`body` で呼ばれる。入力欄が無く、印にフォーカスがある。印を押すと吹き出しに本文が文字のまま出る'
      - name: test_attach_comments_when_empty_body
        case: 異常
        summary: 空のまま保存すると知らせを出して save を呼ばない
        condition: 本文を書かずに保存を押す
        mock: '`save` は呼ばれたかを控える'
        expected: '`コメントを書いてから保存してください。` が出て、`save` は呼ばれない'
      - name: test_attach_comments_when_save_rejected
        case: 異常
        summary: 保存できないと本文を残して知らせる
        condition: 本文を書いて保存を押す
        mock: '`save` は reject する。`console.error` を控える'
        expected: 入力欄と本文が残り、`role="alert"` に失敗の知らせ。`console.error` に `save` と `docId`
      - name: test_attach_comments_when_load_rejected
        case: 異常
        summary: 読めないと印を付けずに新しいコメントは付けられる
        condition: '`load` が reject する'
        mock: '`console.error` を控える'
        expected: 印が無く、`console.error` に `load`。文字を選ぶとボタンが出る
      - name: test_attach_comments_when_discarding
        case: 正常
        summary: 本文があるときの Esc で確かめ、捨てないと残す
        condition: 本文を書いて Esc を押す
        mock: '`window.confirm` は `false` を返す'
        expected: '`window.confirm` が `書いたコメントを捨てて閉じますか？` で呼ばれ、入力欄が残る'
      - name: test_attach_comments_when_excluded
        case: 正常
        summary: コードとビューの操作の中の選びにはボタンを出さない
        condition: '`code` の中の文字を選ぶ'
        mock: なし
        expected: ボタンが `hidden`
      - name: test_attach_comments_when_detached
        case: 正常
        summary: 外すと文字を元の並びに戻す
        condition: 印を付けた後に外す関数を呼ぶ
        mock: なし
        expected: '`root` の `innerHTML` が付ける前と同じで、ボタン・一覧・説明が無い'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[コメントの操作]
      - dev/設計書/インターフェース定義/ライブラリ本体/コメントを付ける.ts#
      - dev/設計書/画面設計/文書.ts#
  - name: placePopover
    title: 枠を箇所に置く
    container: src/comments/index.ts
    summary: 枠を箇所の下に置き、下に収まらなければ上に置き、左右は画面の中に収める
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ element: HTMLElement; rect: DOMRect }'
        required: true
        description: 置く枠と箇所の矩形
    returns:
      type: void
      description: '-'
    process: |-
      1. 左は `rect.left` を `POPOVER_GUTTER_PX` と画面の幅から枠の幅と `POPOVER_GUTTER_PX` を引いた値の間に収める
      2. 上は `rect.bottom + POPOVER_GAP_PX`。枠の下端が画面の高さから `POPOVER_GUTTER_PX` を引いた値を超えるなら `rect.top - 枠の高さ - POPOVER_GAP_PX`（`POPOVER_GUTTER_PX` 未満にしない）
    unit_tests:
      - name: test_place_popover_when_no_room_below
        case: 正常
        summary: 下に収まらなければ上に置く
        condition: 画面の下端近くの矩形
        mock: なし
        expected: '`top` が矩形の上端より上'
  - name: renderCommentButton
    title: コメントのボタンの HTML
    container: src/parts/comment.ts
