  - name: attachCommentActions
    title: コメントを修正・削除する
    container: src/comments/bubble.ts
    summary: 開いた吹き出しのコメントごとの「編集」「削除」に、入力欄・削除の確認と `store.update`・`store.remove` の呼び出しを付ける
    kind: 関数
    scope: internal
    side_effects: '吹き出しの中の `li` を書き換え、`store.update`・`store.remove` を呼ぶ'
    args:
      - name: options
        type: '{ bubble: HTMLElement; store: MdmarkCommentStore; docId: string; isActive: () => boolean; onUpdated: (id: string, body: string) => void; onRemoved: (id: string) => boolean }'
        required: true
        description: '`renderCommentBubble` で開いた吹き出し・読み込みと保存の関数・対象の ID・付けたコメントがまだ削除されていないか・修正できたときと削除できたときに `attachComments` へ通知する関数（`onRemoved` は同じマーカーにコメントが残るかを返却する）'
    returns:
      type: '{ cancel: () => boolean }'
      description: '開いている入力欄か削除の確認を閉じる関数。閉じたか、修正・削除を待っているなら真、どちらも開いていなければ偽を返却する'
    process: |-
      1. 吹き出しの押下を受け、押したボタンの `data-action` と `li` の `data-comment-id` で振り分ける。入力欄と削除の確認は吹き出しの中で同時に 1 つだけ開く（開くときは開いている方を閉じる）
      2. 「編集」は、その `li` を `renderCommentItem` の入力欄（`draft` は今の本文、`state: idle`）に替え、本文の欄へフォーカスを移す
      3. 入力欄の「保存」は、本文の前後の空白を落として空なら `state: empty` にして本文の欄へフォーカスを移す。空でなければ `state: saving` にして `store.update({ docId, id, body })` を待つ。待つ間に `isActive()` が偽になれば何もしない。reject したら `update`・`docId`・`id`・元のエラーを `console.error` に出し、吹き出しが残っていれば `state: failed` にして本文の欄へフォーカスを移す。解決したら `onUpdated(id, body)` を呼び、吹き出しが残っていれば `li` を書き換えた本文の表示に替えて「編集」へフォーカスを移す
      4. 入力欄の「キャンセル」と `cancel()` は、`li` を書き換える前の本文の表示に戻して「編集」へフォーカスを移す
      5. 「削除」は、その `li` を `renderCommentItem` の削除の確認（`state: idle`）に替え、確認の「キャンセル」へフォーカスを移す
      6. 確認の「削除」は、`state: removing` にして `store.remove({ docId, id })` を待つ。待つ間に `isActive()` が偽になれば何もしない。reject したら `remove`・`docId`・`id`・元のエラーを `console.error` に出し、吹き出しが残っていれば `state: failed` にする（確認は開いたまま）。解決したら `onRemoved(id)` を呼び、真が返って吹き出しが残っていれば `li` を除き、次の `li`（無ければ前の `li`）の最初のボタンへフォーカスを移す
      7. 確認の「キャンセル」と `cancel()` は、`li` を本文の表示に戻して「削除」へフォーカスを移す
      8. `cancel()` は、保存か削除を待っている間は何もせずに真を返却する
    unit_tests:
      - name: test_attach_comment_actions_when_edited
        case: 正常
        summary: 編集して保存すると update を呼び、書き換えた本文を出して編集へフォーカスを戻す
        condition: 2 件の吹き出しで 1 件目の「編集」を押し、本文を `修正した本文` にして「保存」を押す
        mock: '`update` は引数を記録して解決する。`onUpdated` は引数を記録する'
        expected: '押した後に本文の欄にフォーカスがあり今の本文が入っている。保存の後は `update` が `{ docId, id, body: "修正した本文" }` で呼ばれ、`onUpdated` が同じ `id` と本文で呼ばれ、1 件目の本文が `修正した本文` で、1 件目の「編集」にフォーカスがある'
      - name: test_attach_comment_actions_when_edit_empty
        case: 異常
        summary: 本文を空にして保存すると通知を出して update を呼ばない
        condition: 「編集」を押し、本文を空にして「保存」を押す
        mock: '`update` は呼ばれたかを記録する'
        expected: '`コメントを記載してから保存してください。` が出て、本文の欄が `aria-invalid="true"`。`update` は呼ばれない'
      - name: test_attach_comment_actions_when_update_rejected
        case: 異常
        summary: 修正できないと入力欄と本文を残して通知する
        condition: 「編集」を押し、本文を書き換えて「保存」を押す
        mock: '`update` は reject する。`console.error` を記録する'
        expected: 入力欄と書き換えた本文が残り、`role="alert"` に `コメントを保存できませんでした。記載したコメントは残っています。もう一度「保存」を押してください。`。`console.error` に `update`・`docId`・`id`。`onUpdated` は呼ばれない
      - name: test_attach_comment_actions_when_edit_cancelled
        case: 正常
        summary: キャンセルと cancel() で書き換える前の本文に戻して編集へフォーカスを戻す
        condition: 「編集」を押して本文を書き換えて「キャンセル」を押す。もう一度「編集」を押して `cancel()` を呼ぶ
        mock: なし
        expected: どちらも元の本文が出て「編集」にフォーカスがあり、`cancel()` は `true` を返却する。何も開いていないときの `cancel()` は `false`
      - name: test_attach_comment_actions_when_removed
        case: 正常
        summary: 削除を確認してから remove を呼び、残ったコメントのボタンへフォーカスを移す
        condition: 2 件の吹き出しで 1 件目の「削除」を押し、確認の「削除」を押す
        mock: '`remove` は引数を記録して解決する。`onRemoved` は `true` を返却する'
        expected: 「削除」の後に `このコメントを削除しますか? 削除すると元に戻せません。` と確認の「キャンセル」へのフォーカスがあり、`remove` はまだ呼ばれない。確認の「削除」の後は `remove` が `{ docId, id }` で呼ばれ、`li` が 1 つで、その「編集」にフォーカスがある
      - name: test_attach_comment_actions_when_remove_cancelled
        case: 正常
        summary: 確認のキャンセルと cancel() では remove を呼ばずに削除へフォーカスを戻す
        condition: 「削除」を押して確認の「キャンセル」を押す。もう一度「削除」を押して `cancel()` を呼ぶ
        mock: '`remove` は呼ばれたかを記録する'
        expected: どちらも確認が無く、その「削除」にフォーカスがある。`remove` は呼ばれない
      - name: test_attach_comment_actions_when_remove_rejected
        case: 異常
        summary: 削除できないと確認を開いたまま通知する
        condition: 「削除」と確認の「削除」を押す
        mock: '`remove` は reject する。`console.error` を記録する'
        expected: 確認とコメントが残り、`role="alert"` に `コメントを削除できませんでした。もう一度「削除」を押してください。`。`console.error` に `remove`・`docId`・`id`。`onRemoved` は呼ばれない
      - name: test_attach_comment_actions_when_inactive
        case: 正常
        summary: 待つ間に削除されたら結果を描かない
        condition: '`update` を待たせたまま `isActive` を偽にしてから解決する'
        mock: 合図で解決する `update`
        expected: '`onUpdated` が呼ばれず、入力欄が `saving` のまま'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[コメントの修正と削除]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#exceptions[なし（コメントを修正・削除できない）]
      - dev/設計書/部品設計/コメントの吹き出し.ts#
    status: planned
    introduced:
      pr: 280
  - name: attachMarginMarkers
    title: 余白のマーカーを付ける
    container: src/comments/margin.ts
    summary: 本文の列の右に余白の列を配置し、マーカーの行の縦の中ほどに余白のマーカーを配置して、押すとマーカーへ移る操作と再配置を付け、削除する関数を返却する
    kind: 関数
    scope: internal
    side_effects: '`content` の直後に余白の列の要素を配置し、`content` の親を `ResizeObserver`、`content` の中を `MutationObserver` で確認する'
    args:
      - name: options
        type: '{ content: HTMLElement }'
        required: true
        description: 本文の列（`div.mdmark-content`）
    returns:
      type: () => void
      description: 余白の列と受け取りを解除する関数
    process: |-
      1. `renderCommentMarker` を入れる `div.mdmark-comment-margin` を `content` の直後に配置する
      2. 再配置は、`content` の中の `mark.mdmark-comment-mark` ごとに、祖先のうち `hidden` を持ついちばん外側の要素を探す。無ければマーカー、あれば `aria-controls` でその要素の ID を指す開くボタンを基準の要素にし、閉じた中の種類（`[role="tabpanel"]` は `tab`・`.mdmark-row-detail` は `row`・それ以外は `section`）を記録する。開くボタンが無いマーカーは除く
      3. 基準の要素の最初の行の矩形（`getClientRects()[0]`）から、余白の列の上端からの上端と高さを測り、`layoutMarkers` で行ごとにまとめた縦の中ほどを得る。まとめた行ごとに、行の最初のマーカーの文字・箇所の数・`aria-expanded="true"` のマーカーを含むか・閉じた中の種類で `renderCommentMarker` を描き、`top` に縦の中ほどを入れて余白の列の中身を置き換える。置き換える前に余白のマーカーにフォーカスがあれば、同じ順番のマーカー（数が減ったときは最後のマーカー）へフォーカスを戻す
      4. マーカーの押下（Enter・Space を含む）で、行の最初のマーカーについて、祖先の `hidden` のいちばん外側の要素の開くボタンを押すことを `MAX_OPEN_DEPTH` 回まで繰り返し、マーカーを `scrollIntoView({ block: "center" })` してからマーカーの `click()` を呼ぶ
      5. `content` の中の子の増減と、`hidden`・`aria-expanded`・`class` の属性の変化（余白の列の中を除く）と、`content` の親の大きさの変化で、`requestAnimationFrame` で 1 フレームに 1 回にまとめて手順 2〜3 をする
      6. 削除する関数は、受け取りと予約したフレームを削除し、余白の列を取り除く
    callees:
      - '#functions[layoutMarkers]'
      - '#functions[renderCommentMarker]'
    unit_tests:
      - name: test_attach_margin_markers
        case: 正常
        summary: マーカーの行の縦の中ほどにマーカーを配置し、押すと吹き出しを開く
        condition: '`div.mdmark-content` の 2 つの段落の文字をマーカーで包み、マーカーの `click` を記録する'
        mock: なし
        expected: '`content` の直後に `div.mdmark-comment-margin` があり、マーカーが 2 つで、それぞれの `top` がマーカーの行の縦の中ほど。1 つ目を押すと 1 つ目のマーカーの `click` が 1 回呼ばれる'
      - name: test_attach_margin_markers_when_closed
        case: 正常
        summary: 閉じた中のマーカーは開くボタンの行に配置し、押すと開いてからマーカーを押す
        condition: '`hidden` を持つセクションの中身の中のマーカーと、`aria-controls` でその中身を指し、押すと `hidden` を削除するボタン'
        mock: なし
        expected: マーカーが `data-closed="section"` を持ち、`top` がボタンの行の縦の中ほど。押すとボタンが押され、マーカーの `click` が呼ばれる
      - name: test_attach_margin_markers_when_no_opener
        case: 正常
        summary: 開くボタンが無い閉じた中のマーカーにはマーカーを配置しない
        condition: '`hidden` を持ち ID の無い要素の中のマーカー'
        mock: なし
        expected: マーカーが無い
      - name: test_attach_margin_markers_when_changed
        case: 正常
        summary: 中の変化で次のフレームにもう一度配置する
        condition: 付けた後に段落を 1 つ追加し、その文字をマーカーで包む
        mock: なし
        expected: 次のフレームでマーカーが 1 つ増える。余白の列の中の書き換えではもう一度配置しない
      - name: test_attach_margin_markers_when_detached
        case: 正常
        summary: 削除すると余白の列を取り除く
        condition: 付けた後に削除する関数を呼び、段落を追加する
        mock: なし
        expected: 余白の列が無く、次のフレームでも配置しない
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[余白のマーカー]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[余白のマーカーから移る]
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[余白のマーカーの再配置]
  - name: layoutMarkers
    title: マーカーの縦の位置を決める
    container: src/comments/margin.ts
    summary: 行の上端と高さの並びから、同じ行をまとめ、重ならないように下げたマーカーの縦の中ほどを返却する
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ lines: Array<{ top: number; height: number }>; markerSize: number }'
        required: true
        description: 箇所ごとの行の上端と高さ（px。並びは問わない）と、マーカーの高さ（px）
    returns:
      type: 'Array<{ center: number; indexes: number[] }>'
      description: 上から順のまとめた行ごとの、マーカーの縦の中ほどと、その行に入る `lines` の添え字
    process: |-
      1. `lines` を上端の順に並べ、直前のまとまりの最初の行との上端の差が `SAME_LINE_PX` 以下なら同じまとまりに入れる
      2. まとまりごとに、最初の行の上端 + 高さ / 2 を縦の中ほどにし、直前のマーカーの縦の中ほど + `markerSize` + `MARKER_GAP_PX` より上なら、その値まで下げる
    unit_tests:
      - name: test_layout_markers
        case: 正常
        summary: 行の縦の中ほどを返却する
        condition: '`lines` が `[{ top: 100, height: 20 }, { top: 0, height: 20 }]`、`markerSize: 24`'
        mock: なし
        expected: '`[{ center: 10, indexes: [1] }, { center: 110, indexes: [0] }]`'
      - name: test_layout_markers_when_same_line
        case: 正常
        summary: 上端の差が 4 以下の行を 1 つにまとめる
        condition: '`lines` が `[{ top: 0, height: 20 }, { top: 3, height: 20 }]`'
        mock: なし
        expected: まとまりが 1 つで `indexes` が `[0, 1]`
      - name: test_layout_markers_when_overlapping
        case: 正常
        summary: 上のマーカーと重なると下げる
        condition: '`lines` が `[{ top: 0, height: 20 }, { top: 20, height: 20 }]`、`markerSize: 24`'
        mock: なし
        expected: 2 つ目の `center` が `38`（10 + 24 + 4）
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[余白のマーカー]
  - name: placePopover
    title: 枠を箇所に配置する
    container: src/comments/index.ts
    summary: 枠を箇所の下に配置し、下に収まらなければ上に配置し、左右は画面の中に収める
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ element: HTMLElement; rect: DOMRect }'
        required: true
        description: 配置する枠と箇所の矩形
    returns:
      type: void
      description: '-'
    process: |-
      1. 左は `rect.left` を `POPOVER_GUTTER_PX` と画面の幅から枠の幅と `POPOVER_GUTTER_PX` を参照した値の間に収める
      2. 上は `rect.bottom + POPOVER_GAP_PX`。枠の下端が画面の高さから `POPOVER_GUTTER_PX` を参照した値を超えるなら `rect.top - 枠の高さ - POPOVER_GAP_PX`（`POPOVER_GUTTER_PX` 未満にしない）
    unit_tests:
      - name: test_place_popover_when_no_room_below
        case: 正常
        summary: 下に収まらなければ上に配置する
        condition: 画面の下端近くの矩形
        mock: なし
        expected: '`top` が矩形の上端より上'
  - name: renderCommentButton
    title: コメントのボタンの HTML
    container: src/parts/comment.ts
    summary: 部品設計『コメントのボタン』の HTML を返却する
    kind: 関数
    scope: public
    returns:
      type: string
      description: '`button.mdmark-comment-add` の HTML'
    process: 1. 部品設計の HTML を返却する
    unit_tests:
      - name: test_render_comment_button
        case: 正常
        summary: 文字とアイコンを持つボタン
        condition: なし
        mock: なし
        expected: '`type="button"` で文字が `コメント`、アイコンが `aria-hidden`'
    refs:
      - dev/設計書/部品設計/コメントのボタン.ts#
  - name: renderCommentForm
    title: コメントの入力欄の HTML
    container: src/parts/comment.ts
    summary: 部品設計『コメントの入力欄』の HTML を返却する
    kind: 関数
    scope: public
    args:
      - name: props
        type: '{ quote: string; body?: string; state?: "idle" | "saving" | "empty" | "failed"; id: string }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`div.mdmark-comment-form` の HTML'
    process: 1. 選んだ文字と本文をエスケープして部品設計の HTML にし、`state` で保存のボタン・通知し・`aria-busy`・`aria-invalid` を記載する（通知は `COMMENT_MESSAGES`）
    unit_tests:
      - name: test_render_comment_form
        case: 正常
        summary: タイトルに選んだ文字をエスケープして出す
        condition: '`quote` が `<b>x</b>`'
        mock: なし
        expected: タイトルが `「&lt;b&gt;x&lt;/b&gt;」へのコメント`、通知が `hidden`
      - name: test_render_comment_form_when_saving
        case: 正常
        summary: 保存を待つ間は押せない
        condition: '`state: "saving"`'
        mock: なし
        expected: 保存のボタンが `disabled` で `保存しています…`、枠が `aria-busy="true"`
      - name: test_render_comment_form_when_failed
        case: 正常
        summary: 保存できない通知と本文を出す
        condition: '`state: "failed"`・`body` あり'
        mock: なし
        expected: 通知が `COMMENT_MESSAGES.failed` で `hidden` を持たず、本文の欄が `aria-invalid="true"` で本文を持つ
    refs:
      - dev/設計書/部品設計/コメントの入力欄.ts#
  - name: renderCommentMark
    title: コメントのマーカーの HTML
    container: src/parts/comment.ts
    summary: 部品設計『コメントのマーカー』の HTML を返却する（ストーリーと単体テスト用。文書のマーカーは `attachComments` が同じ属性で文字のセクションを包む）
    kind: 関数
    scope: public
    args:
      - name: props
        type: '{ text: string; expanded?: boolean; focused?: boolean }'
        required: true
        description: 部品設計の引数
    returns:
      type: string
      description: '`mark.mdmark-comment-mark` の HTML'
    process: 1. 文字をエスケープして部品設計の HTML にする。`focused` なら `data-focused` を付ける
    unit_tests:
      - name: test_render_comment_mark
        case: 正常
        summary: 押せるマーカーの属性を持つ
        condition: '`{ text: "手順" }`'
        mock: なし
        expected: '`tabindex="0"`・`role="button"`・`aria-haspopup="dialog"`・`aria-expanded="false"`。`data-focused` を持たない'
      - name: test_render_comment_mark_when_focused
        case: 正常
        summary: focused なら data-focused を持つ
        condition: '`{ text: "手順", focused: true }`'
        mock: なし
        expected: '`data-focused` を持つ'
    refs:
      - dev/設計書/部品設計/コメントのマーカー.ts#
  - name: renderCommentBubble
    title: コメントの吹き出しの HTML
    container: src/parts/comment.ts
    summary: 部品設計『コメントの吹き出し』の HTML を返却する
    kind: 関数
    scope: public
    args:
      - name: props
        type: '{ quote: string; bodies: string[]; ids?: string[]; canEdit?: boolean; canRemove?: boolean; editIndex?: number; draft?: string; editState?: CommentFormState; confirmIndex?: number; removeState?: CommentRemoveState; id?: string }'
        required: true
        description: 部品設計の引数と、本文の欄の通知を指す `id` の頭（既定 `mdmark-comment-edit`）
    returns:
      type: string
      description: '`div.mdmark-comment-bubble` の HTML'
    process: 1. 選んだ文字をエスケープし、本文ごとに `renderCommentItem` の `li` を配置する（`editIndex` の位置は入力欄、`confirmIndex` の位置は削除の確認）
    unit_tests:
      - name: test_render_comment_bubble
        case: 正常
        summary: 本文を文字のまま並べる
        condition: '`bodies` が `["a", "<b>x</b>"]`'
        mock: なし
        expected: '`li` が 2 つで、2 つ目が `&lt;b&gt;x&lt;/b&gt;`。`mdmark-comment-icon-button` が無い'
      - name: test_render_comment_bubble_when_editable
        case: 正常
        summary: canEdit・canRemove ならコメントごとにアイコンのボタンと id を持つ
        condition: '`bodies` が `["a"]`、`ids` が `["c1"]`、`canEdit`・`canRemove` が `true`'
        mock: なし
        expected: '`li` が `mdmark-comment-item is-icon-actions` で `data-comment-id="c1"`。`aria-label`・`title` が `編集` の `data-action="edit"` と `削除` の `data-action="remove"` のボタンがこの順'
    refs:
      - dev/設計書/部品設計/コメントの吹き出し.ts#
  - name: renderCommentItem
    title: 吹き出しのコメント 1 件の HTML
    container: src/parts/comment.ts
    summary: 吹き出しのコメント 1 件の `li` の HTML を、本文の表示・入力欄・削除の確認のどれかで返却する。`renderCommentBubble` と `attachCommentActions` が使用する
    kind: 関数
    scope: public
    args:
      - name: props
        type: '{ body: string; id?: string; canEdit?: boolean; canRemove?: boolean; edit?: { draft: string; state: CommentFormState; fieldId: string }; confirm?: { state: CommentRemoveState } }'
        required: true
        description: 本文・コメントの `id`・配置するボタン、入力欄の本文の欄の文字と状態と通知を指す `id`、削除の確認の状態（`CommentRemoveState` は `idle`・`removing`・`failed` の型で、`src/parts/comment.ts` が export する）
    returns:
      type: string
      description: '`li` の HTML'
    process: |-
      1. `edit` があれば、本文の欄（`label` の `コメント`、`aria-describedby` で通知を指す）・通知し（`role="alert"`、`state` が `empty` なら `COMMENT_MESSAGES.empty`、`failed` なら `COMMENT_MESSAGES.updateFailed`。それ以外は `hidden`）・「キャンセル」「保存」（`saving` なら `disabled` で `保存しています…`）を配置する
      2. `confirm` があれば、本文の下に `COMMENT_MESSAGES.removeConfirm` と「キャンセル」「削除」（`mdmark-comment-button is-danger`。`removing` なら `disabled` で `削除しています…`）を配置し、`failed` なら確認の上に `COMMENT_MESSAGES.removeFailed` を `role="alert"` で配置する。本文の右上のボタンは配置しない
      3. どちらも無ければ本文を配置し、`canEdit`・`canRemove` のどちらかなら `mdmark-comment-item is-icon-actions` にして本文の右上に `pencil`・`trash-2` のアイコンのボタン（`aria-label`・`title` が `編集`・`削除`）を持つ関数の分だけ配置する
      4. `id` があれば `data-comment-id` に入れる。本文と下書きはエスケープする
    unit_tests:
      - name: test_render_comment_item_when_editing
        case: 正常
        summary: 入力欄の状態ごとに通知と保存のボタンを変える
        condition: '`edit` の `state` を `idle`・`saving`・`empty`・`failed` にし、`draft` に `<b>x</b>` を指定する'
        mock: なし
        expected: '`textarea` の中身が `&lt;b&gt;x&lt;/b&gt;`。`idle` は通知が `hidden`、`saving` は保存のボタンが `disabled` で `保存しています…`、`empty`・`failed` は本文の欄が `aria-invalid="true"` でそれぞれの通知'
      - name: test_render_comment_item_when_confirming
        case: 正常
        summary: 削除の確認の状態ごとに通知と削除のボタンを変える
        condition: '`confirm` の `state` を `idle`・`removing`・`failed` にする'
        mock: なし
        expected: どれも `このコメントを削除しますか? 削除すると元に戻せません。` と `is-danger` のボタンがあり、アイコンのボタンが無い。`removing` は削除のボタンが `disabled` で `削除しています…`、`failed` は `role="alert"` に `コメントを削除できませんでした。もう一度「削除」を押してください。`
      - name: test_render_comment_item_when_remove_only
        case: 正常
        summary: canRemove だけなら削除のボタンだけを配置する
        condition: '`canRemove` だけ `true`'
        mock: なし
        expected: '`data-action="remove"` のボタンだけがある'
    refs:
      - dev/設計書/部品設計/コメントの吹き出し.ts#
    status: planned
    introduced:
      pr: 280
