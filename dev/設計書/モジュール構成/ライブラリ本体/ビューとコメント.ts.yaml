title: "ライブラリ本体 / ビューとコメント"
lead: ビューとコメントの部品を `dist/index.js` と別の配布ファイル（`dist/view.js`・`dist/comments.js`）に分け、印のある文書と `mountView`・`mountComments` を呼んだときにだけ読む処理と、その部品の HTML。ブラウザでだけ動く（部品の HTML と箇所の探し方は Node でも動く）。
directory: |-
  ```tree
  src/
  ├── part-modules.ts      # 部品のモジュールのファイル名・URL の差し替え・1 回だけ読む loadPartModule（dist/index.js）
  ├── mount-parts.ts       # 公開関数 mountView・mountComments と、mount が呼ぶ attachParts（dist/index.js）
  ├── views/
  │   ├── spec.ts          # 公開の型 MdmarkViewOptions・MdmarkViewHandle、使えるアイコンと既定の対応、引数の検査（dist/index.js）
  │   └── index.ts         # dist/view.js の入口。drawView・attachView
  ├── comments/
  │   ├── spec.ts          # 公開の型 MdmarkComment・MdmarkCommentDraft・MdmarkCommentStore・MdmarkCommentsHandle、引数とコメントの形の検査（dist/index.js）
  │   ├── anchor.ts        # 選んだ範囲から下書きを作る・本文の文字から箇所を探す（dist/comments.js）
  │   └── index.ts         # dist/comments.js の入口。attachComments
  └── parts/
      ├── view.ts          # ビューの HTML とアイコンの形（dist/view.js）
      └── comment.ts       # コメントのボタン・入力欄・印・吹き出し・箇所が見つからないコメントの一覧の HTML（dist/comments.js）
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction LR
        class 部品のモジュールを読む
        class ビューを描く公開関数
        class コメントを付ける公開関数
        class 描いた文書に部品を付ける
        class ビューの引数を検める
        class コメントの引数を検める
        class ビューを描く
        class 印のビューに付ける
        class コメントを付ける
        class 選んだ範囲から下書きを作る
        class コメントの箇所を探す
        class 部品のHTML
        ビューを描く公開関数 --> ビューの引数を検める : 同期で検める
        ビューを描く公開関数 --> 部品のモジュールを読む : view
        コメントを付ける公開関数 --> コメントの引数を検める : 同期で検める
        コメントを付ける公開関数 --> 部品のモジュールを読む : comments
        描いた文書に部品を付ける --> 部品のモジュールを読む : 印と機能があるときだけ
        部品のモジュールを読む ..> ビューを描く : dist/view.js
        部品のモジュールを読む ..> 印のビューに付ける : dist/view.js
        部品のモジュールを読む ..> コメントを付ける : dist/comments.js
        コメントを付ける --> コメントの箇所を探す : 読んだコメント
        コメントを付ける --> 選んだ範囲から下書きを作る : 保存するとき
        ビューを描く --> 部品のHTML
        印のビューに付ける --> 部品のHTML
        コメントを付ける --> 部品のHTML
data_models:
  - name: MdmarkViewOptions
    title: ビューの引数
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` に渡す項目と表示の指定'
    properties:
      - name: columns
        type: string[]
        description: 列名。表形式の列の並びと、ボードの項目に出す値の並び
      - name: items
        type: Record<string, string>[]
        description: 列名をキーにした項目の値。並びは表の行の順
      - name: group
        type: string | undefined
        description: ボードで列に分ける列名
      - name: default
        type: '"board" | "table" | undefined'
        description: 描いた直後に出すビュー
      - name: filter
        type: Record<string, FilterKind> | undefined
        description: 表形式で絞り込みを付ける列と種類（`FilterKind` は `src/table-logic.ts`）
      - name: icons
        type: Record<string, ViewIconName> | undefined
        description: ボードの列の見出しの値からアイコンの名前を引く対応。`DEFAULT_VALUE_ICONS` に重ねる
  - name: MdmarkViewHandle
    title: ビューの片付け
    container: src/views/spec.ts
    role: 公開の型
    summary: '`mountView` の Promise の値'
    properties:
      - name: destroy
        type: () => void
        description: '`el` の中を空にし、ビューの操作と `document` の受け取りを外す。2 回目以降は何もしない'
  - name: ViewSpec
    title: 印のビューの指定
    container: src/views/spec.ts
    role: DTO
    summary: '`render` が `div.mdmark-view` の `data-view` に JSON で書き、`attachView` が読む指定'
    properties:
      - name: group
        type: number | null
        description: ボードで分ける列の位置。`group=` が無いか表に無ければ `null`
      - name: mode
        type: '"board" | "table"'
        description: 描いた直後に出すビュー
      - name: boardDisabled
        type: string
        description: '`group=` の列が表に無いときの書き方の警告の `id`。それ以外は空'
      - name: icons
        type: Record<string, ViewIconName>
        description: '`icons=` の読めた対応'
  - name: MdmarkCommentDraft
    title: コメントの下書き
    container: src/comments/spec.ts
    role: 公開の型
    summary: '`save` に渡す、まだ `id` の無いコメント'
    properties:
      - name: quote
        type: string
        description: 選んだ文字（前後の空白を落とす）
      - name: prefix
        type: string
        description: 選んだ文字の直前の本文の文字。`CONTEXT_CHARS` 文字まで
      - name: suffix
        type: string
        description: 選んだ文字の直後の本文の文字。`CONTEXT_CHARS` 文字まで
      - name: body
        type: string
        description: コメントの本文（前後の空白を落とす）
  - name: MdmarkComment
    title: コメント
    container: src/comments/spec.ts
    role: 公開の型
    summary: 保存したコメント。`MdmarkCommentDraft` に `id` を足したもの
    inherits: MdmarkCommentDraft
    properties:
      - name: id
        type: string
        description: 保存先が付けた ID
  - name: MdmarkCommentStore
    title: コメントの読み書きの関数
    container: src/comments/spec.ts
    role: 公開の型
    summary: 使う側が書く、コメントの読み込みと保存
    properties:
      - name: load
        type: '(target: { docId: string }) => Promise<MdmarkComment[]>'
        description: 対象のコメントを返す
      - name: save
        type: '(target: { docId: string; comment: MdmarkCommentDraft }) => Promise<MdmarkComment>'
        description: 下書きを保存し、`id` を付けたコメントを返す
  - name: MdmarkCommentsHandle
    title: コメントの片付け
    container: src/comments/spec.ts
    role: 公開の型
    summary: '`mountComments` の Promise の値'
    properties:
      - name: destroy
        type: () => void
        description: 印を外して文字を元の並びに戻し、ボタン・入力欄・吹き出し・一覧と `document` の受け取りを外す。2 回目以降は何もしない
  - name: ViewPartModule
    title: ビューの部品のモジュール
    container: src/views/index.ts
    role: モジュールの形
    summary: '`dist/view.js` が export する関数'
    properties:
      - name: drawView
        type: '(el: HTMLElement, opts: MdmarkViewOptions) => () => void'
        description: '`mountView` が呼ぶ'
      - name: attachView
        type: '(view: HTMLElement) => () => void'
        description: '`mount` が描いた `div.mdmark-view` ごとに呼ぶ'
  - name: CommentsPartModule
    title: コメントの部品のモジュール
    container: src/comments/index.ts
    role: モジュールの形
    summary: '`dist/comments.js` が export する関数'
    properties:
      - name: attachComments
        type: '(options: { root: HTMLElement; store: MdmarkCommentStore; docId: string }) => Promise<() => void>'
        description: '`mountComments` と `mount` が呼ぶ'
constants:
  - name: PART_MODULE_FILES
    title: 部品のモジュールのファイル名
    container: src/part-modules.ts
    summary: 部品の名前から、`dist/index.js` の隣に置く配布ファイルの名前を引く
    value: '{ view: "view.js", comments: "comments.js" }'
  - name: partModuleUrls
    title: 部品のモジュールの URL の差し替え
    container: src/part-modules.ts
    summary: 書き出した HTML の起動の処理が、埋めたコードの `blob:` URL を入れる。無い名前は `PART_MODULE_FILES` を `import.meta.url` から解決する
    value: new Map<PartName, string>()
  - name: partModules
    title: 読んだ部品のモジュール
    container: src/part-modules.ts
    summary: 部品の名前から読み込みの Promise を引く。ページの中で 1 回だけ読む（失敗も控え、読み直さない）
    value: new Map<PartName, Promise<unknown>>()
  - name: VIEW_ICON_NAMES
    title: 使えるアイコン
    container: src/views/spec.ts
    summary: ボードの列の見出しに使える lucide のアイコンの名前
    value: '["circle", "circle-dashed", "circle-dot", "circle-pause", "circle-check", "circle-x", "inbox", "archive", "clock", "flag", "star", "bug", "eye", "lock", "zap", "ban"]'
  - name: DEFAULT_VALUE_ICONS
    title: 値の既定のアイコン
    container: src/views/spec.ts
    summary: ボードの列の値から既定のアイコンを引く。無い値は `FALLBACK_VALUE_ICON`
    value: '{ 未着手: "circle-dashed", 進行中: "circle-dot", 保留: "circle-pause", 完了: "circle-check", 中止: "circle-x" }'
  - name: FALLBACK_VALUE_ICON
    title: 対応に無い値のアイコン
    container: src/views/spec.ts
    value: '"circle"'
    summary: 既定の対応にも `icons` にも無い値のアイコン
  - name: VIEW_ICON_PATHS
    title: アイコンの形
    container: src/parts/view.ts
    summary: '`VIEW_ICON_NAMES` と切り替えの `board`・`table` の、24 の格子の lucide の SVG の中身'
    value: "{ circle: '<circle cx=\"12\" cy=\"12\" r=\"10\"/>', … }"
  - name: CONTEXT_CHARS
    title: 前後の文字の数
    container: src/comments/anchor.ts
    summary: 下書きの `prefix`・`suffix` に取る文字の上限
    value: '32'
  - name: COMMENT_BLOCKS
    title: コメントを付けられるブロック
    container: src/comments/index.ts
    summary: 選んだ文字の始まりと終わりが同じ 1 つに入っていればボタンを出すブロック
    value: '"p, li, td, th, h1, h2, h3, h4, h5, h6, blockquote"'
  - name: COMMENT_EXCLUDED
    title: コメントを付けない場所
    container: src/comments/index.ts
    summary: この中の選びにはボタンを出さず、箇所を探す本文の文字にも数えない
    value: '"input, textarea, pre, code, .mdmark-view-switch, .mdmark-view-board, .mdmark-filter-drawer, .mdmark-comment-mark, .mdmark-comment-popover, .mdmark-comment-add, .mdmark-comment-orphans"'
  - name: PENDING_HIGHLIGHT
    title: 選んだ箇所の色の名前
    container: src/comments/index.ts
    summary: 入力欄を開いている間の選んだ文字に当てる Custom Highlight の名前（CSS の `::highlight()` と揃える）
    value: '"mdmark-comment-pending"'
  - name: DISCARD_MESSAGE
    title: 捨てる確かめの文
    container: src/comments/index.ts
    summary: 本文がある入力欄を閉じるときの `window.confirm` の文
    value: '"書いたコメントを捨てて閉じますか？"'
  - name: POPOVER_GAP_PX
    title: 箇所と枠の隙間
    container: src/comments/index.ts
    summary: ボタン・入力欄・吹き出しを箇所から離す幅
    value: '6'
  - name: POPOVER_GUTTER_PX
    title: 画面の端からの幅
    container: src/comments/index.ts
    summary: ボタン・入力欄・吹き出しを画面の端から離す幅
    value: '8'
  - name: COMMENT_MESSAGES
    title: 入力欄の知らせ
    container: src/parts/comment.ts
    summary: 部品設計『コメントの入力欄』の `empty`・`failed` の知らせ
    value: '{ empty: "コメントを書いてから保存してください。", failed: "コメントを保存できませんでした。書いたコメントは残っています。もう一度「コメントを保存」を押してください。" }'
functions:
  - name: loadPartModule
    title: 部品のモジュールを読む
    container: src/part-modules.ts
    summary: 部品の配布ファイルをページの中で 1 回だけ `import()` し、export の形を確かめて返す
    kind: 関数
    scope: internal
    args:
      - name: name
        type: PartName
        required: true
        description: '`"view"` か `"comments"`'
      - name: importModule
        type: '(url: string) => Promise<Record<string, unknown>>'
        required: false
        default: 動的 `import()`
        passing: injected
        description: モジュールを読む関数（単体テストで差し替える）
    returns:
      type: 'Promise<{ url: string; module: ViewPartModule | CommentsPartModule }>'
      description: 読んだ URL とモジュール。読めない・形が合わないときは元のエラーで reject し、エラーの `cause` に URL を持たせる
    process: |-
      1. `partModules` に名前があればその Promise を返す
      2. URL を `partModuleUrls` の値、無ければ `new URL("./" + PART_MODULE_FILES[name], import.meta.url).href` にする
      3. `importModule(url)` を待ち、`view` は `drawView`・`attachView`、`comments` は `attachComments` が関数かを確かめる。合わなければ `Error`（モジュールが {名前} を export していない）を投げる
      4. 手順 2〜3 の Promise を `partModules` に控えて返す
    unit_tests:
      - name: test_load_part_module
        case: 正常
        summary: 隣の配布ファイルを読み、同じ名前は 1 回だけ読む
        condition: '`view` を 2 回読む'
        mock: '`importModule` は呼ばれた URL を控え、2 つの関数を持つオブジェクトを返す'
        expected: '`importModule` が 1 回だけ、`view.js` で終わる URL で呼ばれる。2 回とも同じモジュール'
      - name: test_load_part_module_when_url_replaced
        case: 正常
        summary: 差し替えた URL から読む
        condition: '`partModuleUrls` に `comments` → `blob:x` を入れて読む'
        mock: '`importModule` は URL を控える'
        expected: '`blob:x` で呼ばれる'
      - name: test_load_part_module_when_shape_mismatch
        case: 異常
        summary: 関数を export しないモジュールを拒む
        condition: '`comments` を読む'
        mock: '`importModule` は `{}` を返す'
        expected: '`attachComments` を含むメッセージの Error で reject し、`cause` に URL'
      - name: test_load_part_module_when_rejected
        case: 異常
        summary: 読めないモジュールは元のエラーで reject し、次も読み直さない
        condition: '`view` を 2 回読む'
        mock: '`importModule` は reject する'
        expected: 2 回とも同じエラーで reject し、`importModule` は 1 回だけ呼ばれる
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/ビューを描く.ts#constraints[部品のモジュールの読み込み]
      - dev/設計書/インターフェース定義/ライブラリ本体/コメントを付ける.ts#constraints[部品のモジュールの読み込み]
  - name: setPartModuleUrl
    title: 部品のモジュールの URL を差し替える
    container: src/part-modules.ts
    summary: '`partModuleUrls` に部品の名前と URL を入れる。書き出した HTML の起動の処理が呼ぶ'
    kind: 関数
    scope: internal
    args:
      - name: name
        type: PartName
        required: true
        description: 部品の名前
      - name: url
        type: string
        required: true
        description: 埋めたコードの `blob:` URL
    returns:
      type: void
      description: '-'
    process: 1. `partModuleUrls` に `name` → `url` を入れる
    unit_tests: []
  - name: mountView
    title: ビューを描く公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、ビューの部品のモジュールを読んで `el` にビューを描く
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中を書き換える。読めないときは知らせの枠を置き、`console.error` に出す'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: 描く先の要素
      - name: opts
        type: MdmarkViewOptions
        required: true
        description: 項目と表示の指定
    args_example: |-
      ```ts
      const view = await mountView(slot, { columns: ["題", "状態"], items, group: "状態" });
      view.destroy();
      ```
    returns:
      type: Promise<MdmarkViewHandle>
      description: 描き終えたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkViewOptions` が投げる（同期）'
    process: |-
      1. `checkViewOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("view")` を待ち、`module.drawView(el, opts)` の外す関数を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読めないときは `el` の中を class `mdmark` の要素 1 つにし、その中に `renderNotice({ name: "view", figure: false, source: "part" })` を置き、部品の名前・URL・元のエラーを `console.error` に出して、元のエラーで reject する
    unit_tests:
      - name: test_mount_view
        case: 正常
        summary: モジュールの drawView を呼んで destroy を返す
        condition: '`columns`・`items`・`group` を渡す'
        mock: '`loadPartModule` の `importModule` は、呼ばれた引数を控えて外す関数を返す `drawView` を持つモジュールを返す'
        expected: '`drawView` が `el` と `opts` で呼ばれる。`destroy` を 2 回呼んでも外す関数は 1 回だけ呼ばれる'
      - name: test_mount_view_when_invalid
        case: 異常
        summary: 引数が合わないと同期で投げ、モジュールを読まない
        condition: '`group` に無い列名'
        mock: '`importModule` は呼ばれたかを控える'
        expected: '`TypeError` を同期で投げ、`importModule` は呼ばれず、`el` は変わらない'
      - name: test_mount_view_when_module_unavailable
        case: 異常
        summary: 読めないと知らせの枠を置いて reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`console.error` を控える関数で包む'
        expected: '`el` の中に題が `この箇所を表示できません` の知らせの枠があり、元のエラーで reject する。`console.error` に `view` と URL'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/ビューを描く.ts#
  - name: mountComments
    title: コメントを付ける公開関数
    container: src/mount-parts.ts
    summary: 公開関数。引数を同期で検め、コメントの部品のモジュールを読んで `el` の中にコメントを付ける
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`el` の中に印・ボタン・一覧を置き、`document` に受け取りを付ける'
    args:
      - name: el
        type: HTMLElement
        required: true
        description: コメントを付けられる範囲の要素
      - name: opts
        type: '{ store: MdmarkCommentStore; docId: string }'
        required: true
        description: 読み書きの関数と対象の ID
    returns:
      type: Promise<MdmarkCommentsHandle>
      description: 読んだコメントに印を付けたら解決する
    exceptions:
      - name: TypeError
        condition: '`checkCommentOptions` が投げる（同期）'
    process: |-
      1. `checkCommentOptions(el, opts)` を呼ぶ（投げたらそのまま同期で投げる）
      2. `loadPartModule("comments")` を待ち、`module.attachComments({ root: el, store, docId })` の外す関数を、2 回目以降は何もしない `destroy` に包んで解決する
      3. 読めないときは `el` を書き換えず、`load` を呼ばずに元のエラーで reject する
    unit_tests:
      - name: test_mount_comments
        case: 正常
        summary: モジュールの attachComments を呼んで destroy を返す
        condition: '`store` と `docId: "panel-setup"`'
        mock: '`importModule` は、引数を控えて外す関数で解決する `attachComments` を持つモジュールを返す'
        expected: '`attachComments` が `{ root: el, store, docId }` で呼ばれる。`destroy` で外す関数が 1 回呼ばれる'
      - name: test_mount_comments_when_invalid
        case: 異常
        summary: 読み書きの関数が無いと同期で投げる
        condition: '`store` に `save` が無い'
        mock: なし
        expected: メッセージに `opts.store` を含む `TypeError` を同期で投げる
      - name: test_mount_comments_when_module_unavailable
        case: 異常
        summary: 読めないと el を書き換えずに reject する
        condition: 正しい引数
        mock: '`importModule` は reject する。`load` は呼ばれたかを控える'
        expected: 元のエラーで reject し、`el` の中は変わらず、`load` は呼ばれない
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/コメントを付ける.ts#
  - name: attachParts
    title: 描いた文書に部品を付ける
    container: src/mount-parts.ts
    summary: '`mount` が描くたびに呼ぶ。ビューの印とコメントの機能があるときだけ部品のモジュールを読んで付け、外す関数を返す'
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ root: HTMLElement; features: Record<string, boolean>; commentStore?: MdmarkCommentStore; docId?: string; isCurrent: () => boolean; warned: { missingStore: boolean } }'
        required: true
        description: 描いた要素・文書で決まった機能・`mount` の `commentStore` と `docId`・描いた文書がまだ今のものか・`mount` ごとに控える、読み書きの関数が無いことを出したか
    returns:
      type: () => void
      description: 付けた部品を外す関数。読み込みを待っている間に呼ぶと、読めた後に付けない
    process: |-
      1. `features.views` がオンで `root` に `div.mdmark-view` があれば `loadPartModule("view")` を待ち、`isCurrent()` で外していなければ、`div.mdmark-view` ごとに `attachView` を呼んで外す関数を控える
      2. `features.comments` がオンで `commentStore` と `docId` があれば `loadPartModule("comments")` を待ち、`isCurrent()` で外していなければ `attachComments({ root, store: commentStore, docId })` を待って外す関数を控える（待つ間に外したら、得た外す関数をすぐ呼ぶ）。`features.comments` がオンで `commentStore` を渡していなければ、モジュールを読まず、コメントの機能に読み書きの関数が要ることを `console.error` に出す（`mount` ごとに 1 回。`mount` が渡す `warned` で控える）
      3. 読めないときは付けずに、部品の名前（`view` か `comments`）・URL・元のエラーを `console.error` に 1 回出す（ページの中で部品ごとに 1 回）。ビューの印の場所は `render` の表のまま残す
      4. 外す関数は、外した印を立て、控えた外す関数を逆の順に呼ぶ
    unit_tests:
      - name: test_attach_parts
        case: 正常
        summary: ビューの印ごとに attachView を呼ぶ
        condition: '`div.mdmark-view` 2 つを持つ `root`、`views: true`'
        mock: '`importModule` は呼ばれた要素を控える `attachView` を返す'
        expected: '`attachView` が 2 回呼ばれ、外す関数で両方の外す関数が呼ばれる'
      - name: test_attach_parts_when_no_marks
        case: 正常
        summary: 印も機能も無ければモジュールを読まない
        condition: 'ビューの印の無い `root`、`comments: false`'
        mock: '`importModule` は呼ばれたかを控える'
        expected: '`importModule` が呼ばれない'
      - name: test_attach_parts_when_comments_without_store
        case: 正常
        summary: comments がオンでも読み書きの関数が無ければ読まず、console.error に 1 回だけ出す
        condition: '`comments: true`、`commentStore` を渡さず、同じ `warned` で 2 回呼ぶ'
        mock: '`importModule` は呼ばれたかを控える。`console.error` を控える'
        expected: '`importModule` が呼ばれない。`console.error` が 1 回だけ呼ばれる'
      - name: test_attach_parts_when_detached_while_loading
        case: 正常
        summary: 読み込みを待つ間に外すと付けない
        condition: 読み込みを合図まで待たせ、外す関数を呼んでから返す
        mock: 合図で返す `importModule`
        expected: '`attachView` が呼ばれない'
      - name: test_attach_parts_when_module_unavailable
        case: 異常
        summary: 読めないと表を残して console.error に 1 回出す
        condition: '`div.mdmark-view` 2 つ'
        mock: '`importModule` は reject する。`console.error` を控える'
        expected: '`root` の中は変わらない。`console.error` が `view` と URL で 1 回だけ呼ばれる'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#exceptions[なし（ビュー・コメントの部品のモジュールを読めない）]
