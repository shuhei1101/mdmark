  - name: buildEmbeddedHtml
    title: 埋め込んだ HTML を描く
    container: src/render/syntax/html.ts
    summary: コアルール。`html` がオンのとき、`<!-- html -->` の範囲ごとに言語 `html` の `fence` を数え、1 つなら範囲のトークンを `html_block` 1 つに置き換える。0 ・ 2 つ以上なら `pushWarning` で書き方の警告を差し込み、範囲の中身はそのまま残す。オフのときは何もしない（印は `dropMarks` が取り除く）
    description: |-
      置き換える HTML は次の順で作る。

      1. 中身の `<mdmark-flow>`・`<mdmark-sequence>`・`<mdmark-chart>`・`<mdmark-param>` を正規表現で拾い、中身の文字を `readDefinition` に渡す（`diagrams` がオフなら要素を中身ごと消す）。読めたら図の部品の HTML（`buildDiagrams` と同じ作りで `markOwn` を掛ける）、読めなければ書き方の警告の HTML を、その場所へ一時的な印（`<!--mdmark-part:{n}-->`）で預ける
      2. 残りを `sanitizeEmbedded` で落とす。`onText` は `buildDictionary`・`findWords`・`renderTermTip` で用語と文書の別名に下線を引く（範囲ごとに語の最初の 1 回だけ。`glossary` と `backlinks` が両方オフなら文字のまま）
      3. `hints` がオンなら `data-hint` を持つ要素に `renderHintMarkup` を当て、オフなら `data-hint` を消す
      4. 預けた印を図の部品と書き方の警告の HTML に戻し、`<div class="mdmark-html">`（`markOwn`）で囲む
      5. 書いた人の要素にも `markOwn` を掛け、最後の `sanitize` で下線・ヒントの class と `style` を残す（中身は 2. で落とし済み）
    kind: 関数
    scope: internal
    side_effects: '`state.tokens` を書き換える'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態（`state.env` は `RenderEnv`）
    unit_tests:
      - name: test_build_embedded_html
        case: 正常
        summary: 範囲のコードブロックを HTML として描き、範囲の外はコードのままにする
        condition: '`<!-- html -->` の範囲に `<p>こんにちは</p>` の `html` のコードブロック、範囲の外にもう 1 つ'
        mock: なし
        expected: '`div.mdmark-html > p` が 1 つ、`pre > code.language-html` が 1 つ'
      - name: test_build_embedded_html_when_chart
        case: 正常
        summary: 中の custom element を図の部品にする
        condition: 範囲の HTML に `<mdmark-chart>` と棒のグラフの定義
        mock: なし
        expected: '`div.mdmark-html figure.mdmark-diagram[data-diagram="chart"]` があり、出力に `<mdmark-chart` と `"series"` が無い'
      - name: test_build_embedded_html_when_hint
        case: 正常
        summary: data-hint に印とツールチップの中身を置き、hints がオフなら外す
        condition: '`<div data-hint="説明">` と `<span data-hint="分類の説明">`。もう 1 つは同じ文書に `<!-- features: -hints -->`'
        mock: なし
        expected: 前者で `div.mdmark-hint-block > button.mdmark-hint-mark` と `span.mdmark-hint-inline[tabindex="0"]` があり、後者で `data-hint` と `mdmark-hint-` が無い
      - name: test_build_embedded_html_when_terms
        case: 正常
        summary: 中の文字の用語に下線を引く
        condition: 索引の用語 `索引` と、範囲の HTML の `p` に `索引` が 2 回
        mock: なし
        expected: '`div.mdmark-html .mdmark-term-wrap` が 1 つ'
      - name: test_build_embedded_html_when_blocks_count
        case: 異常
        summary: 範囲のコードブロックが 1 つでないときは書き方の警告を置く
        condition: コードブロックの無い範囲と、2 つある範囲
        mock: なし
        expected: どちらも `.mdmark-syntax-warning` の本文が `<!-- html --> の範囲に html のコードブロックを 1 つだけ置いてください` で始まり、2 つある範囲のコードブロックは `pre` で出る
      - name: test_build_embedded_html_when_disabled
        case: 正常
        summary: html がオフならコードブロックのままにする
        condition: '正常の文書に `<!-- features: -html -->`'
        mock: なし
        expected: '`pre > code.language-html` が 2 つで、`mdmark-html` と `<!--` が無い'
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[sanitizeEmbedded]
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[readDefinition]
      - dev/設計書/モジュール構成/ライブラリ本体/図.ts#functions[renderHintMarkup]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[findWords]
      - '#functions[pushWarning]'
    status: planned
    introduced:
