  - name: parseTree
    title: 罫線のツリーを読む
    container: src/render/syntax/tree.ts
    kind: 関数
    scope: internal
    summary: 罫線（`├── `・`└── `・`│   `）と ASCII の罫線（`|-- `・`` `-- ``・`|   `）と字下げで書いた行を `TreeNode` の入れ子にする（1 つのツリーで 2 種類の罫線を混ぜてよい）。項目は、前に空白がある最初の `#` で名前と注釈に分け、注釈を `renderNote` で HTML にする。上の行より 2 段以上深い行があれば、その行番号と段の差を返す
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身
      - name: renderNote
        type: '(markdown: string) => string'
        required: false
        default: 注釈の文字をエスケープしたものを返す関数
        description: 注釈の Markdown を HTML にする関数
    returns:
      type: '{ nodes: TreeNode[] } | { line: number; depth: number }'
      description: 読めた項目か、読めない行
    unit_tests:
      - name: test_parse_tree
        case: 正常
        summary: 入れ子を読む
        condition: '`mdmark/`・`├── src/`・`│   └── index.ts`・`└── package.json`'
        mock: なし
        expected: '`[{ name: "mdmark/", children: [{ name: "src/", children: [{ name: "index.ts" }] }, { name: "package.json" }] }]`'
      - name: test_parse_tree_when_too_deep
        case: 異常
        summary: 2 段深い行を返す
        condition: 3 行目が上の行より 2 段深い
        mock: なし
        expected: '`{ line: 3, depth: 2 }`'
      - name: test_parse_tree_when_notes
        case: 正常
        summary: '前に空白がある最初の # で名前と注釈に分ける'
        condition: '`mdmark/`・`├── src/ #ソース`・`│   └── index.ts # 入口 # 中の #`・`├── C#/`・`└── #notes.md` を、`renderNote` に文字を `<em>` で囲む関数を渡して読む'
        mock: なし
        expected: '`src/` の `note` が `<em>ソース</em>`、`index.ts` の `note` が `<em>入口 # 中の #</em>`、`C#/` と `#notes.md` がその名前のまま `note` を持たない'
      - name: test_parse_tree_when_ascii
        case: 正常
        summary: ASCII の罫線を今の罫線と同じ段の数え方で読む
        condition: '`src/`・`|-- index.ts`・`` `-- parts/ ``・`    ├── tree.ts`・``    `-- ... ``'
        mock: なし
        expected: '`[{ name: "src/", children: [{ name: "index.ts" }, { name: "parts/", children: [{ name: "tree.ts" }, { name: "..." }] }] }]`'
  - name: buildFileTrees
    title: ファイルツリーにする
    container: src/render/syntax/tree.ts
    kind: 関数
    scope: internal
    summary: コアルール。`tree` がオンなら、言語 `tree` のコードブロックを、注釈を `state.md.renderInline` で描く `parseTree` で読み、部品『ファイルツリー』（`source` は末尾の改行を除いたコードブロックの中身）にする。直前に `tree` の印があれば `readTreeOptions` で読み、読めた `open` と `wrap` を部品へ渡し、読めない指定の警告と、`skipped` を `pushSkippedArgs` でツリーの前に差し込む。罫線を読めなければ警告を差し込み、コードブロックのままにする
    args:
