  - name: collectWarningsRule
    title: 書き方の警告を集める
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: markdown-it のコアルール（最後に走る）。`meta.warning` を持つトークン（埋め込んだ HTML の範囲の `html_block` は `meta.warnings` の並び）ごとに、`meta.warning.line`（マーカーの行）を、無ければ後ろで最初に `map` を持つトークンの開始の行（それも無ければ前で最後に `map` を持つトークンの終わりの行）を 1 からの行番号にし、`env.warnings` に `CollectedWarning` を足す
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it のコアの状態
    returns:
      type: void
      description: '`env.warnings` を書き換える'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[記法の点検の場所]
    unit_tests:
      - name: test_collect_warnings_rule
        case: 正常
        summary: マーカーの行を場所にし、マーカーを持たない警告は後ろのブロックの行にする
        condition: '3 行目の `<!-- code: highlight=9 -->` と直後のコードブロック、10 行目の開きのマーカーから続く読めない `<!-- flow -->` の範囲、20 行目の、上の行より 2 段深い行を持つ `tree` のコードブロック（マーカーを持たない警告）'
        mock: なし
        expected: '`env.warnings` が 3 件で、`line` が `3`・`10`・`20`、`kind` が `syntax_warning`・`diagram_invalid`・`syntax_warning`'
      - name: test_collect_warnings_rule_when_marks
        case: 正常
        summary: 表・ファイルツリー・タブのマーカーの警告を、マーカーの行にする
        condition: '3 行目 `<!-- table: foo -->` と表と閉じのマーカー、11 行目 `<!-- tree: wrap=1 -->` と `tree` のコードブロック、20 行目 `<!-- tabs: x=1 -->` の範囲'
        mock: なし
        expected: '`env.warnings` の `line` が `3`・`11`・`20`'
      - name: test_collect_warnings_rule_when_skipped_args
        case: 正常
        summary: 読み飛ばした引数を、印の行で unknown_mark_arg にして集める
        condition: '5 行目の `<!-- tabs: grop=os -->` と `### macOS`・`### Windows` の範囲'
        mock: なし
        expected: '`env.warnings` が `{ line: 5, kind: "unknown_mark_arg" }` の 1 件で、`message` に `grop=` と `group=`・`title=` を含む'
    status: planned
    introduced:
      pr: 328
  - name: pushSkippedArgs
    title: 読み飛ばした引数を差し込む
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: 読み飛ばした引数 1 つにつき、中身が空の `html_block` のトークン（画面には何も出さない）を作り、`meta.warning` に種類 `unknown_mark_arg`・文・`source` の `map[0]` を入れて、指定の位置に書いた順に差し込む。文は `{mark} の {arg} はこの版の mdmark が知らない指定で、描くときは読み飛ばしています。使えるのは {usable} です。書き誤りなら名前を直し、新しい版の指定なら mdmark の版を上げてください。`（HTML のタグと `` ` `` を除いた文字）。`collectWarningsRule` が `env.warnings` に集め、`mdmark check` の `--text`・`--file` だけがずれにする
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: index
        type: number
        required: true
        description: 差し込むトークンの位置
      - name: options
        type: '{ mark: string; skipped: SkippedArg[] }'
        required: true
        description: '`mark` は印の文字、`skipped` は読み飛ばした引数（空なら何も差し込まない）'
      - name: source
        type: Token | undefined
        required: false
        description: 印のトークン（範囲なら開きの印）。その `map[0]` を場所にする
    side_effects: '`state.tokens` に足す'
    unit_tests:
      - name: test_push_skipped_args
        case: 正常
        summary: 読み飛ばした引数ごとに中身の空のトークンを差し込み、画面には出さない
        condition: '3 行目の `<!-- table: data +foo size=2 -->` と表と閉じの印を `renderDocument` に通す'
        mock: なし
        expected: HTML に `mdmark-syntax-warning`・`+foo`・`size=` が無く、`warnings` が `kind` が `unknown_mark_arg`・`line` が `3` の 2 件で、`message` が `+foo`・`size=` と使える機能・キーを含む
    callees:
      - '#functions[collectWarningsRule]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[記法の点検]
    status: planned
