        summary: closed も open も無ければ折り畳まない
        condition: '`group=os`'
        mock: なし
        expected: '`collapse` が `none`、`title` が無く、`items` が空、`rest` が `group=os`'
      - name: test_read_collapse_when_conflict
        case: 異常
        summary: closed と open を両方書いたら closed にして項目を入れる
        condition: '`closed open title=入れ方`'
        mock: なし
        expected: '`collapse` が `closed`、`title` が `入れ方`、`items` の `label` が `closed と open` の 1 つ'
      - name: test_read_collapse_when_title_alone
        case: 異常
        summary: closed も open も無い title= は当てずに項目を入れる
        condition: '`title=準備` と、`open title=` をそれぞれ読む'
        mock: なし
        expected: 1 つ目は `collapse` が `none`、`title` が無く、`items` の `label` が `title=` で本文に `closed`・`open` がある。2 つ目は `collapse` が `open`、`title` が無く、`items` の `label` が `title=`
      - name: test_read_collapse_when_title_has_space
        case: 異常
        summary: title= の値の空白の後ろの単語を titleTail にする
        condition: '`open title=入れ 方 fold`（`text` も同じ文字）'
        mock: なし
        expected: '`title` が `入れ`、`items` が空、`titleTail` が `方`、`rest` が `方`・`fold`'
      - name: test_read_collapse_when_title_followed_by_known
        case: 正常
