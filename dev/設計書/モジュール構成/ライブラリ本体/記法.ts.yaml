title: ライブラリ本体 / 記法
lead: 印と記法を HTML にする markdown-it のコアルール。記法ごとに 1 ファイルで、トークンの並びを書き換え、部品の HTML を差し込む。機能がオフの記法は何もしない。読めない指定は書き方の警告を差し込み、読めた指定で描く。
directory: |-
  ```tree
  src/render/syntax/
  ├── headings.ts     # 見出しの ID とアンカー
  ├── sections.ts     # 節の囲み
  ├── tables.ts       # 表の種類・機能・絞り込みと、表の属性・列と行の色・多段の見出しと行見出しとセルの結合
  ├── table-cells.ts  # 表の `^^`・`<<` のセルの結合の計画（トークンを使わない）
  ├── table-tree.ts   # `tree=` の表の階層の行・型・必須・既定のセルと、`example=` の見本を表の下へ移す処理
  ├── collapse.ts     # 表・タブ・ステップの折り畳みの指定（closed・open・title=）の読み取り
  ├── views.ts        # ビューの印の囲み
  ├── row-details.ts  # 行の詳細
  ├── tabs.ts         # タブと、入れ子のタブの開きと閉じの対応
  ├── steps.ts        # ステップ
  ├── callouts.ts     # 注意書きと、注意書きのタイトル・開閉・入れ子
  ├── footnotes.ts    # 脚注の定義・参照・行内の脚注の読み取りと、末尾の一覧・機能のオフの文字への戻し
  ├── tree.ts         # ファイルツリー
  ├── badges.ts       # バッジとバッジの色
  ├── inline-icons.ts # 行内のアイコン
  ├── kbd.ts          # キー
  ├── highlight.ts    # 蛍光ペン
  ├── layout-columns.ts # 段組み
  ├── card-grid.ts    # カードの格子
  ├── details.ts      # details の範囲
  ├── pagebreak.ts    # 改ページ
  ├── includes.ts     # 取り込みのパスの解き方・取り込む範囲の選び方・トークンの差し込み
  ├── wide.ts         # wide の範囲
  ├── csv.ts          # CSV の読み取りと CSV の表
  ├── text-color.ts   # 本文の文字の色
  ├── images.ts       # 画像の属性の読み取り・動画と音声と GIF の見分け・画像と動画と音声の図
  ├── gallery.ts      # ギャラリー
  ├── cards.ts        # リンクと添付のカード
  ├── figures.ts      # 図表の番号と参照
  ├── toc.ts          # 目次
  ├── html.ts         # 埋め込んだ HTML と、範囲の css・ts・js
  ├── code-blocks.ts  # コードブロックの題・行番号・行の強調とコードの行の印・畳む行・色分けの対象の言語
  ├── warnings.ts     # 書き方の警告を差し込む助け
  └── tokens.ts       # 記法のコアルールが共有するトークンの助け（印の読み取り・閉じの印の探索・機能の判定）
  ```
data_models:
  - name: TableSpec
    title: 表の指定
    container: src/render/syntax/tables.ts
    summary: 表の印を読んだ結果
    properties:
      - name: kind
        type: '"default" | "data" | "plain"'
        description: 種類。知らない種類は `default` にして `skipped` に入れる
      - name: features
        type: TableFeature[]
        description: 種類の機能に `+機能`・`-機能` を当てたもの（`TABLE_FEATURES` のうち。知らない機能は当てずに `skipped` に入れる）
      - name: filters
        type: 'Array<{ column: number; kind: "select" | "text" | "date" }>'
        description: 絞り込む列。表に無い列名・知らない種類は入れない
      - name: collapse
        type: '"none" | "closed" | "open"'
        description: 折り畳み。`closed` と `open` を両方書いたら `closed`
      - name: warnings
        type: WarningItem[]
        description: 読めなかった指定
      - name: hide
        type: number[]
        description: '`hide=` で既定で隠す列の位置。`columns` の無い表・先頭の列・表に無い列名は入れない'
      - name: totals
        type: 'Array<{ column: number; calc: "sum" | "avg" | "count" }>'
        description: '`total=` で集計する列。`total` の無い表・表に無い列名・知らない計算は入れない'
      - name: title
        type: string | undefined
        description: 折り畳みの見出し（`title=` の値）。`collapse` が `none` の表と、値の無い `title=` では入れない
      - name: headRows
        type: number
        description: '`header-rows=` で `thead` にする表の先頭の行の数（既定 1）。数でない値と、表の行の数以上の値は 1 にする'
      - name: rowHeader
        type: number
        description: '`row-header=` で `<th scope="row">` にする本文の各行の先頭の列の数（既定 0）。数でない値と、表の列の数以上の値は 0 にする'
      - name: pin
        type: number | undefined
        description: '`pin=` で留める最後の列の位置。`pin` の無い表・表に無い列名では入れない'
      - name: wide
        type: number[]
        description: '`wide=` で広く取る列の位置。表に無い列名は入れない'
      - name: check
        type: number[]
        description: '`check=` で真偽値を ✓ と空欄で出す列の位置。表に無い列名は入れない'
      - name: tree
        type: number | undefined
        description: '`tree=` で階層にするキーの列の位置。表に無い列名では入れない'
      - name: treeType
        type: number | undefined
        description: '`type=` の列の位置。`tree` の無い表・表に無い列名では入れない'
      - name: treeRequired
        type: number | undefined
        description: '`required=` の列の位置。`tree` の無い表・表に無い列名では入れない'
      - name: treeDefault
        type: number | undefined
        description: '`default=` の列の位置。`tree` の無い表・表に無い列名では入れない'
      - name: example
        type: string | undefined
        description: '`example=` の見出しの文字。`tree` の無い表では入れない（見出しがあるかは `linkTreeExamples` が確かめる）'
      - name: skipped
        type: SkippedArg[]
        description: 読み飛ばした知らない種類・`+機能`・`-機能`・キー（書いた順）
  - name: TreeNode
    title: ツリーの項目
    container: src/parts/tree.ts
    summary: 罫線を読んだ 1 項目（部品『ファイルツリー』の `nodes` の要素）
    properties:
      - name: name
        type: string
        description: 項目の名前
      - name: children
        type: TreeNode[] | undefined
        description: 子の項目
      - name: note
        type: string | undefined
        description: 注釈の HTML（区切りの `#` の後ろのインラインを描いたもの）。注釈の無い項目は持たない
  - name: CollapseSpec
    title: 折り畳みの指定
    container: src/render/syntax/collapse.ts
    summary: 表・タブ・ステップの印から `closed`・`open`・`title=` を読んだ結果
    properties:
      - name: collapse
        type: '"none" | "closed" | "open"'
        description: 折り畳みに入れるかと、既定の開閉。`closed` と `open` を両方書いたら `closed`
      - name: title
        type: string | undefined
        description: 折り畳みの見出し（`title=` の値）。`collapse` が `none` のときと、値の無い `title=` では入れない
      - name: items
        type: WarningItem[]
        description: 読めなかった指定（`closed と open`・`closed` も `open` も無い `title=`・値の無い `title=`）
      - name: rest
        type: MdmarkMarkArgs
        description: '`closed`・`open`・`title=` を除いた残りの引数'
      - name: titleTail
        type: string | undefined
        description: '`title=` の値の空白の後ろの単語。`closed`・`open` と `+`・`-` で始まる語は入れない'
    status: planned
    introduced:
      pr: 225
  - name: TableColors
    title: 表の色の指定
    container: src/render/syntax/tables.ts
    summary: 表のマーカーの `highlight=`・`row-color=`・`row-at=` を読んだ結果
    properties:
      - name: highlight
        type: 'Array<{ column: number; color: ColorName }>'
        description: 強調する列の位置と色。色を省いた列は `blue`
      - name: rows
        type: Array<ColorName | null>
        description: 本文の行ごとの色。色を付けない行は `null`。`row-color=` と `row-at=` の両方が当たる行は `row-at=` の色
      - name: warnings
        type: WarningItem[]
        description: 読めなかった指定（表に無い列名・表に無い行の位置・`=` の無い項目・知らない色の名前）
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[表の列と行の色]
    status: planned
    introduced:
      pr: 263
  - name: ImageAttributes
    title: 画像の属性
    container: src/render/syntax/images.ts
    summary: 画像の直後の `{…}` を読んだ結果。`readImages` がトークンの `meta.mdmarkImage` に置き、図を作るコアルールが読む
    properties:
      - name: kind
        type: MediaKind
        description: '`src` の拡張子で見分けた種類'
      - name: width
        type: string | undefined
        description: '`300px` か `40%` の形の幅'
      - name: align
        type: '"left" | "center" | "right" | undefined'
        description: 配置。文の中の画像には入れない
      - name: lightbox
        type: boolean
        description: '`nolightbox` を書いたら `false`'
      - name: autoplay
        type: boolean
        description: 動画・音声だけ
      - name: muted
        type: boolean
        description: 動画・音声だけ。`autoplay` が `true` なら `true`
      - name: loop
        type: boolean
        description: 動画・音声だけ
      - name: poster
        type: string | undefined
        description: 動画だけ。書いたパス
      - name: items
        type: WarningItem[]
        description: 読めなかった属性（知らない属性・読めない値・文の中の画像の `align`・画像に書いた動画と音声だけの属性）
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[画像の属性]
    status: planned
    introduced:
      pr: 263
  - name: CardSpec
    title: カードの指定
    container: src/render/syntax/cards.ts
    summary: リンク 1 つだけの段落から作る、部品『カード』へ渡す値
    properties:
      - name: kind
        type: '"link" | "file"'
        description: カードの種類
      - name: href
        type: string
        description: リンク先
      - name: title
        type: string
        description: タイトル。`link` で URL をそのまま書いたときはスキームを除いた URL
      - name: fileKind
        type: AttachmentKind | undefined
        description: '`file` のときの種類'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
    status: planned
    introduced:
      pr: 263
  - name: CellMergePlan
    title: セルの結合の計画
    container: src/render/syntax/table-cells.ts
    summary: 表のセルの文字の格子から決めた、セルごとの結合と、結合できない `^^`・`<<` の警告
    properties:
      - name: cells
        type: 'Array<Array<{ rowspan: number; colspan: number; merged?: "up" | "left"; source?: [number, number] }>>'
        description: 行と列の位置ごとのセル。結合の始まりのセルは `rowspan`・`colspan` に覆う数（覆わないときは 1）、結合したセルは `merged` に向きと `source` に始まりのセルの位置（行・列）を持つ。結合できない `^^`・`<<` は `merged` を持たない
      - name: mergeColumns
        type: number[]
        description: 本文の行に `^^` の結合を持つ列の位置（小さい順）
      - name: warnings
        type: WarningItem[]
        description: 結合する相手の無い `^^`・`<<` の項目（ラベルは `^^`・`<<`、本文に行と列の位置）
    status: planned
    introduced:
      pr: 275
  - name: FootnoteState
    title: 脚注の状態
    container: src/render/syntax/footnotes.ts
    summary: 1 回の解析で読んだ脚注の定義と参照。`RenderEnv` の `mdmarkFootnotes` に入れ、描くごとに作り直す
    properties:
      - name: definitions
        type: Map<string, Token[] | null>
        description: 正規化したラベルごとの定義のブロックのトークン。block の工程でキーだけを `null` で入れ、`collectFootnotes` が最初の定義のトークンを入れる
      - name: notes
        type: 'Array<{ key: string | null; inline: Token[] | null; refCount: number }>'
        description: 参照した順の脚注。位置 + 1 が番号。行内の脚注は `collectFootnotes` が定義の囲みにするまで `key` が `null` で `inline` に中身のトークンを持つ
      - name: numbers
        type: Map<string, number>
        description: ラベルごとの `notes` の位置
  - name: SkippedArg
    title: 読み飛ばした引数
    container: src/render/syntax/warnings.ts
    summary: 記法の印の知らない種類・`+機能`・`-機能`・キー・指定の単語 1 つと、その印で使えるもの
    properties:
      - name: arg
        type: string
        description: 書いた引数の文字（`+foo`・`size=`・`fold`）。キーは `{キー}=`
      - name: usable
        type: string
        description: その印で使える種類・機能・キー・指定を行内のコードにして `・` でつないだ文字（今の警告の「使える…は」の並び）
    status: planned
constants:
  - name: TABLE_KINDS
    title: 表の種類と機能
    container: src/render/syntax/tables.ts
    summary: 種類ごとの既定の機能
    entries:
      - key: default
        value: '["pin"]'
      - key: data
        value: '["sort", "pin", "filter"]'
      - key: plain
        value: '[]'
  - name: FILTER_KINDS
    title: 絞り込みの種類
    container: src/table-logic.ts
    summary: '`filter=` に書ける種類。省いたときは先頭'
    value: '["select", "text", "date"]'
  - name: CALLOUT_KINDS
    title: 注意書きの種類
    container: src/parts/callout.ts
    summary: 引用の 1 行目に書ける種類。知らない種類は `note`
    value: '["note", "tip", "important", "warning", "caution"]'
  - name: TABLE_FEATURES
    title: 表の機能の名前
    container: src/render/syntax/tables.ts
    summary: '`+機能`・`-機能` に書ける機能の名前。後ろの 5 つはどの種類の既定にも入らない'
    value: '["sort", "pin", "filter", "count", "columns", "total", "copy", "rowlink"]'
  - name: TOTAL_CALCS
    title: 集計の計算
    container: src/table-logic.ts
    summary: '`total=列名:計算` に書ける計算。集計の行の題はそれぞれ `合計`・`平均`・`件数`'
    value: '["sum", "avg", "count"]'
  - name: LINE_COMMENT_HEADS
    title: 行コメントの頭
    container: src/render/syntax/code-blocks.ts
    summary: 印だけを持つ行コメントのときに印と一緒に外す、印の直前の頭。言語に依らず同じものを当てる。`//`・`/*`・`<!--` は前の文字を問わずに外し、`#`・`--`・`;` は行頭か空白の後ろにあるときだけ外す（`i--`・`foo();` を頭と取り違えない）
    entries:
      - key: //
        value: C 系・TypeScript など
      - key: '#'
        value: Python・YAML・シェルなど
      - key: --
        value: SQL・Lua など
      - key: ;
        value: Lisp・INI など
      - key: <!-- 〜 -->
        value: HTML・XML・Markdown（印の後ろの `-->` も外す）
      - key: /* 〜 */
        value: CSS など（印の後ろの `*/` も外す）
  - name: SYNTAX_LANGUAGES
    title: 色分けの言語の対応表
    container: src/render/syntax/code-blocks.ts
    summary: 情報文字列の最初の語（小文字）から、highlight.js の言語のモジュール名を引く表。モジュール名は `{url}languages/{モジュール名}.min.js` と npm の `highlight.js/lib/languages/{モジュール名}` の名前に当たる
    value: '{ typescript: "typescript", ts: "typescript", tsx: "typescript", javascript: "javascript", js: "javascript", jsx: "javascript", mjs: "javascript", cjs: "javascript", json: "json", yaml: "yaml", yml: "yaml", python: "python", py: "python", bash: "bash", sh: "bash", shell: "bash", zsh: "bash", html: "xml", xml: "xml", css: "css", markdown: "markdown", md: "markdown", sql: "sql", dockerfile: "dockerfile", docker: "dockerfile", diff: "diff", patch: "diff" }'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[色分けの対象]
    status: planned
    introduced:
      pr: 97
  - name: MEDIA_EXTENSIONS
    title: 動画と音声の拡張子
    container: src/render/syntax/images.ts
    summary: '`src` の拡張子（小文字）から種類を引く。どれにも当たらない `gif` は `gif`、それ以外は `image`。CLI の書き出しと点検も使う'
    entries:
      - key: video
        value: '["mp4", "m4v", "webm", "mov", "ogv"]'
      - key: audio
        value: '["mp3", "m4a", "aac", "ogg", "oga", "opus", "wav", "flac"]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[動画と音声]
    status: planned
    introduced:
      pr: 263
  - name: IMAGE_ATTRIBUTE_NAMES
    title: 画像の属性の名前
    container: src/render/syntax/images.ts
    summary: '`{…}` に書ける属性の名前。書き方の警告の本文に並べる。後ろの 4 つは動画・音声だけ'
    value: '["width", "align", "nolightbox", "autoplay", "muted", "loop", "poster"]'
    status: planned
    introduced:
      pr: 263
  - name: GALLERY_COLS
    title: ギャラリーの列の数
    container: src/render/syntax/gallery.ts
    summary: '`cols=` に書ける列の数の範囲と、省いたときの数'
    value: '{ min: 1, max: 6, default: 2 }'
    status: planned
    introduced:
      pr: 263
  - name: SUBFIGURE_LETTERS
    title: サブ図の番号の文字
    container: src/render/syntax/gallery.ts
    summary: 番号を付けたギャラリーの画像に、範囲の中の順に付ける文字。27 枚目からは番号を付けない
    value: '"abcdefghijklmnopqrstuvwxyz"'
    status: planned
    introduced:
      pr: 263
  - name: ATTACHMENT_KINDS
    title: 添付の拡張子と種類
    container: src/render/syntax/cards.ts
    summary: リンク先のパスの拡張子（小文字）から添付の種類（`AttachmentKind`）を引く。CLI の点検も使う
    entries:
      - key: pdf
        value: pdf
      - key: doc・docx・odt・rtf
        value: doc
      - key: xls・xlsx・ods・csv・tsv
        value: sheet
      - key: ppt・pptx・odp・key
        value: slide
      - key: zip・gz・tar・7z
        value: archive
      - key: txt
        value: text
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
    status: planned
    introduced:
      pr: 263
  - name: ICON_NAME_PATTERN
    title: アイコンの名前の書き方
    container: src/render/syntax/inline-icons.ts
    value: /^[a-z0-9][a-z0-9-]*$/
    summary: Lucide のアイコンの名前の書き方
functions:
  - name: slugify
    title: 見出しの ID を作る
    container: src/render/syntax/headings.ts
    kind: 関数
    scope: internal
    summary: '`slugBase`（作れないときは `heading`）で見出しの文字から ID を作り、使用済みの ID には `-1`・`-2` を付ける'
    args:
      - name: text
        type: string
        required: true
        description: 見出しの文字（タグを除いたもの）
      - name: used
        type: Map<string, number>
        required: true
        description: 文書の中で使った ID と回数
    returns:
      type: string
      description: 見出しの ID
    side_effects: '`used` を書き換える'
    unit_tests:
      - name: test_slugify
        case: 正常
        summary: 小文字にし、記号を落とし、空白を `-` にする
        condition: '`Hello, World!` と `使い方`'
        mock: なし
        expected: '`hello-world` と `使い方`'
      - name: test_slugify_when_duplicated
        case: 正常
        summary: 同じ ID の 2 つ目から番号を付ける
        condition: '`使い方` を 3 回'
        mock: なし
        expected: '`使い方`・`使い方-1`・`使い方-2`'
  - name: assignHeadingIds
    title: 見出しに ID とアンカーを付ける
    container: src/render/syntax/headings.ts
    kind: 関数
    scope: internal
    summary: コアルール。脚注の定義の囲みの外（`outsideFootnoteDefinitions`。定義の中の見出しを目次と右側の目次に載せないため）の全ての `heading_open` に `slugify` の ID を付け、`anchors` がオンなら見出しの中にアンカーを足す。見出しの ID と文字を `env.headings` に足す。class `mdmark-heading` は `wrapSections` が h2〜h4 に付ける
    args:
      - name: state
