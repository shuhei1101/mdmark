        condition: 索引の用語 `索引` と、範囲の HTML の `p` に `索引` が 2 回
        mock: なし
        expected: '`div.mdmark-html .mdmark-term-wrap` が 1 つ'
      - name: test_build_embedded_html_when_blocks_count
        case: 異常
        summary: 範囲のコードブロックが 1 つでないときは書き方の警告を置く
        condition: コードブロックの無い範囲と、2 つある範囲
        mock: なし
        expected: どちらも `.mdmark-syntax-warning` の本文が `<!-- html --> の範囲に html のコードブロックを 1 つだけ置いてください` で始まり、2 つある範囲のコードブロックは `pre` で出る
      - name: test_build_embedded_html_when_disabled
        case: 正常
        summary: html がオフならコードブロックのままにする
        condition: '正常の文書に `<!-- features: -html -->`'
        mock: なし
        expected: '`pre > code.language-html` が 2 つで、`mdmark-html` と `<!--` が無い'
      - name: test_build_embedded_html_when_avoided_term
        case: 正常
        summary: 中の文字のやめた言い方にマーカーを付ける
        condition: 索引の用語 `ワークスペース`（`avoid` に `作業場`）と、範囲の HTML の `p` に `作業場` が 2 回
        mock: なし
        expected: '`div.mdmark-html .mdmark-term-avoided` が 1 つ'
      - name: test_build_embedded_html_when_alias
        case: 正常
        summary: 中の文字のエイリアスに下線を引き、種類のツールチップを置く
        condition: '`env.aliases` に `url` の `課題の一覧`（URL `https://github.com/shuhei1101/mdmark/issues`）と、範囲の HTML の `p` に `課題の一覧` が 2 回'
        mock: なし
        expected: '`div.mdmark-html .mdmark-term-wrap` が 1 つで、中に `a.mdmark-term-tip-link` の `href` がその URL'
      - name: test_build_embedded_html_when_param_copy_label
        case: 正常
        summary: 中の操作できる部品のボタンを `env.labels.paramCopy` の文言で描く
        condition: '範囲の HTML に `<mdmark-param>` と `strength` の定義、`env.labels` が `{ paramCopy: "コピー" }`'
        mock: なし
        expected: '`div.mdmark-html button.mdmark-param-copy` の文字が `コピー`'
      - name: test_build_embedded_html_when_range_scripts
        case: 正常
        summary: '`html-scripts` がオンのとき、`css` を根の要素に限った `style` にし、`ts` を `template` に入れる'
        condition: '`features` に `{ "html-scripts": true }`。範囲に `html`・`css`（`.box { color: red }`）・`ts` の `fence`'
        mock: なし
        expected: '`div.mdmark-html[data-html-scope="0"]` の先頭に `style.mdmark-html-style`（中身が `scopeCss` の戻り）、末尾に `template.mdmark-html-script[data-lang="ts"]` があり、`<pre>` が無い'
      - name: test_build_embedded_html_when_range_scripts_off
