  - name: readTabsOptions
    title: タブの印の指定を読む
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: タブの印の引数から `group` を読み、`closed`・`open`・`title=` を `readCollapse`（`text` に `mark` の `rest` を渡す）で読む。`readCollapse` の項目と値の無い `group=` を、画面設計『文書』の「タブの印の読めない指定」の項目にして 1 つの警告にまとめ、`group=`・`title=` 以外のキーと `キー=値` の形でない指定を `skipped` に入れる（`キー=値` の形でない指定が `titleTail` と同じなら `titleTailItem` の項目にする）
    args:
      - name: mark
        type: Mark
        required: true
        description: タブの開きの印
    returns:
      type: '{ group?: string; collapse: "none" | "closed" | "open"; title?: string; warning?: SyntaxWarning; skipped: SkippedArg[] }'
      description: 読めた組の名前と折り畳みの指定と、読めない指定があれば書き方の警告と、読み飛ばした引数
    unit_tests:
      - name: test_read_tabs_options
        case: 正常
