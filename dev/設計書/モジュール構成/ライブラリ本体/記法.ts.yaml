        condition: '表の印の無い表（列 `名前`・`説明`、名前 `Todo`・`Done`）と、その直後の `<!-- row-detail: 1 -->` 〜 `<!-- /row-detail -->` の中の表（列 `引数`・`値`、1 行）'
        mock: なし
        expected: 親の表が `data-kind="default"` の囲みに入り、`Done` の行が親の表の `</table>` の前にあり、セルの `data-label` が `名前`・`説明`
      - name: test_decorate_tables_when_row_detail_has_marked_table
        case: 正常
        summary: 行の詳細の中の表には、その表を囲む表の印だけを当て、外の表の印の指定を当てない
        condition: '`<!-- table: data filter=名前 -->` 〜 `<!-- /table -->` の表（列 `名前`・`説明`、名前 `Todo`・`Done`）と、その直後の `<!-- row-detail: 1 -->` 〜 `<!-- /row-detail -->` の中の `<!-- table: plain -->` 〜 `<!-- /table -->` の表（列 `引数`・`値`、1 行）と、もう 1 つの行の詳細の中の印の無い表（2 行目に付ける）'
