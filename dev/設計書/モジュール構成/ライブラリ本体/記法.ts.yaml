        summary: closed と title= を読み、残りの引数を返す
        condition: '`data closed title=リリースの一覧 filter=名前`'
        mock: なし
        expected: '`collapse` が `closed`、`title` が `リリースの一覧`、`items` が空、`rest` が `data` と `filter=名前` だけ'
      - name: test_read_collapse_when_none
