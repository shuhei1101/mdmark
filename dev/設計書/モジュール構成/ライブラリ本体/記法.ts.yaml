  - name: readCollapse
    title: 折り畳みの指定を読む
    container: src/render/syntax/collapse.ts
    summary: 表・タブ・ステップの印の引数から `closed`・`open`・`title=` を読み、`CollapseSpec` を作る
    description: '`closed` と `open` を両方書いたら `closed` を当てて項目 `closed と open` を、`closed` も `open` も無い `title=` は当てずに項目 `title=`（`closed`・`open` と一緒に書く案内）を、値の無い `title=` は見出しを中身から作る案内の項目 `title=` を入れる。`text` を `titleTailOf` に渡し、`title=` の値の空白の後ろの単語が `closed`・`open` でも `+`・`-` で始まる語でもなければ `titleTail` に入れる（項目にはしない。表の種類のように呼ぶ側だけが知っている語があるため、呼ぶ側が知らない指定として読み飛ばす前に `titleTail` と比べ、同じなら `titleTailItem` の警告にする）。`closed`・`open`・`title=` を除いた引数を `rest` に残す'
    kind: 関数
    scope: internal
    args:
      - name: args
        type: MdmarkMarkArgs
        required: true
        description: 印の引数
      - name: text
        type: string
        required: false
        default: '""'
        description: 印の引数の文字（`Mark` の `rest`）
    returns:
      type: CollapseSpec
      description: 折り畳みの指定と、残りの引数
    unit_tests:
