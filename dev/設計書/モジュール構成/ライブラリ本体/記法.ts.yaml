        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCallout]
      - '#functions[readCallout]'
    unit_tests:
      - name: test_build_callouts
        case: 正常
        summary: 5 種を種類ごとの枠にする
        condition: '`[!NOTE]`・`[!TIP]`・`[!IMPORTANT]`・`[!WARNING]`・`[!CAUTION]` の引用'
        mock: なし
        expected: それぞれ `markdown-alert-{種類}` と題 `補足`・`ヒント`・`重要`・`警告`・`注意`、本文に `[!` が無い
      - name: test_build_callouts_when_collapsed_or_unknown
        case: 正常
        summary: 末尾の `-` は折り畳み、知らない種類は note
        condition: '`[!WARNING]-` と `[!FAQ]` の引用'
        mock: なし
        expected: 1 つ目が `<details class="markdown-alert markdown-alert-warning">`、2 つ目が `markdown-alert-note`
      - name: test_build_callouts_when_titled_and_nested
        case: 正常
        summary: タイトル・+・入れ子の注意書きにする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（注意書きのタイトルと入れ子）」の文書
        mock: なし
        expected: '1 つ目のタイトルが `設定を先に確認する` で頭に読み上げだけの `ヒント: `、2 つ目が `open` を持つ `details` で `summary` が `詳細`、`markdown-alert-warning` の中に `markdown-alert-tip` があり、`[!` が無い'
  - name: parseTree
    title: 罫線のツリーを読む
    container: src/render/syntax/tree.ts
    kind: 関数
    scope: internal
    summary: 罫線（`├── `・`└── `・`│   `）と ASCII の罫線（`|-- `・`` `-- ``・`|   `）と字下げで書いた行を `TreeNode` の入れ子にする（1 つのツリーで 2 種類の罫線を混ぜてよい）。項目は、前に空白がある最初の `#` で名前と注釈に分け、注釈を `renderNote` で HTML にする。上の行より 2 段以上深い行があれば、その行番号と段の差を返す
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身
      - name: renderNote
        type: '(markdown: string) => string'
        required: false
        default: 注釈の文字をエスケープしたものを返す関数
        description: 注釈の Markdown を HTML にする関数
    returns:
      type: '{ nodes: TreeNode[] } | { line: number; depth: number }'
      description: 読めた項目か、読めない行
    unit_tests:
      - name: test_parse_tree
        case: 正常
        summary: 入れ子を読む
        condition: '`mdmark/`・`├── src/`・`│   └── index.ts`・`└── package.json`'
        mock: なし
        expected: '`[{ name: "mdmark/", children: [{ name: "src/", children: [{ name: "index.ts" }] }, { name: "package.json" }] }]`'
      - name: test_parse_tree_when_too_deep
        case: 異常
        summary: 2 段深い行を返す
        condition: 3 行目が上の行より 2 段深い
        mock: なし
        expected: '`{ line: 3, depth: 2 }`'
      - name: test_parse_tree_when_notes
        case: 正常
        summary: '前に空白がある最初の # で名前と注釈に分ける'
        condition: '`mdmark/`・`├── src/ #ソース`・`│   └── index.ts # 入口 # 中の #`・`├── C#/`・`└── #notes.md` を、`renderNote` に文字を `<em>` で囲む関数を渡して読む'
        mock: なし
        expected: '`src/` の `note` が `<em>ソース</em>`、`index.ts` の `note` が `<em>入口 # 中の #</em>`、`C#/` と `#notes.md` がその名前のまま `note` を持たない'
      - name: test_parse_tree_when_ascii
        case: 正常
        summary: ASCII の罫線を今の罫線と同じ段の数え方で読む
        condition: '`src/`・`|-- index.ts`・`` `-- parts/ ``・`    ├── tree.ts`・``    `-- ... ``'
        mock: なし
        expected: '`[{ name: "src/", children: [{ name: "index.ts" }, { name: "parts/", children: [{ name: "tree.ts" }, { name: "..." }] }] }]`'
