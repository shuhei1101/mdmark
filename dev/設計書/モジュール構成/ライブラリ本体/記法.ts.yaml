  - name: readLineMarks
    title: コードの行の印を読む
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: コードブロックの中身を行に分け、行末の `[!code ++]`・`[!code --]`・`[!code highlight]`・`[!code focus]`・`[!code error]`・`[!code warning]` を行の種類（`add`・`del`・`highlight`・`focus`・`error`・`warning`）にして印を外す。行コメントが印だけなら印の直前の行コメントの頭（`LINE_COMMENT_HEADS`）も外し、外した後の行末の空白も外す。`[\!code …]` は `\` を外した文字にする。知らない印（`[!code blink]` など）はその行に当てず書いた文字のままにし、警告にする
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身（末尾の改行 1 つは行に数えない）
    returns:
      type: '{ lines: CodeLine[]; warnings: WarningItem[] }'
      description: 行と、知らない印の警告
    unit_tests:
      - name: test_read_line_marks
        case: 正常
        summary: 印と印だけの行コメントの頭と行末の空白を外す
        condition: '`let count = 1; // [!code ++]`・`foo(); // 消す [!code --]`・`x = 1  # [!code highlight]`・`<p>a</p> <!-- [!code ++] -->`・`a; /* [!code --] */`・`foo();// [!code ++]`・`i-- [!code ++]`'
        mock: なし
