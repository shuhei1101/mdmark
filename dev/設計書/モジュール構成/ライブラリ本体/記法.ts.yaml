    container: src/render/syntax/sections.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。`sections` がオンなら h1〜h4 の見出しに class `mdmark-heading` を付け、見出しの後ろから次の同じか上の階層の見出しの前までを部品『節』の中身の要素（`toggle: false`）で囲む。部品『タブ』の中身の中で開いた節は、次の見出しより前にその中身が終わるときは中身の終わりで閉じる（タブの外で開いた節はタブをまたいで続く）。取り込みの枠もタブの中身と同じ境目として扱い、タブの中身と取り込みの枠の中の見出しは、その外で開いた節を閉じない。見出しの直後の `section` の印で `data-section` を決め、知らない値は `pushSkippedArgs` で読み飛ばした引数にして `open` にする'
    args:
