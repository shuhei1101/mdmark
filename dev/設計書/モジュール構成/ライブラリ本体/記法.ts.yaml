  - name: buildTabs
    title: タブの範囲を区切る
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: コアルール。`tabs` がオンなら、`tabs` の範囲を最初に出る見出しの階層で区切り、部品『タブ』（`selected` 無し）の囲みと中身にする。印の引数は `readTabsOptions` で読み、読めた `group` と折り畳みの指定（`collapse`・`title`）を部品へ渡し、読めない指定の警告と、`skipped` を `pushSkippedArgs` で範囲の前に差し込む。区切りの見出しのトークンは取り除く。見出しが無ければ警告を差し込み、中身をそのまま残す。範囲の閉じは `findTabsClose` で入れ子を数えて探し、中身の中のタブのマーカーの範囲も同じ処理でタブにする（内側のタブは外側の中身の中で、内側の範囲で最初に出る見出しの階層で区切る）。タブ名は区切りの見出しの `inline` のトークンを `state.md.renderer.renderInline` で HTML にしたもの（`**` の強調は `strong` のまま）を部品へ渡し、折り畳みの見出しの既定にはタブ名のタグを除いた文字を使う。閉じの無い開きは、範囲の中に別のタブの開きを持たなければ文書の終わりまでを範囲にし、持てばその開きの場所に閉じの無い警告を 1 つ差し込み、文書の終わりまでのタブのマーカーをどれもタブにせず、見出しと中身をそのまま残す
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readTabsOptions]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTabs]
      - '#functions[pushWarning]'
      - '#functions[findTabsClose]'
    unit_tests:
      - name: test_build_tabs
        case: 正常
        summary: 見出しごとの中身に区切る
        condition: '`### macOS` と段落、`### Windows` と段落を囲んだ範囲'
        mock: なし
        expected: '`mdmark-tabs` の中に `mdmark-tab-title` が `macOS`・`Windows` の 2 つの中身があり、`<h3` が無い'
      - name: test_build_tabs_when_no_heading
        case: 正常
        summary: 見出しの無い範囲は警告と中身にする
        condition: 段落だけを囲んだ範囲
        mock: なし
        expected: 警告と段落があり、`mdmark-tabs` が無い
      - name: test_build_tabs_when_group
        case: 正常
        summary: group を部品に写す
        condition: '`<!-- tabs: group=os -->` で `### macOS`・`### Windows` を囲んだ範囲'
        mock: なし
        expected: '`<div class="mdmark-tabs" data-group="os">` があり、書き方の警告が無い'
      - name: test_build_tabs_when_unreadable_options
        case: 正常
        summary: 読めない指定は警告にしてタブにはする
        condition: '`<!-- tabs: group= grop=os fold -->` で `### macOS`・`### Windows` を囲んだ範囲'
        mock: なし
        expected: 範囲の前に書き方の警告が 1 つあり、項目が `group=` の 1 つ。`env.warnings` に `grop=`・`fold` の `unknown_mark_arg` がある。`data-group` を持たない `mdmark-tabs` がある
      - name: test_build_tabs_when_collapsed
        case: 正常
        summary: closed のタブをタブ名の見出しの折り畳みに入れる
        condition: '`<!-- tabs: closed -->` で `### uv`・`### pip` を囲んだ範囲'
        mock: なし
        expected: '`open` を持たない `<details class="mdmark-collapsible"><summary>タブ（uv・pip）</summary>` の中に `mdmark-tabs` があり、書き方の警告が無い'
      - name: test_build_tabs_when_nested
        case: 正常
        summary: 入れ子のタブを外側の中身の中のタブにする
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（入れ子のタブと強調したタブ名）」の文書
        mock: なし
        expected: 外側の `mdmark-tabs` の直下の `mdmark-tab-panel` が 2 つで、`macOS` の中身に `zsh`・`bash` の `mdmark-tabs` がある。書き方の警告が無い
      - name: test_build_tabs_when_strong_title
        case: 正常
        summary: 見出しの強調をタブ名の strong に残す
        condition: '`### **Windows**` と `### macOS` を囲んだ範囲'
        mock: なし
        expected: '`<p class="mdmark-tab-title"><strong>Windows</strong></p>` があり、`**` が無い'
      - name: test_build_tabs_when_nested_unclosed
        case: 異常
        summary: 閉じの足りない入れ子は外側の開きに警告を置き、タブにしない
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（閉じの足りない入れ子のタブ）」の文書
        mock: なし
        expected: 外側の開きの場所に書き方の警告が 1 つあり、`mdmark-tabs` が無く、`<h3` の `macOS`・`Windows` と `<h4` の `zsh`・`bash` が残る
  - name: buildSteps
