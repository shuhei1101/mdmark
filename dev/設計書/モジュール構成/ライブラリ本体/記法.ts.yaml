  - name: readTabsOptions
    title: タブの印の指定を読む
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: タブの印の引数から `group` を読む。値の無い `group=`・`group=` 以外のキー・`キー=値` の形でない指定を、画面設計『文書』の「タブの印の読めない指定」の項目にして 1 つの警告にまとめる
    args:
      - name: mark
        type: Mark
        required: true
        description: タブの開きの印
    returns:
      type: '{ group?: string; warning?: SyntaxWarning }'
      description: 読めた組の名前と、読めない指定があれば書き方の警告
    unit_tests:
      - name: test_read_tabs_options
        case: 正常
        summary: group を読む
        condition: '`<!-- tabs: group=os -->`'
        mock: なし
        expected: '`group` が `os` で、`warning` が無い'
      - name: test_read_tabs_options_when_none
        case: 正常
        summary: 引数が無ければ組も警告も無い
        condition: '`<!-- tabs -->`'
        mock: なし
        expected: '`group` と `warning` が無い'
      - name: test_read_tabs_options_when_unreadable
        case: 異常
        summary: 読めない指定を 1 つの警告にまとめる
        condition: '`<!-- tabs: group= grop=os closed -->`'
        mock: なし
        expected: '`group` が無く、`warning.message` が `の読めない指定を当てずに描いています。`、`warning.items` の `label` が `group=`・`grop=`・`closed` の 3 つ'
notes:
  コアルールの順: 描画の `createParser` が登録する。印 → 機能の重ね合わせ → 見出し → 用語集の表 → 行の詳細 → ビュー → 表 → タブ → ステップ → 注意書き → ファイルツリー → バッジ → 図の部品 → 埋め込んだ HTML → 図表の番号 → 用語の下線 → 節 → 目次 → 関連文書の一覧 → タスクリスト → www の自動リンク → 残った印を取り除く。行の詳細は表の囲みより前、節は記法の警告を差し込んだ後、目次は見出しの ID を付けた後。埋め込んだ HTML は用語の下線より前に置き、`html_block` にした中身を用語の下線が重ねて照合しないようにする
  部品の差し込み方: 中身を持つ部品（節・タブ・注意書き・行の詳細・図表の番号・表）は、中身の代わりに `SLOT_MARKER` を渡して HTML を作り、`markOwn` を掛けてから `SLOT_MARKER` の前後で分け、開きと閉じの `html_block` のトークンで中身のトークンを挟む。中身の HTML には `markOwn` を掛けない。見出し・表など Markdown から作ったトークンに付ける記法の属性は、同じトークンに `data-mdmark-own` も付ける。埋め込んだ HTML は例外で、`sanitizeEmbedded` で先に落とした中身にも `markOwn` を掛ける
