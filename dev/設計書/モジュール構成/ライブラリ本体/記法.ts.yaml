  - name: buildCallouts
    title: 注意書きにする
    container: src/render/syntax/callouts.ts
    kind: 関数
    scope: internal
    summary: コアルール。`callout` がオンなら、1 行目が `[!種類]`（末尾に `-` を許す）の引用を部品『注意書き』にし、種類の文字を本文から外す。知らない種類は `note`。1 行目は `readCallout` で読み取り、`+` は開いた折り畳み、種類の後ろの文字はタイトルとして部品へ渡し、1 行目を本文から削除する。注意書きの本文の範囲（引用の開きに対応する閉じまで）は同じ処理に渡し、中の引用も注意書きにする
    args:
