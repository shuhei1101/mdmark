    value: '"abcdefghijklmnopqrstuvwxyz"'
    status: planned
    introduced:
      pr: 263
  - name: ATTACHMENT_KINDS
    title: 添付の拡張子と種類
    container: src/render/syntax/cards.ts
    summary: リンク先のパスの拡張子（小文字）から添付の種類（`AttachmentKind`）を引く。CLI の点検も使う
    entries:
      - key: pdf
        value: pdf
      - key: doc・docx・odt・rtf
        value: doc
      - key: xls・xlsx・ods・csv・tsv
        value: sheet
      - key: ppt・pptx・odp・key
        value: slide
      - key: zip・gz・tar・7z
        value: archive
      - key: txt
        value: text
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
    status: planned
    introduced:
      pr: 263
functions:
  - name: slugify
    title: 見出しの ID を作る
    container: src/render/syntax/headings.ts
    kind: 関数
    scope: internal
    summary: '`slugBase`（作れないときは `heading`）で見出しの文字から ID を作り、使用済みの ID には `-1`・`-2` を付ける'
    args:
      - name: text
        type: string
        required: true
        description: 見出しの文字（タグを除いたもの）
      - name: used
        type: Map<string, number>
        required: true
        description: 文書の中で使った ID と回数
    returns:
      type: string
      description: 見出しの ID
    side_effects: '`used` を書き換える'
    unit_tests:
      - name: test_slugify
        case: 正常
        summary: 小文字にし、記号を落とし、空白を `-` にする
        condition: '`Hello, World!` と `使い方`'
        mock: なし
        expected: '`hello-world` と `使い方`'
      - name: test_slugify_when_duplicated
        case: 正常
        summary: 同じ ID の 2 つ目から番号を付ける
        condition: '`使い方` を 3 回'
        mock: なし
        expected: '`使い方`・`使い方-1`・`使い方-2`'
  - name: assignHeadingIds
    title: 見出しに ID とアンカーを付ける
    container: src/render/syntax/headings.ts
    kind: 関数
    scope: internal
    summary: コアルール。全ての `heading_open` に `slugify` の ID を付け、`anchors` がオンなら見出しの中にアンカーを足す。見出しの ID と文字を `env.headings` に足す。class `mdmark-heading` は `wrapSections` が h2〜h4 に付ける
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態（`state.env` は `RenderEnv`）
    side_effects: '`state.tokens` と `env.headings` を書き換える'
    callees:
      - '#functions[slugify]'
    unit_tests:
      - name: test_assign_heading_ids
        case: 正常
        summary: 見出しに ID とアンカーを付ける
        condition: '`# Hello, World!` と `## 使い方` を 2 つ'
        mock: なし
        expected: '`id` が `hello-world`・`使い方`・`使い方-1` で、各見出しに `<a class="mdmark-anchor" href="#{ID}" aria-label="「{文字}」へのリンク">`'
      - name: test_assign_heading_ids_when_anchors_off
        case: 正常
        summary: anchors がオフでも ID は付け、アンカーは付けない
        condition: '`env.features.anchors` が `false`'
        mock: なし
        expected: '`id` があり、`mdmark-anchor` が無い'
  - name: wrapSections
    title: 節を囲む
    container: src/render/syntax/sections.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。`sections` がオンなら h1〜h4 の見出しに class `mdmark-heading` を付け、見出しの後ろから次の同じか上の階層の見出しの前までを部品『節』の中身の要素（`toggle: false`）で囲む。部品『タブ』の中身の中で開いた節は、次の見出しより前にその中身が終わるときは中身の終わりで閉じる（タブの外で開いた節はタブをまたいで続く）。見出しの直後の `section` の印で `data-section` を決め、知らない値は警告を差し込んで `open` にする'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSection]
      - '#functions[pushWarning]'
    unit_tests:
      - name: test_wrap_sections
        case: 正常
        summary: h2 と h3 の節を入れ子に囲み、closed の節も中身を隠さない
        condition: '`## A`・`### B`・直後に `<!-- section: closed -->` を持つ `## C`'
        mock: なし
        expected: '`section-a` の中に `section-b`、`section-c` が `data-section="closed"` を持ち `hidden` を持たない'
      - name: test_wrap_sections_when_unknown_value
        case: 正常
        summary: 知らない開閉の指定は警告を差し込み、開いた節にする
        condition: '`<!-- section: hidden -->`'
        mock: なし
        expected: 節の中身の頭に書き方の警告、`data-section="open"`
      - name: test_wrap_sections_when_feature_off
        case: 正常
        summary: sections がオフなら見出しに class を付けず、囲まない
        condition: '`env.features.sections` が `false` で `## A`'
        mock: なし
        expected: '`mdmark-heading` と `mdmark-section-body` が無く、`id="a"` はある'
      - name: test_wrap_sections_when_in_tab
        case: 正常
        summary: タブの中身の中で開いた節を、その中身の終わりで閉じる
        condition: '`## 導入` の後に、`### macOS`・`#### macOS の注意`・段落、`### Windows`・`#### Windows の注意`・段落を `tabs` の印で囲んだ範囲（`buildTabs` を先に当てる）'
        mock: なし
        expected: '`mdmark-tabs` の直下の中身が 2 つあり、1 つ目の中に `section-macos-の注意`、2 つ目の中に `section-windows-の注意` がある。`section-導入` の中に `mdmark-tabs` がある'
      - name: test_wrap_sections_when_h1
        case: 正常
        summary: h1 の節も囲み、h2 の節をその入れ子にする
        condition: '`# 手引き`・段落・`## 導入`・段落・`# 付録`'
        mock: なし
        expected: '`h1` が `mdmark-heading` を持ち、`section-手引き` の中に `section-導入` があり、`section-付録` は `section-手引き` の外'
  - name: readTableSpec
    title: 表の印を読む
    container: src/render/syntax/tables.ts
    kind: 関数
    scope: internal
    summary: 表の印の引数と表の見出しから `TableSpec` を作る。印が無い表は `default`。`closed`・`open`・`title=` は `readCollapse` で読み、その項目を `warnings` に入れる。`hide=` は `columns`、`total=` は `total`、`pin=` は `pin` を付けた表でだけ読み、`wide=`・`check=` はどの表でも読む。機能の無い表のキー・先頭の列の `hide=`・表に無い列名・知らない計算は警告にする。`header-rows=`・`row-header=` は正の整数として読み取り、数でない値・`header-rows=` の表の行の数以上の値・`row-header=` の表の列の数以上の値は既定にして警告にする
    args:
      - name: args
        type: MdmarkMarkArgs | undefined
        required: false
        description: 表の印の引数（囲まない表は `undefined`）
      - name: headers
        type: string[]
        required: true
        description: 表の見出しの文字
      - name: rowCount
        type: number
        required: true
        description: 表の行の数（見出しの行を含む）
    returns:
      type: TableSpec
      description: 表の指定
    unit_tests:
      - name: test_read_table_spec
        case: 正常
        summary: 種類・機能・絞り込み・折り畳みを読む
        condition: '`data -sort filter=名前,更新日:date closed` と見出し `名前`・`値`・`更新日`'
        mock: なし
        expected: '`kind` が `data`、`features` が `["pin", "filter"]`、`filters` が `[{0, select}, {2, date}]`、`collapse` が `closed`、`warnings` が空'
      - name: test_read_table_spec_when_unknown
        case: 正常
        summary: 読めない指定を警告にし、読めた指定を当てる
        condition: '`unknown +sort +foo size=2 filter=無い列,名前:range closed open`'
        mock: なし
        expected: '`kind` が `default`、`features` が `["pin", "sort"]`、`filters` が空、`collapse` が `closed`、`warnings` に `unknown`・`+foo`・`size=`・`無い列`・`range`・`closed と open` の項目'
      - name: test_read_table_spec_when_features
        case: 正常
        summary: 5 つの機能と hide=・total= を読む
        condition: '`data +count +columns +total +copy +rowlink hide=説明 total=数量:sum,名前:count` と見出し `名前`・`説明`・`数量`'
        mock: なし
        expected: '`features` が `["sort", "pin", "filter", "count", "columns", "total", "copy", "rowlink"]`、`hide` が `[1]`、`totals` が `[{2, sum}, {0, count}]`、`warnings` が空'
      - name: test_read_table_spec_when_feature_keys_invalid
        case: 正常
        summary: 読めない集計・隠す列と機能の無い表のキーを警告にして当てない
        condition: 見出し `名前`・`数量`・`単価` で、`data +total +columns total=数量:max,価格:sum,単価:avg hide=備考,名前` と `data total=数量:sum hide=単価` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `totals` が `[{2, avg}]`、`hide` が空、`warnings` に `max`・`価格`・`備考`・`名前`（先頭の列）の項目。2 つ目は `totals`・`hide` が空、`warnings` に `total=`・`hide=`（機能が要る）の項目
      - name: test_read_table_spec_when_title
        case: 正常
        summary: 折り畳みの見出しを読み、closed も open も無い title= を警告にする
        condition: 見出し `名前` で、`data closed title=リリースの一覧` と `data title=一覧` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `collapse` が `closed`、`title` が `リリースの一覧`、`warnings` が空。2 つ目は `collapse` が `none`、`title` が無く、`warnings` に `title=` の項目
      - name: test_read_table_spec_when_header_rows
        case: 正常
        summary: 見出しの行の数と行見出しの列の数を読み取る
        condition: 見出し 4 列・行の数 5 で、`data header-rows=2 row-header=1`
        mock: なし
        expected: '`headRows` が 2、`rowHeader` が 1、`warnings` が空'
      - name: test_read_table_spec_when_header_rows_invalid
        case: 異常
        summary: 表に収まらない数と数でない値を既定にして警告にする
        condition: 見出し 3 列・行の数 3 で、`data header-rows=5 row-header=x` と `data row-header=3` をそれぞれ読み取る
        mock: なし
        expected: 1 つ目は `headRows` が 1、`rowHeader` が 0、`warnings` に `header-rows=`（本文に表の行の数 3）と `row-header=` の項目。2 つ目は `rowHeader` が 0、`warnings` に `row-header=`（本文に表の列の数 3）の項目
      - name: test_read_table_spec_when_columns
        case: 正常
        summary: pin=・wide=・check= の列名を列の位置に読み替える
        condition: '`data pin=物理名 wide=説明 check=必須,既定` と見出し `No`・`物理名`・`説明`・`必須`・`既定`'
        mock: なし
        expected: '`pin` が `1`、`wide` が `[2]`、`check` が `[3, 4]`、`warnings` が空'
      - name: test_read_table_spec_when_column_keys_invalid
        case: 正常
        summary: 表に無い列名と pin の無い表の pin= を警告にして当てない
        condition: 見出し `名前`・`説明` で、`data pin=無い列 wide=説明 check=無い列` と `data -pin pin=名前` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `pin` が無く、`wide` が `[1]`、`check` が空、`warnings` に `無い列` の項目が 2 つ。2 つ目は `pin` が無く、`warnings` に `pin=`（`+pin` が要る）の項目
    callees:
      - '#functions[readCollapse]'
  - name: decorateTables
    title: 表を表の部品にする
    container: src/render/syntax/tables.ts
    kind: 関数
    scope: internal
    summary: コアルール。表に読み上げの名前と `tabindex`、セルに列名を付ける（今の処理）。`table` がオンなら、表の印の範囲の表と囲まない表を `readTableSpec` の指定で部品『表』の囲み（`data-kind`・`data-features`・`data-filter`・`data-hide`・`data-total`・折り畳み）に入れ（折り畳みの見出しは `title` か `表（{本文の行の数} 行）`）、`rowlink` の表は本文の各行に `rowIdOf` の `id`（`taken` は `env.headings` の ID と前の行の ID）を付けて先頭のセルに行へのリンクを置き、警告を囲みの頭に差し込む。`+total` の表は `findUnreadableTotals` で `sum`・`avg` の列の数として読めないセルを探し、列と計算ごとに 1 つずつの警告（値の並びは読めない値を `codes` で行内のコードにして `・` でつなぐ）を表の上に差し込む。閉じの印が無ければ文書の終わりまでを範囲にして警告を差し込む。表の範囲は `table_open` と `table_close` の入れ子の数で数え、自分の `table_open` に対応する `table_close` までにする。範囲の中の表（行の詳細の中の表）も部品『表』の囲みに入れ、当てる表の印の範囲は外の表の `table_open` より後ろで開くものに限る（無ければ `default`。外の表の印の指定は当てない）。表の範囲の中の表の印のトークンは、外の表と一緒に移さず使い切る。本文の行の数・`rowlink`・`total` は、入れ子の数が自分の表と同じ行だけを対象にする。セルの列名は、見出しを表ごとに積み、`table_close` で外の表の見出しに戻して付ける。`table` がオンなら、表のマーカーの範囲の表と囲まない表に `readTableColors` の色を当て、強調する列の `th`・`td` のトークンに class `mdmark-col-highlight` と `data-color`、色を付ける本文の行の `tr` のトークンに `data-color` を付け（どちらも `data-mdmark-own` を付ける）、読めない色の指定を表の囲みの頭の警告の項目に入れる。`pin` は囲みの `data-pin`、`check` は囲みの `data-check` に写す。`wide` の列の `th`・`td` のトークンに class `mdmark-wide`、`check` の列の `th`・`td` のトークンに class `mdmark-align-center` を付ける。`check` の列の本文のセルの中身が `true`・`false` のときは、`td` のトークンに `data-value` を付け、中身のトークンを `renderCheckCell` の HTML に `markOwn` を掛けた 1 つのトークンに替える（どれも `data-mdmark-own` を付ける）。表のマーカーの範囲の表は、`headRows` が 2 以上なら本文の先頭の `headRows - 1` 行を `thead` へ移し、`rowHeader` の列の本文のセルを `<th scope="row">` にし、セルの文字の格子を `planCellMerges` に渡して結合を当てる。見出しの行は始まりのセルに `rowspan`・`colspan`（`colspan` を持つセルは `scope="colgroup"`、ほかは `scope="col"`）を付けて結合したセルのトークンを削除し、本文の行は結合したセルの中身を始まりのセルの中身のトークンのコピーに替えて `data-merge` と `hidden` を付け、始まりのセルに `rowspan`・`colspan` を付ける。`mergeColumns` を `data-merge-columns` に写し、`warnings` を表の囲みの頭の警告の項目に入れる。追加した属性はどれも `data-mdmark-own` を持つトークンに付ける。表のマーカーの範囲の外の表は結合しない
    description: 今の `src/render/parser.ts` の `decorateTables` をここへ移す。並べ替え・ピン止め・絞り込みのボタンは `mount` が付ける
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readTableSpec]'
      - '#functions[pushWarning]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTable]
      - '#functions[readTableColors]'
      - '#functions[planCellMerges]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCheckCell]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[markOwn]
    unit_tests:
      - name: test_decorate_tables
        case: 正常
        summary: 表の印の表を指定どおりに囲み、囲まない表を default にする
        condition: '`<!-- table: data filter=名前 closed -->` 〜 `<!-- /table -->` の表と、印の無い表'
        mock: なし
        expected: 1 つ目が `data-kind="data" data-features="sort pin filter" data-filter="0:select"` と `<details class="mdmark-table-details">`、2 つ目が `data-kind="default" data-features="pin"`
      - name: test_decorate_tables_when_range_not_closed
        case: 正常
        summary: 閉じの印が無いときは文書の終わりまでの表に当て、警告を差し込む
        condition: '`<!-- table: data -->` の後に表が 2 つ'
        mock: なし
        expected: 2 つとも `data-kind="data"`、警告の本文に `<!-- /table -->`
      - name: test_decorate_tables_when_feature_off
        case: 正常
        summary: table がオフなら今の表のまま
        condition: '`env.features.table` が `false`'
        mock: なし
        expected: '`<table tabindex="0" aria-label="…">` があり、`mdmark-table` が無い'
      - name: test_decorate_tables_when_features
        case: 正常
        summary: 5 つの機能と hide=・total= を属性に写し、行に ID とリンクを付ける
        condition: '`## みかん` の後の `<!-- table: data +count +columns +total +copy +rowlink hide=説明 total=数量:sum -->` 〜 `<!-- /table -->` の表（列 `名前`・`説明`・`数量`、名前 `りんご`・`みかん`・`みかん`）'
        mock: なし
        expected: '`data-features="sort pin filter count columns total copy rowlink"`・`data-hide="1"`・`data-total="2:sum"`、行の `id` が `りんご`・`みかん-1`・`みかん-2`、各行の先頭のセルに `<a class="mdmark-row-anchor" href="#{ID}">`'
      - name: test_decorate_tables_when_total_unreadable
        case: 異常
        summary: 集計する列の数として読めないセルを、列と計算ごとの警告にして表の上に差し込む
        condition: '`<!-- table: data +total total=数量:sum,数量:avg,数量:count -->` 〜 `<!-- /table -->` の表（列 `名前`・`数量`、数量 `12`・`約3`・空・`-`）'
        mock: なし
        expected: 表の前に警告が 2 つあり、本文が `「数量」の列に数として読めない値 <code>約3</code>・<code>-</code> があるため、合計を出していません。数を書くか、セルを空にしてください。` と、`平均` の同じ文。`count` の警告は無い
      - name: test_decorate_tables_when_collapse_title
        case: 正常
        summary: 折り畳みの見出しを title= か本文の行の数にする
        condition: '`<!-- table: data closed -->` 〜 `<!-- /table -->` の 3 行の表と、`<!-- table: data open title=リリースの一覧 -->` 〜 `<!-- /table -->` の 2 行の表'
        mock: なし
        expected: 1 つ目が `open` を持たない `<details class="mdmark-table-details">` と `<summary>表（3 行）</summary>`、2 つ目が `<details class="mdmark-table-details" open>` と `<summary>リリースの一覧</summary>`
      - name: test_decorate_tables_when_row_detail_has_table
        case: 正常
        summary: 行の詳細の中に表を置いても、親の表の行を全て親の表の囲みに残し、列名・行の数・行へのリンク・集計を親の表の行だけで付ける
        condition: '`<!-- table: data closed +rowlink +total total=数量:sum -->` 〜 `<!-- /table -->` の表（列 `名前`・`数量`、名前 `Todo`・`Done`、数量 `1`・`2`）と、その直後の `<!-- row-detail: 1 -->` 〜 `<!-- /row-detail -->` の中の表（列 `引数`・`値`、1 行 `status`・`todo`）'
        mock: なし
        expected: 親の表の `<table>`〜`</table>` の中に `Done` の行と詳細の行があり、親の囲みの `</div>` の後ろに `<tr` が無い。`Done` の行のセルの `data-label` が `名前`・`数量`。親の囲みが `<summary>表（2 行）</summary>` を持ち、親の行の `id` が `todo`・`done`。詳細の行の中の表が `data-kind="default"` の囲みに入り、セルの `data-label` が `引数`・`値` で、行に `id` が無い。数として読めない値の警告が無い
      - name: test_decorate_tables_when_row_detail_has_table_without_mark
        case: 正常
