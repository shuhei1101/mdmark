        type: string
        required: true
        description: 書いた文字
      - name: autolinked
        type: boolean
        required: true
        description: URL をそのまま書いたリンクか（タイトルをスキームを除いた URL にする）
    returns:
      type: CardSpec | undefined
      description: カードの指定
    unit_tests:
      - name: test_card_of
        case: 正常
        summary: リンクと添付を見分ける
        condition: '`https://example.com/docs/guide`（URL のまま）・`[設計の資料](https://example.com/design)`・`[仕様書](files/spec.pdf?v=1)`'
        mock: なし
        expected: '`{ link, title: example.com/docs/guide }`・`{ link, title: 設計の資料 }`・`{ file, title: 仕様書, fileKind: pdf }`'
      - name: test_card_of_when_not_card
        case: 正常
        summary: カードにしないリンクは undefined
        condition: '`#導入`・`mailto:a@example.com`・`guide.md`・`ftp://example.com/a`'
        mock: なし
        expected: どれも `undefined`
    status: planned
    introduced:
      pr: 263
  - name: buildCards
    title: リンクと添付のカードにする
    container: src/render/syntax/cards.ts
    kind: 関数
    scope: internal
    summary: コアルール。`cards` がオンなら、段落の `inline` の子が前後の空白の `text` を除いて `link_open`・文字・`link_close` だけのものを `cardOf` で見分け、カードになるものは段落を部品『カード』の `html_block` に置き換える
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[cardOf]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCard]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
    unit_tests:
      - name: test_build_cards
        case: 正常
        summary: リンク 1 つだけの段落をカードにする
        condition: '`https://example.com/docs/guide` だけの段落と `[仕様書](files/spec.pdf)` だけの段落'
        mock: なし
        expected: '`<a class="mdmark-card" data-card="link" href="https://example.com/docs/guide">` と `<a class="mdmark-card" data-card="file" data-file-kind="pdf" href="files/spec.pdf">`'
      - name: test_build_cards_when_inline
        case: 正常
        summary: 文の中のリンクはカードにしない
        condition: '`詳しくは https://example.com/docs を見る。`'
        mock: なし
        expected: '`mdmark-card` が無い'
      - name: test_build_cards_when_feature_off
        case: 正常
        summary: cards がオフならリンクのまま
        condition: '`env.features.cards` が `false` で URL だけの段落'
        mock: なし
        expected: '`mdmark-card` が無く、`a` がある'
    status: planned
    introduced:
      pr: 263
  - name: planCellMerges
    title: セルの結合を決める
    container: src/render/syntax/table-cells.ts
    kind: 関数
    scope: internal
    summary: 表のセルの文字の格子から、`^^`（上のセルと結合）・`<<`（左のセルと結合）の結合を決める。結合したセルは、上か左のセルが結合したセルならその始まりのセルにたどって覆う数を増やす。見出しと本文をまたぐ `^^`（本文の最初の行）・最初の行の `^^`・最初の列の `<<` と、縦と横の結合が交わって矩形にならない結合は結合せず警告にする
    args:
    - name: options
      type: '{ cells: string[][]; headRows: number }'
      required: true
      description: '`cells` は行ごとのセルの文字（前後の空白を除いたもの。見出しの行を含む）、`headRows` は見出しの行の数'
    returns:
      type: CellMergePlan
      description: セルごとの結合と、結合する列と警告
    unit_tests:
    - name: test_plan_cell_merges
      case: 正常
      summary: 見出しの横の結合と本文の縦の結合を決める
      condition: '`headRows` が 2 で、1 行目 `地域`・`上期`・`<<`、2 行目 `^^`・`売上`・`件数`、3 行目 `東`・`1`・`2`、4 行目 `^^`・`3`・`4`'
      mock: なし
      expected: 1 行目の 1 列目が `rowspan` 2、2 列目が `colspan` 2、3 列目が `merged` `left` と `source` `[0, 1]`。3 行目の 1 列目が `rowspan` 2、4 行目の 1 列目が `merged` `up` と `source` `[2, 0]`。`mergeColumns` が `[0]`、`warnings` が空
    - name: test_plan_cell_merges_when_chained
      case: 正常
      summary: 続けて書いた ^^ を同じ始まりのセルにまとめる
      condition: '`headRows` が 1 で、本文の 1 列目が `A`・`^^`・`^^`・`B`'
      mock: なし
      expected: '`A` のセルが `rowspan` 3、続く 2 つが `source` `[1, 0]`、`B` が `rowspan` 1'
    - name: test_plan_cell_merges_when_no_partner
      case: 異常
      summary: 結合する相手の無い ^^・<< と、見出しと本文をまたぐ ^^ を警告にする
      condition: '`headRows` が 1 で、見出しの 1 列目が `<<`、本文の 1 行目の 2 列目が `^^`'
      mock: なし
      expected: どのセルも `merged` を持たず、`rowspan`・`colspan` が 1。`warnings` が 2 つで、ラベルが `<<`・`^^`
    - name: test_plan_cell_merges_when_not_rectangle
      case: 異常
      summary: 矩形にならない結合を警告にする
      condition: '`headRows` が 1 で、本文の 1 行目 `A`・`<<`、2 行目 `^^`・`x`'
      mock: なし
      expected: 2 行目の 1 列目が `merged` を持たず、`warnings` にその `^^` の項目がある
    status: planned
    introduced:
      pr: 275
  - name: findTabsClose
    title: タブの閉じを探す
    container: src/render/syntax/tabs.ts
    kind: 関数
    scope: internal
    summary: '`openIndex` のタブのマーカーと同じ階層のタブの開きと閉じを数え、対応する閉じの位置を返す。共通の `findClose` は使わない（タブ以外のマーカーの閉じの対応を変えないため）'
    args:
    - name: tokens
      type: Token[]
      required: true
      description: トークンの並び
    - name: openIndex
      type: number
      required: true
      description: タブの開きのマーカーの位置
    returns:
      type: '{ close: number; nested: boolean }'
      description: '`close` は対応する閉じの位置（無ければ `-1`）、`nested` は範囲（閉じが無ければ文書の終わりまで）に別のタブの開きを持つか'
    unit_tests:
    - name: test_find_tabs_close
      case: 正常
      summary: 入れ子の閉じを飛ばして外側の閉じを返す
      condition: 開き・開き・閉じ・閉じのタブのマーカーの並びで、1 つ目の開き
      mock: なし
      expected: '`close` が 4 つ目の位置、`nested` が `true`'
    - name: test_find_tabs_close_when_unclosed
      case: 異常
      summary: 閉じが足りなければ -1 を返す
      condition: 開き・開き・閉じの並びで、1 つ目の開き
      mock: なし
      expected: '`close` が `-1`、`nested` が `true`'
    status: planned
    introduced:
      pr: 275
  - name: readCallout
    title: 注意書きの 1 行目を読み取る
    container: src/render/syntax/callouts.ts
    kind: 関数
    scope: internal
    summary: 引用の最初の段落の 1 行目（最初の `softbreak` の手前まで）が `[!種類]` で始まるかを `CALLOUT_PATTERN` で読み取り、末尾の `-`・`+` と、後ろの空白の後の文字をタイトルにする。タイトルは 1 行目の残りの行内のトークンを `state.md.renderer.renderInline` で HTML にしたもの
    args:
    - name: options
      type: '{ state: StateCore; tokens: Token[]; openIndex: number }'
      required: true
      description: markdown-it の状態とトークンの並び、`blockquote_open` の位置
    returns:
      type: '{ kind: CalloutKind; collapsed: boolean; open: boolean; title?: string } | undefined'
      description: 種類・折り畳みか・開いた状態か・タイトルの HTML。注意書きでなければ `undefined`
    unit_tests:
    - name: test_read_callout
      case: 正常
      summary: 種類と開閉とタイトルを読み取る
      condition: 1 行目が `[!TIP] 設定を **先に** 確認する`・`[!NOTE]+ 詳細`・`[!WARNING]-`・`[!FAQ]` の引用
      mock: なし
      expected: 1 つ目が `tip`・`collapsed` `false`・タイトル `設定を <strong>先に</strong> 確認する`、2 つ目が `note`・`collapsed` `true`・`open` `true`・タイトル `詳細`、3 つ目が `warning`・`collapsed` `true`・`open` `false`・タイトル無し、4 つ目が `note`
    - name: test_read_callout_when_not_callout
      case: 正常
      summary: 1 行目が種類で始まらない引用は注意書きにしない
      condition: 1 行目が `メモ [!TIP]` の引用と、1 行目が `[!TIP]x`（空白の無い後ろの文字）の引用
      mock: なし
      expected: どちらも `undefined`
    status: planned
    introduced:
      pr: 275
  - name: readFolds
    title: 行のインデントと畳む行を決める
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: 行の文字から `measureIndents` でインデントのレベルを、`foldLinesOf` で畳む行の数を決めて行に付け、`folds` の行のうち畳める行に `folded` を付ける。畳めない行（コードブロックに無い行は `readCodeSpec` が除く）は当てずに警告にする
    args:
    - name: options
      type: '{ lines: CodeLine[]; folds: Set<number> }'
      required: true
      description: '`readLineMarks` の行と、`readCodeSpec` の最初から畳む行の番号'
    returns:
      type: '{ lines: CodeLine[]; warnings: WarningItem[] }'
      description: '`indent`・`foldLines`・`folded` を付けた行と、畳めない行の警告'
    callees:
    - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[measureIndents]
    - dev/設計書/モジュール構成/ライブラリ本体/操作.ts#functions[foldLinesOf]
    unit_tests:
    - name: test_read_folds
      case: 正常
      summary: インデントと畳む行を付け、指定の行を畳んだ状態にする
      condition: '`a:`・`  b:`・`    c: 1`・`  d: 2` の行と、`folds` が 2'
      mock: なし
      expected: '`indent` が 0・1・2・1、`foldLines` が 3・1・無し・無し、2 行目だけが `folded`、`warnings` が空'
    - name: test_read_folds_when_not_foldable
      case: 異常
      summary: 畳めない行を警告にする
      condition: '`a:`・`  b: 1`・`c: 2` の行と、`folds` が 2・3'
      mock: なし
      expected: どの行も `folded` を持たず、`warnings` に `2`・`3` の項目がある
    status: planned
    introduced:
      pr: 275
notes:
  コアルールの順: 描画の `createParser` が登録する。印 → 機能の重ね合わせ → 見出し → 用語集の表 → 行の詳細 → ビュー → 表 → タブ → ステップ → 注意書き → ファイルツリー → バッジ → 本文の文字の色 → 図の部品 → 埋め込んだ HTML → コードブロック → 画像の属性と種類 → 図表の番号 → ギャラリー → 画像と動画と音声の図 → カード → 用語の下線 → 節 → 目次 → 関連文書の一覧 → タスクリスト → www の自動リンク → 残った印を取り除く。行の詳細は表の囲みより前、節は記法の警告を差し込んだ後、目次は見出しの ID を付けた後。埋め込んだ HTML は用語の下線より前に置き、`html_block` にした中身を用語の下線が重ねて照合しないようにする。画像の属性は図表の番号より前に読み、図表の番号がギャラリーに番号を渡してからギャラリーを囲む。残った画像だけの段落は、その後に図にする
  部品の差し込み方: 中身を持つ部品（節・タブ・注意書き・行の詳細・図表の番号・表）は、中身の代わりに `SLOT_MARKER` を渡して HTML を作り、`markOwn` を掛けてから `SLOT_MARKER` の前後で分け、開きと閉じの `html_block` のトークンで中身のトークンを挟む。中身の HTML には `markOwn` を掛けない。見出し・表など Markdown から作ったトークンに付ける記法の属性は、同じトークンに `data-mdmark-own` も付ける。埋め込んだ HTML は例外で、`sanitizeEmbedded` で先に落とした中身にも `markOwn` を掛ける
