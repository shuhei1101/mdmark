  - name: readTableSpec
    title: 表の印を読む
    container: src/render/syntax/tables.ts
    kind: 関数
    scope: internal
    summary: 表の印の引数と表の見出しから `TableSpec` を作る。`tree=` は見出しにある列名のときだけ読み（`tree` を持つ表は `features` から `sort` を除く）、`type=`・`required=`・`default=`・`example=` は `tree` を持つ表でだけ読む。`tree` が無い表のこれらのキーと表に無い列名は警告にする。印が無い表は `default`。知らない種類・`+機能`・`-機能`・キーは警告にせず `skipped` に入れる（知らない種類が `readCollapse` の `titleTail` と同じなら `titleTailItem` の警告にする）。`closed`・`open`・`title=` は `readCollapse`（`text` を渡す）で読み、その項目を `warnings` に入れる。`hide=` は `columns`、`total=` は `total`、`pin=` は `pin` を付けた表でだけ読み、`wide=`・`check=` はどの表でも読む。機能の無い表のキー・先頭の列の `hide=`・表に無い列名・知らない計算は警告にする。`header-rows=`・`row-header=` は正の整数として読み取り、数でない値・`header-rows=` の表の行の数以上の値・`row-header=` の表の列の数以上の値は既定にして警告にする
    args:
      - name: args
        type: MdmarkMarkArgs | undefined
        required: false
        description: 表の印の引数（囲まない表は `undefined`）
      - name: headers
        type: string[]
        required: true
        description: 表の見出しの文字
      - name: rowCount
        type: number
        required: true
        description: 表の行の数（見出しの行を含む）
      - name: text
        type: string
        required: false
        default: '""'
        description: 表の印の引数の文字（`Mark` の `rest`）。`readCollapse` に渡し、`title=` の値の空白の後ろの単語を引く
    returns:
      type: TableSpec
      description: 表の指定
    unit_tests:
      - name: test_read_table_spec
        case: 正常
        summary: 種類・機能・絞り込み・折り畳みを読む
        condition: '`data -sort filter=名前,更新日:date closed` と見出し `名前`・`値`・`更新日`'
        mock: なし
        expected: '`kind` が `data`、`features` が `["pin", "filter"]`、`filters` が `[{0, select}, {2, date}]`、`collapse` が `closed`、`warnings` が空'
      - name: test_read_table_spec_when_unknown
        case: 正常
        summary: 読めない値と組み合わせを警告にし、知らない種類・機能・キーを読み飛ばす
        condition: '`unknown +sort +foo size=2 filter=無い列,名前:range closed open`'
        mock: なし
        expected: '`kind` が `default`、`features` が `["pin", "sort"]`、`filters` が空、`collapse` が `closed`、`warnings` に `無い列`・`range`・`closed と open` の項目だけがあり、`skipped` の `arg` が `unknown`・`+foo`・`size=`'
      - name: test_read_table_spec_when_features
        case: 正常
        summary: 5 つの機能と hide=・total= を読む
        condition: '`data +count +columns +total +copy +rowlink hide=説明 total=数量:sum,名前:count` と見出し `名前`・`説明`・`数量`'
        mock: なし
        expected: '`features` が `["sort", "pin", "filter", "count", "columns", "total", "copy", "rowlink"]`、`hide` が `[1]`、`totals` が `[{2, sum}, {0, count}]`、`warnings` が空'
      - name: test_read_table_spec_when_feature_keys_invalid
        case: 正常
        summary: 読めない集計・隠す列と機能の無い表のキーを警告にして当てない
        condition: 見出し `名前`・`数量`・`単価` で、`data +total +columns total=数量:max,価格:sum,単価:avg hide=備考,名前` と `data total=数量:sum hide=単価` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `totals` が `[{2, avg}]`、`hide` が空、`warnings` に `max`・`価格`・`備考`・`名前`（先頭の列）の項目。2 つ目は `totals`・`hide` が空、`warnings` に `total=`・`hide=`（機能が要る）の項目
      - name: test_read_table_spec_when_title
        case: 正常
        summary: 折り畳みの見出しを読み、closed も open も無い title= を警告にする
        condition: 見出し `名前` で、`data closed title=リリースの一覧` と `data title=一覧` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `collapse` が `closed`、`title` が `リリースの一覧`、`warnings` が空。2 つ目は `collapse` が `none`、`title` が無く、`warnings` に `title=` の項目
      - name: test_read_table_spec_when_header_rows
        case: 正常
        summary: 見出しの行の数と行見出しの列の数を読み取る
        condition: 見出し 4 列・行の数 5 で、`data header-rows=2 row-header=1`
        mock: なし
        expected: '`headRows` が 2、`rowHeader` が 1、`warnings` が空'
      - name: test_read_table_spec_when_header_rows_invalid
        case: 異常
        summary: 表に収まらない数と数でない値を既定にして警告にする
        condition: 見出し 3 列・行の数 3 で、`data header-rows=5 row-header=x` と `data row-header=3` をそれぞれ読み取る
        mock: なし
        expected: 1 つ目は `headRows` が 1、`rowHeader` が 0、`warnings` に `header-rows=`（本文に表の行の数 3）と `row-header=` の項目。2 つ目は `rowHeader` が 0、`warnings` に `row-header=`（本文に表の列の数 3）の項目
      - name: test_read_table_spec_when_columns
        case: 正常
        summary: pin=・wide=・check= の列名を列の位置に読み替える
        condition: '`data pin=物理名 wide=説明 check=必須,既定` と見出し `No`・`物理名`・`説明`・`必須`・`既定`'
        mock: なし
        expected: '`pin` が `1`、`wide` が `[2]`、`check` が `[3, 4]`、`warnings` が空'
      - name: test_read_table_spec_when_column_keys_invalid
        case: 正常
        summary: 表に無い列名と pin の無い表の pin= を警告にして当てない
        condition: 見出し `名前`・`説明` で、`data pin=無い列 wide=説明 check=無い列` と `data -pin pin=名前` をそれぞれ読む
        mock: なし
        expected: 1 つ目は `pin` が無く、`wide` が `[1]`、`check` が空、`warnings` に `無い列` の項目が 2 つ。2 つ目は `pin` が無く、`warnings` に `pin=`（`+pin` が要る）の項目
      - name: test_read_table_spec_when_title_has_space
        case: 異常
        summary: title= の値の空白の後ろの単語を警告にし、読み飛ばさない
        condition: 見出し `名前` で、`data closed title=リリースの 一覧`（`text` も同じ文字）
        mock: なし
        expected: '`title` が `リリースの`、`warnings` に `一覧` の項目があり、`skipped` が空'
      - name: test_read_table_spec_when_title_followed_by_known
        case: 正常
        summary: title= の直後の知っている種類・機能は当て、警告にしない
        condition: 見出し `名前` で、`closed title=一覧 data +count`（`text` も同じ文字）
        mock: なし
        expected: '`kind` が `data`、`features` に `count`、`title` が `一覧`、`warnings` と `skipped` が空'
    callees:
      - '#functions[readCollapse]'
  - name: decorateTables
    title: 表を表の部品にする
    container: src/render/syntax/tables.ts
    kind: 関数
    scope: internal
    summary: コアルール。表に読み上げの名前と `tabindex`、セルに列名を付ける（今の処理）。`table` がオンなら、表の印の範囲の表と囲まない表を `readTableSpec` の指定で部品『表』の囲み（`data-kind`・`data-features`・`data-filter`・`data-hide`・`data-total`・折り畳み）に入れ（折り畳みの見出しは `title` か `表（{本文の行の数} 行）`）、`rowlink` の表は本文の各行に `rowIdOf` の `id`（`taken` は `env.headings` の ID と前の行の ID）を付けて先頭のセルに行へのリンクを置き、警告を囲みの頭に差し込む。`readTableSpec` には印の `rest` を渡し、`skipped` を `pushSkippedArgs` で囲みの頭に差し込む。`+total` の表は `findUnreadableTotals` で `sum`・`avg` の列の数として読めないセルを探し、列と計算ごとに 1 つずつの警告（値の並びは読めない値を `codes` で行内のコードにして `・` でつなぐ）を表の上に差し込む。閉じの印が無ければ文書の終わりまでを範囲にして警告を差し込む。表の範囲は `table_open` と `table_close` の入れ子の数で数え、自分の `table_open` に対応する `table_close` までにする。範囲の中の表（行の詳細の中の表）も部品『表』の囲みに入れ、当てる表の印の範囲は外の表の `table_open` より後ろで開くものに限る（無ければ `default`。外の表の印の指定は当てない）。表の範囲の中の表の印のトークンは、外の表と一緒に移さず使い切る。本文の行の数・`rowlink`・`total` は、入れ子の数が自分の表と同じ行だけを対象にする。セルの列名は、見出しを表ごとに積み、`table_close` で外の表の見出しに戻して付ける。`table` がオンなら、表のマーカーの範囲の表と囲まない表に `readTableColors` の色を当て、強調する列の `th`・`td` のトークンに class `mdmark-col-highlight` と `data-color`、色を付ける本文の行の `tr` のトークンに `data-color` を付け（どちらも `data-mdmark-own` を付ける）、読めない色の指定を表の囲みの頭の警告の項目に入れる。`pin` は囲みの `data-pin`、`check` は囲みの `data-check` に写す。`reorder` の表で `headRows` が 2 以上なら、最下段の見出しのセルのトークンに `headerGroupsOf` の結合した見出しの位置を `data-group` で付ける。`tree` の表は囲みに `data-tree` を写し、表の範囲のトークンを `decorateTreeTable` に渡す。`wide` の列の `th`・`td` のトークンに class `mdmark-wide`、`check` の列の `th`・`td` のトークンに class `mdmark-align-center` を付ける。`check` の列の本文のセルの中身が `true`・`false` のときは、`td` のトークンに `data-value` を付け、中身のトークンを `renderCheckCell` の HTML に `markOwn` を掛けた 1 つのトークンに替える（どれも `data-mdmark-own` を付ける）。表のマーカーの範囲の表は、`headRows` が 2 以上なら本文の先頭の `headRows - 1` 行を `thead` へ移し、`rowHeader` の列の本文のセルを `<th scope="row">` にし、セルの文字の格子を `planCellMerges` に渡して結合を当てる。見出しの行は始まりのセルに `rowspan`・`colspan`（`colspan` を持つセルは `scope="colgroup"`、ほかは `scope="col"`）を付けて結合したセルのトークンを削除し、本文の行は結合したセルの中身を始まりのセルの中身のトークンのコピーに替えて `data-merge` と `hidden` を付け、始まりのセルに `rowspan`・`colspan` を付ける。`mergeColumns` を `data-merge-columns` に写し、`warnings` を表の囲みの頭の警告の項目に入れる。追加した属性はどれも `data-mdmark-own` を持つトークンに付ける。表のマーカーの範囲の外の表は結合しない
    description: 今の `src/render/parser.ts` の `decorateTables` をここへ移す。並べ替え・ピン止め・絞り込みのボタンは `mount` が付ける
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readTableSpec]'
      - '#functions[pushWarning]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTable]
      - '#functions[readTableColors]'
      - '#functions[planCellMerges]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCheckCell]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[markOwn]
    unit_tests:
      - name: test_decorate_tables
        case: 正常
        summary: 表の印の表を指定どおりに囲み、囲まない表を default にする
        condition: '`<!-- table: data filter=名前 closed -->` 〜 `<!-- /table -->` の表と、印の無い表'
        mock: なし
        expected: 1 つ目が `data-kind="data" data-features="sort pin filter" data-filter="0:select"` と `<details class="mdmark-table-details">`、2 つ目が `data-kind="default" data-features="pin"`
      - name: test_decorate_tables_when_range_not_closed
        case: 正常
