  - name: pushWarning
    title: 書き方の警告を差し込む
    container: src/render/syntax/warnings.ts
    kind: 関数
    scope: internal
    summary: 部品『書き方の警告』の HTML に `markOwn` を掛けて `html_block` のトークンにし、トークンの `meta.warning` に警告の種類（図の部品の定義は `diagram_invalid`、ほかは `syntax_warning`）・文・警告の元になったマーカーのトークン（範囲なら開きのマーカー）の `map` の開始の行を入れて、指定の位置に差し込む。書き方の警告を置く処理は全て `pushWarning` か `warningBlock` を通す（今 `renderSyntaxWarning` を直に呼ぶ `src/render/marks.ts`・`src/render/syntax/html.ts` も置き換える。埋め込んだ HTML の中の図の部品の警告は、`warningBlock` が作ったトークンの HTML を範囲の HTML に入れ、その `meta.warning` を範囲の `html_block` の `meta.warnings` に範囲の開きのマーカーの行で並べる。`mount` が拡張を読んだ後にブラウザで置く `src/libraries.ts` の警告はトークンを作らないため対象外）
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
      - name: index
        type: number
        required: true
        description: 差し込むトークンの位置
      - name: warning
        type: '{ mark?: string; message: string; items?: WarningItem[]; kind?: "diagram_invalid" | "syntax_warning"; line?: number }'
        required: true
        description: 部品へ渡す値（文言は画面設計『文書』の書き方の警告）。`kind` は省くと `syntax_warning`、`line` は警告の元のマーカーのトークンの `map[0]`（マーカーのトークンを持たない警告は省く）
      - name: source
        type: Token | undefined
        required: false
        description: 警告の元になったマーカーのトークン（範囲なら開きのマーカー）。`warning.line` が無ければ、その `map[0]` を警告の行にする。マーカーを持つ警告は全て渡す（`warningBlock` も同じ）
    side_effects: '`state.tokens` に足す'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSyntaxWarning]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[markOwn]
  - name: buildEmbeddedHtml
    title: 埋め込んだ HTML を描く
    container: src/render/syntax/html.ts
    summary: コアルール。`html` がオンのとき、`<!-- html -->` の範囲ごとに言語 `html` の `fence` を数え、1 つなら範囲のトークンを `html_block` 1 つに置き換える。`html-scripts` がオンのときは、範囲の言語 `css`・`ts`・`js` の `fence` も読み（`readRangeScripts`）、`css` を `scopeCss` で根の要素に限った `style.mdmark-html-style` を根の要素の先頭に、`ts`・`js` をエスケープした文字の `template.mdmark-html-script`（`data-lang`）を末尾に置き、根の要素に文書の中の範囲の通し番号を `data-html-scope` で付ける（どれも `markOwn`）。オフのときは `css`・`ts`・`js` の `fence` を範囲の `html_block` の後ろにそのまま残す。`ts` と `js` を両方持つ範囲と同じ言語を 2 つ持つ範囲は書き方の警告を差し込み、`template` を置かない。0 ・ 2 つ以上なら `pushWarning` で書き方の警告を差し込み、範囲の中身はそのまま残す。オフのときは何もしない（印は `dropMarks` が取り除く）
    description: |-
      置き換える HTML は次の順で作る。

      1. 中身の `<mdmark-flow>`・`<mdmark-sequence>`・`<mdmark-chart>`・`<mdmark-param>` を正規表現で拾い、中身の文字を `readDefinition` に渡す（`diagrams` がオフなら要素を中身ごと消す）。読めたら図の部品の HTML（`buildDiagrams` と同じ作りで、`renderParam` に `env.labels?.paramCopy` を渡し、`markOwn` を掛ける）、読めなければ書き方の警告の HTML を、その場所へ一時的な印（`<!--mdmark-part:{n}-->`）で預ける
      2. 残りを `sanitizeEmbedded` で落とす。`onText` は `buildDictionary`・`findWords`・`renderTermTip` で用語・エイリアス（`env.aliases`。`termsRule` と同じく種類のツールチップにする）・文書の別名に下線を引く（範囲ごとに語の最初の 1 回だけ。`glossary` と `backlinks` が両方オフなら文字のまま）
      3. `hints` がオンなら `data-hint` を持つ要素に `renderHintMarkup` を当て、オフなら `data-hint` を消す
      4. 預けた印を図の部品と書き方の警告の HTML に戻し、`<div class="mdmark-html">`（`markOwn`）で囲む
      5. 書いた人の要素にも `markOwn` を掛け、最後の `sanitize` で下線・ヒントの class と `style` を残す（中身は 2. で落とし済み）
    kind: 関数
    scope: internal
    side_effects: '`state.tokens` を書き換える'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態（`state.env` は `RenderEnv`）
    unit_tests:
      - name: test_build_embedded_html
        case: 正常
        summary: 範囲のコードブロックを HTML として描き、範囲の外はコードのままにする
        condition: '`<!-- html -->` の範囲に `<p>こんにちは</p>` の `html` のコードブロック、範囲の外にもう 1 つ'
        mock: なし
        expected: '`div.mdmark-html > p` が 1 つ、`pre > code.language-html` が 1 つ'
      - name: test_build_embedded_html_when_chart
        case: 正常
        summary: 中の custom element を図の部品にする
        condition: 範囲の HTML に `<mdmark-chart>` と棒のグラフの定義
        mock: なし
        expected: '`div.mdmark-html figure.mdmark-diagram[data-diagram="chart"]` があり、出力に `<mdmark-chart` と `"series"` が無い'
      - name: test_build_embedded_html_when_hint
        case: 正常
        summary: data-hint に印とツールチップの中身を置き、hints がオフなら外す
        condition: '`<div data-hint="説明">` と `<span data-hint="分類の説明">`。もう 1 つは同じ文書に `<!-- features: -hints -->`'
        mock: なし
        expected: 前者で `div.mdmark-hint-block > button.mdmark-hint-mark` と `span.mdmark-hint-inline[tabindex="0"]` があり、後者で `data-hint` と `mdmark-hint-` が無い
      - name: test_build_embedded_html_when_terms
