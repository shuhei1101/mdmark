        condition: '`<!-- tabs: group=os -->`'
        mock: なし
        expected: '`group` が `os` で、`warning` が無い'
      - name: test_read_tabs_options_when_none
        case: 正常
        summary: 引数が無ければ組も警告も無い
        condition: '`<!-- tabs -->`'
        mock: なし
        expected: '`group` と `warning` が無い'
      - name: test_read_tabs_options_when_unreadable
        case: 異常
        summary: 値の無い group= を警告にし、知らないキーと指定を読み飛ばす
        condition: '`<!-- tabs: group= grop=os fold -->`'
        mock: なし
        expected: '`group` が無く、`warning.message` が `の読めない指定を当てずに描いています。`、`warning.items` の `label` が `group=` の 1 つ、`skipped` の `arg` が `grop=`・`fold`'
      - name: test_read_tabs_options_when_collapse
        case: 正常
        summary: 折り畳みの指定を group と一緒に読む
        condition: '`<!-- tabs: open title=入れ方 group=os -->` と `<!-- tabs: closed open -->` をそれぞれ読む'
        mock: なし
        expected: 1 つ目は `group` が `os`、`collapse` が `open`、`title` が `入れ方` で `warning` が無い。2 つ目は `collapse` が `closed`、`warning.items` の `label` が `closed と open`
      - name: test_read_tabs_options_when_title_has_space
        case: 異常
        summary: title= の値の空白の後ろの単語を警告にし、読み飛ばさない
        condition: '`<!-- tabs: closed title=インストールの 手順 -->`'
        mock: なし
        expected: '`title` が `インストールの`、`warning.items` の `label` が `手順` の 1 つ、`skipped` が空'
    callees:
      - '#functions[readCollapse]'
  - name: readCodeSpec
    title: コードブロックの印を読む
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: '`code` の印の引数を、題・行番号の有無・強調する行・最初から畳む行・折り返すか（`wrap`。値を持つ `wrap=` は当てずに警告にする）に読む。`title=` の値の空白の後ろの単語（`titleTailOf` で引く）、読めない `highlight=`・`fold=` の番号、コードブロックの行の数を超える行の番号は、当てずに警告にする。それ以外の知らないキー・指定は `skipped` に入れる。`fold=` は `highlight=` と同じ書き方で読み取る'
    args:
      - name: options
        type: '{ args: MdmarkMarkArgs; text: string; lineCount: number }'
        required: true
        description: '`args` は `parseMarkArgs` が読んだ印の引数、`text` は印の引数の文字（`Mark` の `rest`）、`lineCount` は印を外した後のコードブロックの行の数'
    returns:
      type: '{ title: string; lineNumbers: boolean; highlights: Set<number>; folds: Set<number>; wrap: boolean; warnings: WarningItem[]; skipped: SkippedArg[] }'
      description: 題（無ければ空）・行番号を出すか・強調する行の番号（1 から）・最初から畳む行の番号（1 から）・読めなかった指定・読み飛ばした引数
    unit_tests:
      - name: test_read_code_spec
        case: 正常
        summary: 題・行番号・行と範囲の強調を読む
        condition: '`title=app.ts lines highlight=2,4-6`、`lineCount` が 6'
        mock: なし
        expected: '`title` が `app.ts`、`lineNumbers` が `true`、`highlights` が 2・4・5・6、`warnings` が空'
      - name: test_read_code_spec_when_unknown_key
        case: 異常
        summary: 空白の後ろの指定を警告にし、知らないキーを読み飛ばして、読めた題を当てる
        condition: '`title=My App.ts color=red debug`'
        mock: なし
        expected: '`title` が `My`、`warnings` が `App.ts` の 1 つ、`skipped` の `arg` が `color=`・`debug`'
      - name: test_read_code_spec_when_line_missing
        case: 異常
        summary: 行の数を超える番号と読めない番号を外して警告にする
        condition: '`highlight=2,5,x,3-1`、`lineCount` が 3'
        mock: なし
        expected: '`highlights` が 2 だけ、`warnings` に `5`・`x`・`3-1` がある'
      - name: test_read_code_spec_when_fold
        case: 正常
        summary: 最初から畳む行を読み取り、無い行を警告にする
        condition: '`fold=2,4-5,99`、`lineCount` が 6'
        mock: なし
        expected: '`folds` が 2・4・5、`warnings` に `99` の項目がある'
      - name: test_read_code_spec_when_wrap
        case: 正常
        summary: wrap を読み、値を持つ wrap= を警告にする
        condition: '`lines wrap` と `wrap=yes`、`lineCount` が 3'
        mock: なし
        expected: 1 つ目は `wrap` が `true` で `warnings` が空。2 つ目は `wrap` が `false` で、`warnings` に `wrap=yes` と `wrap` と書く直し方の項目がある
  - name: readLineMarks
    title: コードの行の印を読む
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: コードブロックの中身を行に分け、行末の `[!code ++]`・`[!code --]`・`[!code highlight]`・`[!code focus]`・`[!code error]`・`[!code warning]` を行の種類（`add`・`del`・`highlight`・`focus`・`error`・`warning`）にして印を外す。行コメントが印だけなら印の直前の行コメントの頭（`LINE_COMMENT_HEADS`）も外し、外した後の行末の空白も外す。`[\!code …]` は `\` を外した文字にする。知らない印（`[!code blink]` など）はその行に当てず書いた文字のままにし、警告にする
    args:
      - name: source
        type: string
        required: true
        description: コードブロックの中身（末尾の改行 1 つは行に数えない）
    returns:
      type: '{ lines: CodeLine[]; warnings: WarningItem[] }'
      description: 行と、知らない印の警告
    unit_tests:
      - name: test_read_line_marks
        case: 正常
        summary: 印と印だけの行コメントの頭と行末の空白を外す
        condition: '`let count = 1; // [!code ++]`・`foo(); // 消す [!code --]`・`x = 1  # [!code highlight]`・`<p>a</p> <!-- [!code ++] -->`・`a; /* [!code --] */`・`foo();// [!code ++]`・`i-- [!code ++]`'
        mock: なし
        expected: '`{ text: "let count = 1;", kind: "add" }`・`{ text: "foo(); // 消す", kind: "del" }`・`{ text: "x = 1", kind: "highlight" }`・`{ text: "<p>a</p>", kind: "add" }`・`{ text: "a;", kind: "del" }`・`{ text: "foo();", kind: "add" }`・`{ text: "i--", kind: "add" }`'
      - name: test_read_line_marks_when_focus_error_warning
        case: 正常
        summary: focus・error・warning を行の種類にする
        condition: '`a(); // [!code focus]`・`b(); # [!code error]`・`c(); /* [!code warning] */`'
        mock: なし
        expected: '`{ text: "a();", kind: "focus" }`・`{ text: "b();", kind: "error" }`・`{ text: "c();", kind: "warning" }`'
      - name: test_read_line_marks_when_escaped
        case: 正常
        summary: 打ち消した印は `\` を外した文字にして当てない
        condition: '`let count = 1; // [\!code ++]`'
        mock: なし
        expected: '`{ text: "let count = 1; // [!code ++]" }`（`kind` を持たない）'
      - name: test_read_line_marks_when_unknown
        case: 異常
        summary: 知らない印は当てずに警告にする
        condition: '`foo(); // [!code blink]`'
        mock: なし
        expected: '`{ text: "foo(); // [!code blink]" }` と、`[!code blink]` の警告'
  - name: buildCodeBlocks
    title: コードブロックを飾る
    container: src/render/syntax/code-blocks.ts
    kind: 関数
    scope: internal
    summary: 'コアルール。残っている `fence` のトークンごとに、情報文字列を `splitInfoString` で言語とファイル名に分けてから次を行う。`code` がオンのときは `readLineMarks` で行を読み、直前のトークンが `code` の印なら `readCodeSpec` で指定を読み、全てのコードブロックを部品『コードブロック』（言語・ファイル名・題・行番号・`wrap`・行と、`syntax` がオンなら言語を `syntaxLanguageOf` で引いた色分けの言語。`copyState` は渡さない）の `ownBlock` に置き換える。帯の右端のコピーのボタンは `mount` が付ける。`code` がオフのときは行の印を外さず中身の行をそのまま使い、`syntax` がオンで色分けの言語を持つコードブロックだけを帯を持たない部品（`bar: false`）に置き換え、それ以外は `fence` のまま情報文字列の最初の語を言語に書き換える（`ts:app.ts` の `code` の class を `language-ts` にし、`:` の前が空なら最初の語を外す）。`mermaid` がオンで情報文字列の最初の語がちょうど `mermaid` のコードブロックは、`code` のオン・オフによらず部品に置き換え（`code` がオフなら `bar: false`）、`mermaid: true` を渡し、色分けの言語を渡さない。`code` がオンのときは、`readFolds` で行にインデントのレベル・畳む行の数・`fold=` の畳んだ状態を付けてから部品へ渡す。`readCodeSpec`（`text` に印の `rest` を渡す）と `readLineMarks` と `readFolds` の読めない指定はコードブロックの前に警告を差し込み、`readCodeSpec` の `skipped` は `pushSkippedArgs` で同じ場所に差し込む。後ろが `fence` でない `code` の印の場所にも警告を差し込む（`code` がオンのときだけ）。言語 `tree`・図の部品・埋め込んだ HTML のコードブロックは、先のコアルールが最初の語との一致で `fence` でなくしているため当たらず、`tree:src` のように `:ファイル名` を付けたものはここで普通のコードブロックとして描く'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    callees:
      - '#functions[readCodeSpec]'
      - '#functions[readLineMarks]'
      - '#functions[pushWarning]'
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCodeBlock]
      - '#functions[syntaxLanguageOf]'
      - '#functions[splitInfoString]'
      - '#functions[readFolds]'
    unit_tests:
      - name: test_build_code_blocks
        case: 正常
        summary: 印と行の印を持つコードブロックも何も持たないコードブロックも帯を持つ部品にする
        condition: '`<!-- code: title=app.ts lines -->` の直後の 2 行の言語 `ts` のコードブロックと、印も行の印も持たない言語 `text` のコードブロック。`syntax` はオフ'
        mock: なし
        expected: 1 つ目が `<figure class="mdmark-code">` と `<figcaption class="mdmark-code-title mdmark-code-bar">` を持つ `html_block`、2 つ目が `<div class="mdmark-code">` と `<div class="mdmark-code-bar">` の中の `mdmark-code-lang-name` が `text` の `html_block`。どちらも `mdmark-code-copy` を持たない
      - name: test_build_code_blocks_when_file_name
        case: 正常
        summary: 情報文字列の `言語:ファイル名` を言語のラベルとファイル名と読み上げの名前に分ける
        condition: 言語 `python:hoge.py` のコードブロックと、言語 `:a.txt` のコードブロック
        mock: なし
        expected: '1 つ目が `mdmark-code-lang-name` が `python`・`mdmark-code-file` が `hoge.py`・`code` の class が `language-python`・`pre` の `aria-label` が `コード: hoge.py`。2 つ目は `mdmark-code-lang` を持たず、`code` が class を持たず、`aria-label` が `コード`'
      - name: test_build_code_blocks_when_tree_with_file_name
        case: 正常
        summary: '`tree:src` はファイルツリーにせず普通のコードブロックにする'
        condition: 言語 `tree:src` で罫線のフォルダ構成を書いたコードブロック
        mock: なし
        expected: '`mdmark-tree` が無く、`mdmark-code-lang-name` が `tree`・`mdmark-code-file` が `src` の部品'
      - name: test_build_code_blocks_when_escaped
        case: 正常
        summary: 打ち消した印は `\` を外した文字の行にする
        condition: '`let count = 1; // [\!code ++]` だけのコードブロック'
        mock: なし
        expected: 部品の中身が `let count = 1; // [!code ++]` を持ち `\` が無く、`mdmark-code-line` に分けていない
      - name: test_build_code_blocks_when_unknown_line_mark
        case: 異常
        summary: 知らない印だけのコードブロックの前に警告を差し込む
        condition: '`foo(); // [!code blink]` だけのコードブロック'
        mock: なし
        expected: コードブロックの前に警告（本文に `[!code blink]`）があり、部品の中身は `foo(); // [!code blink]` のまま
      - name: test_build_code_blocks_when_no_fence
        case: 異常
        summary: 後ろにコードブロックの無い印を警告にする
        condition: '`<!-- code: title=app.ts -->` の直後が段落'
        mock: なし
        expected: 印の場所に警告があり、段落が残る
      - name: test_build_code_blocks_when_disabled
        case: 正常
        summary: '`code` も `syntax` もオフなら `fence` のまま、情報文字列を言語だけにする'
        condition: '`features.code` と `features.syntax` が `false` で、行末に `// [!code ++]` を持つ言語 `ts:app.ts` のコードブロック'
        mock: なし
        expected: '`fence` のままで、`info` の最初の語が `ts`、中身に `// [!code ++]` が残り、`mdmark-code-bar` が無い'
      - name: test_build_code_blocks_when_syntax
        case: 正常
        summary: 色分けの対象に色分けの属性を付け、対象外には付けない
        condition: 印も行の印も持たない言語 `yml` のコードブロックと、言語 `text` のコードブロック。`syntax` はオン
        mock: なし
        expected: 1 つ目が `<code class="language-yml" data-mdmark-syntax="yaml">` を含む帯を持つ部品、2 つ目は `data-mdmark-syntax` の無い帯を持つ部品
      - name: test_build_code_blocks_when_syntax_disabled
        case: 正常
        summary: '`syntax` がオフなら色分けの属性を付けない'
        condition: '`<!-- features: -syntax -->` と、印も行の印も持たない言語 `ts` のコードブロックと、`<!-- code: lines -->` の直後の言語 `ts` のコードブロック'
        mock: なし
        expected: 1 つ目は帯を持つ部品、2 つ目は行番号を持つ部品で、どちらにも `data-mdmark-syntax` が無い
      - name: test_build_code_blocks_when_code_disabled_with_syntax
        case: 正常
        summary: '`code` がオフでも `syntax` がオンなら、行の印を外さず帯を持たない部品で色分けの属性を付ける'
        condition: '`features.code` が `false` で、行末に `// [!code ++]` を持つ言語 `ts:app.ts` のコードブロック'
