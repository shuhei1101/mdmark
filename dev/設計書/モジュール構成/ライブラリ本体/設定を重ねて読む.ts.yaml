title: ライブラリ本体 / 設定を重ねて読む
lead: 端末の設定と、起点のフォルダから上のフォルダの `mdmark.config.yaml` を探して重ねる処理。CLI・MCP のツール・VS Code 拡張機能が同じ関数を呼ぶ。
directory: |-
  ```text
  src/
  └── config-files.ts   # loadLayeredConfig・resolveSettingsPath・findConfigChain・mergeConfigs・absolutizeConfigPaths・displayConfigPath
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
        direction LR
        class 設定を重ねて読む
        class 端末の設定のパスを決める
        class 上のフォルダの設定ファイルを探す
        class 相対パスを絶対パスにする
        class 設定を重ねる
        class 設定の形を検める
        設定を重ねて読む --> 端末の設定のパスを決める
        設定を重ねて読む --> 上のフォルダの設定ファイルを探す
        設定を重ねて読む --> 設定の形を検める
        設定を重ねて読む --> 相対パスを絶対パスにする
        設定を重ねて読む --> 設定を重ねる
data_models:
  - name: LayeredConfig
    title: 重ねた設定
    container: src/config-files.ts
    usecase: 共通
    role: DTO
    summary: '`loadLayeredConfig` の戻り値'
    properties:
      - name: config
        type: CliConfig
        description: 重ねた設定。相対パスの値はその値を書いた設定ファイルのフォルダから解決した絶対パス
      - name: files
        type: ConfigFile[]
        description: 重ねた設定ファイルを重ねた順（端末の設定 → 上 → 近い）に並べたもの
      - name: nearest
        type: string | undefined
        description: 最も近い `mdmark.config.yaml` の絶対パス（`explicit` のときはそのパス）
      - name: unreadable
        type: '{ path: string; line: number; message: string } | undefined'
        description: YAML として読めなかった最初の設定ファイル
      - name: issues
        type: CheckIssue[]
        description: 重ねた設定ファイルごとの `schema` のずれ（`file` は絶対パス）
    status: planned
    introduced:
      pr: 347
  - name: ConfigFile
    title: 重ねた設定ファイル
    container: src/config-files.ts
    usecase: 共通
    role: DTO
    summary: 重ねた設定ファイル 1 つの場所と層
    properties:
      - name: path
        type: string
        description: 絶対パス
      - name: layer
        type: '"settings" | "folder"'
        description: 端末の設定か、フォルダの `mdmark.config.yaml` か
    status: planned
    introduced:
      pr: 347
constants:
  - name: SETTINGS_FILE
    title: 端末の設定のファイル名
    container: src/config-files.ts
    usecase: 共通
    summary: '`${XDG_CONFIG_HOME:-~/.config}/mdmark/` の下の端末の設定のファイル名'
    value: '"settings.yaml"'
    status: planned
    introduced:
      pr: 347
functions:
  - name: loadLayeredConfig
    title: 設定を重ねて読む
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    role: サービス
    summary: 端末の設定と上のフォルダの設定ファイルを読み、形を検めて、相対パスを絶対パスにしてから重ねる
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; explicit?: string; purpose: "preview" | "export"; env: Record<string, string | undefined>; home: string; readFile: (path: string) => Promise<string>; isFile: (path: string) => Promise<boolean>; explicitName: string }'
        required: true
        description: インターフェース定義『設定を重ねて読む』のリクエストと、ファイルを読む関数（`ENOENT` の例外を投げる）・ファイルがあるかを確かめる関数・誤りの文に入れる `explicit` の呼び名（CLI は `--config のパス`、MCP は `config のパス`、VS Code 拡張機能は `mdmark.configPath`）
    returns:
      type: Promise<LayeredConfig>
      description: 重ねた設定・重ねた設定ファイル・最も近い設定ファイル・読めないファイル・ずれ
    process: |-
      1. 端末の設定のパスを決める（端末の設定のパスを決める）
      2. 端末の設定を `readFile` で読み、YAML として読む
         - `ENOENT` の場合、端末の設定を空の設定として扱い、層に含めない
         - YAML として読めない場合、`unreadable` に入れ、端末の設定を重ねない
      3. 端末の設定の形を検める（設定の形を検める、端末の設定だけのキーを検める）。ずれは `issues` に入れ、ずれがあれば端末の設定を重ねない
      4. 端末の設定の `config.cascade`（既定 `false`）を読む
      5. `explicit` があれば `cwd` から解決したそのファイルだけを、無ければ上のフォルダの設定ファイルを集める（上のフォルダの設定ファイルを探す。`isFile` は引数のものを渡す）
         - `explicit` のファイルが無い（`isFile` が `false`）場合、`ConfigNotFoundError` を投げる
      6. 集めたファイルを上 → 近いの順に読み、2・3 と同じく `unreadable`・`issues` に入れ、読めて形が合うものだけを残す（形は設定の形を検めるだけで検める）。`config` のキーはフォルダの設定では捨てる
      7. 残した各層の相対パスを、その層のファイルのフォルダから絶対パスにする（相対パスを絶対パスにする）
      8. `purpose` が `export` で端末の設定の `config.applyToExport` が `false` の場合、端末の設定の層を外す
      9. 端末の設定 → 上 → 近いの順に重ねる（設定を重ねる）
      10. 重ねた設定から `config` のキーを除き、`LayeredConfig` を返す
    exceptions:
      - name: ConfigNotFoundError
        condition: '`explicit` のファイルが無い'
        message: '{explicit} が見つかりません（{explicitName}）。パスを直すか、mdmark init で置いてください。'
    callees:
      - '#functions[resolveSettingsPath]'
      - '#functions[findConfigChain]'
      - '#functions[validateSettingsKeys]'
      - '#functions[absolutizeConfigPaths]'
      - '#functions[mergeConfigs]'
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[validateConfig]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定を重ねて読む.ts#
    unit_tests:
      - name: test_load_layered_config
        case: 正常
        summary: 端末の設定・上・近いを重ね、相対パスを書いたファイルから解決する
        condition: '端末の設定に `config.cascade: true`・`features.callout: false`、上に `theme: ./theme.css`、近いに `features.table: false`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`config.features` が `{ callout: false, table: false }`、`config.theme` が上のフォルダの絶対パス、`files` が 3 つの順'
      - name: test_load_layered_config_when_first_only
        case: 正常
        summary: '`config.cascade` が `false` なら近い 1 つだけ'
        condition: '`config.cascade` を持たない端末の設定と、上と近いの設定ファイル'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` が端末の設定と近いの 2 つ、`config.theme` が無い'
      - name: test_load_layered_config_when_export_without_settings
        case: 正常
        summary: '`config.applyToExport: false` の書き出しで端末の設定を重ねない'
        condition: '`purpose: export`、端末の設定に `config.applyToExport: false`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` に端末の設定が無く、`config.features.callout` が無い'
      - name: test_load_layered_config_when_settings_missing
        case: 正常
        summary: 端末の設定が無ければ空の設定として扱う
        condition: '`readFile` が端末の設定に `ENOENT` を投げる'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` に端末の設定が無く、`unreadable`・`issues` が空'
      - name: test_load_layered_config_when_unreadable
        case: 正常
        summary: YAML として読めないファイルを `unreadable` にして重ねない
        condition: 端末の設定の 3 行目に閉じていない括弧
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`unreadable.path` が端末の設定、`line` が 3、`files` に端末の設定が無い'
      - name: test_load_layered_config_when_invalid
        case: 正常
        summary: 形の合わないファイルのずれを返して重ねない
        condition: '近いの設定に `features.callout: maybe`'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`issues[0].file` が近いの設定の絶対パス、`issues[0].where` が `features.callout`'
      - name: test_load_layered_config_when_folder_has_config_key
        case: 正常
        summary: フォルダの設定の `config` のキーは読まない
        condition: '近いの設定に `config.cascade: true`、端末の設定は `config.cascade` を持たない'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`files` が端末の設定と近いの 2 つ（上を重ねない）'
      - name: test_load_layered_config_when_explicit_missing
        case: 異常
        summary: '`explicit` のファイルが無い'
        condition: '`explicit` に無いファイル'
        mock: '`readFile` をメモリのファイルの表に差し替える'
        expected: '`ConfigNotFoundError` を投げ、メッセージにそのパス'
        exception: '`explicit` のファイルが無い'
    status: planned
    introduced:
      pr: 347
  - name: resolveSettingsPath
    title: 端末の設定のパスを決める
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: '`MDMARK_CONFIG`、無ければ `${XDG_CONFIG_HOME:-{home}/.config}/mdmark/settings.yaml` を返す'
    scope: public
    args:
      - name: options
        type: '{ env: Record<string, string | undefined>; home: string }'
        required: true
        description: 環境変数とホームのフォルダ
    returns:
      type: string
      description: 端末の設定の絶対パス
    process: |-
      1. `env.MDMARK_CONFIG` が空でなければその値を返す
      2. `env.XDG_CONFIG_HOME` が空でなければそれを、無ければ `{home}/.config` を基準にし、`mdmark/{SETTINGS_FILE}` を続けて返す
    unit_tests:
      - name: test_resolve_settings_path
        case: 正常
        summary: '`MDMARK_CONFIG` を優先する'
        condition: '`MDMARK_CONFIG` と `XDG_CONFIG_HOME` の両方がある'
        mock: なし
        expected: '`MDMARK_CONFIG` の値'
      - name: test_resolve_settings_path_when_xdg
        case: 正常
        summary: '`XDG_CONFIG_HOME` の下を使う'
        condition: '`XDG_CONFIG_HOME` だけがある'
        mock: なし
        expected: '`{XDG_CONFIG_HOME}/mdmark/settings.yaml`'
      - name: test_resolve_settings_path_when_no_env
        case: 正常
        summary: ホームの `.config` の下を使う
        condition: どちらの環境変数も無い
        mock: なし
        expected: '`{home}/.config/mdmark/settings.yaml`'
    status: planned
    introduced:
      pr: 347
  - name: findConfigChain
    title: 上のフォルダの設定ファイルを探す
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: '`cwd` から上へ `mdmark.config.yaml` を探し、上 → 近いの順に返す'
    scope: internal
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; cascade: boolean; isFile: (path: string) => Promise<boolean> }'
        required: true
        description: 起点のフォルダ・全て集めるか・ファイルがあるかを確かめる関数
    returns:
      type: Promise<string[]>
      description: 見つけた設定ファイルの絶対パス（上 → 近いの順）。無ければ空
    process: |-
      1. `cwd` からルートまで、各フォルダの `mdmark.config.yaml` を確かめる
         - `cascade` が `false` の場合、最初に見つかった 1 つで止める
      2. 見つけた順（近い → 上）を逆にして返す
    unit_tests:
      - name: test_find_config_chain
        case: 正常
        summary: 全て集めて上 → 近いの順に返す
        condition: '`cascade: true`、2 段上と起点に設定ファイル'
        mock: '`isFile` を表に差し替える'
        expected: 2 段上・起点の順の 2 つ
      - name: test_find_config_chain_when_first_only
        case: 正常
        summary: '`cascade: false` なら近い 1 つ'
        condition: '`cascade: false`、同じ配置'
        mock: '`isFile` を表に差し替える'
        expected: 起点の 1 つ
      - name: test_find_config_chain_when_none
        case: 正常
        summary: 見つからなければ空
        condition: どのフォルダにも無い
        mock: '`isFile` を表に差し替える'
        expected: 空の配列
    status: planned
    introduced:
      pr: 347
  - name: absolutizeConfigPaths
    title: 相対パスを絶対パスにする
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 1 つの層の設定の相対パスの値を、その層のファイルのフォルダから絶対パスにする
    scope: internal
    args:
      - name: options
        type: '{ config: CliConfig; dir: string }'
        required: true
        description: 1 つの層の検めた設定と、そのファイルのフォルダ
    returns:
      type: CliConfig
      description: 相対パスを絶対パスにした設定（渡した設定は書き換えない）
    process: |-
      1. `theme`・`index`・`assets.root`・`build.out`・`build.entry` と、`extensions`・`build.include`・`build.exclude`・`build.glossary` の各要素と、`libraries` の値・`html-scripts.url`・`syntax.url` と `aliases` の各行の `paths` を、`dir` から絶対パスにする
         - `http:`・`https:` の URL は替えない
    unit_tests:
      - name: test_absolutize_config_paths
        case: 正常
        summary: 相対パスを絶対パスにし、URL は替えない
        condition: '`theme: ./theme.css`・`libraries: { a: ./a.js, b: https://x/b.js }`・`build.include: ["*.md"]`'
        mock: なし
        expected: '`theme`・`libraries.a`・`build.include[0]` が `dir` の下の絶対パスで、`libraries.b` はそのまま'
    status: planned
    introduced:
      pr: 347
  - name: mergeConfigs
    title: 設定を重ねる
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 層を前から順に重ね、マップはキーごとに、それ以外は後の値で置き換える
    scope: public
    args:
      - name: layers
        type: CliConfig[]
        required: true
        description: 重ねる順に並べた層
    returns:
      type: CliConfig
      description: 重ねた設定
    process: |-
      1. 空の設定から始め、各層のキーごとに次を当てる
         - 前の値と後の値がどちらもマップ（配列でも `null` でもないオブジェクト）の場合、キーごとに同じ規則で重ねる
         - それ以外の場合、後の値で置き換える
    unit_tests:
      - name: test_merge_configs
        case: 正常
        summary: マップはキーごと、配列と文字列は置き換え
        condition: '前 `{ features: { a: true }, extensions: [x], theme: t1 }`、後 `{ features: { b: false }, extensions: [y], theme: t2 }`'
        mock: なし
        expected: '`{ features: { a: true, b: false }, extensions: [y], theme: t2 }`'
    status: planned
    introduced:
      pr: 347
  - name: displayConfigPath
    title: 設定ファイルのパスを表示の形にする
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 基準のフォルダの中なら相対パス、外ならホームを `~` にしたパスを返す
    scope: public
    args:
      - name: options
        type: '{ path: string; base: string; home: string }'
        required: true
        description: 設定ファイルの絶対パス・基準のフォルダ・ホームのフォルダ
    returns:
      type: string
      description: 表示するパス（区切りは `/`）
    process: |-
      1. `path` が `base` の下なら `base` からの相対パスを返す
      2. `home` の下なら先頭の `home` を `~` にして返す
      3. どちらでもなければ `path` を返す
    unit_tests:
      - name: test_display_config_path
        case: 正常
        summary: 基準の中は相対パス
        condition: '`path` が `base/docs/mdmark.config.yaml`'
        mock: なし
        expected: '`docs/mdmark.config.yaml`'
      - name: test_display_config_path_when_home
        case: 正常
        summary: 基準の外でホームの下は `~` のパス
        condition: '`path` が `{home}/.config/mdmark/settings.yaml`、`base` はホームの外'
        mock: なし
        expected: '`~/.config/mdmark/settings.yaml`'
      - name: test_display_config_path_when_outside
        case: 正常
        summary: どちらの外も絶対パス
        condition: '`path` が `/etc/mdmark/settings.yaml`'
        mock: なし
        expected: '`/etc/mdmark/settings.yaml`'
    status: planned
    introduced:
      pr: 347
  - name: validateSettingsKeys
    title: 端末の設定だけのキーを検める
    kind: 関数
    container: src/config-files.ts
    usecase: 共通
    summary: 端末の設定の `config` がマップで、`config.cascade`・`config.applyToExport` が真偽値かを検め、合わないところを `schema` のずれで返す
    scope: internal
    args:
      - name: raw
        type: unknown
        required: true
        description: 端末の設定を YAML として読んだ値
      - name: file
        type: string
        required: true
        description: ずれの `file` に入れる端末の設定の絶対パス
    returns:
      type: CheckIssue[]
      description: '`config`・`config.cascade`・`config.applyToExport` のずれ。合うときは空'
    process: |-
      1. `raw.config` が無ければ空を返す
      2. `raw.config` がマップでなければ、`config` の `schema` のずれを返す
      3. `cascade`・`applyToExport` のうち、あって真偽値でないものごとに `config.{キー}` の `schema` のずれを返す（知らないキーは拒まない）
    unit_tests:
      - name: test_validate_settings_keys
        case: 正常
        summary: 真偽値ならずれが無い
        condition: '`config: { cascade: true, applyToExport: false }`'
        mock: なし
        expected: 空の配列
      - name: test_validate_settings_keys_when_not_boolean
        case: 正常
        summary: 真偽値でない値をずれにする
        condition: '`config: { cascade: maybe }`'
        mock: なし
        expected: '`where` が `config.cascade` の `schema` のずれ 1 件'
      - name: test_validate_settings_keys_when_not_map
        case: 正常
        summary: '`config` がマップでない'
        condition: '`config: true`'
        mock: なし
        expected: '`where` が `config` の `schema` のずれ 1 件'
    status: planned
    introduced:
      pr: 347
notes:
  置き場所: '`src/config-files.ts` は `node:path`・`yaml`（YAML として読む）・`src/cli/alias-schema.ts`（`aliases` の行の検め。ajv の Schema を束ねる）だけを import し、`CliError` など CLI だけの型には依存しない。ファイルの読み取りと有無の確かめは引数で受ける。設定の形を検める `validateConfig` とそれが使う `schemaIssue`・`validateBuild`・`validateCheck`・`isValid*` は `src/cli/config.ts` からこのファイルへ移し、`src/cli/config.ts` はこのファイルから import する。CLI（`src/cli/`）・MCP（`src/plugin/`）と、esbuild で束ねる VS Code 拡張機能（`vscode/src/`）の両方から import する。配布物（ブラウザ）の入口からは import しない'
