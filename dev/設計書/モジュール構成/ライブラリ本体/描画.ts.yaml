title: "ライブラリ本体 / 描画"
lead: Markdown を本文の HTML 文字列にする処理。markdown-it で解析し、トークンの段で印を拾い GitHub Flavored Markdown の不足と画面設計の属性を足し、sanitize-html で許可していない要素・属性・URL を落とす。DOM に頼らず、ブラウザと Node で同じ文字列を返す。
directory: |-
  ```tree
  src/render/
  ├── index.ts     # render と renderDocument
  ├── parser.ts    # markdown-it の解析器と、足すコアルール
  ├── marks.ts     # 印を読み、置き換えるコアルール
  ├── sanitize.ts  # sanitize-html の設定と sanitize
  └── syntax/      # 記法ごとのコアルール（『記法』）
  ```
data_models:
  - name: Mark
    title: 印
    container: src/render/marks.ts
    usecase: 共通
    summary: 文書から拾った印 1 つ
    properties:
      - name: name
        type: string
        description: 印の名前
      - name: args
        type: MdmarkMarkArgs
        description: 読み分けた引数（`parseMarkArgs`）
      - name: raw
        type: string
        description: 印の文字のまま（書き方の警告に出す）
      - name: closing
        type: boolean
        description: 閉じの印（`<!-- /名前 -->`）か
  - name: RenderEnv
    title: 解析の環境
    container: src/render/parser.ts
    summary: markdown-it の `env` としてコアルールに渡す値と、コアルールが拾ったもの
    properties:
      - name: libraries
        type: Record<string, LibraryEntry>
        description: 対応表（どの印を印の場所の要素にするか）
      - name: defaults
        type: Record<string, boolean>
        description: 設定の `features`
      - name: labels
        type: '{ paramCopy: string } | undefined'
        description: 既定を当てた設定の `labels`（部品の文言。`renderDocument` が入れ、図の部品・埋め込んだ HTML のコアルールが `env.labels?.paramCopy` を `renderParam` に渡す）
      - name: featureArgs
        type: string[]
        description: '`features` の印の引数を書いた順に並べたもの（コアルールが足す）'
      - name: features
        type: Record<string, boolean>
        description: '`defaults` に `featureArgs` を重ねたもの（`resolveDocumentFeatures` が入れる。記法のコアルールが読む）'
      - name: headings
        type: 'Array<{ level: number; id: string; text: string }>'
        description: 見出しの ID と文字（`assignHeadingIds` が足す）
      - name: nonce
        type: string
        description: 描くごとに作る mdmark が出した要素の印（`markOwn`）の値
      - name: index
        type: MdmarkIndex | undefined
        description: '`normalizeIndex` で合う要素だけにした索引'
      - name: docId
        type: string | undefined
        description: 描く文書の索引の `id`（索引に無ければ `undefined`）
      - name: mdmarkReferences
        type: MdmarkReferences | undefined
        description: 参照の表（`render`・`mount` の `references`）。markdown-it が `env.references` にリンク参照定義を書くため、この名前にする
      - name: ownGlossary
        type: MdmarkGlossaryEntry[]
        description: 描く文書の用語集の表から読んだ用語（`glossaryRule` が足す）
      - name: glossaryLines
        type: number[] | undefined
        description: 用語集の表の用語ごとの文書の中の行番号（`ownGlossary` と同じ並び。`checkIndex` が `duplicate_term` の `where` に使う）
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: 使う側が渡したエイリアス（`render`・`mount` の `aliases`）。`termsRule`・`buildEmbeddedHtml` が `buildDictionary` に渡す
  - name: RenderedDocument
    title: 描いた文書
    container: src/render/index.ts
    summary: 本文の HTML と、文書の印で決まった機能のオン・オフ
    properties:
      - name: html
        type: string
        description: 本文の HTML 文字列
      - name: features
        type: Record<string, boolean>
        description: '`resolveFeatures` が返したオン・オフ。`mount` と、機能を作る Issue が読む'
constants:
  - name: MARK_PATTERN
    title: 印の書式
    container: src/render/marks.ts
    summary: '生の HTML の中の印（`<!-- 名前: 引数 -->`・`<!-- 名前 -->`・`<!-- /名前 -->`）を拾う正規表現'
    value: /<!--\s*(\/)?([a-z][a-z0-9-]*)(?::\s*(.*?))?\s*-->/gs
  - name: FEATURES_MARK
    title: 機能の印の名前
    container: src/render/marks.ts
    summary: 機能のオン・オフを書く印の名前
    value: '"features"'
  - name: ALIGN_VALUES
    title: 列の揃えの値
    container: src/render/sanitize.ts
    summary: class `mdmark-align-{値}` に移す `text-align` の値
    value: '["left", "center", "right"]'
  - name: SANITIZE_OPTIONS
    title: 落とす設定
    container: src/render/sanitize.ts
    summary: sanitize-html に渡す設定。記法の要素と属性を許し、誰が出したかは `sanitize` の `transformTags` が見分ける。`allowedTags` に `nav`・`figure`・`figcaption` を足し、`allowedAttributes`・`allowedClasses` に記法が出す class（部品設計の HTML）・`data-kind`・`data-features`・`data-filter`・`data-section`・`data-row`・`data-mdmark-own`・見出しと `figure`・`div` の `id`・`colspan`・`aria-label`・`role`（`note`・`status`）を足す。今の値は下の entries
    value: 下の entries
    entries:
      - key: allowedTags
        value: 既定 + `img`・`del`・`details`・`summary`・`input`
      - key: allowedAttributes
        value: '`*`: `data-source-line` / `a`: `href`・`title` / `img`: `src`・`alt`・`title` / `details`: `open` / `input`: `type`・`disabled`・`checked` / `td`: `data-label` / `pre`・`table`: `tabindex`・`aria-label` / `div`: `data-mdmark-slot`・`data-mdmark-args`・`role`（値は `status` だけ）'
      - key: allowedClasses
        value: '`code`: `language-*` / `li`: `task-list-item` / `th`・`td`: `mdmark-align-*` / `div`: `mdmark-embed`。ここに無い要素は class を持てない（`allowedAttributes` に `class` を載せない）'
      - key: allowedSchemes
        value: '`http`・`https`・`mailto`（相対 URL は既定で許す）'
      - key: parseStyleAttributes
        value: '`false`（postcss を呼ばない）'
      - key: transformTags
        value: '`*`: `style` の `text-align` の値が `ALIGN_VALUES` なら class `mdmark-align-{値}` を足し、`style` は常に消す。`data-source-line` は値が `^\d+$` の形でなければ消す / `img`: `src` が `data:` で始まり `data:image/(png|jpeg|gif|webp|svg+xml);base64,{base64 の文字}` の形でなければ `src` を消す / `input`: `type="checkbox"` と `disabled` を付け直し、`checked` だけを引き継ぐ / `pre`・`table`: `tabindex` があれば `"0"` にする'
      - key: allowedSchemesByTag
        value: '`img`: `http`・`https`・`data`（書き出しが画像を `data:` URL で埋めるため。残す `data:` URL の形は `transformTags` が絞る）'
  - name: SYNTAX_MARKS
    title: 記法の印と機能
    container: src/render/marks.ts
    summary: 記法の印の名前から、その記法の機能の名前を引く
    entries:
      - key: table
        value: table
      - key: tabs
        value: tabs
      - key: steps
        value: steps
      - key: section
        value: sections
      - key: row-detail
        value: row-details
      - key: fig
        value: figures
      - key: toc
        value: toc
      - key: glossary
        value: glossary
      - key: flow
        value: diagrams
      - key: sequence
        value: diagrams
      - key: chart
        value: diagrams
      - key: param
        value: diagrams
      - key: html
        value: html
      - key: view
        value: views
      - key: code
        value: code
  - name: EMBED_STYLES
    title: 埋め込んだ HTML の残す宣言
    container: src/render/sanitize.ts
    summary: 埋め込んだ HTML の要素の `style` に残す宣言の名前と、値の許可の正規表現。sanitize-html の `allowedStyles` には渡さず（postcss を差し替えているため）、`filterEmbeddedStyle` が使う。どの宣言も値に `url(`・`expression(`・単位 `vw`・`vh` を含むと落とす
    value: 下の entries
    entries:
      - key: display
        value: /^(block|inline|inline-block|flex|inline-flex|grid|inline-grid|none)$/
      - key: flex・flex-direction・flex-wrap・flex-grow・flex-shrink・flex-basis・align-items・justify-content・align-self
        value: キーワード・数値・長さ
      - key: grid-template-columns・grid-template-rows・grid-column・grid-row・gap・row-gap・column-gap
        value: キーワード・数値・長さ・`fr`・`repeat(`・`minmax(`
      - key: margin*・padding*
        value: 0 以上の長さ・`auto`（負の値は落とす。負の `margin` で枠の外へ出して重ねる表示を作らせない）
      - key: border*・border-radius
        value: 長さ・線の種類・色
      - key: width・max-width・min-width・height
        value: 長さ・割合・`auto`
      - key: color・background-color
        value: 色（`var(--mdmark-` で始まる変数を含む）
      - key: font-size・font-weight・text-align
        value: 長さ・割合・キーワード・数値
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[埋め込んだ HTML]
    status: planned
    introduced:
      pr: 45
functions:
  - name: render
    title: Markdown を HTML 文字列にする
    container: src/render/index.ts
    kind: 関数
    scope: public
    summary: 公開関数。設定に既定を当てて `renderDocument` を呼び、本文の HTML だけを返す
    args:
      - name: markdown
        type: string
        required: true
        description: HTML にする Markdown
      - name: opts
        type: '{ config?: MdmarkConfig; index?: MdmarkIndex; docId?: string; references?: MdmarkReferences; aliases?: MdmarkAlias[] }'
        required: false
        default: '{}'
        description: 設定・索引・描く文書の `id`・参照の表・エイリアス
    returns:
      type: string
      description: 本文の HTML 文字列
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定と機能.ts#functions[resolveConfig]
      - '#functions[renderDocument]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#
    unit_tests:
      - name: test_render
        case: 正常
        summary: 設定を渡さなくても本文の HTML を返す
        condition: '`# 見出し` だけの Markdown、`opts` 無し'
        mock: なし
        expected: 文字が `見出し` の `h1` を含む文字列
      - name: test_render_when_aliases
        case: 正常
        summary: 渡したエイリアスに下線と種類のツールチップを付けた文字列を返す
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（エイリアス）」のエイリアスと Markdown
        mock: なし
        expected: そのフローの期待値のうち、下線・ツールチップ・`script` と `<!--` が無いことが成り立つ
  - name: renderDocument
    title: 文書を描く
    container: src/render/index.ts
    kind: 関数
    scope: public
    summary: 描くごとに `nonce` を作って `env` に入れ、解析器で Markdown を HTML にし、`sanitize` をかけ、コアルールが決めた `env.features` と一緒に返す
    description: '`render` と `mount` が共通で使う。解析器はモジュールで 1 つだけ作り（`createParser` を初めて使うときに呼ぶ）、呼び出しごとの値は `env` で渡す。`nonce` は `crypto.getRandomValues` の 16 バイトを 16 進にしたもので、`sanitize` が出力から外すため、同じ入力には同じ文字列を返す'
    args:
      - name: options
        type: '{ markdown: string; config: ResolvedConfig; index?: MdmarkIndex; docId?: string; references?: MdmarkReferences; aliases?: MdmarkAlias[] }'
        required: true
        description: '`markdown` は Markdown、`config` は既定を当てた設定、`index`・`docId`・`references`・`aliases` は `env` に入れる値（`index` は `normalizeIndex` にかけてから入れる。`aliases` はそのまま入れ、使えるものへの絞り込みは `buildDictionary` が行う）。`config` の `libraries`・`features`・`labels` は `env` の `libraries`・`defaults`・`labels` に入れる'
    returns:
      type: RenderedDocument
      description: 本文の HTML と機能のオン・オフ
    callees:
      - '#functions[createParser]'
      - '#functions[sanitize]'
      - dev/設計書/モジュール構成/ライブラリ本体/設定と機能.ts#functions[resolveFeatures]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[normalizeIndex]
    unit_tests:
      - name: test_render_document
        case: 正常
        summary: 機能の印を重ねたオン・オフを返し、印は本文に残さない
        condition: '`<!-- features: -print -->` と段落。設定の `features` は `{ print: true }`'
        mock: なし
        expected: '`features` が `{ print: false }`、`html` に `<!--` が無い'
      - name: test_render_document_when_same_input
        case: 正常
        summary: 同じ入力には同じ文字列を返す（解析器を使い回しても前の呼び出しの印が残らない）
        condition: 印を持つ文書を 2 回描く
        mock: なし
        expected: 2 回の `html` と `features` が等しい
      - name: test_render_document_when_raw_html_imitates_syntax
        case: 正常
        summary: 生の HTML で書いた記法の class・data-*・id を落とし、記法が出したものは残す
        condition: '`<div class="mdmark-tabs" data-kind="data"><p id="fig-x">偽り</p></div>` と `> [!NOTE]` の引用'
        mock: なし
        expected: '`偽り` の段落に class・`data-kind`・`id` が無く、注意書きが `markdown-alert-note` を持ち、出力に `data-mdmark-own` が無い'
      - name: test_render_document_when_labels_given
        case: 正常
        summary: 設定の部品の文言で操作できる部品のボタンを描く
        condition: '`<!-- param -->` の範囲に `strength` の定義を置いた文書。設定の `labels` は `{ paramCopy: "コピー" }`'
        mock: なし
        expected: '`button.mdmark-param-copy` の文字が `コピー` で、`今の値を写す` が無い'
  - name: createParser
    title: 解析器を作る
    container: src/render/parser.ts
    kind: 関数
    scope: internal
    summary: '`html: true`・`linkify: true` の markdown-it に、足すコアルールを登録して返す'
    description: 'コアルールは `inline` の後に次の順で登録する: 印（`takeMarks`）→ 文書の機能（`resolveDocumentFeatures`）→ 見出し（`assignHeadingIds`）→ 用語集の表（`glossaryRule`）→ 行の詳細 → 表（`decorateTables`。今の表の属性もここ）→ タブ → ステップ → 注意書き → ファイルツリー → バッジ → コードブロック（`buildCodeBlocks`。図の部品・埋め込んだ HTML より後）→ 図表の番号 → 用語の下線（`termsRule`）→ 節 → 目次 → 関連文書の一覧（`backlinksRule`）→ タスクリスト → www の自動リンク → 残った印（`dropMarks`）→ 元の行番号（`markSourceLines`）。記法のコアルールは『記法』、用語と関連文書のコアルールは『索引と用語』。コードブロックの `pre` の属性は `renderer.rules.fence` を包んで付け、読み上げの名前はエスケープする（部品『HTML の特別な文字をエスケープする』）。www の自動リンクは `linkify.set({ fuzzyLink: true })` にし、スキームも `www.` もメールの `@` も持たない自動リンクを文字に戻す'
    returns:
      type: MarkdownIt
      description: 解析器
    unit_tests:
      - name: test_create_parser_when_task_list
        case: 正常
        summary: タスクリストの項目をチェックボックスにする
        condition: '`- [x] 済み` と `- [ ] 未`'
        mock: なし
        expected: '`li` が class `task-list-item` を持ち、頭に `<input type="checkbox" disabled checked>` と `<input type="checkbox" disabled>` があり、`[x]`・`[ ]` の文字が残らない'
      - name: test_create_parser_when_autolink
        case: 正常
        summary: www はリンクにし、スキームも www も無いドメインはリンクにしない
        condition: '`www.example.com と example.com と https://example.org`'
        mock: なし
        expected: '`href="http://www.example.com"` と `href="https://example.org"` の 2 つだけがリンク'
      - name: test_create_parser_when_strikethrough
        case: 正常
        summary: 取り消し線を `del` にする
        condition: '`~~消す~~`'
        mock: なし
        expected: '`<del>消す</del>`（`<s>` が無い）'
      - name: test_create_parser_when_table
        case: 正常
        summary: 表に読み上げの名前と `tabindex`、セルに列名を付ける
        condition: '`## 変数` の後に、見出しが `**列A**` と `列B` の表'
        mock: なし
        expected: '`<table tabindex="0" aria-label="表: 変数">`、`td` が `data-label="列A"` と `data-label="列B"` を持つ'
      - name: test_create_parser_when_table_without_heading
        case: 正常
        summary: 直前に見出しが無ければ読み上げの名前は `表`
        condition: 見出しの無い文書の表
        mock: なし
        expected: '`aria-label="表"`'
      - name: test_create_parser_when_code_block
        case: 正常
        summary: コードブロックの `pre` に読み上げの名前と `tabindex` を付ける
        condition: 情報文字列 `ts` のコードブロックと、情報文字列の無いコードブロック
        mock: なし
        expected: '`<pre tabindex="0" aria-label="コード: ts"><code class="language-ts">` と `<pre tabindex="0" aria-label="コード">`'
      - name: test_create_parser_when_info_has_quote
        case: 正常
        summary: 情報文字列に `"` があっても、コードブロックの読み上げの名前が途中で切れない
        condition: 情報文字列 `ts"x` のコードブロック
        mock: なし
        expected: '`aria-label="コード: ts&quot;x"`'
  - name: takeMarks
    title: 印を拾って置き換える
    container: src/render/marks.ts
    kind: 関数
    scope: internal
    summary: コアルール。`html_block`・`html_inline` のトークンの印を拾い、`features` は引数を `env.featureArgs` へ足し、対応表と登録した拡張の名前は `renderEmbed` の HTML（`markOwn` を掛ける）に置き換え、印だけの `html_block` の記法の印は印のトークン（type `mdmark_mark`、`meta` に `Mark`）に替え、それ以外は取り除く
    description: コードブロックと行内のコードは `html_*` のトークンにならないため、中の印のような文字はそのまま残る。記法の印は機能のオン・オフによらず印のトークンにし、オフの記法の印は `dropMarks` が取り除く
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態（`state.env` は `RenderEnv`）
    side_effects: '`state.tokens` の中身と `state.env.featureArgs` を書き換える'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderEmbed]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[markOwn]
      - dev/設計書/モジュール構成/ライブラリ本体/拡張.ts#functions[extensionFor]
      - '#functions[parseMarkArgs]'
    unit_tests:
      - name: test_take_marks
        case: 正常
        summary: 機能の印の引数を書いた順に拾い、本文から取り除く
        condition: '行頭の `<!-- features: +a -b -->` と、文中の `<!-- features: +c -->`'
        mock: なし
        expected: '`env.featureArgs` が `["+a", "-b", "+c"]`、描いた HTML に印が無い'
      - name: test_take_marks_when_library_mark
        case: 正常
        summary: 対応表にある印を印の場所の要素にする
        condition: '`<!-- test-lib: a b -->`、対応表に `test-lib`'
        mock: なし
        expected: '`renderEmbed({ name: "test-lib", args: ["a", "b"] })` の HTML が入る'
      - name: test_take_marks_when_unknown_mark
        case: 正常
        summary: 未知の印を取り除き、印でないコメントとコードの中はそのままにする
        condition: '`<!-- unknown: 1 -->`・`<!-- ただのコメント -->`・コードブロックの中の `<!-- features: -print -->`'
        mock: なし
        expected: '`unknown` が消え、コードブロックの中は文字として残り、`env.featureArgs` は空'
      - name: test_take_marks_when_syntax_mark
        case: 正常
        summary: 記法の印と閉じの印、コロンの無い印を印のトークンにする
        condition: '行に `<!-- table: data -->`・`<!-- /table -->`・`<!-- tabs -->`'
        mock: なし
        expected: '印のトークンが 3 つで、`meta` が `{ name: "table", closing: false }`・`{ name: "table", closing: true }`・`{ name: "tabs", args: { args: [], keys: {} } }`'
      - name: test_take_marks_when_extension_mark
        case: 正常
        summary: 登録した拡張の印を印の場所の要素にする
        condition: '`greet` を登録し、`<!-- greet: world lang=ja -->`'
        mock: なし（テストの前後で `resetExtensions`）
        expected: '`renderEmbed({ name: "greet", args: ["world", "lang=ja"] })` の HTML が入る'
  - name: sanitize
    title: 許可していないものを落とす
    container: src/render/sanitize.ts
    kind: 関数
    scope: internal
    summary: '`SANITIZE_OPTIONS` に `nonce` を見る `transformTags` を足して sanitize-html を呼ぶ。`data-mdmark-own` が `nonce` と等しい要素は記法の class・`data-*`・`id`・`role`・`aria-*` を残して属性だけを外し（mdmark が出した要素の `style` は、図の部品の位置・大きさ・倍率（`DIAGRAM_STYLE_PATTERN`）か、コードブロックの `code` の行番号の桁の数（`--mdmark-code-digits: {数字}`）か、埋め込んだ HTML の中の要素の `filterEmbeddedStyle` の宣言だけを残す）、それ以外の要素からは記法の class（`mdmark-` で始まる記法のものと `markdown-alert*`）・記法の `data-*`・`id` を落とす。`data-source-line` は誰が出した要素でも、値が 0 以上の整数のときだけ残す'
    args:
      - name: html
        type: string
        required: true
        description: 解析器の出した HTML
      - name: nonce
        type: string
        required: true
        description: この描画の `env.nonce`
    returns:
      type: string
      description: 落とした後の HTML
    unit_tests:
      - name: test_sanitize
        case: 正常
        summary: スクリプトと `style` を落とし、折り畳みを残す
        condition: '`<script>`・`<a onclick="x" href="javascript:x">`・`<p style="position:fixed">`・`<details><summary>`'
        mock: なし
        expected: '`script`・`onclick`・`javascript:`・`style` が無く、`details` と `summary` が残る'
      - name: test_sanitize_when_align
        case: 正常
        summary: 列の揃えを class に移す
        condition: '`<td style="text-align:right">` と `<td style="text-align:justify;color:red">`'
        mock: なし
        expected: 前者が `class="mdmark-align-right"`、後者は class も `style` も持たない
      - name: test_sanitize_when_input
        case: 正常
        summary: 入力欄を無効のチェックボックスに付け直す
        condition: '`<input type="text" value="x">` と `<input type="checkbox" checked>`'
        mock: なし
        expected: '`<input type="checkbox" disabled />` と `<input type="checkbox" disabled checked />`'
      - name: test_sanitize_when_classes
        case: 正常
        summary: 許した要素の許した class だけを残し、`role` は `status` だけを残す
        condition: '`<code class="language-ts evil">`・`<div class="mdmark-embed other" data-mdmark-slot="x" role="status">`・`<p class="x">`・`<div class="mdmark-embed" role="alert">`'
        mock: なし
        expected: '`class="language-ts"` と `class="mdmark-embed"`。`data-mdmark-slot` と `role="status"` は残る。`<p>` は class を持たず、`role="alert"` が無い（値の無い `role` 属性は残る）'
      - name: test_sanitize_when_tabindex
        case: 正常
        summary: 文書に書いた `tabindex` を 0 にする
        condition: '`<table tabindex="5">`'
        mock: なし
        expected: '`<table tabindex="0">`'
      - name: test_sanitize_when_data_image
        case: 正常
        summary: 画像の種類と base64 の形の `data:` URL だけを画像の `src` に残す
        condition: '`<img src="data:image/png;base64,iVBORw0KGgo=">`・`<img src="data:text/html;base64,PHNjcmlwdD4=">`・`<img src="data:image/svg+xml,<svg/>">`・`<a href="data:image/png;base64,iVBORw0KGgo=">`'
        mock: なし
        expected: 1 つ目の `img` だけが `src` を持ち、2 つ目と3 つ目の `img` は `src` を持たず、`a` は `href` を持たない
      - name: test_sanitize_when_own_style
        case: 正常
        summary: 自分が出した要素の style は図の部品と埋め込んだ HTML の許した宣言だけ残し、書いた要素の style は落とす
        condition: '`data-mdmark-own` が `nonce` と等しい図の箱の `<div class="mdmark-diagram-node" style="left:10px;top:20px">` と、`div.mdmark-html` の中の `<div style="display:flex;position:fixed">`、持たない `<div style="display:flex">`'
        mock: なし
        expected: 図の箱が `style="left:10px;top:20px"`、埋め込んだ HTML の要素が `style="display:flex"`、書いた要素は `style` を持たない
      - name: test_sanitize_when_code_digits
        case: 正常
        summary: 自分が出したコードブロックの行番号の桁の数だけを残す
        condition: '`data-mdmark-own` が `nonce` と等しい `<code style="--mdmark-code-digits: 2">` と `<code style="--mdmark-code-digits: 2; color: red">`、持たない `<code style="--mdmark-code-digits: 2">`'
        mock: なし
        expected: 1 つ目が `style="--mdmark-code-digits:2"`、2 つ目と 3 つ目は `style` を持たない
      - name: test_sanitize_when_source_line
        case: 正常
        summary: 元の行番号は整数のときだけ残す
        condition: '`<p data-source-line="3">`・`<td data-source-line="12">`・`<p data-source-line="x">`'
        mock: なし
        expected: 1 つ目と 2 つ目は属性が残り、3 つ目は `data-source-line` を持たない
  - name: parseMarkArgs
    title: 印の引数を読み分ける
    container: src/render/marks.ts
    kind: 関数
    scope: internal
    summary: 引数の文字を空白で区切り、`キー=値` を `keys`（同じキーは後の値）、それ以外を書いた順に `args` に入れる
    args:
      - name: text
        type: string
        required: true
        description: 印の `:` の後ろの文字（無ければ空）
    returns:
      type: MdmarkMarkArgs
      description: 読み分けた引数
    unit_tests:
      - name: test_parse_mark_args
        case: 正常
        summary: 種類・機能・キー・開閉を読み分ける
        condition: '`data +sort -pin filter=名前:text closed`'
        mock: なし
        expected: '`{ args: ["data", "+sort", "-pin", "closed"], keys: { filter: "名前:text" } }`'
      - name: test_parse_mark_args_when_empty
        case: 正常
        summary: 引数が無ければ空
        condition: 空の文字
        mock: なし
        expected: '`{ args: [], keys: {} }`'
  - name: resolveDocumentFeatures
    title: 文書の機能を決める
    container: src/render/marks.ts
    kind: 関数
    scope: internal
    summary: コアルール。`takeMarks` の後に `resolveFeatures` で `env.defaults` に `env.featureArgs` を重ね、`env.features` に入れる
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`env.features` を書き換える'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定と機能.ts#functions[resolveFeatures]
  - name: dropMarks
    title: 残った印を取り除く
    container: src/render/marks.ts
    kind: 関数
    scope: internal
    summary: コアルール。最後に、記法が使わなかった印のトークン（オフの記法の印を含む）を取り除く
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    side_effects: '`state.tokens` を書き換える'
    unit_tests:
      - name: test_drop_marks
        case: 正常
        summary: オフの記法の印を取り除き、囲んだ Markdown は残す
        condition: '`<!-- features: -tabs -->` と、段落を囲んだ `<!-- tabs -->` 〜 `<!-- /tabs -->`'
        mock: なし
        expected: 段落があり、印のトークンと `<!--` が無い
  - name: sanitizeEmbedded
    title: 埋め込んだ HTML を落とす
    container: src/render/sanitize.ts
    summary: 埋め込んだ HTML の中身を `SANITIZE_OPTIONS` に `button`・`data-hint`・`style` を足した設定で落とし、`style` は `transformTags` で `filterEmbeddedStyle` に通す。`button` は `type="button"` に付け直し `form` で始まる属性を落とし、書いた人の class・`id`・`data-hint` 以外の `data-*`・`role`・`aria-*` を落とす。`textFilter` で文字を `onText` に渡し、返った HTML に置き換える（用語の下線。`a`・`code`・`pre`・見出しの中は渡さない）
    kind: 関数
    scope: internal
    args:
      - name: html
        type: string
        required: true
        description: コードブロックの中身（図の部品の custom element を置き換えた後）
      - name: onText
        type: '(text: string) => string'
        required: true
        description: 文字（エスケープ済み）を受け、置き換える HTML を返す関数
    returns:
      type: string
      description: 落とした後の HTML
    unit_tests:
      - name: test_sanitize_embedded
        case: 正常
        summary: スクリプトを落とし、ボタンと data-hint を残す
        condition: '`<script>`・`<button onclick="x" type="submit" formaction="/x">`・`<div data-hint="説明" data-x="1" class="evil">`'
        mock: なし
        expected: '`script`・`onclick`・`formaction`・`data-x`・`class` が無く、`<button type="button">` と `data-hint="説明"` が残る'
      - name: test_sanitize_embedded_when_style
        case: 正常
        summary: style を filterEmbeddedStyle で絞る
        condition: '`style="display: flex; position: fixed"` と `style="position: fixed"`'
        mock: なし
        expected: 前者が `style="display:flex"`、後者は `style` を持たない
      - name: test_sanitize_embedded_when_text
        case: 正常
        summary: 本文の文字だけを onText に渡す
        condition: '`<p>索引</p><a href="#">索引</a><code>索引</code>`、`onText` は `索引` を `<span class="t">索引</span>` にする'
        mock: なし
        expected: '`p` の中だけが置き換わり、`a` と `code` の中は文字のまま'
    refs:
      - '#constants[EMBED_STYLES]'
      - '#constants[SANITIZE_OPTIONS]'
    status: planned
    introduced:
      pr: 45
  - name: filterEmbeddedStyle
    title: 埋め込んだ HTML の style を絞る
    container: src/render/sanitize.ts
    summary: '`style` の値を `;` で宣言に分け、宣言ごとに `:` の前を名前、後ろを値として `EMBED_STYLES` の名前と値の正規表現で絞り、残った宣言を `名前:値` を `;` でつないで組み直す。値に `/*`・引用符・`\` を含む宣言は落とす。postcss を使わない（`DIAGRAM_STYLE_PATTERN` と同じ作り）'
    kind: 関数
    scope: internal
    args:
      - name: style
        type: string
        required: true
        description: 要素の `style` の値
    returns:
      type: string
      description: 残した宣言をつないだ値。残る宣言が無ければ空の文字で、呼び元は `style` を消す
    unit_tests:
      - name: test_filter_embedded_style
        case: 正常
        summary: 許した宣言だけを残す
        condition: '`display: flex; gap: 12px; position: fixed; background-image: url(https://example.com/a.png); width: 100vw; color: var(--mdmark-color-accent); margin-top: -9999px; padding: 4px`'
        mock: なし
        expected: '`display:flex;gap:12px;color:var(--mdmark-color-accent);padding:4px`（負の `margin-top` は落ちる）'
      - name: test_filter_embedded_style_when_tricky
        case: 異常
        summary: コメントと引用符を含む宣言を落とす
        condition: '`color: red /* x */; font-size: "12px"; padding: 4px`'
        mock: なし
        expected: '`padding:4px`'
    refs:
      - '#constants[EMBED_STYLES]'
    status: planned
    introduced:
      pr: 45
  - name: findMarks
    title: 文書の印を拾う
    container: src/render/parser.ts
    usecase: 設定と索引を点検する
    summary: Markdown の生の HTML のブロックと行内の HTML から `MARK_PATTERN` に当たる印を拾い、名前と行の番号を書いた順に返す
    description: '`createParser` と同じ設定（`html: true`・`linkify: true`）の markdown-it で、足すコアルールを登録せずに解析する（コードブロックとインラインコードの中は `html_block`・`html_inline` にならないため拾わない）。行の番号は 1 からで、`html_block` はトークンの `map` の開始行に印より前の改行の数を足し、`html_inline` は親の `inline` の `map` の開始行（表のセルのように `map` が `null` のときは直前の `tr_open` の `map` の開始行）に、印より前の子の `softbreak`・`hardbreak` の数と、印より前の子の `html_inline` の内容の改行の数と、同じ `html_inline` の中で印より前の改行の数を足す。閉じの印も 1 つの印として返す'
    kind: 関数
    scope: public
    args:
      - name: markdown
        type: string
        required: true
        description: 文書の Markdown
    returns:
      type: '{ name: string; line: number }[]'
      description: 拾った印の名前と行の番号
    unit_tests:
      - name: test_find_marks
        case: 正常
        summary: ブロックと行内の印を行の番号つきで拾う
        condition: '1 行目が `# 題`、3 行目が `<!-- tabz -->`、5・6 行目が `段落` と `続き <!-- note: a --> と <!-- /note -->`'
        mock: なし
        expected: '`[{ name: "tabz", line: 3 }, { name: "note", line: 6 }, { name: "note", line: 6 }]`'
      - name: test_find_marks_when_code
        case: 正常
        summary: コードブロックとインラインコードの中の印は拾わない
        condition: '`markdown` のコードブロックの中の `<!-- tabz -->` と、段落の中のインラインコード `` `<!-- tabz -->` ``'
        mock: なし
        expected: 空の配列
      - name: test_find_marks_when_multiline_block
        case: 正常
        summary: 複数行の HTML のブロックの中の印の行を数える
        condition: 2 行目から `<div>`・`<!-- tabz -->`・`</div>` の 3 行のブロック
        mock: なし
        expected: '`[{ name: "tabz", line: 3 }]`'
      - name: test_find_marks_when_table_cell
        case: 正常
        summary: 表のセルの中の印の行を行の番号で返す
        condition: 1・2 行目が表の見出しと区切り、3 行目が `| 1 <!-- tabz --> | 2 |`
        mock: なし
        expected: '`[{ name: "tabz", line: 3 }]`'
      - name: test_find_marks_when_multiline_inline_html
        case: 正常
        summary: 前に複数行の行内の HTML がある印の行を数える
        condition: 1・2 行目が `p <a` と `href="x">l</a> <!-- c -->`
        mock: なし
        expected: '`[{ name: "c", line: 2 }]`'
    refs:
      - '#constants[MARK_PATTERN]'
      - '#functions[createParser]'
    status: planned
    introduced:
      pr: 64
  - name: markSourceLines
    title: 元の行番号を付ける
    kind: 関数
    container: src/render/parser.ts
    usecase: 文書を描く
    summary: コアルール。`map` を持つブロックの開始のトークンに、`map[0]` を `data-source-line` で付ける
    description: 対象は `block` が `true` で `map` を持ち、`nesting` が `1`（見出し・段落・リスト・リストの項目・表・表の行・引用）か `0`（`hr`・`code_block`）のトークンで、`attrSet("data-source-line", String(map[0]))` を呼ぶ。`fence` は `createParser` が包んだ `renderer.rules.fence` が、帯で包むコードブロックでは外側の `div.mdmark-code` に、帯で包まないコードブロック（`code` がオフ）では `pre` に付ける。記法のコアルールが印の範囲を置き換えた `html_block`（`ownBlock`。開きの印のトークンの `map` を写す）は、HTML の最初の開始タグに属性を差し込む。文書に書いた生の HTML の `html_block` は変えない
    scope: internal
    side_effects: '`state.tokens` の属性と `html_block` の `content` を書き換える'
    args:
      - name: state
        type: StateCore
        required: true
        description: markdown-it の状態
    unit_tests:
      - name: test_mark_source_lines
        case: 正常
        summary: ブロックごとに始まる行の 0 始まりの番号を付ける
        condition: 1 行目 `# 見出し`、3 行目から段落、5 行目から 2 項目のリスト、8 行目から引用、10 行目 `---` を `render` で描く
        mock: なし
        expected: '`<h1 data-source-line="0"`・`<p data-source-line="2"`・`<ul data-source-line="4"` と項目の `<li data-source-line="4"`・`<li data-source-line="5"`・`<blockquote data-source-line="7"`・`<hr data-source-line="9"`'
      - name: test_mark_source_lines_when_table_and_code
        case: 正常
        summary: 表と表の行、コードブロックに付ける
        condition: 1 行目から見出し行と 2 行の表、6 行目から情報文字列 `ts` のコードブロック
        mock: なし
        expected: '`<table data-source-line="0"`、本体の `tr` が `data-source-line="2"` と `"3"`、コードブロックを包む `div.mdmark-code` が `data-source-line="5"`'
      - name: test_mark_source_lines_when_mark_range
        case: 正常
        summary: 印の範囲を囲む要素と注意書きに開きの印の行を付け、中のブロックにもそれぞれの行を付ける
        condition: '1 行目 `<!-- table: data -->`、3 行目から表、6 行目 `<!-- /table -->`、8 行目から `> [!NOTE]` の注意書き'
        mock: なし
        expected: 表を囲む要素が `data-source-line="0"`、中の `table` が `data-source-line="2"`、注意書きの外側の要素が `data-source-line="7"`
      - name: test_mark_source_lines_when_raw_html
        case: 正常
        summary: 文書に書いた生の HTML のブロックは変えない
        condition: 1 行目 `<div class="x">地</div>`
        mock: なし
        expected: '`div` が `data-source-line` を持たない'
    callers:
      - '#functions[createParser]'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[元の行番号]
    status: planned
    introduced:
      pr: 69
test_files:
  - tests/unit/src/render/index.test.ts
  - tests/unit/src/render/parser.test.ts
  - tests/unit/src/render/marks.test.ts
