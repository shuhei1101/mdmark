  - name: changedPathsSince
    title: 比べる基準から変わったファイルを引く
    kind: 関数
    container: src/cli/git.ts
    usecase: 設定と索引を点検する
    summary: git の ref と HEAD の merge-base から作業ツリーまでに変わったファイルと、git が管理していない新しいファイルを、索引のフォルダからの相対パスで返す
    description: git は `node:child_process` の `execFile` で引数を配列にして呼び、シェルを通さない。出力は `-z` の NUL 区切りで読む。パスの区切りは `/` にそろえる
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ cwd: string; base: string; indexDir: string }'
        required: true
        description: git を呼ぶフォルダ（設定ファイルのフォルダ）・比べる基準の ref・索引のファイルのフォルダの絶対パス
    returns:
      type: Promise<string[]>
      description: 変わったファイルと新しいファイルの、索引のフォルダからの相対パス（重なりを除く）
    process: |-
      1. `base` が `-` で始まれば、引けないものとして例外にする
      2. `cwd` で `git rev-parse --show-toplevel` を呼び、リポジトリの直下を得る。git が無い・リポジトリの中に無ければ例外にする
      3. リポジトリの直下で `git merge-base {base} HEAD` を呼ぶ。失敗したら例外にする
      4. `git diff --name-only -z {merge-base}` で merge-base から作業ツリーまでに変わったファイルを、`git ls-files --others --exclude-standard -z` で git が管理していない新しいファイル（無視するファイルを除く）を引く
      5. 両方をリポジトリの直下から解き、`indexDir` からの相対パスにして重なりを除いて返す
    exceptions:
      - name: CliError
        condition: '`base` が `-` で始まる・git が無い・`cwd` が git のリポジトリの中に無い・`base` と HEAD の merge-base を引けない'
        message: '比べる基準 {base} を引けません（{理由}）。ref を直すか、履歴を取得してください（CI の checkout は fetch-depth: 0）。'
    unit_tests:
      - name: test_changed_paths_since
        case: 正常
        summary: merge-base からのコミット済み・未コミットの変更と新しいファイルを、索引のフォルダからのパスで返す
        condition: '`docs/a.md`・`docs/b.md`・`docs/c.md` と `.gitignore`（`*.log`）をコミットしてタグ `base` を付け、`docs/a.md` を書き換えてコミットし、`docs/b.md` をコミットせずに書き換え、`docs/d.md` と `docs/x.log` を新しく置く。`base: "base"`、`indexDir` が `docs`'
        mock: なし（一時フォルダの git のリポジトリ）
        expected: 並びを問わず `a.md`・`b.md`・`d.md` の 3 つ
      - name: test_changed_paths_since_when_ref_unknown
        case: 異常
        summary: merge-base を引けない ref
        condition: '`test_changed_paths_since` と同じリポジトリ、`base: "no-such-ref"`'
        mock: なし（一時フォルダの git のリポジトリ）
        expected: '`CliError` を投げ、メッセージに `no-such-ref` と `fetch-depth` が入る'
        exception: merge-base を引けない
      - name: test_changed_paths_since_when_not_repository
        case: 異常
        summary: git のリポジトリの中に無いフォルダ
        condition: 'git を初期化していない一時フォルダ、`base: "main"`'
        mock: なし（一時フォルダ）
        expected: '`CliError` を投げ、メッセージに `main` が入る'
        exception: リポジトリの中に無い
      - name: test_changed_paths_since_when_ref_starts_with_dash
        case: 異常
        summary: '`-` で始まる ref を git の引数に渡さない'
        condition: '`test_changed_paths_since` と同じリポジトリ、`base: "--output=x"`'
        mock: なし（一時フォルダの git のリポジトリ）
        expected: '`CliError` を投げ、リポジトリに `x` のファイルができていない'
        exception: '`base` が `-` で始まる'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[変わった文書]
    status: planned
    introduced:
      pr: 127
  - name: validateAliasRows
    title: エイリアスの行を Schema で検める
    container: src/cli/alias-schema.ts
    usecase: 共通
    summary: 設定の `aliases` の配列に、取り込んだ alias-inject の `aliases.schema.json` を ajv で当て、ずれを日本語の 1 文の `schema` のずれにする
    description: '`new Ajv2020({ allErrors: true, strict: true, verbose: true })` に `schemas/alias-inject/v0.2.0/aliases.schema.json` を読み込んで作った検査の関数を、モジュールの中で 1 回だけ作って使い回す（`$data` は使わない）。この Schema は alias-inject v0.2.0 の `aliases.schema.yaml` を内容を変えず JSON にして置き（他の `schemas/` と同じく JSON で持ち、esbuild がそのまま束ねる）、`schemas/mdmark.config.schema.json` の `aliases` から相対の `$ref` で指す。Schema を変えるので `migrations/no-steps.yaml` に `next` の行を置く。ajv のエラーのうち、`anyOf` の枝のエラーは、枝の判別子（`type` の `const`）に合う枝のものだけを残す（`schemaPath` の枝の番号で絞る。判別子に合う枝が無ければ、判別子の `const` の値を並べた 1 件にする）。`instancePath` の `/1/metadata/alias_type` を `aliases[1].metadata.alias_type` の形にして `where` にする。`message` は `keyword`・`params`・`parentSchema.title` から組む: `required` は ``\`{where}\` に `{missingProperty}`（{子の title}）がありません。記載してください。``、`type` は ``\`{where}\`（{title}）は{型}にしてください。``（型は `文字列`・`真偽値`・`配列`・`オブジェクト`）、`minLength`・`minItems` は ``\`{where}\`（{title}）が空です。記載してください。``、`const`・`enum` は ``\`{where}\`（{title}）は {値を `・` で並べた} のどれかにしてください。``、`additionalProperties` は ``\`{where}\` の `{additionalProperty}` は記載できません。消してください。``、ほかは ``\`{where}\`（{title}）が Schema に合いません（{ajv の message}）。``（`where` が空なら `aliases`）。1 つの場所に同じ文が重なるときは 1 件にする。ずれのある行は返す行で `null` に置き換え、行の位置を保つ。引数を書き換えない'
    kind: 関数
    scope: public
    args:
      - name: rows
        type: unknown[]
        required: true
        description: 設定の `aliases` の配列
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
    returns:
      type: '{ rows: unknown[]; issues: CheckIssue[] }'
      description: Schema に合わない行を `null` にした行の並びと、`schema` のずれ（並びは行の順、行の中は ajv が返した順）
    refs:
      - dev/設計書/外部ライブラリ/ajv.yaml#
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[エイリアスの点検]
    unit_tests:
      - name: test_validate_alias_rows
        case: 正常
        summary: Schema に合う行はずれにせず、そのまま返す
        condition: '`{id: terms, paths: [aliases/*.yaml], metadata: {alias_type: {type: ref, field: alias_type}}}` の 1 行'
        mock: なし
        expected: '`issues` が空、`rows` が渡した行と同じ'
      - name: test_validate_alias_rows_when_required_missing
        case: 異常
        summary: 必須のキーが無い行を、キーの title を入れた 1 文にする
        condition: '`paths` の無い行'
        mock: なし
        expected: '`where` が `aliases[0]`、`message` に `paths` と `読む YAML` が入り、`rows[0]` が `null`'
      - name: test_validate_alias_rows_when_any_of_branch
        case: 異常
        summary: anyOf の枝のエラーを判別子に合う枝のものだけにする
        condition: '`metadata.alias_type` が `{type: ref}`（`field` が無い）'
        mock: なし
        expected: ずれが 1 件で `where` が `aliases[0].metadata.alias_type`、`message` に `field` が入り、`custom` の枝の `value` を求める文が無い
      - name: test_validate_alias_rows_when_discriminator_unknown
        case: 異常
        summary: 判別子がどの枝にも合わなければ、許す値を並べた 1 件にする
        condition: '`metadata.alias_type` が `{type: copy, field: alias_type}`'
        mock: なし
        expected: ずれが 1 件で、`message` に `ref` と `custom` が入る
    status: planned
    introduced:
      pr: 176
  - name: loadAliases
    title: エイリアスを読む
    container: src/cli/aliases.ts
    usecase: 共通
    summary: 設定の `aliases` の行の `paths` を設定ファイルのフォルダから引いて YAML を読み、`buildAliases` に渡して、エイリアスとずれを返す
    description: '`check`・`export`・`build` が共通で使う。オブジェクトで `enabled` が `false` でない行ごとに、`paths` の各 glob を `node:fs/promises` の `glob`（`cwd` は設定ファイルのフォルダ。`globFiles` と同じやり方）で引き、当たったファイルを重ねずパスの順に並べる。当たるファイルが 0 件の行は `alias_no_files`（`file` は設定ファイル、`where` は `aliases[{行の位置}].paths`、`message` は ```{paths を `・` で並べた}` に当たるファイルがありません。`paths` を直してください。``）にする。当たったファイルは `yaml` で読み、読めないファイルは `alias_unreadable`（`file` はそのファイル、`where` は空、`message` は `loadConfig` と同じ形の ``{行} 行目を YAML として読めません（{理由}）。字下げと書き方を直してください。``）にしてそのファイルを使わない。読めたファイルを `MdmarkAliasSource`（`path` は設定ファイルのフォルダからの相対パス）にして、`config.aliases` の行と一緒に `buildAliases`（`configFile` は設定ファイルの名前）に渡し、返った `problems` を `CheckIssue` にする。ずれの並びは行の順で、行ごとに `alias_no_files`・`alias_unreadable` をその行の場所に置き、`buildAliases` の `problems` はその後ろに返った順で置く。設定に `aliases` が無ければファイルを読まず `{ aliases: undefined, issues: [] }` を返す'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: loaded
        type: LoadedConfig
        required: true
        description: 読んだ設定（`config.aliases` は `validateConfig` が Schema に合わない行を `null` にしたもの）
    returns:
      type: 'Promise<{ aliases: MdmarkAlias[] | undefined; issues: CheckIssue[] }>'
      description: 作ったエイリアス（`env` を含まない）と、エイリアスのずれ
    callees:
      - 索引と用語.ts#functions[buildAliases]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[エイリアスの点検]
    unit_tests:
      - name: test_load_aliases
        case: 正常
        summary: 行の paths の YAML を読んでエイリアスを作る
        condition: '`aliases` に `paths: [aliases/*.yaml]` の 1 行、`aliases/a.yaml` に `command` のレコード 1 件と `env` のレコード 1 件'
        mock: 一時フォルダ
        expected: '`aliases` が `command` の 1 件、`issues` が空'
      - name: test_load_aliases_when_no_files
        case: 異常
        summary: 当たるファイルが無い行を alias_no_files にする
        condition: '`paths: [missing/*.yaml]` の行'
        mock: 一時フォルダ
        expected: '`issues` が 1 件で `kind` が `alias_no_files`、`where` が `aliases[0].paths`、`message` に `missing/*.yaml` が入る'
      - name: test_load_aliases_when_unreadable
        case: 異常
        summary: YAML として読めないファイルを alias_unreadable にして使わない
        condition: '`aliases/a.yaml` が字下げの崩れた YAML、`aliases/b.yaml` が読める YAML'
        mock: 一時フォルダ
        expected: '`alias_unreadable` が 1 件で `file` が `aliases/a.yaml`、`aliases` に `b.yaml` のレコードだけが入る'
      - name: test_load_aliases_when_disabled_or_null
        case: 正常
