      4. URL を読む関数を `cacheFetchText` で作って埋めるものを用意し、配布物を読み、起動の処理と埋めるモジュールを 1 つのスクリプトに束ねて HTML を組み立てて書く（埋めるものを用意する・配布物を読む・起動の処理の入口を作る・起動の処理と埋めるモジュールを束ねる・HTML を書く）
