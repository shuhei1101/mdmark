        condition: '`side-toc.mode: fixed` を持つ設定と、`side-toc` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config["side-toc"]` が `{ mode: "fixed" }`、後者は `payload.config` が `side-toc` を持たない'
      - name: test_prepare_embeds_when_aliases
        case: 正常
        summary: エイリアスを payload に入れ、ずれを警告にする
        condition: インターフェース定義『文書をHTMLに書き出す』の「正常系（エイリアスを読み込む）」のフォルダ
        mock: 一時フォルダ
        expected: '`payload.aliases` が `command` の `run-test` の 1 件だけで `dev-server` を含まず、`warnings` に `alias_required_empty` の 1 件がある'
      - name: test_prepare_embeds_when_color_theme
        case: 正常
        summary: 設定の `colorTheme` を埋める設定にコピーし、知らない名前はコピーして警告する
        condition: '`colorTheme: theme-slate` の設定、`colorTheme: sepia` の設定、`colorTheme` を持たない設定'
        mock: 一時フォルダ
        expected: 1 つ目の `payload.config.colorTheme` が `theme-slate` で `warnings` が空。2 つ目は `sepia` で `warnings` に `sepia` を含む 1 件。3 つ目は `payload.config` が `colorTheme` を持たない
      - name: test_prepare_embeds_when_color_scheme
        case: 正常
        summary: 設定の `colorScheme` を埋める設定に写す
        condition: '`colorScheme: dark` の設定と、`colorScheme` を持たない設定'
        mock: 一時フォルダ
        expected: 1 つ目の `payload.config.colorScheme` が `dark`、2 つ目の `payload.config` が `colorScheme` を持たない
      - name: test_prepare_embeds_when_media
        case: 正常
        summary: 動画をコピーしてから画像を埋める
        condition: '`assets.root: assets` の設定、文書に `![操作](demo.mp4){poster=demo.png}` と `![図](a.png)`、`assets/` に 3 つのファイル、`out` が `guide.html`'
        mock: 一時フォルダ
        expected: '`guide_files/` に `demo.mp4` があり、`payload.docs[0].markdown` の `src` がコピーへの相対パスで、`poster` と画像が `data:` URL'
      - name: test_prepare_embeds_when_diagram_placement
        case: 正常
        summary: 設定の `tooltips.diagramPlacement` を埋める設定に写す
        condition: '`tooltips: { placement: bottom, diagramPlacement: top }` を持つ設定'
