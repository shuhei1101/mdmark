        type: string | undefined
        required: false
        description: '`--config` の値'
    returns:
      type: Promise<LoadedConfig>
      description: 形の合う設定
    exceptions:
      - name: CliError
        condition: 設定ファイルが無い・読めない・`validateConfig` のずれが 1 件以上
