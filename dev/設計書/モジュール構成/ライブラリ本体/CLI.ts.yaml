      - name: test_prepare_embeds_when_mermaid
        case: 正常
        summary: mermaid のコードブロックがある文書だけ mermaid を束ね、埋める設定に url を写さない
        condition: '文書に `mermaid` のコードブロック。設定の `mermaid` が `{ url: "vendor/mermaid.mjs", theme: "neutral" }`。もう 1 つは同じ設定で mermaid のコードブロックを持たない文書'
        mock: 一時フォルダの `vendor/mermaid.mjs` に既定のエクスポートを持つ手元のモジュールを置く
        expected: '前者の `embeds.mermaid` が `vendor/mermaid.mjs` の絶対パスで、`payload.config.mermaid` が `{ theme: "neutral" }`、`warnings` が空。後者は `embeds.mermaid` を持たない'
      - name: test_prepare_embeds_when_mermaid_unreadable
        case: 正常
        summary: mermaid を束ねられなければ警告にして埋めずに続ける
        condition: 文書に `mermaid` のコードブロック。設定の `mermaid.url` が無いファイル `missing/mermaid.mjs`
        mock: 一時フォルダ
        expected: '`embeds.mermaid` が無く、`warnings` に `missing/mermaid.mjs` と `mermaid.url` を含む 1 件'
      - name: test_prepare_embeds_when_syntax_language_unreadable
        case: 正常
        summary: 束ねられない言語だけ埋めずに警告にし、他の言語は埋める
        condition: 文書に `ts` と `yml` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js` だけに手元のモジュールを置き、`yaml.min.js` は置かない
        expected: '`embeds.syntax.languages` のキーが `typescript` だけで、`warnings` に `hl/languages/yaml.min.js` と `syntax.url` を含む 1 件'
