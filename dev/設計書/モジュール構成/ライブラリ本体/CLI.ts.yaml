  - name: prepareEmbeds
    title: 埋めるものを用意する
    container: src/cli/export.ts
    usecase: 共通
    summary: 文書の画像を埋め、印のある外部ライブラリと設定の拡張と色分けのモジュールが束ねられることを確かめて読み先を集め、`html-scripts` がオンの文書の範囲の `ts`・`js` を `compileHtmlScripts` で変えて `embeds.htmlScripts` に入れ、`theme` を読み、索引があれば参照の表を作って、書き出しの中身と警告を返す。設定に `assets.root` があれば設定ファイルのフォルダから解決し、文書ごとに `copyMedia`（書き出しの中で共有する `copied` を渡す）の後に `inlineImages` を呼ぶ。`bundle` では `inlineImages` に共有の表を渡し、埋めた画像を `payload.assets` に入れる。設定の `features` で `images`・`media` をオフにした文書も同じく扱う
    description: '`export` と `build` に共通の処理。埋める設定には、設定の `features`・`tooltips`・`side-toc`・`colorTheme`・`colorScheme`・`labels` をあるときだけ写す。`colorTheme` が `COLOR_THEMES` に無い名前のときも写したうえで、警告 `{設定ファイル}: 不明なテーマ名 {名前} です。既定の dev-swiss で描画します。` を 1 件出す。外部ライブラリ・拡張・色分けのモジュールは 1 つずつ `bundleModule` で束ねてみて、束ねられたものだけの読み先（URL はそのまま、パスは設定ファイルのあるフォルダを基準にした絶対パス）を `embeds` に入れる。同じ URL のモジュールは 1 回だけ束ねる。外部ライブラリと拡張で、束ねたコードに `hasDynamicImport` が当たるものは `embeds` に入れたうえで、警告 `{設定ファイル}: 拡張 \`{パス}\` は束ねた後も動的 import() が残り、blob: と動的 import を許さない環境では読み込めません。読む先をリテラルの文字列にしてください。`（外部ライブラリは `外部ライブラリ \`{印の名前}\``）を 1 件出す。文書の色分けの言語を `usedSyntaxLanguages` で拾い、1 つ以上あれば設定の `syntax.url`（無ければ `DEFAULT_SYNTAX_URL`）の `core.min.js` と言語ごとの `languages/{モジュール名}.min.js` を確かめて `embeds.syntax` に入れる（束ねたコードは esbuild の既定で頭の著作権表示を残す）。本体を束ねられなければ言語も確かめず `embeds.syntax` を持たない。言語のモジュールだけ束ねられなければ、その言語を `embeds.syntax.languages` に入れず、警告を 1 件出す（その言語のコードブロックは色分けせずに描く）。埋める設定には `syntax` を写さない（開いたときに外へ要求しない）。文書に mermaid のコードブロックがあるかを `usesMermaid` で見て、あれば設定の `mermaid.url`（無ければ `DEFAULT_MERMAID_URL`。パスは設定ファイルのあるフォルダを基準にした絶対パス）を束ねてみて `embeds.mermaid` に入れる。束ねられなければ `embeds.mermaid` を持たず、警告 `{設定ファイル}: mermaid \`{URL}\` を束ねられません（{理由}）。\`mermaid.url\` を直してください。` を 1 件出す（mermaid のコードブロックは開いたときに知らせの枠とコードブロックになる）。埋める設定には `mermaid` の `theme`・`themeVariables` だけを写し、`url` を写さない。設定に `aliases` があれば `loadAliases` の `aliases` を `payload.aliases` に入れ、`issues` は 1 件ずつずれを 1 行にした（`formatCheckIssue`）警告にする（終了コードは変えない）。警告は `{ファイル}: {内容}` の文字列で、読めない画像・絶対 URL の画像・束ねられないモジュールと拡張・束ねられない色分けのライブラリ（`{設定ファイル}: 色分けのライブラリ \`{URL}\` を束ねられません（{理由}）。\`syntax.url\` を直してください。`）・読めない `theme`・読めない索引の文書を出す'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 外部ライブラリの URL の先を読む
    args:
      - name: options
        type: "{ loaded: LoadedConfig; docs: Array<{ path: string; file: string }>; kind: 'document' | 'bundle'; entry: string; out: string; fetchText: FetchText }"
        required: true
        description: 読んだ設定、埋める文書のパスと絶対パス、種類、最初に開く文書、出力の HTML の絶対パス、URL を読む関数（`bundleViewer` と共有する `cacheFetchText` の関数）
    returns:
      type: 'Promise<{ payload: ExportPayload; embeds: ViewerEmbeds; themeCss?: string; warnings: string[] }>'
      description: 書き出しの中身・束ねるモジュールの読み先・使う側の CSS・警告
    unit_tests:
      - name: test_prepare_embeds
        case: 正常
        summary: 印のあるモジュールだけを束ね、拡張と theme を読む
        condition: '`libraries` に `test-lib`（印あり）と `other`（印なし）、`extensions` に 1 つ、`theme` あり'
        mock: 一時フォルダに手元のモジュールを置く
        expected: '`embeds.libraries` のキーが `test-lib` だけ、`embeds.extensions` が拡張の絶対パスの 1 件、`themeCss` があり、`warnings` が空'
      - name: test_prepare_embeds_when_unreadable
        case: 正常
        summary: 読めないものを警告にして続ける
        condition: '`test-lib` が無いファイルを指し、`theme` も無い'
        mock: 一時フォルダ
        expected: '`embeds.libraries` が空、`warnings` に `test-lib` と `theme` のパスが入る'
      - name: test_prepare_embeds_when_index
        case: 正常
        summary: 索引があれば参照の表と docId を入れる
        condition: 索引に `guide`（`guide.md`）と `api`（`api.md`、`related` に `guide`）
        mock: 一時フォルダ
        expected: '`payload.references.backlinks.guide` に `api` があり、`guide.md` の `docId` が `guide`'
      - name: test_prepare_embeds_when_tooltip_placement
        case: 正常
        summary: 設定の `tooltips` を埋める設定に写す
        condition: '`tooltips.placement: bottom` を持つ設定と、`tooltips` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.tooltips` が `{ placement: "bottom" }`、後者は `payload.config` が `tooltips` を持たない'
      - name: test_prepare_embeds_when_labels
        case: 正常
        summary: 設定の `labels` を埋める設定に写す
        condition: '`labels.paramCopy: コピー` を持つ設定と、`labels` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.labels` が `{ paramCopy: "コピー" }`、後者は `payload.config` が `labels` を持たない'
      - name: test_prepare_embeds_when_syntax
        case: 正常
        summary: 文書が使う言語だけ色分けのモジュールを束ね、埋める設定に `syntax` を写さない
        condition: 文書に `ts` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js`・`hl/languages/yaml.min.js` に手元のモジュールを置く
        expected: '`embeds.syntax.core` が `hl/core.min.js` の絶対パスで、`embeds.syntax.languages` のキーが `typescript` だけ。`payload.config` が `syntax` を持たず、`warnings` が空'
      - name: test_prepare_embeds_when_syntax_unreadable
