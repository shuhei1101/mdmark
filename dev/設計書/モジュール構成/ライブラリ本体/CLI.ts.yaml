  - name: requireConfig
    title: 書き出しに使う設定を読む
    container: src/cli/config.ts
    usecase: 共通
    summary: 端末の設定と上のフォルダの設定ファイルを重ねて読み、読めない・形が合わなければ `mdmark check` で確かめられることを添えた CliError を投げる
