    description: '`export` と `build` に共通の処理。埋める設定には、設定の `features`・`tooltips`・`side-toc`・`colorTheme` をあるときだけ写す。`colorTheme` が `COLOR_THEMES` に無い名前のときも写したうえで、警告 `{設定ファイル}: 不明なテーマ名 {名前} です。既定の dev-swiss で描画します。` を 1 件出す。同じ URL のモジュールは 1 回だけ束ねる。文書の色分けの言語を `usedSyntaxLanguages` で拾い、1 つ以上あれば設定の `syntax.url`（無ければ `DEFAULT_SYNTAX_URL`）の `core.min.js` と言語ごとの `languages/{モジュール名}.min.js` を `bundleModule` で束ねて `payload.syntax` に入れる（相対パスは設定ファイルのあるフォルダを基準に読む。束ねたコードは esbuild の既定で頭の著作権表示を残す）。本体を束ねられなければ言語も束ねず `payload.syntax` を持たない。言語のモジュールだけ束ねられなければ、その言語を `payload.syntax.languages` に入れず、警告を 1 件出す（その言語のコードブロックは色分けせずに描く）。埋める設定には `syntax` を写さない（開いたときに外へ要求しない）。設定に `aliases` があれば `loadAliases` の `aliases` を `payload.aliases` に入れ、`issues` は 1 件ずつ警告 `{file}:{where}: {kind}: {message}`（`where` が空なら `{file}: {kind}: {message}`）にする（終了コードは変えない）。警告は `{ファイル}: {内容}` の文字列で、読めない画像・絶対 URL の画像・束ねられないモジュールと拡張・束ねられない色分けのライブラリ（`{設定ファイル}: 色分けのライブラリ \`{URL}\` を束ねられません（{理由}）。\`syntax.url\` を直してください。`）・読めない `theme`・読めない索引の文書を出す'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 外部ライブラリの URL の先を読む
    args:
      - name: options
        type: "{ loaded: LoadedConfig; docs: Array<{ path: string; file: string }>; kind: 'document' | 'bundle'; entry: string }"
        required: true
        description: 読んだ設定、埋める文書のパスと絶対パス、種類、最初に開く文書
    returns:
      type: 'Promise<{ payload: ExportPayload; themeCss?: string; warnings: string[] }>'
      description: 書き出しの中身・使う側の CSS・警告
    unit_tests:
      - name: test_prepare_embeds
        case: 正常
        summary: 印のあるモジュールだけを束ね、拡張と theme を読む
        condition: '`libraries` に `test-lib`（印あり）と `other`（印なし）、`extensions` に 1 つ、`theme` あり'
        mock: 一時フォルダに手元のモジュールを置く
        expected: '`payload.modules` のキーが `test-lib` だけ、`payload.extensions` が 1 件、`themeCss` があり、`warnings` が空'
      - name: test_prepare_embeds_when_unreadable
        case: 正常
        summary: 読めないものを警告にして続ける
        condition: '`test-lib` が無いファイルを指し、`theme` も無い'
        mock: 一時フォルダ
        expected: '`payload.modules` が空、`warnings` に `test-lib` と `theme` のパスが入る'
      - name: test_prepare_embeds_when_index
        case: 正常
        summary: 索引があれば参照の表と docId を入れる
        condition: 索引に `guide`（`guide.md`）と `api`（`api.md`、`related` に `guide`）
        mock: 一時フォルダ
        expected: '`payload.references.backlinks.guide` に `api` があり、`guide.md` の `docId` が `guide`'
      - name: test_prepare_embeds_when_tooltip_placement
        case: 正常
        summary: 設定の `tooltips` を埋める設定に写す
        condition: '`tooltips.placement: bottom` を持つ設定と、`tooltips` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config.tooltips` が `{ placement: "bottom" }`、後者は `payload.config` が `tooltips` を持たない'
      - name: test_prepare_embeds_when_syntax
        case: 正常
        summary: 文書が使う言語だけ色分けのモジュールを束ね、埋める設定に `syntax` を写さない
        condition: 文書に `ts` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js`・`hl/languages/yaml.min.js` に手元のモジュールを置く
        expected: '`payload.syntax.core` があり、`payload.syntax.languages` のキーが `typescript` だけ。`payload.config` が `syntax` を持たず、`warnings` が空'
      - name: test_prepare_embeds_when_syntax_unreadable
        case: 正常
        summary: 色分けの本体を束ねられなければ警告にして埋めずに続ける
        condition: 文書に `ts` のコードブロック。設定の `syntax.url` が無いフォルダ `missing/`
        mock: 一時フォルダ
        expected: '`payload.syntax` が無く、`warnings` に `missing/core.min.js` と `syntax.url` を含む 1 件'
      - name: test_prepare_embeds_when_syntax_language_unreadable
        case: 正常
        summary: 束ねられない言語だけ埋めずに警告にし、他の言語は埋める
        condition: 文書に `ts` と `yml` のコードブロック。設定の `syntax.url` が一時フォルダの `hl/`
        mock: 一時フォルダの `hl/core.min.js` と `hl/languages/typescript.min.js` だけに手元のモジュールを置き、`yaml.min.js` は置かない
        expected: '`payload.syntax.languages` のキーが `typescript` だけで、`warnings` に `hl/languages/yaml.min.js` と `syntax.url` を含む 1 件'
      - name: test_prepare_embeds_when_side_toc_mode
        case: 正常
        summary: 設定の `side-toc` を埋める設定に写す
        condition: '`side-toc.mode: fixed` を持つ設定と、`side-toc` を持たない設定'
        mock: 一時フォルダ
        expected: '前者の `payload.config["side-toc"]` が `{ mode: "fixed" }`、後者は `payload.config` が `side-toc` を持たない'
      - name: test_prepare_embeds_when_aliases
        case: 正常
        summary: エイリアスを payload に入れ、ずれを警告にする
        condition: インターフェース定義『文書をHTMLに書き出す』の「正常系（エイリアスを読む）」のフォルダ
        mock: 一時フォルダ
        expected: '`payload.aliases` が `command` の `run-test` の 1 件だけで `dev-server` を含まず、`warnings` に `alias_required_empty` の 1 件がある'
      - name: test_prepare_embeds_when_color_theme
        case: 正常
        summary: 設定の `colorTheme` を埋める設定に写し、知らない名前は写して警告する
        condition: '`colorTheme: theme-slate` の設定、`colorTheme: sepia` の設定、`colorTheme` を持たない設定'
        mock: 一時フォルダ
        expected: 1 つ目の `payload.config.colorTheme` が `theme-slate` で `warnings` が空。2 つ目は `sepia` で `warnings` に `sepia` を含む 1 件。3 つ目は `payload.config` が `colorTheme` を持たない
    callees:
      - '#functions[usedLibraryMarks]'
      - '#functions[bundleModule]'
      - '#functions[inlineImages]'
      - '#functions[readIndexWithDocuments]'
      - '#functions[documentTitle]'
      - '#functions[usedSyntaxLanguages]'
      - '#functions[loadAliases]'
