  - name: bundleModule
    title: モジュールを 1 つに束ねる
    container: src/bundle-module.ts
    usecase: 共通
    summary: URL かファイルのモジュールを、import する先も含めて渡した esbuild の `build` で 1 つの ES モジュールのコードに束ねる
    description: '`bundle: true`・`format: esm`・`write: false`・`minify: true`・`target` は対応ブラウザ。`http:`・`https:` の import は、esbuild のプラグインで `fetch` して読み、相対・ルート相対の import はその URL を基準に解く（PoC #35 で確かめた jsDelivr の `+esm` の形）。ファイルは名前空間 `local` のプラグインで `node:fs/promises` の `readFile` で読み（esbuild-wasm はファイルシステムを持たず、`file` の名前空間は Windows のパスを拒む）、拡張子が `.ts`・`.mts`・`.cts`・`.tsx` なら `ts`・`tsx` の loader で読む。届かない・束ねられないときは例外を投げずに理由を返す。esbuild を import しないファイルに置き、CLI はネイティブの esbuild の `build` を、VS Code 拡張機能は esbuild-wasm の `build` を渡す'
    kind: 関数
    scope: public
    is_async: true
    side_effects: URL の先を読む
    args:
      - name: entry
        type: string
        required: true
        description: モジュールの URL か、設定ファイルのフォルダからの相対パス（絶対パスも受ける）
      - name: baseDir
        type: string
        required: true
        description: 相対パスの基準（設定ファイルのフォルダ）
      - name: fetchText
        type: '(url: string) => Promise<string>'
        required: false
        default: '`fetch` で本文を読む'
        passing: injected
        description: URL を読む関数（テストで差し替える）
      - name: build
        type: BuildFunction
        required: true
        default: ネイティブの esbuild の `build`（`src/cli/embed.ts` が渡す）
        passing: injected
        description: esbuild の `build`。`src/bundle-module.ts` は型だけを import し、CLI（`src/cli/embed.ts`）はネイティブの esbuild の、VS Code 拡張機能は esbuild-wasm の `build` を渡す
    returns:
      type: 'Promise<{ code: string } | { error: string }>'
      description: 束ねたコードか、読めなかった理由
    unit_tests:
      - name: test_bundle_module
        case: 正常
        summary: 手元のファイルとその import を 1 つに束ねる
        condition: '`lib.ts` が `./dep.ts` を import し `draw` を export する'
        mock: 一時フォルダ
        expected: '`code` に `import` 文が残らず、`draw` を export する'
      - name: test_bundle_module_when_url
        case: 正常
        summary: URL とそのルート相対の import を fetchText で読んで束ねる
        condition: '`https://cdn.example/npm/a/+esm` が `/npm/b/+esm` を import する'
        mock: 2 つの URL の本文を返す `fetchText`
        expected: '`fetchText` が `https://cdn.example/npm/b/+esm` も読み、`code` に `https:` と `/npm/` の import が残らない'
      - name: test_bundle_module_when_unreachable
        case: 異常
        summary: 読めないモジュールは理由を返す
        condition: 無いファイル `missing.js`
        mock: 一時フォルダ
        expected: '`error` に `missing.js` が入り、例外を投げない'
