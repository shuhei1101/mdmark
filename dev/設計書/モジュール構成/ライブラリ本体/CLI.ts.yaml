  - name: updateIndexFile
    title: 索引のファイルを書き換える
    kind: 関数
    container: src/cli/index-file.ts
    usecase: 索引を書き換える
    summary: ロックの中で索引のファイルを読み、項目を書き換えて検査し、合えば一時ファイルに書いてから置き換える
    description: MCP の `update_index` が呼ぶ。合わないとき・失敗したときは索引のファイルを書き換えず、一時ファイルとロックを残さない
    scope: public
    is_async: true
    side_effects: 索引のファイルを置き換える。書き換えている間だけ `{索引}{INDEX_LOCK_SUFFIX}` を置く
    args:
      - name: options
        type: "{ loaded: LoadedConfig; kind: 'doc' | 'term' | 'tag'; id: string; item: Record<string, unknown> | null; lockTimeoutMs?: number }"
        required: true
        description: 読んだ設定・書き換える一覧・鍵・項目の中身・ロックを待つ上限（既定は `INDEX_LOCK_TIMEOUT_MS`）
    returns:
      type: "Promise<{ action: 'added' | 'replaced' | 'removed'; index: string }>"
      description: したことと、索引のファイルのパス（設定ファイルのあるフォルダからの相対パス）
    process: |-
      1. 設定に `index` が無ければ例外にする
      2. `{索引}{INDEX_LOCK_SUFFIX}` を新しく作れるまで `INDEX_LOCK_RETRY_MS` ごとに取り直し、`lockTimeoutMs` を超えたら例外にする
      3. ロックの中で次を行い、終わったら成否を問わずロックを消す
         - 索引のファイルを読み、YAML の文書にする。読めないときは例外にする
         - 項目を書き換える（索引の項目を書き換える）。合わないところがあれば、`{場所}: {内容}` の行を並べて例外にする
         - 同じフォルダの一時ファイルに文字列にした文書を書き、索引のファイルへ名前を変えて置き換える。失敗したら一時ファイルを消す
    exceptions:
      - name: CliError
        condition: 設定に `index` が無い
        message: 設定に index がありません。index に索引のファイルのパスを書いてください。
      - name: CliError
        condition: ロックを待つ上限を超えた
        message: 索引 {索引} は書き換え中です（{ロック} があります）。少し待ってから呼び直すか、書き換え中でなければ {ロック} を消してください。
      - name: CliError
        condition: 索引のファイルを読めない・YAML として読めない
        message: 索引 {索引} を読めません（{理由}）。設定の index のパスを直すか、索引を置いてください。
      - name: CliError
        condition: 書き換えた後の索引が形に合わない
        message: '書き換えた後の索引が索引の形に合いません。合わないところを直してください。（続く行に `{場所}: {内容}`）'
    unit_tests:
      - name: test_update_index_file
        case: 正常
        summary: 足して置き換え、ロックと一時ファイルを残さない
        condition: '`docs` に `a` だけの `index.yaml` に `id: b`'
        mock: なし（一時フォルダ）
        expected: '`action` が `added`、`index` が `index.yaml`、ファイルの `docs` が `a`・`b`、フォルダに `index.yaml` と設定ファイル以外のファイルが無い'
      - name: test_update_index_file_when_locked
        case: 異常
        summary: ロックが残っていると待ってから CliError
        condition: '`index.yaml.lock` を置き、`lockTimeoutMs: 100`'
        mock: なし（一時フォルダ）
        expected: '`CliError` を投げ、メッセージに `index.yaml.lock` が入り、索引と置いたロックが変わらない'
        exception: ロックを待つ上限を超えた
      - name: test_update_index_file_when_schema_invalid
        case: 異常
        summary: 合わないときは書かずに CliError
        condition: '`id: b`、`{ title: "文書 B" }`'
        mock: なし（一時フォルダ）
        expected: '`CliError` を投げ、メッセージに `docs[1].path` が入り、索引の中身が呼ぶ前と同じで、ロックも一時ファイルも残らない'
        exception: 書き換えた後の索引が形に合わない
      - name: test_update_index_file_when_unreadable
        case: 異常
        summary: YAML として読めない索引
        condition: 字下げの崩れた `index.yaml`
        mock: なし（一時フォルダ）
        expected: '`CliError` を投げ、ロックが残らない'
        exception: 索引のファイルを読めない・YAML として読めない
      - name: test_update_index_file_when_index_missing
        case: 異常
        summary: 設定に index が無い
        condition: '`index` の無い設定'
        mock: なし（一時フォルダ）
        expected: '`CliError` を投げる'
        exception: 設定に `index` が無い
    callees:
      - '#functions[applyIndexUpdate]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/索引を書き換える.ts#
    status: planned
    introduced:
      pr: 72
