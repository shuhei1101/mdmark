  - name: collectCheckIssues
    title: 点検のずれを集める
    container: src/cli/check.ts
    usecase: 共通
    summary: '設定を重ねて読み（`purpose: export`）、重ねた設定ファイルのそれぞれと端末の設定（`config.applyToExport` によらず）の形のずれを先に、続けて `mdmark check` と同じ並びのずれを返す。ずれの `file` は設定ファイルのパスを表示の形にしたパス（`base` は今のフォルダ）'
    description: '並びは設定の `schema`（`validateConfig` のずれ、`theme`・`extensions` の無いファイル、`build.glossary`・`build.entry` がまとめる文書に当たらないもの）→ `unknown_color_theme`（設定の `colorTheme` が `COLOR_THEMES` に無いとき 1 件。`where` は `colorTheme`、`message` は `不明なテーマ名 {名前} です。{COLOR_THEMES を「・」で結んだもの} のいずれかに修正してください。`）→ `unknown_color_scheme`（設定の `colorScheme` が `COLOR_SCHEMES` に無いとき 1 件。`where` は `colorScheme`、`message` は `不明な明暗 {値} です。{COLOR_SCHEMES を「・」で結んだもの} のいずれかに修正してください。`）→ `no_documents` → `checkIndex` の並び → エイリアスのずれ（`loadAliases` の `issues`。設定に `aliases` があるときだけ）→ `missing_file`（`collectCheckDocuments` の文書ごとの `checkMissingFiles`）→ `unknown_mark`（`checkUnknownMarks`）→ 図の点検のずれ（`checkDiagrams`。`unknownMarks` によらず点検する）。知らない印の点検では、`collectCheckDocuments` の文書を、`loadExtensionDirectives` の `directive` を知っている印に入れて点検し、`loadExtensionDirectives` の `schema` のずれは設定の `schema` の並びの最後に置く。索引のずれの `file` は設定ファイルのフォルダからの相対パスに直す。索引を読めないときは索引を指す `schema` のずれにする。`base` があり設定に `index` があるときだけ、ずれを集める前に `changedPathsSince`（`cwd` は設定ファイルのフォルダ、`indexDir` は索引のファイルのフォルダ）で変わったファイルを引き、`checkIndex` の `changedPaths` に渡す。`runCheck` と `runUpgrade` が呼び、`runUpgrade` は `unknownMarks: false` で呼ぶ（拡張を読み込まず、知らない印を点検しない）。設定の `assets.root` のフォルダが無いときは `assets.root` を指す `schema` のずれを設定の `schema` の並びに置き、`missing_file` は文書のフォルダだけで探す'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: path
        type: string
        required: true
        description: 設定ファイルの絶対パス
      - name: options
        type: '{ unknownMarks?: boolean; base?: string; cwd?: string; explicit?: boolean }'
        required: false
        default: '`{ unknownMarks: true }`'
        description: '`unknownMarks` が `false` なら、拡張を読み込まず、知らない印を点検しない。`base` があれば、`change_together` の直し忘れを確かめる。`cwd` はずれの `file` の表示の基準（既定は `path` のフォルダ）。`explicit` が `true` のときは上へ探さず、`path` と端末の設定だけを重ねる（`--config`・MCP の `config` を渡したとき）'
    returns:
      type: Promise<CheckIssue[]>
      description: ずれの並び（無ければ空）
    exceptions:
      - name: CliError
        condition: 設定ファイルを YAML として読めない・`base` を渡し、比べる基準を引けない
