        expected: '`CliError` を投げ、メッセージに `libraries` と `mdmark check` が入る'
        exception: CliError
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[loadLayeredConfig]
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[displayConfigPath]
    status: planned
    introduced:
      pr: 32
    process: |-
      1. 設定を重ねて読む（設定を重ねて読む。`purpose: export`、`env` は `process.env`、`home` は `os.homedir()`）
