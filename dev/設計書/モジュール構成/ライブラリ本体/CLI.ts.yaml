title: "ライブラリ本体 / CLI"
lead: '`dist/cli.js` にまとめる Node の CLI。引数を読み込んでコマンドを振り分け、設定と索引と文書を読み込み、`render`・`checkIndex`・`collectReferences` を同じソースから呼んで、雛形の配置・点検・書き出しをする。ファイル・YAML・glob・esbuild を使用するのはこの分類だけにする。'
directory: |-
  ```tree
  src/cli/
  ├── main.ts       # 引数の読み取りとコマンドの振り分け
  ├── errors.ts     # CLI の誤りと入出力の型
  ├── config.ts     # 設定ファイルの探索・読み取り・構造の検査
  ├── alias-schema.ts # 設定の aliases の行の JSON Schema での検査
  ├── aliases.ts    # aliases の行の paths の YAML の読み取りとエイリアスの組み立て
  ├── documents.ts  # build の対象の文書・索引と索引の文書の読み取り・文書のタイトル
  ├── embed.ts      # 外部ライブラリと拡張のまとめ・起動の処理と埋めるモジュールの 1 つのスクリプトへのまとめ・色分けの言語の取得し出し・画像の埋め込み・1 枚に含まれない文書へのリンク
  ├── assets.ts     # 画像・動画・音声・添付の参照の取得し出し・アセットのルートでの探索・動画と音声のコピー・見つからないファイルの点検
  ├── includes.ts   # 取り込む文書の表の組み立てと、取り込めない問題の取得し出し
  ├── icons.ts      # まとめていない名前のアイコンの形状の取り出し
  ├── html.ts       # 書き出す HTML の組み立て
  ├── init.ts       # mdmark init
  ├── check.ts      # mdmark check
  ├── git.ts        # 比べる基準から変わったファイルの引き出し
  ├── export.ts     # mdmark export
  └── build.ts      # mdmark build
  templates/        # init が配置する雛形の原本
  schemas/alias-inject/v0.3.0/aliases.schema.json # 取り込んだ alias-inject の行の Schema
  ```
data_models:
  - name: CliIo
    title: CLI の入出力
    container: src/cli/errors.ts
    usecase: 共通
    summary: コマンドが使用する今のフォルダと、標準出力・標準エラーへの書き出し
    properties:
      - name: cwd
        type: string
        description: 今のフォルダ
      - name: stdout
        type: '(line: string) => void'
        description: 標準出力へ 1 行書く
      - name: stderr
        type: '(line: string) => void'
        description: 標準エラーへ 1 行書く
  - name: CliError
    title: CLI の誤り
    container: src/cli/errors.ts
    usecase: 共通
    summary: 原因と修正方法の 1 文を持ち、`main` が標準エラーに出して終了コード 1 にする誤り
    inherits: Error
    properties:
      - name: message
        type: string
        description: 原因と修正方法の日本語の 1 文
  - name: IncludeProblem
    title: 取り込みの問題
    container: src/cli/includes.ts
    usecase: 共通
    summary: '`collectIncludes` が返却する、取り込めない include のマーカー 1 つ'
    properties:
      - name: kind
        type: '"missing" | "heading" | "lines" | "outside" | "circular"'
        description: 無いファイル・無い見出し・行の数を越える範囲・根の外・循環
      - name: file
        type: string
        description: マーカーを記載した文書の、文書のフォルダからのパス（文書そのものは空文字）
      - name: line
        type: number
        description: マーカーの行（1 から）
      - name: target
        type: string
        description: マーカーに記載した取り込み先
      - name: lineCount
        type: number
        description: '`lines` のときのファイルの行の数'
      - name: chain
        type: string[]
        description: '`circular` のときの取り込みの順（最初と最後が同じキー）'
  - name: LoadedConfig
    title: 読み込んだ設定
    container: src/cli/config.ts
    usecase: 共通
    summary: 見つけた設定ファイルの場所と、読み込んだ値
    properties:
      - name: path
        type: string
        description: 設定ファイルの絶対パス
      - name: dir
        type: string
        description: 設定ファイルのあるフォルダ（設定のパスと glob の基準）
      - name: config
        type: CliConfig
        description: 読み込んだ値。`MdmarkConfig` に `index`・`theme`・`extensions`・`build`・`aliases`（Schema に合わない行は `null`）を追加した構造
  - name: CheckIssue
    title: 点検のずれ
    container: src/cli/check.ts
    usecase: 設定と索引を点検する
    summary: '`mdmark check` が出すずれ 1 件'
    properties:
      - name: file
        type: string
        description: ずれのあるファイル（設定ファイルのフォルダからの相対パス。文字列を点検したときは `-`、設定ファイルが無いときは今のフォルダからの相対パス）
      - name: where
        type: string
        description: キーのパスか行。ファイル全体は空文字
      - name: kind
        type: "'schema' | 'unknown_color_theme' | 'unknown_color_scheme' | 'no_documents' | MdmarkIndexIssue['kind'] | 'alias_no_files' | 'alias_unreadable' | MdmarkAliasProblem['kind'] | 'missing_file' | 'unknown_mark' | 'diagram_invalid' | 'diagram_node_overlap' | 'diagram_node_overflow' | 'diagram_wire_crosses_node' | 'diagram_label_too_long' | 'syntax_warning' | 'unknown_mark_arg'"
        description: ずれの種類
      - name: message
        type: string
        description: 内容と修正方法の 1 文
  - name: ExportPayload
    title: 書き出しの中身
    container: src/cli/html.ts
    usecase: 共通
    summary: 書き出した HTML に JSON で埋め、開いたときに起動の処理が読み込む中身
    properties:
      - name: kind
        type: "'document' | 'bundle'"
        description: '`export` は `document`、`build` は `bundle`'
      - name: config
        type: MdmarkConfig
        description: '`features`・`libraries` を持つ設定（`libraries` の値は埋めたモジュールの名前に替える）'
      - name: index
        type: MdmarkIndex | undefined
        description: 索引
      - name: references
        type: MdmarkReferences | undefined
        description: '`collectReferences` の参照の表'
      - name: docs
        type: 'Array<{ path: string; title: string; markdown: string; docId?: string }>'
        description: 埋める文書。`markdown` は画像を `data:` URL に替え、動画・音声の `src` をコピーへの相対パスに替えたもの（`bundle` では画像を `mdmark-asset:{キー}` に替える）
      - name: entry
        type: string
        description: 最初に開く文書の `path`
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: '`loadAliases` が作ったエイリアス（`env` を含まない）。設定に `aliases` が無ければ持たない'
      - name: assets
        type: Record<string, string> | undefined
        description: '`bundle` で埋めた画像のキーから `data:` URL を参照する表。複数の文書が指す同じ画像を 1 回だけ持つ。`document` では持たない'
  - name: ViewerEmbeds
    title: 起動の処理とまとめるモジュール
    container: src/cli/embed.ts
    usecase: 共通
    summary: '`prepareEmbeds` がまとめられることを確認した、起動の処理と 1 つのスクリプトにまとめるモジュールの読み込み先（URL か絶対パス）'
    properties:
      - name: libraries
        type: Record<string, string>
        description: 文書にマーカーがありまとめられた外部ライブラリの、マーカーの名前から読み込み先を参照する表
      - name: extensions
        type: string[]
        description: まとめられた設定の `extensions` の拡張の読み込み先。設定の順
      - name: syntax
        type: '{ core: string; languages: Record<string, string> } | undefined'
        description: まとめられた色分けの本体の読み込み先と、言語のモジュール名から読み込み先を参照する表。文書に色分けの対象があり本体をまとめられたときだけ持つ
      - name: view
        type: boolean
        description: ビューの部品をまとめるか。文書にビューのマーカーがあるときだけ `true`（書き出した HTML はコメントの読み込みと保存の関数を持たないため、コメントの部品はまとめない）
      - name: mermaid
        type: string | undefined
        description: まとめられた mermaid の読み込み先。文書に mermaid のコードブロックがあり、まとめられたときだけ持つ
      - name: htmlScripts
        type: 'Array<{ source: string; code: string }> | undefined'
        description: '`compileHtmlScripts` の結果。`source` は範囲のコードの文字（開いたときに `mount` が参照する鍵）、`code` は CommonJS のコード。範囲が無ければ入れない'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#constraints[まとめるスクリプト]
    status: planned
    introduced:
      pr: 296
  - name: AssetRef
    title: ファイルの参照
    container: src/cli/assets.ts
    usecase: 共通
    summary: 文書が相対パスで指す画像・動画・音声・`poster`・添付のファイル 1 つ
    properties:
      - name: src
        type: string
        description: 記載したパス（クエリとフラグメントを含む）
      - name: kind
        type: "'image' | 'video' | 'audio' | 'poster' | 'attachment'"
        description: 種類。`mediaKindOf` と `ATTACHMENT_KINDS` で見分ける（GIF は `image`）
      - name: line
        type: number
        description: 記載した行の番号（1 から）
    status: planned
    introduced:
      pr: 263
functions:
  - name: main
    title: CLI を実行する
    container: src/cli/main.ts
    usecase: 共通
    summary: 最初の引数のコマンド名で `init`・`check`・`export`・`build`・`upgrade`・`serve` を呼び分け、終了コードを返却する
    description: '引数は `node:util` の `parseArgs`（`--out`・`--config`・`--base`・`--text`・`--file`・`--key` は文字列、`--js`・`--plan`・`--yes` は真偽値、位置引数を許す）で読み込む。`upgrade` はパッケージの直下・`cliVersion()`・今の時刻・`ask` を `runUpgrade` に指定する。`init` は `cliVersion()` を `runInit` に指定する。`serve` は `process.env`・パッケージの直下・`cliVersion()`・`SIGINT` か `SIGTERM` で止める合図になる `AbortSignal` を `runServe` に指定する。コマンドが投げた `CliError` はその文を標準エラーに出して 1 を返却する。知らないコマンド・知らない引数・引数が無いときは、使用できるコマンドの一覧を標準エラーに出して 1 を返却する。`check` の `--text -` は標準入力を終わりまで読み込んだ文字を `text` にして `runCheck` に指定する。`src/cli/main.ts` の末尾で、入口として実行されたときだけ `main(process.argv.slice(2), 標準の入出力, createLinePrompter({ input: process.stdin, write: 標準エラー }))` を呼び、戻り値を `process.exitCode` に入れる'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: argv
        type: string[]
        required: true
        description: コマンド名から始まる引数
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先（テストで差し替える）
      - name: ask
        type: Prompter
        required: true
        description: '`upgrade` の質問（テストで差し替える）'
    returns:
      type: Promise<0 | 1>
      description: コマンドの終了コード
    unit_tests:
      - name: test_main
        case: 正常
        summary: コマンド名で init を呼び、その終了コードを返却する
        condition: '`["init", "{一時フォルダ}"]`'
        mock: 出力を配列に貯める `CliIo`、`vi.stubGlobal("__MDMARK_VERSION__", "v0.5.0")`（`init` が `cliVersion()` を読み込むため）
        expected: 0 を返却し、標準出力に `配置した:` の行がある
      - name: test_main_when_command_unknown
        case: 異常
        summary: 知らないコマンドは一覧を出して 1 を返却する
        condition: '`["deploy"]`'
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返却し、標準エラーに `init`・`check`・`export`・`build`・`serve` が出る
      - name: test_main_when_cli_error
        case: 異常
        summary: コマンドが投げた CliError の文を出して 1 を返却する
        condition: 設定ファイルの無い一時フォルダで `["check"]`
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返却し、標準エラーに `mdmark init` が出る
      - name: test_main_when_upgrade
        case: 正常
        summary: upgrade を呼び、--plan を runUpgrade に指定する
        condition: 設定の `version` がパッケージと同じ一時フォルダで `["upgrade", "--plan"]`
        mock: 出力を配列に貯める `CliIo`、呼ばれたら失敗にする `Prompter`
        expected: 0 を返却し、標準出力に `適用する手順はありません` が出る
    status: planned
    introduced:
      pr: 32
  - name: findConfigFile
    title: 設定ファイルを探す
    container: src/cli/config.ts
    usecase: 共通
    summary: '`--config` があればそのパスを、無ければ今のフォルダから上へ順に最初に見つかった `mdmark.config.yaml` の絶対パスを返却する'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: cwd
        type: string
        required: true
        description: 今のフォルダ
      - name: explicit
        type: string | undefined
        required: false
        description: '`--config` の値'
    returns:
      type: Promise<string>
      description: 設定ファイルの絶対パス
    exceptions:
      - name: CliError
        condition: '`--config` のファイルが無い、またはルートまで探しても無い'
        message: mdmark.config.yaml が見つかりません（{探し始めたフォルダ} から上を探しました）。mdmark init で配置できます。
    unit_tests:
      - name: test_find_config_file
        case: 正常
        summary: 上のフォルダの設定ファイルを見つける
        condition: '`{一時}/mdmark.config.yaml` があり、`cwd` は `{一時}/a/b`'
        mock: 一時フォルダ
        expected: '`{一時}/mdmark.config.yaml`'
      - name: test_find_config_file_when_explicit
        case: 正常
        summary: '`--config` のパスを優先する'
        condition: '`explicit` に `docs/mdmark.config.yaml`'
        mock: 一時フォルダにそのファイルを配置する
        expected: '`{cwd}/docs/mdmark.config.yaml`'
      - name: test_find_config_file_when_missing
        case: 異常
        summary: 見つからないと CliError を投げる
        condition: 一時フォルダと上に設定ファイルが無い
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `mdmark init` が入る'
        exception: CliError
    status: planned
    introduced:
      pr: 32
  - name: loadConfig
    title: 設定ファイルを読み込む
    container: src/cli/config.ts
    usecase: 共通
    summary: 設定ファイルを yaml の `parse` で読み込み、構造を検めずに返却する
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: path
        type: string
        required: true
        description: 設定ファイルの絶対パス
    returns:
      type: 'Promise<{ path: string; dir: string; raw: unknown }>'
      description: 場所と読み込んだ値（空のファイルは `null`）
    exceptions:
      - name: CliError
        condition: YAML として読み込めない（`YAMLParseError`）、またはファイルを開けない
        message: '{ファイル} の {行} 行目を YAML として読み込めません（{誤りの内容}）。字下げと記載方法を修正してください。'
    unit_tests:
      - name: test_load_config
        case: 正常
        summary: 読み込んだ値とフォルダを返却する
        condition: '`build: {include: ["*.md"], out: a.html}` のファイル'
        mock: 一時フォルダ
        expected: '`raw.build.out` が `a.html`、`dir` が一時フォルダ'
      - name: test_load_config_when_yaml_broken
        case: 異常
        summary: 読み込めない行を示す CliError を投げる
        condition: 3 行目の字下げが崩れたファイル
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `3 行目` が入る'
        exception: CliError
    status: planned
    introduced:
      pr: 32
  - name: validateConfig
    title: 設定の構造を検める
    container: src/config-files.ts
    usecase: 共通
    summary: 読み込んだ値を `schemas/mdmark.config.schema.json` と同じ構造で検め、合わないところを `schema` のずれで返却する
    description: 検めるのは、最上位がオブジェクトであること・`version` が `VERSION_PATTERN` に合う文字列・`features` の値が真偽値・`libraries` の値が文字列でキーがマーカーの名前・`index`・`theme`・`colorTheme`・`colorScheme` が文字列（`colorTheme` の知らない名前と `colorScheme` の知らない値はここでは拒まず、設定に残す）・`extensions` が文字列の配列・`build` があれば `include`（1 つ以上の文字列）と `out`（`.html` の文字列）を持ち `exclude`・`glossary` が文字列の配列で `entry` が文字列であること・`check` があれば `ignore` がマーカーの名前（`MARK_NAME_PATTERN`）の文字列の配列であること・`tooltips` があれば `placement` と `diagramPlacement` がどちらも（あれば）`top` か `bottom` であること・`labels` があればオブジェクトで `paramCopy` があれば空でない文字列であること（合わなければ `labels` を設定から落とす。知らないキーは拒まない）・`side-toc` があればオブジェクトで `mode` が `hover` か `fixed` であること・`syntax` があればオブジェクトで `url` が文字列であること・`html-scripts` があればオブジェクトで `url` が文字列であること（合わなければ `html-scripts` を設定から落とす）・`mermaid` があればオブジェクトで、`url`・`theme` が（あれば）文字列、`themeVariables` が（あれば）オブジェクトであること（合わなければ `mermaid` を設定から落とす。`theme` の知らない名前はここでは拒まず、設定に残す）・`assets` があればオブジェクトで `root` が文字列であること。`aliases` があれば配列であることを確認し、行は `validateAliasRows` で検める（ずれをそのまま `schema` のずれに加え、返った行を `config.aliases` に入れる）。知らない最上位のキーは拒まない。`aliases` の行のほかの構造の検査は手書きで、ライブラリを追加しない（索引の `normalizeIndex` と同じやり方）。検める構造は `schemas/mdmark.config.schema.json` と統一する
    kind: 関数
    scope: public
    args:
      - name: raw
        type: unknown
        required: true
        description: '`loadConfig` が読み込んだ値'
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
    returns:
      type: '{ config: CliConfig; issues: CheckIssue[] }'
      description: 構造の合うところだけを残した設定と、`schema` のずれ（無ければ空）
    unit_tests:
      - name: test_validate_config
        case: 正常
        summary: 構造の合う設定はずれ 0 件
        condition: '`version: v0.3.0`・`theme`・`extensions`・`build`（`include`・`out`）と知らないキー `title` を持つ値'
        mock: なし
        expected: '`issues` が空'
      - name: test_validate_config_when_build_out_missing
        case: 正常
        summary: '`build.out` が無いと schema のずれを返却する'
        condition: '`build` が `include` だけを持つ'
        mock: なし
        expected: '`{ where: "build", kind: "schema" }` の 1 件で、`message` に `build.out` が入る'
      - name: test_validate_config_when_empty
        case: 正常
        summary: 空の設定ファイル（`null`）を schema のずれにする
        condition: '`raw` が `null`'
        mock: なし
        expected: '`{ where: "", kind: "schema" }` の 1 件'
      - name: test_validate_config_when_libraries_not_object
        case: 正常
        summary: 構造の違う `libraries` を schema のずれにし、設定から落とす
        condition: '`libraries` が文字列'
        mock: なし
        expected: '`where` が `libraries` のずれが 1 件で、`config.libraries` が無い'
      - name: test_validate_config_when_version_invalid
        case: 異常
        summary: 書式の違う version を schema のずれにする
        condition: '`version: 0.3`'
        mock: なし
        expected: '`where` が `version` の `schema` のずれが 1 件'
      - name: test_validate_config_when_check_ignore_invalid
        case: 正常
        summary: マーカーの名前の書式に合わない `check.ignore` の値を schema のずれにし、設定から落とす
        condition: '`check.ignore` が `["prettier-ignore", "Bad Name"]`'
        mock: なし
