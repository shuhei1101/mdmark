      2. `nearest` が無い場合、今の「`mdmark.config.yaml` が見つかりません」の `CliError` を投げる
      3. `unreadable` がある場合、そのファイルのパス（設定ファイルのパスを表示の形にする。`base` は `cwd`）と行で、今の「YAML として読めません」の `CliError` を投げる
