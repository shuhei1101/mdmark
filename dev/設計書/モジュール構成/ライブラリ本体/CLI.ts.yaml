  - name: collectCheckIssues
    title: 点検のずれを集める
    container: src/cli/check.ts
    usecase: 共通
    summary: 設定ファイルを読み、`mdmark check` と同じ並びのずれを返す
    description: '並びは設定の `schema`（`validateConfig` のずれ、`theme`・`extensions` の無いファイル、`build.glossary`・`build.entry` がまとめる文書に当たらないもの）→ `unknown_color_theme`（設定の `colorTheme` が `COLOR_THEMES` に無いとき 1 件。`where` は `colorTheme`、`message` は `不明なテーマ名 {名前} です。{COLOR_THEMES を「・」で結んだもの} のいずれかに修正してください。`）→ `no_documents` → `checkIndex` の並び → エイリアスのずれ（`loadAliases` の `issues`。設定に `aliases` があるときだけ）→ `unknown_mark`（`checkUnknownMarks`）。知らない印の点検では、`collectCheckDocuments` の文書を、`loadExtensionDirectives` の `directive` を知っている印に入れて点検し、`loadExtensionDirectives` の `schema` のずれは設定の `schema` の並びの最後に置く。索引のずれの `file` は設定ファイルのフォルダからの相対パスに直す。索引を読めないときは索引を指す `schema` のずれにする。`base` があり設定に `index` があるときだけ、ずれを集める前に `changedPathsSince`（`cwd` は設定ファイルのフォルダ、`indexDir` は索引のファイルのフォルダ）で変わったファイルを引き、`checkIndex` の `changedPaths` に渡す。`runCheck` と `runUpgrade` が呼び、`runUpgrade` は `unknownMarks: false` で呼ぶ（拡張を読み込まず、知らない印を点検しない）'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: path
        type: string
        required: true
        description: 設定ファイルの絶対パス
      - name: options
        type: '{ unknownMarks?: boolean; base?: string }'
        required: false
        default: '`{ unknownMarks: true }`'
        description: '`unknownMarks` が `false` なら、拡張を読み込まず、知らない印を点検しない。`base` があれば、`change_together` の直し忘れを確かめる'
    returns:
      type: Promise<CheckIssue[]>
      description: ずれの並び（無ければ空）
    exceptions:
      - name: CliError
        condition: 設定ファイルを YAML として読めない・`base` を渡し、比べる基準を引けない
        message: '`loadConfig`・`changedPathsSince` のメッセージ'
    unit_tests:
      - name: test_collect_check_issues
        case: 正常
        summary: 設定の schema と索引の missing_doc をこの順に返す
        condition: '`build.out` が無く、索引の `old.md` が無い'
        mock: 一時フォルダ
        expected: 2 件で、`kind` が `schema`・`missing_doc` の順
      - name: test_collect_check_issues_when_unknown_mark
        case: 正常
        summary: 知らない印を checkIndex のずれの後ろに返す
        condition: 索引の `old.md` が無く、文書 `a.md` の 3 行目に `<!-- tabz -->`
        mock: 一時フォルダ
        expected: '`kind` が `missing_doc`・`unknown_mark` の順で、`unknown_mark` の `file` が `a.md`・`where` が `3`'
      - name: test_collect_check_issues_when_unknown_marks_off
        case: 正常
        summary: '`unknownMarks: false` では知らない印を返さず、拡張を読み込まない'
        condition: '文書 `a.md` に `<!-- tabz -->`、設定の `extensions` に読み込めない拡張 `broken.js`、`{ unknownMarks: false }`'
        mock: 一時フォルダ
        expected: '`unknown_mark` のずれも `extensions[0]` の `schema` のずれも無い'
      - name: test_collect_check_issues_when_base_without_index
        case: 正常
        summary: 設定に `index` が無ければ `base` を使わない
        condition: '`index` の無い設定を持ち git のリポジトリでない一時フォルダ、`{ base: "no-such-ref" }`'
        mock: 一時フォルダ
        expected: 例外を投げず、`base` を渡さないときと同じずれを返す
      - name: test_collect_check_issues_when_alias_drift
        case: 正常
        summary: エイリアスのずれを checkIndex の後・unknown_mark の前に置く
        condition: インターフェース定義『設定と索引を点検する』の「正常系（エイリアスにずれがある）」のフォルダに、知らない印のある文書を加える
        mock: 一時フォルダ
        expected: ずれの並びが `alias_no_files`（`missing/*.yaml`）→ `alias_required_empty`（`description`）→ `unknown_mark` で、`env` のレコードを指すずれが無い
      - name: test_collect_check_issues_when_unknown_color_theme
        case: 正常
        summary: 知らないテーマの名前を schema の後・no_documents の前に返す
        condition: '`colorTheme: sepia` と、`build.out` の無い `build`、当たる文書の無い `build.include` を持つ設定。別に `colorTheme: theme-slate` の設定'
        mock: 一時フォルダ
        expected: 前者の `kind` が `schema`・`unknown_color_theme`・`no_documents` の順で、`unknown_color_theme` の `where` が `colorTheme`、`message` に `sepia` と 4 つの名前を含む。後者は `unknown_color_theme` が無い
    refs:
      - '#functions[validateConfig]'
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[checkIndex]
      - '#functions[checkUnknownMarks]'
      - '#functions[changedPathsSince]'
    status: planned
    introduced:
      pr: 39
