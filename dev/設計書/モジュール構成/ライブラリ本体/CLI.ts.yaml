    returns:
      type: 'Promise<{ out: string; display: string; warnings: string[] }>'
      description: '記載した HTML の絶対パス、利用者に見せるパス（`--out` か今のフォルダからの相対パス）、`{ファイル}: {内容}` の警告'
    process: |-
      1. 設定を読み込む（設定を読み込んで構造を検める）
