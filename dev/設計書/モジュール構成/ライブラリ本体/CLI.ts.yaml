  - name: applyIndexUpdate
    title: 索引の項目を書き換える
    kind: 関数
    container: src/cli/index-file.ts
    usecase: 索引を書き換える
    summary: 索引の YAML の文書で、`docs`・`terms`・`tags` のどれかの鍵の要素を置き換え・末尾へ追加し・消し、書き換えた後の索引を索引の形で検査する
    description: '`yaml` の `Document` のノードを書き換えるため、他の要素・キー・コメントはそのまま残る。鍵は `doc`・`term` が `id`、`tag` が `name` で、置き換える要素は `{ {鍵}: id, ...item }` のキーの並びにする（`item` の鍵のキーは使わない）'
    scope: public
    is_async: false
    side_effects: 渡した `document` を書き換える
    args:
      - name: options
        type: "{ document: Document; kind: 'doc' | 'term' | 'tag'; id: string; item: Record<string, unknown> | null }"
        required: true
        description: 索引の YAML の文書・書き換える一覧・鍵（tag はタグの名前）・項目の中身（`null` は消す）
    returns:
      type: "{ action: 'added' | 'replaced' | 'removed'; problems: IndexProblem[] }"
      description: したことと、書き換えた後の索引の合わないところ（合えば空）
    process: |-
      1. `kind` が `doc` なら `docs`、`term` なら `terms`、`tag` なら `tags` の並びのノードを取る。`terms`・`tags` が無く足すときは空の並びを作る
      2. 鍵（`doc`・`term` は `id`、`tag` は `name`）が同じ要素を探す
         - `item` が `null` で要素が無い場合、例外にする
         - `item` が `null` の場合、要素を消して `removed`。`tags` が空になったら `tags` のキーも消す
         - 要素があれば `{ {鍵}: id, ...item }` に置き換えて `replaced`
         - 無ければ末尾に `{ {鍵}: id, ...item }` を足して `added`
      3. 書き換えた後の文書を値にして索引の形で検査し、合わないところを返す（索引の形の検査）
    exceptions:
      - name: CliError
        condition: '`item` が `null` で、その ID の要素が無い'
        message: '`{ID}` は索引の `{docs か terms か tags}` にありません。ID を確かめてください。'
    unit_tests:
      - name: test_apply_index_update
        case: 正常
        summary: 無い ID を末尾に足す
        condition: '`docs` に `a` だけの索引に `kind: doc`、`id: b`、`path`・`title` を持つ項目'
        mock: なし
        expected: '`action` が `added`、`problems` が空で、`docs` が `a`・`b` の順'
      - name: test_apply_index_update_when_replaced
        case: 正常
        summary: ある ID を置き換え、他の要素のコメントを残す
        condition: '`docs` の `a`・`b` の `b` の上にコメントがあり、`id: a` の題を変える'
        mock: なし
        expected: '`action` が `replaced`、`a` の題が変わり、文書を文字列にすると `b` の上のコメントが残る'
      - name: test_apply_index_update_when_removed
        case: 正常
        summary: item が null なら消す
        condition: '`docs` の `a`・`old` に `id: old`、`item: null`'
        mock: なし
        expected: '`action` が `removed`、`docs` が `a` だけ'
      - name: test_apply_index_update_when_terms_absent
        case: 正常
        summary: terms が無い索引に用語を足す
        condition: '`terms` の無い索引に `kind: term`、`term`・`meaning` を持つ項目'
        mock: なし
        expected: '`action` が `added`、`terms` が 1 件'
      - name: test_apply_index_update_when_schema_invalid
        case: 正常
        summary: 形に合わない項目は合わないところを返す
        condition: '`docs` に `a` だけの索引に `id: b`、`{ title: "文書 B" }`'
        mock: なし
