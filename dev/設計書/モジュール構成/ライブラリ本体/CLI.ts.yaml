  - name: runBuild
    title: 複数の文書を 1 枚にまとめる
    container: src/cli/build.ts
    usecase: 複数の文書を1枚のHTMLにまとめる
    summary: '`build` の対象の文書を `kind: bundle` の中身にして `build.out` に HTML を書き込み、警告と `書き出した: {build.out}（文書 {件数} 件）` を出す'
    description: 警告には `prepareEmbeds` のものに、`findOutsideLinks` のリンク、`build.glossary` と `build.entry` がまとめる文書に該当しないことを追加する。`build.glossary` の文書は、索引が無いときもその用語集の表を全ての文書で有効にしるため、索引の `docs` に無ければ追加してから `collectReferences` を呼ぶ
    kind: 関数
    scope: public
    is_async: true
    side_effects: '`build.out` に HTML を書き込む'
    args:
      - name: options
        type: '{ config?: string; distDir: string }'
        required: true
        description: '`--config` と `dist/` の場所'
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先
    returns:
      type: Promise<0>
      description: 書き出したら 0
    exceptions:
      - name: CliError
        condition: 設定の誤り・`build` が無い・対象が 0 件・出力先へ書き込めない
        message: 'build が無い: 設定に build がありません。build.include と build.out を記載してください。／0 件: build.include に該当する文書がありません。build.include を修正してください。'
    unit_tests:
      - name: test_run_build
        case: 正常
        summary: 3 つの文書をまとめて build.out に記載する
        condition: '`include: ["**/*.md"]` が 3 つに該当する'
        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: '0 を返却し、標準出力が `書き出した: dist/docs.html（文書 3 件）`、中身の `docs` が 3 件'
      - name: test_run_build_when_link_outside_bundle
        case: 正常
        summary: 1 枚に含まれない文書へのリンクを警告に出す
        condition: '`README.md` が exclude した `下書き/メモ.md` へリンクする'
        mock: 一時フォルダ
        expected: '標準エラーに `警告: README.md:` で始まり `下書き/メモ.md` を含む行がある'
      - name: test_run_build_when_glossary_without_index
        case: 正常
        summary: 索引が無くても build.glossary の用語を参照の表に入れる
        condition: '`index` 無し、`glossary: ["用語集.md"]` の用語集の表に `マーカー`'
        mock: 一時フォルダ
        expected: 中身の `references` の用語に `マーカー` がある
      - name: test_run_build_when_build_missing
        case: 異常
        summary: build が無いと CliError
        condition: '`build` の無い設定'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `build.include` と `build.out` が入る'
        exception: CliError
      - name: test_run_build_when_no_documents
        case: 異常
        summary: 対象が 0 件だと CliError で HTML を書き込まない
        condition: '`build.include` がどのファイルにも該当しない'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、`build.out` が無い'
        exception: CliError
