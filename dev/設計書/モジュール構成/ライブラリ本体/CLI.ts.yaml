        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `build.include` と `build.out` が入る'
        exception: 設定の誤り・`build` が無い・対象が 0 件・出力先へ書き込めない
      - name: test_build_site_when_shared_image
        case: 正常
