        mock: 一時フォルダと、中身を短くした `dist/index.css`・`startViewer` を export する `dist/viewer.js`・`dist/view.js`
        expected: 記載した HTML の中の `data:image/png;base64,` が 1 つで、`payload.assets` が 1 件
    callees:
      - '#functions[requireConfig]'
      - '#functions[collectBuildDocuments]'
      - '#functions[findOutsideLinks]'
      - '#functions[prepareEmbeds]'
      - '#functions[readDistAssets]'
      - '#functions[cacheFetchText]'
      - '#functions[createViewerEntry]'
      - '#functions[bundleViewer]'
      - '#functions[assembleHtml]'
      - '#functions[writeHtml]'
    refs:
