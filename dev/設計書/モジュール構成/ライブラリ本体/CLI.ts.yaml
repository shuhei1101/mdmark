      - name: test_run_export_when_output_unwritable
        case: 異常
        summary: 記載できない出力先は CliError
        condition: '`out: blocked/guide.html` で `blocked` がファイル'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `blocked/guide.html` が入る'
        exception: CliError
