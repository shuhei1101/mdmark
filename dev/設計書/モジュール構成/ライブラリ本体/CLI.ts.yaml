title: "ライブラリ本体 / CLI"
lead: '`dist/cli.js` に束ねる Node の CLI。引数を読んでコマンドを振り分け、設定と索引と文書を読み、`render`・`checkIndex`・`collectReferences` を同じソースから呼んで、雛形の配置・点検・書き出しを行う。ファイル・YAML・glob・esbuild を使うのはこの分類だけにする。'
directory: |-
  ```tree
  src/cli/
  ├── main.ts       # 引数の読み取りとコマンドの振り分け
  ├── errors.ts     # CLI の誤りと入出力の型
  ├── config.ts     # 設定ファイルの探索・読み取り・形の検査
  ├── alias-schema.ts # 設定の aliases の行の JSON Schema での検査
  ├── aliases.ts    # aliases の行の paths の YAML の読み取りとエイリアスの組み立て
  ├── documents.ts  # build の対象の文書・索引と索引の文書の読み取り・文書の題
  ├── embed.ts      # 外部ライブラリと拡張の束ね・色分けの言語の拾い出し・画像の埋め込み・1 枚に含まれない文書へのリンク
  ├── html.ts       # 書き出す HTML の組み立て
  ├── init.ts       # mdmark init
  ├── check.ts      # mdmark check
  ├── git.ts        # 比べる基準から変わったファイルの引き出し
  ├── export.ts     # mdmark export
  ├── build.ts      # mdmark build
  └── index-file.ts # 索引のファイルの項目の書き換え
  templates/        # init が置く雛形の正本
  schemas/alias-inject/v0.2.0/aliases.schema.json # 取り込んだ alias-inject の行の Schema
  ```
data_models:
  - name: CliIo
    title: CLI の入出力
    container: src/cli/errors.ts
    usecase: 共通
    summary: コマンドが使う今のフォルダと、標準出力・標準エラーへの書き出し
    properties:
      - name: cwd
        type: string
        description: 今のフォルダ
      - name: stdout
        type: '(line: string) => void'
        description: 標準出力へ 1 行書く
      - name: stderr
        type: '(line: string) => void'
        description: 標準エラーへ 1 行書く
  - name: CliError
    title: CLI の誤り
    container: src/cli/errors.ts
    usecase: 共通
    summary: 原因と直し方の 1 文を持ち、`main` が標準エラーに出して終了コード 1 にする誤り
    inherits: Error
    properties:
      - name: message
        type: string
        description: 原因と直し方の日本語の 1 文
  - name: LoadedConfig
    title: 読んだ設定
    container: src/cli/config.ts
    usecase: 共通
    summary: 見つけた設定ファイルの場所と、読んだ値
    properties:
      - name: path
        type: string
        description: 設定ファイルの絶対パス
      - name: dir
        type: string
        description: 設定ファイルのあるフォルダ（設定のパスと glob の基準）
      - name: config
        type: CliConfig
        description: 読んだ値。`MdmarkConfig` に `index`・`theme`・`extensions`・`build`・`aliases`（Schema に合わない行は `null`）を足した形
  - name: CheckIssue
    title: 点検のずれ
    container: src/cli/check.ts
    usecase: 設定と索引を点検する
    summary: '`mdmark check` が出すずれ 1 件'
    properties:
      - name: file
        type: string
        description: ずれのあるファイル（設定ファイルのフォルダからの相対パス）
      - name: where
        type: string
        description: キーのパスか行。ファイル全体は空文字
      - name: kind
        type: "'schema' | 'unknown_color_theme' | 'no_documents' | MdmarkIndexIssue['kind'] | 'alias_no_files' | 'alias_unreadable' | MdmarkAliasProblem['kind'] | 'unknown_mark'"
        description: ずれの種類
      - name: message
        type: string
        description: 内容と直し方の 1 文
  - name: ExportPayload
    title: 書き出しの中身
    container: src/cli/html.ts
    usecase: 共通
    summary: 書き出した HTML に JSON で埋め、開いたときに起動の処理が読む中身
    properties:
      - name: kind
        type: "'document' | 'bundle'"
        description: '`export` は `document`、`build` は `bundle`'
      - name: config
        type: MdmarkConfig
        description: '`features`・`libraries` を持つ設定（`libraries` の値は埋めたモジュールの名前に替える）'
      - name: index
        type: MdmarkIndex | undefined
        description: 索引
      - name: references
        type: MdmarkReferences | undefined
        description: '`collectReferences` の参照の表'
      - name: docs
        type: 'Array<{ path: string; title: string; markdown: string; docId?: string }>'
        description: 埋める文書。`markdown` は画像を `data:` URL に替えたもの
      - name: entry
        type: string
        description: 最初に開く文書の `path`
      - name: modules
        type: Record<string, string>
        description: 印の名前から束ねたモジュールのコードを引く表
      - name: extensions
        type: string[]
        description: 束ねた拡張のモジュールのコード
      - name: parts
        type: Partial<Record<"view", string>> | undefined
        description: 埋めた部品のモジュールのコード。無いときは空として扱う。文書にビューの印があるときだけ `dist/view.js` を入れる（書き出した HTML はコメントの読み書きの関数を持たないため、コメントの部品は埋めない）
      - name: syntax
        type: '{ core: string; languages: Record<string, string> } | undefined'
        description: 束ねた色分けのライブラリのコード。`core` は本体、`languages` は言語のモジュール名からコードを引く表。文書に色分けの対象があり本体を束ねられたときだけ持つ
      - name: aliases
        type: MdmarkAlias[] | undefined
        description: '`loadAliases` が作ったエイリアス（`env` を含まない）。設定に `aliases` が無ければ持たない'
functions:
  - name: main
    title: CLI を実行する
    container: src/cli/main.ts
    usecase: 共通
    summary: 最初の引数のコマンド名で `init`・`check`・`export`・`build`・`upgrade`・`serve` を呼び分け、終了コードを返す
    description: '引数は `node:util` の `parseArgs`（`--out`・`--config`・`--base` は文字列、`--js`・`--plan`・`--yes` は真偽値、位置引数を許す）で読む。`upgrade` はパッケージの直下・`cliVersion()`・今の時刻・`ask` を `runUpgrade` に渡す。`init` は `cliVersion()` を `runInit` に渡す。`serve` は `process.env`・パッケージの直下・`cliVersion()`・`SIGINT` か `SIGTERM` で止める合図になる `AbortSignal` を `runServe` に渡す。コマンドが投げた `CliError` はその文を標準エラーに出して 1 を返す。知らないコマンド・知らない引数・引数が無いときは、使えるコマンドの一覧を標準エラーに出して 1 を返す。`src/cli/main.ts` の末尾で、入口として実行されたときだけ `main(process.argv.slice(2), 標準の入出力, createLinePrompter({ input: process.stdin, write: 標準エラー }))` を呼び、戻り値を `process.exitCode` に入れる'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: argv
        type: string[]
        required: true
        description: コマンド名から始まる引数
      - name: io
        type: CliIo
        required: true
        description: 今のフォルダと出力の先（テストで差し替える）
      - name: ask
        type: Prompter
        required: true
        description: '`upgrade` の問い（テストで差し替える）'
    returns:
      type: Promise<0 | 1>
      description: コマンドの終了コード
    unit_tests:
      - name: test_main
        case: 正常
        summary: コマンド名で init を呼び、その終了コードを返す
        condition: '`["init", "{一時フォルダ}"]`'
        mock: 出力を配列に貯める `CliIo`、`vi.stubGlobal("__MDMARK_VERSION__", "v0.5.0")`（`init` が `cliVersion()` を読むため）
        expected: 0 を返し、標準出力に `置いた:` の行がある
      - name: test_main_when_command_unknown
        case: 異常
        summary: 知らないコマンドは一覧を出して 1 を返す
        condition: '`["deploy"]`'
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返し、標準エラーに `init`・`check`・`export`・`build`・`serve` が出る
      - name: test_main_when_cli_error
        case: 異常
        summary: コマンドが投げた CliError の文を出して 1 を返す
        condition: 設定ファイルの無い一時フォルダで `["check"]`
        mock: 出力を配列に貯める `CliIo`
        expected: 1 を返し、標準エラーに `mdmark init` が出る
      - name: test_main_when_upgrade
        case: 正常
        summary: upgrade を呼び、--plan を runUpgrade に渡す
        condition: 設定の `version` がパッケージと同じ一時フォルダで `["upgrade", "--plan"]`
        mock: 出力を配列に貯める `CliIo`、呼ばれたら失敗にする `Prompter`
        expected: 0 を返し、標準出力に `当てる手順はありません` が出る
    status: planned
    introduced:
      pr: 32
  - name: findConfigFile
    title: 設定ファイルを探す
    container: src/cli/config.ts
    usecase: 共通
    summary: '`--config` があればそのパスを、無ければ今のフォルダから上へ順に最初に見つかった `mdmark.config.yaml` の絶対パスを返す'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: cwd
        type: string
        required: true
        description: 今のフォルダ
      - name: explicit
        type: string | undefined
        required: false
        description: '`--config` の値'
    returns:
      type: Promise<string>
      description: 設定ファイルの絶対パス
    exceptions:
      - name: CliError
        condition: '`--config` のファイルが無い、またはルートまで探しても無い'
        message: mdmark.config.yaml が見つかりません（{探し始めたフォルダ} から上を探しました）。mdmark init で置けます。
    unit_tests:
      - name: test_find_config_file
        case: 正常
        summary: 上のフォルダの設定ファイルを見つける
        condition: '`{一時}/mdmark.config.yaml` があり、`cwd` は `{一時}/a/b`'
        mock: 一時フォルダ
        expected: '`{一時}/mdmark.config.yaml`'
      - name: test_find_config_file_when_explicit
        case: 正常
        summary: '`--config` のパスを優先する'
        condition: '`explicit` に `docs/mdmark.config.yaml`'
        mock: 一時フォルダにそのファイルを置く
        expected: '`{cwd}/docs/mdmark.config.yaml`'
      - name: test_find_config_file_when_missing
        case: 異常
        summary: 見つからないと CliError を投げる
        condition: 一時フォルダと上に設定ファイルが無い
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `mdmark init` が入る'
        exception: CliError
    status: planned
    introduced:
      pr: 32
  - name: loadConfig
    title: 設定ファイルを読む
    container: src/cli/config.ts
    usecase: 共通
    summary: 設定ファイルを yaml の `parse` で読み、形を検めずに返す
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: path
        type: string
        required: true
        description: 設定ファイルの絶対パス
    returns:
      type: 'Promise<{ path: string; dir: string; raw: unknown }>'
      description: 場所と読んだ値（空のファイルは `null`）
    exceptions:
      - name: CliError
        condition: YAML として読めない（`YAMLParseError`）、またはファイルを開けない
        message: '{ファイル} の {行} 行目を YAML として読めません（{誤りの内容}）。字下げと書き方を直してください。'
    unit_tests:
      - name: test_load_config
        case: 正常
        summary: 読んだ値とフォルダを返す
        condition: '`build: {include: ["*.md"], out: a.html}` のファイル'
        mock: 一時フォルダ
        expected: '`raw.build.out` が `a.html`、`dir` が一時フォルダ'
      - name: test_load_config_when_yaml_broken
        case: 異常
        summary: 読めない行を示す CliError を投げる
        condition: 3 行目の字下げが崩れたファイル
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `3 行目` が入る'
        exception: CliError
    status: planned
    introduced:
      pr: 32
  - name: validateConfig
    title: 設定の形を検める
    container: src/cli/config.ts
    usecase: 共通
    summary: 読んだ値を `schemas/mdmark.config.schema.json` と同じ形で検め、合わないところを `schema` のずれで返す
    description: 検めるのは、最上位がオブジェクトであること・`version` が `VERSION_PATTERN` に合う文字列・`features` の値が真偽値・`libraries` の値が文字列でキーが印の名前・`index`・`theme`・`colorTheme` が文字列（`colorTheme` の知らない名前はここでは拒まず、設定に残す）・`extensions` が文字列の配列・`build` があれば `include`（1 つ以上の文字列）と `out`（`.html` の文字列）を持ち `exclude`・`glossary` が文字列の配列で `entry` が文字列であること・`check` があれば `ignore` が印の名前（`MARK_NAME_PATTERN`）の文字列の配列であること・`tooltips` があれば `placement` が `top` か `bottom` であること・`side-toc` があればオブジェクトで `mode` が `hover` か `fixed` であること・`syntax` があればオブジェクトで `url` が文字列であること。`aliases` があれば配列であることを確かめ、行は `validateAliasRows` で検める（ずれをそのまま `schema` のずれに加え、返った行を `config.aliases` に入れる）。知らない最上位のキーは拒まない。`aliases` の行のほかの形の検査は手書きで、ライブラリを足さない（索引の `normalizeIndex` と同じやり方）。検める形は `schemas/mdmark.config.schema.json` と揃える
    kind: 関数
    scope: public
    args:
      - name: raw
        type: unknown
        required: true
        description: '`loadConfig` が読んだ値'
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
    returns:
      type: '{ config: CliConfig; issues: CheckIssue[] }'
      description: 形の合うところだけを残した設定と、`schema` のずれ（無ければ空）
    unit_tests:
      - name: test_validate_config
        case: 正常
        summary: 形の合う設定はずれ 0 件
        condition: '`version: v0.3.0`・`theme`・`extensions`・`build`（`include`・`out`）と知らないキー `title` を持つ値'
        mock: なし
        expected: '`issues` が空'
      - name: test_validate_config_when_build_out_missing
        case: 正常
        summary: '`build.out` が無いと schema のずれを返す'
        condition: '`build` が `include` だけを持つ'
        mock: なし
        expected: '`{ where: "build", kind: "schema" }` の 1 件で、`message` に `build.out` が入る'
      - name: test_validate_config_when_empty
        case: 正常
        summary: 空の設定ファイル（`null`）を schema のずれにする
        condition: '`raw` が `null`'
        mock: なし
        expected: '`{ where: "", kind: "schema" }` の 1 件'
      - name: test_validate_config_when_libraries_not_object
        case: 正常
        summary: 形の違う `libraries` を schema のずれにし、設定から落とす
        condition: '`libraries` が文字列'
        mock: なし
        expected: '`where` が `libraries` のずれが 1 件で、`config.libraries` が無い'
      - name: test_validate_config_when_version_invalid
        case: 異常
        summary: 書式の違う version を schema のずれにする
        condition: '`version: 0.3`'
        mock: なし
        expected: '`where` が `version` の `schema` のずれが 1 件'
      - name: test_validate_config_when_check_ignore_invalid
        case: 正常
        summary: 印の名前の書式に合わない `check.ignore` の値を schema のずれにし、設定から落とす
        condition: '`check.ignore` が `["prettier-ignore", "Bad Name"]`'
        mock: なし
        expected: '`where` が `check.ignore[1]` の `schema` のずれが 1 件で、`config.check.ignore` が `["prettier-ignore"]`'
      - name: test_validate_config_when_tooltip_placement_invalid
        case: 正常
        summary: '`top`・`bottom` 以外の `tooltips.placement` を schema のずれにし、設定から落とす'
        condition: '`tooltips.placement` が `left` の値と、`bottom` の値'
        mock: なし
        expected: '`left` は `where` が `tooltips.placement` の `schema` のずれが 1 件で `config.tooltips` が無い。`bottom` は `issues` が空で `config.tooltips.placement` が `bottom`'
      - name: test_validate_config_when_syntax_url_invalid
        case: 正常
        summary: 文字列でない `syntax.url` を schema のずれにし、設定から落とす
        condition: '`syntax.url` が `1` の値と、`/vendor/hl/` の値'
        mock: なし
        expected: '`1` は `where` が `syntax.url` の `schema` のずれが 1 件で `config.syntax` が無い。`/vendor/hl/` は `issues` が空で `config.syntax.url` が `/vendor/hl/`'
      - name: test_validate_config_when_side_toc_mode_invalid
        case: 正常
        summary: '`hover`・`fixed` 以外の `side-toc.mode` を schema のずれにし、設定から落とす'
        condition: '`side-toc.mode` が `left` の値と、`fixed` の値'
        mock: なし
        expected: '`left` は `where` が `side-toc.mode` の `schema` のずれが 1 件で `config["side-toc"]` が無い。`fixed` は `issues` が空で `config["side-toc"].mode` が `fixed`'
      - name: test_validate_config_when_aliases_invalid
        case: 異常
        summary: aliases の Schema に合わない行を schema のずれにし、行の位置を保つ
        condition: '`aliases` に、Schema に合う行と、`metadata.alias_type` が `{type: custom, value: memo}` の行'
        mock: なし
        expected: '`schema` のずれが 1 件で `where` が `aliases[1].metadata.alias_type.value`、`config.aliases` の長さが 2 で 2 番目が `null`'
      - name: test_validate_config_when_color_theme_invalid
        case: 正常
        summary: 文字列でない `colorTheme` を schema のずれにして落とし、知らない名前はそのまま残す
        condition: '`colorTheme` が `1` の値と、`sepia` の値'
        mock: なし
        expected: '`1` は `where` が `colorTheme` の `schema` のずれが 1 件で `config.colorTheme` が無い。`sepia` は `issues` が空で `config.colorTheme` が `sepia`'
    status: planned
    introduced:
      pr: 32
  - name: requireConfig
    title: 書き出しに使う設定を読む
    container: src/cli/config.ts
    usecase: 共通
    summary: 設定ファイルを探して読み、形が合わなければ `mdmark check` で確かめられることを添えた CliError を投げる
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: cwd
        type: string
        required: true
        description: 今のフォルダ
      - name: explicit
        type: string | undefined
        required: false
        description: '`--config` の値'
    returns:
      type: Promise<LoadedConfig>
      description: 形の合う設定
    exceptions:
      - name: CliError
        condition: 設定ファイルが無い・読めない・`validateConfig` のずれが 1 件以上
        message: '{ファイル} の {場所} が設定の形に合いません（{内容}）。mdmark check で合わないところを確かめられます。'
    unit_tests:
      - name: test_require_config_when_invalid
        case: 異常
        summary: 形が合わないと mdmark check を添えた CliError を投げる
        condition: '`libraries` が文字列の設定ファイル'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `libraries` と `mdmark check` が入る'
        exception: CliError
    callees:
      - '#functions[findConfigFile]'
      - '#functions[loadConfig]'
      - '#functions[validateConfig]'
    status: planned
    introduced:
      pr: 32
  - name: collectBuildDocuments
    title: まとめる文書を集める
    container: src/cli/documents.ts
    usecase: 複数の文書を1枚のHTMLにまとめる
    summary: '`build.include` の glob に当たり `build.exclude` に当たらない `.md` のパスを、glob の並び・同じ glob の中はパスの順で、重なりを除いて返す'
    description: glob は Node の `fs.glob`（`cwd` に設定ファイルのフォルダ、`exclude` に `build.exclude`）で引く。パスは区切りを `/` に揃える
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: dir
        type: string
        required: true
        description: 設定ファイルのあるフォルダ
      - name: build
        type: '{ include: string[]; exclude?: string[] }'
        required: true
        description: 設定の `build`
    returns:
      type: Promise<string[]>
      description: まとめる文書のパス（設定ファイルのフォルダからの相対。無ければ空）
    unit_tests:
      - name: test_collect_build_documents
        case: 正常
        summary: glob の並びとパスの順に並べ、重なりを除く
