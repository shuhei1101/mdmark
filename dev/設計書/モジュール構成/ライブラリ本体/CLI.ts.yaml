  - name: requireConfig
    title: 書き出しに使用する設定を読み込む
    container: src/cli/config.ts
    usecase: 共通
    summary: 端末の設定と上のフォルダの設定ファイルを重ねて読み込み、読み込めない・構造が合わなければ `mdmark check` で確認できることを添えた CliError を投げる
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: cwd
        type: string
        required: true
        description: 今のフォルダ
      - name: explicit
        type: string | undefined
        required: false
        description: '`--config` の値'
    returns:
      type: Promise<LoadedConfig>
      description: 構造の合う設定
    exceptions:
      - name: CliError
        condition: 設定ファイルが無い・読み込めない・`validateConfig` のずれが 1 件以上
        message: '{ファイル} の {場所} が設定の構造に合いません（{内容}）。mdmark check で合わないところを確認できます。'
    unit_tests:
      - name: test_require_config_when_invalid
        case: 異常
        summary: 構造が合わないと mdmark check を添えた CliError を投げる
        condition: '`libraries` が文字列の設定ファイル'
        mock: 一時フォルダ
        expected: '`CliError` を投げ、メッセージに `libraries` と `mdmark check` が入る'
        exception: CliError
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読み込む.ts#functions[loadLayeredConfig]
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読み込む.ts#functions[displayConfigPath]
    status: planned
    introduced:
      pr: 32
    process: |-
      1. 設定を重ねて読み込む（設定を重ねて読み込む。`purpose: export`、`env` は `process.env`、`home` は `os.homedir()`）
         - `ConfigNotFoundError` の場合、その文で `CliError` を投げる
      2. `nearest` が無い場合、今の「`mdmark.config.yaml` が見つかりません」の `CliError` を投げる
      3. `unreadable` がある場合、そのファイルのパス（設定ファイルのパスを表示の構造にする。`base` は `cwd`）と行で、今の「YAML として読み込めません」の `CliError` を投げる
      4. `issues` が 1 件以上の場合、最初のずれのファイルを表示の構造にして、今の「設定の構造に合いません」の `CliError` を投げる
      5. `{ path: nearest, dir: nearest のフォルダ, config }` を返却する。`config` は重ねた設定のパスを相対パスに戻したもの（パスを相対パスに戻す。`dir` は nearest のフォルダ）
