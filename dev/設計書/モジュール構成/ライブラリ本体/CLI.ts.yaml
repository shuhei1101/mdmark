        required: true
        description: '`dist/viewer.js`・`dist/view.js` の絶対パスと、まとめるモジュールの読み込み先'
    returns:
      type: string
      description: 入口のモジュールの JavaScript のソース
    process: |-
      1. `viewer` から `startViewer` を import する行を配置する
      2. `embeds.view` が `true` なら `view` を名前空間で import する行を配置する
      3. `embeds.syntax` があれば、本体と言語ごとに `default` を import する行を配置する。`embeds.mermaid` があれば、mermaid を名前空間で import する行を配置する（mermaid が中で読み込む chunk の動的 `import()` は同じスクリプトに取り込まれる）
      4. `embeds.htmlScripts` があれば、範囲ごとに `compileHtmlScripts` の CommonJS のコードを `(module, exports, require) => { … }` で包んだ関数を、範囲のコードの文字を鍵にした `htmlScripts` の表に配置する行を配置する
      5. `startViewer(document, { parts, syntax, mermaid, libraries, extensions, htmlScripts })` を呼ぶ行を配置する。`mermaid` は `embeds.mermaid` があれば import した名前空間、無ければ持たない。`libraries` はマーカーの名前ごとの `() => import("{読み込み先}")`、`extensions` は `embeds.extensions` の順の `() => import("{読み込み先}")`
    unit_tests:
      - name: test_create_viewer_entry
        case: 正常
        summary: 部品と色分けを静的に、外部ライブラリと拡張を関数で取り込む
        condition: '`embeds` が `{ view: true, libraries: { chart: "https://cdn.example/chart.js" }, extensions: ["/w/ext.js"], syntax: { core: "/w/hl/core.min.js", languages: { typescript: "/w/hl/languages/typescript.min.js" } } }`'
        mock: なし
        expected: ソースに `dist/viewer.js`・`dist/view.js`・`core.min.js`・`typescript.min.js` の静的な `import` があり、`chart` と拡張は `() => import("…")` で、`startViewer(document,` を 1 回呼ぶ
      - name: test_create_viewer_entry_when_nothing_embedded
        case: 正常
        summary: 埋めるものが無ければ起動の処理だけを取り込む
        condition: '`embeds` が `{ view: false, libraries: {}, extensions: [] }`'
        mock: なし
        expected: '`import` は `startViewer` の 1 行だけで、`parts` が `{}`、`syntax` を持たない'
      - name: test_create_viewer_entry_when_mermaid
        case: 正常
        summary: mermaid を名前空間で静的に取り込む
        condition: '`embeds` が `{ view: false, libraries: {}, extensions: [], mermaid: "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs" }`'
        mock: なし
        expected: ソースに `import * as` と mermaid の URL の静的な `import` が 1 行あり、`startViewer(document,` に `mermaid` を指定する
    status: planned
    introduced:
      pr: 296
  - name: bundleViewer
    title: 起動の処理と埋めるモジュールをまとめる
    container: src/cli/embed.ts
    usecase: 共通
    summary: '`createViewerEntry` のソースを入口に、esbuild で分割せずに 1 つの ES モジュールのスクリプトにまとめ、`</script` の並びを `<\/script` に、`<!--` の並びを `<\x21--` に替えて返却する'
    description: '`bundleModule` と同じ設定（`bundle: true`・`format: esm`・`minify: true`・対応ブラウザの `target`・`http:`・`https:` の import を `fetchText` で読み込むプラグイン）で、入口は `stdin`（`resolveDir` は設定ファイルのあるフォルダ）。リテラルとパターンの動的 `import()` は同じスクリプトに取り込まれ、評価は呼び出しまで遅れる。`</script` の並び（大文字小文字を問わない）は `<\/script` に、`<!--` の並びは `<\x21--` に替え、HTML の `script` 要素が途中で閉じないように、また script data escaped state に入って閉じなくならないようにする。esbuild はコードのトークンとして `<!--` を出力せず、どちらの並びも文字列・テンプレート・正規表現・コメントの中にしか現れないため、替えても意味は変わらない（`String.raw` の raw の値だけが変わる）。`prepareEmbeds` が確認したモジュールだけを指定するため、まとめる失敗は例外のまま投げる'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: URL の先を読み込む
    args:
      - name: options
        type: '{ entry: string; baseDir: string; fetchText: FetchText }'
        required: true
        description: '`createViewerEntry` のソース、設定ファイルのあるフォルダ、URL を読み込む関数'
    returns:
      type: Promise<string>
      description: まとめたスクリプト
    unit_tests:
      - name: test_bundle_viewer
        case: 正常
        summary: 入口と関数で取り込んだモジュールを 1 つにまとめ、動的 import を残さない
        condition: 一時フォルダに `startViewer` を export する `viewer.js` と、`load` の中で `./part.js` を動的 `import()` で読み込む `ext.js`。入口は `viewer.js` を静的に、`ext.js` を `() => import(…)` で取り込む
        mock: 一時フォルダ
        expected: 戻り値に `import(` と `from"` の並びが無く、`part.js` の中身を含む
      - name: test_bundle_viewer_when_script_close
        case: 正常
        summary: '`</script` を替えて返却する'
        condition: '`ext.js` が `/*! </SCRIPT> */` の注釈を持つ'
        mock: 一時フォルダ
        expected: 戻り値に `</script` の並び（大文字小文字を問わない）が無く、`<\/SCRIPT>` がある
      - name: test_bundle_viewer_when_html_comment_open
        case: 正常
        summary: '`<!--` を替え、評価した文字列は元と同じ'
        condition: '`ext.js` が `"<!-- <script>"` の文字列を export する'
        mock: 一時フォルダ
        expected: 戻り値に `<!--` の並びが無く、戻り値を評価して取り出した文字列が `<!-- <script>`
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#constraints[まとめるスクリプト]
    status: planned
    introduced:
      pr: 296
