    description: '`extensions` の位置の順に、ファイルが在る拡張だけを束ねる（無いファイルは `checkReferencedFiles` のずれだけにする）。束ねたコードは `importCode` で読み込む。束ねられない・読み込めない・既定の書き出しの `directive` が印の名前（`MARK_NAME_PATTERN`）の文字列でない拡張は、`extensions[{位置}]` を指す `schema` のずれにし、`directive` に入れない。読み込めないときの内容は、元のエラーの 1 行目と、読み込みの時点でブラウザの API を使う処理を `load` の中へ移す直し方'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: 拡張のモジュールを Node で読み込む（モジュールの最上位の処理が動く）
    args:
      - name: loaded
        type: LoadedConfig
        required: true
        description: 形を検めた設定
      - name: file
        type: string
        required: true
        description: ずれの `file` に出す設定ファイルの名前
      - name: importCode
        type: '(code: string) => Promise<unknown>'
        required: false
        default: コードを `data:text/javascript;base64,` の URL にして `import()` する
        passing: injected
        description: 束ねたコードを読み込み、モジュールの名前空間を返す関数（テストで差し替える）
    returns:
      type: 'Promise<{ directives: Set<string>; issues: CheckIssue[] }>'
      description: 読めた拡張の `directive` と、読めなかった拡張の `schema` のずれ
    unit_tests:
      - name: test_load_extension_directives
        case: 正常
        summary: 拡張の既定の書き出しの directive を集める
        condition: 設定の `extensions` に `mdmark init` の雛形の `extensions/example.js`
        mock: 一時フォルダ
