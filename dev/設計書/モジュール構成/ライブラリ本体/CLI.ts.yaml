  - name: bundleViewer
    title: 起動の処理と埋めるモジュールを束ねる
    container: src/cli/embed.ts
    usecase: 共通
    summary: '`createViewerEntry` のソースを入口に、esbuild で分割せずに 1 つの ES モジュールのスクリプトに束ね、`</script` の並びを `<\/script` に、`<!--` の並びを `<\x21--` に替えて返す'
    description: '`bundleModule` と同じ設定（`bundle: true`・`format: esm`・`minify: true`・対応ブラウザの `target`・`http:`・`https:` の import を `fetchText` で読むプラグイン）で、入口は `stdin`（`resolveDir` は設定ファイルのあるフォルダ）。リテラルとパターンの動的 `import()` は同じスクリプトに取り込まれ、評価は呼び出しまで遅れる。`</script` の並び（大文字小文字を問わない）は `<\/script` に、`<!--` の並びは `<\x21--` に替え、HTML の `script` 要素が途中で閉じないように、また script data escaped state に入って閉じなくならないようにする。esbuild はコードのトークンとして `<!--` を出力せず、どちらの並びも文字列・テンプレート・正規表現・コメントの中にしか現れないため、替えても意味は変わらない（`String.raw` の raw の値だけが変わる）。`prepareEmbeds` が確かめたモジュールだけを渡すため、束ねる失敗は例外のまま投げる'
    kind: 関数
    scope: internal
    is_async: true
    side_effects: URL の先を読む
    args:
      - name: options
        type: '{ entry: string; baseDir: string; fetchText: FetchText }'
        required: true
        description: '`createViewerEntry` のソース、設定ファイルのあるフォルダ、URL を読む関数'
    returns:
      type: Promise<string>
      description: 束ねたスクリプト
    unit_tests:
      - name: test_bundle_viewer
        case: 正常
        summary: 入口と関数で取り込んだモジュールを 1 つに束ね、動的 import を残さない
        condition: 一時フォルダに `startViewer` を export する `viewer.js` と、`load` の中で `./part.js` を動的 `import()` で読む `ext.js`。入口は `viewer.js` を静的に、`ext.js` を `() => import(…)` で取り込む
        mock: 一時フォルダ
        expected: 戻り値に `import(` と `from"` の並びが無く、`part.js` の中身を含む
      - name: test_bundle_viewer_when_script_close
        case: 正常
        summary: '`</script` を替えて返す'
        condition: '`ext.js` が `/*! </SCRIPT> */` の注釈を持つ'
        mock: 一時フォルダ
        expected: 戻り値に `</script` の並び（大文字小文字を問わない）が無く、`<\/SCRIPT>` がある
      - name: test_bundle_viewer_when_html_comment_open
        case: 正常
        summary: '`<!--` を替え、評価した文字列は元と同じ'
        condition: '`ext.js` が `"<!-- <script>"` の文字列を export する'
        mock: 一時フォルダ
        expected: 戻り値に `<!--` の並びが無く、戻り値を評価して取り出した文字列が `<!-- <script>`
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#constraints[束ねるスクリプト]
