    status: planned
    introduced:
      pr: 176
  - name: loadAliases
    title: エイリアスを読む
    container: src/cli/aliases.ts
    usecase: 共通
    summary: 設定の `aliases` の行の `paths` を設定ファイルのフォルダから引いて YAML を読み、`buildAliases` に渡して、エイリアスとずれを返す
    description: '`check`・`export`・`build` が共通で使う。オブジェクトで `enabled` が `false` でない行ごとに、`paths` の各 glob を `node:fs/promises` の `glob`（`cwd` は設定ファイルのフォルダ。`globFiles` と同じやり方）で引き、当たったファイルを重ねずパスの順に並べる。当たるファイルが 0 件の行は `alias_no_files`（`file` は設定ファイル、`where` は `aliases[{行の位置}].paths`、`message` は ```{paths を `・` で並べた}` に当たるファイルがありません。`paths` を直してください。``）にする。当たったファイルは `yaml` で読み、読めないファイルは `alias_unreadable`（`file` はそのファイル、`where` は空、`message` は `loadConfig` と同じ形の ``{行} 行目を YAML として読めません（{理由}）。字下げと書き方を直してください。``）にしてそのファイルを使わない。読めたファイルを `MdmarkAliasSource`（`path` は設定ファイルのフォルダからの相対パス）にして、`config.aliases` の行と一緒に `buildAliases`（`configFile` は設定ファイルの名前）に渡し、返った `problems` を `CheckIssue` にする。ずれの並びは行の順で、行ごとに `alias_no_files`・`alias_unreadable` をその行の場所に置き、`buildAliases` の `problems` はその後ろに返った順で置く。設定に `aliases` が無ければファイルを読まず `{ aliases: undefined, issues: [], files: [] }` を返す。`files` は行の `paths` に当たった YAML の絶対パス（読めなかったファイルを含み、重ねずパスの順）で、VS Code 拡張機能のプレビューが見張るファイルに使う'
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: loaded
        type: LoadedConfig
        required: true
