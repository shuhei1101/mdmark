        expected: 表のキーが `共通/手順.md` と `../src/app.ts` で、問題が 0 件
        mock: 一時フォルダに文書を配置する
        summary: 入れ子の取り込みもたどって表を作る
      - name: test_collect_includes_when_problems
        case: 異常
        condition: '`missing.md`・`共通/手順.md#無い見出し`・5 行の `src/app.ts#L8-L10`・根の外の `../../outside.md`・`a.md` と `b.md` の循環'
        expected: '`missing`・`heading`・`lines`（行の数 5）・`outside`・`circular`（順 `a.md → b.md → a.md`）の問題が 1 件ずつで、`outside.md` を読み込んでいない'
        mock: 一時フォルダに文書を配置する
        summary: 取り込めないものを種類ごとの問題にする
  - name: collectIconNodes
    title: 埋めるアイコンの形状を集める
    container: src/cli/icons.ts
    summary: 文書と取り込む文書の `icon:` のうち配布物にまとめていない名前の IconNode を、依存の lucide の `icons` から取り出す。lucide に無い名前は別に返却する
    kind: 関数
    scope: internal
    args:
      - name: markdowns
        type: string[]
        required: true
        description: 文書と取り込む文書の本文
    returns:
      type: '{ icons: Record<string, MdmarkIconNode>; missing: string[] }'
      description: アイコンの形状の表と lucide に無い名前
    unit_tests:
      - name: test_collect_icon_nodes
        case: 正常
        condition: '`` `icon:sailboat` ``・`` `icon:flag` ``（まとめた名前）・`` `icon:no-such-icon` `` を持つ本文'
        expected: '`icons` が `sailboat` だけを持ち、`missing` が `["no-such-icon"]`'
        mock: なし
        summary: まとめていない名前の構造だけを取り出す
  - name: checkIncludes
    title: 取り込み先を点検する
    container: src/cli/check.ts
    summary: 点検する文書ごとに `collectIncludes` を呼び、`circular` の問題を `include_circular`、それ以外を `include_target_missing` のずれにする。内容の文は問題の種類ごとの修正方法を含む
    kind: 関数
    scope: internal
    args:
      - name: options
        type: '{ documents: Array<{ path: string; markdown: string }>; root: string }'
        required: true
        description: '`documents` は `collectCheckDocuments` の文書、`root` は設定ファイルのフォルダ'
    returns:
      type: CheckIssue[]
      description: ずれ
    callees:
      - '#functions[collectIncludes]'
    unit_tests:
      - name: test_check_includes
        case: 正常
        condition: 無いファイル・無い見出し・無い行の範囲・循環・正しい取り込みを持つ文書
        expected: '`include_target_missing` が 3 件と `include_circular` が 1 件で、正しい取り込みのずれが無い'
        mock: 一時フォルダに文書を配置する
        summary: 問題を種類ごとのずれにする
  - name: checkMarkdownSource
    title: 指定した Markdown の記法を点検する
    container: src/cli/markdown-check.ts
    usecase: 文字列とYAMLのキーの記法を点検する
    kind: 関数
    scope: public
    is_async: true
    summary: Markdown の文字列か、YAML のファイルのキーの値を、描いたときの記載の警告・スキップした記法のマーカーの引数・知らないマーカー・図の配置のずれにして返却する。`runCheck` と MCP の `runCheckTool` が呼ぶ
    description: 設定ファイルは `config` か、`cwd` から上へ `CONFIG_FILE` を探して見つかったものを使用し、見つからなければ既定の設定で点検する（`config` を指定して無いときだけ `CliError`）。`file` のときは `readYamlKey` で値と行の置き換えを得る。ずれは `collectWarnings` の警告（設定の `features`・`libraries` を適用する。include の取り込み先が無い警告（`includeTarget` を持つもの）は除く）、`checkUnknownMarks`（`loadExtensionDirectives` の `directive` と `check.ignore` を知っているマーカーに入れる）、`checkDiagrams` のうち `diagram_invalid` でないずれ（定義の誤りは `collectWarnings` が返却するため）を合わせ、行の順（同じ行は警告・知らないマーカーとスキップした引数・配置のずれの順）に並べる。`collectWarnings` の `unknown_mark_arg` はそのまま `unknown_mark_arg` のずれにする。`file` は `text` のとき `-`、`file` のとき設定ファイルのフォルダ（無ければ `cwd`）からの相対パス。`where` は文字列の行を `file` のとき `readYamlKey` の `lineOf` で YAML のファイルの行に置き換えた番号の文字
    args:
      - name: options
        type: '{ cwd: string; config?: string; text?: string; file?: string; key?: string; importCode: (code: string) => Promise<unknown> }'
        required: true
        description: 今のフォルダ・`--config`・点検する文字列か YAML のファイルとキー・拡張を読み込む関数（`loadExtensionDirectives` と同じ）
    returns:
      type: Promise<CheckIssue[]>
      description: ずれの並び（無ければ空）
    exceptions:
      - name: CliError
        condition: '`config` のファイルが無いか読み込めない、`readYamlKey` が投げた'
        message: '`findConfigFile`・`loadConfig`・`readYamlKey` のメッセージ'
    callees:
      - '#functions[readYamlKey]'
      - '#functions[loadExtensionDirectives]'
      - '#functions[checkUnknownMarks]'
      - '#functions[checkDiagrams]'
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[collectWarnings]
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[記法の点検]
    unit_tests:
      - name: test_check_markdown_source
        case: 正常
        summary: 警告・知らないマーカーを行の順に返却し、図の定義の誤りを 1 件にする
        condition: 「正常系（文字列に記載の警告がある）」の文字列を `text` で指定する
        mock: 一時フォルダ
        expected: '`kind` が `diagram_invalid`・`unknown_mark`・`syntax_warning` の 3 件で、`where` が `1`・`20`・`22`、`file` がどれも `-`'
      - name: test_check_markdown_source_when_yaml_key
        case: 正常
        summary: YAML のキーの値のずれを YAML のファイルの行で返却する
        condition: 「正常系（ファイルと YAML のキー）」の `records.yaml` と `items[0].body`
        mock: 一時フォルダ
        expected: '`{ file: "records.yaml", where: "8", kind: "unknown_mark" }` の 1 件'
      - name: test_check_markdown_source_when_extension
        case: 正常
        summary: 設定の拡張のマーカーを知っているマーカーにする
        condition: 設定の `extensions` に `directive` が `note-card` の拡張。文字列は 1 行目に `<!-- note-card -->`、3 行目に `<!-- tabz -->`
        mock: 一時フォルダ
        expected: '`unknown_mark`（`where` が `3`）の 1 件だけ'
      - name: test_check_markdown_source_when_no_config
        case: 正常
        summary: 設定ファイルが無くても既定の設定で点検する
        condition: 設定ファイルの無い一時フォルダで、`<!-- tabz -->` を持つ文字列
        mock: 一時フォルダ
        expected: 例外を投げず、`unknown_mark` の 1 件
      - name: test_check_markdown_source_when_include
        case: 正常
        condition: '`text` に `<!-- include: missing.md -->` と `<!-- tabz -->` を持つ Markdown'
        expected: ずれが `unknown_mark` の 1 件だけで、`missing.md` の `syntax_warning` が無い
        mock: なし
        summary: 取り込み先が無い警告を出さない
      - name: test_check_markdown_source_when_unknown_mark_args
        case: 正常
        summary: 描くときにスキップするマーカーの引数を unknown_mark_arg にする
        condition: 「正常系（文字列の記法のマーカーに知らない引数がある）」の文字列を `text` で指定する
        mock: 一時フォルダ
        expected: '`kind` がどれも `unknown_mark_arg` の 3 件で、`where` が `1`・`1`・`8`、`syntax_warning` が無い'
    status: planned
    introduced:
      pr: 328
  - name: readYamlKey
    title: YAML のキーの値を読み込む
    container: src/cli/markdown-check.ts
    usecase: 文字列とYAMLのキーの記法を点検する
    kind: 関数
    scope: internal
    is_async: true
    summary: YAML のファイルを `yaml` の `parseDocument`（`LineCounter` つき）で読み込み、キーのパスをたどって文字列の値と、値の中の行（1 から）をファイルの行（1 から）に置き換える関数を返却する
    description: キーのパスは `.` でマップのキーを、`[位置]` で配列の要素をたどる（`items[0].body`）。値がブロックスカラー（`BLOCK_LITERAL`・`BLOCK_FOLDED`）なら、値の 1 行目はインジケータ（`|`・`>`）の次の行で、`lineOf(n)` はその行に `n - 1` を追加した行。それ以外の記載方法の値は、`lineOf` がどの `n` にもキーの行を返却する
    args:
      - name: options
        type: '{ path: string; key: string }'
        required: true
        description: YAML のファイルの絶対パスとキーのパス
    returns:
      type: 'Promise<{ value: string; lineOf: (line: number) => number }>'
      description: キーの値と行の置き換え
    exceptions:
      - name: CliError
        condition: ファイルが無い・YAML として読み込めない・キーのパスを読み込めない・キーが無い・値が文字列でない
        message: ファイルと、無いことか読み込めない行か、指定したキーとたどれたところまでのキー（配列なら要素の数）か値の型と、修正方法の 1 文
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#constraints[記法の点検の場所]
    unit_tests:
      - name: test_read_yaml_key
        case: 正常
        summary: ブロックスカラーの値と行を返却する
        condition: '5 行目が `    body: |` の `records.yaml` と `items[0].body`'
        mock: 一時フォルダ
        expected: '`value` が値の文字で、`lineOf(3)` が 8'
      - name: test_read_yaml_key_when_plain
        case: 正常
        summary: ブロックスカラーでない値はキーの行を返却する
        condition: '2 行目が `title: "<!-- tabz -->"` の YAML と `title`'
        mock: 一時フォルダ
        expected: '`lineOf(1)` も `lineOf(5)` も 2'
      - name: test_read_yaml_key_when_missing
        case: 異常
        summary: 無いキーと文字列でない値を CliError にする
        condition: '`items` が 2 要素の `records.yaml` と `items[5].body`、`items[0]`'
        mock: 一時フォルダ
        expected: 1 つ目の文に `items[5].body` と要素が 2 つであること、2 つ目の文に値が文字列でないことがある
    status: planned
    introduced:
      pr: 328
  - name: collectRangeScripts
    title: 範囲のスクリプトを集める
    container: src/render/used.ts
    usecase: 共通
    kind: 関数
    scope: public
    summary: 文書を `renderDocument` で設定と一緒に描き、返った HTML の `template.mdmark-html-script` の言語と、エスケープを戻したコードを記載した順に返却する
    description: '`mount` が変換のライブラリを読み込むのと同じ出力から判定する。`html-scripts` がオフの文書は `template` を出さないため、空を返却する。esbuild を import しないファイルに配置し、CLI の `compileHtmlScripts` と VS Code 拡張機能の `embedLocalLibraries` が使用する'
    args:
      - name: options
        type: '{ markdown: string; config: MdmarkConfig }'
        required: true
        description: 文書の Markdown と設定
    returns:
      type: 'Array<{ lang: "ts" | "js"; source: string }>'
      description: 範囲のスクリプトの言語とコード
    unit_tests:
      - name: test_collect_range_scripts
        case: 正常
        summary: 設定か文書のマーカーでオンの文書の範囲の `ts` を、エスケープを戻して返却する
        condition: "`'` と `<` を含む `ts` の範囲を持つ文書を、`features.html-scripts` が `true` の設定と、設定に記載せず文書に `<!-- features: +html-scripts -->` を持つ場合で呼ぶ"
        mock: なし
        expected: 'どちらも `[{ lang: "ts", source: 範囲のコード }]`'
      - name: test_collect_range_scripts_when_off_or_no_script
        case: 正常
        summary: オフか、範囲に `ts`・`js` が無いと空
        condition: '`features.html-scripts` が `true` で文書に `<!-- features: -html-scripts -->` を持つ場合と、オンで範囲が `html`・`css` だけの場合と、範囲の外に `ts` のコードブロックがある場合'
        mock: なし
        expected: どれも空の配列
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/描画.ts#functions[renderDocument]
    status: planned
