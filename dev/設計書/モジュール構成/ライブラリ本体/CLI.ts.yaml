      - name: test_load_extension_directives_when_browser_api
        case: 異常
        summary: 読み込みの時点でブラウザの API を使う拡張を schema のずれにする
        condition: 最上位で `class extends HTMLElement` を定義する `extensions/broken.js`（`directive` は `broken`）
        mock: 一時フォルダ
        expected: '`directives` が空で、`where` が `extensions[0]` の `schema` のずれが 1 件、`message` に `HTMLElement` と `load` が入る'
      - name: test_load_extension_directives_when_no_directive
        case: 異常
