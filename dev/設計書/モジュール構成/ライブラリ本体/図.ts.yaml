title: "ライブラリ本体 / 図"
lead: 図の部品（フロー図・シーケンス図・グラフ・ER 図・操作できる部品）の定義の型と確かめ、線の形の計算、部品の HTML、記法のコアルール、`mount` が付ける拡大・縮小・移動・全画面・ツールチップ・写す操作。定義から HTML までは DOM を使わず Node でも動き、操作はブラウザでだけ動く。
directory: |-
  ```tree
  src/
  ├── diagram/
  │   ├── definition.ts   # 定義の型・JSON の読み取り・形の確かめ
  │   ├── check.ts        # フロー図の定義の配置の点検（重なり・はみ出し・線の横切り・ラベルの長さ）
  │   ├── er.ts           # ER 図のテーブルの種類・多重度・寸法と、テーブルの高さ・関係の線の経路
  │   └── geometry.ts     # 収まる倍率・line jump・重なる線のずらし・軸の刻み・積み上げ
  ├── parts/
  │   ├── icons.ts        # lucide のアイコンの svg
  │   ├── diagram.ts      # 図の枠・フロー図・シーケンス図・ER 図・図のツールチップ・凡例
  │   ├── chart.ts        # グラフの種類ごとの描き方と系列の見た目の組
  │   ├── er.ts           # ER 図のテーブルと多重度の記号
  │   ├── param.ts        # 操作できる部品
  │   └── hint.ts         # 埋め込んだ HTML のヒントの印と中身
  ├── render/syntax/
  │   └── diagrams.ts     # 図の部品の印の範囲を部品の HTML にするコアルールと、点検が読む図の部品の範囲
  └── interact/
      ├── diagrams.ts     # 拡大・縮小・移動・全画面
      ├── zoom.ts         # 図とライトボックスが共有する拡大・縮小・移動
      ├── diagram-tips.ts # 図のツールチップ
      ├── er-folds.ts     # ER 図の列の開閉
      └── params.ts       # 操作できる部品の値と写す
  ```
notes:
  単体テストのファイル: 物理ファイルごとに `tests/unit/src/{同じパス}.test.ts`（`interact/` は `.browser.test.ts`）を置き、単体テスト作成の段で `test_files` に載せる
  他の分類への変更: 記法のコアルールの順では `buildDiagrams` を図表の番号の前に置き、`fig` の印が図の部品に番号を付けられるようにする。`mount` の `attachInteractions` は `diagrams` がオンなら `attachDiagrams`・`attachParams` を呼ぶ。印刷の前後の `attachPrint`（分類『描く』）は、列を畳んだ ER 図のテーブルを `setErTableFolded` で開き、印刷の後に畳み直す。描画の sanitize は `data-mdmark-own` を持つ要素にだけ図の部品の要素と属性（インターフェース定義『文書をHTML文字列にする』の `残す要素・属性`）を許す。svg の描画の属性は `d`・`viewBox`・`width`・`height`・`x`・`y`・`x1`・`y1`・`x2`・`y2`・`cx`・`cy`・`r`・`rx`・`ry`・`points`・`fill`・`stroke`・`stroke-width`・`stroke-dasharray`・`stroke-linecap`・`stroke-linejoin`・`marker-end`・`markerWidth`・`markerHeight`・`refX`・`refY`・`orient`・`transform`。ER 図の列のマーカーの `abbr` の `title` も、図の部品が出した要素だけに許す。記法の CSS のアイコン（`mask-image` の data URL）は lucide の形に置き換え、形が lucide@1.59.0 と一致することと、外部ライブラリ『lucide』の一覧のアイコンが使う要素と属性が全て sanitize の許可にあることを `tests/unit/src/parts/icons.test.ts` で確かめる。拡張の印の `definition` は分類『拡張』の `MdmarkMarkArgs` に足す
data_models:
  - name: MdmarkFlowDefinition
    title: フロー図の定義
    container: src/diagram/definition.ts
    summary: '`<!-- flow -->` の範囲に書く定義。`dist/index.d.ts` へ書き出す'
    properties:
      - name: title
        type: string
        description: 題名
      - name: scope
        type: string
        description: 範囲
      - name: updated
        type: string
        description: 更新日（`YYYY-MM-DD`）
      - name: width
        type: number
        description: 図の幅（px）
      - name: height
        type: number
        description: 図の高さ（px）
      - name: frame
        type: '{ title: string; x: number; y: number; w: number; h: number } | undefined'
        description: システムの枠
      - name: lanes
        type: '{ label: string; kind: "llm" | "mcp" | "data"; y: number; h: number }[] | undefined'
        description: 枠の中の層。層の箱の色をうっすら敷く
      - name: nodes
        type: MdmarkDiagramNode[]
        description: 箱（`id`・`kind`・`x`・`y`・`w`・`h`・`name`・`tag?`・`sub?`・`io?`・`hint?`）。`hint` は箱の右上の印に出す文。`kind` は `llm`・`dm`・`script`・`mcp`・`data`・`external` と、判定フローチャートの `start`・`question`・`action`・`result`。判定フローチャートは `frame`・`lanes` を持たず、ノードの座標と線の `points` を他のフロー図と同じく定義に書く。`tag`・`name`・`sub` の `{{語}}` は用語の照合に回す
      - name: wires
        type: MdmarkDiagramWire[]
        description: 線（`id`・`from`・`to`・`line`・`points`・`label?`・`labelAt?`・`tip?`）。`from`・`to` は端の箱の `id`、`line` は `flow`・`read`・`write`・`reply`・`loop`、`points` は縦横だけの折れ線
  - name: MdmarkSequenceDefinition
    title: シーケンス図の定義
    container: src/diagram/definition.ts
    summary: '`<!-- sequence -->` の範囲に書く定義'
    properties:
      - name: title
        type: string
        description: 題名
      - name: scope
        type: string
        description: 範囲
      - name: updated
        type: string
        description: 更新日
      - name: participants
        type: '{ id: string; kind: MdmarkDiagramNode["kind"]; name: string; tag?: string }[]'
        description: 相手。左から右へ並べる順
      - name: steps
        type: '{ from: string; to: string; label: string; reply?: boolean; tip?: string }[]'
        description: メッセージ。時刻の順
      - name: loop
        type: '{ label: string } | undefined'
        description: 最後のメッセージから最初へ戻る繰り返し
  - name: MdmarkChartDefinition
    title: グラフの定義
    container: src/diagram/definition.ts
    summary: '`<!-- chart -->` の範囲に書く定義'
    properties:
      - name: type
        type: '"line" | "bar" | "pie" | "scatter" | "area" | "stacked-bar" | "stacked-area" | "horizontal-bar" | "donut" | "radar" | "bubble" | "combo" | undefined'
        description: グラフの種類。省くと `line`
      - name: title
        type: string
        description: 題名
      - name: scope
        type: string
        description: 範囲
      - name: updated
        type: string
        description: 更新日
      - name: x
        type: '{ label: string; ticks?: string[] } | undefined'
        description: 横の軸。`line`・`bar`・`area`・`stacked-bar`・`stacked-area`・`horizontal-bar`・`combo` は `ticks` が必須（`horizontal-bar` は縦に並ぶ項目）、`radar` は `ticks` を軸の名前にし、`scatter`・`bubble` は数値の軸で `ticks` を持たない。`pie`・`donut` は持たない
      - name: y
        type: '{ label: string; min?: number; max?: number; step?: number } | undefined'
        description: 縦の軸。`min`・`max`・`step` は 3 つとも書くか 3 つとも省き、省くと `niceTicks` で切る。`pie`・`donut` は持たない
      - name: series
        type: '{ name: string; points: number[] | [number, number][] | [number, number, number][]; as?: "line" | "bar"; axis?: "y" | "y2" }[] | undefined'
        description: 系列。`pie`・`donut` 以外で 1〜6 つ。`points` の数は `x.ticks` と同じ、`scatter` は `[x, y]`、`bubble` は `[x, y, size]` の組。`as`・`axis` は `combo` だけが読み、`as` は系列の描き方（省くと `line`）、`axis` は使う縦の軸（省くと `y`）
      - name: items
        type: '{ name: string; value: number }[] | undefined'
        description: '`pie`・`donut` の項目。1〜6 つで、`value` は 0 より大きい'
      - name: unit
        type: string | undefined
        description: '`pie`・`donut` の凡例の値と `donut` の中央の合計に付ける単位（例 ` 件`）'
      - name: y2
        type: '{ label: string; min?: number; max?: number; step?: number } | undefined'
        description: '`combo` の右の縦の軸。書き方は `y` と同じ'
      - name: size
        type: '{ label: string } | undefined'
        description: '`bubble` の円の面積が表す値の名前'
  - name: MdmarkParamDefinition
    title: 操作できる部品の定義
    container: src/diagram/definition.ts
    summary: '`<!-- param -->` の範囲に書く定義'
    properties:
      - name: title
        type: string
        description: 部品の題
      - name: knob
        type: '{ key: string; label: string; min: number; max: number; step: number; value: number }'
        description: スライダー。`value` が既定の値
      - name: chart
        type: Omit<MdmarkChartDefinition, "series">
        description: グラフの題と軸
      - name: table
        type: Record<string, number[]>
        description: スライダーの値（文字にしたもの）ごとの点。`min` から `max` まで `step` ごとの全ての値を持つ
  - name: MdmarkErDefinition
    title: ER 図の定義
    container: src/diagram/definition.ts
    summary: '`<!-- er -->` の範囲に書く定義'
    properties:
      - name: title
        type: string
        description: 題名
      - name: scope
        type: string
        description: 範囲
      - name: updated
        type: string
        description: 更新日
      - name: width
        type: number
        description: 図の幅（px）。高さはテーブルの位置と列の数から求める
      - name: tables
        type: MdmarkErTable[]
        description: テーブル。定義の座標に置く
      - name: relations
        type: MdmarkErRelation[]
        description: 関係
    status: planned
    introduced:
      pr: 298
  - name: MdmarkErTable
    title: ER 図のテーブル
    container: src/diagram/definition.ts
    summary: '`MdmarkErDefinition` の `tables` の 1 つ'
    properties:
      - name: id
        type: string
        description: 関係の `from`・`to` で指す名前
      - name: name
        type: string
        description: 物理名
      - name: label
        type: string
        description: 論理名
      - name: kind
        type: '"master" | "transaction" | undefined'
        description: 種類。見出しの札と既定の色を決める
      - name: color
        type: ColorName | undefined
        description: 色の名前（分類『部品』の `ColorName`。`dist/index.d.ts` は `src/index.ts` から辿れる型を書くため、`dist/parts/colors.d.ts` の `ColorName` も型の解決に含まれる）。`kind` の既定の色より優先する
      - name: desc
        type: string | undefined
        description: 概要。テーブルのツールチップに出す
      - name: x
        type: number
        description: 左端（px）
      - name: y
        type: number
        description: 上端（px）
      - name: w
        type: number
        description: 幅（px）
      - name: folded
        type: boolean | undefined
        description: 主キーと外部キーの列だけを出した状態で開くか
      - name: columns
        type: '{ name: string; type: string; pk?: boolean; fk?: boolean; nn?: boolean; desc?: string }[]'
        description: 列。定義の順に並べる
    status: planned
    introduced:
      pr: 298
  - name: MdmarkErRelation
    title: ER 図の関係
    container: src/diagram/definition.ts
    summary: '`MdmarkErDefinition` の `relations` の 1 つ'
    properties:
      - name: from
        type: string
        description: 元のテーブルの `id`
      - name: fromColumn
        type: string
        description: 元のテーブルの列の `name`
      - name: fromCard
        type: '"1" | "0..1" | "1..n" | "0..n"'
        description: 元の端の多重度
      - name: to
        type: string
        description: 先のテーブルの `id`
      - name: toColumn
        type: string
        description: 先のテーブルの列の `name`
      - name: toCard
        type: '"1" | "0..1" | "1..n" | "0..n"'
        description: 先の端の多重度
      - name: label
        type: string | undefined
        description: 縦の線の中ほどに出すラベル
      - name: midX
        type: number | undefined
        description: 縦の線の x（px）。省くと両端の中間
    status: planned
    introduced:
      pr: 298
  - name: DefinitionResult
    title: 定義を読んだ結果
    container: src/diagram/definition.ts
    summary: '`readDefinition` の戻り値'
    properties:
      - name: ok
        type: boolean
        description: 読めたか
      - name: definition
        type: MdmarkFlowDefinition | MdmarkSequenceDefinition | MdmarkChartDefinition | MdmarkParamDefinition | MdmarkErDefinition | undefined
        description: 読めた定義
      - name: problems
        type: string[]
        description: 読めない箇所と直し方の文（画面設計『文書』の書き方の警告の文言）。読めたときは空
constants:
  - name: DIAGRAM_DIRECTIVES
    title: 図の部品の印
    container: src/diagram/definition.ts
    summary: 図の部品の印の名前と、書き方の警告に出す図の種類の名前・呼び名
    entries:
      - key: flow
        value: '{ name: "フロー図", call: "この図" }'
      - key: sequence
        value: '{ name: "シーケンス図", call: "この図" }'
      - key: chart
        value: '{ name: "グラフ", call: "このグラフ" }'
      - key: param
        value: '{ name: "操作できる部品", call: "この部品" }'
      - key: er
        value: '{ name: "ER 図", call: "この ER 図" }'
  - name: LINE_STYLES
    title: 線の種類の描き方
    container: src/parts/diagram.ts
    summary: 線の種類ごとの破線・太さ・矢じり・凡例の名前。色は CSS 変数で当てる
    entries:
      - key: flow
        value: '{ dash: "", width: 1.5, head: "filled", label: "処理の流れ" }'
      - key: read
        value: '{ dash: "6 4", width: 1.5, head: "open", label: "読む" }'
      - key: write
        value: '{ dash: "", width: 2.5, head: "filled", label: "書く" }'
      - key: reply
        value: '{ dash: "4 3", width: 1.5, head: "open", label: "返す" }'
      - key: loop
        value: '{ dash: "8 4", width: 1.5, head: "open", label: "戻る（ループ）" }'
  - name: ZOOM
    title: 拡大・縮小と移動の量
    container: src/diagram/geometry.ts
    summary: 1 回の倍率・上限・1 回の移動量
    entries:
      - key: step
        value: '1.25'
      - key: max
        value: '3'
      - key: pan
        value: '80'
  - name: JUMP_RADIUS
    title: 飛び越えの弧の半径
    container: src/diagram/geometry.ts
    summary: line jump の弧の半径（px）
    value: '6'
  - name: OVERLAP_OFFSET
    title: 重なる線のずらし
    container: src/diagram/geometry.ts
    summary: 同じ向きで重なる線をずらす幅（px）
    value: '4'
  - name: NODE_KINDS
    title: ノードの種類の並び
    container: src/diagram/definition.ts
    summary: '`MdmarkDiagramKind` の値の並び。知らない種類の書き方の警告の「使える種類」はこの順に `・` でつなぐ'
    value: '`llm`・`dm`・`script`・`mcp`・`data`・`external`・`start`・`question`・`action`・`result`'
  - name: KIND_STYLES
    title: ノードの種類の描き方
    container: src/parts/diagram.ts
    summary: ノードの種類ごとの種類の行の既定の名前・凡例の名前・lucide のアイコン。色と形は CSS が `data-kind` で当てる
    entries:
      - key: llm
        value: '{ tag: "LLM", legend: "LLM", icon: "bot" }'
      - key: dm
        value: '{ tag: "意思決定モデル", legend: "意思決定モデル", icon: "split" }'
      - key: script
        value: '{ tag: "スクリプト", legend: "スクリプト", icon: "code-xml" }'
      - key: mcp
        value: '{ tag: "MCP", legend: "MCP", icon: "plug" }'
      - key: data
        value: '{ tag: "データ", legend: "データ（下の角が丸いノード）", icon: "database" }'
      - key: external
        value: '{ tag: "外部", legend: "外部のシステム", icon: "globe" }'
      - key: start
        value: '{ tag: "開始", legend: "開始", icon: "play" }'
      - key: question
        value: '{ tag: "質問", legend: "質問", icon: "circle-question-mark" }'
      - key: action
        value: '{ tag: "アクション", legend: "アクション", icon: "wrench" }'
      - key: result
        value: '{ tag: "結果", legend: "結果", icon: "flag" }'
  - name: CIRCLE_INSET
    title: 円に内接する正方形の外の余白の割合
    container: src/parts/diagram.ts
    summary: 開始のノードの直径に対する、名前を置く内接の正方形の外の余白の割合（`(1 - 1/√2) / 2`）
    value: '0.1464'
  - name: SERIES_STYLES
    title: 系列の見た目の組
    container: src/parts/chart.ts
    summary: 系列と項目の位置ごとの、色・線の模様・点の形・塗りの模様の組。5・6 つ目を追加する
    value: 6 つの組。5 つ目は `stroke-dasharray` `9 3 1 3 1 3`・逆三角形・縦線の模様、6 つ目は `3 2`・十字・横線の模様
    status: planned
    introduced:
      pr: 275
  - name: LABEL_METRICS
    title: ラベルの長さの目安
    container: src/diagram/check.ts
    summary: 描いた文書の CSS の `.mdmark-diagram-node` と同じ文字の大きさと余白。CSS を修正したときは合わせて修正する
    value: 種類 11px・名前 14px・補足 12px・行の高さ 1.4 倍・余白 上下 6px 左右 10px
    status: planned
    introduced:
      pr: 275
  - name: ER_TABLE_KINDS
    title: ER 図のテーブルの種類
    container: src/diagram/er.ts
    summary: テーブルの `kind` ごとの見出しの札の名前と、`color` を省いたときの色の名前。`readDefinition` の使える種類はこの順に `・` でつなぐ
