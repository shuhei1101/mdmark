  - name: renderDiagramFrame
    title: 図の枠を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 部品設計『図の枠』の HTML。題・ボタンの帯（縮小・倍率・拡大・全画面。倍率のボタンは全体が収まる倍率を 100% とした等幅の数字の `{倍率}%` と読み上げの名前 `倍率 {倍率}%。全体が収まる倍率に戻す`。`zoom` は定義の大きさを 1 とする倍率で、大きさの箱と中身の `scale()` に使う。倍率のボタンの文字は `zoom / fit`、縮小の `disabled` と移動のボタンの有無は `zoom <= fit`、拡大の `disabled` は `zoom >= ZOOM.max` で決める。`fit` は省くと 1）・表示する枠・ツールチップの中身・凡例を並べ、表示する枠に `body` を差す。`id` は `render` の中の通し番号で文書の中で一意にする
    args:
      - name: frame
        type: '{ kind; title; scope; updated; legend; zoom?; fit?; modal?; id: string }'
        required: true
        description: 部品設計の引数と、題・ツールチップに使う `id` の頭
      - name: body
        type: '{ html: string; width: number; height: number; tips: string }'
        required: true
        description: 中の図の HTML と大きさ、ツールチップの中身の HTML
    returns:
      type: string
      description: '`figure.mdmark-diagram` の HTML'
    unit_tests:
      - name: test_render_diagram_frame
        case: 正常
        summary: 題・ボタンの帯・凡例をこの順に出す
        condition: '`kind` が `flow`、`legend` が 2 項目'
        mock: なし
        expected: '`figcaption`・`role="toolbar"`・`role="group"` の表示する枠・`aria-label="凡例"` の `ul` がこの順にあり、移動のボタンのまとまりが `hidden`'
      - name: test_render_diagram_frame_when_modal
        case: 正常
        summary: モーダルでは閉じるボタンを置く
        condition: '`modal` が `true`'
        mock: なし
        expected: '`aria-label="全画面を閉じる"` のボタンがあり、全画面で開くボタンが無い'
      - name: test_render_diagram_frame_when_zoom_button
        case: 正常
        summary: 戻すのボタンを置かず、倍率をボタンにする
        condition: '`zoom` が `0.6875`、`fit` が `0.55`'
        mock: なし
        expected: 帯のボタンが `縮小`・`倍率 125%。全体が収まる倍率に戻す`・`拡大`・`全画面で開く` の順で、倍率のボタンの文字が `125%`、`rotate-ccw` のアイコンが無い
  - name: renderFlow
    title: フロー図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: 定義の座標に枠・層・ノードを置き、`jumpPaths` のパスで線を svg に描く。判定フローチャートのノードは `data-kind` で CSS が形（開始は円・アクションは角の丸くない四角・結果は両端の丸い形）を当て、質問のノードにはノードの幅と高さを `viewBox` にした菱形の `polygon` の svg（`aria-hidden`）を置く。名前は形に内接する四角に置き、質問は上下に高さの 1/4・左右に幅の 1/4、開始は幅 × `CIRCLE_INSET` の余白を `style` に当てる。箱の種類のアイコン・`io` か `hint` を持つ箱の右上の印・線のラベルを置き（`hints` がオフなら印とツールチップの中身を置かない）、`{{語}}` は用語の照合に回す
    args:
      - name: definition
        type: MdmarkFlowDefinition
        required: true
        description: 読めた定義
      - name: id
        type: string
        required: true
        description: ツールチップと矢じりの `id` の頭
      - name: hints
        type: boolean
        required: true
        description: 機能 `hints` がオンか
      - name: lookup
        type: TermLookup
        required: false
        description: 箱の中の `{{語}}` の意味を引く関数。省くと語だけを出す
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_flow
        case: 正常
        summary: 枠・層・箱・線・ツールチップを出す
        condition: '`inquiry` の定義'
        mock: なし
        expected: 層が 3 つ、箱が 9 つ、線が 10 本、`role="tooltip"` が `tip` の線と `io` の箱の数だけあり、`loop` の線が `stroke-dasharray="8 4"` を持つ
      - name: test_render_flow_when_text_escaped
        case: 異常
        summary: 定義の文字の HTML を文字にする
        condition: 箱の `name` が `<img src=x onerror=alert(1)>`
        mock: なし
        expected: 出力に `<img` が無く、`&lt;img` がある
      - name: test_render_flow_when_hint
        case: 正常
        summary: hint だけを持つ箱にも印を置き、hints がオフなら印もツールチップも置かない
        condition: '`inquiry-hint` の定義を `hints` が `true` と `false` で描く'
        mock: なし
        expected: '`true` で箱 `mcp` の印が `aria-label="「窓口の MCP」の説明"` を持ち、`false` で `role="tooltip"` と箱の印が無く、線のラベルと箱の名前はある'
      - name: test_render_flow_when_judgement
        case: 正常
        summary: 判定フローチャートのノードを種類ごとの形と余白で描く
        condition: モックの `judgement` の定義
        mock: なし
        expected: '`data-kind` が `start`・`question`・`action`・`result` のノードが 1・2・1・2 つあり、質問のノードだけが `viewBox="0 0 280 136"` と `points="140,0 280,68 140,136 0,68"` の `aria-hidden="true"` の svg を持ち、質問のノードの `style` が `padding:34px 70px`、開始のノードの `style` が `padding:14.6px`、線のラベルに `YES`・`NO` がある'
  - name: renderSequence
    title: シーケンス図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: '相手を左から右に等間隔で、メッセージを上から下に等間隔で置き、`reply` は破線と開いた矢じり、`loop` は右の帯を通る破線と戻り先のラベルにする。相手の行は別の層にし、表示する枠の縦のスクロールの量を倍率で割った分だけ `translateY` で下げて上端に留める（`attachDiagrams` が動かす）'
    args:
      - name: definition
        type: MdmarkSequenceDefinition
        required: true
        description: 読めた定義
      - name: id
        type: string
        required: true
        description: '`id` の頭'
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身
    unit_tests:
      - name: test_render_sequence
        case: 正常
        summary: 相手とメッセージを順に置く
        condition: '`inquiry-seq` の定義'
        mock: なし
        expected: 相手の箱の x が定義の順に増え、メッセージの y が順に増え、`reply` の線と戻りの線が破線で、戻り先のラベルがある
  - name: renderChart
    title: グラフを描く
    container: src/parts/chart.ts
    kind: 関数
    scope: internal
    summary: '`type` ごとに svg に描く。`line` は軸・目盛り・系列の折れ線と点、`bar` は目盛りごとに系列の棒を並べ、`scatter` は横と縦の数値の軸に点を置き、`pie` は 12 時から時計回りに扇形を並べて扇形の外に整数の割合（合計が 100 になるよう最大剰余法で丸める）を置く。`area` は折れ線の下を系列の塗りで塗り、`stacked-bar`・`stacked-area` は `stackSeries` で積み上げ（負の値は 0 から下へ積み、`stacked-bar` は棒の上に合計を置く）、`horizontal-bar` は項目を縦に並べて値を横の長さにし、`donut` は `pie` の中を空けて中央に合計と `合計{unit}` を置き、`radar` は `x.ticks` の軸を放射状に並べて系列を多角形にし、`bubble` は `size` の値を円の面積にし、`combo` は系列ごとに `as` の描き方で重ね、`axis` が `y2` の系列を右の軸で描く。系列と円の項目は位置で `SERIES_STYLES` の色（`--mdmark-color-series-{n}`）と、線の模様・塗りの模様（svg の `pattern`）・点の形の組を決める。縦の軸の範囲を省いた定義は `niceTicks` で切る'
    args:
      - name: definition
        type: MdmarkChartDefinition
        required: true
        description: 読めた定義
      - name: id
        type: string
        required: true
        description: 塗りの模様の `pattern` の `id` の頭
    returns:
      type: '{ html: string; width: number; height: number; tips: string }'
      description: 図の中身。`tips` は空
    unit_tests:
      - name: test_render_chart
        case: 正常
        summary: 系列ごとに線と点を描き、読み上げに値を載せる
        condition: '`reply-time` の定義'
        mock: なし
        expected: '`data-series` が 1・2 の線があり、点が 5 つずつ、svg の `aria-label` が `返信までの時間。自動返信: 12・9・14・8・10。担当者: 42・38・51・35・44`'
      - name: test_render_chart_when_bar
        case: 正常
        summary: 棒を系列ごとの塗りの模様で描き、縦の軸をデータから切る
        condition: '`inquiry-count` の定義'
        mock: なし
        expected: '`rect` の棒が 8 本で、系列 2 の棒の `fill` が斜線の `pattern` を指し、縦の軸の目盛りが `0`・`50`・`100`・`150`'
      - name: test_render_chart_when_pie
        case: 正常
        summary: 扇形の外に合計 100 の整数の割合を置き、凡例に名前と値を出す
        condition: '`reply-kind` の定義（186・92・22）'
        mock: なし
