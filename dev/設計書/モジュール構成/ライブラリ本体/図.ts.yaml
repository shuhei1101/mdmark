  - name: attachDiagrams
    title: 図の拡大・縮小・移動・全画面を付ける
    container: src/interact/diagrams.ts
    kind: 関数
    scope: internal
    summary: '`root` の中の `figure.mdmark-diagram` ごとに、`fitScale` で開いたときの倍率を当て、縮小・拡大・倍率のボタン（倍率のボタンは `0` と同じく開いたときの倍率と位置に戻し、倍率が変わるたびに文字と読み上げの名前を書き換える）・`+`・`-`・`0`・矢印キー・余白のドラッグ・全画面のボタンを付ける。倍率は図の中身に `transform: scale()` を掛け、大きさの箱を倍率を掛けた大きさにしてスクロールさせる。文書の中の表示する枠は、開いたときと開いたときの倍率に戻したときに `style.height` を定義の高さ × 全体が収まる倍率と `--mdmark-diagram-max-height` の計算値（`style.maxHeight` を外して読む `getComputedStyle` の `maxHeight`）の小さいほうにし、倍率を当てるたびに `style.maxHeight` を定義の高さ × 今の倍率にする（使う側が高さを変えたとき、36rem で止めず図の全体が収まる高さまで広げられる）。全画面に写す枠は `style.height` と `style.maxHeight` を外す。印刷では CSS（`@media print .mdmark`）がインラインの高さと上限を外す。表示する枠の大きさを `ResizeObserver` で見て、開いたときの倍率のままなら求め直す。ER 図の図には `attachErFolds` を付ける。ホイールは受け取らない。倍率と移動の操作（ボタン・`+`・`-`・`0`・矢印キー・ドラッグ）は `attachZoom` に `percentBase: "fit"` で任せ、表示する枠の高さの付け替えだけをこの関数が持つ'
    args:
      - name: options
        type: '{ root: HTMLElement; placement: TooltipPlacement }'
        required: true
        description: 描いた要素と、図のツールチップを先に出す側（`attachDiagramTips` と `openDiagramDialog` へ渡す）
    returns:
      type: () => void
      description: 付けた操作と監視を外し、開いている全画面を閉じる関数
    callees:
      - '#functions[fitScale]'
      - '#functions[openDiagramDialog]'
      - '#functions[attachZoom]'
      - '#functions[attachErFolds]'
    unit_tests:
      - name: test_attach_diagrams
        case: 正常
        summary: 収まる倍率で開き、拡大と戻す
        condition: 幅 600px の要素に幅 1100 のフロー図
        mock: なし
        expected: 倍率の表示が `100%` で縮小が `disabled`、拡大の後に `125%`、`0` の後に `100%`
      - name: test_attach_diagrams_when_max
        case: 正常
        summary: 上限で拡大を押せなくする
        condition: 拡大を 10 回押す
        mock: なし
        expected: 倍率の表示が `550%`（定義の大きさの 3 倍）で拡大が `disabled`
      - name: test_attach_diagrams_when_panned
        case: 正常
        summary: 拡大した間だけ移動のボタンを出し、矢印キーで動かす
        condition: 拡大を 2 回押して表示する枠で `ArrowRight`
        mock: なし
        expected: 移動のボタンのまとまりが `hidden` を持たず、`scrollLeft` が 80 増える
      - name: test_attach_diagrams_when_wheel
        case: 正常
        summary: ホイールで倍率を変えない
        condition: 表示する枠に `wheel`
        mock: なし
        expected: 倍率が変わらず `defaultPrevented` が `false`
      - name: test_attach_diagrams_when_cleaned_up
        case: 正常
        summary: 外すと監視も外れる
        condition: 戻り値を呼ぶ
        mock: '`ResizeObserver.prototype.disconnect` を呼ばれた回数を数える関数で包む'
        expected: '`disconnect` が図の数だけ呼ばれ、拡大を押しても倍率が変わらない'
      - name: test_attach_diagrams_when_zoom_button
        case: 正常
        summary: 倍率のボタンで開いたときの倍率と位置に戻す
        condition: 幅 600px の要素に幅 1100 のフロー図。拡大を 2 回押して表示する枠を `ArrowRight` で動かし、倍率のボタンを押す
        mock: なし
        expected: 押す前の読み上げの名前が `倍率 156%。全体が収まる倍率に戻す`、押した後に文字が `100%` で `scrollLeft` が 0、開いたときの倍率で押しても倍率が変わらない
      - name: test_attach_diagrams_when_tall
        case: 正常
        summary: 開いたときの高さを `--mdmark-diagram-max-height` で抑え、上限を図の全体が収まる高さにする
        condition: 幅 600px の要素に幅 600・高さ 1200 のフロー図（`--mdmark-diagram-max-height` は既定の 36rem = 576px）
        mock: なし
        expected: 表示する枠の `clientHeight` が 576 で、`style.maxHeight` が `1200px`
      - name: test_attach_diagrams_when_resized
        case: 正常
        summary: 使う側が高さを変えると、36rem を超えて図の全体が収まる高さまで広がり、倍率に合わせて上限を付け替える
        condition: 幅 600px の要素に幅 600・高さ 1200 のフロー図。表示する枠の `style.height` を `1000px`、`1500px` の順にし、拡大を 1 回押し、`0` を押す
        mock: なし
        expected: '`clientHeight` が 1000、1200（上限で止まる）の順になり、拡大の後に `style.maxHeight` が `1500px`、`0` の後に `clientHeight` が 576 で `style.maxHeight` が `1200px`'
  - name: openDiagramDialog
    title: 図を全画面で開く
    container: src/interact/diagrams.ts
    kind: 関数
    scope: internal
    summary: 図の題・中身・凡例を写した `modal` の枠を `dialog` に入れて `root` の中に置き、`showModal()` で開き、拡大・縮小とツールチップ（ER 図は `attachErFolds` も。写した枠は開いたときの列の開閉の状態のまま）を付ける。ツールチップを開いている間は、`dialog` の中の `keydown` の Esc を `preventDefault` してツールチップだけを閉じる（close request を起こさない。`cancel` を取り消す作りは、history-action activation を使い切ると 2 回目から取り消せないため使わない）。閉じるボタンか Esc で閉じたら、`close` で付けた操作と監視を外して `dialog` を消し、フォーカスを全画面のボタンへ戻す
    args:
      - name: options
        type: '{ figure: HTMLElement; opener: HTMLButtonElement; placement: TooltipPlacement }'
        required: true
