      - key: master
        value: '{ label: "マスター", color: "blue" }'
      - key: transaction
        value: '{ label: "トランザクション", color: "orange" }'
    status: planned
    introduced:
      pr: 298
  - name: ER_CARDINALITIES
    title: ER 図の多重度
    container: src/diagram/er.ts
    summary: 関係の端の多重度の値と、凡例に出す名前。`readDefinition` の使える多重度はこの順に `・` でつなぐ
    entries:
      - key: '1'
        value: '"1 つ"'
      - key: 0..1
        value: '"0 か 1 つ"'
      - key: 1..n
        value: '"1 つ以上"'
      - key: 0..n
        value: '"0 以上"'
    status: planned
    introduced:
      pr: 298
  - name: ER_COLUMN_KEYS
    title: ER 図の列のマーカー
    container: src/diagram/er.ts
    summary: 列の `pk`・`fk`・`nn` ごとのマーカーの文字と、`abbr` の `title`・凡例の名前
    entries:
      - key: pk
        value: '{ text: "PK", title: "主キー" }'
      - key: fk
        value: '{ text: "FK", title: "外部キー" }'
      - key: nn
        value: '{ text: "NN", title: "NOT NULL" }'
    status: planned
    introduced:
      pr: 298
  - name: ER_METRICS
    title: ER 図の寸法
    container: src/diagram/er.ts
    summary: テーブルの高さと列の行の位置を求める寸法。描いた文書の CSS の `.mdmark-diagram-er-*` と同じ値。CSS を修正したときは合わせて修正する
    value: 見出しの高さ 44px・列の行の高さ 26px・`非表示 {数} 列` の行の高さ 24px・枠と余白 4px・図の下の余白 32px
    status: planned
    introduced:
      pr: 298
functions:
  - name: parseDefinitionJson
    title: 定義の JSON を読む
    container: src/diagram/definition.ts
    kind: 関数
    scope: internal
    summary: '`JSON.parse` で読み、読めないときは読めたところまでを頭から数え、行・読めた最後の部分（その行の空白を除いた文字）・足りない記号（閉じていない `{`・`[`・`"` の対）を返す'
    args:
      - name: text
        type: string
        required: true
        description: コードブロックの中身
    returns:
      type: '{ ok: true; value: unknown } | { ok: false; line: number; after: string; missing: string }'
      description: 読めた値か、読めない箇所
    unit_tests:
      - name: test_parse_definition_json
        case: 正常
        summary: 読める JSON は値を返す
        condition: '`{"title": "a"}`'
        mock: なし
        expected: '`ok` が `true` で `value.title` が `a`'
      - name: test_parse_definition_json_when_unclosed
        case: 異常
        summary: 閉じの `}` が無い
        condition: '12 行目が `"label": "本文",` で終わる JSON'
        mock: なし
        expected: '`line` が 12、`after` が `"label": "本文",`、`missing` が `}`'
  - name: readDefinition
    title: 定義を読んで形を確かめる
    container: src/diagram/definition.ts
    kind: 関数
    scope: internal
    summary: 印の範囲の `json` のコードブロックの数を確かめ、`parseDefinitionJson` で読み、種類ごとの形（必須の項目・型・列挙の値・線の端の箱の `id`・`id` の重なり・系列の点の数・系列と項目の数の上限 6 つ・`table` の値の漏れ・ER 図の関係の端のテーブルと列・テーブルの `id` と同じテーブルの列の名前の重なり・`kind`・`color`（`isColorName`。書き方の警告に並べる色の名前は `COLOR_NAMES` から出す）・多重度の値）を確かめる。読めない箇所は、書き方の警告の文言の文にして返す。文の中でノードは `ノード「{name}」`・`ノードの id`・`端のノード` と呼ぶ
    args:
      - name: directive
        type: '"flow" | "sequence" | "chart" | "param" | "er"'
        required: true
        description: 印の名前
      - name: blocks
        type: string[]
        required: true
        description: 範囲の `json` のコードブロックの中身
    returns:
      type: DefinitionResult
      description: 読めた定義か、読めない箇所の文
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[isColorName]
    unit_tests:
      - name: test_read_definition
        case: 正常
        summary: モックの見本の定義を読める
        condition: '`inquiry`・`inquiry-seq`・`reply-time`・`strength` と同じ定義（線に `from`・`to` を足したもの）'
        mock: なし
        expected: どれも `ok` が `true`
      - name: test_read_definition_when_kind_unknown
        case: 異常
        summary: ノードの種類が使えない
        condition: 3 つ目のノード（名前 `分類`）の `kind` が `robot`
        mock: なし
        expected: '`problems[0]` が `ノード「分類」の種類 robot は使えません。使える種類は llm・dm・script・mcp・data・external・start・question・action・result です`'
      - name: test_read_definition_when_judgement
        case: 正常
        summary: 判定フローチャートの種類のノードを読める
        condition: モックの `judgement` と同じ定義（`frame`・`lanes` が無く、線に `from`・`to` を足したもの）
        mock: なし
        expected: '`ok` が `true` で `problems` が空'
      - name: test_read_definition_when_points_mismatch
        case: 異常
        summary: 系列の点の数が目盛りと合わない
        condition: 系列 `担当者` の点が 4 つ、`x.ticks` が 5 つ
        mock: なし
        expected: '`problems[0]` が `系列「担当者」の点が 4 つで、横の目盛り（x.ticks）の 5 つと合いません`'
      - name: test_read_definition_when_wire_end_missing
        case: 異常
        summary: 線の端が無い箱を指す
        condition: 線 `w-mail` の `to` が無い箱の `id` `recieve`
        mock: なし
        expected: '`problems[0]` が `線 w-mail の端のノード recieve がありません。ノードの id で書いてください`'
      - name: test_read_definition_when_id_duplicated
        case: 異常
        summary: 箱の id が重なる
        condition: 2 つの箱の `id` が `recv`
        mock: なし
        expected: '`problems[0]` が `ノードの id recv が 2 つあります。別の id にしてください`'
      - name: test_read_definition_when_blocks_count
        case: 異常
        summary: json のコードブロックが 0 つ・2 つ
        condition: '`blocks` が `[]` と 2 つ'
        mock: なし
        expected: どちらも `problems[0]` が `印の範囲に json のコードブロックを 1 つだけ置いてください` を含む
      - name: test_read_definition_when_chart_types
        case: 正常
        summary: 棒・円・散布図のモックの見本を読める
        condition: '`inquiry-count`・`reply-kind`・`length-time`・`inquiry-hint` と同じ定義'
        mock: なし
        expected: どれも `ok` が `true`
      - name: test_read_definition_when_chart_shape_mismatch
        case: 異常
        summary: 種類に合わない項目を読めない箇所にする
        condition: '`type` が `pie` で `items` が無い定義と、`type` が `scatter` で点が数値 1 つの定義と、`y` に `min` だけを書いた定義'
        mock: なし
        expected: どれも `ok` が `false` で、`problems[0]` がそれぞれ `items`・点の形 `[x, y]`・`min`・`max`・`step` を揃えて書くことを含む
      - name: test_read_definition_when_chart_types_added
        case: 正常
        summary: 追加したグラフの種類の定義を読める
        condition: インターフェース定義『文書をHTML文字列にする』の「正常系（追加したグラフの種類）」の 9 つの定義
        mock: なし
        expected: どれも `ok` が `true`
      - name: test_read_definition_when_chart_series_too_many
        case: 異常
        summary: 系列と項目の 7 つ以上を読めない箇所にする
        condition: 系列 7 つの `line` と、項目 7 つの `donut` の定義
        mock: なし
        expected: どちらも `ok` が `false` で、`problems[0]` が系列（`donut` は項目）の数 7 と上限の 6 つを含む
      - name: test_read_definition_when_bubble_point
        case: 異常
        summary: バブルの点の形を確かめる
        condition: '`type` が `bubble` で、点が `[x, y]` の定義'
        mock: なし
        expected: '`ok` が `false` で、`problems[0]` が点の形 `[x, y, size]` を含む'
      - name: test_read_definition_when_er
        case: 正常
        summary: ER 図のモックの見本を読める
        condition: '`shop-er`・`shop-er-colors`・`shop-er-folded` と同じ定義'
        mock: なし
        expected: どれも `ok` が `true`
      - name: test_read_definition_when_er_column_missing
        case: 異常
        summary: 関係がテーブルに無い列を指す
        condition: 関係「注文する」の `toColumn` が、テーブル `orders` に無い `customer`
        mock: なし
        expected: '`problems[0]` が `関係「注文する」の先の列 orders.customer がテーブル orders にありません`'
      - name: test_read_definition_when_er_invalid_values
        case: 異常
        summary: テーブルの id・列の名前の重なりと、使えない種類・色・多重度
        condition: テーブルの `id` が重なる定義、同じテーブルに同じ列の名前がある定義、`kind` が `view`・`color` が `pink`・`toCard` が `many` の定義
        mock: なし
        expected: どれも `ok` が `false` で、`problems[0]` が重なった `id`・列の名前、使える種類 `master・transaction`・色の名前・多重度 `1・0..1・1..n・0..n` をそれぞれ含む
  - name: fitScale
    title: 全体が収まる倍率
    container: src/diagram/geometry.ts
    kind: 関数
    scope: internal
    summary: 図の幅と高さが表示する枠に収まる倍率を返す。100% を超えない
    args:
      - name: content
        type: '{ width: number; height: number }'
