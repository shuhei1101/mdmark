      description: 行の数（空の文字は 0）
    unit_tests:
    - name: test_label_line_count
      case: 正常
      summary: 全角と半角の幅で折り返す
      condition: '`fontSize` 14・`width` 70 で、`あいうえおか` と `abcdefgh`'
      mock: なし
      expected: '`2` と `1`'
    status: planned
    introduced:
      pr: 275
  - name: erTableHeight
    title: ER 図のテーブルの高さ
    container: src/diagram/er.ts
    kind: 関数
    scope: internal
    summary: '`ER_METRICS` で、見出し・出している列の行・畳んだときの `非表示 {数} 列` の行・枠と余白を足した高さを返す。畳んだテーブルは主キーと外部キーの列だけを数える'
    args:
      - name: options
        type: '{ table: MdmarkErTable; folded: boolean }'
        required: true
        description: テーブルと、今畳んでいるか
    returns:
      type: number
      description: 高さ（px）
    unit_tests:
      - name: test_er_table_height
        case: 正常
        summary: 畳んだときは主キーと外部キーの列と非表示の行だけを数える
        condition: 列 5 つ（主キー 1 つ・外部キー 1 つ）のテーブルを、`folded` が `false` と `true` で
        mock: なし
        expected: '`false` は `44 + 26 × 5 + 4`、`true` は `44 + 26 × 2 + 24 + 4`'
    status: planned
    introduced:
      pr: 298
  - name: erRelationRoute
    title: ER 図の関係の線の経路
    container: src/diagram/er.ts
    kind: 関数
    scope: internal
    summary: 元の列の行の縦の中心から先の列の行の縦の中心へ、横・縦・横の直角の線の経路を求める。縦の線の x は `midX`、省いたときは両端の中間。先が元より右なら元の右の辺から先の左の辺へ、左なら元の左の辺から先の右の辺へ結び、同じ `x` のテーブルどうしは両方の右の辺から出す。列が畳まれて見えないときは、見出しの縦の中ほどに結ぶ
    args:
      - name: options
        type: '{ relation: MdmarkErRelation; from: MdmarkErTable; to: MdmarkErTable; folded: (id: string) => boolean }'
        required: true
        description: 関係・元と先のテーブル・テーブルを今畳んでいるか
    returns:
      type: '{ d: string; start: { x: number; y: number; dir: 1 | -1 }; end: { x: number; y: number; dir: 1 | -1 }; label: { x: number; y: number } }'
      description: '`path` の `d`、両端の位置と線がテーブルから出る向き（1 は右、-1 は左）、ラベルの位置（縦の線の中ほど）'
    unit_tests:
      - name: test_er_relation_route
        case: 正常
        summary: 右のテーブルへ横・縦・横で結ぶ
        condition: 元が `x` 40・`w` 200、先が `x` 400 の関係。`midX` を省く
        mock: なし
        expected: '`d` が `M240,{元の y} H320 V{先の y} H400` で、`start.dir` が `1`、`end.dir` が `-1`'
      - name: test_er_relation_route_when_stacked
        case: 正常
        summary: 同じ x のテーブルどうしは両方の右の辺から出す
        condition: 元と先の `x` が 40・`w` が 200、`midX` が 300
        mock: なし
        expected: '`d` の始点と終点の x が 240 で、縦の線の x が 300、`start.dir` と `end.dir` が `1`'
      - name: test_er_relation_route_when_folded
        case: 正常
        summary: 畳んで見えない列へは見出しの中ほどに結ぶ
        condition: 先の列が主キーでも外部キーでもなく、`folded` が先のテーブルで `true`
        mock: なし
        expected: '`end.y` が先のテーブルの `y + 22`'
    status: planned
    introduced:
      pr: 298
  - name: renderErTable
    title: ER 図のテーブルを描く
    container: src/parts/er.ts
    kind: 関数
    scope: internal
    summary: テーブルの `div.mdmark-diagram-er-table`（`data-node`・`data-color`・`left`・`top`・`width` の位置）に、見出し（lucide の `table` のアイコンと物理名、論理名と種類の札、列の開閉のボタン、説明のボタン）と列の `ul`（列ごとに `data-column` を持つ `li`。マーカーは `ER_COLUMN_KEYS` の `abbr`）を置く。全ての列の行を出し、畳んだテーブルは主キーでも外部キーでもない列の行に `hidden` を付けて `非表示 {数} 列` の行を出す。色は `color`、無ければ `ER_TABLE_KINDS` の既定の色にする
    args:
      - name: options
        type: '{ table: MdmarkErTable; tipId: string | undefined; text: (value: string) => string }'
        required: true
        description: テーブルと、説明のボタンが指すツールチップの `id`（`hints` がオフか、テーブルと列のどれも `desc` を持たないときは `undefined`）と、定義の文字（物理名・論理名・列の名前と型）を HTML にする関数（`renderEr` が `renderText` で `{{語}}` を用語の下線にする関数を渡す）。読み上げの名前（`aria-label`）は `{{` と `}}` を除いた論理名で作る
    returns:
      type: string
      description: テーブルの HTML
    unit_tests:
      - name: test_render_er_table
        case: 正常
        summary: 見出しと列の行を出す
        condition: モックの `shop-er` の注文のテーブル。`text` は文字を逃がすだけの関数
        mock: なし
        expected: 見出しに物理名 `orders`・論理名・札 `トランザクション`、`data-color="orange"`、列の行が定義の順で、主キーの列に `abbr[title="主キー"]` の `PK`
      - name: test_render_er_table_when_folded
        case: 正常
        summary: 畳んだテーブルは主キーと外部キー以外の列の行を隠す
        condition: モックの `shop-er-folded` の注文のテーブル
        mock: なし
        expected: 主キーと外部キー以外の列の行が `hidden` を持ち、`非表示 {数} 列` の行があり、開閉のボタンが `aria-expanded="false"`
      - name: test_render_er_table_when_no_kind
        case: 正常
        summary: 種類と色の無いテーブルは札と `data-color` を持たない
        condition: '`kind` と `color` を持たず、主キーと外部キーの列だけのテーブル'
        mock: なし
        expected: 札と `data-color` が無く、開閉のボタンが無い
    status: planned
    introduced:
      pr: 298
  - name: erEndSvg
    title: ER 図の多重度の記号
    container: src/parts/er.ts
    kind: 関数
    scope: internal
    summary: 線の端の位置と向きから、多重度の記号（`1` は縦線 2 本、`0..1` は縦線と丸、`1..n` は鳥の足と縦線、`0..n` は鳥の足と丸）の svg の要素を返す。丸は `data-ring` を持つ
    args:
      - name: options
        type: '{ x: number; y: number; dir: 1 | -1; card: MdmarkErRelation["fromCard"] }'
        required: true
        description: 端の位置・線がテーブルから出る向き・多重度
    returns:
      type: string
      description: svg の要素の HTML
    unit_tests:
      - name: test_er_end_svg
        case: 正常
        summary: 多重度ごとの記号を出す
        condition: '`card` が `1`・`0..1`・`1..n`・`0..n`'
        mock: なし
        expected: '`1` は `line` 2 つ、`0..1` は `line` と `circle[data-ring]`、`1..n` は鳥の足の `path` と `line`、`0..n` は鳥の足の `path` と `circle[data-ring]`'
    status: planned
    introduced:
      pr: 298
  - name: renderEr
    title: ER 図を描く
    container: src/parts/diagram.ts
    kind: 関数
    scope: internal
    summary: '`renderErTable` でテーブルを置き（定義の文字は `renderText` に通し、`{{語}}` を意味のある用語なら下線とツールチップの持ち主にする）、`erRelationRoute` の経路で関係の線（`data-line="er"`）と `erEndSvg` の両端の記号を svg に描き、ラベルを縦の線の中ほどに置く。関係ごとの `g` は `data-er-from`・`data-er-from-column`・`data-er-to`・`data-er-to-column` を持ち、ラベル（`renderText` に通す）は同じ関係の番号の `data-er-relation` を持つ（`attachErFolds` が結び直す）。図の高さは `erTableHeight` で求めたテーブルの下端の最大に下の余白を足す。`hints` がオンなら、`desc` を持つテーブルと `desc` を持つ列のあるテーブルの `renderDiagramTip` の `kind: table` の中身を返す'
    args:
      - name: definition
        type: MdmarkErDefinition
        required: true
        description: 読めた定義
      - name: id
        type: string
        required: true
        description: '`id` の頭'
      - name: hints
        type: boolean
        required: true
        description: '`hints` がオンか'
      - name: lookup
        type: TermLookup | undefined
        required: false
        description: 用語から意味を引く関数（`renderFlow`・`renderSequence` と同じ）
    returns:
      type: '{ html: string; width: number; height: number; tips: string; jumps: boolean; terms: boolean }'
      description: 図の中身と、用語の下線を引いた文字があるか（`terms`。`jumps` は常に `false`）
    callees:
      - '#functions[renderErTable]'
      - '#functions[erRelationRoute]'
      - '#functions[erEndSvg]'
      - '#functions[erTableHeight]'
      - '#functions[renderDiagramTip]'
    unit_tests:
      - name: test_render_er
        case: 正常
        summary: テーブル・関係の線・多重度・ラベルを描く
        condition: モックの `shop-er` の定義、`hints` がオン
        mock: なし
        expected: テーブルが定義の数だけ、関係の `path[data-line="er"]` が関係の数だけあり、両端に多重度の記号とラベルがあり、`tips` に注文のテーブルの `{論理名}（orders）` がある
      - name: test_render_er_when_hints_off
        case: 正常
        summary: '`hints` がオフなら説明のボタンとツールチップを置かない'
        condition: モックの `shop-er` の定義、`hints` がオフ
        mock: なし
        expected: '`button.mdmark-diagram-info` が無く、`tips` が空'
      - name: test_render_er_when_terms
        case: 正常
        summary: 定義の文字の `{{語}}` を用語の下線にする
        condition: テーブルの論理名が `{{顧客}}`、関係のラベルが `{{注文}}する` の定義と、`顧客`・`注文` の意味を返す `lookup`。`hints` がオン
        mock: なし
        expected: 論理名とラベルの `{{顧客}}`・`{{注文}}` が `mdmark-term` の下線になり、`{{`・`}}` が文字に残らず、`tips` に `顧客` の意味があり、`terms` が `true`。説明のボタン・開閉のボタンの読み上げの名前が `「顧客」の…`
    status: planned
    introduced:
      pr: 298
  - name: attachErFolds
    title: ER 図の列の開閉を付ける
    container: src/interact/er-folds.ts
    kind: 関数
    scope: internal
    summary: '`figure` の中の `button.mdmark-diagram-er-fold` の `click`（Enter・Space を含む）で `setErTableFolded` を呼び、フォーカスをボタンに残す。図の倍率は変えない'
    args:
      - name: figure
        type: HTMLElement
        required: true
        description: '`data-diagram="er"` の `figure.mdmark-diagram`（全画面の枠を含む）'
    returns:
      type: () => void
      description: 付けた受け取りを外す関数
    callees:
      - '#functions[setErTableFolded]'
    unit_tests:
      - name: test_attach_er_folds
        case: 正常
        summary: 開閉のボタンで列を畳み、関係の線を結び直す
        condition: 主キー 1 つ・ほかの列 10 個・12 番目に外部キーを持つ `orders` と、その外部キーへ関係を持つ `customers` の ER 図（インターフェース定義『文書を描く』のフロー `正常系（ER 図の列を開閉する）` と同じ定義）で、`orders` の開閉のボタンを押し、もう一度押す
        mock: なし（Chromium）
        expected: 1 回目の後に主キーと外部キー以外の列の行が `hidden` を持ち、ボタンが `aria-expanded="false"`、12 番目の外部キーの列へ結ぶ線の端の y が変わる。2 回目の後に全ての列が出て、線の端の y が初めと同じ。フォーカスがボタンに残る
    status: planned
    introduced:
      pr: 298
  - name: setErTableFolded
    title: ER 図のテーブルの列を畳む・開く
    container: src/interact/er-folds.ts
    kind: 関数
    scope: internal
    summary: テーブルの主キーでも外部キーでもない列の行の `hidden`・`非表示 {数} 列` の行・開閉のボタンの `aria-expanded` とアイコン（`chevrons-down-up`・`chevrons-up-down`）を切り替え、図の中の関係ごとに、テーブルの位置と大きさ（`style` の `left`・`top`・`width`）と列の行の並びから作った `MdmarkErTable` で `erRelationRoute` を求め直し、線の `d`・両端の記号（`erEndSvg`）・ラベルの位置を書き換え、図の高さを `erTableHeight` で求め直す。分類『描く』の `attachPrint` も使う
    args:
      - name: options
        type: '{ table: HTMLElement; folded: boolean }'
        required: true
        description: '`div.mdmark-diagram-er-table` と、畳むか'
    returns:
      type: void
      description: テーブルと図の関係の線を書き換える
    callees:
      - '#functions[erRelationRoute]'
      - '#functions[erEndSvg]'
      - '#functions[erTableHeight]'
    unit_tests:
      - name: test_set_er_table_folded
        case: 正常
        summary: 畳んだテーブルを開き、畳み直す
        condition: モックの `shop-er-folded` を描いた図の注文のテーブルに `folded` を `false`、続けて `true`
        mock: なし（Chromium）
        expected: '`false` の後に全ての列の行が `hidden` を持たず `非表示 {数} 列` の行が無い。`true` の後に描いた直後と同じ HTML'
    status: planned
    introduced:
      pr: 298
