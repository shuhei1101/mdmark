title: ライブラリ本体 / 部品の描画
lead: Storybook（`@storybook/react-vite`）のストーリーに部品の HTML を出す仕組み。部品の HTML を返す描画の口（Node の HTTP サーバー）と、Storybook の設定・描画の口の HTML を描くデコレーター・VS Code の配色を与えるデコレーターを持つ。配布物には入らない。
directory: |-
  ```tree
  scripts/
  └── storybook-render.ts  # 描画の口（部品の HTML と CSS を返す HTTP サーバー）
  .storybook/
  ├── main.ts              # Storybook の設定（@storybook/react-vite・addon-a11y・ストーリーの場所・/render の中継・許すホスト）
  ├── preview.tsx          # デコレーター・MSW の読み込み・描いた後に付ける操作
  ├── server-html.tsx      # 描画の口の HTML を描くデコレーター
  ├── vscode-theme.tsx     # VSCode/* のストーリーに --vscode-* を与えるデコレーター
  ├── preview-head.html    # 描画の口の CSS を読む link
  └── public/
      └── mockServiceWorker.js  # MSW の Service Worker（`msw init` が書く）
  ```
constants:
  - name: RENDER_HOST
    title: 描画の口の待受アドレス
    container: scripts/storybook-render.ts
    summary: 描画の口を外へ出さないための待受アドレス
    value: '"127.0.0.1"'
  - name: storybookConfig
    title: Storybook の設定
    container: .storybook/main.ts
    summary: '`export default` する設定'
    value: '`framework: { name: "@storybook/server-webpack5", options: {} }`・`stories: ["../src/**/*.stories.yaml", "../vscode/src/**/*.stories.yaml"]`・`core: { disableTelemetry: true, allowedHosts }`。`allowedHosts` は環境変数 `STORYBOOK_ALLOWED_HOSTS` をカンマで区切ったもの（無ければ持たない）'
    entries:
      - key: framework
        value: '`@storybook/react-vite`'
      - key: stories
        value: '`["../src/**/*.stories.ts", "../vscode/src/**/*.stories.@(ts|tsx)"]`'
      - key: addons
        value: '`["@storybook/addon-a11y"]`'
      - key: staticDirs
        value: '`["./public", { from: "../dist", to: "/mdmark-dist" }]`（MSW の Service Worker と、パネルのストーリーが読むこのブランチの配布物）'
      - key: core
        value: '`{ disableTelemetry: true, allowedHosts }`。`allowedHosts` は環境変数 `STORYBOOK_ALLOWED_HOSTS` をカンマで区切ったもの（無ければ持たない）'
      - key: viteFinal
        value: '`server.proxy["/render"]` を環境変数 `RENDER_ORIGIN` の描画の口へ向け（`RENDER_ORIGIN` が無ければ例外で起動しない）、`@tailwindcss/vite` を足し、`resolve.alias` の `@` を `vscode/src/webview` に、`resolve.dedupe` を `["react", "react-dom"]` にする'
    refs:
      - dev/設計書/外部ライブラリ/Storybook#
  - name: previewConfig
    title: ストーリーの既定
    container: .storybook/preview.tsx
    summary: '`export default` する `Preview`'
    value: '`{ server: { url, fetchStoryHtml } }`'
    entries:
      - key: decorators
        value: '`[withServerHtml, withVsCodeTheme]`'
      - key: loaders
        value: '`[mswLoader(startWorker)]`（`msw-storybook-addon/csf3` の `mswLoader`。`startWorker` は `msw/browser` の `setupWorker()` を `start({ quiet: true, onUnhandledFrame: "bypass" })` で始めて返す）'
      - key: globalTypes.scheme
        value: '`light`・`dark`（既定 `light`。`VSCode/*` のストーリーの配色）'
      - key: parameters.a11y
        value: '`{ test: "error" }`（addon-a11y の違反をストーリーの失敗にする）'
  - name: VSCODE_THEME_COLORS
    title: VS Code の配色の仮の値
    container: .storybook/vscode-theme.tsx
    summary: '`light`・`dark` ごとの `--vscode-*` の値（Light Modern・Dark Modern。値は `dev/mock/refs/342/assets/panel.css` と同じ）'
    value: '`{ light: { "--vscode-font-family": "system-ui, sans-serif", "--vscode-editor-background": "#ffffff", … }, dark: { … } }`'
functions:
  - name: renderPart
    title: 部品の HTML を返す
    container: scripts/storybook-render.ts
    kind: 関数
    scope: internal
    summary: ストーリーの `server.id` の部品を、問い合わせの引数で描き、描く先の要素（class `mdmark`）で包んで返す
    description: '部品の id から部品の関数を引く表（`notice`・`embed`・`syntax-warning`・`table`・`callout`・`tabs`・`steps`・`tree`・`badge`・`footnote-ref`・`footnotes`・`toc`・`section`・`row-detail`・`figure`・`doc-list`・`text-color`・`image-figure`・`gallery`・`lightbox`・`media`・`gif`・`card`と、VS Code 拡張機能の `media-error`）で描く。ストーリーの引数は問い合わせの文字列で届くため戻す: `notice` の `figure` は `"false"` のときだけ `false`、`embed` の `args` はカンマで区切った配列（空の文字列は `[]`）。それ以外の部品は、JSON として読める値（配列・オブジェクト・数・真偽値）は JSON として読み、読めなければ文字列のまま渡す。`code-block` の `highlight` が `true` のときは、npm の `highlight.js/lib/core` に `language` の言語（`syntaxLanguageOf` で引いた `highlight.js/lib/languages/{モジュール名}`）を登録し、`highlightLines` の行ごとの HTML で、部品の HTML の `mdmark-code-text` の中身（行に分けないときは `code` の中身）を順に置き換える。中身を持つ部品には部品ごとの見本の HTML を中身として渡す（ストーリーの引数 `body` があれば、見本の代わりにそれを渡す）。ストーリーの引数 `scheme` が `dark` のときは描く先の要素に class `mdmark-theme-dark` を加え、`frameWidth` があるときは部品の HTML をその幅の `div` で包む。`comment-button`・`comment-form`・`comment-bubble` は、`document.body` に `position: fixed` で配置する部品を描く先の要素の中に描くため、部品の HTML の前に `.mdmark-comment-add,.mdmark-comment-popover{position:static;max-width:100%}` の `style` を付ける（`max-width` は、描く先の要素の `padding` の内側に枠の幅を収める）。画像・動画・音声の部品の `src` と `poster` に書いた見本のファイル名は、`dev/mock/refs/263/assets/media/` のファイルを読んだ `data:` URL にする（見本に無い名前はそのまま渡す）'
    args:
      - name: options
        type: '{ component: string; params: URLSearchParams }'
        required: true
        description: '`component` は部品の id、`params` は問い合わせの引数'
    returns:
      type: string | undefined
      description: '`<div class="mdmark">{部品の HTML}</div>`。知らない部品は `undefined`'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderNotice]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderEmbed]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSyntaxWarning]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTable]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCallout]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTabs]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSteps]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTree]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderBadge]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderToc]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderSection]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderRowDetail]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderFigure]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderDocList]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderTextColor]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderImageFigure]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderGallery]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderLightbox]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderMedia]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderGif]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderCard]
      - dev/設計書/モジュール構成/VSCode拡張機能/Webview.ts#functions[renderMediaError]
      - dev/設計書/モジュール構成/ライブラリ本体/描く.ts#functions[highlightLines]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderFootnoteRef]
      - dev/設計書/モジュール構成/ライブラリ本体/部品.ts#functions[renderFootnotes]
    unit_tests:
      - name: test_render_part_when_notice
        case: 正常
        summary: 知らせの枠を引数どおりに描く
        condition: '`component` が `notice`、`params` が `name=tabs&figure=false`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderNotice({ name: "tabs", figure: false })`'
      - name: test_render_part_when_embed
        case: 正常
        summary: カンマで結ばれた引数を配列に戻して読み込み中の枠を描く
        condition: '`component` が `embed`、`params` が `name=chart&args=a,b`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderEmbed({ name: "chart", args: ["a", "b"] })`'
      - name: test_render_part_when_unknown
        case: 正常
        summary: 知らない部品は返さない
        condition: '`component` が `missing`'
        mock: なし
        expected: '`undefined`'
      - name: test_render_part_when_json_args
        case: 正常
        summary: JSON の引数を戻して表を描く
        condition: '`component` が `table`、`params` の `features` が `["sort"]`、`columns` が `["A"]`、`rows` が `[["1"]]`、`sort` が `{"column":0,"direction":"ascending"}`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderTable({ features: ["sort"], columns: ["A"], rows: [["1"]], sort: { column: 0, direction: "ascending" } })`'
      - name: test_render_part_when_doc_list
        case: 正常
        summary: JSON の引数を戻して文書の一覧を描く
        condition: '`component` が `doc-list`、`params` の `docs` が `[{"path":"README.md","title":"入口"},{"path":"使い方/guide.md","title":"使い方"}]`、`current` が `使い方/guide.md`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderDocList({ docs, current: "使い方/guide.md" })`'
      - name: test_render_part_when_vscode_part
        case: 正常
        summary: 拡張機能の再生できない動画・音声の知らせを引数どおりに描く
        condition: '`component` が `media-error`、`params` が `kind=video&format=webm&path=media/demo.webm`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ `renderMediaError({ kind: "video", format: "webm", path: "media/demo.webm" })`'
      - name: test_render_part_when_code_block_highlighted
        case: 正常
        summary: '`highlight` が `true` のコードブロックを色分けして返す'
        condition: '`component` が `code-block`、`params` が `language=ts&title=&lineNumbers=true&highlight=true&lines=[{"text":"const a = 1;"},{"text":"// b"}]`'
        mock: なし
        expected: 2 つの `mdmark-code-text` の中に `hljs-keyword` と `hljs-comment` の `span` があり、タグを外した文字が元の行と同じ
      - name: test_render_part_when_comment_popover
        case: 正常
        summary: コメントの吹き出しを、描く先の要素の内側に収める `style` を付けて描く
        condition: '`component` が `comment-bubble`、`params` が `quote=テーマの変数&bodies=["本文"]`'
        mock: なし
        expected: '`<div class="mdmark">` で包んだ、`<style>.mdmark-comment-add,.mdmark-comment-popover{position:static;max-width:100%}</style>` に続く `renderCommentBubble({ quote: "テーマの変数", bodies: ["本文"] })`'
  - name: createRenderServer
    title: 描画の口を作る
    container: scripts/storybook-render.ts
    kind: 関数
    scope: internal
    summary: '`GET /render/index.css` に `src/index.css` を、`GET /render/{部品の id}` に部品の HTML を返す HTTP サーバーを作る（待ち受けは呼び出し側）'
    args:
      - name: options
        type: '{ root: string }'
        required: true
        description: 作業ツリーの場所（`src/index.css` を読む）
    returns:
      type: http.Server
      description: 待ち受けていないサーバー
    process: |-
      1. `/render/index.css` は、`src/index.css` を読んで `text/css; charset=utf-8` の 200 で返す。`/render/diagram.js`・`/render/sticky.js` は、`src/interact/diagrams.ts`・`src/interact/sticky.ts` を esbuild で束ねた ES モジュールを `text/javascript; charset=utf-8` の 200 で返す（束ねられなければ 500）
      2. `/render/{部品の id}` は、部品の HTML を返す（部品の HTML を返す）
         - HTML があれば `text/html; charset=utf-8` の 200 で返す
         - 無ければ `知らない部品: {部品の id}` を 404 で返す
      3. それ以外のパスは 404 で返す
    callees:
      - '#functions[renderPart]'
    unit_tests:
      - name: test_create_render_server
        case: 正常
        summary: 部品の HTML を 200 で返す
        condition: '`GET /render/notice?name=chart&figure=true`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 200、`Content-Type` が `text/html; charset=utf-8`、本文に `この図を表示できません`
      - name: test_create_render_server_when_css
        case: 正常
        summary: 本文の CSS を返す
        condition: '`GET /render/index.css`'
        mock: 一時フォルダに `src/index.css` を置く
        expected: 200、`Content-Type` が `text/css; charset=utf-8`、本文が置いた CSS
      - name: test_create_render_server_when_unknown_part
        case: 正常
        summary: 知らない部品は 404 を返す
        condition: '`GET /render/missing`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 404、本文に `missing`
      - name: test_create_render_server_when_sticky_script
        case: 正常
        summary: 見出し行と集計の行を留める処理を束ねて返す
        condition: '`GET /render/sticky.js`'
        mock: なし（`127.0.0.1:0` で待ち受けて要求する）
        expected: 200、`Content-Type` が `text/javascript; charset=utf-8`、本文に `attachStickyRows`
  - name: main
    title: 描画の口を立てる
    container: scripts/storybook-render.ts
    kind: 関数
    scope: public
    summary: 環境変数 `RENDER_PORT` のポートで、`RENDER_HOST` に描画の口を待ち受ける
    description: ファイルの末尾で、`import.meta.main` が `true` のときだけ呼ぶ
    process: |-
      1. `RENDER_PORT` が 1〜65535 の整数でなければ、標準エラーに理由を出し、`process.exitCode` を 1 にして終わる
      2. リポジトリの直下で描画の口を作り（描画の口を作る）、`RENDER_HOST` の `RENDER_PORT` で待ち受ける
    callees:
      - '#functions[createRenderServer]'
    unit_tests:
      - name: test_main_when_port_missing
        case: 異常
        summary: ポートが無ければ待ち受けずに終わる
        condition: '`RENDER_PORT` が無い'
        mock: '`process.env` から `RENDER_PORT` を消す'
        expected: '`process.exitCode` が 1、標準エラーに `RENDER_PORT` が出る'
  - name: withServerHtml
    title: 描画の口の HTML を描く
    container: .storybook/server-html.tsx
    kind: 関数
    scope: public
    summary: ストーリーに `parameters.server.id` があれば、ストーリーの代わりに `ServerHtml` を描くデコレーター。無ければストーリーをそのまま描く
    args:
      - name: Story
        type: StoryFn
        required: true
        description: ストーリー
      - name: context
        type: StoryContext
        required: true
        description: '`parameters.server.id` と `args` を読む'
    returns:
      type: ReactElement
      description: 描く要素
    callees:
      - '#components[ServerHtml]'
  - name: withVsCodeTheme
    title: VS Code の配色を与える
    container: .storybook/vscode-theme.tsx
    kind: 関数
    scope: public
    summary: '`title` が `VSCode/` で始まるストーリーで、`globals.scheme` の `VSCODE_THEME_COLORS` を `document.documentElement` の `style` に与え、`body` に class `vscode-light`・`vscode-dark` を付けるデコレーター。パネルの CSS（`panel.css`）を読む'
    description: Webview の `:root` のトークンは `--vscode-*` と同じ要素で計算されるため、ストーリーの要素でなく `:root` に与える
    args:
      - name: Story
        type: StoryFn
        required: true
        description: ストーリー
      - name: context
        type: StoryContext
        required: true
        description: '`title` と `globals.scheme` を読む'
    returns:
      type: ReactElement
      description: 描く要素
notes:
  ストーリーの場所: '部品『部品』のストーリーは `src/parts/*.stories.ts`（CSF。`meta` の `title` と `parameters.server.id`、ストーリーごとの `args` だけを持ち、描くのは `withServerHtml`）。ストーリーの ID は server 形式のときと同じ（`title` と export 名から作る）。`preview-head.html` は `<link rel="stylesheet" href="/render/index.css">` を持ち、ストーリーに本文の CSS を当てる。`preview.tsx` は、描いた直後のストーリーの `.mdmark` に、`data-story-fit` の印を持つ図なら `/render/diagram.js` の `attachDiagrams` を、表の部品（`.mdmark-table`）を持つなら `/render/sticky.js` の `attachStickyRows` を、ファイルツリーなら `/render/trees.js` の `alignFileTreeNotes` を付け、止めた GIF の `canvas` に最初のフレームを描く（`mount` が付けるのと同じ。`import()` は `/* @vite-ignore */`）。VS Code 拡張機能の React の部品のストーリーは、設計書『VS Code 拡張機能 / Webview』の部品の横に置く'
  起動: 描画の口を `RENDER_PORT={ポート} node scripts/storybook-render.ts`（`npm run storybook:render`）で立て、Storybook を `RENDER_ORIGIN=http://127.0.0.1:{描画の口のポート} storybook dev --host 127.0.0.1 --exact-port -p {ポート}`（`npm run storybook -- ...`）で立てる。WSL の `/mnt/c` では開発サーバーがファイルの変更を拾わないため、ストーリーを修正したら起動し直す
  依存: '`storybook`・`@storybook/react-vite`・`@storybook/addon-a11y` を `10.6.2`、`msw`・`msw-storybook-addon` を開発の依存に足し、`@storybook/server-webpack5`・`@storybook/server` と `package.json` の `overrides` の `webpack-dev-middleware` を削除する。React・Tailwind は直下の開発の依存にも足し（`vscode/` と同じバージョン）、`resolve.dedupe` で 1 つにする。ストーリーの色分けに npm の `highlight.js` を `11.12.0` で開発の依存に足す（`src/` は型だけを `import type` で使う）。どれも配布物には入らない'
  単体テストの場所: '`renderPart`・`createRenderServer`・`main` は `tests/unit/scripts/storybook-render.test.ts`（`unit` プロジェクト）。`.storybook/` の中は Storybook を立てて確かめる'
test_files:
  - tests/unit/scripts/storybook-render.test.ts
components:
  - name: ServerHtml
    title: 描画の口の HTML
    container: .storybook/server-html.tsx
    kind: コンポーネント
    summary: '`/render/{id}?{引数}` を取り、本文の HTML を ref の要素の `innerHTML` に入れる。200 でなければ状態コードと本文で例外を投げ、Storybook のエラーにする'
    reason: 知らない部品の 404 の本文をストーリーに出して見逃さないようにする
    props:
      - name: id
        type: string
        required: true
        description: ストーリーの `parameters.server.id`
      - name: args
        type: Record<string, unknown>
        required: true
        description: ストーリーの引数。文字列でない値は JSON にして問い合わせの引数にする
