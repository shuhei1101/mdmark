title: ClaudeCodeプラグイン / フック
lead: プラグインの `hooks/hooks.json` が `node` で起動する処理。PreToolUse で作業のフォルダを MCP のツールの引数 `project_dir` に入れる。 SessionStart で常駐サーバーが待ち受けていないことを伝える。
directory: |-
  ```tree
  src/plugin/
  ├── pre-tool-use.ts   # PreToolUse のフックの入口
  └── session-start.ts  # SessionStart のフックの入口
  ```
functions:
  - name: runPreToolUse
    title: 作業のフォルダを引数に入れる
    kind: 関数
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    role: 入口
    summary: 標準入力の `tool_input` に `project_dir` を入れた `updatedInput` を標準出力に 1 行書く
    description: 束ねた `plugin/scripts/pre-tool-use.js` を入口として実行したときだけ、標準入力を読み切って流し、戻り値を終了コードにする（`import.meta.main`）。`permissionDecision` は書かない
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; input: string; stdout: (line: string) => void }'
        required: true
        description: 環境変数・標準入力の文字列・標準出力へ 1 行書く関数
    returns:
      type: '0'
      description: 常に 0
    process: |-
      1. `PROJECT_DIR_ENV` が無いか空なら、何も書かず 0 を返す
      2. 標準入力を JSON として読み、`tool_input` の引数に `project_dir` を環境変数の値で入れる（既にあれば上書きする）
      3. `{ hookSpecificOutput: { hookEventName: "PreToolUse", updatedInput } }` を JSON の 1 行で標準出力に書いて 0 を返す
    unit_tests:
      - name: test_run_pre_tool_use
        case: 正常
        summary: project_dir を入れた updatedInput を書く
        condition: '`CLAUDE_PROJECT_DIR=/work`、`tool_input` が `{ "config": "a.yaml" }`'
        mock: 行を配列に貯める `stdout`
        expected: '0 を返し、`stdout` の 1 行を JSON として読むと `hookEventName` が `PreToolUse`、`updatedInput` が `{ "config": "a.yaml", "project_dir": "/work" }`、`permissionDecision` が無い'
      - name: test_run_pre_tool_use_when_project_dir_given
        case: 正常
        summary: エージェントが書いた project_dir を上書きする
        condition: '`CLAUDE_PROJECT_DIR=/work`、`tool_input` が `{ "project_dir": "/other" }`'
        mock: 行を配列に貯める `stdout`
        expected: '`updatedInput.project_dir` が `/work`'
      - name: test_run_pre_tool_use_when_project_dir_unknown
        case: 正常
        summary: 環境変数が無ければ何も書かない
        condition: '`env` に `CLAUDE_PROJECT_DIR` が無い'
        mock: 行を配列に貯める `stdout`
        expected: 0 を返し、`stdout` が空
      - name: test_run_pre_tool_use_when_matcher
        case: 正常
        summary: hooks.json の matcher が `PROJECT_DIR_TOOLS` のツールだけに当たる
        condition: '`plugin/hooks/hooks.json` の PreToolUse の `matcher` を読む'
        mock: なし
        expected: '`PROJECT_DIR_TOOLS` に `TOOL_NAME_PREFIX` を付けて `|` でつないだ文字列と等しく、`PROJECT_DIR_TOOLS` が `TOOLS` の名前と一致し、並べ替えると `build_site`・`check`・`export_html` になる'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#
    status: planned
    introduced:
      pr: 141
  - name: runSessionStart
    title: 常駐サーバーの状態を伝える
    kind: 関数
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    role: 入口
    summary: ポートが待ち受けていなければ、`additionalContext` に 1 行を書く
    description: 束ねた `plugin/scripts/session-start.js` を入口として実行したときだけ流し、戻り値を終了コードにする（`import.meta.main`）。標準入力は読まない
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; stdout: (line: string) => void }'
        required: true
        description: 環境変数と標準出力へ 1 行書く関数
    returns:
      type: Promise<0>
      description: 常に 0
    process: |-
      1. `readPort` でポートを読む。使えない値なら `PORT_INVALID_CONTEXT` を `additionalContext` に書いて 0 を返す
      2. `isPortListening`（`CONNECT_TIMEOUT_MS`）が真なら何も書かずに 0 を返す
      3. `{ hookSpecificOutput: { hookEventName: "SessionStart", additionalContext: NOT_LISTENING_CONTEXT（ポートを埋める） } }` を JSON の 1 行で書いて 0 を返す
    callees:
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/MCPサーバー.ts#functions[readPort]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ.ts#functions[isPortListening]
    unit_tests:
      - name: test_run_session_start
        case: 正常
        summary: 待ち受けていれば何も書かない
        condition: テストが待ち受けるポートを `MDMARK_PORT` に
        mock: 行を配列に貯める `stdout`
        expected: 0 を返し、`stdout` が空
      - name: test_run_session_start_when_not_listening
        case: 正常
        summary: 待ち受けていなければ 1 行を書く
        condition: 待ち受けるプロセスの無いポート
        mock: 行を配列に貯める `stdout`
        expected: 0 を返し、JSON の `hookEventName` が `SessionStart`、`additionalContext` が改行を含まず、`127.0.0.1:{ポート}` と `/mdmark:global-setup` を含む
      - name: test_run_session_start_when_port_invalid
        case: 正常
        summary: 使えないポートでも 0
        condition: '`MDMARK_PORT=abc`'
        mock: 行を配列に貯める `stdout`
        expected: 0 を返し、`additionalContext` に `abc` を含む
      - name: test_run_session_start_when_hooks_json
        case: 正常
        summary: hooks.json の SessionStart の行
        condition: '`plugin/hooks/hooks.json` を読む'
        mock: なし
        expected: '`SessionStart` の行が 1 つあり、`matcher` を持たず、コマンドが `node` で引数が `${CLAUDE_PLUGIN_ROOT}/scripts/session-start.js`'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーの状態を伝える.ts#
    status: planned
    introduced:
      pr: 354
test_files:
  - tests/unit/src/plugin/pre-tool-use.test.ts
  - tests/unit/src/plugin/session-start.test.ts
constants:
  - name: PROJECT_DIR_ENV
    title: 作業のフォルダの環境変数
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: Claude Code がフックに渡す、セッションの作業のフォルダの絶対パスの環境変数
    value: CLAUDE_PROJECT_DIR
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#
    status: planned
    introduced:
      pr: 72
  - name: TOOL_NAME_PREFIX
    title: ツールの完全名の頭
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: Claude Code がプラグイン mdmark の MCP サーバー mdmark のツール名の前に付ける頭
    value: mcp__plugin_mdmark_mdmark__
    status: planned
    introduced:
      pr: 141
  - name: PROJECT_DIR_TOOLS
    title: 作業のフォルダを使うツール
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: '`project_dir` を入れるツールの名前。`TOOLS` のツールの名前と一致させ、`plugin/hooks/hooks.json` の PreToolUse の `matcher` はこの名前に `TOOL_NAME_PREFIX` を付けて `|` でつないだもの'
    value: check・export_html・build_site
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#constraints
    status: planned
    introduced:
      pr: 141
  - name: NOT_LISTENING_CONTEXT
    title: 待ち受けていないときの文
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    summary: '`additionalContext` に渡す 1 行の事実の文'
    value: mdmark の MCP の常駐サーバーが 127.0.0.1:{port} で待ち受けていないため、mdmark の MCP のツールは使えない。/mdmark:global-setup で起動できる。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーの状態を伝える.ts#constraints[出す文]
    status: planned
    introduced:
      pr: 354
  - name: PORT_INVALID_CONTEXT
    title: ポートが使えない値のときの文
    container: src/plugin/session-start.ts
    usecase: セッションの開始で常駐サーバーの状態を受け取る
    summary: '`MDMARK_PORT` が使えない値のときの 1 行'
    value: MDMARK_PORT の値 {value} はポートとして使えないため、mdmark の MCP のツールは使えない。1〜65535 の整数を設定する。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーの状態を伝える.ts#constraints[終了コード]
    status: planned
    introduced:
      pr: 354
