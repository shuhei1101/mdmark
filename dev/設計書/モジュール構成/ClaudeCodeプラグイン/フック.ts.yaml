title: "ClaudeCodeプラグイン / フック"
lead: プラグインの `hooks/hooks.json` が `node` で起動する処理。SessionStart で同梱した使い方集の索引だけを `hookSpecificOutput.additionalContext` で渡し、PreToolUse で作業のフォルダを MCP のツールの引数 `project_dir` に入れる。
directory: |-
  ```tree
  src/plugin/
  ├── session-start.ts  # SessionStart のフックの入口
  └── pre-tool-use.ts   # PreToolUse のフックの入口
  ```
functions:
  - name: runSessionStart
    title: 使い方集の索引を渡す
    kind: 関数
    container: src/plugin/session-start.ts
    usecase: セッションの開始で使い方集の索引を受け取る
    role: 入口
    summary: 同梱した索引を読み、索引の文を `hookSpecificOutput` の JSON にして標準出力に 1 行書く
    description: 束ねた `plugin/scripts/session-start.js` を入口として実行したときだけ流し、戻り値を終了コードにする（`import.meta.main`）。作業のフォルダのファイルは読まない
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ moduleDir: string; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: このファイルのあるフォルダ（`plugin/scripts`）・標準出力と標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 索引を渡したら 0、読めなければ 1
    process: |-
      1. `moduleDir` の 1 つ上のフォルダの `guide` の索引を読む（同梱した索引を読む）
         - `CliError` の場合、標準出力には何も書かず、標準エラーにそのメッセージを書いて 1 を返す
      2. 索引の文を作り、`{ hookSpecificOutput: { hookEventName: "SessionStart", additionalContext } }` を JSON の 1 行で標準出力に書いて 0 を返す（セッションに渡す索引の文を作る）
    unit_tests:
      - name: test_run_session_start
        case: 正常
        summary: 索引の文を hookSpecificOutput で書く
        condition: 一時フォルダの `guide/index.json` に 2 行、`moduleDir` がその `scripts`
        mock: 行を配列に貯める `stdout`・`stderr`
        expected: 0 を返し、`stdout` の 1 行を JSON として読むと `hookEventName` が `SessionStart` で `additionalContext` に 2 つの名前がある
      - name: test_run_session_start_when_index_missing
        case: 正常
        summary: 索引が無ければ標準出力を空にして 1
        condition: '`guide/index.json` が無い'
        mock: 行を配列に貯める `stdout`・`stderr`
        expected: 1 を返し、`stdout` が空で、`stderr` に索引のパスと `入れ直して` がある
    callees:
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/使い方集.ts#functions[readGuideIndex]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/使い方集.ts#functions[formatGuideContext]
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/使い方集の索引を渡す.ts#
    status: planned
    introduced:
      pr: 72
  - name: runPreToolUse
    title: 作業のフォルダを引数に入れる
    kind: 関数
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    role: 入口
    summary: 標準入力の `tool_input` に `project_dir` を入れた `updatedInput` を標準出力に 1 行書く
    description: 束ねた `plugin/scripts/pre-tool-use.js` を入口として実行したときだけ、標準入力を読み切って流し、戻り値を終了コードにする（`import.meta.main`）。`permissionDecision` は書かない
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; input: string; stdout: (line: string) => void }'
        required: true
        description: 環境変数・標準入力の文字列・標準出力へ 1 行書く関数
    returns:
      type: '0'
      description: 常に 0
    process: |-
      1. `PROJECT_DIR_ENV` が無いか空なら、何も書かず 0 を返す
      2. 標準入力を JSON として読み、`tool_input` の引数に `project_dir` を環境変数の値で入れる（既にあれば上書きする）
      3. `{ hookSpecificOutput: { hookEventName: "PreToolUse", updatedInput } }` を JSON の 1 行で標準出力に書いて 0 を返す
    unit_tests:
      - name: test_run_pre_tool_use
        case: 正常
        summary: project_dir を入れた updatedInput を書く
        condition: '`CLAUDE_PROJECT_DIR=/work`、`tool_input` が `{ "config": "a.yaml" }`'
        mock: 行を配列に貯める `stdout`
        expected: '0 を返し、`stdout` の 1 行を JSON として読むと `hookEventName` が `PreToolUse`、`updatedInput` が `{ "config": "a.yaml", "project_dir": "/work" }`、`permissionDecision` が無い'
      - name: test_run_pre_tool_use_when_project_dir_given
        case: 正常
        summary: エージェントが書いた project_dir を上書きする
        condition: '`CLAUDE_PROJECT_DIR=/work`、`tool_input` が `{ "project_dir": "/other" }`'
        mock: 行を配列に貯める `stdout`
        expected: '`updatedInput.project_dir` が `/work`'
      - name: test_run_pre_tool_use_when_project_dir_unknown
        case: 正常
        summary: 環境変数が無ければ何も書かない
        condition: '`env` に `CLAUDE_PROJECT_DIR` が無い'
        mock: 行を配列に貯める `stdout`
        expected: 0 を返し、`stdout` が空
      - name: test_run_pre_tool_use_when_matcher
        case: 正常
        summary: hooks.json の matcher が 6 つのツールだけに当たる
        condition: '`plugin/hooks/hooks.json` の PreToolUse の `matcher` を読む'
        mock: なし
        expected: '`PROJECT_DIR_TOOLS` に `TOOL_NAME_PREFIX` を付けて `|` でつないだ文字列と等しく、正規表現として `mcp__plugin_mdmark_mdmark__read_guide` に当たらず、`PROJECT_DIR_TOOLS` が `TOOLS` の `usesProjectDir: true` の名前と一致する'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#
    status: planned
    introduced:
      pr: 141
test_files:
  - tests/unit/src/plugin/session-start.test.ts
constants:
  - name: PROJECT_DIR_ENV
    title: 作業のフォルダの環境変数
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: Claude Code がフックに渡す、セッションの作業のフォルダの絶対パスの環境変数
    value: CLAUDE_PROJECT_DIR
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#
    status: planned
    introduced:
      pr: 72
  - name: TOOL_NAME_PREFIX
    title: ツールの完全名の頭
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: Claude Code がプラグイン mdmark の MCP サーバー mdmark のツール名の前に付ける頭
    value: mcp__plugin_mdmark_mdmark__
    status: planned
    introduced:
      pr: 141
  - name: PROJECT_DIR_TOOLS
    title: 作業のフォルダを使うツール
    container: src/plugin/pre-tool-use.ts
    usecase: 作業のフォルダを引数に入れる
    summary: '`project_dir` を入れる 6 つのツールの名前。`TOOLS` の `usesProjectDir: true` のツールと一致させ、`plugin/hooks/hooks.json` の PreToolUse の `matcher` はこの名前に `TOOL_NAME_PREFIX` を付けて `|` でつないだもの'
    value: find_docs・list_tags・update_index・check・export_html・build_site
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#constraints
    status: planned
    introduced:
      pr: 141
