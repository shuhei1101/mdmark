  - name: buildTmuxArgs
    title: tmux の起動の引数を作る
    kind: 関数
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`new-session` の引数の並びを作る'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ session: string; port: number; settingsPath: string; stateDir: string; logPath: string; command: string }'
        required: true
        description: セッション名・ポート・端末の設定のパス・状態の置き場所・ログ・起動するコマンド
    returns:
      type: string[]
      description: '`tmux` に渡す引数'
    process: 1. `["new-session", "-d", "-s", session, "-e", "MDMARK_PORT=…", "-e", "MDMARK_CONFIG=…", "-e", "MDMARK_STATE_DIR=…", "sh", "-c", "{command} 2>&1 | tee -a '{logPath}'"]` を返す。ログのパスは一重引用符で囲み、中の一重引用符は `'\''` にする
    unit_tests:
      - name: test_build_tmux_args
        case: 正常
        summary: 環境変数を -e で渡し sh -c で包む
        condition: セッション `s`・ポート 18782・ログ `/l/serve.log`・コマンド `serve`
        mock: なし
        expected: '`-e MDMARK_PORT=18782` を含み、末尾 3 つが `sh`・`-c`・`serve 2>&1 | tee -a ''/l/serve.log''`'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#constraints[起動のコマンド]
      - dev/設計書/外部ライブラリ/tmux#limitations
    status: planned
    introduced:
