  - name: writeConfig
    title: 文書のフォルダの設定を書く
    kind: 関数
    container: src/plugin/setup/write.ts
    usecase: 文書のフォルダの設定を書く
    role: 処理
    summary: '`write-config` の本体'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; pluginRoot: string; version: string } & { dir: string; sets: string[] }'
        required: true
        description: 環境変数・プラグインの直下・プラグインのバージョン・文書のフォルダ・`--set` の値
    returns:
      type: 'Promise<{ written: string[]; keys: string[] }>'
      description: 書いたファイルとキー
    process: |-
      1. `{dir}/mdmark.config.yaml` があれば `Document` で読み、無ければ `mdmark init` と同じ雛形を読み `version` をプラグインのバージョンにする
      2. `--set` のキーが端末の設定だけが持つキー（`config.*`・`serve.*`）なら `SetupError`（1）
      3. 当てた後を `validateConfig` で検め、ずれがあれば `SetupError`（1）で書かない
      4. 書く
    side_effects: '`mdmark.config.yaml` を書く'
    callees:
      - '#functions[parseSetArgs]'
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#
    unit_tests:
      - name: test_write_config
        case: 正常
        summary: 雛形から作る
        condition: '`mdmark.config.yaml` の無い一時フォルダ、`sets` が `["features.callout=false"]`'
        mock: なし
        expected: '`version` と `features.callout: false` を持つ'
      - name: test_write_config_when_settings_key
        case: 異常
        summary: 端末の設定だけのキーは書かない
        condition: '`sets` が `["config.cascade=true"]`'
        mock: なし
        expected: 終了コード 1 の `SetupError`、ファイルが無い
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書のフォルダの設定を書く.ts#
