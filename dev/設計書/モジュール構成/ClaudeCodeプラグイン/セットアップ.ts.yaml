  - name: startServer
    title: 常駐サーバーを起動する
    kind: 関数
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`start-server` の本体'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; pluginRoot: string; version: string } & { run: RunCommand; sleep: (ms: number) => Promise<void> }'
        required: true
        description: 環境変数・プラグインの直下・プラグインのバージョン・コマンドの実行・待つ関数
    returns:
      type: Promise<StartResult>
      description: インターフェース定義『常駐サーバーを起動する』のレスポンス
    process: |-
      1. `tmux -V` が失敗すれば、端末で動かすコマンドを添えて `SetupError`（2）
      2. セッションがあり待ち受けていれば `already_running`。セッションがあり待ち受けていなければ `kill-session -t ={名前}` して起動へ進み `restarted` にする
      3. 状態の置き場所を作り、`buildTmuxArgs` の引数で `run("tmux", …)` する。起動するコマンドは `MDMARK_SERVE_COMMAND`、無ければ `npx -y github:shuhei1101/mdmark#{version} serve`
      4. `POLL_INTERVAL_MS` ごとに、セッションが閉じていればログの末尾 20 行を添えて `SetupError`（1）、待ち受けていれば次へ。上限（`MDMARK_START_TIMEOUT_SEC`、無ければ `START_TIMEOUT_SEC`）を超えたら `kill-session` してログの末尾を添えて `SetupError`（3）
      5. `listToolNames` でツールの名前を取り、結果を返す
    side_effects: tmux のセッションを作る・閉じる。状態の置き場所を作る
    callees:
      - '#functions[resolveSetupPaths]'
      - '#functions[readSessionName]'
      - '#functions[buildTmuxArgs]'
      - '#functions[isPortListening]'
      - '#functions[listToolNames]'
    unit_tests:
      - name: test_start_server
        case: 正常
        summary: 起動して待ち受けを待つ
        condition: 一時の端末、`MDMARK_SERVE_COMMAND` に空いたポートで待ち受ける `node -e` のサーバー
        mock: '`run` は実際の tmux（`TMUX_TMPDIR` は一時フォルダ）'
        expected: '`result` が `started`、`stop` が `tmux kill-session -t =mdmark-mcp`'
      - name: test_start_server_when_tmux_missing
        case: 異常
        summary: tmux が無ければ 2
        condition: '`tmux -V` に 127 を返す `run`'
        mock: 差し替えた `run`
        expected: 終了コード 2 の `SetupError`、メッセージに `MDMARK_PORT=` と `serve` のコマンド
      - name: test_start_server_when_timed_out
        case: 異常
        summary: 上限を超えたら 3
        condition: '`MDMARK_START_TIMEOUT_SEC=0`、`has-session` に 0 を返し続ける `run`'
        mock: 差し替えた `run` と、すぐ解決する `sleep`
        expected: 終了コード 3 の `SetupError`、`kill-session` を呼んでいる
      - name: test_start_server_when_session_closed
        case: 異常
        summary: セッションが閉じたら 1
        condition: '`has-session` が起動の後に 1 を返す `run`、ログに `EADDRINUSE` の行'
        mock: 差し替えた `run`
        expected: 終了コード 1 の `SetupError`、メッセージにログの行と `MDMARK_PORT` の修正方法
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#
    status: planned
    introduced:
      pr: 354
