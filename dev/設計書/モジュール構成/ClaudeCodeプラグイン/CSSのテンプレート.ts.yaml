title: "ClaudeCodeプラグイン / CSSのテンプレート"
lead: 端末の設定のフォルダの `templates/css/` に置く CSS のテンプレートの索引を読み・検査し・書き、テンプレートを一覧・登録・配置する。MCP の `list_templates`・`add_template`・`apply_template` の処理が呼ぶ。
directory: |-
  ```tree
  src/plugin/
  └── templates.ts  # テンプレートのフォルダの場所・索引の読み取りと検査と書き込み・一覧・登録・配置
  schemas/
  └── mdmark.templates.schema.json  # テンプレートの索引の JSON Schema
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
      direction LR
      class テンプレートを一覧する
      class テンプレートを登録する
      class テンプレートを配置する
      class 索引を読む
      class 索引を検査する
      class 索引を書く
      class テンプレートのフォルダを決める
      テンプレートを一覧する --> 索引を読む
      テンプレートを登録する --> 索引を読む
      テンプレートを登録する --> 索引を検査する
      テンプレートを登録する --> 索引を書く
      テンプレートを配置する --> 索引を読む
      索引を読む --> 索引を検査する
      テンプレートを一覧する --> テンプレートのフォルダを決める
      テンプレートを登録する --> テンプレートのフォルダを決める
      テンプレートを配置する --> テンプレートのフォルダを決める
data_models:
  - name: TemplateEntry
    title: テンプレートの行
    container: src/plugin/templates.ts
    usecase: 共通
    role: DTO
    summary: 索引の `templates` の 1 行
    properties:
      - name: name
        type: string
        description: テンプレートの名前
      - name: file
        type: string
        description: テンプレートのフォルダの直下の CSS のファイル名
      - name: description
        type: string
        description: 説明
      - name: tags
        type: string[]
        description: タグ。索引で省いた行は空の並び
    refs:
      - dev/設計書/ER図/CSSのテンプレート#tables[templates]
    status: planned
    introduced:
      pr: 353
  - name: TemplatesIndex
    title: テンプレートの索引
    container: src/plugin/templates.ts
    usecase: 共通
    role: DTO
    summary: '`templates.yaml` の中身'
    properties:
      - name: schema
        type: '1'
        description: 索引のバージョン
      - name: templates
        type: TemplateEntry[]
        description: 行の並び
    refs:
      - dev/設計書/ER図/CSSのテンプレート#
    status: planned
    introduced:
      pr: 353
  - name: ListedTemplate
    title: 一覧の行
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートの一覧を返す
    role: DTO
    summary: '`list_templates` が返す 1 行'
    properties:
      - name: name
        type: string
        description: テンプレートの名前
      - name: description
        type: string
        description: 説明
      - name: tags
        type: string[]
        description: タグ
      - name: path
        type: string
        description: CSS の絶対パス
    status: planned
    introduced:
      pr: 353
constants:
  - name: TEMPLATES_SUBDIR
    title: テンプレートのフォルダ
    container: src/plugin/templates.ts
    usecase: 共通
    summary: 端末の設定のファイルのフォルダから見たテンプレートのフォルダ
    value: templates/css
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/CSSのテンプレートの一覧を返す.ts#constraints[テンプレートのフォルダ]
    status: planned
    introduced:
      pr: 353
  - name: TEMPLATES_INDEX_FILE
    title: 索引のファイル名
    container: src/plugin/templates.ts
    usecase: 共通
    summary: テンプレートのフォルダの索引のファイル名
    value: templates.yaml
    status: planned
    introduced:
      pr: 353
  - name: TEMPLATES_SCHEMA_VERSION
    title: 索引のバージョン
    container: src/plugin/templates.ts
    usecase: 共通
    summary: 書く索引の `schema` の値
    value: '1'
    status: planned
    introduced:
      pr: 353
  - name: TEMPLATE_NAME_PATTERN
    title: 名前に使える文字
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートを登録する
    summary: '`add_template` の `name` の正規表現。JSON Schema の `pattern` と同じ'
    value: ^[a-z0-9][a-z0-9-]{0,63}$
    refs:
      - dev/設計書/ER図/CSSのテンプレート#tables[templates].columns[name]
    status: planned
    introduced:
      pr: 353
functions:
  - name: resolveTemplatesDir
    title: テンプレートのフォルダを決める
    kind: 関数
    container: src/plugin/templates.ts
    usecase: 共通
    role: 計算
    summary: 端末の設定のパスのフォルダの `templates/css` の絶対パスを返す
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ env: Record<string, string | undefined>; home: string }'
        required: true
        description: 環境変数とホームのフォルダ
    returns:
      type: string
      description: テンプレートのフォルダの絶対パス
    process: |-
      1. `resolveSettingsPath` で端末の設定のパスを決める
      2. そのフォルダに `TEMPLATES_SUBDIR` を結合して返す
    unit_tests:
      - name: test_resolve_templates_dir
        case: 正常
        summary: '`MDMARK_CONFIG` のフォルダの下にする'
        condition: '`env.MDMARK_CONFIG` に `/tmp/a/settings.yaml`'
        mock: なし
        expected: '`/tmp/a/templates/css`'
      - name: test_resolve_templates_dir_when_xdg
        case: 正常
        summary: '`MDMARK_CONFIG` が無ければ `XDG_CONFIG_HOME` の下にする'
        condition: '`env.XDG_CONFIG_HOME` に `/x`、`MDMARK_CONFIG` なし'
        mock: なし
        expected: '`/x/mdmark/templates/css`'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[resolveSettingsPath]
    status: planned
    introduced:
      pr: 353
  - name: validateTemplatesIndex
    title: 索引を検査する
    kind: 関数
    container: src/plugin/templates.ts
    usecase: 共通
    role: 検査
    summary: 値を `schemas/mdmark.templates.schema.json` で検査し、最初に合わないところを、索引のパス・キーのパス・直し方の 1 文で返す
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ value: unknown; path: string }'
        required: true
        description: 検査する値と、文に出す索引のパス
    returns:
      type: string | undefined
      description: 合わないときの 1 文（例「{path} の templates[0].file がありません。…」）。合えば `undefined`
    process: |-
      1. Ajv（2020-12）で JSON Schema を初めて使うときにコンパイルし、以降は使い回す
      2. 合わなければ、最初の誤りの場所を `templates[0].file` の形にして文を作る
      3. `name` が重なる行があれば、2 つ目の行を指す文にする
    unit_tests:
      - name: test_validate_templates_index
        case: 正常
        summary: 合う索引は `undefined`
        condition: '`{ schema: 1, templates: [{ name: "brand", file: "brand.css", description: "x", tags: [] }] }`'
        mock: なし
        expected: '`undefined`'
      - name: test_validate_templates_index_when_file_missing
        case: 異常
        summary: 行の `file` が無い
        condition: 1 行目の `file` を外した値
        mock: なし
        expected: 文に索引のパスと `templates[0].file` が入る
      - name: test_validate_templates_index_when_file_has_slash
        case: 異常
        summary: '`file` に `/` か `..` がある'
        condition: '`file: ../x.css`'
        mock: なし
        expected: 文に `templates[0].file` が入る
      - name: test_validate_templates_index_when_name_duplicated
        case: 異常
        summary: 同じ `name` の行が 2 つある
        condition: '`brand` の行を 2 つ'
        mock: なし
        expected: 文に `templates[1].name` が入る
    callees:
      - dev/設計書/外部ライブラリ/ajv#
    status: planned
    introduced:
      pr: 353
  - name: readTemplatesIndex
    title: 索引を読む
    kind: 関数
    container: src/plugin/templates.ts
    usecase: 共通
    role: 読み取り
    summary: テンプレートのフォルダの索引を読んで検査し、無ければ空の索引を返す
    scope: public
    is_async: true
    args:
      - name: dir
        type: string
        required: true
        description: テンプレートのフォルダの絶対パス
    returns:
      type: Promise<TemplatesIndex>
      description: '読んだ索引。フォルダか索引が無ければ `{ schema: 1, templates: [] }`。省いた `tags` は空の並び'
    process: |-
      1. 索引のファイルが無ければ空の索引を返す（フォルダを作らない）
      2. YAML として読めなければ、索引のパスと行を書いた `CliError` を投げる
      3. `validateTemplatesIndex` の文があれば `CliError` で投げる
    unit_tests:
      - name: test_read_templates_index
        case: 正常
        summary: 索引を読み、省いた `tags` を空の並びにする
        condition: '`tags` を省いた行 1 つの索引'
        mock: なし（一時フォルダ）
        expected: '`templates[0].tags` が `[]`'
      - name: test_read_templates_index_when_missing
        case: 正常
        summary: フォルダが無ければ空の索引を返し、フォルダを作らない
        condition: 無いフォルダ
        mock: なし（一時フォルダ）
        expected: '`templates` が空で、フォルダが無いまま'
      - name: test_read_templates_index_when_unreadable
        case: 異常
        summary: YAML として読めない索引
        condition: 3 行目に閉じていない括弧を持つ索引
        mock: なし（一時フォルダ）
        expected: '`CliError` の文に索引のパスと `3` が入る'
    callees:
      - '#functions[validateTemplatesIndex]'
      - dev/設計書/外部ライブラリ/yaml#
    status: planned
    introduced:
      pr: 353
  - name: listTemplates
    title: テンプレートを一覧する
    kind: 関数
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートの一覧を返す
    role: 読み取り
    summary: 索引の行を、CSS の絶対パスを付けて索引の順に返す
    scope: public
    is_async: true
    args:
      - name: dir
        type: string
        required: true
        description: テンプレートのフォルダの絶対パス
    returns:
      type: Promise<ListedTemplate[]>
      description: 一覧の行。`path` は `{dir}/{file}`
    process: |-
      1. `readTemplatesIndex` で索引を読む
      2. 行ごとに `name`・`description`・`tags` と、`dir` と `file` を結合した `path` を返す
    unit_tests:
      - name: test_list_templates
        case: 正常
        summary: 索引の順に `path` を付けて返す
        condition: 2 行の索引
        mock: なし（一時フォルダ）
        expected: 2 行で、`path` が `{dir}/brand.css` と `{dir}/paper.css`
    callees:
      - '#functions[readTemplatesIndex]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/CSSのテンプレートの一覧を返す.ts#
    status: planned
    introduced:
      pr: 353
  - name: writeTemplatesIndex
    title: 索引を書く
    kind: 関数
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートを登録する
    role: 書き込み
    summary: 索引を同じフォルダの一時ファイルに書いてから rename で置き換える
    scope: internal
    is_async: true
    side_effects: テンプレートのフォルダの索引を置き換える
    args:
      - name: options
        type: '{ dir: string; index: TemplatesIndex }'
        required: true
        description: テンプレートのフォルダと書く索引
    returns:
      type: Promise<void>
      description: 書けたら解決する。書けなければ書き込みの例外を投げる（一時ファイルは消す）
    process: |-
      1. `{dir}/templates.yaml.{プロセス ID}.tmp` に YAML の文字列を書く
      2. `templates.yaml` へ rename する
      3. 途中で失敗したら一時ファイルを消して例外を投げ直す
    unit_tests:
      - name: test_write_templates_index
        case: 正常
        summary: 書いた索引を読み直せ、一時ファイルが残らない
        condition: 行 1 つの索引
        mock: なし（一時フォルダ）
        expected: '`readTemplatesIndex` が同じ索引を返し、フォルダに `.tmp` が無い'
    status: planned
    introduced:
      pr: 353
  - name: addTemplate
    title: テンプレートを登録する
    kind: 関数
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートを登録する
    role: 書き込み
    summary: CSS をテンプレートのフォルダへ `{name}.css` でコピーし、索引に行を追加するか置き換える
    scope: public
    is_async: true
    side_effects: テンプレートのフォルダ・CSS・索引を書く
    args:
      - name: options
        type: '{ dir: string; source: string; name: string; description: string; tags: string[]; overwrite: boolean }'
        required: true
        description: テンプレートのフォルダ・登録する CSS の絶対パス・行の値・上書きするか
    returns:
      type: 'Promise<{ name: string; path: string; replaced: boolean }>'
      description: 登録した名前・テンプレートのフォルダの CSS の絶対パス・置き換えたか
    process: |-
      1. `source` が無いか拡張子が `.css` でなければ、パスか拡張子を書いた `CliError` を投げる
      2. `readTemplatesIndex` で索引を読む。同じ `name` の行があり `overwrite` でなければ、名前と `overwrite` を書いた `CliError` を投げる
      3. 新しい行（`file` は `{name}.css`）で書く索引を作る。新しい名前は末尾に追加し、置き換える行は元の位置に置く
      4. `validateTemplatesIndex` の文があれば `CliError` を投げる（何も書かない）
      5. フォルダを作り、置き換えるときは元の CSS の中身を控えてから、CSS を書く
      6. `writeTemplatesIndex` で索引を書く。失敗したら、書いた CSS を消す（置き換えたときは控えた中身に戻す）してから例外を投げ直す
    unit_tests:
      - name: test_add_template
        case: 正常
        summary: フォルダと索引を作って登録する
        condition: '無いフォルダ、`brand.css`、`name: brand`'
        mock: なし（一時フォルダ）
        expected: '`{dir}/brand.css` が元と同じ中身、索引が `file: brand.css` の行 1 つ、`replaced` が `false`'
      - name: test_add_template_when_overwrite
        case: 正常
        summary: 同じ名前を置き換え、行の位置を変えない
        condition: '`brand`・`paper` の 2 行の索引に、`brand` を `overwrite: true` で中身を変えて登録'
        mock: なし（一時フォルダ）
        expected: 1 行目が `brand` で説明が新しい値、CSS が新しい中身、`replaced` が `true`
      - name: test_add_template_when_name_exists
        case: 異常
        summary: '`overwrite` なしの同じ名前'
        condition: '`brand` の行がある索引に `brand` を登録'
        mock: なし（一時フォルダ）
        expected: '`CliError` の文に `brand` と `overwrite`、CSS と索引が元のまま'
      - name: test_add_template_when_source_missing
        case: 異常
        summary: 無い CSS
        condition: '`source` に無いパス'
        mock: なし（一時フォルダ）
        expected: '`CliError` の文にそのパス、フォルダが作られていない'
      - name: test_add_template_when_index_write_fails
        case: 異常
        summary: 索引を書けなければ CSS を戻す
        condition: '`brand` を `overwrite: true` で登録し、`writeTemplatesIndex` の rename を失敗させる'
        mock: '`node:fs/promises` の `rename` を例外を投げる関数に差し替える'
        expected: 例外が投げ直され、`{dir}/brand.css` と索引が元の中身のまま
    callees:
      - '#functions[readTemplatesIndex]'
      - '#functions[validateTemplatesIndex]'
      - '#functions[writeTemplatesIndex]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/CSSのテンプレートを登録する.ts#
    status: planned
    introduced:
      pr: 353
  - name: applyTemplate
    title: テンプレートを配置する
    kind: 関数
    container: src/plugin/templates.ts
    usecase: CSSのテンプレートを配置する
    role: 書き込み
    summary: テンプレートの CSS を配置先へコピーし、配置したパスと基準の設定ファイルからの `theme` の値を返す
    scope: public
    is_async: true
    side_effects: 配置先に CSS を書く
    args:
      - name: options
        type: '{ dir: string; name: string; cwd: string; target: string | undefined; overwrite: boolean }'
        required: true
        description: テンプレートのフォルダ・テンプレートの名前・作業のフォルダ・配置先（省くと最も近い設定ファイルのフォルダ）・上書きするか
    returns:
      type: 'Promise<{ path: string; theme: string | undefined; replaced: boolean }>'
      description: 配置した CSS の絶対パス・`theme` に記載する値・置き換えたか
    process: |-
      1. `readTemplatesIndex` で索引を読み、`name` の行が無ければ、名前と `list_templates` を書いた `CliError` を投げる
      2. `findConfigChain`（`cascade: false`）で、`target` があれば `target` から、無ければ `cwd` から上へ最も近い `mdmark.config.yaml` を探す
      3. 配置先を決める。`target` が無く設定ファイルも無ければ、`dir` を渡すことと `mdmark init` を書いた `CliError` を投げる。`target` のフォルダが無ければ、そのパスを書いた `CliError` を投げる
      4. 配置先に同じファイル名のファイルがあり、中身が同じなら書かずに返す。違い `overwrite` でなければ、パスと `overwrite` を書いた `CliError` を投げる
      5. CSS をコピーし、設定ファイルがあれば、そのフォルダから配置した CSS への相対パスを `./` で始めて `theme` にする（設定ファイルは配置先か、その上のフォルダにあるため `../` にならない）
    unit_tests:
      - name: test_apply_template
        case: 正常
        summary: 最も近い設定ファイルのフォルダへ配置する
        condition: '`/work/mdmark.config.yaml`、`cwd` は `/work/docs`、`target` なし'
        mock: なし（一時フォルダ）
        expected: '`path` が `{work}/brand.css`、`theme` が `./brand.css`、`replaced` が `false`'
      - name: test_apply_template_when_target_given
        case: 正常
        summary: '`target` から上の設定ファイルを基準にする'
        condition: '`target` に `{work}/styles`'
        mock: なし（一時フォルダ）
        expected: '`theme` が `./styles/brand.css`'
      - name: test_apply_template_when_target_without_config
        case: 正常
        summary: '`target` から上に設定ファイルが無ければ、配置して `theme` を返さない'
        condition: 上に `mdmark.config.yaml` が無い `target`
        mock: なし（一時フォルダ）
        expected: '`path` が `{target}/brand.css` で、`theme` が `undefined`'
      - name: test_apply_template_when_same_content
        case: 正常
        summary: 同じ中身のファイルがあればエラーにしない
        condition: 配置先にテンプレートと同じ中身の `brand.css`
        mock: なし（一時フォルダ）
        expected: '`replaced` が `false` で、ファイルの更新時刻が変わらない'
      - name: test_apply_template_when_css_exists
        case: 異常
        summary: 中身の違う同じ名前のファイル
        condition: '配置先に中身の違う `brand.css`、`overwrite: false`'
        mock: なし（一時フォルダ）
        expected: '`CliError` の文にそのパスと `overwrite`、ファイルが元のまま'
      - name: test_apply_template_when_config_missing
        case: 異常
        summary: '`target` なしで設定ファイルが無い'
        condition: 上に `mdmark.config.yaml` が無い `cwd`
        mock: なし（一時フォルダ）
        expected: '`CliError` の文に `dir` と `mdmark init`'
      - name: test_apply_template_when_name_missing
        case: 異常
        summary: 索引に無い名前
        condition: '`name: missing`'
        mock: なし（一時フォルダ）
        expected: '`CliError` の文に `missing` と `list_templates`'
    callees:
      - '#functions[readTemplatesIndex]'
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読む.ts#functions[findConfigChain]
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/CSSのテンプレートを配置する.ts#
    status: planned
