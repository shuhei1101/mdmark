    process: |-
      1. パスが `MCP_PATH` でなければ 404 を返却する
      2. `hostHeaderValidationResponse(request, localhostAllowedHostnames())` か `originValidationResponse(request, localhostAllowedOrigins())` が応答を返却すれば、それ（403）を返却する
      3. `handler.fetch(request)` の応答を返却する
