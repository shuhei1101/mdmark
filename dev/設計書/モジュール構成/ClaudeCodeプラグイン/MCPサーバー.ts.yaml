  - name: runMcpServer
    title: MCP サーバーを動かす
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 入口
    summary: 環境変数から作業のフォルダを取り、標準入出力で MCP サーバーを動かす
    description: 束ねた `plugin/server/mcp.js` を入口として実行したときだけ流す（`import.meta.main`）
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: Record<string, string | undefined>; moduleDir: string; stderr: (line: string) => void }'
        required: true
        description: 環境変数・このファイルのあるフォルダ（`plugin/server`）・標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 待ち受けを始めたら 0、作業のフォルダが無ければ 1
    process: |-
