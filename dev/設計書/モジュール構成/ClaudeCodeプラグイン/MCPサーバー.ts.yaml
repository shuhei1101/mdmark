title: "ClaudeCodeプラグイン / MCPサーバー"
lead: プラグインの `.mcp.json` が `node` で起動する標準入出力の MCP サーバー。`read_guide`・`export_html`・`build_site`・`check`・`find_docs`・`update_index`・`list_tags` を登録し、引数を検査してから CLI と同じ処理を呼ぶ。`src/cli/main.ts` は読まない。
directory: |-
  ```tree
  src/plugin/
  ├── mcp.ts        # MCP サーバーの入口・ツールの登録・instructions
  ├── tools.ts      # 7 つのツールの定義と処理・ツールの結果への変換
  ├── results.ts    # find_docs の cursor・行の項目の選択と、find_docs・list_tags の Markdown の組み立て
  └── arguments.ts  # ツールの引数の検査・SDK に渡す素通しの検証器
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
      direction LR
      class MCPサーバーを作る
      class ツールを呼ぶ
      class 引数を検査する
      class ツールの定義
      MCPサーバーを作る --> ツールの定義 : 登録する
      MCPサーバーを作る --> ツールを呼ぶ : 呼び出しごと
      ツールを呼ぶ --> 引数を検査する
      ツールを呼ぶ --> ツールの定義 : run
data_models:
  - name: ToolContext
    title: ツールの前提
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツールの処理が使う作業のフォルダとプラグインの場所
    properties:
      - name: projectDir
        type: string
        description: Claude Code のセッションのフォルダ。相対パスの引数と設定ファイルの探索の基準
      - name: pluginDir
        type: string
        description: プラグインの直下。`guide/` と `dist/` を持つ
    status: planned
    introduced:
      pr: 72
  - name: ToolDefinition
    title: ツールの定義
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツール 1 つの名前・説明・引数の形・処理
    properties:
      - name: name
        type: "'read_guide' | 'export_html' | 'build_site' | 'check' | 'find_docs' | 'update_index' | 'list_tags'"
        description: ツールの名前
      - name: description
        type: string
        description: ツールの説明。呼ぶ場面と、引数・戻り値を日本語で書く
      - name: inputSchema
        type: ToolInputSchema
        description: 引数の形。`tools/list` に JSON Schema として出し、引数を検査するものにも使う
      - name: run
        type: '(args: Record<string, unknown>, context: ToolContext) => Promise<ToolOutput>'
        description: 検査を通った引数で処理し、結果を返す。利用者に見せる誤りは `CliError` を投げる
      - name: annotations
        type: '{ readOnlyHint: boolean } | undefined'
        description: '`tools/list` に出すツールの annotations。索引と文書を書き換えない `read_guide`・`check`・`find_docs`・`list_tags` だけが `{ readOnlyHint: true }` を持つ'
    status: planned
    introduced:
      pr: 72
  - name: ToolOutput
    title: ツールの処理の結果
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツールの処理が返す、テキストの並びか JSON にする値か structuredContent に入れる値
    properties:
      - name: texts
        type: string[] | undefined
        description: 'そのままの文字で返すテキスト（`read_guide` の名前ごとの本文と、`find_docs`・`list_tags` の `format: markdown` の結果）'
      - name: json
        type: Record<string, unknown> | undefined
        description: JSON の文字列にして 1 つのテキストで返す値（`export_html`・`build_site`・`check`・`update_index`）
      - name: structured
        type: Record<string, unknown> | undefined
        description: 'structuredContent に入れ、同じ値の JSON の文字列を 1 つのテキストでも返す値（`find_docs`・`list_tags` の `format: json` の結果）'
    status: planned
    introduced:
      pr: 72
  - name: ToolInputSchema
    title: 引数の形
    container: src/plugin/arguments.ts
    usecase: 共通
    role: DTO
    summary: ツールの引数の JSON Schema（2020-12）のうち、使う範囲だけの型
    description: "最上位は `type: 'object'`・`properties`・`required`・`additionalProperties: false`。各引数は `type`（`string`・`integer`・`boolean`・`array`・`object`・`null` かその並び）・`items`（要素が `string` で、`enum` を持てる）・`enum`・`minItems`・`minLength`・`minimum`・`maximum`・`description`（任意）だけを持つ"
    properties:
      - name: type
        type: "'object'"
        description: 引数はオブジェクト
      - name: properties
        type: Record<string, ArgumentSchema>
        description: 引数ごとの形
      - name: required
        type: string[]
        description: 必須の引数
      - name: additionalProperties
        type: 'false'
        description: 知らない引数を拒む
    status: planned
    introduced:
      pr: 72
  - name: FindDocsArgs
    title: 文書を探す引数
    container: src/plugin/tools.ts
    usecase: 索引から文書を探す
    role: DTO
    summary: 検査を通った `find_docs` の引数
    properties:
      - name: text
        type: string | undefined
        description: 題・別名・概要のどれかに含まれる語
      - name: tags
        type: string[] | undefined
        description: 全てを持つ文書に絞るタグ
      - name: any_tags
        type: string[] | undefined
        description: どれかを持つ文書に絞るタグ
      - name: related_to
        type: string | undefined
        description: 参照先と被参照を引く文書の ID
      - name: limit
        type: number | undefined
        description: 1 回に返す文書の件数。無ければ `FIND_DOCS_DEFAULT_LIMIT`
      - name: cursor
        type: string | undefined
        description: 前の結果の `next_cursor`
      - name: view
        type: "'brief' | 'standard' | 'full' | undefined"
        description: 各行に返す項目の組。無ければ `brief`
      - name: include
        type: Array<'path' | 'aliases' | 'related' | 'referenced_by'> | undefined
        description: '`view` の組に加える項目'
      - name: exclude
        type: Array<'path' | 'aliases' | 'related' | 'referenced_by'> | undefined
        description: '`view` の組から除く項目'
      - name: count_only
        type: boolean | undefined
        description: '`true` のとき文書の行を返さない'
      - name: format
        type: "'markdown' | 'json' | undefined"
        description: 結果の形式。無ければ `markdown`
      - name: config
        type: string | undefined
        description: 使う設定ファイルのパス
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#
    status: planned
    introduced:
      pr: 114
  - name: FindDocsCursor
    title: 続きの位置
    container: src/plugin/results.ts
    usecase: 索引から文書を探す
    role: DTO
    summary: '`next_cursor` に入れる、次の先頭の位置と絞り込みの条件'
    description: JSON にして base64url（末尾の `=` を落とす）で文字列にする。`filter` は渡されなかった条件を持たない
    properties:
      - name: offset
        type: number
        description: 並べた後の文書の、次に返す先頭の位置（0 始まり）
      - name: filter
        type: '{ text?: string; tags?: string[]; any_tags?: string[]; related_to?: string }'
        description: '`next_cursor` を返した呼び出しの絞り込みの条件'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#constraints[件数と続き]
    status: planned
    introduced:
      pr: 114
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP サーバーの名前（`serverInfo.name`）
    value: mdmark
    status: planned
    introduced:
      pr: 72
  - name: INSTRUCTIONS
    title: サーバーの使い方の説明
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP の `instructions` に渡す、何のためにどのツールを呼ぶかの事実の文
    value: mdmark の記法・部品・図の描き方・拡張の仕方は、使い方集の索引の名前を read_guide に渡すと読める。文書の書き出しは export_html、まとめは build_site、点検は check、索引の文書の検索は find_docs、タグの語彙の一覧は list_tags、索引の書き換えは update_index で行える。
    status: planned
    introduced:
      pr: 72
  - name: PROJECT_DIR_ENV
    title: 作業のフォルダの環境変数
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: Claude Code が MCP サーバーに渡すセッションのフォルダの環境変数の名前
    value: CLAUDE_PROJECT_DIR
    status: planned
    introduced:
      pr: 72
  - name: ACCEPT_ALL_VALIDATOR
    title: 素通しの検証器
    container: src/plugin/arguments.ts
    usecase: 共通
    summary: SDK の `fromJsonSchema` に渡す、どの入力も通す `jsonSchemaValidator`
    description: 'SDK の検査は英語の文を頭に付けるため、SDK では検査せず、ツールを呼ぶときに引数を検査する。`getValidator` は入力をそのまま `{ valid: true, data }` で返す関数を返す'
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
  - name: TOOLS
    title: ツールの一覧
    container: src/plugin/tools.ts
    usecase: 共通
    summary: 登録する 7 つのツールの定義（`ToolDefinition`）の並び
    entries:
      - key: read_guide
        value: names（文字列の配列、1 件以上、必須）
        description: '記法・部品・図の描き方・拡張の仕方を確かめるときに、使い方集の索引の名前を渡して本文を読む。名前ごとに `# {名前}` で始まる本文を返す。`annotations` は `readOnlyHint: true`'
      - key: export_html
        value: file（必須）・out・config（文字列）
        description: '`mdmark export` と同じ処理で文書を 1 枚の HTML に書き出し、書いた絶対パス `out` と警告 `warnings` を返す'
      - key: build_site
        value: config（文字列）
        description: '`mdmark build` と同じ処理で設定の `build` の文書を 1 枚にまとめ、`out`・文書の数 `docs`・`warnings` を返す'
      - key: check
        value: config（文字列）
        description: '`mdmark check` と同じ点検をし、ずれの一覧 `issues`（file・where・kind・message）を返す。点検は書き換えない。`annotations` は `readOnlyHint: true`'
      - key: find_docs
        value: text・related_to・cursor・config（文字列）・tags・any_tags（文字列の配列）・limit（1 以上 100 以下の整数）・view（brief・standard・full）・include・exclude（path・aliases・related・referenced_by の配列）・count_only（真偽値）・format（markdown・json）
        description: '設定の `index` の索引から、題・別名・概要の語、タグの AND / OR、関係する文書で文書を引き、主題のタグが当たる文書を上にして `limit` 件ずつ返す。説明で、タグを渡す前に `list_tags` で語彙を確かめられることを案内する。`annotations` は `readOnlyHint: true`'
      - key: update_index
        value: kind（doc・term・tag、必須）・id（空でない文字列、必須）・item（オブジェクトか null、必須）・config（文字列）
        description: 索引の文書・用語の ID かタグの語彙の名前の項目を置き換え（無ければ追加し、null なら消し）、索引の形で検査してから書く。`action`（added・replaced・removed）と索引のパス `index` を返す
      - key: list_tags
        value: query・config（文字列）・format（markdown・json）
        description: '設定の `index` の索引のタグの語彙を、タグごとの名前・グループ・説明・別名・振り替え先と付いている文書の数つきで返す。`annotations` は `readOnlyHint: true`'
    status: planned
    introduced:
      pr: 72
  - name: FIND_DOCS_DEFAULT_LIMIT
    title: 既定の件数
    container: src/plugin/tools.ts
    usecase: 索引から文書を探す
    summary: '`find_docs` が `limit` を渡されないときに 1 回に返す文書の件数'
    value: '20'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#request[limit]
    status: planned
    introduced:
      pr: 114
  - name: FIND_DOCS_MAX_LIMIT
    title: 件数の上限
    container: src/plugin/tools.ts
    usecase: 索引から文書を探す
    summary: '`find_docs` の `limit` に渡せる最大の件数（引数の形の `maximum`）'
    value: '100'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#request[limit]
    status: planned
    introduced:
      pr: 114
  - name: VIEW_FIELDS
    title: 返す項目の組
    container: src/plugin/results.ts
    usecase: 索引から文書を探す
    summary: '`view` ごとに、ID・題・概要・タグ・文字数（常に返す）に加えて返す項目の並び'
    description: 項目の並びは、返す行のキー・Markdown の表の列・`omitted` の並びにも使う
    entries:
      - key: brief
        value: '[]'
        description: ID・題・概要・タグ・文字数だけ
      - key: standard
        value: "['path', 'aliases']"
        description: '`brief` にパス・別名を加える'
      - key: full
        value: "['path', 'aliases', 'related', 'referenced_by']"
        description: '`standard` に関連する文書・被参照の数を加える'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#request[view]
    status: planned
    introduced:
      pr: 114
  - name: FIND_DOCS_HINT
    title: 続きの案内
    container: src/plugin/results.ts
    usecase: 索引から文書を探す
    summary: 続きがあるときに `hint` に入れる文
    value: 続きがあります。tags・any_tags・text で絞るか、count_only で件数だけを確かめてください。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#response[hint]
    status: planned
    introduced:
      pr: 114
  - name: CURSOR_ERROR_MESSAGE
    title: cursor を読めないときの文
    container: src/plugin/results.ts
    usecase: 索引から文書を探す
    summary: '`cursor` を読めないか、絞り込みの条件が `next_cursor` を返した呼び出しと違うときの `CliError` の文'
    value: cursor を読めないか、絞り込みの条件が next_cursor を返した呼び出しと違います。cursor を省いて先頭から引き直してください。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#exceptions[ツールのエラー（cursor を読めない）]
    status: planned
    introduced:
      pr: 114
functions:
  - name: checkArguments
    title: 引数を検査する
    kind: 関数
    container: src/plugin/arguments.ts
    usecase: 共通
    role: 検査
    summary: 引数をツールの引数の形で検査し、最初に合わないところを何が合わないかと直し方の日本語の 1 文で返す
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ schema: ToolInputSchema; args: unknown }'
        required: true
        description: 引数の形と渡された引数
    returns:
      type: string | undefined
      description: 合わないときの 1 文。合えば `undefined`
    process: |-
      1. 引数がオブジェクトでなければ「引数はオブジェクトで渡してください。」
      2. `required` の順に、無い引数があれば「引数 {名前} がありません。{名前} を渡してください。」
      3. `properties` に無い引数があれば「引数 {名前} は使えません。使える引数は {引数の並び} です。」
      4. 引数ごとに、型（`string`・`integer`・`boolean`・`array`・`object`・`null`）・要素の型と要素の `enum`・`enum`・`minItems`・`minLength`・`minimum`・`maximum` に合わなければ「引数 {名前} は {合う値の説明} で渡してください。」（説明は「文字列」「文字列の配列」「オブジェクトか null」「doc か term か tag」「1 件以上の配列」「空でない文字列」「真偽値」「1 以上 100 以下の整数」「path か aliases か related か referenced_by の配列」など）
    unit_tests:
      - name: test_check_arguments
        case: 正常
        summary: 合う引数は undefined
        condition: '`update_index` の形に `{ kind: "doc", id: "b", item: { path: "b.md" } }`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_required_missing
        case: 正常
        summary: 必須の引数が無い
        condition: '`read_guide` の形に `{}`'
        mock: なし
        expected: '`names` を含む文'
      - name: test_check_arguments_when_unknown_key
        case: 正常
        summary: 知らない引数
        condition: '`check` の形に `{ path: "a" }`'
        mock: なし
        expected: '`path` と `config` を含む文'
      - name: test_check_arguments_when_type_mismatch
        case: 正常
        summary: 型の違う引数
        condition: '`read_guide` の形に `{ names: "notation" }`'
        mock: なし
        expected: '`names` と `文字列の配列` を含む文'
      - name: test_check_arguments_when_empty_array
        case: 正常
        summary: 空の配列
        condition: '`read_guide` の形に `{ names: [] }`'
        mock: なし
        expected: '`names` と `1 件以上` を含む文'
      - name: test_check_arguments_when_enum_mismatch
        case: 正常
        summary: 選べない値
        condition: '`update_index` の形に `kind: "docs"`'
        mock: なし
        expected: '`kind` と `doc か term` を含む文'
      - name: test_check_arguments_when_null_allowed
        case: 正常
        summary: null を許す引数
        condition: '`update_index` の形に `item: null`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_not_object
        case: 正常
        summary: 引数がオブジェクトでない
        condition: 引数が配列
        mock: なし
        expected: '`オブジェクト` を含む文'
      - name: test_check_arguments_when_integer_out_of_range
        case: 正常
        summary: 範囲の外か整数でない数
        condition: '`find_docs` の形に `limit: 101`、続けて `limit: 1.5`'
        mock: なし
        expected: どちらも `limit` と `1 以上 100 以下の整数` を含む文
      - name: test_check_arguments_when_boolean_mismatch
        case: 正常
        summary: 真偽値でない値
        condition: '`find_docs` の形に `count_only: "true"`'
        mock: なし
        expected: '`count_only` と `真偽値` を含む文'
      - name: test_check_arguments_when_item_enum_mismatch
        case: 正常
        summary: 配列の要素が選べない値
        condition: '`find_docs` の形に `fields: ["body"]`'
        mock: なし
        expected: '`fields` と `path か aliases か related か referenced_by の配列` を含む文'
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
  - name: callTool
    title: ツールを呼ぶ
    kind: 関数
    container: src/plugin/tools.ts
    usecase: 共通
    role: アダプター
    summary: 引数を検査してツールの処理を呼び、結果か誤りを MCP のツールの結果にする
    description: 'どの誤りでもサーバーを止めず、その呼び出しだけを `isError: true` にする。標準出力は MCP のやり取りにだけ使うため、ログは標準エラーへ書く'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ tool: ToolDefinition; args: unknown; context: ToolContext; stderr: (line: string) => void }'
        required: true
        description: 呼ぶツール・渡された引数・ツールの前提・標準エラーへ 1 行書く関数
    returns:
      type: Promise<CallToolResult>
      description: '`content` にテキストを並べた MCP のツールの結果。`structured` を返したツールは `structuredContent` も持つ。誤りのときは `isError: true` と 1 つのテキスト'
    process: |-
      1. 引数を検査し、合わなければその 1 文を `isError: true` で返す（引数を検査する）
      2. ツールの処理を呼ぶ
         - `texts` があれば、各テキストを `{ type: "text", text }` にして並べる
         - `json` があれば、JSON の文字列にした 1 つのテキストにする
         - `structured` があれば、`structuredContent` に入れ、同じ JSON の文字列を 1 つのテキストにする
      3. `CliError` を捕まえたら、そのメッセージを `isError: true` で返す
      4. それ以外の例外を捕まえたら、標準エラーに書き、例外のメッセージを `isError: true` で返す
         - `[error]` ツールの処理が想定しない例外で止まった（ツール名・メッセージ・スタック）
    unit_tests:
