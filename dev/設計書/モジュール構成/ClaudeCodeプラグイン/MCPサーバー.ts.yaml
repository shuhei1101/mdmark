  - name: routeRequest
    title: 要求を振り分ける
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: パス・Host・Origin を確かめ、通った要求だけを MCP のハンドラーへ渡す
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ request: Request; handler: McpHttpHandler }'
        required: true
        description: 組み込みの `Request` にした要求と、`createMcpHandler` が返したハンドラー
    returns:
      type: Promise<Response>
      description: 返す応答
    process: |-
      1. パスが `MCP_PATH` でなければ 404 を返す
      2. `hostHeaderValidationResponse(request, localhostAllowedHostnames())` か `originValidationResponse(request, localhostAllowedOrigins())` が応答を返せば、それ（403）を返す
      3. `handler.fetch(request)` の応答を返す
    unit_tests:
      - name: test_route_request
        case: 正常
        summary: localhost の /mcp はハンドラーへ渡す
        condition: '`http://127.0.0.1:8782/mcp`、Host が `127.0.0.1:8782`、Origin なし'
        mock: 呼ばれた要求を記録して 200 を返す `fetch` のハンドラー
        expected: 200 で、ハンドラーが 1 回呼ばれる
      - name: test_route_request_when_path_unknown
        case: 異常
        summary: /mcp 以外は 404
        condition: パスが `/`
        mock: 呼ばれたかを記録するハンドラー
        expected: 404 で、ハンドラーが呼ばれない
      - name: test_route_request_when_host_not_localhost
        case: 異常
        summary: localhost でない Host を拒む
        condition: Host が `evil.example:8782`
        mock: 呼ばれたかを記録するハンドラー
        expected: 403 で、ハンドラーが呼ばれない
      - name: test_route_request_when_origin_not_localhost
        case: 異常
        summary: localhost でない Origin を拒む
        condition: Origin が `https://evil.example`
        mock: 呼ばれたかを記録するハンドラー
        expected: 403 で、ハンドラーが呼ばれない
    callees:
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[hostHeaderValidationResponse]
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[originValidationResponse]
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#constraints[パス]
