  - name: formatFindDocs
    title: 文書を探した結果を Markdown にする
    container: src/plugin/results.ts
    usecase: 索引から文書を探す
    role: 変換
    summary: '`find_docs` の結果のオブジェクトを、`format: markdown` のテキストにする'
    description: 表のセルの `|` は `\|`、改行は空白にする。`null` と空の配列は `-`、配列は `・` でつなぐ
    process: |-
      1. 先頭の行: `count_only` の結果は「総件数 {total} 件・合計文字数 {total_chars}」、それ以外は「総件数 {total} 件・返した件数 {returned} 件・合計文字数 {total_chars}・next_cursor: {next_cursor か なし}」
      2. `docs` が 1 件以上なら文書の表。列は ID・題・概要・タグ・文字数に、返す項目のパス・別名・関連する文書・被参照の数を続ける。タグは主題のタグに `（主題）` を付ける
      3. `tag_counts` があれば「タグごとの件数: {name} {count}・…」
      4. `omitted` があれば「省いた項目: {field}（{how}）・…」
      5. `warnings` を 1 つ 1 行
      6. `hint` があればその文

      各部分は空行で区切る
    kind: 関数
    scope: internal
    is_async: false
    args:
      - name: result
        type: Record<string, unknown>
        required: true
        description: '`find_docs` の `format: json` と同じ結果のオブジェクト'
    returns:
      type: string
      description: Markdown のテキスト
    unit_tests:
      - name: test_format_find_docs
        case: 正常
        summary: インターフェース定義の例のとおりに並べる
        condition: 'インターフェース定義『文書を探す』の `format: json` のレスポンス例'
        mock: なし
        expected: '同じ定義の `format: markdown` のレスポンス例と等しい'
      - name: test_format_find_docs_when_count_only
        case: 正常
        summary: 件数だけの結果は表を出さない
        condition: '`{ total: 3, total_chars: 300, tag_counts: [{ name: "topic:mcp", count: 2 }], warnings: [] }`'
        mock: なし
        expected: '先頭の行が「総件数 3 件・合計文字数 300」で、表と `next_cursor` を含まず、「タグごとの件数: topic:mcp 2」を含む'
      - name: test_format_find_docs_when_pipe_in_cell
        case: 正常
        summary: セルの `|` と改行で表を崩さない
        condition: 概要が `a|b` と改行を含む行
        mock: なし
        expected: そのセルが `a\|b` で、行が 1 行
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#constraints[返す形式]
    status: planned
    introduced:
      pr: 114
