title: "ClaudeCodeプラグイン / MCPサーバー"
lead: '`mdmark serve` が 127.0.0.1 の Streamable HTTP で待ち受ける MCP の常駐サーバー。`export_html`・`build_site`・`check`・`list_templates`・`add_template`・`apply_template` を登録し、作業のフォルダを引数の `project_dir` で受け、引数を検査してから CLI と同じ処理を呼ぶ。`src/cli/main.ts` は読み込まない。'
directory: |-
  ```tree
  src/plugin/
  ├── mcp.ts        # MCP サーバーの組み立て・ツールの登録・instructions
  ├── http.ts       # mdmark serve の HTTP の待ち受け・ポートの読み取り・要求と応答の変換
  ├── tools.ts      # ツールの定義と処理・ツールの結果への変換
  ├── templates.ts  # CSS のテンプレートの索引・一覧・登録・配置（別の設計書）
  └── arguments.ts  # ツールの引数の検査・SDK に指定する素通しの検証器
  ```
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
      direction LR
      class 常駐サーバーを動かす
      class 要求を振り分ける
      class MCPサーバーを作る
      class ツールを呼ぶ
      class 引数を検査する
      class ツールの定義
      常駐サーバーを動かす --> 要求を振り分ける : 要求ごと
      要求を振り分ける --> MCPサーバーを作る : createMcpHandler
      MCPサーバーを作る --> ツールの定義 : 登録する
      MCPサーバーを作る --> ツールを呼ぶ : 呼び出しごと
      ツールを呼ぶ --> 引数を検査する
      ツールを呼ぶ --> ツールの定義 : run
data_models:
  - name: ToolContext
    title: ツールの前提
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツールの処理が使用する、呼び出しの作業のフォルダとサーバーが読み込む配布物の場所
    description: '`callTool` が呼び出しごとに作る'
    inherits: ServerRoots
    properties:
      - name: projectDir
        type: string
        description: 引数の `project_dir`。相対パスの引数と設定ファイルの探索の基準
    status: planned
    introduced:
      pr: 72
  - name: ToolDefinition
    title: ツールの定義
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツール 1 つの名前・説明・引数の構造・処理
    properties:
      - name: name
        type: "'export_html' | 'build_site' | 'check' | 'list_templates' | 'add_template' | 'apply_template'"
        description: ツールの名前
      - name: description
        type: string
        description: ツールの説明。呼ぶ場面と、引数・戻り値を日本語で記載する
      - name: inputSchema
        type: ToolInputSchema
        description: 引数の構造。`tools/list` に JSON Schema として出し、引数を検査するものにも使用する
      - name: run
        type: '(args: Record<string, unknown>, context: ToolContext) => Promise<ToolOutput>'
        description: 検査を通った引数で処理し、結果を返却する。利用者に見せる誤りは `CliError` を投げる
      - name: annotations
        type: '{ readOnlyHint: boolean } | undefined'
        description: '`tools/list` に出すツールの annotations。何も書き換えない `check` と `list_templates` だけが `{ readOnlyHint: true }` を持つ'
    status: planned
    introduced:
      pr: 72
  - name: ToolOutput
    title: ツールの処理の結果
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: ツールの処理が返却する、JSON にする値
    properties:
      - name: json
        type: Record<string, unknown>
        description: JSON の文字列にして 1 つのテキストで返却する値（`export_html`・`build_site`・`check`）
    status: planned
    introduced:
      pr: 72
  - name: ToolInputSchema
    title: 引数の構造
    container: src/plugin/arguments.ts
    usecase: 共通
    role: DTO
    summary: ツールの引数の JSON Schema（2020-12）のうち、使用する範囲だけの型
    description: '最上位は `type: ''object''`・`properties`・`required`・`additionalProperties: false`。各引数は `type`（`string`・`integer`・`boolean`・`array`・`object`・`null` かその並び）・`items`（要素が `string` で、`enum` を持てる）・`enum`・`minItems`・`minLength`・`minimum`・`maximum`・`description`（任意）だけを持つ'
    properties:
      - name: type
        type: '''object'''
        description: 引数はオブジェクト
      - name: properties
        type: Record<string, ArgumentSchema>
        description: 引数ごとの構造
      - name: required
        type: string[]
        description: 必須の引数
      - name: additionalProperties
        type: 'false'
        description: 知らない引数を拒む
    status: planned
    introduced:
      pr: 72
  - name: ServerRoots
    title: サーバーの読み込む場所
    container: src/plugin/tools.ts
    usecase: 共通
    role: DTO
    summary: '`mdmark serve` を起動したパッケージの直下から決める、配布物のフォルダ'
    properties:
      - name: distDir
        type: string
        description: 書き出しに埋める配布物のフォルダ（`{パッケージの直下}/dist`）
    status: planned
    introduced:
      pr: 141
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP サーバーの名前（`serverInfo.name`）
    value: mdmark
    status: planned
    introduced:
      pr: 72
  - name: INSTRUCTIONS
    title: サーバーの使用方法の説明
    container: src/plugin/mcp.ts
    usecase: 共通
    summary: MCP の `instructions` に指定する、使用する場面と順序の事実の文。`{session}` は tmux のセッション名
    value: |-
      mdmark は Markdown 文書の記法・部品・図を描くライブラリで、この MCP サーバーは mdmark の文書の点検（check）・HTML への書き出し（export_html）・1 枚へのまとめ（build_site）と、利用側の CSS のテンプレートの一覧（list_templates）・登録（add_template）・配置（apply_template）を持つ。
      mdmark の記法・部品・図の記載方法は、ガイドとして dev-docs の配信元 mdmark にある。
      mdmark の文書を記載する前に、dev-docs の search_docs で source: "mdmark" の kind が docs の文書をタグ topic:ガイド で絞って一覧を引き、当てはまるページを view: "full" で読み込む。作業場所が mdmark のリポジトリの外なら outside_scope: true を付ける。
      dev-docs が無い、または配信元 mdmark が登録されていないときは、dev-docs が無いので見つかりません。
      記載した後は check で点検し、図はガイドの『描いた図を確認する』の手順で確認する。
      利用側の CSS を探すときは list_templates で一覧を引き、選んだテンプレートを apply_template で配置して、返った theme の値を設定の theme に記載する。作った CSS を使い回すときは add_template で登録する。
      記法を使用しない Markdown の編集とコードの調査には、この MCP サーバーとガイドは要らない。

      この常駐サーバーは tmux のセッション {session} で動く。止まったときは /mdmark:global-setup でもう一度起動できる。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#constraints[instructions]
    status: planned
    introduced:
      pr: 72
  - name: ACCEPT_ALL_VALIDATOR
    title: 素通しの検証器
    container: src/plugin/arguments.ts
    usecase: 共通
    summary: SDK の `fromJsonSchema` に指定する、どの入力も経由する `jsonSchemaValidator`
    description: 'SDK の検査は英語の文を頭に付けるため、SDK では検査せず、ツールを呼ぶときに引数を検査する。`getValidator` は入力をそのまま `{ valid: true, data }` で返却する関数を返却する'
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
  - name: TOOLS
    title: ツールの一覧
    container: src/plugin/tools.ts
    usecase: 共通
    summary: 登録するツールの定義（`ToolDefinition`）の並び
    entries:
      - key: export_html
        value: file（必須）・out・config（文字列）
        description: '`mdmark export` と同じ処理で文書を 1 枚の HTML に書き出し、書き出した絶対パス `out` と警告 `warnings` を返却する'
      - key: build_site
        value: config（文字列）
        description: '`mdmark build` と同じ処理で設定の `build` の文書を 1 枚にまとめ、`out`・文書の数 `docs`・`warnings` を返却する'
      - key: check
        value: config・base・text・file・key（文字列）
        description: '`mdmark check` と同じ点検をし、ずれの一覧 `issues`（file・where・kind・message）を返却する。`base` を指定すると `mdmark check --base` と同じ `change_together` の修正漏れも返却する。`text` か `file`・`key` を指定すると `mdmark check --text`・`--file --key` と同じく、指定した Markdown を描いたときの記載の警告を返却する（YAML のキーへ記法を書き込んだ後に呼ぶ）。点検は書き換えない。`annotations` は `readOnlyHint: true`'
      - key: list_templates
        value: 引数なし
        description: '端末の設定のフォルダの CSS のテンプレートを、名前・説明・タグ・CSS の絶対パスの一覧 `templates` で返却する。`annotations` は `readOnlyHint: true`'
      - key: add_template
        value: file・name・description（必須）・tags（文字列の配列）・overwrite（真偽値）
        description: 作業のフォルダの CSS をテンプレートに登録し、`name`・`path`・`replaced` を返却する。`name` は `TEMPLATE_NAME_PATTERN` に合う文字列
      - key: apply_template
        value: name（必須）・dir（文字列）・overwrite（真偽値）
        description: テンプレートの CSS を配置先へコピーし、`path`・`theme`（基準の設定ファイルが無ければ持たない）・`replaced` を返却する
    status: planned
    introduced:
      pr: 72
    description: どのツールも引数の `project_dir` を必須にし、`project_dir` は `inputSchema` に含めない
  - name: PROJECT_DIR_ARG
    title: 作業のフォルダの引数
    container: src/plugin/tools.ts
    usecase: 共通
    summary: PreToolUse のフックが作業のフォルダの絶対パスを入れる引数の名前
    value: project_dir
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/作業のフォルダを引数に入れる.ts#
    status: planned
    introduced:
      pr: 141
  - name: PROJECT_DIR_ERROR_MESSAGE
    title: 作業のフォルダが無いときの文
    container: src/plugin/tools.ts
    usecase: 共通
    summary: '`project_dir` が無い・絶対パスでない・そのフォルダが無いときのツールのエラーの文'
    value: 引数 project_dir が無いか、ある作業のフォルダの絶対パスではありません。mdmark のプラグインを入れた Claude Code のセッションから呼んでください。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/点検する.ts#exceptions[ツールのエラー（作業のフォルダが無い）]
    status: planned
    introduced:
      pr: 141
  - name: LISTEN_HOST
    title: 待ち受けるアドレス
    container: src/plugin/http.ts
    usecase: 共通
    summary: 待ち受けるアドレス
    value: 127.0.0.1
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#constraints[待ち受けるアドレス]
    status: planned
    introduced:
      pr: 141
  - name: MCP_PATH
    title: MCP のパス
    container: src/plugin/http.ts
    usecase: 共通
    summary: MCP の要求を受けるパス
    value: /mcp
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#constraints[パス]
    status: planned
    introduced:
      pr: 141
  - name: PORT_IN_USE_MESSAGE
    title: ポートが使用されているときの文
    container: src/plugin/http.ts
    usecase: 共通
    summary: 待ち受けるポートを別のプロセスが使用しているときに標準エラーに書き込む文。`{port}` をポートに置き換える
    value: ポート {port} は別のプロセスが使用しています。mdmark serve が既に起動しているなら、そのまま使用できます。別のポートで動かすときは、~/.claude/settings.json の env と mdmark serve を起動する環境の両方に同じ MDMARK_PORT を設定してください。
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#exceptions[なし（ポートが使用されている・終了コード 1）]
    status: planned
    introduced:
      pr: 141
functions:
  - name: checkArguments
    title: 引数を検査する
    kind: 関数
    container: src/plugin/arguments.ts
    usecase: 共通
    role: 検査
    summary: 引数をツールの引数の構造で検査し、最初に合わないところを何が合わないかと修正方法の日本語の 1 文で返却する
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ schema: ToolInputSchema; args: unknown }'
        required: true
        description: 引数の構造と指定された引数
    returns:
      type: string | undefined
      description: 合わないときの 1 文。合えば `undefined`
    process: |-
      1. 引数がオブジェクトでなければ「引数はオブジェクトで指定してください。」
      2. `required` の順に、無い引数があれば「引数 {名前} がありません。{名前} を指定してください。」
      3. `properties` に無い引数があれば「引数 {名前} は使用できません。使用できる引数は {引数の並び} です。」
      4. 引数ごとに、型（`string`・`integer`・`boolean`・`array`・`object`・`null`）・要素の型と要素の `enum`・`enum`・`minItems`・`minLength`・`minimum`・`maximum` に合わなければ「引数 {名前} は {合う値の説明} で指定してください。」（説明は「文字列」「文字列の配列」「オブジェクトか null」「{値} か {値}」「1 件以上の配列」「空でない文字列」「真偽値」「{最小} 以上 {最大} 以下の整数」「{値} か {値} の配列」など）
    unit_tests:
      - name: test_check_arguments
        case: 正常
        summary: 合う引数は undefined
        condition: '`export_html` の構造に `{ file: "a.md", out: "a.html" }`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_required_missing
        case: 正常
        summary: 必須の引数が無い
        condition: '`export_html` の構造に `{}`'
        mock: なし
        expected: '`file` を含む文'
      - name: test_check_arguments_when_unknown_key
        case: 正常
        summary: 知らない引数
        condition: '`check` の構造に `{ path: "a" }`'
        mock: なし
        expected: '`path` と `config` を含む文'
      - name: test_check_arguments_when_type_mismatch
        case: 正常
        summary: 型の違う引数
        condition: 'テストの構造（`names` が文字列の配列）に `{ names: "notation" }`'
        mock: なし
        expected: '`names` と `文字列の配列` を含む文'
      - name: test_check_arguments_when_empty_array
        case: 正常
        summary: 空の配列
        condition: 'テストの構造（`names` が `minItems: 1` の文字列の配列）に `{ names: [] }`'
        mock: なし
        expected: '`names` と `1 件以上` を含む文'
      - name: test_check_arguments_when_enum_mismatch
        case: 正常
        summary: 選べない値
        condition: 'テストの構造（`kind` が `enum: ["doc", "term"]` の文字列）に `kind: "docs"`'
        mock: なし
        expected: '`kind` と `doc か term` を含む文'
      - name: test_check_arguments_when_null_allowed
        case: 正常
        summary: null を許す引数
        condition: 'テストの構造（`item` が `type: ["object", "null"]`）に `item: null`'
        mock: なし
        expected: '`undefined`'
      - name: test_check_arguments_when_not_object
        case: 正常
        summary: 引数がオブジェクトでない
        condition: 引数が配列
        mock: なし
        expected: '`オブジェクト` を含む文'
      - name: test_check_arguments_when_integer_out_of_range
        case: 正常
        summary: 範囲の外か整数でない数
        condition: 'テストの構造（`limit` が `minimum: 1`・`maximum: 100` の整数）に `limit: 101`、続けて `limit: 1.5`'
        mock: なし
        expected: どちらも `limit` と `1 以上 100 以下の整数` を含む文
      - name: test_check_arguments_when_boolean_mismatch
        case: 正常
        summary: 真偽値でない値
        condition: 'テストの構造（`flag` が真偽値）に `flag: "true"`'
        mock: なし
        expected: '`flag` と `真偽値` を含む文'
      - name: test_check_arguments_when_item_enum_mismatch
        case: 正常
        summary: 配列の要素が選べない値
        condition: 'テストの構造（`fields` が要素の `enum: ["path", "aliases"]` の配列）に `fields: ["body"]`'
        mock: なし
        expected: '`fields` と `path か aliases の配列` を含む文'
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#limitations[入力の検査のエラーの文]
    status: planned
    introduced:
      pr: 72
  - name: callTool
    title: ツールを呼ぶ
    kind: 関数
    container: src/plugin/tools.ts
    usecase: 共通
    role: アダプター
    summary: 引数を検査してツールの処理を呼び、結果か誤りを MCP のツールの結果にする
    description: 'どの誤りでもサーバーを止めず、その呼び出しだけを `isError: true` にする。ログは標準エラーへ書き込む'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ tool: ToolDefinition; args: unknown; roots: ServerRoots; stderr: (line: string) => void }'
        required: true
        description: 呼ぶツール・指定された引数・サーバーの読み込む場所・標準エラーへ 1 行書く関数
    returns:
      type: Promise<CallToolResult>
      description: '`content` にテキストを並べた MCP のツールの結果。誤りのときは `isError: true` と 1 つのテキスト'
    process: |-
      1. 引数から `PROJECT_DIR_ARG` を取り出す。文字列でない・絶対パスでない・そのフォルダが無いときは `PROJECT_DIR_ERROR_MESSAGE` を `isError: true` で返却する
      2. `PROJECT_DIR_ARG` を除いた引数を検査し、合わなければその 1 文を `isError: true` で返却する（引数を検査する）
      3. 取り出した `projectDir` と `roots` でツールの前提を作り、ツールの処理を呼び、`json` を JSON の文字列にした 1 つのテキストにする
      4. `CliError` を捕まえたら、そのメッセージを `isError: true` で返却する
      5. それ以外の例外を捕まえたら、標準エラーに書き込み、例外のメッセージを `isError: true` で返却する
         - `[error]` ツールの処理が想定しない例外で止まった（ツール名・メッセージ・スタック）
    unit_tests:
      - name: test_call_tool
        case: 正常
        summary: json を 1 つのテキストにする
        condition: '`run` が `{ json: { out: "/a.html" } }` を返却するツール'
        mock: なし（テストの中で定義したツール）
        expected: 'テキストが 1 つで `JSON.parse` すると `{ out: "/a.html" }`、`isError` が立たない'
      - name: test_call_tool_when_arguments_invalid
        case: 正常
        summary: 合わない引数は処理を呼ばない
        condition: 必須の引数が無い
        mock: 呼ばれたかを記録する `run`
        expected: '`isError: true`、`run` が呼ばれない'
      - name: test_call_tool_when_cli_error
        case: 正常
        summary: CliError はその文を返却し、ログを書き込まない
        condition: '`run` が `CliError("修正方法の文")` を投げる'
        mock: 行を配列に貯める `stderr`
        expected: '`isError: true` でテキストが `修正方法の文`、`stderr` が空'
      - name: test_call_tool_when_unexpected_error
        case: 正常
        summary: 想定しない例外は標準エラーに書き込んで返却する
        condition: '`run` が `Error("boom")` を投げる'
        mock: 行を配列に貯める `stderr`
        expected: '`isError: true` でテキストに `boom`、`stderr` にツール名と `boom` とスタック'
      - name: test_call_tool_when_project_dir
        case: 正常
        summary: project_dir を前提に入れ、引数から除いて処理を呼ぶ
