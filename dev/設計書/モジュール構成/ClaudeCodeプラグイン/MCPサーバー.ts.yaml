  - name: callTool
    title: ツールを呼ぶ
    kind: 関数
    container: src/plugin/tools.ts
    usecase: 共通
    role: アダプター
    summary: 引数を検査してツールの処理を呼び、結果か誤りを MCP のツールの結果にする
    description: 'どの誤りでもサーバーを止めず、その呼び出しだけを `isError: true` にする。ログは標準エラーへ書く'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ tool: ToolDefinition; args: unknown; roots: ServerRoots; stderr: (line: string) => void }'
        required: true
        description: 呼ぶツール・渡された引数・サーバーの読む場所・標準エラーへ 1 行書く関数
    returns:
      type: Promise<CallToolResult>
      description: '`content` にテキストを並べた MCP のツールの結果。`structured` を返したツールは `structuredContent` も持つ。誤りのときは `isError: true` と 1 つのテキスト'
    process: |-
      1. `usesProjectDir` のツールは、引数から `PROJECT_DIR_ARG` を取り出す。文字列でない・絶対パスでない・そのフォルダが無いときは `PROJECT_DIR_ERROR_MESSAGE` を `isError: true` で返す
      2. `PROJECT_DIR_ARG` を除いた引数を検査し、合わなければその 1 文を `isError: true` で返す（引数を検査する）
      3. 取り出した `projectDir` と `roots` でツールの前提を作り、ツールの処理を呼ぶ
         - `texts` があれば、各テキストを `{ type: "text", text }` にして並べる
         - `json` があれば、JSON の文字列にした 1 つのテキストにする
         - `structured` があれば、`structuredContent` に入れ、同じ JSON の文字列を 1 つのテキストにする
      4. `CliError` を捕まえたら、そのメッセージを `isError: true` で返す
      5. それ以外の例外を捕まえたら、標準エラーに書き、例外のメッセージを `isError: true` で返す
         - `[error]` ツールの処理が想定しない例外で止まった（ツール名・メッセージ・スタック）
    unit_tests:
      - name: test_call_tool
        case: 正常
        summary: json を 1 つのテキストにする
        condition: '`run` が `{ json: { out: "/a.html" } }` を返すツール'
        mock: なし（テストの中で定義したツール）
        expected: 'テキストが 1 つで `JSON.parse` すると `{ out: "/a.html" }`、`isError` が立たない'
      - name: test_call_tool_when_texts
        case: 正常
        summary: texts をそのままの文字で並べる
        condition: '`run` が `{ texts: ["# a\n\n本文", "# b\n\n本文"] }` を返す'
        mock: なし
        expected: テキストが 2 つで、中身がそのまま
      - name: test_call_tool_when_arguments_invalid
        case: 正常
        summary: 合わない引数は処理を呼ばない
        condition: 必須の引数が無い
        mock: 呼ばれたかを記録する `run`
        expected: '`isError: true`、`run` が呼ばれない'
      - name: test_call_tool_when_cli_error
        case: 正常
        summary: CliError はその文を返し、ログを書かない
        condition: '`run` が `CliError("直し方の文")` を投げる'
        mock: 行を配列に貯める `stderr`
        expected: '`isError: true` でテキストが `直し方の文`、`stderr` が空'
      - name: test_call_tool_when_unexpected_error
        case: 正常
        summary: 想定しない例外は標準エラーに書いて返す
        condition: '`run` が `Error("boom")` を投げる'
        mock: 行を配列に貯める `stderr`
        expected: '`isError: true` でテキストに `boom`、`stderr` にツール名と `boom` とスタック'
      - name: test_call_tool_when_structured
        case: 正常
        summary: structured を structuredContent と同じ JSON のテキストにする
        condition: '`run` が `{ structured: { tags: [] } }` を返すツール'
        mock: なし（テストの中で定義したツール）
        expected: '`structuredContent` が `{ tags: [] }` で、テキストが 1 つで `JSON.parse` すると `{ tags: [] }`'
      - name: test_call_tool_when_project_dir
        case: 正常
        summary: project_dir を前提に入れ、引数から除いて処理を呼ぶ
        condition: '`usesProjectDir: true` のツールに、一時フォルダの絶対パスの `project_dir` と `config` を渡す'
        mock: 受け取った引数と前提を記録する `run`
        expected: '`run` の引数が `{ config }` だけで、前提の `projectDir` が渡した絶対パス'
      - name: test_call_tool_when_project_dir_missing
        case: 異常
        summary: project_dir が無ければ処理を呼ばない
        condition: '`usesProjectDir: true` のツールに `project_dir` を渡さない'
        mock: 呼ばれたかを記録する `run`
        expected: '`isError: true` でテキストが `PROJECT_DIR_ERROR_MESSAGE`、`run` が呼ばれない'
      - name: test_call_tool_when_project_dir_invalid
        case: 異常
        summary: 絶対パスでないか、無いフォルダの project_dir を拒む
        condition: '`project_dir` が `docs`、続けて無いフォルダの絶対パス'
        mock: 呼ばれたかを記録する `run`
        expected: 'どちらも `isError: true` でテキストが `PROJECT_DIR_ERROR_MESSAGE`、`run` が呼ばれない'
      - name: test_call_tool_when_project_dir_given_to_read_guide
        case: 異常
        summary: 作業のフォルダを使わないツールは project_dir を知らない引数として拒む
        condition: '`usesProjectDir: false` のツールに `project_dir` を渡す'
        mock: 呼ばれたかを記録する `run`
        expected: '`isError: true` でテキストに `project_dir` を含み、`run` が呼ばれない'
    callees:
      - '#functions[checkArguments]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/使い方集を読む.ts#constraints[ログ]
    status: planned
    introduced:
      pr: 72
