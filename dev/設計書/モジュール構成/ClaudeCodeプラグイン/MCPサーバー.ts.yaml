  - name: runFindDocs
    title: 文書を探す（find_docs）
    kind: 関数
    container: src/plugin/tools.ts
    usecase: 索引から文書を探す
    role: ツール
    summary: 設定の索引を読み、条件に当たる文書を主題のタグが当たる文書を上にして `limit` 件ずつ、選んだ項目と形式で返す
    scope: public
    is_async: true
    args:
      - name: args
        type: FindDocsArgs
        required: true
        description: 検査を通った引数
      - name: context
        type: ToolContext
        required: true
        description: ツールの前提
    returns:
      type: Promise<ToolOutput>
      description: '`format: json` なら `structured` がインターフェース定義のレスポンス（`total`・`returned`・`total_chars`・`next_cursor`・`hint`・`tag_counts`・`warnings`・`omitted`・`docs` の順。`count_only` のときは `total`・`total_chars`・`tag_counts`・`warnings` だけ）、`markdown` なら `texts` が `formatFindDocs` の 1 つ'
    process: |-
      1. `projectDir` から設定を読み、索引と索引の文書を読む（設定を読んで形を検める・索引を必ず読む）
      2. 索引を索引の形に合う要素だけにする（索引の形の検査）
      3. `cursor` があれば、`text`・`tags`・`any_tags`・`related_to` を条件にして先頭の位置を読む（続きの位置を読む）。無ければ 0
      4. 返す項目を決める（返す項目を決める）
      5. `related_to` があるか、返す項目に `referenced_by` があるときだけ、設定の `features` で参照の表を作る（参照の表を作る）
      6. 文書を探す（索引から文書を探す）
      7. 当たった文書ごとに文字数を数える。索引の `path` を正規化して索引の文書から本文を引き、無ければ索引のフォルダからのパスでファイルを読む。本文のコードポイントの数、読めなければ `null`
      8. `total`・`total_chars`（`null` を足さない）・`tag_counts`（タグごとの件数を数える）・`warnings`（語彙に無いタグの警告を作る）を、当たった全ての文書で作る
      9. `count_only` なら、この 4 つだけを返す
      10. それ以外は、先頭の位置から `limit`（無ければ `FIND_DOCS_DEFAULT_LIMIT`）件を行にし（文書の行を作る）、続きがあれば `next_cursor`（続きの位置を文字列にする）と `hint`（`FIND_DOCS_HINT`）、無ければどちらも `null` にする
      11. `format` が `json` なら `structured`、それ以外は Markdown にした `texts` で返す（文書を探した結果を Markdown にする）
    unit_tests:
      - name: test_run_find_docs
        case: 正常
        summary: 既定では Markdown の表を返す
        condition: 索引に `a`（概要とタグ無し）だけと `a.md`、引数無し
        mock: なし（一時フォルダ）
        expected: '`texts` が 1 つで、先頭の行が総件数 1 件・返した件数 1 件を示し、`structured` が無い'
      - name: test_run_find_docs_when_json
        case: 正常
        summary: '`format: json` で既定の項目の行と省いた項目を返す'
        condition: '`test_run_find_docs` と同じフォルダ、`format: json`'
        mock: なし（一時フォルダ）
        expected: '`structured.docs` が `[{ id: "a", title, description: null, tags: [], chars: {a.md のコードポイントの数} }]`、`omitted` が 4 つ、`next_cursor` と `hint` が `null`'
      - name: test_run_find_docs_when_related_to
        case: 正常
        summary: 参照の表を作って関係する文書を返す
        condition: '`a` が `related` で `b` を指し、`c` の本文が `a` へリンクする。`related_to: a`、`format: json`'
        mock: なし（一時フォルダ）
        expected: '`structured.docs` の ID が `b`・`c`'
      - name: test_run_find_docs_when_paged
        case: 正常
        summary: '`limit` 件ずつ返し、`next_cursor` で続きを返す'
        condition: '文書 3 つ、`limit: 2`、`format: json`。続けて返った `next_cursor` を渡す'
        mock: なし（一時フォルダ）
        expected: 1 回目が 2 件で `total` 3・`hint` が `FIND_DOCS_HINT`、2 回目が残りの 1 件で `next_cursor` が `null`
      - name: test_run_find_docs_when_count_only
        case: 正常
        summary: 件数だけを返す
        condition: 'タグを持つ文書 2 つ、`count_only: true`、`format: json`'
        mock: なし（一時フォルダ）
        expected: '`structured` のキーが `total`・`total_chars`・`tag_counts`・`warnings` だけ'
      - name: test_run_find_docs_when_unknown_tag
        case: 正常
        summary: 語彙に無いタグでも拒まず警告を添える
        condition: '語彙に `topic:mcp` を持つ索引、`tags: ["topic:mcq"]`、`format: json`'
        mock: なし（一時フォルダ）
        expected: '`total` が 0 で、`warnings` が 1 つで `topic:mcq` と `topic:mcp` を含む'
      - name: test_run_find_docs_when_document_missing
        case: 正常
        summary: ファイルの無い文書は文字数を null にして合計に足さない
        condition: '索引に `a`（`a.md` がある）と `b`（`b.md` が無い）、`format: json`'
        mock: なし（一時フォルダ）
        expected: '`b` の `chars` が `null` で、`total_chars` が `a` の `chars` と等しい'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[requireConfig]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[requireIndexWithDocuments]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[normalizeIndex]
      - '#functions[decodeCursor]'
      - '#functions[selectDocFields]'
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[collectReferences]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[findDocs]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[countTags]
      - '#functions[unknownTagWarning]'
      - '#functions[toDocRow]'
      - '#functions[encodeCursor]'
      - '#functions[formatFindDocs]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/文書を探す.ts#
