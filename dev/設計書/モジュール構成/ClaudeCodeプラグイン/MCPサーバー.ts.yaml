        condition: '`MDMARK_PORT=18782`'
        mock: なし
        expected: '18782'
      - name: test_read_port_when_invalid
        case: 異常
        summary: 整数でない・範囲の外の値を拒む
        condition: '`MDMARK_PORT` が `abc`・`0`・`65536`・`1.5`'
        mock: なし
