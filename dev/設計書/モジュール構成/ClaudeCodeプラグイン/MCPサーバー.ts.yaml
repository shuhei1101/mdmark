  - name: createMcpServer
    title: MCP サーバーを作る
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 組み立て
    summary: '`instructions` を持ち、`TOOLS` のツールを登録した `McpServer` を作る'
    description: 結合テストはこの関数で作ったサーバーを `InMemoryTransport` でクライアントとつなぐ
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ context: ToolContext; version: string; stderr: (line: string) => void }'
        required: true
        description: ツールの前提・サーバーのバージョン（mdmark のバージョン）・標準エラーへ 1 行書く関数
    returns:
      type: McpServer
      description: ツールを登録したサーバー
    process: |-
      1. `{ name: SERVER_NAME, version }` と `{ capabilities: { tools: {} }, instructions: INSTRUCTIONS }` で `McpServer` を作る
      2. `TOOLS` の各ツールを、説明と `fromJsonSchema(inputSchema, ACCEPT_ALL_VALIDATOR)` で登録し、呼び出しごとにツールを呼ぶ（ツールを呼ぶ）
    unit_tests:
      - name: test_create_mcp_server
        case: 正常
        summary: 6 つのツールと instructions を出す
        condition: 作ったサーバーを `InMemoryTransport` でクライアントとつなぐ
        mock: なし（SDK の `Client`）
        expected: '`listTools` の名前が `TOOLS` の 6 つと一致し、`getInstructions()` が `INSTRUCTIONS`'
      - name: test_create_mcp_server_when_arguments_invalid
        case: 正常
        summary: 合わない引数は SDK でなく日本語の文で返る
        condition: '`read_guide` を `{ names: [] }` で呼ぶ'
        mock: なし（SDK の `Client`）
        expected: '`isError: true` で、テキストが `Input validation error` を含まず `names` を含む'
    callees:
      - '#functions[callTool]'
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[McpServer]
    status: planned
    introduced:
      pr: 72
  - name: runMcpServer
    title: MCP サーバーを動かす
    kind: 関数
    container: src/plugin/mcp.ts
    usecase: 共通
    role: 入口
    summary: 環境変数から作業のフォルダを取り、標準入出力で MCP サーバーを動かす
    description: 束ねた `plugin/server/mcp.js` を入口として実行したときだけ流す（`import.meta.main`）
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: Record<string, string | undefined>; moduleDir: string; stderr: (line: string) => void }'
        required: true
        description: 環境変数・このファイルのあるフォルダ（`plugin/server`）・標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 待ち受けを始めたら 0、作業のフォルダが無ければ 1
    process: |-
      1. `PROJECT_DIR_ENV` が無ければ標準エラーに「環境変数 CLAUDE_PROJECT_DIR がありません。Claude Code のプラグインから起動してください。」を書いて 1 を返す
      2. `pluginDir` を `moduleDir` の 1 つ上のフォルダにする
      3. 呼んだ mdmark のバージョンでサーバーを作る関数を `serveStdio` に渡し、0 を返す（MCP サーバーを作る・呼んだ CLI の版を返す）
    unit_tests:
      - name: test_run_mcp_server_when_project_dir_missing
        case: 正常
        summary: 作業のフォルダが無ければ待ち受けない
        condition: '`env` に `CLAUDE_PROJECT_DIR` が無い'
        mock: 行を配列に貯める `stderr`
        expected: 1 を返し、`stderr` に `CLAUDE_PROJECT_DIR` を含む行
    callees:
      - '#functions[createMcpServer]'
      - dev/設計書/モジュール構成/ライブラリ本体/版を上げる.ts#functions[cliVersion]
    refs:
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[serveStdio]
    status: planned
    introduced:
      pr: 72
