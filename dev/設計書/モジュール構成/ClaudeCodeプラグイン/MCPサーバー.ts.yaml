      - name: test_run_list_tags_when_markdown
        case: 正常
        summary: 既定では Markdown の表を返す
        condition: '`test_run_list_tags` と同じフォルダ、引数無し'
        mock: なし（一時フォルダ）
        expected: '`texts` が 1 つで、見出しの行が名前・グループ・説明・別名・振り替え先・文書の数、`structured` が無い'
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[requireConfig]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[requireIndexWithDocuments]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[normalizeIndex]
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[listTags]
      - '#functions[formatListTags]'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/タグの語彙を見る.ts#
    status: planned
    introduced:
      pr: 114
