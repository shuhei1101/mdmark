  - name: toRequest
    title: 要求を変換する
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: '`node:http` の要求を組み込みの `Request` にする'
    scope: internal
    is_async: false
    args:
      - name: options
        type: '{ req: IncomingMessage; port: number }'
        required: true
        description: 受けた要求と待ち受けているポート
    returns:
      type: Request
      description: '`http://{LISTEN_HOST}:{port}{req.url}` を URL にし、メソッド・ヘッダー・本文を移した要求'
    process: |-
      1. メソッドとヘッダーを移す
      2. GET・HEAD 以外は `req` を本文のストリームにし、`duplex: "half"` を付ける
    unit_tests:
      - name: test_to_request
        case: 正常
        summary: メソッド・パス・ヘッダー・本文を移す
        condition: '`POST /mcp`、`content-type: application/json`、本文 `{"a":1}` の要求を一時サーバーで受ける'
        mock: なし（`node:http` の一時サーバー）
        expected: 'URL が `http://127.0.0.1:{port}/mcp`、`content-type` が移り、`await request.json()` が `{ a: 1 }`'
    status: planned
    introduced:
      pr: 141
  - name: writeResponse
    title: 応答を書く
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: 組み込みの `Response` を `node:http` の応答へ流す
    scope: internal
    is_async: true
    side_effects: '`res` に書く'
    args:
      - name: options
        type: '{ response: Response; res: ServerResponse }'
        required: true
        description: 返す応答と書き込む先
    returns:
      type: Promise<void>
      description: 本文を流し終えたら解決する
    process: |-
      1. ステータスとヘッダーを書く
      2. 本文があれば読みながら書き、読み終えたら `res` を閉じる（SSE の応答も流しながら書く）
    unit_tests:
      - name: test_write_response
        case: 正常
        summary: ステータス・ヘッダー・本文を流す
        condition: '`new Response("ok", { status: 202, headers: { "x-a": "1" } })` を一時サーバーで返す'
        mock: なし（`node:http` の一時サーバー）
        expected: クライアントが受けたステータスが 202、`x-a` が `1`、本文が `ok`
    status: planned
    introduced:
      pr: 141
  - name: runServe
    title: 常駐サーバーを動かす
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    role: 組み立て
    summary: '`mdmark serve` の本体。`LISTEN_HOST` の `MCP_PATH` で待ち受け、止める合図で閉じる'
    scope: public
    is_async: true
    side_effects: ポートを待ち受ける。標準出力・標準エラーへ書く
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; packageDir: string; version: string; signal: AbortSignal; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: 環境変数・`mdmark serve` を起動したパッケージの直下・mdmark のバージョン・止める合図・標準出力と標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 終了コード
    process: |-
      1. ポートを読む（`CliError` は呼び出し元の CLI が終了コード 1 にする）
      2. `{packageDir}/plugin/guide` と `{packageDir}/dist` でサーバーの読む場所を作る
      3. `createMcpHandler` に、要求ごとに MCP サーバーを作る関数を渡してハンドラーを作る
      4. `node:http` のサーバーで、要求ごとに要求を変換し、要求を振り分け、応答を書く
      5. `LISTEN_HOST` とポートで待ち受ける。`EADDRINUSE` なら `PORT_IN_USE_MESSAGE` を標準エラーに書いて 1 を返す
      6. 待ち受けたら `MCP サーバーを起動しました: http://{LISTEN_HOST}:{port}{MCP_PATH}` を標準出力に 1 行書く
      7. `signal` が止める合図になったらサーバーを閉じ、0 を返す
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けの URL を書き、tools/list に答え、合図で止まる
        condition: '`MDMARK_PORT` に空きポート、`packageDir` に索引の入った `plugin/guide`、`AbortController` の `signal`'
        mock: なし（SDK の `Client` と `StreamableHTTPClientTransport`）
        expected: 標準出力に `http://127.0.0.1:{port}/mcp` を含む 1 行、`listTools` が 7 つ、`abort()` の後に 0 で解決し、同じポートへの接続が拒まれる
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使われていれば 1 を返す
        condition: 先に同じポートを別の `node:http` サーバーで待ち受ける
        mock: なし
        expected: 1 で解決し、標準エラーにポートの番号と `MDMARK_PORT` を含む文
    callees:
      - '#functions[readPort]'
      - '#functions[toRequest]'
      - '#functions[routeRequest]'
      - '#functions[writeResponse]'
      - '#functions[createMcpServer]'
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[createMcpHandler]
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#
    status: planned
    introduced:
      pr: 141
