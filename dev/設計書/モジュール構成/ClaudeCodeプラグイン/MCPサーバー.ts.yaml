  - name: runCheckTool
    title: 点検する（check）
    kind: 関数
    container: src/plugin/tools.ts
    usecase: 設定と索引を点検する
    role: ツール
    summary: 作業のフォルダから設定ファイルを探し、`mdmark check` と同じずれの一覧を返却する
    scope: public
    is_async: true
    args:
      - name: args
        type: '{ config?: string; base?: string; text?: string; file?: string; key?: string }'
        required: true
        description: 検査を通った引数
      - name: context
        type: ToolContext
        required: true
        description: ツールの前提
    returns:
      type: Promise<ToolOutput>
      description: '`json` が `{ issues }`（`CheckIssue` の並び。ずれがあっても誤りにしない）'
    process: |-
      1. `text` か `file` を指定したときは、`runCheck` と同じ引数の組を確認し、`checkMarkdownSource`（`cwd` は `projectDir`）のずれを `issues` で返却する（記法を点検する）。以降の手順は行わない

      2. 端末の設定と `projectDir` から上の設定ファイルを、`mdmark check` と同じく重ねて読み込む（設定を重ねて読み込む。`cwd` は `projectDir`、`env` は `mdmark serve` のプロセスの `process.env`）
      3. `base` を指定してずれを集め、`issues` で返却する（ずれを集める）。比べる基準を参照できない `CliError` は `callTool` がその文のツールのエラーにする
    unit_tests:
      - name: test_run_check_tool
        case: 正常
        summary: ずれを一覧で返却する
        condition: '`projectDir` の索引が無い文書 `old.md` を指す'
        mock: なし（一時フォルダ）
        expected: '`json.issues` に `kind: missing_doc` が 1 件'
      - name: test_run_check_tool_when_base_given
        case: 正常
        summary: '`base` から片方だけが変わった change_together の組を返却する'
        condition: '索引の `a`（`a.md`）と `b`（`b.md`）が互いを `change_together` で記載した `projectDir` をコミットしてタグ `base` を付け、`a.md` だけを書き換えてコミットする。`{ base: "base" }`'
        mock: なし（一時フォルダの git のリポジトリ）
        expected: '`json.issues` が `{ file: "b.md", where: "", kind: "missed_change_together" }` の 1 件'
      - name: test_run_check_tool_when_base_unknown
        case: 異常
        summary: 参照できない `base` は `CliError` にする
        condition: '`test_run_check_tool_when_base_given` と同じリポジトリ、`{ base: "no-such-ref" }`'
        mock: なし（一時フォルダの git のリポジトリ）
        expected: '`CliError` を投げ、メッセージが `mdmark check --base no-such-ref` が標準エラーに出す文と等しい'
      - case: 正常
        condition: 'インターフェース定義『点検する』の「正常系（文字列と YAML のキーを指定する）」の `projectDir`。`{ text }` と `{ file: "records.yaml", key: "items[0].body" }` の 2 回'
        expected: '1 回目の `json.issues` が `{ file: "-", where: "3", kind: "unknown_mark" }`、2 回目が `{ file: "records.yaml", where: "8", kind: "unknown_mark" }` の 1 件'
        mock: なし（一時フォルダ）
        name: test_run_check_tool_when_text_and_key
        summary: text と file・key で mdmark check と同じずれを返却する
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[findConfigFile]
      - dev/設計書/モジュール構成/ライブラリ本体/CLI.ts#functions[collectCheckIssues]
