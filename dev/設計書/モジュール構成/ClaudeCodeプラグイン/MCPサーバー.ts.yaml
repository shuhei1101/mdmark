    role: ツール
    summary: 設定の索引を読み、タグの語彙を付いている文書の数つきで、選んだ形式で返す
    kind: 関数
    scope: public
    is_async: true
    args:
      - name: args
        type: "{ query?: string; format?: 'markdown' | 'json'; config?: string }"
        required: true
        description: 検査を通った引数
      - name: context
        type: ToolContext
        required: true
        description: ツールの前提
    returns:
      type: Promise<ToolOutput>
      description: '`format: json` なら `structured` が `{ tags }`、`markdown` なら `texts` が `formatListTags` の 1 つ'
    process: |-
      1. `projectDir` から設定を読み、索引を読む（設定を読んで形を検める・索引を必ず読む）
      2. 索引を索引の形に合う要素だけにする（索引の形の検査）
      3. `query` でタグの語彙を並べる（タグの語彙を並べる）
      4. `format` が `json` なら `structured`、それ以外は Markdown にした `texts` で返す（タグの語彙を Markdown にする）
