        summary: メソッド・パス・ヘッダー・本文を移す
        condition: '`POST /mcp`、`content-type: application/json`、本文 `{"a":1}` の要求を一時サーバーで受ける'
        mock: なし（`node:http` の一時サーバー）
        expected: 'URL が `http://127.0.0.1:{port}/mcp`、`content-type` が移り、`await request.json()` が `{ a: 1 }`'
    status: planned
    introduced:
      pr: 141
  - name: writeResponse
    title: 応答を記載する
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    summary: 組み込みの `Response` を `node:http` の応答へ引き渡す
    scope: internal
    is_async: true
    side_effects: '`res` に記載する'
    args:
      - name: options
        type: '{ response: Response; res: ServerResponse }'
        required: true
        description: 返却する応答と書き込む先
    returns:
      type: Promise<void>
      description: 本文を実行し終えたら解決する
    process: |-
      1. ステータスとヘッダーを記載する
      2. 本文があれば読み込みながら記載し、読み込み終えたら `res` を閉じる（SSE の応答も実行しながら記載する）
    unit_tests:
      - name: test_write_response
        case: 正常
        summary: ステータス・ヘッダー・本文を実行する
        condition: '`new Response("ok", { status: 202, headers: { "x-a": "1" } })` を一時サーバーで返却する'
        mock: なし（`node:http` の一時サーバー）
        expected: クライアントが受けたステータスが 202、`x-a` が `1`、本文が `ok`
    status: planned
    introduced:
      pr: 141
  - name: runServe
    title: 常駐サーバーを動かす
    kind: 関数
    container: src/plugin/http.ts
    usecase: MCPサーバーを起動・停止する
    role: 組み立て
    summary: '`mdmark serve` の本体。`LISTEN_HOST` の `MCP_PATH` で待ち受け、止める合図で閉じる'
    scope: public
    is_async: true
    side_effects: ポートを待ち受ける。標準出力・標準エラーへ書き込む
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; packageDir: string; version: string; signal: AbortSignal; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: 環境変数・`mdmark serve` を起動したパッケージの直下・mdmark のバージョン・止める合図・標準出力と標準エラーへ 1 行書く関数
    returns:
      type: Promise<0 | 1>
      description: 終了コード
    process: |-
      1. ポートを読み込む（`CliError` は呼び出し元の CLI が終了コード 1 にする）
      2. `{packageDir}/dist` でサーバーの読み込む場所を作り、端末の設定（`resolveSettingsPath`）の `serve.tmuxSession`（無ければ `mdmark-mcp`）をセッション名にする。端末の設定を読み込めなければ既定の名前にする
      3. `createMcpHandler` に、要求ごとに MCP サーバーを作る関数を指定してハンドラーを作る
      4. `node:http` のサーバーで、要求ごとに要求を変換し、要求を振り分け、応答を記載する
      5. `LISTEN_HOST` とポートで待ち受ける。`EADDRINUSE` なら `PORT_IN_USE_MESSAGE` を標準エラーに書き込んで 1 を返却する
      6. 待ち受けたら `MCP サーバーを起動しました: http://{LISTEN_HOST}:{port}{MCP_PATH}` を標準出力に 1 行書く
      7. `signal` が止める合図になったらサーバーを閉じ、0 を返却する
    unit_tests:
      - name: test_run_serve
        case: 正常
        summary: 待ち受けの URL を記載し、tools/list に回答し、合図で止まる
        condition: '`MDMARK_PORT` に空きポート、`packageDir` にこのリポジトリの直下、`AbortController` の `signal`'
        mock: なし（SDK の `Client` と `StreamableHTTPClientTransport`）
        expected: 標準出力に `http://127.0.0.1:{port}/mcp` を含む 1 行、`listTools` が 6 つ、`abort()` の後に 0 で解決し、同じポートへの接続が拒まれる
      - name: test_run_serve_when_port_in_use
        case: 異常
        summary: ポートが使用されていれば 1 を返却する
        condition: 先に同じポートを別の `node:http` サーバーで待ち受ける
        mock: なし
        expected: 1 で解決し、標準エラーにポートの番号と `MDMARK_PORT` を含む文
    callees:
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/ポート.ts#functions[readPort]
      - '#functions[toRequest]'
      - '#functions[routeRequest]'
      - '#functions[writeResponse]'
      - '#functions[createMcpServer]'
      - dev/設計書/外部ライブラリ/MCP-SDK#catalogs[API].entries[createMcpHandler]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/パス.ts#functions[readSessionName]
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/MCPサーバーを起動・停止する.ts#
    status: planned
    introduced:
      pr: 141
