  - name: rewriteGuideLinks
    title: 使い方集の本文のリンクを書き換える
    kind: 関数
    container: scripts/build-plugin.ts
    usecase: 配布物をビルドして検査する
    summary: 写すページの本文の相対リンクを、索引にあるページなら `read_guide` の名前、無いページならバージョンのタグの GitHub の URL に書き換える
    description: '`read_guide` は本文をそのまま返すため、相対リンクのままではモデルがリンク先を読めない。フェンスのコードブロックとインラインコードの中、`http(s):` と `#` で始まるリンクは書き換えない'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ markdown: string; page: string; entries: GuideEntry[]; version: string }'
        required: true
        description: ページの本文・そのページのリポジトリの直下からのパス・索引の行・埋めるバージョン
    returns:
      type: string
      description: リンクを書き換えた本文
    process: |-
      1. コードブロックとインラインコードの外の `[文字](リンク先)` と `![文字](リンク先)` を拾う
      2. リンク先を `page` のフォルダから解決し、`#` の後ろを分ける
         - 解決したパスが索引の行の `page` の場合、`[文字](…)` を `文字（read_guide の {名前}）` にする
         - それ以外の場合、リンク先を `{GUIDE_LINK_BASE}/{version}/{パス}{#の後ろ}` にする
    unit_tests:
      - name: test_rewrite_guide_links
        case: 正常
        summary: 索引にあるページへのリンクを名前にする
        condition: '`docs/使い方/a.md` の本文に `[表](./b.md)`、`docs/使い方/b.md` が名前 `tables` で索引にある'
        mock: なし
        expected: '`表（read_guide の tables）`'
      - name: test_rewrite_guide_links_when_outside_index
        case: 正常
        summary: 索引に無いページへのリンクをタグの URL にする
        condition: '`[設定](../リファレンス/設定.md#features)`、`version: v0.7.0`'
        mock: なし
        expected: リンク先が `https://github.com/shuhei1101/mdmark/blob/v0.7.0/docs/リファレンス/設定.md#features`
      - name: test_rewrite_guide_links_when_in_code
        case: 正常
        summary: コードの中と絶対 URL・ページ内のリンクはそのまま
        condition: フェンスの中の `[a](./b.md)`、インラインコードの `[a](./b.md)`、`[x](https://example.com)`、`[y](#一覧)`
        mock: なし
        expected: 本文が変わらない
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/使い方集を読む.ts#
