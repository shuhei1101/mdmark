title: ClaudeCodeプラグイン / セットアップ / 入口
lead: '`setup.js` の入口とサブコマンドの振り分け。'
constants:
  - name: SETUP_EXIT
    title: setup.js の終了コード
    container: src/plugin/setup/main.ts
    usecase: 常駐サーバーを起動する
    summary: サブコマンドの終了コード
    entries:
      - key: ok
        value: '0'
        description: 正常
      - key: failed
        value: '1'
        description: 設定を読めない・Schema に合わない・ポートが使われている
      - key: tmuxMissing
        value: '2'
        description: tmux が無い
      - key: timedOut
        value: '3'
        description: 待ち受けを待つ上限を超えた
    status: planned
    introduced:
      pr: 354
functions:
  - name: runSetup
    title: setup.js を動かす
    kind: 関数
    container: src/plugin/setup/main.ts
    usecase: 共通
    role: 入口
    summary: サブコマンドを振り分け、結果の JSON を標準出力に 1 行書き、終了コードを返す
    description: 束ねた `plugin/bin/setup.js` を入口として実行したときだけ `process.argv`・`process.env` で呼び、戻り値を終了コードにする（`import.meta.main`）
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ argv: string[]; env: NodeJS.ProcessEnv; pluginRoot: string; version: string; run: RunCommand; stdout: (line: string) => void; stderr: (line: string) => void }'
        required: true
        description: 引数・環境変数・プラグインの直下・プラグインのバージョン・コマンドの実行・出力の先
    returns:
      type: Promise<0 | 1 | 2 | 3>
      description: '`SETUP_EXIT` の値'
    process: |-
      1. 先頭の引数でサブコマンドを選び、知らないサブコマンドは使い方を標準エラーに書いて 1 を返す
      2. 各サブコマンドの関数を呼び、成功なら結果を JSON の 1 行で標準出力に書く
      3. `SetupError` は理由と修正方法を標準エラーに書き、その終了コードを返す
    callees:
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/状態.ts#functions[readTerminalStatus]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/キーの一覧.ts#functions[listConfigKeys]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/書き込み.ts#functions[writeSettings]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/書き込み.ts#functions[writeConfig]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/起動.ts#functions[startServer]
    unit_tests:
      - name: test_run_setup
        case: 正常
        summary: status の結果を JSON の 1 行で書く
        condition: '`argv` が `["status"]`、一時の端末の環境変数'
        mock: 行を配列に貯める `stdout`、終了コード 1 の `run`（tmux が無い）
        expected: 0 を返し、`stdout` の 1 行を JSON として読むと `tmux.available` が `false`
      - name: test_run_setup_when_unknown_command
        case: 異常
        summary: 知らないサブコマンドは 1
        condition: '`argv` が `["foo"]`'
        mock: 行を配列に貯める `stderr`
        expected: 1 を返し、`stderr` に `status` を含む使い方が出る
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/端末の状態を調べる.ts#
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#
    status: planned
    introduced:
      pr: 354
test_files:
  - tests/unit/src/plugin/setup/main.test.ts
