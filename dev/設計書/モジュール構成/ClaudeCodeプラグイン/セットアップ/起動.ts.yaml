title: ClaudeCodeプラグイン / セットアップ / 起動
lead: '`start-server` の tmux の起動と待ち受けの確かめ。'
function_types:
  - name: RunCommand
    title: 外部のコマンドを実行する
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    summary: コマンドと引数を受け、終了コードと標準出力を返す。テストで tmux の呼び出しを差し替える
    args:
      - name: command
        type: string
        required: true
        description: コマンド
      - name: args
        type: string[]
        required: true
        description: 引数
    returns:
      type: 'Promise<{ code: number; stdout: string }>'
      description: 終了コードと標準出力
    status: planned
    introduced:
      pr: 354
constants:
  - name: START_TIMEOUT_SEC
    title: 待ち受けを待つ上限の既定
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    summary: '`MDMARK_START_TIMEOUT_SEC` が無いときの上限の秒数'
    value: '120'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#constraints[待ち]
    status: planned
    introduced:
      pr: 354
  - name: POLL_INTERVAL_MS
    title: 待ち受けを確かめる間隔
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    summary: ポートへつなぎ直す間隔
    value: '1000'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#constraints[待ち]
    status: planned
    introduced:
      pr: 354
functions:
  - name: buildTmuxArgs
    title: tmux の起動の引数を作る
    kind: 関数
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`new-session` の引数の並びを作る'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ session: string; port: number; settingsPath: string; stateDir: string; logPath: string; command: string }'
        required: true
        description: セッション名・ポート・端末の設定のパス・状態の置き場所・ログ・起動するコマンド
    returns:
      type: string[]
      description: '`tmux` に渡す引数'
    process: 1. `["new-session", "-d", "-s", session, "-e", "MDMARK_PORT=…", "-e", "MDMARK_CONFIG=…", "-e", "MDMARK_STATE_DIR=…", "sh", "-c", "{command} 2>&1 | tee -a '{logPath}'"]` を返す。ログのパスは一重引用符で囲み、中の一重引用符は `'\''` にする
    unit_tests:
      - name: test_build_tmux_args
        case: 正常
        summary: 環境変数を -e で渡し sh -c で包む
        condition: セッション `s`・ポート 18782・ログ `/l/serve.log`・コマンド `serve`
        mock: なし
        expected: '`-e MDMARK_PORT=18782` を含み、末尾 3 つが `sh`・`-c`・`serve 2>&1 | tee -a ''/l/serve.log''`'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#constraints[起動のコマンド]
      - dev/設計書/外部ライブラリ/tmux#limitations
    status: planned
    introduced:
      pr: 354
  - name: startServer
    title: 常駐サーバーを起動する
    kind: 関数
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`start-server` の本体'
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; pluginRoot: string; version: string } & { run: RunCommand; sleep: (ms: number) => Promise<void> }'
        required: true
        description: 環境変数・プラグインの直下・プラグインのバージョン・コマンドの実行・待つ関数
    returns:
      type: Promise<StartResult>
      description: インターフェース定義『常駐サーバーを起動する』のレスポンス
    process: |-
      1. `tmux -V` が失敗すれば、端末で動かすコマンドを添えて `SetupError`（2）
      2. セッションがあり待ち受けていれば `already_running`。セッションがあり待ち受けていなければ `kill-session -t ={名前}` して起動へ進み `restarted` にする
      3. 状態の置き場所を作り、`buildTmuxArgs` の引数で `run("tmux", …)` する。起動するコマンドは `MDMARK_SERVE_COMMAND`、無ければ `npx -y github:shuhei1101/mdmark#{version} serve`
      4. `POLL_INTERVAL_MS` ごとに、セッションが閉じていればログの末尾 20 行を添えて `SetupError`（1）、待ち受けていれば次へ。上限（`MDMARK_START_TIMEOUT_SEC`、無ければ `START_TIMEOUT_SEC`）を超えたら `kill-session` してログの末尾を添えて `SetupError`（3）
      5. `listToolNames` でツールの名前を取り、結果を返す
    side_effects: tmux のセッションを作る・閉じる。状態の置き場所を作る
    callees:
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/パス.ts#functions[resolveSetupPaths]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/セットアップ/パス.ts#functions[readSessionName]
      - '#functions[buildTmuxArgs]'
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/ポート.ts#functions[isPortListening]
      - '#functions[listToolNames]'
    unit_tests:
      - name: test_start_server
        case: 正常
        summary: 起動して待ち受けを待つ
        condition: 一時の端末、`MDMARK_SERVE_COMMAND` に空いたポートで待ち受ける `node -e` のサーバー
        mock: '`run` は実際の tmux（`TMUX_TMPDIR` は一時フォルダ）'
        expected: '`result` が `started`、`stop` が `tmux kill-session -t =mdmark-mcp`'
      - name: test_start_server_when_tmux_missing
        case: 異常
        summary: tmux が無ければ 2
        condition: '`tmux -V` に 127 を返す `run`'
        mock: 差し替えた `run`
        expected: 終了コード 2 の `SetupError`、メッセージに `MDMARK_PORT=` と `serve` のコマンド
      - name: test_start_server_when_timed_out
        case: 異常
        summary: 上限を超えたら 3
        condition: '`MDMARK_START_TIMEOUT_SEC=0`、`has-session` に 0 を返し続ける `run`'
        mock: 差し替えた `run` と、すぐ解決する `sleep`
        expected: 終了コード 3 の `SetupError`、`kill-session` を呼んでいる
      - name: test_start_server_when_session_closed
        case: 異常
        summary: セッションが閉じたら 1
        condition: '`has-session` が起動の後に 1 を返す `run`、ログに `EADDRINUSE` の行'
        mock: 差し替えた `run`
        expected: 終了コード 1 の `SetupError`、メッセージにログの行と `MDMARK_PORT` の修正方法
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#
    status: planned
    introduced:
      pr: 354
  - name: listToolNames
    title: ツールの名前を取る
    kind: 関数
    container: src/plugin/setup/server.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 常駐サーバーへ `initialize` と `tools/list` を送り、ツールの名前を返す
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ port: number }'
        required: true
        description: ポート
    returns:
      type: Promise<string[]>
      description: ツールの名前
    process: 1. MCP-SDK の `Client` と `StreamableHTTPClientTransport` で `http://127.0.0.1:{port}/mcp` につなぎ、`listTools` の名前を返して閉じる
    callees:
      - dev/設計書/外部ライブラリ/MCP-SDK#
    unit_tests:
      - name: test_list_tool_names
        case: 正常
        summary: 起動した常駐サーバーのツール
        condition: '`runServe` を空いたポートで起動する'
        mock: なし
        expected: '`["export_html", "build_site", "check"]` を並べ替えたものと等しい'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#response
    status: planned
    introduced:
      pr: 354
test_files:
  - tests/unit/src/plugin/setup/server.test.ts
