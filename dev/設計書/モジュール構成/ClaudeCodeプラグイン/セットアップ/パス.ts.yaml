title: ClaudeCodeプラグイン / セットアップ / パス
lead: 端末の設定・状態の配置場所・`settings.json`・unit のファイルのパスと、起動の方法・unit の名前・tmux のセッション名の読み取り。
constants:
  - name: DEFAULT_SESSION_NAME
    title: 既定の tmux のセッション名
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    summary: 端末の設定に `serve.tmuxSession` が無いときのセッション名
    value: mdmark-mcp
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.tmuxSession]
    status: planned
    introduced:
      pr: 354
  - name: DEFAULT_UNIT_NAME
    title: 既定の unit の名前
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    summary: 端末の設定に `serve.systemdUnit` が無いときの unit の名前
    value: mdmark-mcp
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.systemdUnit]
    status: planned
    introduced:
      pr: 444
  - name: SERVE_LOG_FILE
    title: 常駐サーバーのログのファイル名
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    summary: 状態の配置場所の下のログのファイル名
    value: serve.log
    status: planned
    introduced:
      pr: 354
data_models:
  - name: Launcher
    title: 起動の方法
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    summary: '`"systemd" | "tmux"`'
    properties: []
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.launcher]
    status: planned
    introduced:
      pr: 444
  - name: LauncherSetting
    title: 起動の方法の設定
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    summary: '`"auto" | Launcher`'
    properties: []
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.launcher]
    status: planned
    introduced:
      pr: 444
functions:
  - name: resolveSetupPaths
    title: 端末のパスを決める
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 端末の状態を調べる
    role: 処理
    summary: 端末の設定・状態の配置場所・ログ・settings.json のパスとポートを返却する
    scope: public
    is_async: false
    args:
      - name: env
        type: NodeJS.ProcessEnv
        required: true
        description: 環境変数
    returns:
      type: SetupPaths
      description: '`settingsPath`・`defaultPath`（既定のパスか）・`stateDir`・`logPath`・`claudeSettingsPath`・`port`'
    process: |-
      1. 端末の設定のパスは `resolveSettingsPath`（設定を重ねて読み込む）と同じ決め方にし、`MDMARK_CONFIG` が無いか既定のパスと同じなら `defaultPath` を真にする
      2. 状態の配置場所は `MDMARK_STATE_DIR`、無ければ `${XDG_STATE_HOME:-~/.local/state}/mdmark`
      3. `settings.json` は `${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json`
      4. ポートは `readPort`（MCP サーバーと同じ）。値の先頭の `~` はホームに展開する
    callees:
      - dev/設計書/モジュール構成/ライブラリ本体/設定を重ねて読み込む.ts#functions[resolveSettingsPath]
      - dev/設計書/モジュール構成/ClaudeCodeプラグイン/ポート.ts#functions[readPort]
    unit_tests:
      - name: test_resolve_setup_paths
        case: 正常
        summary: 環境変数が無ければ既定のパス
        condition: '`HOME=/h`、ほかの環境変数なし'
        mock: なし
        expected: '`settingsPath` が `/h/.config/mdmark/settings.yaml`、`defaultPath` が真、`logPath` が `/h/.local/state/mdmark/serve.log`、`claudeSettingsPath` が `/h/.claude/settings.json`、`port` が 8782'
      - name: test_resolve_setup_paths_when_overridden
        case: 正常
        summary: 環境変数で上書きする
        condition: '`MDMARK_CONFIG=~/x.yaml`・`MDMARK_STATE_DIR=/s`・`CLAUDE_CONFIG_DIR=/c`'
        mock: なし
        expected: '`settingsPath` が `/h/x.yaml`、`defaultPath` が偽、`logPath` が `/s/serve.log`、`claudeSettingsPath` が `/c/settings.json`'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/端末の状態を調べる.ts#request
      - dev/設計書/設定/ClaudeCodeプラグイン#settings
    status: planned
    introduced:
      pr: 354
  - name: readSessionName
    title: セッション名を読み込む
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 端末の設定の `serve.tmuxSession`、無ければ `DEFAULT_SESSION_NAME`
    scope: public
    is_async: false
    args:
      - name: settings
        type: Record<string, unknown> | undefined
        required: true
        description: 読み込んだ端末の設定。無ければ `undefined`
    returns:
      type: string
      description: セッション名
    process: 1. `serve.tmuxSession` が文字列ならそれを、ほかは `DEFAULT_SESSION_NAME` を返却する
    unit_tests:
      - name: test_read_session_name
        case: 正常
        summary: 無ければ既定
        condition: '`undefined`'
        mock: なし
        expected: '`mdmark-mcp`'
      - name: test_read_session_name_when_set
        case: 正常
        summary: 端末の設定の値
        condition: '`{ serve: { tmuxSession: "x" } }`'
        mock: なし
        expected: '`x`'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.tmuxSession]
    status: planned
    introduced:
      pr: 354
  - name: readUnitName
    title: unit の名前を読み込む
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 端末の設定の `serve.systemdUnit`、無ければ `DEFAULT_UNIT_NAME`
    scope: public
    is_async: false
    args:
      - name: settings
        type: Record<string, unknown> | undefined
        required: true
        description: 読み込んだ端末の設定。無ければ `undefined`
    returns:
      type: string
      description: unit の名前
    process: 1. `serve.systemdUnit` が文字列ならそれを、ほかは `DEFAULT_UNIT_NAME` を返却する
    unit_tests:
      - name: test_read_unit_name
        case: 正常
        summary: 無ければ既定、あれば端末の設定の値
        condition: '`undefined` と `{ serve: { systemdUnit: "x" } }`'
        mock: なし
        expected: '`mdmark-mcp` と `x`'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.systemdUnit]
    status: planned
    introduced:
      pr: 444
  - name: readLauncherSetting
    title: 起動の方法の設定を読み込む
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: 端末の設定の `serve.launcher` が `auto`・`systemd`・`tmux` ならその値、ほかは `auto`
    scope: public
    is_async: false
    args:
      - name: settings
        type: Record<string, unknown> | undefined
        required: true
        description: 読み込んだ端末の設定。無ければ `undefined`
    returns:
      type: LauncherSetting
      description: 起動の方法の設定
    process: 1. `serve.launcher` が `auto`・`systemd`・`tmux` のどれかならそれを、ほかは `auto` を返却する（値の誤りは `mdmark check` が通知する）
    unit_tests:
      - name: test_read_launcher_setting
        case: 正常
        summary: 知らない値と無いときは auto
        condition: '`undefined`・`{ serve: { launcher: "tmux" } }`・`{ serve: { launcher: "x" } }`'
        mock: なし
        expected: '`auto`・`tmux`・`auto`'
    refs:
      - dev/設計書/設定/ライブラリ本体#settings[serve.launcher]
    status: planned
    introduced:
      pr: 444
  - name: resolveUnitPath
    title: unit のファイルのパスを決める
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 常駐サーバーを起動する
    role: 処理
    summary: '`${XDG_CONFIG_HOME:-~/.config}/systemd/user/{unit}.service`'
    scope: public
    is_async: false
    args:
      - name: options
        type: '{ env: NodeJS.ProcessEnv; unit: string }'
        required: true
        description: 環境変数と unit の名前
    returns:
      type: string
      description: unit のファイルの絶対パス
    process: 1. `XDG_CONFIG_HOME` が空でなければそれを、ほかは `{HOME}/.config` を基準にし、`systemd/user/{unit}.service` を結合して返却する
    unit_tests:
      - name: test_resolve_unit_path
        case: 正常
        summary: XDG_CONFIG_HOME と HOME から決める
        condition: '`XDG_CONFIG_HOME=/x`、`XDG_CONFIG_HOME` が無く `HOME=/h`'
        mock: なし
        expected: '`/x/systemd/user/u.service`、`/h/.config/systemd/user/u.service`'
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/常駐サーバーを起動する.ts#constraints[unit のファイル]
      - dev/設計書/外部ライブラリ/systemd#limitations
    status: planned
    introduced:
      pr: 444
  - name: readYamlFile
    title: YAML のファイルを読み込む
    kind: 関数
    container: src/plugin/setup/paths.ts
    usecase: 端末の状態を調べる
    role: 処理
    summary: YAML のファイルを読み込む。無ければ `undefined`、読み込めないかキーと値の構造でなければパスと行を添えて `SetupError`（1）
    scope: public
    is_async: true
    args:
      - name: options
        type: '{ path: string; readFile: (path: string) => Promise<string> }'
        required: true
        description: パスと読み込む関数
    returns:
      type: 'Promise<{ text: string; raw: Record<string, unknown> } | undefined>'
      description: 本文と読み込んだ値
    process: |-
      1. 読み込む。`ENOENT` なら `undefined`
      2. YAML として読み込めなければ、パスと行を添えて `SetupError`（1）
      3. 空なら `{}`、キーと値の構造でなければ `SetupError`（1）
    unit_tests: []
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/端末の状態を調べる.ts#exceptions
    status: planned
    introduced:
      pr: 354
test_files:
  - tests/unit/src/plugin/setup/paths.test.ts
classes:
  - name: SetupError
    title: setup.js の誤り
    kind: クラス
    inherits: Error
    container: src/plugin/setup/paths.ts
    usecase: 端末の状態を調べる
    summary: '`setup.js` のサブコマンドの誤り。`exitCode`（1・2・3）を `setup.js` の終了コードにする'
    status: planned
    introduced:
      pr: 354
