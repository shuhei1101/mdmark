title: "ClaudeCodeプラグイン / ガイド"
lead: ガイドの索引（名前・読み込むとき・概要・本文のページ）の構造を検査する。プラグインのビルドが使用する。
directory: |-
  ```tree
  src/plugin/
  └── guide.ts  # ガイドの索引の検査
  ```
data_models:
  - name: GuideEntry
    title: ガイドの索引の行
    container: src/plugin/guide.ts
    usecase: 共通
    role: DTO
    summary: ガイドの索引の 1 行
    properties:
      - name: name
        type: string
        description: 名前。索引の中で一意
      - name: when
        type: string
        description: 読み込むとき（どんな作業のときに読み込むか）
      - name: summary
        type: string
        description: 1 文の概要
      - name: page
        type: string
        description: 本文のページ。リポジトリの直下からの相対パス（`docs/` の下の `.md`）
    refs:
      - dev/設計書/ER図/ガイド#tables[guides]
    status: planned
    introduced:
      pr: 72
functions:
  - name: parseGuideIndex
    title: ガイドの索引を検査する
    kind: 関数
    container: src/plugin/guide.ts
    usecase: 共通
    role: 検査
    summary: 値をガイドの索引の構造で検査し、合う行と合わない場所の一覧を返却する
    scope: public
    is_async: false
    args:
      - name: value
        type: unknown
        required: true
        description: YAML か JSON を読み込んだ値
    returns:
      type: '{ entries: GuideEntry[]; problems: IndexProblem[] }'
      description: 合う行と、合わない場所（`guides[1].page` の構造）と内容の一覧
    process: |-
      1. 値が `schema: 1` と `guides` の配列を持つオブジェクトかを確認する
      2. `guides` の要素ごとに、`name`・`when`・`summary`・`page` が空でない文字列か、知らないキーが無いかを確認する
      3. `name` の重なりと、`page` が `docs/` で始まり `.md` で終わるかを確認する
      4. 合う要素だけを `entries` に、合わないところを `problems` に入れて返却する
    unit_tests:
      - name: test_parse_guide_index
        case: 正常
        summary: 合う索引の行を全て返却する
        condition: '`schema: 1` と 2 行の `guides`'
        mock: なし
        expected: '`entries` が 2 行、`problems` が空'
      - name: test_parse_guide_index_when_key_missing
        case: 正常
        summary: 欠けたキーを場所つきで返却する
        condition: 2 行目に `page` が無い
        mock: なし
        expected: '`entries` が 1 行、`problems` に `guides[1].page` がある'
      - name: test_parse_guide_index_when_name_duplicated
        case: 正常
        summary: 名前の重なりを返却する
        condition: 2 行が同じ `name`
        mock: なし
        expected: '`problems` に `guides[1].name` がある'
      - name: test_parse_guide_index_when_page_outside_docs
        case: 正常
        summary: docs/ の外のページを返却する
        condition: '`page: src/index.ts`'
        mock: なし
        expected: '`problems` に `guides[0].page` がある'
      - name: test_parse_guide_index_when_not_object
        case: 正常
        summary: オブジェクトでない値を返却する
        condition: 値が配列
        mock: なし
        expected: '`entries` が空、`problems` の場所が空文字'
    refs:
      - dev/設計書/ER図/ガイド#
    status: planned
    introduced:
      pr: 72
test_files:
  - tests/unit/src/plugin/guide.test.ts
