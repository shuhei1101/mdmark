        value: '`[mswLoader(startWorker)]`（`msw-storybook-addon/csf3` の `mswLoader`。`startWorker` は `msw/browser` の `setupWorker()` を `start({ quiet: true, onUnhandledFrame: "bypass" })` で始めて返却する）'
