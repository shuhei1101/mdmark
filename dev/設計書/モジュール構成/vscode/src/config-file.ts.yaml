id: MOD-472-105
title: VS Code 拡張機能 / 設定 / config-file.ts
functions:
  - name: openConfigFile
    title: 設定ファイルを開く
    kind: 関数
    container: vscode/src/config-file.ts
    usecase: 記載した内容をプレビューに映す
    summary: '`mdmark.openConfig` の本体。開くファイル（無ければ最も近い設定ファイル）をエディタで開き、無ければ雛形を作るか尋ねる'
    scope: public
    is_async: true
    side_effects: 「作成」を選んだときだけ、フォルダを作って `CONFIG_TEMPLATE` を記載する
    args:
      - name: options
        type: '{ path?: string; cwd: string; configPath: string; baseDir: string; log: Logger }'
        required: true
        description: 開くファイル（帯から呼んだときは帯に出したファイル）・Markdown のフォルダ・`mdmark.configPath`・基準のフォルダ
    returns:
      type: Promise<void>
      description: 開いたか、作らないと回答したら解決する
    process: |-
      1. 開くファイルを決める
         - `path` があれば `path`
         - 無く `configPath` が空でなければ、設定ファイルの場所を決める（設定ファイルの場所を決める）
         - どちらも無ければ、`cwd` から上へ最も近い `mdmark.config.yaml` を探し（上のフォルダの設定ファイルを探す。`cascade: false`）、無ければ `baseDir` の `mdmark.config.yaml`
      2. ファイルがあれば `window.showTextDocument` で開いて終わる
      3. 無ければ `window.showInformationMessage` を `{ modal: true, detail }` とボタン「作成」で出す（文言は画面設計の「雛形を作るかの確認」）
         - 「作成」以外（閉じた・キャンセル）の場合、何も書き込まずに終わる
      4. フォルダが無ければ作り、`CONFIG_TEMPLATE` を記載して `window.showTextDocument` で開く。記載する前にファイルができていたら書き換えずに開く
         - フォルダを作れない・記載できない場合、`window.showErrorMessage` で OS の誤りの文を出して終わる
           - `[error]` 設定ファイルの雛形を書き込めない（パス・誤り）
         - `[info]` 設定ファイルの雛形を作った（パス）
    callees:
      - 'MOD-472-104#functions[resolveConfigPath]'
      - MOD-472-116#functions[findConfigChain]
      - 'MOD-472-104#constants[CONFIG_TEMPLATE]'
    refs:
      - IF-472-25#
      - SCR-472-1#elements[雛形を作るかの確認]
    status: planned
