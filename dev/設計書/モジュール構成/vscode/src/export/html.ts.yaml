id: MOD-472-100
title: VS Code 拡張機能 / 書き出し / html.ts
test_files:
  - tests/unit/vscode/src/export/html.test.ts
constants:
  - name: PRINT_WAIT_MS
    title: 印刷のダイアログを出すまでの待ちの上限
    container: vscode/src/export/html.ts
    summary: '`mount` の後、外部ライブラリのマーカーの場所が無くなるのとフォントを待つ上限（ミリ秒）'
    value: '10000'
    refs:
      - NFR-472-1#requirements[印刷のダイアログを出すまでの待ちの上限]
    status: planned
functions:
  - name: resolveExportPath
    title: 書き出す先を決める
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`mdmark.export.outputDir` が空なら Markdown と同じフォルダ、相対パスならワークスペースのフォルダから、絶対パスならそのままのフォルダに、拡張子を `.html` に替えた名前を付けて返却する'
    scope: public
    args:
      - name: options
        type: '{ markdownPath: string; outputDir: string; workspaceDir: string }'
        required: true
        description: Markdown の絶対パス、`mdmark.export.outputDir`、Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）
    returns:
      type: string
      description: 書き出す HTML の絶対パス
    unit_tests:
      - name: test_resolve_export_path
        case: 正常
        summary: 空・相対パス・絶対パスのそれぞれで書き出す先を決める
        condition: '`markdownPath` が `/ws/docs/guide.md`、`workspaceDir` が `/ws` で、`outputDir` が `""`・`out`・`/tmp/html`'
        mock: なし
        expected: '`/ws/docs/guide.html`・`/ws/out/guide.html`・`/tmp/html/guide.html`'
    refs:
      - IF-472-15#constraints[書き出す先]
    status: planned
  - name: escapeScriptJson
    title: script に埋める JSON にする
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`JSON.stringify` し、`<` を JSON の Unicode エスケープ（6 文字）に置き換えて返却する。本文の `</script>` で `script` 要素が閉じない'
    scope: public
    args:
      - name: value
        type: unknown
        required: true
        description: 埋める値
    returns:
      type: string
      description: '`<` を持たない JSON'
    unit_tests:
      - name: test_escape_script_json
        case: 正常
        summary: 本文の script の閉じを含んでも `<` を残さず、読み込み戻すと同じ値
        condition: '`{ markdown: "a</script><b>" }`'
        mock: なし
        expected: 戻り値が `<` を含まず、`JSON.parse` すると元の値
    refs:
      - IF-472-15#constraints[書き出す中身]
    status: planned
  - name: buildExportHtml
    title: 書き出す HTML を組む
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: '`<base>`・そのバージョンの `index.css` の `<link>`・`theme` の CSS の `<style>`・本文と設定の JSON の `<script type="application/json">`・`index.js` を読み込んで拡張を `registerExtension` で登録してから `mount(document.querySelector("main"), { markdown, config })` を呼ぶ `<script type="module">` を持つ HTML を組む'
    description: '`print` が `true` のときだけ、`mount` の後に「外部ライブラリのマーカーの場所（class `mdmark-embed` と `role="status"` の要素）が無くなり、`document.fonts.ready` が解決したら `window.print()` を 1 回呼ぶ。`PRINT_WAIT_MS` を超えたらそのまま呼ぶ」処理を追加する。マーカーの場所は `MutationObserver` で待つ。`title` は Markdown のファイル名をエスケープして入れる。拡張のコードは `moduleDataUrl` で `data:` の URL にする'
    scope: public
    args:
      - name: options
        type: '{ markdown: string; config: PreviewConfig; title: string; distJs: string; distCss: string; baseHref: string; print: boolean; themeCss?: string; extensions: string[] }'
        required: true
        description: 全文・設定（相対パスの `libraries`・`html-scripts.url` は `embedLocalLibraries` が `data:` の URL にした値）・タイトル・配布物の URL・Markdown のフォルダの `file:` の URL に `/` を付けたもの・印刷を待つか・重ねた設定の `theme` の CSS の中身・拡張をまとめた ES モジュールのコード（設定の順）
    returns:
      type: string
      description: HTML 文字列
    unit_tests:
      - name: test_build_export_html
        case: 正常
        summary: 本文を JSON で埋め、バージョン付きの配布物で mount する
        condition: '`markdown` が `# タイトル\n</script>`、`print` が `false`'
        mock: なし
        expected: '`<base href="{baseHref}">`・`<link rel="stylesheet" href="{distCss}">`・`type="application/json"` の `script` を持ち、その中身が `<` を含まない。`type="module"` の `script` が `{distJs}` を import し `mount` を呼ぶ。`window.print` を含まない'
      - name: test_build_export_html_when_print
        case: 正常
        summary: 印刷を待つ処理を追加する
        condition: '`print` が `true`'
        mock: なし
        expected: '`window.print()`・`document.fonts.ready`・`PRINT_WAIT_MS` の値 `10000` を含む'
      - name: test_build_export_html_when_theme_and_extensions
        case: 正常
        summary: theme の CSS を配布物の CSS の後に埋め、拡張を mount の前に登録する
        condition: "`themeCss` が `.a{color:red}</style>`、`extensions` が `[\"export default {name:'x'}\"]`"
        mock: なし
        expected: '`<style>` が配布物の `link` の後にあり、中身が `</style` を含まない。`type="module"` の `script` が `registerExtension` を `mount` より前に呼ぶ。`extensions` が空で `themeCss` が無いときは `<style>` と `registerExtension` を含まない'
    callees:
      - '#functions[escapeScriptJson]'
    refs:
      - IF-472-15#constraints[書き出す中身]
      - IF-472-15#constraints[設定と相対パス]
      - IF-472-16#constraints[印刷する時]
      - MOD-472-104#data_models[PreviewConfig]
    status: planned
  - name: moduleDataUrl
    title: 'モジュールの data: の URL にする'
    kind: 関数
    container: vscode/src/export/html.ts
    usecase: HTMLに書き出す
    summary: ES モジュールのコードを `encodeURIComponent` して `data:text/javascript;charset=utf-8,` の後ろに配置した URL を返却する
    scope: public
    args:
      - name: code
        type: string
        required: true
        description: ES モジュールのコード
    returns:
      type: string
      description: '`data:text/javascript;charset=utf-8,` で始まる URL'
    unit_tests:
      - name: test_module_data_url
        case: 正常
        summary: 復号すると元のコードに戻る
        condition: '`export default "a b#%あ";`'
        mock: なし
        expected: '`data:text/javascript;charset=utf-8,` で始まり、後ろを `decodeURIComponent` すると元のコード'
    refs:
      - IF-472-15#constraints[埋めるライブラリ]
    status: planned
