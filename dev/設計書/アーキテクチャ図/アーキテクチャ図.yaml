title: "アーキテクチャ図"
overview:
  direction: LR
  nodes:
    - id: dev
      label: 開発者
      kind: actor
    - id: lib
      label: ライブラリ本体
      kind: system
    - id: repo
      label: GitHub のリポジトリ
      kind: external
    - id: cdn
      label: jsDelivr
      kind: external
    - id: page
      label: 使う側のページ
      kind: actor
    - id: plugin
      label: Claude Code プラグイン
      kind: system
    - id: cc
      label: Claude Code
      kind: external
    - id: writer
      label: 文書を書く人
      kind: actor
  edges:
    - from: dev
      to: lib
      label: ビルド
    - from: lib
      to: repo
      label: タグ
    - from: repo
      to: cdn
      label: 配布物
    - from: cdn
      to: page
      label: HTTPS
    - from: repo
      to: cc
      label: マーケットプレイス
    - from: writer
      to: cc
      label: 依頼
    - from: cc
      to: plugin
      label: フック・MCP（標準入出力）
    - from: plugin
      to: lib
      label: 同じ処理を束ねる
  subgraphs:
    - id: mdmark
      label: mdmark
      nodes:
        - lib
        - plugin
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/mdmark
  layout: |-
    | 場所 | 役割 | 使う側への届き方 | 作る Issue |
    | --- | --- | --- | --- |
    | `src/` | TypeScript と CSS の本体 | ビルドして `dist/` | この土台 |
    | `dist/` | 配布物の JavaScript と CSS、CLI の `cli.js`（release と hotfix でだけ commit する） | jsDelivr から版のタグを固定した URL で読む。CLI は `npx github:shuhei1101/mdmark#v{版}` で入れる | この土台・#9 |
    | `scripts/` | 開発のスクリプト（ビルド） | 届けない | この土台 |
    | `tests/` | 単体・結合・E2E のテスト | 届けない | この土台 |
    | `templates/` | 使う側へ置く雛形（設定・`theme.css`・索引・拡張の雛形。差分のアダプターのサンプルは #7） | CLI の `init` が置く | #9 |
    | `schemas/` | 設定・索引・部品の JSON Schema | CDN と CLI | #3・#5・#6 |
    | `migrations/` | 版ごとの移行の手順とスクリプト（`v{版}/`）、出していない版の手順（`next/`）、移行の手順が要らないスキーマの変更の一覧（`no-steps.yaml`） | CLI の `upgrade` が `v{版}/` を読む（`next/` と `no-steps.yaml` は配布物のビルドだけが読む） | #10 |
    | `guide/` | 使い方集の索引（`index.yaml`。本文は `docs/` のページを指す） | 配布物のビルドが `plugin/guide/` に写し、フックと MCP が読む | #11 |
    | `.claude-plugin/` | マーケットプレイスの定義（`marketplace.json`。`plugin/` を載せる） | `/plugin marketplace add shuhei1101/mdmark` | #11 |
    | `plugin/` | Claude Code のプラグインの定義（`plugin.json`・`.mcp.json`・`hooks/hooks.json`・`package.json`）と、配布物のビルドが書く束ねた MCP サーバー・フック・配布物の写し・使い方集（`dist/` と同じく release と hotfix でだけ commit する） | プラグインのマーケットプレイスから Claude Code が入れる | #11 |

    この土台で実体を作るのは `src/`・`dist/`・`scripts/`・`tests/` だけで、他は中身を持つ Issue が作る。
subsystems:
  - name: ライブラリ本体
    scope: lib
    role: Markdown の表示に使う JavaScript と CSS をビルドして配り、同じ版の CLI で文書を 1 枚の HTML に書き出す
    runtime: TypeScript 7
    runs_on: 使う側のページを開いたブラウザ（`mount`・`render`）と、使う側の Node の処理（`render`）と、文書を書く人の手元の Node 24（CLI の `dist/cli.js`。`npx github:shuhei1101/mdmark#v{版}` で入れ、実行時の依存の yaml と esbuild を `dependencies` から読む）
    status: planned
  - name: Claude Code プラグイン
    scope: claude-code-plugin
    role: Claude Code に使い方集の索引を渡し、使い方集の本文・書き出し・まとめ・点検・索引の検索と書き換えを MCP のツールで呼ばせる。ツールの処理はライブラリ本体の CLI と同じソースを束ねる
    runtime: TypeScript 7（Node 24）
    runs_on: 文書を書く人の手元の Claude Code が、プラグインのキャッシュの `plugin/` から `node` で起動するフックと標準入出力の MCP サーバー（実行時の依存の esbuild は `plugin/package.json` から Claude Code が入れる）
    reason: Claude Code の版と仕様に依る部分を、ブラウザと Node で動くライブラリ本体と分けて確かめる
    status: planned
    introduced:
      pr: 72
lead: mdmark の配布物が、開発者のビルドから使う側のページへ届くまでの全体構成。
external_systems:
  - name: jsDelivr
    purpose: GitHub のリポジトリの版のタグが指す配布物を、使う側のページへ配る
    direction: 受信のみ
    protocol: HTTPS
    detail: dev/設計書/外部API/jsDelivr#
    cost: 無料。1 ファイル 20MB まで
    status: planned
    notes:
      事前確認: 否。ライブラリ本体は実行時に jsDelivr を呼ばない。
  - name: 外部ライブラリのモジュール
    purpose: 文書に印があるときだけ、対応表（既定と設定の `libraries`）の URL から ES モジュールを読み、印の場所に描かせる
    direction: 受信のみ
    protocol: ブラウザの動的 `import()`（HTTPS。URL はページの `document.baseURI` を基準に解決する）
    cost: 無料。印の無い文書では要求が 0 件
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[外部ライブラリの読み込み]
    notes:
      事前確認: 否。この Issue の既定の対応表は空で、読む先は使う側が設定で渡す。結合テストは手元の開発サーバーが配る代役のモジュールで確かめる。既定の対応表に外部の配信元を載せる Issue（#6）が、その配信元の事前確認を決める
  - name: Claude Code
    purpose: マーケットプレイスからプラグインを入れ、セッションの開始でフックを流して使い方集の索引を受け取り、MCP サーバーを起動してツールを呼ぶ
    direction: 双方向
    protocol: 子プロセスの標準入出力（フックは JSON、MCP は JSON-RPC）
    detail: dev/設計書/外部ライブラリ/ClaudeCode#
    cost: mdmark の側には無い（Claude Code の利用料は使う側が持つ）。`update_index`・`export_html`・`build_site` は使う側の作業のフォルダに書く
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/使い方集の索引を渡す.ts#
    status: planned
    introduced:
      pr: 72
