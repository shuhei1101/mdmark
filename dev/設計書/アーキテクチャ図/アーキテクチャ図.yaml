title: "アーキテクチャ図"
overview:
  direction: LR
  nodes:
    - id: dev
      label: 開発者
      kind: actor
    - id: lib
      label: ライブラリ本体
      kind: system
    - id: repo
      label: GitHub のリポジトリ
      kind: external
    - id: cdn
      label: jsDelivr
      kind: external
    - id: page
      label: 使う側のページ
      kind: actor
    - id: vsc
      label: VS Code 拡張機能
      kind: system
    - id: gha
      label: GitHub Actions と Releases
      kind: external
    - id: plugin
      label: Claude Code プラグイン
      kind: system
    - id: cc
      label: Claude Code
      kind: external
    - id: writer
      label: 文書を書く人
      kind: actor
  edges:
    - from: dev
      to: lib
      label: ビルド
    - from: lib
      to: repo
      label: タグ
    - from: repo
      to: cdn
      label: 配布物
    - from: cdn
      to: page
      label: HTTPS
    - from: repo
      to: vsc
      label: タグ一覧
    - from: cdn
      to: vsc
      label: HTTPS（Webview）
    - from: vsc
      to: writer
      label: プレビュー・HTML
    - from: repo
      to: gha
      label: vscode-v* のタグ
    - from: gha
      to: writer
      label: .vsix
    - from: repo
      to: cc
      label: マーケットプレイス
    - from: writer
      to: cc
      label: 依頼
    - from: cc
      to: plugin
      label: フック（標準入出力）
    - from: cc
      to: lib
      label: MCP（HTTP。mdmark serve）
  subgraphs:
    - id: mdmark
      label: mdmark
      nodes:
        - lib
        - plugin
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/mdmark
  layout: |-
    | 場所 | 役割 | 使う側への届き方 | 作る Issue |
    | --- | --- | --- | --- |
    | `src/` | TypeScript と CSS の本体 | ビルドして `dist/` | この土台 |
    | `dist/` | 配布物の JavaScript と CSS、CLI の `cli.js`（release と hotfix でだけ commit する） | jsDelivr から版のタグを固定した URL で読む。CLI は `npx github:shuhei1101/mdmark#v{版}` で入れる | この土台・#9 |
    | `scripts/` | 開発のスクリプト（ビルド） | 届けない | この土台 |
    | `tests/` | 単体・結合・E2E のテスト | 届けない | この土台 |
    | `templates/` | 使う側へ置く雛形（設定・`theme.css`・索引・拡張の雛形。差分のアダプターのサンプルは #7） | CLI の `init` が置く | #9 |
    | `schemas/` | 設定・索引・部品の JSON Schema | CDN と CLI | #3・#5・#6 |
    | `migrations/` | 版ごとの移行の手順とスクリプト（`v{版}/`）、出していない版の手順（`next/`）、移行の手順が要らないスキーマの変更の一覧（`no-steps.yaml`） | CLI の `upgrade` が `v{版}/` を読む（`next/` と `no-steps.yaml` は配布物のビルドだけが読む） | #10 |
    | `guide/` | 使い方集の索引（`index.yaml`。本文は `docs/` のページを指す） | 配布物のビルドが `plugin/guide/` に写し、フックと MCP が読む | #11 |
    | `.claude-plugin/` | マーケットプレイスの定義（`marketplace.json`。`plugin/` を載せる） | `/plugin marketplace add shuhei1101/mdmark` | #11 |
    | `plugin/` | Claude Code のプラグインの定義（`plugin.json`・`.mcp.json`・`hooks/hooks.json`）と、配布物のビルドが書く束ねたフック・使い方集（`dist/` と同じく release と hotfix でだけ commit する） | プラグインのマーケットプレイスから Claude Code が入れる | #11 |
    | `vscode/` | VS Code 拡張機能（独自の `package.json`。版は `vscode-v{版}` のタグ） | GitHub Release に添えた .vsix と、Marketplace・Open VSX（拡張機能の ID `ShuheiNishikawa.mdmark-vscode`・表示名 `mdmark for VS Code`） | #22 |
    | `.github/workflows/` | `vscode-v*` のタグで .vsix を作って Release に添えるワークフロー | 届けない | #22 |
    | `dev-docs.yaml` | dev-docs の配信元の設定（設計書の種類ごとの行と、各フォルダの `files.yaml` の行） | 届けない | #178 |
    | 各フォルダの `files.yaml` | YAML の設計書でないファイルの概要文・タグ・関連（1 ファイル 1 行。スキーマは `dev/テンプレート/files.schema.yaml`） | 届けない | #178 |

    この土台で実体を作るのは `src/`・`dist/`・`scripts/`・`tests/` だけで、他は中身を持つ Issue が作る。
subsystems:
  - name: ライブラリ本体
    scope: lib
    role: Markdown の表示に使う JavaScript と CSS をビルドして配り、同じ版の CLI で文書を 1 枚の HTML に書き出す
    runtime: TypeScript 7
    runs_on: 使う側のページを開いたブラウザ（`mount`・`render`）と、使う側の Node の処理（`render`）と、文書を書く人の手元の Node 24（CLI の `dist/cli.js`。`npx github:shuhei1101/mdmark#v{版}` で入れ、実行時の依存の yaml と esbuild を `dependencies` から読む。`mdmark serve` は 127.0.0.1 で Claude Code プラグインの MCP サーバーとして常駐する）
    status: planned
  - name: VS Code 拡張機能
    scope: vscode
    role: VS Code で開いている Markdown を、jsDelivr から読んだ配布物の `mount` で Webview に描き、HTML に書き出す。mdmark の配布物は同梱しない
    runtime: TypeScript 7
    runs_on: 文書を書く人の VS Code（拡張機能のホストと Webview）。`vscode/` に独自の `package.json` を置き、.vsix で配る
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#
    status: planned
    introduced:
      pr: 69
  - name: Claude Code プラグイン
    scope: claude-code-plugin
    role: Claude Code に使い方集の索引を渡し、使い方集の本文・書き出し・まとめ・点検を MCP のツールで呼ばせる。MCP のツールは、ライブラリ本体の CLI の `mdmark serve` が常駐の HTTP サーバーとして返す
    runtime: TypeScript 7（Node 24）
    runs_on: 文書を書く人の手元の Claude Code が、プラグインのキャッシュの `plugin/` から `node` で起動するフックと、`.mcp.json` の URL へ HTTP でつなぐ `mdmark serve` の MCP サーバー（文書を書く人が `npx github:shuhei1101/mdmark#v{バージョン} serve` で起動しておく）
    reason: Claude Code の版と仕様に依る部分を、ブラウザと Node で動くライブラリ本体と分けて確かめる
    status: planned
    introduced:
      pr: 72
lead: mdmark の配布物が、開発者のビルドから使う側のページへ届くまでの全体構成。
external_systems:
  - name: jsDelivr
    purpose: GitHub のリポジトリの版のタグが指す配布物を、使う側のページへ配る
    direction: 受信のみ
    protocol: HTTPS
    detail: dev/設計書/外部API/jsDelivr#
    cost: 無料。1 ファイル 20MB まで
    status: planned
    notes:
      事前確認: 否。ライブラリ本体は実行時に jsDelivr を呼ばない。
  - name: 外部ライブラリのモジュール
    purpose: 文書に印があるときだけ、対応表（既定と設定の `libraries`）の URL から ES モジュールを読み、印の場所に描かせる
    direction: 受信のみ
    protocol: ブラウザの動的 `import()`（HTTPS。URL はページの `document.baseURI` を基準に解決する）
    cost: 無料。印の無い文書では要求が 0 件
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[外部ライブラリの読み込み]
    notes:
      事前確認: 否。この Issue の既定の対応表は空で、読む先は使う側が設定で渡す。結合テストは手元の開発サーバーが配る代役のモジュールで確かめる。既定の対応表に外部の配信元を載せる Issue（#6）が、その配信元の事前確認を決める
  - name: GitHub のタグ一覧
    purpose: 'VS Code 拡張機能が `mdmark.version: latest` のときに、読む mdmark の版を選ぶ'
    direction: 受信のみ
    protocol: HTTPS（REST、認証なし）
    detail: dev/設計書/外部API/GitHub#
    cost: 無料。60 回/時（送信元の IP ごと）。プレビューを開く・リロードする・書き出すときだけ 1 回呼ぶ
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[バージョンの決め方]
    status: planned
    introduced:
      pr: 69
  - name: GitHub Actions と GitHub Releases
    purpose: '`vscode-v*` のタグで拡張機能の .vsix を作り、そのタグの Release に添える'
    direction: 送信のみ
    protocol: GitHub Actions のワークフロー（`.github/workflows/vscode-release.yml`）と `gh release`
    detail: dev/設計書/外部ライブラリ/vsce#
    cost: 公開リポジトリの GitHub Actions は無料。Release に .vsix を残す
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/拡張機能の配布物を作る.ts#
    status: planned
    introduced:
      pr: 69
  - name: VS Code
    purpose: 拡張機能を動かし、コマンド・設定・エディタ・Webview の API を渡す
    direction: 双方向
    protocol: VS Code の拡張機能の API（`vscode`）と Webview の `postMessage`
    detail: dev/設計書/外部ライブラリ/vscode#
    cost: 無料
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[対応する VS Code の版]
    status: planned
    introduced:
      pr: 69
  - name: Claude Code
    purpose: マーケットプレイスからプラグインを入れ、セッションの開始でフックを流して使い方集の索引を受け取り、常駐の MCP サーバーへ HTTP でつないでツールを呼ぶ
    direction: 双方向
    protocol: フックは子プロセスの標準入出力（JSON）、MCP は 127.0.0.1 への Streamable HTTP（JSON-RPC）
    detail: dev/設計書/外部ライブラリ/ClaudeCode#
    cost: mdmark の側には無い（Claude Code の利用料は使う側が持つ）。`export_html`・`build_site` は使う側の作業のフォルダに書く
    refs:
      - dev/設計書/インターフェース定義/ClaudeCodeプラグイン/使い方集の索引を渡す.ts#
    status: planned
    introduced:
      pr: 72
