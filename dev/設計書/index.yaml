summary: mdmark の設計ドキュメントと、外部 API・外部ライブラリ・テストの参照資料
items:
  - page: シナリオ/
    summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
  - page: インターフェース定義/
    summary: サブシステムの外部インターフェースと処理フロー（結合テストの元）
  - page: モジュール構成/
    summary: クラス / 関数 / 定数をドメイン分類でまとめる（単体テストの元）
  - page: アーキテクチャ図/
    summary: システム全体構成（ライブラリ本体と配布の経路）
  - page: 非機能要件/
    summary: 外部の制約から逆算したアプリ側の決定値（非機能要件テストの元）
  - page: テスト/
    summary: プロジェクト固有のテスト起動コマンドと前提条件
  - page: 開発コマンド/
    summary: 開発で使うコマンドの分類ごとの前提・順序・コマンド・料金や副作用・確かめた記録
  - page: 外部API/
    summary: 採用済みの外部 API のリファレンス
  - page: 外部ライブラリ/
    summary: 採用済みの外部ライブラリ / 外部ツールのリファレンス
  - page: デザイン方針.md
    summary: mdmark が描く文書の既定の見た目に通すデザインの方向性
  - page: 部品設計/
    summary: 文書の中に mdmark が置く UI の部品の引数・状態（Storybook のストーリーの元）
  - page: 画面設計/
    summary: mdmark が描く画面の要素と、使う部品へ渡す値
