title: "ビューで探してコメントを付ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本のビューの文書
        description: 'ビューの印で囲んだ項目の表 1 つ（列: 題・状態・担当。行 5 件、状態は 3 種）と、本文の段落 1 つを持つ文書'
      - name: コメントの読み書きの関数
        description: 渡されたコメントを配列に溜め、読み込みでその配列を返す手元の関数。`mount` に渡す
      - name: 設定
        description: 機能 `comments` をオンにした設定。`mount` に渡す
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      flowchart TD
        A[ビューで項目を見る:正常シナリオ] --> B[全項目を検索する:正常シナリオ]
        B --> C[選んだ箇所にコメントする:正常シナリオ]
        click A "../単一ユースケース/ビューで項目を見る.yaml#正常シナリオ"
        click B "../単一ユースケース/全項目を検索する.yaml#正常シナリオ"
        click C "../単一ユースケース/選んだ箇所にコメントする.yaml#正常シナリオ"
    expected:
      - ビューの印で囲んだ表が、状態の列の値ごとの 3 つの列に項目を並べたボード表示で描かれる
      - ビューの切り替えで表形式のビューに変わり、5 件の項目が行で並ぶ
      - 検索欄に担当の 1 人の名前を入れると、その人の項目だけが残り、合った件数が出る
      - 本文の段落の文字を選んでコメントを書くと、選んだ箇所に印が付き、コメントの読み書きの関数に選んだ文字とコメントが渡る
      - 印からコメントを開くと、書いたコメントが出る
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/ビューで項目を見る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/全項目を検索する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/選んだ箇所にコメントする#scenarios[正常シナリオ]
  - name: 正常シナリオ（書き出した HTML で探す）
    setup:
      - name: 見本のビューの文書
        description: 正常シナリオと同じ
      - name: 設定
        description: 見本のビューの文書を書き出す `mdmark.config.yaml`
      - name: Mock
        description: なし。書き出した HTML を開くブラウザのコンテキストで、外への要求を全て止める
    flow: |-
      flowchart TD
        A[文書をHTMLに書き出す:正常シナリオ] --> B[ビューで項目を見る:正常シナリオ]
        B --> C[全項目を検索する:正常シナリオ]
        click A "../単一ユースケース/文書をHTMLに書き出す.yaml#正常シナリオ"
        click B "../単一ユースケース/ビューで項目を見る.yaml#正常シナリオ"
        click C "../単一ユースケース/全項目を検索する.yaml#正常シナリオ"
    expected:
      - '`mdmark export` が終了コード 0 で 1 枚の HTML を書き出す'
      - 書き出した HTML を外への要求を止めて開いても、ボード表示のビューが描かれ、表形式に切り替えられる
      - 検索欄の文字で項目が絞られ、合った件数が出る
    test: test_normal_when_exported
    uses:
      - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ビューで項目を見る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/全項目を検索する#scenarios[正常シナリオ]
  - name: 正常シナリオ（使う側の JavaScript から描く）
    setup:
      - name: 使う側のページ
        description: 配布物を読み込み、ビューを描く関数に要素と項目の値の配列（見本のビューの文書の表と同じ 5 件）を渡すページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      flowchart TD
        A[部品をJavaScriptから使う:正常シナリオ] --> B[全項目を検索する:正常シナリオ]
        click A "../単一ユースケース/部品をJavaScriptから使う.yaml#正常シナリオ"
        click B "../単一ユースケース/全項目を検索する.yaml#正常シナリオ"
    expected:
      - 使う側のページの要素に、文書の印で描いたものと同じボード表示のビューが描かれる
      - 検索欄の文字で項目が絞られ、合った件数が出る
      - 関数が返した片付けの関数を呼ぶと、要素の中が空になる
    test: test_normal_when_called_from_javascript
    uses:
      - dev/設計書/シナリオ/単一ユースケース/部品をJavaScriptから使う#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/全項目を検索する#scenarios[正常シナリオ]
lead: 文書を書く人が項目の表をビューの印で囲み、読む人がボード表示と表形式のビューを切り替えて検索で絞り、本文の選んだ箇所にコメントを付ける。書き出した 1 枚の HTML と、使う側の JavaScript から描いたビューでも同じように探せる。
issue: 8
primary_actor: 読む人
stakeholders:
  - name: 文書を書く人
    interest: 項目の表に印を付けるだけで、ボード表示・表形式のビューと検索を文書に置け、印に対応しない表示でも表として読める
  - name: 読む人
    interest: 項目を見たい形で並べ、文字で絞って探せ、気になった箇所にその場でコメントを残せる
  - name: 使う側
    interest: 同じビューと検索を自分のページの JavaScript から描け、コメントを自分の保存先に残せる
trigger: 読む人が、文書に並んだ項目の中から目当ての項目を探し、気になった箇所に意見を残したくなる
preconditions:
  - 使う側のページが配布物を読み込み、`mount` で文書を描ける
  - 使う側が `mount` にコメントの読み書きの関数を渡している
success_guarantee: ビューの印で囲んだ表が、ボード表示と表形式のビューで描かれて切り替えられ、検索欄の文字で項目が絞られる。本文の選んだ箇所にコメントが付き、使う側の読み書きの関数へ渡る。書き出した 1 枚の HTML と、使う側の JavaScript から描いたビューでも、外を読まずにビューと検索が動く。
minimal_guarantee: 文書に書いたスクリプトは動かない。コメントを保存できないときは、書いたコメントを消さずに知らせ、文書の残りは今のとおり読める。
