id: SC-472-90
title: "ビューで探してコメントを付ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本のビューの文書
        description: '`filter=担当` を付けたビューのマーカーで囲んだ項目の表 1 つ（列: タイトル・状態・担当。行 5 件、状態は 3 種）と、本文の段落 1 つを持つ文書'
      - name: コメントの読み込みと保存の関数
        description: 指定されたコメントを配列に溜め、読み込みでその配列を返却する手元の関数。`mount` に指定する
      - name: 設定
        description: 機能 `comments` をオンにした設定。`mount` に指定する
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      flowchart TD
        A[ビューで項目を確認する:正常シナリオ] --> B[表形式のビューを列で絞り込む:正常シナリオ]
        B --> C[選んだ箇所にコメントする:正常シナリオ]
        click A "id:SC-472-29#scenarios[正常シナリオ]"
        click B "id:SC-472-74#scenarios[正常シナリオ]"
        click C "id:SC-472-80#scenarios[正常シナリオ]"
    expected:
      - ビューのマーカーで囲んだ表が、状態の列の値ごとの 3 つの列に項目を並べたボード表示で描かれる
      - ビューの切り替えで表形式のビューに変わり、5 件の項目が行で並ぶ
      - 表形式のビューで担当の列の絞り込みから 1 人の名前を選ぶと、その人の項目だけが残る
      - 本文の段落の文字を選んでコメントを記載すると、選んだ箇所にマーカーが付き、コメントの読み込みと保存の関数に選んだ文字とコメントが渡る
      - マーカーからコメントを開くと、記載したコメントが出る
    test: test_normal
    uses:
      - SC-472-29#scenarios[正常シナリオ]
      - SC-472-74#scenarios[正常シナリオ]
      - SC-472-80#scenarios[正常シナリオ]
  - name: 正常シナリオ（書き出した HTML で探す）
    setup:
      - name: 見本のビューの文書
        description: 正常シナリオと同じ
      - name: 設定
        description: 見本のビューの文書を書き出す `mdmark.config.yaml`
      - name: Mock
        description: なし。書き出した HTML を開くブラウザのコンテキストで、外への要求を全て止める
    flow: |-
      flowchart TD
        A[文書をHTMLに書き出す:正常シナリオ] --> B[ビューで項目を確認する:正常シナリオ]
        B --> C[表形式のビューを列で絞り込む:正常シナリオ]
        click A "id:SC-472-56#scenarios[正常シナリオ]"
        click B "id:SC-472-29#scenarios[正常シナリオ]"
        click C "id:SC-472-74#scenarios[正常シナリオ]"
    expected:
      - '`mdmark export` が終了コード 0 で 1 枚の HTML を書き出す'
      - 書き出した HTML を外への要求を止めて開いても、ボード表示のビューが描かれ、表形式に切り替えられる
      - 表形式のビューで担当の列の絞り込みから名前を選ぶと、その人の項目だけが残る
    test: test_normal_when_exported
    uses:
      - SC-472-56#scenarios[正常シナリオ]
      - SC-472-29#scenarios[正常シナリオ]
      - SC-472-74#scenarios[正常シナリオ]
  - name: 正常シナリオ（利用側の JavaScript から描く）
    setup:
      - name: 利用側のページ
        description: 配布物を読み込み、ビューを描く関数に要素・絞り込む列（担当）・項目の値の配列（見本のビューの文書の表と同じ 5 件）を指定するページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      flowchart TD
        A[部品をJavaScriptから使用する:正常シナリオ] --> B[表形式のビューを列で絞り込む:正常シナリオ]
        click A "id:SC-472-81#scenarios[正常シナリオ]"
        click B "id:SC-472-74#scenarios[正常シナリオ]"
    expected:
      - 利用側のページの要素に、文書のマーカーで描いたものと同じボード表示のビューが描かれる
      - 表形式のビューで担当の列の絞り込みから名前を選ぶと、その人の項目だけが残る
      - 関数が返却した片付けの関数を呼ぶと、要素の中が空になる
    test: test_normal_when_called_from_javascript
    uses:
      - SC-472-81#scenarios[正常シナリオ]
      - SC-472-74#scenarios[正常シナリオ]
lead: 文書の作成者が項目の表をビューのマーカーで囲み、読者がボード表示と表形式のビューを切り替え、表形式のビューを列で絞り込み、本文の選んだ箇所にコメントを付ける。書き出した 1 枚の HTML と、利用側の JavaScript から描いたビューでも同じように探せる。
issue: 8
primary_actor: 読者
stakeholders:
  - name: 文書の作成者
    interest: 項目の表にマーカーを付けるだけで、ボード表示・表形式のビューと列の絞り込みを文書に配置でき、マーカーに対応しない表示でも表として読み込める
  - name: 読者
    interest: 項目を確認したい構造で並べ、文字で絞って探せ、気になった箇所にその場でコメントを残せる
  - name: 利用側
    interest: 同じビューと列の絞り込みを自分のページの JavaScript から描け、コメントを自分の保存先に残せる
trigger: 読者が、文書に並んだ項目の中から目当ての項目を探し、気になった箇所に意見を残したくなる
preconditions:
  - 利用側のページが配布物を読み込み、`mount` で文書を描ける
  - 利用側が `mount` にコメントの読み込みと保存の関数を指定している
success_guarantee: ビューのマーカーで囲んだ表が、ボード表示と表形式のビューで描かれて切り替えられ、表形式のビューが列の絞り込みで絞られる。本文の選んだ箇所にコメントが付き、利用側の読み込みと保存の関数へ渡る。書き出した 1 枚の HTML と、利用側の JavaScript から描いたビューでも、外を読み込まずにビューと列の絞り込みが動く。
minimal_guarantee: 文書に記載したスクリプトは動かない。コメントを保存できないときは、記載したコメントを削除せずに通知し、文書の残りは今のとおり読み込める。
test_file: tests/e2e/複合ユースケース/ビューで探してコメントを付ける.spec.ts
