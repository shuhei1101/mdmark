title: "MCPサーバーを起動してプラグインからつなぐ"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 作業のフォルダ A
        description: 雛形を置いた後の設定・索引と、索引に載った文書 1 つ
      - name: 作業のフォルダ B
        description: 雛形を置いた後の設定・索引と、索引に載っていない文書 1 つ
        notes: '`check` が `orphan_doc` を 1 件返す状態'
      - name: Mock
        description: Claude Code の代わりに、プラグインの PreToolUse のフックを通した引数で常駐サーバーへ HTTP でつなぐ MCP のクライアントを、作業のフォルダごとに 1 つずつ使う。モデルは使わない
    flow: |-
      flowchart TD
        A[MCPサーバーを起動・停止する:正常シナリオ（起動する）] --> B[ClaudeCodeにプラグインを入れる:正常シナリオ]
        B --> C[ClaudeCodeから点検と書き出しを呼ぶ:正常シナリオ]
        C --> D[ClaudeCodeから点検と書き出しを呼ぶ:正常シナリオ（ずれがある）]
        click A "../単一ユースケース/MCPサーバーを起動・停止する.yaml#正常シナリオ起動する"
        click B "../単一ユースケース/ClaudeCodeにプラグインを入れる.yaml#正常シナリオ"
        click C "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオ"
        click D "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオずれがある"
    expected:
      - 既定のポート 8782 で待ち受けるプロセスが 1 つだけある
      - 作業のフォルダ A のクライアントの `check` が、空のずれの一覧を返す
      - 作業のフォルダ A のクライアントの `build_site` が、作業のフォルダ A の `build.out` に 1 枚の HTML を書き、書き出したパスと入れた文書の数 1 を返す
      - 作業のフォルダ B のクライアントの `check` が、作業のフォルダ B の文書の `orphan_doc` を 1 件返す
      - 2 つのクライアントが送った引数（フックの記録の `tool_input`）に作業のフォルダの引数が無い
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/MCPサーバーを起動・停止する#scenarios[正常シナリオ（起動する）]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeにプラグインを入れる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ（ずれがある）]
  - name: 異常シナリオ（常駐サーバーが起動していない）
    setup:
      - name: 作業のフォルダ A
        description: 正常シナリオと同じ
      - name: 止めた常駐サーバー
        description: ポート 8782 で待ち受けるプロセスが無い状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      flowchart TD
        A[ClaudeCodeにプラグインを入れる:異常シナリオ（常駐サーバーが起動していない）] --> B[MCPサーバーを起動・停止する:正常シナリオ（起動する）]
        B --> C[ClaudeCodeから点検と書き出しを呼ぶ:正常シナリオ]
        click A "../単一ユースケース/ClaudeCodeにプラグインを入れる.yaml#異常シナリオ常駐サーバーが起動していない"
        click B "../単一ユースケース/MCPサーバーを起動・停止する.yaml#正常シナリオ起動する"
        click C "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオ"
    expected:
      - 常駐サーバーを起動した後は、同じクライアントが接続し直して `check` が作業のフォルダ A の空のずれの一覧を返す
      - 続けて `build_site` が、作業のフォルダ A の `build.out` に 1 枚の HTML を書き、入れた文書の数 1 を返す
    test: test_error_when_server_not_running
    uses:
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeにプラグインを入れる#scenarios[異常シナリオ（常駐サーバーが起動していない）]
      - dev/設計書/シナリオ/単一ユースケース/MCPサーバーを起動・停止する#scenarios[正常シナリオ（起動する）]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ]
lead: 文書を書く人が mdmark の MCP の常駐サーバーを 1 つ起動し、mdmark のプラグインを入れて並行に開いた 2 つのセッションから同じプロセスのツールを呼ぶ。
issue: 111
primary_actor: 文書を書く人
stakeholders:
  - name: 文書を書く人
    interest: セッションをいくつ開いても MCP サーバーのプロセスが 1 つで済み、どのセッションでもそのセッションの作業のフォルダに対してツールが働く
  - name: Claude Code
    interest: '`.mcp.json` の接続先へ HTTP でつなぎ、作業のフォルダを引数に書かずに mdmark のツールを呼べる'
trigger: 文書を書く人が、Claude Code で mdmark のツールを使う作業を始める前
preconditions:
  - 文書を書く人の手元に Claude Code と Node 24 以降がある
  - 既定のポート 8782（`MDMARK_PORT` を書いたときはそのポート）を、ほかのプロセスが使っていない
  - 作業のフォルダが 2 つあり、それぞれに mdmark の設定（`mdmark.config.yaml`）と索引がある
success_guarantee: 常駐サーバーのプロセスが 1 つだけ待ち受け、2 つのセッションのツールの呼び出しがそれぞれの作業のフォルダに対して働く。
minimal_guarantee: 常駐サーバーが起動していないときも Claude Code のセッションは開け、MCP サーバー `plugin:mdmark:mdmark` だけが接続の失敗になる。常駐サーバーを起動してから接続し直せば、セッションを開き直さずにツールを呼べる。
test_file: tests/e2e/複合ユースケース/MCPサーバーを起動してプラグインからつなぐ.spec.ts
