title: "取り出し元を指定して文書の差分を確認する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、描く先の要素を 1 つ持つ HTML
      - name: 見本の文書の 3 つのリビジョン
        description: 1 つ目から 2 つ目で段落の単語を書き換え、行を 1 つ追加して 1 つ削除する。2 つ目から 3 つ目で `<!-- html -->` の範囲の表のセルの値を変える
        notes: リビジョンの `id` は `r1`・`r2`・`r3`、`at` は古い順に 1 日ずつ進める
      - name: Mock
        description: 取り出し元は、見本の 3 つのリビジョンをメモリーから返却するページの中の `DiffSource`。jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      ```mermaid
      flowchart TD
        A[差分の取り出し元を指定する:正常シナリオ] --> B[文書の差分を確認する:正常シナリオ（リビジョンをもう一度選ぶ）]
        B --> C[埋め込んだHTMLの差分を切り替える:正常シナリオ]
        click A "../単一ユースケース/差分の取り出し元を指定する.yaml#正常シナリオ"
        click B "../単一ユースケース/文書の差分を確認する.yaml#正常シナリオリビジョンを選び直す"
        click C "../単一ユースケース/埋め込んだHTMLの差分を切り替える.yaml#正常シナリオ"
      ```
    expected:
      - '`r1` と `r2` を比べると、削除した行が赤の背景と行頭の `-`、追加した行が緑の背景と行頭の `+` で出て、同じ行は色なしで出る'
      - 単語を書き換えた行の対で、変わった単語だけが濃い赤・濃い緑で出る
      - '`r2` と `r3` を比べると、`<!-- html -->` の範囲はソースの行と文字の色分けで出る'
      - 埋め込んだ HTML の範囲を描いた結果に切り替えると、`r2` と `r3` の表が前と後で並び、ソースの色分けに戻せる
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/差分の取り出し元を指定する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/文書の差分を確認する#scenarios[正常シナリオ（リビジョンを選び直す）]
      - dev/設計書/シナリオ/単一ユースケース/埋め込んだHTMLの差分を切り替える#scenarios[正常シナリオ]
  - name: 異常シナリオ（本文を取り出せない）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 見本の文書の 3 つのリビジョン
        description: 正常シナリオと同じ
      - name: Mock
        description: 取り出し元の `content` が `r1` のときだけ reject する。ほかは正常シナリオと同じ
    flow: |-
      ```mermaid
      flowchart TD
        A[差分の取り出し元を指定する:異常シナリオ（本文を取り出せない）]
        click A "../単一ユースケース/差分の取り出し元を指定する.yaml#異常シナリオ本文を取り出せない"
      ```
    expected:
      - '`r1` を比べる側に選ぶと、差分の場所に通知ブロックが出て、文書の本文は描かれたまま残る'
      - 比べる側を `r2` にもう一度選ぶと、通知ブロックが消えて `r2` と `r3` の差分が出る
    test: test_error_when_content_unavailable
    uses:
      - dev/設計書/シナリオ/単一ユースケース/差分の取り出し元を指定する#scenarios[異常シナリオ（本文を取り出せない）]
lead: 利用側のページが差分の取り出し元を指定して文書を描き、読者が 2 つのリビジョンを比べて、本文と埋め込んだ HTML の変更を読み込む。
issue: 7
primary_actor: 読者
stakeholders:
  - name: 読者
    interest: 文書のどこが変わったかを行と文字で見分けられ、埋め込んだ HTML の変化は描いた結果でも確認できる
  - name: 利用側のアプリの開発者
    interest: Git や YAML など自分の取り出し元を指定するだけで、差分の計算と描画を自前で持たない
trigger: 読者が、文書がどこで変わったかを確認したくなる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 取り出し元が、文書のリビジョンを 2 つ以上返せる
success_guarantee: 比べた 2 つのリビジョンの差分が、削除した行は赤、追加した行は緑、行の中で変わった文字は濃い色で、行頭の `-`・`+` のマーカーつきで出る。埋め込んだ HTML の差分は、描いた結果の前と後に切り替えて見られる。
minimal_guarantee: 取り出し元がリビジョンの一覧か本文を返却できないときは、差分の場所に通知ブロックを出し、文書は描く。
test_file: tests/e2e/複合ユースケース/取り出し元を指定して文書の差分を確認する.spec.ts
