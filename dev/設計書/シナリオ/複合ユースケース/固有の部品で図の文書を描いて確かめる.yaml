title: "固有の部品で図の文書を描いて確かめる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空のフォルダ
        description: 使う側の場所。何も置いていない
      - name: 固有の部品
        description: 雛形を置いた後に使う側が `// @ts-check` と JSDoc で書き足す JavaScript の部品 1 つと、その部品の見た目を変える固有の CSS
      - name: 見本の図の文書
        description: フロー図の部品の定義（システムの枠・3 層・外部のシステム・交差する矢印・ループの戻り・題と凡例・用語集の用語を含む箱）と、固有の部品の定義を書いた文書 1 つ。索引に用語を載せる
      - name: Mock
        description: 差し替えない。外部ライブラリを使わない部品だけで組む
    flow: |-
      flowchart TD
        A[雛形を置く:正常シナリオ（JavaScript の雛形を置く）] --> B[足すJavaScriptを型で点検する:正常シナリオ]
        B --> C[固有の部品とCSSを当てる:正常シナリオ]
        C --> D[図を描く:正常シナリオ]
        D --> E[図の要素のツールチップを見る:正常シナリオ]
        E --> F[図を拡大・縮小・移動する:正常シナリオ]
        click A "../単一ユースケース/雛形を置く.yaml#正常シナリオjavascript-の雛形を置く"
        click B "../単一ユースケース/足すJavaScriptを型で点検する.yaml#正常シナリオ"
        click C "../単一ユースケース/固有の部品とCSSを当てる.yaml#正常シナリオ"
        click D "../単一ユースケース/図を描く.yaml#正常シナリオ"
        click E "../単一ユースケース/図の要素のツールチップを見る.yaml#正常シナリオ"
        click F "../単一ユースケース/図を拡大・縮小・移動する.yaml#正常シナリオ"
    expected:
      - '`mdmark init` が JavaScript の雛形と、JavaScript も点検する tsconfig を置く'
      - 固有の部品を書き足した後の `tsc --noEmit` が誤り 0 件で終了コード 0 を返す
      - 見本の図の文書を描くと、フロー図が枠・3 層・題と凡例つきで描かれ、残った交差は line jump になる
      - 固有の部品が、固有の CSS の見た目で描かれる
      - 矢印・箱・箱の中の用語にフォーカスすると、それぞれのツールチップが出て、Esc で消える
      - 図は全体が収まる倍率で開き、右上のボタンとキーの `+`・`-`・`0` で拡大・縮小でき、ドラッグと矢印キーで動かせる
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/雛形を置く#scenarios[正常シナリオ（JavaScript の雛形を置く）]
      - dev/設計書/シナリオ/単一ユースケース/足すJavaScriptを型で点検する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/固有の部品とCSSを当てる#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図を描く#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図の要素のツールチップを見る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図を拡大・縮小・移動する#scenarios[正常シナリオ]
  - name: 正常シナリオ（操作できる部品を置く）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: 見本の操作の文書
        description: スライダーとグラフと今の値を写すボタンを組み合わせた部品の定義を書いた文書 1 つ
      - name: Mock
        description: クリップボードの書き込みを許したブラウザのコンテキストで開く
    flow: |-
      flowchart TD
        A[雛形を置く:正常シナリオ] --> B[図を描く:正常シナリオ（グラフ）]
        B --> C[操作できる部品で値を変えて写す:正常シナリオ]
        click A "../単一ユースケース/雛形を置く.yaml#正常シナリオ"
        click B "../単一ユースケース/図を描く.yaml#正常シナリオグラフ"
        click C "../単一ユースケース/操作できる部品で値を変えて写す.yaml#正常シナリオ"
    expected:
      - 見本の操作の文書を描くと、スライダー・グラフ・今の値を写すボタンが描かれる
      - スライダーを動かすとグラフが新しい値で描き直される
      - 今の値を写すボタンを押すと、スライダーの今の値を JSON にした文字列がクリップボードに入る
    test: test_normal_when_interactive
    uses:
      - dev/設計書/シナリオ/単一ユースケース/雛形を置く#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図を描く#scenarios[正常シナリオ（グラフ）]
      - dev/設計書/シナリオ/単一ユースケース/操作できる部品で値を変えて写す#scenarios[正常シナリオ]
  - name: 異常シナリオ（足した JavaScript の型が合わない）
    setup:
      - name: 空のフォルダ
        description: 正常シナリオと同じ
      - name: 型を誤った固有の部品
        description: 正常シナリオの固有の部品のうち、配布物の型定義に合わない値を返す 1 行を持つもの
      - name: 直した固有の部品
        description: 1 回目の点検の後に、使う側がその 1 行を手で直したもの
      - name: Mock
        description: 差し替えない
    flow: |-
      flowchart TD
        A[雛形を置く:正常シナリオ（JavaScript の雛形を置く）] --> B[足すJavaScriptを型で点検する:異常シナリオ（型が合わない）]
        B --> C[足すJavaScriptを型で点検する:正常シナリオ]
        C --> D[固有の部品とCSSを当てる:正常シナリオ]
        click A "../単一ユースケース/雛形を置く.yaml#正常シナリオjavascript-の雛形を置く"
        click B "../単一ユースケース/足すJavaScriptを型で点検する.yaml#異常シナリオ型が合わない"
        click C "../単一ユースケース/足すJavaScriptを型で点検する.yaml#正常シナリオ"
        click D "../単一ユースケース/固有の部品とCSSを当てる.yaml#正常シナリオ"
    expected:
      - 1 回目の `tsc --noEmit` が誤りのファイルと行を出し、終了コード 0 以外を返す
      - 直した後の 2 回目の `tsc --noEmit` が誤り 0 件で終了コード 0 を返す
      - その後に描いた文書に、固有の部品が描かれる
    test: test_error_when_type_mismatch
    uses:
      - dev/設計書/シナリオ/単一ユースケース/雛形を置く#scenarios[正常シナリオ（JavaScript の雛形を置く）]
      - dev/設計書/シナリオ/単一ユースケース/足すJavaScriptを型で点検する#scenarios[異常シナリオ（型が合わない）]
      - dev/設計書/シナリオ/単一ユースケース/足すJavaScriptを型で点検する#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/固有の部品とCSSを当てる#scenarios[正常シナリオ]
lead: 使う側（ワークスペースの持ち主と、その場所で HTML を作る AI）が、雛形に固有の部品と CSS を足して型で点検し、共通の図の部品と固有の部品で文書を描き、読む人の操作で確かめる。
issue: 21
primary_actor: 使う側
stakeholders:
  - name: 使う側
    interest: 図・部品を一から書かずに、共通の部品と自分の場所の部品で見た目と作法のそろった文書を作れ、足した JavaScript の誤りを使う前に見つけられる
  - name: 読む人
    interest: 図を拡大・縮小・移動して全体と細部を読め、矢印・箱・用語の詳細をツールチップで読める
trigger: 使う側が、自分の場所の文書に図と、その場所だけの部品・見た目を足したくなる
preconditions:
  - 使う側の手元に Node 24 以降がある
  - 使う側の場所に、配布物と同じタグの `dist/` の型定義を置ける
success_guarantee: 使う側の場所の文書に、共通の図の部品と固有の部品が固有の CSS で描かれ、読む人が図を拡大・縮小・移動でき、ツールチップで詳細を読める。足した JavaScript は `tsc --noEmit` を通っている。
minimal_guarantee: 型の点検で誤りが見つかったときは、誤りのファイルと行を出して終了コードを 0 以外にする。点検は使う側のファイルを書き換えない。
test_file: tests/e2e/複合ユースケース/固有の部品で図の文書を描いて確かめる.spec.ts
