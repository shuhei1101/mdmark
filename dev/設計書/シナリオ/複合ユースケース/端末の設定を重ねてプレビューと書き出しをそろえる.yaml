title: 端末の設定を重ねてプレビューと書き出しをそろえる
scenarios:
- name: 正常シナリオ
  setup:
  - name: 端末の設定
    description: '一時フォルダに置いた `settings.yaml`。重ねて読む切り替えをオンにし、`features.callout: false` を書く。`MDMARK_CONFIG` でこのファイルを指す'
  - name: 見本のワークスペース
    description: '上のフォルダの `mdmark.config.yaml` に `theme: ./theme.css` と `extensions` の固有の部品 1 つを書き、その下のフォルダの `mdmark.config.yaml` に `features.table: false` を書く。下のフォルダに、注意書き・表・固有の部品の印を持つ Markdown を 1 つ置く'
  - name: Mock
    description: jsDelivr の代わりに、このブランチでビルドした配布物を版付きの形の URL で配る手元のサーバー。GitHub のタグ一覧は、その版を最新の `vX.Y.Z` として返す代役
  flow: |-
    flowchart TD
      A[VSCodeでプレビューを開く:正常シナリオ（設定を重ねる）] --> B[書いた内容をプレビューに映す:正常シナリオ（theme の CSS を書き換える）]
      B --> C[文書をHTMLに書き出す:正常シナリオ（設定を重ねる）]
      C --> D[ClaudeCodeから点検と書き出しを呼ぶ:正常シナリオ（設定を重ねる）]
      click A "../単一ユースケース/VSCodeでプレビューを開く.yaml#正常シナリオ設定を重ねる"
      click B "../単一ユースケース/書いた内容をプレビューに映す.yaml#正常シナリオtheme-の-css-を書き換える"
      click C "../単一ユースケース/文書をHTMLに書き出す.yaml#正常シナリオ設定を重ねる"
      click D "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオ設定を重ねる"
  expected:
  - プレビューで、注意書きと表の機能がオフで描かれ、固有の部品が描かれ、`theme.css` の規則が当たる
  - '`theme.css` を書き換えて保存すると、エディタの Markdown を書き換えずに、プレビューに書き換えた規則が当たる'
  - 下のフォルダで `mdmark export` を流すと終了コード 0 で 1 枚の HTML を書き、開くとプレビューと同じ要素に同じ計算後のスタイルが当たる
  - Claude Code から `export_html` を呼んで書き出した HTML も、`mdmark export` と同じ設定で描かれる
  - 端末の設定と 2 つの `mdmark.config.yaml` は書き換わらない
  test: test_normal
  uses:
  - dev/設計書/シナリオ/単一ユースケース/VSCodeでプレビューを開く#scenarios[正常シナリオ（設定を重ねる）]
  - dev/設計書/シナリオ/単一ユースケース/書いた内容をプレビューに映す#scenarios[正常シナリオ（theme の CSS を書き換える）]
  - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ（設定を重ねる）]
  - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ（設定を重ねる）]
- name: 正常シナリオ（最初の 1 つだけを読む）
  setup:
  - name: 端末の設定
    description: 正常シナリオの端末の設定のうち、重ねて読む切り替えをオフにしたもの
  - name: 見本のワークスペース
    description: 正常シナリオと同じ
  - name: Mock
    description: 正常シナリオと同じ
  flow: |-
    flowchart TD
      A[VSCodeでプレビューを開く:正常シナリオ（設定を重ねる）] --> B[文書をHTMLに書き出す:正常シナリオ（設定を重ねる）]
      click A "../単一ユースケース/VSCodeでプレビューを開く.yaml#正常シナリオ設定を重ねる"
      click B "../単一ユースケース/文書をHTMLに書き出す.yaml#正常シナリオ設定を重ねる"
  expected:
  - プレビューと書き出した HTML の両方で、注意書きと表の機能がオフで描かれる（端末の設定と下のフォルダの設定だけが効く）
  - 上のフォルダの設定の `theme.css` の規則と固有の部品は、両方とも当たらない
  test: test_normal_when_first_only
  uses:
  - dev/設計書/シナリオ/単一ユースケース/VSCodeでプレビューを開く#scenarios[正常シナリオ（設定を重ねる）]
  - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ（設定を重ねる）]
- name: 異常シナリオ（端末の設定を読めない）
  setup:
  - name: 端末の設定
    description: 正常シナリオの端末の設定のうち、YAML として読めない行を 1 つ持つもの
  - name: 直した端末の設定
    description: 1 回目の書き出しの後に、文書を書く人がその行を手で直したもの
  - name: 見本のワークスペース
    description: 正常シナリオと同じ
  - name: Mock
    description: 正常シナリオと同じ
  flow: |-
    flowchart TD
      A[VSCodeでプレビューを開く:異常シナリオ（設定ファイルを読めない）] --> B[文書をHTMLに書き出す:異常シナリオ（設定ファイルを読めない）]
      B --> C[文書をHTMLに書き出す:正常シナリオ（設定を重ねる）]
      click A "../単一ユースケース/VSCodeでプレビューを開く.yaml#異常シナリオ設定ファイルを読めない"
      click B "../単一ユースケース/文書をHTMLに書き出す.yaml#異常シナリオ設定ファイルを読めない"
      click C "../単一ユースケース/文書をHTMLに書き出す.yaml#正常シナリオ設定を重ねる"
  expected:
  - プレビューの先頭に、端末の設定を読めないことを示す帯が出る
  - '`mdmark export` が端末の設定のパスと読めない行と直し方を標準エラーに出し、終了コード 1 で HTML を書かない'
  - 直した後の `mdmark export` は終了コード 0 で 1 枚の HTML を書く
  - 端末の設定と 2 つの `mdmark.config.yaml` は書き換わらない
  test: test_error_when_settings_unreadable
  uses:
  - dev/設計書/シナリオ/単一ユースケース/VSCodeでプレビューを開く#scenarios[異常シナリオ（設定ファイルを読めない）]
  - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[異常シナリオ（設定ファイルを読めない）]
  - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ（設定を重ねる）]
lead: 文書を書く人が、端末の設定と、文書のフォルダから上のフォルダの `mdmark.config.yaml` を重ねた設定で、VS Code のプレビュー・CLI の書き出し・Claude Code から呼んだ書き出しを同じ見た目にそろえる。
issue: 163
primary_actor: 文書を書く人
stakeholders:
- name: 文書を書く人
  interest: 端末ごとの設定とリポジトリの設定を書き分け、どの道具から描いても書き出しても同じ設定と見た目になる
- name: 読む人
  interest: 受け取った HTML が、書く人がプレビューで確かめた見た目のまま描かれる
trigger: 文書を書く人が、端末に共通の設定と、リポジトリやフォルダごとの設定を分けて書きたくなる
preconditions:
- VS Code に mdmark の拡張機能を入れている
- 文書を書く人の手元に Node 24 以降がある
- Claude Code に mdmark のプラグインを入れ、MCP の常駐サーバーを起動している
success_guarantee: 端末の設定・上のフォルダの設定・近いフォルダの設定を重ねた設定が、プレビュー・`mdmark export`・`export_html` の全てで同じに効き、`theme` の CSS と `extensions` の部品がプレビューにも書き出した HTML にも当たる。
minimal_guarantee: 重ねる設定ファイルのどれかを読めないときは、読めないファイルと直し方を出し、設定ファイルと文書を書き換えない。
test_file: tests/e2e/複合ユースケース/端末の設定を重ねてプレビューと書き出しをそろえる.spec.ts
