title: "取り出し元を渡して文書の差分を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、描く先の要素を 1 つ持つ HTML
      - name: 見本の文書の 3 つのリビジョン
        description: 1 つ目から 2 つ目で段落の語を書き換え、行を 1 つ足して 1 つ消す。2 つ目から 3 つ目で `<!-- html -->` の範囲の表のセルの値を変える
        notes: リビジョンの `id` は `r1`・`r2`・`r3`、`at` は古い順に 1 日ずつ進める
      - name: Mock
        description: 取り出し元は、見本の 3 つのリビジョンをメモリーから返すページの中の `DiffSource`。jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      ```mermaid
      flowchart TD
        A[差分の取り出し元を渡す:正常シナリオ] --> B[文書の差分を見る:正常シナリオ]
        B --> C[埋め込んだHTMLの差分を切り替える:正常シナリオ]
        click A "../単一ユースケース/差分の取り出し元を渡す.yaml#正常シナリオ"
        click B "../単一ユースケース/文書の差分を見る.yaml#正常シナリオ"
        click C "../単一ユースケース/埋め込んだHTMLの差分を切り替える.yaml#正常シナリオ"
      ```
    expected:
      - '`r1` と `r2` を比べると、消した行が赤の背景と行頭の `-`、足した行が緑の背景と行頭の `+` で出て、同じ行は色なしで出る'
      - 語を書き換えた行の対で、変わった語だけが濃い赤・濃い緑で出る
      - '`r2` と `r3` を比べると、`<!-- html -->` の範囲はソースの行と文字の色分けで出る'
      - 埋め込んだ HTML の範囲を描いた結果に切り替えると、`r2` と `r3` の表が前と後で並び、ソースの色分けに戻せる
    test: test_normal
  - name: 異常シナリオ（本文を取り出せない）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 見本の文書の 3 つのリビジョン
        description: 正常シナリオと同じ
      - name: Mock
        description: 取り出し元の `content` が `r1` のときだけ reject する。ほかは正常シナリオと同じ
    flow: |-
      ```mermaid
      flowchart TD
        A[差分の取り出し元を渡す:異常シナリオ（本文を取り出せない）] --> B[文書の差分を見る:正常シナリオ]
        click A "../単一ユースケース/差分の取り出し元を渡す.yaml#異常シナリオ本文を取り出せない"
        click B "../単一ユースケース/文書の差分を見る.yaml#正常シナリオ"
      ```
    expected:
      - '`r1` を比べる側に選ぶと、差分の場所に知らせの枠が出て、文書の本文は描かれたまま残る'
      - 比べる側を `r2` に選び直すと、知らせの枠が消えて `r2` と `r3` の差分が出る
    test: test_error_when_content_unavailable
lead: 使う側のページが差分の取り出し元を渡して文書を描き、読む人が 2 つのリビジョンを比べて、本文と埋め込んだ HTML の変更を読む。
issue: 7
primary_actor: 読む人
stakeholders:
  - name: 読む人
    interest: 文書のどこが変わったかを行と文字で見分けられ、埋め込んだ HTML の変化は描いた結果でも確かめられる
  - name: 使う側のアプリの開発者
    interest: Git や YAML など自分の取り出し元を渡すだけで、差分の計算と描画を自前で持たない
trigger: 読む人が、文書がどこで変わったかを確かめたくなる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
  - 取り出し元が、文書のリビジョンを 2 つ以上返せる
success_guarantee: 比べた 2 つのリビジョンの差分が、消した行は赤、足した行は緑、行の中で変わった文字は濃い色で、行頭の `-`・`+` の印つきで出る。埋め込んだ HTML の差分は、描いた結果の前と後に切り替えて見られる。
minimal_guarantee: 取り出し元がリビジョンの一覧か本文を返せないときは、差分の場所に知らせの枠を出し、文書は描く。
