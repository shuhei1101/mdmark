summary: "単一ユースケースをつないだ業務の流れのシナリオ"
docs_index: true
items:
  - page: 雛形から1枚のHTMLを配る.yaml
    summary: 文書の作成者が CLI で雛形を配置し、点検して 1 枚の HTML にまとめ、読者が file:// で開いて文書を行き来する
  - page: 固有の部品で図の文書を描いて確認する.yaml
    summary: 利用側が雛形に固有の部品と CSS を追加して型で点検し、図の文書を描いて読者の操作で確認する
  - page: コードブロックのHTMLでチャートとヒントを読み取る.yaml
    summary: 文書の作成者がコードブロックの HTML にチャートとヒントを記載し、読者が描いた文書と書き出した HTML で拡大・移動とツールチップで読み込む
  - page: 取り出し元を指定して文書の差分を確認する.yaml
    summary: 利用側が差分の取り出し元を指定して文書を描き、読者が 2 つのリビジョンを比べて本文と埋め込んだ HTML の変更を読み込む
  - page: ビューで探してコメントを付ける.yaml
    summary: 文書の作成者が項目の表をビューのマーカーで囲み、読者がビューを切り替えて表形式を列で絞り込み、選んだ箇所にコメントを付ける
  - page: VSCodeで記載しながら確認してPDFにする.yaml
    summary: 文書の作成者が VS Code で記載しながら mdmark のプレビューで確認し、HTML に書き出してブラウザの印刷で PDF にする
  - page: MCPサーバーを起動してプラグインからつなぐ.yaml
    summary: 文書の作成者が MCP の常駐サーバーを起動し、プラグインを入れた 2 つのセッションから同じプロセスのツールを呼び、使用し終えたら止める
  - page: ClaudeCodeでガイドを参照して記載し点検する.yaml
    summary: 文書の作成者がプラグインを入れ、Claude Code が記載する前に dev-docs でガイドを参照し、記載した後に check で点検する
  - page: 端末の設定を重ねてプレビューと書き出しをそろえる.yaml
    summary: 文書の作成者が端末の設定と上のフォルダの設定を重ね、VS Code のプレビュー・CLI の書き出し・Claude Code から呼んだ書き出しを同じ外観にそろえる
  - page: プラグインを入れて端末と文書のフォルダをセットアップする.yaml
    summary: 文書の作成者がプラグインを入れ、global-setup で端末の設定と常駐サーバーを、setup で文書のフォルダの設定を用意して、MCP のツールで点検と書き出しを呼ぶ
  - page: CSSのテンプレートを別のリポジトリに配置して書き出す.yaml
    summary: 文書の作成者が CSS を端末の設定のフォルダのテンプレートに登録し、別のリポジトリで一覧から選んで配置し、theme に記載して書き出した HTML に適用する
  - page: Mermaidと補足で書いた図を辿って読む.yaml
    summary: 文書の作成者が Mermaid と補足で図を記載して点検し、読者が自動配置で描いた図をグループの中へ入る・開閉・ノードのページ・視点・巡回・シーケンスの再生で辿って読む
