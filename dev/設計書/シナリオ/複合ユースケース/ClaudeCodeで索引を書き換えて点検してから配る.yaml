title: "ClaudeCodeで索引を書き換えて点検してから配る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 作業のフォルダ
        description: 雛形を置いた後の設定・索引と、文書 2 つ。2 つ目の文書は索引に載っていない
      - name: Mock
        description: Claude Code の代わりに、プラグインの PreToolUse のフックを通した引数で、ビルドした `plugin/` の MCP サーバーを起動した常駐サーバーへ HTTP でつなぐ MCP のクライアントを使う。モデルは使わない
    flow: |-
      flowchart TD
        S[MCPサーバーを起動・停止する:正常シナリオ（起動する）] --> A[索引から文書を探す:正常シナリオ]
        A --> B[索引を書き換える:正常シナリオ]
        B --> C[Claude Codeから点検と書き出しを呼ぶ:正常シナリオ]
        click S "../単一ユースケース/MCPサーバーを起動・停止する.yaml#正常シナリオ起動する"
        click A "../単一ユースケース/索引から文書を探す.yaml#正常シナリオ"
        click B "../単一ユースケース/索引を書き換える.yaml#正常シナリオ"
        click C "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオ"
    expected:
      - 索引のファイルに 2 つ目の文書の行が入る
      - '`check` がずれ 0 件を返す'
      - '`build_site` が `build.out` に 1 枚の HTML を書き、書き出したパスと入れた文書の数 2 を返す'
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/索引から文書を探す#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/索引を書き換える#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ]
    notes:
      後の段で加える参照: '`MCPサーバーを起動・停止する` の `正常シナリオ（起動する）` は単一ユースケース設計で作り、そのときに `uses` へ加える'
  - name: 異常シナリオ（点検でずれが見つかる）
    setup:
      - name: ずれを持つ作業のフォルダ
        description: 正常シナリオの作業のフォルダから 1 つ目の文書を消し、索引には残したもの
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      flowchart TD
        S[MCPサーバーを起動・停止する:正常シナリオ（起動する）] --> A[Claude Codeから点検と書き出しを呼ぶ:正常シナリオ（ずれがある）]
        A --> B[索引を書き換える:正常シナリオ（消す）]
        B --> C[Claude Codeから点検と書き出しを呼ぶ:正常シナリオ]
        click S "../単一ユースケース/MCPサーバーを起動・停止する.yaml#正常シナリオ起動する"
        click A "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオずれがある"
        click B "../単一ユースケース/索引を書き換える.yaml#正常シナリオ消す"
        click C "../単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ.yaml#正常シナリオ"
    expected:
      - 1 回目の `check` が消えた文書の `missing_doc` を 1 件返す
      - 索引のファイルから消えた文書の行がなくなる
      - 2 回目の `check` がずれ 0 件を返す
      - その後の `build_site` が 1 枚の HTML を書く
    test: test_error_when_drift
    uses:
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ（ずれがある）]
      - dev/設計書/シナリオ/単一ユースケース/索引を書き換える#scenarios[正常シナリオ（消す）]
      - dev/設計書/シナリオ/単一ユースケース/ClaudeCodeから点検と書き出しを呼ぶ#scenarios[正常シナリオ]
    notes:
      後の段で加える参照: '`MCPサーバーを起動・停止する` の `正常シナリオ（起動する）` は単一ユースケース設計で作り、そのときに `uses` へ加える'
lead: 文書を書く人が Claude Code に頼み、Claude Code が mdmark のプラグインの MCP のツールで索引から文書を引いて索引を書き換え、点検のずれを 0 件にしてから 1 枚の HTML にまとめる。
issue: 11
primary_actor: 文書を書く人（Claude Code に頼む）
stakeholders:
  - name: 文書を書く人
    interest: 索引の書き方を覚えていなくても、Claude Code に頼むだけで索引と文書がずれず、点検の通った 1 枚の HTML ができる
  - name: Claude Code
    interest: CLI と同じ処理を引数の説明つきのツールで呼び、索引の YAML を手で直さずに書き換えられる
trigger: 文書を書く人が Claude Code に mdmark の文書を書いて配れる形にしてほしいと頼む
preconditions:
  - 文書を書く人の手元に Node 24 以降がある
  - ビルドした `plugin/` のフォルダ（`hooks/hooks.json`・`.mcp.json`・束ねた MCP サーバーを含む）がある
  - 既定のポート 8782 を、ほかのプロセスが使っていない
  - 作業のフォルダに mdmark の設定（`mdmark.config.yaml`）と索引がある
success_guarantee: 索引に文書が足され、点検のずれが 0 件になってから `build.out` に 1 枚の HTML が書かれる。
minimal_guarantee: 点検でずれが見つかったときは、ずれの一覧をツールの結果で返し、`build_site` を呼ぶ前に直せる。Schema に合わない索引の書き換えは書かずにエラーを返し、索引のファイルは変わらない。
refs:
  - dev/設計書/シナリオ/複合ユースケース/雛形から1枚のHTMLを配る#
test_file: tests/e2e/複合ユースケース/ClaudeCodeで索引を書き換えて点検してから配る.spec.ts
