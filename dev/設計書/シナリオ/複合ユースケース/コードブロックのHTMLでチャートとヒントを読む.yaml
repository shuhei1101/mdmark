title: "コードブロックのHTMLでチャートとヒントを読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本の HTML の文書
        description: 印を付けた `html` のコードブロック 1 つと、`<!-- flow -->` のフロー図 1 つを持つ文書。HTML の中に、データ（JSON）だけを書いた `<mdmark-chart>` 1 つ、`data-hint` を付けた箱 1 つ、索引に載せた用語を含む文、`script` 要素 1 つを置く。フロー図には `hint` を持つ箱を 1 つ置く。印の無い `html` のコードブロックも 1 つ置く
      - name: 索引
        description: 見本の HTML の文書の文に出る用語 1 つを載せる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。チャートは配布物が描くため、外部ライブラリは読まない
    flow: |-
      flowchart TD
        A[コードブロックのHTMLを描く:正常シナリオ] --> B[チャートを描く:正常シナリオ]
        B --> C[図を拡大・縮小・移動する:正常シナリオ（埋め込んだ HTML の中のチャート）]
        C --> D[図の要素のツールチップを見る:正常シナリオ（埋め込んだ HTML の data-hint）]
        D --> E[用語の意味をツールチップで見る:正常シナリオ（埋め込んだ HTML の中の用語）]
        click A "../単一ユースケース/コードブロックのHTMLを描く.yaml#正常シナリオ"
        click B "../単一ユースケース/チャートを描く.yaml#正常シナリオ"
        click C "../単一ユースケース/図を拡大・縮小・移動する.yaml#正常シナリオ埋め込んだ-html-の中のチャート"
        click D "../単一ユースケース/図の要素のツールチップを見る.yaml#正常シナリオ埋め込んだ-html-の-data-hint"
        click E "../単一ユースケース/用語の意味をツールチップで見る.yaml#正常シナリオ埋め込んだ-html-の中の用語"
    expected:
      - 印を付けたコードブロックの HTML が、コードではなくその場の HTML として描かれる
      - 印の無い `html` のコードブロックは、コードのまま出る
      - HTML に書いた `script` 要素は描いた文書に残らず、実行されない
      - チャートが描かれ、右上のボタンとキーの `+`・`-`・`0` で拡大・縮小でき、ドラッグで動かせる。ホイールは文書をスクロールする
      - チャートでない HTML の部分には拡大・縮小のボタンが出ない
      - '`data-hint` を付けた箱にフォーカスすると、その文のツールチップが出て、Esc で消える'
      - HTML の中の用語に下線が引かれ、フォーカスすると用語集の意味のツールチップが出る
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/コードブロックのHTMLを描く#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/チャートを描く#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図を拡大・縮小・移動する#scenarios[正常シナリオ（埋め込んだ HTML の中のチャート）]
      - dev/設計書/シナリオ/単一ユースケース/図の要素のツールチップを見る#scenarios[正常シナリオ（埋め込んだ HTML の data-hint）]
      - dev/設計書/シナリオ/単一ユースケース/用語の意味をツールチップで見る#scenarios[正常シナリオ（埋め込んだ HTML の中の用語）]
  - name: 正常シナリオ（書き出した HTML で読む）
    setup:
      - name: 見本の HTML の文書
        description: 正常シナリオと同じ。`script` 要素は置かない
      - name: 設定
        description: 見本の HTML の文書を書き出す `mdmark.config.yaml`
      - name: Mock
        description: なし（チャートは配布物が描くため、書き出しは外部ライブラリを読まない）。書き出した HTML を開くブラウザのコンテキストで、外への要求を全て止める
    flow: |-
      flowchart TD
        A[文書をHTMLに書き出す:正常シナリオ] --> B[図を拡大・縮小・移動する:正常シナリオ（埋め込んだ HTML の中のチャート）]
        B --> C[図の要素のツールチップを見る:正常シナリオ（埋め込んだ HTML の data-hint）]
        C --> D[図の要素のツールチップを見る:正常シナリオ（箱の hint）]
        D --> E[用語の意味をツールチップで見る:正常シナリオ（埋め込んだ HTML の中の用語）]
        click A "../単一ユースケース/文書をHTMLに書き出す.yaml#正常シナリオ"
        click B "../単一ユースケース/図を拡大・縮小・移動する.yaml#正常シナリオ埋め込んだ-html-の中のチャート"
        click C "../単一ユースケース/図の要素のツールチップを見る.yaml#正常シナリオ埋め込んだ-html-の-data-hint"
        click D "../単一ユースケース/図の要素のツールチップを見る.yaml#正常シナリオ箱の-hint"
        click E "../単一ユースケース/用語の意味をツールチップで見る.yaml#正常シナリオ埋め込んだ-html-の中の用語"
    expected:
      - '`mdmark export` が終了コード 0 で 1 枚の HTML を書き出す'
      - 書き出した HTML を外への要求を止めて開いても、埋め込んだ HTML とチャートが描かれる
      - チャートを右上のボタンで拡大・縮小でき、ドラッグで動かせる
      - '`data-hint` を付けた箱・図の箱の `hint`・HTML の中の用語に、ツールチップが出る'
    test: test_normal_when_exported
    uses:
      - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/図を拡大・縮小・移動する#scenarios[正常シナリオ（埋め込んだ HTML の中のチャート）]
      - dev/設計書/シナリオ/単一ユースケース/図の要素のツールチップを見る#scenarios[正常シナリオ（埋め込んだ HTML の data-hint）]
      - dev/設計書/シナリオ/単一ユースケース/図の要素のツールチップを見る#scenarios[正常シナリオ（箱の hint）]
      - dev/設計書/シナリオ/単一ユースケース/用語の意味をツールチップで見る#scenarios[正常シナリオ（埋め込んだ HTML の中の用語）]
lead: 文書を書く人が、印を付けたコードブロックの HTML にチャートとヒントを書いて描かせ、読む人がチャートを拡大・縮小・移動し、ヒントと用語をツールチップで読む。書き出した 1 枚の HTML でも同じように読める。
issue: 6
primary_actor: 文書を書く人（AI を含む）
stakeholders:
  - name: 文書を書く人
    interest: Markdown の文書の中に HTML で図・チャートを書け、スクリプトを書かずに mdmark の部品でチャートとヒントを動かせる
  - name: 読む人
    interest: チャートを寄って見られ、図の要素のヒントと用語の意味をツールチップで読め、書き出した HTML でも同じ読み方ができる
trigger: 文書を書く人が、Markdown では表せない図・チャートを文書の中に HTML で置きたくなる
preconditions:
  - 使う側のページが配布物を読み込み、`mount` で文書を描ける
  - 索引に用語を載せている
success_guarantee: 印を付けたコードブロックの HTML がその場に描かれ、その中のチャートは拡大・縮小・移動でき、`data-hint` を付けた要素と HTML の中の用語にツールチップが出る。書き出した 1 枚の HTML でも外を読まずに同じように動く。
minimal_guarantee: 埋め込んだ HTML に書いたスクリプトとイベントの属性は動かない。チャートを描けないときは、その場所に書き方の警告を出し、文書の残りは描く。
