id: SC-472-36
title: 名前の色で表・バッジ・本文を強調する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
      - name: 色の名前を記載した Markdown
        description: '`<!-- table: data highlight=金額 row-color=状態:完了=green,保留=yellow -->` 〜 `<!-- /table -->` で、名前・状態・金額の 3 列 3 行（状態は 完了・保留・未着手）の表を囲み、行内のコード `` `badge:red:要確認` `` と、本文の `[決め手の 1 文]{color=blue}` を持つ文書'
        notes: 引数名 `highlight=`・`row-color=` と本文の記載方法は参考（インターフェース定義で決める）
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 色の名前をテーマの色のプリセットに適用する
        M-->>P: 色を付けた表・バッジ・本文を描く
        U->>P: 金額の列の見出しで並べ替える
        P-->>U: 並べ替えた表
    expected:
      - 金額の列のセルの面の色が、テーマの強調の面の色で、金額の列の見出しのセルに下端の線がある
      - 状態が 完了 の行の面が green、保留 の行の面が yellow の面の薄い色で、色を付けた 2 行に上下の線がある。未着手 の行は色も線も無い
      - 並べ替えた後も、完了 と 保留 の行の色と線がその行に付いたまま動いている
      - バッジが文言 `要確認` の札で、文字の色が red の文字の色になっている（`red:` は出ていない）
      - 本文の `決め手の 1 文` が blue の文字の色で、角括弧と `{color=blue}` は出ていない
      - 色を付けた全ての文字と、その面の色のコントラストが 4.5:1 以上
      - 記載の警告が出ていない
    test: test_normal
  - name: 正常シナリオ（ダークの配色）
    setup:
      - name: mdmark を読み込むページ
        description: '正常シナリオと同じ。OS の配色はダーク（`prefers-color-scheme: dark`）'
      - name: 色の名前を記載した Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: ダークの色のプリセットで色を付けた表・バッジ・本文を描く
        P-->>U: 文書を表示
    expected:
      - 列・行・バッジ・本文の色が、ダークの配色の色のプリセットの値になっている
      - 色を付けた全ての文字と、その面の色のコントラストが 4.5:1 以上
    test: test_normal_when_dark
  - name: 正常シナリオ（行の位置で色を付ける）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 行の位置で色を付ける Markdown
        description: 表のマーカーの引数で 2 行目に yellow を指定し、3 行の表を囲んだ文書
        notes: 位置の記載方法はインターフェース定義で決める
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 2 行目に色を付けた表を描く
        P-->>U: 文書を表示
    expected:
      - 2 行目の面が yellow の面の薄い色で、上下の線がある
      - 1 行目と 3 行目には色も線も無い
    test: test_normal_when_row_position
  - name: 正常シナリオ（色の名前でない頭のバッジ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 色の名前でない頭のバッジを持つ Markdown
        description: 行内のコード `` `badge:v1:beta` `` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 最初の : の前が色の名前でないため、全てをラベルにする
        M-->>P: 今の外観のバッジを描く
        P-->>U: 文書を表示
    expected:
      - バッジが文言 `v1:beta` の札で、色の名前の無いバッジと同じ外観になっている
      - 記載の警告が出ていない
    test: test_normal_when_badge_prefix_not_color
  - name: 異常シナリオ（知らない色の名前）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない色の名前を記載した Markdown
        description: '`<!-- table: data row-color=状態:完了=pink -->` で囲んだ表と、本文の `[決め手の 1 文]{color=pink}` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: pink が色の名前の一覧に無い
        M-->>P: 記載の警告と、色を付けない表と本文を描く
        P-->>U: 記載の警告と文書を表示
    expected:
      - 表の上と本文の段落の上に、`pink` が使用できない色の名前であることと使用できる色の名前を記載した記載の警告がある
      - 表の行に色も線も無く、本文の `決め手の 1 文` は本文の文字の色のまま出ている
      - 本文に角括弧と `{color=pink}` は出ていない
    test: test_error_when_color_unknown
  - name: 正常シナリオ（蛍光ペンのマーカー）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 蛍光ペンのマーカーを持つ Markdown
        description: 段落に `==決め手==` と `==例外=={color=green}` を持ち、選んだ箇所へのコメントを 1 つ付けた文書
        notes: コメントは `mountComments` の読み込みと保存の関数で 1 件返す
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: == で囲んだ文字を蛍光ペンのマーカーにし、色の名前を適用する
        M-->>P: 蛍光ペンのマーカーとコメントのマーカーを描く
        P-->>U: 文書を表示
    expected:
      - '`決め手` が既定の色の蛍光ペンのマーカー、`例外` が green の蛍光ペンのマーカーで描かれ、`==` と `{color=green}` は出ていない'
      - 蛍光ペンのマーカーは `<mark>` で、コメントのマーカーの class `mdmark-comment-mark` を持たない
      - コメントのマーカーの外観と、押して吹き出しを開く操作が変わらず、蛍光ペンのマーカーを押しても吹き出しが開かない
      - 蛍光ペンのマーカーの文字と面の色のコントラストが 4.5:1 以上
    test: test_normal_when_highlighter
  - name: 異常シナリオ（蛍光ペンの知らない色の名前）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 知らない色の名前の蛍光ペンを持つ Markdown
        description: 段落に `==決め手=={color=pink}` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: pink が色の名前の一覧に無い
        M-->>P: 記載の警告と、既定の色の蛍光ペンのマーカーを描く
        P-->>U: 記載の警告と文書を表示
    expected:
      - 段落の上に、`pink` が使用できない色の名前であることと使用できる色の名前を記載した記載の警告がある
      - '`決め手` が既定の色の蛍光ペンのマーカーで描かれ、`{color=pink}` は出ていない'
    test: test_error_when_highlighter_color_unknown
lead: 文書の作成者が、表のマーカーの引数・`badge:` の後ろ・本文の文字の後ろの属性に色の名前を記載すると、mdmark がテーマの色のプリセットで表の列・行、バッジ、本文の文字に色を付け、色以外の見分けも付ける。
issue: 158
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 強調した列・行・単語を、色の見分けにくい環境でも見分けられる
trigger: 利用側のページが、色の名前を記載した表・バッジ・本文を持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 表・バッジ・本文の文字の色の機能がオン（既定）
success_guarantee: 表の列は面の薄い色と見出しの下端の線、行は面の薄い色と上下の線、バッジと本文の文字はその色の名前の文字の色で描かれる。ライト・ダーク・選べるテーマのそれぞれで、文字と面のコントラストが 4.5:1 以上になる。
minimal_guarantee: 知らない色の名前は色を付けずに記載の警告で通知し、文字は記載したとおりに描く。
test_file: tests/e2e/単一ユースケース/名前の色で表・バッジ・本文を強調する.spec.ts
