title: "設定と索引を点検する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ずれの無いフォルダ
        description: '`mdmark init` の後に文書 2 つを書き、索引に 2 つとも載せ、設定の `build.include` が 2 つに当たるフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 出力がずれ 0 件を示す
      - 終了コードが 0
      - 設定・索引・文書が変わっていない
    test: test_normal
  - name: 正常シナリオ（ずれがある）
    setup:
      - name: ずれを持つフォルダ
        description: 正常シナリオのフォルダから文書 1 つを消し、索引には残したもの。設定の `build` は `out` を持たない
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 索引のその文書の行を指す `missing_doc` の行がある
      - '`mdmark.config.yaml` の `build` を指し、`out` が無いことを示す `schema` の行がある'
      - 各行がファイル・場所・種類・内容を持ち、内容に直し方が書かれている
      - 終了コードが 0 以外
    test: test_normal_when_drift
  - name: 異常シナリオ（設定ファイルが無い）
    setup:
      - name: 設定ファイルの無いフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init で置けること・終了コード 0 以外
    expected:
      - 出力に設定ファイルが無いことと、`mdmark init` で置けることが出る
      - 終了コードが 0 以外
    test: test_error_when_config_missing
  - name: 正常シナリオ（知らない印がある）
    setup:
      - name: 知らない印を持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つの段落の間に、記法の印にも拡張にも対応表にも無い `<!-- tabz -->` を書き、同じ文書の `markdown` のコードブロックの中にも `<!-- tabz -->` を書いたもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の本文から、知っている印に当たらない印を拾う
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - その文書と `<!-- tabz -->` を書いた行を指す `unknown_mark` の行が 1 つだけあり、内容に印の名前 `tabz` と直し方が書かれている
      - コードブロックの中の `<!-- tabz -->` を指す行が無い
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_mark
  - name: 正常シナリオ（比べる基準を渡す）
    setup:
      - name: 組で直す文書を持つ git のフォルダ
        description: 正常シナリオのフォルダで、索引の 2 つの文書が互いを `change_together` で記載し、全てをコミットした git のリポジトリ
      - name: 片方だけの変更
        description: コミットの後に 1 つ目の文書の本文だけを書き換える
        notes: 比べる基準には、書き換える前のコミットを渡す
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        participant M as mdmark の点検の処理
        W->>C: mdmark check（比べる基準: 書き換える前のコミット）
        C->>G: 基準から変わったファイルを引く
        G-->>C: 1 つ目の文書のパス
        C->>M: checkIndex（索引・文書・変わったパス）
        M-->>C: 直し忘れの行
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
      ```
    expected:
      - 2 つ目の文書を指す直し忘れの行が 1 件あり、内容に組の相手と 1 つ目の文書が変わったことが書かれている
      - 終了コードが 0 以外
      - 同じフォルダで比べる基準を渡さずに流すと、ずれ 0 件・終了コード 0
      - 設定・索引・文書と git の履歴が変わっていない
    test: test_normal_when_base_given
  - name: 異常シナリオ（比べる基準を引けない）
    setup:
      - name: git のフォルダ
        description: 正常シナリオ（比べる基準を渡す）と同じ
      - name: 無い基準
        description: リポジトリに無い ref の名前を比べる基準に渡す
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        W->>C: mdmark check（比べる基準: 無い ref）
        C->>G: 基準から変わったファイルを引く
        G-->>C: 引けない
        C-->>W: 基準を引けないことと直し方の 1 文・終了コード 0 以外
      ```
    expected:
      - 出力に、渡した ref を引けないことと直し方が出る
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_error_when_base_unknown
  - name: 正常シナリオ（エイリアスにずれがある）
    setup:
      - name: エイリアスを読むフォルダ
        description: 正常シナリオのフォルダに、設定の `aliases` とエイリアスの元の YAML を置いたもの。正しい行 1 つと、誤った行を混ぜる
      - name: 誤った行
        description: エイリアスのスキーマに合わない行・`paths` に当たるファイルが無い行・YAML として読めないファイルを指す行・`records` の配列が無い行・`ref` の列がレコードに無い行・種類の必須のキーが空の行（`command` の `command` が空）・ほかの行と ID が重なる行
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>C: aliases の行ごとにエイリアスの元を読んで確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 誤った行ごとに、その行かエイリアスの元のファイルを指すずれの行がある
      - スキーマに合わない行・読めない行・必須のキーが空の行・ID が重なる行の内容に、直し方が書かれている
      - 正しい行を指すずれの行が無い
      - 終了コードが 0 以外
    test: test_normal_when_alias_drift
lead: 文書を書く人が `mdmark check` を流し、設定ファイルと索引の形・索引と文書のずれ・書き出す対象の有無・文書の本文にある知らない印を、ファイル・場所・種類・内容の一覧で受け取る。
issue: 9
primary_actor: 文書を書く人
trigger: 文書や索引を書き換えた後、書き出す前にずれを確かめる
preconditions:
  - 文書を書く人の手元に Node 24 以降がある
success_guarantee: 設定の Schema に合わないところ・索引と文書のずれ（`checkIndex` が返すもの）・`build` の対象が 0 件であること・文書の本文にある知らない印が、ファイル・場所・種類・内容の一覧で出る。比べる基準の git の ref を渡したときは、基準から片方の文書だけが変わった `change_together` の組も、直し忘れとして同じ一覧に出る。ずれが無ければ終了コード 0、あれば 0 以外で終わる。
minimal_guarantee: 点検は設定・索引・文書を書き換えない。設定ファイルを読めないときは、原因と直し方の 1 文を出して 0 以外で終わる。
refs:
  - dev/設計書/シナリオ/単一ユースケース/索引と文書のずれを点検する#
test_file: tests/e2e/単一ユースケース/設定と索引を点検する.spec.ts
