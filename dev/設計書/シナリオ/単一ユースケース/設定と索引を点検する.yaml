title: 設定と索引を点検する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ずれの無いフォルダ
        description: '`mdmark init` の後に文書 2 つを書き、索引に 2 つとも載せ、設定の `build.include` が 2 つに当たるフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 出力がずれ 0 件を示す
      - 終了コードが 0
      - 設定・索引・文書が変わっていない
    test: test_normal
  - name: 正常シナリオ（ずれがある）
    setup:
      - name: ずれを持つフォルダ
        description: 正常シナリオのフォルダから文書 1 つを消し、索引には残したもの。設定の `build` は `out` を持たない
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 索引のその文書の行を指す `missing_doc` の行がある
      - '`mdmark.config.yaml` の `build` を指し、`out` が無いことを示す `schema` の行がある'
      - 各行がファイル・場所・種類・内容を持ち、内容に直し方が書かれている
      - 終了コードが 0 以外
    test: test_normal_when_drift
  - name: 異常シナリオ（設定ファイルが無い）
    setup:
      - name: 設定ファイルの無いフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init で置けること・終了コード 0 以外
    expected:
      - 出力に設定ファイルが無いことと、`mdmark init` で置けることが出る
      - 終了コードが 0 以外
    test: test_error_when_config_missing
  - name: 正常シナリオ（知らない印がある）
    setup:
      - name: 知らない印を持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つの段落の間に、記法の印にも拡張にも対応表にも無い `<!-- tabz -->` を書き、同じ文書の `markdown` のコードブロックの中にも `<!-- tabz -->` を書いたもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の本文から、知っている印に当たらない印を拾う
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - その文書と `<!-- tabz -->` を書いた行を指す `unknown_mark` の行が 1 つだけあり、内容に印の名前 `tabz` と直し方が書かれている
      - コードブロックの中の `<!-- tabz -->` を指す行が無い
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_mark
  - name: 正常シナリオ（比べる基準を渡す）
    setup:
      - name: 組で直す文書を持つ git のフォルダ
        description: 正常シナリオのフォルダで、索引の 2 つの文書が互いを `change_together` で記載し、全てをコミットした git のリポジトリ
      - name: 片方だけの変更
        description: コミットの後に 1 つ目の文書の本文だけを書き換える
        notes: 比べる基準には、書き換える前のコミットを渡す
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        participant M as mdmark の点検の処理
        W->>C: mdmark check（比べる基準: 書き換える前のコミット）
        C->>G: 基準から変わったファイルを引く
        G-->>C: 1 つ目の文書のパス
        C->>M: checkIndex（索引・文書・変わったパス）
        M-->>C: 直し忘れの行
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
      ```
    expected:
      - 2 つ目の文書を指す直し忘れの行が 1 件あり、内容に組の相手と 1 つ目の文書が変わったことが書かれている
      - 終了コードが 0 以外
      - 同じフォルダで比べる基準を渡さずに流すと、ずれ 0 件・終了コード 0
      - 設定・索引・文書と git の履歴が変わっていない
    test: test_normal_when_base_given
  - name: 異常シナリオ（比べる基準を引けない）
    setup:
      - name: git のフォルダ
        description: 正常シナリオ（比べる基準を渡す）と同じ
      - name: 無い基準
        description: リポジトリに無い ref の名前を比べる基準に渡す
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        W->>C: mdmark check（比べる基準: 無い ref）
        C->>G: 基準から変わったファイルを引く
        G-->>C: 引けない
        C-->>W: 基準を引けないことと直し方の 1 文・終了コード 0 以外
      ```
    expected:
      - 出力に、渡した ref を引けないことと直し方が出る
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_error_when_base_unknown
  - name: 正常シナリオ（エイリアスにずれがある）
    setup:
      - name: エイリアスを読むフォルダ
        description: 正常シナリオのフォルダに、設定の `aliases` とエイリアスの元の YAML を置いたもの。正しい行 1 つと、誤った行を混ぜる
      - name: 誤った行
        description: 'エイリアスのスキーマに合わない行（`alias_type` が 9 つの種類に無い `memo` の行と、`metadata` の値を `{type: ref, field}` で記載した行）・`paths` に当たるファイルが無い行・YAML として読めないファイルを指す行・`records` の配列が無い行・`metadata` に記載した列がレコードに無い行・種類の必須のキーが空の行（`command` の `command` が空）・ほかの行と ID が重なる行・別のレコードとエイリアスの `id` が重なるレコードを持つ行'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>C: aliases の行ごとにエイリアスの元を読んで確かめる
        C->>M: checkIndex（索引・文書）
        M-->>C: ずれの一覧
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 誤った行ごとに、その行かエイリアスの元のファイルを指すずれの行がある
      - スキーマに合わない行・読めない行・必須のキーが空の行・`alias_type` が 9 つの種類に無い行・行の `id` が重なる行・エイリアスの `id` が重なる行の内容に、直し方が書かれている
      - 正しい行を指すずれの行が無い
      - 終了コードが 0 以外
    test: test_normal_when_alias_drift
  - name: 正常シナリオ（知らないテーマの名前がある）
    setup:
      - name: 知らないテーマの名前を書いたフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` のテーマを選ぶキーに mdmark に入っていない名前 `sepia` を書く
        notes: キーは `colorTheme`、ずれの種類は `unknown_color_theme`（インターフェース定義『設定と索引を点検する』）
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark check
        W->>C: mdmark check を流す
        C->>C: 設定のテーマの名前を mdmark に入っているテーマと照らす
        C-->>W: テーマの名前を指すずれの行
    expected:
      - '`mdmark.config.yaml` のテーマを選ぶキーを指すずれの行が 1 つだけあり、内容に書いた名前 `sepia` と選べるテーマの名前の一覧が書かれている'
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
      - テーマを選ぶキーを持たない設定と、選べるテーマの名前を書いた設定では、このずれの行が出ない
    test: test_normal_when_unknown_theme
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを選ぶ#scenarios[正常シナリオ（知らないテーマの名前）]
  - name: 正常シナリオ（見つからないファイルがある）
    setup:
      - name: 点検する文書
        description: '`docs/guide.md` が、実在しない `images/missing.png`・`media/missing.mp4`・`media/missing.mp3` と、リンクだけの段落 `[仕様書](files/missing.pdf)` を持ち、`images/logo.png` を相対パスで指す'
        notes: '`images/logo.png` は `docs/` の下には無く、`assets/images/logo.png` にだけある'
      - name: 設定
        description: '`mdmark.config.yaml` のアセットのルートが `assets` を指す'
      - name: Mock
        description: なし（実ファイルを使う）
    flow: |-
      sequenceDiagram
        actor U as 文書を書く人
        participant C as mdmark CLI
        participant F as ファイル
        U->>C: mdmark check
        C->>F: 文書を読み、画像・動画・音声・添付のパスを文書からの相対パスとアセットのルートで確かめる
        C-->>U: 見つからないファイルのずれの一覧と終了コード 1
    expected:
      - 終了コードが 1
      - ずれの一覧に、`docs/guide.md` の行番号と `images/missing.png`・`media/missing.mp4`・`media/missing.mp3`・`files/missing.pdf` の 4 行が出る
      - アセットのルートの下にある `images/logo.png` はずれの一覧に出ない
      - ずれの種類は見つからないファイルを表す種類
      - 書き出しは行わない
    test: test_normal_when_files_missing
  - name: 正常シナリオ（図の定義にずれがある）
    setup:
      - name: 図の定義にずれを持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つに、定義の誤りを持つフロー図の部品の定義 1 つと、配置のずれを持つフロー図の部品の定義 1 つを記載したもの。もう 1 つの文書には、ずれの無いフロー図の部品の定義を記載する
        notes: 定義の誤りは id の重なった 2 つのノード。配置のずれは、座標の重なる 2 つのノード、枠からはみ出すノード、ほかのノードを横切る線、ノードの幅に収まらない長さのラベルの 4 つ
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使わない
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の図の部品の定義を読み、ノードと線の配置を計算して点検する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 定義の誤りを持つ図の定義の場所を指す行が、定義の誤りの 1 つだけで、内容に重なった id と修正の方法が記載されている
      - 配置のずれを持つ図の定義の場所を指す行が、ノードの重なり・はみ出し・線の横切り・ラベルの長さの 4 つの種類で 1 つずつあり、内容に対象のノードか線の id と修正の方法が記載されている
      - ずれの無い図の定義を持つ文書を指す行が無い
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_drift
  - name: 正常シナリオ（取り込み先が無い）
    setup:
      - name: 取り込み先の無いマーカーを持つフォルダ
        description: '正常シナリオのフォルダの 1 つ目の文書に、無いファイルを指す `<!-- include: missing.md -->`、2 つ目の文書に無い見出しを指す include のマーカー、無い行の範囲を指す include のマーカーを書き、正しい取り込み先を指す include のマーカーも 1 つ書いたもの'
        notes: 行の範囲は 5 行のファイルの 8〜10 行目を指す。ずれの種類の名前はインターフェース定義で決める
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark の点検の処理
        W->>C: mdmark check
        C->>C: 設定・索引・文書を読み、設定の Schema と build の対象を確認する
        C->>M: checkIndex（索引・文書）
        M-->>C: 空のずれの一覧
        C->>C: 文書の include のマーカーの取り込み先を、文書からの相対パスで確認する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 無いファイル・無い見出し・無い行の範囲を指すマーカーごとに、その文書とマーカーの行を指すずれの行が 1 つずつあり、内容に取り込み先と、無いものと、修正の方法が記載されている
      - 正しい取り込み先を指すマーカーを指す行が無い
      - ずれの種類は取り込み先が無いことを表す種類
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_include_missing
  - name: 正常シナリオ（座標を省いた図の定義）
    setup:
      - name: 座標を省いた図の定義を持つフォルダ
        description: 正常シナリオのフォルダの文書 1 つに、『図を描く』の正常シナリオ（座標を省いた判定フローチャート）と同じ定義 1 つと、座標を省いた `llm` のノードを持つフロー図の定義 1 つを記載したもの
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使わない
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 座標を省いた判定フローチャートの定義に、描くときと同じ自動の配置を当てる
        C->>C: 配置後の座標で、ノードの重なり・はみ出し・線の横切り・ラベルの長さを点検する
        C-->>W: ファイル・場所・種類・内容の一覧・終了コード 0 以外
    expected:
      - 座標を省いた判定フローチャートの定義を指す行が無い
      - '`llm` のノードの定義を指す行が定義の誤りの 1 つだけで、内容に座標を省けるのは判定フローチャートのノードだけであることと修正の方法が記載されている'
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_auto_layout
  - name: 正常シナリオ（図のツールチップの位置に誤った値がある）
    setup:
      - name: 誤った値を書いたフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` の `tooltips.diagramPlacement` に `left` を書く
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定の Schema を確認する
        C-->>W: tooltips.diagramPlacement を指すずれの行・終了コード 0 以外
    expected:
      - '`mdmark.config.yaml` の `tooltips.diagramPlacement` を指す `schema` の行が 1 つだけあり、内容に書ける値 `top`・`bottom` が記載されている'
      - 終了コードが 0 以外
      - '`tooltips.diagramPlacement` に `top` か `bottom` を書いた設定と、書かない設定では、このずれの行が出ない'
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_placement_invalid
  - name: 正常シナリオ（グループの項目に誤った値がある）
    setup:
      - name: 誤った値を持つ図の文書のフォルダ
        description: 正常シナリオのフォルダの文書 1 つに、`frame.hint` が数で、`stickyTitles` が文字 `no` のフロー図の部品の定義を記載したもの
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使わない
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 文書の図の部品の定義を読み、定義を点検する
        C-->>W: 定義の誤りの行・終了コード 0 以外
    expected:
      - その図の定義の場所を指す定義の誤りの行が 1 つだけあり、内容に `frame.hint` は文字、`stickyTitles` は真偽値で書くことが記載されている
      - 終了コードが 0 以外
      - 設定・索引・文書が変わっていない
    test: test_normal_when_group_options_invalid
  - name: 正常シナリオ（重ねた設定ファイルにずれがある）
    setup:
      - name: 端末の設定
        description: '`MDMARK_CONFIG` で指す `settings.yaml`。`config.cascade: true` と、真偽値でない `features.callout: maybe` を書く'
      - name: 重ねる設定を持つフォルダ
        description: '上のフォルダの `mdmark.config.yaml` に `side-toc.mode: wide` を書き、その下の `docs/` の `mdmark.config.yaml` と索引と文書はずれが無い'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: docs/ で mdmark check
        C->>C: 端末の設定・上・docs/ の設定ファイルのそれぞれの形を検める
        C-->>W: ファイルごとの schema のずれ・終了コード 1
    expected:
      - 終了コードが 1
      - ずれの一覧に、端末の設定のパスを指す `features.callout` の `schema` と、上のフォルダの `mdmark.config.yaml` を指す `side-toc.mode` の `schema` が 1 件ずつある
      - 設定・索引・文書が変わっていない
    test: test_normal_when_cascaded_config_drift
lead: 文書を書く人が `mdmark check` を流し、設定ファイルと索引の形・索引と文書のずれ・書き出す対象の有無・文書の本文にある知らない印・図の部品の定義のずれを、ファイル・場所・種類・内容の一覧で受け取る。
issue: 9
primary_actor: 文書を書く人
trigger: 文書や索引を書き換えた後、書き出す前にずれを確かめる
preconditions:
  - 文書を書く人の手元に Node 24 以降がある
success_guarantee: 設定の Schema に合わないところ・索引と文書のずれ（`checkIndex` が返すもの）・`build` の対象が 0 件であること・文書の本文にある知らない印・図の部品の定義の誤りとノードの重なり・はみ出し・線の横切り・ラベルの長さ（座標を省いた判定フローチャートは自動の配置の後の座標で点検する）・include のマーカーの取り込み先が無いことが、ファイル・場所・種類・内容の一覧で出る。比べる基準の git の ref を渡したときは、基準から片方の文書だけが変わった `change_together` の組も、直し忘れとして同じ一覧に出る。ずれが無ければ終了コード 0、あれば 0 以外で終わる。
minimal_guarantee: 点検は設定・索引・文書を書き換えない。設定ファイルを読めないときは、原因と直し方の 1 文を出して 0 以外で終わる。
refs:
  - dev/設計書/シナリオ/単一ユースケース/索引と文書のずれを点検する#
test_file: tests/e2e/単一ユースケース/設定と索引を点検する.spec.ts
