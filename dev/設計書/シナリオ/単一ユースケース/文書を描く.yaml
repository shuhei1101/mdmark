title: "文書を描く"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、描く先の要素を 1 つ持つ HTML
        notes: 設定は指定しない（既定を適用する）
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表・コードブロック・リンクを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: Markdown を解析し、マーカーを取得する
        M->>M: スクリプトを落とす
        M-->>P: 要素の中に本文を描く
        P-->>U: 文書を表示
    expected:
      - 描く先の要素の中に、見出し・段落・リスト・表・コードブロック・リンクの要素がある
      - リンクの要素の `href` が Markdown に記載した URL
    test: test_normal
  - name: 正常シナリオ（本文を差し替える）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオで見本の Markdown を描いた後のページ
      - name: 差し替える Markdown
        description: 見出し `## 新しいセクション` を 1 つだけ持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 差し替える Markdown を指定する
        M->>M: 本文だけを再描画する
        M-->>P: 要素の中を新しい本文にする
        P-->>U: 新しい文書を表示
    expected:
      - 描いた文書の本文（右側の目次とそのボタンを除く）が、差し替えた Markdown の見出しだけになる
      - 前の本文の段落・表が残っていない
      - 右側の目次の項目が `新しいセクション` だけになり、前の本文の見出しの項目が残っていない
    test: test_normal_when_updated
  - name: 正常シナリオ（片付ける）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオで見本の Markdown を描いた後のページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 片付けさせる
        M->>M: 描いたものとイベントを片付ける
        M-->>P: 要素の中を空にする
    expected:
      - 描く先の要素の中が空になる
      - ページに右側の目次と目次を出すボタンが残っていない
      - 片付けた後に本文の差し替えを呼んでも、要素の中に何も描かれない
    test: test_normal_when_destroyed
  - name: 正常シナリオ（未知のマーカーがある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 未知のマーカーを持つ Markdown
        description: '段落の間に `<!-- unknown: 1 -->` を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: 未知のマーカーを無視する
        M-->>P: 要素の中に本文を描く
        P-->>U: マーカーの前後の段落を表示
    expected:
      - マーカーの前後の段落が描かれている
      - 本文にマーカーの文字（`<!--`・`unknown`）が出ていない
    test: test_normal_when_unknown_mark
  - name: 正常シナリオ（文書にスクリプトがある）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ。スクリプトが実行されたら立つ旗を `window` で見られる
      - name: スクリプトを記載した Markdown
        description: '`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・折り畳み（`details`）を持つ文書'
        notes: どのスクリプトも、実行されたら `window` の旗を起動する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 要素と Markdown を指定して描かせる
        M->>M: script 要素・イベント属性・javascript: の URL を落とす
        M-->>P: 要素の中に本文を描く
        U->>P: リンクを押す
        P-->>U: スクリプトは実行されない
    expected:
      - 描いた本文に `script` 要素・`onclick` 属性・`javascript:` の URL が無い
      - リンクを押しても `window` の旗が立たない
      - 折り畳み（`details`）は描かれている
    test: test_normal_when_script_in_markdown
  - name: 正常シナリオ（索引を指定する）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、索引・描く文書の `id`・ほかの文書から算出した参照を指定して文書を描く HTML
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース` を持ち、ほかの文書の `related` が描く文書を指す索引
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を指定して描かせる
        M-->>P: 用語に下線を付け、被参照の一覧を付けて描く
        P->>M: 本文を差し替える
        M-->>P: 同じ索引で再描画する
        P-->>U: 差し替えた本文を表示
    expected:
      - 描いた直後、`ワークスペース` に下線が付き、被参照の一覧がある
      - 本文を `ワークスペース` が出る別の段落に差し替えた後も、下線と被参照の一覧がある
    test: test_normal_when_index
  - name: 正常シナリオ（元の行番号を出す）
    setup:
      - name: 配布物を読み込んだページ
        description: 正常シナリオと同じ
      - name: 行の位置が分かる Markdown
        description: 1 行目に見出し、3 行目に段落、5〜7 行目に表、9〜11 行目にコードブロックを配置した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 行の位置が分かる Markdown を指定する
        M->>M: ブロックごとに元の行番号を付けて描く
        M-->>P: 元の行番号の属性を持つ本文
        P-->>U: 文書を表示
    expected:
      - 見出し・段落・表・コードブロックの要素が、それぞれ Markdown で始まる行の番号を元の行番号の属性に持つ
      - 外観（要素の位置と色の計算値）は、元の行番号の属性が無いときと同じ
    test: test_normal_when_source_lines
  - name: 正常シナリオ（エイリアスを指定する）
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、索引を指定せずに、読み込んだエイリアスを指定して文書を描く HTML
      - name: エイリアス
        description: '`term` の `ワークスペース`（説明 `話し合いの記録を配置するフォルダ`）'
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 読み込んだエイリアスと Markdown を指定して描かせる
        M-->>P: エイリアスの単語に下線を描く
        P->>M: 本文を差し替える
        M-->>P: 同じエイリアスで再描画する
        P-->>U: 差し替えた本文を表示
    expected:
      - 描いた直後、`ワークスペース` に下線が付き、ツールチップに `話し合いの記録を配置するフォルダ` が出る
      - 本文を `ワークスペース` が出る別の段落に差し替えた後も、下線が付いている
    test: test_normal_when_aliases
  - name: 正常シナリオ（テーマを選ぶ）
    setup:
      - name: テーマを選ぶ設定
        description: テーマを選ぶキーに theme-paper を記載した `opts.config`
        notes: OS の配色はライト
      - name: 見本の Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mount(要素, Markdown, opts.config にテーマ)
        M-->>P: 選んだテーマの値が該当した本文
        P->>M: 本文を差し替える
        M-->>P: 同じテーマのままの本文
        P-->>U: theme-paper の配色で表示
    expected:
      - 描いた直後、描く先の要素の地の色の計算値が theme-paper の明るい配色の `--mdmark-color-bg` の値
      - 本文を差し替えた後も、地の色の計算値が同じ値
      - 片付けた後、描く先の要素とページにテーマを示す class か属性が残っていない
    test: test_normal_when_theme_selected
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを選ぶ#scenarios[正常シナリオ]
lead: 利用側のページが、要素と Markdown と設定を mdmark に指定し、ブラウザで文書を描く。描いた後に本文だけを差し替えたり、片付けたりできる。
issue: 3
primary_actor: mdmark を使用するアプリのページ
stakeholders:
  - name: 読者
    interest: Markdown の見出し・段落・リスト・表・コードブロック・リンクが文書として読み込める
  - name: 利用側のアプリの開発者
    interest: サーバーは Markdown と設定を指定するだけで、描く処理を自前で持たない
trigger: 利用側のページが、配布物を読み込んだ後に文書を描く公開関数を呼ぶ
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - 描く先の要素がページにある
success_guarantee: 描く先の要素の中に、Markdown を HTML にした本文が出る。文書に記載したスクリプトは実行されない。
minimal_guarantee: 未知のマーカーや描けない箇所があっても、ほかの本文は描かれる。
test_file: tests/e2e/単一ユースケース/文書を描く.spec.ts
