id: SC-472-19
title: シーケンス図の参加者を選んで強調する
lead: 読者が、map のシーケンス図の参加者を選んでその参加者のメッセージとライフラインを強調し、箱をドラッグして並び順を変えて、特定の参加者のあいだのやり取りを追う。
issue: 324
test_file: tests/e2e/単一ユースケース/シーケンス図の参加者を選んで強調する.spec.ts
primary_actor: 読者
trigger: 読者が、参加者の多いシーケンス図で、特定の参加者のあいだのやり取りだけを追いたくなる
preconditions:
  - 文書に、参加者 5 人・メッセージ 4 つを持つ map のシーケンス図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 選んだ参加者が送る・受けるメッセージとライフラインが強調され、ほかは薄くなる。箱をドラッグして並び順を変えた図に描き直され、元の順に戻せる。
minimal_guarantee: 選んだ状態を解くと、元の図と同じ見た目に戻る。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 参加者 5 人・メッセージ 4 つの map のシーケンス図を描いたページ。補足の `notes` で 1 つのメッセージに説明を持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as シーケンス図
        U->>D: 3 人目の参加者の箱を押す
        D-->>U: 3 人目が送る・受けるメッセージとライフラインを強調し、ほかを薄くして、そのメッセージの線にデータの印を流す
        U->>D: 4 人目の参加者の箱も押す
        D-->>U: 3 人目と 4 人目のあいだのメッセージだけを強調する
        U->>D: Esc を押す
        D-->>U: 強調を解く
        U->>D: 説明を持つメッセージの線にポインターを当てる
        D-->>U: 線と両端の参加者のほかを薄くし、ツールチップに説明を出す
    expected:
      - 1 人を選ぶと、その参加者が送る・受けるメッセージの線とラベル・その参加者のライフラインの表示は変わらず、ほかのメッセージと参加者が薄くなり、そのメッセージの線の上をデータの印が送り手から受け手へ流れ続ける
      - 2 人を選ぶと、選んだ 2 人のあいだのメッセージだけが強調される
      - メッセージの線を押すと送り手と受け手が選ばれ、もう一度押すと両方の選択が解ける。片方だけ選んだ状態で押すと両方が選ばれる
      - 参加者の箱はキーボードで選べ、選んでいるかの状態をスクリーンリーダー向けに持つ
      - 参加者の名前の文字の上を押しても選択は変わらず、文字を選んでコピーできる。種類の行と余白を押すと選ばれる
      - Esc か、選んだ箱をもう一度押すと選んだ状態が解ける
      - メッセージの線にポインターを当てると線と両端の参加者のほかが薄くなり、当てている間はその線の上をデータの印が流れ、説明を持つ線だけツールチップに説明が出る
    test: test_normal
  - name: 正常シナリオ（参加者の並び順を変える）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as シーケンス図
        U->>D: 5 人目の参加者の箱を、名前の文字の外を押したまま 2 人目の位置へ動かして離す
        D-->>U: 5 人目を 2 人目の位置へ移して描き直す
        U->>D: 右上の「参加者の並び順と選択を元に戻す」を押す
        D-->>U: 記載の順に戻し、選択を解いて描き直す
    expected:
      - 参加者の箱に並べ替えのつまみのアイコンは無く、箱の名前の文字の外を押したまま左右へ動かして離した位置の列へ参加者が移る（4px 動くまでは押した扱い）。マウスでもスマホの指でも動き、指で動かしてもページはスクロールしない
      - 箱にフォーカスして Alt + 左右の矢印でも 1 列ずつ動かせる
      - ドラッグして並べ替えた後は、箱を押したときの選択が切り替わらない
      - 種類の行（アイコンと種類の名前）の文字は選べず、選んでコピーできるのは名前の文字だけ
      - 「参加者の並び順と選択を元に戻す」は並べ替えたか参加者を選んだときだけ押せ、押すと記載の順に戻って選択が解ける
      - 描き直しても、図の倍率と図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
    test: test_normal_when_participants_reordered
