title: シーケンス図の参加者を選んで強調する
lead: 読者が、map のシーケンス図の参加者を選んでその参加者のメッセージとライフラインを強調し、参加者の表示と非表示・並び順を変えて、特定の参加者のあいだのやり取りを追う。
issue: 324
test_file: tests/e2e/単一ユースケース/シーケンス図の参加者を選んで強調する.spec.ts
primary_actor: 読者
trigger: 読者が、参加者の多いシーケンス図で、特定の参加者のあいだのやり取りだけを追いたくなる
preconditions:
  - 文書に、参加者 5 人・メッセージ 4 つを持つ map のシーケンス図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 選んだ参加者が送る・受けるメッセージとライフラインが強調され、ほかは薄くなる。参加者の一覧で、表示と非表示・並び順を変えた図に描き直される。
minimal_guarantee: 選んだ状態を解くと、元の図と同じ見た目に戻る。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 参加者 5 人・メッセージ 4 つの map のシーケンス図を描いたページ。補足の `notes` で 1 つのメッセージに説明を持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as シーケンス図
        U->>D: 3 人目の参加者の箱を押す
        D-->>U: 3 人目が送る・受けるメッセージとライフラインを強調し、ほかを薄くする
        U->>D: 4 人目の参加者の箱も押す
        D-->>U: 3 人目と 4 人目のあいだのメッセージだけを強調する
        U->>D: Esc を押す
        D-->>U: 強調を解く
        U->>D: 説明を持つメッセージの線にポインターを当てる
        D-->>U: 線を太くし、両端の参加者を強調し、ツールチップに説明を出す
    expected:
      - 1 人を選ぶと、その参加者が送る・受けるメッセージの線とラベル・その参加者のライフラインが強調され、ほかのメッセージと参加者が薄くなる
      - 2 人を選ぶと、選んだ 2 人のあいだのメッセージだけが強調される
      - 参加者の箱はキーボードで選べ、選んでいるかの状態をスクリーンリーダー向けに持つ
      - Esc か、選んだ箱をもう一度押すと選んだ状態が解ける
      - メッセージの線にポインターを当てると線が太くなって両端の参加者が強調され、説明を持つ線だけツールチップに説明が出る
    test: test_normal
  - name: 正常シナリオ（参加者の表示と並び順を変える）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as シーケンス図
        U->>D: 右上の参加者のボタンを押す
        D-->>U: 参加者の一覧（並び順のつまみと表示のチェック）を出す
        U->>D: 1 人目の表示のチェックを外す
        D-->>U: 1 人目と、1 人目に関わるメッセージを隠して描き直す
        U->>D: 4 人目の行を 3 人目の行の上へドラッグ＆ドロップする
        D-->>U: 4 人目と 3 人目の並びを入れ替えて描き直す
        U->>D: Esc を押す
        D-->>U: 参加者の一覧を閉じる
    expected:
      - 参加者の一覧に、全ての参加者が今の並び順で、並び順のつまみと表示のチェックを持って並ぶ。つまみにフォーカスして Alt + 上下の矢印でも並び順を変えられる
      - 表示のチェックを外した参加者と、その参加者が送る・受けるメッセージが図から消え、ほかのメッセージは記載の順のまま残る
      - ドラッグ＆ドロップで、図の参加者の並びが一覧と同じ順に変わる
      - 非表示にするとメッセージが 1 つも残らない参加者の表示のチェックは押せない。シーケンス図の下の帯は、表示しているメッセージだけを数えて進める
      - 描き直しても、図の倍率と図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
    test: test_normal_when_participants_changed
