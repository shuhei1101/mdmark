lead: 読者が、描いた文書の本文の文字を選んでコメントを付け、付いた箇所のマーカーからコメントを開く。コメントは利用側が `mount` に指定した読み込みと保存の関数で残る。
issue: 8
primary_actor: 読者
stakeholders:
  - name: 読者
    interest: 気になった箇所を選ぶだけで、その場にコメントを残せ、後から箇所のマーカーで開ける
  - name: 利用側
    interest: コメントを自分の保存先に残せ、他の人とも共有できる
trigger: 読者が、文書の中の気になった箇所に意見を残したくなる
preconditions:
  - ページが `mount` で文書を描き、コメントの読み込みと保存の関数を指定している
  - コメントの機能（`comments`）がオン（既定はオフ）
success_guarantee: 選んだ文字と前後の文字・コメントの本文が読み込みと保存の関数へ渡り、選んだ箇所にマーカーが付く。本文を再描画した後も、同じ文字の箇所にもう一度マーカーが付く。読み込みと保存の関数が `update`・`remove` を持つときは吹き出しからコメントを修正・削除でき、利用側は `reloadComments` でマーカーを再読み込みし、`focusComment` でコメントの箇所へ移れる。本文の右の余白に、マーカーのある行の高さで余白のマーカーが出て、押すとそのマーカーのコメントへ移る。
minimal_guarantee: コメントを保存できないときは、記載したコメントを削除せずに通知し、文書の残りは今のとおり読み込める。
