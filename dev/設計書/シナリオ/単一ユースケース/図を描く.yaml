title: 図を描く
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描くページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、文書を描く HTML
      - name: フロー図の定義を持つ Markdown
        description: フロー図の部品の定義を 1 つ持つ文書
        notes: システムの枠の内側に LLM の層・処理の層・データの層のノードを各 1〜2 行、枠の外に外部のシステムのノードを 1 つ配置する。ノードの並びでは削除できない交差を 1 か所、ループの戻りを 1 本、題名・範囲・更新日を持つ。システムの枠と LLM の層は `hint` を持つ。動くと `window.__mdmarkScriptRan` を `true` にする `<script>` を文書に 1 つ持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M->>M: フロー図の部品が grid にノードと線を配置する
        M-->>P: 枠・層・凡例つきのフロー図と本文
        P-->>U: 文書を表示
    expected:
      - システムの枠の中に 3 つの層が上から LLM・処理・データの順に並び、層ごとにノードの色の背景が敷かれている
      - 外部のシステムのノードが枠の外にある
      - 題名・範囲・更新日と凡例があり、凡例には図に 2 種類以上あるノードの種類と線の種類だけが載る
      - 凡例に、システムの枠・層の背景・線の交差・ツールチップのマーカー・用語の下線の項目が無い
      - システムの枠と LLM の層のタイトルの右にツールチップのマーカーがあり、`hint` を持たない層のタイトルには無い
      - 線の種類が色と模様（破線の間隔・太さ・矢じり）の組で分かれている
      - 残った交差は横の線が縦の線を飛び越える構造（line jump）で描かれている
      - ループの戻りの線が上か下の帯を通る破線で、戻り先のラベルを持つ
      - '`window.__mdmarkScriptRan` が `true` になっていない（文書に記載した `<script>` が動いていない）'
      - 色分けのライブラリへの要求が 0 件（図の部品の定義の `json` のコードブロックは色分けの対象にならない）
    test: test_normal
  - name: 正常シナリオ（シーケンス図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: シーケンス図の定義を持つ Markdown
        description: 登場する相手 3 つとメッセージ 4 つ、ループの戻り 1 本を持つシーケンス図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: シーケンス図の部品が相手とメッセージを左から右へ配置する
        M-->>P: タイトルと凡例つきのシーケンス図と本文
        P-->>U: 文書を表示
    expected:
      - 相手が定義の順に左から右へ並び、メッセージが時刻の順に並ぶ
      - ループの戻りが破線と戻り先のラベルで描かれている
      - 題名・範囲・更新日と凡例があり、凡例には図に 2 種類以上ある相手の種類と線の種類だけが載る
    test: test_normal_when_sequence
  - name: 正常シナリオ（グラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: グラフの定義を持つ Markdown
        description: 系列 2 つ・点 5 つずつの折れ線のグラフの部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: グラフの部品が系列を描く
        M-->>P: タイトルと凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 2 つの系列が、色と線の模様の組で分かれて描かれている
      - 題名と、系列の名前を記載した凡例がある
    test: test_normal_when_graph
  - name: 異常シナリオ（定義を読み込めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読み込めない定義を持つ Markdown
        description: JSON として読み込めないフロー図の定義 1 つと、正しいフロー図の定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M-->>P: 読み込めない定義の場所に記載の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読み込めない定義の場所に記載の警告があり、読み込めない箇所が記載されている
      - 正しい定義のフロー図が描かれている
      - 段落が描かれている
    test: test_error_when_definition_invalid
  - name: 正常シナリオ（棒のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 棒のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が棒・系列 2 つ・項目 4 つで、縦の軸の範囲を記載しない定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: データから縦の軸の目盛りを切り、棒を描く
        M-->>P: タイトルと凡例つきの棒のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 系列 2 つを色と模様の組で分けた棒が、項目 4 つ分描かれている
      - 縦の軸の目盛りが、データの最小と最大を含む 1・2・5×10 のべき乗の刻みで切られている
      - 題名と、系列の名前を記載した凡例がある
      - グラフは `role="img"` と、題名と系列の値を記載したスクリーンリーダー向けの名前を持つ
    test: test_normal_when_bar
  - name: 正常シナリオ（円のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 円のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が円で項目 3 つの定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 項目の値の割合で扇形を描く
        M-->>P: タイトルと凡例つきの円のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 項目 3 つの扇形が、値の割合の角度で、色と模様の組で分けて描かれている
      - 凡例に項目の名前が並ぶ
    test: test_normal_when_pie
  - name: 正常シナリオ（散布図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 散布図の定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が散布図で系列 1 つ・点 6 つ（横と縦がどちらも数値）の定義を配置する文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 横と縦の両方の軸の目盛りを切り、点を配置する
        M-->>P: タイトルと凡例つきの散布図と本文
        P-->>U: 文書を表示
    expected:
      - 点 6 つが、横と縦の値の位置に系列の点のマーカーで配置されている
      - 横と縦の両方の軸に、数値の目盛りがある
    test: test_normal_when_scatter
  - name: 正常シナリオ（判定フローチャート）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 判定フローチャートの定義を持つ Markdown
        description: フロー図の部品の定義に、判定フローチャートの種類のノードだけを配置した文書
        notes: 開始のノード 1 つ・質問のノード 2 つ・アクションのノード 1 つ・結果のノード 2 つを上から下へ配置し、質問のノードから出る線に `YES`・`NO` のラベルを付ける。システムの枠と層を持たず、題名・範囲・更新日を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M->>M: フロー図の部品が開始・質問・アクション・結果のノードを種類ごとの構造で配置する
        M-->>P: 凡例つきの判定フローチャートと本文
        P-->>U: 文書を表示
    expected:
      - 記載の警告が出ず、開始のノード 1 つ・質問のノード 2 つ・アクションのノード 1 つ・結果のノード 2 つが描かれている
      - 開始・質問・アクション・結果のノードが、色だけでなく互いに異なる構造・アイコン・種類の名前で見分けられる
      - 質問のノードから出る線に `YES`・`NO` のラベルがある
      - 凡例のノードの種類の項目が開始・質問・アクション・結果の 4 つだけで、「判断（AI）」「データ」が出ていない
    test: test_normal_when_flowchart
  - name: 正常シナリオ（追加したグラフの種類）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 追加した種類のグラフの定義を持つ Markdown
        description: 面・積み上げの棒・積み上げの面・横棒・ドーナツ・レーダー・バブル・折れ線と棒の組み合わせの 8 つのグラフの部品の定義を、系列 2 つずつで記載した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: グラフの部品が種類ごとに系列を描く
        M-->>P: タイトルと凡例つきの 8 つのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 8 つの定義の場所に、それぞれの種類のグラフが図の枠に載って描かれている
      - 積み上げの棒と面は、同じ項目の系列の値を積み上げた高さで描かれている
      - 折れ線と棒の組み合わせは、系列ごとに指定した折れ線と棒で同じ軸に描かれている
      - 各グラフにタイトルと、系列の名前を記載した凡例がある
      - 記載の警告が無い
    test: test_normal_when_more_chart_types
  - name: 正常シナリオ（5 つ以上の系列）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 系列の多いグラフの定義を持つ Markdown
        description: 系列 6 つ・点 5 つずつの折れ線のグラフと、系列 6 つの棒のグラフの部品の定義を記載した文書
      - name: Mock
        description: 正常シナリオと同じ。ライトとダークの両方の配色で描く
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 系列ごとに色・点のマーカー・塗りの模様の組を適用する
        M-->>P: タイトルと凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 6 つの系列が全て描かれ、凡例に 6 つの系列の名前がある
      - 6 つの系列の色・点のマーカー・塗りの模様の組が互いに異なる
      - ライトとダークのどちらの配色でも、系列の色が背景と見分けられる
    test: test_normal_when_many_series
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: ER 図の定義を持つ Markdown
        description: テーブル 3 つ（物理名と論理名）と、主キー・外部キー・NOT NULL の列を持つ列の一覧、1 対多の関係 2 本（ラベルつき）を記載した ER 図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ER 図の部品がテーブルと関係を配置する
        M-->>P: タイトルと凡例つきの ER 図と本文
        P-->>U: 文書を表示
    expected:
      - 3 つのテーブルが、物理名と論理名を持つノードとして描かれている
      - 各テーブルに列の名前と型が並び、主キー・外部キー・NOT NULL の列にそれぞれのマーカーがある
      - 2 本の関係が、元と先のテーブルを結ぶ線と、両端の多重度のマーカーとラベルで描かれている
      - ER 図が図の枠に載り、タイトルとマーカーの意味の凡例がある
    test: test_normal_when_er_diagram
  - name: 異常シナリオ（ER 図の定義を読み込めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読み込めない ER 図の定義を持つ Markdown
        description: 定義に無いテーブルを関係の先に指定した ER 図の定義 1 つと、正しい ER 図の定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: ER 図の定義を読み込んで構造を確認する
        M-->>P: 読み込めない定義の場所に記載の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読み込めない定義の場所に記載の警告があり、関係の先のテーブルが定義に無いことが記載されている
      - 正しい定義の ER 図が描かれている
      - 段落が描かれている
    test: test_error_when_er_definition_invalid
  - name: 正常シナリオ（座標を省いた判定フローチャート）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 座標を省いた判定フローチャートの定義を持つ Markdown
        description: フロー図の部品の定義に、開始のノード 1 つ・質問のノード 2 つ・アクションのノード 1 つ・結果のノード 2 つを、`x`・`y`・`w`・`h` を記載せずに配置し、線の `points` と図の `width`・`height` を記載しない文書
        notes: 線は開始 → 質問 1、質問 1 の YES → アクション、質問 1 の NO → 質問 2、アクション → 結果 1、質問 2 の YES → 結果 1、質問 2 の NO → 結果 2 の 6 本。質問から出る線に `YES`・`NO` のラベルを付ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: 部品の定義を読み込んで構造を確認する
        M->>M: 開始から線をたどり、質問を上から下へ並べ、YES / NO の先へアクションと結果を配置する
        M->>M: 線の点を縦と横の折れ線で求める
        M-->>P: 凡例つきの判定フローチャートと本文
        P-->>U: 文書を表示
    expected:
      - 記載の警告が出ず、6 つのノードと 6 本の線が描かれている
      - 開始のノードが一番上にあり、質問 1・質問 2 のノードがその下に上から順に並ぶ
      - 質問のノードから出る `YES`・`NO` の線の先に、アクションと結果のノードが配置され、ノードどうしが重ならない
      - 線が縦と横だけの折れ線で、どのノードの中も通らない
      - 図の全体が図の枠の中に収まっている
      - 同じノードと線に座標を全て記載した定義は、記載した座標のとおりに描かれる（正常シナリオ（判定フローチャート）と同じ）
    test: test_normal_when_flowchart_auto_layout
  - name: 正常シナリオ（リンク先を持つノード）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: リンク先を持つノードの定義を持つ Markdown
        description: フロー図の部品の定義のノード 3 つのうち、1 つに `https://example.com/spec`、1 つに相対パス `./other.md` のリンク先を持たせ、1 つは持たせない文書
      - name: Mock
        description: 正常シナリオと同じ。リンク先への遷移を手元の応答で受け、開いた URL を記録する
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: リンク先を持つノードをリンクにする
        M-->>P: フロー図と本文
        P-->>U: 文書を表示
        U->>P: リンク先を持つノードを押す
        P-->>U: ノードのリンク先を開く
    expected:
      - リンク先を持つ 2 つのノードがリンクになり、名前の文字の上を含めてポインターを乗せるとカーソルが押せる構造になる
      - リンク先を持たないノードはリンクにならない
      - '`https://example.com/spec` のノードを押すと、そのリンク先が開く。`./other.md` のノードを押すと、本文の相対パスのリンクと同じく、ページの URL を基準にした `other.md` が開く'
      - キーボードでリンク先を持つノードにフォーカスでき、フォーカスの枠が見え、Enter で同じリンク先が開く
    test: test_normal_when_node_link
  - name: 異常シナリオ（ノードのリンク先を許可しない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 許可しないリンク先を持つ Markdown
        description: フロー図の部品の定義のノード 2 つに、`javascript:alert(1)` と `id:spec#items` のリンク先を持たせ、図の後に段落を持つ文書
        notes: 本文のリンクで許可しないスキームのリンク先を決定的に指定する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
