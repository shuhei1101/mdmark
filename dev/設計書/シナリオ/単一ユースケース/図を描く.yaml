title: 図を描く
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描くページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、文書を描く HTML
      - name: フロー図の定義を持つ Markdown
        description: フロー図の部品の定義を 1 つ持つ文書
        notes: システムの枠の内側に LLM の層・処理の層・データの層の箱を各 1〜2 行、枠の外に外部のシステムの箱を 1 つ置く。箱の並びでは消せない交差を 1 か所、ループの戻りを 1 本、題名・範囲・更新日を持つ。システムの枠と LLM の層は `hint` を持つ。動くと `window.__mdmarkScriptRan` を `true` にする `<script>` を文書に 1 つ持つ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 部品の定義を読んで形を確かめる
        M->>M: フロー図の部品が grid に箱と線を置く
        M-->>P: 枠・層・凡例つきのフロー図と本文
        P-->>U: 文書を表示
    expected:
      - システムの枠の中に 3 つの層が上から LLM・処理・データの順に並び、層ごとに箱の色の背景が敷かれている
      - 外部のシステムの箱が枠の外にある
      - 題名・範囲・更新日と凡例があり、凡例には図に 2 種類以上あるノードの種類と線の種類だけが載る
      - 凡例に、システムの枠・層の背景・線の交差・ツールチップの印・用語の下線の項目が無い
      - システムの枠と LLM の層のタイトルの右にツールチップの印があり、`hint` を持たない層のタイトルには無い
      - 線の種類が色と模様（破線の間隔・太さ・矢じり）の組で分かれている
      - 残った交差は横の線が縦の線を飛び越える形（line jump）で描かれている
      - ループの戻りの線が上か下の帯を通る破線で、戻り先のラベルを持つ
      - '`window.__mdmarkScriptRan` が `true` になっていない（文書に書いた `<script>` が動いていない）'
      - 色分けのライブラリへの要求が 0 件（図の部品の定義の `json` のコードブロックは色分けの対象にならない）
    test: test_normal
  - name: 正常シナリオ（シーケンス図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: シーケンス図の定義を持つ Markdown
        description: 登場する相手 3 つとメッセージ 4 つ、ループの戻り 1 本を持つシーケンス図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: シーケンス図の部品が相手とメッセージを左から右へ置く
        M-->>P: 題と凡例つきのシーケンス図と本文
        P-->>U: 文書を表示
    expected:
      - 相手が定義の順に左から右へ並び、メッセージが時刻の順に並ぶ
      - ループの戻りが破線と戻り先のラベルで描かれている
      - 題名・範囲・更新日と凡例があり、凡例には図に 2 種類以上ある相手の種類と線の種類だけが載る
    test: test_normal_when_sequence
  - name: 正常シナリオ（グラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: グラフの定義を持つ Markdown
        description: 系列 2 つ・点 5 つずつの折れ線のグラフの部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: グラフの部品が系列を描く
        M-->>P: 題と凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 2 つの系列が、色と線の模様の組で分かれて描かれている
      - 題名と、系列の名前を載せた凡例がある
    test: test_normal_when_graph
  - name: 異常シナリオ（定義を読めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読めない定義を持つ Markdown
        description: JSON として読めないフロー図の定義 1 つと、正しいフロー図の定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 部品の定義を読んで形を確かめる
        M-->>P: 読めない定義の場所に書き方の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読めない定義の場所に書き方の警告があり、読めない箇所が書かれている
      - 正しい定義のフロー図が描かれている
      - 段落が描かれている
    test: test_error_when_definition_invalid
  - name: 正常シナリオ（棒のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 棒のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が棒・系列 2 つ・項目 4 つで、縦の軸の範囲を書かない定義を置く文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: データから縦の軸の目盛りを切り、棒を描く
        M-->>P: 題と凡例つきの棒のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 系列 2 つを色と模様の組で分けた棒が、項目 4 つ分描かれている
      - 縦の軸の目盛りが、データの最小と最大を含む 1・2・5×10 のべき乗の刻みで切られている
      - 題名と、系列の名前を載せた凡例がある
      - グラフは `role="img"` と、題名と系列の値を書いた読み上げの名前を持つ
    test: test_normal_when_bar
  - name: 正常シナリオ（円のグラフ）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 円のグラフの定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が円で項目 3 つの定義を置く文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 項目の値の割合で扇形を描く
        M-->>P: 題と凡例つきの円のグラフと本文
        P-->>U: 文書を表示
    expected:
      - 項目 3 つの扇形が、値の割合の角度で、色と模様の組で分けて描かれている
      - 凡例に項目の名前が並ぶ
    test: test_normal_when_pie
  - name: 正常シナリオ（散布図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 散布図の定義を持つ Markdown
        description: '`<!-- chart -->` の範囲に、種類が散布図で系列 1 つ・点 6 つ（横と縦がどちらも数値）の定義を置く文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 横と縦の両方の軸の目盛りを切り、点を置く
        M-->>P: 題と凡例つきの散布図と本文
        P-->>U: 文書を表示
    expected:
      - 点 6 つが、横と縦の値の位置に系列の点の印で置かれている
      - 横と縦の両方の軸に、数値の目盛りがある
    test: test_normal_when_scatter
  - name: 正常シナリオ（判定フローチャート）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 判定フローチャートの定義を持つ Markdown
        description: フロー図の部品の定義に、判定フローチャートの種類のノードだけを置いた文書
        notes: 開始のノード 1 つ・質問のノード 2 つ・アクションのノード 1 つ・結果のノード 2 つを上から下へ置き、質問のノードから出る線に `YES`・`NO` のラベルを付ける。システムの枠と層を持たず、題名・範囲・更新日を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 部品の定義を読んで形を確かめる
        M->>M: フロー図の部品が開始・質問・アクション・結果のノードを種類ごとの形で置く
        M-->>P: 凡例つきの判定フローチャートと本文
        P-->>U: 文書を表示
    expected:
      - 書き方の警告が出ず、開始のノード 1 つ・質問のノード 2 つ・アクションのノード 1 つ・結果のノード 2 つが描かれている
      - 開始・質問・アクション・結果のノードが、色だけでなく互いに異なる形・アイコン・種類の名前で見分けられる
      - 質問のノードから出る線に `YES`・`NO` のラベルがある
      - 凡例のノードの種類の項目が開始・質問・アクション・結果の 4 つだけで、「意思決定モデル」「データ」が出ていない
    test: test_normal_when_flowchart
  - name: 正常シナリオ（追加したグラフの種類）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 追加した種類のグラフの定義を持つ Markdown
        description: 面・積み上げの棒・積み上げの面・横棒・ドーナツ・レーダー・バブル・折れ線と棒の組み合わせの 8 つのグラフの部品の定義を、系列 2 つずつで記載した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: グラフの部品が種類ごとに系列を描く
        M-->>P: タイトルと凡例つきの 8 つのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 8 つの定義の場所に、それぞれの種類のグラフが図の枠に載って描かれている
      - 積み上げの棒と面は、同じ項目の系列の値を積み上げた高さで描かれている
      - 折れ線と棒の組み合わせは、系列ごとに指定した折れ線と棒で同じ軸に描かれている
      - 各グラフにタイトルと、系列の名前を載せた凡例がある
      - 書き方の警告が無い
    test: test_normal_when_more_chart_types
  - name: 正常シナリオ（5 つ以上の系列）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 系列の多いグラフの定義を持つ Markdown
        description: 系列 6 つ・点 5 つずつの折れ線のグラフと、系列 6 つの棒のグラフの部品の定義を記載した文書
      - name: Mock
        description: 正常シナリオと同じ。ライトとダークの両方の配色で描く
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 系列ごとに色・点のマーカー・塗りの模様の組を当てる
        M-->>P: タイトルと凡例つきのグラフと本文
        P-->>U: 文書を表示
    expected:
      - 6 つの系列が全て描かれ、凡例に 6 つの系列の名前がある
      - 6 つの系列の色・点のマーカー・塗りの模様の組が互いに異なる
      - ライトとダークのどちらの配色でも、系列の色が背景と見分けられる
    test: test_normal_when_many_series
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: ER 図の定義を持つ Markdown
        description: テーブル 3 つ（物理名と論理名）と、主キー・外部キー・NOT NULL の列を持つ列の一覧、1 対多の関係 2 本（ラベルつき）を記載した ER 図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: ER 図の部品がテーブルと関係を配置する
        M-->>P: タイトルと凡例つきの ER 図と本文
        P-->>U: 文書を表示
    expected:
      - 3 つのテーブルが、物理名と論理名を持つノードとして描かれている
      - 各テーブルに列の名前と型が並び、主キー・外部キー・NOT NULL の列にそれぞれのマーカーがある
      - 2 本の関係が、元と先のテーブルを結ぶ線と、両端の多重度のマーカーとラベルで描かれている
      - ER 図が図の枠に載り、タイトルとマーカーの意味の凡例がある
    test: test_normal_when_er_diagram
  - name: 異常シナリオ（ER 図の定義を読めない）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 読めない ER 図の定義を持つ Markdown
        description: 定義に無いテーブルを関係の先に指定した ER 図の定義 1 つと、正しい ER 図の定義 1 つと段落を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: ER 図の定義を読んで構造を確認する
        M-->>P: 読めない定義の場所に書き方の警告、ほかは図と本文を描く
        P-->>U: 警告と図と本文を表示
    expected:
      - 読めない定義の場所に書き方の警告があり、関係の先のテーブルが定義に無いことが記載されている
      - 正しい定義の ER 図が描かれている
      - 段落が描かれている
    test: test_error_when_er_definition_invalid
  - name: 正常シナリオ（種類が 1 つずつの図）
    setup:
      - name: 図を描くページ
        description: 正常シナリオと同じ
      - name: 種類が 1 つずつのフロー図の定義を持つ Markdown
        description: 同じ種類のノード 3 つを同じ種類の線 2 本でつなぎ、システムの枠と層を持たないフロー図の部品の定義の文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 図に 2 種類以上あるノードの種類と線の種類を数える
        M-->>P: 凡例の項目を持たないフロー図と本文
        P-->>U: 文書を表示
    expected:
      - ノード 3 つと線 2 本のフロー図と題名が描かれている
      - 凡例にノードの種類と線の種類の項目が無い
    test: test_normal_when_single_kinds
lead: 文書を書く人が、文書に部品の定義（JSON）だけを書き、mdmark の共通の図の部品にフロー図・シーケンス図・グラフ・ER 図を描かせる。部品は図の見た目の決まり（枠と 3 層・時系列とループ・題と凡例・線の交差）のとおりに描く。
issue: 21
primary_actor: 文書を書く人（AI を含む）
stakeholders:
  - name: 文書を書く人
    interest: HTML と CSS を一から書かずに、部品の定義だけで見た目のそろった図を描ける
  - name: 読む人
    interest: どの文書の図も同じ決まりで描かれ、凡例で色・形・線の意味を読める
trigger: 使う側のページが、図の部品の定義を持つ文書を描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
success_guarantee: 部品の定義の場所に、決まりのとおりの図が描かれる。文書に書いたスクリプトは動かない。
minimal_guarantee: 定義を読めない図の場所には書き方の警告が出て、ほかの本文と図は描かれる。
test_file: tests/e2e/単一ユースケース/図を描く.spec.ts
