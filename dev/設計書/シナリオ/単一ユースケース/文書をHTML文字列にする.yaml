title: "文書をHTML文字列にする"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 配布物を読む Node の処理
        description: ビルドした `dist/index.js` を読む Node のスクリプト。DOM を持たない
      - name: 見本の Markdown
        description: '見出し・段落・リスト・表・コードブロック・リンク・折り畳み（`details`）・`<!-- features: +a -b -->`・`script` 要素を持つ文書'
      - name: Mock
        description: 差し替える依存は無い（手元の `dist/` を読む）
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: Markdown を渡して HTML 文字列にさせる
        M->>M: Markdown を解析し、印を拾う
        M->>M: スクリプトを落とす
        M-->>C: HTML 文字列
    expected:
      - 見出し・段落・リスト・表・コードブロック・リンク・折り畳みの要素を持つ HTML 文字列が返る
      - 文字列に `script` 要素と印の文字（`<!--`）が無い
    test: test_normal
  - name: 正常シナリオ（ブラウザで呼ぶ）
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` を読む HTML
      - name: 見本の Markdown
        description: 正常シナリオと同じ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: Markdown を渡して HTML 文字列にさせる
        M-->>P: HTML 文字列
    expected:
      - ブラウザで返った HTML 文字列が、正常シナリオで Node が返した文字列と一致する
      - ページの描く先の要素は変わらない（画面に描かない）
    test: test_normal_when_in_browser
  - name: 正常シナリオ（記法を持つ文書）
    setup:
      - name: 配布物を読む Node の処理
        description: 正常シナリオと同じ
      - name: 記法を持つ Markdown
        description: '表の印で囲んだ表、2 つの中身を持つタブの範囲、`> [!WARNING]` の注意書き、`<!-- section: closed -->` の節、`<!-- fig: arch -->` の図と `[図](#fig-arch)` のリンク、`script` 要素を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: Markdown を渡して HTML 文字列にさせる
        M->>M: 印と記法を読んで HTML にする
        M->>M: スクリプトを落とす
        M-->>C: HTML 文字列
    expected:
      - 文字列にタブの 2 つの中身と、閉じた節の中身がともにある
      - 注意書きが class `markdown-alert markdown-alert-warning` の要素になっている
      - 見出しが GitHub と同じ規則の ID を持ち、図に `図 1` の番号と、リンクの文字に `図 1` がある
      - 文字列に `script` 要素と印の文字（`<!--`）が無い
    test: test_normal_when_syntax
  - name: 正常シナリオ（索引を渡す）
    setup:
      - name: 配布物を読む Node の処理
        description: ビルドした `dist/index.js` を読み、索引・描く文書の `id`・ほかの文書から算出した参照を渡して HTML 文字列にする
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース`（意味 `話し合いの記録を置くフォルダ`）を持ち、文書 `api`（題 `API`）の `related` が描く文書を指す索引
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: 索引・文書の id・参照・Markdown を渡して HTML 文字列にさせる
        M-->>C: 用語の意味と被参照の一覧を持つ HTML 文字列
    expected:
      - 文字列に、`ワークスペース` の下線の要素と、意味 `話し合いの記録を置くフォルダ` を持つ要素がある
      - 文字列に、`API` へのリンクを持つ被参照の一覧がある
      - 文字列に `script` 要素と印の文字（`<!--`）が無い
    test: test_normal_when_index
lead: 使う側（書き出し・ビルドの処理やサーバー）が、画面を持たずに Markdown を mdmark で HTML 文字列にする。ブラウザでも Node でも同じ文字列を返す。
issue: 3
primary_actor: mdmark で HTML を書き出す使う側の処理
stakeholders:
  - name: 書き出し・ビルドの CLI の開発者
    interest: ブラウザを起動せずに、ページで描くのと同じ本文の HTML を得られる
trigger: 使う側の処理が、Markdown を HTML 文字列にする公開関数を呼ぶ
preconditions:
  - 使う側の処理が mdmark の配布物の JavaScript を読んでいる
success_guarantee: ページで描くのと同じ本文の HTML 文字列が返る。文字列にスクリプトは含まれない。
test_file: tests/e2e/単一ユースケース/文書をHTML文字列にする.spec.ts
