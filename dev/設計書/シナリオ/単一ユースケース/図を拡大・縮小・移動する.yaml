title: "図を拡大・縮小・移動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『図を描く』の正常シナリオのフロー図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: 右上の縮小のボタンを押す
        D-->>U: 倍率を下げて表示
        U->>D: 図にフォーカスして + を押す
        D-->>U: 倍率を上げて表示
        U->>D: - を押す
        D-->>U: 倍率を下げて表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
    expected:
      - 開いたとき、図の全体が表示する枠の中に収まっている
      - 拡大のボタンと `+` で倍率が上がり、縮小のボタンと `-` で倍率が下がる
      - '`0` で開いたときの倍率と位置に戻る'
      - 拡大・縮小・戻すのボタンが図の右上にあり、それぞれ読み上げの名前を持つ
    test: test_normal
  - name: 正常シナリオ（ホイール）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ。図の下にも段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        participant P as 文書
        U->>D: 図の上でホイールを回す
        D->>P: 倍率を変えずスクロールを渡す
        P-->>U: 文書が縦にスクロールする
        U->>D: Shift を押しながらホイールを回す
        D-->>U: 図を横に動かす
    expected:
      - 図の上のホイールで図の倍率が変わらず、文書が縦にスクロールする
      - Shift とホイールで、図が横に動く
    test: test_normal_when_wheel
  - name: 正常シナリオ（ドラッグと文字の選択）
    setup:
      - name: 拡大した図
        description: 正常シナリオの図を拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 箱の外の余白を押したまま動かす
        D-->>U: 図を動かしただけ動かし、文字を選ばない
        U->>D: 箱の文字の上で押したまま動かす
        D-->>U: 図を動かさず、文字を選ぶ
    expected:
      - 余白の上ではカーソルが動かせる形で、ドラッグした分だけ図が動く
      - ドラッグ中は文字が選ばれない
      - 文字の上ではカーソルが I の形で、ドラッグした範囲の文字が選ばれ、図は動かない
    test: test_normal_when_drag
  - name: 正常シナリオ（矢印キーとボタンで動かす）
    setup:
      - name: 拡大した図
        description: 正常シナリオ（ドラッグと文字の選択）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 図にフォーカスして→を押す
        D-->>U: 図を左へずらして右側を見せる
        U->>D: 移動のボタン（↓）を押す
        D-->>U: 図を上へずらして下側を見せる
    expected:
      - 矢印キーで、押した向きの先が見えるように図が動く
      - 移動のボタンでも同じだけ図が動き、ボタンは読み上げの名前を持つ
      - キーボードだけで図へフォーカスでき、フォーカスの枠が見える
    test: test_normal_when_keyboard
lead: 読む人が、図の右上のボタンとキーで図を拡大・縮小し、ドラッグ・矢印キー・ボタンで動かす。文字の上では文字を選べ、ホイールは文書のスクロールに使う。フロー図・シーケンス図・グラフの共通の操作。
issue: 21
primary_actor: 読む人
trigger: 読む人が、図の全体と細部を見比べたくなる
preconditions:
  - 文書に図が描かれている（『図を描く』）
success_guarantee: ボタン・キー・ドラッグのどれでも図の倍率と位置が変わり、文書のスクロールと文字の選択は妨げられない。
minimal_guarantee: 倍率は下限と上限を超えない。`0` でいつでも全体が収まる倍率と位置に戻れる。
test_file: tests/e2e/単一ユースケース/図を拡大・縮小・移動する.spec.ts
