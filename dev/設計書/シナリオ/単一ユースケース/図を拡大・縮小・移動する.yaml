title: 図を拡大・縮小・移動する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『図を描く』の正常シナリオのフロー図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: 右上の縮小のボタンを押す
        D-->>U: 倍率を下げて表示
        U->>D: 図にフォーカスして + を押す
        D-->>U: 倍率を上げて表示
        U->>D: - を押す
        D-->>U: 倍率を下げて表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
        U->>D: 拡大のボタンを押してから、右上の倍率の表示を押す
        D-->>U: 開いたときの倍率と位置に戻す
    expected:
      - 開いたとき、図の全体が表示する枠の中に収まっている
      - 拡大のボタンと `+` で倍率が上がり、縮小のボタンと `-` で倍率が下がる
      - '`0` と、右上の倍率の表示を押すことで、開いたときの倍率と位置に戻る'
      - 拡大・縮小のボタンと倍率の表示のボタンが図の右上にあり、それぞれ読み上げの名前を持つ。戻すための別のボタンは無い
    test: test_normal
  - name: 正常シナリオ（ホイール）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ。図の下にも段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        participant P as 文書
        U->>D: 図の上でホイールを回す
        D->>P: 倍率を変えずスクロールを渡す
        P-->>U: 文書が縦にスクロールする
        U->>D: Shift を押しながらホイールを回す
        D-->>U: 図を横に動かす
    expected:
      - 図の上のホイールで図の倍率が変わらず、文書が縦にスクロールする
      - Shift とホイールで、図が横に動く
    test: test_normal_when_wheel
  - name: 正常シナリオ（ドラッグと文字の選択）
    setup:
      - name: 拡大した図
        description: 正常シナリオの図を拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 箱の外の余白を押したまま動かす
        D-->>U: 図を動かしただけ動かし、文字を選ばない
        U->>D: 箱の文字の上で押したまま動かす
        D-->>U: 図を動かさず、文字を選ぶ
    expected:
      - 余白の上ではカーソルが動かせる形で、ドラッグした分だけ図が動く
      - ドラッグ中は文字が選ばれない
      - 文字の上ではカーソルが I の形で、ドラッグした範囲の文字が選ばれ、図は動かない
    test: test_normal_when_drag
  - name: 正常シナリオ（矢印キーとボタンで動かす）
    setup:
      - name: 拡大した図
        description: 正常シナリオ（ドラッグと文字の選択）と同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 図にフォーカスして→を押す
        D-->>U: 図を左へずらして右側を見せる
        U->>D: 移動のボタン（↓）を押す
        D-->>U: 図を上へずらして下側を見せる
    expected:
      - 矢印キーで、押した向きの先が見えるように図が動く
      - 移動のボタンでも同じだけ図が動き、ボタンは読み上げの名前を持つ
      - キーボードだけで図へフォーカスでき、フォーカスの枠が見える
    test: test_normal_when_keyboard
  - name: 正常シナリオ（埋め込んだ HTML の中のチャート）
    setup:
      - name: チャートを描いたページ
        description: 『チャートを描く』の正常シナリオの棒のチャートを、同じ HTML の中の段落と一緒に描いたページ。チャートの下にも文書の段落が続き、文書が縦にスクロールできる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as チャート
        participant P as 文書
        U->>D: 右上の拡大のボタンを押す
        D-->>U: 倍率を上げて表示
        U->>D: チャートにフォーカスして - と 0 を押す
        D-->>U: 倍率を下げ、全体が収まる倍率に戻す
        U->>D: 拡大してからドラッグする
        D-->>U: チャートを動かして表示
        U->>D: チャートの上でホイールを回す
        D->>P: 倍率を変えずスクロールを渡す
        P-->>U: 文書が縦にスクロールする
    expected:
      - 拡大のボタンで倍率が上がり、`-` で下がり、`0` で開いたときの倍率と位置に戻る
      - 拡大した後のドラッグでチャートの位置が動く
      - ホイールでは倍率が変わらず、文書がスクロールする
      - 拡大してもチャートの線と文字が SVG のまま描かれ、ぼやけない
      - 同じ HTML の中の段落には、拡大・縮小のボタンが無い
    test: test_normal_when_embedded_chart
  - name: 正常シナリオ（ER 図）
    setup:
      - name: 図を描いたページ
        description: 『図を描く』の正常シナリオ（ER 図）の ER 図を描いたページ
        notes: 図の幅は表示する枠の幅より広い
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全体が収まる倍率で表示
        U->>D: 右上の拡大のボタンを押し、図をドラッグする
        D-->>U: 倍率を上げ、動かした位置で表示
        U->>D: 右上の全画面のボタンを押す
        D-->>U: 全画面で表示
        U->>D: 0 を押す
        D-->>U: 全体が収まる倍率に戻す
    expected:
      - 開いたとき、ER 図の全体が表示する枠の中に収まっている
      - 拡大のボタンで倍率が上がり、ドラッグで図が動く
      - 全画面のボタンで ER 図が全画面で表示される
      - '`0` で開いたときの倍率と位置に戻る'
      - 右上のボタンが、フロー図と同じ並びと読み上げの名前を持つ
    test: test_normal_when_er_diagram
  - name: 正常シナリオ（列の多いテーブルを畳む）
    setup:
      - name: 図を描いたページ
        description: 主キー 1 つ・外部キー 1 つと、ほかの列 10 個を持つテーブルを含む ER 図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: ページを開く
        D-->>U: 全ての列を出したテーブル
        U->>D: テーブルの列の開閉のボタンを押す
        D-->>U: 主キーと外部キーの列だけを出したテーブル
        U->>D: キーボードで同じボタンにフォーカスして Enter を押す
        D-->>U: 全ての列を出したテーブル
    expected:
      - 開いたとき、テーブルに 12 個の列が全て出ている
      - 開閉のボタンを押した後、主キーと外部キーの 2 つの列だけが出て、畳んだ列があることがテーブルに示されている
      - 開閉のボタンの `aria-expanded` が、列を全て出しているときは `true`、畳んでいるときは `false`
      - 開閉のボタンはキーボードで操作でき、関係の線はテーブルの高さの変化に合わせて結び直される
    test: test_normal_when_er_columns_folded
  - name: 正常シナリオ（リンク先を持つノードの上のドラッグ）
    setup:
      - name: 拡大した図
        description: 『図を描く』の正常シナリオ（リンク先を持つノード）の図を、拡大のボタンで 2 回拡大した状態
      - name: Mock
        description: 正常シナリオと同じ。リンク先への遷移を手元の応答で受け、開いた URL を記録する
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: リンク先を持つノードの上で押したまま動かす
        D-->>U: 図を動かした分だけ動かし、離してもリンク先を開かない
        U->>D: 同じノードを動かさずに押して離す
        D-->>U: ノードのリンク先を開く
    expected:
      - リンク先を持つノードの上から始めたドラッグで、動かした分だけ図が動く
      - ドラッグの後に離しても、リンク先が開かない
      - 動かさずに押して離すと、リンク先が開く
    test: test_normal_when_drag_on_linked_node
lead: 読む人が、図の右上のボタンとキーで図を拡大・縮小し、ドラッグ・矢印キー・ボタンで動かす。文字の上では文字を選べ、ホイールは文書のスクロールに使う。フロー図・シーケンス図・グラフと、埋め込んだ HTML の中のチャートの共通の操作。
issue: 21
primary_actor: 読む人
trigger: 読む人が、図の全体と細部を見比べたくなる
preconditions:
  - 文書に図が描かれている（『図を描く』）
success_guarantee: ボタン・キー・ドラッグのどれでも図の倍率と位置が変わり、文書のスクロールと文字の選択は妨げられない。
minimal_guarantee: 倍率は下限と上限を超えない。`0` でいつでも全体が収まる倍率と位置に戻れる。
test_file: tests/e2e/単一ユースケース/図を拡大・縮小・移動する.spec.ts
