title: "全項目を検索する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ビューを描いたページ
        description: 『ビューで項目を見る』の正常シナリオと同じページと文書（題・状態・担当の列と 5 行）を、表形式で開く `default=table` で描いたページ
        notes: 担当の列の値は上から `佐藤`・`鈴木`・`佐藤`・`田中`・`鈴木`
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        U->>P: 検索欄に「佐藤」を入れる
        P-->>U: 担当が佐藤の 2 件だけのビューと件数
        U->>P: 検索欄を空にする
        P-->>U: 5 件の項目
    expected:
      - '`佐藤` を入れた後、担当が `佐藤` の 2 行だけが表示され、検索欄の横に `2 件` と出る'
      - 件数は `aria-live` の領域にあり、変わるたびに読み上げられる
      - 検索欄を空にすると、5 行とも表示され、件数が `5 件` に戻る
    test: test_normal
  - name: 正常シナリオ（ボード表示で検索する）
    setup:
      - name: ビューを描いたページ
        description: 『ビューで項目を見る』の正常シナリオと同じページと文書（ボード表示で開く）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        U->>P: 検索欄に「鈴木」を入れる
        P-->>U: 担当が鈴木の項目だけのボード表示
        U->>P: 表形式に切り替える
        P-->>U: 担当が鈴木の行だけの表形式のビュー
    expected:
      - '`鈴木` を入れた後、ボード表示の `進行中` の列に 2 件だけが残り、`未着手`・`完了` の列は列ごと残って項目の数が 0 になる'
      - 表形式に切り替えても検索欄の文字が残り、担当が `鈴木` の 2 行だけが表示される
    test: test_normal_when_board
  - name: 正常シナリオ（大文字・小文字と全角・半角を区別しない）
    setup:
      - name: ビューを描いたページ
        description: 題の列に `API の設計` と `ＵＩ の調整` を持つ表をビューの印で囲んだ文書を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        U->>P: 検索欄に「api」を入れる
        P-->>U: API の設計の項目
        U->>P: 検索欄に「ui」を入れ直す
        P-->>U: ＵＩ の調整の項目
    expected:
      - '`api` で `API の設計` が残る'
      - '`ui` で全角の `ＵＩ の調整` が残る'
    test: test_normal_when_case_and_width_differ
  - name: 正常シナリオ（合う項目が無い）
    setup:
      - name: ビューを描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        U->>P: 検索欄に表に無い文字を入れる
        P-->>U: 合う項目が無いことの表示
    expected:
      - 項目が 1 つも表示されず、ビューの中に `合う項目はありません` と出る
      - 件数が `0 件` になる
      - ビューの切り替えと検索欄は使えるまま残る
    test: test_normal_when_no_match
  - name: 正常シナリオ（機能を外す）
    setup:
      - name: ビューを描いたページ
        description: '`features.search` を `false` にした設定で、正常シナリオと同じ文書を描いたページ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 検索の機能を外した設定と Markdown を渡して描かせる
        M-->>P: 検索欄の無いビュー
    expected:
      - ビューの上に検索欄と件数が出ない
      - ビューの切り替えは出る
    test: test_normal_when_disabled
lead: 読む人が、ビューの上の検索欄に文字を入れ、ビューの全ての項目を全ての列の文字で絞り込む。
issue: 8
primary_actor: 文書を読む人
stakeholders:
  - name: 読む人
    interest: 列を選ばずに、項目のどの列に書かれた文字でも探せ、何件合ったかが分かる
trigger: 読む人が、ビューの中から目当ての項目を探したくなる
preconditions:
  - ページが `mount` でビューの印を持つ文書を描いているか、使う側のページがビューを描く関数でビューを描いている
  - 検索の機能（`search`）がオン（既定）
success_guarantee: 入れた文字を全ての列に含む項目だけが残り、合った件数が出る。検索欄を空にすると全ての項目に戻る。
minimal_guarantee: 合う項目が無くても、ビューの切り替えと検索欄は使えるまま残る。
