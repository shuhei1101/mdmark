id: SC-472-22
title: セッションの開始で常駐サーバーの状態を受け取る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: unit で起動した常駐サーバー
        description: 端末の設定の unit の名前の systemd --user の unit で、`MDMARK_PORT` に空いたポートを指定して `mdmark serve` を起動している
        notes: 手元の常駐サーバーの unit（`mdmark-mcp`）とポート 8782 を回避するため、unit の名前はテスト専用の名前にし、テストの後に unit を止めて unit のファイルを削除する
      - name: Mock
        description: Claude Code の代わりに、プラグインの `hooks/hooks.json` の SessionStart のコマンドを実行し、`.mcp.json` の接続先へ HTTP でつなぐ MCP のクライアントを使用する。モデルは使用しない
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant H as SessionStart のフック
        participant S as 常駐サーバー
        C->>H: セッションの開始
        H->>S: ポートが待ち受けているか
        S-->>H: 待ち受けている
        H-->>C: 何も出さない・終了コード 0
        C->>S: initialize
        S-->>C: instructions
    expected:
      - SessionStart のフックが標準出力に何も出さず、終了コード 0 で終わる
      - '`initialize` の `instructions` に、常駐サーバーが systemd --user の unit で動いていること・unit の名前・ログを確認する操作（`journalctl --user -u {unit の名前}`）と、`global-setup` でもう一度起動できることがある'
    test: test_normal
  - name: 正常シナリオ（tmux のセッションで動いている）
    setup:
      - name: tmux のセッションで起動した常駐サーバー
        description: 手元と別の tmux サーバー（`TMUX_TMPDIR` を空の一時フォルダにする）の、端末の設定のセッション名のセッションで、`MDMARK_PORT` に空いたポートを指定して `mdmark serve` を起動している
        notes: 手元の常駐サーバーが使用する 8782 と手元の tmux のセッションを回避する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant H as SessionStart のフック
        participant S as 常駐サーバー
        C->>H: セッションの開始
        H->>S: ポートが待ち受けているか
        S-->>H: 待ち受けている
        H-->>C: 何も出さない・終了コード 0
        C->>S: initialize
        S-->>C: instructions
    expected:
      - SessionStart のフックが標準出力に何も出さず、終了コード 0 で終わる
      - '`initialize` の `instructions` に、端末の設定の tmux のセッション名と、`global-setup` でもう一度起動できることがある'
    test: test_normal_when_running_in_tmux
  - name: 異常シナリオ（起動していない）
    setup:
      - name: 止めた常駐サーバー
        description: '`MDMARK_PORT` に指定した空いたポートで待ち受けるプロセスが無い'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant H as SessionStart のフック
        participant S as 常駐サーバー
        C->>H: セッションの開始
        H->>S: ポートが待ち受けているか
        S-->>H: 接続を拒否された
        H-->>C: additionalContext の 1 行・終了コード 0
    expected:
      - SessionStart のフックが終了コード 0 で終わり、`additionalContext` に、常駐サーバーが `127.0.0.1:{ポート}` で待ち受けていないことと `/mdmark:global-setup` で起動できることを 1 行で出す
      - MCP のクライアントの接続が、接続を拒否されたエラー（`ECONNREFUSED`）で失敗する
    test: test_error_when_server_not_running
lead: Claude Code のセッションの開始で、mdmark のプラグインが常駐サーバーの状態を伝える。待ち受けていないときだけ SessionStart のフックで起動の仕方を伝え、起動しているときは MCP の `instructions` で、常駐サーバーが動いている systemd --user の unit か tmux のセッションを伝える。
issue: 165
primary_actor: Claude Code
stakeholders:
  - name: 文書の作成者
    interest: 常駐サーバーが落ちているときに、mdmark のツールが使用できない理由と起動の仕方がセッションの中で分かる
  - name: Claude Code
    interest: mdmark を使用しないセッションでも、常駐サーバーが起動しているときは何も入らない
trigger: 文書の作成者が Claude Code のセッションを開く
preconditions:
  - Claude Code に mdmark のプラグインを入れている
success_guarantee: 常駐サーバーが待ち受けているときは SessionStart のフックが何も出さず、`instructions` から常駐サーバーが動いている unit か tmux のセッションとログの確認方法が分かる。待ち受けていないときは、待ち受けていないことと `global-setup` での起動の仕方が 1 行で伝わる。
minimal_guarantee: SessionStart のフックはどの場合も終了コード 0 で終わり、セッションの開始を止めない。
test_file: tests/e2e/単一ユースケース/セッションの開始で常駐サーバーの状態を受け取る.spec.ts
