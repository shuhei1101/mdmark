title: シーケンスを構成図の上で再生する
lead: 読者が、map のシーケンス図を、同じノードを持つ構成図の上で 1 通ずつ、手で、または選んだ間隔で自動で進め、メッセージがどのノードからどのノードへ流れるかを読む。
issue: 324
test_file: tests/e2e/単一ユースケース/シーケンスを構成図の上で再生する.spec.ts
primary_actor: 読者
trigger: 読者が、処理の流れを構成図のどこを通るかで追いたくなる
preconditions:
  - 文書に、map の構成図と、補足の `plays_over` でその構成図を指す map のシーケンス図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: メッセージが記載の順に、構成図の送り手のノードから受け手のノードへの線に沿って印が繰り返し動き、帯にメッセージの文が出る。再生を終えると始めた段へ戻る。
minimal_guarantee: 動きを減らす設定では動かさずに強調と文を出す。構成図に無い相手のメッセージは、文だけを出して書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 構成図と、構成図のノードと同じ ID の相手を持つシーケンス図（メッセージ 4 つ）を描いたページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        participant D as 構成図
        U->>S: 図の右上のツールの「構成図の上で再生」を押す
        S->>D: 構成図を画面に入れ、再生の帯を出す
        D-->>U: メッセージ 1 の線に印を繰り返し動かし、文を出す
        U->>D: 帯の間隔で「1 秒ごと」を選ぶ
        D-->>U: 1 秒ごとに次のメッセージへ進める
        U->>D: 一時停止を押す
        D-->>U: 自動で進めるのを止める
        U->>D: 次へを押す
        D-->>U: メッセージ 2 へ進める
        U->>D: 再生を終えるを押す
        D-->>U: 帯を閉じ、強調を外す
    expected:
      - 再生を始めると、構成図が画面に入り、図の下に再生の帯が出る
      - メッセージごとに、送り手と受け手のノードが強調され、印が送り手から受け手へ線に沿って、次のメッセージへ進むまで繰り返し動き、帯に今の番号（1 / 4）とメッセージの文が出る
      - 選んだ間隔（1・2・3・5 秒。既定は 2 秒）ごとに次のメッセージへ進み、一時停止で自動で進めるのが止まり、次へ・前へで 1 通ずつ進め戻せる
      - 帯の操作はアイコンのボタンで、スクリーンリーダー向けの名前を持つ
      - 再生・一時停止・次へ・前へを押しても、図の倍率と図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
      - 最後のメッセージの次は最初のメッセージへ戻り、一時停止するまで繰り返す
      - 再生を終えると、帯と強調が消え、再生を始めた段の図に戻る
    test: test_normal
  - name: 正常シナリオ（動きを減らす設定）
    setup:
      - name: 図を描いたページ
        description: '正常シナリオと同じ。ブラウザのコンテキストを `prefers-reduced-motion: reduce` で開く'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 再生を始める
        D-->>U: 印を動かさず、送り手と受け手の強調と文だけを出す
    expected:
      - 印が線に沿って動かず、送り手と受け手のノードと、その間の線が強調される
      - 帯に今の番号とメッセージの文が出る
    test: test_normal_when_reduced_motion
  - name: 正常シナリオ（構成図に無い相手がある）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図に、構成図に無い相手から送るメッセージを 1 つ足した文書を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 再生を始めて、無い相手のメッセージまで進める
        D-->>U: 強調も動きも出さずに、メッセージの文を出す
    expected:
      - シーケンス図の図の枠の上に、構成図に無い相手である旨の書き方の警告がある
      - 無い相手のメッセージでは、構成図のノードが強調されず、帯にメッセージの文が出る
      - ほかのメッセージは正常シナリオと同じく動く
    test: test_normal_when_missing_participant
  - name: 正常シナリオ（印の引数で自動で再生する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図の印に `play=autoplay` を持つ文書を描いたページ。シーケンス図は文書の 2 画面目より下にある
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        participant D as 構成図
        U->>S: 文書をスクロールしてシーケンス図を画面に入れる
        S->>D: 構成図の上で再生を始める
        D-->>U: メッセージ 1 から順に動かす
    expected:
      - シーケンス図が画面に入るまで、再生が始まらない
      - シーケンス図が画面に入ると、押さずに再生が始まり、再生の帯が出る
      - '`play` を持たない正常シナリオの図は、押すまで再生しない'
    test: test_normal_when_autoplay
