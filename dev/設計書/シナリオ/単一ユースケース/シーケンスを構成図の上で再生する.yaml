title: シーケンスを構成図の上で再生する
lead: 読者が、map のシーケンス図を、同じノードを持つ構成図の上で 1 通ずつ、手で、または印の引数 `interval` の間隔で自動で進め、メッセージがどのノードからどのノードへ流れるかを読む。
issue: 324
test_file: tests/e2e/単一ユースケース/シーケンスを構成図の上で再生する.spec.ts
primary_actor: 読者
trigger: 読者が、処理の流れを構成図のどこを通るかで追いたくなる
preconditions:
  - 文書に、map の構成図と、補足の `plays_over` でその構成図を指す map のシーケンス図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: メッセージが記載の順に、構成図とシーケンス図の今のメッセージの線に沿って、データの印が送り手から受け手へ流れ続け、帯にメッセージの文が出る。再生を終えると始めた段へ戻る。
minimal_guarantee: 動きを減らす設定でも、読者が始めた再生のデータの印は流し、停止で止められる。印の引数の自動の再生は、動きを減らす設定では止めた状態で始める。構成図に無い相手のメッセージは、文だけを出して書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 構成図と、構成図のノードと同じ ID の相手を持つシーケンス図（メッセージ 4 つ）を描いたページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        participant D as 構成図
        U->>S: シーケンス図の下の帯の自動で進めるを押す
        S->>D: メッセージ 1 を構成図の上でも強調する
        D-->>U: 構成図とシーケンス図のメッセージ 1 の線にデータの印を流し、文を出す
        D-->>U: 印の引数 interval の間隔ごとに次のメッセージへ進める
        U->>D: 一時停止を押す
        D-->>U: 自動で進めるのを止める
        U->>D: 次へを押す
        D-->>U: メッセージ 2 へ進める
        U->>D: 停止を押す
        D-->>U: 帯を閉じ、強調を外す
    expected:
      - シーケンス図の下に、開いたときから再生の帯（メッセージの数（– / 4）と前へ・停止・自動で進める・次へ）がある。帯の文は今のメッセージの文と、補足の `notes` の説明を改行のまま出す
      - 帯で進めたメッセージが、シーケンス図と構成図の両方で強調され、構成図の案内を始めるとシーケンス図の強調が解ける
      - メッセージごとに、送り手と受け手のノードが強調され、データの印が構成図とシーケンス図の線の上を送り手から受け手へ、次のメッセージへ進むまで流れ続け、帯に今の番号（1 / 4）とメッセージの文が出る
      - 印の引数 `interval` の間隔（省くと 2 秒）ごとに次のメッセージへ進み、一時停止で自動で進めるのが止まり、次へ・前へで 1 通ずつ進め戻せ、最初の前へで最後へ、最後の次へで最初へ回る。画面に間隔を変える部品は無い
      - 帯の右端に、前へ・停止・自動で進める（一時停止）・次への 4 つのボタンが、再生の前後と途中で同じ位置に並ぶ
      - 構成図とシーケンス図の両方で、今のメッセージの線と送り手・受け手の表示は変わらず、ほかが薄くなる
      - 自動で進めている間は、送り手と受け手のノードの中心へ図の枠の中がスクロールし、図の枠を触ると自動で進め直すまでスクロールしない。前へ・次へで進めたときはスクロールしない
      - 帯の操作はアイコンのボタンで、スクリーンリーダー向けの名前を持つ
      - 再生・一時停止・次へ・前へを押しても、図の倍率と図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
      - 最後のメッセージの次は最初のメッセージへ戻り、一時停止するまで繰り返す
      - 停止を押すと、帯と強調が消え、再生を始めた段の図に戻る
    test: test_normal
  - name: 正常シナリオ（動きを減らす設定）
    setup:
      - name: 図を描いたページ
        description: '正常シナリオと同じ。ブラウザのコンテキストを `prefers-reduced-motion: reduce` で開く'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 再生を始める
        D-->>U: 送り手と受け手を強調し、線の上にデータの印を流す
    expected:
      - 動きを減らす設定でも、データの印が送り手から受け手へ線の上を流れ、送り手と受け手のノードとその間の線が強調される
      - 停止を押すと、データの印が止まって消える
      - 帯に今の番号とメッセージの文が出る
    test: test_normal_when_reduced_motion
  - name: 正常シナリオ（構成図に無い相手がある）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図に、構成図に無い相手から送るメッセージを 1 つ足した文書を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 再生を始めて、無い相手のメッセージまで進める
        D-->>U: 強調も動きも出さずに、メッセージの文を出す
    expected:
      - シーケンス図の図の枠の上に、構成図に無い相手である旨の書き方の警告がある
      - 無い相手のメッセージでは、構成図のノードが強調されず、帯にメッセージの文が出る
      - ほかのメッセージは正常シナリオと同じく動く
    test: test_normal_when_missing_participant
  - name: 正常シナリオ（印の引数で自動で再生する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図の印に `{"play": "autoplay"}` を持つ文書を描いたページ。シーケンス図は文書の 2 画面目より下にある
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant S as シーケンス図
        participant D as 構成図
        U->>S: 文書をスクロールしてシーケンス図を画面に入れる
        S->>D: 自動で進めるを始める
        D-->>U: メッセージ 1 から順に動かす
    expected:
      - シーケンス図が画面に入るまで、再生が始まらない
      - シーケンス図が画面に入ると、押さずに再生が始まり、再生の帯が出る
      - 動きを減らす設定（`prefers-reduced-motion: reduce`）では、シーケンス図が画面に入っても自動で始めず、再生の帯を止めた状態で出し、再生を押すとデータの印が流れる
      - '`play` を持たない正常シナリオの図は、押すまで再生しない'
    test: test_normal_when_autoplay
  - name: 正常シナリオ（印の引数で間隔を指定する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのシーケンス図を 2 つ持つ文書を描いたページ。1 つ目の印に `{"interval": 1}`、2 つ目の印に `{"interval": "abc"}` を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as 構成図
        U->>D: 1 つ目のシーケンス図の再生を自動で進める
        D-->>U: 1 秒ごとに次のメッセージへ進める
        U->>D: 2 つ目のシーケンス図の再生を自動で進める
        D-->>U: 既定の 2 秒ごとに次のメッセージへ進める
    expected:
      - '`{"interval": 1}` の図は、1 秒ごとに次のメッセージへ進む'
      - '`{"interval": "abc"}` の図の枠の上に、`interval` の値を読めない旨の書き方の警告があり、既定の 2 秒ごとに次のメッセージへ進む'
    test: test_normal_when_interval
