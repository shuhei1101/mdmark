title: "操作できる部品で値を変えて写す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 操作できる部品を描いたページ
        description: スライダー 1 つ（範囲 0〜10、既定 5）・その値で線を引くグラフ・今の値を写すボタンを組み合わせた部品の定義の文書を描いたページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。クリップボードの読み書きを許したブラウザのコンテキストで開く
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant C as 操作できる部品
        participant B as クリップボード
        U->>C: スライダーを 7 に動かす
        C-->>U: グラフを 7 で描き直す
        U->>C: スライダーにフォーカスして→を押す
        C-->>U: グラフを 8 で描き直す
        U->>C: 今の値を写すボタンを押す
        C->>B: 今の値を JSON で書く
        C-->>U: 写したことを知らせる
    expected:
      - スライダーを動かすと、グラフが新しい値で描き直される
      - クリップボードの中身が、スライダーの名前と今の値 8 を持つ JSON として読める
      - ボタンのそばに写したことが出る
      - スライダーは矢印キーでも動かせ、読み上げの名前と今の値を持つ
    test: test_normal
  - name: 異常シナリオ（クリップボードへ書けない）
    setup:
      - name: 操作できる部品を描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: クリップボードの書き込みを許さないブラウザのコンテキストで開く。ほかは正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant C as 操作できる部品
        participant B as クリップボード
        U->>C: 今の値を写すボタンを押す
        C->>B: 今の値を JSON で書く
        B-->>C: 書き込みを拒む
        C-->>U: 書けなかったことと、選んで写せる JSON を出す
    expected:
      - ボタンのそばに、クリップボードへ書けなかったことが出る
      - 写すはずだった JSON が、選んで写せる文字として出る
      - スライダーとグラフは操作できるまま
    test: test_error_when_clipboard_denied
lead: 読む人が、文書のスライダーで値を変えてグラフの変わり方を見、「今の値を写す」ボタンで値を JSON にしてクリップボードへ写す。
issue: 21
primary_actor: 読む人
trigger: 読む人が、パラメーターを変えたときの動きを確かめ、決めた値を他の場所へ貼りたくなる
preconditions:
  - 文書にスライダー・グラフ・今の値を写すボタンを組み合わせた部品の定義がある
success_guarantee: スライダーの今の値がグラフに当たり、写した JSON が画面の値と一致する。
minimal_guarantee: クリップボードへ書けないときは、ボタンのそばに書けなかったことを出し、写すはずだった JSON を選んで写せる形で見せる。
