title: "文書の先頭へ戻る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
        notes: 画面の大きさは 1280×800px。画面全体がスクロールする
      - name: 長い Markdown
        description: '`## 導入` から `## 付録` まで 10 個の見出しと、画面の高さの 3 倍を超える段落を持つ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 文書の末尾までスクロールする
        B->>M: スクロールの位置
        M-->>U: 画面の右下に先頭へ戻るボタンを出す
        U->>M: ボタンを押す
        M->>B: 描いた文書の先頭へスクロールする
        M->>M: 文書の先頭へフォーカスを移す
        M-->>U: 先頭へ戻るボタンを隠す
    expected:
      - 末尾までスクロールした後、先頭へ戻るボタンが画面の右下に表示されている
      - ボタンを押した後、描いた文書の先頭（`## 導入` の見出し）が画面に表示されている
      - ボタンを押した後、フォーカスが描いた文書の先頭にあり、続けて Tab を押すと本文の最初のフォーカスできる要素へ移る
      - 先頭へ戻った後、先頭へ戻るボタンが表示されていない
    test: test_normal
  - name: 正常シナリオ（先頭の近くでは出さない）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: 長い Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 文書を開く
        M-->>U: 先頭へ戻るボタンを出さない
        U->>B: 出し始める量より少なくスクロールする
        M-->>U: 先頭へ戻るボタンを出さない
    expected:
      - 文書を開いた直後、先頭へ戻るボタンが表示されておらず、Tab でも届かない
      - 出し始める量より少なくスクロールした後も、先頭へ戻るボタンが表示されていない
    test: test_normal_when_near_top
    notes:
      未確定: 出し始めるスクロールの量はモック作成で決める
  - name: 正常シナリオ（キーボードで押す）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: 長い Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 文書の末尾までスクロールする
        M-->>U: 先頭へ戻るボタンを出す
        U->>M: Tab でボタンへフォーカスを移し、Enter を押す
        M->>B: 描いた文書の先頭へスクロールする
        M-->>U: 文書の先頭を表示
    expected:
      - ボタンが、アクセシブルな名前「先頭へ戻る」を持つ `button` の役割で読み上げられる
      - ボタンにフォーカスの輪郭が表示されている
      - Enter を押した後、描いた文書の先頭が画面に表示されている
    test: test_normal_when_pressed_by_keyboard
  - name: 正常シナリオ（スクロールする祖先の要素の中に描いた文書）
    setup:
      - name: 祖先の要素の中に文書を描いたページ
        description: 高さ 600px で縦にスクロールする要素の中の描く先の要素に、文書を描いた HTML
        notes: 画面全体はスクロールしない
      - name: 長い Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        U->>P: スクロールする要素の中で文書の末尾までスクロールする
        M-->>U: 先頭へ戻るボタンを出す
        U->>M: ボタンを押す
        M->>P: スクロールする要素を描いた文書の先頭へスクロールする
        M-->>U: 文書の先頭を表示
    expected:
      - スクロールする要素の中で末尾までスクロールした後、先頭へ戻るボタンが表示されている
      - ボタンを押した後、スクロールする要素の `scrollTop` が描いた文書の先頭の位置になっている
    test: test_normal_when_scroll_container
    notes:
      未確定: スクロールする場所の扱い（要件.md の未確定の論点）はインターフェース定義設計で確定する
  - name: 正常シナリオ（右側の目次と重ならない）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
        notes: 設定の `side-toc.mode` は `fixed`。描いた後に目次を出すボタンを押し、右側の目次を出しておく
      - name: 長い Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 文書の末尾までスクロールする
        M-->>U: 先頭へ戻るボタンを出す
        U->>M: 右側の目次の最後の項目を押す
        M-->>U: 項目の節へ移る
    expected:
      - 先頭へ戻るボタンの矩形が、右側の目次のパネルと目次を出すボタンの矩形と重なっていない
      - 右側の目次の最後の項目を押せて、その節の見出しが画面に表示されている
    test: test_normal_when_side_toc_shown
  - name: 正常シナリオ（狭い幅）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
        notes: 画面の大きさは 390×844px
      - name: 長い Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 文書の末尾までスクロールする
        M-->>U: 先頭へ戻るボタンを出す
        U->>M: ボタンをタップする
        M->>B: 描いた文書の先頭へスクロールする
        M-->>U: 文書の先頭を表示
    expected:
      - 先頭へ戻るボタンが画面の中に収まり、横のスクロールが生じていない
      - ボタンのタップできる領域が 44×44px 以上ある
      - ボタンを押した後、描いた文書の先頭が画面に表示されている
    test: test_normal_when_narrow_width
lead: 読む人が描いた文書を一定量スクロールすると、画面の右下に先頭へ戻るボタンが出る。押すと描いた文書の先頭へ戻り、先頭の近くにいる間はボタンを出さない。
issue: 162
primary_actor: 文書を読む人
stakeholders:
  - name: キーボードと読み上げで読む人
    interest: Tab でボタンに届き、読み上げでボタンの用途が分かる
  - name: 使う側のアプリの開発者
    interest: 自分のページの部品と重ならず、要らないページでは機能をオフにできる
trigger: 読む人が、描いた文書を一定量スクロールした後にボタンを押す
preconditions:
  - ページが mdmark で文書を描いている
  - 先頭へ戻るボタンの機能がオン
success_guarantee: ボタンを押した後、描いた文書の先頭が画面に出ていて、フォーカスが文書の先頭にある。
minimal_guarantee: ボタンを出している間も、本文・右側の目次・余白のマーカー・ミニマップの操作は変わらない。
test_file: tests/e2e/単一ユースケース/文書の先頭へ戻る.spec.ts
