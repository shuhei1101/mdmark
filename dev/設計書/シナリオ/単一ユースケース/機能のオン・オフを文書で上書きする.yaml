title: "機能のオン・オフを文書で上書きする"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、設定を渡して文書を描く HTML
        notes: 設定の `features.print` は `true`
      - name: 機能を外す Markdown
        description: '先頭に `<!-- features: -print -->` を持ち、閉じた折り畳み（`details`）を持つ文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。印刷は、媒体を `print` にして印刷の前のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書の印を重ねる
        M-->>P: 印刷の機能をオフにして本文を描く
        U->>P: 印刷する
        P-->>U: 折り畳みは閉じたまま
    expected:
      - 印刷の前のイベントの後も、折り畳み（`details`）が閉じている
    test: test_normal
  - name: 正常シナリオ（設定でオフにした機能を文書でオンにする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features.print` は `false`
      - name: 機能を足す Markdown
        description: '先頭に `<!-- features: +print -->` を持ち、閉じた折り畳み（`details`）を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書の印を重ねる
        M-->>P: 印刷の機能をオンにして本文を描く
        U->>P: 印刷する
        P-->>U: 折り畳みを開いて出す
    expected:
      - 印刷の前のイベントの後、折り畳み（`details`）が開いている
    test: test_normal_when_enabled_by_mark
  - name: 正常シナリオ（印の無い文書）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features.print` は `false`
      - name: 印の無い Markdown
        description: 閉じた折り畳み（`details`）だけを持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 設定のとおり印刷の機能をオフにして本文を描く
        U->>P: 印刷する
        P-->>U: 折り畳みは閉じたまま
    expected:
      - 印刷の前のイベントの後も、折り畳み（`details`）が閉じている
    test: test_normal_when_no_mark
  - name: 正常シナリオ（知らない機能名）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 知らない機能名を書いた Markdown
        description: '先頭に `<!-- features: +unknown -->` を持ち、段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 知らない機能名を無視する
        M-->>P: 要素の中に本文を描く
        P-->>U: 段落を表示
    expected:
      - 段落が描かれている
      - 本文に印の文字が出ていない
    test: test_normal_when_unknown_feature
  - name: 正常シナリオ（記法の機能を外す）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features` は表・注意書きの機能を書かない（既定のオン）
      - name: 記法の機能を外す Markdown
        description: '先頭に `<!-- features: -table -callout -->` を持ち、`<!-- table: data -->` 〜 `<!-- /table -->` で囲んだ表と `> [!NOTE]` の引用を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書の印を重ねる
        M-->>P: 表と注意書きを普通の Markdown として描く
        P-->>U: 表と引用を表示
    expected:
      - 表に並べ替え・ピン止めのボタンが無い
      - 引用が注意書きの枠（class `markdown-alert`）にならず、引用として描かれている
      - 本文に印の文字が出ていない
    test: test_normal_when_syntax_disabled
  - name: 正常シナリオ（用語と被参照の機能を外す）
    setup:
      - name: mdmark を読むページ
        description: 索引・描く文書の `id`・ほかの文書から算出した参照・読み込んだエイリアスを渡して文書を描く。ほかは正常シナリオと同じ
        notes: 設定の `features` は `glossary`・`backlinks` を書かない（既定のオン）
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース`（`avoid` に `作業場`）を持ち、ほかの文書の `related` が描く文書を指す索引
        notes: '-'
      - name: エイリアス
        description: '`command` の `単体テスト`（コマンド `npm run test:unit`）'
        notes: '-'
      - name: 機能を外す Markdown
        description: '先頭に `<!-- features: -glossary -backlinks -->` を持ち、段落に `ワークスペース`・やめた言い方 `作業場`・`単体テスト` が出て、`<!-- glossary: term=用語 meaning=意味 -->` で囲んだ表を持つ文書'
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を渡して描かせる
        M->>M: 設定の features に文書の印を重ねる
        M-->>P: 下線と被参照の一覧を付けずに描く
        P-->>U: 本文と表を表示
    expected:
      - '`ワークスペース` に下線が付いていない'
      - やめた言い方 `作業場` にマーカーが付いていない
      - エイリアスの `単体テスト` に下線が付いていない
      - 被参照の一覧が無い
      - 用語集の表が普通の表として描かれ、本文に印の文字が出ていない
    test: test_normal_when_glossary_disabled
  - name: 正常シナリオ（被参照の機能だけを外す）
    setup:
      - name: mdmark を読むページ
        description: 索引・描く文書の `id`・ほかの文書から算出した参照を渡して文書を描く。ほかは正常シナリオと同じ
        notes: 設定の `features` は `glossary`・`backlinks` を書かない（既定のオン）
      - name: 用語と別名を持つ索引
        description: 用語 `索引` を持ち、文書 `api`（`aliases` に `公開関数`）と文書 `index-ref`（`aliases` に `索引`）を持ち、`api` の `related` が描く文書を指す索引
      - name: 被参照を外す Markdown
        description: '先頭に `<!-- features: -backlinks -->` を持ち、段落に `索引` と `公開関数` が出る文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を渡して描かせる
        M->>M: 設定の features に文書の印を重ねる
        M-->>P: 用語にだけ下線を引き、関連文書を出さずに描く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 用語の意味だけのツールチップを表示
    expected:
      - '`索引` に下線が付き、ツールチップに「用語」の意味だけがあり、「関連文書」の区分が無い'
      - 文書の別名だけに一致する `公開関数` に下線が付いていない
      - 文書の末尾に「関連文書」の一覧が無い
    test: test_normal_when_backlinks_disabled
  - name: 正常シナリオ（右側の目次の機能を外す）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features` は `side-toc` を書かない（既定のオン）。画面の幅は 1280px
      - name: 右側の目次を外す Markdown
        description: '先頭に `<!-- features: -side-toc -->` を持ち、`## 導入`・`## 使い方` の見出しと段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: 右側の目次を置かずに本文を描く
        U->>P: 描いた文書の右端にポインターを置く
        P-->>U: 右側の目次を出さない
    expected:
      - 右側の目次と、目次を出すボタン・ピン止めのボタンが無い
      - 見出しのアンカーと節の開閉のボタンはある
      - 本文にマーカーの文字が出ていない
    test: test_normal_when_side_toc_disabled
  - name: 正常シナリオ（設定でオフにした右側の目次を文書でオンにする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features.side-toc` は `false`。画面の幅は 1280px
      - name: 右側の目次を追加する Markdown
        description: '先頭に `<!-- features: +side-toc -->` を持ち、`## 導入`・`## 使い方` の見出しと段落を持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: 右側の目次を置いて本文を描く
        U->>P: 描いた文書の右端にポインターを置く
        P-->>U: 右側の目次を表示
    expected:
      - 右端にポインターを置いた後、`導入`・`使い方` の項目を持つ右側の目次が表示されている
    test: test_normal_when_side_toc_enabled_by_mark
  - name: 正常シナリオ（色・画像・カードの機能を外す）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: 設定の `features` はこれらの機能を書かない（既定のオン）
      - name: 新しい記法の機能を外す Markdown
        description: '先頭に、本文の文字の色・画像の属性・ライトボックス・リンクと添付のカードの機能を外す `<!-- features: ... -->` を持ち、`[決め手の 1 文]{color=blue}`、`![グラフ](chart.png){width=300}`、`https://example.com/docs` だけの段落を持つ文書'
        notes: 機能名はインターフェース定義で決める
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 設定の features に文書のマーカーを重ねる
        M-->>P: 外した記法を普通の Markdown として描く
        P-->>U: 文書を表示
    expected:
      - 本文の文字に色が付いていない
      - 本文に `[決め手の 1 文]{color=blue}` が書いたとおりの文字で出ている
      - 画像に幅が当たらず、画像の後ろに `{width=300}` が文字で出ている。押してもライトボックスが開かない
      - URL だけの段落がカードにならず、リンクとして描かれている
      - '`<!-- features: ... -->` のマーカーは本文に出ていない'
    test: test_normal_when_media_features_disabled
lead: '使う側が設定の `features` で機能のオン・オフの既定を決め、文書を書く人が文書の `<!-- features: +機能 -機能 -->` でその文書だけ上書きする。この Issue が持つ機能の印刷（`print`）で確かめる。'
issue: 3
primary_actor: 文書を書く人
stakeholders:
  - name: 使う側のアプリの開発者
    interest: 設定で決めた既定が、印の無い文書にそのまま当たる
  - name: 機能を作る Issue
    interest: 決まったオン・オフを読んで、機能を出すかを決められる
trigger: 使う側のページが、設定と、印を持つ文書を渡して描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
success_guarantee: 文書の印で足した機能はオン、外した機能はオフになり、印に書かない機能は設定のとおりになる。
minimal_guarantee: 知らない機能名を印に書いても、本文は描かれる。
test_file: tests/e2e/単一ユースケース/機能のオン・オフを文書で上書きする.spec.ts
