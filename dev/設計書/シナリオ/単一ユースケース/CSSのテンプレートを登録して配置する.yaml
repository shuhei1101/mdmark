title: CSSのテンプレートを登録して配置する
scenarios:
  - name: 正常シナリオ（登録する）
    setup:
      - name: 端末の設定
        description: 一時フォルダの `settings.yaml`。常駐サーバーを `MDMARK_CONFIG` でこのファイルを指して起動する。テンプレートのフォルダはまだ無い
      - name: 登録する CSS を持つ作業のフォルダ
        description: '`mdmark.config.yaml` と、見出しの色を変える規則を持つ CSS `brand.css`'
      - name: Mock
        description: Claude Code の代わりに、起動した常駐サーバーへ HTTP でつなぐ MCP のクライアントを使う。ツールの引数には、プラグインの PreToolUse のフックを通して作業のフォルダの絶対パスを入れる
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        participant T as テンプレートのフォルダ
        C->>S: add_template（brand.css・名前・説明・タグ）
        S->>F: brand.css を読む
        S->>T: フォルダと索引を作り、CSS をコピーして索引に行を追加する
        S-->>C: 登録した名前と CSS のパス
        C->>S: list_templates
        S->>T: 索引を読む
        S-->>C: 名前・説明・タグの一覧
    expected:
      - テンプレートのフォルダに `brand.css` と同じ中身の CSS があり、索引に渡した名前・説明・タグの行が 1 つある
      - '`list_templates` が、登録した名前・説明・タグを返す'
      - 作業のフォルダの `brand.css` と `mdmark.config.yaml` は書き換わらない
    test: test_normal_when_registering
  - name: 正常シナリオ（一覧から選んで配置する）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（登録する）の登録を終えた後の端末の設定とテンプレートのフォルダ
      - name: 配置先の作業のフォルダ
        description: '`theme` を持たない `mdmark.config.yaml` を直下に持ち、作業のフォルダはその下の `docs/`'
      - name: Mock
        description: 正常シナリオ（登録する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant T as テンプレートのフォルダ
        participant F as 作業のフォルダ
        C->>S: list_templates
        S->>T: 索引を読む
        S-->>C: 名前・説明・タグの一覧
        C->>S: apply_template（名前）
        S->>F: 上へ探して最も近い mdmark.config.yaml を見つける
        S->>F: そのフォルダへ CSS をコピーする
        S-->>C: 配置したパスと theme に記載する値
    expected:
      - '`mdmark.config.yaml` のフォルダに、テンプレートと同じ中身の CSS が配置される'
      - '`apply_template` が、配置したパスと、`mdmark.config.yaml` のフォルダからの相対パスを `theme` に記載する値として返す'
      - '`mdmark.config.yaml` とテンプレートのフォルダは書き換わらない'
    test: test_normal_when_applying_from_list
  - name: 正常シナリオ（上書きして登録する）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（登録する）の登録を終えた後の端末の設定とテンプレートのフォルダ
      - name: 登録する CSS を持つ作業のフォルダ
        description: 正常シナリオ（登録する）の `brand.css` の見出しの色を書き換えたもの
      - name: Mock
        description: 正常シナリオ（登録する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant T as テンプレートのフォルダ
        C->>S: add_template（同じ名前・上書きする）
        S->>T: CSS を置き換え、索引の行を書き換える
        S-->>C: 登録した名前と CSS のパス
    expected:
      - テンプレートのフォルダの CSS が書き換えた `brand.css` と同じ中身になる
      - 索引の同じ名前の行は 1 つのままで、説明とタグが渡した値になる
    test: test_normal_when_overwriting
  - name: 異常シナリオ（同じ名前のテンプレートがある）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（登録する）の登録を終えた後の端末の設定とテンプレートのフォルダ
      - name: 登録する CSS を持つ作業のフォルダ
        description: 正常シナリオ（上書きして登録する）と同じ
      - name: Mock
        description: 正常シナリオ（登録する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant T as テンプレートのフォルダ
        C->>S: add_template（同じ名前・上書きしない）
        S->>T: 索引を読み、同じ名前の行を見つける
        S-->>C: エラー（同じ名前があることと、上書きの指定で置き換えられること）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、同じ名前のテンプレートがあることと、上書きを指定すれば置き換えられることが出る
      - テンプレートのフォルダの CSS と索引は書き換わらない
    test: test_error_when_template_name_exists
  - name: 異常シナリオ（配置先の設定ファイルが無い）
    setup:
      - name: 端末の設定
        description: 正常シナリオ（登録する）の登録を終えた後の端末の設定とテンプレートのフォルダ
      - name: 設定ファイルの無い作業のフォルダ
        description: そのフォルダと上のフォルダに `mdmark.config.yaml` が無い
      - name: Mock
        description: 正常シナリオ（登録する）と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: apply_template（名前・配置先を省く）
        S->>F: 上へ mdmark.config.yaml を探す
        S-->>C: エラー（設定ファイルが無いことと、配置先を指定するか mdmark init で置けること）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、設定ファイルが無いことと、配置先を指定するか `mdmark init` で設定ファイルを置けることが出る
      - 作業のフォルダに CSS が配置されない
    test: test_error_when_config_missing
lead: Claude Code が MCP のツールで、作業のフォルダの CSS を端末の設定のフォルダのテンプレートに説明つきで登録し、一覧から選んだテンプレートを作業のフォルダの設定ファイルの隣へ配置する。
issue: 164
primary_actor: Claude Code
stakeholders:
  - name: 文書を書く人
    interest: 作った CSS を説明つきで残し、ほかのリポジトリでも同じ CSS を使える
  - name: Claude Code
    interest: 説明とタグで CSS を選び、`theme` に記載する値を受け取れる
trigger: 文書を書く人が Claude Code に、CSS をテンプレートに登録する、または使える CSS を探して配置するよう頼む
preconditions:
  - Claude Code に mdmark のプラグインを入れ、MCP の常駐サーバーを起動している
success_guarantee: 登録した CSS と説明が端末の設定のフォルダに残り、配置した CSS が作業のフォルダの設定ファイルの隣にあり、`theme` に記載する値が返る。
minimal_guarantee: エラーのときは、テンプレートのフォルダ・作業のフォルダの設定ファイルと CSS を書き換えない。
test_file: tests/e2e/単一ユースケース/CSSのテンプレートを登録して配置する.spec.ts
