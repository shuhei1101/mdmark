id: SC-472-5
title: GitHubの参照から入れてCLIを起動する
scenarios:
  - name: 正常シナリオ
    setup:
      - name: バージョンのタグを打った Git のリポジトリ
        description: ビルドした作業ツリー（`dist/` を含む）を一時の Git のリポジトリに commit し、バージョンのタグ `v0.0.1` を打つ
        notes: release のタグと同じく `dist/` を commit に含め、`package.json` は作業ツリーのものを使用する
      - name: 空の npm のキャッシュ
        description: '`npm_config_cache` を空の一時フォルダにする'
        notes: 手元のキャッシュに入った前回の中身を使用しない
      - name: 空いたポート
        description: '`MDMARK_PORT` に、待ち受けるプロセスの無いポートを指定する'
        notes: 手元の `mdmark serve` が待ち受ける 8782 は使用しない
      - name: lifecycle の出力を表示する
        description: '`npm_config_foreground_scripts=true` を付け、npm がバージョンのタグの中身で実行する `prepare` などの lifecycle スクリプトの出力を表示させる'
        notes: 既定では lifecycle の出力は失敗したときにしか出ず、開発用の処理が実行されて成功しても出力から見分けられない
      - name: Mock
        description: GitHub の代わりに `git+file://{リポジトリ}#v0.0.1` を指定する。npm は `github:` の参照では codeload の tarball を展開したフォルダで、`git+file://` では clone したフォルダで、どちらも `prepare` があれば実行する。依存は npm レジストリから実際に入れ、Claude Code の代わりに常駐サーバーへ HTTP でつなぐ MCP のクライアントを使用する
        notes: 開発用の処理が実行されないことは、CLI の起動ではなく lifecycle の出力で確認する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant N as npm
        participant G as Git のリポジトリ
        participant C as mdmark CLI
        participant M as MCP のクライアント
        W->>N: MDMARK_PORT={ポート} npm exec --yes {バージョンのタグの参照} serve
        N->>G: バージョンのタグを取り出す
        G-->>N: バージョンのタグの中身
        N->>N: dependencies を入れる
        N->>C: mdmark serve
        C-->>W: 接続先の URL
        M->>C: tools/list
        C-->>M: mdmark のツールの一覧
    expected:
      - '`npm exec` のプロセスが終わらずに残り、出力に接続先 `http://127.0.0.1:{ポート}/mcp` が出る'
      - 出力に、`npm ci --prefix tools/eslint` が出す導入の集計の行（`added {数} packages`）が出ない
      - クライアントの `tools/list` が返却するツールに `export_html`・`build_site`・`check` がある
    test: test_normal
lead: 文書の作成者が `npx github:shuhei1101/mdmark#v{バージョン}` と同じ経路でバージョンのタグから mdmark を入れ、CLI を起動する。
issue: 350
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: バージョンのタグを指定するだけで、開発の道具を入れずに CLI を起動できる
  - name: Claude Code
    interest: プラグインの手順が起動する `npx -y github:shuhei1101/mdmark#v{バージョン} serve` の常駐サーバーにつながる
trigger: 文書の作成者が、バージョンのタグを指定して mdmark の CLI を初めて呼ぶ
preconditions:
  - 文書の作成者の手元に Node 24 以降と Git がある
  - npm レジストリへつながる
success_guarantee: npm がバージョンのタグの中身を取り出して `dependencies` を入れ、開発用の処理（`tools/eslint/` の依存の導入）を実行せずに CLI を起動する。
minimal_guarantee: 入れる途中で失敗したときは CLI を起動せず、npm が 0 以外の終了コードで終わる。
test_file: tests/e2e/単一ユースケース/GitHubの参照から入れてCLIを起動する.spec.ts
