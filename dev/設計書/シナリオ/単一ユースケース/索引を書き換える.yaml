title: "索引を書き換える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 2 つ。2 つ目の文書は索引に載っていない
      - name: Mock
        description: Claude Code の代わりに、起動した常駐サーバーへ HTTP でつなぐ MCP のクライアントを使う。ツールの引数には、プラグインの PreToolUse のフックを通して作業のフォルダの絶対パスを入れる
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（id: 2 つ目の文書の ID、item: パスと題名）
        S->>F: 索引を読む
        S->>S: 項目を足した索引を Schema で検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: 書き換えた
    expected:
      - 索引のファイルに 2 つ目の文書の行が入る
      - 1 つ目の文書の行は変わっていない
      - 書き換えた後の索引が Schema に合う
    test: test_normal
  - name: 正常シナリオ（消す）
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 1 つ。索引にはもう 1 つ、文書の無い行がある
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（id: 文書の無い行の ID、item: null）
        S->>F: 索引を読む
        S->>S: 行を消した索引を Schema で検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: 書き換えた
    expected:
      - 索引のファイルから、渡した ID の行がなくなる
      - 他の行は変わっていない
    test: test_normal_when_removed
  - name: 異常シナリオ（Schema に合わない）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
      - name: 合わない項目
        description: 必須のパスを持たない文書の項目
        notes: 書き換える前と後で索引のファイルの中身が同じであることを確かめる
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（id: 新しい ID、item: パスの無い項目）
        S->>F: 索引を読む
        S->>S: 項目を足した索引を Schema で検査する
        S-->>C: エラー（合わないところと直し方）
    expected:
      - ツールの結果がエラーになる
      - エラーの文に、合わない項目の場所と直し方が出る
      - 索引のファイルの中身が書き換える前と同じ
    test: test_error_when_schema_invalid
  - name: 正常シナリオ（タグの語彙を書き換える）
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 1 つ。索引はタグの語彙を持たず、文書はタグ `topic:mcp` を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: tag、id: topic:mcp、item: グループ・説明・別名）
        S->>F: 索引を読む
        S->>S: 語彙のタグを追加した索引を Schema で検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: 書き換えた
      ```
    expected:
      - 索引のファイルの最上位のタグの語彙に、`topic:mcp` のタグがグループ・説明・別名つきで入る
      - 文書と用語の行は変わっていない
      - 書き換えた後の索引が Schema に合う
    test: test_normal_when_tag
  - name: 正常シナリオ（関連を書く）
    setup:
      - name: 作業のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
      - name: 関連を持つ項目
        description: '2 つ目の文書のパス・題名と、`related` に `{to: 1 つ目の文書の ID, type: requires, when: 前提を確かめるとき, paths: [src/**]}` を持つ文書の項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（id: 2 つ目の文書の ID、item: 関連を持つ項目）
        S->>F: 索引を読む
        S->>S: 項目を追加した索引を Schema で検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: 書き換えた
      ```
    expected:
      - 索引のファイルの 2 つ目の文書の行が、渡した `to`・`type`・`when`・`paths` を持つ関連を 1 件持つ
      - 1 つ目の文書の行は変わっていない
      - 書き換えた後の索引が Schema に合う
    test: test_normal_when_related
lead: Claude Code が MCP のツール `update_index` で、文書・用語・タグの語彙の項目を置き換え・追加・削除する。書く前に索引の Schema で検査し、合わなければ書かない。
issue: 11
primary_actor: Claude Code
trigger: Claude Code が文書を追加した・消した・題名を変えた後に索引を合わせたくなる。または、タグの語彙を整えたくなる
preconditions:
  - ビルドしたこのリポジトリの `mdmark serve` で、MCP の常駐サーバーが起動している
  - 作業のフォルダに設定と索引がある
success_guarantee: 索引のファイルの、渡した ID の項目だけが変わる。
minimal_guarantee: 書き換えた後の索引が Schema に合わないときは、索引のファイルを書き換えず、合わないところと直し方を返す。
test_file: tests/e2e/単一ユースケース/索引を書き換える.spec.ts
