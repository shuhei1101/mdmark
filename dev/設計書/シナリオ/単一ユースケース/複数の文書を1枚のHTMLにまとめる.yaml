title: "複数の文書を1枚のHTMLにまとめる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 見本の文書群
        description: 文書 3 つ（入口・用語集の表を持つ文書・Chart.js の印と画像を持つ文書）と、3 つと用語を載せた索引。入口から他の 2 つへリンクする
      - name: build の設定
        description: '`include` が 3 つに当たり、`glossary` が用語集の文書、`entry` が入口、`out` が出力のパス'
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as mdmark
        participant F as build.out
        W->>C: mdmark build
        C->>C: 設定・索引・include の文書を読む
        C->>M: collectReferences（索引・文書）
        M-->>C: 参照の表
        C->>F: 配布物・CSS・モジュール・画像・文書・参照の表を埋めた HTML を書く
        C-->>W: 出力のパス・入れた文書の数・終了コード 0
    expected:
      - 終了コードが 0 で、`build.out` に HTML が 1 つある
      - 出力に入れた文書の数として 3 が出る
      - HTML を file:// で開くと、入口の文書が描かれ、文書の一覧に 3 つが並ぶ
      - 用語集の文書の表の用語が、入口の文書の本文でもツールチップを出す
      - 入口からリンクされた文書の末尾に、入口が関連文書（被参照）として出る
      - 外への要求が 0 件
    test: test_normal
  - name: 正常シナリオ（1 枚に含まれない文書へのリンクがある）
    setup:
      - name: 外した文書を指す文書群
        description: 正常シナリオの文書群に下書きの文書を 1 つ足し、`exclude` で外し、入口からその文書へリンクする
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant F as build.out
        W->>C: mdmark build
        C->>C: exclude に当たる文書を外す
        C->>F: 3 つの文書を埋めた HTML を書く
        C-->>W: 1 枚に含まれない文書へのリンクの警告・終了コード 0
    expected:
      - 終了コードが 0 で、入れた文書の数が 3
      - 出力の警告に、入口の文書と 1 枚に含まれないリンク先が出る
      - HTML の中で、そのリンクが書いたままの `href` で残る
      - 文書の一覧に外した文書が無い
    test: test_normal_when_link_outside_bundle
  - name: 異常シナリオ（対象の文書が 0 件）
    setup:
      - name: 当たらない include
        description: '`build.include` がどのファイルにも当たらない設定'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark build
        C->>C: include に当たる文書が 0 件
        C-->>W: 対象が 0 件であることと include の直し方・終了コード 0 以外
    expected:
      - 終了コードが 0 以外
      - 出力に対象が 0 件であることと、設定の `build.include` を直すことが出る
      - '`build.out` に HTML が書かれていない'
    test: test_error_when_no_documents
  - name: 正常シナリオ（エイリアスを読む）
    setup:
      - name: 見本の文書群
        description: 正常シナリオと同じ文書 3 つと索引
      - name: エイリアスを読む設定
        description: 正常シナリオの build の設定に、`command` の `単体テスト`（コマンド `npm run test:unit`）と、`env` の `開発サーバー`（URL `http://127.0.0.1:8767/`）を持つ YAML を指す `aliases` を加えたもの
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant F as build.out
        actor R as 読む人
        W->>C: mdmark build
        C->>C: 設定・索引・aliases・include の文書を読む
        C->>F: 読めたエイリアスも埋めた HTML を書く
        C-->>W: 出力のパス・入れた文書の数・終了コード 0
        R->>F: file:// で開き、文書を行き来する
        F-->>R: どの文書でもエイリアスの語に下線を引いて描く
    expected:
      - 終了コードが 0 で、`build.out` に HTML が 1 つある
      - file:// で開くと、入口の文書と、一覧から開いたほかの文書のどちらでも `単体テスト` に下線が付く
      - '`単体テスト` のツールチップに、コード `npm run test:unit` とコピーのボタンが出る'
      - まとめた HTML のソースに、`env` の `開発サーバー`・`http://127.0.0.1:8767/` が入っていない
      - 外への要求が 0 件
    test: test_normal_when_aliases
  - name: 正常シナリオ（テーマを選ぶ）
    setup:
      - name: テーマを選んだフォルダ
        description: 正常シナリオと同じフォルダで、`mdmark.config.yaml` のテーマを選ぶキーに theme-paper を書く
        notes: まとめた HTML を開くブラウザの配色はダーク
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark build
        participant B as ブラウザ
        W->>C: mdmark build を流す
        C->>C: 設定のテーマを描く先に当てる HTML を組み立てる
        C-->>W: build.out に HTML を書く
        W->>B: file:// で開き、一覧から別の文書を開く
        B-->>W: どの文書も theme-paper の暗い配色で表示
    expected:
      - 終了コードが 0 で、`build.out` に HTML が 1 つある
      - 入口の文書と、一覧から開いたほかの文書のどちらでも、描く先の要素の地の色の計算値が theme-paper の暗い配色の `--mdmark-color-bg` の値
      - 外への要求が 0 件
    test: test_normal_when_theme_selected
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを選ぶ#scenarios[正常シナリオ（ダークの配色）]
  - name: 正常シナリオ（画像・動画・音声を埋める）
    setup:
      - name: まとめる文書と添付のファイル
        description: 設定の `build` の 2 つの文書が、同じ `images/chart.png` と別々の `media/demo.mp4`・`media/voice.mp3` を相対パスで指す。各ファイルは実在する
      - name: 設定
        description: '`mdmark.config.yaml` が添付のファイルのルートのフォルダを指す'
      - name: Mock
        description: なし（実ファイルを使う）。外へのネットワークの要求を記録する
    flow: |-
      sequenceDiagram
        actor U as 文書を書く人
        participant C as mdmark CLI
        participant F as ファイル
        U->>C: mdmark build
        C->>F: 文書と添付のファイルを読む
        C->>C: 画像を 1 回だけ data URL で埋め、動画・音声を出力先のフォルダへコピーする
        C->>F: 1 枚の HTML と、コピーしたファイルを書く
        C-->>U: 終了コード 0
    expected:
      - 終了コードが 0
      - 2 つの文書が指す同じ画像が、HTML の中に 1 回だけ埋まっている
      - 動画・音声が出力先のフォルダへコピーされ、どちらの文書を開いても再生バーが出る
      - まとめた HTML を file:// で開いたとき、外へのネットワークの要求が 0 件
    test: test_normal_when_media_embedded
lead: 文書を書く人が設定の `build` で対象を決めて `mdmark build` を流し、参照・被参照・用語のツールチップが効く 1 枚の HTML にまとめる。
issue: 9
primary_actor: 文書を書く人
trigger: 文書を書く人が、複数の文書を行き来できる形でサーバー無しで配りたくなる
preconditions:
  - 文書を書く人の手元に Node 24 以降がある
  - 設定ファイルに `build` がある
success_guarantee: '`build.out` に 1 枚の HTML ができ、`include` に当たり `exclude` に当たらない文書が全て入る。索引があれば、文書をまたぐ被参照と用語のツールチップが効く。1 枚に含まれる文書へのリンクは 1 枚の中の文書へ移り、含まれない文書へのリンクは書いたままの `href` で残る。'
minimal_guarantee: 対象の文書が 0 件のときは HTML を書かず、原因と直し方の 1 文を出して 0 以外で終わる。CLI は文書と索引を書き換えない。
test_file: tests/e2e/単一ユースケース/複数の文書を1枚のHTMLにまとめる.spec.ts
