title: "プレビューをVSCodeのテーマに合わせる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: ライトのテーマで開いたプレビュー
        description: VS Code のテーマが Default Light Modern で、プレビューを開いた状態。`mdmark.preview.theme` は既定の `auto`
      - name: Mock
        description: VSCodeでプレビューを開くの正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant VS as VS Code
        participant PV as プレビュー（Webview）
        W->>VS: テーマを Default Dark Modern に切り替える
        VS->>PV: body の class を vscode-dark にする
        PV->>PV: mdmark がダークの配色の値を適用する
        PV-->>W: ダークの配色で表示
    expected:
      - プレビューをもう一度開かずに、描く先の要素の地の色の計算値がダークの `--mdmark-color-bg` の値になる
      - 本文とスクロールの位置は切り替える前と同じ
    test: test_normal
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを上書きする#scenarios[正常シナリオ（親の class でダークにする）]
  - name: 正常シナリオ（配色を固定する）
    setup:
      - name: ダークのテーマで開いたプレビュー
        description: VS Code のテーマが Default Dark Modern で、`mdmark.preview.theme` を `light` にしてプレビューを開いた状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>PV: ライトの配色に固定して描かせる
        PV-->>W: ライトの配色で表示
    expected:
      - VS Code のテーマがダークでも、描く先の要素の地の色の計算値がライトの `--mdmark-color-bg` の値
    test: test_normal_when_theme_fixed
  - name: 正常シナリオ（設定ファイルのテーマで描く）
    setup:
      - name: テーマを選んだ設定ファイル
        description: 開いた Markdown のワークスペースの `mdmark.config.yaml` のテーマを選ぶキーに theme-paper を記載する
        notes: VS Code の設定のテーマを選ぶ項目は空（既定）。項目の名前はインターフェース定義で決める
      - name: ダークのテーマで開いたプレビュー
        description: VS Code のテーマが Default Dark Modern で、`mdmark.preview.theme` は既定の `auto`
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>EX: VS Code の設定が空なので設定ファイルのテーマを使用する
        EX->>PV: theme-paper で描かせる
        PV-->>W: theme-paper の暗い配色で表示
    expected:
      - 描く先の要素の地の色の計算値が theme-paper の暗い配色の `--mdmark-color-bg` の値
    test: test_normal_when_config_theme
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを選ぶ#scenarios[正常シナリオ（ダークの配色）]
  - name: 正常シナリオ（VS Code の設定でテーマを選ぶ）
    setup:
      - name: テーマを選んだ設定ファイル
        description: 正常シナリオ（設定ファイルのテーマで描く）と同じ（theme-paper）
      - name: 明るい配色に固定したプレビュー
        description: VS Code のテーマが Default Dark Modern で、`mdmark.preview.theme` を `light` にしてプレビューを開き、本文を途中までスクロールした状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant VS as VS Code
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>VS: VS Code の設定のテーマを theme-slate にする
        VS->>EX: 設定の変更を通知する
        EX->>PV: theme-slate で再描画させる
        PV-->>W: theme-slate の明るい配色で表示
    expected:
      - プレビューをもう一度開かずリロードもせずに、描く先の要素の地の色の計算値が theme-slate の明るい配色の `--mdmark-color-bg` の値になる（VS Code の設定が設定ファイルに勝ち、明暗は `mdmark.preview.theme` のまま）
      - 本文とスクロールの位置は切り替える前と同じ
    test: test_normal_when_setting_theme
  - name: 正常シナリオ（設定ファイルのテーマを書き換える）
    setup:
      - name: 設定ファイルのテーマで開いたプレビュー
        description: 正常シナリオ（設定ファイルのテーマで描く）を終えた状態
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: mdmark.config.yaml のテーマを theme-contrast に書き換えて保存する
        EX->>PV: theme-contrast で再描画させる
        PV-->>W: theme-contrast の暗い配色で表示
    expected:
      - リロードせずに、描く先の要素の地の色の計算値が theme-contrast の暗い配色の `--mdmark-color-bg` の値になる
    test: test_normal_when_config_theme_changed
    refs:
      - dev/設計書/シナリオ/単一ユースケース/記載した内容をプレビューに映す#
  - name: 正常シナリオ（文書のマーカーで明暗を指定する）
    setup:
      - name: 明るい配色に固定したプレビュー
        description: VS Code のテーマが Default Light Modern で、`mdmark.preview.theme` を `light` にしてプレビューを開いた状態
      - name: ダークを指定した Markdown
        description: '先頭の行に `<!-- page: scheme=dark -->` を持つ文書をエディタで開いている'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>PV: ライトの配色の指定と文書を指定して描かせる
        PV->>PV: mdmark が文書のマーカーの明暗を優先する
        PV-->>W: ダークの配色で表示
    expected:
      - '`mdmark.preview.theme` が `light` でも、描く先の要素の地の色の計算値がダークの `--mdmark-color-bg` の値'
    test: test_normal_when_document_marker
    refs:
      - dev/設計書/シナリオ/単一ユースケース/ページの設定を文書で指定する#scenarios[正常シナリオ]
  - name: 正常シナリオ（設定ファイルの明暗で描く）
    setup:
      - name: 明暗を記載した設定ファイル
        description: 開いた Markdown のワークスペースの `mdmark.config.yaml` の明暗のキーに `light` を記載する
        notes: キーの名前はインターフェース定義で決める
      - name: ダークのテーマで開いたプレビュー
        description: VS Code のテーマが Default Dark Modern で、`mdmark.preview.theme` は既定の `auto`
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant EX as 拡張機能
        participant PV as プレビュー（Webview）
        W->>EX: プレビューを横に開く
        EX->>EX: VS Code の設定が auto なので設定ファイルの明暗を使用する
        EX->>PV: ライトの配色で描かせる
        PV-->>W: ライトの配色で表示
    expected:
      - VS Code のテーマがダークでも、描く先の要素の地の色の計算値がライトの `--mdmark-color-bg` の値
      - '`mdmark.preview.theme` を `dark` にすると、設定ファイルの明暗より VS Code の設定が勝ち、リロードせずにダークの `--mdmark-color-bg` の値になる'
    test: test_normal_when_config_scheme
lead: プレビューの配色が、VS Code のライト・ダークのテーマに合わせて切り替わる。設定で配色を固定もできる。
issue: 22
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: エディタと同じ明るさでプレビューを読み込める
trigger: 文書の作成者がプレビューを開いたまま VS Code のテーマを切り替える
preconditions:
  - Markdown のプレビューを開いている（VSCodeでプレビューを開く）
success_guarantee: '`mdmark.preview.theme` が `auto` のときはテーマの明暗、`light` / `dark` のときはその配色でプレビューが描かれる。'
minimal_guarantee: 配色を切り替えても本文とスクロールの位置は変わらない。
test_file: tests/e2e/単一ユースケース/プレビューをVSCodeのテーマに合わせる.spec.ts
