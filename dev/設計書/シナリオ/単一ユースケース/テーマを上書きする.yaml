title: "テーマを上書きする"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 上書きの CSS を読むページ
        description: mdmark の CSS の後に、使う側の CSS を読み、文書を描く HTML
        notes: '使う側の CSS は `--mdmark-color-link` を赤（`rgb(255, 0, 0)`）にし、詳細度の低い `a { text-decoration: none }` を持つ。mdmark の CSS はリンクに詳細度の高いセレクタで下線を当てている'
      - name: 見本の Markdown
        description: 段落とリンクを持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が当たった本文
        P->>P: 層の外の使う側の CSS が当たる
        P-->>U: 上書きした見た目で表示
    expected:
      - リンクの色の計算値が `rgb(255, 0, 0)`
      - リンクの `text-decoration-line` の計算値が `none`
    test: test_normal
  - name: 正常シナリオ（上書きしない）
    setup:
      - name: mdmark だけを読むページ
        description: mdmark の CSS だけを読み、文書を描く HTML
        notes: '配色は明るい配色（`prefers-color-scheme: light`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: 既定の値が当たった本文
        P-->>U: 既定の見た目で表示
    expected:
      - リンクの色の計算値が、デザイン方針の dev-swiss の明るい配色の `--mdmark-color-link` の値
    test: test_normal_when_not_overridden
  - name: 正常シナリオ（ダークの配色）
    setup:
      - name: mdmark だけを読むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: '配色はダーク（`prefers-color-scheme: dark`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: ダークの値が当たった本文
        P-->>U: ダークの見た目で表示
    expected:
      - 描く先の要素の地の色の計算値が、デザイン方針の dev-swiss のダークの `--mdmark-color-bg` の値
    test: test_normal_when_dark
  - name: 正常シナリオ（図の色を上書きする）
    setup:
      - name: 上書きの CSS を読むページ
        description: mdmark の CSS の後に、図の層の背景と線の色の CSS 変数を書き換える使う側の CSS を読み、文書を描く HTML
        notes: LLM の層の箱の色の CSS 変数を赤（`rgb(255, 0, 0)`）にする
      - name: フロー図の定義を持つ Markdown
        description: 『図を描く』の正常シナリオと同じ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が当たったフロー図
        P->>P: 層の外の使う側の CSS が当たる
        P-->>U: 上書きした色で図を表示
    expected:
      - LLM の層の箱の線の色の計算値が `rgb(255, 0, 0)`
      - LLM の層の背景は同じ色をうっすら敷いた色で、凡例の LLM の色も同じ色に変わる
    test: test_normal_when_diagram
  - name: 正常シナリオ（親の class でダークにする）
    setup:
      - name: mdmark だけを読むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 'OS の配色はライト（`prefers-color-scheme: light`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: ダークの class
        description: 描く先の要素の祖先（`body`）に、ダークを表す class（VS Code の `vscode-dark` など。class の名前はインターフェース定義で決める）を付ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>P: body にダークの class を付ける
        P->>M: 文書を描かせる
        M-->>P: ダークの値が当たった本文
        P-->>U: ダークの見た目で表示
    expected:
      - OS の配色がライトでも、描く先の要素の地の色の計算値がデザイン方針の dev-swiss のダークの `--mdmark-color-bg` の値
    test: test_normal_when_parent_class_dark
  - name: 正常シナリオ（親の class でライトにする）
    setup:
      - name: mdmark だけを読むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 'OS の配色はダーク（`prefers-color-scheme: dark`）'
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: ライトの class
        description: 描く先の要素の祖先（`body`）に、ライトを表す class（VS Code の `vscode-light` など。class の名前はインターフェース定義で決める）を付ける
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>P: body にライトの class を付ける
        P->>M: 文書を描かせる
        M-->>P: ライトの値が当たった本文
        P-->>U: ライトの見た目で表示
    expected:
      - OS の配色がダークでも、描く先の要素の地の色の計算値がデザイン方針の dev-swiss のライトの `--mdmark-color-bg` の値
    test: test_normal_when_parent_class_light
  - name: 正常シナリオ（見出し行の位置と本文の幅を変える）
    setup:
      - name: 上書きの CSS を読むページ
        description: 画面の上端に高さ 48px の固定のヘッダーを置き、mdmark の CSS の後に使う側の CSS を読み、文書を描く HTML
        notes: 使う側の CSS は、見出し行を留める位置のずれの CSS カスタムプロパティ（名前はインターフェース定義で決める）を `48px`、`--mdmark-content-width` を `40rem` にする。画面の幅は 1280px
      - name: 大きい表を持つ Markdown
        description: 長い段落の後に 3 列 60 行の表を持ち、表の後に長い段落を持つ文書
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 層の中の CSS が当たった本文
        P->>P: 層の外の使う側の CSS が当たる
        U->>P: ページを縦にスクロールして表の途中を出す
        P-->>U: 固定のヘッダーの下に見出し行を留めた表
    expected:
      - 本文の段落の幅が `40rem` を超えない
      - 表の途中を出したとき、見出し行の上端が画面の上端から 48px の位置にあり、固定のヘッダーに隠れていない
    test: test_normal_when_layout_overridden
  - name: 正常シナリオ（既定の本文の幅）
    setup:
      - name: mdmark だけを読むページ
        description: 正常シナリオ（上書きしない）と同じ
        notes: 画面の幅を 1280px で開き、後で 1920px に広げる
      - name: 長い段落を持つ Markdown
        description: 1920px の幅でも折り返す長さの段落を持つ文書
        notes: '-'
      - name: Mock
        description: 正常シナリオと同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 文書を描かせる
        M-->>P: 既定の値が当たった本文
        U->>P: 画面の幅を 1920px に広げる
        P-->>U: 広げた幅を使った本文
    expected:
      - 1280px のとき、1920px に広げたときのどちらも、段落の幅が描く先の要素の中身の幅と同じ（本文の幅に既定の上限が無い）
    test: test_normal_when_content_width_default
  - name: 正常シナリオ（選んだテーマの上から上書きする）
    setup:
      - name: 上書きの CSS を読むページ
        description: 正常シナリオと同じ使う側の CSS を読み、テーマを選ぶキーに theme-slate を書いた設定を `opts.config` に渡して文書を描く HTML
        notes: 使う側の CSS は `--mdmark-color-link` だけを赤（`rgb(255, 0, 0)`）にし、`--mdmark-color-bg` は書かない。OS の配色はライト
      - name: 見本の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: テーマを選んだ設定を渡して文書を描かせる
        M-->>P: 選んだテーマの値が当たった本文
        P->>P: 層の外の使う側の CSS が当たる
        P-->>U: 選んだテーマの上に上書きを重ねた見た目で表示
    expected:
      - リンクの色の計算値が `rgb(255, 0, 0)`
      - 描く先の要素の地の色の計算値が、theme-slate の明るい配色の `--mdmark-color-bg` の値
    test: test_normal_when_theme_selected
    refs:
      - dev/設計書/シナリオ/単一ユースケース/テーマを選ぶ#scenarios[正常シナリオ]
  - name: 正常シナリオ（色のプリセットを上書きする）
    setup:
      - name: 上書きの CSS を読むページ
        description: 正常シナリオと同じページで、使う側の CSS が blue の文字の色の CSS 変数を `rgb(0, 0, 128)`、blue の面の色の CSS 変数を `rgb(230, 240, 255)` にする
        notes: '変数名はインターフェース定義で決める（参考: `--mdmark-color-accent-blue-text`・`--mdmark-color-accent-blue-bg`）'
      - name: 色の名前を書いた Markdown
        description: 行内のコード `` `badge:blue:参考` `` と、本文の `[決め手の 1 文]{color=blue}` を持つ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        U->>P: ページを開く
        P->>M: 文書を描かせる
        M-->>P: 色のプリセットの CSS 変数で色を付けた本文
        P->>P: 層の外の使う側の CSS が当たる
        P-->>U: 上書きした色で表示
    expected:
      - バッジと本文の `決め手の 1 文` の文字の色の計算値が `rgb(0, 0, 128)`
      - バッジの面の色の計算値が `rgb(230, 240, 255)`
    test: test_normal_when_color_preset_overridden
lead: 使う側が自分の CSS で `--mdmark-` の変数や本文の規則を書き、mdmark が描いた文書の見た目を変える。何も書かなければ既定の見た目（dev-swiss）で描かれる。
issue: 3
primary_actor: mdmark を使うアプリの開発者
stakeholders:
  - name: 文書を読む人
    interest: アプリの見た目に合った文書を読める
trigger: 使う側のページが、mdmark の CSS と自分の CSS を読んで文書を描く
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
success_guarantee: 使う側が mdmark の層の外に書いた CSS は、詳細度によらず mdmark の CSS に勝つ。
minimal_guarantee: 使う側が CSS を書かなくても、既定の見た目で文書が描かれる。
test_file: tests/e2e/単一ユースケース/テーマを上書きする.spec.ts
