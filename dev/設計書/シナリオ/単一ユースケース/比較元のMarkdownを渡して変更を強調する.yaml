title: "比較元のMarkdownを渡して変更を強調する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、要素・Markdown・比較元の Markdown を渡して文書を描く HTML
        notes: '`diffSource` は渡さない'
      - name: 比較元の Markdown
        description: 段落 A・段落 B・段落 C の 3 つの段落を持つ文書
      - name: 描く Markdown
        description: 比較元の段落 A の語を 1 つ書き換え、段落 B を削除し、段落 C の後に段落 D を追加した文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 要素・Markdown・比較元の Markdown を渡して描かせる
        M->>M: 比較元と本文をブロックで比べる
        M-->>P: 変わったブロックを強調した文書
        P-->>U: 文書を表示
    expected:
      - 段落 A と段落 D が追加・変更のブロックとして強調され、段落 C は強調されていない
      - 段落 B が、段落 A の前（本文の先頭）に削除のブロックとして出る（直前の段落 A は書き換えたブロックで、変えていないブロックではないため）
      - 差分を開く「変更を見る」のボタンが無い
      - '取り出し元を渡したときの `diffMode: blocks` と同じ見た目（面の色と左の余白の `+`・`−`）で出る'
    test: test_normal
  - name: 正常シナリオ（比較元を差し替える）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ。`mount` の戻り値の `update` を呼べる
      - name: 比較元の Markdown
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 正常シナリオと同じ
      - name: 次の比較元の Markdown
        description: 描く Markdown から段落 D だけを除いた文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 比較元の Markdown を渡して描かせる
        M-->>P: 段落 A・B・D を強調した文書
        P->>M: update(描く Markdown, {baseMarkdown: 次の比較元})
        M-->>P: 段落 D だけを強調した文書
        P->>M: update(描く Markdown)
        M-->>P: 段落 D だけを強調した文書
        P->>M: update(描く Markdown, {baseMarkdown: null})
        M-->>P: 強調の無い文書
        P-->>U: 文書を表示
    expected:
      - 次の比較元に差し替えた後、段落 D だけが追加のブロックとして強調され、削除のブロックが無い
      - 第 2 引数を省いて `update` を呼んだ後も、前の比較元（次の比較元）との強調のまま
      - '`baseMarkdown: null` で `update` を呼んだ後、追加・変更・削除のブロックが無い'
    test: test_normal_when_base_replaced
  - name: 正常シナリオ（比較元を渡さない）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じページで、比較元を `null` にして文書を描く
      - name: 比較元の Markdown
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 要素・Markdown・比較元 null を渡して描かせる
        M-->>P: 強調の無い文書
        P->>M: update(描く Markdown, {baseMarkdown: 比較元})
        M-->>P: 段落 A・B・D を強調した文書
        P-->>U: 文書を表示
    expected:
      - 描いた直後、追加・変更・削除のブロックが無く、比較元を省いたときと同じ HTML になる
      - 比較元を `update` で渡した後、正常シナリオと同じブロックが強調される
    test: test_normal_when_base_null
  - name: 正常シナリオ（比較元と同じ本文）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 描く Markdown
        description: 比較元の Markdown と同じ文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 比較元と同じ Markdown を渡して描かせる
        M-->>P: 強調の無い文書
        P-->>U: 文書を表示
    expected:
      - 追加・変更・削除のブロックが無い
    test: test_normal_when_unchanged
  - name: 異常シナリオ（文字列でない比較元）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じページで、比較元に数値 `1` を渡して文書を描く
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 比較元に 1 を渡して描かせる
        M-->>P: TypeError
    expected:
      - '`mount` が、`baseMarkdown` を文字列か `null` で渡すよう伝える `TypeError` を投げる'
      - 描く先の要素の中は空のまま
    test: test_error_when_base_not_string
lead: 使う側のページが、描く Markdown と一緒に比較元の Markdown を文字列で `mount` に渡し、本文の中で比較元から追加・変更したブロックと削除したブロックの位置を差分のブロックで強調する。`update` で本文と比較元を差し替える。
issue: 222
primary_actor: mdmark を使うアプリのページ
stakeholders:
  - name: 使う側のアプリの開発者
    interest: リビジョンの取り出し元を書かずに、手元にある比較元の文字列を渡すだけで本文の中に変更を出せる
  - name: 文書を読む人
    interest: 本文を読みながら、比較元から変わったブロックと消えたブロックの位置が分かる
trigger: 使う側のページが、比較元の Markdown を持った状態で文書を描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
  - 描く先の要素がページにある
success_guarantee: 比較元から追加・変更したブロックは追加の色、削除したブロックは本文のその位置に削除の色で出る。比較元を省くか `null` にしたときは強調の無い文書を描く。
minimal_guarantee: 比較元が文字列でも `null` でもないときは、何も描かずに `TypeError` を投げる。
notes:
  取り出し元との関係: '`diffSource` と比較元を両方渡したときは、本文の中の強調に比較元を使い、取り出し元はリビジョンを選ぶ差分の UI だけに使う。`diffMode: blocks` と比較元を両方渡したときも、取り出し元からリビジョンを読まずに比較元で強調する。'
test_file: tests/e2e/単一ユースケース/比較元のMarkdownを渡して変更を強調する.spec.ts
