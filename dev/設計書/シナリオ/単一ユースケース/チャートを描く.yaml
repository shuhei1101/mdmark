title: "チャートを描く"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書を描くページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、文書を描く HTML
      - name: 棒のチャートを置いた Markdown
        description: '`<!-- html -->` の範囲の `html` のコードブロックに、見出し 1 つと `<mdmark-chart>` 1 つを置く文書'
        notes: '`<mdmark-chart>` の中身は、種類が棒・系列 2 つ・項目 4 つで、縦の軸の範囲を書かない定義'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: コードブロックの HTML の中の mdmark-chart の定義を読んで形を確かめる
        M->>M: グラフの部品で棒を描き、図の枠に載せる
        M-->>P: 図の枠に載せた題と凡例つきのチャートと、HTML の残り
        P-->>U: 文書を表示
    expected:
      - '`<mdmark-chart>` の場所に、`<!-- chart -->` で描いたときと同じ棒のグラフが、題と凡例つきで図の枠に載って描かれている'
      - 図の枠の右上に拡大・縮小・戻すのボタンがある
      - HTML の見出しがチャートの前に描かれ、定義の JSON の文字は描いた文書に残っていない
    test: test_normal
  - name: 異常シナリオ（定義を読めない）
    setup:
      - name: 文書を描くページ
        description: 正常シナリオと同じ
      - name: 読めない定義を置いた Markdown
        description: '`html` のコードブロックに、JSON として読めない `<mdmark-chart>` 1 つと、正しい `<mdmark-chart>` 1 つと段落を置く文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: mdmark-chart の定義を読んで形を確かめる
        M-->>P: 読めない定義の場所に書き方の警告、ほかはチャートと段落を描く
        P-->>U: 警告とチャートと段落を表示
    expected:
      - 読めない定義の場所に書き方の警告があり、読めない箇所が書かれている
      - 正しい定義のチャートが描かれている
      - 段落が描かれている
    test: test_error_when_definition_invalid
lead: 文書を書く人が、埋め込んだ HTML の中に図の部品の custom element（`<mdmark-chart>` など）を置き、中身に部品の定義（JSON）だけを書く。mdmark が、`<!-- chart -->` などの印と同じ図の部品で、HTML のその場所に図の枠に載せて描く。グラフの種類ごとの描き方は『図を描く』が確かめる。
issue: 6
primary_actor: 文書を書く人（AI を含む）
stakeholders:
  - name: 文書を書く人
    interest: スクリプトを書かずに、データだけで HTML の中にチャートを置ける
  - name: 読む人
    interest: どの文書のチャートも図の部品と同じ題・凡例・色で読める
trigger: 文書を書く人が、印で囲んだ `html` のコードブロックの中にチャートを置く
preconditions:
  - コードブロックの HTML を描ける（『コードブロックのHTMLを描く』）
  - 図の部品の機能（`diagrams`）がオン（既定）
success_guarantee: custom element の場所に、印で描いたときと同じ図の部品が図の枠に載って描かれる。定義の JSON は描いた文書に残らない。
minimal_guarantee: 定義を読めないチャートの場所には書き方の警告が出て、HTML の残りと文書の残りは描かれる。
