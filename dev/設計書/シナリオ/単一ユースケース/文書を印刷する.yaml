title: "文書を印刷する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
        notes: '配色はダーク（`prefers-color-scheme: dark`）'
      - name: 見本の Markdown
        description: 閉じた折り畳み（`details`）とリンクと表を持つ文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。印刷は、媒体を `print` にして印刷の前のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 印刷を始める
        B->>M: 印刷の前のイベント
        M->>M: 折り畳みを全て開く
        B->>B: 印刷向けの CSS を当てる
        B-->>U: 印刷の出力
    expected:
      - 折り畳み（`details`）が開いている
      - 描く先の要素の `--mdmark-color-bg` の計算値が明るい配色の値（ダークの配色が解除される）で、地の色は外れる
      - リンクの後ろに URL の文字が出ている
      - '表に改ページを避ける指定（`break-inside: avoid`）が当たっている'
    test: test_normal
  - name: 正常シナリオ（印刷を終える）
    setup:
      - name: 印刷中のページ
        description: 正常シナリオで印刷の前のイベントを送った後のページ
        notes: 印刷の前に開いていた折り畳みを 1 つ、閉じていた折り畳みを 1 つ持つ
      - name: Mock
        description: 正常シナリオと同じ。印刷の終わりは、媒体を `screen` に戻して印刷の後のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        B->>M: 印刷の後のイベント
        M->>M: 印刷の前の開閉に戻す
        B-->>U: 画面の表示に戻る
    expected:
      - 印刷の前に閉じていた折り畳みが閉じている
      - 印刷の前に開いていた折り畳みが開いている
    test: test_normal_when_print_finished
  - name: 正常シナリオ（記法を開いて出す）
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
      - name: 閉じた記法を持つ Markdown
        description: '2 つの中身を持つタブの範囲、`<!-- section: closed -->` の節、`<!-- row-detail: 1 -->` の行の詳細、`<!-- table: data closed -->` の表、`> [!NOTE]-` の注意書きを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ。印刷の終わりは、媒体を `screen` に戻して印刷の後のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 印刷を始める
        B->>M: 印刷の前のイベント
        M->>M: タブの全ての中身と閉じた記法を開く
        B-->>U: 印刷の出力
        B->>M: 印刷の後のイベント
        M->>M: 印刷の前の表示に戻す
        B-->>U: 画面の表示に戻る
    expected:
      - 印刷の前のイベントの後、タブの 2 つの中身がタブ名を題にして縦に並んで表示されている
      - 印刷の前のイベントの後、閉じた節・行の詳細・閉じた表・閉じた注意書きの中身が表示されている
      - 印刷の後のイベントの後、印刷の前に選んでいたタブだけが表示され、閉じていた記法が閉じている
    test: test_normal_when_syntax_expanded
  - name: 正常シナリオ（用語と被参照）
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、索引・描く文書の `id`・ほかの文書から算出した参照を渡して文書を描いた HTML
      - name: 用語と被参照を持つ索引
        description: 用語 `ワークスペース`（`avoid` に `作業場`）を持ち、文書 `api`（題 `API`）の `related` が描く文書を指す索引
      - name: 用語が出る Markdown
        description: 段落に `ワークスペース` と、やめた言い方 `作業場` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 下線の付いた語とマーカーの付いた語にフォーカスしてツールチップを出す
        U->>B: 印刷を始める
        B->>B: 印刷向けの CSS を当てる
        B-->>U: 印刷の出力
    expected:
      - '`ワークスペース` の下線が外れ、語は本文の文字として出ている'
      - ツールチップが出ていない
      - '`作業場` のやめた言い方のマーカーが外れ、語は本文の文字として出ている'
      - '`作業場` の語にフォーカスして出したツールチップが出ていない'
      - 被参照の一覧が出ていて、`API` のリンクの後ろに URL の文字が出ている
    test: test_normal_when_glossary_and_backlinks
  - name: 正常シナリオ（表の機能を印刷に出す）
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
      - name: 表の機能を持つ Markdown
        description: '`<!-- table: data +count +columns +total +copy +rowlink total=数量:sum hide=説明 -->` 〜 `<!-- /table -->` で、名前・説明・数量の 3 列 3 行の表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 印刷を始める
        B->>M: 印刷の前のイベント
        B->>B: 印刷向けの CSS を当てる
        B-->>U: 印刷の出力
    expected:
      - 表の上の列の表示の切り替えとコピーのボタンが出ていない
      - 行へのリンクの印が出ていない
      - 表の上の件数と、表の末尾の集計の行が出ている
      - 隠した説明の列は隠したまま出ていない
    test: test_normal_when_table_features_printed
  - name: 正常シナリオ（コードブロックの題と行を印刷に出す）
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
      - name: 飾ったコードブロックを持つ Markdown
        description: '`<!-- code: title=app.ts lines highlight=1 -->` の直後に、行末に `// [!code ++]` を付けた行と `// [!code --]` を付けた行を持つ 3 行の言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: 正常シナリオと同じ。色分けのライブラリの本体と `typescript` のモジュールも、jsDelivr と同じパスで返す手元の応答に差し替え、色分けし終えてから印刷を始める
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant B as ブラウザ
        participant M as mdmark
        U->>B: 印刷を始める
        B->>M: 印刷の前のイベント
        B->>B: 印刷向けの CSS を当てる
        B-->>U: 印刷の出力
    expected:
      - コードブロックの上に題 `app.ts` が出ている
      - 3 つの行の左に 1〜3 の行番号が出ている
      - 1 行目が強調の背景で、足した行と消した行がそれぞれの色と行頭の `+`・`-` で出ている
      - 行の中のキーワード・文字列などが、画面と同じ色分けの色で出ている
    test: test_normal_when_code_block_printed
lead: 読む人が mdmark の描いた文書を印刷・PDF にすると、折り畳みを全て開き、図表を改ページで切らず、ダークの配色を解除し、リンクの URL を併記して出す。印刷を終えると画面の表示に戻る。
issue: 3
primary_actor: 文書を読む人
stakeholders:
  - name: 印刷・PDF を受け取る人
    interest: 紙・PDF でも、畳まれた中身とリンクの行き先が読める
trigger: 読む人が、mdmark の描いた文書を開いたページでブラウザの印刷を始める
preconditions:
  - ページが mdmark で文書を描いている
  - 設定の `features.print` が `true`（既定）
success_guarantee: 印刷の出力で、折り畳みの中身・リンクの URL が読め、配色は明るい配色になる。
minimal_guarantee: 印刷を終えた後、画面の折り畳みは印刷の前の開閉に戻る。
test_file: tests/e2e/単一ユースケース/文書を印刷する.spec.ts
