title: "ClaudeCodeにプラグインを入れる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空の設定のフォルダ
        description: プラグインもマーケットプレイスも入っていない Claude Code の設定のフォルダ（`CLAUDE_CONFIG_DIR`）
      - name: push したブランチ
        description: ビルドした `plugin/` を含むこのブランチを GitHub へ push したもの
        notes: マーケットプレイスは `shuhei1101/mdmark#{ブランチ}` で足す。ローカルのパスで足すとプラグインがその場で読まれ、依存が入らない
      - name: Mock
        description: なし（GitHub と npm のレジストリから実際に入れる。モデルは使わない）
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code
        participant R as GitHub の mdmark のリポジトリ
        W->>C: claude plugin marketplace add shuhei1101/mdmark#{ブランチ}
        C->>R: .claude-plugin/marketplace.json を読む
        R-->>C: プラグイン mdmark の行
        C-->>W: マーケットプレイス mdmark を足した
        W->>C: claude plugin install mdmark@mdmark
        C->>C: plugin/ をキャッシュへ写す
        C->>C: キャッシュに plugin/package.json の依存を入れる
        C-->>W: プラグインを入れた・終了コード 0
    expected:
      - '`claude plugin marketplace add` と `claude plugin install mdmark@mdmark` がどちらも終了コード 0 で終わる'
      - '`claude plugin list` に `mdmark@mdmark` が有効として出、`Read from:` が設定のフォルダのプラグインのキャッシュの下'
      - '`Read from:` の場所に `hooks/hooks.json`・`.mcp.json`・束ねた MCP サーバーと、`node_modules` の依存がある'
      - '`Read from:` の場所の MCP サーバーを `.mcp.json` のコマンドで起動すると、ツールの一覧を返す'
    test: test_normal
lead: 文書を書く人が、mdmark のリポジトリを Claude Code のマーケットプレイスとして足し、mdmark のプラグインを入れる。
issue: 11
primary_actor: 文書を書く人
trigger: Claude Code で mdmark の文書を書き始める前
preconditions:
  - 文書を書く人の手元に Claude Code と git と Node 24 以降がある
  - 文書を書く人の手元から GitHub と npm のレジストリへ届く
success_guarantee: プラグインが有効になり、次に開くセッションで SessionStart のフックと MCP サーバー `plugin:mdmark:mdmark` が読み込まれる。プラグインが使う依存（`plugin/package.json` に書いたもの）がプラグインの置き場所に入っている。
minimal_guarantee: マーケットプレイスの定義が読めないときは、Claude Code が理由を出してプラグインを入れない。手元の他のプラグインの設定は変わらない。
