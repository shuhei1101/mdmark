title: 図のグループの中へ入る・開閉する
lead: 読者が、map の図のグループの中へ入ってグループの中だけを見て、戻るボタンか Esc で戻り、グループを閉じて中への線を閉じたグループへまとめる。
issue: 324
test_file: tests/e2e/単一ユースケース/図のグループの中へ入る・開閉する.spec.ts
primary_actor: 読者
trigger: 読者が、大きい構成図の 1 つのグループを詳しく見たくなる、またはグループの中を隠して全体を見たくなる
preconditions:
  - 文書に map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 中へ入るとグループの中だけが配置し直され、外は薄く残り、戻るボタンと Esc で 1 段ずつ外へ戻れる。閉じたグループへの線は 1 本にまとまり、件数とツールチップの元の線が出る。開閉と中へ入った状態は、同じタブの中でページを読み込み直しても保つ。
minimal_guarantee: 戻る・開くと、元の図と同じ配置に戻る。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオの構成図を描いたページ
        notes: 外のグループの外に、中のグループの中のノードへの線を持つノードがある
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 外のグループをダブルクリックする
        D-->>U: 外のグループの中だけを配置し直し、外を薄く残して図の右上に戻るボタンを出す
        U->>D: 中のグループにフォーカスして Enter を押す
        D-->>U: 中のグループの中だけを配置し直す
        U->>D: 戻るボタンを押す
        D-->>U: 外のグループの中に戻す
        U->>D: Esc を押す
        D-->>U: 全体の図に戻す
    expected:
      - 中へ入ると、入ったグループの中のノードだけが重ならずに配置し直され、外のノードは薄く描かれる
      - 外から中のノードへの線が、薄く描かれた外のノードから引かれる
      - 戻るボタンと Esc で 1 つ外の段へ戻り、全体の図では戻るボタンが出ない
      - 中へ入る・戻る操作で、図の倍率と図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
      - 全体の図に戻ると、入る前と同じ配置になる
      - ダブルクリックと Enter のどちらでも中へ入れ、グループにキーボードのフォーカスが当たる
    test: test_normal
  - name: 正常シナリオ（グループを閉じる）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
        notes: 閉じるグループの中のノードから、グループの外の同じノードへの線が 2 本ある
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: グループの開閉のボタンを押す
        D-->>U: グループを 1 つのノードに閉じ、中への線を付け替えてまとめる
        U->>D: まとめた線の件数にポインターを当てる
        D-->>U: ツールチップに、まとめた元の線を出す
        U->>D: 同じタブでページを読み込み直す
        D-->>U: グループを閉じた状態で描く
        U->>D: グループの開閉のボタンを押す
        D-->>U: グループを開き、元の配置に戻す
    expected:
      - 閉じたグループが、グループの名前と中のノードの数を持つ 1 つのノードで描かれ、空いた分が詰めて配置し直される
      - 閉じたグループの外の同じノードへの 2 本の線が 1 本にまとまり、件数の 2 が出る
      - まとめた線の件数のツールチップに、元の 2 本の線の端のノードの名前が出る
      - ページを読み込み直しても、グループを閉じた状態で描かれる
      - 開くと閉じる前と同じ配置に戻る
      - 開閉のボタンがスクリーンリーダー向けの名前と、開いているか閉じているかの状態を持つ
    test: test_normal_when_collapsed
  - name: 正常シナリオ（印の引数で最初に入る）
    setup:
      - name: 図を描くページ
        description: 『Mermaidと補足で図を描く』の正常シナリオと同じ
      - name: 最初の見せ方を持つ map の Markdown
        description: 正常シナリオの構成図の印に `focus=` で外のグループの ID を指定した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant D as map の図
        P->>D: 設定と Markdown を指定して描かせる
        D-->>U: 指定のグループに入った図
    expected:
      - 開いたときに、指定のグループの中に入った図と戻るボタンが出る
      - 戻るボタンで全体へ戻ると、正常シナリオの全体の図と同じ配置になる
    test: test_normal_when_initial_focus
