title: 図のグループの中へ入る・開閉する
lead: 読者が、map の図のグループの中へ入ってグループの中だけを見て、戻るボタンか Esc で戻り、グループを閉じて中への線を閉じたグループへまとめる。
issue: 324
test_file: tests/e2e/単一ユースケース/図のグループの中へ入る・開閉する.spec.ts
primary_actor: 読者
trigger: 読者が、大きい構成図の 1 つのグループを詳しく見たくなる、またはグループの中を隠して全体を見たくなる
preconditions:
  - 文書に map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 中へ入るとグループの中だけが配置し直され、外は薄く残り、戻るボタンと Esc で 1 段ずつ外へ戻れる。閉じたグループへの線は 1 本にまとまり、説明を持つ元の線はポインターを当てるとツールチップに出る。開閉と中へ入った状態は、同じタブの中でページを読み込み直しても保つ。
minimal_guarantee: 戻る・開くと、元の図と同じ配置に戻る。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 『Mermaidと補足で図を描く』の正常シナリオの構成図を描いたページ
        notes: 外のグループの外に、中のグループの中のノードへの線を持つノードがある
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 外のグループのタイトルを押す
        D-->>U: 外のグループの中だけを配置し直し、外を薄く残して図の右上に戻るボタンを出す
        U->>D: 中のグループのタイトルにフォーカスして Enter を押す
        D-->>U: 中のグループの中だけを配置し直す
        U->>D: 戻るボタンを押す
        D-->>U: 外のグループの中に戻す
        U->>D: Esc を押す
        D-->>U: 全体の図に戻す
    expected:
      - 中へ入ると、入ったグループの中のノードだけが重ならずに配置し直され、外のノードは薄く描かれる
      - 外から中のノードへの線が、薄く描かれた外のノードから引かれる
      - 戻るボタンと Esc で 1 つ外の段へ戻り、全体の図では戻るボタンが出ない
      - 中へ入る・戻る操作で、図の倍率・表示する枠の高さ・図の枠の中のスクロールの位置・文書のスクロールの位置が変わらない
      - 中へ入る・戻ると、残るノードとグループが前の位置から今の位置へ動く
      - 全体の図に戻ると、入る前と同じ配置になる
      - タイトルのボタンを押す（キーボードでは Enter）と中へ入り、今入っているグループのタイトルは押せない文字で出る
      - 図の右上のツールの先頭に、戻る・全て開く・全て閉じるが、全体の図でもグループの中でも同じ位置に並び、全体の図では戻るが押せない。図を動かす矢印のボタンは出ない
    test: test_normal
  - name: 正常シナリオ（グループを閉じる）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
        notes: 閉じるグループの中のノードから、グループの外の同じノードへの線が 2 本ある
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: グループの開閉のボタンを押す
        D-->>U: グループを 1 つのノードに閉じ、中への線を付け替えてまとめる
        U->>D: まとめた線にポインターを当てる
        D-->>U: ほかのノードと線を薄くし、ツールチップにまとめた元の線と説明を出す
        U->>D: 同じタブでページを読み込み直す
        D-->>U: グループを閉じた状態で描く
        U->>D: グループの開閉のボタンを押す
        D-->>U: グループを開き、元の配置に戻す
    expected:
      - 閉じたグループが、グループの名前と中のノードの数を持つ 1 つのノードで描かれ、空いた分が詰めて配置し直される
      - 閉じたグループの外の同じノードへの 2 本の線が 1 本にまとまり、本数とラベルが出ない
      - まとめた線にポインターを当てると線と両端のノードのほかが薄くなり、ツールチップに補足の `notes` に説明を持つ元の線の端のノードの名前と説明が出る。説明を持つ線が無いときはツールチップが出ない
      - ページを読み込み直しても、グループを閉じた状態で描かれる
      - 開くと閉じる前と同じ配置に戻る
      - 開閉のボタンがスクリーンリーダー向けの名前と、開いているか閉じているかの状態を持つ
    test: test_normal_when_collapsed
  - name: 正常シナリオ（中のグループごと開閉する）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ。補足の `layout` で、中のグループの 1 つを最初に閉じる指定を持つ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 図を開く
        D-->>U: 指定の中のグループを閉じた図
        U->>D: Shift を押しながら外のグループの開閉のボタンを押す
        D-->>U: 外のグループと中のグループを全て閉じる
        U->>D: 右上の全て開くを押す
        D-->>U: 全てのグループを開く
    expected:
      - 開いたときに、補足で指定した中のグループだけが閉じ、ほかのグループは開いている
      - Shift を押しながら押すと、外のグループと中の全てのグループが閉じ、外のグループを開いても中のグループは閉じたまま
      - 全て開くで全てのグループが開き、全て閉じるで全てのグループが閉じる
    test: test_normal_when_nested_toggle
  - name: 正常シナリオ（印の引数で最初に入る）
    setup:
      - name: 図を描くページ
        description: 『Mermaidと補足で図を描く』の正常シナリオと同じ
      - name: 最初の見せ方を持つ map の Markdown
        description: 正常シナリオの構成図の印に `focus=` で外のグループの ID を指定した文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant P as 利用側のページ
        participant D as map の図
        P->>D: 設定と Markdown を指定して描かせる
        D-->>U: 指定のグループに入った図
    expected:
      - 開いたときに、指定のグループの中に入った図と戻るボタンが出る
      - 戻るボタンで全体へ戻ると、正常シナリオの全体の図と同じ配置になる
    test: test_normal_when_initial_focus
  - name: 正常シナリオ（シーケンス図のブロックを開閉し、中だけを見る）
    setup:
      - name: 図を描いたページ
        description: map のシーケンス図（名前の無いブロック 1 つと、`loop` の中の `alt` / `else`）を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as シーケンス図
        U->>D: alt のタブの山形を押す
        D-->>U: alt を、名前とメッセージの数の 1 行に閉じる
        U->>D: loop のタブの名前を押す
        D-->>U: loop の中のメッセージと、関わる参加者だけの図にする
        U->>D: 右上の戻るボタンを押す
        D-->>U: 全体の図に戻す
        U->>D: 右上の「全てのブロックを閉じる」を押す
        D-->>U: 一番外のブロックを全て閉じる
    expected:
      - 閉じた alt が「alt と名前・メッセージ 4 件」の 1 行になり、中のメッセージが出ず、再生の帯の数が閉じたメッセージの分だけ減る
      - loop の中だけを見ると、loop の中のメッセージに関わる参加者だけが並び、図の範囲の表示が「loop「map の範囲ごと」の中」になる
      - 戻るボタンで全体の図に戻り、ブロックの中だけを見ていないときは戻るボタンが押せない
      - 名前の無いブロックのタブに、確認事項で決めた方法で付けた名前が出る
      - Shift を押しながら山形を押すと、そのブロックと中のブロックが全て開閉する
    test: test_normal_when_sequence_blocks
