title: "表から用語集に用語を入れる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、索引を渡さずに文書を描く HTML
      - name: 用語集の表を持つ Markdown
        description: '`<!-- glossary: term=用語 aliases=別名 meaning=意味 -->` 〜 `<!-- /glossary -->` で、用語 `印`（別名 `マーク、オン・オフの印`、意味 `HTML コメントで書く指定`）の行を持つ表を囲み、表の後の段落に `マーク` が、別の節の段落に `オン・オフの印` が出る文書'
        notes: 別名のセルは「、」で区切り、「・」では区切らない
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: Markdown を渡して描かせる
        M->>M: glossary の印で囲んだ表の列から用語を入れる
        M-->>P: 表を描き、本文の用語に下線を引く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 表の意味のツールチップを表示
    expected:
      - 用語集の表が表として描かれ、表の中の語には下線が付いていない
      - 段落の `マーク` に破線の下線が付き、ポインターを乗せると `HTML コメントで書く指定` のツールチップが出る
      - 別の節の `オン・オフの印` が 1 つの下線になり、`オン` だけの下線にはならない
      - 本文に印の文字（`<!--`・`glossary`）が出ていない
    test: test_normal
  - name: 正常シナリオ（索引に同じ語がある）
    setup:
      - name: mdmark を読むページ
        description: 索引と描く文書の `id` を渡して文書を描く。ほかは正常シナリオと同じ
      - name: 同じ語を持つ索引
        description: 用語 `印`（意味 `索引に書いた意味`）を持ち、描く文書を `docs` に持つ索引
      - name: 用語集の表を持つ Markdown
        description: 正常シナリオと同じ表を持ち、表の後の段落に `印` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 表の用語より索引の用語を優先する
        M-->>P: 本文の用語に下線を引く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 索引の意味のツールチップを表示
    expected:
      - 段落の `印` のツールチップが `索引に書いた意味`
      - 表の意味の列の文字はツールチップに出ていない
    test: test_normal_when_index_has_same_term
  - name: 異常シナリオ（表に無い列名）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 列名を誤った Markdown
        description: '`<!-- glossary: term=用語 meaning=説明 -->` で、列が `用語`・`意味` の表を囲んだ文書'
        notes: '`説明` の列は表に無い'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: Markdown を渡して描かせる
        M->>M: 列名が表に無い印の表から用語を入れない
        M-->>P: 表と書き方の警告を描く
        P-->>U: 表と警告を表示
    expected:
      - 表が描かれている
      - 表のあたりに、表に無い列名 `説明` と直し方を書いた書き方の警告がある
      - 本文の語に下線が付いていない
    test: test_error_when_unknown_column
  - name: 正常シナリオ（ほかの文書の表）
    setup:
      - name: mdmark を読むページ
        description: 索引・描く文書の `id`・ほかの文書から算出した参照を渡して文書を描く。ほかは正常シナリオと同じ
      - name: 2 つの文書を持つ索引
        description: 文書 `glossary`（用語集のページ）と `guide` を持ち、`terms` を持たない索引
      - name: ほかの文書の本文
        description: '`glossary` の本文が、正常シナリオと同じ用語集の表だけを持つ'
      - name: 描く Markdown
        description: '`guide` の本文。用語集の表を持たず、段落に `マーク` が出る'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・参照・Markdown を渡して描かせる
        M->>M: ほかの文書の表から入れた用語を照合する
        M-->>P: 本文の用語に下線を引く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 表の意味のツールチップを表示
    expected:
      - '`guide` の段落の `マーク` に破線の下線が付き、ポインターを乗せると `HTML コメントで書く指定` のツールチップが出る'
    test: test_normal_when_other_document
lead: '文書を書く人が本文の表を `<!-- glossary: term=列名 meaning=列名 aliases=列名 -->` 〜 `<!-- /glossary -->` で囲むと、mdmark がその表の用語・意味・別名の列から用語を入れ、本文に出たその語に意味のツールチップを付ける。'
issue: 5
primary_actor: 文書を書く人
stakeholders:
  - name: 文書を読む人
    interest: 文書の用語集の表に書いた意味を、本文のその場で引ける
  - name: 文書を書く人
    interest: 索引を持たない文書でも、書いている用語集の表をそのまま使え、GitHub でも表として読める
trigger: 使う側のページが、用語集の表を持つ文書を描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
  - 用語のツールチップの機能（`glossary`）がオン（既定）
success_guarantee: 用語集の表の用語と別名が本文に出ると、表の意味の列の文字をツールチップに出す。索引に同じ語があれば、索引の意味を出す。
minimal_guarantee: 印の列名が表に無いときも、表と本文は描かれ、書き方の警告がその箇所に出る。
refs:
  - dev/設計書/シナリオ/単一ユースケース/用語の意味をツールチップで見る#
  - dev/設計書/シナリオ/単一ユースケース/表を操作する#
