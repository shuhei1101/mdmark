summary: ユーザーの 1 操作の範囲の正常・異常のシナリオ
items:
  - page: 配布物をビルドして検査する.yaml
    summary: 開発者が依存の導入・lint・型検査・ビルド・テストを流し、版を埋めた配布物を得る
  - page: 版を固定して配布物を読み込む.yaml
    summary: 使う側のページが版のタグを固定した URL で配布物を読み、公開関数を呼ぶ
  - page: 文書を描く.yaml
    summary: 使う側のページが要素と Markdown を渡して文書を描き、本文の差し替えと片付けをする
  - page: 文書をHTML文字列にする.yaml
    summary: 使う側の処理が画面を持たずに Markdown を HTML 文字列にする
  - page: テーマを上書きする.yaml
    summary: 使う側が自分の CSS で描いた文書の見た目を変える
  - page: 機能のオン・オフを文書で上書きする.yaml
    summary: 設定の features を既定にし、文書の印でその文書だけ機能をオン・オフする
  - page: 外部ライブラリを使うときだけ読み込む.yaml
    summary: 文書に印があるときだけ外部ライブラリを読み、読めない箇所に知らせの枠を出す
  - page: 文書を印刷する.yaml
    summary: 印刷・PDF で折り畳みを開き、ダークを解除し、リンクの URL を併記して出す
  - page: 表を操作する.yaml
    summary: 印で囲んだ表を、読む人が並べ替え・絞り込み・ピン止めし、閉じた表を開く
  - page: 注意書きを書く.yaml
    summary: GitHub と同じ `> [!NOTE]` などの引用を、種類ごとの注意書きの枠に描く
  - page: タブを切り替える.yaml
    summary: 印で囲んだ見出しごとの節をタブに描き、読む人が切り替える
  - page: ステップ・ファイルツリー・バッジで本文を組む.yaml
    summary: 番号付きリスト・罫線のフォルダ構成・`badge:` の行内のコードを、手順・ファイルツリー・バッジに描く
  - page: 目次と見出しのアンカーで節へ移る.yaml
    summary: 見出しに GitHub と同じ ID とリンクを付け、印の場所の目次から節へ移る
  - page: 節と行の詳細を開閉する.yaml
    summary: 見出しの節と、表の行の下に出す行の詳細を、印のとおりの開閉から開閉する
  - page: 図と表に番号を付けて参照する.yaml
    summary: 印を付けた図と表に通し番号を付け、参照のリンクの文字を番号にする
  - page: 拡張を登録して印を足す.yaml
    summary: 使う側が `registerExtension` で印を足し、印のある文書でだけモジュールを読んで描かせる
  - page: 用語の意味をツールチップで見る.yaml
    summary: 索引の用語が本文に出たら下線を引き、ポインターとフォーカスで意味を出す
  - page: 表から用語集に用語を入れる.yaml
    summary: 印で囲んだ表の用語・意味・別名の列から用語を入れる
  - page: 被参照を見る.yaml
    summary: 描いた文書を参照している文書と、用語が出る文書を見る
  - page: 索引と文書のずれを点検する.yaml
    summary: 使う側の処理が索引と文書を渡し、ずれの一覧を受け取る
  - page: 雛形を置く.yaml
    summary: 文書を書く人が `mdmark init` で設定・使う側の CSS・索引・拡張のビルドの雛形を置く
  - page: 設定と索引を点検する.yaml
    summary: 文書を書く人が `mdmark check` で設定と索引の形・索引と文書のずれ・書き出す対象を確かめる
  - page: 文書をHTMLに書き出す.yaml
    summary: 文書を書く人が `mdmark export` で 1 文書を、外を読まない 1 枚の HTML に書き出す
  - page: 複数の文書を1枚のHTMLにまとめる.yaml
    summary: 文書を書く人が `mdmark build` で、参照・被参照・用語のツールチップが効く 1 枚の HTML にまとめる
  - page: まとめたHTMLで文書を行き来する.yaml
    summary: 読む人がまとめた HTML を file:// で開き、文書の一覧・リンク・戻ると進むで文書を行き来する
  - page: 版を上げる.yaml
    summary: 文書を書く人が `mdmark upgrade` で移行の手順を版の順に当て、点検を通してから設定の版を書き換える
  - page: 図を描く.yaml
    summary: 文書に部品の定義を書き、共通の部品にフロー図・シーケンス図・グラフを図の決まりのとおりに描かせる
  - page: 図を拡大・縮小・移動する.yaml
    summary: 読む人が図を右上のボタンとキーで拡大・縮小し、ドラッグ・矢印キー・ボタンで動かす
  - page: 図の要素のツールチップを見る.yaml
    summary: 読む人が図の矢印・箱・箱の中の用語の詳細を、ホバーとフォーカスで出るツールチップで読む
  - page: 操作できる部品で値を変えて写す.yaml
    summary: 読む人がスライダーで値を変えてグラフを見、今の値を JSON にしてクリップボードへ写す
  - page: 固有の部品とCSSを当てる.yaml
    summary: 使う側が自分の場所だけの部品を `registerExtension` で足し、自分の場所だけの見た目を CSS で当てる
  - page: 足すJavaScriptを型で点検する.yaml
    summary: 使う側が `// @ts-check` と JSDoc で書いた JavaScript を、配布物の型定義に対して `tsc --noEmit` で点検する
  - page: コードブロックのHTMLを描く.yaml
    summary: 印で囲んだ `html` のコードブロックを、スクリプトを落としてその場の HTML として描く
  - page: チャートを描く.yaml
    summary: 埋め込んだ HTML の custom element に書いた定義から、図の部品をその場所に図の枠に載せて描く
  - page: ビューで項目を見る.yaml
    summary: 印で囲んだ項目の表を、読む人がボード表示と表形式のビューで切り替えて見る
  - page: 全項目を検索する.yaml
    summary: ビューの全ての項目を、検索欄の文字で全ての列から絞り込む
  - page: 選んだ箇所にコメントする.yaml
    summary: 読む人が本文の選んだ箇所にコメントを付け、使う側の読み書きの関数で残す
  - page: 部品をJavaScriptから使う.yaml
    summary: 使う側がページと拡張のモジュールから部品の関数を呼び、要素にビューと検索欄を描き、選んだ箇所にコメントを付ける
