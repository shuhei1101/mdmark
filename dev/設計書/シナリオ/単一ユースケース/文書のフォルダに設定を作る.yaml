title: 文書のフォルダに設定を作る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書のフォルダ
        description: '`mdmark.config.yaml` と索引の無いフォルダに、Markdown を 1 つ置く'
      - name: Mock
        description: スキルを読むモデルの代わりに、スキルの手順が呼ぶスクリプトを手順の順に流し、利用者への確認には決めた答えを返す。`features.callout` だけ `false` を、ほかは既定のままを答え、書いてよいかには認める答えを返す
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（setup）
        participant F as mdmark.config.yaml
        W->>C: /mdmark:setup
        C-->>W: 文書のフォルダと、mdmark.config.yaml が無いこと
        loop mdmark.config.yaml のキーごと
          C-->>W: キーの既定と、端末の設定で重なる値
          W->>C: 値
        end
        C-->>W: 書く内容
        W->>C: 書いてよい
        C->>F: 雛形に答えた値を入れて書く
        C-->>W: 書いたパスと値
    expected:
      - '文書のフォルダに `mdmark.config.yaml` があり、`features.callout: false` を持つ'
      - '`mdmark check` と同じ点検が設定の形のずれを返さない'
      - 最後の報告に、書いたパスと既定から変えたキーが出る
    test: test_normal
  - name: 正常シナリオ（設定がある）
    setup:
      - name: 設定のある文書のフォルダ
        description: 'コメントの行と `features.table: false` を持つ `mdmark.config.yaml` を置いたフォルダ'
      - name: Mock
        description: 正常シナリオと同じ。`features.callout` だけ `false` を、ほかは今の値のままを答える
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（setup）
        participant F as mdmark.config.yaml
        W->>C: /mdmark:setup
        C->>F: 読む
        loop mdmark.config.yaml のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 値
        end
        C-->>W: 変えるキー
        W->>C: 書いてよい
        C->>F: 変えるキーだけ書き換える
        C-->>W: 変えたキー
    expected:
      - '`mdmark.config.yaml` が `features.callout: false` と `features.table: false` を持つ'
      - '`features.callout` の行のほかの行（コメントの行を含む）が呼ぶ前と同じ'
    test: test_normal_when_config_exists
  - name: 異常シナリオ（書くことを断る）
    setup:
      - name: 文書のフォルダ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。書いてよいかには断る答えを返す
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（setup）
        participant F as mdmark.config.yaml
        W->>C: /mdmark:setup
        loop mdmark.config.yaml のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 書く内容
        W->>C: 書かない
        C-->>W: 書かなかったこと
    expected:
      - 文書のフォルダに `mdmark.config.yaml` が無い
      - 最後の報告に、書かなかったことが出る
    test: test_error_when_write_declined
lead: 文書を書く人が Claude Code で `setup` を呼び、文書のフォルダの `mdmark.config.yaml` をキーごとに確認しながら作る・修正する。
issue: 165
primary_actor: 文書を書く人
stakeholders:
  - name: 文書を書く人
    interest: 設定のリファレンスを読まずに、キーごとに今の値と既定を見て答えるだけで、文書のフォルダの設定がそろう。手で書いたコメントや変えないキーはそのまま残る
trigger: 文書を書く人が、新しい文書のフォルダで mdmark を使い始めるか、文書のフォルダの設定を見直すとき
preconditions:
  - Claude Code に mdmark のプラグインを入れている
  - 文書を書く人の手元に Node 24 以降がある
success_guarantee: 文書のフォルダの `mdmark.config.yaml` が、文書を書く人が答えた値を持ち、設定の形のずれが無い。
minimal_guarantee: 文書を書く人が書くことを認めなかったときは、`mdmark.config.yaml` を作らず、書き換えない。
test_file: tests/e2e/単一ユースケース/文書のフォルダに設定を作る.spec.ts
