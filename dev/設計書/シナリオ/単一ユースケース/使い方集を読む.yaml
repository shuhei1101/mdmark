title: "使い方集を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 起動した dev-docs
        description: 一時フォルダの端末の設定（`DEV_DOCS_CONFIG`）にこのリポジトリを配信元 `mdmark` として登録し、空きポートで待ち受ける dev-docs
      - name: 起動した常駐サーバー
        description: ビルドしたこのリポジトリの `mdmark serve` を、`MDMARK_PORT` に空きポートを指定して起動したもの
      - name: Mock
        description: Claude Code の代わりに、mdmark の常駐サーバーと dev-docs へ HTTP でつなぐ MCP のクライアントを使う。モデルは使わない
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark の MCP サーバー
        participant D as dev-docs
        C->>M: initialize
        M-->>C: instructions（書く前に使い方集を参照し、書いた後に check で点検する）
        C->>D: search_docs（source: mdmark、kind: docs、タグ topic:使い方集）
        D-->>C: 使い方集のページの一覧
        C->>D: search_docs（ID: writing のページ、view: full）
        D-->>C: ページの本文
    expected:
      - mdmark の MCP サーバーの instructions に、書く前に dev-docs の `search_docs` で mdmark の配信元の `docs` の行をタグ `topic:使い方集` で絞って使い方集を参照し、書いた後に `check` で点検する動線がある
      - タグで絞った一覧に、`guide/index.yaml` の全ての `page` のページがある
      - '`writing` の `page`（`docs/使い方/書く/文書の書き方.md`）の本文が、リポジトリのそのファイルと一致する'
    test: test_normal
  - name: 異常シナリオ（dev-docs が無い）
    setup:
      - name: dev-docs の無い環境
        description: '`DEV_DOCS_CONFIG` が無いファイルを指し、dev-docs が待ち受けていない'
      - name: 起動した常駐サーバー
        description: 正常シナリオと同じ
      - name: Mock
        description: Claude Code の代わりに、mdmark の常駐サーバーへ HTTP でつなぐ MCP のクライアントを使う。モデルは使わない
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant M as mdmark の MCP サーバー
        C->>M: initialize
        M-->>C: instructions（dev-docs が無いときは見つからないこと）
        C->>M: tools/list
        M-->>C: export_html・build_site・check
    expected:
      - mdmark の MCP サーバーの instructions に、dev-docs が無い、または mdmark の配信元が登録されていないときは「dev-docs が無いので見つかりません」とある
      - mdmark の MCP のツールの一覧に `read_guide` が無い
      - dev-docs の端末の設定のファイルが作られていない
    test: test_error_when_dev_docs_missing
lead: Claude Code が、mdmark の MCP の instructions に沿って、dev-docs の `search_docs` で mdmark の配信元から使い方集のページを受け取る。
issue: 186
primary_actor: Claude Code
trigger: Claude Code が mdmark の文書を書く前に、記法・部品・図の描き方・拡張の仕方を確かめる
preconditions:
  - ビルドしたこのリポジトリの `mdmark serve` で、MCP の常駐サーバーが起動している
success_guarantee: dev-docs の `search_docs` で、mdmark の配信元の使い方集のページの一覧と本文を受け取れる。
minimal_guarantee: dev-docs が無いときも、mdmark の MCP の instructions から「dev-docs が無いので見つかりません」と分かる。mdmark は dev-docs の端末の設定を作らない。
test_file: tests/e2e/単一ユースケース/使い方集を読む.spec.ts
refs:
  - dev/設計書/シナリオ/単一ユースケース/名前の色で表・バッジ・本文を強調する#
  - dev/設計書/シナリオ/単一ユースケース/画像・動画・音声を置く#
