title: "用語の意味をツールチップで見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、索引と描く文書の `id` を渡して文書を描く HTML
      - name: 用語を持つ索引
        description: 用語 `ワークスペース`（別名 `WS`、意味 `話し合いの記録を置くフォルダ`）と用語 `印`（意味 `HTML コメントで書く指定`）を持ち、描く文書を `docs` に持つ索引
      - name: 用語が出る Markdown
        description: 1 つ目の節の段落に `ワークスペース` が 2 回と `WS` が出て、2 つ目の節の段落に `WS` と `印刷` が出る文書
        notes: '`印刷` は用語 `印` を含むが、語の区切りは `印刷` の 1 語'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 語の区切りに揃う用語の語と別名を照合する
        M-->>P: 節ごとに用語を最初に出たところだけに下線を引いて描く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 用語の意味のツールチップを表示
    expected:
      - 1 つ目の節では、最初の `ワークスペース` だけに破線の下線が付き、2 回目の `ワークスペース` と同じ用語の別名 `WS` には付いていない
      - 2 つ目の節では `WS` に破線の下線が付いている
      - '`印刷` の `印` には下線が付いていない'
      - '`WS` にポインターを乗せると `話し合いの記録を置くフォルダ` のツールチップが出る'
      - ツールチップは `WS` の上に出る（ツールチップの下端が語の上端より上にある）
      - ツールチップの上へポインターを移しても、ツールチップが出たまま
    test: test_normal
  - name: 正常シナリオ（キーボードで読む）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 用語を持つ索引
        description: 正常シナリオと同じ
      - name: 用語が出る Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M-->>P: 用語に下線を引いて描く
        U->>P: Tab で下線の付いた語へフォーカスを移す
        P-->>U: 用語の意味のツールチップを表示
        U->>P: Esc を押す
        P-->>U: ツールチップを消す
    expected:
      - Tab で下線の付いた語にフォーカスが移る
      - フォーカスした語の `aria-describedby` が、`role="tooltip"` を持つ意味の要素を指す
      - Esc を押すとツールチップが消え、フォーカスは語に残る
    test: test_normal_when_keyboard
  - name: 正常シナリオ（下線を付けない場所）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 用語を持つ索引
        description: 正常シナリオと同じ
      - name: 用語が出る場所を分けた Markdown
        description: 見出し・行内のコード・コードブロック・リンクの文字の中にだけ `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 見出し・コード・リンクの中を照合から外す
        M-->>P: 下線を引かずに描く
        P-->>U: 本文を表示
    expected:
      - 見出し・行内のコード・コードブロック・リンクの中の `ワークスペース` に下線が付いていない
      - 本文の文字は Markdown のとおり
    test: test_normal_when_excluded_place
  - name: 正常シナリオ（索引を渡さない）
    setup:
      - name: mdmark を読むページ
        description: 索引を渡さずに文書を描く。ほかは正常シナリオと同じ
      - name: 用語が出る Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: Markdown だけを渡して描かせる
        M-->>P: 下線を引かずに描く
        P-->>U: 本文を表示
    expected:
      - '`ワークスペース` と `WS` に下線が付いていない'
      - 段落が描かれている
    test: test_normal_when_no_index
  - name: 異常シナリオ（Schema に合わない索引）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: Schema に合わない索引
        description: 用語 `ワークスペース` は正しく持ち、用語 `ブランチ` が `meaning` を持たない索引
      - name: 2 つの用語が出る Markdown
        description: 段落に `ワークスペース` と `ブランチ` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 形の合わない用語を除く
        M-->>P: 読めた用語だけに下線を引いて描く
        P-->>U: 本文を表示
    expected:
      - 段落が描かれている
      - '`ワークスペース` に下線が付き、意味のツールチップが出る'
      - '`ブランチ` に下線が付いていない'
    test: test_error_when_invalid_index
  - name: 正常シナリオ（埋め込んだ HTML の中の用語）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 用語を持つ索引
        description: 正常シナリオと同じ
      - name: 用語が HTML の中に出る Markdown
        description: '`<!-- html -->` の範囲の `html` のコードブロックの段落に `ワークスペース` が出て、その後ろの Markdown の段落にも `ワークスペース` が出る文書。HTML の中には `ワークスペース` を文字に持つリンクも 1 つ置く'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 埋め込んだ HTML の文字も用語と照合する
        M-->>P: HTML の中の用語にも下線を引いて描く
        U->>P: HTML の中の下線の語にフォーカスする
        P-->>U: 用語の意味のツールチップを表示
    expected:
      - HTML の中の段落の `ワークスペース` に、本文の用語と同じ破線の下線が引かれている
      - その語にフォーカスすると `話し合いの記録を置くフォルダ` のツールチップが出る
      - HTML の中のリンクの文字には下線が引かれていない（本文のリンクと同じ扱い）
      - 埋め込んだ HTML の中は範囲ごとに数え、本文の節とは別に数えるため、後ろの Markdown の段落の `ワークスペース` にも下線が引かれる（下線は HTML の中と後ろの段落で合わせて 2 つ）
    test: test_normal_when_embedded_html
  - name: 正常シナリオ（やめた言い方が本文に出る）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: やめた言い方を持つ索引
        description: 用語 `ワークスペース`（意味 `話し合いの記録を置くフォルダ`、`avoid` に `作業場`）を持ち、描く文書を `docs` に持つ索引
      - name: やめた言い方が出る Markdown
        description: 1 つ目の節の段落に `作業場` が 2 回と `ワークスペース` が 1 回出て、2 つ目の節の段落に `作業場` が出る文書。見出しと行内のコードにも `作業場` を書く
        notes: 節ごとに最初の 1 回だけにマーカーが付くことを、1 つ目の節に 2 回書いて決定的に起こす
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 語の区切りに揃う用語の語・別名とやめた言い方を照合する
        M-->>P: 節ごとにやめた言い方が最初に出たところだけにマーカーを付けて描く
        U->>P: マーカーの付いた語にポインターを乗せる
        P-->>U: 代わりの用語と意味のツールチップを表示
        U->>P: Tab でマーカーの付いた語へフォーカスを移し、Esc を押す
        P-->>U: ツールチップを消す
    expected:
      - 1 つ目の節では、最初の `作業場` だけにマーカーが付き、2 回目の `作業場` には付いていない
      - 1 つ目の節の `ワークスペース` には、やめた言い方のマーカーではなく用語の破線の下線が付いている
      - 2 つ目の節の `作業場` にマーカーが付いている
      - 見出しと行内のコードの `作業場` にはマーカーが付いていない
      - マーカーは用語の破線の下線と形で見分けられる（色だけで分けない）
      - マーカーの付いた `作業場` にポインターを乗せると、代わりの用語 `ワークスペース` と意味 `話し合いの記録を置くフォルダ` のツールチップが出て、ツールチップの上へポインターを移しても出たまま
      - Tab でマーカーの付いた語にフォーカスが移り、その語の `aria-describedby` がツールチップの要素を指す
      - Esc を押すとツールチップが消え、フォーカスは語に残る
    test: test_normal_when_avoided_term
  - name: 正常シナリオ（上に収まらない語）
    setup:
      - name: mdmark を読むページ
        description: 描く先の要素をページの上端に置き、スクロールせずに文書を描く。ほかは正常シナリオと同じ
        notes: 文書の 1 行目の語の上に、ツールチップの高さが残らない状態を決定的に起こす
      - name: 用語を持つ索引
        description: 正常シナリオと同じ
      - name: 1 行目に用語が出る Markdown
        description: 見出しを置かず、1 行目の段落に `ワークスペース` が出る文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M-->>P: 用語に下線を引いて描く
        U->>P: 1 行目の下線の付いた語にポインターを乗せる
        M->>M: 語の上にツールチップが収まらないことを確かめる
        P-->>U: 語の下に用語の意味のツールチップを表示
    expected:
      - '`ワークスペース` のツールチップが語の下に出る（ツールチップの上端が語の下端より下にある）'
      - ツールチップの全体が画面の中に収まっている
    test: test_normal_when_no_room_above
  - name: 正常シナリオ（設定で下に出す）
    setup:
      - name: mdmark を読むページ
        description: 設定の `tooltips.placement` を `bottom` にした `opts.config` を渡して文書を描く。ほかは正常シナリオと同じ
      - name: 用語を持つ索引
        description: 正常シナリオと同じ
      - name: 用語が出る Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定・索引・文書の id・Markdown を渡して描かせる
        M-->>P: 用語に下線を引いて描く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 語の下に用語の意味のツールチップを表示
    expected:
      - '`WS` にポインターを乗せると、`話し合いの記録を置くフォルダ` のツールチップが語の下に出る（ツールチップの上端が語の下端より下にある）'
    test: test_normal_when_placement_bottom
  - name: 正常シナリオ（全角と半角・大文字と小文字だけが違う語）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 表記の揺れを持つ索引
        description: 用語 `ワークスペース`（別名 `WS`、意味 `話し合いの記録を置くフォルダ`、`avoid` に `workplace`）を持ち、描く文書を `docs` に持つ索引
      - name: 表記の違う語が出る Markdown
        description: 1 つ目の節の段落に全角の `ＷＳ` が出て、2 つ目の節の段落に小文字の `ws` と、大文字と小文字の混ざった `WorkPlace` が出る文書
        notes: 索引の別名・やめた言い方と、全角と半角・大文字と小文字だけが違う語を本文に置いて決定的に起こす
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 索引・文書の id・Markdown を渡して描かせる
        M->>M: 本文の語と用語の語・別名・やめた言い方を、NFKC・英字の小文字化・前後の空白の除去で正規化して照合する
        M-->>P: 本文の表記のまま、用語に下線を、やめた言い方にマーカーを付けて描く
        U->>P: 下線の付いた語にポインターを乗せる
        P-->>U: 用語の意味のツールチップを表示
    expected:
      - 1 つ目の節の `ＷＳ` と 2 つ目の節の `ws` に破線の下線が付いている
      - 下線の付いた語の文字は本文の表記のまま（`ＷＳ`・`ws`）
      - '`ＷＳ` にポインターを乗せると `話し合いの記録を置くフォルダ` のツールチップが出る'
      - '`WorkPlace` にやめた言い方のマーカーが付き、ポインターを乗せると代わりの用語 `ワークスペース` と意味 `話し合いの記録を置くフォルダ` のツールチップが出る'
    test: test_normal_when_width_and_case_differ
lead: 使う側が索引に書いた用語の語・別名が本文に出ると、mdmark が破線の下線を引き、読む人がポインターを乗せるかフォーカスすると意味のツールチップが出る。
issue: 5
primary_actor: 文書を読む人
stakeholders:
  - name: 文書を書く人
    interest: 用語の意味を本文に書き足さずに、索引に 1 度書けば全ての文書で引ける。やめた言い方が残った本文でも、読む人に代わりの用語が伝わる
  - name: キーボードと読み上げで読む人
    interest: ポインターを使わなくても、用語の意味を読める
trigger: 使う側のページが、索引と描く文書の `id` を渡して文書を描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
  - 用語のツールチップの機能（`glossary`）がオン（既定）
success_guarantee: 本文に出た用語の語・別名に破線の下線が付き、ポインターを乗せたときとフォーカスしたときに、その用語の意味のツールチップが出る。ツールチップは語の上に出て、上に収まらないときだけ語の下に出る。本文に出た用語のやめた言い方にはマーカーが付き、同じ操作で代わりの用語とその意味のツールチップが出る。用語の語・別名・やめた言い方は、全角と半角・英字の大文字と小文字・前後の空白の違いを区別せずに照合する。
minimal_guarantee: 索引を渡さないときも、索引の一部が Schema に合わないときも、本文は描かれる。
refs:
  - dev/設計書/シナリオ/単一ユースケース/文書を描く#
test_file: tests/e2e/単一ユースケース/用語の意味をツールチップで見る.spec.ts
