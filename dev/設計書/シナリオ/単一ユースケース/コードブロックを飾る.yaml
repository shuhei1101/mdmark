lead: '文書を書く人が、コードブロックの直前の `<!-- code: title=題 lines highlight=行 -->` と、コードの行末の行コメントの `[!code ++]`・`[!code --]`・`[!code highlight]` を書くと、mdmark がコードブロックに題・行番号・行の強調と、足した行・消した行・強調の印を付けて描く。言語の指定があれば言語のラベルを出し、読む人はコピーボタンで変更後のコードをコピーする。'
issue: 25
primary_actor: 文書を書く人
stakeholders:
  - name: 文書を読む人
    interest: どのファイルのコードか、何行目か、どの行を変えたか・見るべきかが見て取れ、写したコードに行番号と行頭の `+`・`-` が混ざらない
trigger: 使う側のページが、コードブロックの印かコードの行の印を持つ文書を描かせる
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読んでいる
  - コードブロックの機能（`code`）がオン（既定）
success_guarantee: |-
  コードブロックの上に題が、各行の左に行番号が出て、指定した行と印を付けた行が色と行頭の `+`・`-` で分かれる。印と、印だけを持つ行コメントの頭は画面に出ない。GitHub ではコードブロックの印が見えず、コードの行の印は行コメントとして読める。

  tree を除くコードブロックは、インデントの深い行を畳む・開くことができ、インデントのレベルごとに縦線が引かれる。コピーボタンは畳んだ行も含めてコピーする。

  色分けに対応する言語のコードブロックは、題・行番号・行の印を保ったまま中身が言語に応じて色分けされる。色分けのライブラリは、色分けする言語のコードブロックがある文書でだけ、本体と使う言語の分を読む。
minimal_guarantee: |-
  読めない指定と知らない印は、その指定だけを当てずに描かれ、上に書き方の警告が出る。コードの中身は欠けずに出る。

  色分けのライブラリか言語のモジュールを読めないときは、そのコードブロックを色分けせずに書いたとおりに出す。
test_file: tests/e2e/単一ユースケース/コードブロックを飾る.spec.ts
