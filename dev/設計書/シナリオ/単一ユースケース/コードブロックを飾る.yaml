title: コードブロックを飾る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、設定を渡して文書を描く HTML
      - name: コードブロックの印を持つ Markdown
        description: '`<!-- code: title=app.ts lines highlight=2 -->` の直後に、3 行の言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 題・行番号・行の強調を付けたコードブロックを描く
        P-->>U: 文書を表示
    expected:
      - コードブロックの上に題 `app.ts` が出ている
      - 3 つの行の左に 1〜3 の行番号が出ている
      - 2 行目だけが強調の背景になっている
      - コードブロックの文字を全て選んだときの選んだ文字に、行番号が入っていない
    test: test_normal
  - name: 正常シナリオ（コードの行の印）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: コードの行の印を持つ Markdown
        description: 行末に `// [!code --]` を付けた行、`// [!code ++]` を付けた行、`count += 1; // 数える [!code highlight]` の行、印の無い行の 4 行を持つ言語 `ts` のコードブロックの文書（コードブロックの印は無い）
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 行末の印を読んで行に種類を付け、印を外す
        M-->>P: 行ごとに分けたコードブロックを描く
        P-->>U: 文書を表示
    expected:
      - '`[!code --]` の行が消した行の色で、行頭に `-` が出ている'
      - '`[!code ++]` の行が足した行の色で、行頭に `+` が出ている'
      - '`[!code highlight]` の行が強調の背景になっている'
      - 3 つの印の文字が出ていない
      - 印だけを持っていた 2 つの行の行コメントの頭 `//` が出ておらず、3 行目は `// 数える` が残っている
      - 印の無い行は書いたとおりに出ている
      - コードブロックの文字を全て選んだときの選んだ文字に、行頭の `+`・`-` が入っていない
    test: test_normal_when_line_marks
  - name: 正常シナリオ（印の書き方を見せる）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 打ち消した印を持つ Markdown
        description: 行末に `// [\!code ++]` を付けた行を持つ言語 `ts` のコードブロックの文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 打ち消しの \ を外した行を描く
        P-->>U: 文書を表示
    expected:
      - 行が `// [!code ++]` の文字のまま出ている
      - 行が足した行の色になっておらず、行頭に `+` が出ていない
    test: test_normal_when_line_mark_escaped
  - name: 正常シナリオ（機能をオフにした文書）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 機能を外した Markdown
        description: '`<!-- features: -code -->` を書き、正常シナリオのコードブロックの印と、行末に `// [!code ++]` を付けた行を持つコードブロックを持つ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 印を取り除き、コードブロックをそのまま描く
        P-->>U: 文書を表示
    expected:
      - 題・行番号・行の強調が出ていない
      - 行が `// [!code ++]` の文字のまま出ている
      - 言語のラベルとコピーボタンが出ていない
    test: test_normal_when_feature_off
  - name: 異常シナリオ（読めない指定）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 読めない指定を持つ Markdown
        description: '`<!-- code: title=app.ts color=red -->` の直後に言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 知らないキー color= がある
        M-->>P: 書き方の警告と、読めた指定だけを当てたコードブロックを描く
        P-->>U: 書き方の警告とコードブロックを表示
    expected:
      - コードブロックの上に、`color=` が使えないキーであることと使えるキーを書いた書き方の警告がある
      - コードブロックの上に題 `app.ts` が出ている
    test: test_error_when_unknown_key
  - name: 異常シナリオ（コードブロックに無い行の番号）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 無い行を強調する Markdown
        description: '`<!-- code: highlight=2,5 -->` の直後に 3 行の言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 5 行目がコードブロックに無い
        M-->>P: 書き方の警告と、2 行目を強調したコードブロックを描く
        P-->>U: 書き方の警告とコードブロックを表示
    expected:
      - コードブロックの上に、5 行目が無いことと、コードブロックの行の数を書いた書き方の警告がある
      - 2 行目が強調の背景になっている
    test: test_error_when_highlight_line_missing
  - name: 異常シナリオ（知らないコードの行の印）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 知らない印を持つ Markdown
        description: 行末に `// [!code focus]` を付けた行を持つ言語 `ts` のコードブロックの文書
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 知らない印 focus がある
        M-->>P: 書き方の警告と、印を当てない行を描く
        P-->>U: 書き方の警告とコードブロックを表示
    expected:
      - コードブロックの上に、`[!code focus]` が使えない印であることと使える印を書いた書き方の警告がある
      - 行が `// [!code focus]` の文字のまま出ている
    test: test_error_when_unknown_line_mark
  - name: 異常シナリオ（印の後にコードブロックが無い）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: コードブロックの無い印を持つ Markdown
        description: '`<!-- code: title=app.ts -->` の直後に段落を置いた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M->>M: 印の直後にコードブロックが無い
        M-->>P: 書き方の警告と、段落をそのまま描く
        P-->>U: 書き方の警告と段落を表示
    expected:
      - 印の場所に、印の直後にコードブロックを置くよう書いた書き方の警告がある
      - 段落が書いたとおりに出ていて、題が出ていない
    test: test_error_when_no_code_block
  - name: 正常シナリオ（言語に応じて色分けする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 色分けする言語のコードブロックを持つ Markdown
        description: 印を持たない言語 `ts`・`yaml`・`python` のコードブロックを 1 つずつ置いた文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` と、色分けのライブラリの本体と言語のモジュールを jsDelivr と同じパスで返す手元の応答に差し替える。色分けのライブラリへの要求を数える
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: コードブロックを描く
        M->>X: 本体と、文書が使う言語のモジュールを要求
        X-->>M: モジュール
        M-->>P: コードブロックの中身を色分けする
        P-->>U: 色分けした文書を表示
      ```
    expected:
      - 3 つのコードブロックのキーワード・文字列・コメントなどが、地の文字と違う色で出ている
      - 3 つのコードブロックの文字が書いたとおりで、コードブロックの文字を全て選んだときの選んだ文字が色分けの前と同じ
      - 色分けのライブラリへの要求が、本体 1 件と `typescript`・`yaml`・`python` の言語のモジュール 1 件ずつ
    test: test_normal_when_syntax_highlighted
  - name: 正常シナリオ（題・行番号・コードの行の印と色分けする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 飾りと色分けを両方持つ Markdown
        description: '`<!-- code: title=app.ts lines highlight=4 -->` の直後に、3 行にまたがるブロックコメント、行末に `// [!code --]` を付けた行、行末に `// [!code ++]` を付けた行を持つ言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 題・行番号・行の印を付けたコードブロックを描く
        M->>X: 本体と typescript のモジュールを要求
        X-->>M: モジュール
        M-->>P: 行ごとに中身を色分けする
        P-->>U: 色分けした文書を表示
      ```
    expected:
      - コードブロックの上に題 `app.ts` が出ていて、各行の左に 1 から始まる行番号が出ている
      - ブロックコメントの 3 行が、どの行もコメントの色で出ている
      - 消した行・足した行がそれぞれの地の色と行頭の `-`・`+` で出ていて、行の中の文字は色分けされている
      - 4 行目が強調の背景になっている
      - コードブロックの文字を全て選んだときの選んだ文字に、行番号と行頭の `+`・`-` が入っていない
    test: test_normal_when_highlighted_with_line_marks
  - name: 正常シナリオ（色分けしない言語）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 色分けしないコードブロックを持つ Markdown
        description: 言語の無いコードブロックと、言語 `text` のコードブロックだけを持つ文書
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 色分けのライブラリを読まずにコードブロックを描く
        P-->>U: 文書を表示
      ```
    expected:
      - 2 つのコードブロックの文字が色分けされず、書いたとおりに出ている
      - 色分けのライブラリへの要求が 0 件
    test: test_normal_when_language_not_highlighted
  - name: 正常シナリオ（色分けの機能をオフにした文書）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 色分けの機能を外した Markdown
        description: '`<!-- features: -syntax -->` を書き、行末に `// [!code ++]` を付けた行を持つ言語 `ts` のコードブロックを置いた文書'
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 色分けのライブラリを読まずに、行の印を付けたコードブロックを描く
        P-->>U: 文書を表示
      ```
    expected:
      - コードブロックの文字が色分けされていない
      - '`[!code ++]` の行が足した行の色で、行頭に `+` が出ている'
      - 色分けのライブラリへの要求が 0 件
    test: test_normal_when_syntax_feature_off
  - name: 異常シナリオ（色分けのライブラリを読めない）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 色分けする言語のコードブロックを持つ Markdown
        description: 正常シナリオ（言語に応じて色分けする）と同じ文書
      - name: Mock
        description: 色分けのライブラリの本体が 404 を返す。ほかは正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: コードブロックを描く
        M->>X: 本体を要求
        X-->>M: 404
        M-->>P: コードブロックを色分けせずに残す
        P-->>U: 文書を表示
      ```
    expected:
      - 3 つのコードブロックの文字が色分けされず、書いたとおりに欠けずに出ている
      - 知らせの枠が出ていない
      - ブラウザのコンソールに、色分けのライブラリを読めなかった旨が出ている
    test: test_error_when_highlighter_not_found
  - name: 異常シナリオ（言語のモジュールの一部を読めない）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 色分けする言語のコードブロックを持つ Markdown
        description: 正常シナリオ（言語に応じて色分けする）と同じ文書
      - name: Mock
        description: '`python` の言語のモジュールだけが 404 を返す。ほかは正常シナリオ（言語に応じて色分けする）と同じ'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: コードブロックを描く
        M->>X: 本体と 3 つの言語のモジュールを要求
        X-->>M: 本体と typescript・yaml のモジュール、python は 404
        M-->>P: ts と yaml のコードブロックだけを色分けする
        P-->>U: 文書を表示
      ```
    expected:
      - '`ts` と `yaml` のコードブロックが色分けされている'
      - '`python` のコードブロックの文字が色分けされず、書いたとおりに出ている'
      - ブラウザのコンソールに、`python` の言語のモジュールを読めなかった旨が出ている
    test: test_error_when_language_module_not_found
  - name: 正常シナリオ（言語のラベルを出す）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 言語の指定を持つ Markdown
        description: 情報文字列が `ts`、`bash title`、空の 3 つのコードブロックを置いた文書
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 言語の指定があるコードブロックに言語のラベルを付けて描く
        P-->>U: 文書を表示
    expected:
      - 1 つ目のコードブロックにラベル `ts`、2 つ目にラベル `bash`（情報文字列の最初の語）が、コードの上の帯の左端に出ている
      - 言語の無い 3 つ目のコードブロックにラベルが無い
      - コードブロックの文字を全て選んだときの選んだ文字に、ラベルが入っていない
      - 'コードブロックの読み上げの名前は今のまま（`コード: {言語}`）'
    test: test_normal_when_language_label_shown
  - name: 正常シナリオ（変更後のコードをコピーする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
        notes: '-'
      - name: コードの行の印を持つ Markdown
        description: 行末に `// [!code --]` を付けた `const a = 1;`、行末に `// [!code ++]` を付けた `const a = 2;`、`count += 1; // 数える [!code highlight]`、印の無い `return a;` の 4 行を持つ言語 `ts` のコードブロックと、言語 `tree` のコードブロックを置いた文書
        notes: '-'
      - name: クリップボードの権限
        description: ページにクリップボードへの書き込みを許す
        notes: '-'
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
        notes: '-'
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: コピーボタンを付けたコードブロックを描く
        U->>P: ts のコードブロックのコピーボタンを押す
        M->>M: 印と消した行を除いたコードをクリップボードへ書き込む
        P-->>U: コピーしたことを知らせるボタン
    expected:
      - クリップボードの中身が `const a = 2;\ncount += 1; // 数える\nreturn a;`（`[!code --]` の行を含めず、印と、印だけを持つ行コメントの頭 `//` とその前の空白を除いたコード）
      - クリップボードの中身に、行番号と行頭の `+`・`-` が入っていない
      - ボタンの文言でコピーしたことが知らされ、読み上げでも知らされる。しばらくするとボタンの文言が元に戻る
      - コピーボタンはキーボードでフォーカスして押せる
      - ファイルツリーに描いた `tree` のコードブロックには、コードのコピーボタンが付かない（付くのはツリーのコピーボタンだけ）
    test: test_normal_when_code_copied
  - name: 正常シナリオ（Dockerfile と diff を色分けする）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: Dockerfile と diff のコードブロックを持つ Markdown
        description: 言語 `dockerfile`・`docker`・`diff`・`patch` のコードブロックを 1 つずつと、行末に `# [!code ++]` を付けた行を持つ言語 `diff` のコードブロックを置いた文書。diff のコードブロックは `+` で始まる行と `-` で始まる行を持つ
      - name: Mock
        description: 正常シナリオ（言語に応じて色分けする）と同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 色分けのライブラリ
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: コードブロックを描く
        M->>X: 本体と dockerfile・diff のモジュールを要求
        X-->>M: モジュール
        M-->>P: コードブロックの中身を色分けする
        P-->>U: 色分けした文書を表示
    expected:
