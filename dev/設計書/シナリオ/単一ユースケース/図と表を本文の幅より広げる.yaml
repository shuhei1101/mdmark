title: 図と表を本文の幅より広げる
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読み込むページ
        description: バージョンを固定した URL で `dist/index.js` と `dist/index.css` を読み込み、設定を指定して文書を描く HTML
        notes: 画面と描く先の要素の幅は 1280px。利用側が `--mdmark-content-width` を `640px` にしている。右側の目次の機能はオフ
      - name: wide の範囲を持つ Markdown
        description: 段落、8 列の表を `<!-- wide -->` 〜 `<!-- /wide -->` で囲んだ範囲、幅 1200px の画像を囲んだ範囲、段落を並べた文書
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: wide の範囲を本文の幅より広げて描く
        P-->>U: 文書を表示
    expected:
      - 段落の幅が 640px のままで、wide の範囲の幅が 640px より広く、描く先の要素の幅を越えていない
      - wide の範囲が本文の列の中央にそろっている
      - 表と画像が範囲の幅の中で描かれ、文書に横のスクロールが出ていない
      - 範囲の class が、埋め込んだ HTML の `.is-wide` と別の名前である
      - 本文にマーカーの文字が出ていない
    test: test_normal
  - name: 正常シナリオ（右側の目次と並ぶ）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 設定の `side-toc.mode` は `fixed` で、右側の目次を出しておく
      - name: wide の範囲と見出しを持つ Markdown
        description: 正常シナリオの文書に `## 概要`・`## 詳細` の見出しを追加したもの
      - &id001
        name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 右側の目次の列の内側で wide の範囲を広げて描く
        P-->>U: 文書と右側の目次を表示
    expected:
      - wide の範囲が段落より広く描かれ、右側の目次に重なっていない
      - 右側の目次の項目を押して、その見出しへ移れる
    test: test_normal_when_side_toc_shown
  - name: 正常シナリオ（狭い画面）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
        notes: 画面と描く先の要素の幅は 390px
      - name: wide の範囲を持つ Markdown
        description: 正常シナリオと同じ
      - *id001
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: wide の範囲を本文の幅で描く
        U->>P: 表を横にスクロールする
        P-->>U: 範囲の中で表が動く
    expected:
      - wide の範囲の幅が段落の幅と等しい
      - 表は範囲の中で横にスクロールでき、文書に横のスクロールが出ていない
    test: test_normal_when_narrow
  - name: 異常シナリオ（wide の閉じのマーカーが無い）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 閉じのマーカーの無い Markdown
        description: '`<!-- wide -->` の後に 8 列の表を持ち、`<!-- /wide -->` を持たない文書'
      - *id001
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M->>M: wide の閉じのマーカーが無い
        M-->>P: 記載の警告と、表を本文の幅で描く
        P-->>U: 記載の警告と表を表示
    expected:
      - マーカーの場所に、閉じのマーカー `<!-- /wide -->` が無いことを記載した記載の警告がある
      - 表が段落と同じ幅で描かれている
    test: test_error_when_unclosed
  - name: 正常シナリオ（広げた幅と本文の幅を切り替える）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: wide の範囲を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 広げた wide の範囲と、範囲の上の本文の幅の右端の切り替えのボタンを描く
        U->>P: 切り替えのボタンを押す
        P-->>U: 本文の幅に戻した範囲
        U->>P: もう一度押す
        P-->>U: 広げた範囲
    expected:
      - 描いた直後、範囲が広がり、範囲の上の本文の幅の右端にラベルの無いアイコンだけのボタンがあり、スクリーンリーダー向けの名前が「広げて表示」で、`aria-pressed` が `true`
      - 押した後、範囲の幅が段落の幅と等しくなり、ボタンはアイコンだけが変わってスクリーンリーダー向けの名前は「広げて表示」のまま、`aria-pressed` が `false`。ボタンの位置は押す前と同じ
      - もう一度押すと、範囲が広がった幅に戻る
      - ボタンはフォーカスして Enter でも押せる
      - 狭い画面では切り替える幅が同じため、ボタンが出ていない
    test: test_normal_when_toggled
  - name: 正常シナリオ（本文の幅から始める）
    setup:
      - name: mdmark を読み込むページ
        description: 正常シナリオと同じ
      - name: 本文の幅から始める wide の範囲を持つ Markdown
        description: 正常シナリオの文書の 8 列の表を、本文の幅から始める指定の wide のマーカーで囲んだ文書
        notes: '指定の記載方法（モックでは `<!-- wide: closed -->`）はインターフェース定義で決める'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 利用者
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を指定して描かせる
        M-->>P: 本文の幅の wide の範囲と、広げるボタンを描く
        U->>P: 切り替えのボタンを押す
        P-->>U: 広げた範囲
    expected:
      - 描いた直後、範囲の幅が段落の幅と等しく、ボタンの `aria-pressed` が `false`
      - ボタンを押した後、範囲が段落より広くなる
      - 本文にマーカーの文字と記載の警告が出ていない
    test: test_normal_when_starts_narrow
lead: 文書の作成者が `<!-- wide -->` 〜 `<!-- /wide -->` で図・表・画像を囲み、mdmark がその範囲を本文の幅（`--mdmark-content-width`）を越えて広げる。
issue: 220
primary_actor: 文書の作成者
stakeholders:
  - name: 読者
    interest: 大きい図と表を狭い幅に押し込めずに読み込め、目次と文書の一覧も操作できる
trigger: 利用側のページが、wide のマーカーを持つ文書を描かせる
preconditions:
  - ページがバージョンを固定した URL で mdmark の JavaScript と CSS を読み込んでいる
  - wide の機能がオン（既定）
success_guarantee: wide の範囲が本文の幅を越えて描く先の要素の幅まで広がり、右の目次とまとめた HTML の文書の一覧に重ならない。読者は範囲の上の本文の幅の右端のボタンで、広げた幅と本文の幅を切り替えられる。狭い画面では本文の幅に収まり、収まらない中身は範囲の中で横にスクロールする。
minimal_guarantee: 閉じのマーカーが無い範囲は、記載の警告を出して本文の幅で描く。
test_file: tests/e2e/単一ユースケース/図と表を本文の幅より広げる.spec.ts
