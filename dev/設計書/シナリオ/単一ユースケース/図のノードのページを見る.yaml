title: 図のノードのページを見る
lead: 読者が、map の図のノードを選び、そのノードに入る線と出る線・出てくる視点・リンク先の図・出てくるシーケンス・補足の説明を 1 ページで読み、線の相手のノードへ移る。
issue: 324
test_file: tests/e2e/単一ユースケース/図のノードのページを見る.spec.ts
primary_actor: 読者
trigger: 読者が、図の 1 つのノードが何とつながり、どこに出てくるかを知りたくなる
preconditions:
  - 文書に map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: ノードのページに、そのノードの線・視点・リンク先の図・シーケンス・説明が並び、パンくずと Esc で選んだ段の図へ戻れる。
minimal_guarantee: 項目を持たない欄は、項目が無い旨を出し、欄を消さない。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: map の構成図とシーケンス図を描いたページ
        notes: 選ぶノードは、入る線 2 本・出る線 1 本・補足の `notes` の説明を持ち、補足の `relations` の視点 1 つと、`plays_over` でこの構成図を指すシーケンス図の相手に出てくる
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: ノードを押す
        D-->>U: 図の枠の中をノードのページに置き換え、パンくずを 1 段増やす
        U->>D: 出る線の相手のノードを押す
        D-->>U: 相手のノードのページに切り替える
        U->>D: Esc を押す
        D-->>U: ノードを選んだ段の図に戻す
    expected:
      - ページに、入る線 2 本と出る線 1 本が、相手のノードの名前とラベルつきで並ぶ
      - ページに、出てくる視点の名前・出てくるシーケンス図のタイトル・補足の説明が並ぶ
      - リンク先の図を持たないので、リンク先の図の欄に項目が無い旨が出る
      - 相手のノードを押すと、相手のノードのページに切り替わり、パンくずの最後の段が相手のノードの名前になる
      - Esc とパンくずで、ノードを選んだ段の図へ戻り、選んだノードにフォーカスが戻る
      - ノードは Tab でフォーカスでき、Enter でもページを開ける
    test: test_normal
  - name: 正常シナリオ（リンク先の図へ移る）
    setup:
      - name: 図を描いたページ
        description: map の範囲を 2 つ持つ文書を描いたページ。1 つ目の図の補足の `links` で、1 つのノードのリンク先に 2 つ目の図の印の `title` を記載する
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: リンク先を持つノードのページを開く
        D-->>U: リンク先の図の欄に 2 つ目の図のタイトル
        U->>D: 2 つ目の図のタイトルを押す
        D-->>U: 2 つ目の図の場所へ文書をスクロールし、図にフォーカスする
    expected:
      - リンク先の図の欄に、2 つ目の図のタイトルがリンクで出る
      - リンクを押すと、2 つ目の図が画面に入るまで文書がスクロールし、2 つ目の図にフォーカスが当たる
      - 1 つ目の図はノードのページのまま残る
    test: test_normal_when_linked_diagram
