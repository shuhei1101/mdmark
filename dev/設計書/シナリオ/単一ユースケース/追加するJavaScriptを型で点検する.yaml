id: SC-472-79
title: "追加するJavaScriptを型で点検する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 雛形を配置したフォルダ
        description: '`mdmark init`（JavaScript を指定）で雛形を配置し、配布物の型定義を配置したフォルダ'
      - name: 型に合う固有の部品
        description: '`// @ts-check` と JSDoc で配布物の拡張の型を付けた JavaScript の部品 1 つ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 利用側
        participant T as tsc
        participant F as フォルダ
        W->>T: tsc --noEmit
        T->>F: tsconfig と JavaScript と配布物の型定義を読み込む
        T-->>W: 誤り 0 件・終了コード 0
    expected:
      - '`tsc --noEmit` が誤りを出さず、終了コード 0 を返却する'
      - フォルダに JavaScript の出力が増えていない
    test: test_normal
  - name: 異常シナリオ（型が合わない）
    setup:
      - name: 雛形を配置したフォルダ
        description: 正常シナリオと同じ
      - name: 型を誤った固有の部品
        description: 正常シナリオの部品のうち 1 行で、`draw` に配布物の型に合わない値を指定するもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 利用側
        participant T as tsc
        participant F as フォルダ
        W->>T: tsc --noEmit
        T->>F: tsconfig と JavaScript と配布物の型定義を読み込む
        T-->>W: 誤りのファイルと行・終了コード 0 以外
    expected:
      - '`tsc --noEmit` が、誤ったファイルの名前と行を含む誤りを出す'
      - 終了コードが 0 以外
      - 利用側の JavaScript は書き換わっていない
    test: test_error_when_type_mismatch
lead: 利用側が、変換を挟まずに記載した JavaScript（`// @ts-check` と JSDoc）の固有の部品を、配布物の型定義に対して `tsc --noEmit` で点検し、誤りを使用する前に見つける。
issue: 21
primary_actor: 利用側（ワークスペースの持ち主と AI）
trigger: 利用側が固有の部品を追記した、または mdmark のバージョンを上げた
preconditions:
  - '`mdmark init`（JavaScript を指定）で配置した tsconfig がある'
  - 配布物と同じタグの `dist/` の型定義を配置している
  - 手元に Node 24 以降と TypeScript がある
success_guarantee: 型に合う JavaScript は誤り 0 件で通り、合わない JavaScript はファイルと行を出して落ちる。
minimal_guarantee: 点検は利用側のファイルを書き換えず、JavaScript のファイルも出さない。
test_file: tests/e2e/単一ユースケース/追加するJavaScriptを型で点検する.spec.ts
