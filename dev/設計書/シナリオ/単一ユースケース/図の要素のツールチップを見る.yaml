title: 図の要素のツールチップを見る
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 矢印 1 本に入力の詳細、LLM の箱 1 つに入力・処理・出力を持たせ、システムの枠と層の 1 つに `hint` を持たせたフロー図を描いたページ
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 矢印にポインターを乗せる
        D-->>U: 入力の詳細のツールチップ
        U->>D: ツールチップの上へポインターを動かす
        D-->>U: ツールチップを出したままにする
        U->>D: LLM の箱の印にポインターを乗せる
        D-->>U: 入力・処理・出力のツールチップ
        U->>D: システムの枠のタイトルの印にポインターを乗せる
        D-->>U: 枠の hint の文のツールチップ
    expected:
      - 矢印の上で、入力の詳細を書いた `role="tooltip"` の要素が出る
      - 矢印のツールチップは矢印のラベルの下に出る（ツールチップの上端がラベルの下端より下にある）
      - ツールチップの上へポインターを動かしても消えない
      - LLM の箱の右上の印の上で、入力・処理・出力を書いたツールチップが出る。箱の印の外では出ない
      - LLM の箱のツールチップは箱の下に出る（ツールチップの上端が箱の下端より下にある）
      - ツールチップを持つ箱には印があり、持たない箱には無い
      - '`hint` を持つシステムの枠と層のタイトルの右に箱と同じ印があり、`hint` を持たない層のタイトルには無い'
      - システムの枠のタイトルの印の上で、`hint` の文を書いたツールチップが印の下に出る
    test: test_normal
  - name: 正常シナリオ（キーボード）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: Tab で矢印にフォーカスする
        D-->>U: 入力の詳細のツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを消し、フォーカスは矢印に残す
    expected:
      - フォーカスした矢印にツールチップが出て、矢印の `aria-describedby` がそのツールチップを指す
      - Esc でツールチップが消え、フォーカスは矢印に残る
    test: test_normal_when_keyboard
  - name: 正常シナリオ（箱の中の用語）
    setup:
      - name: 用語を持つ図を描いたページ
        description: 索引に載せた用語を箱の文字に含むフロー図と、図の外の段落に同じ用語を持つ文書を、索引を渡して描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 箱の中の用語にポインターを乗せる
        D-->>U: 用語集の意味のツールチップ
    expected:
      - 箱の中の用語に本文の用語と同じ破線の下線が引かれている
      - 用語の上で、本文の用語と同じ見た目のツールチップに用語集の意味が出る
      - 図の外の段落の同じ用語にも下線とツールチップがある
    test: test_normal_when_term
  - name: 正常シナリオ（埋め込んだ HTML の data-hint）
    setup:
      - name: ヒントを持つ HTML を描いたページ
        description: '`<!-- html -->` の範囲の `html` のコードブロックに、`data-hint` を付けた箱 1 つと、付けない箱 1 つを置いて描いたページ'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 埋め込んだ HTML
        U->>D: data-hint の箱の印の外にポインターを乗せる
        D-->>U: ツールチップを出さない
        U->>D: data-hint の箱の印にポインターを乗せる
        D-->>U: data-hint の文のツールチップ
        U->>D: Tab で data-hint の箱の印にフォーカスする
        D-->>U: 同じツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを消し、フォーカスは印に残す
    expected:
      - '`data-hint` の箱の右上の印の上で、`data-hint` の文を書いた `role="tooltip"` の要素が、図のツールチップと同じ見た目で出る'
      - ツールチップは印の下に出る（ツールチップの上端が印の下端より下にある）
      - '`data-hint` の箱の印の外にポインターを乗せても、ツールチップは出ず、ポインターの形は変わらない'
      - '`data-hint` の箱の印はフォーカスでき、フォーカスすると印の `aria-describedby` がそのツールチップを指す'
      - Esc でツールチップが消え、フォーカスは印に残る
      - '`data-hint` を持つ箱には図の箱と同じ印があり、持たない箱には無い'
    test: test_normal_when_data_hint
  - name: 正常シナリオ（箱の hint）
    setup:
      - name: hint を持つ図を描いたページ
        description: '`hint` だけを持ち `io` を持たない箱 1 つを含むフロー図を描いたページ'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: hint を持つ箱の印にポインターを乗せる
        D-->>U: hint の文のツールチップ
    expected:
      - '`hint` を持つ箱の右上の印の上で、`hint` の文を書いたツールチップが出る'
      - '`hint` を持つ箱には、ツールチップを持つ箱の印がある'
    test: test_normal_when_node_hint
  - name: 正常シナリオ（ヒントを外す）
    setup:
      - name: ヒントを外して描いたページ
        description: 正常シナリオのフロー図（矢印の詳細・LLM の箱の入力・処理・出力・システムの枠と層の `hint`）に、正常シナリオ（箱の hint）と同じ `hint` だけを持つ箱を足した図と、`data-hint` を付けた箱を持つ HTML を、設定の `features.hints` を `false` にして描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図と埋め込んだ HTML
        U->>D: 矢印・LLM の箱・hint の箱・data-hint の箱にポインターを乗せる
        D-->>U: ツールチップを出さない
    expected:
      - 矢印・LLM の箱・`hint` の箱・`data-hint` の箱・システムの枠と層のタイトルのどれに乗せても、ツールチップが出ない
      - ツールチップを持つ箱の印と、システムの枠と層のタイトルの印が無い
      - 矢印のラベル・箱の名前・`data-hint` の箱の文字は描かれている
    test: test_normal_when_hints_off
  - name: 正常シナリオ（下に収まらない箱）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのフロー図を描き、図の下に高い本文を続けたページ
        notes: LLM の箱の下端が画面の下端に揃うまでスクロールし、箱の下にツールチップの高さが残らない状態を決定的に起こす
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 箱の下端が画面の下端に揃うまでスクロールする
        U->>D: LLM の箱の印にポインターを乗せる
        D-->>U: 箱の上に入力・処理・出力のツールチップ
    expected:
      - LLM の箱のツールチップが箱の上に出る（ツールチップの下端が箱の上端より上にある）
      - ツールチップの全体が画面の中に収まっている
    test: test_normal_when_no_room_below
  - name: 正常シナリオ（設定で上に出す）
    setup:
      - name: 上に出す設定で描いたページ
        description: 正常シナリオのフロー図と、`data-hint` を付けた箱を持つ HTML と、索引に載せた用語を持つ段落を、設定の `tooltips.diagramPlacement` を `top`、`tooltips.placement` を `bottom` にして描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図と埋め込んだ HTML
        participant B as 本文
        U->>D: 矢印にポインターを乗せる
        D-->>U: ラベルの上に入力の詳細のツールチップ
        U->>D: data-hint の箱の印にポインターを乗せる
        D-->>U: 印の上に data-hint の文のツールチップ
        U->>B: 段落の用語にポインターを乗せる
        B-->>U: 語の下に用語の意味のツールチップ
    expected:
      - 矢印のツールチップがラベルの上に出る（ツールチップの下端がラベルの上端より上にある）
      - '`data-hint` のツールチップが印の上に出る（ツールチップの下端が印の上端より上にある）'
      - 段落の用語のツールチップは `tooltips.placement` のとおり語の下に出る（図の位置の設定に影響されない）
    test: test_normal_when_diagram_placement_top
  - name: 正常シナリオ（箱の中の表記の違う用語）
    setup:
      - name: 表記の違う用語を持つ図を描いたページ
        description: 索引に用語 `MCP` を載せ、箱の文字に全角の小文字で `{{ｍｃｐ}}` と書いたフロー図を持つ文書を、索引を渡して描いたページ
        notes: 箱に書いた語と索引の用語が、全角と半角・大文字と小文字だけ違う状態を決定的に起こす
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: 箱の中の用語にポインターを乗せる
        D-->>U: 用語の意味のツールチップ
    expected:
      - 箱の中の `ｍｃｐ` に本文の用語と同じ破線の下線が引かれ、文字は箱に書いた表記のまま
      - 用語の上で、索引の用語 `MCP` の意味のツールチップが出る
    test: test_normal_when_term_width_and_case_differ
  - name: 正常シナリオ（タッチ）
    setup:
      - name: 図を描いたページ
        description: 正常シナリオのフロー図を、タッチの端末（`hasTouch`）として開いたページ
        notes: Chromium のタッチの再現では `:hover` が残らないため、外のタップで閉じる期待値は今の実装でも pass する。iOS の `:hover` が残る状態は単体テストで、`pointerleave`・`blur` を発火させずに外の `pointerdown` だけで閉じることを確かめる
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: LLM の箱の印をタップする
        D-->>U: 入力・処理・出力のツールチップ
        U->>D: 同じ印をもう一度タップする
        D-->>U: ツールチップを消す
        U->>D: 矢印のラベルをタップする
        D-->>U: 入力の詳細のツールチップ
        U->>D: ツールチップの中をタップする
        D-->>U: ツールチップを出したままにする
        U->>D: 図の外の本文をタップする
        D-->>U: ツールチップを消す
    expected:
      - LLM の箱の印のタップで、入力・処理・出力を書いたツールチップが出る
      - 同じ印をもう一度タップすると、ツールチップが消える
      - 矢印のラベルのタップで、入力の詳細のツールチップが出る
      - ツールチップの中をタップしても、ツールチップは消えない
      - ツールチップと持ち主の外をタップすると、ツールチップが消える
    test: test_normal_when_touch
  - name: 正常シナリオ（ER 図のテーブル）
    setup:
      - name: 図を描いたページ
        description: 概要を持つテーブル 1 つと、説明を持つ列 2 つを記載した ER 図を描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as 図
        U->>D: テーブルの説明のボタンにポインターを乗せる
        D-->>U: テーブルの概要と列の説明のツールチップ
        U->>D: ツールチップの上へポインターを動かす
        D-->>U: ツールチップを出したままにする
        U->>D: Esc を押す
        D-->>U: ツールチップを閉じる
        U->>D: Tab で説明のボタンにフォーカスを移す
        D-->>U: テーブルの概要と列の説明のツールチップ
    expected:
      - 説明のボタンの上で、テーブルの概要と、説明を持つ 2 つの列の名前と説明を記載した `role="tooltip"` の要素が出る
      - ツールチップはテーブルの下に出る
      - ツールチップの上へポインターを動かしても消えず、Esc で消える
      - キーボードで説明のボタンにフォーカスしたときも同じツールチップが出る
    test: test_normal_when_er_table
  - name: 正常シナリオ（グラフの項目）
    setup:
      - name: グラフを描いたページ
        description: 系列 2 つ・項目 4 つの折れ線のグラフ、系列 2 つ・項目 4 つの棒のグラフ、項目 3 つの円のグラフ、系列 1 つ・点 6 つの散布図を描いたページ
        notes: 横の目盛りは `1月`〜`4月`。円の項目は `A`・`B`・`C` で、値は `50`・`30`・`20`
      - name: 追加した種類のグラフを描いたページ
        description: 『図を描く』の正常シナリオ（追加したグラフの種類）の 8 つのグラフを描いたページ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant D as グラフ
        U->>D: 折れ線の点にポインターを乗せる
        D-->>U: 系列の名前・横の目盛り・値のツールチップ
        U->>D: 棒にポインターを乗せる
        D-->>U: 系列の名前・横の目盛り・値のツールチップ
        U->>D: 円の扇形にポインターを乗せる
        D-->>U: 項目の名前・値・割合のツールチップ
        U->>D: 散布図の点にポインターを乗せる
        D-->>U: 系列の名前と x と y のツールチップ
        U->>D: Tab で折れ線の点にフォーカスする
        D-->>U: 同じツールチップ
        U->>D: Esc を押す
        D-->>U: ツールチップを消し、フォーカスは点に残す
    expected:
      - 折れ線の点の上で、系列の名前・横の目盛り（`2月` など）・値を記載した `role="tooltip"` の要素が出る
      - 点の見た目の外の、点の周りの当たりの範囲にポインターを乗せても、同じツールチップが出る
      - 棒の上で、系列の名前・横の目盛り・値のツールチップが出る
      - 円の扇形の上で、項目の名前・値・全体に対する割合（`A` は `50%`）のツールチップが出る
      - 散布図の点の上で、系列の名前と x と y の値のツールチップが出る
      - ツールチップは項目の下に出る（ツールチップの上端が項目の下端より下にある）
      - 追加した 8 つの種類のグラフの項目にも、系列か項目の名前と値のツールチップが出る
      - 項目はキーボードでフォーカスでき、フォーカスした項目の `aria-describedby` がツールチップを指す。Esc でツールチップが消え、フォーカスは項目に残る
    test: test_normal_when_chart_items
lead: 読む人が、図の矢印・箱・箱の中の用語・グラフの項目にポインターを乗せるかフォーカスして、詳細をツールチップで読む。矢印は入力の詳細、LLM・スクリプトの箱は入力・処理・出力、用語は用語集の意味、グラフの項目は系列の名前と値を出す。箱・システムの枠・層の `hint` と、埋め込んだ HTML の要素の `data-hint` も同じツールチップで出し、設定の `features.hints` でまとめて外せる。
issue: 21
primary_actor: 読む人
trigger: 読む人が、図の矢印や箱に書いた要約より詳しく知りたくなる
preconditions:
  - 文書に図が描かれている（『図を描く』）
  - 用語のツールチップを出すときは、索引か用語集の表に用語がある
success_guarantee: ツールチップはホバーとフォーカスの両方で出て、Esc で消え、ツールチップの上に乗っても消えない（WCAG 1.4.13）。タッチの端末では、タップで出て、ツールチップと持ち主の外のタップか、同じ持ち主のもう一度のタップで消える。図のツールチップは既定で持ち主の下に出て、下に収まらないときだけ上に出る。設定の `tooltips.diagramPlacement` で上を先にでき、本文の用語のツールチップの位置（`tooltips.placement`）とは別に決まる。
minimal_guarantee: ツールチップを出せない環境（印刷）でも、箱と矢印の要約と図の外の用語集で図を読める。
test_file: tests/e2e/単一ユースケース/図の要素のツールチップを見る.spec.ts
