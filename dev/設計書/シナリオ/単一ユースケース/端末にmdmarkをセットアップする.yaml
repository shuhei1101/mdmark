title: 端末にmdmarkをセットアップする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空の端末
        description: 端末の設定（`MDMARK_CONFIG` が指すパス）・状態の置き場所（`MDMARK_STATE_DIR`）・Claude Code の設定のフォルダ（`CLAUDE_CONFIG_DIR`）を、どれも空の一時フォルダにする
        notes: '`MDMARK_CONFIG` は既定の `${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml` と違うパスにする'
      - name: 空いたポートと tmux のセッション名
        description: '`MDMARK_PORT` に待ち受けるプロセスの無いポートを、端末の設定の tmux のセッション名にテストだけの名前を指定する'
        notes: 手元の常駐サーバーが使う 8782 と既定のセッション名を避ける
      - name: Mock
        description: スキルを読むモデルの代わりに、スキルの手順が呼ぶスクリプトを手順の順に流し、利用者への確認には決めた答えを返す。端末の設定のパスは `MDMARK_CONFIG` のパスを、キーは `features.table` だけ `false` を、ほかは既定のままを答え、書いてよいかには認める答えを返す
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant F as 端末の設定と settings.json
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、端末の設定が無いこと
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 書く内容
        W->>C: 書いてよい
        C->>F: 端末の設定を書き、settings.json の env に MDMARK_CONFIG を書く
        C->>T: セッションが無いので、新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C->>C: SessionStart のフックを流す
        C-->>W: 作ったもの・書いたキー・セッション名・ログの場所・止め方
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定があり、`features.table: false` を持ち、`mdmark check` と同じ点検が端末の設定の形のずれを返さない'
      - '`CLAUDE_CONFIG_DIR` の `settings.json` の `env` に、端末の設定のパスの `MDMARK_CONFIG` がある'
      - 端末の設定のセッション名の tmux のセッションが 1 つだけあり、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - 状態の置き場所に常駐サーバーのログがあり、待ち受ける URL の 1 行を含む
      - '`tools/list` が `export_html`・`build_site`・`check` を返す'
      - SessionStart のフックが何も出さずに終了コード 0 で終わる
      - 最後の報告に、端末の設定のパス・`settings.json` に書いたキー・tmux のセッション名・ログのパス・止める操作が出る
    test: test_normal
  - name: 正常シナリオ（セットアップ済み）
    setup:
      - name: セットアップ済みの端末
        description: 正常シナリオを終えた後の端末の設定・`settings.json`・状態の置き場所・tmux のセッションと、待ち受けている常駐サーバー
      - &id001
        name: 空いたポートと tmux のセッション名
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを答える
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>T: セッションがあり、ポートが待ち受けている
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 書き換えなかったこと・セッション名・ログの場所・止め方
    expected:
      - 端末の設定と `settings.json` の中身が呼ぶ前と同じ
      - tmux のセッションを作り直さず、常駐サーバーのプロセスが呼ぶ前と同じ
      - '`tools/list` が `export_html`・`build_site`・`check` を返す'
      - 最後の報告に、書き換えなかったことと tmux のセッション名が出る
    test: test_normal_when_already_set_up
  - name: 正常シナリオ（常駐サーバーが止まっている）
    setup:
      - name: 止めた常駐サーバー
        description: 正常シナリオを終えた後の端末から、tmux のセッションを閉じ、`MDMARK_PORT` のポートで待ち受けるプロセスが無い状態
      - *id001
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを答える
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>T: セッションが無いので、新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 起動したこと・セッション名・ログの場所・止め方
    expected:
      - 端末の設定と `settings.json` の中身が呼ぶ前と同じ
      - 端末の設定のセッション名の tmux のセッションが 1 つだけあり、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - 状態の置き場所のログに、起動し直した後の待ち受ける URL の 1 行が足される
    test: test_normal_when_server_stopped
  - name: 正常シナリオ（古いバージョンの端末の設定）
    setup:
      - name: 古いバージョンの端末の設定
        description: '`MDMARK_CONFIG` のパスに、移行の手順が要る前のバージョンの書き方を持つ端末の設定を置く'
      - *id001
      - name: Mock
        description: 正常シナリオと同じ。移行してよいかには認める答えを、各キーには今の値のままを答える
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant F as 端末の設定
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のバージョンが古いことと、当てる移行の手順
        W->>C: 移行してよい
        C->>F: 写しを残して移行の手順を当てる
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C-->>W: 移行したこと・写しのパス
    expected:
      - 端末の設定が今のバージョンの書き方になり、`mdmark check` と同じ点検が端末の設定の形のずれを返さない
      - 移行する前の端末の設定の写しが残り、最後の報告にそのパスが出る
    test: test_normal_when_settings_outdated
  - name: 異常シナリオ（書くことを断る）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - *id001
      - name: Mock
        description: 正常シナリオと同じ。書いてよいかには断る答えを返す
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant T as tmux
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 書く内容
        W->>C: 書かない
        C->>T: 新しいセッションで mdmark serve を起動する
        C-->>W: 端末の設定と settings.json を書かなかったこと
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定が無く、`settings.json` が作られていない'
      - 端末の設定のセッション名の代わりに既定のセッション名の tmux のセッションで常駐サーバーが待ち受ける
      - 最後の報告に、端末の設定と `settings.json` を書かなかったことが出る
    test: test_error_when_write_declined
  - name: 異常シナリオ（tmux が無い）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: tmux の無い PATH
        description: '`PATH` から tmux を外す'
      - *id001
      - &id002
        name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        W->>C: /mdmark:global-setup
        C->>C: 端末の設定を書く
        C->>C: tmux が見つからない
        C-->>W: 端末で mdmark serve を開いたまま動かすコマンド
    expected:
      - 端末の設定と `settings.json` は正常シナリオと同じに書かれる
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが無い'
      - 最後の報告に、tmux が見つからないことと、端末で `mdmark serve` を開いたまま動かすコマンド（`MDMARK_PORT` を含む）が出る
    test: test_error_when_tmux_missing
  - name: 異常シナリオ（ポートをほかのプロセスが使っている）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: ポートを使うほかのプロセス
        description: '`MDMARK_PORT` のポートを mdmark ではないプロセスが待ち受ける'
      - *id002
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant S as mdmark serve
        W->>C: /mdmark:global-setup
        C->>T: 新しいセッションで mdmark serve を起動する
        T->>S: 起動
        S-->>T: ポートが使われている・終了コード 1
        C->>C: ログを読む
        C-->>W: ポートが使われていることと直し方
    expected:
      - 端末の設定のセッション名の tmux のセッションが残らない
      - '`MDMARK_PORT` のポートは、ほかのプロセスが待ち受けたまま'
      - 最後の報告に、ポートが使われていることと、`settings.json` の `env` と端末の設定の両方に同じ `MDMARK_PORT` を書く直し方が出る
    test: test_error_when_port_in_use
lead: 文書を書く人が Claude Code で `global-setup` を呼び、端末の設定を作る・移行し、tmux のセッションで常駐サーバーを起動して、つながりとフックを確かめる。
issue: 165
primary_actor: 文書を書く人
stakeholders:
  - name: 文書を書く人
    interest: 端末の設定のキーを 1 つずつ確認して答えるだけで端末がそろい、常駐サーバーがどの tmux のセッションで動いているか・ログの場所・止め方が分かる
  - name: Claude Code
    interest: 次のセッションから MCP サーバー `plugin:mdmark:mdmark` が常駐サーバーにつながる
trigger: 新しい端末・入れ直し・端末の移行・プラグインの更新の後か、セッションの開始で常駐サーバーが待ち受けていないと伝わったとき
preconditions:
  - Claude Code に mdmark のプラグインを入れている
  - 文書を書く人の手元に Node 24 以降と tmux がある
success_guarantee: 端末の設定が文書を書く人の答えた値で今のバージョンの書き方になり、常駐サーバーが端末の設定のセッション名の tmux のセッションの中で 1 つだけ待ち受け、`tools/list` がツールの一覧を返す。
minimal_guarantee: 文書を書く人が書くことを認めなかったときは、端末の設定と `settings.json` を書き換えない。ほかのプロセスが待ち受けているポートは、そのプロセスのまま変わらない。
test_file: tests/e2e/単一ユースケース/端末にmdmarkをセットアップする.spec.ts
