title: 端末にmdmarkをセットアップする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 空の端末
        description: 端末の設定（`MDMARK_CONFIG` が指すパス）・状態の配置場所（`MDMARK_STATE_DIR`）・Claude Code の設定のフォルダ（`CLAUDE_CONFIG_DIR`）を、どれも空の一時フォルダにする
        notes: '`MDMARK_CONFIG` は既定の `${XDG_CONFIG_HOME:-~/.config}/mdmark/settings.yaml` と違うパスにする'
      - name: 手元と別の tmux サーバーと空いたポート
        description: '`TMUX_TMPDIR` を空の一時フォルダにして手元と別の tmux サーバーを先に起動しておき、`MDMARK_PORT` に待ち受けるプロセスの無いポートを指定する'
        notes: 手元の常駐サーバーが使用する 8782 と手元の tmux のセッションを回避する。tmux サーバーを先に起動しておくと、`MDMARK_PORT` がセッションへ渡る経路を確認できる
      - name: Mock
        description: スキルを読み込むモデルの代わりに、スキルの手順が呼ぶスクリプトを手順の順に実行し、利用者への確認には決めた回答を返却する。端末の設定のパスは `MDMARK_CONFIG` のパスを、キーは `features.table` だけ `false` を、ほかは既定のままを回答し、書き込んでよいかには認める回答を返却する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant F as 端末の設定と settings.json
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、端末の設定が無いこと
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 記載する内容
        W->>C: 記載してよい
        C->>F: 端末の設定を記載し、settings.json の env に MDMARK_CONFIG を書き込む
        C->>T: セッションが無いので、新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C->>C: SessionStart のフックを実行する
        C-->>W: 作ったもの・記載したキー・セッション名・ログの場所・止め方
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定があり、`features.table: false` を持ち、`mdmark check` と同じ点検が端末の設定の構造のずれを返却しない'
      - '`CLAUDE_CONFIG_DIR` の `settings.json` の `env` に、端末の設定のパスの `MDMARK_CONFIG` がある'
      - 端末の設定のセッション名の tmux のセッションが 1 つだけあり、先に起動していた tmux サーバーの中でも `MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある（8782 では待ち受けない）
      - 状態の配置場所に常駐サーバーのログがあり、待ち受ける URL の 1 行を含む
      - '`tools/list` が返却するツールに `export_html`・`build_site`・`check` がある'
      - SessionStart のフックが何も出さずに終了コード 0 で終わる
      - 最後の報告に、端末の設定のパス・`settings.json` に書き込んだキー・tmux のセッション名・ログのパス・止める操作が出る
    test: test_normal
  - name: 正常シナリオ（セットアップ済み）
    setup:
      - name: セットアップ済みの端末
        description: 正常シナリオを終えた後の端末の設定・`settings.json`・状態の配置場所・tmux のセッションと、待ち受けている常駐サーバー
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>T: セッションがあり、ポートが待ち受けている
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 書き換えなかったこと・セッション名・ログの場所・止め方
    expected:
      - 端末の設定と `settings.json` の中身が呼ぶ前と同じ
      - tmux のセッションを再作成せず、常駐サーバーのプロセスが呼ぶ前と同じ
      - '`tools/list` が返却するツールに `export_html`・`build_site`・`check` がある'
      - 最後の報告に、書き換えなかったことと tmux のセッション名が出る
    test: test_normal_when_already_set_up
  - name: 正常シナリオ（常駐サーバーが止まっている）
    setup:
      - name: 止めた常駐サーバー
        description: 正常シナリオを終えた後の端末から、tmux のセッションを閉じ、`MDMARK_PORT` のポートで待ち受けるプロセスが無い状態
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。端末の設定の各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        participant S as 常駐サーバー
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定のパスと、今のバージョンであること
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C->>T: セッションが無いので、新しいセッションで mdmark serve を起動する
        T->>S: 起動
        C->>S: tools/list
        S-->>C: ツールの一覧
        C-->>W: 起動したこと・セッション名・ログの場所・止め方
    expected:
      - 端末の設定と `settings.json` の中身が呼ぶ前と同じ
      - 端末の設定のセッション名の tmux のセッションが 1 つだけあり、`MDMARK_PORT` のポートで待ち受けるプロセスが 1 つだけある
      - 状態の配置場所のログに、もう一度起動した後の待ち受ける URL の 1 行が追加される
    test: test_normal_when_server_stopped
  - name: 正常シナリオ（古いバージョンの端末の設定）
    setup:
      - name: 古いバージョンの端末の設定
        description: '`MDMARK_CONFIG` のパスに、`version` が今のバージョンより前の端末の設定を配置する'
      - name: テスト専用の移行の手順
        description: 一時フォルダに、端末の設定のバージョンと今のバージョンの間の移行の手順を 1 バージョンだけ配置し、その手順の配置場所を移行の手順の読み取り先にする
        notes: 今のバージョンには移行の手順が無いため、`mdmark upgrade` と同じ手順の当て方を確認するテストだけの手順を使用する
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。移行してよいかには認める回答を、各キーには今の値のままを回答する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant F as 端末の設定
        W->>C: /mdmark:global-setup
        C-->>W: 端末の設定の version が古いことと、適用する移行の手順
        W->>C: 移行してよい
        C->>F: コピーを残して移行の手順を適用する
        loop 端末の設定のキーごと
          C-->>W: キーの今の値と既定
          W->>C: 今の値のまま
        end
        C-->>W: 移行したこと・コピーのパス
    expected:
      - 端末の設定にテスト専用の移行の手順が該当し、`version` が今のバージョンになり、`mdmark check` と同じ点検が端末の設定の構造のずれを返却しない
      - 移行する前の端末の設定のコピーが残り、最後の報告にそのパスが出る
    test: test_normal_when_settings_outdated
  - name: 異常シナリオ（記載することを断る）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ。記載してよいかには断る回答を返却する
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        W->>C: /mdmark:global-setup
        loop 端末の設定のキーごと
          C-->>W: キーの既定
          W->>C: 値
        end
        C-->>W: 記載する内容
        W->>C: 記載しない
        C->>T: 新しいセッションで mdmark serve を起動する
        C-->>W: 端末の設定と settings.json を書き込まなかったこと
    expected:
      - '`MDMARK_CONFIG` のパスに端末の設定が無く、`settings.json` が作られていない'
      - 既定のセッション名 `mdmark-mcp` の tmux のセッションで、常駐サーバーが `MDMARK_PORT` のポートで待ち受ける
      - 最後の報告に、端末の設定と `settings.json` を書き込まなかったことが出る
    test: test_error_when_write_declined
  - name: 異常シナリオ（tmux が無い）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: tmux の無い PATH
        description: '`PATH` から tmux を削除する'
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        W->>C: /mdmark:global-setup
        C->>C: 端末の設定を記載する
        C->>C: tmux が見つからない
        C-->>W: 端末で mdmark serve を開いたまま動かすコマンド
    expected:
      - 端末の設定と `settings.json` は正常シナリオと同じに書き込まれる
      - '`MDMARK_PORT` のポートで待ち受けるプロセスが無い'
      - 最後の報告に、tmux が見つからないことと、端末で `mdmark serve` を開いたまま動かすコマンド（`MDMARK_PORT` を含む）が出る
    test: test_error_when_tmux_missing
  - name: 異常シナリオ（ポートをほかのプロセスが使用している）
    setup:
      - name: 空の端末
        description: 正常シナリオと同じ
      - name: ポートを使用するほかのプロセス
        description: '`MDMARK_PORT` のポートを mdmark ではないプロセスが待ち受ける'
      - name: 手元と別の tmux サーバーと空いたポート
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor W as 文書の作成者
        participant C as Claude Code（global-setup）
        participant T as tmux
        W->>C: /mdmark:global-setup
        C->>T: セッションが無い
        C->>C: ポートをほかのプロセスが待ち受けているので、起動しない
        C-->>W: ポートが使用されていることと修正方法
    expected:
      - 端末の設定のセッション名の tmux のセッションが残らない
      - '`MDMARK_PORT` のポートは、ほかのプロセスが待ち受けたまま'
      - 最後の報告に、ポートが使用されていることと、`settings.json` の `env` の `MDMARK_PORT` を空いたポートに変え、セッションをもう一度開いて `global-setup` をもう一度呼ぶ修正方法が出る
    test: test_error_when_port_in_use
lead: 文書の作成者が Claude Code で `global-setup` を呼び、端末の設定を作る・移行し、tmux のセッションで常駐サーバーを起動して、つながりとフックを確認する。
issue: 165
primary_actor: 文書の作成者
stakeholders:
  - name: 文書の作成者
    interest: 端末の設定のキーを 1 つずつ確認して回答するだけで端末がそろい、常駐サーバーがどの tmux のセッションで動いているか・ログの場所・止め方が分かる
  - name: Claude Code
    interest: 次のセッションから MCP サーバー `plugin:mdmark:mdmark` が常駐サーバーにつながる
trigger: 新しい端末・再インストール・端末の移行・プラグインの更新の後か、セッションの開始で常駐サーバーが待ち受けていないと伝わったとき
preconditions:
  - Claude Code に mdmark のプラグインを入れている
  - 文書の作成者の手元に Node 24 以降と tmux 3.4 以降がある
success_guarantee: 端末の設定が文書の作成者の回答した値で今のバージョンの記載方法になり、常駐サーバーが端末の設定のセッション名の tmux のセッションの中で 1 つだけ待ち受け、`tools/list` がツールの一覧を返却する。
minimal_guarantee: 文書の作成者が記載することを認めなかったときは、端末の設定と `settings.json` を書き換えない。ほかのプロセスが待ち受けているポートは、そのプロセスのまま変わらない。
test_file: tests/e2e/単一ユースケース/端末にmdmarkをセットアップする.spec.ts
