title: "画像をライトボックスで拡大する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 文書を描いたページ
        description: 版を固定した URL で mdmark を読み、文書を描いた HTML
      - name: 3 つの画像の Markdown
        description: '`a.png`・`b.png`・`c.png` の 3 つの画像を、本文の段落を挟んで並べた文書'
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える。画像は手元の応答で返す
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像を押す
        M-->>U: 2 つ目の画像を拡大した全画面のダイアログ
        U->>M: 右の矢印キーを押す
        M-->>U: 3 つ目の画像
        U->>M: 前へのボタンを 2 回押す
        M-->>U: 1 つ目の画像
        U->>M: Esc を押す
        M-->>U: ダイアログを閉じた文書
    expected:
      - 2 つ目の画像を押した後、全画面のダイアログが開き、`b.png` が表示されている
      - 右の矢印キーの後に `c.png`、前へのボタンを 2 回押した後に `a.png` が表示されている
      - ダイアログに、何枚目か（3 枚のうち）が出ている
      - Esc の後にダイアログが閉じ、フォーカスが 2 つ目の画像へ戻り、文書のスクロールの位置が押す前と同じ
      - ダイアログの前へ・次へ・閉じるのボタンが `aria-label` を持ち、ダイアログの中で Tab のフォーカスが循環する
    test: test_normal
  - name: 正常シナリオ（キーで開く）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: 3 つの画像の Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 描いた文書
        participant M as mdmark
        U->>P: Tab で 1 つ目の画像にフォーカスする
        U->>P: Enter を押す
        M-->>U: 1 つ目の画像を拡大した全画面のダイアログ
    expected:
      - 画像が Tab でフォーカスでき、拡大できることが読み上げで知らされる
      - Enter の後、全画面のダイアログで `a.png` が表示されている
    test: test_normal_when_opened_by_key
  - name: 正常シナリオ（拡大しない画像）
    setup:
      - name: 文書を描いたページ
        description: 正常シナリオと同じ
      - name: nolightbox を持つ Markdown
        description: '`a.png`・`![アイコン](b.png){nolightbox}`・`c.png` を並べた文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 描いた文書
        participant M as mdmark
        U->>P: 2 つ目の画像を押す
        P-->>U: 何も開かない
        U->>P: 1 つ目の画像を押す
        M-->>U: 1 つ目の画像の全画面のダイアログ
        U->>M: 右の矢印キーを押す
        M-->>U: 3 つ目の画像
    expected:
      - 2 つ目の画像を押してもダイアログが開かず、2 つ目の画像は Tab でフォーカスされない
      - 1 つ目から右の矢印キーで送ると `c.png` が表示され、`b.png` は飛ばされる
      - ダイアログの枚数が 2 枚になっている
    test: test_normal_when_nolightbox
lead: 読む人が文書の画像を押すと、全画面のダイアログで拡大し、同じ文書の画像を前後に送る。キー・ボタン・閉じ方は図の全画面と揃える。`nolightbox` の属性を付けた画像は拡大しない。
issue: 199
primary_actor: 文書を読む人
stakeholders:
  - name: 文書を書く人
    interest: 細かい画像を本文では小さく置き、読む人に拡大して見せられる
trigger: 読む人が、描いた文書の画像を押す
preconditions:
  - 使う側のページが、画像を持つ文書を描いている
  - ライトボックスの機能がオン（既定）
success_guarantee: 押した画像が全画面で拡大され、前後の画像へ送れて、閉じると押した画像へフォーカスが戻る。
minimal_guarantee: 拡大を閉じた後の文書は、押す前と同じスクロールの位置にある。
