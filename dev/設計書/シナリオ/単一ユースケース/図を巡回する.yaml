title: 図を巡回する
lead: 読者が、map の構成図の補足に記載された案内の手順を、前へ・次へで進め、手順ごとの視点・入るグループ・強調するノードと説明の文を読む。
issue: 324
test_file: tests/e2e/単一ユースケース/図を巡回する.spec.ts
primary_actor: 読者
trigger: 読者が、文書の作成者が用意した順番で構成図を読みたくなる
preconditions:
  - 文書に、補足の `walkthroughs` に手順 3 つの案内を持つ map の構成図が描かれている（『Mermaidと補足で図を描く』）
success_guarantee: 手順ごとに、指定の視点と段で図が表示され、強調するノードと説明の文が出る。巡回を終えると、始めた段へ戻る。
minimal_guarantee: 手順が指すノード・視点・グループが図に無いときは、その指定を飛ばして説明の文を出し、書き方の警告を出す。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: 図を描いたページ
        description: 手順 3 つの案内を持つ map の構成図を描いたページ
        notes: 手順 1 は全体の図でノード 1 つを強調し、手順 2 はデータの流れの視点に切り替え、手順 3 はグループの中へ入ってノード 2 つを強調する
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返却する手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読者
        participant D as map の図
        U->>D: 帯の「案内」を押す
        D-->>U: 手順 1 の説明と強調を出し、図の下に案内の帯を出す
        U->>D: 次へを押す
        D-->>U: 手順 2 の視点に切り替え、説明を出す
        U->>D: 次へを押す
        D-->>U: 手順 3 のグループに入り、2 つのノードを強調する
        U->>D: 前へを押す
        D-->>U: 手順 2 に戻す
        U->>D: 巡回を終えるを押す
        D-->>U: 案内の帯を閉じ、始めた段の図に戻す
    expected:
      - 案内の帯に、今の手順の番号と全体の手順の数（1 / 3）・説明の文・前へ・次へ・最初から・巡回を終えるが出る
      - 手順 1 で、指定のノードが強調され、ほかのノードが薄くなる
      - 手順 2 で、データの流れの視点の図に切り替わり、帯の視点の部品もその視点を示す
      - 手順 3 で、指定のグループの中に入り、パンくずが出て、2 つのノードが強調される
      - 最初の手順では前へ、最後の手順では次へが押せない状態で出る
      - 巡回を終えると、案内の帯が消え、強調が外れ、巡回を始めた全体の図に戻る
      - 前へ・次へは左右の矢印キーでも進められ、説明の文が読み上げの対象になる
    test: test_normal
