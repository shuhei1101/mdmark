title: "ビューで項目を見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: mdmark を読むページ
        description: 版を固定した URL で `dist/index.js` と `dist/index.css` を読み、設定を渡して文書を描く HTML
      - name: ビューの印を持つ Markdown
        description: '`<!-- view: group=状態 -->` 〜 `<!-- /view -->` で、題・状態・担当の列と 5 行を持つ表を囲んだ文書'
        notes: 状態の列の値は上から `未着手`・`進行中`・`未着手`・`完了`・`進行中`
      - name: Mock
        description: jsDelivr を、ビルドした `dist/` を同じパスで返す手元の応答に差し替える
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 状態の列の値ごとの列に項目を並べたボード表示
        U->>P: ビューの切り替えで表形式を選ぶ
        P-->>U: 項目を行で並べた表形式のビュー
        U->>P: ビューの切り替えでボード表示を選ぶ
        P-->>U: ボード表示
    expected:
      - ボード表示に、表に出た順の `未着手`・`進行中`・`完了` の 3 つの列があり、列の見出しに値ごとのアイコン・値・項目の数（2・2・1）が出る。アイコンは既定の対応から当たり、印の引数で値ごとに上書きできる
      - 各列の項目は表の行の順で並び、項目に先頭の列（題）の値と、残りの列（担当）の値が出る。`group=` の列（状態）の値は項目に出ない
      - 表形式を選ぶと、5 行の項目が表の列の順で並び、ボード表示は隠れる
      - 切り替えの今の選択が `aria-pressed` で読み上げられる
      - ビューの前後に印の文字が出ていない
    test: test_normal
  - name: 正常シナリオ（表形式で開く）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 表形式で開く Markdown
        description: '`<!-- view: group=状態 default=table -->` 〜 `<!-- /view -->` で、正常シナリオと同じ表を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 表形式のビュー
        U->>P: ビューの切り替えでボード表示を選ぶ
        P-->>U: ボード表示
    expected:
      - 描いた時点で表形式のビューが出ていて、切り替えの表形式が選ばれている
      - ボード表示を選ぶと、正常シナリオと同じ 3 つの列のボード表示が出る
    test: test_normal_when_opened_as_table
  - name: 正常シナリオ（機能を外す）
    setup:
      - name: mdmark を読むページ
        description: '`features.views` を `false` にした設定を渡して文書を描く HTML'
      - name: ビューの印を持つ Markdown
        description: 正常シナリオと同じ
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: ビューの機能を外した設定と Markdown を渡して描かせる
        M-->>P: 印の範囲の表をそのまま描いた文書
    expected:
      - 印の範囲の表が、ボード表示ではなく普通の表で描かれる
      - ビューの切り替えが出ない
      - 書き方の警告が出ない
    test: test_normal_when_disabled
  - name: 異常シナリオ（知らない列）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 表に無い列を指す Markdown
        description: '`<!-- view: group=優先度 -->` 〜 `<!-- /view -->` で、正常シナリオと同じ表（優先度の列を持たない）を囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        actor U as 読む人
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 書き方の警告と表形式のビュー
        U->>P: 表形式のビューを見る
        P-->>U: 5 行の項目
    expected:
      - 範囲の上に、`優先度` が表に無い列であることと、表の列（`題`・`状態`・`担当`）を書いた書き方の警告がある
      - ボード表示は出ず、表形式のビューで 5 行の項目が描かれる
      - ビューの切り替えのボード表示が押せない
    test: test_error_when_group_column_missing
  - name: 異常シナリオ（範囲に表が無い）
    setup:
      - name: mdmark を読むページ
        description: 正常シナリオと同じ
      - name: 表の無い範囲の Markdown
        description: '`<!-- view: group=状態 -->` 〜 `<!-- /view -->` で、段落だけを囲んだ文書'
      - name: Mock
        description: 正常シナリオと同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: 設定と Markdown を渡して描かせる
        M-->>P: 書き方の警告と、範囲の中身をそのまま描いた文書
    expected:
      - 範囲の上に、範囲に表が無いことを書いた書き方の警告がある
      - 範囲の段落がそのまま描かれ、ビューの切り替えが出ない
    test: test_error_when_no_table
lead: '文書を書く人が `<!-- view: group=列名 -->` 〜 `<!-- /view -->` で項目の表を囲み、読む人が描かれた項目をボード表示と表形式のビューで切り替えて見る。'
issue: 8
primary_actor: 文書を読む人
stakeholders:
  - name: 文書を書く人
    interest: 項目の表に印を付けるだけでビューを置け、印に対応しない表示（GitHub など）でも表のまま読める
  - name: 読む人
    interest: 項目を列の値ごとに分けて見渡せ、細かく見たいときは表に切り替えられる
trigger: 読む人が、ビューの印を持つ文書を描いたページを開く
preconditions:
  - ページが版を固定した URL で mdmark の JavaScript と CSS を読み、`mount` で文書を描いている
  - ビューの機能（`views`）がオン（既定）
success_guarantee: 印で囲んだ表の行が項目になり、`group=` の列の値ごとの列に並んだボード表示で描かれる。ビューの上の切り替えで表形式のビューと行き来できる。
minimal_guarantee: 印に読めない指定があっても、表は描かれ、範囲の上に書き方の警告が出る。
test_file: tests/e2e/単一ユースケース/ビューで項目を見る.spec.ts
