id: CMP-472-34
title: "先頭へ戻るボタン"
implementation: "src/parts/back-to-top.ts#renderBackToTop"
story: "Parts/BackToTop"
states:
  - name: Shown
    description: 出し始める量までスクロールした後の、画面の右下に出したボタン
  - name: Hidden
    description: 先頭の近くにいる間の、`hidden` を付けて出さないボタン
    args:
      - name: hidden
        value: 'true'
lead: 描いた文書をスクロールする場所の高さ分スクロールすると、スクロールする場所の右下に出し、押すと描いた文書の先頭へ戻すボタン。HTML 文字列を返却する。
args:
  - name: hidden
    type: 真偽値
    required: false
    default: 'false'
    description: ボタンを隠しているか。`hidden` 属性に写す。`mount` は隠した状態で描き、スクロールの量で付与・解除する
events:
  - name: 先頭へ戻る
    when: ボタンを押す
    value: なし
    description: '`mount` がスクロールする場所を描いた文書の先頭へスクロールし、本文の列へフォーカスを移す'
css_properties:
  - name: --mdmark-back-to-top-size
    syntax: <length>
    default: 2.75rem
    description: ボタンの幅と高さ
  - name: --mdmark-back-to-top-gap
    syntax: <length>
    default: 1rem
    description: ボタンとスクロールする場所の右端・下端の間
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: ボタンの地の色
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: ボタンの枠の色
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: ボタンのアイコンの色
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: ポインターを乗せている間のボタンの地の色
  - name: --mdmark-color-text
    syntax: <color>
    default: '#18181b（ダーク #ededef）'
    description: ポインターを乗せている間のアイコンの色
  - name: --mdmark-color-current-bg
    syntax: <color>
    default: '#e6f3f1（ダーク #10302c）'
    description: 押している間のボタンの地の色
  - name: --mdmark-color-link
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: 押している間のアイコンの色と、キーボードのフォーカスの輪郭の色
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: ボタンの角丸
accessibility:
  - '`button` 要素（`type="button"`）で、`aria-label`・`title` を「先頭へ戻る」にする。アイコンは `aria-hidden` にする'
  - 隠している間は `hidden` を付け、Tab で届かずスクリーンリーダーにも出さない
  - キーボードのフォーカスは、`--mdmark-color-link` の 2px の輪郭を 2px 離して出す
  - 幅と高さは 44×44px 以上にする
refs:
  - IF-472-35#constraints[先頭へ戻るボタン]
status: planned
introduced:
  pr: 287
aliases:
  - back-to-top
notes:
  補足: '`<button class="mdmark-back-to-top" type="button" aria-label="先頭へ戻る" title="先頭へ戻る" hidden>{lucide の arrow-up-to-line のアイコン}</button>`。配置する位置（スクロールする場所の右下・ミニマップと余白の列を回避する位置）は `mount` がボタンの `--mdmark-back-to-top-right`・`--mdmark-back-to-top-bottom` に入れるため、ストーリーではなく `mount` の結合テストで確認する。ストーリーは配置場所を固定して描く。モックは `dev/mock/components/back-to-top/` と `dev/mock/refs/287/assets/back-to-top.js`'
test_file: tests/integration/lib/back-to-top.story.test.ts
