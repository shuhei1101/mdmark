summary: "文書の中に mdmark が置く UI の部品の引数・状態（Storybook のストーリーの元）"
docs_index: true
items:
  - page: 知らせの枠.ts.yaml
    summary: 外部ライブラリを読めない印の場所に置く枠
  - page: 読み込み中の枠.ts.yaml
    summary: 外部ライブラリを読み込んでいる間に図の高さを取っておく枠
  - page: 書き方の警告.ts.yaml
    summary: 記法の印や拡張の引数に読めない指定がある箇所に置く枠
  - page: 表.ts.yaml
    summary: 種類ごとの並べ替え・ピン止め・絞り込みを付けた表
  - page: 注意書き.ts.yaml
    summary: 種類ごとの題・色・アイコンを持つ注意書きの枠
  - page: タブ.ts.yaml
    summary: 見出しで区切った中身を切り替えるタブ
  - page: ステップ.ts.yaml
    summary: 番号と項目を線でつなぐ手順
  - page: ファイルツリー.ts.yaml
    summary: フォルダとファイルの入れ子のツリー
  - page: バッジ.ts.yaml
    summary: 行内の札
  - page: 目次.ts.yaml
    summary: h2〜h3 を入れ子にした目次
  - page: 節.ts.yaml
    summary: 見出しから開閉する節と見出しのアンカー
  - page: 行の詳細.ts.yaml
    summary: 表の行の下に開閉して出す詳細
  - page: 図表の番号.ts.yaml
    summary: 図と表に付ける通し番号の題
  - page: 用語のツールチップ.ts.yaml
    summary: 本文の用語と文書の別名の下線と、用語の意味・関連文書を出すツールチップ
  - page: 関連文書の一覧.ts.yaml
    summary: 描いた文書の末尾に置く、その文書を参照している文書の一覧
  - page: 文書の一覧.ts.yaml
    summary: まとめた HTML の文書をフォルダごとに並べ、開いている文書を示す一覧
  - page: 図の枠.ts.yaml
    summary: 図の題・右上のボタンの帯・表示する枠・凡例と、拡大・縮小・移動・全画面
  - page: フロー図.ts.yaml
    summary: システムの枠と 3 つの層に箱と線を置く構成図
  - page: シーケンス図.ts.yaml
    summary: 相手を左から右、メッセージを時刻の順に並べる図
  - page: グラフ.ts.yaml
    summary: 系列を色と模様の組で分ける折れ線のグラフ
  - page: 図のツールチップ.ts.yaml
    summary: 図の線の入力の詳細と、箱の入力・処理・出力を出すツールチップ
  - page: 操作できる部品.ts.yaml
    summary: スライダー・今の値を写すボタン・グラフを組み合わせた部品
