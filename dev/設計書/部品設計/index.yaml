summary: "文書の中に mdmark が置く UI の部品の引数・状態（Storybook のストーリーの元）"
docs_index: true
items:
  - page: 知らせの枠.ts.yaml
    summary: 外部ライブラリを読めない印の場所に置く枠
  - page: 読み込み中の枠.ts.yaml
    summary: 外部ライブラリを読み込んでいる間に図の高さを取っておく枠
  - page: 書き方の警告.ts.yaml
    summary: 記法の印や拡張の引数に読めない指定がある箇所に置く枠
  - page: 表.ts.yaml
    summary: 種類ごとの並べ替え・ピン止め・絞り込みを付けた表
  - page: 注意書き.ts.yaml
    summary: 種類ごとの題・色・アイコンを持つ注意書きの枠
  - page: タブ.ts.yaml
    summary: 見出しで区切った中身を切り替えるタブ
  - page: ステップ.ts.yaml
    summary: 番号と項目を線でつなぐ手順
  - page: ファイルツリー.ts.yaml
    summary: フォルダとファイルの入れ子のツリー
  - page: バッジ.ts.yaml
    summary: 行内の札
  - page: 目次.ts.yaml
    summary: h2〜h3 を入れ子にした目次
  - page: 節.ts.yaml
    summary: 見出しから開閉する節と見出しのアンカー
  - page: 行の詳細.ts.yaml
    summary: 表の行の下に開閉して出す詳細
  - page: 図表の番号.ts.yaml
    summary: 図と表に付ける通し番号の題
  - page: 用語のツールチップ.ts.yaml
    summary: 本文の用語と文書の別名の下線と、用語の意味・関連文書を出すツールチップ
  - page: 関連文書の一覧.ts.yaml
    summary: 描いた文書の末尾に置く、その文書を参照している文書の一覧
  - page: 文書の一覧.ts.yaml
    summary: まとめた HTML の文書をフォルダごとに並べ、開いている文書を示す一覧
  - page: 図の枠.ts.yaml
    summary: 図の題・右上のボタンの帯・表示する枠・凡例と、拡大・縮小・移動・全画面
  - page: フロー図.ts.yaml
    summary: システムの枠と 3 つの層に箱と線を置く構成図
  - page: シーケンス図.ts.yaml
    summary: 相手を左から右、メッセージを時刻の順に並べる図
  - page: グラフ.ts.yaml
    summary: 系列を色と模様の組で分ける折れ線・棒・円・散布図のグラフ
  - page: 図のツールチップ.ts.yaml
    summary: 図の線の入力の詳細と、箱の入力・処理・出力・ヒントを出すツールチップ
  - page: 操作できる部品.ts.yaml
    summary: スライダー・今の値を写すボタン・グラフを組み合わせた部品
  - page: 埋め込んだHTML.ts.yaml
    summary: コードブロックに書いた HTML をその場に描き、列より広いときだけ中で横にスクロールする枠
  - page: ヒント.ts.yaml
    summary: 埋め込んだ HTML の `data-hint` の要素に付ける印と下線とツールチップ
  - page: 差分を開くボタン.ts.yaml
    summary: 文書の題の後ろに置き、差分を開閉する「変更を見る」のボタン
  - page: リビジョンの選択.ts.yaml
    summary: 差分で比べる前と後のリビジョンを選ぶ欄と、削除した行と追加した行の数
  - page: 差分の行.ts.yaml
    summary: 削除した行を赤・追加した行を緑、変わった語を濃い色で出す差分の行
  - page: 埋め込んだHTMLの差分.ts.yaml
    summary: 差分の中の埋め込んだ HTML の範囲を、ソースとプレビューで切り替える外枠
  - page: ミニマップ.ts.yaml
    summary: 送り先のスクロールの右端に貼り付け、変えた行の位置を印で並べる帯
  - page: 差分の状態の文.ts.yaml
    summary: 差分の場所に行の代わりに出す、変更が無い・比較対象が無い・読み込んでいるの文
  - page: ビュー.ts.yaml
    summary: 項目の表をボードと表形式で切り替えて出すビュー
  - page: コメントのボタン.ts.yaml
    summary: 本文の文字を選んだときに出す「コメント」のボタン
  - page: コメントの入力欄.ts.yaml
    summary: 選んだ文字の下に開き、コメントを書いて保存する枠
  - page: コメントの印.ts.yaml
    summary: コメントが付いた本文の文字を包む印
  - page: コメントの吹き出し.ts.yaml
    summary: 印の下に開き、付いたコメントの本文を並べる枠
  - page: 箇所が見つからないコメントの一覧.ts.yaml
    summary: 付けた箇所が見つからないコメントを文書の末尾に並べる一覧
  - page: コードブロック.ts.yaml
    summary: 題・行番号・行の強調・足した行と消した行を付けたコードブロック
  - page: プレビューの状態の表示.ts.yaml
    summary: VS Code 拡張機能のプレビューで文書の代わりに出す、読み込み中と描けない理由と「リロード」
  - page: 設定ファイルを読めない帯.ts.yaml
    summary: VS Code 拡張機能のプレビューで文書の先頭に置く、設定ファイルを読めない帯と「設定ファイルを開く」
  - page: 右側の目次.ts.yaml
    summary: 描いた文書の右側に置く、h1〜h3 の目次・右端の線・ピン止め・すべて展開とすべて折りたたむ
