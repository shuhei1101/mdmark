summary: "文書の中に mdmark が配置する UI の部品の引数・状態（Storybook のストーリーの元）"
docs_index: true
items:
  - page: 知らせの枠.ts.yaml
    summary: 外部ライブラリを読み込めないマーカーの場所に配置する枠
  - page: 読み込み中の枠.ts.yaml
    summary: 外部ライブラリを読み込んでいる間に図の高さを取っておく枠
  - page: 書き方の警告.ts.yaml
    summary: 記法のマーカーや拡張の引数に読み込めない指定がある箇所に配置する枠
  - page: 表.ts.yaml
    summary: 種類ごとの並べ替え・ピン止め・絞り込みを付けた表
  - page: 注意書き.ts.yaml
    summary: 種類ごとのタイトル・色・アイコンを持つ注意書きの枠
  - page: タブ.ts.yaml
    summary: 見出しで区切った中身を切り替えるタブ
  - page: ステップ.ts.yaml
    summary: 番号と項目を線でつなぐ手順
  - page: ファイルツリー.ts.yaml
    summary: フォルダとファイルの入れ子のツリー
  - page: バッジ.ts.yaml
    summary: 行内の札
  - page: 目次.ts.yaml
    summary: h2〜h3 を入れ子にした目次
  - page: 節.ts.yaml
    summary: 見出しから開閉するセクションと見出しのアンカー
  - page: 行の詳細.ts.yaml
    summary: 表の行の下に開閉して出す詳細
  - page: 図表の番号.ts.yaml
    summary: 図と表に付ける通し番号のタイトル
  - page: 用語のツールチップ.ts.yaml
    summary: 本文の用語と文書の別名の下線と、用語の意味・関連文書を出すツールチップ
  - page: 関連文書の一覧.ts.yaml
    summary: 描いた文書の末尾に配置する、その文書を参照している文書の一覧
  - page: 脚注の番号.ts.yaml
    summary: 本文の参照の場所に配置する上付きの番号と、脚注の中身を出すツールチップ
  - page: 脚注の一覧.ts.yaml
    summary: 描いた文書の末尾に配置する、閉じた脚注の一覧と本文へ戻るリンク
  - page: 文書の一覧.ts.yaml
    summary: まとめた HTML の文書をフォルダごとに並べ、開いている文書を示す一覧
  - page: 図の枠.ts.yaml
    summary: 図のタイトル・右上のボタンの帯・表示する枠・凡例と、拡大・縮小・移動・全画面
  - page: フロー図.ts.yaml
    summary: システムの枠と 3 つの層にノードと線を配置する構成図
  - page: シーケンス図.ts.yaml
    summary: 相手を左から右、メッセージを時刻の順に並べる図
  - page: グラフ.ts.yaml
    summary: 系列を色と模様の組で分ける折れ線・棒・円・散布図のグラフ
  - page: ER図.ts.yaml
    summary: テーブル・列・関係を定義の座標に配置し、多重度の記号で結ぶ ER 図
  - page: mermaidの図.ts.yaml
    summary: 図の枠の表示する枠に入れる、mermaid で mdmark の外観のテーマで描いた SVG
  - page: 図のツールチップ.ts.yaml
    summary: 図の線の入力の詳細と、ノードの入力・処理・出力・ヒントと、ER 図のテーブルの概要と列の説明を出すツールチップ
  - page: 操作できる部品.ts.yaml
    summary: スライダー・今の値を写すボタン・グラフを組み合わせた部品
  - page: 埋め込んだHTML.ts.yaml
    summary: コードブロックに記載した HTML をその場に描き、列より広いときだけ中で横にスクロールする枠
  - page: ヒント.ts.yaml
    summary: 埋め込んだ HTML の `data-hint` の要素に付けるマーカーと下線とツールチップ
  - page: 差分を開くボタン.ts.yaml
    summary: 文書のタイトルの後ろに配置し、差分を開閉する「変更表示」のボタン
  - page: リビジョンの選択.ts.yaml
    summary: 差分で比べる前と後のリビジョンを選ぶ欄と、削除した行と追加した行の数
  - page: 差分の行.ts.yaml
    summary: 削除した行を赤・追加した行を緑、変わった単語を濃い色で出す差分の行
  - page: 埋め込んだHTMLの差分.ts.yaml
    summary: 差分の中の埋め込んだ HTML の範囲を、ソースとプレビューで切り替える外枠
  - page: ミニマップ.ts.yaml
    summary: スクロール先のスクロールの右端に貼り付け、変えた行の位置をマーカーで並べる帯
  - page: 差分の状態の文.ts.yaml
    summary: 差分の場所に行の代わりに出す、変更が無い・比較対象が無い・読み込んでいるの文
  - page: ビュー.ts.yaml
    summary: 項目の表をボードと表形式で切り替えて出すビュー
  - page: コメントのボタン.ts.yaml
    summary: 本文の文字を選んだときに出す「コメント」のボタン
  - page: コメントの入力欄.ts.yaml
    summary: 選んだ文字の下に開き、コメントを記載して保存する枠
  - page: コメントの印.ts.yaml
    summary: コメントが付いた本文の文字を包むマーカー
  - page: コメントの吹き出し.ts.yaml
    summary: マーカーの下に開き、付いたコメントの本文を並べる枠
  - page: 箇所が見つからないコメントの一覧.ts.yaml
    summary: 付けた箇所が見つからないコメントを文書の末尾に並べる一覧
  - page: 余白のマーカー.ts.yaml
    summary: 本文の右の余白の列に、コメントの箇所の行の高さで配置するボタン
  - page: コードブロック.ts.yaml
    summary: タイトル・行番号・行の強調・追加した行と削除した行を付けたコードブロック
  - page: プレビューの状態の表示.ts.yaml
    summary: VS Code 拡張機能のプレビューで文書の代わりに出す、読み込み中と描けない理由と「リロード」
  - page: 設定ファイルを読めない帯.ts.yaml
    summary: VS Code 拡張機能のプレビューで文書の先頭に配置する、設定ファイルを読み込めない帯と「設定ファイルを開く」
  - page: 右側の目次.ts.yaml
    summary: 描いた文書の右側に配置する、h1〜h3 の目次・右端の線・ピン止め・すべて展開とすべて折りたたむ
  - page: 先頭へ戻るボタン.ts.yaml
    summary: 描いた文書をスクロールすると右下に出し、押すと文書の先頭へ戻すボタン
  - page: 差分のブロック.ts.yaml
    summary: 描いた文書の追加・変更したブロックと削除したブロックを、面の色と左の余白の + / − で示すブロック
  - page: 画像の図.ts.yaml
    summary: 画像 1 つだけの段落の画像を、キャプション・幅・配置・テーマごとの出し分けと拡大のボタンを持つ図にしたもの
  - page: ギャラリー.ts.yaml
    summary: 画像を列の数の格子に並べ、配置場所の幅が狭いと列を減らす並び
  - page: ライトボックス.ts.yaml
    summary: 画像を全画面で拡大し、前後へ切り替え、拡大・縮小・移動するダイアログ
  - page: 動画と音声.ts.yaml
    summary: 再生バーとキャプションを持つ動画・音声の図
  - page: GIF.ts.yaml
    summary: GIF を止める・再生するボタンと、止めたときに重ねる最初のフレーム
  - page: カード.ts.yaml
    summary: リンク 1 つだけの段落を、タイトル・ドメイン・URL を出すリンクのカードと添付のカードにしたもの
  - page: カードの格子.ts.yaml
    summary: cards の範囲のリストの項目を、アイコン・タイトル・説明のカードにして格子に並べたもの
  - page: 文字の色.ts.yaml
    summary: 本文の文字を色のプリセットの文字の色と太字で強調する
  - page: 再生できない動画・音声の知らせ.ts.yaml
    summary: VS Code 拡張機能のプレビューで再生できない動画・音声の場所に配置する、通知ブロックと「既定のアプリで開く」
  - page: アイコン.ts.yaml
    summary: 行内に配置する Lucide のアイコン
  - page: キー.ts.yaml
    summary: '`+` で区切ったキーの外観の並び'
  - page: 蛍光ペン.ts.yaml
    summary: 文字に色の面を敷くマーカー
  - page: 段組み.ts.yaml
    summary: 本文を 2〜3 列に横に並べる範囲
  - page: detailsの範囲.ts.yaml
    summary: タイトルから開閉する範囲の折りたたみ
  - page: wideの範囲.ts.yaml
    summary: 本文の幅を越えて広げ、本文の幅と切り替える範囲
