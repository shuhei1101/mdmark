title: "箇所が見つからないコメントの一覧"
implementation: "src/parts/comment.ts#renderCommentOrphans"
story: "Parts/CommentOrphans"
states:
  - name: Default
    description: 2 つのコメント。HTML に見える本文は文字のまま出す
    args:
      - name: comments
        value: '[{"quote":"テーマの変数","body":"ここは <b>太字</b> にしたい"},{"quote":"角丸は 6px","body":"角丸は 6px のままでよいと思います。"}]'
      - name: id
        value: story-orphans
  - name: Empty
    description: 空のときは何も出さない
    args:
      - name: comments
        value: '[]'
      - name: id
        value: story-orphans
lead: 本文が書き換わり、付けた箇所が見つからないコメントを、文書の末尾に選んだ文字と本文の組で並べる一覧。HTML 文字列を返す。
args:
  - name: comments
    type: オブジェクトの配列
    required: true
    description: 箇所が見つからないコメント（`{ quote, body }`）。文字として出し、HTML として解釈しない。空なら何も返さない
  - name: id
    type: 文字列
    required: true
    description: 題の `id`。一覧の `aria-labelledby` が指す
accessibility:
  - '`section` を題の `h2` で `aria-labelledby` し、項目を `ul` で並べる'
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[コメントの箇所]
status: planned
notes:
  HTML: '`<section class="mdmark-comment-orphans" aria-labelledby="{id}"><h2 id="{id}">箇所が見つからないコメント</h2><p class="mdmark-comment-orphans-lead">本文が書き換わり、コメントを付けた文字が見つかりません。</p><ul><li><p class="mdmark-comment-quote">「{quote}」へのコメント</p><p class="mdmark-comment-body">{body}</p></li></ul></section>`。モックは `dev/mock/components/comment/`'
