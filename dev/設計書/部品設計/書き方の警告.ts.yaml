title: "書き方の警告"
implementation: "src/parts/syntax-warning.ts#renderSyntaxWarning"
story: "Parts/SyntaxWarning"
test_file: tests/integration/lib/syntax-warning.story.test.ts
states:
  - name: ClosedAndOpen
    description: 表の印に `closed` と `open` を両方書いた。本文だけを出す
    args:
      - name: mark
        value: '<!-- table: data closed open -->'
      - name: message
        value: の `closed` と `open` は同時に書けません。どちらか 1 つにしてください。`closed` を当てて描いています。
  - name: Items
    description: 表の印に、機能を足していない表では使えないキーを書いた。本文の後に項目を並べる
    args:
      - name: mark
        value: '<!-- table: data hide=備考 total=価格:sum -->'
      - name: message
        value: の読めない指定を当てずに描いています。
      - name: items
        value: '[{"label":"hide=","message":"`+columns` を書いた表でだけ使えます。当てずに描いています"},{"label":"total=","message":"`+total` を書いた表でだけ使えます。当てずに描いています"}]'
  - name: BrokenReference
    description: 切れた図表の参照。印を持たず本文だけを出す
    args:
      - name: message
        value: 'リンク先の `#fig-missing` の図表がありません。`<!-- fig: missing -->` を図か表の直前に書くか、リンク先を直してください。'
  - name: ExtensionSchema
    description: 拡張の引数が Schema に合わない。issue ごとの項目を並べる
    args:
      - name: mark
        value: '<!-- greet: World 2 -->'
      - name: message
        value: の引数が、拡張 `greet` の決まりに合いません。直してから読み込み直してください。
      - name: items
        value: '[{"label":"1 つ目の World","message":"Invalid format: Expected /^[a-z]+$/ but received \"World\""},{"label":"2 つ目の 2","message":"Invalid type: Expected never but received \"2\""}]'
  - name: LongMark
    description: 印が長く枠の幅を超える。印が枠の中で折り返す
    args:
      - name: mark
        value: '<!-- table: data filter=とても長い列の名前:range,もう一つの長い列の名前:text,更新日:date -->'
      - name: message
        value: の絞り込みの種類 `range` は使えません。使える種類は `select`・`text`・`date` です。
  - name: GlossaryColumn
    description: 用語集の表の印に、表に無い列名を書いた
    args:
      - name: mark
        value: '<!-- glossary: term=用語 meaning=説明 -->'
      - name: message
        value: の `meaning=` の列 `説明` が表にありません。表の列は `用語`・`意味` です。列名を直してください。この表からは用語を入れずに描いています。
  - name: GlossaryMissingArg
    description: 用語集の表の印に、必須の `meaning=` を書いていない
    args:
      - name: mark
        value: '<!-- glossary: term=用語 -->'
      - name: message
        value: に `meaning=` がありません。意味の列を `meaning=列名` で指してください。この表からは用語を入れずに描いています。
  - name: ViewGroupColumn
    description: ビューの印の `group=` に、表に無い列名を書いた
    args:
      - name: mark
        value: '<!-- view: group=優先度 -->'
      - name: message
        value: の列 `優先度` は表にありません。表の列は `題`・`状態`・`担当` です。ボードにせず、表で描いています。
  - name: ViewNoTable
    description: ビューの印の範囲に表が無い
    args:
      - name: mark
        value: '<!-- view: group=状態 -->'
      - name: message
        value: の範囲に、項目にする表がありません。範囲の中に Markdown の表を書いてください。範囲の中身はそのまま描いています。
  - name: ViewUnknownIcon
    description: ビューの印の `icons=` に、使えないアイコンの名前を書いた
    args:
      - name: mark
        value: '<!-- view: group=状態 icons=完了:rocket -->'
      - name: message
        value: のアイコン `rocket` は使えません。使えるアイコンは `circle`・`circle-dashed`・`circle-dot`・`circle-pause`・`circle-check`・`circle-x`・`inbox`・`archive`・`clock`・`flag`・`star`・`bug`・`eye`・`lock`・`zap`・`ban` です。`完了` の列には既定のアイコンを付けています。
  - name: IconName
    description: '`icon:` の名前が Lucide の名前の書き方に合わない'
    args:
      - name: mark
        value: icon:Rocket!
      - name: message
        value: 'の `Rocket!` は Lucide のアイコンの名前になりません。名前は英小文字・数字・`-` で書きます（例: `rocket`）。書いた文字のまま表示しています。'
  - name: IconNotInLucide
    description: '`icon:` の名前が Lucide に無い'
    args:
      - name: mark
        value: icon:no-such-icon
      - name: message
        value: の `no-such-icon` は Lucide に無いアイコンの名前です。https://lucide.dev/icons/ で名前を確かめてください。書いた文字のまま表示しています。
  - name: ColumnsCount
    description: columns の範囲の列の数が 2〜3 でない
    args:
      - name: mark
        value: <!-- columns -->
      - name: message
        value: の範囲が 4 列です。横に並べられるのは 2〜3 列です。`<!-- column -->` を減らしてください。中身を書いた順に表示しています。
  - name: IncludeMissing
    description: include の取り込み先の行の範囲が無い
    args:
      - name: mark
        value: '<!-- include: src/app.ts#L20-L22 -->'
      - name: message
        value: の `src/app.ts` は 12 行で、20〜22 行目がありません。行の範囲を修正してください。
  - name: IncludeCircular
    description: include の取り込みが循環する
    args:
      - name: mark
        value: '<!-- include: a.md -->'
      - name: message
        value: の取り込みが循環しています（`a.md` → `b.md` → `a.md`）。この場所では取り込んでいません。
  - name: CsvColumns
    description: CSV の列の数が見出しの行とそろわない
    args:
      - name: message
        value: CSV の 2 行目・3 行目の列の数が、見出しの行の 3 列と違います。見出しの列の数にそろえて表示しています。
lead: 記法の印や拡張の引数に読めない指定がある箇所に置き、書く人へ読めない指定と直し方を知らせる枠。HTML 文字列を返し、ブラウザと Node で同じ出力になる。
args:
  - name: mark
    type: 文字列
    required: false
    default: '""'
    description: '読めない指定を書いた印の文字（`<!-- table: data closed open -->` など）。本文の頭の `code` に入れる（HTML として特別な文字はエスケープする）。空なら印を出さない'
  - name: message
    type: 文字列
    required: true
    description: 何が読めず、どう直し、どう描いたかの本文。行内のコードにする箇所は `` ` `` で囲む
  - name: items
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 読めない指定が複数あるときの項目（`{ label, message }`）。本文の後の `ul` に、`label` を `code` にして並べる。空なら `ul` を出さない
css_properties:
  - name: --mdmark-color-notice-border
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 枠の破線と題のアイコンの色
  - name: --mdmark-color-text
    syntax: <color>
    default: '#18181b（ダーク #ededef）'
    description: 題と本文の文字の色
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: 枠の角丸
accessibility:
  - 枠は `role="note"` を持ち、題 `書き方の警告` の文言で知らせる（色とアイコンだけに頼らない）
  - 題のアイコンは CSS で付け、読み上げに含めない
  - 印は長くても枠の中で折り返し、横スクロールを出さない
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[書き手の誤り]
  - dev/設計書/インターフェース定義/ライブラリ本体/拡張を登録する.ts#constraints[引数の検査]
status: planned
notes:
  HTML: '`<div class="mdmark-syntax-warning" role="note"><p class="mdmark-syntax-warning-title">書き方の警告</p><p><code>{mark}</code>{message}</p><ul><li><code>{label}</code>: {message}</li></ul></div>`。呼び名は確認ログの決定（書き方を誤った箇所に出す枠の呼び名）。モックは `dev/mock/components/syntax-warning/`'
