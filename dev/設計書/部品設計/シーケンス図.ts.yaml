title: "シーケンス図"
implementation: "src/parts/diagram.ts#renderSequence"
story: "Parts/SequenceDiagram"
states:
  - name: Default
    description: 相手 5 つ・呼び出しと応答のメッセージ・繰り返しの戻り
    notes:
      定義: モックの `inquiry-seq`
  - name: Invalid
    description: 定義を読み込めない。図の代わりに記載の警告を出す
  - name: Fragments
    description: '`loop` の中の `alt` / `else` と `rect`。枠線 1px の枠・左上のタブ・`else` の破線と `[ラベル]` があり、見出しがメッセージのラベルと重ならない'
  - name: NotesAndActivations
    description: '`Note over` の箱と活性化の帯。帯に出入りする線が帯の端で止まり、帯は線より手前に描く'
  - name: Arrows
    description: 全ての矢印の種類と `autonumber`。点線・開いた矢じり・× の印・非同期の矢じり・両向きの矢じりと、線の頭の番号
  - name: TallParticipants
    description: 名前が 2 行の参加者。参加者の箱が高くなり、最初の行が一番高い箱の下から始まる
lead: 相手を定義の順に左から右へ、メッセージを時刻の順に上から下へ並べる。繰り返しの戻りは右の帯を通る破線と戻り先のラベルにする。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: 'シーケンス図の定義（`MdmarkSequenceDefinition`。`participants`・`steps`・`loop`）。`steps` の `reply: true` は応答の線にする。map のシーケンス図が指定する定義は、ほかに `fragments`（`loop`・`alt`・`opt`・`par`・`critical`・`break`・`rect` の枠と区切りの `else`・`and`・`option`）・`notes`（`left of`・`right of`・`over`）・`activations`・`autonumber` と、`steps` の `arrow`（`->`・`-->`・`->>`・`-->>`・`-x`・`--x`・`-)`・`--)`・`<<->>`・`<<-->>`）を持てる'
uses:
  - component: dev/設計書/部品設計/記載の警告.ts#
    how: 定義を読み込めないときに図の代わりに配置する
  - component: dev/設計書/部品設計/用語のツールチップ.ts#
    how: 相手のノードの中の `{{単語}}` の下線と意味
accessibility:
  - 相手のノードの色とアイコンはフロー図のノードの種類と同じ。拡大して下へ動かしても相手の行は表示する枠の上端に留める
  - 呼ぶ線は実線と塗った矢じり、応答の線は破線と開いた矢じりで分ける
status: planned
introduced:
  pr: 42
test_file: tests/integration/lib/sequence-diagram.story.test.ts
