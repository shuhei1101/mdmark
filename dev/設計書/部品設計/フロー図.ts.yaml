id: CMP-472-28
title: "フロー図"
implementation: "src/parts/diagram.ts#renderFlow"
story: "Parts/FlowDiagram"
states:
  - name: Default
    description: 枠と 3 つの層・外部のシステム・5 種の線・線の交差 1 か所・ループの戻り 1 本
    notes:
      定義: モックの `inquiry`（`dev/mock/refs/42/assets/samples.js`）
  - name: LongNames
    description: 長いタイトルとノードの名前。ノードの中で折り返す
    notes:
      定義: モックの `long-names`
  - name: Judgement
    description: 判定フローチャート。開始 1・質問 2・アクション 1・結果 2 のノードと YES / NO のラベルの線を持ち、システムの枠と層を持たない。凡例の種類は開始・質問・アクション・結果だけ
    notes:
      定義: モックの `judgement`
  - name: JudgementLong
    description: 判定フローチャートの長いタイトルと文。ノードの名前は文節ごとに折り返し（Chromium 系。Firefox・Safari では文字ごとに折り返す）、質問の名前は菱形に内接する中央の四角に収める
    notes:
      定義: モックの `judgement-long`
  - name: UnknownKind
    description: 知らない種類のノード。記載の警告の使用できる種類に、追加した 4 種類を含む 10 種類が並ぶ
  - name: Invalid
    description: 定義を読み込めない。図の代わりに記載の警告を出す
  - name: JudgementAuto
    description: 座標を省いた判定フローチャートを配置した結果。開始の下に質問を左の列に並べ、右へ出す線の先を同じ行の右の列に配置する
    notes:
      定義: モックの `judgement-auto`
  - name: LinkedNodes
    description: リンク先を持つノード。名前が本文のリンクと同じ色と下線で、リンク先を持たないノードは今のまま。`io` を持つリンクのノードは右上のマーカーをリンクの上に重ねる
    notes:
      定義: モックの `linked`
  - name: LinkedNodeHoverFocus
    description: リンク先を持つノードのホバー（ノードの地に種類の色をうっすら敷く）とフォーカス（ノードの外側に枠）
    notes:
      定義: モックの `linked`。モックの「リンク先を持つノードのホバーとフォーカス」の場面
  - name: LinkNotAllowed
    description: 許さないリンク先（`javascript:`・`id:`）を持つノード。図の前に記載の警告を配置し、ノードはリンクにしない
    notes:
      定義: モックの「許可しないリンク先」の場面
  - name: GroupHints
    description: システムの枠と LLM の層が `hint` を持つ。タイトルの右にノードと同じ情報のマーカーがあり、`hint` を持たない層には無い。凡例は 2 種類以上あるノードの種類と線の種類だけ
    notes:
      定義: モックの `inquiry-groups`（`dev/mock/refs/308/assets/samples.js`）
  - name: TitlesStuck
    description: 拡大して処理の層の途中を見せた。システムの枠と処理の層のタイトルを表示する枠の上端に、地の色と線の札で留める
    notes:
      定義: モックの `inquiry-groups`
  - name: Styled
    description: '`style` を持つノードと線。種類の行に設定のアイコンと名前があり、形状・色・破線の模様・太さ・矢じりが `style` のとおりで、`style` に名前もアイコンも無いノードは空の種類の行を持つ'
    notes:
      定義: モックの `CONFIG`（`dev/mock/refs/445/assets/samples.js`）
lead: システムの枠と3 つの層、ノードと線を定義の座標に配置する構成図。判定フローチャートは開始・質問・アクション・結果のノードを YES / NO のラベルの線でつなぐ（座標を省いた定義は配置した座標で描く）。リンク先を持つノードは、ノードの全体を覆うリンクにする。線は種類ごとに色と模様の組で描き、横の線が縦の線と交わる点に飛び越えの弧を入れる。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: フロー図の定義（`MdmarkFlowDefinition`。`width`・`height`・`frame`・`lanes`・`nodes`・`wires`）。ノードは `kind`（`llm`・`dm`・`script`・`mcp`・`data`・`external`・`start`・`question`・`action`・`result`）、線は `line`（`flow`・`read`・`write`・`reply`・`loop`）を持つ。ノードはリンク先 `href` を持て、許すリンク先のノードはノードの全体を覆う `a.mdmark-diagram-node-link` を持ち、ノードの要素に class `has-link` が付く。判定フローチャートの 4 つの種類だけの定義は、ノードの `x`・`y`・`w`・`h`、線の `points`、図の `width`・`height` を全て省ける（描く処理が配置してからこの部品に指定する）。`frame` と `lanes` の要素は文字の `hint` を持て、`stickyTitles`（真偽値。既定 `true`）は拡大して動かしたときにグループのタイトルを上端に留めるか。map の構成図が指定する定義では、ノードは `kind` の代わりに `style`（`{ label, icon, shape, color }`。`shape` は `rounded`・`rect`・`pill`・`double`）、線は `line` の代わりに `style`（`{ dash, width, head, color }`）を持てる。`style` を持つノードは種類の行に `icon` と `label` を出し（どちらも無ければ高さ 24px の空の行）、`style` を持つ線は矢じりを線の色で描く
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: ノード・層・凡例の塗りで、ノードの種類の色を混ぜる先の色
  - name: --mdmark-color-diagram-llm
    syntax: <color>
    default: '#6d28d9（ダーク #c4a7ff）'
    description: LLM のノードと LLM の層の色
  - name: --mdmark-color-diagram-dm
    syntax: <color>
    default: '#1d4ed8（ダーク #7aa2ff）'
    description: 意思決定モデルのノードの色
  - name: --mdmark-color-diagram-script
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: スクリプトのノードの色
  - name: --mdmark-color-diagram-mcp
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: MCP のノードと処理の層の色
  - name: --mdmark-color-diagram-data
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: データのノードとデータの層の色
  - name: --mdmark-color-diagram-external
    syntax: <color>
    default: '#15803d（ダーク #4ade80）'
    description: 外部のシステムのノードの色
  - name: --mdmark-color-diagram-start
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: 判定フローチャートの開始のノードの色。全テーマで `--mdmark-color-diagram-script` と同じ値
  - name: --mdmark-color-diagram-question
    syntax: <color>
    default: '#1d4ed8（ダーク #7aa2ff）'
    description: 判定フローチャートの質問のノードの色。全テーマで `--mdmark-color-diagram-dm` と同じ値
  - name: --mdmark-color-diagram-action
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 判定フローチャートのアクションのノードの色。全テーマで `--mdmark-color-diagram-mcp` と同じ値
  - name: --mdmark-color-diagram-result
    syntax: <color>
    default: '#15803d（ダーク #4ade80）'
    description: 判定フローチャートの結果のノードの色。全テーマで `--mdmark-color-diagram-external` と同じ値
  - name: --mdmark-color-diagram-line
    syntax: <color>
    default: '#71717a（ダーク #8f8f99）'
    description: 処理の流れ・戻る線の色
  - name: --mdmark-diagram-lane-tint
    syntax: <percentage>
    default: 8%
    description: 層の背景に敷くノードの色の濃さ
uses:
  - component: CMP-472-62#
    how: 定義を読み込めないときに図の代わりに配置する
  - component: CMP-472-53#
    how: ノードの中の `{{単語}}` の下線と意味
accessibility:
  - ノードの種類は色だけでなく、ノードの左上のアイコンと種類の名前でも示す。データのノードは下の角を丸くし、判定フローチャートの開始は円・質問は菱形・アクションは角の丸くない四角・結果は両端の丸い形状で描く
  - 判定フローチャートのアイコンは開始 = play・質問 = circle-question-mark・アクション = wrench・結果 = flag。判定フローチャートのノードはアイコンと種類の名前の行を中央に配置する
  - 線の種類は色と模様（破線の間隔・太さ・矢じり）の組で分ける
  - ノードと線のラベルの文字は選べ、スクリーンリーダーに出る。線の svg と質問の菱形の svg は `aria-hidden`
  - リンク先を持つノードは、色だけでなく名前の下線でも押せることを示す。リンクのスクリーンリーダー向けの名前はノードの名前で、フォーカスの枠はノードの外側に出す。右上のマーカーはリンクと別にフォーカスでき、Tab の順はリンク、マーカー
  - グループのタイトルのマーカーは図のツールチップの持ち主のボタン。留めたタイトルは地の色を持ち、下のノードと線より手前に描く
status: planned
introduced:
