title: "フロー図"
implementation: "src/parts/diagram.ts#renderFlow"
story: "Parts/FlowDiagram"
states:
  - name: Default
    description: 枠と 3 つの層・外部のシステム・5 種の線・線の交差 1 か所・ループの戻り 1 本
    notes:
      定義: モックの `inquiry`（`dev/mock/refs/42/assets/samples.js`）
  - name: LongNames
    description: 長い題とノードの名前。ノードの中で折り返す
    notes:
      定義: モックの `long-names`
  - name: Judgement
    description: 判定フローチャート。開始 1・質問 2・アクション 1・結果 2 のノードと YES / NO のラベルの線を持ち、システムの枠と層を持たない。凡例の種類は開始・質問・アクション・結果だけ
    notes:
      定義: モックの `judgement`
  - name: JudgementLong
    description: 判定フローチャートの長い題と文。ノードの名前は文節ごとに折り返し（Chromium 系。Firefox・Safari では文字ごとに折り返す）、質問の名前は菱形に内接する中央の四角に収める
    notes:
      定義: モックの `judgement-long`
  - name: UnknownKind
    description: 知らない種類のノード。書き方の警告の使える種類に、追加した 4 種類を含む 10 種類が並ぶ
  - name: Invalid
    description: 定義を読めない。図の代わりに書き方の警告を出す
  - name: JudgementAuto
    description: 座標を省いた判定フローチャートを配置した結果。開始の下に質問を左の列に並べ、右へ出す線の先を同じ行の右の列に置く
    notes:
      定義: モックの `judgement-auto`
  - name: LinkedNodes
    description: リンク先を持つノード。名前が本文のリンクと同じ色と下線で、リンク先を持たないノードは今のまま。`io` を持つリンクのノードは右上の印をリンクの上に重ねる
    notes:
      定義: モックの `linked`
  - name: LinkedNodeHoverFocus
    description: リンク先を持つノードのホバー（ノードの地に種類の色をうっすら敷く）とフォーカス（ノードの外側に枠）
    notes:
      定義: モックの `linked`。モックの「リンク先を持つノードのホバーとフォーカス」の場面
  - name: LinkNotAllowed
    description: 許さないリンク先（`javascript:`・`id:`）を持つノード。図の前に書き方の警告を置き、ノードはリンクにしない
    notes:
      定義: モックの「許可しないリンク先」の場面
lead: システムの枠と3 つの層、ノードと線を定義の座標に置く構成図。判定フローチャートは開始・質問・アクション・結果のノードを YES / NO のラベルの線でつなぐ（座標を省いた定義は配置した座標で描く）。リンク先を持つノードは、ノードの全体を覆うリンクにする。線は種類ごとに色と模様の組で描き、横の線が縦の線と交わる点に飛び越えの弧を入れる。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: フロー図の定義（`MdmarkFlowDefinition`。`width`・`height`・`frame`・`lanes`・`nodes`・`wires`）。ノードは `kind`（`llm`・`dm`・`script`・`mcp`・`data`・`external`・`start`・`question`・`action`・`result`）、線は `line`（`flow`・`read`・`write`・`reply`・`loop`）を持つ。ノードはリンク先 `href` を持て、許すリンク先のノードはノードの全体を覆う `a.mdmark-diagram-node-link` を持ち、ノードの要素に class `has-link` が付く。判定フローチャートの 4 つの種類だけの定義は、ノードの `x`・`y`・`w`・`h`、線の `points`、図の `width`・`height` を全て省ける（描く処理が配置してからこの部品に渡す）
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: ノード・層・凡例の塗りで、ノードの種類の色を混ぜる先の色
  - name: --mdmark-color-diagram-llm
    syntax: <color>
    default: '#6d28d9（ダーク #c4a7ff）'
    description: LLM のノードと LLM の層の色
  - name: --mdmark-color-diagram-dm
    syntax: <color>
    default: '#1d4ed8（ダーク #7aa2ff）'
    description: 意思決定モデルのノードの色
  - name: --mdmark-color-diagram-script
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: スクリプトのノードの色
  - name: --mdmark-color-diagram-mcp
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: MCP のノードと処理の層の色
  - name: --mdmark-color-diagram-data
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: データのノードとデータの層の色
  - name: --mdmark-color-diagram-external
    syntax: <color>
    default: '#15803d（ダーク #4ade80）'
    description: 外部のシステムのノードの色
  - name: --mdmark-color-diagram-start
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: 判定フローチャートの開始のノードの色。全テーマで `--mdmark-color-diagram-script` と同じ値
  - name: --mdmark-color-diagram-question
    syntax: <color>
    default: '#1d4ed8（ダーク #7aa2ff）'
    description: 判定フローチャートの質問のノードの色。全テーマで `--mdmark-color-diagram-dm` と同じ値
  - name: --mdmark-color-diagram-action
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 判定フローチャートのアクションのノードの色。全テーマで `--mdmark-color-diagram-mcp` と同じ値
  - name: --mdmark-color-diagram-result
    syntax: <color>
    default: '#15803d（ダーク #4ade80）'
    description: 判定フローチャートの結果のノードの色。全テーマで `--mdmark-color-diagram-external` と同じ値
  - name: --mdmark-color-diagram-line
    syntax: <color>
    default: '#71717a（ダーク #8f8f99）'
    description: 処理の流れ・戻る線の色
  - name: --mdmark-diagram-lane-tint
    syntax: <percentage>
    default: 8%
    description: 層の背景に敷くノードの色の濃さ
uses:
  - component: dev/設計書/部品設計/書き方の警告.ts#
    how: 定義を読めないときに図の代わりに置く
  - component: dev/設計書/部品設計/用語のツールチップ.ts#
    how: ノードの中の `{{語}}` の下線と意味
accessibility:
  - ノードの種類は色だけでなく、ノードの左上のアイコンと種類の名前でも示す。データのノードは下の角を丸くし、判定フローチャートの開始は円・質問は菱形・アクションは角の丸くない四角・結果は両端の丸い形で描く
  - 判定フローチャートのアイコンは開始 = play・質問 = circle-question-mark・アクション = wrench・結果 = flag。判定フローチャートのノードはアイコンと種類の名前の行を中央に置く
  - 線の種類は色と模様（破線の間隔・太さ・矢じり）の組で分ける
  - ノードと線のラベルの文字は選べ、読み上げに出る。線の svg と質問の菱形の svg は `aria-hidden`
  - リンク先を持つノードは、色だけでなく名前の下線でも押せることを示す。リンクの読み上げの名前はノードの名前で、フォーカスの枠はノードの外側に出す。右上の印はリンクと別にフォーカスでき、Tab の順はリンク、印
status: planned
introduced:
  pr: 42
test_file: tests/integration/lib/flow-diagram.story.test.ts
