  - name: ColumnsMenuOpen
    description: 列の表示のメニューを開いた。名前は `disabled` で `先頭の列は隠せません` と「既定に戻す」を出す
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","columns"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: hide
        value: '[1]'
      - name: hiddenColumns
        value: '[2]'
      - name: openColumns
        value: 'true'
  - name: Totals
