  - name: TotalsFiltered
    description: 名前を `りんご` で絞り込んだ集計の行（`個数 2`・`合計 43`・`平均 200`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","-","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":0,"text":"りんご"}]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: TotalsEmpty
    description: 一致する行が無い集計の行（`個数 0`・`合計 0`・`平均 —`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","-","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":0,"text":"存在しない"}]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: Copied
