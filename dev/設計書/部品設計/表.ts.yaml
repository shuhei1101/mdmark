        value: '1'
  - name: AllFeatures
    description: 5 つの機能を全て付けた表（`hide=説明`・`total=数量:sum`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count","columns","total","copy","rowlink"]'
      - name: columns
        value: '["名前","説明","数量"]'
      - name: rows
        value: '[["なつめ","描画を速くする","12"],["かりん","印刷を直す","8"],["ざくろ","描画の崩れを直す","5"]]'
      - name: hide
        value: '[1]'
      - name: totals
        value: '[{"column":2,"calc":"sum"}]'
      - name: rowIds
        value: '["なつめ","かりん","ざくろ"]'
lead: Markdown の表を囲み、種類と `+機能`・`-機能` で決まった並べ替え・ピン止め・絞り込みのボタンと、絞り込みのドロワーを付ける。見出し行は面の色で分け、表の中で縦にスクロールしても上端に留める。
args:
  - name: kind
    type: 列挙
    required: false
    default: default
    choices: '`default`（ピン止め）・`data`（並べ替え・ピン止め・絞り込み）・`plain`（機能なし。縦の罫線と面を外す）'
    description: 表の種類。`data-kind` に入れる
  - name: features
    type: 配列
    required: true
    description: 付ける機能（`sort`・`pin`・`filter`・`count`・`columns`・`total`・`copy`・`rowlink` のうち）。種類の機能に `+機能`・`-機能` を当てたもの。`data-features` に空白で結んで入れる
  - name: columns
    type: 配列
    required: true
    description: 列の見出しの HTML
  - name: rows
    type: 配列
    required: true
    description: 行ごとのセルの HTML の配列
  - name: filters
    type: オブジェクトの配列
    required: false
    default: '[]'
    enabled_when: '`features` に `filter` を含むとき'
    description: 絞り込みを付ける列（`{ column, kind }`。`kind` は `select`・`text`・`date`）。この列の見出しにだけ絞り込みのボタンとドロワーを置く
  - name: collapse
    type: 列挙
    required: false
    default: none
    choices: '`none`・`closed`・`open`'
    description: 表を折り畳みに入れるかと、既定の開閉
  - name: sort
    type: オブジェクト
    required: false
    default: なし（元の並び）
    enabled_when: '`features` に `sort` を含むとき'
    description: 並べ替えた列と向き（`{ column, direction }`。`direction` は `ascending`・`descending`）
  - name: overflow
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`features` に `pin` を含むとき'
    description: 表が幅からはみ出しているか。`true` のときだけピン止めのボタンを出す（`mount` が幅を測って決める）
  - name: pinned
    type: 整数
    required: false
    default: '0'
    enabled_when: '`overflow` が `true` のとき'
    description: 左端に留める列の数（0 は留めない）
  - name: openFilter
    type: 整数
    required: false
    default: なし（ドロワーを閉じる）
    description: 開いた絞り込みのドロワーの列の位置
  - name: filterValues
    type: オブジェクトの配列
    required: false
    default: '[]'
    description: 当てている絞り込み（`{ column, values }`・`{ column, text }`・`{ column, from, to }`）。当てた列のボタンを絞り込み中の見た目にし、合わない行に `hidden` を付ける。全ての行が合わないときは `一致する行がありません` の行を出す
  - name: hide
    type: 配列
    required: false
    default: '[]'
    enabled_when: '`features` に `columns` を含むとき'
    description: 既定で隠す列の位置（`data-hide`）。先頭の列（0）は含まない。「既定に戻す」はこの状態に戻す
  - name: hiddenColumns
    type: 配列
    required: false
    default: '`hide` と同じ'
    enabled_when: '`features` に `columns` を含むとき'
    description: 今隠している列の位置。この列の見出し・セル・集計のセルに `hidden` を付け、列の表示のメニューのチェックを外す
  - name: openColumns
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`features` に `columns` を含むとき'
    description: 列の表示のメニューを開いているか
  - name: totals
    type: オブジェクトの配列
    required: false
    default: '[]'
    enabled_when: '`features` に `total` を含むとき'
    description: 集計する列（`{ column, calc }`。`calc` は `sum`・`avg`・`count`）。空でなければ `tfoot` に集計の行を置き、`filterValues` に合う行で計算した値を題 `合計`・`平均`・`個数` と一緒に出す
  - name: copyState
    type: 列挙
    required: false
    default: idle
    choices: '`idle`（`表をコピー`）・`copied`（`コピーしました`）・`failed`（`コピーできませんでした`）'
    enabled_when: '`features` に `copy` を含むとき'
    description: コピーのボタンの状態。ボタンの `data-state` と文言・アイコン（`copy`・`check`・`circle-alert`）を切り替える
  - name: rowIds
    type: 配列
    required: false
    default: '[]'
    enabled_when: '`features` に `rowlink` を含むとき'
    description: 本文の行ごとの `id`。行に `id` を付け、先頭のセルに `#{id}` への行へのリンク（`link` のアイコン）を置く
  - name: targetRow
    type: 整数
    required: false
    default: なし（強調しない）
    enabled_when: '`features` に `rowlink` を含むとき'
    description: URL の `#ID` が指す行の位置。その行に `data-target` を付けて強調し、行へのリンクの印を出す
events:
  - name: 並べ替える
    when: 列の見出しのボタンを押す
    value: 列の `th` の `aria-sort`
    description: '`mount` が昇順 → 降順 → 元の並びの順に行を並べ替える'
  - name: ピン止めする
    when: 列のピン止めのボタンを押す
    value: ボタンの `aria-pressed`
    description: '`mount` が押した列までを左端に留める。押し直すと外す'
  - name: 絞り込む
    when: 絞り込みのボタンでドロワーを開き、値を選ぶか入れる。「絞り込みを外す」で戻す
    value: ボタンの `aria-expanded` と、ドロワーの入力欄の値
    description: '`mount` が列ごとの絞り込みを重ねて行に当てる'
  - name: 列の表示を切り替える
    when: 列の表示のメニューのチェックボックスを入れる・外す
    value: チェックボックスの `value`（列の位置）と `checked`
    description: '`mount` がその列の見出し・セル・集計のセルの `hidden` を切り替える'
  - name: 既定に戻す
    when: 列の表示のメニューの「既定に戻す」を押す
    value: 表の `data-hide`
    description: '`mount` が `data-hide` の列だけを隠した状態に戻す'
  - name: 表をコピーする
    when: '`表をコピー` のボタンを押す'
    value: ボタンの `data-state`
    description: '`mount` が表示している行と列を TSV でクリップボードへ写し、結果を `data-state` と読み上げで知らせる'
  - name: 行へ移る
    when: URL の `#ID` が行の `id` を指す（描いたときと `hashchange`）
    value: 行の `id`
    description: '`mount` が閉じた表・節を開き、絞り込みで隠れていれば外してから行へ移り、その行に `data-target` を付ける'
css_properties:
  - name: --mdmark-color-table-head
    syntax: <color>
    default: '#e6ebf0（ダーク #262c36）'
    description: 見出し行の地の色
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f6f8fa（ダーク #151b23）'
    description: 本文の行の地の色（面）
  - name: --mdmark-table-max-height
    syntax: <length>
    default: 28rem
    description: 表の高さの上限。超える表は表の中で縦にスクロールし、見出し行を上端に留める
  - name: --mdmark-table-rule-inline
    syntax: <length>
    default: 1px
    description: 縦の罫線の太さ（`plain` は 0）
accessibility:
  - 並べ替えのボタンは列名を読み上げの名前にし、並べた列の `th` は `aria-sort` で向きを示す
  - 絞り込みのボタンは `「{列名}」で絞り込む` を読み上げの名前に持ち、`aria-expanded`・`aria-controls` でドロワーの開閉を示す。絞り込み中は地・線・塗ったアイコンで示し、色だけに頼らない
  - ドロワーは開いたら最初の入力欄へフォーカスを移し、Esc で閉じてボタンへフォーカスを戻す
  - ピン止めのボタンは `「{列名}」の列までピン止め` を読み上げの名前に持ち、`aria-pressed` で状態を示す
  - 表は `tabindex="0"` で、キーボードで縦横にスクロールできる
  - 件数は `aria-live="polite"` で書き換えを知らせ、読み上げには `{全ての行の数} 件中 {表示している行の数} 件を表示` を渡す
  - 列の表示のメニューは絞り込みのドロワーと同じ開閉の作法（`aria-expanded`・`aria-controls`、開いたら最初の入力欄へフォーカス、Esc で閉じてボタンへ戻す）。押せない先頭の列のチェックボックスは、理由をメニューの中に出す
  - コピーの結果は `role="status"` の要素で読み上げ、写せなかった知らせは自動で消さない
  - 行へのリンクは `「{先頭のセルの文字}」の行へのリンク` を読み上げの名前に持ち、フォーカスしたときは印を出す。指せない端末では印を常に薄く出す
