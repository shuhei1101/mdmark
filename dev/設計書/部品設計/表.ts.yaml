status: planned
notes:
  HTML: '`<div class="mdmark-table" data-kind="{kind}" data-features="{features}"><table tabindex="0" aria-label="…"><thead><tr><th><span class="mdmark-th"><button class="mdmark-sort" type="button">{列名}</button><span class="mdmark-th-tools"><button class="mdmark-filter" type="button" aria-expanded="false" aria-controls="…"></button><button class="mdmark-pin" type="button" aria-pressed="false"></button></span></span></th></tr></thead><tbody>…<tr class="mdmark-table-empty" hidden><td colspan="…">一致する行がありません</td></tr></tbody></table><div class="mdmark-filter-drawer" role="dialog" hidden>…</div></div>`。`collapse` が `closed`・`open` のときは表を `<details class="mdmark-table-details"><summary>表を開く</summary>` に入れる。ドロワーは `select` が「候補を検索」の欄・チェックボックス・`一致する候補がありません`、`text` が「含む文字」の欄、`date` が「開始日」「終了日」の欄で、どれも題 `「{列名}」で絞り込む` と「絞り込みを外す」を持つ。表の見た目は確認ログの決定（拡張記法のモック・直した表のモック）。モックは `dev/mock/components/table/`。`count`・`columns`・`copy` の表は `<table>` の前に `<div class="mdmark-table-bar"><p class="mdmark-table-count" aria-live="polite">…</p><div class="mdmark-table-tools"><button class="mdmark-table-tool mdmark-columns-toggle" aria-expanded aria-controls>列の表示</button><button class="mdmark-table-tool mdmark-copy" data-state="idle">表をコピー</button></div><span class="mdmark-copy-status" role="status"></span></div>` を置き、`<table>` の後ろに `<div class="mdmark-columns-menu" role="dialog" hidden>`（`mdmark-columns-title`・`mdmark-columns-options` のチェックボックス・`mdmark-columns-note`・`mdmark-columns-reset`）を置く。集計の行は `<tfoot><tr class="mdmark-table-total">` で、集計する列のセルが `data-total="{計算}"` を持つ。行へのリンクは `<tr id>` の先頭のセルの `<span class="mdmark-row-link-cell">{中身}<a class="mdmark-row-anchor" href="#{ID}">` で、強調する行は `data-target` を持つ。アイコンは全て lucide（`columns-3`・`copy`・`check`・`circle-alert`・`link`）。印刷では帯のボタンと行へのリンクの印を出さない'
