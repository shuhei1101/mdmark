    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","copy"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"]]'
      - name: copyState
        value: failed
  - name: RowLinkTarget
    description: 行へのリンクを持ち、`#みかん` が指す 2 行目を強調した
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","rowlink"]'
      - name: columns
        value: '["名前","説明","更新日"]'
