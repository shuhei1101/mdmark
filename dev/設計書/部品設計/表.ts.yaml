      - name: openFilter
        value: '0'
  - name: FilterTextOpen
    description: 文字で絞るドロワーを開いて `描画` を入れた
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"},{"column":1,"kind":"text"},{"column":2,"kind":"date"}]'
      - name: openFilter
        value: '1'
      - name: filterValues
        value: '[{"column":1,"text":"描画"}]'
  - name: FilterDateOpen
    description: 日付で絞るドロワーを開いた（開始日と終了日を縦に並べる）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"},{"column":1,"kind":"text"},{"column":2,"kind":"date"}]'
      - name: openFilter
        value: '2'
  - name: Filtered
    description: 名前の列を `りんご` で絞ってドロワーを閉じた。ボタンが絞り込み中の見た目
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"}]'
      - name: filterValues
        value: '[{"column":0,"values":["りんご"]}]'
  - name: NoMatch
