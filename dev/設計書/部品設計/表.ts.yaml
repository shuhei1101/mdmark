title: "表"
implementation: "src/parts/table.ts#renderTable"
story: "Parts/Table"
test_file: tests/integration/lib/table.story.test.ts
states:
  - name: Data
    description: data の種類。並べていない（元の並び）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["記法","機能名","増分（KB）"]'
      - name: rows
        value: '[["表の操作","table","6.2"],["注意書き","callout","1.4"],["タブ","tabs","2.1"]]'
  - name: SortedAscending
    description: 増分の列で昇順に並べた
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["記法","機能名","増分（KB）"]'
      - name: rows
        value: '[["表の操作","table","6.2"],["注意書き","callout","1.4"],["タブ","tabs","2.1"]]'
      - name: sort
        value: '{"column":2,"direction":"ascending"}'
  - name: SortedDescending
    description: 増分の列で降順に並べた
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["記法","機能名","増分（KB）"]'
      - name: rows
        value: '[["表の操作","table","6.2"],["注意書き","callout","1.4"],["タブ","tabs","2.1"]]'
      - name: sort
        value: '{"column":2,"direction":"descending"}'
  - name: FilterSelectOpen
    description: 値を選ぶドロワーを開いた（候補の検索欄とチェックボックス）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"},{"column":1,"kind":"text"},{"column":2,"kind":"date"}]'
      - name: openFilter
        value: '0'
  - name: FilterTextOpen
    description: 文字で絞るドロワーを開いて `描画` を入れた
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"},{"column":1,"kind":"text"},{"column":2,"kind":"date"}]'
      - name: openFilter
        value: '1'
      - name: filterValues
        value: '[{"column":1,"text":"描画"}]'
  - name: FilterDateOpen
    description: 日付で絞るドロワーを開いた（開始日と終了日を縦に並べる）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"},{"column":1,"kind":"text"},{"column":2,"kind":"date"}]'
      - name: openFilter
        value: '2'
  - name: Filtered
    description: 名前の列を `りんご` で絞ってドロワーを閉じた。ボタンが絞り込み中の見た目
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"}]'
      - name: filterValues
        value: '[{"column":0,"values":["りんご"]}]'
  - name: NoMatch
    description: 絞り込みに一致する行が無い。`一致する行がありません` の行を出す
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","説明"]'
      - name: rows
        value: '[["りんご","描画を速くする"],["みかん","印刷を直す"]]'
      - name: filters
        value: '[{"column":1,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":1,"text":"存在しない"}]'
  - name: DefaultOverflow
    description: 既定の種類で幅からはみ出す表。各列にピン止めのボタンが出て、先頭の列を既定で留め、見出し行が上端に留まる
    args:
      - name: features
        value: '["pin"]'
      - name: columns
        value: '["文書","行数","表","図","Chrome","Edge","Firefox","Safari","iOS Safari","Android Chrome"]'
      - name: rows
        value: '[["導入の手順","128","8","0","18","17","23","16","15","16"]]'
      - name: overflow
        value: 'true'
      - name: pinned
        value: '1'
  - name: Pinned
    description: 2 列目までピン止めした。留めた最後の列の右に境目の線がある
    args:
      - name: features
        value: '["pin"]'
      - name: columns
        value: '["文書","行数","表","図","Chrome","Edge","Firefox","Safari","iOS Safari","Android Chrome"]'
      - name: rows
        value: '[["導入の手順","128","8","0","18","17","23","16","15","16"]]'
      - name: overflow
        value: 'true'
      - name: pinned
        value: '2'
  - name: DefaultFits
    description: 既定の種類で幅に収まる表。ピン止めのボタンを出さない
    args:
      - name: features
        value: '["pin"]'
      - name: columns
        value: '["用語","意味"]'
      - name: rows
        value: '[["印","HTML コメントで書く目印"]]'
  - name: NoPin
    description: '`-pin` ではみ出す表。ピン止めのボタンを出さず、どの列も留めない'
    args:
      - name: features
        value: '[]'
      - name: columns
        value: '["文書","行数","表","図","Chrome","Edge","Firefox","Safari","iOS Safari","Android Chrome"]'
      - name: rows
        value: '[["導入の手順","128","8","0","18","17","23","16","15","16"]]'
      - name: overflow
        value: 'true'
  - name: PinAndWide
    description: '`pin=担当 wide=概要`。担当の列までを留め、概要の列を折り返さずに広く取る'
    args:
      - name: features
        value: '["pin"]'
      - name: columns
        value: '["ID","担当","概要","状態","期限"]'
      - name: rows
        value: '[["#245","表","はみ出す表で先頭の列を既定でピン止めし、pin= と wide= と check= を使えるようにする","未着手","2026-11-21"],["#249","コード","tree を除く全てのコードブロックでインデントによる畳む・開くと縦線を付ける","未着手","2026-11-28"]]'
      - name: overflow
        value: 'true'
      - name: pin
        value: '1'
      - name: pinned
        value: '2'
      - name: wide
        value: '[2]'
  - name: Check
    description: '`check=必須`。必須の列の `true` を ✓、`false` を空欄で出し、既定の列は文字のまま'
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["キー","型","必須","既定"]'
      - name: rows
        value: '[["version","string","true","-"],["features","object","false","全てオン"],["libraries","object","false","jsDelivr"],["build","array","true","-"]]'
      - name: check
        value: '[2]'
  - name: Plain
    description: plain の種類。機能を付けず、縦の罫線と面を外す
    args:
      - name: kind
        value: plain
      - name: features
        value: '[]'
      - name: columns
        value: '["用語","意味"]'
      - name: rows
        value: '[["印","HTML コメントで書く目印"],["書き方の警告","読めない指定を知らせる枠"]]'
  - name: Closed
    description: 閉じた表（`closed`）。見出し `表（1 行）` だけが見える
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["版","日付","変更"]'
      - name: rows
        value: '[["v0.1.0","2026-10-10","文書を描く土台を入れた"]]'
      - name: collapse
        value: closed
  - name: LongCells
    description: 長い列名と値。セルの中で折り返し、見出しのボタンが文字に重ならない
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["とても長い列の名前で見出しの幅を超えるもの","値"]'
      - name: rows
        value: '[["とても長い値でセルの幅を超えて折り返すときの見え方を確かめる","1"]]'
      - name: filters
        value: '[{"column":0,"kind":"select"}]'
  - name: Count
    description: 件数を出した表（`3 / 3 件`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":1,"kind":"text"}]'
  - name: CountFiltered
    description: 説明を `描画` で絞り込んだ。件数が `2 / 3 件`
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: filters
        value: '[{"column":1,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":1,"text":"描画"}]'
  - name: ColumnsHidden
    description: '`hide=説明` で説明の列を隠した。帯にテーブル設定のアイコンだけのボタンと、隠した列の数 `1` のバッジ'
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","columns"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: hide
        value: '[1]'
  - name: ColumnsMenuOpen
    description: テーブル設定のパネル（題 `表示と並び順`）を開いた。各行に目のアイコンがあり、名前の目のアイコンは `disabled` で、案内に `先頭の列は隠せません` を出す
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","columns"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: hide
        value: '[1]'
      - name: hiddenColumns
        value: '[2]'
      - name: openColumns
        value: 'true'
  - name: Totals
    description: 計算ごとの集計の行（`合計 45`・`平均 250`・`件数 4` の順に 1 行ずつ。数量の空のセルは合計から除く）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: TotalsFiltered
    description: 名前を `りんご` で絞り込んだ集計の行（`合計 43`・`平均 200`・`件数 2`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":0,"text":"りんご"}]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: TotalsEmpty
    description: 一致する行が無い集計の行（`合計 0`・`平均 —`・`件数 0`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: filterValues
        value: '[{"column":0,"text":"存在しない"}]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: Copied
    description: コピーした（`コピーしました`、`check` のアイコン）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","copy"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"]]'
      - name: copyState
        value: copied
  - name: CopyFailed
    description: コピーできなかった（`コピーできませんでした`、`circle-alert` のアイコン）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","copy"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"]]'
      - name: copyState
        value: failed
  - name: RowLinkTarget
    description: 行へのリンクを持ち、`#みかん` が指す 2 行目を強調した
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","rowlink"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: rowIds
        value: '["りんご","みかん","りんご飴"]'
      - name: targetRow
        value: '1'
  - name: AllFeatures
    description: 5 つの機能を全て付けた表（`hide=説明`・`total=数量:sum`）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","count","columns","total","copy","rowlink"]'
      - name: columns
        value: '["名前","説明","数量"]'
      - name: rows
        value: '[["なつめ","描画を速くする","12"],["かりん","印刷を直す","8"],["ざくろ","描画の崩れを直す","5"]]'
      - name: hide
        value: '[1]'
      - name: totals
        value: '[{"column":2,"calc":"sum"}]'
      - name: rowIds
        value: '["なつめ","かりん","ざくろ"]'
  - name: TotalsUnreadable
    description: 数量の列に数として読めないセル（`-`・`約 3`）がある。合計の行の数量のセルは空で、平均の行の単価のセルは `250`
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","約 3","200"],["りんご飴","33","300"],["ぶどう","-","400"]]'
      - name: filters
        value: '[{"column":0,"kind":"text"}]'
      - name: totals
        value: '[{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
  - name: TotalsMenuOpen
    description: 集計のメニュー（`表示する集計`）を開いた。`合計`・`平均`・`件数` のチェックボックスに全てチェックが入っている
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","","400"]]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
      - name: openTotals
        value: 'true'
  - name: TotalsHidden
    description: 集計のメニューで `平均` と `件数` のチェックを外した。`合計` の行だけを出し、`集計` のボタンが隠している見た目
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","total"]'
      - name: columns
        value: '["名前","数量","単価"]'
      - name: rows
        value: '[["りんご","10","100"],["みかん","2","200"],["りんご飴","33","300"],["ぶどう","","400"]]'
      - name: totals
        value: '[{"column":0,"calc":"count"},{"column":1,"calc":"sum"},{"column":2,"calc":"avg"}]'
      - name: shownTotals
        value: '["sum"]'
  - name: CopyMenuOpen
    description: コピーの形式のメニューを開いた。`Markdown の表`（文書に貼るとそのまま表になる）と `TSV`（表計算ソフトに貼るとセルに分かれる）
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","copy"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"]]'
      - name: openCopy
        value: 'true'
  - name: CopyFallback
    description: クリップボードに書けず、手動でコピーするパネルを出した。`表をコピー` は `コピーできませんでした`
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","copy"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"]]'
      - name: copyState
        value: failed
      - name: copyFallback
        value: '{"format":"markdown","text":"| 名前 | 説明 | 更新日 |\n| --- | --- | --- |\n| りんご | 描画を速くする | 2026-10-01 |\n| みかん | 印刷を直す | 2026-10-10 |"}'
  - name: RowLinkCopied
    description: 2 行目の行へのリンクの印を押し、URL をコピーした。印の横に `リンクをコピーしました`
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","rowlink"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: rowIds
        value: '["りんご","みかん","りんご飴"]'
      - name: targetRow
        value: '1'
      - name: rowLinkNotice
        value: copied
  - name: RowLinkFailed
    description: 2 行目の行へのリンクの印を押し、URL をコピーできなかった。印の横に `リンクをコピーできませんでした`
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter","rowlink"]'
      - name: columns
        value: '["名前","説明","更新日"]'
      - name: rows
        value: '[["りんご","描画を速くする","2026-10-01"],["みかん","印刷を直す","2026-10-10"],["りんご飴","描画の崩れを直す","2026-10-20"]]'
      - name: rowIds
        value: '["りんご","みかん","りんご飴"]'
      - name: targetRow
        value: '1'
      - name: rowLinkNotice
        value: failed
  - name: Folded
    description: 最終列（説明）を畳んだ。説明の列は出さず、各行の先頭のセルに開閉のボタンが付く
    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["名前","更新日","説明"]'
      - name: rows
