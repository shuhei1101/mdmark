    args:
      - name: kind
        value: data
      - name: features
        value: '["sort","pin","filter"]'
      - name: columns
        value: '["記法","機能名","増分（KB）"]'
      - name: rows
        value: '[["表の操作","table","6.2"],["注意書き","callout","1.4"],["タブ","tabs","2.1"]]'
      - name: sort
