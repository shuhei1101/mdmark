title: "タブ"
implementation: "src/parts/tabs.ts#renderTabs"
story: "Parts/Tabs"
test_file: tests/integration/lib/tabs.story.test.ts
states:
  - name: First
    description: 1 つ目のタブを選んだ
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '0'
  - name: Second
    description: 2 つ目のタブを選んだ
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '1'
  - name: Many
    description: タブが多く、タブ名が長い。タブの並びが折り返す
    args:
      - name: titles
        value: '["macOS","Windows","Linux","FreeBSD","とても長いタブ名で並びの幅を超えるもの","Android","iOS"]'
      - name: selected
        value: '0'
  - name: Unmounted
    description: '`render` が出した状態。全ての中身がタブ名を題にして縦に並ぶ（印刷もこの見え方）'
    args:
      - name: titles
        value: '["macOS","Windows"]'
  - name: Grouped
    description: 組 `os` を持ち、1 つ目のタブを選んだ。見た目は First と同じで、`data-group` を持つ
    screenshot: false
    args:
      - name: titles
        value: '["macOS","Windows","Linux"]'
      - name: selected
        value: '0'
      - name: group
        value: os
lead: '`<!-- tabs -->` の範囲を見出しで区切った中身を、見出しの文字をタブ名にしたタブで切り替えて見せる。`render` は全ての中身を順に出し、`mount` がタブの並びを付ける。'
args:
  - name: titles
    type: 配列
    required: true
    description: タブ名（区切りの見出しの文字）を並んだ順に
  - name: selected
    type: 整数
    required: false
    default: なし（タブの並びを付けず、全ての中身を順に出す）
    description: 選んだタブの位置（0 から）。渡すと `role="tablist"` の並びを付け、選んだタブの中身だけを出す（`mount` が付けた状態）
  - name: group
    type: 文字列
    required: false
    default: なし（組を持たず、他のタブと揃えない）
    description: タブの組の名前。渡すと `mdmark-tabs` に `data-group` を付ける。同じ組のタブの選択を揃え、選んだタブ名を覚えるのは `mount` の操作
slots:
  - name: default
    description: タブごとの中身（区切りの見出しから次の見出しの前までの HTML）
    passes: タブの位置
events:
  - name: タブを選ぶ
    when: タブを押すか、タブにフォーカスがあるときに左右の矢印・Home・End を押す
    value: 選んだタブの `aria-selected`
    description: '`mount` が選んだタブの中身だけを出し、ほかを `hidden` にする。`data-group` を持つときは、ページの同じ `data-group` で同じタブ名を持つ `mdmark-tabs` もそのタブ名へ切り替え、タブ名を localStorage に残す'
css_properties:
  - name: --mdmark-color-border
    syntax: <color>
    default: '#d1d9e0（ダーク #3d444d）'
    description: 選んだタブを囲む線と、中身の枠の線の色
  - name: --mdmark-color-bg
    syntax: <color>
    default: '#ffffff（ダーク #0d1117）'
    description: 選んだタブと中身の地の色
  - name: --mdmark-color-heading
    syntax: <color>
    default: '#1f2328（ダーク #f0f6fc）'
    description: 選んだタブの文字の色
accessibility:
  - WAI-ARIA のタブの作法に従う。並びは `role="tablist"`、タブは `role="tab"` と `aria-selected`・`aria-controls`、中身は `role="tabpanel"` と `aria-labelledby`
  - 選んだタブだけが `tabindex="0"`、ほかは `-1`。左右の矢印・Home・End で移って選ぶ
  - 選んだタブは線で囲んで中身の地とつなぎ、形と地の色でも示し、色だけに頼らない
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[タブ]
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[タブの操作]
status: planned
notes:
  HTML: '`render` は `<div class="mdmark-tabs"><div class="mdmark-tab-panel"><p class="mdmark-tab-title">{タブ名}</p>{中身}</div>…</div>` を出し、`group` を渡すと外側の `div` に `data-group="{group}"` を付ける。`selected` を渡すと頭に `<div class="mdmark-tablist" role="tablist"><button class="mdmark-tab" type="button" role="tab">{タブ名}</button>…</div>` を置き、中身を `role="tabpanel"` にして選んだもの以外に `hidden` を付ける。モックは `dev/mock/components/tabs/`'
