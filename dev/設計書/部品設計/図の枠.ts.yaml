title: "図の枠"
implementation: "src/parts/diagram.ts#renderDiagramFrame"
story: "Parts/DiagramFrame"
states:
  - name: Fit
    description: 開いたとき。全体が収まる倍率で、縮小は押せず（倍率のボタンは押せるが何も変わらない）、移動のボタンを出さない
    notes:
      定義: モックの `inquiry`（`dev/mock/refs/42/assets/samples.js`）
  - name: Zoomed
    description: 1 段拡大して位置を動かした。移動のボタンが出る
    args:
      - name: zoom
        value: '1.25'
  - name: Max
    description: 上限の 300%。拡大は押せない
    args:
      - name: zoom
        value: '3'
  - name: Narrow
    description: 狭い枠。ボタンの帯と凡例を折り返す
    args:
      - name: zoom
        value: '0.6'
  - name: Fullscreen
    description: 全画面のモーダルの中。全画面のボタンの位置に閉じるボタンがある
    args:
      - name: modal
        value: 'true'
  - name: InFramedSurface
    description: '使う側の枠を持つ面の中。面で `--mdmark-diagram-box-shadow: none` を指定し、表示する箱の線が無い'
    notes:
      定義: 'ストーリーは図の枠を線と影を持つ面の要素で包み、面に `--mdmark-diagram-box-shadow: none` を指定する'
  - name: InFramedSurfaceFullscreen
    description: '枠を持つ面の中の図を全画面で開いたとき。面に指定した `--mdmark-diagram-box-shadow: none` を受け継がず、モーダルの中の表示する箱に既定の線がある'
    args:
      - name: modal
        value: 'true'
    notes:
      定義: '`InFramedSurface` と同じ面で包む'
lead: |-
  図の部品（フロー図・シーケンス図・グラフ）を囲む枠。題（題名・範囲・更新日）・右上のボタンの帯・図を出す表示する枠・凡例をこの順に置き、拡大・縮小・移動・全画面のモーダルを持つ。
  右上のボタンの帯と表示する枠は、表示する箱（`.mdmark-diagram-box`）にまとめる。
args:
  - name: kind
    type: 列挙
    required: true
    choices: '`flow`・`sequence`・`chart`'
    description: 中の図の種類。`data-diagram` に入れる
  - name: title
    type: 文字列
    required: true
    description: 図の題名
  - name: scope
    type: 文字列
    required: true
    description: '図の範囲。題の後ろに `範囲: {scope}` で出す'
  - name: updated
    type: 文字列
    required: true
    description: 更新日（`YYYY-MM-DD`）。`time` 要素で出す
  - name: legend
    type: オブジェクトの配列
    required: true
    description: 凡例の項目（`{ sample, label }`。`sample` は箱の種類・線の種類・系列・枠・層・交差・印・下線のどれか）。図の下に並べる
  - name: zoom
    type: 数値
    default: 全体が収まる倍率
    description: 今の倍率。全体が収まる倍率より大きいときだけ移動のボタンを出す
  - name: modal
    type: 真偽値
    default: 'false'
    description: 全画面のモーダルの中に描くか。`true` のときは全画面のボタンの位置に閉じるボタンを置き、表示する枠をモーダルの高さいっぱいにする
slots:
  - name: default
    description: 表示する枠の中に置く図の本体
    accepts:
      - dev/設計書/部品設計/フロー図.ts#
      - dev/設計書/部品設計/シーケンス図.ts#
      - dev/設計書/部品設計/グラフ.ts#
events:
  - name: 拡大・縮小する
    when: 拡大・縮小・倍率のボタンを押すか、表示する枠にフォーカスして `+`・`-`・`0` を押す
    value: 倍率のボタンの文字と読み上げの名前
    description: '`mount` が倍率を 1.25 倍ずつ変え（倍率のボタンと `0` は開いたときの倍率と位置に戻す）、ボタンの `disabled` と倍率のボタンの文字・読み上げの名前と、文書の中の表示する枠の高さの上限（定義の高さ × 今の倍率）を付け替える'
  - name: 動かす
    when: 余白をドラッグする、矢印キーを押す、移動のボタンを押す
    value: 表示する枠の `scrollLeft`・`scrollTop`
    description: '`mount` が表示する枠をスクロールさせる'
  - name: 全画面で開く・閉じる
    when: 全画面のボタンを押す。閉じるボタンか Esc を押す
    value: '`dialog` の `open`'
    description: '`mount` が `modal` を `true` にした枠を `dialog` に描いて開き、閉じたら消して全画面のボタンへフォーカスを戻す'
css_properties:
  - name: --mdmark-diagram-max-height
    syntax: <length>
    default: 36rem
    description: 文書の中の表示する枠の最初の高さの上限。開いたときと全体が収まる倍率に戻したときは、高さを定義の高さ × 全体が収まる倍率とこの値の小さいほうにする（全体が収まる倍率は枠の幅で決める）。使う側が高さを変えたときはこの値で止めず、定義の高さ × 今の倍率を上限にする
  - name: --mdmark-diagram-box-shadow
    syntax: none | <shadow>
    default: inset 0 0 0 1px var(--mdmark-color-border)
    description: 表示する箱の線（`box-shadow` の値）。既定値は `:root` に置かず `var()` のフォールバックで持ち、描く先の要素で変えた `--mdmark-color-border` に追従する。使う側は枠を持つ面で `none` を指定して線を外す。操作できる部品の中は mdmark が `none` にし、全画面のモーダルの中はこの値を受け継がず既定の線で描く
accessibility:
  - 題は `figcaption` で、表示する枠は `role="group"`・`aria-roledescription="図"`・`aria-labelledby`（題）・`aria-keyshortcuts="+ - 0 ArrowLeft ArrowUp ArrowDown ArrowRight"`・`tabindex="0"` を持ち、フォーカスの枠を見せる
  - ボタンの帯は `role="toolbar"` と `aria-label="「{題名}」の表示"` を持つ。縮小・拡大・全画面・移動のボタンはアイコンだけで、読み上げの名前を `縮小`・`拡大`・`全画面で開く`・`全画面を閉じる`・`左へ動かす`・`上へ動かす`・`下へ動かす`・`右へ動かす` にする
  - 倍率は縮小と拡大の間のボタンに `125%` の形（等幅の数字）で出し、読み上げの名前を `倍率 {今の倍率}。全体が収まる倍率に戻す` にする（今の名前 `全体が収まる倍率に戻す` で探せる。#6 の確認ログ）
  - 凡例は `aria-label="凡例"` の `ul` で、色の見本に名前を並べ、色だけで意味を伝えない
status: planned
introduced:
  pr: 42
test_file: tests/integration/lib/diagram-frame.story.test.ts
