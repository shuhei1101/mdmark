title: "コードブロック"
implementation: "src/parts/code-block.ts#renderCodeBlock"
story: "Parts/CodeBlock"
states:
  - name: TitleAndLineNumbers
    description: 題・行番号・2 行目の強調
    args:
      - name: language
        value: ts
      - name: title
        value: app.ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(document.querySelector(\"#doc\"), await doc.text());"}]'
  - name: LineMarks
    description: 消した行・足した行・強調・印の無い行。印の無い行も印の列の幅を空けて文字の頭を揃える
    args:
      - name: language
        value: ts
      - name: lines
        value: '[{"text":"let count = 0;","kind":"del"},{"text":"let count = 1;","kind":"add"},{"text":"count += 1; // 数える","kind":"highlight"},{"text":"console.log(count);"}]'
  - name: TitleOnly
    description: 題だけ。行に分けず今の `pre` のまま描く
    args:
      - name: language
        value: yaml
      - name: title
        value: mdmark.config.yaml
      - name: lines
        value: '[{"text":"features:"},{"text":"  code: true"},{"text":"  print: true"}]'
  - name: TwoDigits
    description: 13 行で 2 桁の行番号と空の行、9〜10 行目の強調。空の行も 1 行の高さを取る
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"const element = document.querySelector(\"#doc\");"},{"text":"const response = await fetch(\"/README.md\");"},{"text":"const markdown = await response.text();"},{"text":""},{"text":"const config = {"},{"text":"  features: {"},{"text":"    code: true,","kind":"highlight"},{"text":"    print: true,","kind":"highlight"},{"text":"  },"},{"text":"};"},{"text":"mount(element, markdown, config);"}]'
  - name: LongLineAndTitle
    description: 幅を超える題と行。題は帯の中で折り返し、行はブロックの中で横にスクロールして行の地を最も長い行の右端まで敷く
    args:
      - name: language
        value: ts
      - name: title
        value: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      - name: lineNumbers
        value: 'true'
      - name: lines
        value: '[{"text":"const url = \"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.6.0/dist/index.js\";"},{"text":"export const decorate = (tokens: Token[], options: { title?: string; lines: boolean; highlight: number[] }) => tokens;","kind":"del"},{"text":"export const decorate = (tokens: Token[], options: CodeBlockOptions, warnings: SyntaxWarning[]): Token[] => applyCodeBlockOptions(tokens, options, warnings);","kind":"add"}]'
  - name: SyntaxPlain
    description: ts の色分け。題も行番号も行の種類も無いため、行に分けない `pre` の `code` の中身を色分けする
    args:
      - name: language
        value: ts
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"// 文書を描く"},{"text":"const element: HTMLElement | null = document.querySelector(\"#doc\");"},{"text":"mount(element, `# 見出し ${300}`, { features: { syntax: true } });"}]'
  - name: SyntaxWithLineMarks
    description: 題・行番号・消した行・足した行・強調と色分け。行番号・行頭の `+`・`-`・行の地と左端の線はそのままに、行の中身だけが色分けされる
    args:
      - name: language
        value: ts
      - name: title
        value: app.ts
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"const limit = 100;","kind":"del"},{"text":"const limit = 300;","kind":"add"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(element, await doc.text());"}]'
  - name: SyntaxMultilineToken
    description: 行をまたぐブロックコメントとテンプレート文字列を、行番号を付けて色分けする。色の `span` を行の切れ目で閉じて次の行で開き直し、どの行もコメント・文字列の色のまま 1 行ずつ並ぶ
    args:
      - name: language
        value: ts
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"/*"},{"text":" * 文書を描く"},{"text":" */"},{"text":"const markdown = `# 見出し"},{"text":"本文 ${count}"},{"text":"`;","kind":"highlight"}]'
  - name: SyntaxPython
    description: 行コメントの頭が `#` の python の色分け。デコレーター・コメント・文字列・数値・組み込みの関数がそれぞれの色になる
    args:
      - name: language
        value: python
      - name: lineNumbers
        value: 'true'
      - name: highlight
        value: 'true'
      - name: lines
        value: '[{"text":"@dataclass"},{"text":"class Doc:"},{"text":"    # 文書の題"},{"text":"    title: str = \"README\""},{"text":"    lines: int = 300"},{"text":""},{"text":"print(len(Doc().title))"}]'
  - name: LanguageLabel
    description: 題も行の印も持たない ts のコードブロック。帯の左端に `ts`、右端に `コピー` のボタン
    args:
      - name: language
        value: ts
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"},{"text":"mount(document.querySelector(\"#doc\"), \"# 見出し\");"}]'
  - name: FileName
    description: '```python:hoge.py のコードブロック。帯の左端に `python` と、縦線で区切った `hoge.py`'
    args:
      - name: language
        value: python
      - name: fileName
        value: hoge.py
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"def hello():"},{"text":"    print(\"hello\")"}]'
  - name: LongFileName
    description: 帯の幅を超えるファイル名と題。ファイル名と題は帯の中で折り返し、コピーのボタンは右端に残る
    args:
      - name: language
        value: ts
      - name: fileName
        value: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      - name: title
        value: 色分けの対象を探す
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"export const findTargets = (root: Element) => root.querySelectorAll(\"code[data-mdmark-syntax]\");"}]'
  - name: NoLanguage
    description: 言語の無いコードブロック。言語のラベルを出さず、帯はコピーのボタンだけを持つ
    args:
      - name: copyState
        value: idle
      - name: lines
        value: '[{"text":"npm install mdmark"}]'
  - name: Copied
    description: コードをコピーした。ボタンが `コピーしました`（`check` のアイコン）
    args:
      - name: language
        value: ts
      - name: copyState
        value: copied
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"}]'
  - name: CopyFailed
    description: コードをコピーできなかった。ボタンが `コピーできませんでした`（`circle-alert` のアイコン）
    args:
      - name: language
        value: ts
      - name: copyState
        value: failed
      - name: lines
        value: '[{"text":"import { mount } from \"mdmark\";"}]'
lead: 左端に言語のラベルと題、右端にコピーのボタンを置いた帯と、行番号・行の強調・足した行と消した行と、言語に応じた色分けを付けたコードブロック。
args:
  - name: language
    type: 文字列
    required: false
    default: 空（言語の無いコードブロック）
    description: '情報文字列の最初の語の、最初の `:` より前。`code` の class `language-{言語}` と、帯の左端の言語のラベルと、題もファイル名も無いときの読み上げの名前 `コード: {言語}` に使う。空のときはラベルを出さない'
  - name: title
    type: 文字列
    required: false
    default: 空（題を出さない）
    description: '題。空でなければコードブロックを `figure` で囲み、帯を `figcaption` にして言語のラベルの後ろに出し、`pre` の読み上げの名前を `コード: {題}` にする'
  - name: lineNumbers
    type: 真偽値
    required: false
    default: 'false'
    description: 行の左に 1 から始まる行番号を出すか
  - name: lines
    type: オブジェクトの配列
    required: true
    description: コードの行（`{ text, kind }`）。`text` は印を外した行の文字、`kind` は `add`・`del`・`highlight` か空
  - name: highlight
    type: 真偽値
    default: 'false'
    description: ストーリーで色分けした後の見た目を出すか。部品の HTML は色分けを持たず、`mount` が描いた後に行の中身 `mdmark-code-text`（行に分けないときは `code`）を色分けした HTML に置き換える。部品の描画のインターフェースはこの引数が `true` のとき、`language` の言語で同じ置き換えを当ててから返す
    status: planned
  - name: syntax
    type: 文字列
    required: false
    default: 空
    description: 色分けする言語のモジュール名（`typescript`・`yaml` など）。渡すと `code` に `data-mdmark-syntax="{モジュール名}"` を付け、`mount` が色分けする対象をこの属性で探す。見た目は変えない
    status: planned
  - name: fileName
    type: 文字列
    default: 空（ファイル名を出さない）
    enabled_when: '`language` が空でないとき'
    description: '情報文字列の最初の語の、最初の `:` より後ろ（```python:hoge.py の `hoge.py`）。言語のラベルの言語の後ろに細い縦線で区切って本文の色で出し、長い名前は帯の中で折り返す。題が無いときは読み上げの名前を `コード: {ファイル名}` にする'
  - name: copyState
    type: 列挙
    default: なし（コピーのボタンを付けない）
    choices: '`idle`（`コピー`、`copy` のアイコン）・`copied`（`コピーしました`、`check`）・`failed`（`コピーできませんでした`、`circle-alert`）'
    description: 帯の右端のコピーのボタンの状態（`mount` が付けた状態）。渡すとボタンと `role="status"` の要素を置き、ボタンの `data-state` と文言・アイコンを切り替える。`copied`・`failed` のときは `role="status"` の要素に `コードを{文言}` を入れる
css_properties:
  - name: --mdmark-color-code-highlight-bg
    syntax: <color>
    default: '#fef3c7（ダーク #5c4a12）'
    description: 強調した行の地の色
  - name: --mdmark-color-code-highlight-line
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 強調した行の左端の線の色
  - name: --mdmark-color-diff-add-bg
    syntax: <color>
    default: '#e1ede2'
    description: 足した行の地の色（差分の表示と共通）
  - name: --mdmark-color-diff-add-sign
    syntax: <color>
    default: '#15803d'
    description: 足した行の行頭の `+` と左端の線の色（差分の表示と共通）
  - name: --mdmark-color-diff-del-bg
    syntax: <color>
    default: '#fbe6e3'
    description: 消した行の地の色（差分の表示と共通）
  - name: --mdmark-color-diff-del-sign
    syntax: <color>
    default: '#b91c1c'
    description: 消した行の行頭の `-` と左端の線の色（差分の表示と共通）
  - name: --mdmark-color-syntax-keyword
    syntax: <color>
    default: '#6d28d9（ダーク #d6c2ff）'
    description: 色分けのキーワード（予約語・デコレーター・`document` や `self` などの言語の変数）の色
  - name: --mdmark-color-syntax-string
    syntax: <color>
    default: '#166534（ダーク #4ade80）'
    description: 色分けの文字列（文字列・正規表現・エスケープ・Markdown のリンクの文字）の色
  - name: --mdmark-color-syntax-number
    syntax: <color>
    default: '#92400e（ダーク #fbbf24）'
    description: 色分けの数値（数値・`true`・`false`・`null`・YAML と Markdown の箇条書きの `-`）の色
  - name: --mdmark-color-syntax-type
    syntax: <color>
    default: '#be185d（ダーク #fbb6db）'
    description: 色分けの型（型・クラス名・組み込みの関数と型・HTML のタグ名・CSS のセレクター）の色
  - name: --mdmark-color-syntax-name
    syntax: <color>
    default: '#1d4ed8（ダーク #a8c1ff）'
    description: 色分けの名前（関数名・オブジェクトと YAML と JSON のキー・HTML の属性・CSS のプロパティ・Markdown の見出し）の色
  - name: --mdmark-color-syntax-comment
    syntax: <color>
    default: '#52525b（ダーク #c8c8cf）'
    description: 色分けのコメントの色。コメントは斜体でも示す
accessibility:
  - '`pre` は `tabindex="0"` と読み上げの名前（題があれば `コード: {題}`、ファイル名があれば `コード: {ファイル名}`、言語があれば `コード: {言語}`、どれも無ければ `コード`）を持ち、キーボードで横にスクロールできる'
  - 言語のラベルの言語は `aria-hidden="true"` で読み上げず（`pre` の名前が持つ）、ファイル名だけを読ませる。ラベルは選んで写す中身に入れない
  - コピーのボタンは文言を読み上げの名前に持ち、結果を `role="status"` の要素で `コードをコピーしました`・`コードをコピーできませんでした` と読み上げる。状態は文言とアイコンで示し、色だけに頼らない
  - 足した行・消した行・強調した行は、色に加えて左端の 2px の線（足した行・消した行は行頭の `+`・`-` も）で分ける。強調の線は隣り合う地の色と 3:1 以上
  - '行頭の印は擬似要素の代わりの文字で読み上げる（足した行は `足した行`、消した行は `消した行`、強調した行は見た目の文字を持たず `強調した行`）。代わりの文字を読めないブラウザ（Firefox 128・Safari 17.4 より前）でも行番号と `+`・`-` が出るよう、代わりの文字の無い `content` を先に書き、代わりの文字付きの `content` を後ろに重ねる（例: `content: "+"; content: "+" / "足した行";`）'
  - '行番号と行頭の `+`・`-` は擬似要素で出し、文字を選んで写す中身に入れない。行は `inline-block` で並べ、写した行の間に空行を入れない。空の行は `min-height: 1.55em` で高さを取る（`lh` 単位は対応ブラウザの一部で効かない）'
  - 印刷では行を折り返し、行番号は折り返した最初の 1 行にだけ出す。題・言語のラベル・行番号・強調・行の色と `+`・`-` はそのまま出し、コピーのボタンは出さない
  - 色分けは見た目だけで、読み上げの名前とコードの文字は変わらない。コメントは色に加えて斜体でも示す。色分けの 6 色は、地（`--mdmark-color-surface` と、足した行・消した行・強調した行の半透明の地を混ぜた色）に対して明るい配色で 5.21〜7.03、ダークで 6.56〜10.64（WCAG の相対輝度で計算）
  - '印刷ではダークを解除した明るい配色の色分けの色を、`print-color-adjust: exact` で色を省くブラウザの設定でも紙に出す'
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[コードブロック]
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[色分けの当て方]
status: planned
introduced:
  pr: 65
notes:
  出す HTML: '形はインターフェース定義『文書をHTML文字列にする』の制約「コードブロック」。コードブロックを `<div class="mdmark-code">`（題を持てば `<figure class="mdmark-code">`）で囲み、`pre` の前に帯 `<div class="mdmark-code-bar">`（題を持てば `<figcaption class="mdmark-code-title mdmark-code-bar">`）を置く。帯は左から `<span class="mdmark-code-lang"><span class="mdmark-code-lang-name" aria-hidden="true">{言語}</span><span class="mdmark-code-file">{ファイル名}</span></span>`・題の文字・`<span class="mdmark-code-meta"><button class="mdmark-code-copy" type="button" data-state="{copyState}">{アイコン}{文言}</button><span class="mdmark-visually-hidden mdmark-code-status" role="status"></span></span>`（`mdmark-code-meta` は `mount` が付ける）。題の前のファイルのアイコンは CSS で付ける。題が無く、行番号も行の種類も無いときは、帯で囲むほかは今の `pre` のまま描く。言語のラベルは本文より淡い `--mdmark-color-muted` の文字で、ファイル名は `--mdmark-color-border` の縦線で区切って本文の色で出し、`overflow-wrap: anywhere` で折り返す。コピーのボタンは折り返さず帯の右端に置き、アイコンは lucide（`copy`・`check`・`circle-alert`）。印刷ではコピーのボタンを出さない。モックは `dev/mock/components/code-block/`'
  行の地の色: '足した行・消した行・強調した行の地は、不透明の変数をそのまま当てた後に `color-mix(in srgb, {変数} 60%, transparent)` を重ねて 2 回書く（例: `background: var(--mdmark-color-diff-add-bg); background: color-mix(in srgb, var(--mdmark-color-diff-add-bg) 60%, transparent);`）。`color-mix()` が効くブラウザでは `pre` の横スクロールの影が行の地を透けて見え、効かないブラウザ（Chrome 99〜110）では不透明の地になる。半透明の地と `--mdmark-color-surface` を混ぜた色に対するコントラストは、明るい配色で行頭の印と線 4.53〜4.71・行番号 5.49〜5.69・文字 14.19〜14.71、ダークで行頭の印と線 5.17〜6.49・行番号 5.37〜5.95・文字 14.37〜15.91（WCAG の相対輝度で計算）'
  色分けの種類: '色分けのライブラリが付ける `hljs-*` の class を 6 つの CSS 変数へ寄せる。キーワード: `hljs-keyword`・`hljs-meta`・`hljs-variable.language_`・`hljs-doctag`／文字列: `hljs-string`・`hljs-regexp`・`hljs-char`・`hljs-link`／数値: `hljs-number`・`hljs-literal`・`hljs-symbol`・`hljs-bullet`／型: `hljs-type`・`hljs-title.class_`・`hljs-built_in`・`hljs-name`・`hljs-selector-*`／名前: `hljs-title`・`hljs-attr`・`hljs-attribute`・`hljs-property`・`hljs-section`／コメント: `hljs-comment`・`hljs-quote`。テンプレート文字列に埋めた式 `hljs-subst` は本文の色に戻し、Markdown の `hljs-strong` は太字、`hljs-emphasis` は斜体にする。ここに無い class（変数名・引数・記号）は本文の色のまま。モックは `dev/mock/components/code-block/` と `dev/mock/refs/97/assets/syntax-highlight.css`'
test_file: tests/integration/lib/code-block.story.test.ts
events:
  - name: コードをコピーする
    when: 帯の右端の `コピー` のボタンを押す
    value: ボタンの `data-state`
    description: '`mount` が消した行を除いたコードの文字をクリップボードへ写し、書けたら `copied` にして 2 秒で `idle` に戻し、書けなければ次に押すまで `failed` にする'
