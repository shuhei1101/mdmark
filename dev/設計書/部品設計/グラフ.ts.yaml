title: "グラフ"
implementation: "src/parts/diagram.ts#renderChart"
story: "Parts/Chart"
states:
  - name: TwoSeries
    description: 系列 2 つ・点 5 つずつ
    notes:
      定義: モックの `reply-time`
  - name: FourSeries
    description: 系列 4 つ。色と模様の組の全て
    notes:
      定義: モックの `reply-time-4`
  - name: Invalid
    description: 定義を読めない。図の代わりに書き方の警告を出す
  - name: Bar
    description: 棒・系列 2 つ。色と塗りの模様（塗りつぶし・斜線）の組で分け、縦の軸はデータから切る
  - name: BarFour
    description: 棒・系列 4 つ。塗りの模様（塗りつぶし・斜線・点・格子）の組の全て
  - name: Pie
    description: 円・項目 3 つ。扇形の外に整数の割合、凡例に項目の名前と値。扇形は `--mdmark-color-bg-opaque` の隙間で分ける
  - name: Scatter
    description: 散布図・系列 2 つ。横と縦の両方を数値の軸にし、系列を色と点の形（丸・四角・三角・菱形）で分ける
  - name: SixSeries
    description: 折れ線・系列 6 つ。5 つ目は一点鎖線と逆三角、6 つ目は細かい破線と十字の点で分ける
    notes:
      定義: モックの `reply-time-6`
  - name: Area
    description: 面・系列 2 つ。折れ線の下を系列の色を 14% にした面で塗り、線の模様と点の形は折れ線と同じ
    notes:
      定義: モックの `visits-area`
  - name: StackedArea
    description: 積み上げの面・系列 3 つ。下の系列の上端に積み、面を系列の塗りの模様で分ける
    notes:
      定義: モックの `visits-stacked-area`
  - name: StackedBar
    description: 積み上げの棒・系列 3 つ。項目ごとに 1 本の棒に系列を積み、棒の上に合計を出す
    notes:
      定義: モックの `inquiry-stacked`
  - name: HorizontalBar
    description: 横棒・系列 2 つ。項目の名前を左に並べ、値を横の長さで出す
    notes:
      定義: モックの `inquiry-horizontal`
  - name: Donut
    description: ドーナツ・項目 4 つ。中を空けた扇形の外に割合、中央に合計と `合計{unit}` を出す
    notes:
      定義: モックの `reply-kind-donut`
  - name: Radar
    description: レーダー・系列 2 つ・軸 5 つ。`x.ticks` を放射状の軸にし、系列を色と線の模様・点の形の多角形で引く
    notes:
      定義: モックの `review-radar`
  - name: Bubble
    description: 'バブル・系列 2 つ。点の 3 つ目の値に面積が比例する円を塗りの模様で描き、凡例に `円の面積: {size.label}` と大小 2 つの円の見本を出す'
    notes:
      定義: モックの `inquiry-bubble`
  - name: Combo
    description: 折れ線と棒の組み合わせ。`as` が `bar` の系列を棒、`line` の系列を折れ線で描き、`axis` が `y2` の系列を右の縦の軸で読む。`y2` を持つときは凡例の系列の名前に `（左の軸）`・`（右の軸）` を添える
    notes:
      定義: モックの `inquiry-combo`
  - name: TooManySeries
    description: 系列 7 つの定義。図の代わりに、系列の数と上限の 6 つを書いた書き方の警告を出す
  - name: ItemFocused
    description: 折れ線の点にフォーカスした。点を輪で示し、点の下にその項目のツールチップを出す
    notes:
      定義: モックの `reply-time`
lead: 折れ線・棒・円・散布図・面・積み上げの棒と面・横棒・ドーナツ・レーダー・バブル・折れ線と棒の組み合わせのグラフ。系列は色と、線の模様・塗りの模様・点の形の組で分ける。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: グラフの定義（`MdmarkChartDefinition`。`type`（`line`・`bar`・`pie`・`scatter`・`area`・`stacked-bar`・`stacked-area`・`horizontal-bar`・`donut`・`radar`・`bubble`・`combo`。省いたとき `line`）・`x`（ラベルと目盛り。散布図とバブルは数値の軸、レーダーは目盛りを放射状の軸にする）・`y`（ラベル・最小・最大・刻み。省くとデータから 1・2・5×10 のべき乗の刻みで切る。横棒では横の軸）・`y2`（`combo` の右の縦の軸。`y` と同じ構造）・`size`（`bubble` の 3 つ目の値のラベル）・`series`（`combo` の系列は `as`（`line`・`bar`）と `axis`（`y`・`y2`。省いたとき `y`）を持つ）・`items`・`unit`）。系列と円・ドーナツの項目は 6 つまで
uses:
  - component: dev/設計書/部品設計/書き方の警告.ts#
    how: 定義を読めないときに図の代わりに置く
  - component: dev/設計書/部品設計/図のツールチップ.ts#
    how: '`kind` を `item` にして、項目の系列か項目の名前と値を出す'
accessibility:
  - グラフの svg は `role="img"` と、題名と系列（円は項目）ごとの値を並べた `aria-label` を持つ
  - 系列は色だけでなく、折れ線は線の模様と点の形、棒と円は塗りの模様、散布図は点の形でも分ける
  - 面・レーダーは折れ線と同じ線の模様と点の形、積み上げの棒と面・横棒・ドーナツ・バブル・組み合わせの棒は塗りの模様でも分ける。6 つの系列の色は、どのテーマの明るい配色と暗い配色でも地に対して 3:1 以上
  - バブルの `aria-label` は点ごとに `({x}, {y}, {size.label} {値})` を並べ、組み合わせの凡例は系列の読む軸を文字でも示す
  - 点・棒・扇形・バブルの項目は `tabindex="0"` と、その項目のツールチップを指す `aria-describedby` を持つ。点は半径 12px の透明の当たりの円（`.mdmark-diagram-item-hit`）にこれを持たせる
status: planned
introduced:
  pr: 42
notes:
  塗りの模様の地: '塗りの模様の地（`.mdmark-diagram-pattern-tint`）は、`color-mix()` の効かないブラウザ（Chrome 111・Firefox 113 より前）向けに、先に `fill: var(--series-color); fill-opacity: 0.22` を書き、`@supports (color: color-mix(in srgb, red, blue))` の中で `fill: color-mix(in srgb, var(--series-color) 22%, var(--mdmark-color-bg-opaque)); fill-opacity: 1` に置き換える。面とレーダーの薄い塗りも同じ 2 段にする'
css_properties:
  - name: --mdmark-color-bg-opaque
    syntax: <color>
    default: var(--mdmark-color-bg)
    description: 模様の塗りで系列の色を混ぜる先の色と、散布図・折れ線の点の縁と円の項目を分ける隙間の色
  - name: --mdmark-color-series-1
    syntax: <color>
    default: '#0f766e（ダーク #2dd4bf）'
    description: 1 つ目の系列の色（実線・丸の点）
  - name: --mdmark-color-series-2
    syntax: <color>
    default: '#b45309（ダーク #fbbf24）'
    description: 2 つ目の系列の色
  - name: --mdmark-color-series-3
    syntax: <color>
    default: '#6d28d9（ダーク #c4a7ff）'
    description: 3 つ目の系列の色
  - name: --mdmark-color-series-4
    syntax: <color>
    default: '#1d4ed8（ダーク #7aa2ff）'
    description: 4 つ目の系列の色
  - name: --mdmark-color-series-5
    syntax: <color>
    default: '#be185d（ダーク #f472b6）'
    description: 5 つ目の系列の色（一点鎖線 `9 3 1 3 1 3`・逆三角の点・縦線の塗りの模様）。選べるテーマの値は `dev/mock/assets/themes/{テーマ名}.css`
  - name: --mdmark-color-series-6
    syntax: <color>
    default: '#4d7c0f（ダーク #a3e635）'
    description: 6 つ目の系列の色（細かい破線 `3 2`・十字の点・横線の塗りの模様）。選べるテーマの値は `dev/mock/assets/themes/{テーマ名}.css`
test_file: tests/integration/lib/chart.story.test.ts
