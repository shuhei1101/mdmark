id: CMP-472-7
title: wide の範囲
lead: wide の範囲を本文の幅を越えて広げ、範囲の上の本文の幅の右端に、ラベルの無いアイコンだけの切り替えのボタンを配置する。押すたびに広げた幅と本文の幅を切り替え、ボタンの位置は変えない。
implementation: src/parts/wide.ts#renderWide
story: Parts/Wide
test_file: tests/integration/lib/wide.story.test.ts
args:
  - name: html
    type: 文字列
    required: true
    description: 範囲の中身の HTML
  - name: state
    type: 列挙
    required: false
    default: wide
    choices: '`wide`（広げた幅）・`narrow`（本文の幅）'
    description: 範囲の `data-state` とボタンの `aria-pressed`（`wide` で `true`）
  - name: toggle
    type: 真偽値
    required: false
    default: 'false'
    description: 切り替えのボタンの帯を配置するか。`render` は指定せず、`mount` が `true` で再描画する
states:
  - name: Wide
    description: 広げた状態。ボタンは縮めるアイコン（`→|←`）
    args:
      - name: html
        value: <table>…8 列の表…</table>
      - name: toggle
        value: 'true'
  - name: Narrow
    description: 本文の幅にした状態。ボタンは広げるアイコン（`|←→|`）
    args:
      - name: html
        value: <table>…8 列の表…</table>
      - name: state
        value: narrow
      - name: toggle
        value: 'true'
  - name: NoToggle
    description: '`render` が出す、ボタンの無い範囲'
    args:
      - name: html
        value: <table>…8 列の表…</table>
  - name: SmallScreen
    description: 描く先の要素の幅が 390px。ボタンの帯を出さず、範囲は本文の幅で中で横にスクロールする
    args:
      - name: html
        value: <table>…8 列の表…</table>
      - name: toggle
        value: 'true'
    notes:
      定義: ストーリーは幅 390px の枠に描く
css_properties:
  - name: --mdmark-content-width
    syntax: <length>
    default: 値は dev/設計書/デザイン方針.md
    description: 本文の幅。ボタンの帯の幅と `narrow` の範囲の幅
accessibility:
  - ボタンのスクリーンリーダー向けの名前は状態によらず `広げて表示` で、状態は `aria-pressed` で伝える
  - ボタンは 28px 四方で、フォーカスの輪を持つ
refs:
  - IF-472-34#constraints[wide の範囲]
  - IF-472-35#constraints[wide の幅の切り替え]
status: planned
notes:
  HTML: '`<div class="mdmark-wide-bar"><button class="mdmark-wide-toggle" type="button" aria-label="広げて表示" aria-pressed="{true|false}"><span class="mdmark-wide-icon-shrink">{縮めるアイコン}</span><span class="mdmark-wide-icon-expand">{広げるアイコン}</span></button></div><div class="mdmark-wide-range" data-state="{state}">{html}</div>`。2 つのアイコンは Lucide に無い構造で、`src/parts/icons.ts` に Lucide と同じ IconNode の構造で配置する（確認ログ）。class は埋め込んだ HTML の `.is-wide` と、表の `wide=` の列の `mdmark-wide` と分ける。モックは `dev/mock/components/wide/`'
