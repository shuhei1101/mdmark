title: "操作できる部品"
implementation: "src/parts/param.ts#renderParam"
story: "Parts/ParamControl"
states:
  - name: Default
    description: 開いたとき。既定の値 5
    notes:
      定義: モックの `strength`（`dev/mock/refs/42/assets/samples.js` の `mdmarkMockParams`）
  - name: Changed
    description: 値を 8 に変えた。グラフが追従する
    args:
      - name: value
        value: '8'
  - name: Copied
    description: コピーした。ボタンのそばにコピーしたことを出す
    args:
      - name: value
        value: '8'
      - name: copy
        value: copied
  - name: Failed
    description: 写せなかった。記載できなかったことと、選んで写せる JSON を出す
    args:
      - name: value
        value: '8'
      - name: copy
        value: failed
  - name: CustomCopyLabel
    description: 写すボタンの文言を替えた。アイコンの後ろを「コピー」で描く
    args:
      - name: copyLabel
        value: コピー
lead: スライダー・今の値を写すボタン・グラフを組み合わせた部品。スライダーの値でグラフを再描画し、今の値を JSON にしてクリップボードへ写す。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: 操作できる部品の定義（`MdmarkParamDefinition`。`title`・`knob`（`key`・`label`・`min`・`max`・`step`・`value`）・`chart`（グラフのタイトル・軸）・`table`（スライダーの値ごとの点））
  - name: value
    type: 数値
    default: 定義の `knob.value`
    description: 今の値。グラフは今の値と既定の値の 2 つの系列を描く
  - name: copy
    type: 列挙
    default: none
    choices: '`none`・`copied`（コピーした）・`failed`（写せなかった）'
    description: コピーした結果の通知。`failed` のときは写すはずだった JSON を選んで写せる `pre` に出す
  - name: copyLabel
    type: 文字列
    default: 今の値を写す
    description: 今の値を写すボタンの、アイコンの後ろに描く文言。ボタンのアクセシブルネームもこの文言になる。HTML の特殊文字はエスケープして描く
    status: implemented
events:
  - name: 値を変える
    when: スライダーを動かすか、フォーカスして矢印キーを押す
    value: '`input` の `value`'
    description: '`mount` が `output` とグラフを再描画する'
  - name: 今の値を写す
    when: 今の値を写すボタンを押す
    value: '`{"{key}": {"name": "{label}", "value": {今の値}}}` の JSON'
    description: '`mount` がクリップボードへ書き込み、結果を通知する'
uses:
  - component: dev/設計書/部品設計/図の枠.ts#
    how: 'グラフをタイトル・凡例・右上のボタンつきで配置する。中の図の枠は表示するノードの線を描かず（`box-shadow: none`）、操作できる部品の枠で囲む'
  - component: dev/設計書/部品設計/グラフ.ts#
    how: 今の値と既定の値の系列を描く
accessibility:
  - 部品は `role="group"` でタイトルを `aria-labelledby` で指す
  - スライダーは `label` で名前を付け、今の値を `output` に出し、矢印キーでも動かせる
  - コピーした結果は `role="status"` に出し、色とアイコンと文言で伝える
  - 写せなかった JSON の `pre` は `tabindex="0"` と `aria-label="写す JSON"` を持つ
  - 写すボタンは `aria-label` を付けず、ボタンの文字（`copyLabel`）をアクセシブルネームにする
status: planned
introduced:
  pr: 42
test_file: tests/integration/lib/param.story.test.ts
