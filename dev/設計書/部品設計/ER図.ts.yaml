title: "ER 図"
implementation: "src/parts/diagram.ts#renderEr"
story: "Parts/ErDiagram"
states:
  - name: Default
    description: 全ての列を出す。マスターとトランザクションのテーブル、列の PK・FK・NN のマーカー、両端に多重度の記号とラベルを持つ関係の線
    notes:
      定義: モックの `shop-er`（`dev/mock/refs/298/assets/er-samples.js`）
  - name: Colors
    description: '`color` で種類の既定の色を上書きしたテーブル（商品を緑）と、種類の無い色付きのテーブル（注文の明細を紫。種類の札を出さない）'
    notes:
      定義: モックの `shop-er-colors`
  - name: Folded
    description: 注文のテーブルの列を畳んだ。主キーと外部キーの列と `非表示 {数} 列` の行だけを出し、開閉のボタンは `aria-expanded="false"`。関係の線は残った列の行に結ぶ
    notes:
      定義: モックの `shop-er-folded`
  - name: Invalid
    description: 関係がテーブルに無い列を指す。図の代わりに記載の警告を出す
lead: テーブルを定義の座標に配置し、関係を元の列の行から先の列の行へ直角の線で結び、両端に多重度の記号を配置する図。テーブルの種類を見出しの札と色で示し、列の多いテーブルは主キーと外部キーの列だけを出して残りを畳める。
args:
  - name: definition
    type: オブジェクト
    required: true
    description: ER 図の定義（`MdmarkErDefinition`。`width`・`tables`・`relations`）。テーブルは `kind`（`master`・`transaction`）・`color`（色の名前）・`folded` と列（`name`・`type`・`pk`・`fk`・`nn`・`desc`）を持ち、関係は `fromCard`・`toCard`（`1`・`0..1`・`1..n`・`0..n`）を持つ
events:
  - name: 列を開閉する
    when: 開閉のボタンを押す（Enter・Space を含む）
    value: 開閉のボタンの `aria-expanded`
    description: '`mount` が主キーと外部キー以外の列の行を出し入れし、関係の線・多重度の記号・ラベルを今の列の行の位置へもう一度結ぶ'
uses:
  - component: dev/設計書/部品設計/記載の警告.ts#
    how: 定義を読み込めないときに図の代わりに配置する
  - component: dev/設計書/部品設計/図のツールチップ.ts#
    how: テーブルの説明のボタンに、論理名と物理名・概要・列の説明を出す
accessibility:
  - テーブルの種類は色だけでなく、見出しの札の文字（`マスター`・`トランザクション`）でも示す
  - 列の `PK`・`FK`・`NN` のマーカーは `abbr` で、`title` が `主キー`・`外部キー`・`NOT NULL`
  - 列の開閉のボタンはスクリーンリーダー向けの名前 `「{論理名}」の主キーと外部キー以外の列` と `aria-expanded` を持つ
  - テーブル・列・関係のラベルの文字は選べ、スクリーンリーダーに出る。関係の線と多重度の記号の svg は `aria-hidden`
status: planned
introduced:
  pr: 298
test_file: tests/integration/lib/er-diagram.story.test.ts
