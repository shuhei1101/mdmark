title: "プレビューの状態の表示"
implementation: "vscode/src/webview/shared/components/preview-status.tsx#PreviewStatus"
story: "VSCode/PreviewStatus"
states:
  - name: Loading
    description: 配布物を読み終えていない。回る印と題「mdmark を読み込んでいます」
    args:
      - name: state
        value: loading
  - name: Offline
    description: 配布物を読めない。本文「mdmark（v0.7.0）を jsDelivr から読み込めませんでした。ネットワークにつながっているかを確かめてから、リロードしてください。」
    args:
      - name: state
        value: offline
      - name: version
        value: v0.7.0
  - name: VersionMissing
    description: 指定した版が無い。本文「設定 mdmark.version に指定したバージョン v9.9.9 の mdmark が見つかりませんでした。存在するバージョンか latest に直してから、リロードしてください。」
    args:
      - name: state
        value: versionMissing
      - name: version
        value: v9.9.9
  - name: VersionMissingLong
    description: 指定した版の文字が長い。版の `code` が枠の中で折り返し、横にスクロールしない
    args:
      - name: state
        value: versionMissing
      - name: version
        value: v0.7.0-rc.1+build.20261023.feature-vscode-preview-extension
  - name: VersionUndecidable
    description: 版を決められない。本文「読む mdmark のバージョンを決められませんでした。GitHub から最新のバージョンを取得できず、前回のバージョンも残っていません。ネットワークにつながっているかを確かめてから、リロードしてください。」
    args:
      - name: state
        value: versionUndecidable
  - name: DiffUnsupported
    description: 差分のパネルで、読んだ配布物が差分の表示に対応しない。本文「読み込んだ mdmark（v0.8.0）は差分の表示に対応していません。設定 mdmark.version を差分の表示に対応したバージョンか latest に変更してから、リロードしてください。」
    args:
      - name: state
        value: diffUnsupported
      - name: version
        value: v0.8.0
  - name: Unexpected
    description: Webview の描画中に例外が出た（Error Boundary が受けた）。本文「プレビューの表示中にエラーが発生しました。リロードしてください。」
    args:
      - name: state
        value: unexpected
lead: VS Code 拡張機能のプレビューのパネルで、文書の代わりに出す読み込み中の表示と、描けない理由と「リロード」。mdmark の配布物を読む前にも出すため、拡張機能が HTML を作る。
args:
  - name: state
    type: 列挙
    required: true
    choices: '`loading`・`offline`・`versionMissing`・`versionUndecidable`・`diffUnsupported`・`unexpected`'
    description: 出す状態。`loading` は Spinner と題「mdmark を読み込んでいます」だけを出し、他は Alert の warning で題「プレビューを表示できません」と理由と「リロード」を出す
  - name: version
    type: 文字列
    required: false
    default: なし
    enabled_when: '`state` が `offline` か `versionMissing`・`diffUnsupported` のとき'
    description: 読もうとした mdmark の版。理由の文の中の `code` に入れる
events:
  - name: リロード
    when: 「リロード」のボタンを押したとき
    value: props の `onReload()` を引数なしで呼ぶ
    description: '画面が `{ type: "reload" }` を拡張機能へ送る（プレビューをリロードする.ts）'
css_properties:
  - name: --background
    syntax: <color>
    default: var(--vscode-editor-background)
    description: 描けない理由の枠の地の色
  - name: --foreground
    syntax: <color>
    default: var(--vscode-editor-foreground)
    description: 描けない理由の枠の文字の色
  - name: --warning-border
    syntax: <color>
    default: var(--vscode-inputValidation-warningBorder)
    description: 描けない理由の枠の線と警告のアイコンの色
  - name: --primary
    syntax: <color>
    default: var(--vscode-button-background)
    description: 「リロード」の地の色
  - name: --muted-foreground
    syntax: <color>
    default: var(--vscode-descriptionForeground)
    description: 読み込み中の Spinner と文の色
  - name: --primary-foreground
    syntax: <color>
    default: var(--vscode-button-foreground)
    description: 「リロード」の文字の色
  - name: --primary-hover
    syntax: <color>
    default: var(--vscode-button-hoverBackground)
    description: 「リロード」のホバーの地の色
  - name: --ring
    syntax: <color>
    default: var(--vscode-focusBorder)
    description: 「リロード」のフォーカスの輪郭の色
accessibility:
  - 読み込み中も描けない理由も、外側は `role="status"` を持ち、状態が変わると読み上げが題と本文を読む（Alert の既定の `role="alert"` を `status` に替える）
  - 題は `h1`、理由は `p`。警告のアイコンは `aria-hidden="true"` で、色とアイコンに頼らず文言で伝える
  - 'Spinner は lucide の `loader-circle` の `svg`（`role="img"`・`aria-label="読み込み中"`）で、`prefers-reduced-motion: reduce` のときは 6 秒で 1 回転にゆっくり回す'
  - 「リロード」は `button` で、Tab で届き Enter・Space で押せる。フォーカスの輪郭を `--ring` の 2px で出す
  - 描けない理由の文字と地は、エディタの本文の文字と地の色にする（対比はテーマが本文に持たせる対比のまま）。警告の色（`inputValidation.warningBorder`）は線とアイコンだけに使い、文字の地にしない。ボタンの文字と地（ホバーを含む）はテーマのボタンの色にする
refs:
  - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[描けない理由の見分け方]
status: planned
introduced:
  pr: 69
notes:
  出典: '文言は確認ログの決定（描けないとき・読み込み中の文言、ボタンは「リロード」）。見た目と配色は #342 の確認ログ（モックへの合意・描けない理由と帯の配色を VS Code のテーマの色にする）。モックは `dev/mock/pages/vscode-preview/342/shadcn/` と `dev/mock/components/panel-alert/`'
  使う部品: shadcn/ui の `Alert`（`warning` の variant を足す）・`Button`（`default`）・`Spinner`（`shared/components/ui/`）
  置き場所: Webview の部品のストーリーを横に置くため、画面の `components/` でなく `shared/components/` に置く。ストーリーの `title` は今の ID を保つため `VSCode/PreviewStatus` のまま
test_file: tests/integration/vscode/preview-status.story.test.ts
