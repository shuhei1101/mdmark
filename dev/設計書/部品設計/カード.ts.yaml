title: カード
implementation: src/parts/card.ts#renderCard
story: Parts/Card
test_file: tests/integration/lib/card.story.test.ts
states:
  - name: Link
    description: リンクのカード。書いた文字・ドメイン・URL を出す
    args:
      - name: kind
        value: link
      - name: href
        value: https://github.com/shuhei1101/mdmark
      - name: title
        value: mdmark のリポジトリ
  - name: BareUrl
    description: URL をそのまま書いたリンクのカード。タイトルにスキームを除いた URL を出す
    args:
      - name: kind
        value: link
      - name: href
        value: https://www.jsdelivr.com/package/gh/shuhei1101/mdmark
      - name: title
        value: www.jsdelivr.com/package/gh/shuhei1101/mdmark
  - name: Long
    description: 長い URL と長いタイトル。省略せずカードの中で折り返す
    args:
      - name: kind
        value: link
      - name: href
        value: https://github.com/shuhei1101/mdmark/blob/develop/dev/%E8%A8%AD%E8%A8%88%E6%9B%B8/%E3%82%B7%E3%83%8A%E3%83%AA%E3%82%AA/%E5%8D%98%E4%B8%80%E3%83%A6%E3%83%BC%E3%82%B9%E3%82%B1%E3%83%BC%E3%82%B9/%E6%96%87%E6%9B%B8%E3%82%92%E6%8F%8F%E3%81%8F.yaml
      - name: title
        value: 単一ユースケース「使う側のページが要素と Markdown を渡して文書を描き、本文の差し替えと片付けをする」のシナリオ
  - name: FilePdf
    description: PDF の添付のカード。種類のアイコンと `PDF`・ファイル名を出す
    args:
      - name: kind
        value: file
      - name: href
        value: ./files/design.pdf
      - name: title
        value: 設計の資料
      - name: fileKind
        value: pdf
  - name: FileSheet
    description: 表計算の添付のカード
    args:
      - name: kind
        value: file
      - name: href
        value: ./files/estimate.xlsx
      - name: title
        value: 見積もり
      - name: fileKind
        value: sheet
  - name: FileArchive
    description: 圧縮ファイルの添付のカード
    args:
      - name: kind
        value: file
      - name: href
        value: ./files/samples.zip
      - name: title
        value: samples.zip
      - name: fileKind
        value: archive
  - name: FileSlide
    description: スライドの添付のカード
    args:
      - name: kind
        value: file
      - name: href
        value: ./files/notes.key
      - name: title
        value: 発表の原稿
      - name: fileKind
        value: slide
  - name: Print
    description: 印刷。リンク先の URL を文字で出す
    args:
      - name: kind
        value: link
      - name: href
        value: https://github.com/shuhei1101/mdmark
      - name: title
        value: mdmark のリポジトリ
    notes:
      定義: 'ストーリーは `emulateMedia({ media: "print" })` で見る'
lead: リンク 1 つだけの段落を、アイコン・タイトル・ドメイン・URL を持つカードにする。ファイルへのリンクは種類のアイコンと拡張子を出す添付のカードにする。外へは要求しない。
args:
  - name: kind
    type: 列挙
    required: true
    choices: '`link`（リンクのカード）・`file`（添付のカード）'
    description: '`data-card` に入れるカードの種類'
  - name: href
    type: 文字列
    required: true
    description: リンク先。`link` はドメインに URL のホスト、URL に書いた URL を出し、`file` はドメインに拡張子の大文字、URL にファイル名を出す
  - name: title
    type: 文字列
    required: true
    description: タイトル（書いた文字。URL をそのまま書いたときはスキームを除いた URL）
  - name: fileKind
    type: 列挙
    required: false
    default: なし
    enabled_when: '`kind` が `file` のとき'
    choices: '`pdf`・`doc`・`sheet`・`slide`・`archive`・`text`'
    description: '`data-file-kind` に入れる種類。種類ごとのアイコン（lucide）はモックのとおり CSS で付ける'
css_properties:
  - name: --mdmark-color-surface
    syntax: <color>
    default: '#f4f4f5（ダーク #1b1b1f）'
    description: アイコンの地の色
  - name: --mdmark-color-border
    syntax: <color>
    default: '#e4e4e7（ダーク #26262b）'
    description: カードの線の色
  - name: --mdmark-color-muted
    syntax: <color>
    default: '#52525b（ダーク #b4b4bc）'
    description: ドメインと URL の文字の色
  - name: --mdmark-radius
    syntax: <length>
    default: 4px
    description: カードの角丸は、この値の 2 倍にする
accessibility:
  - カードは 1 つの `a` で、読み上げはタイトル・ドメイン・URL の順に読む。アイコンは `aria-hidden`
  - ホバーとフォーカスでは線の色を変え、フォーカスの枠を見せる
  - 長い URL は省略せず折り返し、横スクロールを出さない
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[印刷の画像と動画]
status: planned
notes:
  HTML: '`<a class="mdmark-card" data-card="{kind}" data-file-kind="{fileKind}" href="{href}"><span class="mdmark-card-icon" aria-hidden="true">{アイコン}</span><span class="mdmark-card-title">{title}</span><span class="mdmark-card-meta"><span class="mdmark-card-domain">{ドメイン}</span><span class="mdmark-card-url">{URL}</span></span></a>`。`iframe` の埋め込みとタイトルの取得はしない（D-39）。モックは `dev/mock/components/link-card/`'
