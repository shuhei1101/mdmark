id: CMP-472-41
title: "埋め込んだHTML"
implementation: "src/parts/embedded-html.ts#renderEmbeddedHtml"
story: "Parts/EmbeddedHtml"
states:
  - name: Default
    description: 色を付けたノード 2 つを横に並べた HTMLと、`onclick` を落としたボタン
  - name: WithChart
    description: 見出しと段落の間に棒のグラフを配置した HTML。グラフだけに図の枠のボタンがある
  - name: Wide
    description: 列より広い HTML。中で横にスクロールする
    args:
      - name: wide
        value: 'true'
  - name: WithRangeCss
    description: 範囲の `css` でノードの背景を変え、`ts` を `template` に入れた。範囲の外の同じ class のノードは変わらない
    args:
      - name: scope
        value: '0'
      - name: css
        value: '.box { background-color: var(--mdmark-color-accent-blue-bg) }'
      - name: script
        value: '{"lang":"ts","code":"export default (root: HTMLElement) => {}"}'
  - name: RangeScriptOpened
    description: 範囲の `ts` がノードを押した根の要素に class `is-open` を付けた後の外観（ストーリーでは根の要素に class を付けて描く）
    args:
      - name: scope
        value: '0'
      - name: css
        value: '.box { display: none } :scope.is-open .box { display: block }'
      - name: html
        value: class `is-open` を持つ根の要素とノード
lead: '`<!-- html -->` の範囲のコードブロックに記載した HTML を、その場に描く枠。列より広いときだけ中で横にスクロールし、中の図の部品だけに拡大・縮小を付ける。'
args:
  - name: html
    type: 文字列
    required: true
    description: 許可の検査にかけた後の HTML（インターフェース定義『文書をHTML文字列にする』の制約「埋め込んだ HTML」）
  - name: wide
    type: 真偽値
    required: false
    default: 'false'
    description: 列より広いか。`true` のとき class `is-wide` と `tabindex="0"` を付け、中で横にスクロールさせる。`mount` が幅の変化ごとに決める
  - name: scope
    type: 整数
    required: false
    default: なし
    description: 文書の中の範囲の通し番号（`data-html-scope`）。`css` と `script` を指定するときに付ける
  - name: css
    type: 文字列
    required: false
    default: なし
    enabled_when: '`scope` を指定したとき'
    description: 範囲の `css`。各規則を根の要素の中だけに該当するようにした `style.mdmark-html-style` を根の要素の先頭に配置する
  - name: script
    type: オブジェクト
    required: false
    default: なし
    enabled_when: '`scope` を指定したとき'
    description: 範囲の `ts`・`js`（`{ lang, code }`）。実行しない `template.mdmark-html-script` を根の要素の末尾に配置する（動かすのは `mount`）
slots:
  - name: default
    description: 記載した人の HTML。`<mdmark-chart>` などは図の枠に、`data-hint` を持つ要素はヒントに置き換わる
uses:
  - component: CMP-472-39#
    how: 中の `<mdmark-chart>` などを図の枠に記載する
  - component: CMP-472-24#
    how: '`data-hint` を持つ要素にマーカーか下線とツールチップを付ける'
  - component: CMP-472-53#
    how: 中の文字の用語に本文と同じ下線とツールチップを付ける
accessibility:
  - 列より広いときだけ `tabindex="0"` を持ち、キーボードで横にスクロールできる
  - 記載した人の HTML のスクリプトとイベントの属性は落とすため、文書に記載したボタンは、範囲の `ts`・`js` が操作を付けない限り押しても何も起きない
status: planned
introduced:
  pr: 45
refs:
  - IF-472-34#constraints[埋め込んだ HTML]
  - IF-472-34#constraints[範囲のスクリプトと CSS]
  - IF-472-35#constraints[範囲のスクリプト]
test_file: tests/integration/lib/embedded-html.story.test.ts
