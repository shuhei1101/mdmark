title: "非機能要件"
requirements:
  - name: 配布ファイル 1 つのサイズ
    english_name: dist_file_size
    category: 性能
    external_constraint: jsDelivr の GitHub エンドポイントは 1 ファイル 20MB までを配る
    source_kind: 実行基盤の制限
    source: https://github.com/jsdelivr/jsdelivr#restrictions
    value: '256'
    unit: KB 以下（262144 バイト）
    rationale: 外部の上限は 20MB。使う側のページが開くたびに読むため、束ねた後の実測から目標を置く。markdown-it 15.0.2 と sanitize-html 2.18.0（postcss を空の部品に差し替えたもの）を、対応ブラウザの target で束ねて minify すると 178,594 バイトだった（2026-10-13、作業ツリーの外で実測。minify しないと 388,091 バイト）。mdmark 自身のコードと、後続の Issue が足す機能の余地を見て 256KB にする。後続の Issue が超えるときは、その Issue が実測を添えて上げる
    overflow: ビルドの後に配布ファイルのサイズを数え、超えていればビルドを失敗させる。確かめる時点はビルドの直後で、版のタグを打つ前。
  - name: 対応ブラウザ
    english_name: supported_browsers
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: Chrome 99 以降・Firefox 97 以降・Safari 16.4 以降（この版をビルドの target に書く）
    rationale: 使う側の CSS が詳細度によらず mdmark の CSS に勝つために `@layer` を使う。`@layer` を持つ最初の版（Chrome 99・Firefox 97・Safari 15.4）と、ES2022 のクラスの構文を書き換えずに出すための静的初期化ブロック（Safari 16.4）のうち、新しい方を各ブラウザの下限にする。外部ライブラリの読み込みは動的 `import()`（どの下限でも使える）で行い、import map は使わない。CSS の入れ子は下限で効かないため、ビルドが展開する。トップレベル await は Safari 16.4 で部分対応のため使わない
    measurement: E2E を Playwright 同梱の Chromium・Firefox で流す。Safari 16.4 はビルドの対象には入れるが、動作は確かめていない
    verification:
      device: WSL2 上の Playwright 同梱の Chromium・Firefox
      version: Playwright 1.64.0（Chromium 156.0.8078.4・Firefox 157.0）
      date: '2026-10-17'
      result: 合格
  - name: 通信
    english_name: network
    category: 動作環境
    external_constraint: 配布物を jsDelivr から HTTPS で読む
    source_kind: 実行基盤の制限
    value: jsDelivr へ HTTPS で届くことを前提にする。オフラインは対象外
    rationale: 配布物を CDN から読む形で配り、オフラインで開ける必要は無いと決めている
    overflow: 読めないときはページの本文だけを表示し、ブラウザが読めなかった旨をコンソールに出す
