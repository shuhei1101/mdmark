title: "索引を書き換える"
entry:
  kind: mcp_tool
  value: update_index
flows:
  - name: 正常系
    summary: 索引に無い文書を足す
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 2 つ。索引に載っているのは文書 `a` だけ
      - name: Mock
        description: Claude Code の代わりに、MCP サーバーを作業のフォルダで子プロセスとして起動し、標準入出力でつなぐ MCP のクライアント
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: doc、id: b、item）
        S->>F: 索引を読む
        S->>S: b を末尾に足して検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: action: added
    expected:
      - '`action` が `added`'
      - 索引の `docs` が `a`・`b` の順で、`a` の項目は変わっていない
      - 書き換えた索引で `mdmark check` のずれが 0 件
    test: test_normal
  - name: 正常系（置き換える）
    summary: 索引にある文書の項目を置き換える
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: doc、id: a、item: 題を変えた項目）
        S->>F: 検査して置き換える
        S-->>C: action: replaced
    expected:
      - '`action` が `replaced`'
      - 索引の `a` の題が渡した題になり、`docs` の件数は変わらない
    test: test_normal_when_replaced
  - name: 正常系（消す）
    summary: item が null のとき、その ID の項目を消す
    setup:
      - name: 作業のフォルダ
        description: 索引に文書 `a`・`old` があり、`old.md` は無い
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: doc、id: old、item: null）
        S->>F: 検査して置き換える
        S-->>C: action: removed
    expected:
      - '`action` が `removed`'
      - 索引の `docs` が `a` だけになる
    test: test_normal_when_removed
  - name: 正常系（タグの語彙を書き換える）
    summary: 語彙を持たない索引に、語彙のタグを name で足す
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 1 つ。索引は `tags` を持たず、文書 `a` はタグ `topic:mcp` を持つ
      - name: Mock
        description: 正常系と同じ
      - name: 足すタグ
        description: '`{"group": "topic", "description": "含める: MCP のツール。含めない: Claude Code の設定。例: find_docs", "aliases": ["MCP"]}`'
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: tag、id: topic:mcp、item）
        S->>F: 索引を読む
        S->>S: 最上位に tags を作って足し、検査する
        S->>F: 一時ファイルに書いて置き換える
        S-->>C: action: added
    expected:
      - '`action` が `added`'
      - 索引の最上位の `tags` が `topic:mcp` の 1 つだけで、`name` の後に渡した `group`・`description`・`aliases` を持つ
      - 索引の `docs`・`terms` が変わっていない
      - 書き換えた索引で `mdmark check` のずれが 0 件
    test: test_normal_when_tag
  - name: 異常系（Schema に合わない・ツールのエラー）
    summary: パスの無い項目は書かずにエラーにする
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
      - name: 合わない項目
        description: '`path` を持たない `{"title": "文書 B"}`'
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 索引のファイル
        C->>S: update_index（kind: doc、id: b、item: path の無い項目）
        S->>F: 索引を読む
        S->>S: 検査で path が無い
        S-->>C: isError（docs[1].path と直し方）
    expected:
      - '`isError` が立つ'
      - 内容に `docs[1].path` と、`path` を書くことが出る
      - 索引のファイルの中身が呼ぶ前と同じで、一時ファイルも残らない
    test: test_error_when_schema_invalid
  - name: 異常系（消す項目が無い・ツールのエラー）
    summary: 無い ID を消そうとするとエラーにする
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: update_index（kind: doc、id: z、item: null）
        S->>S: z が索引に無い
        S-->>C: isError（無い ID）
    expected:
      - '`isError` が立つ'
      - 内容に `z` が索引の `docs` に無いことが出る
      - 索引のファイルの中身が呼ぶ前と同じ
    test: test_error_when_item_missing
lead: 索引の文書・用語の ID かタグの語彙の名前の項目を置き換え、無ければ足し、`null` なら消す。書く前に、書き換えた後の索引を索引の Schema で検査する。
idempotent: true
side_effects: 設定の `index` の索引のファイルを書き換える
exclusivity: 同じ索引への書き込みは 1 つずつ行う。読み込み・検査・置き換えを同じロックの中で行う
request:
  - name: kind
    type: "'doc' | 'term' | 'tag'"
    required: true
    location: argument
    description: 書き換えるのが文書（`docs`）・用語（`terms`）・タグの語彙（`tags`）のどれか
    notes: 文書・用語の ID とタグの名前はそれぞれの一覧の中でだけ一意のため、どれかを渡す
  - name: id
    type: string
    required: true
    location: argument
    description: 文書か用語の ID。`kind` が `tag` のときはタグの `name`
    constraints: 空でない
  - name: item
    type: object | null
    required: true
    location: argument
    description: その ID の項目の中身（文書・用語は `id`、タグは `name` を除くキー）。項目ごと置き換える。`null` なら項目を消す
    notes: キーは ER 図『索引』の `docs`・`terms`・`tags` のカラム
  - name: config
    type: string
    required: false
    default: なし（MCP サーバーの作業のフォルダから上へ `mdmark.config.yaml` を探す）
    location: argument
    description: 使う設定ファイルのパス
request_example: |-
  ```json
  {"kind": "doc", "id": "b", "item": {"path": "b.md", "title": "文書 B", "tags": ["設計"]}}
  ```
response:
  - name: action
    type: "'added' | 'replaced' | 'removed'"
    description: 足した・置き換えた・消したのどれか
  - name: index
    type: string
    description: 書き換えた索引のファイルのパス（設定ファイルのあるフォルダからの相対パス）
response_example: |-
  ```json
  {"action": "added", "index": "index.yaml"}
  ```
exceptions:
  - name: なし（正常終了）
    condition: 書き換えた後の索引が Schema に合い、書けた
  - name: ツールのエラー（Schema に合わない）
    condition: 書き換えた後の索引が索引の Schema に合わない
    notes: 索引のファイルを書き換えない。合わないところごとに場所と直し方を並べる
  - name: ツールのエラー（消す項目が無い）
    condition: '`item` が `null` で、その ID の項目が無い'
error_format: 'ツールの結果を `isError: true` にし、内容のテキストに、何が合わないかと直し方を日本語の 1 文で書く。Schema に合わないときは `{場所}: {内容}` の行を合わないところの数だけ並べる。'
constraints:
  - item: 書き方
    constraint: 一時ファイルに書いてから置き換える。渡した ID の項目の前後の項目と、その他のキーは書き換えない
  - item: 足す位置
    constraint: 索引に無い ID は、その一覧の末尾に足す。索引がその一覧のキー（`terms`・`tags`）を持たないときは、最上位の末尾にキーを作って足す。`tags` の最後の 1 つを消したときは `tags` のキーも消す
  - item: 検査
    constraint: 書き換えた後の索引全体を、`mdmark check` が使う索引の形の検査に通す。索引と文書のずれ（`checkIndex`）は検査しない
  - item: 設定ファイルと索引を読めないとき
    constraint: 設定ファイルが無い・読めないときと、設定に `index` が無い・索引のファイルを読めないときは、『文書を探す』と同じくツールのエラーにし、何も書かない
refs:
  - dev/設計書/ER図/索引#
test_file: tests/integration/ClaudeCodeプラグイン/update-index.test.ts
