summary: "Claude Code プラグインの MCP のツールと PreToolUse のフック"
docs_index: true
items:
  - page: 点検する.ts.yaml
    summary: mdmark check と同じ点検をし、ずれの一覧を返す（check）
  - page: 文書をHTMLに書き出す.ts.yaml
    summary: mdmark export と同じ処理で 1 文書を 1 枚の HTML に書き出す（export_html）
  - page: 複数の文書を1枚のHTMLにまとめる.ts.yaml
    summary: mdmark build と同じ処理で文書を 1 枚の HTML にまとめる（build_site）
  - page: MCPサーバーを起動・停止する.ts.yaml
    summary: MCP の常駐サーバーを 127.0.0.1 の Streamable HTTP で起動し、instructions とツールを返し、シグナルで停止する（mdmark serve）
  - page: 作業のフォルダを引数に入れる.ts.yaml
    summary: 作業のフォルダを使うツールの引数に、PreToolUse のフックで project_dir を入れる
  - page: CSSのテンプレートの一覧を返す.ts.yaml
    summary: 端末の設定のフォルダの CSS のテンプレートを、名前・説明・タグ・パスつきで返す（list_templates）
  - page: CSSのテンプレートを登録する.ts.yaml
    summary: 作業のフォルダの CSS をテンプレートにコピーし、名前・説明・タグを索引に記載する（add_template）
  - page: CSSのテンプレートを配置する.ts.yaml
    summary: テンプレートの CSS を配置先へコピーし、theme に記載する値を返す（apply_template）
