summary: "Claude Code プラグインの MCP のツール・フックと、スキルが呼ぶスクリプト"
docs_index: true
items:
  - page: 点検する.ts.yaml
    summary: mdmark check と同じ点検をし、ずれの一覧を返却する（check）
  - page: 文書をHTMLに書き出す.ts.yaml
    summary: mdmark export と同じ処理で 1 文書を 1 枚の HTML に書き出す（export_html）
  - page: 複数の文書を1枚のHTMLにまとめる.ts.yaml
    summary: mdmark build と同じ処理で文書を 1 枚の HTML にまとめる（build_site）
  - page: MCPサーバーを起動・停止する.ts.yaml
    summary: MCP の常駐サーバーを 127.0.0.1 の Streamable HTTP で起動し、instructions とツールを返却し、シグナルで停止する（mdmark serve）
  - page: 作業のフォルダを引数に入れる.ts.yaml
    summary: 作業のフォルダを使用するツールの引数に、PreToolUse のフックで project_dir を入れる
  - page: 常駐サーバーの状態を伝える.ts.yaml
    summary: SessionStart で常駐サーバーのポートを確認し、待ち受けていないときだけ global-setup での起動の仕方を 1 行で指定する
  - page: 端末の状態を調べる.ts.yaml
    summary: 端末の設定のパスとバージョン・tmux のセッション名・待ち受けているか・ログの場所を返却する（setup.js status）
  - page: 設定のキーの一覧を返却する.ts.yaml
    summary: 設定の Schema のキーごとに今の値・既定・説明を返却する（setup.js keys）
  - page: 端末の設定を書き込む.ts.yaml
    summary: 回答した値で端末の設定を作る・書き換え、既定のパスでなければ settings.json の env に MDMARK_CONFIG を書き込む（setup.js write-settings）
  - page: 常駐サーバーを起動する.ts.yaml
    summary: tmux のセッションで mdmark serve を起動し、待ち受けと tools/list を確認する（setup.js start-server）
  - page: 文書のフォルダの設定を書き込む.ts.yaml
    summary: 回答した値で文書のフォルダの mdmark.config.yaml を作る・書き換える（setup.js write-config）
  - page: CSSのテンプレートの一覧を返却する.ts.yaml
    summary: 端末の設定のフォルダの CSS のテンプレートを、名前・説明・タグ・パスつきで返却する（list_templates）
  - page: CSSのテンプレートを登録する.ts.yaml
    summary: 作業のフォルダの CSS をテンプレートにコピーし、名前・説明・タグを索引に記載する（add_template）
  - page: CSSのテンプレートを配置する.ts.yaml
    summary: テンプレートの CSS を配置先へコピーし、theme に記載する値を返却する（apply_template）
