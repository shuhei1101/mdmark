id: IF-472-6
title: 常駐サーバーの状態を伝える
entry:
  kind: trigger
  value: SessionStart（`node ${CLAUDE_PLUGIN_ROOT}/scripts/session-start.js`）
flows:
  - name: 正常系
    summary: 常駐サーバーが待ち受けていれば何も出さない
    setup:
      - name: 待ち受けるポート
        description: '`MDMARK_PORT` のポートで、テストが TCP の接続を受けるサーバーを起動する'
      - name: Mock
        description: ビルドした `plugin/scripts/session-start.js` を子プロセスで実行し、標準入力に SessionStart の入力の JSON を指定する
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant H as session-start.js
        participant S as 常駐サーバー
        C->>H: SessionStart の入力
        H->>S: TCP でつなぐ
        S-->>H: 接続を受けた
        H-->>C: 何も出さない・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が空
    test: test_normal
  - name: 正常系（待ち受けていない）
    summary: 待ち受けていなければ additionalContext に 1 行を出す
    setup:
      - name: 空いたポート
        description: '`MDMARK_PORT` に待ち受けるプロセスの無いポート'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant H as session-start.js
        C->>H: SessionStart の入力
        H->>H: 接続を拒否された
        H-->>C: additionalContext の 1 行・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力の JSON の `hookSpecificOutput.hookEventName` が `SessionStart`
      - '`hookSpecificOutput.additionalContext` が 1 行で、`127.0.0.1:{ポート}` と `/mdmark:global-setup` を含む'
    test: test_normal_when_not_listening
lead: セッションの開始で、常駐サーバーのポートが待ち受けているかを確認し、待ち受けていないときだけ、そのことと `global-setup` で起動できることを 1 行で指定する。
test_file: tests/integration/ClaudeCodeプラグイン/session-start.test.ts
idempotent: true
side_effects: なし
callers:
  - SC-472-22#
request:
  - name: MDMARK_PORT
    type: string
    required: false
    default: '8782'
    location: argument
    description: 確認するポート（環境変数）
response:
  - name: hookSpecificOutput.hookEventName
    type: '"SessionStart"'
    description: 待ち受けていないときだけ出す
  - name: hookSpecificOutput.additionalContext
    type: string
    description: 待ち受けていないことと `/mdmark:global-setup` で起動できることの 1 行
exceptions:
  - name: なし（正常終了）
    condition: どの場合も終了コード 0
constraints:
  - item: 待ち
    constraint: '`127.0.0.1:{ポート}` への TCP の接続の待ちは 1 秒。超えたら待ち受けていないとする'
  - item: 出す文
    constraint: 待ち受けているときは何も出さない
    decided_by: SC-472-22#
  - item: 終了コード
    constraint: '`MDMARK_PORT` が使用できない値でも 0 で終わり、使用できない値であることを 1 行で出す'
