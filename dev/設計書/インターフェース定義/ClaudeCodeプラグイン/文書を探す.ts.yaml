title: "文書を探す"
entry:
  kind: mcp_tool
  value: find_docs
flows:
  - name: 正常系
    summary: 題の一部で索引にある文書だけを、既定の項目の Markdown の表で返す
    setup:
      - name: 作業のフォルダ
        description: 設定・索引と文書 2 つ。索引に載っているのは 1 つ目（`a`、題「文書 A」、タグ `設計`）だけ
      - name: Mock
        description: Claude Code の代わりに、MCP サーバーを作業のフォルダで子プロセスとして起動し、標準入出力でつなぐ MCP のクライアント
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（text: 文書 A）
        S->>F: 設定・索引・文書を読む
        S-->>C: 総件数の行と a の表
    expected:
      - 結果が text だけで、structuredContent を持たない
      - text の先頭の行が、総件数 1 件・返した件数 1 件と、`a.md` の文字数と同じ合計文字数を示す
      - 表の行が `a` の 1 行だけで、列が ID・題・概要・タグ・文字数
      - 索引と文書が変わっていない
    test: test_normal
  - name: 正常系（当たらない）
    summary: どの文書にも無い語では総件数 0 件の結果を返す
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: find_docs（text: どの文書にも無い語）
        S-->>C: 総件数 0 件の結果
    expected:
      - 総件数 0 件で、`isError` が立たない
    test: test_normal_when_no_match
  - name: 正常系（関係する文書）
    summary: related_to で参照先と被参照の文書を返す
    setup:
      - name: 参照を持つ作業のフォルダ
        description: '索引に文書 `a`・`b`・`c`・`d`・`e` がある。`a` は `related` に `{to: b, type: requires, when: a の前提を確かめるとき}`、`c` は `related` に `{to: a, type: part_of, when: 全体の中の位置を確かめるとき}` を持ち、`d` は `related` を持たず本文が `a.md` へリンクする。`e` はどの文書とも参照し合わない'
        notes: 自分からの関連・相手からの関連・本文のリンクだけの参照を、文書 1 つずつに置く
      - name: Mock
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（related_to: a、format: json）
        S->>F: 設定・索引・文書を読む
        S->>S: 参照の表を作り、a との関係を索引の関連から引く
        S-->>C: docs（b・c・d、relations つき）
      ```
    expected:
      - '`docs` が `b`・`c`・`d` の 3 件で、`a` と `e` を含まない'
      - '`b` の `relations` が `[{direction: "outgoing", type: "requires", when: "a の前提を確かめるとき"}]`'
      - '`c` の `relations` が `[{direction: "incoming", type: "has_part", when: "全体の中の位置を確かめるとき"}]`'
      - '`d` の `relations` が `[{direction: "incoming", type: null, when: null}]`'
    test: test_normal_when_related_to
  - name: 正常系（タグを AND と OR で絞る）
    summary: tags で全てを持つ文書、any_tags でどれかを持つ文書を、主題のタグが当たる文書を上にして返す
    setup:
      - name: タグを持つ作業のフォルダ
        description: '語彙に `topic:mcp`・`topic:yaml` を持つ索引と文書 3 つ。`docs` の並びは `c`（`topic:yaml`）・`a`（`{name: topic:mcp, main: true}`）・`b`（`topic:mcp` と `{name: topic:yaml, main: true}`）'
        notes: 主題のタグが当たる文書を上にした並びが索引の並びと違うことを、`c` を先頭に置いて起こす
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（tags: topic:mcp・topic:yaml、format: json）
        S->>F: 設定・索引・文書を読む
        S-->>C: docs（b）
        C->>S: find_docs（any_tags: topic:mcp・topic:yaml、format: json）
        S->>S: 主題のタグが当たる文書を上に並べる
        S-->>C: docs（a・b・c）と tag_counts
    expected:
      - '`tags` の結果の `docs` が `b` だけ'
      - '`any_tags` の結果の `docs` が `a`・`b`・`c` の順'
      - '`any_tags` の結果の `a` の `tags` が `[{name: "topic:mcp", main: true}]`、`c` の `tags` が `[{name: "topic:yaml", main: false}]`'
      - '`any_tags` の結果の `tag_counts` が `topic:mcp` 2 件・`topic:yaml` 2 件'
    test: test_normal_when_tags_and_or
  - name: 正常系（語彙で引くタグ）
    summary: 語彙の別名を語彙のタグに直して引き、語彙に無いタグは拒まず警告と近いタグを添える
    setup:
      - name: タグの別名を持つ作業のフォルダ
        description: タグを AND と OR で絞るフローと同じ作業のフォルダで、語彙の `topic:mcp` が `aliases` に `MCP` を持つ
      - name: Mock
        description: 正常系と同じ
      - name: 語彙に無いタグ
        description: '`topic:mcp` に 1 文字違いの `topic:mcq`'
        notes: 近いタグに `topic:mcp` が選ばれることを起こす
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（tags: MCP、format: json）
        S->>F: 設定・索引・文書を読む
        S->>S: 別名を語彙のタグに直す
        S-->>C: docs（a・b）
        C->>S: find_docs（tags: topic:mcq、format: json）
        S-->>C: total 0 と warnings
    expected:
      - '`tags: ["MCP"]` の結果の `docs` が `a`・`b`'
      - '`tags: ["topic:mcq"]` の結果が `isError` を立てず、`total` が 0'
      - '`tags: ["topic:mcq"]` の結果の `warnings` が 1 つで、`topic:mcq` と `topic:mcp` を含む'
    test: test_normal_when_tag_vocabulary
  - name: 正常系（既定の件数で続きを引く）
    summary: 引数なしで先頭の 20 件と next_cursor を返し、next_cursor で残りを返す
    setup:
      - name: 文書の多い作業のフォルダ
        description: 文書 25 個を全て載せた索引。全ての文書がタグ `設計` を持つ
        notes: 既定の件数 20 を超える数で、続きがあることを起こす
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（format: json）
        S->>F: 設定・索引・文書を読む
        S-->>C: docs（先頭の 20 件）と next_cursor
        C->>S: find_docs（cursor: next_cursor、format: json）
        S-->>C: docs（残りの 5 件）
    expected:
      - 1 回目の `docs` が索引の並びの先頭 20 件で、`total` が 25、`returned` が 20
      - 1 回目の `total_chars` が 25 個の文書の文字数の合計で、`tag_counts` が `設計` 25 件
      - 1 回目の `next_cursor` が null でなく、`hint` が `tags`・`any_tags`・`text`・`count_only` を含む
      - 2 回目の `docs` が残りの 5 件で、`next_cursor` と `hint` が null
    test: test_normal_when_paged
  - name: 正常系（件数だけ）
    summary: count_only で文書の行を返さず、総件数・合計文字数・タグごとの件数だけを返す
    setup:
      - name: タグを持つ作業のフォルダ
        description: タグを AND と OR で絞るフローと同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（any_tags: topic:mcp・topic:yaml、count_only: true、format: json）
        S->>F: 設定・索引・文書を読む
        S-->>C: total・total_chars・tag_counts
        C->>S: find_docs（any_tags: topic:mcp・topic:yaml、format: json）
        S-->>C: docs（a・b・c）
    expected:
      - 件数だけの結果が `docs`・`returned`・`next_cursor`・`omitted` を持たない
      - 件数だけの結果の `total` が 3
      - 件数だけの `total_chars` が、2 回目の `docs` の `chars` の合計と同じ
    test: test_normal_when_count_only
  - name: 正常系（返す量と形式を変える）
    summary: 既定では省いた項目と取り方を返し、include で項目を加え、json で structuredContent と text に同じ JSON を返す
    setup:
      - name: 作業のフォルダ
        description: 正常系と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（text: 文書 A、format: json）
        S->>F: 設定・索引・文書を読む
        S-->>C: docs と omitted
        C->>S: find_docs（text: 文書 A、include: path、format: json）
        S-->>C: path を持つ docs
    expected:
      - '1 回目の `omitted` が `path`・`aliases`・`related`・`referenced_by` を持ち、`path` の `how` が `include: ["path"]`'
      - 1 回目の `docs[0]` が `path` を持たない
      - 2 回目の `docs[0].path` が `a.md` で、`omitted` が `path` を持たない
      - どちらの結果も、structuredContent と、text を JSON として読んだ値が同じ
    test: test_normal_when_view_and_format
  - name: 異常系（設定に索引が無い・ツールのエラー）
    summary: 設定に index が無いときはエラーにする
    setup:
      - name: 索引の無い設定
        description: '`index` を持たない `mdmark.config.yaml` を置いたフォルダ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: find_docs
        S->>S: 設定に index が無い
        S-->>C: isError（設定に index を書くこと）
    expected:
      - '`isError` が立つ'
      - 内容の文に、設定に `index` が無いことと、`index` に索引のファイルを書くことが出る
    test: test_error_when_index_missing
  - name: 異常系（cursor を読めない・ツールのエラー）
    summary: 読めない cursor と、条件を変えた cursor はエラーにする
    setup:
      - name: 文書の多い作業のフォルダ
        description: 既定の件数で続きを引くフローと同じ
      - name: Mock
        description: 正常系と同じ
      - name: 読めない cursor
        description: '`cursor` に `not-a-cursor` を渡す。続けて、`tags: ["設計"]` で得た `next_cursor` を `text` を加えた呼び出しに渡す'
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        C->>S: find_docs（cursor: not-a-cursor）
        S-->>C: isError（cursor を読めない）
        C->>S: find_docs（tags: 設計、text: 文書、cursor: tags だけで得た next_cursor）
        S-->>C: isError（条件が違う）
    expected:
      - どちらも `isError` が立つ
      - 内容の文に、`cursor` を読めないか条件が違うことと、`cursor` を省いて先頭から引き直すことが出る
    test: test_error_when_cursor_invalid
  - name: 正常系（全角と半角だけが違う語）
    summary: 全角と半角・大文字と小文字だけが違う語でも、別名に当たる文書を返す
    setup:
      - name: 作業のフォルダ
        description: 正常系の索引の 1 つ目の文書 `a` の `aliases` に `MCP` を加えたもの
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant C as Claude Code
        participant S as MCP サーバー
        participant F as 作業のフォルダ
        C->>S: find_docs（text: ＭＣＰ）
        S->>F: 設定・索引・文書を読む
        S->>S: 語と題・別名・概要を正規化して比べる
        S-->>C: 総件数の行と a の表
    expected:
      - 総件数が 1 件で、表の行が `a` の 1 行だけ
    test: test_normal_when_width_differs
lead: 設定の `index` の索引から、題・別名・概要の部分一致、タグの AND / OR、関係する文書で文書を引き、主題のタグが当たる文書を上にして既定の件数ずつ返す。返す項目は `view` と `include` / `exclude` で、形式は `format` で選ぶ。
idempotent: true
side_effects: なし（索引と文書を書き換えない）
request:
  - name: text
    type: string
    required: false
    default: なし（語で絞らない）
    location: argument
    description: 題（`title`）・別名（`aliases`）・概要（`description`）のどれかに含まれる語。語と題・別名・概要の両方を NFKC・英字の小文字化・前後の空白の除去で正規化して比べる
  - name: tags
    type: string[]
    required: false
    default: なし（タグで絞らない）
    location: argument
    description: 全てを持つ文書に絞るタグ（AND）
    notes: 語彙の `aliases` に当たるタグは、そのタグの `name` として引く。空の配列は省いたときと同じくタグで絞らない
  - name: any_tags
    type: string[]
    required: false
    default: なし（タグで絞らない）
    location: argument
    description: どれかを持つ文書に絞るタグ（OR）
    notes: '`tags` と一緒に渡すと、両方の条件を満たす文書に絞る。別名の扱いと空の配列の扱いは `tags` と同じ'
  - name: related_to
    type: string
    required: false
    default: なし（関係で絞らない）
    location: argument
    description: この文書の ID から参照している文書と、この文書を参照している文書（被参照）に絞る。引いた各行に、その文書との関係（`relations`）を添える
  - name: limit
    type: number
    required: false
    default: '20'
    location: argument
    description: 1 回に返す文書の件数
    constraints: 1 以上 100 以下の整数
  - name: cursor
    type: string
    required: false
    default: なし（先頭から返す）
    location: argument
    description: 前の結果の `next_cursor`。続きの文書を返す
    notes: 絞り込みの条件（`text`・`tags`・`any_tags`・`related_to`）は前の呼び出しと同じにする
  - name: view
    type: "'brief' | 'standard' | 'full'"
    required: false
    default: brief
    location: argument
    description: 各行に返す項目の組。`brief` は ID・題・概要・タグ・文字数、`standard` は `brief` にパス・別名を加え、`full` は `standard` に関連する文書・被参照の数を加える
  - name: include
    type: ('path' | 'aliases' | 'related' | 'referenced_by')[]
    required: false
    default: なし（`view` のとおり）
    location: argument
    description: '`view` の組に加える項目'
  - name: exclude
    type: ('path' | 'aliases' | 'related' | 'referenced_by')[]
    required: false
    default: なし（`view` のとおり）
    location: argument
    description: '`view` の組から除く項目'
    notes: '`include` の後に当てる。`brief` の項目は除けない'
  - name: count_only
    type: boolean
    required: false
    default: 'false'
    location: argument
    description: '`true` のとき、文書の行を返さず、総件数・合計文字数・タグごとの件数だけを返す'
  - name: format
    type: "'markdown' | 'json'"
    required: false
    default: markdown
    location: argument
    description: 結果の形式。`markdown` は Markdown のテキストだけを返し、`json` は structuredContent と text に同じ JSON を入れる
  - name: config
    type: string
    required: false
    default: なし（MCP サーバーの作業のフォルダから上へ `mdmark.config.yaml` を探す）
    location: argument
    description: 使う設定ファイルのパス
request_example: |-
  ```json
  {"tags": ["設計"], "include": ["path"], "format": "json"}
  ```
response:
  - name: total
    type: number
    description: 条件に当たった文書の総件数
  - name: returned
    type: number
    description: この結果で返した文書の件数
    notes: '`count_only` のときは返さない'
  - name: total_chars
    type: number
    description: 条件に当たった全ての文書の文字数の合計
    notes: 文字数を数えられない文書（`chars` が null）は足さない
  - name: next_cursor
    type: string | null
    description: 続きを返す `cursor` の値。続きが無ければ null
    notes: '`count_only` のときは返さない'
  - name: hint
    type: string | null
    description: 続きがあるとき、絞り込める引数（`tags`・`any_tags`・`text`・`count_only`）を案内する日本語の 1 文。続きが無ければ null
    notes: '`count_only` のときは返さない'
  - name: tag_counts[].name
    type: string
    description: 当たった全ての文書が持つタグの名前。語彙の別名は語彙の `name` にそろえる
  - name: tag_counts[].count
    type: number
    description: そのタグを持つ、当たった文書の件数
  - name: warnings
    type: string[]
    description: 語彙に無いタグを `tags`・`any_tags` に渡したときの警告。タグごとに、語彙に無いことと近いタグを書いた日本語の 1 文
  - name: omitted[].field
    type: "'path' | 'aliases' | 'related' | 'referenced_by'"
    description: この結果で省いた項目
    notes: '`count_only` のときは返さない'
  - name: omitted[].how
    type: string
    description: '省いた項目の取り方（`include: ["path"]` など）'
  - name: docs[].id
    type: string
    description: 文書の ID
    notes: '`count_only` のときは `docs` を返さない'
  - name: docs[].title
    type: string
    description: 題
  - name: docs[].description
    type: string | null
    description: 概要。索引に無いときは null
  - name: docs[].tags[].name
    type: string
    description: タグの名前。索引の文字列の要素は、その文字列
  - name: docs[].tags[].main
    type: boolean
    description: 主題のタグか。索引の文字列の要素は false
  - name: docs[].chars
    type: number | null
    description: 文書のファイルの文字数（Unicode のコードポイントの数）。ファイルが無い・読めないときは null
  - name: docs[].path
    type: string
    description: 文書のパス（索引のファイルからの相対パス）
    notes: '`standard`・`full` か `include` に `path` を渡したときだけ返す'
  - name: docs[].aliases
    type: string[]
    description: 文書の別名
    notes: '`standard`・`full` か `include` に `aliases` を渡したときだけ返す'
  - name: docs[].related
    type: "{ to: string; type: 'requires' | 'references' | 'replaces' | 'part_of' | 'change_together' | null; when: string | null; paths?: string[] }[]"
    description: 索引に記載した関連。索引の文字列の要素は、`to` がその文字列で `type` と `when` が null の要素にする
    notes: '`full` か `include` に `related` を渡したときだけ返す'
  - name: docs[].referenced_by
    type: number
    description: この文書を参照している文書の数（被参照の数）
    notes: '`full` か `include` に `referenced_by` を渡したときだけ返す'
  - name: docs[].relations[].direction
    type: "'outgoing' | 'incoming'"
    description: 関係の向き。`outgoing` は `related_to` の文書からこの行の文書へ、`incoming` はこの行の文書から `related_to` の文書へ
    notes: '`related_to` を渡したときだけ `relations` を返す。並びは `outgoing` → `incoming`、同じ向きの中は索引の関連 → 本文のリンク → 別名の出現'
  - name: docs[].relations[].type
    type: "'requires' | 'references' | 'replaces' | 'part_of' | 'change_together' | 'required_by' | 'referenced_by' | 'replaced_by' | 'has_part' | null"
    description: '`related_to` の文書から見た関係の種類。索引の関連は、`outgoing` なら記載した `type`、`incoming` なら逆向きの名前（`requires` → `required_by`、`references` → `referenced_by`、`replaces` → `replaced_by`、`part_of` → `has_part`、`change_together` はそのまま）。本文のリンクと別名の出現だけで当たったものと、索引の文字列の要素は null'
  - name: docs[].relations[].when
    type: string | null
    description: 索引の関連に記載した `when`。`type` が null の関係は null
response_example: |-
  `format: "json"` のとき:

  ```json
  {"total": 25, "returned": 20, "total_chars": 48210, "next_cursor": "eyJvZmZzZXQiOjIwfQ", "hint": "続きがあります。tags・any_tags・text で絞るか、count_only で件数だけを確かめてください。", "tag_counts": [{"name": "設計", "count": 25}], "warnings": [], "omitted": [{"field": "aliases", "how": "include: [\"aliases\"]"}, {"field": "related", "how": "include: [\"related\"]"}, {"field": "referenced_by", "how": "include: [\"referenced_by\"]"}], "docs": [{"id": "arch", "title": "アーキテクチャ", "description": "全体の構成と依存の向き", "tags": [{"name": "設計", "main": true}], "chars": 2410, "path": "設計/arch.md"}]}
  ```

  `format: "markdown"` のとき（text だけ）:

  ```markdown
  総件数 25 件・返した件数 20 件・合計文字数 48210・next_cursor: eyJvZmZzZXQiOjIwfQ

  | ID | 題 | 概要 | タグ | 文字数 | パス |
  | --- | --- | --- | --- | --- | --- |
  | arch | アーキテクチャ | 全体の構成と依存の向き | 設計（主題） | 2410 | 設計/arch.md |

  タグごとの件数: 設計 25

  省いた項目: aliases（include: ["aliases"]）・related（include: ["related"]）・referenced_by（include: ["referenced_by"]）

  続きがあります。tags・any_tags・text で絞るか、count_only で件数だけを確かめてください。
  ```
exceptions:
  - name: なし（正常終了）
    condition: 索引を読めた。当たる文書が 0 件でも `total` 0 件の結果を返す。語彙に無いタグを渡したときも拒まず、`warnings` を添えて返す
  - name: ツールのエラー（設定に索引が無い）
    condition: 設定に `index` が無い
  - name: ツールのエラー（cursor を読めない）
    condition: '`cursor` がこのツールの返した `next_cursor` として読めない、または絞り込みの条件が `next_cursor` を返した呼び出しと違う'
error_format: 'ツールの結果を `isError: true` にし、内容のテキストに、何が合わないかと直し方を日本語の 1 文で書く。'
constraints:
  - item: 絞り込みの組み合わせ
    constraint: 渡した条件を全て満たす文書を返す。条件を 1 つも渡さなければ全ての文書が当たり、既定の件数の先頭のページを返す
  - item: 並び
    constraint: '`tags`・`any_tags` のタグ（別名を語彙の `name` にそろえた後）のどれかが主題のタグ（`main: true`）に当たる文書を上にし、同じ順位の中は索引の `docs` の並び。タグで絞らないときは索引の `docs` の並び'
  - item: 件数と続き
    constraint: 並べた後の先頭から `limit` 件を返す。続きがあれば `next_cursor` に、次の先頭の位置と絞り込みの条件を読める文字列を入れる。`total`・`total_chars`・`tag_counts` は、返した件数ではなく当たった全ての文書で数える
  - item: 文字数
    constraint: 索引に載った文書のファイルを読み、Unicode のコードポイントの数を数える。ファイルが無い・読めない文書は `chars` を null にして行を返し、`total_chars` に足さない
  - item: タグごとの件数
    constraint: 件数の多い順、同じ件数は語彙の並び、語彙に無いタグはその後に名前の順
  - item: 語彙に無いタグ
    constraint: 索引が語彙（`tags`）を持つときだけ、`tags`・`any_tags` の語彙に無いタグごとに `warnings` を 1 つ加え、そのタグのまま引く。近いタグの選び方は『索引を点検する』の `unregistered_tag` と同じ
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/索引を点検する.ts#constraints[タグの点検]
  - item: 返す項目
    constraint: '`view` の組に `include` を加え、`exclude` を除いた項目を返す。`brief` の項目（ID・題・概要・タグ・文字数）は除けない。返さない `path`・`aliases`・`related`・`referenced_by` を `omitted` に、`include` での取り方を添えて並べる'
  - item: 返す形式
    constraint: '`markdown` は先頭に総件数・返した件数・合計文字数・`next_cursor` の行、文書の表（列は返す項目。主題のタグに `（主題）` を付ける）、タグごとの件数・省いた項目・警告・案内の行を並べたテキストだけを返し、structuredContent を返さない。`json` はレスポンスのオブジェクトを structuredContent に入れ、同じ JSON の文字列を text に入れる'
  - item: readOnlyHint
    constraint: 'ツールの annotations に `readOnlyHint: true` を付ける'
  - item: 設定ファイルと索引を読めないとき
    constraint: 設定ファイルが無い・読めないときと、索引のファイルを読めないときは、『点検する』の設定ファイルが無いときと同じくツールのエラーにする
