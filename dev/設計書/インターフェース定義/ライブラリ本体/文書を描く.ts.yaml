      - 3 つ目と 4 つ目のタブ群は `macOS` のタブの `aria-selected` が `true` のまま
      - フォーカスが 1 つ目のタブ群の `Windows` のタブにある
      - localStorage の `mdmark-tabs:os` が `Windows`
