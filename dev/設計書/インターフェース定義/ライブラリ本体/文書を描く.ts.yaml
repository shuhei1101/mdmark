        description: 取り出し元はページの中でメモリーから返す。外の依存は無い
        notes: '-'
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant S as 取り出し元
        P->>M: mount(el, { markdown, docId, diffSource })
        M->>P: 文書を描き、題の後ろに「変更を見る」を置く
        P->>M: 「変更を見る」を押す
        M->>S: revisions(guide)
        S-->>M: r3・r2・r1
        M->>S: content を r2 と r3 で
        S-->>M: 2 つの Markdown
        M->>P: 本文を隠し、差分を出す
    expected:
      - '`mount` の直後は `revisions` が呼ばれず、本文の列（`div.mdmark-content`）の中で `h1` とその節の中身（`mdmark-section-body`）の間に `aria-expanded="false"` の「変更を見る」のボタンがある'
      - 押すと、ボタンが `aria-expanded="true"` になり、`h1` を残して `h1` の節の中身と右側の目次（`aside.mdmark-side-toc`）が隠れる
      - 差分を開いたまま `h1` の開閉のボタンを 2 回押しても、`h1` の節の中身は隠れたままで、「変更を見る」と差分の場所は出たまま
      - '`revisions` が `guide` で 1 回、`content` が `{ docId: "guide", revisionId: "r2" }` と `{ docId: "guide", revisionId: "r3" }` で 1 回ずつ呼ばれる'
      - 前の選ぶ欄で `r2`、後の選ぶ欄で `r3` が選ばれ、前の欄の `r3` と後の欄の `r2`・`r1` を選べない
      - 消した行が `data-kind="del"` で行頭に `-` を持ち、足した行が `data-kind="add"` で行頭に `+` を持つ
      - 語を書き換えた行の対で、`del` が `差分` だけ、`ins` が `変更` だけを囲む
      - '`role="status"` の要素が `削除した行 2・追加した行 2` を持つ'
      - ミニマップの帯があり、消した行と足した行の印を持つ
      - もう一度「変更を見る」を押すと、差分の場所が隠れ、右側の目次が戻り、`h1` の節の中身は 2 回押した後の状態（開いた状態）で出る
