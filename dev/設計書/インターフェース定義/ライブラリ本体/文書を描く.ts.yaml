exclusivity: 同じ要素へ 2 回目の `mount` を呼ぶと、前の `mount` の `destroy` を先に行う。`update`・`destroy` の後に、前の描画で始めた外部ライブラリの読み込みが終わっても、その結果は描かない
request:
  - name: el
    type: HTMLElement
    required: true
    location: argument
    description: 描く先の要素
  - name: opts.markdown
    type: string
    required: true
    location: argument
    description: 描く Markdown
  - name: opts.config
    type: MdmarkConfig
    required: false
    default: なし（全てのキーに既定を当てる）
    location: argument
    description: 使う側のサーバーが `mdmark.config.yaml` を読んだオブジェクト。省いたキーには既定を当てる
  - name: opts.config.features
    type: Record<string, boolean>
    required: false
    default: '`comments` を除く全ての機能が `true`'
    location: argument
    description: '機能のオン・オフの既定。文書の `<!-- features: +機能 -機能 -->` がその文書だけ上書きする'
    notes: 知らない機能名は無視する。機能は `print`（印刷の前に折り畳みと記法を開く）と、記法ごとの `table`・`callout`・`tabs`・`steps`・`tree`・`badge`・`code`・`toc`・`side-toc`（右側の目次）・`anchors`・`sections`・`row-details`・`figures`、図の部品の `diagrams`、埋め込んだ HTML の `html`、図と埋め込んだ HTML のヒント（`data-hint`・`hint`・`io`・線の `tip`）のツールチップの `hints`、用語のツールチップの `glossary`、被参照の一覧と文書の別名の `backlinks`、ビューの印の `views`、選んだ箇所へのコメントの `comments`（`comments` だけ既定は `false`）
  - name: opts.config.libraries
    type: Record<string, string>
    required: false
    default: '`{}`'
    location: argument
    description: 印の名前から外部ライブラリのモジュールの URL を引く対応表。mdmark が持つ既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は足す
    constraints: URL はページの `document.baseURI` を基準に解決する
    example: '{ "test-lib": "/fixtures/test-lib.js" }'
    notes: '無い名前を足せることは確認ログの決定（推奨案 A）。#6 の `registerComponent()` との棲み分けは #6 が決める'
  - name: opts.index
    type: MdmarkIndex
    required: false
    default: なし（描く文書の用語集の表だけで用語を照合し、被参照を出さない）
    location: argument
    description: 使う側のサーバーが、設定の `index` のパスの索引の YAML を読んだオブジェクト。形は ER 図『索引』
    notes: Schema に合わない文書・用語の項目は除いて使い、例外を投げない
  - name: opts.docId
    type: string
    required: false
    default: なし（被参照の一覧を出さず、関連文書のリンクは索引の `path` のままにする）
    location: argument
    description: 描く文書の索引の `id`。被参照の一覧を引き、関連文書から自分を除き、リンクの相対パスを求めるのに使う
    example: arch
    notes: 索引に無い `id` は渡さないときと同じに扱う
  - name: opts.references
    type: MdmarkReferences
    required: false
    default: なし（被参照は索引の `related` だけから出し、ほかの文書の用語集の表の用語を照合しない）
    location: argument
    description: '`collectReferences` が返した参照の表。被参照の一覧と、ほかの文書の用語集の表の用語に使う'
    notes: 形はインターフェース定義『参照の表を作る』のレスポンス。`glossary[].avoid` が無い用語は、やめた言い方を持たない用語として扱う
  - name: opts.diffSource
    type: DiffSource
    required: false
    default: なし（差分を開く UI を付けない）
    location: argument
    description: 文書のリビジョンの一覧と、リビジョンごとの本文を返す取り出し元。渡すと、描いた文書に差分を開く UI が付く
    constraints: '`opts.docId` と一緒に渡す'
    notes: 形は制約の「差分の取り出し元」。Git・YAML の読み方は mdmark が持たず、使う側が書く
  - name: opts.commentStore
    type: MdmarkCommentStore
    required: false
    default: なし（コメントを付けられない）
    location: argument
    description: コメントを読み込み、保存する関数。`comments` がオンのときだけ使う
    constraints: '`opts.docId` と一緒に渡す'
    notes: 形は制約の「コメントの読み書きの関数」。保存先は mdmark が持たず、使う側が書く
  - name: opts.config.tooltips.placement
    type: '"top" | "bottom"'
    required: false
    default: '`top`'
    location: argument
    description: 用語・図・ヒントのツールチップを、持ち主の上と下のどちらに先に出すか
    notes: '`top` は上に出し、上に収まらないときだけ下に出す。`bottom` は下に出し、下に収まらず上に収まるときだけ上に出す。他の値は無視して `top` にする'
  - name: opts.config.syntax.url
    type: string
    required: false
    default: '`https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/`'
    location: argument
    description: 色分けのライブラリ（highlight.js）の `es/` フォルダの URL。本体を `{url}core.min.js`、言語を `{url}languages/{言語}.min.js` から読む
    constraints: 末尾は `/`。URL はページの `document.baseURI` を基準に解決する。文字列でない値は無視して既定を当てる
    example: '"/vendor/highlightjs/es/"'
    notes: 印の名前の対応表 `libraries` とは分け、文書に `<!-- syntax -->` のような印を書かせない
  - name: opts.config.side-toc.mode
    type: '"hover" | "fixed"'
    required: false
    default: '`hover`'
    location: argument
    description: 右側の目次の出し方。`hover` は右端にポインターかフォーカスがある間だけ出し、`fixed` は目次を出すボタンで出し続ける
    notes: 他の値は無視して `hover` にする。`side-toc` がオフのときは使わない
  - name: opts.aliases
    type: MdmarkAlias[]
    required: false
    default: なし（エイリアスを照合しない）
    location: argument
    description: 使う側が `buildAliases` で作ったエイリアスの並び。形は ER 図『エイリアス』
    notes: 使えないエイリアスは除いて使い、例外を投げない。`update` は描いたときのエイリアスを使う
    status: planned
  - name: opts.config.colorTheme
    type: '"dev-swiss" | "theme-paper" | "theme-slate" | "theme-contrast"'
    required: false
    default: '`dev-swiss`'
    location: argument
    description: 描いた文書の配色の値の組を選ぶテーマの名前。明暗は制約「配色の切り替え」のまま、選んだテーマの中で選ぶ
    notes: 知らない名前と文字列でない値は無視して `dev-swiss` で描く（例外を出さない）。使う側の CSS のパスの `theme` とは別のキー
    status: planned
  - name: opts.diffMode
    type: '"button" | "open" | "blocks"'
    required: false
    default: '`button`'
    location: argument
    description: 差分の出し方。`button` は読む人が「変更を見る」を押してから差分の行を出し、`open` は描いた時点で押した状態にして差分の行を出す。`blocks` は「変更を見る」と差分の場所を置かず、描いた文書のブロックを追加と削除の色で塗り分ける
    notes: '`opts.diffSource` を渡さないときは使わない。他の値は無視して `button` にする（制約「差分の出し方」）'
    status: planned
request_example: |-
  ```json
  {
    "markdown": "# 見出し\n\n<!-- features: -print -->\n\n本文",
    "config": {
      "features": { "print": true },
      "libraries": { "test-lib": "/fixtures/test-lib.js" }
    }
  }
  ```
response:
  - name: update
    type: '(markdown: string) => void'
    description: 本文だけを描き直し、記法の操作を付け直す。設定は `mount` に渡したものを使う
    notes: '`destroy` の後は何もしない'
  - name: destroy
    type: () => void
    description: '`el` の中を空にして class `mdmark` を外し、記法の操作と `beforeprint`・`afterprint`・`hashchange`・`document` の受け取りを外す'
    notes: 2 回目以降は何もしない
exceptions:
  - name: なし（正常終了）
    condition: Markdown を描き、戻り値を返す
  - name: なし（知らせの枠）
    condition: 外部ライブラリのモジュールを読めない、またはモジュールの `draw` が例外を投げる
    notes: 例外を投げず、その印の場所だけを知らせの枠に替える。印の名前・URL・元のエラーを `console.error` に出す
  - name: TypeError
    condition: '`opts.diffSource` を渡し、`opts.docId` を渡さない'
    notes: 何も描かずに投げる。取り出し元に渡す文書の `id` が無く、使う側の誤りのため
  - name: なし（差分の知らせの枠）
    condition: 取り出し元の `revisions`・`content` が reject するか、返した値が制約の「差分の取り出し元」の形に合わない
    notes: 例外を投げず、差分の場所を知らせの枠に替え、文書の本文は描いたまま残す。取り出し元の関数の名前・文書の `id`・リビジョンの `id`・元のエラーか合わなかった値を `console.error` に出す
  - name: TypeError（コメント）
    condition: '`opts.commentStore` を渡し、`opts.docId` を渡さないか、`opts.commentStore` が `load`・`save` の関数を持たない'
    notes: 何も描かずに投げる。メッセージに `docId` か `commentStore` を含める
  - name: なし（コメントを保存できない）
    condition: '`save` が reject するか、返した値が制約の「コメントの読み書きの関数」の形に合わない'
    notes: 例外を投げず、入力欄に書いた本文を残して `role="alert"` の知らせを出し、印を付けない。`save`・文書の `id`・元のエラーを `console.error` に出す
  - name: なし（コメントの読み書きの関数が無い）
    condition: '`comments` がオンで `opts.commentStore` を渡さない'
    notes: 例外を投げず、コメントのボタンを出さない。コメントの機能に読み書きの関数が要ることを `mount` ごとに 1 回だけ `console.error` に出す
  - name: なし（ビュー・コメントの部品のモジュールを読めない）
    condition: ビューの部品かコメントの部品のモジュールを読めない
    notes: 例外を投げない。ビューの印の場所は `render` が出した表のまま残し（切り替えとボードは置かず、表は読めるため知らせの枠に替えない）、コメントはボタンを出さず `load` も呼ばない。読めなかった部品の名前（`view` か `comments`）・モジュールの URL・元のエラーを `console.error` に出す。文書の残りは描く
  - name: なし（色分けなし）
    condition: 色分けのライブラリの本体か言語のモジュールを読めない
    notes: 例外を投げず、読めなかった分のコードブロックを色分けせずに残す。URL と元のエラーを `console.error` に出す
  - name: なし（既定の出し方）
    condition: '`opts.config.side-toc.mode` が `hover`・`fixed` のどちらでもない'
    notes: 例外を投げず、`hover` として描く
  - name: なし（知らない差分の出し方）
    condition: '`opts.diffMode` が `button`・`open`・`blocks` のどれでもない'
    notes: 例外を投げず、`button` として描く
  - name: なし（ブロックの色分けを出せない）
    condition: '`opts.diffMode` が `blocks` で、取り出し元の `revisions`・`content` が reject するか、返した値が制約「差分の取り出し元」の形に合わない'
    notes: 例外を投げず、`opts.markdown` を色を当てずに描いた本文を残し、本文の先頭に知らせの枠（題 `変更を表示できません`・本文 `比べるリビジョンの本文を取り出せませんでした。色分けせずに表示しています。`）を置く。`console.error` は差分の知らせの枠と同じ。文言は一覧と本文のどちらの失敗でも同じ（確認ログの決定）
constraints:
  - item: 描く本文
    constraint: '`render(markdown, { config })` が返す HTML 文字列と同じ'
    notes: dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts
  - item: 外部ライブラリのモジュールの形
    constraint: '`draw(slot: HTMLElement, args: string[]): void | Promise<void>` を名前付きで export する。`slot` は印の場所の要素、`args` は印の引数を空白で区切ったもの'
  - item: 外部ライブラリの読み込み
    constraint: 対応表の URL を `import()` に渡す。import map は使わない。同じ文書の同じ名前の印は 1 回だけ読む
  - item: 外部ライブラリの印の場所
    constraint: 読み込みの間は、class `mdmark-embed`・`role="status"`・文字 `図を読み込んでいます` の要素を置く
    notes: 高さは本文の CSS が先に取る（モジュール構成設計）
  - item: 知らせの枠
    constraint: class `mdmark-notice`・`role="status"` の要素に、題（class `mdmark-notice-title` の `strong`）と本文（`p`）を置く。題は図の印なら `この図を表示できません`、図でない印なら `この箇所を表示できません`。本文は `表示に使うライブラリ（{印の名前}）を読み込めませんでした。ネットワークにつながっているかを確かめて、ページを読み込み直してください。`
    notes: 印の名前は `code` 要素で囲む。設定の `libraries` で足した印は図の印として扱う
  - item: テーマ
    constraint: mdmark の CSS は `@layer mdmark` に入る。使う側は層の外の CSS と `--mdmark-` の変数で上書きする。mdmark は使う側の `theme.css` を読まない（使う側のページが `<link>` で読む）
    notes: '層の外で読むことが上書きの条件で、ページの `<link>` なら使う側がその条件を直に満たせ、`render` の出力にも同じ書き方で当たる'
  - item: 対応ブラウザ
    constraint: Chrome 99・Firefox 98・Safari 16.4 以上
    decided_by: dev/設計書/非機能要件/非機能要件#
  - item: 表の操作
    constraint: '`data-features` の機能だけを付ける。並べ替えは各列の見出しをボタンにし、押すたびに昇順 → 降順 → 元の並びを繰り返す（数値だけの列は数の大きさ、それ以外は文字の順）。並べた列の `th` に `aria-sort` を付ける。ピン止めは、表が幅からはみ出すときだけ各列の見出しに `aria-pressed` を持つボタンを出し、押した列までを左端に留め、押し直すと外す。絞り込みは `data-filter` の列の見出しにだけ `aria-expanded`・`aria-controls` を持つボタンを出し、`hidden` で開閉するドロワー（`select` は値のチェックボックスと候補の検索欄、`text` は含む文字の欄、`date` は開始日と終了日の欄と、どれも「絞り込みを外す」）を開く。ドロワーは同時に 1 つだけ開き、開いたら最初の入力欄へフォーカスを移し、外を押すか Esc で閉じる（Esc はボタンへフォーカスを戻す）。列ごとの絞り込みは重ねて当て、一致する行が無いときは「一致する行がありません」の行を出す。並べ替え・絞り込みで行の詳細はその行に付いて動く。`count`・`columns`・`total`・`copy` の表は、表の上に `mdmark-table-bar` の帯を置く。件数は `aria-live="polite"` の要素に `{表示している行の数} / {全ての行の数} 件`（読み上げは `{全ての行の数} 件中 {表示している行の数} 件を表示`）を出し、絞り込みのたびに書き換える。列の表示は `aria-expanded`・`aria-controls` を持つ `列の表示` のボタンで、列名のチェックボックスと `先頭の列は隠せません`・「既定に戻す」を並べたメニュー（絞り込みのドロワーと同じ開閉の作法）を開く。描いた直後は `data-hide` の列の見出しとセルを `hidden` にし、先頭の列のチェックボックスは `disabled` にする。「既定に戻す」は `data-hide` の状態に戻す。`total` の表は、`data-total` に書いた計算ごとに 1 行ずつ、`合計`（`sum`）・`平均`（`avg`）・`件数`（`count`）の順に `tfoot` の行（`data-total-kind="{計算}"`）を置く。各行の先頭のセルに計算の名前を、その計算を持つ列のセルに表示している行で集計した値を出し、ほかのセルは空にする（先頭の列を集計する行は、名前を左、値をセルの末尾に寄せる）。絞り込みのたびに計算し直す。`sum`・`avg` は空のセルを除いて計算し、桁区切りを付けて小数は 2 桁までに丸める（平均する値が無いときは `—`）。`count` は空でないセルの数。`sum`・`avg` の列の本文の行（絞り込みに関わらず全ての行）に数として読めないセル（空のセルは数えない）が 1 つでもあれば、その列のその計算のセルを空にする（警告は `render` が表の上に置く）。帯に `aria-expanded`・`aria-controls` を持つ `集計` のボタンを置き、`出す集計` のメニュー（`data-total` に書いた計算の名前のチェックボックス。開閉の作法は列の表示のメニューと同じ）で出す行を選ばせる。描いたときは全ての計算にチェックを入れ、チェックを外した計算の行を `hidden` にし、出したこと・隠したことを読み上げで知らせる。選択は覚えず、描き直すと全ての計算に戻す。列を隠すと、その列の `tfoot` のセルも `hidden` にする。並べ替えで `tfoot` は動かない。`copy` の帯の `表をコピー` のボタンは `aria-expanded`・`aria-controls` を持ち、`コピーの形式` のメニュー（`Markdown の表`・`TSV` のボタン。開閉の作法は列の表示のメニューと同じ）を開く。形式を押すとメニューを閉じてフォーカスを `表をコピー` に戻し、見出しの行と表示している行の、表示している列のセルの文字を、選んだ形式で `navigator.clipboard.writeText` に書く（集計の行・行の詳細・畳んだ最終列の開閉の行は含めない）。Markdown の表は見出しの行・`| --- |` の区切りの行・本文の行を `| セル | セル |` の形で改行で並べ、セルの中の `|` を `\|` にする。TSV はセルをタブで、行を改行で区切る。書けたらボタンを `コピーしました` にして 2 秒で戻し、コピーした形式を読み上げで知らせる。書けないとき（`navigator.clipboard` が無いか拒まれた）は、帯の直後に `role="group"` のパネル（題・手でコピーする案内・コピーする中身を入れた読み取り専用の `textarea`・閉じるボタン）を出し、`textarea` へフォーカスを移して中身を全て選択し、書けなかったことと手でコピーできることを読み上げで知らせる。パネルは閉じるボタンか、パネルの中にフォーカスがある間の Esc で閉じ、フォーカスを `表をコピー` に戻す。もう一度コピーするときは前のパネルを閉じてから書く。どちらも例外を外へ出さない。`rowlink` の表は、URL の `#` の後ろ（`#` が 2 つあれば最後の `#` の後ろ）を `decodeURIComponent` したもの（読めないときはそのまま）が行の `id` を指すとき（描いたときと `hashchange`）、その行を囲む閉じた表・閉じた節を開き、行が絞り込みで隠れていればその表の絞り込みを外してから行へ移り、その行だけに `data-target` を付けて強調する。行へのリンクの印は、行を指したとき・フォーカスしたとき・`data-target` の行で出し、指せない端末では常に薄く出す。印を押すと、移る動き（アドレスバーの URL を行を指す URL にする）はそのままに、印の解決済みの `href`（`rewriteLinks` が書き換えた後の値をページの URL で解決した絶対 URL）を `navigator.clipboard.writeText` に書き、描くときに印の横へ置いておいた空の `role="status"` の要素の文字を、書けたら `リンクをコピーしました`、書けなければ `リンクをコピーできませんでした` に書き換え、2 秒後に空に戻す（例外を外へ出さない）。印刷では表の上のボタンと行へのリンクの印を出さず、件数と出している集計の行を出し、隠した列は隠したままにする'
  - item: タブの操作
    constraint: '`mdmark-tabs` の頭に `role="tablist"` の並びを置き、各 `mdmark-tab-panel` のタブ名を `role="tab"` のボタンにする。中身は `role="tabpanel"` にし、選んだタブの中身だけを出してほかは `hidden` にする。左右の矢印・Home・End でタブを移って選ぶ（WAI-ARIA のタブの作法）。描いた直後は最初のタブを選ぶ。`data-group` を持つ `mdmark-tabs` は、描いたときに localStorage のキー `mdmark-tabs:{group}` に残したタブ名のタブを選び、残していないかそのタブ名が無ければ最初のタブを選ぶ。読む人が押すかキーでタブを選ぶと、ページの `data-group` が同じ `mdmark-tabs` のうち同じタブ名を持つものをそのタブ名へ切り替え（フォーカスは動かさない）、選んだタブ名を `mdmark-tabs:{group}` に残す。描いたときの選択と揃えて切り替わった選択は残さない。localStorage を取り出す・読み書きするときに例外が出たら、`console.warn` に出して残さず・読まずに揃える動きと切り替えを続ける'
  - item: 節と行の詳細の開閉
    constraint: 節は見出しの文字を `aria-expanded`・`aria-controls` を持つボタンにし、閉じた節の `mdmark-section-body` を `hidden="until-found"` にする（`data-section="closed"` は閉じた状態で始める）。URL の `#ID` が閉じた節の中を指すとき（描いたときと `hashchange`）と、ページ内検索が閉じた節の中に当たったときは、その節を開く。行の詳細は、詳細を持つ行の先頭のセルに `aria-expanded`・`aria-controls` を持つボタンを置き、`mdmark-row-detail` の行を `hidden` で開閉する（描いた直後は閉じる）
  - item: 印刷で記法を開く
    constraint: '`print` がオンのとき、`beforeprint` で閉じた `details`（閉じた表・閉じた注意書きを含む）・閉じた節・行の詳細を開き、タブの全ての中身をタブ名を題にして縦に並べる。`afterprint` で、開いたものだけを閉じ直し、印刷の前に選んでいたタブだけを出す'
  - item: 拡張の印
    constraint: 登録した拡張の印の場所は、拡張の `schema` で引数を検査し、合えば `load` で読んだモジュールの `draw` に描かせる。合わなければ書き方の警告、読めなければ知らせの枠に替える
    notes: dev/設計書/インターフェース定義/ライブラリ本体/拡張を登録する.ts
  - item: 用語と文書の別名の下線
    constraint: 本文の文字を `Intl.Segmenter`（`ja`・`word`）で区切り（`Intl.Segmenter` を持たない環境では、英数字の連なりを 1 語とし、それ以外の文字を 1 文字ずつ区切る）、始まりと終わりが区切りに揃う用語の語・別名と文書の `aliases` を、長い語を先に照合する。照合の前に、語と本文の文字の両方を NFKC・英字の小文字化・前後の空白の除去で正規化し、下線は本文に記載したままの文字に引く。図の部品の `{{語}}` も同じ正規化で用語を引く。用語は用語の `id`、文書の別名は文書の `id` ごとに、節（h2〜h4）ごとに最初に出たところだけを class `mdmark-term` の要素にし、破線の下線を引く。コード・リンク・見出し・用語集の表の中は照合しない。正規化した後に同じになる語が複数の用語に当たるときは、索引の `terms`・`opts.aliases`（並びの順）・描く文書の表・ほかの文書の表（索引の `docs` の順）の順で 1 つを選ぶ
    notes: 下線の要素の形は部品設計で決める
  - item: ツールチップの操作
    constraint: 下線の要素にポインターを乗せたときとフォーカスしたときにツールチップを出し（ポインターの形は変えない）、ツールチップの上へポインターを移しても出したままにし、Esc で消してフォーカスを語に残す（WCAG 1.4.13）。関連文書・エイリアスのリンク・コマンドのコピーのボタンを持つツールチップは、語から Tab で中のリンクとボタンへ移れ、中にフォーカスがある間は出したままにする。表やタブの枠で切れないよう画面に対して置き、`opts.config.tooltips.placement` が `top`（既定）なら語の上に開いて上に収まらなければ下に、`bottom` なら語の下に開いて下に収まらず上に収まれば上に開く。`update` で付け直し、`destroy` で外す
    notes: WAI-ARIA の役割とフォーカスの出入りは部品設計で決める
  - item: 関連文書と被参照の一覧
    constraint: ツールチップの「関連文書」には、語に `aliases` が一致した文書（描く文書自身を除く）の題・リンク・`description` を出す。文書の末尾には、`opts.references.backlinks[opts.docId]`（無ければ、索引の `related` の要素の相手（オブジェクトは `to`、文字列はその値）に描く文書を持つ文書）を「関連文書」の題の一覧にして置き、空なら置かない。リンクの `href` は描く文書の `path` から見た参照先の相対パスにする。`backlinks` がオフのときは、文書の別名の照合と末尾の一覧をしない
  - item: 索引の値の出し方
    constraint: 索引の題・意味・`description` は Markdown として解析せず、文字として出す。リンクの `href` は本文のリンクと同じ許可の検査を通す
  - item: 用語と関連文書の一覧の id
    constraint: 1 つのページに文書を 2 つ以上描いても重ならないよう、`mount` は用語の下線のツールチップと関連文書の一覧の題の `id` を、モジュールの通し番号でページの中で一意な値に振り直し、それを指す `aria-describedby`・`aria-details`・`aria-labelledby` も直す。`update` で振り直す。`render` の出力の `id` は文書の中で一意なまま
    notes: タブの `mdmark-tabs-{n}`（`src/interact/tabs.ts` の `tabsCounter`）と同じ作り
  - item: 図の拡大・縮小
    constraint: 図の部品の右上に、縮小・倍率・拡大・全画面のボタンをこの順に置く（アイコンは lucide の `minus`・`plus`・`expand`。倍率のボタンは今の倍率を `125%` の形の文字で出す）。描いたときは図の全体が表示する枠の幅と高さに収まる倍率（100% を超えない）で出し、この倍率を下限、300% を上限にする。拡大・縮小は 1 回 1.25 倍。倍率のボタンを押すと、描いたときの倍率と位置に戻す（描いたときの倍率と位置のときも押せ、何も変わらない）。倍率のボタンの読み上げの名前は `倍率 {今の倍率}。全体が収まる倍率に戻す` にし、倍率が変わるたびに書き換える。図の中にフォーカスがある間だけ、キーの `+`・`-`・`0` で拡大・縮小・戻すを行う。下限・上限ではその向きのボタンを押せなくする。ホイールは受け取らず、文書のスクロールと Shift との横のスクロールに任せる。表示する枠の幅が変わったとき、描いたときの倍率のままなら収まる倍率を求め直す。埋め込んだ HTML の中の図の部品にも同じボタンと操作を付け、部品でない HTML には付けない
    notes: 'D-43 は部品でない普通の HTML に限る（確認ログ）。戻すのボタンを倍率のボタンにまとめ、今の読み上げの名前 `全体が収まる倍率に戻す` を残すのは #6 の確認ログの決定。ほかのボタンの読み上げの名前は部品設計'
  - item: 図の移動
    constraint: 図の文字の上ではカーソルを `text` にして文字を選ばせ、それ以外の上では `grab` にして、ドラッグした分だけ図を動かす（ドラッグの間は `grabbing` で、文字を選ばせない）。図の表示する枠は `tabindex="0"` を持ち、フォーカスの間は矢印キーで押した向きの先が見えるよう 80px ずつ動かす（動かせる向きがあるときだけ文書のスクロールを止める）。図が表示する枠に収まらない間だけ、右上の帯に移動のボタン（上・下・左・右）を出し、矢印キーと同じだけ動かす。シーケンス図は相手の行を表示する枠の上端に留める
    notes: モックの「移動のボタンは全体が見えている間は出さない」（確認ログ）
  - item: 図の全画面
    constraint: 全画面のボタンで、題・図・凡例を `<dialog>` のモーダル（`showModal()`）に出し、モーダルの中の図をモーダルの幅と高さに収まる倍率で開く。モーダルの右上の帯は文書の中と同じボタンで、全画面のボタンの位置に閉じるボタン（lucide の `x`）を置く。閉じるボタンか Esc で閉じ、フォーカスを全画面のボタンへ戻す。ツールチップを開いている間の Esc はツールチップだけを閉じる。閉じたときに、モーダルのために付けた受け取りと大きさの監視を外す
    notes: 全画面のモーダルは確認ログの決定（要件.md の `拡大・縮小`）
  - item: 図のツールチップ
    constraint: '`tip` を持つ線のラベルと、`io` か `hint` を持つ箱の右上の印を、`aria-describedby` でそのツールチップを指すフォーカスできる要素にする。ポインターを乗せたときとフォーカスしたときに出し、ツールチップの上へポインターを移しても出したままにし、Esc で消してフォーカスを持ち主に残す（WCAG 1.4.13）。同時に出すのは 1 つだけ。出す場所は制約の「ツールチップの操作」と同じく `opts.config.tooltips.placement` に従い、箱の印のツールチップは箱の上（下）に置く。箱の印の外では開かず、線のラベルと印の上でポインターの形を変えない。図を動かしたときと文書をスクロールしたときは持ち主に付いて動かし、`beforeprint` で閉じる。箱の中の用語は、本文の用語と同じ下線の要素とツールチップの操作（制約の「用語と文書の別名の下線」「ツールチップの操作」）にする'
    notes: WAI-ARIA の役割とフォーカスの出入りは部品設計で決める
  - item: 操作できる部品の操作
    constraint: 'スライダーの `input` のたびに、今の値を `output` に出し、定義の `table` のその値の点でグラフの今の値の系列を描き直す（題・凡例・倍率は保つ）。今の値を写すボタンは `{"{key}": {"name": "{label}", "value": {今の値}}}` を 2 字下げの JSON にして `navigator.clipboard.writeText` で書き、ボタンのそばの `role="status"` に写したことを出す。書き込みが拒まれたときは、書けなかったことを出し、写すはずだった JSON をフォーカスできる `pre` に出して選んで写せるようにする'
    notes: 知らせの文言は画面設計『文書』
  - item: 埋め込んだ HTML の操作
    constraint: '`mdmark-html` の幅が本文の列より広い間だけ、class `is-wide` と `tabindex="0"` を付け、その中で横にスクロールさせる（幅が変わるたびに判定し直す）。埋め込んだ HTML の中の文字にも、本文と同じ用語と文書の別名の下線・やめた言い方のマーカーとツールチップを付ける（下線は範囲ごとに語の最初の 1 回だけで、本文の節とは別に数える）（図の部品の中の文字は制約の「図のツールチップ」のとおり）'
    notes: 文書に書いたスクリプトは動かさず、動くのは mdmark が付ける操作だけ（D-22）
  - item: ヒントの操作
    constraint: '`data-hint` のブロックの要素は右上の `mdmark-hint-mark` のボタンだけ、行内の要素は要素そのものが、ポインターとフォーカスを受けてツールチップを開く。ブロックの要素の印の外では開かず、要素にフォーカスも移さない。開き方・出す場所・開いたままにする条件・同時に 1 つだけ・スクロールで付いて動く・`beforeprint` で閉じる・Esc で消してフォーカスを持ち主に残すのは、制約の「図のツールチップ」と同じ。ポインターの形は変えない。`hints` がオフのときは `render` が印と中身を出さないため、何も付けない。`update` で付け直し、`destroy` で外す。ツールチップの `id` は制約の「用語と関連文書の一覧の id」と同じくページの中で一意な値に振り直す'
    notes: 印だけで開くのとポインターの形は確認ログの決定
  - item: 差分の取り出し元
    constraint: '`revisions(docId: string): Promise<DiffRevision[]>` と `content({ docId, revisionId }: { docId: string; revisionId: string }): Promise<string>` を持つ。`revisions` はリビジョンを新しい順に返し、mdmark は並べ替えない。`DiffRevision` は `id`（空でない文字列・必須）・`at`（ISO 8601 の日時の文字列・必須）・`label`（文字列・任意）・`author`（文字列・任意）。`content` は Markdown の文字列を返す。`revisions` が配列でない・`id` か `at` が無いか形が合わない・`id` が重なる・`content` が文字列でないときは、reject と同じに扱う'
    notes: '`content` は ID が 2 つ並ぶためオブジェクトで受ける（外部規約『関数とオブジェクト引数』）。形が合わないのは使う側の開発者の誤りで、読む人の操作では起きない（計画書）'
  - item: 差分を開く UI
    constraint: '`opts.diffSource` を渡したとき、本文（右側の目次を置くときは本文の列、置かないときは `el`）の直下の最初の `h1` を文書の題にし、題の直後（`h1` が無ければ本文の先頭）に、`aria-expanded`・`aria-controls` を持つ「変更を見る」のボタンと差分の場所を置く。題が節のときは題とその節の中身の間に置き、H1 の節を閉じてもボタンは隠れない。押すと、本文の直下のうち題・ボタン・差分の場所を除く要素と、右側の目次を隠し、差分の場所に差分を出す。差分を開いている間は、節の開閉（開閉のボタン・`hashchange`）で節の状態が変わっても隠した要素を出さない。押し直すと差分を片付け、隠した要素と右側の目次を出し（節は今の開閉の状態で出す）、フォーカスはボタンに残す。`update` は差分を閉じて本文を描き直し、`destroy` は差分と取り出し元の待ちを片付ける'
    notes: 置き方は確認ログのモックへの合意。見た目は画面設計『文書』。差分の場所は本文の見出しを持たないため、差分を開いている間は右側の目次（項目・今いる節・すべて展開とすべて折りたたむ）を出さない（レビューの指摘で案 A）
  - item: 比べる 2 つのリビジョン
    constraint: 差分を開くたびに `revisions` を 1 回呼ぶ。2 つ以上あれば、前に 2 番目・後に 1 番目のリビジョンを選び、`content` を前と後に 1 回ずつ呼ぶ。前と後の選ぶ欄の項目は、日時（JST）と `label`・`author` を並べる。前の欄では一番新しいリビジョンを、後の欄では前に選んだもの以前のリビジョンを選べなくし、前を選び直して後が前以前になったら、後を前の 1 つ新しいリビジョンに移す。選び直すたびに選んだ 2 つの `content` を呼び直す。リビジョンが 1 つなら `content` を呼ばず、`この文書のリビジョンは 1 つだけのため、比較対象のリビジョンがありません。` を出す
    notes: 文面は確認ログの決定
  - item: 差分の待ち
    constraint: 取り出し元の待ちが 1 秒を過ぎたら差分の場所に `変更を読み込んでいます` の枠を出し、2 秒を過ぎたら回る表示を足す。待つ間に選び直す・閉じる・`update`・`destroy` があったら、前の待ちの結果は描かない。mdmark は待ちを時間で打ち切らず、打ち切るときは取り出し元が reject で返す
    notes: 古い結果を捨てるのは、本文の描き直しの世代の番号と同じ作り
  - item: 差分の計算
    constraint: 2 つの Markdown のソースを行ごとに比べる。変えた塊の中で、消した行と足した行を前から順に対にし、対の行を語ごとに比べる。語の区切りは `Intl.Segmenter`（`ja`・`word`）で、持たないブラウザでは 1 文字ずつ比べる
    notes: 比べるライブラリ（jsdiff）はモジュール構成設計で差分の計算の関数型の後ろに置く
  - item: 差分の行
    constraint: 'ソースの行を、文字のまま 1 行ずつ出す。前にだけある行は class `mdmark-diff-line`・`data-kind="del"`、後にだけある行は `data-kind="add"`、同じ行は `data-kind="same"` を持つ。消した行・足した行は行頭に `-`・`+` の印（`aria-hidden`）と、読み上げの名前 `削除した行: `・`追加した行: `（見えない文字）を持つ。対の行で変わった語は、消した側を `del`、足した側を `ins` で囲む。選ぶ欄の下の `role="status"` に `削除した行 {数}・追加した行 {数}` を出す。2 つの本文が同じなら行を出さず、`選んだ 2 つのリビジョンの本文に、変更はありません。` を出す'
    notes: 色は `--mdmark-color-diff-*` の CSS 変数（モジュール構成設計）
  - item: 埋め込んだ HTML の差分
    constraint: 差分の中の `<!-- html -->` 〜 `<!-- /html -->` の範囲は、範囲の見出しの右端に `HTML` のラベルを置く。前か後で変えた範囲だけ、見出しに `role="group"`・`aria-label="HTML の見方"` の中に `aria-pressed` を持つ「ソース」「プレビュー」のボタンを置く。既定はソースの行の色分けで、「プレビュー」を押すと、範囲の前と後の HTML を今の埋め込んだ HTML の描画（スクリプトとイベントの属性を落とす）で並べる。片側にしか無い範囲は、無い側に `{前か後}のリビジョンには、この範囲がありません` を出す
    notes: D-48・確認ログの語彙
  - item: 差分の知らせの枠
    constraint: 知らせの枠と同じ要素に置く。`revisions` を取り出せないときは、題 `変更の履歴を表示できません`・本文 `リビジョンの一覧を取り出せませんでした。時間をおいて、変更を開き直してください。` を差分の場所に出す。`content` を取り出せないときは、選ぶ欄を残し、題 `このリビジョンの本文を表示できません`・本文 `「{リビジョンの説明}」の本文を取り出せませんでした。別のリビジョンを選んでください。`（2 つとも取り出せなければ `「…」と「…」`）を差分の行の場所に出し、選び直せば差分を描き直す
    notes: 文面は確認ログの決定
  - item: ミニマップ
    constraint: 差分の行を出している間、送り先のスクロールの右端に、その高さいっぱいの帯（`aria-hidden`）を貼り付ける。送り先は差分の行の一番近いスクロールする祖先で、無ければ画面。帯は送り先の全体を写し、消した行は左半分の赤・足した行は右半分の緑の印（続いた同じ種類の行は 1 つの印にまとめ、プレビューに切り替えた範囲は範囲ごと 1 つの印）にし、今見えている範囲を枠で示す。帯を押すとその位置を送り先の中ほどに置くよう送り、押したまま上下に動かすとそれに合わせて送る。差分を閉じる・選び直す・`destroy` で帯と受け取りを外す
    notes: '確認ログのモックへの合意（画面の右端）。帯の本数と `position: fixed` の基準は部品設計とモジュール構成設計（計画書）'
  - item: ビューの印
    constraint: '`<!-- view: 引数 -->` 〜 `<!-- /view -->` の範囲の最初の表を項目にする（見出しの行が列名、本文の行が項目、セルの文字が値）。引数は `group=列名`（ボードで分ける列）・`default=board|table`（描いた直後のビュー。既定は `group=` があれば `board`）・`filter=列名:種類,…`（記法の表と同じ書き方）・`icons=値:アイコンの名前,…`。`render` は範囲を class `mdmark-view` の要素にし、中に表を残す（ビューの機能がオフのときは表だけを出す）。書き方の誤り（範囲に表が無い・`group=`・`filter=` の列が表に無い・知らない絞り込みの種類・使えないアイコンの名前・知らないキー・閉じの印が無い）は、範囲の上に書き方の警告を出し、読めた指定だけを当てる。`group=` が当たらないときはボードを押せなくし、表が無いときは範囲の中身をそのまま描く'
    notes: 印の名前 `view` は記法の印として予約する（インターフェース定義『拡張を登録する』）。警告の文言は画面設計『文書』
  - item: ビューの操作
    constraint: '`mdmark-view` の頭に、`role="group"`・`aria-label="ビューの表示"` の中に `aria-pressed` を持つ「ボード」「表」のボタンを置く（`group=` が無いときは置かない）。ボードは `group=` の列の値ごとの列を表に出た順に横に並べ、列の見出しにアイコン・値・項目の数を出し、項目は表の行の順に、先頭の列の値を題に、`group=` の列を除く残りの列を列名と値の組で出す。描く先の幅に収まらない列はボードの中で横にスクロールさせる。表形式は範囲の表をそのまま使い、記法の表の並べ替えと、`filter=` の列にだけ記法の表と同じ絞り込みを付ける（制約の「表の操作」）。絞り込みは表形式にだけ当て、ボードは常に全ての項目を出し、表形式に戻すと絞り込みは残っている。ビューの上に検索欄と件数は置かない。印刷では今のビューを出し、切り替えと絞り込みのボタンは出さない。`update` で付け直し、`destroy` で外す'
    notes: 検索欄を持たず、絞り込みを表形式だけに当てるのは確認ログの決定。見た目は部品設計と画面設計『文書』
  - item: ボードの列の見出しのアイコン
    constraint: 列の値から lucide のアイコンを引く。既定の対応は `未着手` → `circle-dashed`・`進行中` → `circle-dot`・`保留` → `circle-pause`・`完了` → `circle-check`・`中止` → `circle-x` で、対応に無い値は `circle`。印の `icons=` は既定の対応に重ねて値ごとに上書きする。使えるアイコンは mdmark が束ねるものに限り、既定の 6 つと `inbox`・`archive`・`clock`・`flag`・`star`・`bug`・`eye`・`lock`・`zap`・`ban`。アイコンは `aria-hidden` を持ち、列の見出しの読み上げは値と項目の数だけにする
    notes: 既定の対応と `icons=` の書き方は確認ログの決定。lucide の全てのアイコンを束ねると配布ファイルのサイズの上限を超えるため、使えるアイコンを限る
  - item: コメントの読み書きの関数
    constraint: '`load({ docId }: { docId: string }): Promise<MdmarkComment[]>` と `save({ docId, comment }: { docId: string; comment: MdmarkCommentDraft }): Promise<MdmarkComment>` を持つ。`MdmarkCommentDraft` は `quote`（選んだ文字）・`prefix`（選んだ文字の前の最大 32 文字）・`suffix`（後の最大 32 文字）・`body`（コメントの本文）の文字列。`MdmarkComment` はそれに `id`（空でない文字列）を足したもの。`load` が配列でない・要素の形が合わない、`save` が形の合わない値を返すときは reject と同じに扱う。mdmark はコメントを保存せず、使う側の保存先に任せる'
    notes: 差分の取り出し元と同じく、読み書きは使う側の関数に任せる（D-17・要件『コメントの保存』）
  - item: コメントの操作
    constraint: '`comments` がオンで `opts.commentStore` を渡したときだけ付ける。本文の文字を 1 つのブロック（段落・リストの項目・表のセル・見出し・引用）の中で選ぶと、選んだ文字の終わりの下（収まらなければ上）に「コメント」のボタンを出し、DOM はそのブロックの直後に置いて Tab で届くようにする。入力欄・ビューの操作・コード・既にある印の中の選びには出さない。ボタンを押すと、選んだ文字の下に `role="dialog"` の入力欄（題 `「{選んだ文字}」へのコメント`・本文の欄・「キャンセル」「コメントを保存」）を開き、本文の欄へフォーカスを移す。Custom Highlight API があるブラウザでだけ、開いている間の選んだ文字に色を残す。本文が空のまま保存すると入力欄のそばに `コメントを書いてから保存してください。` を出す。保存を待つ間は保存のボタンを押せなくし、`保存しています…` にする。保存できたら入力欄を閉じ、選んだ文字を印で包んで印へフォーカスを移す。保存できないときは入力欄と本文を残し、`role="alert"` で `コメントを保存できませんでした。書いたコメントは残っています。もう一度「コメントを保存」を押してください。` を出す。入力欄はキャンセルか Esc で閉じ（本文があるときは捨ててよいかを確かめる）、外側の押下では閉じない。印は `tabindex="0"`・`role="button"`・`aria-haspopup="dialog"`・`aria-expanded` を持ち、押下・Enter・Space で、付いたコメントの本文を並べた吹き出しを開く。吹き出しは閉じるボタン・外側の押下・Esc で閉じ、フォーカスを印へ戻す。選んだ文字とコメントの本文は文字として出し、HTML として解釈しない。印刷では印の地の色を外して下線だけを残し、ボタン・入力欄・吹き出しを出さない'
    notes: 入力欄の捨てる確かめ方と見た目は部品設計。Custom Highlight API の確かめはモックの指摘（対応ブラウザの下限で入力欄が閉じられなくなる）から引き継ぐ
  - item: コメントの箇所
    constraint: 描くたび（`mount`・`update`）に `load` を 1 回呼び、コメントごとに、本文の文字の中で `prefix + quote + suffix` が一致する箇所、無ければ `quote` が 1 か所だけ一致する箇所の `quote` を印で包む。同じ箇所のコメントは 1 つの印にまとめ、吹き出しに並べる。箇所が見つからないコメントは、文書の末尾の「箇所が見つからないコメント」の一覧（選んだ文字と本文）に出し、空なら置かない。`load` を読めないときは印を付けず、新しいコメントは付けられる。印は本文の文字を変えず、`destroy` で外す
    notes: 一覧の題と文言は画面設計『文書』
  - item: 配色の切り替え
    constraint: '描く先の要素かその祖先が持つ class で、画面の配色を次の優先順に決める。(1) `mdmark-theme-dark` はダーク、`mdmark-theme-light` はライト (2) `vscode-high-contrast-light`・`vscode-light` はライト、`vscode-dark` と、`vscode-high-contrast-light` を一緒に持たない `vscode-high-contrast` はダーク (3) どれも無ければ `prefers-color-scheme`。同じ優先度の class が両方あるときは、描く先に近い祖先の class に従う。ダークの値は `prefers-color-scheme: dark` のときと同じ変数の値で、差分のミニマップの色も同じ規則で決める。印刷では class によらず明るい配色にする'
    notes: '`vscode-*` は VS Code が Webview の `body` に付ける class。`mdmark-theme-*` は、使う側が OS やホストの配色によらず固定するときに付ける（VS Code 拡張機能の `mdmark.preview.theme` が `light`・`dark` のとき）。使う側が層の外で上書きした変数は、どの配色でも層の中の値に勝つ'
  - item: やめた言い方のマーカー
    constraint: '`glossary` がオンのとき、索引の `terms[].avoid` の語と、`opts.aliases` の `avoid` の種類の `name`・`aliases` と `term` の種類の `avoid` の語と、描く文書の用語集の表と `opts.references` の `glossary` のやめた言い方の列の語も制約の「用語と文書の別名の下線」と同じ区切り・同じ正規化・同じ範囲で照合し、同じ位置で用語の語・別名にも当たるときは用語を選ぶ。文書の別名と同じ語は、関連文書を出さずにやめた言い方にする（点検の `avoided_term` と同じ）。当たった語は、節（h2〜h4）ごとにやめた言い方ごとの最初の 1 回だけを class `mdmark-term mdmark-term-avoided` の要素にして波線の下線を引き、「代わりの用語」のツールチップに代わりの用語の語と意味を出す（用語の下線とは別に数える）。用語集の表のやめた言い方は、その行の用語の列と意味の列の文字を代わりの用語にする。同じやめた言い方を複数の用語が持つときは、索引の `terms`、`opts.aliases` の並び、索引の `docs` の順の文書の表の順で先の用語を代わりの用語にする（描く文書が索引の `docs` に無いときは、描く文書の表をほかの文書の表より先にする）。開閉は制約の「ツールチップの操作」のとおりで、印刷ではマーカーとツールチップを外す。図の箱の中の `{{語}}` は照合しない'
    notes: マーカーとツールチップの要素の形は部品設計で決める。やめた言い方は参照先を持たないため、`collectReferences` の `backlinks`・`collectMatches` の結果と関連文書の一覧は変わらない
  - item: 色分けの対象
    constraint: 機能 `syntax` がオンの文書で、情報文字列の最初の語の言語（`言語:ファイル名` の形なら `:` の前）が色分けの言語の対応表にある、フェンスのコードブロックの `pre > code`。文書に書いた生の HTML の `pre > code` は、`language-*` の class を持っていても当たらない。記法が描いたもの（ファイルツリー・図の部品の定義・埋め込んだ HTML）は `pre > code` でないため当たらず、記法がコードブロックのまま残したものは当たる
    notes: '対応表（情報文字列の語 → 言語のモジュール）: `typescript`・`ts`・`tsx` → typescript／`javascript`・`js`・`jsx`・`mjs`・`cjs` → javascript／`json` → json／`yaml`・`yml` → yaml／`python`・`py` → python／`bash`・`sh`・`shell`・`zsh` → bash／`html`・`xml` → xml／`css` → css／`markdown`・`md` → markdown／`sql` → sql／`dockerfile`・`docker` → dockerfile／`diff`・`patch` → diff。語は大文字と小文字を区別しない'
  - item: 色分けの読み込み
    constraint: 描いた後に、色分けの対象が 1 つ以上あるときだけ、`syntax.url` の本体と文書が使う言語のモジュールを `import()` で読む。言語のモジュールは並べて読み、読めたものだけを登録する。同じ `mount` の中で同じモジュールは 1 回だけ読む。読み終わる前に `update`・`destroy` したときは、前の描画に色を当てない。読み込みの完了は待たずに `mount` を返す
    decided_by: dev/設計書/非機能要件/非機能要件#
    notes: 配布物 `dist/index.js` に色分けのライブラリを束ねない（非機能要件『配布ファイル 1 つのサイズ』）
  - item: 色分けの当て方
    constraint: 行に分けたコードブロック（`mdmark-code-line` を持つ）は各 `mdmark-code-text` の中を、分けないものは `code` の中を、highlight.js の `highlight` が返す HTML に置き換える。行をまたいで開いている `span` は行末で閉じ、次の行の頭で開き直す。`pre`・`code`・`mdmark-code-line` の属性と `code` の `textContent` は変えない。色は `hljs-*` の class に CSS 変数 `--mdmark-color-syntax-{keyword,string,number,type,name,comment}` を当てる。`diff` の `hljs-addition`・`hljs-deletion` には、差分の行と同じ `--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign` を当てる。`[!code ++]`・`[!code --]` の行は、行の地の色と行頭の `+`・`-` を保ったまま行の中の文字を色分けする
    notes: 色分けの HTML は sanitize を通さない（`hljs-*` は sanitize の許可に無い）。highlight.js はコードの文字をエスケープしてから `span` を付ける。種類ごとの class の当て方はモック `dev/mock/refs/97/assets/syntax-highlight.css` のとおり
  - item: 色分けを読めないとき
    constraint: 本体を読めないときは全てのコードブロックを、言語のモジュールを読めないときはその言語のコードブロックを、色分けせずに描いたまま残す。例外を投げず、知らせの枠も出さない。読めなかった URL と元のエラーを `console.error` に出す
    notes: コードは色分けが無くても欠けずに読めるため、外部ライブラリの印と違って本文を枠で置き換えない
  - item: 見出し行と集計の行を留める
    constraint: 表は縦の高さの上限を持たず、表を囲む `mdmark-table` は横にはみ出すときだけ表の中で横にスクロールする。表が画面に残っている間、見出し行のセルを、ページのスクロールで画面の上端から `--mdmark-sticky-top` だけ下の位置まで（本文の最後の行を越えない範囲で）下げ、集計の行のセルを画面の下端まで（本文の最初の行を越えない範囲で）上げる。ずらすのは元の見出し行と集計の行のセル（`transform`）で複製を作らず、横のスクロール・列の幅・ピン止め・並べ替え・絞り込みのボタンと状態・フォーカス・読み上げは 1 組のまま揃う。ずらしたセルは背景を持ち、本文の行より手前に描く。`animation-timeline` と `animation-range` を持つブラウザでは、ずらす量を `view-timeline` と CSS のアニメーションでスクロールの位置から決め、表の大きさが変わったとき（`ResizeObserver`）だけ動く範囲の CSS 変数を入れ直す。持たないブラウザでは、`window` と文書の中の `scroll`・`window` の `resize`・表の大きさの変化のたびに、ずらす量を JS で入れ直す。表が画面から外れると、見出し行と集計の行も一緒に外れる。印刷ではずらさない。`update` で付け直し、`destroy` で受け取りと監視を外す
    notes: PoC 検証で `animation-timeline` を持つブラウザは案 D、持たないブラウザは案 C に決定（計画書の `## PoC 結果`・確認ログ）。動く範囲の変数の名前はモジュール構成設計
  - item: 最終列を畳む
    constraint: 描く先の要素の中身の幅が 720px 未満で、表示している最終列（先頭の列を除く）のセルのどれかが 1 行に収まらないとき、最終列の見出しとセルを隠し、本文の各行の先頭のセルの頭に `aria-expanded`（描いた直後は `false`）・`aria-controls` を持つ開閉のボタン（読み上げの名前 `「{先頭のセルの文字}」の{最終列の見出しの文字}`）を置く。ボタンを押すと（Enter・Space を含む）、行の直後の行に最終列の見出しの文字とその行のセルの中身を出し、押し直すと閉じる。行の詳細を持つ行は、行の詳細の中身の上に最終列の見出しと中身を置き、行の詳細の開閉のボタンだけで両方を開閉する。並べ替え・絞り込みでは開閉の行もその行に付いて動き、行が隠れると開閉の行も隠す。描く先の要素の幅の変化（`ResizeObserver`）と列の表示の切り替えのたびに畳むかを決め直し、畳まないときは開閉のボタンと開閉の行を出さない。列の表示で最終列を隠しているときは畳まない。印刷では畳まずに全ての列を出し、開閉のボタンを出さない
    notes: 幅と開き方はモック作成で案 A に決定（確認ログ）
  - item: コードブロックのコピー
    constraint: '`render` が帯（`mdmark-code-bar`）を付けたコードブロックの帯の右端に、`コピー` のボタン（`type="button"`）と `role="status"` の要素を置く。押すと、行に分けたコードブロックは `data-kind="del"` の行を除く各行の `mdmark-code-text` の文字を改行でつないだもの、分けないものは `code` の文字から末尾の改行を 1 つ除いたものを `navigator.clipboard.writeText` に書く（行の印と印だけを持つ行コメントの頭は `render` が外してあり、行番号と行頭の `+`・`-` は文字に入っていない）。書けたらボタンを `コピーしました` にして 2 秒で戻し、書けないとき（`navigator.clipboard` が無いか拒まれた）は `コピーできませんでした` にして次に押すまで残す。どちらも `role="status"` で読み上げて知らせ、例外を外へ出さない。印刷ではボタンを出さない。`update` で付け直す'
    notes: 帯を付けるコードブロックは dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts の制約『コードブロック』
  - item: 本文の幅と見出し行を留める位置
    constraint: '`--mdmark-content-width` の既定は `none` で、本文の幅に上限を持たず描く先の要素の幅を使う。使う側が長さを渡すと、本文の幅をその値までにする。`--mdmark-sticky-top` は見出し行を留める位置の画面の上端からのずれで、既定は `0px`。長さ（`px`・`rem` など）を受ける。`--mdmark-table-max-height` は廃止し、渡しても表の高さを抑えない'
    notes: 本文の幅はモック作成で案 A に決定（確認ログ）。`--mdmark-table-max-height` は設定と索引の Schema（`schemas/`）の項目でないため移行の手順を置かず、変更履歴で廃止を知らせる
  - item: URL の ID でタブの中へ移る
    constraint: URL の `#` の後ろ（`#` が 2 つあれば最後の `#` の後ろ）を `decodeURIComponent` した ID（読めないときはそのまま）が、選ばれていないタブの中身（入れ子のタブを含む）の中の要素を指すとき（描いたときと `hashchange`）、外側のタブから順にその要素を含むタブを選び、外側の閉じた節を開いてから要素へスクロールする。見出し・表の行を含め、`id` を持つ全ての要素に当てる。描いたときは localStorage に残したタブ名より URL の ID を優先する。URL の ID で選んだタブは localStorage に残さず、同じ `group` のほかのタブ群も切り替えない
    notes: '`src/interact/sections.ts` の `revealHashTarget` は、タブの中の要素の処理をタブの操作に任せる（受付判断のレビュー）'
  - item: 右側の目次
    constraint: '`side-toc` がオンで、文書に h1〜h3 の見出しが 1 つ以上あるとき、`el` の中を、本文（`render` の HTML）を入れた `div.mdmark-content` と、その右の `aside.mdmark-side-toc` に分ける。`aside` には、右端の線（見出しごとの短い線。`aria-hidden`）・目次を出すボタン・パネル（`nav`。タイトル `目次`・ピン止めのボタン・すべて展開とすべて折りたたむのボタン・項目の一覧）を置く。項目は h1〜h3 の見出しを階層どおりに入れ子にした `ul` の、各見出しの `#{ID}` へのリンクで、閉じた節と選ばれていないタブの中の見出しも載せる。見出しが無いか `side-toc` がオフのときは分けず、`el` の中は本文だけにする。`--mdmark-content-width` は本文の列に当てる。差分を開いている間は `aside` を隠す（制約「差分を開く UI」）。印刷では `aside` を出さず、本文の列を紙の幅いっぱいに出す'
    notes: 読み上げ名・ボタンの文言・アイコンは画面設計『文書』と部品設計。パネルの `nav` は `aria-label="右側の目次"` で、本文の中の目次（`<!-- toc -->`）と読み上げ名を分ける
  - item: 右側の目次の出し方
    constraint: '`side-toc.mode` が `hover` のとき、パネルは隠して置き（透明にしてポインターを受けない。Tab では項目へ移れる）、右端の線にポインターを乗せている間と、パネルの中にフォーカスがある間だけ出す。ピン止めのボタン（`aria-pressed`）を押すと、ポインターとフォーカスが外れても出し続け、パネルを本文に重ねず右の列に置く。押し直すと外す。ポインターを乗せられない端末（`hover: none`）では、右端の線の代わりに目次を出すボタンを置く。`fixed` のときは右端の線を置かず、目次を出すボタン（三点リーダーのアイコン・`aria-expanded`・`aria-controls`）を押すとパネルを右の列に出し続け、押し直すと隠す。目次を出すボタンで出したパネルの中にフォーカスがある間の Esc は、パネルを隠してフォーカスを目次を出すボタンへ戻す。ピン止めと目次を出すボタンの状態は保存せず、`mount` のたびに外した状態で始め、`update` では保つ'
    notes: ピン止めで右の列に置くのと、ポインターを乗せられない端末のボタンは、モック作成で案 A に決定（確認ログ）
  - item: 狭い幅の右側の目次
    constraint: 描く先の要素の幅が 48rem 未満のとき、出し方によらず右端の線を置かず、本文の上端の `--mdmark-sticky-top` の位置に留める帯に、今いる節の見出しの文字と目次を出すボタンを置く。目次を出すボタンを押すと、パネルを帯の下に本文へ重ねて開き、幅は描く先の要素に収める。パネルの項目を押すとパネルを隠す。見出しへ移ったときは、見出しが帯に覆われない位置までスクロールする
    notes: 境目と出し方はモック作成で案 A に決定（確認ログ）。幅はコンテナクエリで判定するため、コンテナクエリを持たないブラウザ（Chrome 105・Firefox 110 未満。対応ブラウザの下限は Chrome 99・Firefox 98）では帯を出さず、広い幅の出し方になることを許す
  - item: 今いる節
    constraint: 画面の上端から高さの 25% の線より上にある最後の h1〜h3 の見出し（線より上に無いときは画面にある最初の h1〜h3 の見出し）を今いる節にし（h4〜h6 は数えず、h4 の下を読んでいる間はその上の h3 を今いる節にする）、その項目のリンクに `aria-current="location"`、右端の線のその見出しの線に `data-current` を付け、狭い幅の帯にその見出しの文字を出す。閉じた節と選ばれていないタブの中の見出しは数えない。見出しが線を越えたとき（`IntersectionObserver`）・節の開閉・タブの切り替え・`hashchange` のたびに決め直し、スクロールのたびに全ての見出しを測らない
  - item: 右側の目次から移る
    constraint: 項目を押すと、URL の `#ID` で移るとき（制約の「節と行の詳細の開閉」「URL の ID でタブの中へ移る」）と同じく、外側の閉じた節を開き、選ばれていないタブを選んでから見出しへ移り、URL の `#` の後ろを見出しの ID にする。URL がすでにその ID のとき（`hashchange` が起きない）も、同じく開いてから移る
  - item: すべて展開・すべて折りたたむ
    constraint: '`sections` がオンで文書に節が 1 つ以上あるとき、右側の目次のパネルの上部に、文字を持たずアイコンと `aria-label`・`title` を持つ、すべて展開とすべて折りたたむのボタンを置く。すべて展開は文書の全ての節（h1〜h4）を開き、すべて折りたたむは h1 の節を開いて h2〜h4 の全ての節を閉じる。開閉のボタンの `aria-expanded` を合わせ、フォーカスは押したボタンに残す'
    notes: アイコンだけにするのと H1 の節を閉じないのは確認ログの決定
  - item: 入れ子をまとめて開閉
    constraint: Shift を押しながら節の開閉のボタンを押したとき（`click` の `shiftKey`）と、ボタンにフォーカスして Shift を押しながら Enter・Space を押したとき（ボタンの `keydown` の `shiftKey`。既定の動きを止め、`click` を起こさない）、その節を今と逆の状態にし、中の入れ子の全ての節を同じ状態にする。外側の節とほかの節は変えない
    notes: Firefox ではキーで押した `click` の `shiftKey` が立たないため、キーは `keydown` で受ける（計画書）
  - item: エイリアスの照合
    constraint: '`glossary` がオンのとき、`opts.aliases` のエイリアスの `name` と `aliases` を、制約の「用語と文書の別名の下線」と同じ区切り・正規化・範囲で照合し、エイリアスの `id` ごとに節（h2〜h4）ごとに最初に出たところだけに下線を引く（`avoid` の種類は制約の「やめた言い方のマーカー」）。`alias_type` が `env` のもの・`term`・`doc`・`command`・`url`・`skill`・`tool`・`path`・`avoid` に無いもの・種類の必須のキーが空のもの・`id` が前のエイリアスと同じものは照合せず、知らせの枠も出さない。図の部品の `{{語}}` はエイリアスを引かない'
    notes: '`env` は値にシークレットキーを含みうるため、`buildAliases` を通さずに渡されても照合しない。種類ごとの必須のキーは ER 図『エイリアス』の補足'
  - item: エイリアスのツールチップ
    constraint: 種類ごとの区分の見出し（`term` は「用語」、`doc` は「文書」、`command` は「コマンド」、`url` は「URL」、`skill` は「スキル」、`tool` は「ツール」、`path` は「パス」）の下に名前と `description` を出す。`command` はコマンドをコードで出してコピーのボタンを置き、`cwd` があれば実行場所を出す。`url` は URL の文字列にリンクを埋め、長い URL は 1 行に収めて末尾を「...」で省略する。`skill`・`tool`・`path` はスキル名・ツール名・パスをコードで出す。`avoid` は「代わりの用語」に `replacement` を、`term` の `avoid` は「代わりの用語」にそのエイリアスの名前と `description` を出す。値は制約の「索引の値の出し方」と同じく文字として出す
    notes: 区分と要素の形は部品設計で決める
  - item: エイリアスの URL
    constraint: '`url` の URL は http・https のものだけをリンクにし、ほかの URL（`javascript:` など）は `a` 要素にせず文字で出す'
  - item: コマンドのコピー
    constraint: '`command` のツールチップの `コピー` のボタン（`type="button"`）を押すと、`command` の文字を `navigator.clipboard.writeText` に書く。書けたらボタンを `コピーしました` にして 2 秒で戻し、書けないとき（`navigator.clipboard` が無いか拒まれた）は `コピーできませんでした` にして次に押すまで残す。どちらも `role="status"` で読み上げて知らせ、例外を外へ出さない。押した後もツールチップは出したままにする'
    notes: 知らせ方は制約の「コードブロックのコピー」と同じ
  - item: 選んだテーマ
    constraint: '`opts.config.colorTheme` のテーマの `--mdmark-color-*` の値の組を、ページ全体（`:root`）に当てる。同じページに別のテーマの文書を並べたときは、`theme-paper`・`theme-slate`・`theme-contrast` の並びで後のテーマが全ての文書に当たる（`dev-swiss` は他のテーマに負ける）。値の組はテーマごとに明るい配色と暗い配色を持ち、どちらを使うかは制約「配色の切り替え」で決める。印刷では選んだテーマの明るい配色にする。値の組は `@layer mdmark` の中に置き、使う側が層の外で上書きした変数は選んだテーマに勝つ。`destroy` で当てたテーマを外し、`update` は `mount` に渡したテーマのまま描く'
    decided_by: dev/設計書/デザイン方針#
    notes: テーマの値はデザイン方針の `## 採用スタイル`。描く先に属性 `data-mdmark-color-theme` を付け、`:root:has()` で当てる（モジュール構成『描く』の `COLOR_THEME_ATTRIBUTE`）
  - item: 差分の出し方
    constraint: '`opts.diffMode` が `button` のときは制約「差分を開く UI」のとおり。`open` のときは、描いた時点で「変更を見る」を押した状態（`aria-expanded="true"`・本文を隠す）にし、制約「比べる 2 つのリビジョン」のとおり取り出し元を呼んで差分の行を出す。押し直すと閉じ、`update` の後は開いた状態で描き直して取り出し元を呼び直す。`blocks` のときは「変更を見る」と差分の場所・ミニマップを置かず、本文を描いた後に `revisions` を 1 回呼び、2 つ以上あれば 2 番目（前）と 1 番目（後）の `content` を 1 回ずつ呼び、制約「描いた文書のブロックの色分け」で本文を描き直す。取り出し元を待つ間・リビジョンが 1 つのとき・2 つの本文が同じときは、`opts.markdown` を色を当てずに描いた本文のまま出す。`update` のたびに取り出し元を呼び直し、制約「差分の待ち」と同じく古い結果は描かない'
    notes: '`blocks` は確認ログのモックへの合意（差分のプレビューは文書を色分けして出し、ボタンと選ぶ欄を持たない）。VS Code 拡張機能が `blocks` で描く'
  - item: 対応する差分の出し方
    constraint: 配布物の `dist/index.js` は `diffModes`（`readonly ["button", "open", "blocks"]`）を名前付きで公開する。使う側は、読んだ配布物が `diffModes` を持たないか目的の出し方を含まないとき、その出し方に対応しないバージョンと見なす
    notes: '`opts.diffMode` を知らない前のバージョンの `mount` は指定を黙って無視するため、使う側が描く前に見分けられるようにする（VS Code 拡張機能の差分に対応しないバージョンの理由）'
  - item: 描いた文書のブロックの色分け
    constraint: 前と後の Markdown をそれぞれ今の描き方で描き、ブロックに分ける。ブロックは、本文の直下か節の中身（`div.mdmark-section-body`）の直下の要素のうち `mdmark-section-body` を除くもの（見出し・段落・リスト・表・コードブロック・注意書き・埋め込んだ HTML の範囲 等）で、節の中身はその中のブロックに分ける。リストはいちばん外の項目（`li`）、表は `tbody` の行（`tr`）を 1 つのブロックにする。ブロックの行の範囲は `data-source-line` から次のブロックの `data-source-line` の前まで。制約「差分の計算」の行の比べで、後のブロックの範囲に足した行があれば追加の色を当てる。前のブロックで範囲の空白だけでない行が全て消した行のものは削除の候補にし、制約「書き換えと入れ替えの見分け」で削除したブロックを決める
    notes: 確認ログの色分けの描き方（B）とリストと表の単位（A）。`sections` は既定でオンで、見出しの後ろは `mdmark-section-body` に入る（`src/render/syntax/sections.ts` の `wrapSections`）。節の開閉・右側の目次・アンカーは普通の描き方のまま使う
  - item: 書き換えと入れ替えの見分け
    constraint: 同じ変えた塊の中で、削除の候補と追加の色を当てた後のブロックを前から順に対にし、対のブロックの文字を語ごとに比べる。同じ文字の数が長い方の文字の数の半分以上なら書き換えとして削除を出さず、半分未満なら入れ替えとして削除と追加の両方を出す。対にならない削除の候補は削除したブロックにする
    notes: 確認ログのモックへの合意（語を書き換えた段落は追加だけ、別の段落に入れ替えたときは削除と追加が並ぶ）
  - item: 色を当てたブロックの要素
    constraint: 本文の直下と節の中身の直下のブロックは、その親の中で `div.mdmark-diff-block` で包み、リストの項目と表の行はその要素に class `mdmark-diff-block` を付ける。どちらも `data-kind`（`add` か `del`）を持ち、先頭（表の行は 1 つ目のセルの先頭）に読み上げにだけ出す `追加:`・`削除:` と、`aria-hidden` の `+`・`−` を置く。削除したブロックは、前の文書で直前にあった変えていないブロックと同じ親のその後ろに、同じ節に直前のブロックが無ければ、前の文書で属していた節の中身の先頭（節に属していなければ本文の先頭）に差し込む。見出しごと消した節は、見出しと節の中身を 1 つの削除したブロックにして同じ決まりで差し込む。リストの項目と表の行は前の文書で直前にあった項目・行の後ろ（無ければ同じリスト・表の先頭）に差し込み、後の文書にそのリスト・表が無いときはリスト・表ごと削除したブロックにする。削除したブロックの中の要素は `data-source-line` と `id` を持たず、番号付きリストの削除した項目は番号を使わない
    notes: 見た目は確認ログのモックへの合意（左の余白の + / −）。色は `--mdmark-color-diff-add-bg`・`--mdmark-color-diff-del-bg`・`--mdmark-color-diff-add-sign`・`--mdmark-color-diff-del-sign`。削除したブロックはスクロールを合わせる先と見出しのアンカーにしない
