        M->>P: data-hint の文を出す
        P->>M: Tab で「分類」にフォーカスし、Esc を押す
        M->>P: ツールチップを消し、フォーカスを「分類」に残す
        P->>M: hint の箱の印にポインターを乗せる
        M->>P: hint の文を出す
    expected:
      - '`自動返信` の上では `role="tooltip"` の要素が `hidden` を持ったままで、`div` の `cursor` の計算値が `help` でない'
      - 印の上で、印の `aria-describedby` が指すツールチップが `hidden` を持たず、文字が `div` の `data-hint` の値
      - '`分類` にフォーカスするとそのツールチップが出て、Esc の後に `hidden` を持ち、フォーカスが `分類` にある'
      - '`分類` の `cursor` の計算値が `help` でない'
      - '`hint` の箱の印の上で `hint` の文のツールチップが出て、箱の名前の上では出ない'
      - ページの中のツールチップの `id` が重ならない
