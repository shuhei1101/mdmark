  - name: 正常系（差分を開く）
    summary: 取り出し元を渡して描き、「変更を見る」で一番新しい 2 つのリビジョンの差分を出す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
        notes: 描く先の要素の幅は 1280px。`opts.config` は渡さない（`side-toc`・`sections` はオン）
      - name: 3 つのリビジョンの取り出し元
        description: '`r1`・`r2`・`r3` を新しい順に返し、`r2` から `r3` で段落の 1 行の語 `差分` を `変更` に書き換え、行を 1 つ足し、別の行を 1 つ消した本文を返す `DiffSource`。受けた呼び出しの引数を記録する'
        notes: '`opts.docId` は `guide`。文書は `h1` で始まり、その下に `h2` を持つ'
