      - '`console.error` が呼ばれない'
    test: test_normal_when_comments_disabled
  - name: 異常系（コメントを保存できない）
    summary: '`save` が reject すると、入力欄と本文を残して知らせを出し、印を付けない'
    setup:
      - name: 配布物を読んだページ
        description: 正常系（コメントを付ける）と同じ
      - name: 保存できない読み書きの関数
        description: '`load` は空の配列、`save` は `Error("network")` で reject する'
      - name: Mock
        description: 正常系（コメントを付ける）と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant S as 読み書きの関数
        P->>M: 文字を選び、コメントを書いて保存する
        M->>S: save({ docId, comment })
        S-->>M: reject
        M->>P: 入力欄に知らせを出す
    expected:
      - 入力欄が開いたままで、書いた本文が残っている
      - '`role="alert"` の要素が `コメントを保存できませんでした。` で始まる文を持つ'
      - 選んだ文字に印が無い
      - '`console.error` が 1 回呼ばれ、引数に `save`・`guide`・元のエラーを含む'
    test: test_error_when_comment_save_rejected
  - name: 異常系（コメントの読み書きの関数が無い）
    summary: '`comments` がオンで読み書きの関数を渡さないと、ボタンを出さず、`console.error` に 1 回だけ出す'
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。`opts.config.features` は `{ comments: true }`、`opts.commentStore` は渡さない'
      - name: 段落を持つ Markdown
        description: 正常系（コメントを付ける）と同じ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>P: 文書を描く
        P->>M: update(markdown)
        P->>M: 本文の文字を選ぶ
        M->>P: ボタンを出さない
    expected:
      - 文字を選んでもコメントのボタンが出ない
      - '`update` を挑んでも `console.error` は 1 回だけで、引数に `commentStore` を含む'
      - 文書の本文は描かれ、例外を投げない
    test: test_error_when_comment_store_missing
  - name: 異常系（コメントで docId が無い・TypeError）
    summary: 読み書きの関数を渡して `docId` を渡さないと、何も描かずに TypeError を投げる
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。`opts.config.features` は `{ comments: true }`'
      - name: コメントの読み書きの関数
        description: 正常系（コメントを付ける）と同じ
      - name: Mock
        description: 正常系（コメントを付ける）と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config, commentStore })
        M-->>P: TypeError
    expected:
      - '`mount` が `TypeError` を投げ、メッセージに `docId` を含む'
      - '`el` の中身と class が変わらない'
      - '`load` が呼ばれない'
    test: test_error_when_comment_doc_id_missing
  - name: 異常系（ビュー・コメントの部品のモジュールを読めない）
    summary: 部品のモジュールを読めないと、ビューの印の場所は表のまま残し、コメントのボタンを出さず、`console.error` に出す
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。`opts.config.features` は `{ comments: true }`、`opts.docId` は `guide`'
      - name: ビューの印と段落を持つ Markdown
        description: 正常系（ビューを描く）の表と、正常系（コメントを付ける）の段落を持つ文書
      - name: コメントの読み書きの関数
        description: 正常系（コメントを付ける）と同じ
      - name: Mock
        description: ビューとコメントの部品のモジュールの要求を、配信で 404 に差し替える
        notes: 部品のモジュールを別の配布ファイルに分けないと決まったら、このフローはモジュール構成設計で外す
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config, docId, commentStore })
        M->>M: 部品のモジュールを読めない
        M->>P: 表と本文を描き、切り替えとコメントのボタンを置かない
    expected:
      - ビューの印の場所に 5 行の表が残り、切り替えとボードが無く、知らせの枠も無い
      - 文字を選んでもコメントのボタンが出ず、`load` が呼ばれない
      - '`console.error` が部品ごとに 1 回ずつ呼ばれ、引数に部品の名前（`view`・`comments`）・モジュールの URL・元のエラーを含む'
      - 例外を投げず、段落は描かれる
    test: test_error_when_part_module_unavailable
lead: 使う側のページが、要素と Markdown と設定を渡し、要素の中に文書を描く。戻り値で本文の差し替えと片付けができる。
idempotent: false
side_effects: '`el` の中身と class を書き換え、記法の操作のイベントを `el` の中に付ける。`window` の `beforeprint`・`afterprint`・`hashchange` と、絞り込みのドロワーを開いている間だけ `document` の `pointerdown`・`keydown` を受け取る。図の部品か埋め込んだ HTML があるとき、図の表示する枠と埋め込んだ HTML の大きさを `ResizeObserver` で見、ツールチップを開いている間だけ `document` の `keydown` と `window` の `scroll`・`resize` を受け取り、全画面の間だけ `el` の中に `dialog` を置く。操作できる部品の写すボタンでクリップボードに書く。`data-group` を持つタブがあるとき、localStorage の `mdmark-tabs:{group}` を描くたびに読み、読む人がタブを選ぶと書く。そのとき、ページの中の `el` の外にある同じ `group` のタブ群の選択も書き換える。文書に外部ライブラリか拡張の印があるとき、そのモジュールを読む。`opts.diffSource` を渡したとき、読む人が差分を開くと取り出し元の `revisions`・`content` を呼び、差分の行を出している間だけミニマップの帯を置き、送り先のスクロールの `scroll` と `window` の `resize` を受け取る。文書にビューの印があるとき、ビューの部品のモジュールを読む。`comments` がオンで `opts.commentStore` を渡したとき、コメントの部品のモジュールを読み、`load` を描くたびに 1 回呼び、保存で `save` を呼ぶ。その間は `document` の `selectionchange` を受け取り、コメントのボタン・入力欄・吹き出しを `document.body` に置く'
