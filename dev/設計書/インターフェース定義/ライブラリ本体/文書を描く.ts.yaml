        description: '`<!-- tabs: group=os -->` で `### macOS`・`### Windows` を囲んだ範囲、`<!-- tabs: group=lang -->` で `### Python`・`### TypeScript` を囲んだ範囲、`<!-- tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書'
      - name: Mock
