title: "文書を描く"
entry:
  kind: operation
  value: '`mount(el, opts)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 要素の中に Markdown を HTML として描く
    setup:
      - name: 配布物を読んだページ
        description: ビルドした `dist/index.js` と `dist/index.css` を読み、描く先の `div` を 1 つ持つページ
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表（右寄せの列を持つ）・コードブロック（`ts`）・リンクを持つ文書
        notes: '`opts.config` は渡さない'
      - name: Mock
        description: 差し替える依存は無い（手元で配信した配布物をブラウザで読む）
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: Markdown を解析し、印を拾う
        M->>M: 許可していない要素・属性・URL を落とす
        M->>P: el に class mdmark を付け、中に本文を描く
        M-->>P: { update, destroy }
    expected:
      - '`el` が class `mdmark` を持つ'
      - '`el` の中に `h1`・`p`・`ul`・`table`・`pre > code.language-ts`・`a` がある'
      - '`a` の `href` が Markdown に書いた URL'
      - 表の `td` が、同じ列の見出しの文言を `data-label` に持つ
      - 右寄せの列の `td` が class `mdmark-align-right` を持ち、`style` 属性を持たない
      - 戻り値が `update` と `destroy` の関数を持つ
    test: test_normal
  - name: 正常系（本文を差し替える）
    summary: '`update` で本文だけを描き直す'
    setup:
      - name: 文書を描いた要素
        description: 正常系の見本の Markdown を `mount` で描いた要素
      - name: 差し替える Markdown
        description: 見出しを 1 つだけ持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: update(markdown)
        M->>P: el の中を新しい本文に置き換える
    expected:
      - '`el` の中が、差し替えた Markdown の見出しだけになる'
      - '`el` が class `mdmark` を持ったまま'
    test: test_normal_when_updated
  - name: 正常系（片付ける）
    summary: '`destroy` で描いたものとイベントを片付ける'
    setup:
      - name: 文書を描いた要素
        description: 閉じた `details` を持つ文書を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い。印刷は `window` へ `beforeprint` のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: destroy()
        M->>P: el の中を空にし、class mdmark を外す
        M->>M: beforeprint・afterprint の受け取りを外す
        P->>M: update(markdown)
        M-->>P: 何もしない
    expected:
      - '`el` の中が空で、class `mdmark` を持たない'
      - '`destroy` の後に `update` を呼んでも、`el` の中は空のまま'
      - '`destroy` の後に `beforeprint` を送っても例外が出ない'
    test: test_normal_when_destroyed
  - name: 正常系（同じ要素へもう一度描く）
    summary: 描いた要素へ `mount` を呼ぶと、前の描画を片付けてから描く
    setup:
      - name: 文書を描いた要素
        description: 段落 A を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown: 段落 B })
        M->>M: 前の mount の destroy を行う
        M->>P: el の中に段落 B を描く
        P->>M: 前の戻り値の update(段落 C)
        M-->>P: 何もしない
    expected:
      - '`el` の中が段落 B だけ'
      - 前の `mount` の戻り値で `update` を呼んでも、`el` の中は段落 B のまま
    test: test_normal_when_mounted_twice
  - name: 正常系（未知の印）
    summary: 対応表にも機能の印にも無い印を無視して描く
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 未知の印を持つ Markdown
        description: '段落の間に `<!-- unknown: 1 -->` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: 未知の印を取り除く
        M->>P: el の中に本文を描く
    expected:
      - 印の前後の段落がある
      - '`el` の `innerHTML` に `<!--` と `unknown` が無い'
    test: test_normal_when_unknown_mark
  - name: 正常系（スクリプトを落とす）
    summary: 文書に書いたスクリプトを落として描き、実行しない
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ。スクリプトが実行されたら `window.__ran` が `true` になる
      - name: スクリプトを書いた Markdown
        description: '`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・`style` 属性を持つ段落・閉じた `details` を持つ文書'
        notes: どのスクリプトも、実行されたら `window.__ran = true` にする
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: script 要素・on で始まる属性・javascript: の URL・style 属性を落とす
        M->>P: el の中に本文を描く
        P->>P: リンクを押す
    expected:
      - '`el` の中に `script` 要素・`on` で始まる属性・`style` 属性が無い'
      - '`javascript:` の URL を持つ `href` が無い'
      - リンクを押した後も `window.__ran` が `true` でない
      - '`details` と `summary` がある'
    test: test_normal_when_script_in_markdown
  - name: 正常系（外部ライブラリの印）
    summary: 文書に外部ライブラリの印があるときだけ、そのモジュールを読んで印の場所に描かせる
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 外部ライブラリの印を持つ Markdown
        description: '段落の間に `<!-- test-lib: a b -->` を持つ文書'
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/test-lib.js" }`'
        notes: ページの URL を基準にした相対 URL
      - name: Mock
        description: 外部ライブラリの代役として、`draw(slot, args)` で `slot` の文字を `drawn:` と引数を `,` で結んだものにするモジュールを、手元の開発サーバーが `/fixtures/test-lib.js` で配る。要求の件数は `performance.getEntriesByType("resource")` で数える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>P: 印の場所に読み込み中の枠を描く
        M->>X: import(URL)
        X-->>M: モジュール
        M->>X: draw(印の場所の要素, ["a", "b"])
        X->>P: 印の場所に描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 1 件'
      - 描いた直後、印の場所の要素が class `mdmark-embed` と `role="status"` を持ち、文字が `図を読み込んでいます`
      - 読み込んだ後、印の場所の要素の文字が `drawn:a,b`
      - 印の前後の段落がある
    test: test_normal_when_library_mark
  - name: 正常系（外部ライブラリの印が無い）
    summary: 印の無い文書では外部ライブラリを読まない
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 印の無い Markdown
        description: 段落だけを持つ文書
      - name: 設定
        description: 外部ライブラリの印の正常系と同じ
      - name: Mock
        description: 外部ライブラリの印の正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>P: el の中に本文を描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 0 件'
      - 段落がある
    test: test_normal_when_no_library_mark
  - name: 正常系（印刷の前に折り畳みを開く）
    summary: 印刷の機能がオンのとき、印刷の前に閉じた折り畳みを開き、印刷の後に戻す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 折り畳みを持つ Markdown
        description: 閉じた `details` と、開いた `details` を 1 つずつ持つ文書
        notes: '`opts.config` は渡さない（`features.print` の既定は `true`）'
      - name: Mock
        description: 印刷は `window` へ `beforeprint`・`afterprint` のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        P->>M: beforeprint
        M->>P: 閉じた details を開く
        P->>M: afterprint
        M->>P: 開いた details だけを閉じ直す
    expected:
      - '`beforeprint` の後、2 つの `details` が `open` を持つ'
      - '`afterprint` の後、初めに閉じていた `details` だけが `open` を持たない'
    test: test_normal_when_printed
  - name: 正常系（文書の印で機能を外す）
    summary: 設定でオンの機能を、文書の印でその文書だけオフにする
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 機能を外す Markdown
        description: '先頭に `<!-- features: -print -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: true }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書の印を重ねる
        P->>M: beforeprint
        M-->>P: 何もしない
    expected:
      - '`beforeprint` の後も、`details` が `open` を持たない'
      - '`el` の中に印の文字が無い'
    test: test_normal_when_feature_disabled_by_mark
  - name: 正常系（文書の印で機能を足す）
    summary: 設定でオフの機能を、文書の印でその文書だけオンにする。知らない機能名は無視する
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 機能を足す Markdown
        description: '先頭に `<!-- features: +print +unknown -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: false }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書の印を重ね、unknown を無視する
        P->>M: beforeprint
        M->>P: 閉じた details を開く
    expected:
      - '`beforeprint` の後、`details` が `open` を持つ'
      - '`el` の中に印の文字が無い'
    test: test_normal_when_feature_enabled_by_mark
  - name: 正常系（層の外の CSS で上書きする）
    summary: 使う側のページが層の外に書いた CSS と変数の上書きが、mdmark の CSS に勝つ
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。加えて、層の外に `.mdmark p { color: rgb(1, 2, 3) }` と `.mdmark { --mdmark-color-link: rgb(4, 5, 6) }` を書いた `style` 要素を持つ'
      - name: 段落とリンクを持つ Markdown
        description: 段落と、リンクを持つ段落と、リストを持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: el の中に本文を描く
        P->>P: 層の外の規則が層の中の規則に勝つ
    expected:
      - '`p` の `color` の計算値が `rgb(1, 2, 3)`'
      - '`a` の `color` の計算値が `rgb(4, 5, 6)`'
      - '`li` の `color` の計算値が、層の中の `--mdmark-color-fg` の値'
    test: test_normal_when_theme_overridden
  - name: 異常系（外部ライブラリを読めない・知らせの枠）
    summary: 外部ライブラリを読めない印の場所だけを知らせの枠にし、ほかは描く
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 外部ライブラリの印を持つ Markdown
        description: 外部ライブラリの印の正常系と同じ文書
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/missing.js" }`'
      - name: Mock
        description: '`/fixtures/missing.js` は手元の開発サーバーが 404 を返す'
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>X: import(URL)
        X-->>M: 404
        M->>P: 印の場所を知らせの枠に替える
    expected:
      - 印の場所の要素が class `mdmark-notice` と `role="status"` を持つ
      - 知らせの枠の題が `この図を表示できません`
      - 知らせの枠の本文が `表示に使うライブラリ（test-lib）を読み込めませんでした。ネットワークにつながっているかを確かめて、ページを読み込み直してください。`
      - 印の前後の段落がある
      - '`mount` が例外を投げない'
    test: test_error_when_library_not_found
lead: 使う側のページが、要素と Markdown と設定を渡し、要素の中に文書を描く。戻り値で本文の差し替えと片付けができる。
idempotent: false
side_effects: '`el` の中身と class を書き換える。`window` の `beforeprint`・`afterprint` を受け取る。文書に外部ライブラリの印があるとき、そのモジュールを `import()` で読む'
callers:
  - dev/設計書/シナリオ/単一ユースケース/文書を描く#
  - dev/設計書/シナリオ/単一ユースケース/テーマを上書きする#
  - dev/設計書/シナリオ/単一ユースケース/機能のオン・オフを文書で上書きする#
  - dev/設計書/シナリオ/単一ユースケース/外部ライブラリを使うときだけ読み込む#
  - dev/設計書/シナリオ/単一ユースケース/文書を印刷する#
exclusivity: 同じ要素へ 2 回目の `mount` を呼ぶと、前の `mount` の `destroy` を先に行う。`update`・`destroy` の後に、前の描画で始めた外部ライブラリの読み込みが終わっても、その結果は描かない
request:
  - name: el
    type: HTMLElement
    required: true
    location: argument
    description: 描く先の要素
  - name: opts.markdown
    type: string
    required: true
    location: argument
    description: 描く Markdown
  - name: opts.config
    type: MdmarkConfig
    required: false
    default: なし（全てのキーに既定を当てる）
    location: argument
    description: 使う側のサーバーが `mdmark.config.yaml` を読んだオブジェクト。省いたキーには既定を当てる
  - name: opts.config.features
    type: Record<string, boolean>
    required: false
    default: '`{ print: true }`'
    location: argument
    description: '機能のオン・オフの既定。文書の `<!-- features: +機能 -機能 -->` がその文書だけ上書きする'
    notes: 知らない機能名は無視する。この Issue の機能は `print`（印刷の前に折り畳みを開く）
  - name: opts.config.libraries
    type: Record<string, string>
    required: false
    default: '`{}`'
    location: argument
    description: 印の名前から外部ライブラリのモジュールの URL を引く対応表。mdmark が持つ既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は足す
    constraints: URL はページの `document.baseURI` を基準に解決する
    example: '{ "test-lib": "/fixtures/test-lib.js" }'
request_example: |-
  ```json
  {
    "markdown": "# 見出し\n\n<!-- features: -print -->\n\n本文",
    "config": {
      "features": { "print": true },
      "libraries": { "test-lib": "/fixtures/test-lib.js" }
    }
  }
  ```
response:
  - name: update
    type: '(markdown: string) => void'
    description: 本文だけを描き直す。設定は `mount` に渡したものを使う
    notes: '`destroy` の後は何もしない'
  - name: destroy
    type: () => void
    description: '`el` の中を空にして class `mdmark` を外し、`beforeprint`・`afterprint` の受け取りを外す'
    notes: 2 回目以降は何もしない
exceptions:
  - name: なし（正常終了）
    condition: Markdown を描き、戻り値を返す
  - name: なし（知らせの枠）
    condition: 外部ライブラリのモジュールを読めない、またはモジュールの `draw` が例外を投げる
    notes: 例外を投げず、その印の場所だけを知らせの枠に替える
constraints:
  - item: 描く本文
    constraint: '`render(markdown, { config })` が返す HTML 文字列と同じ'
    notes: dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts
  - item: 外部ライブラリのモジュールの形
    constraint: '`draw(slot: HTMLElement, args: string[]): void | Promise<void>` を名前付きで export する。`slot` は印の場所の要素、`args` は印の引数を空白で区切ったもの'
  - item: 外部ライブラリの読み込み
    constraint: 対応表の URL を `import()` に渡す。import map は使わない。同じ文書の同じ名前の印は 1 回だけ読む
  - item: 外部ライブラリの印の場所
    constraint: 読み込みの間は、class `mdmark-embed`・`role="status"`・文字 `図を読み込んでいます` の要素を置く
    notes: 高さは本文の CSS が先に取る（モジュール構成設計）
  - item: 知らせの枠
    constraint: class `mdmark-notice`・`role="status"` の要素に、題（class `mdmark-notice-title` の `strong`）と本文（`p`）を置く。題は図の印なら `この図を表示できません`、図でない印なら `この箇所を表示できません`。本文は `表示に使うライブラリ（{印の名前}）を読み込めませんでした。ネットワークにつながっているかを確かめて、ページを読み込み直してください。`
    notes: 印の名前は `code` 要素で囲む。設定の `libraries` で足した印は図の印として扱う
  - item: テーマ
    constraint: mdmark の CSS は `@layer mdmark` に入る。使う側は層の外の CSS と `--mdmark-` の変数で上書きする。mdmark は使う側の `theme.css` を読まない（使う側のページが `<link>` で読む）
    notes: '`theme.css` の読み込み方は要件.md の `未確定`（推奨 A）'
  - item: 対応ブラウザ
    constraint: Chrome 99・Firefox 97・Safari 16.4 以上
    decided_by: dev/設計書/非機能要件/非機能要件#
