title: "文書を描く"
entry:
  kind: operation
  value: '`mount(el, opts)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 要素の中に Markdown を HTML として描く
    setup:
      - name: 配布物を読んだページ
        description: ビルドした `dist/index.js` と `dist/index.css` を読み、描く先の `div` を 1 つ持つページ
      - name: 見本の Markdown
        description: 見出し・段落・リスト・表（右寄せの列を持つ）・コードブロック（`ts`）・リンクを持つ文書
        notes: '`opts.config` は渡さない'
      - name: Mock
        description: 差し替える依存は無い（手元で配信した配布物をブラウザで読む）
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: Markdown を解析し、印を拾う
        M->>M: 許可していない要素・属性・URL を落とす
        M->>P: el に class mdmark を付け、中に本文を描く
        M-->>P: { update, destroy }
    expected:
      - '`el` が class `mdmark` を持つ'
      - '`el` の中に `h1`・`p`・`ul`・`table`・`pre > code.language-ts`・`a` がある'
      - '`a` の `href` が Markdown に書いた URL'
      - 表の `td` が、同じ列の見出しの文言を `data-label` に持つ
      - 右寄せの列の `td` が class `mdmark-align-right` を持ち、`style` 属性を持たない
      - 戻り値が `update` と `destroy` の関数を持つ
    test: test_normal
  - name: 正常系（本文を差し替える）
    summary: '`update` で本文だけを描き直す'
    setup:
      - name: 文書を描いた要素
        description: 正常系の見本の Markdown を `mount` で描いた要素
      - name: 差し替える Markdown
        description: 見出しを 1 つだけ持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: update(markdown)
        M->>P: el の中を新しい本文に置き換える
    expected:
      - '`el` の中が、差し替えた Markdown の見出しだけになる'
      - '`el` が class `mdmark` を持ったまま'
    test: test_normal_when_updated
  - name: 正常系（片付ける）
    summary: '`destroy` で描いたものとイベントを片付ける'
    setup:
      - name: 文書を描いた要素
        description: 閉じた `details` を持つ文書を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い。印刷は `window` へ `beforeprint` のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: destroy()
        M->>P: el の中を空にし、class mdmark を外す
        M->>M: beforeprint・afterprint の受け取りを外す
        P->>M: update(markdown)
        M-->>P: 何もしない
    expected:
      - '`el` の中が空で、class `mdmark` を持たない'
      - '`destroy` の後に `update` を呼んでも、`el` の中は空のまま'
      - '`destroy` の後に `beforeprint` を送っても例外が出ない'
    test: test_normal_when_destroyed
  - name: 正常系（同じ要素へもう一度描く）
    summary: 描いた要素へ `mount` を呼ぶと、前の描画を片付けてから描く
    setup:
      - name: 文書を描いた要素
        description: 段落 A を `mount` で描いた要素
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown: 段落 B })
        M->>M: 前の mount の destroy を行う
        M->>P: el の中に段落 B を描く
        P->>M: 前の戻り値の update(段落 C)
        M-->>P: 何もしない
    expected:
      - '`el` の中が段落 B だけ'
      - 前の `mount` の戻り値で `update` を呼んでも、`el` の中は段落 B のまま
    test: test_normal_when_mounted_twice
  - name: 正常系（未知の印）
    summary: 対応表にも機能の印にも無い印を無視して描く
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 未知の印を持つ Markdown
        description: '段落の間に `<!-- unknown: 1 -->` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: 未知の印を取り除く
        M->>P: el の中に本文を描く
    expected:
      - 印の前後の段落がある
      - '`el` の `innerHTML` に `<!--` と `unknown` が無い'
    test: test_normal_when_unknown_mark
  - name: 正常系（スクリプトを落とす）
    summary: 文書に書いたスクリプトを落として描き、実行しない
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ。スクリプトが実行されたら `window.__ran` が `true` になる
      - name: スクリプトを書いた Markdown
        description: '`script` 要素・`onclick` 属性を持つリンク・`javascript:` の URL のリンク・`style` 属性を持つ段落・閉じた `details` を持つ文書'
        notes: どのスクリプトも、実行されたら `window.__ran = true` にする
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>M: script 要素・on で始まる属性・javascript: の URL・style 属性を落とす
        M->>P: el の中に本文を描く
        P->>P: リンクを押す
    expected:
      - '`el` の中に `script` 要素・`on` で始まる属性・`style` 属性が無い'
      - '`javascript:` の URL を持つ `href` が無い'
      - リンクを押した後も `window.__ran` が `true` でない
      - '`details` と `summary` がある'
    test: test_normal_when_script_in_markdown
  - name: 正常系（外部ライブラリの印）
    summary: 文書に外部ライブラリの印があるときだけ、そのモジュールを読んで印の場所に描かせる
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 外部ライブラリの印を持つ Markdown
        description: '段落の間に `<!-- test-lib: a b -->` を持つ文書'
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/test-lib.js" }`'
        notes: ページの URL を基準にした相対 URL
      - name: Mock
        description: 外部ライブラリの代役として、`draw(slot, args)` で `slot` の文字を `drawn:` と引数を `,` で結んだものにするモジュールを、手元の開発サーバーが `/fixtures/test-lib.js` で配る。要求の件数は `performance.getEntriesByType("resource")` で数える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>P: 印の場所に読み込み中の枠を描く
        M->>X: import(URL)
        X-->>M: モジュール
        M->>X: draw(印の場所の要素, ["a", "b"])
        X->>P: 印の場所に描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 1 件'
      - 描いた直後、印の場所の要素が class `mdmark-embed` と `role="status"` を持ち、文字が `図を読み込んでいます`
      - 読み込んだ後、印の場所の要素の文字が `drawn:a,b`
      - 印の前後の段落がある
    test: test_normal_when_library_mark
  - name: 正常系（外部ライブラリの印が無い）
    summary: 印の無い文書では外部ライブラリを読まない
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 印の無い Markdown
        description: 段落だけを持つ文書
      - name: 設定
        description: 外部ライブラリの印の正常系と同じ
      - name: Mock
        description: 外部ライブラリの印の正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>P: el の中に本文を描く
    expected:
      - '`/fixtures/test-lib.js` への要求が 0 件'
      - 段落がある
    test: test_normal_when_no_library_mark
  - name: 正常系（印刷の前に折り畳みを開く）
    summary: 印刷の機能がオンのとき、印刷の前に閉じた折り畳みを開き、印刷の後に戻す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 折り畳みを持つ Markdown
        description: 閉じた `details` と、開いた `details` を 1 つずつ持つ文書
        notes: '`opts.config` は渡さない（`features.print` の既定は `true`）'
      - name: Mock
        description: 印刷は `window` へ `beforeprint`・`afterprint` のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        P->>M: beforeprint
        M->>P: 閉じた details を開く
        P->>M: afterprint
        M->>P: 開いた details だけを閉じ直す
    expected:
      - '`beforeprint` の後、2 つの `details` が `open` を持つ'
      - '`afterprint` の後、初めに閉じていた `details` だけが `open` を持たない'
    test: test_normal_when_printed
  - name: 正常系（文書の印で機能を外す）
    summary: 設定でオンの機能を、文書の印でその文書だけオフにする
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 機能を外す Markdown
        description: '先頭に `<!-- features: -print -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: true }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書の印を重ねる
        P->>M: beforeprint
        M-->>P: 何もしない
    expected:
      - '`beforeprint` の後も、`details` が `open` を持たない'
      - '`el` の中に印の文字が無い'
    test: test_normal_when_feature_disabled_by_mark
  - name: 正常系（文書の印で機能を足す）
    summary: 設定でオフの機能を、文書の印でその文書だけオンにする。知らない機能名は無視する
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 機能を足す Markdown
        description: '先頭に `<!-- features: +print +unknown -->` を持ち、閉じた `details` を持つ文書'
      - name: 設定
        description: '`opts.config.features` に `{ print: false }`'
      - name: Mock
        description: 印刷の前に折り畳みを開くの正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, config })
        M->>M: 設定の features に文書の印を重ね、unknown を無視する
        P->>M: beforeprint
        M->>P: 閉じた details を開く
    expected:
      - '`beforeprint` の後、`details` が `open` を持つ'
      - '`el` の中に印の文字が無い'
    test: test_normal_when_feature_enabled_by_mark
  - name: 正常系（層の外の CSS で上書きする）
    summary: 使う側のページが層の外に書いた CSS と変数の上書きが、mdmark の CSS に勝つ
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。加えて、層の外に `a { text-decoration-line: none }` と `.mdmark { --mdmark-color-link: rgb(4, 5, 6) }` を書いた `style` 要素を持つ'
        notes: 層の外の `a`（詳細度 0,0,1）を、層の中の `.mdmark a`（詳細度 0,1,1）の下線と競わせる
      - name: リンクを持つ Markdown
        description: リンクを持つ段落を持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: el の中に本文を描く
        P->>P: 層の外の規則が層の中の規則に勝つ
    expected:
      - '`a` の `text-decoration-line` の計算値が `none`（詳細度の低い層の外の規則が勝つ）'
      - '`a` の `color` の計算値が `rgb(4, 5, 6)`（変数の上書きが当たる）'
    test: test_normal_when_theme_overridden
  - name: 異常系（外部ライブラリを読めない・知らせの枠）
    summary: 外部ライブラリを読めない印の場所だけを知らせの枠にし、ほかは描く
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 外部ライブラリの印を持つ Markdown
        description: 外部ライブラリの印の正常系と同じ文書
      - name: 設定
        description: '`opts.config.libraries` に `{ "test-lib": "/fixtures/missing.js" }`'
      - name: Mock
        description: '`/fixtures/missing.js` は手元の開発サーバーが 404 を返す'
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant X as 外部ライブラリ
        P->>M: mount(el, { markdown, config })
        M->>X: import(URL)
        X-->>M: 404
        M->>P: 印の場所を知らせの枠に替える
    expected:
      - 印の場所の要素が class `mdmark-notice` と `role="status"` を持つ
      - 知らせの枠の題が `この図を表示できません`
      - 知らせの枠の本文が `表示に使うライブラリ（test-lib）を読み込めませんでした。ネットワークにつながっているかを確かめて、ページを読み込み直してください。`
      - 印の前後の段落がある
      - '`mount` が例外を投げない'
      - '`console.error` が 1 回呼ばれ、引数に印の名前 `test-lib`・URL・元のエラーを含む'
    test: test_error_when_library_not_found
  - name: 正常系（表を並べ替えて絞り込む）
    summary: 表の見出しで並べ替えを 3 状態で切り替え、絞り込みのドロワーで絞って外す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 表を持つ Markdown
        description: '`<!-- table: data filter=名前 -->` 〜 `<!-- /table -->` で、列 `名前`・`値` に `りんご`/`10`・`みかん`/`2`・`りんご飴`/`33` の 3 行を持つ表を囲んだ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 並べ替えと絞り込みのボタンを付けた表を描く
        P->>M: 値の列の見出しを 3 回押す
        M->>P: 昇順・降順・元の並びに並べ替える
        P->>M: 名前の列の絞り込みのボタンを押し、りんごを選ぶ
        M->>P: りんごの行だけを出す
        P->>M: 絞り込みを外すを押す
        M->>P: 3 行を出す
    expected:
      - 1 回目の後、値の列が上から `2`・`10`・`33` で、値の列の `th` の `aria-sort` が `ascending`
      - 2 回目の後、値の列が上から `33`・`10`・`2` で、`aria-sort` が `descending`
      - 3 回目の後、値の列が上から `10`・`2`・`33` で、`th` が `aria-sort` を持たない
      - 絞り込みのボタンは名前の列の見出しにだけある
      - ボタンを押した後、ボタンの `aria-expanded` が `true` で、ドロワーが `hidden` を持たず、候補の検索欄にフォーカスがある
      - '`りんご` を選んだ後、表に出ている行が `りんご` の 1 行だけ'
      - 「絞り込みを外す」を押した後、チェックボックスが全て外れ、表に 3 行とも出ている
      - ドロワーの外を押した後、ドロワーが `hidden` を持ち、ボタンの `aria-expanded` が `false`
    test: test_normal_when_table_sorted_and_filtered
  - name: 正常系（表をピン止めする）
    summary: はみ出す表にだけピン止めのボタンを出し、押した列までを左端に留める
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ。描く先の `div` の幅は 320px
      - name: 表を持つ Markdown
        description: 印で囲まない 10 列 30 行の表と、印で囲まない 2 列 2 行の表を持つ文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: はみ出す表の見出しにだけピン止めのボタンを出す
        P->>M: 2 列目のピン止めを押す
        M->>P: 1・2 列目を左端に留める
        P->>M: 2 列目のピン止めをもう一度押す
        M->>P: 留めを外す
    expected:
      - 10 列の表の各列の見出しに、`hidden` を持たないピン止めのボタンがある
      - 2 列の表には、表示されたピン止めのボタンが無い
      - 押した後、ボタンの `aria-pressed` が `true` で、1・2 列目のセルの `position` の計算値が `sticky`、3 列目は `sticky` でない
      - もう一度押した後、`aria-pressed` が `false` で、1・2 列目のセルが `sticky` でない
      - 見出し行の `th` の `position` の計算値が、ピン止めの前後とも `sticky`
    test: test_normal_when_table_pinned
  - name: 正常系（タブを切り替える）
    summary: タブの範囲にタブの並びを付け、押すか矢印キーで切り替える
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: タブを持つ Markdown
        description: '`<!-- tabs -->` 〜 `<!-- /tabs -->` の中に `### macOS`・`### Windows`・`### Linux` とそれぞれの段落を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: タブの並びを付け、最初のタブを選ぶ
        P->>M: Windows のタブを押す
        M->>P: Windows の中身だけを出す
        P->>M: 右の矢印キーを押す
        M->>P: Linux のタブに移って選ぶ
    expected:
      - '`role="tablist"` の中に `macOS`・`Windows`・`Linux` の `role="tab"` がある'
      - 描いた直後、`macOS` のタブの `aria-selected` が `true` で、ほかの `role="tabpanel"` が `hidden` を持つ
      - '`Windows` を押した後、`Windows` の `aria-selected` が `true` で、`Windows` の段落だけが出ている'
      - 右の矢印キーの後、`Linux` のタブにフォーカスがあり、`aria-selected` が `true`
    test: test_normal_when_tabs_switched
  - name: 正常系（節と行の詳細を開閉する）
    summary: '見出しで節を、行のボタンで行の詳細を開閉し、閉じた節の中への #ID でその節を開く'
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 節と行の詳細を持つ Markdown
        description: '`## 概要` と段落、直後に `<!-- section: closed -->` を持つ `## 補足` と段落と `### 注意`、直後に `<!-- row-detail: 2 -->` 〜 `<!-- /row-detail -->` を持つ 3 行の表を持つ文書'
      - name: Mock
        description: 差し替える依存は無い。URL の変更は `location.hash` を `#注意` にして `hashchange` を起こす
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        M->>P: 節の開閉と行の詳細のボタンを付け、補足と行の詳細を閉じる
        P->>M: 概要の開閉を押す
        M->>P: 概要を閉じる
        P->>M: 2 行目の詳細のボタンを押す
        M->>P: 行の詳細を開く
        P->>M: hashchange（#注意）
        M->>P: 補足を開く
    expected:
      - 描いた直後、`補足` の `mdmark-section-body` が `hidden="until-found"` を持ち、開閉のボタンの `aria-expanded` が `false`
      - '`概要` の開閉を押した後、`概要` の中身が `hidden` を持ち、ボタンの `aria-expanded` が `false`'
      - 行の詳細のボタンは 2 行目にだけあり、押した後、`mdmark-row-detail` の行が `hidden` を持たず、ボタンの `aria-expanded` が `true`
      - '`hashchange` の後、`補足` の中身が `hidden` を持たず、ボタンの `aria-expanded` が `true`'
    test: test_normal_when_sections_and_row_details_toggled
  - name: 正常系（印刷の前に記法を開く）
    summary: 印刷の前にタブの全ての中身と閉じた記法を開き、印刷の後に戻す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 記法を持つ Markdown
        description: '2 つの中身を持つタブの範囲、`<!-- section: closed -->` の節、行の詳細、`<!-- table: data closed -->` の表、`> [!NOTE]-` の注意書きを持つ文書'
        notes: '`opts.config` は渡さない。印刷の前に 2 つ目のタブを選んでおく'
      - name: Mock
        description: 印刷は `window` へ `beforeprint`・`afterprint` のイベントを送ることで代える
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown })
        P->>M: beforeprint
        M->>P: タブの全ての中身と閉じた記法を開く
        P->>M: afterprint
        M->>P: 開いたものを閉じ直し、選んでいたタブだけを出す
    expected:
      - '`beforeprint` の後、タブの 2 つの `role="tabpanel"` がともに `hidden` を持たず、それぞれのタブ名の題が出ている'
      - '`beforeprint` の後、節の中身・行の詳細の行が `hidden` を持たず、表と注意書きの `details` が `open` を持つ'
      - '`afterprint` の後、選んでいた 2 つ目のタブの中身だけが出ていて、節・行の詳細・表・注意書きが閉じている'
    test: test_normal_when_printed_with_syntax
  - name: 正常系（本文を差し替えて操作を付け直す）
    summary: '`update` の後も記法の操作が働き、`destroy` の後は `document` の受け取りが外れている'
    setup:
      - name: 文書を描いた要素
        description: 表を並べ替えて絞り込む正常系の Markdown を `mount` で描き、絞り込みのドロワーを開いた要素
      - name: 差し替える Markdown
        description: 2 つの中身を持つタブの範囲だけを持つ文書
      - name: Mock
        description: '`document.removeEventListener` を、外した受け取りを数える関数で包む'
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: update(markdown)
        M->>M: 前の本文の操作と document の受け取りを外す
        M->>P: 新しい本文にタブの操作を付ける
        P->>M: 2 つ目のタブを押す
        M->>P: 2 つ目の中身だけを出す
        P->>M: destroy()
        M->>M: 操作と受け取りを外す
    expected:
      - '`update` の後、開いていたドロワーの `document` の `pointerdown`・`keydown` の受け取りが外れている'
      - 2 つ目のタブを押した後、そのタブの `aria-selected` が `true`
      - '`destroy` の後、`window` へ `hashchange` を送っても例外が出ない'
    test: test_normal_when_updated_with_syntax
  - name: 正常系（用語と関連文書のツールチップ）
    summary: 索引の用語と文書の別名に下線を引き、ポインター・フォーカス・Tab・Esc でツールチップを操作する
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 索引
        description: 用語 `索引`（意味 `文書と用語を並べた YAML のファイル`）と、文書 `arch`（`設計/arch.md`）・`api`（`api.md`、`aliases` に `公開関数`）・`index-ref`（`索引.md`、題 `索引のリファレンス`、`aliases` に `索引`）を持つ索引
        notes: '`opts.docId` は `arch`'
      - name: 用語が出る Markdown
        description: 1 つの節の段落に `索引` が 2 回と `公開関数` が出る文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, index, docId })
        M->>P: 用語と文書の別名に下線を引いて描く
        P->>P: 公開関数にフォーカスし、Tab を押す
        P->>P: Esc を押す
    expected:
      - 最初の `索引` と `公開関数` が class `mdmark-term` の要素で、2 回目の `索引` はその要素でない
      - '`索引` のツールチップに、「用語」の意味と「関連文書」の `索引のリファレンス`（`href` が `../索引.md`）がこの順である'
      - '`公開関数` にフォーカスすると「関連文書」だけのツールチップが出て、Tab で `API` のリンク（`href` が `../api.md`）へフォーカスが移る'
      - Esc でツールチップが消え、フォーカスが `公開関数` に戻る
    test: test_normal_when_glossary
  - name: 正常系（被参照の一覧）
    summary: 参照の表から、文書の末尾に「関連文書」の一覧を置き、`update` の後も置き直す
    setup:
      - name: 配布物を読んだページ
        description: 正常系と同じ
      - name: 索引と参照の表
        description: インターフェース定義『参照の表を作る』のリクエスト例の索引と、そのレスポンス例の参照の表
        notes: '`opts.docId` は `arch`'
      - name: 描く Markdown
        description: 段落を 1 つ持つ文書。差し替える Markdown は見出しだけの文書
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        P->>M: mount(el, { markdown, index, docId, references })
        M->>P: 本文と末尾の関連文書の一覧を描く
        P->>M: update(markdown)
        M->>P: 差し替えた本文と末尾の関連文書の一覧を描く
    expected:
      - '`el` の最後の子が、題 `関連文書` の一覧で、`API`（`href` が `../api.md`）と `使い方`（`href` が `../使い方/guide.md`）がこの順で並ぶ'
      - '`update` の後も一覧が 1 つだけあり、中身が変わらない'
    test: test_normal_when_backlinks
lead: 使う側のページが、要素と Markdown と設定を渡し、要素の中に文書を描く。戻り値で本文の差し替えと片付けができる。
idempotent: false
side_effects: '`el` の中身と class を書き換え、記法の操作のイベントを `el` の中に付ける。`window` の `beforeprint`・`afterprint`・`hashchange` と、絞り込みのドロワーを開いている間だけ `document` の `pointerdown`・`keydown` を受け取る。文書に外部ライブラリか拡張の印があるとき、そのモジュールを読む'
callers:
  - dev/設計書/シナリオ/単一ユースケース/文書を描く#
  - dev/設計書/シナリオ/単一ユースケース/テーマを上書きする#
  - dev/設計書/シナリオ/単一ユースケース/機能のオン・オフを文書で上書きする#
  - dev/設計書/シナリオ/単一ユースケース/外部ライブラリを使うときだけ読み込む#
  - dev/設計書/シナリオ/単一ユースケース/文書を印刷する#
  - dev/設計書/シナリオ/単一ユースケース/表を操作する#
  - dev/設計書/シナリオ/単一ユースケース/注意書きを書く#
  - dev/設計書/シナリオ/単一ユースケース/タブを切り替える#
  - dev/設計書/シナリオ/単一ユースケース/ステップ・ファイルツリー・バッジで本文を組む#
  - dev/設計書/シナリオ/単一ユースケース/目次と見出しのアンカーで節へ移る#
  - dev/設計書/シナリオ/単一ユースケース/節と行の詳細を開閉する#
  - dev/設計書/シナリオ/単一ユースケース/図と表に番号を付けて参照する#
  - dev/設計書/シナリオ/単一ユースケース/拡張を登録して印を足す#
exclusivity: 同じ要素へ 2 回目の `mount` を呼ぶと、前の `mount` の `destroy` を先に行う。`update`・`destroy` の後に、前の描画で始めた外部ライブラリの読み込みが終わっても、その結果は描かない
request:
  - name: el
    type: HTMLElement
    required: true
    location: argument
    description: 描く先の要素
  - name: opts.markdown
    type: string
    required: true
    location: argument
    description: 描く Markdown
  - name: opts.config
    type: MdmarkConfig
    required: false
    default: なし（全てのキーに既定を当てる）
    location: argument
    description: 使う側のサーバーが `mdmark.config.yaml` を読んだオブジェクト。省いたキーには既定を当てる
  - name: opts.config.features
    type: Record<string, boolean>
    required: false
    default: '全ての機能が `true`'
    location: argument
    description: '機能のオン・オフの既定。文書の `<!-- features: +機能 -機能 -->` がその文書だけ上書きする'
    notes: 知らない機能名は無視する。機能は `print`（印刷の前に折り畳みと記法を開く）と、記法ごとの `table`・`callout`・`tabs`・`steps`・`tree`・`badge`・`toc`・`anchors`・`sections`・`row-details`・`figures`、用語のツールチップの `glossary`、被参照の一覧と文書の別名の `backlinks`
  - name: opts.config.libraries
    type: Record<string, string>
    required: false
    default: '`{}`'
    location: argument
    description: 印の名前から外部ライブラリのモジュールの URL を引く対応表。mdmark が持つ既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は足す
    constraints: URL はページの `document.baseURI` を基準に解決する
    example: '{ "test-lib": "/fixtures/test-lib.js" }'
    notes: '無い名前を足せることは確認ログの決定（推奨案 A）。#6 の `registerComponent()` との棲み分けは #6 が決める'
  - name: opts.index
    type: MdmarkIndex
    required: false
    default: なし（描く文書の用語集の表だけで用語を照合し、被参照を出さない）
    location: argument
    description: 使う側のサーバーが、設定の `index` のパスの索引の YAML を読んだオブジェクト。形は ER 図『索引』
    notes: Schema に合わない文書・用語の項目は除いて使い、例外を投げない
  - name: opts.docId
    type: string
    required: false
    default: なし（被参照の一覧を出さず、関連文書のリンクは索引の `path` のままにする）
    location: argument
    description: 描く文書の索引の `id`。被参照の一覧を引き、関連文書から自分を除き、リンクの相対パスを求めるのに使う
    example: arch
    notes: 索引に無い `id` は渡さないときと同じに扱う
  - name: opts.references
    type: MdmarkReferences
    required: false
    default: なし（被参照は索引の `related` だけから出し、ほかの文書の用語集の表の用語を照合しない）
    location: argument
    description: '`collectReferences` が返した参照の表。被参照の一覧と、ほかの文書の用語集の表の用語に使う'
    notes: 形はインターフェース定義『参照の表を作る』のレスポンス
request_example: |-
  ```json
  {
    "markdown": "# 見出し\n\n<!-- features: -print -->\n\n本文",
    "config": {
      "features": { "print": true },
      "libraries": { "test-lib": "/fixtures/test-lib.js" }
    }
  }
  ```
response:
  - name: update
    type: '(markdown: string) => void'
    description: 本文だけを描き直し、記法の操作を付け直す。設定は `mount` に渡したものを使う
    notes: '`destroy` の後は何もしない'
  - name: destroy
    type: () => void
    description: '`el` の中を空にして class `mdmark` を外し、記法の操作と `beforeprint`・`afterprint`・`hashchange`・`document` の受け取りを外す'
    notes: 2 回目以降は何もしない
exceptions:
  - name: なし（正常終了）
    condition: Markdown を描き、戻り値を返す
  - name: なし（知らせの枠）
    condition: 外部ライブラリのモジュールを読めない、またはモジュールの `draw` が例外を投げる
    notes: 例外を投げず、その印の場所だけを知らせの枠に替える。印の名前・URL・元のエラーを `console.error` に出す
constraints:
  - item: 描く本文
    constraint: '`render(markdown, { config })` が返す HTML 文字列と同じ'
    notes: dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts
  - item: 外部ライブラリのモジュールの形
    constraint: '`draw(slot: HTMLElement, args: string[]): void | Promise<void>` を名前付きで export する。`slot` は印の場所の要素、`args` は印の引数を空白で区切ったもの'
  - item: 外部ライブラリの読み込み
    constraint: 対応表の URL を `import()` に渡す。import map は使わない。同じ文書の同じ名前の印は 1 回だけ読む
  - item: 外部ライブラリの印の場所
    constraint: 読み込みの間は、class `mdmark-embed`・`role="status"`・文字 `図を読み込んでいます` の要素を置く
    notes: 高さは本文の CSS が先に取る（モジュール構成設計）
  - item: 知らせの枠
    constraint: class `mdmark-notice`・`role="status"` の要素に、題（class `mdmark-notice-title` の `strong`）と本文（`p`）を置く。題は図の印なら `この図を表示できません`、図でない印なら `この箇所を表示できません`。本文は `表示に使うライブラリ（{印の名前}）を読み込めませんでした。ネットワークにつながっているかを確かめて、ページを読み込み直してください。`
    notes: 印の名前は `code` 要素で囲む。設定の `libraries` で足した印は図の印として扱う
  - item: テーマ
    constraint: mdmark の CSS は `@layer mdmark` に入る。使う側は層の外の CSS と `--mdmark-` の変数で上書きする。mdmark は使う側の `theme.css` を読まない（使う側のページが `<link>` で読む）
    notes: '層の外で読むことが上書きの条件で、ページの `<link>` なら使う側がその条件を直に満たせ、`render` の出力にも同じ書き方で当たる'
  - item: 対応ブラウザ
    constraint: Chrome 99・Firefox 97・Safari 16.4 以上
    decided_by: dev/設計書/非機能要件/非機能要件#
  - item: 表の操作
    constraint: '`data-features` の機能だけを付ける。並べ替えは各列の見出しをボタンにし、押すたびに昇順 → 降順 → 元の並びを繰り返す（数値だけの列は数の大きさ、それ以外は文字の順）。並べた列の `th` に `aria-sort` を付ける。ピン止めは、表が幅からはみ出すときだけ各列の見出しに `aria-pressed` を持つボタンを出し、押した列までを左端に留め、押し直すと外す。絞り込みは `data-filter` の列の見出しにだけ `aria-expanded`・`aria-controls` を持つボタンを出し、`hidden` で開閉するドロワー（`select` は値のチェックボックスと候補の検索欄、`text` は含む文字の欄、`date` は開始日と終了日の欄と、どれも「絞り込みを外す」）を開く。ドロワーは同時に 1 つだけ開き、開いたら最初の入力欄へフォーカスを移し、外を押すか Esc で閉じる（Esc はボタンへフォーカスを戻す）。列ごとの絞り込みは重ねて当て、一致する行が無いときは「一致する行がありません」の行を出す。並べ替え・絞り込みで行の詳細はその行に付いて動く'
  - item: タブの操作
    constraint: '`mdmark-tabs` の頭に `role="tablist"` の並びを置き、各 `mdmark-tab-panel` のタブ名を `role="tab"` のボタンにする。中身は `role="tabpanel"` にし、選んだタブの中身だけを出してほかは `hidden` にする。左右の矢印・Home・End でタブを移って選ぶ（WAI-ARIA のタブの作法）。描いた直後は最初のタブを選ぶ'
  - item: 節と行の詳細の開閉
    constraint: 節は見出しの文字を `aria-expanded`・`aria-controls` を持つボタンにし、閉じた節の `mdmark-section-body` を `hidden="until-found"` にする（`data-section="closed"` は閉じた状態で始める）。URL の `#ID` が閉じた節の中を指すとき（描いたときと `hashchange`）と、ページ内検索が閉じた節の中に当たったときは、その節を開く。行の詳細は、詳細を持つ行の先頭のセルに `aria-expanded`・`aria-controls` を持つボタンを置き、`mdmark-row-detail` の行を `hidden` で開閉する（描いた直後は閉じる）
  - item: 印刷で記法を開く
    constraint: '`print` がオンのとき、`beforeprint` で閉じた `details`（閉じた表・閉じた注意書きを含む）・閉じた節・行の詳細を開き、タブの全ての中身をタブ名を題にして縦に並べる。`afterprint` で、開いたものだけを閉じ直し、印刷の前に選んでいたタブだけを出す'
  - item: 拡張の印
    constraint: 登録した拡張の印の場所は、拡張の `schema` で引数を検査し、合えば `load` で読んだモジュールの `draw` に描かせる。合わなければ書き方の警告、読めなければ知らせの枠に替える
    notes: dev/設計書/インターフェース定義/ライブラリ本体/拡張を登録する.ts
  - item: 用語と文書の別名の下線
    constraint: 本文の文字を `Intl.Segmenter`（`ja`・`word`）で区切り、始まりと終わりが区切りに揃う用語の語・別名と文書の `aliases` を、長い語を先に照合する。用語は用語の `id`、文書の別名は文書の `id` ごとに、節（h2〜h4）ごとに最初に出たところだけを class `mdmark-term` の要素にし、破線の下線を引く。コード・リンク・見出し・用語集の表の中は照合しない。同じ語が複数の用語に当たるときは、索引の `terms`・描く文書の表・ほかの文書の表（索引の `docs` の順）の順で 1 つを選ぶ
    notes: 下線の要素の形は部品設計で決める
  - item: ツールチップの操作
    constraint: 下線の要素にポインターを乗せたときとフォーカスしたときにツールチップを出し、ツールチップの上へポインターを移しても出したままにし、Esc で消してフォーカスを語に残す（WCAG 1.4.13）。関連文書を持つツールチップは、語から Tab で中のリンクへ移れ、中にフォーカスがある間は出したままにする。表やタブの枠で切れないよう画面に対して置き、下に収まらなければ上に開く。`update` で付け直し、`destroy` で外す
    notes: WAI-ARIA の役割とフォーカスの出入りは部品設計で決める
  - item: 関連文書と被参照の一覧
    constraint: ツールチップの「関連文書」には、語に `aliases` が一致した文書（描く文書自身を除く）の題・リンク・`description` を出す。文書の末尾には、`opts.references.backlinks[opts.docId]`（無ければ、索引の `related` に描く文書を持つ文書）を「関連文書」の題の一覧にして置き、空なら置かない。リンクの `href` は描く文書の `path` から見た参照先の相対パスにする。`backlinks` がオフのときは、文書の別名の照合と末尾の一覧をしない
  - item: 索引の値の出し方
    constraint: 索引の題・意味・`description` は Markdown として解析せず、文字として出す。リンクの `href` は本文のリンクと同じ許可の検査を通す
  - item: 用語と関連文書の一覧の id
    constraint: 1 つのページに文書を 2 つ以上描いても重ならないよう、`mount` は用語の下線のツールチップと関連文書の一覧の題の `id` を、モジュールの通し番号でページの中で一意な値に振り直し、それを指す `aria-describedby`・`aria-details`・`aria-labelledby` も直す。`update` で振り直す。`render` の出力の `id` は文書の中で一意なまま
    notes: タブの `mdmark-tabs-{n}`（`src/interact/tabs.ts` の `tabsCounter`）と同じ作り
