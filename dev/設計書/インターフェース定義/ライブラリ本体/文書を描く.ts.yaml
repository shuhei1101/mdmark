      - 「変更を見る」と差分の場所とミニマップの帯が無い
      - 段落 A・段落 B・段落 E が `div.mdmark-diff-block[data-kind="add"]` に包まれ、先頭に読み上げの `追加:` と `aria-hidden` の `+` を持つ
