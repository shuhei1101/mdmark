  - name: 正常系（コメントを付ける）
    summary: 選んだ文字にコメントを書いて保存し、印と吹き出しで読む
    setup:
      - name: 配布物を読んだページ
        description: '正常系と同じ。`opts.config.features` は `{ comments: true }`、`opts.docId` は `guide`'
      - name: コメントの読み書きの関数
        description: '`load` は空の配列、`save` は受けた下書きに `id: "c1"` を足して返す。受けた引数を記録する'
      - name: 段落を持つ Markdown
        description: '`描いた文書の見た目はテーマの変数で変える。` の段落を 1 つ持つ文書'
        notes: コメントの本文は `ここは <b>太字</b> にしたい`
      - name: Mock
        description: 読み書きの関数はページの中のメモリーで返す
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant M as mdmark
        participant S as 読み書きの関数
        P->>M: mount(el, { markdown, config, docId, commentStore })
        M->>S: load({ docId })
        S-->>M: []
        P->>M: 「テーマの変数」を選び、コメントのボタンを押す
        M->>P: 入力欄
        P->>M: 本文を書いて保存する
        M->>S: save({ docId, comment })
        S-->>M: id を持つコメント
        M->>P: 選んだ文字を印で包む
        P->>M: 印で Enter を押す
        M->>P: 吹き出し
    expected:
      - '`load` が `{ docId: "guide" }` で 1 回呼ばれる'
      - 文字を選ぶと「コメント」のボタンが出て、選びを外すと消える
      - '`save` が `{ docId: "guide", comment: { quote: "テーマの変数", prefix: "描いた文書の見た目は", suffix: "で変える。", body: "ここは <b>太字</b> にしたい" } }` で 1 回呼ばれる'
      - '`テーマの変数` が class `mdmark-comment-mark` の印で包まれ、印にフォーカスがある'
      - 印で Enter を押すと吹き出しが開き、本文に `b` 要素が無く文字 `<b>太字</b>` がある。Esc で閉じ、フォーカスが印に戻る
