      - name: 同じ組のタブを持つ Markdown
        description: '`<!-- tabs: group=os -->` で `### macOS`・`### Windows` を囲んだ範囲を 2 つ、`<!-- tabs: group=os -->` で `### macOS`・`### Linux` を囲んだ範囲、`<!-- tabs -->` で `### macOS`・`### Windows` を囲んだ範囲を並べた文書'
      - name: Mock
