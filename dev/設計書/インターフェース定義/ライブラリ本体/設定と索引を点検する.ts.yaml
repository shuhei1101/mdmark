title: "設定と索引を点検する"
entry:
  kind: operation
  value: '`mdmark check [--config {設定ファイル}] [--base {git の ref} | --text {Markdown} | --file {ファイル} --key {YAML のキー}]`（CLI。`npx github:shuhei1101/mdmark#v{版} check` で呼ぶ）'
flows:
  - name: 正常系
    summary: ずれの無いフォルダで 0 件を返す
    setup:
      - name: ずれの無いフォルダ
        description: '`mdmark init` の雛形に文書 2 つを足し、索引に 2 つとも載せ、`build.include` が 2 つに当たるフォルダ'
      - name: Mock
        description: 差し替える依存は無い（CLI をそのフォルダで子プロセスとして流す）
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を探して読み、Schema と build の対象を確かめる
        C->>M: 索引・文書
        M-->>C: []
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が `ずれ 0 件` の 1 行
      - 設定・索引・文書が変わっていない
    test: test_normal
  - name: 正常系（ずれがある）
    summary: 索引と文書のずれと設定の Schema のずれを出し、終了コード 1 で終わる
    setup:
      - name: ずれを持つフォルダ
        description: 正常系のフォルダから文書 `old.md` を消して索引には残し、設定の `build` から `out` を消したフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>M: 索引・文書
        M-->>C: missing_doc のずれ
        C-->>W: ずれ 2 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:build: schema:` で始まり `build.out` を含む行がある'
      - 索引の `old.md` の行を指す `missing_doc` の行がある
      - 最後の行が `ずれ 2 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_drift
  - name: 正常系（build の対象が 0 件）
    summary: '`build.include` がどの文書にも当たらないと `no_documents` を出す'
    setup:
      - name: 当たらない include
        description: 正常系のフォルダで、`build.include` をどのファイルにも当たらない glob にしたもの
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: include に当たる文書が 0 件
        C-->>W: no_documents の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:build.include: no_documents:` で始まる行がある'
    test: test_normal_when_no_documents
  - name: 異常系（設定ファイルが無い・終了コード 1）
    summary: 設定ファイルが見つからないと、`mdmark init` で置けることを示して終わる
    setup:
      - name: 設定ファイルの無いフォルダ
        description: 文書だけがあり、そのフォルダと上のフォルダに `mdmark.config.yaml` が無い一時フォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 今のフォルダから上へ設定ファイルを探す
        C-->>W: 設定ファイルが無いことと mdmark init・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `mdmark.config.yaml` が無いことと `mdmark init` が出る
    test: test_error_when_config_missing
  - name: 異常系（設定ファイルを読めない・終了コード 1）
    summary: YAML として読めない設定ファイルは、読めない行を示して終わる
    setup:
      - name: 壊れた設定ファイル
        description: 3 行目の字下げが崩れた `mdmark.config.yaml` を持つフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定ファイルを YAML として読めない
        C-->>W: ファイルと行と直し方・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `mdmark.config.yaml` と 3 行目が出る
    test: test_error_when_config_unreadable
  - name: 正常系（知らない印がある）
    summary: 文書の本文の知らない印を、文書と行を指す `unknown_mark` の行にして終了コード 1 で終わる
    setup:
      - name: 知らない印を持つフォルダ
        description: 正常系のフォルダの文書 `a.md` の 3 行目に `<!-- tabz -->` を書き、同じ文書の `markdown` のコードブロックの中にも `<!-- tabz -->` を書いたフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を探して読み、Schema と build の対象を確かめる
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文から、知っている印に当たらない印を拾う
        C-->>W: unknown_mark の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`a.md:3: unknown_mark:` で始まり `tabz` を含む行が 1 つだけある'
      - コードブロックの中の `<!-- tabz -->` を指す行が無い
      - 最後の行が `ずれ 1 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_mark
  - name: 正常系（拡張と check.ignore の印）
    summary: 拡張が登録した印と `check.ignore` に書いた名前の印は、ずれにしない
    setup:
      - name: 拡張と外す名前を書いたフォルダ
        description: '`mdmark init` の雛形の拡張 `extensions/example.js`（`directive` が `greet`）を設定の `extensions` に書き、設定の `check.ignore` に `prettier-ignore` を書いたフォルダ。文書 `a.md` に `<!-- greet: 太郎 -->` と `<!-- prettier-ignore -->` を書く'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 設定を読み、拡張を束ねて読み込み directive を取る
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文の印を知っている印と突き合わせる
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が `ずれ 0 件` の 1 行
    test: test_normal_when_known_extension_and_ignored_mark
  - name: 正常系（拡張を読み込めない）
    summary: 読み込めない拡張を `schema` のずれにし、その拡張の印を知らない印として出す
    setup:
      - name: 読み込めない拡張を書いたフォルダ
        description: 設定の `extensions` に、読み込みの時点で `HTMLElement` を継いだ custom element を定義するモジュール `extensions/broken.js`（既定の書き出しの `directive` は `broken`）を書き、文書 `a.md` の 3 行目に `<!-- broken -->` を書いたフォルダ
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as checkIndex
        W->>C: mdmark check
        C->>C: 拡張を束ねて読み込み、directive を取れない
        C->>M: 索引・文書
        M-->>C: []
        C->>C: 文書の本文の印を知っている印と突き合わせる
        C-->>W: schema と unknown_mark の行・終了コード 1
    expected:
      - 終了コードが 1
      - '`mdmark.config.yaml:extensions[0]: schema:` で始まり、元のエラー（`HTMLElement`）と `load` の中へ移す直し方を含む行がある'
      - '`a.md:3: unknown_mark:` で始まり `broken` を含む行がある'
    test: test_normal_when_extension_unloadable
  - name: 正常系（比べる基準を渡す）
    summary: --base との merge-base から片方だけが変わった change_together の組を出し、終了コード 1 で終わる
    setup:
      - name: 組で直す文書を持つ git のフォルダ
        description: 正常系のフォルダで、索引の文書 `a`（`a.md`）と `b`（`b.md`）が互いを `change_together` で記載し、全てをコミットした git のリポジトリ。コミットにタグ `base` を付ける
      - name: 片方だけの変更
        description: タグの後に `a.md` の本文だけを書き換えてコミットする
        notes: merge-base からの比較で、コミット済みの変更も数えることを起こす
      - name: Mock
        description: 差し替える依存は無い（そのフォルダで CLI と git を子プロセスとして流す）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        participant M as checkIndex
        W->>C: mdmark check --base base
        C->>G: base と HEAD の merge-base から変わったファイルを引く
        G-->>C: a.md
        C->>M: 索引・文書・changedPaths
        M-->>C: missed_change_together
        C-->>W: ずれ 1 行・終了コード 1
      ```
    expected:
      - 終了コードが 1
      - '`b.md: missed_change_together:` で始まり `a.md` を含む行がある'
      - 最後の行が `ずれ 1 件`
      - 同じフォルダで `--base` を渡さずに流すと、終了コード 0 で `ずれ 0 件`
      - 設定・索引・文書と git の履歴が変わっていない
    test: test_normal_when_base_given
  - name: 異常系（比べる基準を引けない・終了コード 1）
    summary: merge-base を引けない --base は、引けないことと直し方を示して終わる
    setup:
      - name: git のフォルダ
        description: 正常系（比べる基準を渡す）と同じ
      - name: 無い ref
        description: '`--base` に `no-such-ref` を渡す'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant G as git
        W->>C: mdmark check --base no-such-ref
        C->>G: no-such-ref と HEAD の merge-base を引く
        G-->>C: 引けない
        C-->>W: 引けないことと直し方・終了コード 1
      ```
    expected:
      - 終了コードが 1
      - 標準エラーに `no-such-ref` と `fetch-depth` が出る
      - 設定・索引・文書が変わっていない
    test: test_error_when_base_unknown
  - name: 正常系（エイリアスにずれがある）
    summary: エイリアスの行とレコードのずれを出し、終了コード 1 で終わる
    setup:
      - name: エイリアスにずれを持つフォルダ
        description: '正常系のフォルダの設定に `aliases` の 2 行を加えたフォルダ。2 行とも `metadata` に `alias_type: {type: ref, field: alias_type}` を記載する。1 行目は `paths: aliases/*.yaml` で、`aliases/` に `alias_type: term` で `id`・`name` を持ち `description` が空のレコードを持つ YAML と、`alias_type: env` で `id`・`name`・`url` を持つレコードを持つ YAML を置く。2 行目は `paths: missing/*.yaml` で、当たるファイルが無い'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant B as buildAliases
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>C: 行の paths を引いて YAML を読む
        C->>B: 行・読んだ中身
        B-->>C: alias_required_empty のずれ
        C-->>W: ずれ 2 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`alias_no_files` の行があり、内容に `missing/*.yaml` を含む'
      - '`term` のレコードの YAML の `description` を指す `alias_required_empty` の行がある'
      - '`env` のレコードを指すずれの行が無い'
      - 最後の行が `ずれ 2 件`
      - 設定・エイリアスの YAML が変わっていない
    test: test_normal_when_alias_drift
  - name: 正常系（知らないテーマの名前がある）
    summary: 設定の `colorTheme` の知らない名前を `unknown_color_theme` のずれで出し、終了コード 1 で終わる
    setup:
      - name: 知らないテーマの名前を書いたフォルダ
        description: '正常系のフォルダの設定に `colorTheme: sepia` を記載したフォルダ'
      - name: 選べるテーマの名前を書いたフォルダ
        description: '正常系のフォルダの設定に `colorTheme: theme-slate` を記載したフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 設定の Schema を確かめる
        C->>C: colorTheme を入っているテーマの名前と照らす
        C-->>W: unknown_color_theme の 1 行・終了コード 1
    expected:
      - 知らない名前のフォルダで、終了コードが 1
      - '`mdmark.config.yaml:colorTheme: unknown_color_theme:` で始まる行が 1 つだけあり、内容に `sepia` と `dev-swiss`・`theme-paper`・`theme-slate`・`theme-contrast` を含む'
      - 最後の行が `ずれ 1 件`
      - 選べる名前のフォルダでは、終了コードが 0 で `unknown_color_theme` の行が無い
      - 設定・索引・文書が変わっていない
    test: test_normal_when_unknown_color_theme
  - name: 正常系（見つからないファイルがある）
    summary: 文書からの相対パスにもアセットのルートにも無い画像・動画・音声・添付のファイルを `missing_file` のずれにする
    setup:
      - name: 見つからないファイルを持つフォルダ
        description: '`assets.root` が `assets` の設定と、`build.include` が当たる `docs/guide.md`。`guide.md` は、無い `images/missing.png`（3 行目）・`media/missing.mp4`（5 行目）・`media/missing.mp3`（7 行目）、リンクだけの段落 `[仕様書](files/missing.pdf)`（9 行目）、`assets/images/logo.png` にだけある `images/logo.png`、`https://example.com/a.png` を持つ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 文書の画像・動画・音声・添付のパスを、文書からの相対パスとアセットのルートで確かめる
        C-->>W: missing_file の 4 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`docs/guide.md:3: missing_file:`・`docs/guide.md:5: missing_file:`・`docs/guide.md:7: missing_file:`・`docs/guide.md:9: missing_file:` で始まる行があり、内容にそれぞれ `images/missing.png`・`media/missing.mp4`・`media/missing.mp3`・`files/missing.pdf` を含む'
      - '`images/logo.png` と `https://example.com/a.png` を指す行が無い'
      - 最後の行が `ずれ 4 件`
      - 設定・文書が変わらず、書き出しのファイルが無い
    test: test_normal_when_files_missing
    refs:
      - dev/設計書/シナリオ/単一ユースケース/設定と索引を点検する#scenarios[正常シナリオ（見つからないファイルがある）]
  - name: 正常系（図の定義にずれがある）
    summary: 文書の図の部品の定義を読み、定義の誤りと、フロー図のノードの重なり・はみ出し・線の横切り・ラベルの長さをずれにする
    setup:
      - name: 図の定義にずれを持つフォルダ
        description: '`build.include` が当たる `docs/a.md` と `docs/b.md`。`a.md` は 3 行目の `<!-- flow -->` の範囲に id `api` のノードを 2 つ持つ定義と、20 行目の `<!-- flow -->` の範囲に配置のずれを持つ定義と、30 行目の `<!-- er -->` の範囲に関係の先が定義に無いテーブル `payments` を指す ER 図の定義を持つ。`b.md` はずれの無いフロー図の定義を持つ'
        notes: 配置のずれの定義は、座標の重なるノード `web` と `db`、`frame` の右端をまたぐノード `queue`、ノード `cache` の中を通る線 `w1`（`from` が `web`・`to` が `queue`）、`w`・`h` が 120・48 で名前が全角 30 文字のノード `batch` を持つ
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使わない
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 点検する文書の図の部品の定義を読む
        C->>C: 定義を確かめ、フロー図のノードと線の配置を計算する
        C-->>W: 図のずれの 6 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`docs/a.md:3: diagram_invalid:` で始まる行が 1 つだけあり、内容に重なった id `api` と、id を変える直し方がある'
      - '`docs/a.md:20:` で始まる行が、`diagram_node_overlap`・`diagram_node_overflow`・`diagram_wire_crosses_node`・`diagram_label_too_long` の 4 つで 1 つずつあり、内容にそれぞれ `web` と `db`・`queue`・`w1` と `cache`・`batch` と、座標・大きさ・`points` を直す直し方がある'
      - '`docs/a.md:30: diagram_invalid:` で始まる行が 1 つだけあり、内容に `payments` がある'
      - '`unknown_mark` の行が無い'
      - '`docs/b.md` を指す行が無い'
      - 最後の行が `ずれ 6 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_drift
    refs:
      - dev/設計書/シナリオ/単一ユースケース/設定と索引を点検する#scenarios[正常シナリオ（図の定義にずれがある）]
  - name: 正常系（文字列の記法を点検する）
    summary: 書き方の警告を持たない Markdown の文字列で 0 件を返す
    setup:
      - name: 作業のフォルダ
        description: '`mdmark init` の後のフォルダ'
      - name: 点検する文字列
        description: '正しいフロー図の部品の定義と、`<!-- table: data -->` で囲んだ表を持つ Markdown を標準入力で渡す'
      - name: Mock
        description: 差し替える依存は無い（CLI をそのフォルダで子プロセスとして流す）
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check --text -
        C->>C: 描くときと同じ読み取りで書き方の警告を集める
        C-->>W: ずれ 0 件・終了コード 0
    expected:
      - 終了コードが 0
      - 標準出力が `ずれ 0 件` の 1 行
      - 作業のフォルダのファイルが変わっていない
    test: test_normal_when_text
  - name: 正常系（文字列に書き方の警告がある）
    summary: 文字列を描いたときの書き方の警告を、行を指すずれにして終了コード 1 で終わる
    setup:
      - name: 作業のフォルダ
        description: 正常系（文字列の記法を点検する）と同じ
      - name: 書き方の警告を持つ文字列
        description: '1 行目の `<!-- flow -->` の範囲にノードの種類 `begin` を記載した定義、20 行目に `<!-- tabz -->`、22 行目に `<!-- code: highlight=9 -->` とその直後の 3 行のコードブロックを持つ Markdown'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check --text {Markdown}
        C->>C: 描くときと同じ読み取りで書き方の警告を集める
        C-->>W: ずれ 3 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`-:1: diagram_invalid:`・`-:20: unknown_mark:`・`-:22: syntax_warning:` で始まる行が 1 つずつある'
      - 各行の内容が、同じ文字列を `render` で描いたときの書き方の警告の本文と同じ
      - 最後の行が `ずれ 3 件`
    test: test_normal_when_text_warnings
  - name: 正常系（ファイルと YAML のキー）
    summary: YAML のキーの値の Markdown を点検し、YAML のファイルの行を指すずれにする
    setup:
      - name: 作業のフォルダ
        description: 正常系（文字列の記法を点検する）と同じ
      - name: Markdown をキーに持つ YAML のファイル
        description: '`items[0].body` が 5 行目の `|` で始まるブロックスカラーで、値の 3 行目（ファイルの 8 行目）に `<!-- tabz -->` を持ち、`items[1].body` に正しい Markdown を持つ `records.yaml`'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant F as ファイル
        W->>C: mdmark check --file records.yaml --key items[0].body
        C->>F: YAML を読み、キーの値と値の始まる行を取り出す
        C->>C: 描くときと同じ読み取りで書き方の警告を集める
        C-->>W: ずれ 1 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`records.yaml:8: unknown_mark:` で始まり `tabz` を含む行が 1 つだけある'
      - '`--key items[1].body` で流すと、終了コード 0 で `ずれ 0 件`'
      - '`records.yaml` が変わっていない'
    test: test_normal_when_yaml_key
  - name: 正常系（拡張のマーカーを持つ文字列）
    summary: 設定の `extensions` が追加するマーカーを知っているマーカーとして点検する
    setup:
      - name: 拡張を登録した作業のフォルダ
        description: 正常系（文字列の記法を点検する）のフォルダの設定の `extensions` に、`directive` が `note-card` の拡張を記載したもの
      - name: 拡張のマーカーを持つ文字列
        description: 1 行目に `<!-- note-card -->`、3 行目に `<!-- tabz -->` を持つ Markdown
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check --text {Markdown}
        C->>C: 設定の extensions を束ねて読み込み directive を取る
        C->>C: 書き方の警告を集める
        C-->>W: ずれ 1 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`-:3: unknown_mark:` で始まる行が 1 つだけあり、`-:1:` で始まる行が無い'
    test: test_normal_when_text_extension_mark
  - name: 異常系（キーが無い・終了コード 1）
    summary: YAML に無いキーは、キーが無いことと直し方を示して終わる
    setup:
      - name: 作業のフォルダ
        description: 正常系（ファイルと YAML のキー）と同じ
      - name: 無いキー
        description: '`--key items[5].body` を渡す'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant F as ファイル
        W->>C: mdmark check --file records.yaml --key items[5].body
        C->>F: YAML を読み、キーをたどる
        C-->>W: キーが無いことと直し方・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `records.yaml` と `items[5].body` と、`items` の要素が 2 つしか無いことが出る
      - '`records.yaml` が変わっていない'
    test: test_error_when_key_missing
  - name: 正常系（座標を省いた図の定義）
    summary: 座標を省いた判定フローチャートを配置の後の座標で点検し、座標を省けない定義を `diagram_invalid` にする
    setup:
      - name: 座標を省いた図の定義を持つフォルダ
        description: 正常系のフォルダの文書 `a.md` の 3 行目の `<!-- flow -->` の範囲に、『図を描く』の正常シナリオ（座標を省いた判定フローチャート）と同じ定義、30 行目の `<!-- flow -->` の範囲に座標を省いた `llm` のノードを持つ定義を記載したもの
      - name: Mock
        description: 差し替える依存は無い。点検はブラウザを使わない
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark check
        C->>C: 座標を省いた判定フローチャートに自動の配置を当てる
        C->>C: 配置後の座標で重なり・はみ出し・線の横切り・ラベルの長さを点検する
        C-->>W: ずれ 1 行・終了コード 1
    expected:
      - 終了コードが 1
      - '`a.md:3:` で始まる行が無い'
      - '`a.md:30: diagram_invalid:` で始まる行が 1 つだけあり、内容に `llm` と、座標を省けるのは判定フローチャートの 4 つの種類だけであることと直し方がある'
      - 最後の行が `ずれ 1 件`
      - 設定・索引・文書が変わっていない
    test: test_normal_when_diagram_auto_layout
lead: 文書を書く人が、設定ファイルの形・索引と文書のずれ（`checkIndex`）・`build` の対象の有無・文書の本文にある知らない印・文書が指す見つからないファイル・文書の図の部品の定義を点検し、ファイル・場所・種類・内容の一覧を受け取る。`--text` か `--file` と `--key` を渡したときは、設定と索引の点検の代わりに、渡した Markdown を描いたときの書き方の警告と図の定義のずれを同じ一覧で受け取る。点検は設定・索引・文書を書き換えない。
idempotent: true
side_effects: なし（設定・索引・文書を書き換えない）
callers:
  - dev/設計書/シナリオ/単一ユースケース/設定と索引を点検する#
request:
  - name: --config
    type: string
    required: false
    default: なし（今のフォルダから上のフォルダへ順に `mdmark.config.yaml` を探し、最初に見つかったものを使う）
    location: argument
    description: 使う設定ファイルのパス
    example: docs/mdmark.config.yaml
  - name: --base
    type: string
    required: false
    default: なし（`change_together` の直し忘れを確かめない）
    location: argument
    description: 直し忘れの検査に比べる基準の git の ref。渡したときだけ、基準から変わった文書を `checkIndex` の `changedPaths` に渡す
    example: origin/develop
  - name: --text
    type: string
    required: false
    default: なし（設定と索引を点検する）
    location: argument
    description: 点検する Markdown の文字列。`-` を渡すと標準入力から読む
    constraints: '`--base`・`--file`・`--key` と一緒に渡せない'
    example: '-'
  - name: --file
    type: string
    required: false
    default: なし（設定と索引を点検する）
    location: argument
    description: Markdown をキーの値に持つ YAML のファイルのパス（今のフォルダからの相対パスか絶対パス）
    constraints: '`--key` と一緒に渡す。`--base`・`--text` と一緒に渡せない'
    example: records.yaml
  - name: --key
    type: string
    required: false
    default: なし
    location: argument
    description: '`--file` の YAML の中で点検する文字列の値のキーのパス。書き方は索引のずれの場所と同じ（`.` でキーを、`[位置]` で配列の要素をたどる）'
    constraints: '`--file` と一緒に渡す'
    example: items[0].body
response:
  - name: 標準出力
    type: string
    description: 'ずれ 1 つを 1 行（`{ファイル}:{場所}: {種類}: {内容}`。場所が空のときは `{ファイル}: {種類}: {内容}`）で並べ、最後に `ずれ {件数} 件` の行を出す'
    notes: ファイルは設定ファイルのあるフォルダからの相対パス（`--text` のときは `-`、設定ファイルが無いときは今のフォルダからの相対パス）。`--text`・`--file` のときの並びは、場所の行の順（同じ行は描いたときの警告の順、図の配置のずれはその後ろ）。並びは設定の `schema` → `unknown_color_theme` → `no_documents` → `checkIndex` が返した並び → エイリアスのずれ（`buildAliases` が返した並び。`alias_no_files`・`alias_unreadable` は読んだ行の順にその場所へ置く） → `unknown_mark` → `missing_file` → 図の点検のずれ（どれも文書のパスの順、同じ文書の中は行の順）
  - name: 種類
    type: "'schema' | 'unknown_color_theme' | 'no_documents' | 'missing_doc' | 'orphan_doc' | 'broken_ref' | 'untyped_related' | 'one_sided_change_together' | 'related_link_overlap' | 'missed_change_together' | 'duplicate_term' | 'avoided_term' | 'duplicate_tag' | 'tag_alias_conflict' | 'broken_tag_replacement' | 'unregistered_tag' | 'deprecated_tag' | 'alias_no_files' | 'alias_unreadable' | 'duplicate_alias_row_id' | 'alias_records_missing' | 'alias_field_missing' | 'alias_unknown_type' | 'alias_required_empty' | 'duplicate_alias_id' | 'unknown_mark' | 'missing_file' | 'diagram_invalid' | 'diagram_node_overlap' | 'diagram_node_overflow' | 'diagram_wire_crosses_node' | 'diagram_label_too_long' | 'syntax_warning'"
    description: '`schema` は設定か索引が Schema に合わない（`build.glossary`・`build.entry` が `include` に当たらないもの・`aliases` の行の Schema のずれを含む）、`unknown_color_theme` は設定の `colorTheme` が mdmark に入っているテーマの名前のどれでもない、`no_documents` は `build.include` に当たる文書が 0 件、`alias_no_files` は `aliases` の行の `paths` に当たるファイルが 0 件、`alias_unreadable` は `paths` に当たったファイルを YAML として読めない、`unknown_mark` は文書の本文に知っている印のどれにも当たらない印がある、`missing_file` は文書が指す画像・動画・音声・添付のファイルが文書からの相対パスにもアセットのルートにも無い、`diagram_invalid` は図の部品の定義を読めないか形が合わない、`diagram_node_overlap` はフロー図の 2 つのノードの矩形が重なる、`diagram_node_overflow` はフロー図のノードが図の `width`・`height` の外に出るか `frame` の縁をまたぐ、`diagram_wire_crosses_node` はフロー図の線が `from`・`to` でないノードの中を通る、`diagram_label_too_long` はフロー図のノードの種類・名前・補足の文字が、折り返してもノードの中に収まらない、`syntax_warning` は `--text`・`--file` で渡した Markdown を描いたときに出る書き方の警告のうち `unknown_mark`・`diagram_invalid` に当たらないもの。`duplicate_alias_row_id`〜`duplicate_alias_id` はインターフェース定義『エイリアスを作る』の `kind`、ほかはインターフェース定義『索引を点検する』の `kind`'
  - name: 終了コード
    type: 0 | 1
    description: ずれが 0 件なら 0、ずれがあるか点検できないときは 1
response_example: |-
  ```text
  docs/index.yaml:docs[1].path: missing_doc: `old.md` が見つかりません。文書を戻すか、索引の `docs[1]` を消してください。
  mdmark.config.yaml:build: schema: `build.out` がありません。書き出す HTML のパスを書いてください。
  ずれ 2 件
  ```
exceptions:
  - name: なし（正常終了）
    condition: ずれが 0 件。終了コード 0
  - name: なし（ずれがある・終了コード 1）
    condition: ずれが 1 件以上ある
    notes: 全てのずれを出してから終わる
  - name: 設定ファイルが無い（終了コード 1）
    condition: '`--config` のファイルが無い、または今のフォルダと上のフォルダに `mdmark.config.yaml` が無い（`--text`・`--file` を渡し、`--config` を渡さないときを除く）'
    notes: 標準エラーに、探した場所と `mdmark init` で置けることを出す
  - name: 設定ファイルを読めない（終了コード 1）
    condition: 設定ファイルを YAML として読めない
    notes: 標準エラーに、ファイルと読めない行と直し方を出す
  - name: 比べる基準を引けない（終了コード 1）
    condition: '`--base` を渡し、git が無い・設定ファイルのフォルダが git のリポジトリの中に無い・その ref と HEAD の merge-base を引けない'
    notes: 標準エラーに、渡した ref と引けない理由と、ref を直すか履歴を取得する（CI の checkout の `fetch-depth`）直し方を出す。ずれの点検はしない
  - name: 引数の組が誤り（終了コード 1）
    condition: '`--text` と `--file`・`--base` を一緒に渡した、`--file` と `--key` の片方だけを渡した、または `--file` と `--base` を一緒に渡した'
    notes: 標準エラーに、一緒に渡せない引数か足りない引数と、正しい渡し方を出す。点検はしない
  - name: 点検するファイルを読めない（終了コード 1）
    condition: '`--file` のファイルが無いか、YAML として読めない'
    notes: 標準エラーに、ファイルと、無いことか読めない行と直し方を出す
  - name: キーが無い（終了コード 1）
    condition: '`--key` のキーが `--file` の YAML に無いか、その値が文字列でない'
    notes: 標準エラーに、ファイルと渡したキーと、たどれたところまでのキーか値の型と、キーを直す直し方を出す
constraints:
  - item: 設定の点検
    constraint: '`schemas/mdmark.config.schema.json` に合わないところごとに `schema` のずれにする。空の設定ファイル（読んだ値がオブジェクトでない）も `schema` のずれにする。`build.glossary`・`build.entry` がまとめる文書に当たらないものも `schema` のずれにする。`theme`・`extensions` のファイルが無いものも `schema` のずれにする'
  - item: 索引の点検
    constraint: 設定に `index` があるときだけ行う。索引のフォルダの下の拡張子 `.md` のファイルのうち `build.exclude` に当たらないものを文書として `checkIndex` に渡し、返ったずれをそのまま出す。索引のファイルを読めないときは、索引を指す `schema` のずれにする
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/索引を点検する.ts#
  - item: build の対象
    constraint: 設定に `build` があるときだけ行う。`include` に当たり `exclude` に当たらない文書が 0 件なら `no_documents` のずれにする
  - item: 内容の文
    constraint: ずれごとに、何が合わないかと直し方を日本語の 1 文で書く
  - item: 動く Node の版
    constraint: Node 24 以降
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[CLI が動く Node の版]
  - item: 知らない印の点検
    constraint: '点検する文書ごとに、描く処理と同じ書き方の印（`<!-- 名前 -->`・`<!-- 名前: 引数 -->`・`<!-- /名前 -->`）を、描く処理と同じく生の HTML のブロックと行内の HTML からだけ拾う（コードブロックとインラインコードの中は拾わない）。名前が知っている印に当たらない印を、1 つにつき 1 件の `unknown_mark` のずれにする。ファイルは設定ファイルのフォルダからの文書の相対パス、場所は印のある行の番号（1 から）、内容は印の名前と、名前を直すか、拡張・対応表・`check.ignore` に足すかの直し方の 1 文'
  - item: 知っている印
    constraint: '`features`・記法の印・設定の `libraries` に既定を当てた対応表の名前・設定の `extensions` の拡張が既定の書き出しで持つ `directive`・設定の `check.ignore` の名前。拡張は `mdmark export` と同じく束ね、Node で読み込んで既定の書き出しの `directive` を取る（設定の `extensions` のモジュールは、読み込みの時点でブラウザの API を使わず、使うのは `load` の中だけにする）。束ねられない・読み込めない・既定の書き出しが `directive` を持たない拡張は、その `extensions[{位置}]` を指す `schema` のずれにし（読み込めないときは、元のエラーと、ブラウザの API を使う処理を `load` の中へ移す直し方を内容に書く）、その拡張の印は知っている印に入れない'
  - item: 点検する文書
    constraint: 索引の点検に渡す文書（設定に `index` があるとき）と、`build` の対象の文書（設定に `build` があるとき）を合わせ、同じファイルは 1 回だけ点検する。どちらも無い設定では知らない印を点検しない
  - item: 変わった文書
    constraint: '`--base` を渡したときだけ、設定ファイルのフォルダで `--base` と HEAD の merge-base を引き、merge-base から作業ツリーまでに変わったファイルと、git が管理していない新しいファイル（無視するファイルを除く）を、索引のファイルからの相対パスにして `checkIndex` の `changedPaths` に渡す。設定に `index` が無いときは `--base` を使わない'
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/索引を点検する.ts#constraints[直し忘れ]
  - item: エイリアスの点検
    constraint: 設定に `aliases` があるときだけ行う。Schema に合う行だけを使い、行の `paths` を設定ファイルのフォルダから引いて YAML として読み、`buildAliases` に渡して返った `problems` をそのまま出す。`enabled` が `false` の行は読まない。`paths` に当たるファイルが 0 件の行は `alias_no_files`、YAML として読めないファイルは `alias_unreadable` のずれにする
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/エイリアスを作る.ts#
  - item: テーマの名前の点検
    constraint: 設定に `colorTheme` があり、その値が `dev-swiss`・`theme-paper`・`theme-slate`・`theme-contrast` のどれでもないとき、`unknown_color_theme` のずれを 1 つ出す。場所は `colorTheme`、内容には書いた名前と選べるテーマの名前の一覧を入れる。文字列でない値は `schema` のずれにする
    decided_by: dev/設計書/設定/ライブラリ本体#settings[colorTheme]
  - item: 見つからないファイルの点検
    constraint: '制約「点検する文書」の文書ごとに、相対パスで指す画像（動画の `poster` を含む）・動画・音声と、添付のカードにするリンク（インターフェース定義『文書をHTML文字列にする』の制約「リンクと添付のカード」の添付の拡張子）のファイルを、インターフェース定義『文書をHTMLに書き出す』の制約「アセットのルート」と同じ順に探し、どちらにも無いものを 1 つにつき 1 件の `missing_file` のずれにする。ファイルは文書の相対パス、場所は書いた行の番号（1 から）、内容は書いたパスと種類（画像・動画・音声・添付）と、パスを直すかファイルを置くか `assets.root` を確かめる直し方の 1 文。コードブロックとインラインコードの中、絶対 URL、`#` で始まるリンクは点検しない。設定の `assets.root` のフォルダが無いときは `assets.root` を指す `schema` のずれにする'
    decided_by: dev/設計書/設定/ライブラリ本体#settings[assets.root]
  - item: 図の定義の点検
    constraint: '制約「点検する文書」の文書ごとに、`<!-- flow -->`・`<!-- sequence -->`・`<!-- chart -->`・`<!-- param -->`・`<!-- er -->` の範囲の `json` のコードブロック（インターフェース定義『文書をHTML文字列にする』の制約「図の部品」と同じ読み方。埋め込んだ HTML の中の custom element は点検しない）を読む。描く処理と同じ確かめで読めない定義は、1 つの定義につき 1 件の `diagram_invalid` のずれにし、内容は書き方の警告と同じ文にする。読めたフロー図の定義は（座標を省いた判定フローチャートは、インターフェース定義『文書をHTML文字列にする』の制約「自動の配置」を当てた後の座標で）、ノードの矩形の重なり（辺が接するだけは重ならない）・`width`・`height` の外へのはみ出しと `frame` の縁をまたぐノード・線の各線分（`points` を含む）と `from`・`to` でないノードの矩形の交わり・ラベルの長さを点検し、ずれ 1 つにつき 1 件にする（同じノードの組・ノードと線の組は 1 件）。シーケンス図・グラフ・操作できる部品・ER 図の配置は点検しない。ファイルは文書の相対パス、場所は図の部品の開きの印の行の番号（1 から）、内容は図の題（無ければ印の名前）・対象のノードか線の `id`・直し方の 1 文。点検はブラウザを使わない'
  - item: ラベルの長さの目安
    constraint: ノードの種類・名前・補足の文字を、全角の文字は文字の大きさ、半角の文字は文字の大きさの 0.6 倍の幅とみなし、ノードの `w` から左右の余白を除いた幅で折り返した行の数を数える。文字の大きさと余白は描いた文書の CSS の値（種類 11px・名前 14px・補足 12px・行の高さ 1.4 倍・余白 上下 6px 左右 10px）とし、折り返した行の高さの合計がノードの `h` から上下の余白を除いた高さを超えるものをずれにする
    notes: ブラウザの実際の文字幅は使わない（D-12）。目安の値は CSS を変えたときに合わせて直す
  - item: 記法の点検
    constraint: '`--text` か `--file` と `--key` を渡したときは、設定・索引・`build` の対象・エイリアス・テーマの名前・見つからないファイルの点検をしない。渡した Markdown を `render` と同じ読み取りで読み、描いたときに出る書き方の警告を 1 つにつき 1 件のずれにする。内容は警告の本文と同じ文。知らない印の警告は `unknown_mark`、図の部品の定義の警告は `diagram_invalid`、そのほかは `syntax_warning` にする。読めたフロー図の定義は制約「図の定義の点検」と同じ配置の点検もする。設定ファイルが見つかれば、`features`・`libraries`・`extensions`（制約「知っている印」と同じ読み方）・`check.ignore` を当てて描くときと同じ警告にし、見つからなければ既定の設定で点検する（設定ファイルが無いことをエラーにしない）。点検はブラウザを使わない'
    notes: 入口を `mdmark check` の引数にするのは要件.md の未確定（記法の点検の入口、推奨 A）
  - item: 記法の点検の場所
    constraint: '`--text` のずれの場所は、文字列の中の行の番号（1 から）。`--file` のずれのファイルは YAML のファイル、場所は YAML のファイルの行の番号（1 から）。キーの値がブロックスカラー（`|`・`>`）なら、値の中の行を YAML のファイルの行へ置き換え、それ以外の書き方の値はキーの行にする。警告の場所は、書き方の警告を置く要素の元の行番号（`data-source-line` と同じ元の行）'
