title: "文書をHTMLに書き出す"
entry:
  kind: operation
  value: '`mdmark export {文書} [--out {出力}] [--config {設定ファイル}]`（CLI。`npx github:shuhei1101/mdmark#v{版} export` で呼ぶ）'
flows:
  - name: 正常系
    summary: 設定・索引・外部ライブラリ・拡張・画像を埋めた HTML を書き出す
    setup:
      - name: 見本のフォルダ
        description: '`theme`・`index`・`extensions`（印 `greet` の拡張）・`libraries`（`test-lib` に相対パスの手元のモジュール）を書いた設定と、文書 `guide.md` と `api.md` を載せた索引。`guide.md` は表・用語集の表・`test-lib` の印・`greet` の印・相対パスの画像・`api.md` へのリンク・`script` 要素を持ち、`api.md` は `guide.md` へリンクする'
      - name: Mock
        description: 外部ライブラリは相対パスの手元のモジュール（書き出しがネットワークを読まない）。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant M as collectReferences
        participant H as 出力の HTML
        W->>C: mdmark export guide.md
        C->>C: 設定・索引・索引の文書を読む
        C->>M: 索引・文書
        M-->>C: 参照の表
        C->>C: test-lib と greet を束ね、画像を data: URL に替える
        C->>H: guide.html を書く
        C-->>W: 書き出した: guide.html・終了コード 0
    expected:
      - '終了コードが 0 で、標準出力が `書き出した: guide.html`、標準エラーが空'
      - '`guide.html` だけを空のフォルダへ写して file:// で開くと、描き終えるまでにページ自身と `blob:`・`data:` のほかの要求が 0 件'
      - 表に並べ替えのボタンが付き、用語集の表の用語にツールチップが出る
      - '`test-lib` と `greet` の印が描かれ、知らせの枠が出ない'
      - 画像の `naturalWidth` が 0 より大きい
      - '`theme` の CSS の上書きが当たっている'
      - 末尾の関連文書に `api.md` が出て、`api.md` へのリンクが書いたままの `href`
      - '`script` 要素が実行されていない'
    test: test_normal
  - name: 正常系（読めない画像とモジュールがある）
    summary: 読めないものを警告に出し、読めたものだけを埋めて書き出す
    setup:
      - name: 読めないものを指すフォルダ
        description: '`libraries` の `test-lib` に無いファイルを書いた設定と、`test-lib` の印と無い画像 `img/missing.png` を持つ文書'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark export {文書}
        C->>C: test-lib と画像を読めない
        C->>H: 読めたものだけを埋めて書く
        C-->>W: 警告 2 行・終了コード 0
    expected:
      - 終了コードが 0 で HTML が書かれている
      - 標準エラーに `img/missing.png` と `test-lib` の警告の行が出る
      - file:// で開くと `test-lib` の印の場所に知らせの枠が出て、本文のほかの部分は描かれる
      - 描き終えるまでに `img/missing.png` のほかの外への要求が 0 件
    test: test_normal_when_unreadable_assets
  - name: 異常系（設定ファイルが Schema に合わない・終了コード 1）
    summary: 設定ファイルの誤りは、原因と `mdmark check` を示して終わる
    setup:
      - name: 形の違う設定
        description: '`libraries` が文字列の設定を持つフォルダ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark export {文書}
        C->>C: 設定が Schema に合わない
        C-->>W: 原因と mdmark check・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `libraries` と `mdmark check` が出る
      - HTML が書かれていない
    test: test_error_when_config_invalid
  - name: 異常系（文書が無い・終了コード 1）
    summary: 無い文書を渡すと、パスを示して終わる
    setup:
      - name: 見本のフォルダ
        description: 正常系と同じ
        notes: '`{文書}` に `missing.md`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark export missing.md
        C-->>W: 文書が無いこと・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `missing.md` が出る
      - HTML が書かれていない
    test: test_error_when_document_missing
  - name: 異常系（出力先へ書けない・終了コード 1）
    summary: 出力のパスへ書けないと、パスと直し方を示して終わる
    setup:
      - name: 見本のフォルダ
        description: 正常系と同じフォルダに、ファイル `blocked` を置く
        notes: '`--out blocked/guide.html`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark export guide.md --out blocked/guide.html
        C-->>W: 書けないパスと直し方・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `blocked/guide.html` と直し方が出る
      - '`blocked` が変わっておらず、HTML がどこにも書かれていない'
    test: test_error_when_output_unwritable
  - name: 異常系（動画・音声のコピー先へ書けない・終了コード 1）
    summary: 動画・音声のコピー先の `_files/` へ書けないと、HTML を書かずにパスと直し方を示して終わる
    setup:
      - name: 見本のフォルダ
        description: '`guide.md` が相対パスで `media/demo.mp4` を指し、`guide.md` と同じフォルダにファイル `guide_files` を置く'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        W->>C: mdmark export guide.md
        C->>C: 動画・音声を guide_files/ へコピーする（作れない）
        C-->>W: 書けないパスと直し方・終了コード 1
    expected:
      - 終了コードが 1
      - 標準エラーに `guide_files` と直し方が出る
      - ファイル `guide_files` が変わっておらず、`guide.html` が書かれていない
    test: test_error_when_media_copy_unwritable
  - name: 正常系（ツールチップを下に出す設定）
    summary: 設定の `tooltips.placement` を埋める設定に写し、開いた HTML で用語のツールチップを下に出す
    setup:
      - name: 下に出す設定
        description: '`tooltips.placement: bottom` と、用語を 1 つ持つ `index` を持つ設定と、その用語が 2 つ目の節の段落に出る文書を持つフォルダ'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright で file:// として開く
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 書き出した HTML
        W->>C: mdmark export {文書}
        C->>H: tooltips を写した設定を埋めて書く
        W->>H: 開いて用語にポインターを乗せる
        H-->>W: 語の下にツールチップを出す
    expected:
      - 終了コードが 0
      - 開いた HTML で、用語のツールチップの `top` が語の `bottom` 以上
    test: test_normal_when_tooltip_placement
  - name: 正常系（色分けするコードブロック）
    summary: 文書が使う言語の分だけ色分けのモジュールを埋め、開いたときに外へ要求せずに色分けする
    setup:
      - name: 色分けするコードブロックを持つフォルダ
        description: 言語 `ts` と `python` のコードブロックを 1 つずつ持つ文書と、`syntax.url` に手元の `vendor/highlightjs/es/` を書いた設定
        notes: '`vendor/highlightjs/es/` には `@highlightjs/cdn-assets@11.12.0` の `es/` を置き、`languages/yaml.min.js` も含める'
      - name: Mock
        description: 差し替える依存は無い（`syntax.url` を手元のフォルダに向け、書き出しがネットワークを読まない）
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark export {文書}
        C->>C: コードブロックの言語から typescript と python を拾い、本体と 2 言語のモジュールを読む
        C->>H: 色分けのモジュールを埋めて書く
        C-->>W: 出力のパス・終了コード 0
    expected:
      - 終了コードが 0 で、標準エラーに警告が無い
      - HTML だけを空のフォルダへ写して file:// で開くと、描き終えるまでにページ自身と `blob:`・`data:` のほかの要求が 0 件
      - '`ts` と `python` の `code` の中に class が `hljs-` で始まる `span` がある'
      - 書き出した HTML に `yaml` の言語のモジュールが埋まっていない（`name:"YAML"` を含まない）
    test: test_normal_when_syntax_highlighted
  - name: 正常系（エイリアスを読む）
    summary: 設定の aliases の YAML から作ったエイリアスを埋め、env を埋めずに書き出す
    setup:
      - name: エイリアスを持つフォルダ
        description: '設定に `aliases` の 1 行（`paths: aliases/*.yaml`・`metadata` に `alias_type: {type: ref, field: alias_type}`）を記載し、`aliases/` に `alias_type: command` のレコード（`id: run-test`・`name: テストを流す`・`command: npm test`）と、`alias_type: env` のレコード（`id: dev-server`・`name: 開発サーバー`・`url: http://127.0.0.1:8767/`）と、`alias_type: term` で `id`・`name` を持ち `description` が空のレコードを置いたフォルダ。文書 `guide.md` の本文に `テストを流す` と `開発サーバー` がある'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright の Chromium で file:// で開く
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant B as buildAliases
        participant H as 出力の HTML
        W->>C: mdmark export guide.md
        C->>C: 設定の aliases の YAML を読む
        C->>B: 行・読んだ中身
        B-->>C: エイリアス・alias_required_empty のずれ
        C->>H: エイリアスを埋めた guide.html を書く
        C-->>W: 書き出した: guide.html・警告 1 行・終了コード 0
    expected:
      - 終了コードが 0 で、標準エラーに `alias_required_empty` の警告が 1 行ある
      - 開いた文書の `テストを流す` に下線が付き、ツールチップに `npm test` とコピーのボタンが出る
      - '`開発サーバー` に下線が付かない'
      - '`guide.html` のソースに `env` のレコードの `dev-server`・`http://127.0.0.1:8767/` が入っておらず、埋めたエイリアスが `run-test` だけ'
    test: test_normal_when_aliases
  - name: 正常系（テーマを選ぶ設定）
    summary: 設定の `colorTheme` を埋める設定に写し、開いた HTML を選んだテーマで描く
    setup:
      - name: テーマを選ぶ設定
        description: '`colorTheme: theme-slate` を持つ設定と、リンクを持つ段落の文書を持つフォルダ'
      - name: Mock
        description: '差し替える依存は無い。書き出した HTML は Playwright で file:// として開き、OS の配色はライト（`prefers-color-scheme: light`）にする'
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 書き出した HTML
        W->>C: mdmark export {文書}
        C->>H: colorTheme を写した設定を埋めて書く
        W->>H: 開く
        H-->>W: theme-slate で描く
    expected:
      - 終了コードが 0
      - 開いた HTML で、文書の地の色の計算値が theme-slate の明るい配色の `--mdmark-color-bg` の値
    test: test_normal_when_color_theme
  - name: 正常系（部品の文言を替える設定）
    summary: 設定の `labels` を埋める設定に写し、開いた HTML で操作できる部品のボタンを設定の文言で描く
    setup:
      - name: 部品の文言を替える設定
        description: '`labels.paramCopy: コピー` を持つ設定と、`<!-- param -->` の印で操作できる部品を 1 つ持つ文書を持つフォルダ'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright で file:// として開く
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 書き出した HTML
        W->>C: mdmark export {文書}
        C->>H: labels を写した設定を埋めて書く
        W->>H: 開く
        H-->>W: ボタンを「コピー」で描く
    expected:
      - 終了コードが 0
      - 開いた HTML で、`button.mdmark-param-copy` の `textContent` が `コピー`
    test: test_normal_when_param_copy_label
  - name: 正常系（画像・動画・音声とアセットのルート）
    summary: 画像を data URL で埋め、動画・音声を出力の隣のフォルダへコピーし、文書からの相対パスに無いファイルをアセットのルートで探す
    setup:
      - name: 書き出す文書とファイル
        description: '`docs/guide.md` が相対パスで `images/chart.png`・`images/dark.png#only-dark`・`images/build.gif`・`media/demo.mp4`（`poster=images/poster.png`）・`media/voice.mp3`・`images/logo.png` を指し、リンクだけの段落 `[仕様書](files/spec.pdf)` を持つ'
        notes: '`images/logo.png` は `docs/` の下に無く、`assets/images/logo.png` にだけある。ほかのファイルは `docs/` からの相対パスにある'
      - name: 設定
        description: '`mdmark.config.yaml` の `assets.root` が `assets`'
      - name: Mock
        description: 差し替える依存は無い。書き出した HTML は Playwright の Chromium で file:// で開き、要求を記録する
    flow: |-
      sequenceDiagram
        actor W as 文書を書く人
        participant C as mdmark CLI
        participant H as 出力の HTML
        W->>C: mdmark export docs/guide.md
        C->>C: 画像・動画・音声を文書からの相対パス、無ければアセットのルートで探す
        C->>C: 画像を data URL に替え、動画・音声のパスを guide_files/ の相対パスに替える
        C->>H: guide.html と guide_files/ を書く
        C-->>W: 書き出した: docs/guide.html・終了コード 0
    expected:
      - 終了コードが 0 で、標準エラーが空
      - '`chart.png`・`dark.png`・`build.gif`・`poster.png`・`logo.png` が `data:` URL で埋まり、`dark.png` の `src` が `#only-dark` を持つ'
      - '`docs/guide_files/docs/media/demo.mp4` と `docs/guide_files/docs/media/voice.mp3` があり、HTML の `video`・`audio` の `src` が `guide_files/docs/media/demo.mp4`・`guide_files/docs/media/voice.mp3`'
      - '`files/spec.pdf` はコピーされず、カードの `href` が `files/spec.pdf` のまま'
      - '`guide.html` と `guide_files/` だけを空のフォルダへ写して file:// で開くと、描き終えるまでにページ自身・`guide_files/` の下のファイルと `blob:`・`data:` のほかの要求が 0 件'
    test: test_normal_when_media_embedded
    refs:
      - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#scenarios[正常シナリオ（画像・動画・音声を埋める）]
lead: 文書を書く人が Markdown を 1 つ、配布物・使う側の CSS・外部ライブラリのモジュール・拡張・画像を埋めた 1 枚の HTML に書き出す。開いた HTML は `mount` で文書を描き、外へ要求しない。
idempotent: true
side_effects: 出力のパスに HTML を書く（既にあれば上書きする）。文書が指す動画・音声を、出力の隣の `_files/` のフォルダへコピーする（同じ名前のファイルは上書きする）。文書が使う外部ライブラリの設定の `libraries` の URL の先と、そのモジュールが import する先を読む。色分けの対象のコードブロックがあるとき、`syntax.url` の先の core と、使う言語のモジュールを読む
callers:
  - dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す#
request:
  - name: '{文書}'
    type: string
    required: true
    location: argument
    description: 書き出す Markdown のパス
    example: docs/使い方/guide.md
  - name: --out
    type: string
    required: false
    default: 文書と同じフォルダの、拡張子を `.html` に替えたパス
    location: argument
    description: 書き出す HTML のパス
    notes: 親のフォルダが無ければ作る
  - name: --config
    type: string
    required: false
    default: なし（今のフォルダから上のフォルダへ順に `mdmark.config.yaml` を探す）
    location: argument
    description: 使う設定ファイルのパス
    notes: 探し方はインターフェース定義『設定と索引を点検する』と同じ
response:
  - name: 標準出力
    type: string
    description: '`書き出した: {出力のパス}` の 1 行'
  - name: 標準エラー
    type: string
    description: '警告 1 つを 1 行（`警告: {ファイル}: {内容}`）で並べる'
    notes: 読めない画像・動画・音声・モジュール・拡張・`theme`、知らない `colorTheme` の名前、埋めずに残した絶対 URL の画像・動画・音声
  - name: 終了コード
    type: 0 | 1
    description: 書き出したら（警告があっても）0、書き出せなかったら 1
  - name: 出力の HTML
    type: ファイル
    description: 配布物の CSS・`theme` の CSS・配布物の JavaScript・束ねたモジュールと拡張・画像を替えた文書の Markdown・設定・索引・参照の表を埋めた 1 枚の HTML。開くと、埋めたモジュールを `blob:` URL に替えて設定の `libraries` に渡し、埋めた拡張を `registerExtension` で登録してから `mount` で文書を描く
response_example: |-
  ```text
  書き出した: docs/使い方/guide.html
  ```

  ```text
  警告: docs/使い方/guide.md: 画像 `img/missing.png` を読めません。パスを直すか画像を置いてください。
  ```
exceptions:
  - name: なし（正常終了）
    condition: HTML を書いた（読めなかったものは警告に出す）。終了コード 0
  - name: 設定ファイルの誤り（終了コード 1）
    condition: 設定ファイルが無い・読めない・Schema に合わない（空の設定ファイルを含む）
    notes: 標準エラーに原因と直し方の 1 文を出す。Schema に合わないときは `mdmark check` でどこが合わないかを確かめられることを書く
  - name: 文書を読めない（終了コード 1）
    condition: '`{文書}` のファイルが無い・読めない'
    notes: 標準エラーにパスと直し方を出す
  - name: 出力先へ書けない（終了コード 1）
    condition: 出力のパスか、動画・音声のコピー先の `_files/` へ書けない（親がファイル・同じ名前のファイルがある・権限が無い）
    notes: 標準エラーに書けなかったパスと直し方を出す。HTML はどこにも書かない
constraints:
  - item: 外部への要求
    constraint: 開いてから描き終えるまでに、ページ自身・`_files/` の下にコピーした動画と音声と `blob:`・`data:` のほかへ要求しない
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[書き出した HTML の外部への要求]
  - item: 埋める外部ライブラリ
    constraint: 文書に印がある外部ライブラリだけを、既定の対応表に設定の `libraries` を重ねた URL から読む。URL ごとに、そのモジュールが import する先も含めて 1 つの ES モジュールに束ねる。相対パスの URL は設定ファイルのあるフォルダを基準に読む。届かない・束ねられないものは埋めず警告に出し、開いたときその印の場所に知らせの枠を出す
    notes: 'PoC #35 で、束ねたモジュールを `blob:` URL で読めることを確かめた'
  - item: 埋める拡張
    constraint: 設定の `extensions` のモジュールを 1 つずつ ES モジュールに束ねて埋める（TypeScript は JavaScript に変える）。読めない・束ねられないものは埋めず警告に出す
  - item: 埋める画像
    constraint: 文書が相対パスで指す画像（GIF・テーマごとの画像・動画の `poster` を含む）を、制約「アセットのルート」のとおりに探して読み、`data:` URL に替える（フラグメントは `data:` URL の後ろに残す）。読めない画像は書いたまま残して警告に出す。絶対 URL の画像は読まずに書いたまま残し、開いたときに外へ要求することを警告に出す
  - item: 使う側の CSS
    constraint: 設定の `theme` の CSS を配布物の CSS の後に埋める。読めないときは埋めず警告に出す
  - item: 索引と参照の表
    constraint: 設定に `index` があるとき、索引と、索引の `docs` の文書を読んで `collectReferences` で作った参照の表を埋め、索引に書き出す文書があればその `id` を `mount` の `docId` に渡す。読めない索引の文書は飛ばして警告に出す
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/参照の表を作る.ts#
  - item: 文書間のリンク
    constraint: 書いたままの `href` で残す。警告には出さない
  - item: スクリプト
    constraint: 文書に書いたスクリプトは `mount` のサニタイズで落とし、実行しない。埋める文字列は `</script>` を含んでも HTML の `script` 要素を閉じないように書く
  - item: 書き出した HTML のサイズ
    constraint: 制限なし
    notes: 'PoC #35 の見本（Chart.js を 1 つ埋めた文書）で 548,910 バイト。配布ファイル 1 つのサイズの上限は jsDelivr が配る `dist/` が対象で、書き出した HTML には当てない'
  - item: 動く Node の版
    constraint: Node 24 以降
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[CLI が動く Node の版]
  - item: 開くブラウザ
    constraint: Chrome 99・Firefox 98・Safari 16.4 以降
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[対応ブラウザ]
  - item: ツールチップを出す場所
    constraint: 設定の `tooltips.placement` を、`features` と同じく埋める設定に写して `mount` の `opts.config` に渡す。無いときは写さず、`mount` の既定（`top`）に任せる。`top`・`bottom` 以外の値は設定ファイルの誤り（終了コード 1）にする
    decided_by: dev/設計書/設定/ライブラリ本体#settings[tooltips.placement]
  - item: 埋める色分け
    constraint: '機能 `syntax` がオンのとき、文書のコードブロックの情報文字列から色分けの対象の言語を拾い（`mount` と同じ対応表で、`dockerfile`・`diff` とその別名を含む。言語は情報文字列の最初の `:` の前。文書の `<!-- features: -syntax -->` の文書は拾わない）、設定の `syntax.url`（無ければ既定の jsDelivr の URL）の本体と使う言語のモジュールだけを 1 つずつ ES モジュールとして埋める。開いたときは `mount` が埋めたモジュールから色分けし、埋めなかった言語は読みに行かず色分けせずに残す。相対パスの `syntax.url` は設定ファイルのあるフォルダを基準に読む。届かないモジュールは埋めず警告に出す（書き出しは止めない）'
    notes: 'PoC #98 で、core と 3 言語を埋めた HTML を外への要求 0 件で色分けできることを確かめた（約 35KB）。埋めるモジュールは頭の BSD-3-Clause の著作権表示を残す'
  - item: 右側の目次の出し方
    constraint: 設定の `side-toc` を、`features` と同じく埋める設定に写して `mount` の `opts.config` に渡す。無いときは写さず、`mount` の既定（`hover`）に任せる。`mode` が `hover`・`fixed` 以外の値は設定ファイルの誤り（終了コード 1）にする
    decided_by: dev/設計書/設定/ライブラリ本体#settings[side-toc.mode]
  - item: エイリアス
    constraint: 設定に `aliases` があるとき、インターフェース定義『設定と索引を点検する』のエイリアスの点検と同じく行の `paths` の YAML を読んで `buildAliases` に渡し、返った `aliases`（`env` を含まない）を埋めて `mount` の `opts.aliases` に渡す。返った `problems` と、当たるファイルが無い行・読めないファイルは警告に出し、終了コードは 0 のまま
    decided_by: dev/設計書/インターフェース定義/ライブラリ本体/エイリアスを作る.ts#
  - item: 選ぶテーマ
    constraint: 設定の `colorTheme` を、`tooltips.placement` と同じく埋める設定に写して `mount` の `opts.config` に渡す。無いときは写さず、`mount` の既定（`dev-swiss`）に任せる。知らないテーマの名前も写したうえで、標準エラーに知らないテーマの名前である旨を出す（終了コードは 0 のまま）
    decided_by: dev/設計書/設定/ライブラリ本体#settings[colorTheme]
  - item: 部品の文言
    constraint: 設定の `labels` を、`tooltips.placement` と同じく埋める設定に写して `mount` の `opts.config` に渡す。無いときは写さず、`mount` の既定に任せる。`labels` がマップでない、または `labels.paramCopy` が空でない文字列でないときは設定ファイルの誤り（終了コード 1）にする
    decided_by: dev/設計書/設定/ライブラリ本体#settings[labels.paramCopy]
  - item: アセットのルート
    constraint: '文書が相対パスで指す画像・動画・音声・`poster` は、文書のフォルダを基準に探し、無ければ設定の `assets.root` を基準に同じ相対パスで探す。`src` のクエリとフラグメントは探すときに外し、書き出す値に残す'
    decided_by: dev/設計書/設定/ライブラリ本体#settings[assets.root]
  - item: コピーする動画と音声
    constraint: '文書が相対パスで指す動画・音声（拡張子の一覧はインターフェース定義『文書をHTML文字列にする』の制約「動画と音声」）を、出力の HTML と同じフォルダの `{出力のファイル名から拡張子を除いた名前}_files/` へコピーし、文書の Markdown の `src` をそのコピーへの HTML からの相対パスに替える。コピー先の中のパスは、設定ファイルのフォルダ（設定ファイルが無ければ文書のフォルダ）からの相対パスにする。そのフォルダの外にあるファイルは `_files/external/{ファイル名}` にし、名前が重なれば `-1`・`-2` を付ける。同じファイルは 1 回だけコピーする。コピーは HTML を書く前に行い、`_files/` を作れない・書けないときは「出力先へ書けない」で終え、HTML を書かない。前の書き出しが残した `_files/` の中の、今回コピーしないファイルは消さない。読めない動画・音声は書いたまま残して警告に出す。添付のファイルはコピーせず、書いたままのリンクで残す'
  - item: 書き出しの機能のオン・オフ
    constraint: 設定の `features` で `images` か `media` をオフにした文書も、画像の埋め込みと動画・音声のコピーは同じく行う
