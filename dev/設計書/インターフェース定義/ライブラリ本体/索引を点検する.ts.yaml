title: "索引を点検する"
entry:
  kind: operation
  value: '`checkIndex(input)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: ずれの無い索引と文書で空の一覧を返す
    setup:
      - name: 配布物を読む Node の処理
        description: ビルドした `dist/index.js` を読み、`checkIndex` を呼ぶ
      - name: ずれの無い索引と文書
        description: 文書 `arch`（`arch.md`）・`api`（`api.md`、`related` に `arch`）と用語 1 つを持つ索引と、`arch.md`・`api.md` だけの `documents`
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents })
        M->>M: 索引の形・文書の対応・related・用語を確かめる
        M-->>C: []
    expected:
      - 戻り値が `[]`
    test: test_normal
  - name: 正常系（ずれがある）
    summary: 消えた文書・索引に無い文書・切れた `id`・用語の重複を返す
    setup:
      - name: 配布物を読む Node の処理
        description: 正常系と同じ。`indexFile` に `docs/index.yaml` を渡す
      - name: ずれを持つ索引と文書
        description: 索引は `docs[0]` が `api`（`api.md`、`related` に `gone`）、`docs[1]` が `old`（`old.md`）、`docs[2]` が `guide`（`guide.md`）、`terms` に語 `ワークスペース` の用語 2 つ。`documents` は `api.md`・`guide.md`・`new.md` で、`api.md` の用語集の表が `ワークスペース` と `印`、`guide.md` の用語集の表が `印` を入れる
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents, indexFile })
        M->>M: 文書の対応・related・用語を確かめる
        M-->>C: ずれの一覧
    expected:
      - '`{ file: "docs/index.yaml", where: "docs[1].path", kind: "missing_doc" }` の行がある'
      - '`{ file: "new.md", where: "", kind: "orphan_doc" }` の行がある'
      - '`{ file: "docs/index.yaml", where: "docs[0].related[0]", kind: "broken_ref" }` の行があり、`message` に `gone` がある'
      - '`kind` が `duplicate_term` の行が 3 つ（索引の `terms` どうしの `ワークスペース`、索引と `api.md` の表の `ワークスペース`、`api.md` と `guide.md` の表の `印`）'
      - 行の並びが `missing_doc` → `orphan_doc` → `broken_ref` → `duplicate_term`
    test: test_normal_when_drift
  - name: 正常系（Schema に合わない索引）
    summary: 合わないところごとに `schema` のずれを返し、例外を投げない
    setup:
      - name: 配布物を読む Node の処理
        description: 正常系と同じ
      - name: Schema に合わない索引
        description: '`schema` を持たず、`docs[1]` が `path` を持たない索引。`documents` は `docs[0]` の文書だけ'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents })
        M->>M: 索引の形を確かめる
        M-->>C: schema のずれを持つ一覧
    expected:
      - 例外を投げない
      - '`{ file: "index.yaml", where: "schema", kind: "schema" }` と `{ file: "index.yaml", where: "docs[1].path", kind: "schema" }` の行がある'
      - '`docs[0]` の文書について、ほかの種類のずれが無い'
    test: test_normal_when_invalid_schema
  - name: 正常系（やめた言い方が本文に出る）
    summary: 本文に出た用語のやめた言い方を、行とやめた言い方の組ごとに返す
    setup:
      - name: 配布物を読む Node の処理
        description: 正常系と同じ
      - name: やめた言い方を持つ索引と文書
        description: 索引は `docs[0]` が `guide`（`guide.md`）、`terms[0]` が語 `ワークスペース`・`avoid` に `作業場`。`documents` は `guide.md` だけ
        notes: '`guide.md` は 1 行目が見出し `# 作業場の手引き`、3 行目が `作業場を開き、作業場に記録を置く。`、5 行目が行内のコード `` `作業場` `` だけの段落、7・8 行目が 1 つの段落で `ワークスペースを閉じる前に` / `作業場の記録を確かめる。`、10〜12 行目がふつうの表で 12 行目の行が `| 共有 | 作業場の共有 |`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents })
        M->>M: 索引の文書の本文から、用語のやめた言い方を探す
        M-->>C: avoided_term のずれを持つ一覧
    expected:
      - '戻り値が `{ file: "guide.md", where: "3 行目", kind: "avoided_term" }`・`{ file: "guide.md", where: "8 行目", kind: "avoided_term" }`・`{ file: "guide.md", where: "12 行目", kind: "avoided_term" }` の 3 つだけで、この順に並ぶ'
      - どの `message` にも `作業場` と `ワークスペース` がある
      - 見出し（1 行目）と行内のコード（5 行目）の `作業場` のずれは無い
    test: test_normal_when_avoided_term
  - name: 正常系（用語集の表のやめた言い方が本文に出る）
    summary: 用語集の表のやめた言い方を、表を持たない文書の本文からも返す
    setup:
      - name: 配布物を読む Node の処理
        description: 正常系と同じ
      - name: 用語集の表にやめた言い方を持つ索引と文書
        description: 索引は `docs[0]` が `glossary`（`glossary.md`）、`docs[1]` が `guide`（`guide.md`）で、`terms` を持たない。`documents` は `glossary.md`・`guide.md`
        notes: '`glossary.md` は `<!-- glossary: term=用語 meaning=意味 avoid=やめた言い方 -->` で、行 `| ワークスペース | 作業の置き場所 | 作業場、ワーク場 |` を持つ表だけを持つ。`guide.md` は 1 行目が `作業場を開く。`、3 行目が `ワーク場を閉じる。`、5 行目が `ワークスペースを使う。`'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents })
        M->>M: 索引の文書の用語集の表から、やめた言い方を読む
        M->>M: 索引の全ての文書の本文から、やめた言い方を探す
        M-->>C: avoided_term のずれを持つ一覧
    expected:
      - '戻り値が `{ file: "guide.md", where: "1 行目", kind: "avoided_term" }`・`{ file: "guide.md", where: "3 行目", kind: "avoided_term" }` の 2 つだけで、この順に並ぶ'
      - 1 行目の `message` に `作業場` と `ワークスペース`、3 行目の `message` に `ワーク場` と `ワークスペース` がある
      - '`glossary.md` の表の中の `作業場`・`ワーク場` のずれは無い'
    test: test_normal_when_glossary_avoided_term
  - name: 正常系（タグが語彙とずれる）
    summary: タグの語彙を持つ索引で、語彙の重なり・切れた振り替え先・語彙に無いタグ・やめたタグを返す
    setup:
      - name: 配布物を読む Node の処理
        description: 正常系と同じ
      - name: 語彙とずれるタグを持つ索引と文書
        description: '索引の `tags` が `tags[0]` `topic:mcp`（`aliases` に `MCP`）・`tags[1]` `topic:yaml`（`aliases` に `MCP`）・`tags[2]` `topic:yaml`・`tags[3]` `topic:old`（`deprecated` が `topic:mcp`）・`tags[4]` `topic:gone`（`deprecated` が `topic:none`）。`docs[0]` が `a`（`a.md`）で、`tags` が `{name: topic:mcp, main: true}`・`topic:mcq`・`topic:old`。`documents` は `a.md` だけ'
        notes: 近いタグに `topic:mcp` が選ばれることを、1 文字違いの `topic:mcq` で起こす
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 使う側の処理
        participant M as mdmark
        C->>M: checkIndex({ index, documents })
        M->>M: 語彙の重なりと振り替え先を確かめる
        M->>M: 文書のタグを語彙と突き合わせる
        M-->>C: タグのずれを持つ一覧
    expected:
      - 例外を投げない
      - '戻り値が `{ where: "tags[2].name", kind: "duplicate_tag" }`・`{ where: "tags[1].aliases[0]", kind: "tag_alias_conflict" }`・`{ where: "tags[4].deprecated", kind: "broken_tag_replacement" }`・`{ where: "docs[0].tags[1]", kind: "unregistered_tag" }`・`{ where: "docs[0].tags[2]", kind: "deprecated_tag" }` の 5 つだけで、この順に並び、どれも `file` が `index.yaml`'
      - '`unregistered_tag` の `message` に `topic:mcq` と `topic:mcp` がある'
      - '`deprecated_tag` の `message` に `topic:old` と `topic:mcp` がある'
      - '`docs[0].tags[0]`（`topic:mcp`）のずれは無い'
    test: test_normal_when_tag_drift
lead: 使う側の処理（#9 の `mdmark check`・#11 の MCP の `check`）が、索引と、索引のフォルダにある文書の本文を渡して、索引と文書のずれの一覧を受け取る。ファイルを読むのは呼ぶ側で、mdmark は渡された値だけを確かめる。
idempotent: true
side_effects: なし（引数・索引・文書を書き換えない）
request:
  - name: input.index
    type: unknown
    required: true
    location: argument
    description: 使う側が索引の YAML を読んだ値。形を確かめる前の値をそのまま渡す
    notes: 形は ER 図『索引』。合わないところを `schema` のずれで返す
  - name: input.documents
    type: Record<string, string>
    required: true
    location: argument
    description: 索引のフォルダにある文書のパス（索引のファイルからの相対パス。区切りは `/`）から、その文書の Markdown を引く表
    notes: どのファイルを文書として渡すか（拡張子・除外）は呼ぶ側が決める
  - name: input.indexFile
    type: string
    required: false
    default: '`index.yaml`'
    location: argument
    description: ずれの `file` に出す索引のファイルの名前
    example: docs/index.yaml
response:
  - name: '[]'
    type: MdmarkIndexIssue[]
    description: ずれの一覧。ずれが無ければ空
    constraints: 並びは `schema` → `missing_doc` → `orphan_doc` → `broken_ref` → `duplicate_term` → `avoided_term` → `duplicate_tag` → `tag_alias_conflict` → `broken_tag_replacement` → `unregistered_tag` → `deprecated_tag` の順、同じ種類の中は索引の並びとパスの順
  - name: '[].file'
    type: string
    description: ずれのあるファイル。索引のずれは `indexFile`、文書のずれはその文書のパス
    example: docs/index.yaml
  - name: '[].where'
    type: string
    description: 索引のキーのパス（`docs[3].path`・`docs[0].tags[1]`・`tags[2].name`）か、文書の行（`3 行目`）。ファイル全体のずれは空文字
    example: docs[3].path
  - name: '[].kind'
    type: "'schema' | 'missing_doc' | 'orphan_doc' | 'broken_ref' | 'duplicate_term' | 'avoided_term' | 'duplicate_tag' | 'tag_alias_conflict' | 'broken_tag_replacement' | 'unregistered_tag' | 'deprecated_tag'"
    description: ずれの種類
    notes: '`schema` は Schema に合わない索引、`missing_doc` は索引にあって消えた文書、`orphan_doc` は索引に無い文書、`broken_ref` は `related` の切れた `id`、`duplicate_term` は用語の重複、`avoided_term` は本文に出た用語のやめた言い方、`duplicate_tag` は語彙の `name` の重複、`tag_alias_conflict` は語彙の `aliases` が別のタグの `name` か `aliases` と重なる、`broken_tag_replacement` は語彙に無い `deprecated` の振り替え先、`unregistered_tag` は語彙に無い文書のタグ、`deprecated_tag` は文書のやめたタグ。タグの 5 種類は、索引がタグの語彙（`tags`）を持つときだけ返す'
  - name: '[].message'
    type: string
    description: ずれの内容と直し方。日本語の 1 文
    example: '`設計/旧.md` が見つかりません。文書を戻すか、索引の `docs[3]` を消してください。'
response_example: |-
  ```json
  [
    { "file": "docs/index.yaml", "where": "docs[1].path", "kind": "missing_doc", "message": "`old.md` が見つかりません。文書を戻すか、索引の `docs[1]` を消してください。" },
    { "file": "new.md", "where": "", "kind": "orphan_doc", "message": "`new.md` が索引にありません。索引の `docs` に足してください。" }
  ]
  ```
exceptions:
  - name: なし（正常終了）
    condition: ずれの一覧を返す（ずれが無ければ空）
  - name: なし（Schema に合わない索引）
    condition: '`index` が Schema に合わない'
    notes: 例外を投げず、合わないところごとに `schema` のずれを返す。読めた文書・用語でほかのずれも確かめる
constraints:
  - item: 実行する環境
    constraint: Node とブラウザのどちらでも同じ結果を返す。DOM に頼らない
  - item: Schema の検査
    constraint: '`schemas/mdmark.index.schema.json` と同じ形を検査する。必須のキーの欠け・型の違い・`docs[].id` と `terms[].id` のそれぞれの中の重なりを `schema` のずれにする。最上位の `tags` は、要素が `name`（必須・空でない文字列）・`group`（空でない文字列）・`description`（文字列）・`aliases`（空でない文字列の並び）・`deprecated`（空でない文字列）だけを持つオブジェクトの並び。`docs[].tags` の要素は、空でない文字列か、`name`（必須・空でない文字列）と `main`（真偽値）だけを持つオブジェクト。`tags[].name` の重なりは `schema` のずれにせず `duplicate_tag` で返す'
    notes: 検査の仕方（ライブラリを使うか）はモジュール構成設計で決める
  - item: 文書の対応
    constraint: 索引の `docs[].path` と `documents` のキーを、`./` と重なった `/` を除いた文字列で比べる。大文字と小文字は区別する
  - item: 用語の重複
    constraint: 索引の `terms` どうし・索引の `terms` と用語集の表・用語集の表どうしで、語か別名が同じ文字のものを、後に出た用語ごとに重なる先のうち最初の 1 つとの組で 1 つの `duplicate_term` にする（索引 → 索引の `docs` の順の文書の表の順で後と先を決める）。`file` と `where` は後に出た側を指す。索引の側は `file` が `indexFile`、`where` が `terms[1].term` か `terms[1].aliases[0]`。用語集の表の側は `file` が文書のパス、`where` が表のその行の文書の中の行番号（`12 行目`。解析器のトークンの `map` の開始行 + 1）。`message` に先の側の場所を書く
    notes: 用語集の表は `collectReferences` と同じ読み方で拾う
  - item: 上限
    constraint: 制限なし（渡された全ての文書を確かめる）
  - item: やめた言い方
    constraint: 索引の `docs` の文書のうち `documents` にある文書の本文から、索引の `terms[].avoid` の語と、索引の `docs` の文書の用語集の表のやめた言い方の列（印の `avoid=`）の言い方を、文書の別名の一致と同じ範囲（見出し・リンクの中・コード・用語集の表の中を除く）と同じ語の切れ目で探す。用語集の表のやめた言い方は、表を持つ文書に限らず索引の `docs` の全ての文書で探す。同じやめた言い方が複数の用語にあるときは、索引の `terms`、索引の `docs` の順の文書の表の順で先の用語を代わりに使う用語にする。索引の用語と用語集の表の用語の語・別名も一緒に探し、長いほうを当てて（同じ長さなら用語の語・別名を当てる）、やめた言い方が当たったところだけを数える。出た行とやめた言い方の組ごとに 1 つの `avoided_term` にし、`file` は文書のパス、`where` はその語が出た文書の中の行番号（`8 行目`。解析器の行内のトークンの `map` の開始行 + 語より前の改行の数 + 1。行内のトークンが `map` を持たない表のセルは、そのセルを囲む `tr_open` の `map` の開始行 + 1）。`message` にやめた言い方と代わりに使う用語の語を書く。並びは索引の `docs` の順、文書の中は行の順、同じ行の中は出た順
    notes: 索引に無い文書（`orphan_doc`）は探さない。語の切れ目と探す範囲は `collectReferences` の文書の別名の一致と同じ
  - item: タグの点検
    constraint: 索引が最上位の `tags` を持つときだけ行い、持たない索引ではタグのずれを返さない。文書のタグは、語彙の `name` か `aliases` に同じ文字で当たれば、そのタグの `name` として扱う（同じ `name`・別名が複数あるときは語彙の並びで先のタグ）。`duplicate_tag` は 2 つ目以降に出た同じ `name` ごとに 1 つ（`where` は `tags[2].name`）。`tag_alias_conflict` は別名ごとに、ほかのタグの `name` か、語彙の並びで先のほかのタグの別名と同じ文字のとき 1 つ（`where` は `tags[1].aliases[0]`。`message` に重なる先のタグの `name` を書く）。`broken_tag_replacement` は `deprecated` が語彙のどの `name` にも当たらないタグごとに 1 つ（`where` は `tags[4].deprecated`）。`unregistered_tag` は文書のタグのうち語彙に当たらないものごとに 1 つ（`where` は `docs[0].tags[1]`）で、`message` に近いタグを書く。`deprecated_tag` は文書のタグが `deprecated` を持つタグに当たるとき 1 つ（`where` は `docs[0].tags[2]`）で、`message` に振り替え先を書く。`file` はどれも `indexFile`
    notes: 近いタグは、`deprecated` を持たないタグの `name` と `aliases` のうち、文書のタグとの編集距離（文字の挿入・削除・置換の回数）が 2 以下で最も小さいもの（同じ距離なら語彙の並びで先）のタグの `name`。当たらないときは `message` に近いタグが無いことと、語彙に足すか直す直し方を書く
refs:
  - dev/設計書/シナリオ/単一ユースケース/索引と文書のずれを点検する#
  - dev/設計書/インターフェース定義/ライブラリ本体/参照の表を作る.ts#
test_file: tests/integration/lib/check-index.test.ts
