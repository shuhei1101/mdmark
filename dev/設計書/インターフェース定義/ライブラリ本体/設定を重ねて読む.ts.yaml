title: 設定を重ねて読み込む
entry:
  kind: operation
  value: '`loadLayeredConfig`（ライブラリ本体の Node から使用する関数。CLI・MCP のツール・VS Code 拡張機能が呼ぶ）'
lead: 端末の設定と、起点のフォルダから上のフォルダの `mdmark.config.yaml` を探して重ね、重ねた設定と、重ねた設定ファイルの一覧を返却する。
test_file: tests/integration/lib/config-cascade.test.ts
idempotent: true
side_effects: 無し（端末の設定と設定ファイルを読み込むだけで、書き換えない）
callers:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す#
  - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる#
  - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する#
  - dev/設計書/インターフェース定義/ライブラリ本体/版を上げる#
  - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く#
  - dev/設計書/インターフェース定義/VSCode拡張機能/HTMLに書き出す#
request:
  - name: cwd
    type: string
    required: true
    location: argument
    description: 上へ探す起点のフォルダの絶対パス（CLI は今のフォルダ、MCP は `project_dir`、VS Code 拡張機能は Markdown のフォルダ）
  - name: explicit
    type: string
    required: false
    default: なし（`cwd` から上のフォルダへ `mdmark.config.yaml` を探す）
    location: argument
    description: 指定した設定ファイルのパス（CLI の `--config`・MCP の `config`・VS Code 拡張機能の `mdmark.configPath`）。指定したときは上へ探さず、このファイルと端末の設定だけを重ねる
    notes: 相対パスは `cwd` から解決する
  - name: purpose
    type: '"preview" | "export"'
    required: true
    location: argument
    description: 読み込む目的。`export` のときだけ、端末の設定の `config.applyToExport` が `false` なら端末の設定を重ねない
  - name: env
    type: Record<string, string | undefined>
    required: true
    location: argument
    description: 環境変数（`MDMARK_CONFIG`・`XDG_CONFIG_HOME` を読み込む）
  - name: home
    type: string
    required: true
    location: argument
    description: ホームのフォルダの絶対パス（`XDG_CONFIG_HOME` が無いときの `~/.config` の基準と、表示のパスの `~`）
response:
  - name: config
    type: CliConfig
    description: 重ねた設定。相対パスの値は、その値を記載した設定ファイルのフォルダから解決した絶対パス
  - name: files
    type: ConfigFile[]
    description: 重ねた設定ファイルを重ねた順（端末の設定 → 上 → 近い）に並べたもの。端末の設定が無ければ含めない
  - name: files[].path
    type: string
    description: 設定ファイルの絶対パス
  - name: files[].layer
    type: '"settings" | "folder"'
    description: 端末の設定か、フォルダの `mdmark.config.yaml` か
  - name: nearest
    type: string | undefined
    description: 最も近い `mdmark.config.yaml` の絶対パス（`explicit` を指定したときはそのパス）。1 つも無ければ `undefined`
  - name: issues
    type: CheckIssue[]
    description: 重ねた設定ファイルごとの `schema` のずれ。`file` はそのファイルの絶対パス（表示するときは制約「パスの表示」で書き換える）
  - name: unreadable
    type: '{ path: string; line: number; message: string } | undefined'
    description: YAML として読み込めなかった最初の設定ファイル（端末の設定 → 上 → 近いの順）。`path` は絶対パス、`line` は読み込めない行（1 始まり）。全て読み込めたときは `undefined`
response_example: |-
  ```json
  {
    "config": { "features": { "callout": false, "table": false }, "theme": "/work/theme.css" },
    "files": [
      { "path": "/home/u/.config/mdmark/settings.yaml", "layer": "settings" },
      { "path": "/work/mdmark.config.yaml", "layer": "folder" },
      { "path": "/work/docs/mdmark.config.yaml", "layer": "folder" }
    ],
    "nearest": "/work/docs/mdmark.config.yaml",
    "issues": []
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 重ねて読み込めた。YAML として読み込めないファイルは例外にせず `unreadable` に、構造に合わないファイルは `issues` に入れる（どちらも重ねない）
  - name: ConfigNotFoundError
    condition: '`explicit` のファイルが無い'
    notes: '`explicit` を指定せず `mdmark.config.yaml` が 1 つも無いときは例外にせず `nearest` を `undefined` にする（呼ぶ側が誤りにするかを決める）'
constraints:
  - item: 端末の設定のパス
    constraint: '`MDMARK_CONFIG` があればその値、無ければ `${XDG_CONFIG_HOME:-{home}/.config}/mdmark/settings.yaml`。ファイルが無ければ空の設定として扱い、`files` に含めない'
  - item: 重ねる順と優先
    constraint: 端末の設定 → 上のフォルダの設定 → 近いフォルダの設定の順に重ね、後の設定ほど優先する（文書の先頭のマーカーは `mount` が最後に重ねる）
  - item: 重ね方
    constraint: マップ（`features`・`libraries`・`tooltips` など）はキーごとに重ね、それ以外の値（文字列・数・真偽値・配列）は後の設定の値で置き換える
  - item: 重ね方の切り替え
    constraint: 端末の設定の `config.cascade` が `true` のときだけ上のフォルダの設定を全て重ねる。既定の `false` では、`cwd` から上へ最初に見つかった 1 つと端末の設定だけを重ねる
  - item: 書き出しの切り替え
    constraint: '`purpose` が `export` で、端末の設定の `config.applyToExport` が `false` のときは端末の設定を重ねない（既定は `true`）。`config` のキーは端末の設定だけが持ち、フォルダの設定に記載しても読み込まない'
  - item: 相対パスの基準
    constraint: '`theme`・`extensions`・`libraries` の値・`html-scripts.url`・`syntax.url`・`index`・`assets.root`・`build` の各パス・`aliases` のパスは、重ねる前に、その値を記載した設定ファイルのフォルダから絶対パスにする。`http:`・`https:` の URL は替えない'
  - item: 読み込めないファイル
    constraint: YAML として読み込めないファイルは `unreadable` に、構造に合わないファイルは `issues` に入れ、どちらも重ねずに残りのファイルを重ねる。呼ぶ側は、`unreadable` を今の「設定ファイルを読み込めない」誤り（CLI・MCP は終了コード 1）か帯の行に、`issues` の最初の 1 つを今の「設定の構造に合わない」誤り（`mdmark check` は `schema` のずれ）か帯のキーにする。ずれの種類は今の一覧のままで、追加しない
  - item: タイムアウト
    constraint: 制限なし（手元のファイルを読み込むだけ）
  - item: パスの表示
    constraint: 返却するパスは全て絶対パス。表示するときは、基準のフォルダ（CLI・MCP は `cwd`、VS Code 拡張機能は Markdown を含むワークスペースのフォルダ）の中ならそこからの相対パス、外なら `home` を `~` にしたパス（`home` の外は絶対パス）にする。この書き換えは同じモジュールの関数で行い、CLI のずれの `file`・誤りの文と VS Code 拡張機能の帯が使用する
flows:
  - name: 正常系
    summary: 端末の設定と上のフォルダの設定と近いフォルダの設定を重ね、相対パスを記載した設定ファイルから解決する
    setup:
      - name: 端末の設定
        description: '`MDMARK_CONFIG` で指す一時フォルダの `settings.yaml`。`config.cascade: true`・`features.callout: false`'
      - name: 重ねる設定を持つフォルダ
        description: '`/work/mdmark.config.yaml` に `theme: ./theme.css`・`features.table: true`、`/work/docs/mdmark.config.yaml` に `features.table: false`'
        notes: '`cwd` に `/work/docs`、`purpose` に `preview`'
      - name: Mock
        description: なし（一時フォルダの実ファイルを読み込む）
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        participant F as 設定ファイル
        C->>IF: cwd・purpose・env・home
        IF->>F: 端末の設定を読み込む
        IF->>F: /work/docs から上へ mdmark.config.yaml を探して読み込む
        IF->>IF: 相対パスを絶対パスにして、端末 → 上 → 近いの順に重ねる
        IF-->>C: config・files・nearest・issues
    expected:
      - '`config.features` が `{ callout: false, table: false }`'
      - '`config.theme` が `/work/theme.css`'
      - '`files` が端末の設定・`/work/mdmark.config.yaml`・`/work/docs/mdmark.config.yaml` の順'
      - '`nearest` が `/work/docs/mdmark.config.yaml` で、`issues` が空'
    test: test_normal
  - name: 正常系（最初の 1 つだけを読み込む）
    summary: '`config.cascade` が `false` のとき、近いフォルダの設定と端末の設定だけを重ねる'
    setup:
      - name: 端末の設定
        description: '正常系の端末の設定のうち `config.cascade: false`'
      - name: 重ねる設定を持つフォルダ
        description: 正常系と同じ
      - name: Mock
        description: なし
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        C->>IF: cwd・purpose・env・home
        IF->>IF: 端末の設定と最初に見つかった 1 つを重ねる
        IF-->>C: config・files
    expected:
      - '`config.theme` が無い'
      - '`files` が端末の設定と `/work/docs/mdmark.config.yaml` の 2 つ'
    test: test_normal_when_first_only
  - name: 正常系（書き出しに端末の設定を重ねない）
    summary: '`purpose` が `export` で `config.applyToExport` が `false` のとき、端末の設定を重ねない'
    setup:
      - name: 端末の設定
        description: '正常系の端末の設定に `config.applyToExport: false` を加えたもの'
        notes: '`purpose` に `export`'
      - name: 重ねる設定を持つフォルダ
        description: 正常系と同じ
      - name: Mock
        description: なし
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        C->>IF: purpose=export
        IF->>IF: 端末の設定を除いて上と近いを重ねる
        IF-->>C: config・files
    expected:
      - '`config.features` が `{ table: false }`（`callout` を持たない）'
      - '`files` に端末の設定が無い'
    test: test_normal_when_settings_not_applied_to_export
  - name: 正常系（端末の設定が無い）
    summary: 端末の設定のファイルが無いとき、フォルダの設定だけを重ねる
    setup:
      - name: 端末の設定
        description: '`MDMARK_CONFIG` が無いファイルを指す'
      - name: 重ねる設定を持つフォルダ
        description: 正常系と同じ
      - name: Mock
        description: なし
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        C->>IF: cwd・purpose・env・home
        IF->>IF: 端末の設定を空の設定として扱う
        IF-->>C: config・files
    expected:
      - '`files` が `/work/docs/mdmark.config.yaml` の 1 つ（`config.cascade` は既定の `false`）'
      - '`issues` が空'
    test: test_normal_when_settings_missing
  - name: 正常系（読み込めない設定ファイルがある）
    summary: YAML として読み込めない端末の設定を重ねずに、ずれとして返却する
    setup:
      - name: 端末の設定
        description: 正常系の端末の設定の 3 行目に閉じていない括弧を持つもの
      - name: 重ねる設定を持つフォルダ
        description: 正常系と同じ
      - name: Mock
        description: なし
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        C->>IF: cwd・purpose・env・home
        IF->>IF: 端末の設定を読み込めない
        IF-->>C: 端末の設定を除いた config・issues
    expected:
      - '`unreadable.path` が端末の設定の絶対パスで、`unreadable.line` が `3`、`issues` が空'
      - '`files` に端末の設定が無く、`config.features` が `{ table: false }`'
    test: test_normal_when_unreadable_file
  - name: 異常系（指定した設定ファイルが無い・ConfigNotFoundError）
    summary: '`explicit` のファイルが無いとき、パスを示す例外を投げる'
    setup:
      - name: 指定
        description: '`explicit` に無いファイル `missing.yaml`'
      - name: Mock
        description: なし
    flow: |-
      sequenceDiagram
        participant C as 呼ぶ側
        participant IF as loadLayeredConfig
        C->>IF: explicit=missing.yaml
        IF-->>C: ConfigNotFoundError
    expected:
      - '`ConfigNotFoundError` の文に `missing.yaml` が入る'
    test: test_error_when_explicit_missing
