title: "コメントを付ける"
entry:
  kind: operation
  value: '`mountComments(el, opts)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 利用側の要素の中の文字を選んでコメントを保存し、マーカーを付け、片付ける
    setup:
      - name: 配布物を読み込んだページ
        description: ビルドした `dist/index.js` と `dist/index.css` を読み込み、`導入の手順を整える。` の段落を持つ要素と、その外の段落を 1 つずつ持つページ
      - name: コメントの読み込みと保存の関数
        description: '`load` は空の配列、`save` は受けた下書きに `id: "c1"` を追加して返却する。受けた引数を記録する'
        notes: '`docId` は `panel-setup`。コメントの本文は `手順の数を <b>3</b> にする`'
      - name: Mock
        description: 読み込みと保存の関数はページの中のメモリーで返却する。外の依存は無い
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant S as 読み込みと保存の関数
        P->>M: mountComments(el, { store, docId })
        M->>S: load({ docId })
        S-->>M: []
        M-->>P: { destroy }
        P->>M: 「導入の手順」を選び、コメントを記載して保存する
        M->>S: save({ docId, comment })
        S-->>M: id を持つコメント
        M->>P: 選んだ文字にマーカーを付ける
        P->>M: destroy()
        M->>P: マーカーを削除する
    expected:
      - '`load` が `{ docId: "panel-setup" }` で 1 回呼ばれる'
      - 要素の外の段落の文字を選んでもコメントのボタンが出ない
      - '`save` が `{ docId: "panel-setup", comment: { quote: "導入の手順", prefix: "", suffix: "を整える。", body: "手順の数を <b>3</b> にする" } }` で 1 回呼ばれる'
      - '`導入の手順` が class `mdmark-comment-mark` のマーカーで包まれ、マーカーから開いた吹き出しの本文に `b` 要素が無い'
      - '`destroy` の後、マーカーが無く、`el` の文字が `導入の手順を整える。` のままで、文字を選んでもボタンが出ない'
    test: test_normal
  - name: 正常系（保存したコメントを読み込む）
    summary: '`load` が返却したコメントの箇所に、呼んだ時点でマーカーを付ける'
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: コメントの読み込みと保存の関数
        description: '`load` が `quote` が `導入の手順` のコメント 1 件と、`quote` が `無い文字` のコメント 1 件を返却する'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant S as 読み込みと保存の関数
        P->>M: mountComments(el, { store, docId })
        M->>S: load({ docId })
        S-->>M: コメント 2 件
        M->>P: 箇所が見つかったコメントにマーカーを付ける
    expected:
      - 解決した時点で `導入の手順` にマーカーが付いている
      - '`無い文字` のコメントはマーカーを持たず、`el` の末尾の `箇所が見つからないコメント` の一覧に出る'
    test: test_normal_when_loaded
  - name: 異常系（保存できない）
    summary: '`save` が reject すると、入力欄と本文を残して通知を出し、マーカーを付けない'
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 保存できない読み込みと保存の関数
        description: '`load` は空の配列、`save` は `Error("network")` で reject する'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant S as 読み込みと保存の関数
        P->>M: 文字を選び、コメントを記載して保存する
        M->>S: save({ docId, comment })
        S-->>M: reject
        M->>P: 入力欄に通知を出す
    expected:
      - 入力欄が開いたままで、記載した本文が残っている
      - 入力欄のそばに `role="alert"` の通知がある
      - 選んだ文字にマーカーが無い
      - '`console.error` が 1 回呼ばれ、引数に `save`・`panel-setup`・元のエラーを含む'
    test: test_error_when_save_rejected
  - name: 異常系（読み込めない）
    summary: '`load` が reject すると、マーカーを付けずに解決し、新しいコメントは付けられる'
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 読み込めない読み込みと保存の関数
        description: '`load` が `Error("network")` で reject し、`save` は正常系と同じ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        participant S as 読み込みと保存の関数
        P->>M: mountComments(el, { store, docId })
        M->>S: load({ docId })
        S-->>M: reject
        M-->>P: { destroy }
    expected:
      - 戻り値の Promise が `{ destroy }` で解決し、マーカーが無い
      - '`console.error` が 1 回呼ばれ、引数に `load`・`panel-setup`・元のエラーを含む'
      - 文字を選ぶとコメントのボタンが出て、保存できる
    test: test_error_when_load_rejected
  - name: 異常系（引数の誤り・TypeError）
    summary: '`store` が `save` を持たないときと `docId` が空のときに、`el` を書き換えずに TypeError を投げる'
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: 誤った引数
        description: '`store` に `load` だけを持つオブジェクトを指定するものと、`docId` に空の文字列を指定するものの 2 通り'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mountComments(el, 誤った引数)
        M-->>P: TypeError
    expected:
      - 2 通りとも `mountComments` が同期で `TypeError` を投げ、メッセージに `store`、`docId` を含む
      - '`load` が呼ばれず、`el` の中身が変わらない'
    test: test_error_when_arguments_invalid
  - name: 異常系（部品のモジュールを読み込めない）
    summary: コメントの部品のモジュールを読み込めないと、`el` を書き換えずに reject する
    setup:
      - name: 配布物を読み込んだページ
        description: 正常系と同じ
      - name: コメントの読み込みと保存の関数
        description: 正常系と同じ
      - name: Mock
        description: コメントの部品のモジュールの要求を、配信で 404 に差し替える
        notes: 部品のモジュールを別の配布ファイルに分けないと決まったら、このフローはモジュール構成設計で削除する
    flow: |-
      sequenceDiagram
        participant P as 利用側のページ
        participant M as mdmark
        P->>M: mountComments(el, { store, docId })
        M->>M: 部品のモジュールを読み込めない
        M-->>P: reject
    expected:
      - 戻り値の Promise が読み込みのエラーで reject する
      - '`load` が呼ばれず、`el` の中身が変わらない'
      - 文字を選んでもコメントのボタンが出ない
    test: test_error_when_module_unavailable
lead: 利用側のページが、自分で記載した要素とコメントの読み込みと保存の関数を指定し、要素の中の選んだ箇所にコメントを付けられるようにする。文書のコメントと同じ外観と操作になる。
idempotent: false
side_effects: '`opts.store.load` を 1 回呼び、読み込んだコメントの箇所をマーカーの要素で包む（`el` の文字は変えない）。`document` の `selectionchange` を受け取り、コメントのボタン・入力欄・吹き出しを `document.body` に配置する。保存で `opts.store.save`、`opts.store` が持つときは吹き出しの修正で `opts.store.update`・削除で `opts.store.remove` を呼ぶ'
callers:
  - dev/設計書/シナリオ/単一ユースケース/部品をJavaScriptから使う#
exclusivity: 同じ要素へ 2 回目の `mountComments` を呼ぶと、前の `mountComments` の `destroy` を先に行う。保存を待つ間に `destroy` を呼ぶと、保存の結果でマーカーを付けない
request:
  - name: el
    type: HTMLElement
    required: true
    location: argument
    description: コメントを付けられる範囲の要素。中の文字を選ぶとコメントのボタンを出す
  - name: opts.store
    type: MdmarkCommentStore
    required: true
    location: argument
    description: コメントの読み込みと保存の関数
    notes: 構造はインターフェース定義『文書を描く』の制約の「コメントの読み込みと保存の関数」
  - name: opts.docId
    type: string
    required: true
    location: argument
    description: 読み込みと保存の関数に指定する、コメントを付ける対象の ID
    constraints: 空でない文字列
    example: panel-setup
response:
  - name: (Promise の値).destroy
    type: () => void
    description: マーカーを削除して `el` の文字を呼ぶ前の並びに戻し、コメントのボタン・入力欄・吹き出しと `document` の受け取りを解除する
    notes: 2 回目以降は何もしない
response_notes: 戻り値は `Promise<{ destroy }>`。`load` の結果でマーカーを付けてから解決する。引数の誤りは Promise を返却せずに同期で TypeError を投げる
exceptions:
  - name: なし（正常終了）
    condition: 読み込んだコメントにマーカーを付け、`{ destroy }` で解決する
  - name: TypeError
    condition: '`el` が HTMLElement でない、`opts.store` が `load`・`save` の関数を持たないか `update`・`remove` を関数でない値で持つ、`opts.docId` が空か文字列でない'
    notes: 同期で投げ、`el` を書き換えない。メッセージに誤った引数の名前を含める
  - name: なし（読み込めない）
    condition: '`load` が reject するか、返却した値がコメントの構造に合わない'
    notes: 例外を投げず、マーカーを付けずに解決する。新しいコメントは付けられる。`load`・`docId`・元のエラーか合わなかった値を `console.error` に出す
  - name: なし（保存できない）
    condition: '`save` が reject するか、返却した値がコメントの構造に合わない'
    notes: 例外を投げず、入力欄に記載した本文を残して通知を出し、マーカーを付けない。`save`・`docId`・元のエラーを `console.error` に出す
  - name: なし（修正・削除できない）
    condition: '`update`・`remove` が reject する'
    notes: インターフェース定義『文書を描く』の例外の「なし（コメントを修正・削除できない）」と同じ
  - name: なし（読み込みの失敗）
    condition: コメントの部品のモジュールを読み込めない
    notes: '`el` を書き換えず、`load` を呼ばずに、Promise を元のエラーで reject する'
constraints:
  - item: コメントの操作
    constraint: インターフェース定義『文書を描く』の制約の「コメントの操作」「コメントの箇所」「コメントの修正と削除」と同じ要素と操作にする。範囲は `el` の中
    notes: dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts
  - item: 部品のモジュールの読み込み
    constraint: コメントの部品のモジュールは、初めて `mountComments` を呼んだときか、`mount` でコメントの機能がオンになったときに 1 回だけ読み込む
    notes: モジュールは `dist/index.js` の隣の `dist/comments.js`（モジュール構成『ビューとコメント』）。読み込めないときは例外の「なし（読み込みの失敗）」
  - item: 型の配布
    constraint: '`mountComments`・`MdmarkCommentStore`（省略可能な `update`・`remove` を含む）・`MdmarkComment`・`MdmarkCommentDraft`・`MdmarkCommentsHandle` を `dist/index.d.ts` に書き出す'
test_file: tests/integration/lib/mount-comments.browser.test.ts
