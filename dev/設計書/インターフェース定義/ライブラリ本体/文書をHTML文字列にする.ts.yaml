lead: 使う側（書き出し・ビルドの処理やサーバー）が、画面を持たずに Markdown を HTML 文字列にする。`mount` が描く本文と同じ文字列を、ブラウザでも Node でも返す。
idempotent: true
side_effects: なし（外部ライブラリも読まない）
callers:
  - dev/設計書/シナリオ/単一ユースケース/文書をHTML文字列にする#
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#
request:
  - name: markdown
    type: string
    required: true
    location: argument
    description: HTML にする Markdown
  - name: opts.config
    type: MdmarkConfig
    required: false
    default: なし（全てのキーに既定を当てる）
    location: argument
    description: '`mount` の `opts.config` と同じ。この操作が読むのは `features`（記法の機能のオン・オフ）・`libraries` の名前（どの印を印の場所の要素にするか）・`labels.paramCopy`（操作できる部品の今の値をコピーするボタンの文言。既定の当て方は `mount` と同じ）だけ'
  - name: opts.index
    type: MdmarkIndex
    required: false
    default: なし
    location: argument
    description: '`mount` の `opts.index` と同じ'
  - name: opts.docId
    type: string
    required: false
    default: なし
    location: argument
    description: '`mount` の `opts.docId` と同じ'
  - name: opts.references
    type: MdmarkReferences
    required: false
    default: なし
    location: argument
    description: '`mount` の `opts.references` と同じ'
  - name: opts.aliases
    type: MdmarkAlias[]
    required: false
    default: なし
    location: argument
    description: '`mount` の `opts.aliases` と同じ'
    status: planned
response:
  - name: '-'
    type: string
    description: 本文の HTML 文字列。描く先の要素は含まない。使う側が class `mdmark` の要素の中に置くと mdmark の CSS が当たる
response_notes: 同じ `markdown` と `opts` には、ブラウザでも Node でも同じ文字列を返す。
exceptions:
  - name: なし（正常終了）
    condition: 常に HTML 文字列を返す。未知の印と許可していない要素・属性は落とす
constraints:
  - item: 印の書式
    constraint: '1 か所に付ける印は `<!-- {名前}: {引数} -->`、範囲を持つ印は `<!-- {名前}: {引数} -->` 〜 `<!-- /{名前} -->`。引数の無い印は `<!-- {名前} -->` と書ける。名前は英小文字で始まり、英小文字・数字・`-` だけを持つ。引数は空白で区切り、種類・`+機能`・`-機能`・`キー=値`・`closed`・`open` に読み分ける。コードブロックと行内のコードの中は印として扱わない'
  - item: 印の扱い
    constraint: '`features` の印は機能のオン・オフとして拾う。記法の印（`table`・`tabs`・`steps`・`section`・`row-detail`・`fig`・`toc`・`html`・`code`）と図の部品の印（`flow`・`sequence`・`chart`・`param`）は、その記法の機能がオンなら記法にし、オフなら印だけを取り除いて囲んだ Markdown を普通の Markdown として描く。対応表にある名前と、`registerExtension` で登録した拡張の `directive` の印は、印の場所の要素に置き換える。図の部品の印と同じ名前の拡張が登録されているときは、拡張を優先する（設定の `libraries` と同じ決まり）。それ以外は取り除く。どの印も出力にコメントとして残さない'
  - item: 印の場所の要素
    constraint: '`<div class="mdmark-embed" data-mdmark-slot="{名前}" data-mdmark-args="{引数}" role="status">図を読み込んでいます</div>`。登録した拡張の印も同じ要素にする。`render` は拡張の `load` も `schema` の検査も呼ばない'
  - item: 残す要素・属性
    constraint: 'sanitize-html の既定の要素に `img`・`del`・`details`・`summary`・`input` と、記法が使う `nav`・`figure`・`figcaption` を足す。文書に書いた `input` は `transformTags` で常に `type="checkbox"` と `disabled` を付け直し、元の属性からは `checked` だけを引き継ぐ。文書に書いた生の HTML の class は `language-*`・`mdmark-align-*`・`task-list-item`・`mdmark-embed` だけを残す。記法の class（`mdmark-` で始まる記法のものと `markdown-alert*`、図のツールチップを持つ要素の `has-tip`）・`data-*`・`id` は、mdmark が記法から出した要素だけが持つ（埋め込んだ HTML の中の `data-hint` は制約の「ヒント」のとおり残す）。`style` 属性は残さず（埋め込んだ HTML の中は制約の「埋め込んだ HTML」のとおり）、図の部品が出した要素の位置と大きさ（`left`・`top`・`width`・`height` の px）と拡大の倍率（`transform: scale()`）、行番号を持つコードブロックの `code` の桁の数（`--mdmark-code-digits`）だけを残す。`pre` と `table` には、描くときに `tabindex="0"` と読み上げの名前（`aria-label`。書き方は画面設計『文書』）を付ける（Markdown の表とコードブロックが対象。文書に生の HTML で書いた `pre`・`table` は、書いた `aria-label` を残し、`tabindex` は `0` にする）。文書に書いた `svg`・`button`・`output`・`label` は残さない。図の部品が定義から出した要素だけに、`svg` とその中の `defs`・`marker`・`pattern`・`g`・`path`・`rect`・`circle`・`ellipse`・`line`・`polyline`・`polygon`・`text`、`button`・`output`・`label`・`input type="range"`、属性の `role`・`hidden`・`tabindex`・`aria-describedby`・`aria-label`・`aria-labelledby`・`aria-hidden`・`type`・`min`・`max`・`step`・`value`・`for` と svg の描画の属性（`d`・`viewBox`・`marker-end`・塗りの模様の `patternUnits` など。一覧はモジュール構成設計）を許し、記法の class・`data-*` と同じ見分けで出力の全体を sanitize-html に通す（記法のアイコンは CSS で付ける）'
    notes: dev/設計書/外部ライブラリ/sanitize-html
  - item: URL のスキーム
    constraint: '`href`・`src` は `http`・`https`・`mailto` と相対 URL だけを残す'
  - item: 列の揃え
    constraint: 表の列の揃えは `text-align` の値（`left`・`center`・`right`）だけを class `mdmark-align-{値}` に移す
  - item: 表のセルの列名
    constraint: '`td` に、同じ列の見出しの文字（タグを除いたもの）を `data-label` で写す'
    notes: '狭い紙幅の印刷で、表を行ごとの「列名: 値」の並びに積むため（確認ログの決定）'
  - item: 入力の大きさ
    constraint: 制限なし
  - item: 表
    constraint: 表の印で囲んだ表と、囲まない表を `<div class="mdmark-table" data-kind="{種類}" data-features="{機能}">` で囲む。種類は `default`（囲まない表と、知らない種類）・`data`・`plain`。機能は種類の機能（`default` は `pin`、`data` は `sort`・`pin`・`filter`、`plain` は無し）に `+機能`・`-機能` を当てたものを空白で並べる。`filter=列名:種類,…` は、見出しの文字が列名と一致する列の位置（0 から）と種類を `data-filter="{位置}:{種類} …"` に写す。種類は `select`（省いたとき）・`text`・`date`。`closed`・`open` は表を `<details class="mdmark-table-details">` と `<summary>表を開く</summary>` に入れ、`open` は `details` に `open` を付ける。`+機能` で足せる機能に `count`・`columns`・`total`・`copy`・`rowlink` があり、どの種類の既定にも入らない。`columns` の表の `hide=列名,…` は、先頭を除く列の位置を `data-hide="{位置} …"` に写す。`total` の表の `total=列名:計算,…` は、列の位置と計算（`sum`・`avg`・`count`）を `data-total="{位置}:{計算} …"` に写す。並べ替え・ピン止め・絞り込みのボタンと、表の上の件数・列の表示・コピーの帯、集計の行は `mount` が付ける
  - item: 注意書き
    constraint: 1 行目が `[!NOTE]`・`[!TIP]`・`[!IMPORTANT]`・`[!WARNING]`・`[!CAUTION]` の引用を、`<div class="markdown-alert markdown-alert-{種類の小文字}">` と題 `<p class="markdown-alert-title">{補足・ヒント・重要・警告・注意}</p>` にし、種類の文字を本文から外す。末尾に `-` を付けた種類は `<details class="markdown-alert markdown-alert-{種類}">` と `<summary class="markdown-alert-title">` にする。知らない種類は `note` として出す
  - item: タブ
    constraint: '`<!-- tabs -->` の範囲を `<div class="mdmark-tabs">` で囲み、範囲で最初に出る見出しの階層で区切った中身ごとに `<div class="mdmark-tab-panel">` に入れる。区切りの見出しは `<p class="mdmark-tab-title">{見出しの文字}</p>` に替え、本文の見出しとして残さない。全ての中身を隠さずに出す（タブの並びと切り替えは `mount` が付ける）。`<!-- tabs: group=名前 -->` の範囲は `<div class="mdmark-tabs" data-group="{名前}">` にし、組は写すだけで選択は持たない'
  - item: ステップ・ファイルツリー・バッジ
    constraint: '`<!-- steps -->` の範囲の番号付きリストの `ol` に class `mdmark-steps` を付ける。言語 `tree` のコードブロックを `<ul class="mdmark-tree" aria-label="ファイルツリー">` の入れ子にし、項目を `<li class="mdmark-tree-folder">`（名前が `/` で終わるか子を持つ）・`<li class="mdmark-tree-file">` と `<span class="mdmark-tree-name">` にする。頭が `badge:` の行内のコードを `<span class="mdmark-badge">{頭を外した文言}</span>` にし、`badge\:` の行内のコードは `\` を外した `<code>` にする。`badge:` の後ろが空か空白だけの行内のコードはバッジにせず、`<code>` のまま出す'
  - item: 見出しの ID とアンカー
    constraint: 全ての見出しに GitHub と同じ規則の `id` を付ける（小文字にし、英数字・`-`・`_`・空白と英字以外の文字のほかを落とし、空白を `-` にする。同じ ID の 2 つ目から `-1`・`-2` を付ける）。見出しの ID は機能に関わらず付ける。`anchors` がオンのとき、見出しの中に `<a class="mdmark-anchor" href="#{ID}" aria-label="「{見出しの文字}」へのリンク">` を足す
  - item: 目次
    constraint: '`<!-- toc -->` の場所に `<nav class="mdmark-toc" aria-label="目次">` と題 `<p class="mdmark-toc-title">目次</p>` を置き、文書の h2〜h3 を階層どおりに入れ子にした `ul` の、各見出しの `#{ID}` へのリンクを並べる'
  - item: 節
    constraint: '`sections` がオンのとき、h1〜h4 の見出しに class `mdmark-heading` を付け、見出しの後ろから次の同じか上の階層の見出しの前までを `<div class="mdmark-section-body" id="section-{見出しの ID}" data-section="{open か closed}">` で囲む。見出しの直後の `<!-- section: closed -->` は `closed`、それ以外は `open`。中身は隠さずに出す（開閉は `mount` が付ける）'
  - item: 行の詳細
    constraint: '表の直後の `<!-- row-detail: {行の位置} -->` 〜 `<!-- /row-detail -->` の中身を、表の行の位置（見出し行を除いて 1 から）の行の直後に `<tr class="mdmark-row-detail" data-row="{行の位置}"><td colspan="{列の数}">…</td></tr>` で入れる。中身は隠さずに出す（開閉は `mount` が付ける）'
  - item: 図と表の番号
    constraint: '`<!-- fig: {ID} -->` の直後の画像の段落と表を `<figure class="mdmark-figure" id="fig-{ID}">` に入れ、文書の頭から種類ごとに数えた番号を付ける。画像は下に `<figcaption class="mdmark-figure-caption"><b>図 {番号}</b>{画像の title}</figcaption>`、表は上に `<figcaption class="mdmark-figure-caption"><b>表 {番号}</b></figcaption>` を置く。本文の `#fig-{ID}` へのリンクの文字を、その図表の `図 {番号}`・`表 {番号}` に替える'
  - item: 書き手の誤り
    constraint: 記法の印の知らない種類・`+機能`・`-機能`・キー・値（表に無い列名・知らない絞り込みの種類・知らない集計の計算・`hide=` の先頭の列、`+total` の無い表の `total=`・`+columns` の無い表の `hide=` を含む）、閉じの印の無い範囲（印から文書の終わりまでを範囲にする）、見出しの無いタブの範囲、タブの印の値の無い `group=`・`group=` 以外のキー・`キー=値` の形でない指定（値の無い `group=` は組を持たないタブにする）、番号付きリストの無いステップの範囲、表に無い行を指す行の詳細、切れた図表の参照、重なった図表の ID、読めない行を持つファイルツリー、コードブロックの印の知らないキー・読めない `highlight=` の番号・コードブロックに無い行の番号、直後にコードブロックの無いコードブロックの印、知らないコードの行の印（`[!code focus]` など。その行には当てず、書いた文字のまま出す）、`total` の表の `sum`・`avg` の列にある空でなく数として読めないセル（読み方は dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts の制約『表の操作』。その列のその集計のセルは `mount` が空にする）では、読めた指定だけを当てて描き、その箇所の前に `<div class="mdmark-syntax-warning" role="note">` と題 `<p class="mdmark-syntax-warning-title">書き方の警告</p>` と、読めない指定と直し方の本文を置く。`features` の印の知らない機能名は今のとおり知らせずに無視する
    notes: 本文の文言は画面設計『文書』
  - item: 図の部品
    constraint: '`<!-- flow -->`・`<!-- sequence -->`・`<!-- chart -->`・`<!-- param -->` 〜 閉じの印の範囲にある言語 `json` のコードブロック 1 つを部品の定義として読み、形（`dist/index.d.ts` の `MdmarkFlowDefinition`・`MdmarkSequenceDefinition`・`MdmarkChartDefinition`・`MdmarkParamDefinition`）を確かめて、`<figure class="mdmark-diagram" data-diagram="{種類}">` に題（題名・範囲・更新日）・図・凡例をこの順に描く（`param` は `div.mdmark-param` に描き、中のグラフを `data-diagram="chart"` の図の枠にする）。範囲の中のコードブロック以外の Markdown と定義の JSON は出力に残さない。定義の文字（箱の名前・補足・線のラベル・ツールチップの中身）は文字として出し、`{{語}}` はその語を用語の照合に回す。ツールチップの中身は `role="tooltip"` と `hidden` を持つ要素で図の中に置き、拡大・縮小・移動・全画面のボタンと操作は `mount` が付ける。グラフの定義の `type` は `line`（省いたとき）・`bar`・`pie`・`scatter` で、棒と円は系列を色と塗りの模様の組、散布図は色と点の形の組で描き分け、円は扇形の外に割合（整数の %）、凡例に項目の名前と値を出す。縦の軸の範囲を省いたときは、データの最小と最大を含む 1・2・5×10 のべき乗の刻みで切る'
    notes: 定義の形の項目はモジュール構成設計で型に書く。見本は `dev/mock/refs/42/assets/samples.js`
  - item: 図の見た目の決まり
    constraint: フロー図は定義の座標のとおりに箱と線を置き、自動配置はしない。`frame` をシステムの枠、`lanes` を枠の中の層（層の箱の色をうっすら敷く）にする。線の種類（`flow`・`read`・`write`・`reply`・`loop`）は色と模様（破線の間隔・太さ・矢じり）の組で描き分ける。横の線が縦の線と交わる点は横の線に飛び越えの弧（line jump）を入れ、同じ向きで重なる線はずらす。シーケンス図は相手を定義の順に左から右へ、メッセージを時刻の順に上から下へ並べ、`loop` は右の帯を通る破線と戻り先のラベルにする。グラフは系列を色と線の模様と点の形の組で描き分ける。凡例には定義に出る箱の種類・線の種類・系列だけを載せ、枠・層・交差・ツールチップの印・用語の下線は図にあるときだけ載せる
    notes: 色と模様の値はデザイン方針と CSS 変数（モジュール構成設計）
  - item: 操作できる部品
    constraint: '`param` は題・スライダー（`input type="range"`。`min`・`max`・`step` と既定の値を定義から写す）と今の値の `output`・今の値を写すボタン・既定の値の系列で描いたグラフを出す。グラフの系列は、定義の `table`（スライダーの値ごとの点の並び）から引く。値を変えて描き直す操作と写す操作は `mount` が付ける'
    notes: 文書に式やスクリプトを書かせない（D-22）ため、計算した点を定義に持たせる
  - item: 図の定義の誤り
    constraint: 図の部品の範囲に `json` のコードブロックが無いか 2 つ以上ある、JSON として読めない、または形に合わないときは、その図だけを描かず、その場所に書き方の警告を置く。警告は図の種類の名前を主語にし、JSON として読めないときは行と読めた最後の部分と足りない記号、形に合わないときは読めない箇所と直し方を文で書く。線の端が無い箱の `id` を指す・`id` が重なる・系列の点の数が横の目盛りの数と合わないのも形の誤りにする。ほかの図と本文は描く
    notes: 本文の文言は画面設計『文書』
  - item: 拡張の印の定義
    constraint: 登録した拡張の印を範囲で書き、範囲に `json` のコードブロックを置いたときも、印の場所の要素だけを出し、範囲の中身と定義の JSON は出力に残さない。登録していない印の範囲のうち、中身が `json` のコードブロックだけのものは中身ごと取り除く（それ以外の範囲は今のとおり印だけを取り除く）
    notes: 定義を `draw` へ渡すのは `mount`（インターフェース定義『拡張を登録する』）
  - item: 埋め込んだ HTML
    constraint: '`html` がオンのとき、`<!-- html -->` 〜 `<!-- /html -->` の範囲にある言語 `html` のコードブロック 1 つの中身を、コードでなく生の HTML として `<div class="mdmark-html">` の中に描く。範囲の中のコードブロック以外の Markdown は出力に残さない。中身は文書に書いた生の HTML と同じ許可の検査（制約の「残す要素・属性」「URL のスキーム」）を通し、`script` 要素・`on` で始まる属性・`javascript:` の URL を落とす。埋め込んだ HTML の中に限り `button` を残し、`type` を `button` に固定して `form` で始まる属性を落とす（押しても何も起きない）。中身の要素の `style` 属性は、レイアウト・余白・枠・色・文字の宣言（`display`・`flex*`・`align-items`・`align-self`・`justify-content`・`grid*`・`gap`・`row-gap`・`column-gap`・`margin*`・`padding*`・`border*`・`width`・`max-width`・`min-width`・`height`・`color`・`background-color`・`font-size`・`font-weight`・`text-align`）だけを残し、`url(` を含む値・単位 `vw`・`vh` を含む値・負の `margin`・`padding` と `position` を落とす。列より広い HTML は `mount` が中で横にスクロールさせる。範囲の外の `html` のコードブロックは今のとおりコードとして出す。`html` がオフのときは印だけを取り除き、コードブロックをコードとして出す'
    notes: '`style` の残し方は #6 の確認ログの決定。宣言の一覧はモジュール構成『描画』の `EMBED_STYLES`。`button` を残すのはシナリオ『コードブロックのHTMLを描く』とモックに合わせるため'
  - item: 埋め込んだ HTML の中の図の部品
    constraint: 埋め込んだ HTML の中の custom element `<mdmark-flow>`・`<mdmark-sequence>`・`<mdmark-chart>`・`<mdmark-param>` の中身の文字を、同じ名前の図の部品の印の範囲の `json` のコードブロックと同じ定義として読み、制約の「図の部品」と同じ図に置き換える。読めない定義は制約の「図の定義の誤り」と同じく、その要素の場所を書き方の警告にする。`diagrams` がオフのときは要素を中身ごと落とす。custom element の属性は読まない。埋め込んだ HTML の中の文字は用語の照合に回す
    notes: 文書に式やスクリプトを書かせない（D-22）
  - item: ヒント
    constraint: '`hints` がオンのとき、埋め込んだ HTML の中の `data-hint` を持つ要素と、図の部品の定義の `hint` を持つ箱に、ツールチップの中身を `<span class="mdmark-hint-tip" role="tooltip" id="mdmark-hint-{n}" hidden>` で置く（`{n}` は文書の頭からの通し番号）。`data-hint` の要素は、行内の要素（`span`・`a`・`abbr`・`b`・`strong`・`em`・`i`・`code`・`small`・`mark`・`sub`・`sup`・`time`・`kbd`・`q`・`s`・`u`）なら class `mdmark-hint-inline`・`tabindex="0"`・`aria-describedby` を付け、それ以外のブロックの要素は class `mdmark-hint-block` を付けて最後の子に `<button type="button" class="mdmark-hint-mark" aria-label="説明" aria-describedby="mdmark-hint-{n}">` を足す。`hint` を持つ箱は `io` を持つ箱と同じ右上の印を持ち、`io` と `hint` を両方持つ箱は 1 つの印に入力・処理・出力と `hint` をこの順に出す。`hints` がオフのときは、`data-hint` の属性・`hint`・`io`・線の `tip` のツールチップの中身と印を出さない（線のラベルと箱の名前は出す）。`data-hint` の値は Markdown として解析せず、文字として出す'
    notes: 印のアイコンは CSS で付ける。開く操作は `mount`
  - item: 表の行の ID とリンク
    constraint: '`rowlink` の表の本文の各行に、先頭のセルの文字（タグを除いたもの）から見出しの ID と同じ規則で作った `id` を付ける。見出しの ID を先に決め、行の ID が文書の中の見出し・前の行の ID と重なれば `-1`・`-2` を付ける。先頭のセルの文字から ID が作れないときは `row` を元にする。先頭のセルの中身の後ろに `<a class="mdmark-row-anchor" href="#{ID}" aria-label="「{先頭のセルの文字}」の行へのリンク">` を置く'
    notes: ID の作り方は確認ログの決定（行を足しても、前に共有したリンクが同じ行を指す）
  - item: ビューの印
    constraint: '`<!-- view: 引数 -->` 〜 `<!-- /view -->` の範囲を class `mdmark-view` の `div` にし、印の引数を読んだ指定を `data-view` に JSON（`group` は分ける列の位置か `null`、`mode` は `board`・`table`、`boardDisabled` は `group=` の列が表に無いときの書き方の警告の `id` か空、`icons` は読めた `icons=` の対応）で持たせ、中に範囲の表を記法の表と同じ形（`filter=` は表の `data-filter`）で残す。ボードと切り替えは `mount` が作るため、`render` の出力だけを読む表示では表のまま読める。書き方の誤りは書き方の警告にし、`views` がオフのときは `mdmark-view` を作らず表だけを出す'
    notes: 引数と警告の種類はインターフェース定義『文書を描く』の制約の「ビューの印」
  - item: コードブロック
    constraint: 'コードブロックの情報文字列の最初の語を最初の `:` で分け、前を言語、後ろをファイル名として読み、`code` の class を `language-{言語}` にする（`code` のオン・オフによらない。`:` の前が空のときは言語もファイル名も持たないものとして扱う）。言語 `tree`・図の部品の範囲の `json`・埋め込んだ HTML の範囲の `html` は、最初の語がその言語とちょうど一致するときだけ当て、`:ファイル名` を付けたものは普通のコードブロックとして描く（埋め込んだ HTML の範囲では、`html` のコードブロックが無いときの警告を置く）。`code` がオンのとき、コードブロックの直前の `<!-- code: {引数} -->` を次のコードブロックへの指定として読む。引数は `title=題`（題。印の引数は空白で区切るため題に空白は書けず、空白の後ろは別の引数として読む）・`lines`（行番号）・`highlight=行,…`（強調する行。`2`・`4-6` を `,` で並べる）。コードブロックの行末の行コメントの `[!code ++]`・`[!code --]`・`[!code highlight]` を行の種類（`add`・`del`・`highlight`）として読んで印を外し、行コメントが印だけなら印の直前の行コメントの頭（`//`・`#`・`--`・`;`・`<!--` 〜 `-->`・`/*` 〜 `*/`）も外し、外した後の行末の空白も外す。`[\!code …]` は `\` を外した文字のまま出す。行番号・強調・行の種類のどれかを持つコードブロックは、`pre` に class `mdmark-code-lines`（行番号を持てば `mdmark-code-numbered`、`add`・`del` の行を持てば `mdmark-code-signs` も）を付け、`code` の中身を行ごとに `<span class="mdmark-code-line" data-line="{行番号}" data-kind="{種類}"><span class="mdmark-code-text">{行の文字}</span></span>` に分けて改行でつなぐ（`data-line` は行番号を持つときだけ、`data-kind` は種類を持つ行だけ）。行番号を持つときは `code` の `style` に `--mdmark-code-digits: {行の数の桁の数}` を置く。コードブロックを `<div class="mdmark-code">`（題を持てば `<figure class="mdmark-code">`）で囲み、`pre` の前にラベルの帯 `<div class="mdmark-code-bar">`（題を持てば `<figcaption class="mdmark-code-title mdmark-code-bar">`）を置く。帯の左端には、言語を持つとき `<span class="mdmark-code-lang"><span class="mdmark-code-lang-name" aria-hidden="true">{言語}</span><span class="mdmark-code-file">{ファイル名}</span></span>`（`mdmark-code-file` はファイル名を持つときだけ）を置き、題を持つときはその後ろに題の文字を置く。`pre` の読み上げの名前は、題を持てば `コード: {題}`、ファイル名を持てば `コード: {ファイル名}`、言語を持てば `コード: {言語}`、どれも無ければ `コード` にする。コピーのボタンは `mount` が帯の右端に付ける。行番号と行頭の `+`・`-` は HTML の文字に入れない（CSS の擬似要素で出し、選んで写す中身に入らない）。言語 `tree` のコードブロックと、図の部品・埋め込んだ HTML の範囲のコードブロックには当てない。印も行の印も持たないコードブロックは、帯で囲むほかは今のとおり描く。`code` がオフのときは印を取り除き、コードブロックを今のとおり描く（行の印は書いた文字のまま出す）'
    notes: 見た目はモック `dev/mock/components/code-block/`。題の前のファイルのアイコンは CSS で付ける。`mdmark-code-text` の中身は、`mount` が描いた後に色分けした HTML に置き換える（制約『コードブロックの色分け』）
  - item: 元の行番号
    constraint: 本文のブロック（見出し・段落・リスト・リストの項目・表・表の行・コードブロック・引用・水平線・注意書き・印の範囲を囲む要素）の開始の要素に、そのブロックが Markdown で始まる行の番号を `data-source-line` で出す。番号は 0 始まり（Markdown の 1 行目が `0`）。入れ子のブロックはそれぞれの開始の行を持つ。sanitize は `data-source-line` を全ての要素で残す
    notes: 番号は markdown-it のトークンの `map` の開始の行で、VS Code のエディタの行番号（0 始まり）とそのまま比べられる。コードブロックの行の `data-line`（コードの中の 1 始まりの行番号）・図の線の `data-line`（線の種類）とは別の属性にする
  - item: コードブロックの色分け
    constraint: '`render` は色分けせず、色分けのライブラリを読まない（返す HTML に `hljs-*` の class を入れない）。色分けは `mount` が描いた後に、色分けの対象の `code` に `render` が付ける属性 `data-mdmark-syntax="{言語のモジュール名}"`（言語は制約『コードブロック』の `:` の前）を手掛かりに行う（文書に書いた生の HTML のこの属性は sanitize が落とす）。機能 `syntax` は機能のオン・オフの一つとして文書の `<!-- features: -syntax -->` を受け、返す `features` に含める'
    notes: '`render` を同期のまま保ち、外部ライブラリの印を `mount` だけが描く今の役割分担と揃える（要件.md の推奨案 A）。色分けの中身は dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts の制約『色分けの対象』〜『色分けを読めないとき』'
