exceptions:
  - name: なし（正常終了）
    condition: 文書ごとの一致と、まとめた参照先を返す
  - name: なし（Schema に合わない索引）
    condition: 索引の文書・用語の項目が Schema に合わない
    notes: 例外を投げず、合わない項目を除いて照合する。合わないことを知るには `checkIndex` を呼ぶ
constraints:
  - item: 実行する環境
    constraint: Node とブラウザで動き、DOM に頼らない。語の区切りは実行環境に依る（`Intl.Segmenter` の有無と辞書で決まる）ため、同じ実行環境で描いた文書の下線と同じ一致を返す
  - item: 照合の規則
    constraint: 用語のツールチップと同じ辞書（索引の `terms` → 照合する文書の用語集の表 → ほかの文書の表。文書の別名は照合する文書自身の別名を除く）と、語の区切りに揃う一致を長い語から取る照合を使う。照合の前に、語と本文の文字の両方を用語のツールチップと同じく正規化する
    notes: 節ごとの最初の 1 回の制限は下線のもので、取り出しには効かない
  - item: 照合する範囲
    constraint: 本文の地の文（コード・リンク・見出し・用語集の表の中を除く）、`html` がオンなら埋め込んだ HTML の文字（`a`・`code`・`pre`・`button`・見出しが直接持つ文字と、タグ・属性の値・中身ごと落ちる要素を除く）、`diagrams` がオンなら図の部品の範囲の定義と埋め込んだ HTML の中の custom element の定義の `{{語}}`
    notes: 図の部品の `{{語}}` は、語を正規化した後に用語に一致し、意味が空でないときだけ参照にする（文書の別名は引かない）
  - item: 機能のオフ
    constraint: 文書の印で `glossary` がオフの文書は用語とやめた言い方を、`backlinks` がオフの文書は文書の別名を照合しない。`glossary` がオフの文書の用語集の表は、ほかの文書の照合にも入れない
  - item: 位置の数え方
    constraint: 行は 1 から、行の中の位置は 0 から数える UTF-16 の位置。改行は `\n` で数える
  - item: 計算の量
    constraint: 全ての文書の本文を 1 回ずつ解析する。結果は使う側が持ち、文書を書き換えたときに作り直す
  - item: やめた言い方
    constraint: 照合の辞書のやめた言い方（索引の `terms[].avoid`。用語の語・別名と同じ語は除く）を用語・文書の別名の語に加えて照合し、やめた言い方の語に当たったところを `avoided` に入れる。照合する範囲は地の文と、`html` がオンなら埋め込んだ HTML の文字で、図の部品の `{{語}}` は照合しない
    notes: 長い語から取るため、用語・別名の一部として出たやめた言い方は返さない。`byDocument` はやめた言い方を加えない照合のまま変えない
