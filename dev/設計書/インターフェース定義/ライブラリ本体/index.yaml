summary: ライブラリ本体の公開関数とビルドの操作
items:
  - page: 版を返す.ts.yaml
    summary: 使う側のページが、読み込んだ配布物の版を取る
  - page: 配布物をビルドする.ts.yaml
    summary: 版を埋めた dist/index.js と dist/index.css をビルドする
  - page: 文書を描く.ts.yaml
    summary: 使う側のページが、要素の中に Markdown を文書として描く（mount）
  - page: 文書をHTML文字列にする.ts.yaml
    summary: 画面を持たずに Markdown を HTML 文字列にする（render）
  - page: 拡張を登録する.ts.yaml
    summary: 使う側が、自分の印とその印を描くモジュールの読み方を登録する（registerExtension）
  - page: 参照の表を作る.ts.yaml
    summary: 索引と全ての文書の本文から、被参照と用語集の表の用語をまとめた参照の表を作る（collectReferences）
  - page: 索引を点検する.ts.yaml
    summary: 索引と文書の本文から、索引と文書のずれの一覧を返す（checkIndex）
