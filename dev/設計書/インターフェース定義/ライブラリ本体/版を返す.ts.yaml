title: "版を返す"
entry:
  kind: operation
  value: '`version()`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: 配布物を読んだページで公開関数を呼び、埋めた版と CSS 変数が一致する
    setup:
      - name: 版を埋めてビルドした配布物
        description: '`v0.0.1` を埋めてビルドした `dist/index.js` と `dist/index.css`'
      - name: Mock
        description: 差し替える依存は無い（手元で配信した配布物をブラウザで読む）
    flow: |-
      sequenceDiagram
        participant P as 使う側のページ
        participant L as ライブラリ本体
        P->>L: version()
        L-->>P: "v0.0.1"
    expected:
      - 戻り値が `v0.0.1`
      - ルート要素の `--mdmark-version` の計算値が `"v0.0.1"`
    test: test_normal
lead: 使う側のページが、読み込んだ配布物の版を取る。配布物の CSS は同じ版を `--mdmark-version` で持つ。
idempotent: true
side_effects: なし
callers:
  - dev/設計書/シナリオ/単一ユースケース/版を固定して配布物を読み込む#
response:
  - name: '-'
    type: string
    description: ビルドで埋めた版
    format: '`v{MAJOR}.{MINOR}.{PATCH}`'
    example: v0.0.1
exceptions:
  - name: なし（正常終了）
    condition: 常に埋めた版を返す
test_file: tests/integration/lib/version.browser.test.ts
