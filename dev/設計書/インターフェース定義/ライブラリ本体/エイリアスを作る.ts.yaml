title: "エイリアスを作る"
entry:
  kind: operation
  value: '`buildAliases(input)`（配布物 `dist/index.js` の公開関数）'
flows:
  - name: 正常系
    summary: records を持つ行と持たない行から、metadata を適用したエイリアスを並びの順に作り、env と読み込まない行を除く
    setup:
      - name: 配布物を読み込む Node の処理
        description: ビルドした `dist/index.js` を読み込み、`buildAliases` を呼ぶ
      - name: 4 つの行とその中身
        description: 'リクエスト例の 2 つの行に、`enabled: false` の行 `off` と、`alias_type` を `env` にした行 `servers` を加えたもの。`sources` はリクエスト例の 2 つに、`servers` の `servers/dev.yaml`（`id` が `dev-server`、`url` が `http://127.0.0.1:8767/`、`port` が `8767`）と `off` の `off/memo.yaml` を加える'
        notes: '`terms` のレコードの `aliases` を文字列 `WS` で記載し、並びに変換されることを確認する。`terms` の行の `description` は入れ子の列 `meta.meaning` から取る。`commands` のレコードは `name` を持たない'
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: buildAliases({ rows, sources })
        M->>M: 読み込む行ごとにレコードを取り出し、metadata を適用する
        M->>M: 種類と必須のキーを確認し、env を除く
        M-->>C: { aliases, problems }
    expected:
      - '`aliases` が `ws`・`unit-test` の 2 件をこの順に持つ'
      - '`ws` の `alias_type` が `term`、`name` が `ワークスペース`、`aliases` が `["WS"]`、`description` が `話し合いの記録を配置するフォルダ`'
      - '`unit-test` の `name` が `unit-test`（ファイル名から拡張子を除いたもの）、`command` が `npm run test:unit`'
      - '`aliases` が `dev-server` と `off` の行のレコードを持たない'
      - '`problems` が空'
      - 引数の `rows` と `sources` が書き換わっていない
    test: test_normal
  - name: 正常系（使用できない行とレコード）
    summary: 使用できない行とレコードを除いてずれにし、残りからエイリアスを作る
    setup:
      - name: 配布物を読み込む Node の処理
        description: 正常系と同じ
      - name: 使用できない行とレコードを混ぜた中身
        description: 正しい行 `terms`（リクエスト例と同じ）と、次の 6 行。`records` が `items` でファイルにそのキーが無い行（`alias_type` は `term`）・`metadata.description` を `missing_col` にした行（`alias_type` は `term`）・`alias_type` が `memo` の行・`id`・`name` を持ち `command` が空のレコードを持つ行（`alias_type` は `command`）・`id` が `terms` と同じ行（`alias_type` は `term`）・`id` が `ws`（`terms` のレコードと同じ）で `name`・`description` を持つレコードを持つ行（`alias_type` は `term`）
        notes: ずれの種類ごとに 1 つずつ配置して決定的に発生させる。`missing_col` の行のレコードは `id`・`name` を持ち、`alias_field_missing` の 1 件だけを出す
      - name: Mock
        description: 差し替える依存は無い
    flow: |-
      sequenceDiagram
        participant C as 利用側の処理
        participant M as mdmark
        C->>M: buildAliases({ rows, sources })
        M->>M: 使用できない行・レコードを除いてずれにする
        M-->>C: { aliases, problems }
    expected:
      - 例外を投げない
      - '`aliases` が `terms` の行のエイリアスだけを持つ'
      - '`problems` が `alias_records_missing`・`alias_field_missing`・`alias_unknown_type`・`alias_required_empty`・`duplicate_alias_row_id`・`duplicate_alias_id` を 1 件ずつ持つ'
      - '`duplicate_alias_row_id` の `file` が `mdmark.config.yaml`、`where` が後の行の `aliases[5].id`'
      - '`alias_required_empty` の `file` がレコードのファイルのパス、`where` が `command` を指し、`message` に修正方法がある'
    test: test_normal_when_invalid_rows
lead: 利用側の処理（`mdmark export`・`build`・`check` と dev-docs）が、設定の `aliases` の行と、行の `paths` に該当した YAML を読み込んだ中身を指定し、`metadata` を適用したエイリアスの配列と、使用できない行・レコードのずれの一覧を受け取る。ファイルを読み込むのは呼ぶ側で、mdmark は指定された値だけからエイリアスを作る。
identifier: buildAliases
idempotent: true
side_effects: なし（引数を書き換えず、ファイルとネットワークを読み込まない）
callers:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#
  - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる.ts#
  - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#
request:
  - name: input.rows
    type: unknown[]
    required: true
    location: argument
    description: 利用側が設定の `aliases` を読み込んだ配列。構造は ER 図『エイリアスの元の行』
    notes: '`id`・`paths`・`alias_type` を持たない行は使用せず、ずれにもしない（構造は `mdmark check` の `schema` が確認する）'
  - name: input.sources
    type: MdmarkAliasSource[]
    required: true
    location: argument
    description: 行の `paths` に該当したファイルを YAML として読み込んだ中身の並び。行ごとに `paths` に記載した順、glob の中はパスの順に並べる
    notes: 読み込めなかったファイルと、どのファイルにも該当しなかった `paths` は呼ぶ側が扱い、ここには入れない
  - name: input.sources[].rowId
    type: string
    required: true
    location: argument
    description: そのファイルを指した行の `id`
    example: terms
  - name: input.sources[].path
    type: string
    required: true
    location: argument
    description: ファイルのパス（設定ファイルのフォルダからの相対パス。区切りは `/`）。ずれの `file` と、`name` を持たないときの名前に使用する
    example: terms/glossary.yaml
  - name: input.sources[].data
    type: unknown
    required: true
    location: argument
    description: ファイルを YAML として読み込んだ値
  - name: input.configFile
    type: string
    required: false
    default: '`mdmark.config.yaml`'
    location: argument
    description: 行のずれの `file` に出す設定ファイルの名前
    example: docs/mdmark.config.yaml
request_example: |-
  ```json
  {
    "rows": [
      {
        "id": "terms",
        "paths": ["terms/*.yaml"],
        "alias_type": "term",
        "records": "terms",
        "metadata": {
          "name": "term",
          "description": "meta.meaning"
        }
      },
      {
        "id": "commands",
        "paths": ["commands/unit-test.yaml"],
        "alias_type": "command"
      }
    ],
    "sources": [
      { "rowId": "terms", "path": "terms/glossary.yaml", "data": { "terms": [{ "id": "ws", "term": "ワークスペース", "aliases": "WS", "meta": { "meaning": "話し合いの記録を配置するフォルダ" } }] } },
      { "rowId": "commands", "path": "commands/unit-test.yaml", "data": { "id": "unit-test", "description": "ライブラリ本体の単体テストを実行する", "command": "npm run test:unit" } }
    ]
  }
  ```
response:
  - name: aliases
    type: MdmarkAlias[]
    description: 作ったエイリアスの並び。構造は ER 図『エイリアス』
    constraints: '`env` と、使用できないエイリアス（ずれにしたもの）を含まない'
    notes: 並びは行の並び、行の中は `sources` の並び、ファイルの中は `records` の配列の並び。この並びが照合で同じ単語が該当したときの優先の順になる
  - name: problems
    type: MdmarkAliasProblem[]
    description: 使用できなかった行・レコードのずれの一覧。ずれが無ければ空
    notes: 並びは `aliases` と同じ順で、同じ行・レコードの中は `metadata` のキーの順
  - name: problems[].file
    type: string
    description: ずれのあるファイル。行のずれは `configFile`、レコードのずれはそのレコードのファイルの `path`
    example: terms/glossary.yaml
  - name: problems[].where
    type: string
    description: 行のずれは設定のキーのパス（`aliases[1].records`）、レコードのずれはファイルの中のパス（`records` を持つ行は `terms[2].command`、持たない行は `command`）。ファイル全体のずれは空文字
    example: terms[2].command
  - name: problems[].kind
    type: "'duplicate_alias_row_id' | 'alias_records_missing' | 'alias_field_missing' | 'alias_unknown_type' | 'alias_required_empty' | 'duplicate_alias_id'"
    description: ずれの種類
    notes: '`duplicate_alias_row_id` は 2 つ目以降に出た行の `id`、`alias_records_missing` はファイルに `records` のキーの配列が無い、`alias_field_missing` は `metadata` に記載した列がレコードに無い、`alias_unknown_type` は行の `alias_type` が 9 つの種類に無い（`file` は `configFile`、`where` は `aliases[{行}].alias_type`）、`alias_required_empty` は種類の必須のキーが空、`duplicate_alias_id` は 2 つ目以降に出たエイリアスの `id`'
  - name: problems[].message
    type: string
    description: ずれの内容と修正方法。日本語の 1 文
    example: '`terms/glossary.yaml` の `terms[2]` の `command` が空です。コマンドを記載してください。'
response_example: |-
  ```json
  {
    "aliases": [
      { "alias_type": "term", "id": "ws", "name": "ワークスペース", "aliases": ["WS"], "description": "話し合いの記録を配置するフォルダ" },
      { "alias_type": "command", "id": "unit-test", "name": "unit-test", "aliases": [], "description": "ライブラリ本体の単体テストを実行する", "command": "npm run test:unit" }
    ],
    "problems": []
  }
  ```
exceptions:
  - name: なし（正常終了）
    condition: 作ったエイリアスとずれの一覧を返却する
  - name: なし（使用できない行・レコード）
    condition: 行・レコードが使用できない
    notes: 例外を投げず、その行・レコードを除いてずれにし、ほかの行・レコードからエイリアスを作る
constraints:
  - item: 実行する環境
    constraint: Node とブラウザのどちらでも同じ結果を返却する。DOM に頼らない
  - item: 読み込む行
    constraint: '`enabled` が `false` の行は読み込まない（ずれにもしない）。`sources` のうち `rowId` が読み込む行に該当しないものは使用しない'
  - item: レコード
    constraint: '`records` を持つ行は、ファイルの値のそのキーの配列の要素ごとに 1 件、持たない行はファイルの値を 1 件にする。配列の要素とファイルの値がオブジェクトでないものは使用しない'
    notes: キーが無いか配列でないファイルは `alias_records_missing`
  - item: metadata の当て方
    constraint: エイリアスのキーごとに、`metadata` に記載した列名の列の値を取る。列名の `.` は入れ子の列をたどる（`meta.summary` は `meta` の中の `summary`）。`metadata` に無いキーと、値が文字列でないキーは、レコードの同じ名前の列の値を取る（列が無ければ持たない）。`metadata` に記載した列がレコードに無いときは、無い列ごとに `alias_field_missing` にし、そのレコードは必須のキーを確認せずに使用しない。`alias_type` は行の `alias_type` を取り、レコードからは取らない
    notes: キーは ER 図『エイリアス』の列と `port`。ほかのキーは取らない
  - item: 値の構造
    constraint: 文字列のキーは、文字列・数・真偽値を文字列にし、前後の空白を除く。それ以外の値は空として扱う。`aliases`・`avoid`・`related` は、文字列なら 1 件の並びにし、並びなら文字列の要素だけを残す
  - item: 名前の既定
    constraint: '`name` が空のとき、行が `body_file` を持ちレコードのその列が空でなければ、その値のパスの最後の名前から拡張子を除いたものにする。それも空のとき、`records` を持つ行はレコードの `id`、持たない行はファイルのパスの最後の名前から拡張子を除いたものにする'
  - item: 種類と必須のキー
    constraint: '行の `alias_type` が `term`・`doc`・`command`・`url`・`skill`・`tool`・`path`・`env`・`avoid` に無い行は、レコードを読み込まず `alias_unknown_type` にする。種類の必須のキー（ER 図『エイリアス』の補足。`env` は `id`・`name` と、`url`・`port` の 1 つ以上）が空のレコードは `alias_required_empty` にして使用しない'
    notes: '`url` の URL が http・https かは確認しない（`mount` がリンクにするかを決める）'
  - item: env
    constraint: '`env` のレコードも種類と必須のキーを確認してずれを返却するが、`aliases` には入れない'
    notes: 値にシークレットキーを含みうるため、照合にも書き出しの埋め込みにも使用しない
  - item: ID の重なり
    constraint: 行の `id` が前の行と同じときは、後の行を読み込まず `duplicate_alias_row_id` にする。エイリアスの `id` が前のエイリアス（`env` を含む）と同じときは、後のレコードを使用せず `duplicate_alias_id` にする
  - item: 上限
    constraint: 制限なし（指定された全ての行とファイルを使用する）
refs:
  - dev/設計書/ER図/エイリアス#
  - dev/設計書/設定/ライブラリ本体#settings[aliases]
