title: "プレビューを描き直す"
entry:
  kind: trigger
  value: Markdown の変更（`workspace.onDidChangeTextDocument`）・保存（`workspace.onDidSaveTextDocument`）・設定ファイルの作成・変更・削除（`workspace.createFileSystemWatcher`）・設定 `mdmark.*` の変更・Webview の `ready`
flows:
  - name: 正常系
    summary: 打つたびに待ち、最後の全文だけを送る
    setup:
      - name: プレビューを開いたワークスペース
        description: プレビューを開く.ts の正常系の後。`mdmark.preview.liveUpdate` は既定の `true`、`mdmark.preview.updateDelayMs` は既定の 300
      - name: Mock
        description: プレビューを開く.ts の正常系と同じ。Webview へ送ったメッセージを時刻つきで記録する
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 見出しを 100 ms おきに 3 回書き換える（保存しない）
        EX->>EX: 最後の変更から 300 ms 待つ
        EX->>PV: render（3 回目の全文）
        PV->>EX: rendered
    expected:
      - 3 回の書き換えの後に送った `render` が 1 回だけで、中身が 3 回目の全文
      - '`render` を送った時刻が、最後の書き換えから 300 ms より後'
      - Webview の見出しが 3 回目に書いた文字
    test: test_normal
  - name: 正常系（保存したときだけ描き直す）
    summary: '`liveUpdate` が `false` のときは保存でだけ送る'
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.preview.liveUpdate` を `false` にする
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 見出しを書き換える
        U->>EX: 保存する
        EX->>PV: render（保存した全文）
    expected:
      - 保存する前は、`updateDelayMs` の 2 倍待っても `render` が送られない
      - 保存すると `render` が 1 回送られ、Webview の見出しが書き換えた文字
    test: test_normal_when_live_update_off
  - name: 正常系（設定ファイルを保存する）
    summary: 設定ファイルの保存で、新しい features で描き直す
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系と同じ。`mdmark.config.yaml` は `features` を持たず、`guide.md` は注意書きを持つ
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.config.yaml に features.callout: false を書いて保存
        EX->>EX: features・libraries を取り出す
        EX->>PV: render（新しい config）
        PV->>PV: destroy して mount
        PV->>EX: rendered
    expected:
      - '`render` の `config.features` が `{ callout: false }`'
      - Webview の注意書きが `markdown-alert` の枠でなく `blockquote` で描かれる
    test: test_normal_when_config_saved
  - name: 正常系（設定ファイルが無い）
    summary: 設定ファイルが無ければ設定なしで描き、知らせを出さない
    setup:
      - name: 設定ファイルの無いワークスペース
        description: '`guide.md` だけを置いたフォルダでプレビューを開く'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: プレビューを開く
        PV->>EX: ready
        EX->>PV: render（config は空）
    expected:
      - '`render` の `config` が `{}` で、`configError` が送られない'
      - Webview に設定ファイルを読めない帯が無い
    test: test_normal_when_config_missing
  - name: 正常系（背面から戻る）
    summary: 背面の間は送らず、`ready` を受けて最後の全文を送り、作り直した Webview を背面に回す前の位置へ戻す
    setup:
      - name: プレビューを開いたワークスペース
        description: 見出しを多く持つ長い Markdown を左の列のエディタで開き、右の列にプレビューを開いた状態。プレビューを見出し A が先頭に見えるまでスクロールし、見出し A の見えている範囲の先頭からの位置を控えてから、右の列で別の Markdown を開いてプレビューのパネルをその後ろに回す。エディタは左の列に見えたまま
        notes: 書き換える見出し B は、エディタの見えている範囲にある見出し A より下の見出し。エディタのスクロールを動かさずに書き換える
      - name: Mock
        description: 正常系と同じ。Webview から届いたメッセージも記録する
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 背面の間に見出し B を 3 回書き換える
        U->>EX: プレビューのタブを表に戻す
        PV->>EX: ready
        EX->>PV: render（3 回目の全文）
        PV->>PV: 保存した元の行番号を先頭に置く
    expected:
      - 背面の間に送った `render` が 0 回
      - 表に戻した後の `ready` を受けて送った `render` が 3 回目の全文で、Webview の見出し B が 3 回目の文字
      - 表に戻した後の Webview で、見出し A の見えている範囲の先頭からの位置が、背面に回す前に控えた値と 1 px 以内で同じ
      - 表に戻してから位置を戻した後、Webview から `revealLine` が届かず、エディタの `visibleRanges[0].start.line` が表に戻す直前と同じ
    test: test_normal_when_revealed
  - name: 正常系（相対パスの外部ライブラリ）
    summary: 設定ファイルからの相対パスの libraries を Webview で読める URL にして渡す
    setup:
      - name: 自作の図のワークスペース
        description: '`config/mdmark.config.yaml` に `libraries: { my-lib: ./libs/my-lib.js }`、`config/libs/my-lib.js` は印の場所に `data-drawn` を付ける `draw` を持つ。`mdmark.configPath` は `config/mdmark.config.yaml`。`docs/guide.md` は `<!-- my-lib -->` を持つ'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: docs/guide.md のプレビューを開く
        EX->>EX: ./libs/my-lib.js を config/ から解決し asWebviewUri にする
        EX->>PV: render（libraries は Webview の URL）
        PV->>EX: rendered
    expected:
      - '`render` の `config.libraries.my-lib` が `config/libs/my-lib.js` の `asWebviewUri` の URL'
      - Webview の印の場所が `data-mdmark-drawn` を持ち、知らせの枠が無い
    test: test_normal_when_relative_library
  - name: 正常系（設定ファイルを直す）
    summary: 読めない設定ファイルを直して保存すると、新しい設定で描き帯を消す
    setup:
      - name: 設定ファイルを読めないプレビュー
        description: 異常系（設定ファイルを読めない）の後
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 括弧を閉じて features.callout: false で保存
        EX->>PV: render（新しい config）
        EX->>PV: configOk
    expected:
      - '`render` の `config.features` が `{ callout: false }` で、続けて `configOk` が送られる'
      - Webview の設定ファイルを読めない帯が消える
    test: test_normal_when_config_fixed
  - name: 異常系（設定ファイルを読めない）
    summary: 読めない YAML を保存すると、前の設定で描いたまま読めない行を知らせる
    setup:
      - name: プレビューを開いたワークスペース
        description: 正常系（設定ファイルを保存する）の後
      - name: 壊れた設定ファイル
        description: 4 行目に閉じていない `[` を持つ `mdmark.config.yaml`
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 壊れた mdmark.config.yaml を保存
        EX->>EX: YAMLParseError
        EX->>PV: configError（line: 4）
    expected:
      - '`configError` の `line` が `4` で、`render` は送られない'
      - Webview の文書は描いたまま（注意書きは `blockquote` のまま）で、文書の先頭に設定ファイルを読めない帯と「設定ファイルを開く」がある
    test: test_error_when_config_unreadable
  - name: 正常系（設定ファイルに新しい配信元の libraries を足す）
    summary: 開いたまま設定ファイルにまだ CSP に無い origin の `libraries` を足して保存すると、HTML を入れ直してそのモジュールを読む
    setup:
      - name: 見本のワークスペース
        description: '`<!-- my-chart: a -->` の印を持つ `guide.md` と、`libraries` を持たない `mdmark.config.yaml` を置いたフォルダ。プレビューを開いて `rendered` を受けてある'
      - name: Mock
        description: 配布物とタグ一覧の代役の配信とは別の origin（別のポート）で、`draw` が印の場所に `data-drawn` を付けるモジュール `my-chart.js` を配る手元のサーバー
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        participant LIB as 別の配信元
        U->>EX: mdmark.config.yaml に libraries.my-chart を足して保存
        EX->>EX: libraries の origin が CSP に入れたものと違う
        EX->>PV: 新しい CSP の HTML を入れ直す
        PV->>EX: ready
        EX->>PV: render（全文・新しい設定）
        PV-->>LIB: my-chart.js
        PV->>EX: rendered
    expected:
      - Webview の HTML の CSP の `script-src` が別の配信元の origin を含む
      - 別の配信元が `my-chart.js` の要求を受ける
      - '`rendered` を受けた後、印の場所が `data-mdmark-drawn` を持ち、知らせの枠が無い'
    test: test_normal_when_library_origin_added
  - name: 正常系（テーマの設定を変える）
    summary: '`mdmark.colorTheme` を変えると、設定ファイルの `colorTheme` を上書きした config で描き直し、空に戻すと設定ファイルのテーマで描く'
    setup:
      - name: プレビューを開いたワークスペース
        description: '正常系と同じ。`mdmark.config.yaml` に `colorTheme: theme-paper` を記載し、`mdmark.colorTheme` は空'
        notes: '`mdmark.preview.theme` は `light`'
      - name: Mock
        description: 正常系と同じ
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: mdmark.colorTheme を theme-slate にする
        EX->>PV: render（colorTheme: theme-slate）
        PV->>PV: destroy して mount
        PV->>EX: rendered
        U->>EX: mdmark.colorTheme を空に戻す
        EX->>PV: render（colorTheme: theme-paper）
        PV->>EX: rendered
    expected:
      - '`mdmark.colorTheme` を `theme-slate` にした後の `render` の `config.colorTheme` と Webview の文書の `data-mdmark-color-theme` が `theme-slate`（地の色の計算値はライブラリ本体の『文書を描く』の結合テストが確かめる）'
      - 空に戻した後の `render` の `config.colorTheme` と Webview の文書の `data-mdmark-color-theme` が `theme-paper`
      - 設定ファイルの中身が変わっていない
    test: test_normal_when_color_theme_changed
  - name: 正常系（差分の変更後の側を書き換える）
    summary: 差分ビューの変更後の側を書き換えると、待ってから変更前と変更後の全文で同じパネルを描き直す
    setup:
      - name: 差分のプレビュー
        description: プレビューを開く.ts の正常系（差分ビューから開く）の後。`mdmark.preview.liveUpdate` は既定の `true`、`mdmark.preview.updateDelayMs` は既定の 300
      - name: Mock
        description: プレビューを開く.ts の正常系（差分ビューから開く）と同じ。Webview へ送ったメッセージを時刻つきで記録する
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 変更後の側の末尾に段落を 1 つ書き足す（保存しない）
        EX->>EX: 最後の変更から 300 ms 待つ
        EX->>PV: render（変更後の全文・previous）
        PV->>PV: update
        PV->>EX: rendered
    expected:
      - 送った `render` が 1 回で、`markdown` が書き足した後の全文、`previous` が変更前の全文
      - 書き足した段落が `data-kind="add"` のブロックで出、前に色を当てたブロックが同じ `data-kind` のまま出ている
      - 差分のパネルが 1 つのままで、開き直していない
    test: test_normal_when_diff_modified_side_edited
    refs:
      - dev/設計書/シナリオ/単一ユースケース/差分ビューの変更をプレビューで見る#scenarios[正常シナリオ（変更後の側を書き換える）]
  - name: 正常系（差分のパネルが背面から戻る）
    summary: 差分のパネルも、作り直した Webview を背面に回す前の位置へ戻す
    setup:
      - name: 差分のプレビューを開いたワークスペース
        description: 見出しを多く持つ長い Markdown で、プレビューを開く.ts の正常系（差分ビューから開く）の後。差分のプレビューを見出し A が先頭に見えるまでスクロールし、見出し A の見えている範囲の先頭からの位置を控えてから、同じ列で別の Markdown を開いて差分のパネルをその後ろに回す
      - name: Mock
        description: プレビューを開く.ts の正常系（差分ビューから開く）と同じ。Webview から届いたメッセージも記録する
    flow: |-
      sequenceDiagram
        participant U as 文書を書く人
        participant EX as 拡張機能
        participant PV as Webview
        U->>EX: 差分のプレビューのタブを表に戻す
        PV->>EX: ready
        EX->>PV: render（変更後の全文と previous）
        PV->>PV: 保存した元の行番号を先頭に置く
    expected:
      - 表に戻した後の `ready` を受けて送った `render` が `previous` を持つ
      - 表に戻した後の Webview で、見出し A の見えている範囲の先頭からの位置が、背面に回す前に控えた値と 1 px 以内で同じ
    test: test_normal_when_diff_revealed
lead: 開いているプレビューを、Markdown と設定ファイルの最後の内容で描き直す。
idempotent: true
side_effects: Webview へ `render`・`configError`・`configOk` を送る。Markdown と設定ファイルは書き換えない
callers:
  - dev/設計書/シナリオ/単一ユースケース/書いた内容をプレビューに映す#
exclusivity: パネルごとに待ちを 1 つだけ持ち、待つ間に変更が来たら待ちを始め直す。送るのは常にその時点の全文
exceptions:
  - name: なし（正常終了）
    condition: 最後の全文と設定で描き直す
  - name: なし（設定ファイルを読めない）
    condition: 設定ファイルが YAML として読めない
    notes: 例外を投げず、前に読めた設定（無ければ設定なし）で描いたまま、`configError` で読めない行を知らせる
constraints:
  - item: 描き直すきっかけ
    constraint: '`mdmark.preview.liveUpdate` が `true` のときは Markdown の変更から、`false` のときは Markdown の保存から描き直す。設定ファイルの作成・変更・削除、`mdmark.configPath`・`mdmark.preview.theme`・`mdmark.colorTheme` の変更でも描き直す。保存と設定ファイルは待たずに送る'
  - item: 描き直すまでの待ち
    constraint: Markdown の最後の変更から `mdmark.preview.updateDelayMs` 待って送る。範囲の外の値は既定の値として扱う
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[描き直すまでの待ち]
  - item: 送る中身
    constraint: '`TextDocument.getText()` の全文（保存していない書き換えを含む）と、設定ファイルから取り出した `features`・`libraries`・`side-toc`・`colorTheme`（`mdmark.colorTheme` が空でないときはその値で上書きする）、`mdmark.preview.theme`。差分のパネルは、変更後の文書の全文を `markdown`、その時点の変更前の文書の全文を `previous` に入れる。それ以外のパネルは `previous` を送らない'
  - item: 背面のパネル
    constraint: パネルが見えていない間は送らず、最後の全文だけを持つ。Webview の `ready` を受けたら、その時点の全文と設定で `render` を送る。Webview は見えている先頭の元の行番号（スクロールを合わせる.ts の制約「プレビューから合わせる」と同じ求め方）を、スクロールの知らせと `render` を描いた後に Webview の状態（`setState`）へ保存する。作り直した Webview（HTML を入れ直したときを含む）は、起動したときに `getState` の行を読んでおき、最初の `render` を描いた後にその行を `scrollToLine` と同じ位置に置いてから保存する。その行へ戻すまでは、スクロールの知らせでも `render` を描いた後でも保存しない。戻したスクロールでは `revealLine` を送らない。保存した行が無いとき（開いた直後）は先頭から描く
    notes: '背面の間の `postMessage` は届かない（PoC #70）。`retainContextWhenHidden` は `false` のままで、背面に回ると Webview が作り直される。位置を元の行番号で持つのは、背面の間の書き換えで文書の高さが変わっても同じ箇所へ戻すため'
  - item: 設定ファイルの場所
    constraint: '`mdmark.configPath` を Markdown を含むワークスペースのフォルダ（ワークスペースの外の Markdown は Markdown のフォルダ）から解決する。無ければ設定なしで描き、知らせは出さない'
    notes: dev/設計書/設定/VSCode拡張機能
  - item: 設定の取り出し方
    constraint: YAML を `yaml` の `parse` で読み、最上位がマップのときだけ `features`・`libraries`・`side-toc`・`colorTheme` を取り出す（マップでない値のキーは渡さない）。他のキーは読まない。空のファイル・最上位がマップでないファイルは設定なしとして扱う。キーの中の知らない名前と型の違う値は mdmark が無視する
    notes: dev/設計書/設定/ライブラリ本体
  - item: libraries の URL
    constraint: '`http:`・`https:` の URL はそのまま渡す。それ以外は設定ファイルのあるフォルダを基準に解決したファイルを `asWebviewUri` で Webview で読める URL にして渡す。`localResourceRoots` の外のファイルは Webview が読めず、mdmark がその印の場所に知らせの枠を出す。読み直した `libraries` の `http:`・`https:` の origin の集まりが今の HTML の CSP に入れた集まりと違うときは、`render` でなく Webview の HTML を入れ直す（`ready` を受けて全文を送る）'
  - item: 設定ファイルを読めないとき
    constraint: '`yaml` の `YAMLParseError` の `linePos[0].line`（1 始まり）を `configError` の `line` に入れて送る。読めるようになったら、新しい設定の `render` と `configOk` を送る'
  - item: 設定が変わったときの描き方
    constraint: Webview は `config` が前と同じときは `update`、違うときは `destroy` してから `mount` で描く。スクロールの位置は描き直す前の位置を保つ
    notes: '`update` は `mount` に渡した設定を使う（文書を描く.ts のレスポンス）'
  - item: 差分のパネルを描き直すきっかけ
    constraint: 差分のパネルは、変更後の文書の変更・保存だけを制約「描き直すきっかけ」のとおり受け、変更前の文書の変更では描き直さない。設定ファイルと設定の変更は他のパネルと同じ
    notes: 変更前の側は `git:` の読み取り専用の文書か、要件のスコープ外（変更前の側の書き換え）
