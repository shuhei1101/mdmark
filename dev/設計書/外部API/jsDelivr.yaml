title: "jsDelivr"
version:
  api_version: 版なし（URL に版を持たない）
  checked_on: '2026-10-13'
auth:
  method: なし
endpoints:
  - name: GET /gh/{user}/{repo}@{version}/{file}
    method: GET
    path: /gh/{user}/{repo}@{version}/{file}
    summary: GitHub のリポジトリの、版のタグが指す commit のファイルを返す
    idempotent: true
    description: 版にはタグ・commit・ブランチ・semver の範囲を指定できる。タグと commit の指定は中身が変わらず無期限にキャッシュされ、ブランチは 12 時間、版の範囲と `latest` は 7 日キャッシュされる。1 ファイル 20MB を超えるファイルは配らない。
    request:
      - name: user
        type: string
        required: true
        location: path
        description: GitHub のユーザー名
        example: shuhei1101
      - name: repo
        type: string
        required: true
        location: path
        description: リポジトリ名
        example: mdmark
      - name: version
        type: string
        required: true
        location: path
        description: 版のタグ
        example: v0.1.0
      - name: file
        type: string
        required: true
        location: path
        description: リポジトリの直下からのファイルのパス
        example: dist/index.js
    request_example: GET /gh/shuhei1101/mdmark@v0.1.0/dist/index.js
    status_codes:
      - code: '200'
        condition: ファイルがある
      - code: '404'
        condition: タグかファイルが無い
  - name: GET /npm/{package}@{version}/{file}
    method: GET
    path: /npm/{package}@{version}/{file}
    summary: npm のパッケージの版を固定したファイルを配る（色分けのライブラリ）
    idempotent: true
    description: '`mount` が色分けの対象のコードブロックを持つ文書を描いた後に、`@highlightjs/cdn-assets` の `es/core.min.js` と `es/languages/{言語}.min.js` を `import()` で読む。CLI の書き出しも同じ URL から読んで埋める。`/+esm` は使わない（`es/*.min.js` は import を持たない）。応答は `application/javascript` と `access-control-allow-origin: *` を持つ'
    request:
      - name: package
        type: string
        required: true
        description: npm のパッケージ名（scope を含む）
        location: path
        example: '@highlightjs/cdn-assets'
      - name: version
        type: string
        required: true
        description: 版。完全に固定する
        location: path
        example: 11.12.0
      - name: file
        type: string
        required: true
        description: パッケージの中のファイルのパス
        location: path
        example: es/languages/typescript.min.js
    request_example: GET https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/core.min.js
    status_codes:
      - code: '200'
        condition: パッケージのその版にファイルがある
      - code: '404'
        condition: パッケージ・版・ファイルのどれかが無い
lead: npm と GitHub の公開リポジトリのファイルを配る無料の CDN。
verification:
  state: 済
  date: '2026-10-13'
  detail: '`GET /gh/shuhei1101/mdmark@480d928/README.md` が 200、同じ commit の無いファイル `dist/index.js` と、打っていないタグ `@v9.9.9` が 404 を返すことを確かめた'
base_urls:
  - env: 本番
    url: https://cdn.jsdelivr.net
official_url: https://www.jsdelivr.com/
docs_url: https://github.com/jsdelivr/jsdelivr
used_in:
  - vscode/src/
