title: "VSCodeのプレビュー"
elements:
  - name: タブの題
    id: preview-title
    kind: label
    position: エディタの列のタブ
    description: パネルのタブに出す題
    label: プレビュー {ファイル名}（差分のパネルは `差分プレビュー {ファイル名}`）
    io: 表示
    type: 文字列
    visible_when: 常時
    source: プレビューを開く.request.uri（ファイル名だけ。差分のパネルは差分ビューの `modified` のファイル名）
    status: planned
    introduced:
      pr: 69
  - name: 描く先を包む要素
    id: preview-root
    kind: container
    position: Webview の `body` の直下
    description: 状態の表示、設定ファイルを読めない帯、描く先の要素を入れる。`mdmark.preview.theme` が `light`・`dark` のとき class `mdmark-theme-light`・`mdmark-theme-dark` を持つ
    visible_when: 常時
    source: プレビューを開くの Webview とのメッセージ `render.theme`
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[配色]
    status: planned
    introduced:
      pr: 69
  - name: 描いた文書
    id: preview-document
    kind: container
    position: 描く先を包む要素
    description: 'mdmark の `mount` に渡す描く先の要素。React が中身を持たない要素として置き、中身は mdmark の `mount`・`update` だけが書き換える。中身と見た目は画面設計『文書』のままで、拡張機能は手を加えない。差分のパネルは `diffMode: "blocks"` で描き、画面設計『文書』の差分のブロックを出す'
    visible_when: 配布物を読み終え、最初の `rendered` を送った後
    source: プレビューを描き直すの送る中身（全文・差分のパネルの `previous`・重ねた設定のうち `mount` の `opts.config` が読むキー）。重ねた設定の `theme` の CSS と `extensions` の部品が当たる
    action: 本文のリンクを押すと `#` で始まるリンクはこの中で移り、それ以外は `openLink` を送る。スクロールすると `revealLine` を送る
    action_ref: dev/設計書/画面設計/文書.ts#
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューのリンクを開く.ts#
      - dev/設計書/インターフェース定義/VSCode拡張機能/スクロールを合わせる.ts#
    status: planned
    introduced:
      pr: 69
  - name: 読み込み中の表示
    id: preview-loading
    kind: status
    component: dev/設計書/部品設計/プレビューの状態の表示.ts#
    args:
      - name: state
        value: '`loading`'
    position: 描く先を包む要素
    description: 配布物を読んでいる間、文書の代わりに出す
    visible_when: Webview に HTML を入れてから 1 秒経っても、最初の `rendered` を送っておらず描けない理由も出ていないとき。`rendered` か描けない理由で消す
    reason: 1 秒未満で描き終えるときに読み込み中が一瞬だけ出てちらつかないようにする（計画書『VS Code 拡張機能』の読み込み中）
    status: planned
    introduced:
      pr: 69
  - name: 描けない理由
    id: preview-error
    kind: status
    component: dev/設計書/部品設計/プレビューの状態の表示.ts#
    args:
      - name: state
        value: '`loadFailed` の `reason`（`offline` / `versionMissing` / `diffUnsupported`）か、バージョンを決められないとき `versionUndecidable`'
      - name: version
        value: 読もうとした版（`versionUndecidable` では渡さない）
    position: 描く先を包む要素
    description: 配布物を読めないときと、差分のパネルで読んだ配布物が差分の表示に対応しないとき、文書の代わりに理由と「リロード」を出す
    visible_when: Webview が `loadFailed` を送ったときか、拡張機能がバージョンを決められず配布物を読まない HTML を入れたとき
    action: 「リロード」を押すと `reload` を送る
    action_ref: dev/設計書/インターフェース定義/VSCode拡張機能/プレビューをリロードする.ts#
    status: planned
    introduced:
      pr: 69
  - name: 設定ファイルを読めない帯
    id: preview-config-band
    kind: status
    component: dev/設計書/部品設計/設定ファイルを読めない帯.ts#
    args:
      - name: path
        value: '`configError.path`（読めない設定ファイルを、インターフェース定義『設定を重ねて読む』の制約「パスの表示」で書き換えたパス）'
      - name: line
        value: '`configError.line`（YAML として読めないとき）'
      - name: settingKey
        value: '`configError.settingKey`（設定の形に合わないとき）'
    position: 描く先を包む要素 > 描いた文書の前
    description: 重ねた設定ファイル（端末の設定を含む）のどれかを読めない・設定の形に合わないことを、端末の設定 → 上 → 近いの順で最初の 1 つだけ、文書を描いたまま文書の先頭で知らせる。固定せずスクロールで流す。描いた文書は React の外の DOM のため、帯の子にせず帯の後ろに並べる
    visible_when: '`configError` を受けてから `configOk` を受けるまで'
    action: 「設定ファイルを開く」を押すと `openConfig` を送る
    action_ref: dev/設計書/インターフェース定義/VSCode拡張機能/設定ファイルを開く.ts#
    status: planned
    introduced:
      pr: 69
  - name: 再生できない動画・音声の知らせ
    id: preview-media-error
    kind: status
    component: dev/設計書/部品設計/再生できない動画・音声の知らせ.ts#
    args:
      - name: kind
        value: '`error` になった要素が `video` なら `video`、`audio` なら `audio`'
      - name: format
        value: 文書に書いたパスの拡張子
      - name: path
        value: 文書に書いたパス
    position: 描く先を包む要素 > 描いた文書 > 再生できない動画・音声の場所
    description: プレビューの Webview が再生できない動画・音声の要素を替える枠。再生できないことと「既定のアプリで開く」を出す
    visible_when: '`video`・`audio` が `error` になったとき'
    action: 「既定のアプリで開く」を押すと `openAsset` を送る
    action_ref: dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#
    refs:
      - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#constraints[再生できない動画・音声]
    status: planned
screen: vscode/src/webview/features/preview/panel/panel-screen.tsx
mock: dev/mock/pages/vscode-preview/342/shadcn/
lead: VS Code 拡張機能が開くプレビューのパネル（Webview）。mdmark が描いた文書と、拡張機能が足す状態の表示を同じパネルの中で切り替える。
refs:
  - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを開く.ts#
  - dev/設計書/インターフェース定義/VSCode拡張機能/プレビューを描き直す.ts#
