  latest: 7.0.2
  checked_on: '2026-11-06'
  source: package.json
  pinning: 完全一致
catalogs:
  - name: コマンド
    version: 7.0.2
    entries:
      - name: tsc --noEmit
        kind: コマンド
        purpose: 型を検査する（変換は esbuild が行う）
      - name: tsc --noEmit -p vscode
        kind: コマンド
        purpose: 'VS Code 拡張機能と Webview（`jsx: react-jsx`）の型を検査する'
lead: TypeScript の型検査と変換をするコンパイラ（`tsc`）。
purl: pkg:npm/typescript@7.0.2
dependency_scope: 開発のみ
adoption: 採用
upstream: microsoft/typescript-go
verification:
  state: 済
  date: '2026-11-06'
  detail: '`tsc --noEmit` を strict・target es2022・moduleResolution bundler で実行し、クラスの非公開メンバー・静的初期化ブロック・`declare const` を含むコードの型エラーが 0 件。`tsc --noEmit` と `tsc --noEmit -p vscode` が React の Webview を含めて 0 件'
license: Apache-2.0（商用利用可）
docs_url: https://www.typescriptlang.org/docs/
install: '```bash

  npm i -D -E typescript@7.0.2 @types/node@24.19.2

  ```


  `@types/node` は `scripts/` とテストが使用する `node:fs` などの型。バージョンは Node.js v24 に合わせる。


  `tools/eslint/` には typescript-eslint のために 6.0.3 を入れる（`npm i -D -E --prefix tools/eslint typescript@6.0.3`）。'
limitations:
  - item: JavaScript の API
    content: 7.0 は `createProgram` などの JavaScript の API を持たない
    notes: typescript-eslint の型の情報は `tools/eslint/` の 6.0.3 から取る
