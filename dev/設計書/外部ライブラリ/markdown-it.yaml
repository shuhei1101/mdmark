title: markdown-it
kind: ライブラリ
version:
  current: 15.0.3
  latest: 15.0.3
  checked_on: '2026-11-04'
  source: package.json
  pinning: 完全一致（15.0.1・15.0.2・15.0.3 で計算量の DoS を修正したため、それより前のバージョンにしない）。依存は lockfile で固定する
catalogs:
  - name: API
    version: 15.0.3
    entries:
      - name: MarkdownIt
        kind: クラス
        purpose: 解析器を作る
        params:
          - name: options.html
            type: boolean
            default: 'false'
            description: Markdown の中の生の HTML を経由する
          - name: options.linkify
            type: boolean
            default: 'false'
            description: スキームの付いた URL を自動でリンクにする（www. 始まりは取得しない）
      - name: parse
        kind: メソッド
        purpose: Markdown をトークン列にする
        params:
          - name: src
            type: string
            required: true
            description: Markdown
          - name: env
            type: object
            required: true
            description: ルールの間で受け渡す値
        returns:
          - name: '-'
            type: Token[]
            description: ブロックのトークン列。行内は `inline` トークンの `children`
      - name: renderer.render
        kind: メソッド
        purpose: トークン列を HTML 文字列にする
        params:
          - name: tokens
            type: Token[]
            required: true
            description: '`parse` の戻り値'
          - name: options
            type: Options
            required: true
            description: 解析器の `options`
          - name: env
            type: object
            required: true
            description: '`parse` に指定した値'
        returns:
          - name: '-'
            type: string
            description: HTML 文字列
      - name: core.ruler.after
        kind: メソッド
        purpose: 解析の後段にトークンを書き換えるルールを追加する
        params:
          - name: afterName
            type: string
            required: true
            description: この名前のルールの後に追加する（`inline` など）
          - name: ruleName
            type: string
            required: true
            description: 追加するルールの名前
          - name: fn
            type: '(state: StateCore) => void'
            required: true
            description: '`state.tokens` を書き換える関数'
      - name: Token.attrSet
        kind: メソッド
        purpose: トークンが描く要素に属性を付ける
        params:
          - name: name
            type: string
            required: true
            description: 属性名
          - name: value
            type: string
            required: true
            description: 値
lead: CommonMark に沿って Markdown をトークン列に解析し、HTML 文字列へ描くパーサー。トークンを書き換えるルールとプラグインで拡張できる。
purl: pkg:npm/markdown-it@15.0.3
dependency_scope: 必須
adoption: 採用
upstream: markdown-it/markdown-it
license: MIT（商用利用可）。依存の entities・linkify-it などは MIT か BSD 系で、まとめた配布物に著作権表示を残す
docs_url: https://markdown-it.github.io/markdown-it/
verification:
  state: 済
  date: '2026-10-13'
  detail: 'PoC #17 で `new MarkdownIt({ html: true })` の `parse()` と `renderer.render()` を Chromium・Firefox・Node で実行し、出力が一致した。`html_block` / `html_inline` のトークンから HTML コメントのマーカーを取得して取り除けた。ライブラリ選定の調査で、`core.ruler.after("inline", …)` に追加したルールで `td_open` に `attrSet("data-label", …)` を付けられること、タスクリストと www の自動リンクを自前のルールで追加できること、取り消し線が `<s>` で出ることを Node 24 で確認した'
selection:
  candidates: markdown-it 15.0.2・marked 18.1.1・micromark 4.0.x + micromark-extension-gfm・remark（unified 一式）を比べた。
  decision: '実ブラウザと Node で同じ出力を返却することを PoC #17 で確認したのは markdown-it だけで、マーカーをトークンの段で取得できる。marked は最も小さいが実ブラウザでの確認が無く、patch のバージョンでも出力が変わる。micromark と remark は `browser` 条件で DOM バージョンの文字参照のデコーダが入り、拡張も記載しにくい。'
  consequences: 'タスクリスト・www の自動リンク・取り消し線の `<del>` は自前のコアルールで追加する。生の HTML を経由する（`html: true`）ため、出力は sanitize-html にかけてから描く。'
install: |-
  ```bash
  npm i -E markdown-it@15.0.3
  ```
