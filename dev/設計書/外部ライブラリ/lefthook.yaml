title: lefthook
kind: CLI
version:
  current: 2.2.2
  latest: 2.2.2
  checked_on: '2026-11-06'
  source: package.json
  pinning: 完全一致
catalogs:
  - name: コマンド
    version: 2.2.2
    entries:
      - name: lefthook install
        kind: コマンド
        purpose: '`.git/hooks` に `lefthook.yml` のフックを入れる'
      - name: lefthook validate
        kind: コマンド
        purpose: '`lefthook.yml` の形を確かめる'
      - name: lefthook run
        kind: コマンド
        purpose: フックを入れずに 1 つのフックの検査を流す
  - name: 設定
    version: 2.2.2
    entries:
      - name: '{staged_files}'
        kind: テンプレート
        purpose: commit に入るファイルのうち `glob` に当たるものを `run` に渡す
lead: Git のフックで走らせる検査を YAML で定め、並べて流すフックの管理ツール。
purl: pkg:npm/lefthook@2.2.2
dependency_scope: 開発のみ
adoption: 採用
upstream: evilmartians/lefthook
used_in:
  - lefthook.yml
  - package.json
verification:
  state: 済
  date: '2026-11-06'
  detail: '`npx lefthook validate` が `All good` を返した。npm の package を入れた時点でフックが入り、commit で pre-commit の 3 つの検査が当たらないファイルを飛ばし、push で pre-push の `npm run test:unit` が走ることを確かめた'
license: MIT（商用利用可）
official_url: https://lefthook.dev/
docs_url: https://lefthook.dev/configuration/
limitations:
  - item: 入れた時点のフック
    content: npm の package の `postinstall` が `.git/hooks` にフックを入れる。worktree では全ての worktree が共有する `.git/hooks` に入る
    notes: '`CI` を付けると止まる（`LEFTHOOK` に 0 以外の値を付けると `CI` でも入れる）。`LEFTHOOK=0` では止まらない'
  - item: worktree のフックの環境変数
    content: Git は worktree のフックに `GIT_DIR`（commit のときは `GIT_INDEX_FILE` も）を渡し、フックから起動したコマンドが引き継ぐ
install: '```bash

  npm i -D -E lefthook@2.2.2

  ```'
