title: "playwright"
kind: "フレームワーク"
version:
  current: 1.64.0
  latest: 1.64.0
  checked_on: '2026-10-13'
  source: package.json
  pinning: 完全一致。`@playwright/test` と `playwright` を同じ版にする
catalogs:
  - name: API
    version: 1.64.0
    entries:
      - name: page.route
        kind: 関数
        purpose: jsDelivr の URL への要求を横取りし、手元の `dist/` か 404 を返す
      - name: route.fulfill
        kind: 関数
        purpose: 横取りした要求に本文と Content-Type を返す
      - name: page.evaluate
        kind: 関数
        purpose: ページの中で `getComputedStyle` を呼ぶ
  - name: コマンド
    version: 1.64.0
    entries:
      - name: playwright test
        kind: コマンド
        purpose: E2E を 3 つのブラウザで流す
      - name: playwright install
        kind: コマンド
        purpose: ブラウザを入れる
      - name: playwright install-deps
        kind: コマンド
        purpose: ブラウザが要る OS のライブラリを入れる（sudo）
lead: Chromium・Firefox・WebKit を操作するブラウザの自動化と、その上のテストランナー（`@playwright/test`）。
purl: pkg:npm/%40playwright/test@1.64.0
dependency_scope: 開発のみ
adoption: 採用
upstream: microsoft/playwright
verification:
  state: 済
  date: '2026-10-13'
  detail: '`page.route()` で jsDelivr の URL への要求を横取りして手元の `dist/` を返し、ページの HTML も同じ仕組みで返して、公開関数と `--mdmark-version` を確かめた。Chromium と Firefox で pass。WebKit は OS のライブラリ（libgtk-4 など）が無く起動できず、`sudo npx playwright install-deps webkit` が要る'
license: Apache-2.0（商用利用可）
docs_url: https://playwright.dev/docs/api/class-page
install: |-
  ```bash
  npm i -D -E @playwright/test@1.64.0 playwright@1.64.0
  npx playwright install chromium firefox webkit
  sudo npx playwright install-deps webkit
  ```
