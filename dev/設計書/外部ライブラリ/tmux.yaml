id: LIB-472-29
title: tmux
kind: CLI
version:
  current: '3.4'
  checked_on: '2026-11-07'
  source: 文書の作成者の端末に入っている tmux（`tmux -V`）
  pinning: 固定しない。`global-setup` は利用者の端末の tmux を呼ぶ
catalogs:
  - name: コマンド
    version: '3.4'
    entries:
      - name: tmux has-session
        kind: コマンド
        purpose: セッションがあるかを終了コードで返却する
        params:
          - name: -t
            type: string
            required: true
            description: '`={セッション名}` で完全一致にする。`=` が無いと前方一致で別のセッションに該当する'
        returns:
          - name: '-'
            type: 終了コード
            description: '`0` はセッションがある'
      - name: tmux new-session
        kind: コマンド
        purpose: 切り離したセッションでコマンドを起動する
        params:
          - name: -d
            type: flag
            required: true
            description: 切り離して起動する
          - name: -s
            type: string
            required: true
            description: セッション名
          - name: -e
            type: string
            required: false
            description: '`{名前}={値}` でセッションの環境変数を指定する。繰り返して指定できる'
          - name: '{コマンド}'
            type: string[]
            required: false
            description: セッションで動かすコマンド。1 つの文字列なら `default-shell` の `-c` で、複数の引数なら直接実行する
        params_example: |-
          ```bash
          tmux new-session -d -s mdmark-mcp -e MDMARK_PORT=8782 sh -c 'npx -y github:shuhei1101/mdmark#v0.10.0 serve 2>&1 | tee -a ~/.local/state/mdmark/serve.log'
          ```
        returns:
          - name: '-'
            type: 終了コード
            description: '`0` はセッションを作った。同じ名前のセッションがあると `1`'
      - name: tmux kill-session
        kind: コマンド
        purpose: セッションを閉じ、中のプロセスを終わらせる
        params:
          - name: -t
            type: string
            required: true
            description: '`={セッション名}` の完全一致'
lead: '`global-setup` が常駐サーバー（`mdmark serve`）を動かす端末多重化のツール。セッションの有無の確認・切り離した起動・閉じる操作に使用する。'
supplier: tmux
dependency_scope: 任意
adoption: 採用
used_in:
  - src/plugin/setup/
upstream: tmux/tmux
verification:
  state: 済
  date: '2026-11-07'
  detail: tmux 3.4 で、`TMUX_TMPDIR` を一時フォルダにして別のセッションで tmux サーバーを先に起動した後、`MDMARK_PORT=9999 tmux new-session -d -s t1 -e MDMARK_PORT=9999 sh -c '…'` ではセッションの中の `MDMARK_PORT` が `9999` になり、`-e` を付けないと空だった。`has-session -t =t1` は 0、`has-session -t =t` はセッション `t1` に該当しなかった。`default-shell` の既定は `/bin/sh`（この端末では dash）
license: ISC
official_url: https://github.com/tmux/tmux
docs_url: https://man7.org/linux/man-pages/man1/tmux.1.html
limitations:
  - item: 環境変数の渡り方
    content: tmux サーバーが既に動いていると、`new-session` を呼んだ側の環境変数は新しいセッションに渡らない。指定する値は `-e` で明示する
  - item: コマンドを実行するシェル
    content: 1 つの文字列で指定したコマンドは `default-shell`（既定は tmux サーバーを起動したときの `$SHELL`、無ければ `/bin/sh`）の `-c` で実行される。dash・fish は `set -o pipefail` を受けずセッションがすぐ閉じるため、`sh -c '…'` を引数として指定して POSIX の記載方法だけを使用する
  - item: 下限のバージョン
    content: 確認したのは 3.4。それより前のバージョンで `new-session -e` があるかは確認していない
  - item: Windows
    content: Windows のネイティブの端末には無い。WSL・macOS・Linux で使用する
