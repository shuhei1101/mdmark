title: "GitHubActions"
kind: "サービス"
version:
  current: ホスト型（版を持たない）
  checked_on: '2026-10-13'
catalogs:
  - name: 設定
    version: ホスト型
    entries:
      - name: on.push.branches
        kind: 設定
        purpose: '`release/v*` への push でジョブを動かす'
      - name: on.push.tags
        kind: 設定
        purpose: '`v*` のタグの push で、タグと配布物の版を照合するジョブを動かす'
      - name: on.pull_request.branches
        kind: 設定
        purpose: master へ向けた PR の更新でジョブを動かす
      - name: permissions
        kind: 設定
        purpose: '`contents: write` で `dist/` を commit して push し、`pull-requests: read`・`issues: read` で hotfix の起点 Issue のラベルを読む'
lead: GitHub のリポジトリのイベントをきっかけに、ワークフローのジョブを GitHub のランナーで動かす CI のサービス（GitHub Actions）。
adoption: 採用
dependency_scope: 開発のみ
verification:
  state: 未確認
  detail: ワークフローへリポジトリの書き込みの権限を与えるかをユーザーへ確かめている途中で、決着するまで書き込むワークフローをリポジトリに置かない。採ると決まったら、検証用のブランチに最小のワークフローを置いて確かめる
docs_url: https://docs.github.com/actions
