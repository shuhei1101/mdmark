summary: 採用済みの外部ライブラリ / 外部ツールのリファレンス
items:
  - page: esbuild.yaml
    summary: TS と CSS を配布物の ES モジュールの JS と CSS に束ねる
  - page: vitest.yaml
    summary: 単体テスト（Node）と結合テスト（実ブラウザ）のランナー
  - page: playwright.yaml
    summary: E2E のブラウザ操作と、結合テストのブラウザの起動
  - page: biome.yaml
    summary: lint と整形の検査
  - page: typescript.yaml
    summary: 型の検査
  - page: markdown-it.yaml
    summary: GitHub Flavored Markdown をトークンに解析し、HTML 文字列にする
  - page: sanitize-html.yaml
    summary: 描く前の HTML からスクリプトと許可していない要素・属性を落とす
  - page: Storybook.yaml
    summary: UI の部品を状態ごとのストーリーとして並べる（サーバー描画）
  - page: valibot.yaml
    summary: テストで拡張の引数の Standard Schema を作る（配布物に束ねない）
  - page: yaml.yaml
    summary: CLI が設定と索引の YAML を読む（配布物に束ねない）
