summary: 採用済みの外部ライブラリ / 外部ツールのリファレンス
items:
  - page: esbuild.yaml
    summary: TS と CSS を配布物の ES モジュールの JS と CSS に束ねる
  - page: esbuild-wasm.yaml
    summary: VS Code 拡張機能が拡張機能ホストの中で設定の extensions を束ねる
  - page: vitest.yaml
    summary: 単体テスト（Node）と結合テスト（実ブラウザ）のランナー
  - page: playwright.yaml
    summary: E2E のブラウザ操作と、結合テストのブラウザの起動
  - page: biome.yaml
    summary: lint と整形の検査
  - page: typescript.yaml
    summary: 型の検査
  - page: markdown-it.yaml
    summary: GitHub Flavored Markdown をトークンに解析し、HTML 文字列にする
  - page: sanitize-html.yaml
    summary: 描く前の HTML からスクリプトと許可していない要素・属性を落とす
  - page: Storybook.yaml
    summary: UI の部品を状態ごとのストーリーとして並べる（react-vite）
  - page: valibot.yaml
    summary: テストで拡張の引数の Standard Schema を作る（配布物に束ねない）
  - page: yaml.yaml
    summary: CLI が設定と索引の YAML を読む（配布物に束ねない）
  - page: lucide.yaml
    summary: 図と記法のアイコンの形
  - page: diff.yaml
    summary: 2 つのリビジョンの Markdown を行と語で比べる（jsdiff）
  - page: vscode.yaml
    summary: VS Code の拡張機能の API（コマンド・設定・エディタ・Webview）
  - page: vsce.yaml
    summary: VS Code の拡張機能を .vsix にまとめる
  - page: test-electron.yaml
    summary: VS Code を取得して起動し、拡張機能ホストの中で結合テストを走らせる
  - page: mocha.yaml
    summary: 拡張機能ホストの中で結合テストを走らせるテストフレームワーク
  - page: MCP-SDK.yaml
    summary: Claude Code のプラグインの MCP サーバーとテストのクライアント
  - page: ClaudeCode.yaml
    summary: プラグインの導入・PreToolUse のフック・プラグインの MCP サーバーの起動
  - page: eslint.yaml
    summary: 束ねた JS を構文木にして規則を当てる（対応ブラウザの下限の確かめと、Webview の React の規則）
  - page: eslint-plugin-compat.yaml
    summary: 対応ブラウザの下限の版に無い API の使用を報告する
  - page: highlight.js.yaml
    summary: コードブロックを言語に応じて色分けする（配布物に束ねず jsDelivr から読む）
  - page: babel-standalone.yaml
    summary: 範囲の TypeScript の型を外して JavaScript にする（配布物に束ねず jsDelivr から読む）
  - page: ajv.yaml
    summary: CLI が設定の aliases を取り込んだ JSON Schema で検証する（配布物に束ねない）
  - page: dev-docs.yaml
    summary: 配信元の文書を MCP で検索・参照する（Claude Code が使い方集を参照する先）
  - page: react.yaml
    summary: VS Code の Webview の画面と hook（React Compiler を含む）
  - page: vite.yaml
    summary: VS Code の Webview を 1 つの JS と CSS に束ねる
  - page: tailwindcss.yaml
    summary: Webview の部品の class とトークン（Preflight を読まない）
  - page: shadcn-ui.yaml
    summary: Webview の部品のソース（Button・Alert・Spinner）
  - page: msw.yaml
    summary: ストーリーと単体テストの配布物の HEAD のモック
  - page: lefthook.yaml
    summary: pre-commit・pre-push の検査
  - page: axe-core.yaml
    summary: テストのときだけパネルをアクセシビリティの規則で検査する
  - page: react-error-boundary.yaml
    summary: Webview の画面の最上位の Error Boundary
  - page: testing-library.yaml
    summary: Webview のコンポーネントと hook の単体テスト
