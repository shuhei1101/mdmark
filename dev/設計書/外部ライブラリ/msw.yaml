id: LIB-472-19
title: msw
kind: ライブラリ
version:
  current: '`msw==3.0.4` / `msw-storybook-addon==3.0.3`'
  latest: 3.0.4
  checked_on: '2026-11-06'
  source: package.json・vscode/package.json
  pinning: 完全一致。`.storybook/public/mockServiceWorker.js` は 3.0.4 の `npx msw init` が記載したもの
catalogs:
  - name: API
    version: 3.0.4
    entries:
      - name: http.head
        kind: 関数
        purpose: jsDelivr の配布物の `HEAD` に回答するハンドラを作る
      - name: HttpResponse
        kind: クラス
        purpose: 状態コードの応答（`new HttpResponse(null, { status })`）と、通信の失敗（`HttpResponse.error()`）を返却する
      - name: delay
        kind: 関数
        purpose: 応答を遅らせ、読み込み中の表示を出す
      - name: setupWorker
        kind: 関数
        purpose: ブラウザの Service Worker でハンドラを動かす（`msw/browser`）
        description: 'Vitest のブラウザでは `test.extend` のフィクスチャで `start({ quiet: true, onUnhandledFrame: "bypass" })`・`resetHandlers()`・`stop()` する。3.0 で `onUnhandledRequest` は `onUnhandledFrame` になった'
      - name: mswLoader
        kind: 関数
        purpose: Storybook でストーリーの `parameters.msw.handlers` を適用する（`msw-storybook-addon/csf3`）
        description: 引数に Service Worker を始めて返却する関数を指定する。3.0 で `initialize` は無くなり、`msw-storybook-addon` の既定の export は CSF Next の `addonMsw` になった
lead: Service Worker で HTTP の要求を横取りし、ハンドラの応答を返却するモックのライブラリ。
purl: pkg:npm/msw@3.0.4
dependency_scope: 開発のみ
adoption: 採用
upstream: mswjs/msw
used_in:
  - vscode/src/webview/testing/msw/handlers.ts
  - tests/unit/vscode/src/webview/msw-test.ts
  - .storybook/preview.tsx
verification:
  state: 済
  date: '2026-11-06'
  detail: '`npm run test:unit` の `unit-browser`（Vitest のブラウザ・Chromium）で `tests/unit/vscode/src/webview/` の 18 ファイルが pass した。`use-load-mdmark` と `panel-screen` のテストで、`HEAD` の 200・404・`HttpResponse.error()` のハンドラが読み込みの失敗の理由を分けた'
license: MIT（商用利用可）
official_url: https://mswjs.io/
docs_url: https://mswjs.io/docs/api
install: '```bash

  npm i -D -E msw@3.0.4 msw-storybook-addon@3.0.3

  npx msw@3.0.4 init .storybook/public --no-save

  ```'
