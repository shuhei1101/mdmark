title: tailwindcss
kind: フレームワーク
version:
  current: '`tailwindcss==4.3.4` / `@tailwindcss/vite==4.3.4`'
  latest: 4.3.4
  checked_on: '2026-11-06'
  source: vscode/package.json
  pinning: 完全一致
catalogs:
- name: 設定
  version: 4.3.4
  entries:
  - name: '@import "tailwindcss/theme.css" layer(theme)'
    kind: CSS
    purpose: テーマの層だけを読む（Preflight を読まず、描いた文書の要素の既定を変えない）
  - name: '@import "tailwindcss/utilities.css" layer(utilities)'
    kind: CSS
    purpose: 使った class のユーティリティだけを書き出す
  - name: '@theme inline'
    kind: CSS
    purpose: '`--color-*: initial` で標準のパレットを外し、自前のトークンだけを class に割り当てる'
  - name: '@utility'
    kind: CSS
    purpose: 任意値の class の代わりに、名前を付けたユーティリティを足す（`grid-cols-alert`）
  - name: '@container'
    kind: class
    purpose: 帯の幅で操作の列を足す（`@band:`）
lead: class 名から CSS を書き出すユーティリティファーストの CSS フレームワーク。v4 は CSS の `@theme` でトークンを定める。
purl: pkg:npm/tailwindcss@4.3.4
dependency_scope: 開発のみ
adoption: 採用
upstream: tailwindlabs/tailwindcss
used_in:
- vscode/src/webview/shared/styles/panel.css
- vscode/vite.config.ts
- .storybook/main.ts
verification:
  state: 済
  date: '2026-11-06'
  detail: '`npm run build`（vscode/）の `media/preview.css` に、使った class と `@theme inline` のトークンだけが入り、Preflight の要素の既定（`*, ::before, ::after` の `border` など）が入らないことを確かめた。Biome は `css.parser.tailwindDirectives` を有効にすると `@theme`・`@utility` を読める'
license: MIT（商用利用可）
official_url: https://tailwindcss.com/
docs_url: https://tailwindcss.com/docs/theme
install: '```bash

  npm i -D -E tailwindcss@4.3.4 @tailwindcss/vite@4.3.4

  ```'
