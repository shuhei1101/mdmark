title: ""
kind: "ライブラリ"
version:
  current: 2.9.1
  latest: 2.9.1
  checked_on: '2026-10-16'
  source: package.json
  pinning: 完全一致。`dependencies` に置き、CLI の配布物に束ねない。依存は lockfile で固定する
catalogs:
  - name: API
    version: 2.9.1
    entries:
      - name: parse
        kind: 関数
        purpose: YAML 1.2 の文字列を 1 文書読んで JavaScript の値にする
        params:
          - name: src
            type: string
            required: true
            description: 読む YAML の文字列
          - name: options.uniqueKeys
            type: boolean
            default: 'true'
            description: 同じマップの中の重なったキーを誤りにするか
          - name: options.maxAliasCount
            type: number
            default: '100'
            description: 展開するエイリアスの上限
        returns:
          - name: '-'
            type: any
            description: 読んだ値。空の文字列は `null`
            notes: 形は検査しない。設定と索引の Schema の検査で確かめる
        status: planned
        introduced:
          pr: 32
      - name: YAMLParseError
        kind: クラス
        purpose: '`parse` が YAML を読めないときに投げる誤り'
        returns:
          - name: code
            type: string
            description: 誤りの種類（`BAD_INDENT`・`DUPLICATE_KEY` など）
          - name: linePos
            type: '[{ line: number; col: number }, { line: number; col: number }]'
            description: 誤りの場所の開始と終わりの行と列（1 始まり）
          - name: message
            type: string
            description: 誤りの内容、行と列、該当行の抜き出し
        status: planned
        introduced:
          pr: 32
lead: YAML 1.2 を読み書きするライブラリ。既定で core スキーマで読み、読めないときは行と列を持つ誤りを投げる。
purl: pkg:npm/yaml@2.9.1
dependency_scope: 必須
adoption: 採用
upstream: eemeli/yaml
license: ISC（商用利用可）。実行時の依存は無い
docs_url: https://eemeli.org/yaml/
verification:
  state: 済
  date: '2026-10-16'
  detail: Node v24.14.0 の ESM から 2.9.1 を `import { parse, YAMLParseError } from "yaml"` で読み、`build` の入った設定をオブジェクトにできること、空の文字列が `null` を返すこと、閉じていない `[` が `YAMLParseError`（`BAD_INDENT`、`linePos` の開始が 3 行 1 列）、重なったキーが `DUPLICATE_KEY`（2 行 1 列）になることを確かめた。`017` は 17、`yes` は文字列、`0o17` は 15 で YAML 1.2 の core スキーマの読み方だった（reviewer の確認）
selection:
  candidates: yaml 2.9.1・js-yaml 5.5.0・confbox 0.3.1・@std/yaml 1.3.0 を比べた。
  decision: 実行時の依存が 0 件で YAML 1.2 を読め、読めないときの行と列がそのまま取れる。js-yaml は CLI 用の argparse を引き、空の入力で例外を投げる。confbox は束ねた js-yaml の修正が再リリースまで届かない。@std/yaml は npmjs に無く、`.npmrc` を持たない使う側の npx で入らない。
  consequences: 戻り値は `any` のため、設定と索引の形は Schema の検査で確かめる。空の設定ファイルは `null` になり、Schema に合わない設定として扱う。
install: |-
  ```bash
  npm i -E yaml@2.9.1
  ```
