verification:
  state: 済
  date: '2026-11-06'
  detail: '`npm run test:unit` の `unit-browser`（Vitest のブラウザ・Chromium）で `tests/unit/vscode/src/webview/` の 18 ファイルが pass した。クリックは `vitest/browser` の `userEvent`（Chromium の実際の入力）で行い、`@testing-library/user-event` は入れない'
