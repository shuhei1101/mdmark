title: testing-library
kind: ライブラリ
version:
  current: '`@testing-library/react==16.3.3` / `@testing-library/dom==10.4.2`'
  latest: 16.3.3
  checked_on: '2026-11-06'
  source: package.json
  pinning: 完全一致
catalogs:
- name: API
  version: 16.3.3
  entries:
  - name: render
    kind: 関数
    purpose: コンポーネントを `document.body` の下に描く
  - name: renderHook
    kind: 関数
    purpose: hook を試すためのコンポーネントの中で呼ぶ
  - name: screen
    kind: 定数
    purpose: role と名前で要素を探す（`getByRole`・`findByRole`）
  - name: act
    kind: 関数
    purpose: 状態の更新と effect を実行し終えてから確認する
  - name: cleanup
    kind: 関数
    purpose: 描いた木を削除する（Vitest は自動で呼ばないため `afterEach` で呼ぶ）
lead: コンポーネントを利用者が確認する role と名前で操作・検査するテストのライブラリ。
purl: pkg:npm/%40testing-library/react@16.3.3
dependency_scope: 開発のみ
adoption: 採用
