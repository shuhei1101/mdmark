title: '@babel/standalone'
kind: CDN の JS
version:
  current: 8.1.1
  latest: 8.1.1
  checked_on: '2026-11-05'
  source: 既定の URL（`https://cdn.jsdelivr.net/npm/@babel/standalone@8.1.1/+esm`）
  pinning: 完全一致。上げるときは範囲の `ts` の変換の結合テストを実行する
catalogs:
- name: API
  version: 8.1.1
  entries:
  - name: transform
    kind: 関数
    purpose: コードの文字列をプリセット・プラグインで変換し、`.code` に出力のコードを返却する
    params:
    - name: code
      type: string
      required: true
      description: 変換するコード
    - name: options.filename
      type: string
      required: false
      description: ファイル名。preset `typescript` は拡張子 `.ts` で TypeScript として読み込む
    - name: options.sourceType
      type: '"module" | "script"'
      required: false
      description: '`module` で ES モジュールとして読み込む'
    - name: options.presets
      type: string[]
      required: false
      description: 使用するプリセット。`typescript` で型の注釈・interface・type・`as` を削除し、enum・namespace を変換する
    - name: options.plugins
      type: string[]
      required: false
      description: 使用するプラグイン。`transform-modules-commonjs` で `export default` を `exports.default` への代入にする
    - name: options.babelrc
      type: boolean
      required: false
      description: '`false` で設定ファイルを探さない'
    - name: options.configFile
      type: boolean | string
      required: false
      description: '`false` で設定ファイルを探さない'
    params_example: |-
      ```js
      const Babel = (await import("https://cdn.jsdelivr.net/npm/@babel/standalone@8.1.1/+esm")).default;
      Babel.disableScriptTags();
      const { code } = Babel.transform(source, {
        filename: "range.ts",
        sourceType: "module",
        babelrc: false,
        configFile: false,
        presets: ["typescript"],
        plugins: ["transform-modules-commonjs"],
      });
      ```
    returns:
    - name: code
      type: string
      description: 変換後のコード
    status: planned
    introduced:
      pr: 303
  - name: disableScriptTags
    kind: 関数
    purpose: ページの `type="text/babel"` の `script` 要素を自動で変換して実行する処理を止める
    status: planned
    introduced:
      pr: 303
- name: ファイル
  version: 8.1.1
  entries:
  - name: +esm
    kind: ES モジュール
    purpose: jsDelivr が `babel.js` を 1 ファイルにまとめた ES モジュール（2,349,009 バイト、gzip 後 572,476 バイト）。他の URL を読み込まない
    status: planned
    introduced:
      pr: 303
lead: Babel のコンパイラと既定のプラグイン・プリセットを 1 ファイルにまとめ、ブラウザなど Node 以外の環境で `transform` を呼べるようにしたパッケージ。
purl: pkg:npm/%40babel/standalone@8.1.1
supplier: Babel の保守者
dependency_scope: 任意
adoption: 採用
upstream: babel/babel
verification:
  state: 済
  date: '2026-11-07'
  detail: '`https://cdn.jsdelivr.net/npm/@babel/standalone@8.1.1/+esm` を、`default-src ''none''; script-src ''nonce-…'' https://cdn.jsdelivr.net` を `<meta http-equiv>` で指定したページ（VS Code のプレビューと同じ構造の CSP）で動的 `import()` し、`disableScriptTags()` と `transform`（preset `typescript`・plugin `transform-modules-commonjs`。enum・namespace・interface・`as` を含むコード）を呼んだ。出力を nonce を付けた `script` 要素で実行し、`exports.default` の関数の呼び出しと、返却した `destroy` の呼び出しまで Chromium と Firefox で通った。読み込みは Chromium で 459ms、Firefox で 550ms（WSL で 1 回の計測）。スクリプトの CSP 違反は 0 件。ファイルに `new Function`・単独の `Function(`・`eval(`・`new Worker`・`WebAssembly.` は出ない。Safari（WebKit）は WSL で起動できず未確認。VS Code 拡張機能の書き出しで埋める経路（#369）: `+esm` の手元のコピーを `bundleExtensions`（esbuild-wasm）でまとめると 1,250ms・2,348,527 文字で、`encodeURIComponent` した `data:text/javascript` の URL は 3,237,500 文字、`buildExportHtml` で記載した HTML は 3,238,521 バイト。その HTML を Chromium で file:// で開き、URL の `import()` は 252ms で通って `transform` を得た。develop の配布物の `mount` に `html-scripts.url` として指定し、`<!-- features: +html-scripts -->` の文書の範囲の `ts` が動いた（通知ブロック 0 件、書き出した HTML 以外の `file:` の要求 0 件、コンソールのエラー 0 件。WSL で 1 回の計測）'
license: MIT。商用利用できる
official_url: https://babeljs.io/docs/babel-standalone
docs_url: https://babeljs.io/docs/babel-standalone
selection:
  candidates: '@babel/standalone 8.1.1・typescript 6.0.3（`transpileModule`）・ts-blank-space 0.9.0・@sveltejs/acorn-typescript 1.0.13 + acorn・sucrase 3.35.1 を、機能適合・API の使用しやすさと OpenSSF の観点で比べた（[比較表](https://github.com/shuhei1101/mdmark/pull/303#discussion_r4475081404)）。WebAssembly が前提の amaro・@swc/wasm-web・oxc-transform・esbuild-wasm は除いた。'
  decision: CLI の esbuild と同じく enum・namespace を含む TypeScript の構文を変換でき、`mount` で描いたときと `export` で書き出したときで動くコードの範囲が変わらない。自作の処理が要らず、保守が活発で来歴の証明がある。読み込み方は、ページの AMD のローダーの影響を受けない `+esm` の動的 `import()` にした（[指摘](https://github.com/shuhei1101/mdmark/pull/303#discussion_r4475105724)）。
  consequences: gzip 後で約 560KB と大きいため、配布物にまとめず、範囲に `ts`・`js` がある文書でだけ読み込む。`+esm` は jsDelivr が再作成したファイルで、npm の来歴の証明と SRI の対象外。URL は範囲のスクリプトの設定の下の専用のキーで差し替える（`libraries` はマーカーの対応表のため使用しない。[指摘](https://github.com/shuhei1101/mdmark/pull/303#discussion_r4475149966)）。キーの名前はインターフェース定義設計で決める。
