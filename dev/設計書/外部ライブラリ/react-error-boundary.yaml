catalogs:
- name: API
  version: 6.1.6
  entries:
  - name: ErrorBoundary
    kind: コンポーネント
    purpose: 描画中と、次の描画でもう一度投げた処理の例外を受け、代わりの表示を出す
    params:
    - name: fallbackRender
      type: '(props: FallbackProps) => ReactNode'
      required: false
      description: 例外を受けたときに出す要素を返却する（`props.error`・`props.resetErrorBoundary` を受ける）
    - name: onError
      type: '(error: unknown, info: ErrorInfo) => void'
      required: false
      description: 例外を受けたときに呼ぶ
lead: React のクラスの Error Boundary を、関数のコンポーネントから props で使用できるようにするライブラリ。
