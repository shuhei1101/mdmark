title: "ER 図: 使い方集"
lead: 使い方集にする `docs/` のページの索引。行ごとに名前・読むとき・概要と、本文にする `docs/` のページを持つ。
overview: 正本はリポジトリの直下の `guide/index.yaml`（YAML の 1 ファイル）。最上位は `schema`（索引のバージョン。整数で今は `1`、必須）と `guides`（行の並び、必須）の 2 つのキーを持ち、ほかのキーを拒む。本文は別に書かず、`docs/` の使い方・リファレンスのページを指す。指したページは `docs/files.yaml` の行にタグ `topic:使い方集` を持ち、Claude Code は dev-docs の配信元 `mdmark` の `docs` の行からタグで絞って参照する。配布物のビルドが索引の形と指すページの有無を検査し、プラグインには写さない
tables:
  - name: guides
    title: 使い方集の行
    datastore: YAML
    summary: 使い方集の名前 1 つと、その本文のページ
    primary_key: name
    scale: ~50
    access: 全件
    columns:
      - name: name
        title: 名前
        type: string
        not_null: true
        primary_key: true
        unique: true
        check: 空でない
        description: 使い方集の名前。索引の中で一意
        example: notation
      - name: when
        title: 読むとき
        type: string
        not_null: true
        check: 空でない
        description: どんな作業のときに読むか
        example: 印と記法を書くとき
      - name: summary
        title: 概要
        type: string
        not_null: true
        check: 空でない
        description: 1 文の概要
        example: 表・注意書き・タブなどの印の一覧
      - name: page
        title: 本文のページ
        type: string
        not_null: true
        check: '`docs/` で始まり `.md` で終わる。区切りは `/`'
        description: 本文にするページ。リポジトリの直下からの相対パス。`docs/files.yaml` のこのページの行にタグ `topic:使い方集` を付ける
        example: docs/リファレンス/記法.md
        notes: 無いページを指すと配布物のビルドが止まる
    status: planned
    introduced:
      pr: 72
refs:
  - dev/設計書/シナリオ/単一ユースケース/使い方集を読む#
  - dev/設計書/インターフェース定義/ライブラリ本体/配布物をビルドする.ts#exceptions[使い方集の索引の誤り（終了コード 1）]
