title: "設定: ライブラリ本体"
lead: 使う側が `mdmark.config.yaml` に書き、使う側のサーバーが読んだオブジェクトを `mount`・`render` の `opts.config` に渡す設定のキー。この一覧はライブラリ本体が読むキーだけを持ち、JSON Schema は `schemas/mdmark.config.schema.json` に置く。
files:
  - file: mdmark.config.yaml
    manages: 機能のオン・オフの既定と、外部ライブラリの対応表
    notes: 使う側のリポジトリに置く。mdmark はブラウザで YAML を読まず、使う側のサーバーが読んだオブジェクトを受け取る
  - file: schemas/mdmark.config.schema.json
    manages: '`mdmark.config.yaml` のうちこの一覧のキーの JSON Schema（draft 2020-12）'
    notes: 他の Issue が足すキー（`index`・`build`・`version` など）を拒まないよう、最上位の `additionalProperties` は許す
settings:
  - key: features
    title: 機能のオン・オフ
    file: mdmark.config.yaml
    type: Record<string, boolean>
    required: false
    default: '全ての機能が `true`'
    description: '機能ごとのオン・オフの既定。文書の `<!-- features: +機能 -機能 -->` がその文書だけ上書きする'
    allowed: 値は真偽値。知らない機能名と真偽値でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
  - key: features.print
    title: 印刷の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 印刷の前に閉じた折り畳みと、タブ・閉じた節・行の詳細を開き、印刷の後に戻す
    reload: reload
    implementation: src/print.ts#attachPrint
  - key: libraries
    title: 外部ライブラリの対応表
    file: mdmark.config.yaml
    type: Record<string, string>
    required: false
    default: '`{}`'
    description: 印の名前から外部ライブラリのモジュールの URL を引く。既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は足す
    allowed: キーは英小文字で始まり英小文字・数字・`-` だけを持つ印の名前。値は URL（相対 URL はページの `document.baseURI` を基準に解決する）。文字列でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#request[opts.config.libraries]
  - key: features.table
    title: 表の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 表の印と、印で囲まない表に、種類ごとの並べ替え・ピン止め・絞り込みと開閉を付ける。オフのときは表の印を取り除いて普通の表を描く
    reload: reload
    status: planned
  - key: features.callout
    title: 注意書きの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 1 行目が `[!NOTE]` などの引用を、種類ごとの題・色・アイコンを持つ枠にする。オフのときは引用のまま描く
    reload: reload
    status: planned
  - key: features.tabs
    title: タブの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- tabs -->` の範囲を見出しで区切ったタブにする。オフのときは範囲の中身をそのまま描く'
    reload: reload
    status: planned
  - key: features.steps
    title: ステップの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- steps -->` の範囲の番号付きリストを手順にする。オフのときは番号付きリストのまま描く'
    reload: reload
    status: planned
  - key: features.tree
    title: ファイルツリーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 言語 `tree` のコードブロックをフォルダとファイルのツリーにする。オフのときはコードブロックのまま描く
    reload: reload
    status: planned
  - key: features.badge
    title: バッジの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 頭に `badge:` を付けた行内のコードを札にする。オフのときは行内のコードのまま描く
    reload: reload
    status: planned
  - key: features.toc
    title: 目次の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- toc -->` の場所に h2〜h3 の目次を置く。オフのときは印を取り除く'
    reload: reload
    status: planned
  - key: features.anchors
    title: 見出しのアンカーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 見出しに、見出しの ID へのリンクを付ける。オフのときもリンクを付けないだけで、見出しの ID は付ける
    reload: reload
    status: planned
  - key: features.sections
    title: 節の開閉の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: h2〜h4 の節を見出しから開閉できるようにする。オフのときは節を囲まず、`section` の印を取り除く
    reload: reload
    status: planned
  - key: features.row-details
    title: 行の詳細の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- row-detail -->` の範囲を表の行の下に開閉して出す。オフのときは範囲の中身を表の後の本文として描く'
    reload: reload
    status: planned
  - key: features.figures
    title: 図表の番号の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- fig -->` の直後の図と表に番号を付け、`#fig-ID` へのリンクの文字を番号にする。オフのときは印を取り除き、リンクの文字を変えない'
    reload: reload
    status: planned
  - key: features.glossary
    title: 用語の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 索引の `terms` と用語集の表の用語に下線と意味のツールチップを付け、`<!-- glossary -->` の表を用語集に入れる。オフのときは印を取り除き、表を普通の表として描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[termsRule]
  - key: features.backlinks
    title: 関連文書の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 文書の末尾に関連文書（被参照）の一覧を置き、索引の文書の `aliases` に一致した語のツールチップに関連文書を出す。オフの文書は参照の表で参照元にも参照先にもならない
    reload: reload
    status: planned
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[backlinksRule]
  - key: index
    title: 索引の場所
    file: mdmark.config.yaml
    type: string
    required: false
    description: 索引の YAML のパス。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読まず、使う側のサーバーが読んだ索引を `opts.index` に渡す。索引の文書の `path` はこの索引のファイルのあるフォルダからの相対パス
    missing: 索引を使わない（使う側が `opts.index` を渡さなければ用語と関連文書を出さない）
    reload: reload
    status: planned
    refs:
      - dev/設計書/ER図/索引#
refs:
  - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#
