title: "設定: ライブラリ本体"
lead: 使う側が `mdmark.config.yaml` に書く設定のキー。使う側のサーバーが読んだオブジェクトを `mount`・`render` の `opts.config` に渡すか、mdmark の CLI が読んで書き出しに使う。この一覧はライブラリ本体と CLI が読むキーを持ち、形の正を JSON Schema `schemas/mdmark.config.schema.json` に置く。
files:
  - file: mdmark.config.yaml
    manages: 機能のオン・オフの既定、外部ライブラリの対応表、索引の場所、CLI の書き出しに埋める CSS と拡張、まとめる文書と書き出す先
    notes: 使う側のリポジトリに置く（`mdmark init` が雛形を置く）。ブラウザの mdmark は YAML を読まず、使う側のサーバーか CLI が読んだオブジェクトを受け取る
  - file: schemas/mdmark.config.schema.json
    manages: '`mdmark.config.yaml` のこの一覧の全てのキーの JSON Schema（draft 2020-12）。CLI の設定の検めと、配布物のビルドの移行の手順の点検がこの Schema を正にする'
    notes: 他の Issue が足すキーを拒まないよう、最上位の `additionalProperties` は許す。形を変えるときは `migrations/next/` に移行の手順か `migrations/no-steps.yaml` の行を置く
settings:
  - key: features
    title: 機能のオン・オフ
    file: mdmark.config.yaml
    type: Record<string, boolean>
    required: false
    default: '`comments` を除く全ての機能が `true`'
    description: '機能ごとのオン・オフの既定。文書の `<!-- features: +機能 -機能 -->` がその文書だけ上書きする'
    allowed: 値は真偽値。知らない機能名と真偽値でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
  - key: features.print
    title: 印刷の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 印刷の前に閉じた折り畳みと、タブ・閉じた節・行の詳細を開き、印刷の後に戻す
    reload: reload
    implementation: src/print.ts#attachPrint
  - key: libraries
    title: 外部ライブラリの対応表
    file: mdmark.config.yaml
    type: Record<string, string>
    required: false
    default: '`{}`'
    description: 印の名前から外部ライブラリのモジュールの URL を引く。既定の対応表に重ね、同じ名前は URL を上書きし、無い名前は足す
    allowed: キーは英小文字で始まり英小文字・数字・`-` だけを持つ印の名前。値は URL（相対 URL はページの `document.baseURI` を基準に解決する）。文字列でない値は無視する
    reload: reload
    implementation: src/config.ts#resolveConfig
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#request[opts.config.libraries]
  - key: features.table
    title: 表の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 表の印と、印で囲まない表に、種類ごとの並べ替え・ピン止め・絞り込みと開閉を付け、印の `highlight=`・`row-color=`・`row-at=` で列と行に色を付ける。オフのときは表の印を取り除いて普通の表を描く
    reload: reload
    status: planned
  - key: features.callout
    title: 注意書きの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 1 行目が `[!NOTE]` などの引用を、種類ごとの題・色・アイコンを持つ枠にする。オフのときは引用のまま描く
    reload: reload
    status: planned
  - key: features.tabs
    title: タブの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- tabs -->` の範囲を見出しで区切ったタブにする。オフのときは範囲の中身をそのまま描く'
    reload: reload
    status: planned
  - key: features.steps
    title: ステップの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- steps -->` の範囲の番号付きリストを手順にする。オフのときは番号付きリストのまま描く'
    reload: reload
    status: planned
  - key: features.tree
    title: ファイルツリーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 言語 `tree` のコードブロックをフォルダとファイルのツリーにする。オフのときはコードブロックのまま描く
    reload: reload
    status: planned
  - key: features.badge
    title: バッジの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 頭に `badge:` を付けた行内のコードを札にし、`badge:` の後ろが色の名前と `:` のときは札にその色を付ける。オフのときは行内のコードのまま描く
    reload: reload
    status: planned
  - key: features.toc
    title: 目次の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- toc -->` の場所に h2〜h3 の目次を置く。オフのときは印を取り除く'
    reload: reload
    status: planned
  - key: features.anchors
    title: 見出しのアンカーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 見出しに、見出しの ID へのリンクを付ける。オフのときもリンクを付けないだけで、見出しの ID は付ける
    reload: reload
    status: planned
  - key: features.sections
    title: 節の開閉の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: h1〜h4 の節を見出しから開閉できるようにする。オフのときは節を囲まず、`section` の印を取り除く
    reload: reload
    status: planned
  - key: features.row-details
    title: 行の詳細の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- row-detail -->` の範囲を表の行の下に開閉して出す。オフのときは範囲の中身を表の後の本文として描く'
    reload: reload
    status: planned
  - key: features.figures
    title: 図表の番号の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- fig -->` の直後の図と表に番号を付け、`#fig-ID` へのリンクの文字を番号にする。オフのときは印を取り除き、リンクの文字を変えない'
    reload: reload
    status: planned
  - key: features.glossary
    title: 用語の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 索引の `terms` と用語集の表の用語に下線と意味のツールチップを付け、索引の `terms[].avoid` と用語集の表のやめた言い方の列のやめた言い方に波線のマーカーと代わりの用語のツールチップを付け、`<!-- glossary -->` の表を用語集に入れる。オフのときは印を取り除き、表を普通の表として描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[termsRule]
  - key: features.backlinks
    title: 被参照の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 文書の末尾に関連文書（被参照）の一覧を置き、索引の文書の `aliases` に一致した語のツールチップに関連文書を出す。オフの文書は参照の表で参照元にも参照先にもならない
    reload: reload
    status: planned
    refs:
      - dev/設計書/モジュール構成/ライブラリ本体/索引と用語.ts#functions[backlinksRule]
  - key: features.text-color
    title: 本文の文字の色の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 角括弧で囲んだ文字の後ろの `{color=色}` で、本文の文字に色の名前の文字の色を付けて太字にする。オフのときは書いた文字のまま描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[本文の文字の色]
  - key: features.images
    title: 画像の属性とキャプションの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 画像の後ろの `{…}` の属性（幅・配置・`nolightbox`・動画と音声の属性）を当て、画像だけの段落を title のキャプションを持つ図にし、`#only-dark`・`#only-light` の画像を今の配色で出し分ける。オフのときは `{…}` を書いた文字のまま描き、画像を今のとおり描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[画像の属性]
  - key: features.gallery
    title: ギャラリーの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- gallery: cols=列の数 -->` の範囲の画像を格子に並べ、`fig` のマーカーの番号にサブ図の番号を付ける。オフのときはマーカーを取り除く'
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[ギャラリー]
  - key: features.lightbox
    title: ライトボックスの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 図の画像を押すと全画面のダイアログで拡大し、同じ文書の画像を前後に送る。オフのときは画像を押しても何もしない
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[ライトボックス]
  - key: features.media
    title: 動画と音声の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 画像の書き方で書いた動画・音声のファイルを、拡張子で判断して再生バー付きの `video`・`audio` にする。オフのときは画像として描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[動画と音声]
  - key: features.gif
    title: GIF の止める・再生するボタンの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: GIF の画像に止める・再生するボタンを付ける。オフのときはボタンを付けない
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書を描く.ts#constraints[GIF の止める・再生する]
  - key: features.cards
    title: リンクと添付のカードの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: リンク 1 つだけの段落を、リンクのカードか添付のカードにする。オフのときはリンクのまま描く
    reload: reload
    status: planned
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTML文字列にする.ts#constraints[リンクと添付のカード]
  - key: index
    title: 索引の場所
    file: mdmark.config.yaml
    type: string
    required: false
    description: 索引の YAML のパス。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読まず、使う側のサーバーが読んだ索引を `opts.index` に渡す。索引の文書の `path` はこの索引のファイルのあるフォルダからの相対パス
    missing: 索引を使わない（使う側が `opts.index` を渡さなければ用語と関連文書を出さない）
    reload: reload
    status: planned
    refs:
      - dev/設計書/ER図/索引#
  - key: theme
    title: 使う側の CSS
    file: mdmark.config.yaml
    type: string
    description: CLI が書き出す HTML に、配布物の CSS の後で埋める使う側の CSS のパス。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読まない
    missing: 使う側の CSS を埋めない
    reload: reload
    allowed: ファイルのパス。読めないときは書き出しを止めず警告に出す
    status: planned
    introduced:
      pr: 32
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/文書をHTMLに書き出す.ts#
  - key: extensions
    title: 拡張のモジュール
    file: mdmark.config.yaml
    type: string[]
    description: CLI が書き出す HTML に束ねて埋め、描く前に `registerExtension` で登録する拡張のモジュールのパスの並び。各モジュールは `registerExtension` に渡す拡張を既定の export にし、読み込みの時点でブラウザの API を使わない（使うのは `load` の中だけ。`mdmark check` が Node で読み込んで `directive` を取る）。`mdmark.config.yaml` のあるフォルダからの相対パス。`mount`・`render` はこのキーを読まない
    default: '[]'
    missing: 拡張を埋めない（拡張の印は知らない印として取り除かれる）
    reload: reload
    allowed: TypeScript か JavaScript のファイルのパス。読めない・束ねられないものは書き出しを止めず警告に出す
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/拡張を登録する.ts#
    status: planned
    introduced:
      pr: 32
  - key: build
    title: まとめる設定
    file: mdmark.config.yaml
    type: object
    description: '`mdmark build` が 1 枚の HTML にまとめる文書と書き出す先。パスと glob は `mdmark.config.yaml` のあるフォルダからの相対。`mount`・`render`・`mdmark export` はこのキーを読まない'
    missing: '`mdmark build` が設定に `build` が無いことを出して終了コード 1 で終わる'
    reload: reload
    status: planned
    introduced:
      pr: 32
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/複数の文書を1枚のHTMLにまとめる.ts#
  - key: build.include
    title: まとめる文書
    file: mdmark.config.yaml
    type: string[]
    required: true
    description: まとめる Markdown の glob の並び。当たった文書を、glob の並び・同じ glob の中はパスの順で並べる
    missing: '`build` の形の誤りとして終了コード 1 で終わる（`mdmark check` は `schema` のずれにする）'
    reload: reload
    allowed: 1 つ以上。`**`・`*`・`?` を使える。当たるのは拡張子 `.md` のファイルだけ
    status: planned
    introduced:
      pr: 32
  - key: build.exclude
    title: 外す文書
    file: mdmark.config.yaml
    type: string[]
    default: '[]'
    description: '`include` に当たった文書から外す glob の並び'
    reload: reload
    allowed: '`include` と同じ書き方'
    status: planned
    introduced:
      pr: 32
  - key: build.glossary
    title: 用語集の文書
    file: mdmark.config.yaml
    type: string[]
    default: '[]'
    description: 用語集の表（`<!-- glossary -->`）の用語を、まとめた全ての文書で効かせる文書のパスの並び。索引が無いときも効く
    missing: 索引に載った文書の用語集の表だけをまとめた全ての文書で効かせる（索引が無ければ、各文書の表はその文書の中だけで効く）
    reload: reload
    allowed: '`include` に当たる文書のパス。当たらないパスは `mdmark check` で `schema` のずれにし、`mdmark build` では警告に出す'
    status: planned
    introduced:
      pr: 32
  - key: build.entry
    title: 最初に開く文書
    file: mdmark.config.yaml
    type: string
    default: '`include` の並びで最初に当たった文書'
    description: まとめた HTML を URL の `#` 無しで開いたときと、URL が 1 枚に無い文書を指すときに出す文書のパス
    reload: reload
    allowed: まとめる文書のパス。当たらないときは `mdmark check` で `schema` のずれにし、`mdmark build` では既定を当てて警告に出す
    status: planned
    introduced:
      pr: 32
  - key: build.out
    title: 書き出す先
    file: mdmark.config.yaml
    type: string
    required: true
    description: まとめた HTML を書くパス。既にあれば上書きする
    missing: '`build` の形の誤りとして終了コード 1 で終わる（`mdmark check` は `schema` のずれにする）'
    reload: reload
    allowed: 拡張子 `.html` のパス。親のフォルダが無ければ作る
    status: planned
    introduced:
      pr: 32
  - key: version
    title: 手元の版
    file: mdmark.config.yaml
    type: string
    required: false
    description: この設定・索引・文書が合わせてある mdmark の版。`mdmark init` が呼んだ CLI の版を書き、`mdmark upgrade` が移行の手順を当てて点検が通った後に呼んだ CLI の版へ書き換える。`mount`・`render`・`export`・`build`・`check` は値で振る舞いを変えない
    missing: '`mdmark upgrade` が利用者に手元の版を聞く（v0.3.0 までの `init` が置いた設定）'
    reload: reload
    allowed: '`^v\d+\.\d+\.\d+$`。合わないと `mdmark check` は `schema` のずれにする'
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/版を上げる.ts#
    status: planned
    introduced:
      pr: 39
  - key: features.diagrams
    title: 図の部品の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- flow -->`・`<!-- sequence -->`・`<!-- chart -->`・`<!-- param -->` の範囲の部品の定義から図と操作できる部品を描く。オフのときは印を取り除き、定義を JSON のコードブロックのまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 42
  - key: features.html
    title: 埋め込んだ HTML の機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- html -->` の範囲の `html` のコードブロックの中身を HTML として描き、中の図の部品の custom element を図にする。オフのときは印を取り除き、コードブロックのまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 45
  - key: features.hints
    title: ヒントの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: 埋め込んだ HTML の `data-hint`、図の箱の `hint`・`io`、線の `tip` のツールチップを出す。オフのときは印とツールチップの中身を出さず、線のラベルと箱の名前は出す
    reload: reload
    status: planned
    introduced:
      pr: 45
  - key: check.ignore
    title: 知らない印から外す名前
    file: mdmark.config.yaml
    type: string[]
    required: false
    default: '[]'
    description: '`mdmark check` が文書の本文の知らない印として知らせない、印と同じ書き方の HTML コメントの名前の並び（`prettier-ignore`・`markdownlint-disable` など他のツールへの指示）。`mount`・`render`・`export`・`build` はこのキーを読まない'
    missing: 印に当たらない名前を全て知らない印として知らせる
    reload: reload
    allowed: 印の名前の書式（英小文字で始まり、英小文字・数字・`-` が続く）の文字列。合わないと `mdmark check` は `schema` のずれにする
    refs:
      - dev/設計書/インターフェース定義/ライブラリ本体/設定と索引を点検する.ts#
    status: planned
    introduced:
      pr: 64
  - key: features.views
    title: ビューの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'true'
    description: '`<!-- view -->` の範囲の表を、ボード表示と表形式を切り替えるビューにする。オフのときは印を取り除き、表のまま描く'
    reload: reload
    status: planned
    introduced:
      pr: 55
  - key: features.comments
    title: コメントの機能
    file: mdmark.config.yaml
    type: boolean
    required: false
    default: 'false'
    description: 読む人が本文の選んだ箇所にコメントを付けられるようにする。使う側が `mount` にコメントの読み書きの関数（`commentStore`）を渡したときだけ効く
    reason: コメントは使う側の保存先が要り、使わない文書で文字を選ぶたびにボタンを出さないため、既定をオフにする
    reload: reload
    status: planned
    introduced:
      pr: 55
  - key: features.code
    title: コードブロックを飾る機能
    file: mdmark.config.yaml
    type: boolean
