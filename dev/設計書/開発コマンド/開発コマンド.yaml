title: "開発コマンド"
categories:
  - name: 環境構築（クローン直後）
    prerequisites:
      - Node.js v24
      - 取り込み後の追従（pull 後）の `npm ci` を流してある
    commands: |-
      結合テストと E2E テストが使う Chromium と Firefox を入れる。

      ```bash
      npx playwright install chromium firefox
      ```
    effects: '`~/.cache/ms-playwright` に Chromium と Firefox（合わせて数百 MB）をダウンロードする。一度入れれば、どの作業ツリーからも使える'
    verification:
      state: 済
      date: '2026-10-13'
      detail: コマンドが終了コード 0 で終わり、続けて `npm run test:integration` のブラウザテストと `npm run test:e2e` の Chromium・Firefox が通ることを確かめた
  - name: 取り込み後の追従（pull 後）
    prerequisites:
      - Node.js v24
    commands: |-
      ```bash
      npm ci
      ```

      VS Code 拡張機能を触るときは、`vscode/` の依存も入れる。

      ```bash
      npm --prefix vscode ci
      ```
    effects: '`node_modules/` を `package-lock.json` のとおりに作り直す'
    verification:
      state: 済
      date: '2026-10-13'
      detail: '`npm ci` が終了コード 0 で終わり、脆弱性 0 件を確かめた。`npm --prefix vscode ci` は `vscode/` をまだ実装していないため走らせていない'
  - name: 依存の追加・更新・削除
    commands: |-
      版を完全一致で固定して追加・更新する。

      ```bash
      npm i -D -E {パッケージ}@{版}
      ```

      外す。

      ```bash
      npm uninstall {パッケージ}
      ```
    effects: '`package.json` と `package-lock.json` を書き換える'
    verification:
      state: 済
      date: '2026-10-13'
      detail: 追加は vitest・esbuild・typescript・@biomejs/biome・@types/node で、外すのは作業ツリーの控えで `@types/node` を外し、`package.json` から消えることを確かめた
  - name: 起動・停止
    prerequisites:
      - '`npm ci` で依存を入れてある'
    commands: |-
      Storybook で部品を見る。

      1. 描画の口を立てる（`Ctrl+C` で止める）

      ```bash
      RENDER_PORT={描画の口のポート} npm run storybook:render
      ```

      2. 別の端末で Storybook を立てる（`Ctrl+C` で止める）

      ```bash
      RENDER_ORIGIN=http://127.0.0.1:{描画の口のポート} npm run storybook -- --host 127.0.0.1 --exact-port -p {ポート}
      ```

      手元のプラグインを Claude Code で確かめる。

      1. プラグインをビルドする（`plugin/` に MCP サーバー・フック・使い方集・配布物が書かれる）

      ```bash
      npm run build
      ```

      2. `plugin/` に実行時の依存を入れる（ローカルのパスで足したマーケットプレイスでは Claude Code が依存を入れない）

      ```bash
      (cd plugin && npm ci)
      ```

      3. 作業ツリーをマーケットプレイスとして足し、プラグインを入れる

      ```bash
      claude plugin marketplace add {作業ツリーの絶対パス}
      claude plugin install mdmark@mdmark
      ```

      4. 確かめ終えたらプラグインとマーケットプレイスを外す

      ```bash
      claude plugin uninstall mdmark@mdmark
      claude plugin marketplace remove mdmark
      ```
    verification:
      state: 済
      date: '2026-10-23'
      detail: Storybook の分は 2026-10-16 に確かめた（`RENDER_PORT=46601 npm run storybook:render` と `RENDER_ORIGIN=http://127.0.0.1:46601 npm run storybook -- --host 127.0.0.1 --exact-port -p 46602` を立て、`/index.json` に 57 個のストーリー（13 個の部品）が載ることを確かめた。Playwright で開いた `iframe.html?id=` の 57 個のストーリーが、`#storybook-root` にエラー無く描かれた。`kill` で止めると待受が閉じた）。プラグインの分は、手元の設定を書き換えないよう `CLAUDE_CONFIG_DIR` に空のフォルダを指して、手順 4 つを流して確かめた（`npm run build` が `plugin/` の生成物を書き、`plugin/` の `npm ci` が終了コード 0、`claude plugin marketplace add`・`install` が終了コード 0 で `claude plugin list` に `mdmark@mdmark` が有効で出て、`uninstall`・`marketplace remove` で空に戻った）
    effects: プラグインの確かめは、手元の Claude Code の設定にマーケットプレイスとプラグインを書き、`plugin/` に `node_modules/` を作る。外すコマンドで戻す。設定を書き換えたくないときは、`CLAUDE_CONFIG_DIR` に空のフォルダを指して流す
  - name: テスト
    refs:
      - dev/設計書/テスト/テスト実行方法#
  - name: 静的検査
    commands: |-
      lint と整形（Biome）。

      ```bash
      npm run lint
      ```

      型検査（TypeScript）。

      ```bash
      npm run typecheck
      ```
    verification:
      state: 済
      date: '2026-10-13'
      detail: どちらも違反・型エラー 0 件で終わることを確かめた
  - name: ビルド・生成
    prerequisites:
      - '`npm ci` で依存を入れてある'
      - 移行の手順の点検に git の版のタグが要る（`git fetch --tags`）。タグが無い clone、git の作業ツリーでないフォルダでは、スキーマの比較を飛ばす
    commands: |-
      `version.ini` の版を埋めて `dist/` に配布物を書く。

      ```bash
      npm run build
      ```

      渡した版を埋めて書く。

      ```bash
      npm run build -- --version v{版}
      ```

      VS Code 拡張機能を `vscode/dist/extension.cjs`・`vscode/media/preview.js`・`vscode/media/preview.css` にビルドし、型を検査する。

      ```bash
      npm --prefix vscode run build
      npm --prefix vscode run typecheck
      ```

      `vscode/mdmark-{バージョン}.vsix` を作る（`vscode:prepublish` でビルドも流れる）。

      ```bash
      npm --prefix vscode run package
      ```
    effects: '`dist/` を前回の分を消してから書き直す。`index.js`・`index.css`・`THIRD_PARTY_LICENSES.txt`・ CLI の `cli.js`・書き出した HTML に埋める `viewer.js`・`viewer.css` のほかに、`tsconfig.dist.json` で `tsc` を流して型定義（`index.d.ts` と、それが読み込む `.d.ts`）を書く。版の書式が違う・`version.ini` を読めない・設定・索引の JSON Schema（`schemas/`）を最新の版のタグから変えたのに移行の手順（`migrations/next/steps.yaml`）も手順なしの一覧（`migrations/no-steps.yaml`）の合う行も無い・release のビルドで `migrations/next/` が残っている・移行の手順の形が合わない・esbuild か `tsc` が失敗する・`index.js`・`index.css` が 256KB を超える・`viewer.js` が `</script` の並びを持つ・使う側のブラウザが読む JS（`index.js`・`view.js`・`comments.js`・`viewer.js`）が対応ブラウザの下限（Chrome 99・Firefox 98・Safari 16.4）に無い API を、同じ API の `typeof` で確かめる `if` のブロックの外で使うと、終了コード 1 で終わり `dist/` は残らない。下限に無い API で止まったときは、標準エラーの API を `if (typeof {API} !== "undefined")` のブロックの中で使う形に直す（早期 return の後ろと三項演算子では使わない）。続けて Claude Code プラグインの生成物（`plugin/server/mcp.js`・`plugin/scripts/session-start.js`・`plugin/dist/`・`plugin/guide/`・`plugin/THIRD_PARTY_LICENSES.txt`）も前回の分を消して書き、使い方集の索引（`guide/index.yaml`）の形・指すページ・文字数の上限、`plugin/package.json` の依存のバージョンと `plugin/package-lock.json`、取り込まれたパッケージのライセンスの本文（`scripts/licenses/`）に問題があると、終了コード 1 で終わり `dist/` も `plugin/` の生成物も残らない'
    verification:
      state: 済
      date: '2026-10-23'
      detail: '`npm run build` が終了コード 0 で終わり、`dist/` に `index.js`・`index.css`・`THIRD_PARTY_LICENSES.txt`・`cli.js` と型定義が書かれることを確かめた。スキーマをタグ v0.3.0 から変えたのに `migrations/no-steps.yaml` の合う行が無いと終了コード 1 で `dist/` が残らず、行を置くと通ること、`--version v0.4.0` のビルドで `migrations/next/` が残ると終了コード 1 で終わることを確かめた。`--version` の指定と、版の書式の誤り・`version.ini` の欠け・esbuild の失敗・上限超過のとき `dist/` が残らないこと、型定義が `--moduleResolution bundler` と `nodenext` の使う側で型検査を通ること、移行の手順の点検の分岐は、単体テストで確かめた。2026-10-23 に、`npm run build` が終了コード 0 で `plugin/` の生成物を書くことを確かめた。`plugin/` の失敗の分岐は単体テストで確かめた。VS Code 拡張機能のコマンドは `vscode/` を実装して走らせた（2026-10-23）。`npm --prefix vscode run build` が終了コード 0 で終わり、`vscode/dist/extension.cjs`（`require("vscode")` を持つ）・`vscode/media/preview.js`・`vscode/media/preview.css` が書かれ、`npm --prefix vscode run typecheck` が終了コード 0 で通る。`npm --prefix vscode run package` が `vscode:prepublish` のビルドも流して `vscode/mdmark-0.1.0.vsix`（`package.json`・`readme.md`・`dist/extension.cjs`・`media/preview.css`・`media/preview.js` の 7 ファイル、73KB。`src/`・`node_modules/` を含まない）を書く。LICENSE が無いと `vsce` が警告を出すが、終了コードは 0'
  - name: 取り込み前の検査
    commands: 未確定
  - name: 管理作業
    prerequisites:
      - タグを打つ担当（tester）が、master へマージする前に対象のブランチの worktree で流す
      - release は `version.ini` を打つ版へ更新した後、hotfix は打つ版を決めた後
    commands: |-
      1. 依存を lock どおりに入れる

      ```bash
      npm ci
      ```

      2. 出していない版の移行の手順を打つ版へ移し、`migrations/no-steps.yaml` の `version: next` を打つ版に書き換えて commit する（`migrations/next/` が無ければ `git mv` を、`version: next` の行が無ければ `sed` を飛ばす。どちらも無ければ手順ごと飛ばす）

      ```bash
      git mv migrations/next migrations/v{版}
      sed -i 's/version: next$/version: v{版}/' migrations/no-steps.yaml
      git add migrations
      git commit -m "chore: 移行の手順を v{版} へ移す"
      ```

      3. 打つ版を埋めてビルドする

      ```bash
      npm run build -- --version v{版}
      ```

      4. `dist/` と `plugin/` に差分があるかを確かめる（出力が空なら手順 5 を飛ばす）

      ```bash
      git status --porcelain dist plugin
      ```

      5. `dist/` と `plugin/` を commit して対象のブランチへ push する

      ```bash
      git add dist plugin
      git commit -m "v{版} の配布物を入れる"
      git push origin {対象のブランチ}
      ```

      VS Code 拡張機能を出すときは、`vscode/package.json` の `version` を出すバージョンにした commit が master に入った後、タグと `version` を照合してからタグを打つ（GitHub Actions の `vscode-release.yml` が .vsix を作り、そのタグの GitHub Release に添える）。mdmark の `v{版}` のタグと混ぜない。

      ```bash
      npm --prefix vscode run release:check -- vscode-v{バージョン}
      git tag vscode-v{バージョン}
      git push origin vscode-v{バージョン}
      ```
    effects: 対象のブランチへ `dist/` と `plugin/` の commit を push する。どちらも変わらなければ commit は要らない
    verification:
      state: 未確認
      detail: 手順 1・2・3・4（`npm ci`、移行の手順の移し、`npm run build -- --version v{版}`、`git status --porcelain dist` が `dist/` の差分を出す）は、一時の clone で `--version v0.4.0` を使って確かめた。`migrations/next/` が無いときは `git mv` が失敗するので飛ばし、`sed` 以降でビルドが通る。`plugin/` を足した手順 4・5 は、`npm run build` が `plugin/` の生成物を書くことまでを確かめた。手順 5 は対象のブランチへ push して外へ書き込むため走らせていない。VS Code 拡張機能のタグの照合（`npm --prefix vscode run release:check -- vscode-v0.1.0`）は、`package.json` の `version` が `0.1.0` のとき終了コード 0 で通り、`vscode-v0.2.0` のときは両方のバージョンを標準エラーに出して終了コード 1 で止まることを確かめた。タグの push は外へ書き込むため走らせていない
