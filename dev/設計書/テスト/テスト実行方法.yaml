title: テスト実行方法
layers:
  - name: 非機能要件テスト
    run_all: 未確定
  - name: E2E テスト
    description: Playwright（`@playwright/test`）を Chromium と Firefox の 2 つのプロジェクトで実行する。ブラウザを使用しない『配布物をビルドして検査する』『拡張機能の配布物を作る』は Chromium のプロジェクトだけで流れ、Firefox の分は skip になる。Playwright の `globalSetup` は、E2E を実行するたびに（VS Code 拡張機能のシナリオを選ばないときも）ワーカーの前で VS Code 1.141.0 を 1 回だけ取得する。VS Code 拡張機能のシナリオは、`tests/e2e/vscode.ts` がその実行ファイルを Playwright の `_electron` で起動して操作する（Chromium のプロジェクトだけ）。拡張機能はこのブランチのソースを一時フォルダにビルドして `--extensionDevelopmentPath` に指定し、jsDelivr と GitHub のタグ一覧は `MDMARK_VSCODE_DIST_BASE`・`MDMARK_VSCODE_TAGS_URL` で手元の代役に差し替える。待ちの既定は 30 秒（`playwright.config.ts` の `expect.timeout`）
    prerequisites:
      - '`npm ci` で依存を入れ、`npx playwright install chromium firefox` でブラウザを入れてある'
      - 『配布物をビルドして検査する』が一時フォルダのクローンで `npm ci` を実行し、『GitHubの参照から入れてCLIを起動する』が一時の Git のリポジトリから `npm exec` で入れるため、npm レジストリへの接続が要る
      - VS Code 拡張機能のシナリオは `npm --prefix vscode ci` で拡張機能の依存を入れ、Node は 24 を使用する。ヘッドレスの Linux では `xvfb-run -a` を付けて実行する
      - 『ClaudeCodeにプラグインを入れる』は GitHub のブランチからプラグインを入れるため、開発コマンド『管理作業』の手順 3〜5 を release ブランチで済ませた後に実行する
      - 『ガイドを参照する』『ClaudeCodeでガイドを参照して記載し点検する』は dev-docs を起動するため、dev-docs のクローンに依存（`.venv`）を入れてある。クローンの場所は環境変数 `DEV_DOCS_CLONE`、無ければ `~/.config/dev-docs/settings.yaml` の `clone` を使用する。`search_docs` の 1 回の呼び出しの時間切れは 135 秒（dev-docs に所要時間の公開仕様が無く、実測が 1,000 回に満たないため、起動した dev-docs への 30 回の実測の最大 89.4 秒にその 50% を加えた仮の値。起動の直後の 1 回目が最も遅い）。呼び出しを 2 回含む `test_normal` の待ちは 405 秒（時間切れの合計 270 秒と、その 50% の余裕）
      - '`globalSetup` は `npm --prefix vscode ci` で入れた `@vscode/test-electron` で VS Code を取得するため、どの E2E を実行するときも（VS Code 拡張機能のシナリオを選ばないときも）`npm --prefix vscode ci` が要る。`vscode/.vscode-test/` に無いときは `update.code.visualstudio.com` から取得する'
      - '`mdmark serve` を起動するケースは `MDMARK_PORT` に空きポートを指定して起動し、どのケースも 8782 を使用しない（手元の `mdmark serve` が使用する）'
    run_all: |-
      ```bash
      npm run test:e2e
      ```
    run_one:
      label: シナリオ
      command: |-
        ```bash
        npx playwright test {シナリオファイルパス}
        ```
    duration: 全件で約 10 分（作業ツリーのクローンと `npm ci`、VS Code の起動を含む。VS Code を起動するシナリオが大半を占める）。初回は VS Code の取得が加わる
    external_cost: 無料。npm レジストリへ接続する。jsDelivr へは接続せず、`page.route()` で手元の応答に差し替える
  - name: 結合テスト（フロント）
    description: Vitest の `integration-node`（ビルドの入口を子プロセスで実行する・ビルドした配布物を Node で読み込む・Claude Code プラグインの MCP サーバーとフックを実行する）と `integration-browser`（ビルドした配布物を Chromium で読み込む）と `integration-storybook`（部品の描画のインターフェースと Storybook を空きポートで起動し、ストーリーを Playwright で開く。起動に約 40 秒。続けて Chromium を 1 つ起動し、最初のストーリーを開いて Vite が依存をまとめ終えるまで待ち、約 1 分かかる。各ファイルはその Chromium に接続してストーリーを開き、開いたページをテストごとに閉じる）の 3 つで実行する。3 つが同時に実行するファイルの数は、合計で CPU 数の半分（3 つに同じ `maxWorkers`）までにする。VS Code 拡張機能の結合テストは Vitest でなく、補足「VS Code 拡張機能」のコマンドで別に実行する
    prerequisites:
      - '`npm ci` で依存を入れ、`npx playwright install chromium` で Chromium を入れてある'
      - Claude Code プラグインの結合テスト（`tests/integration/ClaudeCodeプラグイン/`）は、ビルドした `dist/cli.js` の MCP サーバーと `plugin/` のフックを実行する。Claude Code を起動しない
      - MCP サーバーは、ビルドした `dist/cli.js` の `serve` を `MDMARK_PORT` に空きポートを指定して子プロセスで起動し、`StreamableHTTPClientTransport` で MCP のクライアントとつなぐ（作業のフォルダーはツールの引数 `project_dir` で指定する）。ポートの上書き・使用中・不正な値を確認するケースは、`MDMARK_PORT` を指定して起動する
      - どのケースも 8782 を使用しない（手元の `mdmark serve` が使用する）
      - フックは `hooks/hooks.json` の PreToolUse のコマンドを、`CLAUDE_PLUGIN_ROOT` を `plugin/` にして子プロセスで実行する
    run_all: |-
      ```bash
      npm run test:integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --project 'integration*' {テストファイルパス}
        ```
    notes:
      VS Code 拡張機能: |-
        `@vscode/test-electron` が VS Code 1.141.0 と stable を起動し、拡張機能ホストの中で mocha が `vscode/tests/integration/*.test.ts`（ビルドした `vscode/out/test/*.test.mjs`）を実行する。Webview の DOM は拡張機能がテストのときだけ返却する `inspectPreview` で確認する。`vscode` を import しない処理は単体テスト（フロント）の `unit` プロジェクトが `tests/unit/vscode/` で実行する。

        前提: `npm ci` と `npm --prefix vscode ci` で依存を入れ、Node は 24 を使用する（`PATH` の先頭の `node` が古いと、拡張機能の配布物を作るテストが落ちる）。代役の配信が配る配布物は、テストの入口がこのブランチのソースを一時フォルダにビルドして用意する。ヘッドレスの Linux では `xvfb-run` を入れてある。

        ```bash
        xvfb-run -a npm --prefix vscode run test:integration
        ```

        初回と stable が上がったときは VS Code を `vscode/.vscode-test/` に取得する。jsDelivr と GitHub へは接続せず、`MDMARK_VSCODE_DIST_BASE`・`MDMARK_VSCODE_TAGS_URL` で手元の代役に差し替える（`MDMARK_VSCODE_DIST_BASE` は `http://127.0.0.1:{ポート}/mdmark` の構造で、配布物は `/mdmark@{バージョン}/dist/{ファイル}` で参照する）。VS Code のバージョンごとに新しい `--user-data-dir` で起動し、前回のバージョンが空の状態から始める。ユーザーデータの `User/settings.json` に `workbench.colorTheme` を `Dark 2026`（VS Code の既定のダークのテーマ）で配置し、パネルの axe の検査を起動ごとに同じテーマで確認する（空のユーザーデータのままだと、既定と違うテーマで描くことがある）
  - name: 結合テスト（バック）
    run_all: 未確定
  - name: 単体テスト（フロント）
    description: Vitest の `unit` プロジェクト（Node）と、DOM を使用する `*.browser.test.ts` を実行する `unit-browser` プロジェクト（Chromium）で実行する
    prerequisites:
      - '`npm ci` で依存を入れ、`npx playwright install chromium` で Chromium を入れてある'
    run_all: |-
      ```bash
      npm run test:unit
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        npx vitest run --project 'unit*' {テストファイルパス}
        ```
    notes:
      単体と結合を続けて実行する: |-
        ```bash
        npm test
        ```

        `npm run test:unit` のあとに `npm run test:integration` を実行する。E2E は含まない。
  - name: 単体テスト（バック）
    run_all: 未確定
  - name: 外部疎通テスト
    run_all: 未確定
  - name: lint
    description: Biome の check（lint と整形）と、Webview（`vscode/src/webview/`）の ESLint（`tools/eslint/` の ESLint 9）と、ルートと VS Code 拡張機能（`vscode/`）の tsc の型検査。どれかが失敗しても全てを最後まで回し、1 つでも失敗したら失敗で終える。
    prerequisites:
      - '`npm ci` で依存を入れてある（`tools/eslint/` の依存は、無ければ `npm run lint:eslint` が起動の前に入れる）'
      - '`vscode/` の依存を入れてある（`npm --prefix vscode ci`）'
    run_all: |-
      ```bash
      (rc=0; npm run lint || rc=1; npm run lint:eslint || rc=1; npm run typecheck || rc=1; npm --prefix vscode run typecheck || rc=1; exit $rc)
      ```
