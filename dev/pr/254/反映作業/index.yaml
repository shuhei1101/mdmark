配信元の登録:
  説明: 端末の設定（~/.config/dev-docs/settings.yaml）の sources[] に、develop の worktree の dev-docs.yaml（/mnt/c/Users/shuhe/repo/mdmark/.claude/worktrees/develop/dev-docs.yaml）を指す mdmark の行を追加し、dev-docs に設定を読み直させる。scope は read を /mnt/c/Users/shuhe/repo/mdmark/**、write を /mnt/c/Users/shuhe/repo/mdmark/.claude/worktrees/** にする
  タグ: [設定の変更]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 配信元の登録/疎通確認.py
  実行: 配信元の登録/実行.py
  確認: 配信元の登録/確認.py
  切り戻し: 配信元の登録/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: dev-docs の describe() の一覧に mdmark が出て、search_docs（source が mdmark、group_by が tags）がタグごとの件数を返し、返ったタグの 1 つで絞った search_docs が文書を返す
  状態: "-"
