use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エディタとプレビューのスクロールを合わせる.yaml
    impact: changed
    detail: 折りたたんだセクションの中を編集しているとき、プレビューがそのセクションの見出しの辺りへ追従し、セクションを開かないシナリオを追加する
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/VSCodeで記載しながら確認してPDFにする.yaml
    impact: run_only
    detail: 記載しながらプレビューで確認する流れは変わらないが、スクロールの同期を直したときに壊しうる
    depends_on: []
docs: []
scope_out:
  - item: 折りたたんだセクションの中を編集しているときに、プレビューがセクションを自動で開く振る舞い
    reason: Issue は見出しの辺りへの追従の確認を求めており、自動で開くことは要望に含まれない
    plan: none
  - item: 開閉のボタンで手で閉じたセクションが、編集で描き直すたびにマーカーのとおりの開閉（既定は開いた状態）へ戻る振る舞い
    reason: '判断が分かれるためレビューで確定する。`MountHandle.update` は本文を描き直し、描く前のセクションの開閉を引き継がないとコードから読める（`src/mount.ts`・`src/interact/sections.ts`）。スクロールの追従ではなく描き直しの状態の引き継ぎの問題で、この作業 PR がマージされなくても同じ内容で成り立つため、別の Issue に切り出すのが推奨。この作業 PR のシナリオは `<!-- section: closed -->` で閉じたセクションを対象にする'
    plan: '440'
