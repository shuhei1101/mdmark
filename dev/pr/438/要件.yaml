    scenario: dev/設計書/シナリオ/単一ユースケース/表を操作する.yaml
    impact: changed
    detail: ピン止めのボタンを押した列だけが留まり、複数の列を選べる。留めた列はその列より左を表示している間は右端に、過ぎた後は左端に留まる。設定で押した列までを留める動きも選べる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/機能のオン・オフを文書で上書きする.yaml
    impact: run_only
    detail: 表の機能をオフにした文書でピン止めのボタンが出ないことが、ピン止めの持ち方の変更で壊れないかを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/文書をHTMLに書き出す.yaml
    impact: run_only
    detail: 書き出した HTML の表にピン止めのボタンが付くことが、設定のキーの追加で壊れないかを確かめる
    depends_on: []
