連絡ボードの暫定の行の削除:
  説明: mdmark の連絡ボードの節 `共通` の行「結合テストの全件は maxWorkers=4 で流す」の削除を、起点 Issue に `確認:task-planner` を付けて task-planner へ依頼する。並列の上限を vitest.config.ts へ入れた develop で有効になるため、作業 PR のマージの後に行う
  タグ: [連絡ボード]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 連絡ボードの暫定の行の削除/疎通確認.py
  実行: 連絡ボードの暫定の行の削除/実行.py
  確認: 連絡ボードの暫定の行の削除/確認.py
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返却する
  確認方法: 連絡ボードの節 `共通` に、タイトル「結合テストの全件は maxWorkers=4 で流す」の行が無い
  状態: "-"
