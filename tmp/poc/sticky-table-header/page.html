<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoC: 見出し行と集計の行を画面の端に留める</title>
    <link rel="stylesheet" href="/dist/index.css" />
    <style>
      body {
        margin: 0;
      }
      /* ずれを渡すときのサイトのヘッダーの代役 */
      .site-header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        height: 48px;
        background: #334;
        color: #fff;
      }
      main {
        padding: 0 16px;
      }
      .spacer {
        height: 900px;
      }
    </style>
    <link rel="stylesheet" href="./sticky.css" />
  </head>
  <body>
    <!-- ずれ 48px の計測でだけ出す -->
    <div class="site-header" hidden>ヘッダー</div>
    <main>
      <div class="spacer">表の前の本文</div>
      <div id="doc"></div>
      <div class="spacer">表の後の本文</div>
    </main>
    <script type="module">
      import { mount } from "/dist/index.js";
      import { install } from "./sticky.js";

      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") ?? "c";
      const offset = Number(params.get("offset") ?? 0);
      if (offset > 0) {
        document.querySelector(".site-header").hidden = false;
      }
      document.documentElement.style.setProperty("--poc-sticky-top", `${offset}px`);

      const columns = ["名前", "区分", "数量", "単価", "担当", "状態", "開始日", "終了日", "場所", "備考1", "備考2", "備考3"];
      const rows = Array.from({ length: 200 }, (_, i) => [
        `項目 ${i + 1}`,
        ["A", "B", "C"][i % 3],
        String((i * 7) % 50),
        String(100 + i),
        `担当者 ${i % 9}`,
        ["未着手", "進行中", "完了"][i % 3],
        "2026-10-01",
        "2026-11-30",
        `第 ${i % 5} 倉庫の棚`,
        "長めの備考の文字列が入るセル",
        "長めの備考の文字列が入るセル",
        "長めの備考の文字列が入るセル",
      ]);
      const markdown = [
        "<!-- table: data +columns +total filter=区分,状態 total=数量:sum,単価:avg -->",
        "",
        `| ${columns.join(" | ")} |`,
        `| ${columns.map(() => "---").join(" | ")} |`,
        ...rows.map((r) => `| ${r.join(" | ")} |`),
        "",
        "<!-- /table -->",
      ].join("\n");
      const el = document.getElementById("doc");
      mount(el, { markdown });
      window.poc = install(el, mode);
      document.documentElement.dataset.ready = "1";
    </script>
  </body>
</html>
