# mdmark の設定。パスと glob は、このファイルのあるフォルダからの相対パスで書く

# この設定・索引・文書が合わせてある mdmark の版（mdmark upgrade が書き換える）
version: v0.0.0

# 索引の YAML
index: index.yaml

# 書き出した HTML に埋める、使う側の CSS
theme: theme.css

# 書き出した HTML に埋める拡張のモジュール（使うときは次の行の # を外す）
# extensions: [extensions/example.ts]

# 配色のテーマ。dev-swiss・theme-paper・theme-slate・theme-contrast のどれか（使うときは次の行の # を外す）
# colorTheme: theme-paper

# mdmark build がまとめる文書と、書き出す先
build:
  include: ["**/*.md"]
  exclude: ["node_modules/**"]
  out: dist/docs.html
