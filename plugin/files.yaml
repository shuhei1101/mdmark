    description: モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「名前・説明・バージョン（バージョンはビルドが記載する）」を受け持つ。プラグインの配布物の作り方を変えるときに読み込む。
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild]
