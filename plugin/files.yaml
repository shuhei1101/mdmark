# yaml-language-server: $schema=../schemas/files.schema.yaml
files:
  - path: .claude-plugin/plugin.json
    description: モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「名前・説明・バージョン（バージョンはビルドが記載する）」を受け持つ。プラグインの配布物の作り方を変えるときに参照する。
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild]
    related:
      - to: docs/module/MOD-472-14.ts
        type: implements
  - path: .mcp.json
    description: 'モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「type: http で http://127.0.0.1:${MDMARK_PORT:-8782}/mcp につなぐ」を受け持つ。プラグインの配布物の作り方を変えるときに参照する。'
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild, tool:mcp]
    related:
      - to: docs/module/MOD-472-14.ts
        type: implements
  - path: hooks/hooks.json
    description: モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「`project_dir` を使用するツールの PreToolUse で scripts/pre-tool-use.js、`Write|Edit` の PreToolUse・UserPromptSubmit・PreCompact で scripts/guide-notice.js を実行する」を受け持つ。プラグインの配布物の作り方を変えるときに参照する。
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild]
    related:
      - to: docs/module/MOD-472-14.ts
        type: implements
  - path: settings.sample.yaml
    description: モジュール構成『ClaudeCodeプラグイン / セットアップ / 書き込み』のうち「端末の設定の雛形」を受け持つ。端末の設定のキーを変えるときに参照する。
    tags: [topic:プラグイン, topic:設定, tool:claude-code]
    related:
      - to: docs/module/MOD-472-10.ts
        type: implements
  - path: skills/global-setup/SKILL.md
    description: '`/mdmark:global-setup` のスキルの本文。端末の設定と常駐サーバーを用意する手順を変えるときに参照する。'
    tags: [topic:プラグイン, topic:スキル, tool:claude-code]
    related:
      - to: docs/module/MOD-472-9
        type: implements
  - path: skills/setup/SKILL.md
    description: '`/mdmark:setup` のスキルの本文。文書のフォルダの設定を作る手順を変えるときに参照する。'
    tags: [topic:プラグイン, topic:スキル, tool:claude-code]
    related:
