    description: 'モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「type: http で http://127.0.0.1:${MDMARK_PORT:-8782}/mcp につなぐ」を受け持つ。プラグインの配布物の作り方を変えるときに読み込む。'
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild, tool:mcp]
    related:
      - to: dev/設計書/モジュール構成/ClaudeCodeプラグイン/プラグインのビルド.ts
        type: implements
  - path: hooks/hooks.json
    description: モジュール構成『ClaudeCodeプラグイン / プラグインのビルド』のうち「`project_dir` を使用するツールの PreToolUse で scripts/pre-tool-use.js を実行する」を受け持つ。プラグインの配布物の作り方を変えるときに読み込む。
    tags: [topic:プラグイン, tool:claude-code, tool:esbuild]
    related:
      - to: dev/設計書/モジュール構成/ClaudeCodeプラグイン/プラグインのビルド.ts
