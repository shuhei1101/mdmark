# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.4.0/schemas/knowledge-files.schema.yaml
files:
  - path: alias-inject/v0.3.0/aliases.schema.json
    description: モジュール構成『ライブラリ本体 / CLI』のうち「取り込んだ alias-inject の行の Schema」を受け持つ。CLI のコマンドの振る舞いを変えるときに参照する。
    tags: [topic:cli, topic:エイリアス, tool:ajv]
    related:
      - to: MOD-472-23
        type: implements
  - path: mdmark.config.schema.json
    description: モジュール構成『ライブラリ本体 / 設定と機能』のうち「設定の JSON Schema」を受け持つ。設定のキーや機能のオン・オフの決め方を変えるときに参照する。
    tags: [topic:設定, topic:機能フラグ]
    related:
      - to: MOD-472-44
        type: implements
  - path: mdmark.settings.schema.json
    description: 設定『ライブラリ本体』のうち「端末の設定の JSON Schema（mdmark.config.yaml のキーと config.cascade・config.applyToExport）」を受け持つ。端末の設定のキーを変えるときに参照する。
    tags: [topic:設定]
    related:
      - to: MOD-472-45
        type: implements
  - path: mdmark.templates.schema.json
    description: ER 図『CSSのテンプレート』の「端末の設定のフォルダの templates/css/templates.yaml の JSON Schema」を受け持つ。テンプレートの索引のキーを変えるときに参照する。
    tags: [topic:テンプレート, topic:スキーマ, tool:jsonschema]
    related:
      - to: ER-472-1
        type: implements
  - path: mdmark.index.schema.json
    description: 利用側が文書のメタデータ・用語を記載する索引の JSON Schema。索引のキーを追加・変更するときに参照する。
    tags: [topic:索引, topic:スキーマ, tool:jsonschema]
    related:
      - to: ER-472-6
        type: implements
  - path: mdmark.steps.schema.json
    description: モジュール構成『ライブラリ本体 / バージョンを上げる』のうち「steps.yaml の JSON Schema」を受け持つ。mdmark upgrade の移行の流れを変えるときに参照する。
    tags: [topic:バージョン, topic:移行, topic:cli, topic:ステップ]
    related:
      - to: MOD-472-30
        type: implements
  - path: er.schema.yaml
    description: ER 図の設計書のスキーマ。データストアの構造（DB・JSON・YAML）を分類ごとに記載する。ER 図の設計書を記載するときや項目を確認するときに参照する。
    tags: [topic:スキーマ, topic:テンプレート, topic:設計書, tool:jsonschema]
  - path: files.schema.yaml
    description: dev-docs の管理用の YAML（files.yaml）の 1 行の項目を定めるスキーマ。AI Monitor の配布物（visibility と分類を足したもの）。files.yaml に記載する項目を確認するときに参照する。
    tags: [topic:スキーマ, topic:テンプレート, topic:メタデータ, tool:dev-docs, tool:jsonschema]
  - path: index.schema.yaml
    description: フォルダの直下の目次（index.yaml）のスキーマ。README はここから作る。目次の行を追加・変更するときに参照する。
    tags: [topic:スキーマ, topic:テンプレート, topic:設計書, tool:jsonschema]
  - path: common.schema.yaml
    description: 種別をまたいで使用する型（本文・参照・共通の項目・状態遷移・フローチャート・ER 図）のスキーマ。複数の種別に有効になる項目を変えるときに参照する。
    tags: [topic:スキーマ, topic:テンプレート, topic:設計書, tool:jsonschema]
  - path: marks/code.schema.json
    description: コードブロックの飾りのマーカーの設定の JSON Schema。描く処理と点検がマーカーの設定を検証するときに読み込む
    tags: [topic:マーカー, topic:スキーマ]
    related:
      - to: ER-477-6
        type: implements
  - path: marks/common.schema.json
    description: マーカーの設定の共通のオブジェクト（折り畳み・行の範囲・列を指す値）の JSON Schema。ER 図『マーカーの設定の共通の決まり』と同じ内容にする
