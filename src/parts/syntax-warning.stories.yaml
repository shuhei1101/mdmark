title: Parts/SyntaxWarning
stories:
  - name: UnknownKind
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- table: unknown +sort -->'
      message: の種類 `unknown` は使えません。使える種類は `data`・`plain` です。既定の種類に `+sort` を当てて描いています。
  - name: Items
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- table: data +unknown size=2 -->'
      message: の読めない指定を当てずに描いています。
      items: '[{"label":"+unknown","message":"使えない機能です。使える機能は `sort`・`pin`・`filter` です"},{"label":"size=","message":"使えないキーです。使えるキーは `filter=` です"}]'
  - name: BrokenReference
    parameters:
      server:
        id: syntax-warning
    args:
      message: 'リンク先の `#fig-missing` の図表がありません。`<!-- fig: missing -->` を図か表の直前に書くか、リンク先を直してください。'
  - name: ExtensionSchema
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- greet: World 2 -->'
      message: の引数が、拡張 `greet` の決まりに合いません。直してから読み込み直してください。
      items: '[{"label":"1 つ目の World","message":"Invalid format: Expected /^[a-z]+$/ but received \"World\""},{"label":"2 つ目の 2","message":"Invalid type: Expected never but received \"2\""}]'
  - name: LongMark
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- table: data filter=とても長い列の名前:range,もう一つの長い列の名前:text,更新日:date -->'
      message: の絞り込みの種類 `range` は使えません。使える種類は `select`・`text`・`date` です。
  - name: GlossaryColumn
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- glossary: term=用語 meaning=説明 -->'
      message: の `meaning=` の列 `説明` が表にありません。表の列は `用語`・`意味` です。列名を直してください。この表からは用語を入れずに描いています。
  - name: GlossaryMissingArg
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- glossary: term=用語 -->'
      message: に `meaning=` がありません。意味の列を `meaning=列名` で指してください。この表からは用語を入れずに描いています。
  - name: ViewGroupColumn
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- view: group=優先度 -->'
      message: の列 `優先度` は表にありません。表の列は `題`・`状態`・`担当` です。ボードにせず、表で描いています。
  - name: ViewNoTable
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- view: group=状態 -->'
      message: の範囲に、項目にする表がありません。範囲の中に Markdown の表を書いてください。範囲の中身はそのまま描いています。
  - name: ViewUnknownIcon
    parameters:
      server:
        id: syntax-warning
    args:
      mark: '<!-- view: group=状態 icons=完了:rocket -->'
      message: のアイコン `rocket` は使えません。使えるアイコンは `circle`・`circle-dashed`・`circle-dot`・`circle-pause`・`circle-check`・`circle-x`・`inbox`・`archive`・`clock`・`flag`・`star`・`bug`・`eye`・`lock`・`zap`・`ban` です。`完了` の列には既定のアイコンを付けています。
