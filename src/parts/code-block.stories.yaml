title: Parts/CodeBlock
stories:
  - name: TitleAndLineNumbers
    parameters:
      server:
        id: code-block
    args:
      language: ts
      title: app.ts
      lineNumbers: 'true'
      lines: '[{"text":"import { mount } from \"mdmark\";"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(document.querySelector(\"#doc\"), await doc.text());"}]'
  - name: LineMarks
    parameters:
      server:
        id: code-block
    args:
      language: ts
      lines: '[{"text":"let count = 0;","kind":"del"},{"text":"let count = 1;","kind":"add"},{"text":"count += 1; // 数える","kind":"highlight"},{"text":"console.log(count);"}]'
  - name: TitleOnly
    parameters:
      server:
        id: code-block
    args:
      language: yaml
      title: mdmark.config.yaml
      lines: '[{"text":"features:"},{"text":"  code: true"},{"text":"  print: true"}]'
  - name: TwoDigits
    parameters:
      server:
        id: code-block
    args:
      language: ts
      lineNumbers: 'true'
      lines: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"const element = document.querySelector(\"#doc\");"},{"text":"const response = await fetch(\"/README.md\");"},{"text":"const markdown = await response.text();"},{"text":""},{"text":"const config = {"},{"text":"  features: {"},{"text":"    code: true,","kind":"highlight"},{"text":"    print: true,","kind":"highlight"},{"text":"  },"},{"text":"};"},{"text":"mount(element, markdown, config);"}]'
  - name: LongLineAndTitle
    parameters:
      server:
        id: code-block
    args:
      language: ts
      title: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      lineNumbers: 'true'
      lines: '[{"text":"const url = \"https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.6.0/dist/index.js\";"},{"text":"export const decorate = (tokens: Token[], options: { title?: string; lines: boolean; highlight: number[] }) => tokens;","kind":"del"},{"text":"export const decorate = (tokens: Token[], options: CodeBlockOptions, warnings: SyntaxWarning[]): Token[] => applyCodeBlockOptions(tokens, options, warnings);","kind":"add"}]'
  - name: SyntaxPlain
    parameters:
      server:
        id: code-block
    args:
      language: ts
      highlight: 'true'
      lines: '[{"text":"import { mount } from \"mdmark\";"},{"text":""},{"text":"// 文書を描く"},{"text":"const element: HTMLElement | null = document.querySelector(\"#doc\");"},{"text":"mount(element, `# 見出し ${300}`, { features: { syntax: true } });"}]'
  - name: SyntaxWithLineMarks
    parameters:
      server:
        id: code-block
    args:
      language: ts
      title: app.ts
      lineNumbers: 'true'
      highlight: 'true'
      lines: '[{"text":"const limit = 100;","kind":"del"},{"text":"const limit = 300;","kind":"add"},{"text":"const doc = await fetch(\"/README.md\");","kind":"highlight"},{"text":"mount(element, await doc.text());"}]'
  - name: SyntaxMultilineToken
    parameters:
      server:
        id: code-block
    args:
      language: ts
      lineNumbers: 'true'
      highlight: 'true'
      lines: '[{"text":"/*"},{"text":" * 文書を描く"},{"text":" */"},{"text":"const markdown = `# 見出し"},{"text":"本文 ${count}"},{"text":"`;","kind":"highlight"}]'
  - name: SyntaxPython
    parameters:
      server:
        id: code-block
    args:
      language: python
      lineNumbers: 'true'
      highlight: 'true'
      lines: '[{"text":"@dataclass"},{"text":"class Doc:"},{"text":"    # 文書の題"},{"text":"    title: str = \"README\""},{"text":"    lines: int = 300"},{"text":""},{"text":"print(len(Doc().title))"}]'
  - name: LanguageLabel
    parameters:
      server:
        id: code-block
    args:
      language: ts
      copyState: idle
      lines: '[{"text":"import { mount } from \"mdmark\";"},{"text":"mount(document.querySelector(\"#doc\"), \"# 見出し\");"}]'
  - name: FileName
    parameters:
      server:
        id: code-block
    args:
      language: python
      fileName: hoge.py
      copyState: idle
      lines: '[{"text":"def hello():"},{"text":"    print(\"hello\")"}]'
  - name: LongFileName
    parameters:
      server:
        id: code-block
    args:
      language: ts
      fileName: src/render/syntax/a-file-name-that-is-much-longer-than-the-box-width-on-phones.ts
      title: 色分けの対象を探す
      copyState: idle
      lines: '[{"text":"export const findTargets = (root: Element) => root.querySelectorAll(\"code[data-mdmark-syntax]\");"}]'
  - name: NoLanguage
    parameters:
      server:
        id: code-block
    args:
      copyState: idle
      lines: '[{"text":"npm install mdmark"}]'
  - name: Copied
    parameters:
      server:
        id: code-block
    args:
      language: ts
      copyState: copied
      lines: '[{"text":"import { mount } from \"mdmark\";"}]'
  - name: CopyFailed
    parameters:
      server:
        id: code-block
    args:
      language: ts
      copyState: failed
      lines: '[{"text":"import { mount } from \"mdmark\";"}]'
