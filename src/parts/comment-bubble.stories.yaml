    parameters:
      server:
        id: comment-bubble
    args:
      quote: テーマの変数
      bodies: '["ここは <b>太字</b> にしたい","角丸は 6px のままでよいと思います。"]'
      canEdit: 'true'
      canRemove: 'true'
