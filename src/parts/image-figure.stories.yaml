      caption: 右に置いた画面
      width: 200px
      align: right
  - name: AlignCenter
    parameters:
      server:
        id: image-figure
    args:
      src: step-3.svg
      alt: 中央に置いた画面
      caption: 中央に置いた画面
      width: 240px
      align: center
