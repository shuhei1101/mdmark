  - name: LongCaption
    parameters:
      server:
        id: image-figure
    args:
      src: step-2.svg
      alt: 手順 2 の画面
      caption: 設定ファイルを読めないときに文書の先頭へ帯を出し、設定ファイルを開くボタンから直せることを示す画面
