# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.4.0/schemas/prompt.schema.yaml
id: mcp/mdmark/tools/export-html
name: ツール export_html の説明
description: MCP のツール export_html（HTML への書き出し）を呼ぶ場面と、引数・戻り値を伝える
kind: tool
lang: ja
parts:
  - id: body
    texts:
      - lang: ja
        text: |
          Markdown の文書を 1 つ、外へ要求しない 1 枚の HTML に書き出す（mdmark export と同じ処理）。引数 file は書き出す文書、out は書き出す HTML のパス（省くと文書と同じフォルダの .html）。書き出した HTML の絶対パス out と警告 warnings を JSON で返却する。
