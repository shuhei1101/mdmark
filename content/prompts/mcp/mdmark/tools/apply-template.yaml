# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.4.0/schemas/prompt.schema.yaml
id: mcp/mdmark/tools/apply-template
name: ツール apply_template の説明
description: MCP のツール apply_template（CSS のテンプレートの配置）を呼ぶ場面と、引数・戻り値を伝える
kind: tool
lang: ja
parts:
  - id: body
    texts:
      - lang: ja
        text: |
          CSS のテンプレートを配置先のフォルダへ {name}.css でコピーし、配置した絶対パス path・設定の theme に記載する値 theme・置き換えたか replaced を JSON で返却する。dir を省くと、作業のフォルダから上へ探して最も近い mdmark.config.yaml のフォルダに配置する。theme は書き換えないので、返った theme の値を設定の theme に記載する。配置先に中身の違う同じ名前のファイルがあるときは overwrite が true のときだけ置き換える。
