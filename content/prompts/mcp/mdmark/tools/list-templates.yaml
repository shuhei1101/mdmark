# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/design-schemas/v8.4.0/schemas/prompt.schema.yaml
id: mcp/mdmark/tools/list-templates
name: ツール list_templates の説明
description: MCP のツール list_templates（CSS のテンプレートの一覧）を呼ぶ場面と、引数・戻り値を伝える
kind: tool
lang: ja
parts:
  - id: body
    texts:
      - lang: ja
        text: |
          端末の設定のフォルダの templates/css/ にある CSS のテンプレートを、名前 name・説明 description・タグ tags・CSS の絶対パス path の一覧 templates で JSON にして返却する。利用側の CSS を探すときに呼ぶ。テンプレートが無ければ空の一覧を返却する。何も書き換えない。
